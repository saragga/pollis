notes = "Raw yellow, green and for-hire-vehicle trip records, published as monthly files. Demand series are built by aggregating pickups by taxi zone (about 260 zones) or grid cell, usually per 30 minutes or hour; aggregation, period and splits differ across papers, so results are rarely comparable. Raw data is very large; aggregated series are small."
verify = ["licence", "start_year", "n_series"]

