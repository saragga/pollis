# Forecasting datasets of PollisCompetitions.jl: its entries of the forecasting catalogue of Pollis, which
# Compose > Prediction Competitions > Manage Competition Datasets lists with those of the installed toolboxes. Each
# [[entry]] has fields of the catalogue's schema, which Pollis keeps with its conventions (forecastingCatalogue.toml
# in Pollis) and checks every entry against. The files of the competitions that the package downloads are in
# data/catalogue.toml, under the id that an implemented entry gives in package_id. Pollis reads this file from the
# package on this computer, else from the copy it ships. Lines must not end in a comment: Pollis' TOML reader keeps a
# trailing comment as part of the value.

[[entry]]
id = "m1"
name = "M1 Competition"
type = "competition"
collections = ["monash"]
domain = "general"
organiser = "Makridakis et al."
start_year = 1982
end_year = 1982
era = "pre-2000"
reference = "Makridakis et al. (1982), Journal of Forecasting 1(2):111-153"
doi = "10.1002/for.3980010202"
papers = ["MACFH...1982a", "GBWHM2021a"]
package = "PollisCompetitions"
package_id = "m1"
delivery = "download_helper"
status = "implemented"
licence = "CC BY 4.0 (via the Monash archive on Zenodo)"
access = "open"
n_series = 1001
frequency = ["yearly", "quarterly", "monthly"]
structure = ["univariate_collection"]
covariate_richness = "none"
forecast_type = ["point"]
