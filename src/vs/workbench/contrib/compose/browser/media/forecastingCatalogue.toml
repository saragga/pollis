# ============================================================================
# The Dataset Catalog of Compose > Prediction Competitions > Manage Competition Datasets (forecastingCataloguePage.ts):
# the fields of a dataset as the page shows them, their labels, groups, types and vocabularies, and the column presets
# of the page. The datasets are not here: they are the [[datasets]] tables of metadata/datasets.toml of
# PollisCompetitions.jl, of the file an installed toolbox names in "forecastingDatasets" of its pollisToolboxes
# contribution, and of the dataset.toml of each dataset added in the Pollis Workspace, which the page reads and checks
# against this schema (forecastingCatalogue.ts) as it opens. Edit this file by hand.
#
# The file has two parts:
#   [[field]]  every field of a dataset, its label on the page, its group, type and vocabulary
#   [[view]]   the column presets of the page (one per field group, plus Curation)
#
# Conventions
#   * A field left out of a dataset is unknown.
#   * A field with `controlled = true` takes only the values of its vocabulary, separated by " | ".
#   * dataset_id and dataset_name are the id and the name of a dataset on the page.
#   * The references of a dataset, its [[datasets.references]], are keys of PollisReferences, which the page shows as
#     Papers; its collections are those of the [[collections]] of the page's TOML that name it.
#   * source = who contributes the dataset, which the page sets: a dataset's file does not give it.
#   * Lines must not end in a comment: Pollis' TOML reader keeps a trailing comment as part of the value.
# ============================================================================

# ---------------------------------------------------------------- schema
[[field]]
name = "dataset_id"
label = "Id"
group = "identity"
type = "string"
description = "The key of the dataset"

[[field]]
name = "dataset_name"
label = "Name"
group = "identity"
type = "string"
description = "The name of the dataset"

[[field]]
name = "competition_name"
label = "Competition"
group = "identity"
type = "string"
vocabulary = "free"
description = "The competition the dataset comes from"

[[field]]
name = "competition_year"
label = "Year"
group = "identity"
type = "integer"
description = "The year of the competition"

[[field]]
name = "topic"
label = "Topic"
group = "identity"
type = "string"
vocabulary = "General | Socioeconomics | Retail | Marketing | Supply Chain | Finance | Macroeconomics | Real Estate | Energy | Environment and Climate | Hydrology | Transport and Mobility | Tourism | Epidemiology | Health | Biology | Chemistry | Engineering | Physics | Web and IT Operations | Anomaly Detection | Geopolitics"
controlled = true
description = "The subject of the dataset"

[[field]]
name = "collections"
label = "Collections"
group = "identity"
type = "string[]"
vocabulary = "ids of curated collections"
description = "The curated collections that hold the dataset"

[[field]]
name = "papers"
label = "Papers"
group = "identity"
type = "string[]"
vocabulary = "PollisReferences keys"
description = "The references of the dataset, keys of PollisReferences"

[[field]]
name = "data_structure"
label = "Data Structure"
group = "data"
type = "string"
vocabulary = "Cross-section | Time-Series | Panel"
controlled = true
description = "Cross-section, time series, or panel (spatial panels and multi-level longitudinal data included)"

[[field]]
name = "geometry"
label = "Geometry"
group = "data"
type = "string"
vocabulary = "None | Spatial Weights Matrix | Coordinates | Polygons"
controlled = true
description = "The spatial information the dataset has, from the poorest to the richest"

[[field]]
name = "response_type"
label = "Response Type"
group = "data"
type = "string"
vocabulary = "Binary | Multiclass | Ordered | Count | Survival | Continuous"
controlled = true
description = "The kind of the response the models predict"

[[field]]
name = "rows"
label = "Rows"
group = "data"
type = "integer"
description = "The rows of the data as stored (for a panel, one for each unit and time)"

[[field]]
name = "features"
label = "Features"
group = "data"
type = "integer"
description = "The columns other than the response and the identifiers"

[[field]]
name = "size_mb"
label = "Size (MB)"
group = "data"
type = "number"
description = "The size of its Parquet files, in MB"

[[field]]
name = "licence"
label = "Licence"
group = "access"
type = "string"
vocabulary = "free"
description = "The licence of the data"

[[field]]
name = "delivery"
label = "Delivery"
group = "access"
type = "string"
vocabulary = "Built-in | Download"
controlled = true
description = "Built-in, shipped with PollisCompetitions.jl, or Download, fetched by the user"

[[field]]
name = "source_url"
label = "Source"
group = "access"
type = "string"
description = "Where the data come from"

[[field]]
name = "source"
label = "Contributor"
group = "access"
type = "string"
vocabulary = "set by the page"
description = "Who contributes the dataset: PollisCompetitions.jl, an installed toolbox, or the Pollis Workspace for a dataset of your own"

# ---------------------------------------------------------------- views
[[view]]
id = "identity"
label = "Identity"
pinned = ["dataset_name", "topic"]
columns = ["competition_name", "competition_year", "collections", "source_url"]

[[view]]
id = "data"
label = "Data"
pinned = ["dataset_name", "topic"]
columns = ["data_structure", "geometry", "response_type", "rows", "features", "size_mb"]

[[view]]
id = "access"
label = "Access and Licence"
pinned = ["dataset_name", "topic"]
columns = ["delivery", "licence", "source_url", "source"]

[[view]]
id = "curation"
label = "Curation"
pinned = ["dataset_name", "topic"]
columns = ["source", "delivery", "licence"]
