name = "PropensityMatching"
title = "Propensity score matching: Dehejia and Wahba, and its replications"
vignette_title = ""
author = "Antonio Saragga Seabra"
description = "Propensity score methods for nonexperimental causal studies, as in Dehejia and Wahba (1999) and its replications by Smith and Todd (2005) and Dehejia (2005): the logit propensity score, common support by the treated range or by Smith and Todd's density trimming, nearest-neighbour matching with replacement (with the range over every way of breaking ties), local linear matching, the effect on the treated and the balance of the covariates."
topic = "K-Nearest Neighbours"
license = "MIT"
version = "0.2.1"
updated = "2026-10-14"
repository = "https://github.com/Trumpingtons/PropensityMatching.jl"

key = "DW1999a"
citation = "Dehejia, R. H. and Wahba, S. (1999). Causal Effects in Nonexperimental Studies: Reevaluating the Evaluation of Training Programs. Journal of the American Statistical Association 94(448), 1053-1062."
doi = "10.1080/01621459.1999.10473858"
article = "https://doi.org/10.1080/01621459.1999.10473858"

packages = ["LinearAlgebra", "Statistics", "Tables"]

usage = """
using PropensityMatching, CSV, Tables
pollis(name) = Tables.columntable(CSV.File(download("https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/$name.csv")))
nsw, psid = PropensityMatching.arm(pollis("lalonde"), 1), pollis("psid1")  # the treated men and the PSID-1 group
d = [nsw.treat; psid.treat]
x(c) = [getproperty(nsw, c); getproperty(psid, c)]
X = hcat(x(:re74) ./ 1000, x(:re75) ./ 1000, x(:married), x(:black), x(:hisp), x(:educ), x(:age),
	x(:married) .* (x(:re75) .== 0), x(:nodegree) .* (x(:re74) .== 0))  # Dehejia's (2005) PSID/DW specification
score = logit(X, d).fitted
treated, matches = nnmatch(score, d)  # single nearest neighbour, with replacement
att(x(:re78), treated, matches)  # 1,869 dollars, against the experiment's 1,794
tierange(x(:re78), score, d)  # what breaking exact ties differently could give
balance(X, d; weights = matchweights(length(d), treated, matches))
"""

[inputs.lalonde]
url = "https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/lalonde.csv"
source = "PollisDatasets: the NSW treated (185) and control (260) men with 1974 earnings, Dehejia and Wahba's sample"

[inputs.nsw]
url = "https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/nsw.csv"
source = "PollisDatasets: LaLonde's NSW treated (297) and control (425) men"

[inputs.psid1]
url = "https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/psid1.csv"
source = "PollisDatasets: the PSID-1 comparison group (2,490)"

[inputs.psid2]
url = "https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/psid2.csv"
source = "PollisDatasets: the PSID-2 comparison group (253)"

[inputs.psid3]
url = "https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/psid3.csv"
source = "PollisDatasets: the PSID-3 comparison group (128)"

[inputs.cps1]
url = "https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/cps1.csv"
source = "PollisDatasets: the CPS-1 comparison group (15,992)"

[inputs.cps2]
url = "https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/cps2.csv"
source = "PollisDatasets: the CPS-2 comparison group (2,369)"

[inputs.cps3]
url = "https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/cps3.csv"
source = "PollisDatasets: the CPS-3 comparison group (429)"

[targets.dw1999table1]
source = "Dehejia and Wahba (1999), Table 1, the means (p. 1055)"
call = "PropensityMatching.dw1999table1(PropensityMatching.arm(nsw, 1), PropensityMatching.arm(nsw, 0), PropensityMatching.arm(lalonde, 1), PropensityMatching.arm(lalonde, 0), psid1, psid2, psid3, cps1, cps2, cps3)"
tolerance = 1

[targets.dw1999table3]
source = "Dehejia and Wahba (1999), Table 3, column (1) (p. 1059)"
call = "PropensityMatching.dw1999table3(PropensityMatching.arm(lalonde, 1), PropensityMatching.arm(lalonde, 0), psid1, psid2, psid3, cps1, cps2, cps3)"
tolerance = 1

[targets.sttable3cps]
source = "Smith and Todd (2005), Table 3, DW sample, CPS (p. 327)"
call = "PropensityMatching.sttable3cps(PropensityMatching.arm(lalonde, 1), PropensityMatching.arm(lalonde, 0), cps1)"
tolerance = 1

[targets.sttable3psid]
source = "Smith and Todd (2005), Table 3, DW sample, PSID (p. 327)"
call = "PropensityMatching.sttable3psid(PropensityMatching.arm(lalonde, 1), PropensityMatching.arm(lalonde, 0), psid1)"
tolerance = 0

[targets.stbias]
source = "Smith and Todd (2005), Table 5, column (1), and Table 7, column (3), DW sample"
call = "PropensityMatching.stbias(PropensityMatching.arm(lalonde, 1), PropensityMatching.arm(lalonde, 0), cps1, psid1)"
tolerance = 1

[targets.stlocallinear]
source = "Smith and Todd (2005), Table 5, columns (6) and (7), DW sample, CPS"
call = "PropensityMatching.stlocallinear(PropensityMatching.arm(lalonde, 1), PropensityMatching.arm(lalonde, 0), cps1)"
tolerance = 1

[targets.dehejia2005]
source = "Dehejia (2005), Tables 3 and 4"
call = "PropensityMatching.dehejia2005table(PropensityMatching.arm(lalonde, 1), PropensityMatching.arm(nsw, 1), cps1, psid1)"
tolerance = 1
