name = "ArcFS"
title = "arc-fs: adaptive resampling with pruned trees"
vignette_title = ""
author = "Antonio Saragga Seabra"
description = "Breiman's arc-fs, the AdaBoost of his random forests paper: adaptive resampling with CART trees pruned by cost complexity on a second draw, voting with weights, tested on his published test errors for 20 data sets."
topic = "Boosting"
license = "MIT"
version = "0.2.0"

citation = "Breiman, L. (1998). Arcing classifiers. The Annals of Statistics 26(3), 801-849."
doi = "10.1214/aos/1024691079"
article = "https://doi.org/10.1214/aos/1024691079"

packages = ["DecisionTree", "StatsBase", "Random", "Statistics", "Tables"]

usage = """
using ArcFS, CSV, Tables, Random
d = Tables.columntable(CSV.File(download("https://raw.githubusercontent.com/Trumpingtons/PollisDatasets.jl/main/data/breastwisconsin.csv")))
X = Float64.(hcat(d.clump_thickness, d.cell_size, d.cell_shape, d.marginal_adhesion, d.epithelial_size, coalesce.(d.bare_nuclei, 1), d.bland_chromatin, d.normal_nucleoli, d.mitoses))
y = ifelse.(d.class .== "M", 2, 1)
trees, weights = arcfs(X[1:600, :], y[1:600], 50, Xoshiro(1))
mean(vote(trees, X[601:end, :], 2; weights) .!= y[601:end])  # the test error
"""

