# Grow a Chocolate Chain: a case of Compose > Collaboration > Simulation Games. Its model is model.jl,
# which game.jl, beside this folder, runs for each round.

title = "Grow a Chocolate Chain"
description = "Rival teams each run a chocolate brand in one country, and make every tablet they sell in their own shops. Each year they set their price, beans, shops, staff and marketing. The highest cumulative profit after five years wins."
rounds = 5
round = "Year"
teams = [2, 6]

[[decisions]]
key = "price"
label = "Price per Tablet"
kind = "number"
unit = "€"
min = 2
max = 9
step = 0.1
default = 4
help = "What a 100 g tablet costs in your shops."

[[decisions]]
key = "beans"
label = "Beans"
kind = "choice"
options = ["bulk", "fine", "origin"]
labels = ["Bulk Forastero", "Fine Trinitario", "Single-Origin Criollo"]
default = "fine"
help = "Finer beans appeal more to buyers, and cost more."

[[decisions]]
key = "shops"
label = "Shops"
kind = "number"
min = 1
max = 20
step = 1
default = 2
help = "The shops you run this year. Opening one costs 80,000 €; closing one costs nothing."

[[decisions]]
key = "staff"
label = "Staff per Shop"
kind = "number"
min = 2
max = 10
step = 1
default = 3
help = "Each member of staff sells up to 20,000 tablets a year, and costs 22,000 €."

[[decisions]]
key = "marketing"
label = "Marketing"
kind = "number"
unit = "thousand €"
min = 0
max = 500
step = 5
default = 50
help = "Marketing builds your brand, which buyers remember from one year to the next."

[[results.public]]
key = "team"
label = "Team"

[[results.public]]
key = "price"
label = "Price"
unit = "€"
digits = 2

[[results.public]]
key = "beans"
label = "Beans"

[[results.public]]
key = "shops"
label = "Shops"

[[results.public]]
key = "share"
label = "Market Share"
unit = "%"
digits = 1

[[results.public]]
key = "sales"
label = "Tablets Sold"

[[results.public]]
key = "profit"
label = "Profit"
unit = "€"

[[results.public]]
key = "cumulative_profit"
label = "Cumulative Profit"
unit = "€"

[[results.private]]
key = "demand"
label = "Demand"
unit = "tablets"

[[results.private]]
key = "capacity"
label = "Capacity"
unit = "tablets"

[[results.private]]
key = "lost_sales"
label = "Lost Sales"
unit = "tablets"

[[results.private]]
key = "revenue"
label = "Revenue"
unit = "€"

[[results.private]]
key = "tablet_costs"
label = "Cost of the Tablets"
unit = "€"

[[results.private]]
key = "rent"
label = "Rent"
unit = "€"

[[results.private]]
key = "wages"
label = "Wages"
unit = "€"

[[results.private]]
key = "opening"
label = "Shops Opened"
unit = "€"

[[results.private]]
key = "marketing"
label = "Marketing"
unit = "€"

[[results.private]]
key = "profit"
label = "Profit"
unit = "€"

[[results.private]]
key = "cash"
label = "Cash"
unit = "€"

# What model.jl reads. The market is the tablets the country's buyers would buy in a year; each brand's
# appeal adds its beans, its price, its brand and its shops, and buyers choose among the brands and buying
# none by a multinomial logit.
[parameters]
market_size = 1500000
market_growth = 0.04
demand_noise = 0.08
no_purchase_appeal = 1.0
price_sensitivity = 1.8
brand_appeal = 0.5
brand_memory = 0.5
shop_appeal = 0.6
tablets_per_staff = 20000
other_unit_cost = 0.4
rent = 40000
wage = 22000
opening_cost = 80000
starting_cash = 1000000

[parameters.quality_appeal]
bulk = 0.0
fine = 0.6
origin = 1.1

[parameters.bean_cost]
bulk = 0.6
fine = 1.0
origin = 1.7
