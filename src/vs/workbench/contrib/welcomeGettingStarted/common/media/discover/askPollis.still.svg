<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" fill="none">
<style>
:root{--bg:#181a1f;--fg:#cccccc;--dim:#9d9d9d;--link:#4daafc;--line:#0078d4}
@media (prefers-color-scheme:light){:root{--bg:#f8f8f8;--fg:#3b3b3b;--dim:#6f6f6f;--link:#005fb8;--line:#005fb8}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Ubuntu,"Noto Sans",sans-serif;fill:var(--fg)}
.dim{fill:var(--dim)}.link{fill:var(--link)}.b{font-weight:600}
</style>
<rect width="480" height="270" fill="var(--bg)"/>
<text class="dim b" x="52" y="24" font-size="11" letter-spacing=".5">ASK POLLIS</text>
<path d="M456 13v12M450 19h12" stroke="var(--dim)" stroke-width="1.2" stroke-linecap="round"/>
<text class="b" x="24" y="52" font-size="15">What is NUTS?</text>
<text x="24" y="72" font-size="13">NUTS stands for the No-U-Turn Sampler [<tspan class="link b">3</tspan>]. It is a Hamiltonian</text>
<text x="24" y="89" font-size="13">Monte Carlo method that tunes its own step size to reach a target</text>
<text x="24" y="106" font-size="13">acceptance rate and its own trajectory length [<tspan class="link b">3</tspan>]. NUTS is the</text>
<text x="24" y="123" font-size="13">default and the best choice for continuous parameters [<tspan class="link b">3</tspan>]. NUTS</text>
<text x="24" y="140" font-size="13">produces nearly independent draws on smooth posteriors with</text>
<text x="24" y="157" font-size="13">hundreds or thousands of parameters, with no hand tuning [<tspan class="link b">1</tspan>].</text>
<text class="dim b" x="24" y="178" font-size="11" letter-spacing=".5">SOURCES</text>
<text class="b" x="24" y="195" font-size="13">[1]</text>
<text class="" x="62" y="195" font-size="13">Markov Chain Monte Carlo</text>
<text class="link" x="456" y="195" font-size="13" text-anchor="end">Open</text>
<text class="dim" x="62" y="209" font-size="11.5">Simulate &#183; Markov Chain Monte Carlo &#8250; NUTS</text>
<text class="b" x="24" y="228" font-size="13">[3]</text>
<text class="" x="62" y="228" font-size="13">Sampling-Based Bayesian Inference</text>
<text class="link" x="456" y="228" font-size="13" text-anchor="end">Open</text>
<text class="dim" x="62" y="242" font-size="11.5">Model &#8250; Bayesian Analysis &#183; Sampling-Based Bayesian</text>
<text class="dim" x="62" y="256" font-size="11.5">Inference &#8250; Overview &#8250; The Samplers</text>
</svg>
