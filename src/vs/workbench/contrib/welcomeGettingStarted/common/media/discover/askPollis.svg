<rect width="480" height="270" fill="var(--bg)"/>
<g class="all">
<text class="dim b" x="52" y="24" font-size="11" letter-spacing=".5">ASK POLLIS</text>
<path d="M456 13v12M450 19h12" stroke="var(--dim)" stroke-width="1.2" stroke-linecap="round"/>
<text class="h a k15 b" x="24" y="54" font-size="15">What is NUTS?</text>
<text class="h a k16 dim" x="24" y="80" font-size="13">Finding the passages...</text>
<g mask="url(#window)"><g class="scroll">
<text class="h a k17" x="24" y="80" font-size="14">NUTS stands for the No-U-Turn Sampler [<tspan class="link b">3</tspan>]. It is a</text>
<text class="h a k18" x="24" y="100" font-size="14">Hamiltonian Monte Carlo method that tunes its own step</text>
<text class="h a k19" x="24" y="120" font-size="14">size to reach a target acceptance rate and its own</text>
<text class="h a k20" x="24" y="140" font-size="14">trajectory length [<tspan class="link b">3</tspan>]. NUTS is the default and the best</text>
<text class="h a k21" x="24" y="160" font-size="14">choice for continuous parameters [<tspan class="link b">3</tspan>]. NUTS produces nearly</text>
<text class="h a k22" x="24" y="180" font-size="14">independent draws on smooth posteriors with hundreds or</text>
<text class="h a k23" x="24" y="200" font-size="14">thousands of parameters, with no hand tuning [<tspan class="link b">1</tspan>].</text>
<text class="dim b h a k24" x="24" y="228" font-size="11" letter-spacing=".5">SOURCES</text>
<text class="b h a k24" x="24" y="247" font-size="14">[1]</text>
<text class="h a k24" x="62" y="247" font-size="14">Markov Chain Monte Carlo</text>
<text class="link h a k24" x="456" y="247" font-size="14" text-anchor="end">Open</text>
<text class="dim h a k24" x="62" y="263" font-size="12">Simulate &#183; Markov Chain Monte Carlo &#8250; NUTS</text>
<text class="b h a k24" x="24" y="285" font-size="14">[3]</text>
<text class="h a k24" x="62" y="285" font-size="14">Sampling-Based Bayesian Inference</text>
<text class="link h a k24" x="456" y="285" font-size="14" text-anchor="end">Open</text>
<text class="dim h a k24" x="62" y="301" font-size="12">Model &#8250; Bayesian Analysis &#183; Sampling-Based Bayesian</text>
<text class="dim h a k24" x="62" y="317" font-size="12">Inference &#8250; Overview &#8250; The Samplers</text>
<text class="dim h a k24" x="24" y="336" font-size="12">Searched: Pollis, Julia Manual.</text>
</g></g>
<rect x="18" y="210" width="444" height="54" rx="14" stroke="var(--line)" stroke-width="1.4"/>
<text class="dim a k0" x="34" y="228" font-size="14">Ask Pollis</text>
