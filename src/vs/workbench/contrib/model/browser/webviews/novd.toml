[[codeBranches]]
model = "ocsvm"
code = '''
using LIBSVM, Statistics

mu, sd = mean({{train}}, dims=1), std({{train}}, dims=1)
Ztrain = permutedims(({{train}} .- mu) ./ sd)  # standardise; LIBSVM expects observations in columns
Ztest  = permutedims(({{test}} .- mu) ./ sd)  # same scaling as the training data

model = svmtrain(Ztrain; svmtype=OneClassSVM, nu={{nu}})  # RBF boundary around the normal data
inside, dec = svmpredict(model, Ztest)  # true = inside the boundary
scores   = -dec[1, :]  # higher = further outside
is_novel = .!inside
println("Novel points: ", sum(is_novel), " of ", length(is_novel))
'''

[[codeBranches]]
model = "gauss"
code = '''
using Statistics, LinearAlgebra, Distributions

mu     = vec(mean({{train}}, dims=1))  # training mean vector
SigInv = inv(cov({{train}}))  # inverse training covariance
scores = [dot(x .- mu, SigInv * (x .- mu)) for x in eachrow({{test}})]  # squared Mahalanobis distance

threshold = quantile(Chisq(size({{train}}, 2)), 1 - {{alpha}})  # chi-square with p degrees of freedom (exact only for the true mean and covariance; plug-in estimates make it approximate for small training sets)
is_novel  = scores .> threshold
println("Novel points: ", sum(is_novel), " of ", length(is_novel))
'''

[[codeBranches]]
model = "cusum"
code = '''
using Statistics

mu0, sigma0 = mean({{baseline}}), std({{baseline}})  # in-control mean and standard deviation
z = ({{series}} .- mu0) ./ sigma0  # standardised series
k, h = {{k}}, {{h}}

S_up, S_down = zeros(length(z)), zeros(length(z))  # upper and lower CUSUM statistics
for t in eachindex(z)
	S_up[t]   = max(0.0, (t == 1 ? 0.0 : S_up[t-1]) + z[t] - k)  # accumulates upward shifts
	S_down[t] = max(0.0, (t == 1 ? 0.0 : S_down[t-1]) - z[t] - k)  # accumulates downward shifts
end

alarms = findall((S_up .> h) .| (S_down .> h))  # time steps above the threshold
println("First alarm at: ", isempty(alarms) ? "none" : alarms[1])
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "novelty-plot"
label = "Novelty Plot"
desc = "Test points coloured by novelty, or the monitoring statistic over time"
code = '''
using Plots

{{?model=ocsvm|gauss}}scatter({{train}}[:, 1], {{train}}[:, 2], color=:lightgray, markerstrokewidth=0, label="Training", xlabel="Feature 1", ylabel="Feature 2")
{{?model=ocsvm|gauss}}scatter!({{test}}[.!is_novel, 1], {{test}}[.!is_novel, 2], color=:blue, markerstrokewidth=0, label="Normal")
{{?model=ocsvm|gauss}}scatter!({{test}}[is_novel, 1], {{test}}[is_novel, 2], color=:red, marker=:star5, label="Novel")
{{?model=cusum}}plot([S_up S_down], label=["Upper CUSUM" "Lower CUSUM"], xlabel="Time", ylabel="S(t)")
{{?model=cusum}}hline!([h], color=:red, linestyle=:dash, label="Threshold h")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "false-alarms"
label = "False Alarm Check"
desc = "How often the detector fires on data known to be normal"
code = '''
using Statistics

{{?model=ocsvm}}inside_train, _ = svmpredict(model, Ztrain)
{{?model=ocsvm}}println("Training points outside the boundary: ", round(100 * mean(.!inside_train), digits=1), "% (nu = {{nu}})")
{{?model=gauss}}train_scores = [dot(x .- mu, SigInv * (x .- mu)) for x in eachrow({{train}})]
{{?model=gauss}}println("Training points above the threshold: ", round(100 * mean(train_scores .> threshold), digits=1), "% (alpha = {{alpha}})")
{{?model=cusum}}run_lengths = map(1:2000) do _  # simulated in-control run lengths
{{?model=cusum}}	s_up, s_down, t = 0.0, 0.0, 0
{{?model=cusum}}	while max(s_up, s_down) <= h && t < 10_000
{{?model=cusum}}		zt = randn(); t += 1
{{?model=cusum}}		s_up, s_down = max(0.0, s_up + zt - k), max(0.0, s_down - zt - k)
{{?model=cusum}}	end
{{?model=cusum}}	t
{{?model=cusum}}end
{{?model=cusum}}println("In-control average run length (ARL0): ", round(mean(run_lengths)), " steps between false alarms")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "online-monitor"
label = "Online Monitor"
desc = "Score a stream one observation at a time"
code = '''
using OnlineStats, Statistics

{{?model=ocsvm|gauss}}stream = eachrow({{test}})  # replace with your incoming observations
{{?model=ocsvm|gauss}}rate = OnlineStats.fit!(Mean(), Float64[])  # running fraction of novel points
{{?model=ocsvm|gauss}}for x in stream
{{?model=ocsvm}}	novel = !svmpredict(model, reshape((collect(x) .- vec(mu)) ./ vec(sd), :, 1))[1][1]
{{?model=gauss}}	novel = dot(x .- mu, SigInv * (x .- mu)) > threshold
{{?model=ocsvm|gauss}}	OnlineStats.fit!(rate, novel)
{{?model=ocsvm|gauss}}end
{{?model=ocsvm|gauss}}println("Novel fraction so far: ", round(OnlineStats.value(rate), digits=3), " over ", OnlineStats.nobs(rate), " points")
{{?model=cusum}}stats = OnlineStats.fit!(Series(Mean(), Variance()), {{baseline}})  # single pass over the baseline
{{?model=cusum}}m0, s0 = OnlineStats.value(stats.stats[1]), sqrt(OnlineStats.value(stats.stats[2]))  # in-control mean and standard deviation
{{?model=cusum}}let s_up = 0.0, s_down = 0.0
{{?model=cusum}}	for (t, x) in enumerate({{series}})  # replace with your incoming observations
{{?model=cusum}}		s_up, s_down = max(0.0, s_up + (x - m0) / s0 - {{k}}), max(0.0, s_down - (x - m0) / s0 - {{k}})
{{?model=cusum}}		if max(s_up, s_down) > {{h}}
{{?model=cusum}}			println("Alarm at step ", t); break
{{?model=cusum}}		end
{{?model=cusum}}	end
{{?model=cusum}}end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-methods"
label = "Compare Methods"
desc = "OC-SVM against the Gaussian detector, or CUSUM tuned for small against large shifts"
code = '''
using LIBSVM, Statistics, LinearAlgebra, Distributions

{{?model=ocsvm|gauss}}mu_g, SigInv_g = vec(mean({{train}}, dims=1)), inv(cov({{train}}))
{{?model=ocsvm|gauss}}gauss_novel = [dot(x .- mu_g, SigInv_g * (x .- mu_g)) for x in eachrow({{test}})] .> quantile(Chisq(size({{train}}, 2)), 0.99)
{{?model=ocsvm|gauss}}mu_s, sd_s = mean({{train}}, dims=1), std({{train}}, dims=1)
{{?model=ocsvm|gauss}}svm = svmtrain(permutedims(({{train}} .- mu_s) ./ sd_s); svmtype=OneClassSVM, nu=0.05)
{{?model=ocsvm|gauss}}svm_novel = .!svmpredict(svm, permutedims(({{test}} .- mu_s) ./ sd_s))[1]
{{?model=ocsvm|gauss}}println("Agreement: ", round(100 * mean(svm_novel .== gauss_novel), digits=1), "%")
{{?model=ocsvm|gauss}}println("Novel by OC-SVM only: ", findall(svm_novel .& .!gauss_novel), ", by Gaussian only: ", findall(gauss_novel .& .!svm_novel))
{{?model=cusum}}for (kk, hh) in ((0.25, 8.0), ({{k}}, {{h}}), (1.0, 2.5))  # small k: sensitive to small shifts; large k: fewer false alarms
{{?model=cusum}}	s_up, s_down, t_alarm = 0.0, 0.0, 0
{{?model=cusum}}	for (t, zt) in enumerate(z)
{{?model=cusum}}		s_up, s_down = max(0.0, s_up + zt - kk), max(0.0, s_down - zt - kk)
{{?model=cusum}}		if max(s_up, s_down) > hh
{{?model=cusum}}			t_alarm = t; break
{{?model=cusum}}		end
{{?model=cusum}}	end
{{?model=cusum}}	println("k = ", kk, ", h = ", hh, ": first alarm at ", t_alarm == 0 ? "none" : t_alarm)
{{?model=cusum}}end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "explain-novelty"
label = "Explain Novelty"
desc = "Which features make a test point novel, or how large the detected shift is (CUSUM: measured from the estimated change point, the last time the alarming statistic was zero)"
code = '''
using Statistics

{{?model=ocsvm|gauss}}top = argmax(scores)  # the most novel test point
{{?model=ocsvm|gauss}}z = ({{test}}[top, :] .- vec(mean({{train}}, dims=1))) ./ vec(std({{train}}, dims=1))  # per-feature z-scores
{{?model=ocsvm|gauss}}println("Most novel test point: row ", top)
{{?model=ocsvm|gauss}}for j in sortperm(abs.(z), rev=true)
{{?model=ocsvm|gauss}}	println("feature ", j, "  z = ", round(z[j], digits=2))
{{?model=ocsvm|gauss}}end
{{?model=cusum}}S = isempty(alarms) || S_up[alarms[1]] > h ? S_up : S_down  # the side that raised the alarm
{{?model=cusum}}t0 = isempty(alarms) ? length({{series}}) + 1 : something(findlast(==(0.0), S[1:alarms[1]]), 0) + 1  # change-point estimate: just after the last zero of that CUSUM
{{?model=cusum}}isempty(alarms) || println("Estimated change point: ", t0, " (alarm at ", alarms[1], ")")
{{?model=cusum}}before, after = {{baseline}}, {{series}}[t0:end]
{{?model=cusum}}if !isempty(after)
{{?model=cusum}}	println("Mean: ", round(mean(before), digits=3), " -> ", round(mean(after), digits=3))
{{?model=cusum}}	println("Std:  ", round(std(before), digits=3), " -> ", round(std(after), digits=3))
{{?model=cusum}}end
'''
