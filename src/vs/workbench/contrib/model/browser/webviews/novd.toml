label = "OC-SVM"

[[models]]
id = "gauss"
label = "Gaussian"

[[models]]
id = "cusum"
label = "CUSUM"

[[bullets]]
text = "One-Class Support Vector Machine (OC-SVM)"
detail = "fits a boundary around the normal training data in kernel space; test points outside the boundary are novel"

[[bullets]]
text = "Gaussian Novelty"
detail = "fits a multivariate Gaussian to normal data; a test point is novel when its Mahalanobis distance exceeds a chi-square quantile"

[[bullets]]
text = "Cumulative Sum (CUSUM)"
detail = "monitors a series for sustained deviations from a baseline mean; small deviations accumulate until they cross an alarm threshold"

[[decisionRows]]
task = "OC-SVM"
context = "Clean training data, curved or multimodal normal region"
purpose = "Flexible boundary with no distributional assumption"

[[decisionRows]]
task = "Gaussian"
context = "Clean training data, roughly elliptical normal region"
purpose = "Fast, interpretable score with a principled threshold"

[[decisionRows]]
task = "CUSUM"
context = "A series with a known in-control baseline"
purpose = "Detect small, sustained shifts in the mean as they happen"

[[inputs]]
id = "train"
label = "Training Data"
tooltip = "Clean training data containing only normal observations, as an n x p matrix, e.g. X_train"
default = "X_train"
models = ["ocsvm", "gauss"]

[[inputs]]
id = "test"
label = "Test Data"
tooltip = "New observations to check for novelty, with the same columns as the training data, e.g. X_test"
default = "X_test"
models = ["ocsvm", "gauss"]

[[inputs]]
id = "nu"
label = "Nu"
tooltip = "Upper bound on the fraction of training points left outside the boundary, between 0 and 1, e.g. 0.05. Smaller values give a looser boundary."
default = "0.05"
models = ["ocsvm"]

[[inputs]]
id = "alpha"
label = "False Alarm Rate"
tooltip = "Probability that a normal point is flagged, e.g. 0.01. The threshold is the 1 - alpha quantile of the chi-square distribution."
default = "0.01"
models = ["gauss"]

[[inputs]]
id = "baseline"
label = "Baseline"
tooltip = "Clean in-control series used to estimate the normal mean and standard deviation, e.g. x_baseline"
default = "x_baseline"
models = ["cusum"]

[[inputs]]
id = "series"
label = "Series"
tooltip = "The series to monitor, e.g. x_new"
default = "x_new"
models = ["cusum"]

[[inputs]]
id = "k"
label = "Allowance (k)"
tooltip = "Half the shift to detect, in standard deviations, e.g. 0.5 to detect a shift of one standard deviation"
default = "0.5"
models = ["cusum"]

[[inputs]]
id = "h"
label = "Threshold (h)"
tooltip = "Alarm threshold in standard deviations; typical values are 4 to 5. Higher values give fewer false alarms and slower detection."
default = "5"
models = ["cusum"]

