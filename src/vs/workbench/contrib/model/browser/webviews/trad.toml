[[codeBranches]]
model = "agents"
code = '''
using LimitOrderBook, Random, Statistics, StatsBase

N, T, F = {{N}}, {{T}}, {{fv}}  # agents, periods, fundamental value
tick = 0.01  # the book stores prices as whole ticks
L, tau, kmax, se = 20, 20, 0.01, 0.005  # chartist window, forecast horizon and order life, max mark-up, noise sd (illustrative values)

# Market order for one share; drops the filled resting orders from `live` so they are never cancelled
function hit!(ob, live, side, tp, sgn)
    fills, _ = submit_market_order!(ob, side, 1)
    foreach(o -> delete!(live, o.orderid), fills)
    isempty(fills) && return
    push!(tp, fills[1].price * tick)
    push!(sgn, side == BUY_ORDER ? 1 : -1)
end

# Chiarella-Iori (2002): each period one random agent forecasts the price tau periods ahead and trades one share
function simulate(; s1 = 1.0, s2 = 1.0, sn = 1.0, seed = 1)
    rng = Xoshiro(seed)
    g1, g2, gn = s1 .* abs.(randn(rng, N)), s2 .* abs.(randn(rng, N)), sn .* abs.(randn(rng, N))  # fundamentalist, chartist and noise weights
    ob = OrderBook{Int,Int,Int,Int}()  # size, price (ticks), order id, account id
    live = Dict{Int,Tuple{Int,OrderSide,Int}}()  # order id => (expiry, side, price)
    p, spread = fill(F, T), fill(NaN, T)  # last trade price and spread at the end of each period
    tp, sgn = Float64[], Int[]  # trade prices and trade signs (+1 buyer-initiated)
    for t in 1:T
        for (id, (expiry, side, px)) in collect(live)  # unfilled orders expire after tau periods
            if expiry <= t
                cancel_order!(ob, id, side, px)
                delete!(live, id)
            end
        end
        last = isempty(tp) ? F : tp[end]
        i = rand(rng, 1:N)
        rbar = length(tp) > L ? mean(diff(log.(tp[end-L:end]))) : 0.0  # chartist signal: mean of the last L trade-to-trade returns
        rhat = (g1[i] * log(F / last) / tau + g2[i] * rbar + gn[i] * se * randn(rng)) / (g1[i] + g2[i] + gn[i])  # expected return per period
        phat = last * exp(rhat * tau)  # expected price tau periods ahead
        k = kmax * rand(rng)  # mark-up away from the forecast
        bid, ask = best_bid_ask(ob)
        if phat > last  # buyer: bid below the forecast
            px = max(1, round(Int, phat * (1 - k) / tick))
            if !isnothing(ask) && px >= ask
                hit!(ob, live, BUY_ORDER, tp, sgn)  # marketable: take the best ask
            else
                submit_limit_order!(ob, t, BUY_ORDER, px, 1)
                live[t] = (t + tau, BUY_ORDER, px)
            end
        elseif phat < last  # seller: ask above the forecast
            px = max(1, round(Int, phat * (1 + k) / tick))
            if !isnothing(bid) && px <= bid
                hit!(ob, live, SELL_ORDER, tp, sgn)  # marketable: hit the best bid (a market order, see the report on submit_limit_order!)
            else
                submit_limit_order!(ob, t, SELL_ORDER, px, 1)
                live[t] = (t + tau, SELL_ORDER, px)
            end
        end
        p[t] = isempty(tp) ? F : tp[end]
        bid, ask = best_bid_ask(ob)
        isnothing(bid) || isnothing(ask) || (spread[t] = (ask - bid) * tick)
    end
    return (; p, tp, sgn, spread, ob)
end

sem(v) = std(v) / sqrt(length(v))
metrics(s) = (vol = std(diff(log.(s.tp))), kurt = kurtosis(diff(log.(s.tp))), spread = mean(filter(!isnan, s.spread)), gap = mean(abs.(s.p .- F)) / F)

# Mean +- standard error over seeds, and the paired difference (same seeds, so the same agents)
function compare(a, b, la, lb)
    for k in keys(first(a))
        va, vb = getindex.(a, k), getindex.(b, k)
        println(rpad(string(k), 8), la, " ", round(mean(va); sigdigits = 3), " +- ", round(sem(va); sigdigits = 2), "   ", lb, " ", round(mean(vb); sigdigits = 3), " +- ", round(sem(vb); sigdigits = 2), "   difference ", round(mean(vb .- va); sigdigits = 3), " +- ", round(sem(vb .- va); sigdigits = 2))
    end
end

sim = simulate()
p, tp, sgn, spread, ob = sim.p, sim.tp, sim.sgn, sim.spread, sim.ob
r = diff(log.(tp))  # trade-to-trade log returns
x, xlab = 1:T, "Period"
d = book_depth_info(ob, 10)
bid_px, bid_vol = d[:BID][:price] .* tick, d[:BID][:volume]
ask_px, ask_vol = d[:ASK][:price] .* tick, d[:ASK][:volume]

println("True values: F = ", F, ", weight scales s1 = s2 = sn = 1, L = ", L, ", tau = ", tau)
println("Trades:              ", length(tp), " in ", T, " periods")
println("Final price:         ", round(p[end]; digits = 2))
println("Mean |p - F| / F:    ", round(100 * metrics(sim).gap; digits = 2), "%")
println("Mean spread:         ", round(metrics(sim).spread; digits = 3))
println("Return sd per trade: ", round(1e4 * std(r); digits = 1), " bp")
'''

[[codeBranches]]
model = "lob"
code = '''
using LimitOrderBook, Random, Statistics, StatsBase

N, T, F = {{N}}, {{T}}, {{fv}}  # initial orders, events, opening mid price
tick, K = 0.01, 20  # tick size; limit orders land uniformly within K ticks of the opposite quote

# Market order for one share; drops the filled resting orders from `live` so they are never cancelled
function hit!(ob, live, side, tp, sgn)
    fills, _ = submit_market_order!(ob, side, 1)
    foreach(o -> delete!(live, o.orderid), fills)
    isempty(fills) && return
    push!(tp, fills[1].price * tick)
    push!(sgn, side == BUY_ORDER ? 1 : -1)
end

# Zero-intelligence order flow (Smith, Farmer, Gillemot and Krishnamurthy 2003): each event is a limit order,
# a market order or a cancellation, drawn in proportion to its Poisson rate
function simulate(; alpha = 0.5, mu = 2.0, delta = 0.02, seed = 1)  # limit rate per price level, market-order rate, cancel rate per order
    rng = Xoshiro(seed)
    ob = OrderBook{Int,Int,Int,Int}()  # size, price (ticks), order id, account id
    live = Dict{Int,Tuple{OrderSide,Int}}()  # order id => (side, price)
    m0 = round(Int, F / tick)
    for id in 1:N  # seed the book with N one-share orders within K ticks of F
        side = isodd(id) ? BUY_ORDER : SELL_ORDER
        px = side == BUY_ORDER ? m0 - rand(rng, 1:K) : m0 + rand(rng, 1:K)
        submit_limit_order!(ob, id, side, px, 1)
        live[id] = (side, px)
    end
    p, spread = fill(F, T), fill(NaN, T)  # last trade price and spread after each event
    tp, sgn = Float64[], Int[]  # trade prices and trade signs (+1 buyer-initiated)
    id = N
    for t in 1:T
        bid, ask = best_bid_ask(ob)
        ref_bid = something(bid, something(ask, m0 + 1) - 1)
        ref_ask = something(ask, ref_bid + 1)
        rates = cumsum([alpha * K, alpha * K, mu / 2, mu / 2, delta * length(live)])  # limit buy, limit sell, market buy, market sell, cancel
        e = findfirst(>=(rand(rng) * rates[end]), rates)
        if e <= 2  # limit orders never cross: buys rest below the ask, sells above the bid
            id += 1
            side = e == 1 ? BUY_ORDER : SELL_ORDER
            px = e == 1 ? max(1, ref_ask - rand(rng, 1:K)) : ref_bid + rand(rng, 1:K)
            submit_limit_order!(ob, id, side, px, 1)
            live[id] = (side, px)
        elseif e <= 4
            hit!(ob, live, e == 3 ? BUY_ORDER : SELL_ORDER, tp, sgn)
        else  # cancel a random resting order
            cid = rand(rng, collect(keys(live)))
            cancel_order!(ob, cid, live[cid]...)
            delete!(live, cid)
        end
        p[t] = isempty(tp) ? F : tp[end]
        bid, ask = best_bid_ask(ob)
        isnothing(bid) || isnothing(ask) || (spread[t] = (ask - bid) * tick)
    end
    return (; p, tp, sgn, spread, ob)
end

sem(v) = std(v) / sqrt(length(v))
metrics(s) = (vol = std(diff(log.(s.tp))), kurt = kurtosis(diff(log.(s.tp))), spread = mean(filter(!isnan, s.spread)), depth = mean(n_orders_bid_ask(s.ob)))

# Mean +- standard error over seeds, and the paired difference (same seeds)
function compare(a, b, la, lb)
    for k in keys(first(a))
        va, vb = getindex.(a, k), getindex.(b, k)
        println(rpad(string(k), 8), la, " ", round(mean(va); sigdigits = 3), " +- ", round(sem(va); sigdigits = 2), "   ", lb, " ", round(mean(vb); sigdigits = 3), " +- ", round(sem(vb); sigdigits = 2), "   difference ", round(mean(vb .- va); sigdigits = 3), " +- ", round(sem(vb .- va); sigdigits = 2))
    end
end

sim = simulate()
p, tp, sgn, spread, ob = sim.p, sim.tp, sim.sgn, sim.spread, sim.ob
r = diff(log.(tp))  # trade-to-trade log returns
x, xlab = 1:T, "Event"
d = book_depth_info(ob, 10)
bid_px, bid_vol = d[:BID][:price] .* tick, d[:BID][:volume]
ask_px, ask_vol = d[:ASK][:price] .* tick, d[:ASK][:volume]

println("True rates: alpha = 0.5 per level, mu = 2.0, delta = 0.02 per order, K = ", K, " ticks")
println("Trades:              ", length(tp), " in ", T, " events")
println("Mean spread:         ", round(metrics(sim).spread; digits = 3), " (", round(Int, metrics(sim).spread / tick), " ticks)")
println("Resting orders:      ", n_orders_bid_ask(ob), " (bid, ask)")
println("Return sd per trade: ", round(1e4 * std(r); digits = 1), " bp")
'''

[[codeBranches]]
model = "market"
code = '''
using Brokerage, TradingAgents, Dates, Statistics

N, F, minutes = {{N}}, {{fv}}, {{minutes}}  # traders, opening mid price, session length
NF = div(N, 2)  # fundamental traders; the other N - NF are zero-intelligence liquidity takers

# Exchange server, in this Julia session, on 0.0.0.0:8080
DBFILE = joinpath(mktempdir(), "portfolios.sqlite")  # fresh account database: the package folder is read-only
AUTHFILE = "file://" * joinpath(dirname(pathof(Brokerage)), "../resources/authkeys.json")
Mapper.MM_COUNTER[] = 30  # account ids 1-30 are reserved for market makers
OMS.NUM_ASSETS[] = 1
OMS.PRICE_BUFFER_CAPACITY[] = 100  # recent prices the fundamental traders use for volatility
OMS.MARKET_OPEN_T[] = now() + Second(30)  # time to create the accounts
OMS.MARKET_CLOSE_T[] = OMS.MARKET_OPEN_T[] + Minute(minutes)
OMS.init_LOB!(OMS.ob, [F], OMS.LP_order_vol, OMS.LP_cancel_vol, OMS.trade_volume_t, OMS.price_buffer)  # seeds the book around F
server = @async Brokerage.run(DBFILE, AUTHFILE)
sleep(5)

# Agents from TradingAgents.jl; each run blocks until the close, so they run as tasks
ft = @async FT_run(NF, 1, (init_cash_range = 5000.0:0.01:15000.0, init_shares_range = 50:1:150, prob_wait = 0.5, trade_freq = 1, num_ids = 30),
    (host_ip_address = "0.0.0.0", port = "8080", username = "Fundamental Trader", password = "value123"))
while Mapper.PORTFOLIO_COUNTER[] < 30 + NF  # account ids are positional: start the takers after the fundamental traders' accounts exist
    sleep(0.5)
end
zt = @async ZT_run(N - NF, 1, (username = "Zero Trader", password = "zero123", init_cash_range = 5000.0:0.01:15000.0, init_shares_range = 50:1:150, prob_wait = 0.5, trade_freq = 1, num_MM = 30 + NF),
    (host_ip_address = "0.0.0.0", port = "8080"))
mm = @async RandomMM_run(1, (id = 1, eps_min = -0.5, eps_max = 0.5, inventory_limit = 3000, unit_trade_size = 15, trade_freq = 2), (cash = 0, z = 0),
    (host_ip_address = "0.0.0.0", port = "8080", username = "Market Maker", password = "liquidity000"))
foreach(wait, (ft, zt, mm))

# Trade tape kept by the exchange. It records market orders only: Brokerage logs no trade when a limit order crosses
tp = copy(OMS.tick_last_prices)
sgn = Int.(sign.(OMS.tick_trading_volume))  # +1 buy, -1 sell
q = abs.(OMS.tick_trading_volume)  # shares per market order
spread = OMS.tick_ask_prices .- OMS.tick_bid_prices
p = tp
r = diff(log.(tp))  # trade-to-trade log returns
x, xlab = Dates.value.(OMS.tick_time .- OMS.MARKET_OPEN_T[]) ./ 1000, "Seconds Since Open"
d = Client.getBookDepth(1)
bid_px, bid_vol = Float64.(d[:BID][:price]), Float64.(d[:BID][:volume])
ask_px, ask_vol = Float64.(d[:ASK][:price]), Float64.(d[:ASK][:volume])

println("Recorded trades:  ", length(tp), " in ", minutes, " minutes (", NF, " fundamental traders, ", N - NF, " liquidity takers, 1 market maker)")
println("Price range:      ", round.(extrema(tp); digits = 2))
println("Shares traded:    ", sum(q))
println("Mean spread:      ", round(mean(spread); digits = 3))
println("Net order flow:   ", Client.getTradeVolume(1), " shares (buys minus sells)")
'''

