ls = 1:min(20, length(tp) - 1)
R = [mean(sgn[1:end-l] .* (lp[1+l:end] .- lp[1:end-l])) for l in ls]  # average signed price move l trades after a trade
println("R(1) = ", round(1e4 * R[1]; digits = 2), " bp, R(", last(ls), ") = ", round(1e4 * R[end]; digits = 2), " bp")
println("Positive R: buyer-initiated trades push the price up; a decaying R means part of the impact is temporary")
plot(ls, 1e4 .* R; xlabel = "Lag (Trades)", ylabel = "Response (bp)", label = "R(l)", marker = :circle)
'''

