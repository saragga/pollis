bar(bid_px, cumsum(bid_vol); label = "Bids", xlabel = "Price", ylabel = "Cumulative Shares", alpha = 0.6)
bar!(ask_px, cumsum(ask_vol); label = "Asks", alpha = 0.6)
isempty(bid_px) || isempty(ask_px) || println("Best bid ", first(bid_px), ", best ask ", first(ask_px), ", spread ", round(first(ask_px) - first(bid_px); digits = 2))
'''

