[[actionGroups.actions]]
id = "lob-vs-walrasian"
label = "LOB vs Walrasian"
desc = "Same agents trading through the book or at the price that clears all their demands, averaged over 20 seeds"
code = '''
using Random, Statistics, StatsBase

{{?model=agents}}# Walrasian benchmark: every period all N agents forecast, and the price clears the linear demands d_i = phat_i - p, so p = mean(phat)
{{?model=agents}}function walrasian(; s1 = 1.0, s2 = 1.0, sn = 1.0, seed = 1)
{{?model=agents}}    rng = Xoshiro(seed)
{{?model=agents}}    g1, g2, gn = s1 .* abs.(randn(rng, N)), s2 .* abs.(randn(rng, N)), sn .* abs.(randn(rng, N))  # the same agents as simulate(seed = seed)
{{?model=agents}}    p = fill(F, T)
{{?model=agents}}    for t in 2:T
{{?model=agents}}        rbar = t > L + 1 ? mean(diff(log.(p[t-L-1:t-1]))) : 0.0
{{?model=agents}}        p[t] = mean(p[t-1] * exp(tau * (g1[i] * log(F / p[t-1]) / tau + g2[i] * rbar + gn[i] * se * randn(rng)) / (g1[i] + g2[i] + gn[i])) for i in 1:N)
{{?model=agents}}    end
{{?model=agents}}    return (; p, tp = p, spread = zeros(T))  # no book, so no spread
{{?model=agents}}end
{{?model=agents}}seeds = 1:20
{{?model=agents}}compare([metrics(simulate(seed = s)) for s in seeds], [metrics(walrasian(seed = s)) for s in seeds], "order book", "Walrasian")
{{?model=lob}}println("Zero-intelligence orders carry no valuations, so there is no Walrasian price to compare with: use the Trading Agents model")
{{?model=market}}println("No Walrasian counterpart for the Brokerage session: use the Trading Agents model")
'''

