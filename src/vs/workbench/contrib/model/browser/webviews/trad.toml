desc = "Fat tails, no return autocorrelation, but persistent volatility (Cont 2001)"
code = '''
using StatsBase, Plots

lags = 1:min(20, length(r) - 1)
println("Trade-to-trade returns: ", length(r))
println("Excess kurtosis:        ", round(kurtosis(r); digits = 2), " (0 for a normal distribution; fat tails make it positive)")
println("Lag-1 autocorrelation:  ", round(autocor(r, [1])[1]; digits = 3), " (bid-ask bounce makes it negative)")
plot(lags, autocor(r, lags); label = "Returns", xlabel = "Lag (Trades)", ylabel = "Autocorrelation", marker = :circle)
plot!(lags, autocor(abs.(r), lags); label = "Absolute Returns", marker = :circle)
hline!([0]; label = "", color = :gray)
'''

