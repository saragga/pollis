# Parquet Files Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/parquet.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Parquet Files"
viewType = "pollis.parquet"
defaultModel = "query"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "Parquet2.jl"
github = "https://gitlab.com/ExpandingMan/Parquet2.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

# Further packages the examples use: checked by the install indicator, not listed on the Powered-by line
[requires]
packages = ["PollisDatasets.jl", "Plots.jl", "StatsBase.jl"]

