[[codeBranches]]
model = "lm"
code = '''
using ForwardDiff, LinearAlgebra, Statistics

f(t, p) = {{fmodel}}  # model prediction at one input
t = {{tdata}}  # inputs
y = {{ydata}}  # observations
p0 = {{p0}}  # initial parameters
resid(p) = y .- f.(t, Ref(p))  # residual vector r(p)
m, n = length(y), length(p0)
using LeastSquaresOptim

function fit(p0; tol=1e-8)
    r = LeastSquaresOptim.optimize(resid, p0, LeastSquaresOptim.LevenbergMarquardt(); autodiff=:forward, x_tol=tol, f_tol=tol)
    (p = r.minimizer, converged = r.converged, iterations = r.iterations)
end

result = fit(p0)
p_hat = result.p  # fitted parameters
r_hat = resid(p_hat)  # residuals at the solution
J = ForwardDiff.jacobian(resid, p_hat)  # m x n Jacobian of the residuals
(parameters = p_hat, ssr = sum(abs2, r_hat), converged = result.converged, iterations = result.iterations)
'''

[[codeBranches]]
model = "dogleg"
code = '''
using ForwardDiff, LinearAlgebra, Statistics

f(t, p) = {{fmodel}}  # model prediction at one input
t = {{tdata}}  # inputs
y = {{ydata}}  # observations
p0 = {{p0}}  # initial parameters
resid(p) = y .- f.(t, Ref(p))  # residual vector r(p)
m, n = length(y), length(p0)
using LeastSquaresOptim

function fit(p0; tol=1e-8)
    r = LeastSquaresOptim.optimize(resid, p0, LeastSquaresOptim.Dogleg(); autodiff=:forward, x_tol=tol, f_tol=tol)
    (p = r.minimizer, converged = r.converged, iterations = r.iterations)
end

result = fit(p0)
p_hat = result.p  # fitted parameters
r_hat = resid(p_hat)  # residuals at the solution
J = ForwardDiff.jacobian(resid, p_hat)  # m x n Jacobian of the residuals
(parameters = p_hat, ssr = sum(abs2, r_hat), converged = result.converged, iterations = result.iterations)
'''

[[codeBranches]]
model = "gn"
code = '''
using ForwardDiff, LinearAlgebra, Statistics

f(t, p) = {{fmodel}}  # model prediction at one input
t = {{tdata}}  # inputs
y = {{ydata}}  # observations
p0 = {{p0}}  # initial parameters
resid(p) = y .- f.(t, Ref(p))  # residual vector r(p)
m, n = length(y), length(p0)
using NonlinearSolve

function fit(p0; tol=1e-8)
    prob = NonlinearLeastSquaresProblem(NonlinearFunction((p, _) -> resid(p); resid_prototype=zeros(m)), p0)
    s = solve(prob, NonlinearSolve.GaussNewton(); abstol=tol)
    (p = s.u, converged = s.retcode == ReturnCode.Success, iterations = s.stats.nsteps)
end

result = fit(p0)
p_hat = result.p  # fitted parameters
r_hat = resid(p_hat)  # residuals at the solution
J = ForwardDiff.jacobian(resid, p_hat)  # m x n Jacobian of the residuals
(parameters = p_hat, ssr = sum(abs2, r_hat), converged = result.converged, iterations = result.iterations)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fit-overlay"
label = "Fitted vs Observed"
desc = "The data with the fitted model curve"
code = '''
using Plots

tt = range(minimum(t), maximum(t), length=300)
scatter(t, y, label="observed", xlabel="t", ylabel="y")
plot!(tt, f.(tt, Ref(p_hat)), label="fitted", linewidth=2)
'''

[[actionGroups.actions]]
id = "residual-plot"
label = "Residual Plot"
desc = "Residuals against the input: a random scatter around zero means the model shape fits; a pattern means it does not"
code = '''
using Plots

scatter(t, r_hat, xlabel="t", ylabel="residual", legend=false)
hline!([0], linestyle=:dash, color=:gray)
'''

[[actionGroups.actions]]
id = "jacobian-structure"
label = "Jacobian Structure"
desc = "Heatmap of the Jacobian at the solution: which observations inform which parameters"
code = '''
using Plots

heatmap(abs.(J), xlabel="parameter", ylabel="observation", yflip=true, colorbar_title="|dr/dp|")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residual-analysis"
label = "Residual Analysis"
desc = "Mean, spread, largest residual and lag-1 autocorrelation (near 0 for independent errors)"
code = '''
(mean = mean(r_hat), std = std(r_hat), max_abs = maximum(abs, r_hat), ssr = sum(abs2, r_hat),
 lag1_autocorrelation = cor(r_hat[1:end-1], r_hat[2:end]))
'''

[[actionGroups.actions]]
id = "gradient-norm"
label = "Gradient Norm"
desc = "First-order optimality: the gradient of the sum of squares, 2 J'r, should vanish at a minimum"
code = '''
g = 2 .* (J' * r_hat)
(gradient = g, gradient_norm = norm(g), converged = result.converged)
'''

[[actionGroups.actions]]
id = "condition-number"
label = "Condition Number"
desc = "Singular values, rank and condition number of J: a large condition number means strongly correlated, poorly identified parameters"
code = '''
sv = svdvals(J)
(singular_values = sv, rank = rank(J), n_parameters = n, condition_number = sv[1] / sv[end])
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "fitted-values"
label = "Fitted Values"
desc = "Observed, fitted and residual value at every input"
code = '''
[(t = t[i], observed = y[i], fitted = f(t[i], p_hat), residual = r_hat[i]) for i in eachindex(t)]
'''

[[actionGroups.actions]]
id = "new-point-eval"
label = "New-Point Eval"
desc = "Prediction at a new input with a delta-method standard error and an approximate 95% interval"
code = '''
using Distributions

t_new = maximum(t) * 1.2  # replace with the input of interest
s2 = sum(abs2, r_hat) / (m - n)
Cov = s2 .* inv(J' * J)
g = ForwardDiff.gradient(p -> f(t_new, p), p_hat)
se = sqrt(dot(g, Cov * g)); q = quantile(TDist(m - n), 0.975)
(t = t_new, prediction = f(t_new, p_hat), standard_error = se, lower_95 = f(t_new, p_hat) - q * se, upper_95 = f(t_new, p_hat) + q * se)
'''

[[actionGroups.actions]]
id = "param-ci"
label = "Parameter CI"
desc = "Approximate 95% confidence intervals from the linearised covariance s^2 (J'J)^-1"
code = '''
using Distributions

s2 = sum(abs2, r_hat) / (m - n)
se = sqrt.(diag(s2 .* inv(J' * J)))
q = quantile(TDist(m - n), 0.975)
[(parameter = i, estimate = p_hat[i], lower_95 = p_hat[i] - q * se[i], upper_95 = p_hat[i] + q * se[i]) for i in 1:n]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-solvers"
label = "Compare Solvers"
desc = "Levenberg-Marquardt and Dogleg (LeastSquaresOptim) against Gauss-Newton and trust-region (NonlinearSolve) from the same start"
code = '''
using LeastSquaresOptim, NonlinearSolve

lso(meth) = (r = LeastSquaresOptim.optimize(resid, p0, meth; autodiff=:forward); (r.minimizer, r.converged, r.iterations))
nls(alg) = (s = solve(NonlinearLeastSquaresProblem(NonlinearFunction((p, _) -> resid(p); resid_prototype=zeros(m)), p0), alg); (s.u, s.retcode == ReturnCode.Success, s.stats.nsteps))
runs = ["Levenberg-Marquardt" => () -> lso(LeastSquaresOptim.LevenbergMarquardt()), "Dogleg" => () -> lso(LeastSquaresOptim.Dogleg()),
        "Gauss-Newton" => () -> nls(NonlinearSolve.GaussNewton()), "Trust region" => () -> nls(NonlinearSolve.TrustRegion())]
map(runs) do (name, run)
    sec = @elapsed (p, ok, it) = run()
    (method = name, ssr = sum(abs2, resid(p)), converged = ok, iterations = it, seconds = sec)
end
'''

[[actionGroups.actions]]
id = "starting-points"
label = "Starting-Point Study"
desc = "Fit from 20 random starts around p0: the share reaching the best sum of squares shows the size of the convergence basin"
code = '''
using Random

rng = Xoshiro(1)
runs = [fit(p0 .* exp.(randn(rng, n))) for _ in 1:20]  # log-normal perturbations of p0
ssr = [sum(abs2, resid(r.p)) for r in runs]
best = minimum(ssr)
(best_ssr = best, share_at_best = mean(ssr .< best * (1 + 1e-6) + 1e-12), share_converged = mean(getfield.(runs, :converged)), worst_ssr = maximum(ssr))
'''

[[actionGroups.actions]]
id = "tol-sweep"
label = "Tolerance Sweep"
desc = "Iterations and final sum of squares as the stopping tolerance tightens"
code = '''
map([1e-2, 1e-4, 1e-6, 1e-8, 1e-10]) do tol
    r = fit(p0; tol=tol)
    (tolerance = tol, iterations = r.iterations, ssr = sum(abs2, resid(r.p)), converged = r.converged)
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary"
label = "Summary"
desc = "Parameters, sum of squares, residual standard error, convergence and iterations"
code = '''
(parameters = p_hat, ssr = sum(abs2, r_hat), residual_std_error = sqrt(sum(abs2, r_hat) / (m - n)), degrees_of_freedom = m - n,
 converged = result.converged, iterations = result.iterations)
'''

[[actionGroups.actions]]
id = "param-estimates"
label = "Parameter Estimates"
desc = "Estimates with standard errors, t-statistics and the parameter correlation matrix (off-diagonals near +-1 mean the data cannot separate the parameters)"
code = '''
Cov = sum(abs2, r_hat) / (m - n) .* inv(J' * J)
se = sqrt.(diag(Cov))
table = [(parameter = i, estimate = p_hat[i], std_error = se[i], t_stat = p_hat[i] / se[i]) for i in 1:n]
(estimates = table, correlation = Cov ./ (se * se'))
'''

[[actionGroups.actions]]
id = "gof"
label = "Goodness of Fit"
desc = "R-squared analogue, RMSE and the residual norm relative to the data norm"
code = '''
ssr = sum(abs2, r_hat); sst = sum(abs2, y .- mean(y))
(r_squared = 1 - ssr / sst, rmse = sqrt(ssr / m), normalised_residual_norm = norm(r_hat) / norm(y))
'''
