[[bullets]]
text = "Levenberg-Marquardt"
detail = "trust-region with adaptive damping; blends gradient descent and Gauss-Newton; robust from poor starting points"

[[bullets]]
text = "Dogleg"
detail = "piecewise path within the trust region from steepest descent to Gauss-Newton; efficient for small-residual problems"

[[bullets]]
text = "Gauss-Newton"
detail = "linearises residuals at each step; quadratic convergence when residuals are small at the solution"

[[decisionRows]]
task = "Levenberg-Marquardt"
context = "The default for curve fitting; robust from poor starting points"
purpose = "Blend Gauss-Newton with gradient descent through an adaptive damping term added to J'J"

[[decisionRows]]
task = "Dogleg"
context = "Well-scaled problems where fewer, cheaper iterations matter"
purpose = "Trust-region step on the path between the steepest-descent and Gauss-Newton points"

[[decisionRows]]
task = "Gauss-Newton"
context = "Small-residual problems with a good starting point"
purpose = "Linearise the residuals and solve the normal equations J'J d = -J'r at each step; fast near the solution, may diverge far from it"

[[inputs]]
id = "fmodel"
label = "Model f(t, p)"
tooltip = "Julia expression for the model prediction at a single input t with parameter vector p. The residuals are y - f(t, p). Example: p[1] * exp(-p[2] * t)."
default = "p[1] * exp(-p[2] * t)"

[[inputs]]
id = "p0"
label = "Initial Parameters p0"
tooltip = "Starting parameter vector as a Julia array; its length sets the number of parameters."
default = "[1.0, 0.1]"

[[inputs]]
id = "tdata"
label = "Inputs t"
tooltip = "Observed inputs as a Julia vector (or a variable already in the session)."
default = "collect(0:0.5:5)"
newRow = true

[[inputs]]
id = "ydata"
label = "Observations y"
tooltip = "Observed outputs as a Julia vector of the same length as t."
default = "[5.1, 3.9, 3.0, 2.4, 1.8, 1.5, 1.1, 0.9, 0.7, 0.55, 0.45]"

