[[actionGroups.actions]]
id = "bns"
label = "Barndorff-Nielsen and Shephard Test"
desc = "BNS jump test on intraday returns: standardised (RV - BV) statistic for the null hypothesis of no jumps; jumps only push RV above BV, so the test is one-sided (reject if Z > 1.645 at 5%)."
code = '''
using SpecialFunctions  # gamma

function bns_test(r)
    n = length(r)

    # Realized Variance
    RV = sum(r.^2)

    # Bipower Variation
    BPV = (pi / 2) * sum(abs.(r[2:end]) .* abs.(r[1:end-1]))

    # Tripower Quarticity (asymptotic variance estimator)
    mu43 = (2^(2/3)) * gamma(7/6) / gamma(1/2)
    TPQ = n * mu43^(-3) * sum(
        abs.(r[3:end]).^(4/3) .*
        abs.(r[2:end-1]).^(4/3) .*
        abs.(r[1:end-2]).^(4/3))

    # Asymptotic variance
    avar = ((pi/2)^2 + pi - 5) * TPQ / n

    # Z statistic
    Z = (RV - BPV) / sqrt(avar)
    return Z
end

{{?model=park}}error("The BNS test needs returns; log ranges are not returns. Select Realized, Two-Scales or Bipower with intraday prices")
{{?model=gk|rs|yz}}@warn "BNS asymptotics are for many intraday returns within one day; on daily close-to-close returns the result is only indicative"
{{?model=gk|rs|yz}}r = diff(log.({{close}}))  # close-to-close log returns
{{?model=rv|tsv|bpv}}r = diff(log.({{price}}))  # intraday log returns
Z = bns_test(r)
println("BNS Z-statistic: ", Z, "  one-sided p-value: ", 1 - 0.5 * erfc(-Z / sqrt(2)))

if Z > 1.645  # one-sided 5% critical value
    println("Reject null -> evidence of jumps")
else
    println("No significant jumps detected")
end
'''

