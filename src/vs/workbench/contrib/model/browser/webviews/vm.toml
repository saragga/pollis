[[codeBranches]]
model = "park"
code = '''
function parkinson_volatility(high, low)
    n = length(high)
    log_hl = log.(high ./ low)
    return sqrt(sum(log_hl.^2) / (4 * n * log(2)))
end

sigma = parkinson_volatility({{high}}, {{low}})  # daily volatility
'''

[[codeBranches]]
model = "gk"
code = '''
function garman_klass_volatility(open, high, low, close)
    n = length(open)
    log_hl = log.(high ./ low)
    log_co = log.(close ./ open)
    v = (0.5 .* log_hl.^2) .- ((2*log(2) - 1) .* log_co.^2)
    return sqrt(sum(v) / n)
end

sigma = garman_klass_volatility({{open}}, {{high}}, {{low}}, {{close}})  # daily volatility
'''

[[codeBranches]]
model = "rs"
code = '''
function rogers_satchell_volatility(open, high, low, close)
    n = length(open)
    log_hc = log.(high ./ close)
    log_ho = log.(high ./ open)
    log_lc = log.(low ./ close)
    log_lo = log.(low ./ open)
    v = (log_hc .* log_ho) .+ (log_lc .* log_lo)
    return sqrt(sum(v) / n)
end

sigma = rogers_satchell_volatility({{open}}, {{high}}, {{low}}, {{close}})  # daily volatility
'''

[[codeBranches]]
model = "yz"
code = '''
using Statistics

function yang_zhang_volatility(open, high, low, close; k = nothing)
    # Align all series after the overnight lag shift
    open_t  = open[2:end]
    high_t  = high[2:end]
    low_t   = low[2:end]
    close_t = close[2:end]
    close_prev = close[1:end-1]
    n = length(open_t)

    # 1. Overnight Volatility
    log_co = log.(open_t ./ close_prev)
    sigma_o2 = var(log_co)

    # 2. Open-to-Close Volatility
    log_oc = log.(close_t ./ open_t)
    sigma_c2 = var(log_oc)

    # 3. Rogers-Satchell component
    sigma_rs2 = mean((log.(high_t./close_t).*log.(high_t./open_t)) .+
                     (log.(low_t./close_t).*log.(low_t./open_t)))

    # Optimal k weight (Yang-Zhang 2000, eq. 14) unless k is given
    k = something(k, 0.34 / (1.34 + (n+1)/(n-1)))

    return sqrt(sigma_o2 + k*sigma_c2 + (1-k)*sigma_rs2)
end

sigma = yang_zhang_volatility({{open}}, {{high}}, {{low}}, {{close}}; k = {{k}})  # daily volatility
'''

[[codeBranches]]
model = "rv"
code = '''
function realized_volatility(price)
    log_r = diff(log.(price))
    return sqrt(sum(log_r.^2))
end

sigma = realized_volatility({{price}})  # daily realized volatility
'''

[[codeBranches]]
model = "tsv"
code = '''
function two_scales_volatility(price; K=5)
    log_r = diff(log.(price))
    n = length(log_r)  # number of returns (not prices)

    # Fast scale: all-observations RV
    rv_all = sum(log_r.^2)

    # Slow scale: average over K subsampled grids
    rv_slow = 0.0
    for k in 1:K
        sub_r = diff(log.(price[k:K:end]))
        rv_slow += sum(sub_r.^2)
    end
    rv_slow /= K

    # Bias correction with the small-sample adjustment (Zhang, Mykland and Ait-Sahalia 2005)
    n_bar = (n - K + 1) / K  # average number of returns per subgrid
    tsrv = (rv_slow - (n_bar / n) * rv_all) / (1 - n_bar / n)

    return tsrv > 0 ? sqrt(tsrv) : NaN  # TSRV can be negative in short samples (e.g. small rolling windows); NaN instead of a sqrt error
end

sigma = two_scales_volatility({{price}}; K = {{nsub}})  # noise-corrected daily volatility
'''

[[codeBranches]]
model = "bpv"
code = '''
r   = diff(log.({{price}}))

BPV = (pi / 2) * sum(abs.(r[2:end]) .* abs.(r[1:end-1]))  # pi/2 = 1/mu1^2 makes it estimate the integrated variance
println("Bipower Variation: ", BPV)
'''

