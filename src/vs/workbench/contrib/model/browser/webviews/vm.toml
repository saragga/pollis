[[actionGroups.actions]]
id = "regime"
label = "Volatility Regimes"
desc = "Classify observations as low / normal / high volatility using quantile thresholds"
code = '''
using Statistics

w = 21  # rolling window
{{?model=park}} r = log.({{high}} ./ {{low}}) ./ sqrt(4 * log(2))  # Parkinson-scaled daily range
{{?model=gk|rs|yz}} r = diff(log.({{close}}))  # close-to-close log returns
{{?model=rv|tsv|bpv}} r = diff(log.({{price}}))  # intraday log returns
vol = [sqrt(mean(r[i-w+1:i].^2)) for i in w:length(r)]  # rolling volatility

lo, hi = quantile(vol, [1/3, 2/3])  # tercile thresholds
regime = [v < lo ? :low : v > hi ? :high : :normal for v in vol]
println("Low: ", count(==(:low), regime), "  Normal: ", count(==(:normal), regime), "  High: ", count(==(:high), regime))
'''
