[[actionGroups.actions]]
id = "ewma"
label = "EWMA Volatility Forecast"
desc = "One-step-ahead volatility forecast with the RiskMetrics exponentially weighted moving average"
code = '''
lam = 0.94  # RiskMetrics decay factor for daily data
{{?model=park}} r = log.({{high}} ./ {{low}}) ./ sqrt(4 * log(2))  # Parkinson-scaled daily range as a return proxy
{{?model=gk|rs|yz}} r = diff(log.({{close}}))  # close-to-close log returns
{{?model=rv|tsv|bpv}} r = diff(log.({{price}}))  # intraday log returns

s2 = r[1]^2
for x in r[2:end]
    global s2 = lam * s2 + (1 - lam) * x^2  # recursive variance update
end
println("Next-period volatility forecast: ", sqrt(s2))
'''

