using Plots

plt = plot(xlabel="episode", ylabel="return (moving average of 20)", ylims=(-10 * (nrows + ncols), 0))
for k in 1:5
    plot!(plt, movavg(train(seed=k).returns, 20), label="seed $k")
end
plt
'''

