[[bullets]]
text = "Tabular"
detail = "maintains an exact lookup table of Q-values updated via the Bellman equation after each transition; exact and interpretable for small discrete state-action spaces (ReinforcementLearning.jl)"

[[bullets]]
text = "Deep Q-Network (DQN)"
detail = "approximates Q-values with a neural network; stabilised by experience replay and a periodically frozen target network; handles high-dimensional or pixel-based observations (ReinforcementLearning.jl)"

[[decisionRows]]
task = "Tabular"
context = "Small, discrete state and action spaces (grid worlds, board positions, inventory levels)"
purpose = "Keeps one Q(s, a) entry per state-action pair and updates it towards r + gamma max Q(s', a'); converges to the optimal Q under enough exploration"

[[decisionRows]]
task = "DQN"
context = "Large or continuous state spaces where a table is infeasible"
purpose = "Deep Q-Network: a neural network approximates Q(s, .), trained on minibatches from a replay buffer against a periodically synchronised target network"

[[inputs]]
id = "rows"
label = "Grid Rows"
tooltip = "Rows of the Cliff Walking grid. The agent starts bottom-left, the goal is bottom-right and the bottom row in between is the cliff (reward -100, back to start)."
default = "4"

[[inputs]]
id = "cols"
label = "Grid Columns"
tooltip = "Columns of the Cliff Walking grid. Every step costs -1."
default = "12"

[[inputs]]
id = "episodes"
label = "Episodes"
tooltip = "Total number of training episodes."
default = "300"

[[inputs]]
id = "gamma"
label = "Discount (gamma)"
tooltip = "Discount factor in (0, 1]. Values close to 1 weigh long-term rewards."
default = "0.99"

[[inputs]]
id = "eps"
label = "Exploration (epsilon)"
tooltip = "Probability of a random action in the epsilon-greedy behaviour policy."
default = "0.1"

[[inputs]]
id = "seed"
label = "Random Seed"
tooltip = "Seed for exploration, replay sampling and network initialisation."
default = "1"

[[inputs]]
id = "alpha"
label = "Learning Rate (alpha)"
tooltip = "Step size of the Q-table update. Too large causes oscillation; too small slows learning."
default = "0.5"
models = ["tabular"]
newRow = true

[[inputs]]
id = "lr"
label = "Adam Learning Rate"
tooltip = "Learning rate of the Adam optimiser training the Q-network."
default = "1e-3"
models = ["dqn"]
newRow = true

[[inputs]]
id = "batch"
label = "Batch Size"
tooltip = "Number of transitions sampled from the replay buffer for each gradient step."
default = "32"
models = ["dqn"]

[[inputs]]
id = "hidden"
label = "Hidden Units"
tooltip = "Units in the hidden layer of the Q-network."
default = "64"
models = ["dqn"]

