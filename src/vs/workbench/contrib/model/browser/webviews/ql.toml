[[codeBranches]]
model = "tabular"
code = '''
using Random, Statistics

nrows, ncols = {{rows}}, {{cols}}  # Cliff Walking grid
episodes = {{episodes}}  # training episodes
gamma = {{gamma}}  # discount factor
epsilon = {{eps}}  # exploration probability
seed = {{seed}}  # random seed
maxsteps = 4 * nrows * ncols  # step cap per episode
start, goal = (nrows, 1), (nrows, ncols)
moves = [(-1, 0), (0, 1), (1, 0), (0, -1)]  # actions: up, right, down, left
cliff(p) = p[1] == nrows && 1 < p[2] < ncols
sid(p) = (p[1] - 1) * ncols + p[2]  # state index
function step_env(p, a)  # returns (next position, reward, done)
    q = (clamp(p[1] + moves[a][1], 1, nrows), clamp(p[2] + moves[a][2], 1, ncols))
    cliff(q) && return (start, -100.0, false)
    return (q, -1.0, q == goal)
end

function train_tabular(; episodes=episodes, alpha=0.5, epsilon=epsilon, seed=seed, onpolicy=false)  # Q-learning (or SARSA if onpolicy)
    rng = MersenneTwister(seed)
    Qt = zeros(nrows * ncols, 4)
    pick(p) = rand(rng) < epsilon ? rand(rng, 1:4) : argmax(Qt[sid(p), :])
    returns = zeros(episodes); tderr = Float64[]
    for ep in 1:episodes
        p = start; a = pick(p); G = 0.0
        for t in 1:maxsteps
            q, r, done = step_env(p, a)
            a2 = pick(q)
            nextQ = done ? 0.0 : (onpolicy ? Qt[sid(q), a2] : maximum(Qt[sid(q), :]))
            d = r + gamma * nextQ - Qt[sid(p), a]  # TD error
            Qt[sid(p), a] += alpha * d
            push!(tderr, d); G += r; p = q; a = a2
            done && break
        end
        returns[ep] = G
    end
    (Q = p -> Qt[sid(p), :], returns = returns, tderr = tderr, table = Qt)
end

alpha = {{alpha}}  # learning rate
train(; kw...) = train_tabular(; alpha=alpha, kw...)

function rollout(Q)  # one greedy episode from the start
    p = start; path = [p]; G = 0.0
    for t in 1:maxsteps
        p, r, done = step_env(p, argmax(Q(p))); push!(path, p); G += r
        done && break
    end
    (path = path, G = G)
end
movavg(x, w) = [mean(x[max(1, i - w + 1):i]) for i in eachindex(x)]  # trailing moving average

res = train()
(greedy_return = rollout(res.Q).G, optimal_return = -(ncols + 1), mean_return_last_50 = mean(res.returns[max(1, end - 49):end]),
 episodes_trained = episodes)
'''

[[codeBranches]]
model = "dqn"
code = '''
using Random, Statistics

nrows, ncols = {{rows}}, {{cols}}  # Cliff Walking grid
episodes = {{episodes}}  # training episodes
gamma = {{gamma}}  # discount factor
epsilon = {{eps}}  # exploration probability
seed = {{seed}}  # random seed
maxsteps = 4 * nrows * ncols  # step cap per episode
start, goal = (nrows, 1), (nrows, ncols)
moves = [(-1, 0), (0, 1), (1, 0), (0, -1)]  # actions: up, right, down, left
cliff(p) = p[1] == nrows && 1 < p[2] < ncols
sid(p) = (p[1] - 1) * ncols + p[2]  # state index
function step_env(p, a)  # returns (next position, reward, done)
    q = (clamp(p[1] + moves[a][1], 1, nrows), clamp(p[2] + moves[a][2], 1, ncols))
    cliff(q) && return (start, -100.0, false)
    return (q, -1.0, q == goal)
end

function train_tabular(; episodes=episodes, alpha=0.5, epsilon=epsilon, seed=seed, onpolicy=false)  # Q-learning (or SARSA if onpolicy)
    rng = MersenneTwister(seed)
    Qt = zeros(nrows * ncols, 4)
    pick(p) = rand(rng) < epsilon ? rand(rng, 1:4) : argmax(Qt[sid(p), :])
    returns = zeros(episodes); tderr = Float64[]
    for ep in 1:episodes
        p = start; a = pick(p); G = 0.0
        for t in 1:maxsteps
            q, r, done = step_env(p, a)
            a2 = pick(q)
            nextQ = done ? 0.0 : (onpolicy ? Qt[sid(q), a2] : maximum(Qt[sid(q), :]))
            d = r + gamma * nextQ - Qt[sid(p), a]  # TD error
            Qt[sid(p), a] += alpha * d
            push!(tderr, d); G += r; p = q; a = a2
            done && break
        end
        returns[ep] = G
    end
    (Q = p -> Qt[sid(p), :], returns = returns, tderr = tderr, table = Qt)
end
using Flux

lr, batch, hidden = {{lr}}, {{batch}}, {{hidden}}  # optimiser and network settings
capacity, sync = 10_000, 200  # replay buffer size, target-network sync period (steps)
feat(p) = Float32.(1:nrows * ncols .== sid(p))  # one-hot state encoding

function train_dqn(; episodes=episodes, epsilon=epsilon, seed=seed)
    rng = MersenneTwister(seed); Random.seed!(seed)
    net = Chain(Dense(nrows * ncols => hidden, relu), Dense(hidden => 4))  # Q-network
    target_net = deepcopy(net)
    opt = Flux.setup(Adam(lr), net)
    buffer = Tuple{Vector{Float32}, Int, Float32, Vector{Float32}, Bool}[]  # replay buffer (s, a, r, s', done)
    returns = zeros(episodes); tderr = Float64[]; nsteps = 0
    for ep in 1:episodes
        p = start; G = 0.0
        for t in 1:maxsteps
            s = feat(p)
            a = rand(rng) < epsilon ? rand(rng, 1:4) : argmax(net(s))
            q, r, done = step_env(p, a)
            push!(buffer, (s, a, Float32(r), feat(q), done)); length(buffer) > capacity && popfirst!(buffer)
            G += r; p = q; nsteps += 1
            if length(buffer) >= batch
                B = buffer[rand(rng, 1:length(buffer), batch)]
                S, S2 = reduce(hcat, [b[1] for b in B]), reduce(hcat, [b[4] for b in B])
                idx = CartesianIndex.([b[2] for b in B], 1:batch)
                y = [b[3] for b in B] .+ Float32(gamma) .* .![b[5] for b in B] .* vec(maximum(target_net(S2), dims=1))  # TD targets
                loss, grads = Flux.withgradient(m -> Flux.mse(m(S)[idx], y), net)
                Flux.update!(opt, net, grads[1])
                push!(tderr, sqrt(loss))  # RMS TD error of the minibatch
            end
            nsteps % sync == 0 && (target_net = deepcopy(net))
            done && break
        end
        returns[ep] = G
    end
    (Q = p -> Float64.(net(feat(p))), returns = returns, tderr = tderr, net = net)
end
train(; kw...) = train_dqn(; kw...)

function rollout(Q)  # one greedy episode from the start
    p = start; path = [p]; G = 0.0
    for t in 1:maxsteps
        p, r, done = step_env(p, argmax(Q(p))); push!(path, p); G += r
        done && break
    end
    (path = path, G = G)
end
movavg(x, w) = [mean(x[max(1, i - w + 1):i]) for i in eachindex(x)]  # trailing moving average

res = train()
(greedy_return = rollout(res.Q).G, optimal_return = -(ncols + 1), mean_return_last_50 = mean(res.returns[max(1, end - 49):end]),
 episodes_trained = episodes)
'''

