[[actionGroups.actions]]
id = "greedy-policy"
label = "Greedy Policy"
desc = "Path taken by the trained greedy policy from the start, drawn over the grid (dark = cliff)"
code = '''
using Plots

g = rollout(res.Q)
heatmap([cliff((i, j)) ? 1.0 : 0.0 for i in 1:nrows, j in 1:ncols], yflip=true, color=:grays, colorbar=false, aspect_ratio=:equal,
    xlabel="column", ylabel="row", title="greedy return $(g.G)")
plot!(last.(g.path), first.(g.path), marker=:circle, linewidth=2, label="greedy path")
'''

[[actionGroups.actions]]
id = "expected-return"
label = "Expected Return"
desc = "Mean and spread of the return over 100 evaluation episodes, greedily and with the training exploration"
code = '''
function episode_return(Q, e, rng)
    p = start; G = 0.0
    for t in 1:maxsteps
        a = rand(rng) < e ? rand(rng, 1:4) : argmax(Q(p))
        p, r, done = step_env(p, a); G += r
        done && break
    end
    G
end
summarise(name, Gs) = (policy = name, mean_return = round(mean(Gs), digits=2), std_return = round(std(Gs), digits=2), worst_return = minimum(Gs))
rng = MersenneTwister(99)
[summarise("greedy", [episode_return(res.Q, 0.0, rng) for k in 1:100]),
 summarise("epsilon-greedy ($epsilon)", [episode_return(res.Q, epsilon, rng) for k in 1:100])]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "tabular-vs-dqn"
label = "Algorithm Comparison"
desc = "Tabular: Q-learning (off-policy) against SARSA (on-policy), which learns the safer path away from the cliff. DQN: DQN against tabular Q-learning"
code = '''
using Plots

{{?model=tabular}}other, names = train_tabular(alpha=alpha, onpolicy=true), ("Q-learning (off-policy)", "SARSA (on-policy)")
{{?model=dqn}}other, names = train_tabular(), ("DQN", "tabular Q-learning")
plot(movavg(res.returns, 20), label=names[1], xlabel="episode", ylabel="return (moving average of 20)", ylims=(-10 * (nrows + ncols), 0))
plot!(movavg(other.returns, 20), label=names[2])
title!("greedy returns: $(rollout(res.Q).G) vs $(rollout(other.Q).G)")
'''

[[actionGroups.actions]]
id = "exploration-sweep"
label = "Exploration Sweep"
desc = "Training return and final greedy return for a range of exploration rates epsilon"
code = '''
function sweep(e)
    r = train(epsilon=e)
    (epsilon = e, mean_return_last_50 = round(mean(r.returns[max(1, end - 49):end]), digits=1), greedy_return = rollout(r.Q).G)
end
[sweep(e) for e in [0.01, 0.05, 0.1, 0.2, 0.3]]
'''

