# Two-Stage Least Squares (2SLS) Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/tsls.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Two-Stage Least Squares (2SLS)"
viewType = "pollis.tsls"
defaultModel = "main"

[[packages]]
name = "Microeconometrics.jl"
github = "https://github.com/lbittarello/Microeconometrics.jl"

[requires]
packages = ["Microeconometrics.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Quick Start"
file = "tsls/tutorial-01-quickstart.ipynb"
bundled = true
description = "Estimate a 2SLS model and interpret the structural coefficients"

[[notebookSections.notebooks]]
name = "Instrument Validity"
file = "tsls/tutorial-02-instruments.ipynb"
bundled = true
description = "Test instrument relevance and exogeneity"

[[notebookSections.notebooks]]
name = "Standard Errors"
file = "tsls/tutorial-03-vcov.ipynb"
bundled = true
description = "Homoscedastic, heteroscedastic, and clustered SEs"

[[notebookSections.notebooks]]
name = "Hausman Test"
file = "tsls/tutorial-04-hausman.ipynb"
bundled = true
description = "Test endogeneity: compare OLS and 2SLS estimates"

[[wikis]]
