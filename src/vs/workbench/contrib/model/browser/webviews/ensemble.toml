[[actionGroups.actions]]
id = "fit-plot"
label = "Predicted vs Actual"
desc = "Confusion matrix on the test set (classification) or predicted against actual values (regression)"
code = '''
using Plots

y_hat = yhat(X_test)
{{?task=classification}} C = [count((y_test .== a) .& (y_hat .== b)) for a in classes, b in classes]
{{?task=classification}} heatmap(string.(classes), string.(classes), C, xlabel="predicted", ylabel="actual", yflip=true)
{{?task=regression}} scatter(y_test, y_hat, xlabel="actual", ylabel="predicted", alpha=0.5, legend=false)
{{?task=regression}} plot!(identity, extrema(y_test)..., linestyle=:dash)
'''

[[actionGroups.actions]]
id = "partial-dependence"
label = "Partial Dependence"
desc = "Average model output as one feature sweeps its range while all other features keep their observed values"
code = '''
using Plots

j = 1  # feature to vary
grid = range(extrema(X[:, j])..., length=30)
pd = map(grid) do v
    Xv = copy(X)
    Xv[:, j] .= v
    mean(score(Xv))
end
plot(grid, pd, xlabel=string("feature ", j), ylabel="average prediction", legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals"
label = "Residuals or Calibration"
desc = "Residuals against predictions (regression) or predicted probability against observed frequency (classification)"
code = '''
using Plots

{{?task=regression}} y_hat = yhat(X_test)
{{?task=regression}} scatter(y_hat, y_test .- y_hat, xlabel="prediction", ylabel="residual", alpha=0.5, legend=false)
{{?task=regression}} hline!([0], linestyle=:dash)
{{?task=classification}} p_hat = score(X_test)  # predicted probability of the last class
{{?task=classification}} bins = clamp.(ceil.(Int, 10 .* p_hat), 1, 10)
{{?task=classification}} observed = [mean(y_test[bins .== b] .== classes[end]) for b in 1:10 if any(bins .== b)]
{{?task=classification}} predicted = [mean(p_hat[bins .== b]) for b in 1:10 if any(bins .== b)]
{{?task=classification}} plot(predicted, observed, marker=:circle, xlabel="predicted probability", ylabel="observed frequency", label="model")
{{?task=classification}} plot!(identity, 0, 1, linestyle=:dash, label="perfect calibration")
'''

[[actionGroups.actions]]
id = "bootstrap-metric"
label = "Test Metric Uncertainty"
desc = "Bootstrap the test set 1000 times to put a 95% interval around the test accuracy or RMSE"
code = '''
y_hat = yhat(X_test)
boot = map(1:1000) do _
    i = rand(1:length(y_test), length(y_test))
    metric(y_test[i], y_hat[i])
end
(test = metric(y_test, y_hat), interval = quantile(boot, [0.025, 0.975]))
'''

