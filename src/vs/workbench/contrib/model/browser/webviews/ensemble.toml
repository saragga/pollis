[[actionGroups.actions]]
id = "vs-tree"
label = "vs Single Decision Tree"
desc = "Fit one decision tree of the same depth: the gap is what the ensemble adds"
code = '''
import DecisionTree

{{?task=classification}} tree = DecisionTree.DecisionTreeClassifier(max_depth=max_depth)
{{?task=regression}} tree = DecisionTree.DecisionTreeRegressor(max_depth=max_depth)
DecisionTree.fit!(tree, X, y)
(ensemble = metric(y_test, yhat(X_test)), tree = metric(y_test, DecisionTree.predict(tree, X_test)))
'''

[[actionGroups.actions]]
id = "vs-baseline"
label = "vs Simple Baseline"
desc = "Majority class (classification) or least squares on all features (regression)"
code = '''
{{?task=classification}} majority = classes[argmax([count(==(c), y) for c in classes])]
{{?task=classification}} baseline = metric(y_test, fill(majority, length(y_test)))
{{?task=regression}} beta = hcat(ones(size(X, 1)), X) \ y  # least squares with intercept
{{?task=regression}} baseline = metric(y_test, hcat(ones(size(X_test, 1)), X_test) * beta)
(ensemble = metric(y_test, yhat(X_test)), baseline = baseline)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "importance"
label = "Built-in Feature Importance"
desc = "The library's own importance: impurity decrease (forests) or split gain (boosting)"
code = '''
{{?model=rf}} imp = impurity_importance(model)  # mean decrease in impurity per feature
{{?model=gbt}} imp = last.(EvoTrees.importance(model))  # total split gain per feature
{{?model=xgb}} imp = importance(bst, "gain")  # gain per feature
{{?model=ddt}} imp = NeuroTreeModels.importance(model)  # importance per feature
'''

[[actionGroups.actions]]
id = "permutation"
label = "Permutation Importance"
desc = "Drop in test performance when each feature is shuffled: model-agnostic and computed on held-out data"
code = '''
using Plots, Random

base = metric(y_test, yhat(X_test))
drop = map(1:size(X_test, 2)) do j
    Xp = copy(X_test)
    Xp[:, j] = shuffle(Xp[:, j])
    s = metric(y_test, yhat(Xp))
{{?task=classification}}     base - s  # lost accuracy
{{?task=regression}}     s - base  # added RMSE
end
bar(drop, xlabel="feature", ylabel="performance lost when shuffled", legend=false)
'''

[[actionGroups.actions]]
id = "shapley"
label = "Shapley Values"
desc = "Monte Carlo Shapley values for one test observation: each feature's contribution to its prediction"
code = '''
using Plots, Random

function shapley(x; samples=200)  # permutation sampling against random training rows
    phi = zeros(length(x))
    for _ in 1:samples
        z = X[rand(1:size(X, 1)), :]
        prev = score(permutedims(z))[1]
        for j in randperm(length(x))
            z[j] = x[j]
            next = score(permutedims(z))[1]
            phi[j] += next - prev
            prev = next
        end
    end
    phi ./ samples
end
phi = shapley(X_test[1, :])  # explain the first test observation
bar(phi, xlabel="feature", ylabel="contribution to the prediction", legend=false)
'''

[[actionGroups.actions]]
id = "sirus"
label = "Stable Rules (SIRUS)"
desc = "A short, stable rule list distilled from a random forest on the same data — interpretable by design"
code = '''
using SIRUS
import MLJ

{{?task=classification}} rules = StableRulesClassifier(max_rules=10, q=10)  # at most 10 rules; q quantile splits per feature
{{?task=regression}} rules = StableRulesRegressor(max_rules=10, q=10)
{{?task=classification}} mach = MLJ.machine(rules, MLJ.table(X), MLJ.categorical(y))
{{?task=regression}} mach = MLJ.machine(rules, MLJ.table(X), y)
MLJ.fit!(mach)
MLJ.fitted_params(mach).fitresult  # the extracted rule list
'''
