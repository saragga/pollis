	s += '<rect x="' + (x - 3) + '" y="' + (66 - h[k]) + '" width="6" height="' + h[k] + '" fill="currentColor" opacity="0.6"/>';
	s += '<circle cx="' + x + '" cy="30" r="2.5" fill="currentColor"/>';
