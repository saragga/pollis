[miniCharts.xgb]
# Boosted trees with a regularisation bracket over their leaves
svg = '''
var s = '', h = [24, 16, 10, 6];
for (var k = 0; k < 4; k++) {
	var x = 7 + k * 13;
	s += '<rect x="' + (x - 3) + '" y="' + (66 - h[k]) + '" width="6" height="' + h[k] + '" fill="currentColor" opacity="0.6"/>';
