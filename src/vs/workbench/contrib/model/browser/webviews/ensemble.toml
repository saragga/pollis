var s = '';
for (var k = 0; k < 3; k++) {
	var x = 9 + k * 18;
	s += '<line x1="' + x + '" y1="30" x2="' + (x - 5) + '" y2="44" stroke="currentColor" stroke-width="1"/>';
	s += '<line x1="' + x + '" y1="30" x2="' + (x + 5) + '" y2="44" stroke="currentColor" stroke-width="1"/>';
	s += '<circle cx="' + x + '" cy="30" r="3" fill="currentColor"/>';
	s += '<circle cx="' + (x - 5) + '" cy="45" r="2.5" fill="currentColor" opacity="0.6"/><circle cx="' + (x + 5) + '" cy="45" r="2.5" fill="currentColor" opacity="0.6"/>';
	s += '<line x1="' + x + '" y1="50" x2="27" y2="62" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>';
}
return s + '<circle cx="27" cy="65" r="4" fill="currentColor"/>';
