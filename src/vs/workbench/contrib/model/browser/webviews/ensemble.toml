[[codeBranches]]
model = "rf"
code = '''
using DecisionTree, Statistics

X, y           = {{X}}, {{y}}  # training features (n x p) and target
X_test, y_test = {{X_test}}, {{y_test}}  # held-out features and target
ntrees    = {{ntrees}}  # number of trees
max_depth = {{maxdepth}}  # maximum depth of each tree
{{?task=classification}} classes = sort(unique(y))  # class labels; probability columns follow this order

{{?task=classification}} model = RandomForestClassifier(n_trees=ntrees, max_depth=max_depth)
{{?task=regression}} model = RandomForestRegressor(n_trees=ntrees, max_depth=max_depth)
fit!(model, X, y)  # each tree grows on a bootstrap sample with random feature subsets

yhat(X) = predict(model, X)  # majority vote or mean over the trees
{{?task=classification}} proba(X) = predict_proba(model, X)  # n x classes

{{?task=classification}} score(X) = proba(X)[:, end]  # probability of the last class, explained by the Interpret actions
{{?task=regression}} score(X) = yhat(X)
{{?task=classification}} metric(y, y_hat) = mean(y .== y_hat)  # accuracy
{{?task=regression}} metric(y, y_hat) = sqrt(mean(abs2, y .- y_hat))  # RMSE
(train = metric(y, yhat(X)), test = metric(y_test, yhat(X_test)))
'''

[[codeBranches]]
model = "gbt"
code = '''
using EvoTrees, Statistics

X, y           = {{X}}, {{y}}  # training features (n x p) and target
X_test, y_test = {{X_test}}, {{y_test}}  # held-out features and target
ntrees    = {{ntrees}}  # boosting rounds
max_depth = {{maxdepth}}  # maximum depth of each tree
eta       = {{eta}}  # learning rate (shrinkage)
{{?task=classification}} classes = sort(unique(y))  # class labels; probability columns follow this order

{{?task=classification}} config = EvoTreeClassifier(nrounds=ntrees, max_depth=max_depth, eta=eta)
{{?task=regression}} config = EvoTreeRegressor(nrounds=ntrees, max_depth=max_depth, eta=eta)
model = fit_evotree(config; x_train=X, y_train=y)  # each round fits a tree to the current gradients

{{?task=classification}} proba(X) = model(X)  # n x classes
{{?task=classification}} yhat(X) = classes[argmax.(eachrow(proba(X)))]
{{?task=regression}} yhat(X) = model(X)

{{?task=classification}} score(X) = proba(X)[:, end]  # probability of the last class, explained by the Interpret actions
{{?task=regression}} score(X) = yhat(X)
{{?task=classification}} metric(y, y_hat) = mean(y .== y_hat)  # accuracy
{{?task=regression}} metric(y, y_hat) = sqrt(mean(abs2, y .- y_hat))  # RMSE
(train = metric(y, yhat(X)), test = metric(y_test, yhat(X_test)))
'''

[[codeBranches]]
model = "xgb"
code = '''
using XGBoost, Statistics

X, y           = {{X}}, {{y}}  # training features (n x p) and target
X_test, y_test = {{X_test}}, {{y_test}}  # held-out features and target
ntrees    = {{ntrees}}  # boosting rounds
max_depth = {{maxdepth}}  # maximum depth of each tree
eta       = {{eta}}  # learning rate (shrinkage)
{{?task=classification}} classes = sort(unique(y))  # class labels; probability columns follow this order

{{?task=classification}} bst = xgboost((X, indexin(y, classes) .- 1); num_round=ntrees, max_depth, eta,  # labels recoded to 0, 1, ...
{{?task=classification}}               objective="multi:softprob", num_class=length(classes))
{{?task=regression}} bst = xgboost((X, y); num_round=ntrees, max_depth, eta, objective="reg:squarederror")

{{?task=classification}} proba(X) = predict(bst, X)  # n x classes
{{?task=classification}} yhat(X) = classes[argmax.(eachrow(proba(X)))]
{{?task=regression}} yhat(X) = predict(bst, X)

{{?task=classification}} score(X) = proba(X)[:, end]  # probability of the last class, explained by the Interpret actions
{{?task=regression}} score(X) = yhat(X)
{{?task=classification}} metric(y, y_hat) = mean(y .== y_hat)  # accuracy
{{?task=regression}} metric(y, y_hat) = sqrt(mean(abs2, y .- y_hat))  # RMSE
(train = metric(y, yhat(X)), test = metric(y_test, yhat(X_test)))
'''

[[codeBranches]]
model = "ddt"
code = '''
using NeuroTreeModels, Tables, Statistics

X, y           = {{X}}, {{y}}  # training features (n x p) and target
X_test, y_test = {{X_test}}, {{y_test}}  # held-out features and target
ntrees    = {{ntrees}}  # trees per ensemble
max_depth = {{maxdepth}}  # maximum depth of each tree
{{?task=classification}} classes = sort(unique(y))  # class labels; probability columns follow this order

features = Symbol.(:Column, 1:size(X, 2))
table(X) = Tables.columntable(Tables.table(X))  # Tables.jl column table (Column1, Column2, ...)
{{?task=classification}} config = NeuroTreeClassifier(depth=max_depth, ntrees=ntrees, lr=0.05)
{{?task=regression}} config = NeuroTreeRegressor(depth=max_depth, ntrees=ntrees, lr=0.05)
model = NeuroTreeModels.fit(config, merge(table(X), (target = y,)); target_name=:target, feature_names=features)  # gradient descent on soft trees

{{?task=classification}} proba(X) = model(table(X))  # n x classes
{{?task=classification}} yhat(X) = classes[argmax.(eachrow(proba(X)))]
{{?task=regression}} yhat(X) = model(table(X))

{{?task=classification}} score(X) = proba(X)[:, end]  # probability of the last class, explained by the Interpret actions
{{?task=regression}} score(X) = yhat(X)
{{?task=classification}} metric(y, y_hat) = mean(y .== y_hat)  # accuracy
{{?task=regression}} metric(y, y_hat) = sqrt(mean(abs2, y .- y_hat))  # RMSE
(train = metric(y, yhat(X)), test = metric(y_test, yhat(X_test)))
'''

