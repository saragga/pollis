[[inputs]]
id = "task"
label = "Task"
tooltip = "Learning objective and prediction head. Classification minimises cross-entropy or Gini impurity; regression minimises squared error."
kind = "select"
default = "classification"

[[inputs.options]]
value = "classification"
label = "Classification"

[[inputs.options]]
value = "regression"
label = "Regression"

[[inputs]]
id = "X"
label = "Train Feature Matrix"
tooltip = "n_samples × n_features matrix of input features used to train the ensemble."
default = "X_train"

[[inputs]]
id = "y"
label = "Train Target Variable"
tooltip = "Target vector of length n_samples. Discrete class labels for classification; continuous values for regression."
default = "y_train"

[[inputs]]
id = "X_test"
label = "Test Feature Matrix"
tooltip = "n_samples × n_features feature matrix of held-out test data used to evaluate generalisation."
default = "X_test"

[[inputs]]
id = "y_test"
label = "Test Target Variable"
tooltip = "Target vector of the held-out test data."
default = "y_test"

[[inputs]]
id = "ntrees"
label = "n_trees"
tooltip = "Number of trees (Random Forests, Differentiable DT) or boosting rounds (Gradient Boosting, XGBoost). More rounds reduce bias but risk overfitting. Typical range: 100–1000."
default = "100"
newRow = true

[[inputs]]
id = "maxdepth"
label = "max_depth"
tooltip = "Maximum depth of each tree. Shallower trees reduce overfitting but may underfit. Typical values: 3–8 for boosting, 5–20 for random forests (or unlimited with −1)."
default = "5"

[[inputs]]
id = "eta"
label = "eta (learning rate)"
tooltip = "Step size eta in (0, 1] applied to each tree's contribution. Smaller values require more rounds but generalise better. Typical range: 0.01–0.3."
default = "0.1"
models = ["gbt", "xgb"]

