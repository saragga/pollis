desc = "Share of immigrant events and mean cluster size"
code = '''
using LinearAlgebra

{{?model=hawkes}}println("Direct offspring per event, kappa: ", kappa)
{{?model=hawkes}}println("Immigrant share 1 - kappa:        ", 1 - kappa)
{{?model=hawkes}}println("Mean cluster size 1/(1 - kappa):  ", round(1 / (1 - kappa), digits = 3))
{{?model=network}}rates = (I - transpose(W)) \ mu  # stationary rates: Lambda = mu + transpose(W) * Lambda
{{?model=network}}println("Stationary rate per node:  ", round.(rates, digits = 3))
{{?model=network}}println("Immigrant share per node:  ", round.(mu ./ rates, digits = 3))
{{?model=poisson|inhomogeneous|cox}}println("Every event is an immigrant in this model: no event triggers another")
'''

