# Point Process Simulation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/ptps.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Point Process Simulation"
viewType = "pollis.ptps"
defaultModel = "poisson"

[[packages]]
name = "PointProcesses.jl"
github = "https://github.com/JoseKling/PointProcesses.jl"

[[packages]]
name = "HawkesProcesses.jl"
github = "https://github.com/dmillot/HawkesProcesses.jl"

[[packages]]
name = "NetworkHawkesProcesses.jl"
github = "https://github.com/cswaney/NetworkHawkesProcesses.jl"

[requires]
packages = ["Plots.jl", "Distributions.jl", "HypothesisTests.jl", "QuadGK.jl", "GaussianProcesses.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Poisson Simulation"
file = "ptp/ptp-poisson-01-simulation.ipynb"
bundled = true
description = "Homogeneous Poisson process: direct simulation via exponential inter-arrival times"

[[notebookSections.notebooks]]
name = "Inhomogeneous Poisson"
file = "ptp/ptp-inhomogeneous-01-simulation.ipynb"
bundled = true
description = "Inhomogeneous Poisson process: Lewis-Shedler thinning with a time-varying rate"

[[notebookSections.notebooks]]
name = "Hawkes Simulation"
file = "ptp/ptp-hawkes-01-simulation.ipynb"
bundled = true
description = "Hawkes process simulation via Ogata thinning: self-excitation and branching structure"

[[notebookSections.notebooks]]
name = "Network Hawkes"
file = "ptp/ptp-network-01-simulation.ipynb"
bundled = true
description = "Multivariate Network Hawkes simulation: directed cross-excitation via weight matrix W"

[[notebookSections.notebooks]]
name = "Cox Process"
file = "ptp/ptp-cox-01-simulation.ipynb"
bundled = true
description = "Log-Gaussian Cox process: GP intensity sampling then conditional Poisson simulation"

