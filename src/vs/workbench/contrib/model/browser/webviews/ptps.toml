[[models]]
id = "poisson"
label = "Poisson"

[[models]]
id = "inhomogeneous"
label = "Inhomogeneous"

[[models]]
id = "cox"
label = "Cox"

[[models]]
id = "hawkes"
label = "Hawkes"

[[models]]
id = "network"
label = "Network Hawkes"

[[bullets]]
text = "Poisson"
detail = "constant rate lambda; counts in disjoint intervals are independent Poisson and gaps are iid Exp(lambda); simulated with rand(MultivariatePoissonProcess([lambda]), 0, T) from PointProcesses.jl"

[[bullets]]
text = "Inhomogeneous"
detail = "time-varying rate lambda(t); Lewis-Shedler thinning (propose at lambda_max, keep each point with probability lambda(t)/lambda_max) with HawkesProcesses.jl's poisson_simulation"

[[bullets]]
text = "Cox"
detail = "doubly stochastic Poisson: log lambda(t) = mu0 + y(t) with y a zero-mean Gaussian process; NetworkHawkesProcesses.jl draws the path on a grid, then the events given the path"

[[bullets]]
text = "Hawkes"
detail = "self-exciting: lambda(t) = mu + alpha sum over t_i < t of exp(-beta(t - t_i)); HawkesProcesses.jl simulates the cluster (immigrant-offspring) representation; stable when kappa = alpha/beta < 1"

[[bullets]]
text = "Network Hawkes"
detail = "multivariate Hawkes: an event on node m adds W[m, n] beta exp(-beta s) to node n; NetworkHawkesProcesses.jl simulates the clusters; stable when the spectral radius of W is below 1"

[[inputs]]
id = "T"
label = "Time Horizon (T)"
tooltip = "Simulation window [0, T]. Events are generated in this interval."
default = "100"

[[inputs]]
id = "lambda"
label = "Rate (lambda)"
tooltip = "Constant event rate. The count in [0, T] is Poisson with mean and variance lambda * T, and the gaps are iid Exp(lambda)."
default = "1.0"
models = ["poisson"]

[[inputs]]
id = "lambda-func"
label = "Intensity (lambda(t))"
tooltip = "Julia expression in t for the time-varying rate. It must be non-negative and at most lambda_max on [0, T]; the code checks both on a fine grid."
default = "1 + sin(t / 10)"
models = ["inhomogeneous"]

[[inputs]]
id = "lambda-max"
label = "Max Rate (lambda_max)"
tooltip = "Upper bound on lambda(t) over [0, T]. Points are proposed at rate lambda_max and kept with probability lambda(t)/lambda_max, so a tighter bound wastes fewer proposals. A bound below the peak of lambda(t) gives the wrong process, so the code stops with an error."
default = "2.0"
models = ["inhomogeneous"]

[[inputs]]
id = "mu0"
label = "Log Baseline (mu0)"
tooltip = "Offset of the log-intensity: lambda(t) = exp(mu0 + y(t)), with y a zero-mean Gaussian process. The expected rate is exp(mu0 + sigma2/2)."
default = "0.0"
models = ["cox"]

[[inputs]]
id = "gp-var"
label = "GP Variance (sigma2)"
tooltip = "Variance of the Gaussian process y(t). Controls how far the intensity swings around exp(mu0), and raises the expected rate to exp(mu0 + sigma2/2)."
default = "1.0"
models = ["cox"]

[[inputs]]
id = "gp-ls"
label = "Length Scale (l)"
tooltip = "Length scale of the Gaussian process kernel, in time units. Larger values give smoother, slower-moving intensity paths."
default = "10.0"
models = ["cox"]

[[inputs]]
id = "kernel"
label = "Kernel"
tooltip = "Covariance kernel of the Gaussian process. Squared exponential gives smooth paths; Ornstein-Uhlenbeck (Matern 1/2) gives rough, continuous paths."
kind = "select"
default = "se"
models = ["cox"]

[[inputs.options]]
value = "se"
label = "Squared Exp."

[[inputs.options]]
value = "ou"
label = "Ornstein-Uhlenbeck"

[[inputs]]
id = "mu"
label = "Baseline (mu)"
tooltip = "Immigrant rate: events arriving independently of the history."
default = "0.3"
models = ["hawkes"]

[[inputs]]
id = "alpha"
label = "Excitation (alpha)"
tooltip = "Jump in intensity after each event. The branching ratio kappa = alpha/beta (expected direct offspring per event) must be below 1."
default = "0.5"
models = ["hawkes"]

[[inputs]]
id = "beta"
label = "Decay (beta)"
tooltip = "Exponential decay rate: the excitation from an event at t_i is alpha * exp(-beta * (t - t_i)). The branching ratio alpha/beta must be below 1."
default = "1.0"
models = ["hawkes"]

[[inputs]]
id = "N"
label = "Nodes (N)"
tooltip = "Number of event streams. Each node's intensity is driven by the past events of every node through the weight matrix W."
default = "3"
models = ["network"]

[[inputs]]
id = "net-mu"
label = "Baseline (mu)"
tooltip = "Immigrant rate of every node."
default = "0.3"
models = ["network"]

[[inputs]]
id = "net-beta"
label = "Decay (beta)"
tooltip = "Decay rate of every link: an event on node m adds W[m, n] * beta * exp(-beta * (t - t_i)) to node n, so W[m, n] is the expected number of direct offspring on n."
default = "1.0"
models = ["network"]

[[inputs]]
id = "rho"
label = "Spectral Radius (rho)"
tooltip = "The random weight matrix W is rescaled so that its largest eigenvalue modulus equals rho. The process is stable for rho < 1, and clusters grow longer as rho approaches 1."
default = "0.6"
models = ["network"]

[[codeBranches]]
model = "poisson"
code = '''
using Random, Distributions, PointProcesses

Random.seed!(1)
lambda = Float64({{lambda}})  # constant event rate
T = Float64({{T}})  # simulation window [0, T]

process = MultivariatePoissonProcess([lambda])  # a single mark: a univariate Poisson process
sim() = sort(event_times(rand(process, 0.0, T)))  # rand returns a History with unsorted times
events = sim()

lam(t) = lambda  # true intensity
Lam(a, b) = lambda * (b - a)  # true compensator on [a, b]
EN = lambda * T  # E[N(T)]; Var[N(T)] is the same

println("Simulated events: ", length(events))
println("E[N(T)]:          ", EN, " (sd ", round(sqrt(EN), digits = 2), ")")
'''

[[codeBranches]]
model = "inhomogeneous"
code = '''
using Random, QuadGK
import HawkesProcesses as HP

Random.seed!(1)
T = Float64({{T}})  # simulation window [0, T]
lambda_max = Float64({{lambda-max}})  # thinning bound
lambda_t(t) = {{lambda-func}}  # true intensity

grid_vals = lambda_t.(range(0, T, length = 10_001))
minimum(grid_vals) < 0 && error("lambda(t) is negative on [0, T]")
maximum(grid_vals) > lambda_max && error("lambda_max = $lambda_max is below the peak of lambda(t), $(maximum(grid_vals)): raise it")

sim() = HP.poisson_simulation(s -> lambda_t.(s), T, lambda_max)  # Lewis-Shedler thinning; returns sorted times
events = sim()

lam(t) = lambda_t(t)
Lam(a, b) = quadgk(lambda_t, a, b)[1]  # true compensator on [a, b]
EN = Lam(0.0, T)  # E[N(T)]; Var[N(T)] is the same

println("Simulated events: ", length(events))
println("E[N(T)]:          ", round(EN, digits = 2), " (sd ", round(sqrt(EN), digits = 2), ")")
println("Acceptance rate:  ", round(EN / (lambda_max * T), digits = 3))  # share of proposals kept
'''

[[codeBranches]]
model = "cox"
code = '''
using Random, QuadGK
import NetworkHawkesProcesses as NHP

Random.seed!(1)
T = Float64({{T}})  # simulation window [0, T]
G = 100  # grid intervals for the Gaussian process path
{{?kernel=se}}gp = NHP.GaussianProcess(NHP.SquaredExponentialKernel(sqrt({{gp-var}}), {{gp-ls}}))  # (sigma, length scale)
{{?kernel=ou}}gp = NHP.GaussianProcess(NHP.OrnsteinUhlenbeckKernel(sqrt({{gp-var}}), {{gp-ls}}))  # (sigma, length scale)

new_path() = NHP.LogGaussianCoxProcess(gp, {{mu0}}, T, G, 1)  # draw lambda(t) = exp(mu0 + y(t)) on G + 1 points, linear in between
sim() = sort(rand(new_path(), 1, T))  # a new path, then Poisson events given it
cox = new_path()
events = sort(rand(cox, 1, T))

lam(t) = NHP.intensity(cox, 1, t)  # this realisation's intensity
Lam(a, b) = quadgk(lam, a, b)[1]  # its compensator on [a, b]
EN = T * exp({{mu0}} + {{gp-var}} / 2)  # E[N(T)] over paths: each grid value is lognormal
EN_path = Lam(0.0, T)  # E[N(T) | this path]

println("Simulated events:      ", length(events))
println("E[N(T) | this path]:   ", round(EN_path, digits = 2))
println("E[N(T)] over paths:    ", round(EN, digits = 2), " (the count is overdispersed: Var > mean)")
'''

[[codeBranches]]
model = "hawkes"
code = '''
using Random, Distributions
import HawkesProcesses as HP

Random.seed!(1)
mu = Float64({{mu}})  # immigrant rate
alpha = Float64({{alpha}})  # excitation jump per event
beta = Float64({{beta}})  # decay rate
T = Float64({{T}})  # simulation window [0, T]
kappa = alpha / beta  # branching ratio: expected direct offspring per event
kappa < 1 || error("alpha/beta = $kappa: the process is explosive; lower alpha or raise beta")
kern = Exponential(1 / beta)  # HawkesProcesses writes alpha exp(-beta s) as kappa * pdf(Exponential(1/beta), s)

sim() = HP.simulate(mu, kappa, kern, T)  # immigrants, then generations of offspring; sorted
events = sim()

lam(t) = HP.intensity(t, events, mu, kappa, s -> pdf(kern, s))  # true conditional intensity (events before t)
Lam(a, b) = HP.compensator(b, events, mu, kappa, kern) - HP.compensator(a, events, mu, kappa, kern)
m_star = mu / (1 - kappa)  # stationary rate
EN = m_star * T - (m_star - mu) * (1 - exp(-(beta - alpha) * T)) / (beta - alpha)  # E[N(T)] starting from no history

println("Simulated events:  ", length(events))
println("E[N(T)]:           ", round(EN, digits = 2))
println("Branching ratio:   ", kappa)
'''

[[codeBranches]]
model = "network"
code = '''
using Random, LinearAlgebra, QuadGK
import NetworkHawkesProcesses as NHP

Random.seed!(1)
N = {{N}}  # number of nodes
mu = fill(Float64({{net-mu}}), N)  # immigrant rate per node
beta = Float64({{net-beta}})  # decay rate of every link
T = Float64({{T}})  # simulation window [0, T]

W = rand(N, N)  # W[m, n]: expected direct offspring on node n of an event on node m
W .*= {{rho}} / maximum(abs.(eigvals(W)))  # rescale to the chosen spectral radius

process = NHP.ContinuousStandardHawkesProcess(NHP.HomogeneousProcess(mu), NHP.ExponentialImpulseResponse(fill(beta, N, N)), NHP.DenseWeightModel(W))
NHP.isstable(process) || error("spectral radius {{rho}} >= 1: the process is explosive")
sim() = NHP.rand(process, T)  # (times, nodes, T), sorted by time; cluster simulation
data = sim()
events, nodes, _ = data
node_times = [events[nodes .== n] for n in 1:N]

lam(t) = NHP.intensity(process, data, t)  # vector of the N true intensities at t
Lam(a, b) = quadgk(lam, a, filter(s -> a < s < b, events)..., b)[1]  # compensators on [a, b], split at the jumps
A = beta * (transpose(W) - I)  # E[lambda(t)] = mu + x(t) with x' = A x + beta W^T mu, x(0) = 0
x_star = (I - transpose(W)) \ (transpose(W) * mu)
EN = mu * T + x_star * T - A \ ((exp(A * T) - I) * x_star)  # E[N(T)] per node, from no history

println("Weight matrix W (row = source):")
display(round.(W, digits = 3))
for n in 1:N
    println("Node ", n, ": ", length(node_times[n]), " events (E[N(T)] = ", round(EN[n], digits = 2), ")")
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "event-timeline"
label = "Event Timeline"
desc = "Plot simulated event times on a horizontal axis"
code = '''
using Plots

{{?model!=network}}scatter(events, zeros(length(events)); marker = :vline, markersize = 10, yticks = [], xlabel = "t", legend = false, xlims = (0, T))  # one tick per event
{{?model=network}}scatter(events, nodes; marker = :vline, markersize = 10, xlabel = "t", ylabel = "node", yticks = 1:N, legend = false, xlims = (0, T))  # one row per node
'''

[[actionGroups.actions]]
id = "intensity-plot"
label = "Intensity Function"
desc = "Plot the true conditional intensity lambda(t) over [0, T]"
code = '''
using Plots

ts = collect(range(0, T, length = 1000))  # Hawkes intensities jump at each event
{{?model!=network}}plot(ts, lam.(ts); xlabel = "t", ylabel = "lambda(t)", legend = false)
{{?model=network}}plot(ts, transpose(reduce(hcat, lam.(ts))); xlabel = "t", ylabel = "lambda_n(t)", label = permutedims(["node $n" for n in 1:N]))
'''

[[actionGroups.actions]]
id = "inter-event-hist"
label = "Inter-Event Times"
desc = "Histogram of waiting times against the Poisson benchmark"
code = '''
using Plots, Distributions

gaps = diff(events)  # inter-event times (all nodes pooled for Network Hawkes)
histogram(gaps; normalize = :pdf, xlabel = "inter-event time", ylabel = "density", label = "simulated")
plot!(s -> pdf(Exponential(T / length(events)), s), 0, maximum(gaps); linewidth = 2, label = "Poisson at the same rate")  # exact only for the Poisson model
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "count-vs-theoretical"
label = "Count vs Theory"
desc = "Compare the simulated count to this model's E[N(T)]"
code = '''
{{?model!=network}}n_sim = length(events)
{{?model=network}}n_sim = length.(node_times)
println("Simulated: ", n_sim)
println("Expected:  ", round.(EN, digits = 2))
{{?model=poisson|inhomogeneous}}println("z-score:   ", round((n_sim - EN) / sqrt(EN), digits = 2), " (Var[N(T)] = E[N(T)] for a Poisson process; |z| > 2 is unusual)")
{{?model=cox}}println("Given this path: E = ", round(EN_path, digits = 2), ", z-score ", round((n_sim - EN_path) / sqrt(EN_path), digits = 2))
{{?model=cox|hawkes|network}}println("The count is overdispersed, so one run says little: use Multiple Seeds for its spread")
'''

[[actionGroups.actions]]
id = "inter-event-ks"
label = "Time-Rescaling Test"
desc = "Rescale gaps by the true compensator; KS test against Exp(1)"
code = '''
using HypothesisTests, Distributions

{{?model!=network}}tau = [Lam(a, b) for (a, b) in zip([0.0; events[1:(end - 1)]], events)]  # iid Exp(1) if the simulator is right
{{?model=network}}tau = reduce(vcat, [[Lam(a, b)[n] for (a, b) in zip([0.0; tn[1:(end - 1)]], tn)] for (n, tn) in enumerate(node_times)])  # per node, pooled
println(ExactOneSampleKSTest(1 .- exp.(-tau), Uniform()))  # true parameters, so the test has its nominal level
'''

[[actionGroups.actions]]
id = "branching-check"
label = "Branching Ratio"
desc = "Stability: kappa < 1 (Hawkes) or spectral radius < 1 (Network)"
code = '''
using LinearAlgebra

{{?model=hawkes}}println("kappa = alpha/beta = ", kappa, kappa < 1 ? " (stable)" : " (explosive)")
{{?model=network}}radius = maximum(abs.(eigvals(W)))
{{?model=network}}println("Spectral radius of W = ", round(radius, digits = 3), NHP.isstable(process) ? " (stable)" : " (explosive)")
{{?model=poisson|inhomogeneous|cox}}println("No self-excitation in this model: its branching ratio is 0")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "extend-horizon"
label = "Extend Horizon"
desc = "Continue the simulation past T given the history"
code = '''
h_fc = 50  # additional horizon
{{?model=poisson}}future = sort(event_times(rand(process, T, T + h_fc)))  # independent increments: the history does not matter
{{?model=inhomogeneous}}future = T .+ HP.poisson_simulation(s -> lambda_t.(T .+ s), h_fc, lambda_max)  # lambda(t) must stay below lambda_max after T
{{?model=hawkes}}future = HP.simulate_forward(events, h_fc, T, mu, kappa, kern)  # excitation left by the history, new immigrants and their offspring
{{?model=cox|network}}println("No conditional simulator: the Cox path ends at T, and NetworkHawkesProcesses cannot simulate from a history")
{{?model=poisson|inhomogeneous|hawkes}}println("Events in (T, T + h]: ", length(future))
'''

[[actionGroups.actions]]
id = "expected-count"
label = "Expected Count"
desc = "E[N(T, T + h) | history], counting future offspring"
code = '''
using QuadGK, Statistics

h_fc = 50  # forecast horizon
{{?model=poisson}}println("E[N(T, T + h)] = ", lambda * h_fc)
{{?model=inhomogeneous}}println("E[N(T, T + h)] = ", round(quadgk(lambda_t, T, T + h_fc)[1], digits = 2))
{{?model=hawkes}}fc = m_star * h_fc + (lam(T) - m_star) * (1 - exp(-(beta - alpha) * h_fc)) / (beta - alpha)  # E[lambda] relaxes from lambda(T) to the stationary rate
{{?model=hawkes}}mc = [length(HP.simulate_forward(events, h_fc, T, mu, kappa, kern)) for _ in 1:2000]
{{?model=hawkes}}println("E[N(T, T + h) | history] = ", round(fc, digits = 2), "; Monte Carlo ", round(mean(mc), digits = 2), " +/- ", round(std(mc) / sqrt(length(mc)), digits = 2))
{{?model=network}}x0 = lam(T) .- mu  # excitation left by the history
{{?model=network}}fc = mu * h_fc + x_star * h_fc + A \ ((exp(A * h_fc) - I) * (x0 - x_star))
{{?model=network}}println("E[N(T, T + h) | history] per node: ", round.(fc, digits = 2))
{{?model=cox}}println("No forecast: the simulated Cox path is defined only on [0, T]")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "multi-seed"
label = "Multiple Seeds"
desc = "Count distribution over independent runs against theory"
code = '''
using Statistics

n_runs = 500  # independent realisations
{{?model!=network}}counts = [length(sim()) for _ in 1:n_runs]
{{?model=network}}counts = [length(first(sim())) for _ in 1:n_runs]  # all nodes pooled
println("Mean count: ", round(mean(counts), digits = 2), " +/- ", round(std(counts) / sqrt(n_runs), digits = 2), " (theory ", round(sum(EN), digits = 2), ")")
println("Variance / mean: ", round(var(counts) / mean(counts), digits = 2), " (1 for Poisson; above 1 for Cox and Hawkes)")
'''

[[actionGroups.actions]]
id = "superposition"
label = "Superposition"
desc = "Merge two independent Poisson processes"
code = '''
using HypothesisTests, Distributions

{{?model!=poisson}}println("Superposition is shown for the Poisson model: switch to Poisson")
{{?model=poisson}}pair = MultivariatePoissonProcess([lambda, lambda / 2])  # two independent streams, marks 1 and 2
{{?model=poisson}}h2 = rand(pair, 0.0, T)
{{?model=poisson}}merged = sort(event_times(h2))  # ignoring the marks: Poisson with rate 1.5 lambda
{{?model=poisson}}println("Counts by stream: ", [count(==(k), event_marks(h2)) for k in 1:2], ", merged ", length(merged), " (expected ", 1.5 * lambda * T, ")")
{{?model=poisson}}println(ExactOneSampleKSTest(diff([0.0; merged]), Exponential(1 / (1.5 * lambda))))  # gaps of the merged stream
'''

