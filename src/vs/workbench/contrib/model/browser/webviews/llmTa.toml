[[bullets]]
text = "Tag"
detail = "any number of predefined tags per document; one aiclassify true/false judgement per document and tag"

[[bullets]]
text = "Classify"
detail = "exactly one category per document; aiclassify forces a one-token choice among the numbered categories"

[[bullets]]
text = "Topics"
detail = "hierarchical clustering of document embeddings, cut at k; the LLM labels and summarises each cluster (build_clusters!)"

[[bullets]]
text = "Q&A"
detail = "retrieval-augmented generation: the most similar chunks are passed to the LLM as context (RAGTools airag)"

[[bullets]]
text = "Evaluation"
detail = "accuracy and Cohen kappa against a hand-labelled sample and between two LLMs (StatisticalMeasures.jl), plus API cost"

[[inputs]]
id = "texts"
label = "Documents"
tooltip = "A vector of strings, one per document. Example: texts = readlines(\"corpus.txt\") or texts = [\"doc1...\", \"doc2...\"]. Needs OPENAI_API_KEY: embeddings use the OpenAI embedding model."
default = "texts"

[[inputs]]
id = "llmmodel"
label = "Model"
tooltip = "OpenAI chat model passed to PromptingTools.jl. Tag and Classify use aiclassify, which only supports the gpt-4o, gpt-4 and gpt-3.5 families. Example: \"gpt-4o-mini\" (fast and cheap) or \"gpt-4o\"."
default = "gpt-4o-mini"

[[inputs]]
id = "llmmodel2"
label = "Second Model"
tooltip = "Model used by Compare Models to measure agreement with the first model. Same restrictions as Model."
default = "gpt-4o"

[[inputs]]
id = "tags"
label = "Tags"
tooltip = "A vector of tag strings. Any number of tags may apply to a document. Example: tags = [\"finance\", \"technology\", \"health\", \"politics\"]."
default = "tags"
models = ["tag"]

[[inputs]]
id = "categories"
label = "Categories"
tooltip = "A vector of mutually exclusive category strings (at most 40). Each document gets exactly one. Example: categories = [\"positive\", \"negative\", \"neutral\"]."
default = "categories"
models = ["classify"]

[[inputs]]
id = "k"
label = "Topics (k)"
tooltip = "Number of topics: where the hierarchical clustering of the document embeddings is cut."
default = "5"
models = ["topics"]

[[inputs]]
id = "question"
label = "Question"
tooltip = "A natural-language question about the corpus, as a Julia string. The most similar chunks are passed to the LLM as context. Example: \"What are the main risks mentioned across these reports?\"."
default = "question"
models = ["qa"]

[[inputs]]
id = "top-n"
label = "Context Chunks"
tooltip = "Number of retrieved chunks passed to the LLM as context."
default = "5"
models = ["qa"]

[[inputs]]
id = "gold-ids"
label = "Hand-Labelled Documents"
tooltip = "Indices of the documents you labelled by hand, for accuracy and Cohen kappa. Example: [1, 4, 7, 12]."
default = "Int[]"
models = ["tag", "classify"]

[[inputs]]
id = "gold-labels"
label = "Hand Labels"
tooltip = "Your labels for those documents, in the same order. Classify: one category each, e.g. [\"positive\", \"neutral\"]. Tag: the tags that apply to each, e.g. [[\"finance\"], [\"health\", \"politics\"]]."
default = "[]"
models = ["tag", "classify"]

[[inputs]]
id = "new-text"
label = "New Text"
tooltip = "A Julia string used by Apply to New Text: a document to tag, classify or place in a topic, or a follow-up question in Q&A mode."
default = "\"replace with a new document or question\""

[[codeBranches]]
model = "tag"
code = '''
using PromptingTools, StatisticalMeasures  # aiclassify; confusion matrices, accuracy, Cohen kappa

docs     = {{texts}}  # one string per document
tag_list = {{tags}}  # candidate tags; any number may apply to a document
llm      = "{{llmmodel}}"  # OpenAI chat model

# One yes/no judgement per (document, tag): aiclassify restricts the reply to a single true/false/unknown token
judge(d, t; model = llm) = aiclassify(:JudgeIsItTrue; it = "Document: $d\n\nStatement: the tag \"$t\" applies to this document.", model)
pairs_dt = vec(collect(Iterators.product(docs, tag_list)))  # (document, tag) pairs, documents varying fastest
run_tags(model) = reshape(asyncmap(p -> judge(p...; model), pairs_dt; ntasks = 10), length(docs), length(tag_list))

msgs   = run_tags(llm)  # N x T messages
tagmat = map(m -> m.content == "true", msgs)  # N x T Bool; "unknown" or an undecodable reply counts as not tagged
cost   = sum(m -> something(m.cost, 0.0), msgs)
confusion(a, b) = ConfusionMatrix(levels = ["false", "true"])(string.(a), string.(b))  # fixed levels, so a tag never used still works

for i in eachindex(docs)
    println("Doc $i: ", join(tag_list[tagmat[i, :]], ", "))
end
println("API cost: \$", round(cost; digits = 4), " (\$", round(cost / length(docs); digits = 5), " per document)")
'''

[[codeBranches]]
model = "classify"
code = '''
using PromptingTools, StatisticalMeasures  # aiclassify; confusion matrices, accuracy, Cohen kappa

docs = {{texts}}  # one string per document
cats = {{categories}}  # mutually exclusive categories
llm  = "{{llmmodel}}"  # OpenAI chat model

# aiclassify numbers the categories and forces a one-token reply, so each document gets exactly one
classify(d; model = llm) = aiclassify(:InputClassifier; choices = cats, input = d, model)
run_labels(model) = asyncmap(d -> classify(d; model), docs; ntasks = 10)

msgs   = run_labels(llm)
labels = [String(something(m.content, "unclassified")) for m in msgs]  # an undecodable reply becomes "unclassified"
cost   = sum(m -> something(m.cost, 0.0), msgs)
cat_levels = [cats; "unclassified"]
confusion(a, b) = ConfusionMatrix(levels = cat_levels)(a, b)  # fixed levels, so an unused category still works

for (i, l) in enumerate(labels)
    println("Doc $i: ", l)
end
println("API cost: \$", round(cost; digits = 4), " (\$", round(cost / length(docs); digits = 5), " per document)")
'''

[[codeBranches]]
model = "topics"
code = '''
using LLMTextAnalysis  # build_index, build_clusters!

docs = {{texts}}  # one string per document
llm  = "{{llmmodel}}"  # chat model that names and summarises the topics
k    = {{k}}  # number of topics

index = build_index(docs)  # OpenAI embeddings, cosine distances and keywords of every document
build_clusters!(index; k, add_label = true, add_summary = true, labeler_kwargs = (; model = llm))  # complete-linkage clustering cut at k
topics = index.topic_levels[k]
assign = zeros(Int, length(docs))  # topic of each document
for t in topics
    assign[t.docs_idx] .= t.topic_idx
end

for t in topics
    println(t.topic_idx, ". ", t.label, " (", length(t.docs_idx), " documents)")
    println("   ", t.summary)
end
'''

[[codeBranches]]
model = "qa"
code = '''
using PromptingTools, LinearAlgebra, SparseArrays, Unicode  # the last three load RAGTools
RT = PromptingTools.Experimental.RAGTools

docs  = {{texts}}  # one string per document
llm   = "{{llmmodel}}"  # chat model that writes the answer
top_n = {{top-n}}  # chunks passed to the LLM as context

rag_index = RT.build_index(docs; chunker_kwargs = (; sources = ["document $i" for i in eachindex(docs)]))  # chunk and embed
function ask(q; model = llm)
    tracker = Threads.Atomic{Float64}(0.0)
    r = RT.airag(rag_index; question = q, return_all = true, retriever_kwargs = (; top_n),
                 generator_kwargs = (; answerer_kwargs = (; model)), cost_tracker = tracker)
    (r, tracker[])
end

result, cost = ask({{question}})
println(result.final_answer)
println("\nSources: ", join(unique(result.sources), ", "), "   API cost: \$", round(cost; digits = 4))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "label-counts"
label = "Label Counts"
desc = "Documents per tag, category or topic; retrieval scores in Q&A mode"
code = '''
using Plots  # plotting

{{?model=tag}} bar(tag_list, vec(sum(tagmat, dims = 1)), legend = false, ylabel = "documents", title = "Documents per Tag", xrotation = 30)
{{?model=classify}} bar(cat_levels, [count(==(l), labels) for l in cat_levels], legend = false, ylabel = "documents", title = "Documents per Category", xrotation = 30)
{{?model=topics}} bar([t.label for t in topics], [length(t.docs_idx) for t in topics], legend = false, ylabel = "documents", title = "Documents per Topic", xrotation = 30)
{{?model=qa}} plot(result.emb_candidates.scores, marker = :o, legend = false, xlabel = "chunk rank", ylabel = "similarity to the question", title = "Retrieval Scores")
{{?model=qa}} vline!([top_n + 0.5], ls = :dash)  # chunks left of the line were passed to the LLM
'''

[[actionGroups.actions]]
id = "doc-map"
label = "Document Map"
desc = "Tag matrix, or a 2-D UMAP map of the document embeddings coloured by category or topic"
code = '''
using LLMTextAnalysis, Plots  # loading Plots enables the LLMTextAnalysis plot recipe

{{?model=tag}} heatmap(tag_list, 1:length(docs), Int.(tagmat), yflip = true, ylabel = "document", title = "Tag Assignments", colorbar = false)
{{?model=classify}} index = build_index(docs)  # embeddings for the map; the labels themselves came from aiclassify
{{?model=classify}} present = unique(labels)
{{?model=classify}} build_clusters!(index, [findfirst(==(l), present) for l in labels]; topic_level = "LLM categories", labels = present)
{{?model=classify}} plot(index; topic_level = "LLM categories", title = "Documents by LLM Category")
{{?model=topics}} plot(index; k, title = "Topics")  # UMAP needs more documents than its neighbourhood size
{{?model=qa}} println("Document Map does not apply to Q&A mode: the RAG index stores chunks, not documents.")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "hand-labels"
label = "Accuracy vs Hand Labels"
desc = "Accuracy, confusion matrix and Cohen kappa against the documents you labelled"
code = '''
ids  = {{gold-ids}}  # documents you labelled by hand
gold = {{gold-labels}}  # your labels, in the same order
{{?model=tag|classify}} isempty(ids) && error("Label a sample by hand first: set Hand-Labelled Documents and Hand Labels.")
{{?model=tag}} G = [t in g for g in gold, t in tag_list]  # hand tag matrix
{{?model=tag}} for (j, t) in enumerate(tag_list)
{{?model=tag}}     c = confusion(tagmat[ids, j], G[:, j])
{{?model=tag}}     println(rpad(t, 20), "accuracy ", round(accuracy(c); digits = 2), "   Cohen kappa ", round(kappa(c); digits = 2))
{{?model=tag}} end
{{?model=classify}} c = confusion(labels[ids], gold)  # rows: LLM, columns: hand labels
{{?model=classify}} println("accuracy ", round(accuracy(c); digits = 2), "   Cohen kappa ", round(kappa(c); digits = 2))
{{?model=classify}} c
{{?model=topics|qa}} println("Hand-label evaluation applies to the Tag and Classify modes.")
'''

[[actionGroups.actions]]
id = "evidence"
label = "Evidence"
desc = "Undecided judgements, topic keywords and central documents, or the retrieved context"
code = '''
{{?model=tag}} undecided = findall(m -> !(m.content in ("true", "false")), msgs)  # (document, tag) positions
{{?model=tag}} println(length(undecided), " of ", length(msgs), " judgements were unknown or undecodable")
{{?model=tag}} for c in first(undecided, 10)
{{?model=tag}}     println("  doc ", c[1], ", tag ", tag_list[c[2]], ": ", first(docs[c[1]], 80))
{{?model=tag}} end
{{?model=classify}} undecided = findall(==("unclassified"), labels)
{{?model=classify}} println(length(undecided), " of ", length(docs), " documents could not be decoded: ", undecided)
{{?model=topics}} for t in topics
{{?model=topics}}     println(t.topic_idx, ". ", t.label, ": keywords ", join(index.keywords_vocab[t.keywords_idx], ", "))
{{?model=topics}}     println("   central document: ", first(docs[t.docs_idx[t.center_doc_idx]], 120))
{{?model=topics}} end
{{?model=qa}} for (s, c) in zip(result.sources, result.context)  # what the answer was allowed to use
{{?model=qa}}     println("[", s, "] ", first(c, 200))
{{?model=qa}} end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "new-text"
label = "Apply to New Text"
desc = "Tag, classify or place a new document in a topic; ask a follow-up question in Q&A mode"
code = '''
new = {{new-text}}
{{?model=tag}} println("Tags: ", join([t for t in tag_list if judge(new, t).content == "true"], ", "))
{{?model=classify}} println("Category: ", something(classify(new).content, "unclassified"))
{{?model=topics}} # an embedding classifier trained on the topic assignments places the text without re-clustering
{{?model=topics}} cls = train_classifier(index, ["$(t.topic_idx). $(t.label)" for t in topics]; docs_ids = collect(eachindex(docs)), docs_labels = assign)
{{?model=topics}} println("Topic: ", only(score(build_index([new]; verbose = false), cls; return_labels = true, check_index = false)))
{{?model=qa}} r, c = ask(new)  # the new text is asked as a question
{{?model=qa}} println(r.final_answer, "\nSources: ", join(unique(r.sources), ", "))
'''

[[actionGroups.actions]]
id = "embedding-labels"
label = "Embedding Classifier"
desc = "Label every document from embeddings alone (train_classifier or train_concept) and measure agreement with the LLM"
code = '''
using LLMTextAnalysis  # build_index, train_classifier, train_concept, score

{{?model=tag|classify}} index = build_index(docs)  # OpenAI embeddings of every document
{{?model=classify}} ids, gold = {{gold-ids}}, {{gold-labels}}
{{?model=classify}} # trained on your hand labels when given (every category needed), else on LLM-written examples of each category
{{?model=classify}} cls = isempty(ids) ? train_classifier(index, cats; num_samples = 5, aigenerate_kwargs = (; model = llm)) :
{{?model=classify}}       train_classifier(index, cats; docs_ids = ids, docs_labels = [findfirst(==(g), cats) for g in gold])
{{?model=classify}} emb = score(index, cls; return_labels = true)  # one category per document, no further LLM calls
{{?model=classify}} println("Agreement with aiclassify: Cohen kappa ", round(kappa(confusion(emb, labels)); digits = 2))
{{?model=tag}} # one concept per tag: the LLM rewrites sample documents through the tag and a logistic model learns that direction
{{?model=tag}} S = reduce(hcat, [score(index, train_concept(index, t; num_samples = min(20, length(docs)), aigenerate_kwargs = (; model = llm))) for t in tag_list])
{{?model=tag}} for (j, t) in enumerate(tag_list)
{{?model=tag}}     println(rpad(t, 20), "agreement with aiclassify: Cohen kappa ", round(kappa(confusion(S[:, j] .> 0.5, tagmat[:, j])); digits = 2))
{{?model=tag}} end
{{?model=topics|qa}} println("The embedding classifier applies to the Tag and Classify modes.")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-models"
label = "Compare Models"
desc = "Run the same analysis with the second model and measure agreement (Cohen kappa)"
code = '''
llm2 = "{{llmmodel2}}"
{{?model=tag}} msgs2   = run_tags(llm2)
{{?model=tag}} tagmat2 = map(m -> m.content == "true", msgs2)
{{?model=tag}} for (j, t) in enumerate(tag_list)
{{?model=tag}}     println(rpad(t, 20), "Cohen kappa ", round(kappa(confusion(tagmat2[:, j], tagmat[:, j])); digits = 2))
{{?model=tag}} end
{{?model=tag}} println("API cost: $llm \$", round(cost; digits = 4), "   $llm2 \$", round(sum(m -> something(m.cost, 0.0), msgs2); digits = 4))
{{?model=classify}} labels2 = [String(something(m.content, "unclassified")) for m in run_labels(llm2)]
{{?model=classify}} c = confusion(labels2, labels)  # rows: second model, columns: first model
{{?model=classify}} println("Cohen kappa between $llm and $llm2: ", round(kappa(c); digits = 2))
{{?model=classify}} c
{{?model=topics}} saved = index.topic_levels[k]  # same clusters, relabelled by the second model
{{?model=topics}} build_clusters!(index; k, add_label = true, add_summary = false, labeler_kwargs = (; model = llm2))
{{?model=topics}} for (a, b) in zip(saved, index.topic_levels[k])
{{?model=topics}}     println(a.topic_idx, ". ", a.label, "   |   ", b.label)
{{?model=topics}} end
{{?model=topics}} index.topic_levels[k] = saved  # restore the labels and summaries of the first model
{{?model=qa}} r2, cost2 = ask({{question}}; model = llm2)
{{?model=qa}} println(llm, ":\n", result.final_answer, "\n\n", llm2, ":\n", r2.final_answer)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "view-results"
label = "View Results"
desc = "Result for every document, or the answer with its sources in Q&A mode"
code = '''
{{?model=tag}} for i in eachindex(docs)
{{?model=tag}}     println("Doc $i [", join(tag_list[tagmat[i, :]], ", "), "]: ", first(docs[i], 100))
{{?model=tag}} end
{{?model=classify}} for i in eachindex(docs)
{{?model=classify}}     println("Doc $i [", labels[i], "]: ", first(docs[i], 100))
{{?model=classify}} end
{{?model=topics}} topic_label = Dict(t.topic_idx => t.label for t in topics)
{{?model=topics}} for i in eachindex(docs)
{{?model=topics}}     println("Doc $i [", topic_label[assign[i]], "]: ", first(docs[i], 100))
{{?model=topics}} end
{{?model=qa}} println(result.final_answer)
{{?model=qa}} println("\nSources: ", join(unique(result.sources), ", "))
'''

[[actionGroups.actions]]
id = "representative-docs"
label = "Representative Documents"
desc = "Example documents for each tag, category or topic; the retrieved chunks in Q&A mode"
code = '''
{{?model=tag}} for (j, t) in enumerate(tag_list)
{{?model=tag}}     println("[", t, "] ", count(tagmat[:, j]), " documents")
{{?model=tag}}     foreach(i -> println("   ", first(docs[i], 120)), first(findall(tagmat[:, j]), 3))
{{?model=tag}} end
{{?model=classify}} for l in cat_levels
{{?model=classify}}     println("[", l, "] ", count(==(l), labels), " documents")
{{?model=classify}}     foreach(i -> println("   ", first(docs[i], 120)), first(findall(==(l), labels), 3))
{{?model=classify}} end
