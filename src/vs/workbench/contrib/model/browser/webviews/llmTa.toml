id = "evidence"
label = "Evidence"
desc = "Replies that broke the format, topic keywords and central documents, or the retrieved context"
code = '''
{{?model=tag}} off = [(i, parse_tags(m.content)[2]) for (i, m) in enumerate(msgs)]
{{?model=tag}} off = filter(x -> !isempty(x[2]), off)  # replies with items that match no tag
{{?model=tag}} println(length(off), " of ", length(msgs), " replies contained items that match no tag (ignored)")
{{?model=tag}} foreach(x -> println("  doc ", x[1], ": ", join(x[2], "; ")), first(off, 10))
{{?model=classify}} off = findall(==("unclassified"), labels)
{{?model=classify}} println(length(off), " of ", length(docs), " replies matched no category")
{{?model=classify}} foreach(i -> println("  doc ", i, ": ", first(msgs[i].content, 80)), first(off, 10))
{{?model=topics}} for t in topics
{{?model=topics}}     println(t.topic_idx, ". ", t.label, ": keywords ", join(index.keywords_vocab[t.keywords_idx], ", "))
{{?model=topics}}     println("   central document: ", first(docs[t.docs_idx[t.center_doc_idx]], 120))
{{?model=topics}} end
{{?model=qa}} for (s, c) in zip(result.sources, result.context)  # what the answer was allowed to use
{{?model=qa}}     println("[", s, "] ", first(c, 200))
{{?model=qa}} end
