text = "Tag"
detail = "any number of predefined tags per document; one LLM call per document, with the reply checked against the tag list"

[[bullets]]
text = "Classify"
detail = "exactly one category per document; a reply that matches no category is counted as unclassified"

[[bullets]]
text = "Topics"
detail = "hierarchical clustering of document embeddings, cut at k; the LLM labels and summarises each cluster (build_clusters!)"

[[bullets]]
text = "Q&A"
detail = "retrieval-augmented generation: the most similar chunks are passed to the LLM as context (RAGTools airag)"

[[bullets]]
text = "Providers"
detail = "chat from Ollama (local open models such as Gemma, no key), Anthropic, Google, OpenAI or Mistral; embeddings from Ollama, Google, OpenAI or Mistral"

[[bullets]]
text = "Evaluation"
detail = "accuracy and Cohen kappa against a hand-labelled sample and between two models (StatisticalMeasures.jl), plus token counts"

