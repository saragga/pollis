{{?model=classify}} bar(cat_levels, [count(==(l), labels) for l in cat_levels], legend = false, ylabel = "documents", title = "Documents per Category", xrotation = 30)
{{?model=topics}} bar([t.label for t in topics], [length(t.docs_idx) for t in topics], legend = false, ylabel = "documents", title = "Documents per Topic", xrotation = 30)
{{?model=qa}} plot(result.emb_candidates.scores, marker = :o, legend = false, xlabel = "chunk rank", ylabel = "similarity to the question", title = "Retrieval Scores")
{{?model=qa}} vline!([top_n + 0.5], ls = :dash)  # chunks left of the line were passed to the LLM
