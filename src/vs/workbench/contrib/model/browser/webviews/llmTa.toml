new = {{new-text}}
{{?model=tag}} println("Tags: ", join(tag_list[parse_tags(tag_reply(new).content)[1]], ", "))
{{?model=classify}} println("Category: ", match_cat(classify(new).content))
{{?model=topics}} # an embedding classifier trained on the topic assignments places the text without re-clustering
{{?model=topics}} cls = train_classifier(index, ["$(t.topic_idx). $(t.label)" for t in topics]; docs_ids = collect(eachindex(docs)), docs_labels = assign, aiembed_kwargs = emb)
{{?model=topics}} println("Topic: ", only(score(build_index([new]; verbose = false, aiembed_kwargs = emb), cls; return_labels = true, check_index = false)))
{{?model=qa}} r, n = ask(new)  # the new text is asked as a question
{{?model=qa}} println(r.final_answer, "\nSources: ", join(unique(r.sources), ", "))
'''

[[actionGroups.actions]]
id = "embedding-labels"
label = "Embedding Classifier"
desc = "Label every document from embeddings alone (train_classifier or train_concept) and measure agreement with the chat model"
code = '''
using LLMTextAnalysis  # build_index, train_classifier, train_concept, score

{{?model=tag|classify}} index = build_index(docs; aiembed_kwargs = emb)  # embeddings of every document
{{?model=classify}} ids, gold = {{gold-ids}}, {{gold-labels}}
{{?model=classify}} # trained on your hand labels when given (every category needed), else on LLM-written examples of each category
{{?model=classify}} cls = isempty(ids) ? train_classifier(index, cats; num_samples = 5, aigenerate_kwargs = (; model = llm), aiembed_kwargs = emb) :
{{?model=classify}}       train_classifier(index, cats; docs_ids = ids, docs_labels = [findfirst(==(g), cats) for g in gold], aiembed_kwargs = emb)
{{?model=classify}} emb_labels = score(index, cls; return_labels = true)  # one category per document, no further LLM calls
{{?model=classify}} println("Agreement with the chat model: Cohen kappa ", round(kappa(confusion(emb_labels, labels)); digits = 2))
{{?model=tag}} # one concept per tag: the LLM rewrites sample documents through the tag and a logistic model learns that direction
{{?model=tag}} S = reduce(hcat, [score(index, train_concept(index, t; num_samples = min(20, length(docs)), aigenerate_kwargs = (; model = llm), aiembed_kwargs = emb)) for t in tag_list])
{{?model=tag}} for (j, t) in enumerate(tag_list)
{{?model=tag}}     println(rpad(t, 20), "agreement with the chat model: Cohen kappa ", round(kappa(confusion(S[:, j] .> 0.5, tagmat[:, j])); digits = 2))
{{?model=tag}} end
{{?model=topics|qa}} println("The embedding classifier applies to the Tag and Classify modes.")
'''

