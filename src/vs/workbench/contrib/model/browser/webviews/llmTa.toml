[[actionGroups.actions]]
id = "hand-labels"
label = "Accuracy vs Hand Labels"
desc = "Accuracy, confusion matrix and Cohen kappa against the documents you labelled"
code = '''
ids  = {{gold-ids}}  # documents you labelled by hand
gold = {{gold-labels}}  # your labels, in the same order
{{?model=tag|classify}} isempty(ids) && error("Label a sample by hand first: set Hand-Labelled Documents and Hand Labels.")
{{?model=tag}} G = [t in g for g in gold, t in tag_list]  # hand tag matrix
{{?model=tag}} for (j, t) in enumerate(tag_list)
{{?model=tag}}     c = confusion(tagmat[ids, j], G[:, j])
{{?model=tag}}     println(rpad(t, 20), "accuracy ", round(accuracy(c); digits = 2), "   Cohen kappa ", round(kappa(c); digits = 2))
{{?model=tag}} end
{{?model=classify}} c = confusion(labels[ids], gold)  # rows: LLM, columns: hand labels
{{?model=classify}} println("accuracy ", round(accuracy(c); digits = 2), "   Cohen kappa ", round(kappa(c); digits = 2))
{{?model=classify}} c
{{?model=topics|qa}} println("Hand-label evaluation applies to the Tag and Classify modes.")
'''

