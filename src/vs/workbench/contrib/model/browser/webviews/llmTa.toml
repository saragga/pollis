[[codeBranches]]
model = "tag"
code = '''
using PromptingTools  # aigenerate, aiembed and the model registry
PT = PromptingTools

# Register each model name with its provider, so any current model works (the built-in model list of PromptingTools is older)
use_model(name, schema) = (haskey(PT.MODEL_REGISTRY, name) && PT.MODEL_REGISTRY[name].schema isa typeof(schema)) || PT.register_model!(; name, schema)
# Temperature 0 for repeatable answers; Ollama takes it inside options
fixed_temperature(model) = PT.MODEL_REGISTRY[model].schema isa PT.AbstractOllamaSchema ? (; options = (; temperature = 0)) : (; temperature = 0)

{{?chat-provider=ollama}} llm = "{{chat-ollama}}"; use_model(llm, PT.OllamaSchema())  # local, no key; first run: ollama pull {{chat-ollama}}
{{?chat-provider=anthropic}} llm = "{{chat-anthropic}}"; use_model(llm, PT.AnthropicSchema())  # needs ANTHROPIC_API_KEY
{{?chat-provider=google}} llm = "{{chat-google}}"; use_model(llm, PT.GoogleOpenAISchema())  # needs GOOGLE_API_KEY
{{?chat-provider=openai}} llm = "{{chat-openai}}"; use_model(llm, PT.OpenAISchema())  # needs OPENAI_API_KEY
{{?chat-provider=mistral}} llm = "{{chat-mistral}}"; use_model(llm, PT.MistralOpenAISchema())  # needs MISTRAL_API_KEY
{{?embed-provider=ollama}} emb_model = "{{embed-ollama}}"; use_model(emb_model, PT.OllamaSchema())  # local, no key; first run: ollama pull {{embed-ollama}}
{{?embed-provider=google}} emb_model = "{{embed-google}}"; use_model(emb_model, PT.GoogleOpenAISchema())  # needs GOOGLE_API_KEY
{{?embed-provider=openai}} emb_model = "{{embed-openai}}"; use_model(emb_model, PT.OpenAISchema())  # needs OPENAI_API_KEY
{{?embed-provider=mistral}} emb_model = "{{embed-mistral}}"; use_model(emb_model, PT.MistralOpenAISchema())  # needs MISTRAL_API_KEY
emb = (; model = emb_model)  # passed to every embedding call
tokens(msgs) = sum(m -> sum(m.tokens), msgs)  # prompt + reply tokens, comparable across providers

using StatisticalMeasures  # confusion matrices, accuracy, Cohen kappa

docs     = {{texts}}  # one string per document
tag_list = {{tags}}  # candidate tags; any number may apply to a document

# One call per document; the reply is checked against the tag list, so a model that breaks the format cannot invent tags
tag_prompt(d) = "Tags: " * join(tag_list, "; ") * "\n\nDocument: " * d *
    "\n\nReply with the tags that apply to the document, exactly as written above and separated by semicolons, or with none. Reply with nothing else."
clean(s) = lowercase(strip(s, collect(" .\"*`")))  # drop spaces, quotes and markdown around an item
function parse_tags(reply)  # (Bool per tag, reply items that match no tag)
    items = filter(!isempty, clean.(split(reply, r"[;,\n]")))
    ([clean(t) in items for t in tag_list], filter(i -> i != "none" && !(i in clean.(tag_list)), items))
end
tag_reply(d; model = llm) = aigenerate(tag_prompt(d); model, api_kwargs = fixed_temperature(model), verbose = false)
run_tags(model) = asyncmap(d -> tag_reply(d; model), docs; ntasks = 10)
tag_matrix(msgs) = permutedims(reduce(hcat, [parse_tags(m.content)[1] for m in msgs]))  # N x T Bool

msgs   = run_tags(llm)
tagmat = tag_matrix(msgs)
confusion(a, b) = ConfusionMatrix(levels = ["false", "true"])(string.(a), string.(b))  # fixed levels, so a tag never used still works

for i in eachindex(docs)
    println("Doc $i: ", join(tag_list[tagmat[i, :]], ", "))
end
println("LLM tokens: ", tokens(msgs), " (", round(Int, tokens(msgs) / length(docs)), " per document)")
'''

[[codeBranches]]
model = "classify"
code = '''
using PromptingTools  # aigenerate, aiembed and the model registry
PT = PromptingTools

# Register each model name with its provider, so any current model works (the built-in model list of PromptingTools is older)
use_model(name, schema) = (haskey(PT.MODEL_REGISTRY, name) && PT.MODEL_REGISTRY[name].schema isa typeof(schema)) || PT.register_model!(; name, schema)
# Temperature 0 for repeatable answers; Ollama takes it inside options
fixed_temperature(model) = PT.MODEL_REGISTRY[model].schema isa PT.AbstractOllamaSchema ? (; options = (; temperature = 0)) : (; temperature = 0)

{{?chat-provider=ollama}} llm = "{{chat-ollama}}"; use_model(llm, PT.OllamaSchema())  # local, no key; first run: ollama pull {{chat-ollama}}
{{?chat-provider=anthropic}} llm = "{{chat-anthropic}}"; use_model(llm, PT.AnthropicSchema())  # needs ANTHROPIC_API_KEY
{{?chat-provider=google}} llm = "{{chat-google}}"; use_model(llm, PT.GoogleOpenAISchema())  # needs GOOGLE_API_KEY
{{?chat-provider=openai}} llm = "{{chat-openai}}"; use_model(llm, PT.OpenAISchema())  # needs OPENAI_API_KEY
{{?chat-provider=mistral}} llm = "{{chat-mistral}}"; use_model(llm, PT.MistralOpenAISchema())  # needs MISTRAL_API_KEY
{{?embed-provider=ollama}} emb_model = "{{embed-ollama}}"; use_model(emb_model, PT.OllamaSchema())  # local, no key; first run: ollama pull {{embed-ollama}}
{{?embed-provider=google}} emb_model = "{{embed-google}}"; use_model(emb_model, PT.GoogleOpenAISchema())  # needs GOOGLE_API_KEY
{{?embed-provider=openai}} emb_model = "{{embed-openai}}"; use_model(emb_model, PT.OpenAISchema())  # needs OPENAI_API_KEY
{{?embed-provider=mistral}} emb_model = "{{embed-mistral}}"; use_model(emb_model, PT.MistralOpenAISchema())  # needs MISTRAL_API_KEY
emb = (; model = emb_model)  # passed to every embedding call
tokens(msgs) = sum(m -> sum(m.tokens), msgs)  # prompt + reply tokens, comparable across providers

using StatisticalMeasures  # confusion matrices, accuracy, Cohen kappa

docs = {{texts}}  # one string per document
cats = {{categories}}  # mutually exclusive categories

# One call per document; a reply that matches no category exactly (ignoring case) becomes "unclassified"
cat_prompt(d) = "Categories: " * join(cats, "; ") * "\n\nDocument: " * d *
    "\n\nReply with the one category that fits the document best, exactly as written above. Reply with nothing else."
clean(s) = lowercase(strip(s, collect(" .\"*`\n")))  # drop spaces, quotes and markdown around the reply
match_cat(reply) = (i = findfirst(c -> clean(c) == clean(reply), cats); isnothing(i) ? "unclassified" : cats[i])
classify(d; model = llm) = aigenerate(cat_prompt(d); model, api_kwargs = fixed_temperature(model), verbose = false)
run_labels(model) = asyncmap(d -> classify(d; model), docs; ntasks = 10)

msgs   = run_labels(llm)
labels = [match_cat(m.content) for m in msgs]
cat_levels = [cats; "unclassified"]
confusion(a, b) = ConfusionMatrix(levels = cat_levels)(a, b)  # fixed levels, so an unused category still works

for (i, l) in enumerate(labels)
    println("Doc $i: ", l)
end
println("LLM tokens: ", tokens(msgs), " (", round(Int, tokens(msgs) / length(docs)), " per document)")
'''

