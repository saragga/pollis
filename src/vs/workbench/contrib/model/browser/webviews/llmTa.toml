code = '''
using PromptingTools  # aigenerate, aiembed and the model registry
PT = PromptingTools

# Register each model name with its provider, so any current model works (the built-in model list of PromptingTools is older)
use_model(name, schema) = (haskey(PT.MODEL_REGISTRY, name) && PT.MODEL_REGISTRY[name].schema isa typeof(schema)) || PT.register_model!(; name, schema)
# Temperature 0 for repeatable answers; Ollama takes it inside options
fixed_temperature(model) = PT.MODEL_REGISTRY[model].schema isa PT.AbstractOllamaSchema ? (; options = (; temperature = 0)) : (; temperature = 0)

{{?chat-provider=ollama}} llm = "{{chat-ollama}}"; use_model(llm, PT.OllamaSchema())  # local, no key; first run: ollama pull {{chat-ollama}}
{{?chat-provider=anthropic}} llm = "{{chat-anthropic}}"; use_model(llm, PT.AnthropicSchema())  # needs ANTHROPIC_API_KEY
{{?chat-provider=google}} llm = "{{chat-google}}"; use_model(llm, PT.GoogleOpenAISchema())  # needs GOOGLE_API_KEY
{{?chat-provider=openai}} llm = "{{chat-openai}}"; use_model(llm, PT.OpenAISchema())  # needs OPENAI_API_KEY
{{?chat-provider=mistral}} llm = "{{chat-mistral}}"; use_model(llm, PT.MistralOpenAISchema())  # needs MISTRAL_API_KEY
{{?embed-provider=ollama}} emb_model = "{{embed-ollama}}"; use_model(emb_model, PT.OllamaSchema())  # local, no key; first run: ollama pull {{embed-ollama}}
{{?embed-provider=google}} emb_model = "{{embed-google}}"; use_model(emb_model, PT.GoogleOpenAISchema())  # needs GOOGLE_API_KEY
{{?embed-provider=openai}} emb_model = "{{embed-openai}}"; use_model(emb_model, PT.OpenAISchema())  # needs OPENAI_API_KEY
{{?embed-provider=mistral}} emb_model = "{{embed-mistral}}"; use_model(emb_model, PT.MistralOpenAISchema())  # needs MISTRAL_API_KEY
emb = (; model = emb_model)  # passed to every embedding call
tokens(msgs) = sum(m -> sum(m.tokens), msgs)  # prompt + reply tokens, comparable across providers

using LLMTextAnalysis  # build_index, build_clusters!

docs = {{texts}}  # one string per document
k    = {{k}}  # number of topics

index = build_index(docs; aiembed_kwargs = emb)  # embeddings, cosine distances and keywords of every document
# complete-linkage clustering cut at k; the chat model names and summarises each cluster
build_clusters!(index; k, add_label = true, add_summary = true, labeler_kwargs = (; model = llm, api_kwargs = fixed_temperature(llm)))
topics = index.topic_levels[k]
assign = zeros(Int, length(docs))  # topic of each document
for t in topics
    assign[t.docs_idx] .= t.topic_idx
end

for t in topics
    println(t.topic_idx, ". ", t.label, " (", length(t.docs_idx), " documents)")
    println("   ", t.summary)
end
'''

