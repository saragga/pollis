# LLM Text Analysis Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/llmTa.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "LLM Text Analysis"
viewType = "pollis.llm-ta"
defaultModel = "tag"

[[packages]]
name = "LLMTextAnalysis.jl"
github = "https://github.com/svilupp/LLMTextAnalysis.jl"

[[packages]]
name = "PromptingTools.jl"
github = "https://github.com/svilupp/PromptingTools.jl"

[[packages]]
name = "StatisticalMeasures.jl"
github = "https://github.com/JuliaAI/StatisticalMeasures.jl"

[requires]
packages = ["LLMTextAnalysis.jl", "PromptingTools.jl", "StatisticalMeasures.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Document Tagging"
file = "llm-ta/tutorial-01-tagging.ipynb"
bundled = true
description = "Tag a corpus with predefined labels: one LLM call per document, local (Ollama) or hosted"

[[notebookSections.notebooks]]
name = "Document Classification"
file = "llm-ta/tutorial-02-classification.ipynb"
bundled = true
description = "Classify documents into mutually exclusive categories with an LLM and check them against hand labels"

[[notebookSections.notebooks]]
name = "Topic Discovery"
file = "llm-ta/tutorial-03-topics.ipynb"
bundled = true
description = "Cluster a corpus into topics and have an LLM label and summarise each one with build_clusters!"

[[notebookSections.notebooks]]
name = "Semantic Q&A"
file = "llm-ta/tutorial-04-qa.ipynb"
bundled = true
description = "Answer questions about a document corpus using retrieval-augmented generation (RAGTools airag)"

