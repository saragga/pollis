[[actionGroups.actions]]
id = "compare-models"
label = "Compare Models"
desc = "Run the same analysis with the second model, from any provider, and measure agreement (Cohen kappa)"
code = '''
{{?chat-provider2=ollama}} llm2 = "{{chat2-ollama}}"; use_model(llm2, PT.OllamaSchema())  # local, no key; first run: ollama pull {{chat2-ollama}}
{{?chat-provider2=anthropic}} llm2 = "{{chat2-anthropic}}"; use_model(llm2, PT.AnthropicSchema())  # needs ANTHROPIC_API_KEY
{{?chat-provider2=google}} llm2 = "{{chat2-google}}"; use_model(llm2, PT.GoogleOpenAISchema())  # needs GOOGLE_API_KEY
{{?chat-provider2=openai}} llm2 = "{{chat2-openai}}"; use_model(llm2, PT.OpenAISchema())  # needs OPENAI_API_KEY
{{?chat-provider2=mistral}} llm2 = "{{chat2-mistral}}"; use_model(llm2, PT.MistralOpenAISchema())  # needs MISTRAL_API_KEY
{{?model=tag}} msgs2   = run_tags(llm2)
{{?model=tag}} tagmat2 = tag_matrix(msgs2)
{{?model=tag}} for (j, t) in enumerate(tag_list)
{{?model=tag}}     println(rpad(t, 20), "Cohen kappa ", round(kappa(confusion(tagmat2[:, j], tagmat[:, j])); digits = 2))
{{?model=tag}} end
{{?model=tag}} println("LLM tokens: $llm ", tokens(msgs), "   $llm2 ", tokens(msgs2))
{{?model=classify}} msgs2   = run_labels(llm2)
{{?model=classify}} labels2 = [match_cat(m.content) for m in msgs2]
{{?model=classify}} c = confusion(labels2, labels)  # rows: second model, columns: first model
{{?model=classify}} println("Cohen kappa between $llm and $llm2: ", round(kappa(c); digits = 2), "   LLM tokens: ", tokens(msgs), " vs ", tokens(msgs2))
{{?model=classify}} c
{{?model=topics}} saved = index.topic_levels[k]  # same clusters, relabelled by the second model
{{?model=topics}} build_clusters!(index; k, add_label = true, add_summary = false, labeler_kwargs = (; model = llm2, api_kwargs = fixed_temperature(llm2)))
{{?model=topics}} for (a, b) in zip(saved, index.topic_levels[k])
{{?model=topics}}     println(a.topic_idx, ". ", a.label, "   |   ", b.label)
{{?model=topics}} end
{{?model=topics}} index.topic_levels[k] = saved  # restore the labels and summaries of the first model
{{?model=qa}} r2, ntokens2 = ask({{question}}; model = llm2)
{{?model=qa}} println(llm, ":\n", result.final_answer, "\n\n", llm2, ":\n", r2.final_answer)
'''

