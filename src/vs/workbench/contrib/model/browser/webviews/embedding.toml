[[codeBranches]]
model = "tsne"
code = '''
using TSne, Distances, Statistics, Random

X = {{X}}  # n x p feature matrix, one row per observation
d = {{d}}  # embedding dimensions

embed(perplexity) = tsne(X, d, 0, {{maxiter}}, perplexity; eta={{eta}})  # n x d; reduce_dims=0 skips the initial PCA
grid = [5, 15, 30, 50]  # perplexities compared by the sweep action
par  = {{perplexity}}

Random.seed!(1)  # t-SNE starts from random positions
Y = embed(par)

function trustworthiness(Y, m=10)  # share of embedding neighbours that were also near in X (1 = perfect)
    n  = size(X, 1)
    Dx = pairwise(Euclidean(), X, dims=1)
    Dy = pairwise(Euclidean(), Y, dims=1)
    penalty = 0.0
    for i in 1:n
        rank_x = invperm(sortperm(Dx[i, :])) .- 1  # rank 0 = the point itself
        for j in sortperm(Dy[i, :])[2:m+1]
            penalty += max(rank_x[j] - m, 0)
        end
    end
    1 - 2 * penalty / (n * m * (2n - 3m - 1))
end
trustworthiness(Y)
'''

[[codeBranches]]
model = "umap"
code = '''
using UMAP, Distances, Statistics, Random

X  = {{X}}  # n x p feature matrix, one row per observation
d  = {{d}}  # embedding dimensions
Xt = permutedims(X)  # UMAP.jl expects features x samples

fit_umap(nn) = UMAP.fit(Xt, d; n_neighbors=nn, min_dist={{mindist}})  # fuzzy k-NN graph, then cross-entropy layout
embed(nn) = permutedims(reduce(hcat, fit_umap(nn).embedding))  # n x d (the embedding is a list of points)
grid = [5, 10, 15, 30, 50]  # n_neighbors values compared by the sweep action
par  = {{nn}}

Random.seed!(1)  # the layout starts from a random (spectral + noise) initialisation
model = fit_umap(par)
Y = permutedims(reduce(hcat, model.embedding))  # n x d embedding

function trustworthiness(Y, m=10)  # share of embedding neighbours that were also near in X (1 = perfect)
    n  = size(X, 1)
    Dx = pairwise(Euclidean(), X, dims=1)
    Dy = pairwise(Euclidean(), Y, dims=1)
    penalty = 0.0
    for i in 1:n
        rank_x = invperm(sortperm(Dx[i, :])) .- 1  # rank 0 = the point itself
        for j in sortperm(Dy[i, :])[2:m+1]
            penalty += max(rank_x[j] - m, 0)
        end
    end
    1 - 2 * penalty / (n * m * (2n - 3m - 1))
end
trustworthiness(Y)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "scatter"
label = "Embedding Scatter"
desc = "The first two embedding coordinates (pass your own labels or values as colour)"
code = '''
using Plots

colour = 1:size(X, 1)  # replace with class labels or a variable of interest
scatter(Y[:, 1], Y[:, 2], zcolor=colour, color=:viridis, markersize=3, markerstrokewidth=0, xlabel="axis 1", ylabel="axis 2", legend=false)
'''

[[actionGroups.actions]]
id = "label-scatter"
label = "Label Overlay"
desc = "Colour the embedding by a categorical label vector to judge class separation"
code = '''
using Plots

# labels: class vector of length n
scatter(Y[:, 1], Y[:, 2], group=labels, markersize=3, markerstrokewidth=0, xlabel="axis 1", ylabel="axis 2")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "trustworthiness"
label = "Trustworthiness"
desc = "Trustworthiness for 5 to 50 neighbours: how far the embedding's neighbourhoods can be trusted (1 = perfect)"
code = '''
using Plots

ms = [5, 10, 20, 30, 50]
plot(ms, [trustworthiness(Y, m) for m in ms], marker=:circle, xlabel="neighbours checked", ylabel="trustworthiness", legend=false)
'''

[[actionGroups.actions]]
id = "sweep"
label = "Perplexity / n_neighbors Sweep"
desc = "Trustworthiness at several perplexities (t-SNE) or n_neighbors (UMAP) to choose the setting"
code = '''
using Plots

scores = [(Random.seed!(1); trustworthiness(embed(g))) for g in grid]
{{?model=tsne}} plot(grid, scores, marker=:circle, xlabel="perplexity", ylabel="trustworthiness", legend=false)
{{?model=umap}} plot(grid, scores, marker=:circle, xlabel="n_neighbors", ylabel="trustworthiness", legend=false)
'''

[[actionGroups.actions]]
id = "seed-stability"
label = "Seed Stability"
desc = "Rerun with different random seeds and measure how many of each point's 10 embedding neighbours stay the same"
code = '''
knn(Z) = [Set(sortperm(r)[2:11]) for r in eachrow(pairwise(Euclidean(), Z, dims=1))]
base = knn(Y)
map(2:4) do seed
    Random.seed!(seed)
    mean(length(intersect(a, b)) / 10 for (a, b) in zip(base, knn(embed(par))))  # 1 = identical neighbourhoods
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "embed-new"
label = "Embed New Data"
desc = "UMAP places new points with its fitted graph; t-SNE has no mapping, so new points are rebuilt from their 10 nearest training points"
code = '''
{{?model=umap}} Y_new = permutedims(reduce(hcat, UMAP.transform(model, permutedims(X_new)).embedding))  # X_new: same columns as X; n_new x d
{{?model=tsne}} using LinearAlgebra
{{?model=tsne}} function place(x, m=10)
{{?model=tsne}}     nb = sortperm(vec(pairwise(Euclidean(), permutedims(x), X, dims=1)))[1:m]
{{?model=tsne}}     Z  = X[nb, :] .- permutedims(x)
{{?model=tsne}}     G  = Z * permutedims(Z)
{{?model=tsne}}     w  = (G + 1e-3 * tr(G) * I) \ ones(m)  # regularised reconstruction weights
{{?model=tsne}}     permutedims(w ./ sum(w)) * Y[nb, :]
{{?model=tsne}} end
{{?model=tsne}} Y_new = reduce(vcat, [place(x) for x in eachrow(X_new)])  # X_new: same columns as X; n_new x d
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-pca"
label = "vs PCA"
desc = "Trustworthiness and residual variance of this embedding against a linear PCA embedding of the same dimension"
code = '''
using LinearAlgebra

Xc  = X .- mean(X, dims=1)
Ypca = Xc * svd(Xc).V[:, 1:d]
Dx  = vec(pairwise(Euclidean(), X, dims=1))
resvar(Z) = 1 - cor(Dx, vec(pairwise(Euclidean(), Z, dims=1)))^2
(embedding = (trust = trustworthiness(Y), resvar = resvar(Y)), pca = (trust = trustworthiness(Ypca), resvar = resvar(Ypca)))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "feature-correlation"
label = "Feature Correlation"
desc = "Correlation between each original feature and each embedding axis, to see which features drive the layout"
code = '''
using Plots

C = cor(X, Y)  # features x axes
heatmap(1:size(C, 2), 1:size(C, 1), C, xlabel="axis", ylabel="feature", color=:balance, clims=(-1, 1))
'''

[[actionGroups.actions]]
id = "colour-scatter"
label = "Colour Scatter by Feature"
desc = "Overlay a feature value as a colour gradient on the 2D embedding"
code = '''
using Plots

j = 1  # feature to show
scatter(Y[:, 1], Y[:, 2], zcolor=X[:, j], color=:viridis, colorbar=true, markersize=4, markerstrokewidth=0,
    xlabel="axis 1", ylabel="axis 2", title=string("feature ", j), legend=false)
'''
