# Neighbour Embedding Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/embedding.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Neighbour Embedding"
viewType = "pollis.embedding"
defaultModel = "tsne"

[[packages]]
name = "TSne.jl"
github = "https://github.com/lejon/TSne.jl"

[[packages]]
name = "UMAP.jl"
github = "https://github.com/dillondaudert/UMAP.jl"

[requires]
packages = ["Plots.jl", "Distances.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "t-SNE"
file = "dim-reduction-embedding/tutorial-01-tsne.ipynb"
bundled = true
description = "t-SNE with TSne.jl — perplexity, learning rate, and 2-D/3-D neighbourhood embedding"

[[notebookSections.notebooks]]
name = "UMAP"
file = "dim-reduction-embedding/tutorial-02-umap.ipynb"
bundled = true
description = "UMAP with UMAP.jl — n_neighbors, min_dist, and topology-preserving embedding"

[[wikis]]
name = "Overview"
file = "dim-reduction-embedding/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "dim-reduction-embedding/factsheet.md"
bundled = true

[[wikis]]
name = "t-SNE"
file = "dim-reduction-embedding/tsne.md"
bundled = true

[[wikis]]
name = "UMAP"
file = "dim-reduction-embedding/umap.md"
bundled = true

[[references]]
separator = true
label = "Original Papers (from packages)"

[[references]]
title = "Visualizing Data using t-SNE"
authors = "van der Maaten, L. & Hinton, G."
year = 2008
journal = ""
url = "https://jmlr.org/papers/v9/vandermaaten08a.html"
openAccess = true

[[references]]
title = "UMAP: Uniform Manifold Approximation and Projection for Dimension Reduction"
authors = "McInnes, L., Healy, J. & Melville, J."
year = 2018
journal = ""
url = "https://arxiv.org/abs/1802.03426"
openAccess = true

[[models]]
id = "tsne"
label = "t-SNE"

[[models]]
id = "umap"
label = "UMAP"

[[bullets]]
text = "t-SNE"
detail = "models high-dimensional similarities with Gaussian kernels and low-dimensional similarities with a Student-t; minimises KL divergence via gradient descent (TSne.jl)"

[[bullets]]
text = "UMAP"
detail = "constructs a fuzzy topological representation of the high-dimensional graph then minimises cross-entropy to a low-dimensional analogue; faster and better at preserving global structure than t-SNE (UMAP.jl)"

[[decisionRows]]
task = "t-SNE"
context = "Visualising local cluster structure of a fixed data set"
purpose = "Match neighbour probabilities with a heavy-tailed Student-t in the embedding"

[[decisionRows]]
task = "UMAP"
context = "Larger data, more global structure, embedding new points later"
purpose = "Match a fuzzy k-NN graph with a low-dimensional one by cross-entropy"

[[inputs]]
id = "X"
label = "Feature Matrix"
tooltip = "n_samples × n_features matrix, one row per observation. Standardise the columns first when they are on different scales."
default = "X_train"

[[inputs]]
id = "d"
label = "Embedding Dimensions"
tooltip = "Number of output dimensions. 2 is standard for visualisation; 3 for interactive 3D plots."
default = "2"
newRow = true

[[inputs]]
id = "perplexity"
label = "Perplexity"
tooltip = "Effective number of neighbours per point. Typical range 5–50. Larger values give more globally coherent embeddings; smaller values emphasise local clusters."
default = "30"
models = ["tsne"]

[[inputs]]
id = "maxiter"
label = "max_iter"
tooltip = "Number of gradient descent iterations. 1000 is usually enough; increase for large data sets."
default = "1000"
models = ["tsne"]

[[inputs]]
id = "eta"
label = "Learning Rate"
tooltip = "Gradient descent step size (eta). 100–1000 is typical. Too small converges slowly; too large compresses the points into a ball."
default = "200.0"
models = ["tsne"]

[[inputs]]
id = "nn"
label = "n_neighbors"
tooltip = "Neighbours in the high-dimensional fuzzy graph. Smaller values capture local structure; larger values preserve more global topology."
default = "15"
models = ["umap"]

[[inputs]]
id = "mindist"
label = "min_dist"
tooltip = "Minimum distance between points in the embedding. Smaller values give tighter clusters; larger values spread points more evenly."
default = "0.1"
models = ["umap"]

[miniCharts]
