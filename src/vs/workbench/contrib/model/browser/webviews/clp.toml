[[bullets]]
text = "K-Means"
detail = "minimise total within-cluster squared distance to centroids via Lloyd’s algorithm (Clustering.jl)"

[[bullets]]
text = "K-Medoids"
detail = "minimise total distance to actual data points as cluster representatives (Clustering.jl)"

[[bullets]]
text = "Fuzzy C-Means"
detail = "soft assignments via weighted objective; each point belongs to all clusters with degrees (Clustering.jl)"

[[bullets]]
text = "DBSCAN"
detail = "density-based; discovers arbitrary-shaped clusters and labels noise points explicitly (Clustering.jl)"

[[bullets]]
text = "GMM"
detail = "probabilistic model; EM algorithm fits a mixture of Gaussians with full soft membership (BetaML.jl)"

[[bullets]]
text = "Spectral"
detail = "normalised graph Laplacian eigenvectors embed the data; k-means clusters the embedding (Clustering.jl)"

[[decisionRows]]
task = "K-Means"
context = "Compact, roughly spherical clusters of similar size; large n"
purpose = "Minimise within-cluster squared distance to k centroids"

[[decisionRows]]
task = "K-Medoids"
context = "Outliers present, or only a dissimilarity matrix is available"
purpose = "Clusters represented by actual observations (medoids); robust to outliers"

[[decisionRows]]
task = "Fuzzy C-Means"
context = "Overlapping groups where points plausibly belong to several clusters"
purpose = "Soft membership degree of every point in every cluster"

[[decisionRows]]
task = "DBSCAN"
context = "Arbitrary shapes, unknown number of clusters, noise to discard"
purpose = "Dense regions become clusters; isolated points are labelled noise"

[[decisionRows]]
task = "GMM"
context = "Elliptical clusters of different sizes; probabilities wanted"
purpose = "Mixture of Gaussians fitted by EM with posterior membership probabilities"

[[decisionRows]]
task = "Spectral"
context = "Non-convex shapes (rings, moons) connected by local similarity"
purpose = "Cluster the leading eigenvectors of the graph Laplacian"

[[inputs]]
id = "X"
label = "Feature Matrix"
tooltip = "n_samples × n_features matrix of input features (one row per observation). Standardise the columns first when they are on different scales."
default = "X_train"

[[inputs]]
id = "k"
label = "k"
tooltip = "Number of clusters (Gaussian components for GMM; Laplacian eigenvectors for spectral clustering). Use the Choosing k action to compare values."
default = "3"
newRow = true
models = ["km", "kmed", "fcm", "gmm", "spectral"]

[[inputs]]
id = "maxiter"
label = "max_iter"
tooltip = "Maximum iterations: Lloyd updates (K-Means), swap passes (K-Medoids), membership updates (Fuzzy C-Means) or EM steps (GMM). Convergence is usually reached well before the limit."
default = "300"
models = ["km", "kmed", "fcm", "gmm"]

[[inputs]]
id = "tol"
label = "tol"
tooltip = "Convergence tolerance on the change in the objective between iterations."
default = "1e-6"
models = ["km"]

[[inputs]]
id = "fuzziness"
label = "fuzziness (m)"
tooltip = "Fuzziness exponent m > 1. Values near 1 approach hard clustering; m = 2 is the standard choice; larger m gives softer memberships."
default = "2.0"
models = ["fcm"]

[[inputs]]
id = "eps"
label = "epsilon"
tooltip = "Neighbourhood radius. Points within epsilon of each other are neighbours. Read it off the knee of the k-distance plot (Choosing k or Epsilon action)."
default = "0.5"
newRow = true
models = ["dbscan"]

[[inputs]]
id = "minpts"
label = "min_pts"
tooltip = "Minimum neighbours within epsilon for a point to be a core point. Points with fewer neighbours are border points or noise. A common start is 2 × n_features."
default = "5"
models = ["dbscan"]

[[inputs]]
id = "sigma"
label = "sigma"
tooltip = "Bandwidth of the RBF affinity W_ij = exp(-d_ij^2 / 2 sigma^2). Smaller sigma keeps only close neighbours connected."
default = "1.0"
models = ["spectral"]

