# Partitional & Density Clustering Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/clp.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Partitional & Density Clustering"
viewType = "pollis.clp"
defaultModel = "km"

[[packages]]
name = "Clustering.jl"
github = "https://github.com/JuliaStats/Clustering.jl"

[[packages]]
name = "BetaML.jl"
github = "https://github.com/sylvaticus/BetaML.jl"

[requires]
packages = ["Plots.jl", "Distances.jl", "DecisionTree.jl"]

