[[codeBranches]]
model = "km"
code = '''
using Clustering, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
Xt = permutedims(X)  # Clustering.jl expects p x n (one column per observation)
k  = {{k}}  # number of clusters

fit_labels(k) = assignments(kmeans(Xt, k; maxiter={{maxiter}}, tol={{tol}}))  # Lloyd's algorithm from random k-means++ seeds

result  = kmeans(Xt, k; maxiter={{maxiter}}, tol={{tol}})
labels  = assignments(result)  # cluster of each observation
centers = result.centers  # p x k centroids

[count(==(c), labels) for c in 1:maximum(labels)]  # cluster sizes
'''

[[codeBranches]]
model = "kmed"
code = '''
using Clustering, Distances, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
Xt = permutedims(X)  # Clustering.jl expects p x n (one column per observation)
k  = {{k}}  # number of clusters
D  = pairwise(Euclidean(), X, dims=1)  # n x n distance matrix (any dissimilarity works)

fit_labels(k) = assignments(kmedoids(D, k; maxiter={{maxiter}}))

result  = kmedoids(D, k; maxiter={{maxiter}})
labels  = assignments(result)  # cluster of each observation
medoids = result.medoids  # row indices of the representative observations

[count(==(c), labels) for c in 1:maximum(labels)]  # cluster sizes
'''

[[codeBranches]]
model = "fcm"
code = '''
using Clustering, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
Xt = permutedims(X)  # Clustering.jl expects p x n (one column per observation)
k  = {{k}}  # number of clusters
m  = {{fuzziness}}  # fuzziness exponent

fit_labels(k) = map(argmax, eachrow(fuzzy_cmeans(Xt, k, m; maxiter={{maxiter}}).weights))

result      = fuzzy_cmeans(Xt, k, m; maxiter={{maxiter}})
memberships = result.weights  # n x k membership degrees; each row sums to 1
labels      = map(argmax, eachrow(memberships))  # hard labels from the largest membership
centers     = result.centers  # p x k cluster centres

[count(==(c), labels) for c in 1:maximum(labels)]  # cluster sizes
'''

[[codeBranches]]
model = "dbscan"
code = '''
using Clustering, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
Xt = permutedims(X)  # Clustering.jl expects p x n (one column per observation)
radius = {{eps}}  # neighbourhood radius epsilon
minpts = {{minpts}}  # neighbours needed for a core point

result = dbscan(Xt, radius; min_neighbors=minpts)
labels = result.assignments  # 0 = noise, 1...k = cluster
k      = maximum(labels)  # number of clusters found
count(==(0), labels)  # number of noise points

[count(==(c), labels) for c in 1:maximum(labels)]  # cluster sizes
'''

[[codeBranches]]
model = "gmm"
code = '''
using BetaML, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
Xt = permutedims(X)  # Clustering.jl expects p x n (one column per observation)
k  = {{k}}  # number of Gaussian components

function fit_labels(k)
    gm = GaussianMixtureClusterer(n_classes=k, maximum_iterations={{maxiter}})
    fit!(gm, X)
    map(argmax, eachrow(predict(gm, X)))
end

model  = GaussianMixtureClusterer(n_classes=k, maximum_iterations={{maxiter}})  # EM from k-means initial means
fit!(model, X)
probs  = predict(model, X)  # n x k posterior membership probabilities
labels = map(argmax, eachrow(probs))  # most probable component

[count(==(c), labels) for c in 1:maximum(labels)]  # cluster sizes
'''

[[codeBranches]]
model = "spectral"
code = '''
using Clustering, Distances, LinearAlgebra, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
Xt = permutedims(X)  # Clustering.jl expects p x n (one column per observation)
k     = {{k}}  # number of clusters
sigma = {{sigma}}  # RBF bandwidth

W = exp.(-pairwise(SqEuclidean(), X, dims=1) ./ (2 * sigma^2))  # affinity matrix
d = vec(sum(W, dims=2))  # node degrees
L = I - Diagonal(d .^ -0.5) * W * Diagonal(d .^ -0.5)  # normalised graph Laplacian
vecs = eigen(Symmetric(L)).vectors  # eigenvalues in ascending order

function fit_labels(k)
    Z = vecs[:, 1:k]  # embedding: the k smallest eigenvectors
    Z = Z ./ sqrt.(sum(abs2, Z, dims=2))  # row-normalise (Ng, Jordan and Weiss)
    assignments(kmeans(permutedims(Z), k))
end

labels = fit_labels(k)  # cluster of each observation

[count(==(c), labels) for c in 1:maximum(labels)]  # cluster sizes
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "scatter"
label = "Cluster Scatter"
desc = "Observations on their first two principal components, coloured by cluster"
code = '''
using Plots, LinearAlgebra

Xc  = X .- mean(X, dims=1)  # centre the columns
pcs = Xc * svd(Xc).V[:, 1:2]  # scores on the first two principal components
scatter(pcs[:, 1], pcs[:, 2], group=labels, xlabel="PC1", ylabel="PC2", markersize=3, alpha=0.7)
'''

[[actionGroups.actions]]
id = "sizes"
label = "Cluster Sizes"
desc = "Number of observations in each cluster (noise shown as cluster 0 for DBSCAN)"
code = '''
using Plots

ids = sort(unique(labels))
bar(string.(ids), [count(==(c), labels) for c in ids], xlabel="cluster", ylabel="observations", legend=false)
'''

[[actionGroups.actions]]
id = "membership"
label = "Membership Uncertainty"
desc = "Histogram of each point's largest membership: values near 1 are confident, low values sit between clusters"
code = '''
using Plots

{{?model=fcm}} top = vec(maximum(memberships, dims=2))  # largest membership degree per observation
{{?model=gmm}} top = vec(maximum(probs, dims=2))  # largest posterior probability per observation
{{?model!=fcm|gmm}} top = Float64.(labels .> 0)  # hard clustering: always 1 (0 for DBSCAN noise)
histogram(top, bins=20, xlabel="largest membership", ylabel="observations", legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "silhouette"
label = "Silhouette Analysis"
desc = "Per-observation cohesion vs separation (-1 to 1); the mean summarises how well separated the clusters are"
code = '''
using Distances, Plots

keep   = labels .> 0  # excludes DBSCAN noise
D      = pairwise(Euclidean(), X[keep, :], dims=1)
scores = silhouettes(labels[keep], D)  # per-observation silhouette
order  = sortperm(collect(zip(labels[keep], -scores)))  # group by cluster, best first
bar(scores[order], group=labels[keep][order], linewidth=0, xlabel="observation", ylabel="silhouette")
hline!([mean(scores)], linestyle=:dash, label="mean")
'''

[[actionGroups.actions]]
id = "choose"
label = "Choosing k or Epsilon"
desc = "Mean silhouette over k = 2 to 10, or the k-distance plot whose knee suggests epsilon (DBSCAN)"
code = '''
using Distances, Plots

D = pairwise(Euclidean(), X, dims=1)
{{?model!=dbscan}} ks  = 2:10
{{?model!=dbscan}} sil = [mean(silhouettes(fit_labels(k), D)) for k in ks]
{{?model!=dbscan}} plot(ks, sil, marker=:circle, xlabel="k", ylabel="mean silhouette", legend=false)
{{?model=dbscan}} kdist = sort([sort(r)[minpts + 1] for r in eachrow(D)])  # distance to the min_pts-th neighbour
{{?model=dbscan}} plot(kdist, xlabel="observations sorted", ylabel="distance to neighbour min_pts", legend=false)
{{?model=dbscan}} hline!([radius], linestyle=:dash)
'''

[[actionGroups.actions]]
id = "stability"
label = "Stability"
desc = "Adjusted Rand index between repeated fits (or perturbed epsilon for DBSCAN): values near 1 mean the partition is reproducible"
code = '''
{{?model!=dbscan}} ari = [randindex(fit_labels(k), labels)[1] for _ in 1:20]  # restarts from new random seeds
{{?model=dbscan}} ari = [randindex(dbscan(Xt, s * radius; min_neighbors=minpts).assignments, labels)[1] for s in 0.8:0.1:1.2]
(mean = mean(ari), min = minimum(ari))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "assign-new"
label = "Assign New Data"
desc = "Cluster labels for new observations: nearest centre, posterior probability, or the label of the nearest training point"
code = '''
using Distances

{{?model=km|fcm}} new_labels = map(argmin, eachrow(pairwise(Euclidean(), X_new, permutedims(centers), dims=1)))  # nearest centre
{{?model=kmed}} new_labels = map(argmin, eachrow(pairwise(Euclidean(), X_new, X[medoids, :], dims=1)))  # nearest medoid
{{?model=gmm}} new_probs  = predict(model, X_new)  # posterior probabilities
{{?model=gmm}} new_labels = map(argmax, eachrow(new_probs))
{{?model=dbscan|spectral}} new_labels = labels[map(argmin, eachrow(pairwise(Euclidean(), X_new, X, dims=1)))]  # label of the nearest training point
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-kmeans"
label = "Agreement with K-Means"
desc = "Adjusted Rand index against K-Means with the same number of clusters (against K-Medoids for K-Means itself)"
code = '''
using Distances

kk = maximum(labels)
{{?model!=km}} other = assignments(kmeans(Xt, kk))
{{?model=km}} other = assignments(kmedoids(pairwise(Euclidean(), X, dims=1), kk))
randindex(labels, other)  # (adjusted Rand, Rand, Mirkin, Hubert); adjusted Rand near 1 = same partition
'''

[[actionGroups.actions]]
id = "vs-random"
label = "vs Random Labels"
desc = "Mean silhouette against a random partition with the same cluster sizes: the gap is the structure found"
code = '''
using Distances, Random

keep = labels .> 0  # excludes DBSCAN noise
D    = pairwise(Euclidean(), X[keep, :], dims=1)
found  = mean(silhouettes(labels[keep], D))
random = mean(mean(silhouettes(shuffle(labels[keep]), D)) for _ in 1:20)
(found = found, random = random)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "profiles"
label = "Cluster Profiles"
desc = "Per-cluster feature means and standard deviations to characterise what each cluster represents"
code = '''
ids   = sort(unique(labels))  # 0 = DBSCAN noise
means = [mean(X[labels .== c, j]) for c in ids, j in 1:size(X, 2)]  # clusters x features
sds   = [std(X[labels .== c, j]) for c in ids, j in 1:size(X, 2)]
(clusters = ids, means = means, sds = sds)
'''

[[actionGroups.actions]]
id = "distinguishing"
label = "Distinguishing Features"
desc = "Standardised difference between each cluster's mean and the overall mean: large values name what sets a cluster apart"
code = '''
using Plots

ids = sort(unique(labels))
z   = [(mean(X[labels .== c, j]) - mean(X[:, j])) / std(X[:, j]) for c in ids, j in 1:size(X, 2)]
heatmap(1:size(X, 2), string.(ids), z, xlabel="feature", ylabel="cluster", color=:balance, clims=(-maximum(abs, z), maximum(abs, z)))
'''

[[actionGroups.actions]]
id = "surrogate"
label = "Surrogate Tree Rules"
desc = "A shallow decision tree trained to reproduce the clusters: its splits give readable rules and its accuracy says how faithful they are"
code = '''
using DecisionTree

tree = DecisionTreeClassifier(max_depth=3)
fit!(tree, X, labels)
print_tree(tree)  # feature thresholds that separate the clusters
mean(predict(tree, X) .== labels)  # fidelity: share of observations the rules place correctly
'''
