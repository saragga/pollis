[[codeBranches]]
model = "cca"
code = '''
using MultivariateStats, Statistics

X = {{X}}  # n x p, one row per observation
Y = {{Y}}  # n x q, same rows as X
k = {{k}}  # canonical dimensions, k <= min(p, q)

function fit_cc(X, Y, k)
    M = fit(CCA, permutedims(X), permutedims(Y); outdim=k)  # centres internally; expects variables x observations
    (px = A -> permutedims(predict(M, permutedims(A), :x)), py = B -> permutedims(predict(M, permutedims(B), :y)),
     Ax = projection(M, :x), Ay = projection(M, :y))  # p x k and q x k canonical coefficients
end

m      = fit_cc(X, Y, k)
Zx, Zy = m.px(X), m.py(Y)  # n x k canonical variates
rho    = [cor(Zx[:, j], Zy[:, j]) for j in 1:k]  # correlation of each variate pair
'''

[[codeBranches]]
model = "rcca"
code = '''
using LinearAlgebra, Statistics

X = {{X}}  # n x p, one row per observation
Y = {{Y}}  # n x q, same rows as X
k = {{k}}  # canonical dimensions, k <= min(p, q)
lambda = {{lambda}}  # ridge penalty on the within-set covariances

function fit_cc(X, Y, k)
    mx, my = mean(X, dims=1), mean(Y, dims=1)
{{?scaling=standardise}}     sx, sy = std(X, dims=1), std(Y, dims=1)
{{?scaling=centre}}     sx, sy = one.(mx), one.(my)
    Xs, Ys = (X .- mx) ./ sx, (Y .- my) ./ sy
    Sxy = permutedims(Xs) * Ys / (size(X, 1) - 1)  # p x q cross-covariance
    Rx = cholesky(Symmetric(permutedims(Xs) * Xs / (size(X, 1) - 1) + lambda * I)).U
    Ry = cholesky(Symmetric(permutedims(Ys) * Ys / (size(Y, 1) - 1) + lambda * I)).U
    F  = svd((permutedims(Rx) \ Sxy) / Ry)  # SVD of the whitened cross-covariance
    Ax, Ay = Rx \ F.U[:, 1:k], Ry \ F.V[:, 1:k]  # back to the original variables
    (px = A -> ((A .- mx) ./ sx) * Ax, py = B -> ((B .- my) ./ sy) * Ay, Ax = Ax, Ay = Ay)  # projections to n x k variates
end

m      = fit_cc(X, Y, k)
Zx, Zy = m.px(X), m.py(Y)  # n x k canonical variates
rho    = [cor(Zx[:, j], Zy[:, j]) for j in 1:k]  # correlation of each variate pair
'''

[[codeBranches]]
model = "pls"
code = '''
using LinearAlgebra, Statistics

X = {{X}}  # n x p, one row per observation
Y = {{Y}}  # n x q, same rows as X
k = {{k}}  # canonical dimensions, k <= min(p, q)

function fit_cc(X, Y, k)
    mx, my = mean(X, dims=1), mean(Y, dims=1)
{{?scaling=standardise}}     sx, sy = std(X, dims=1), std(Y, dims=1)
{{?scaling=centre}}     sx, sy = one.(mx), one.(my)
    Xs, Ys = (X .- mx) ./ sx, (Y .- my) ./ sy
    Sxy = permutedims(Xs) * Ys / (size(X, 1) - 1)  # p x q cross-covariance
    F = svd(Sxy)  # singular vectors maximise covariance, not correlation
    Ax, Ay = F.U[:, 1:k], F.V[:, 1:k]  # orthonormal weights
    (px = A -> ((A .- mx) ./ sx) * Ax, py = B -> ((B .- my) ./ sy) * Ay, Ax = Ax, Ay = Ay)  # projections to n x k variates
end

m      = fit_cc(X, Y, k)
Zx, Zy = m.px(X), m.py(Y)  # n x k canonical variates
rho    = [cor(Zx[:, j], Zy[:, j]) for j in 1:k]  # correlation of each variate pair
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "canonical-correlations"
label = "Canonical Correlations"
desc = "Bar chart of the correlation of each variate pair"
code = '''
using Plots

bar(rho, xlabel="canonical dimension", ylabel="correlation", ylims=(0, 1), legend=false)
'''

[[actionGroups.actions]]
id = "joint-embedding"
label = "Joint Embedding"
desc = "Scatter of the X variate against the Y variate for one dimension"
code = '''
using Plots

j = 1  # canonical dimension
scatter(Zx[:, j], Zy[:, j], xlabel=string("X variate ", j), ylabel=string("Y variate ", j), alpha=0.6, legend=false,
    title=string("r = ", round(rho[j], digits=3)))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "bartlett-test"
label = "Bartlett Test"
desc = "Sequential chi-squared tests that the classical canonical correlations from dimension j onwards are all zero"
code = '''
using MultivariateStats, Distributions

n, p = size(X)
q = size(Y, 2)
r = cor(fit(CCA, permutedims(X), permutedims(Y); outdim=min(p, q)))  # all classical canonical correlations
map(1:min(p, q)) do j
    chi2 = -(n - 1 - (p + q + 1) / 2) * log(prod(1 .- r[j:end] .^ 2))  # Bartlett's approximation to Wilks' lambda
    df   = (p - j + 1) * (q - j + 1)
    (dimension = j, correlation = r[j], chi2 = chi2, df = df, p_value = ccdf(Chisq(df), chi2))
end
'''

[[actionGroups.actions]]
id = "held-out"
label = "Held-Out Correlations"
desc = "Fit on a random half and correlate the variates on the other half: a large drop signals overfitting"
code = '''
using Random

idx   = shuffle(1:size(X, 1))
half  = div(length(idx), 2)
train = idx[1:half]
test  = idx[half+1:end]
mh    = fit_cc(X[train, :], Y[train, :], k)
Ztx, Zty = mh.px(X[test, :]), mh.py(Y[test, :])
(train = rho, test = [cor(Ztx[:, j], Zty[:, j]) for j in 1:k])
'''

[[actionGroups.actions]]
id = "redundancy-index"
label = "Redundancy Index"
desc = "Share of the variance of Y explained by each X variate (Stewart and Love), and the reverse"
code = '''
redundancy(V, Z) = [mean(cor(V[:, i], Z[:, j])^2 for i in axes(V, 2)) for j in axes(Z, 2)]
(Y_given_X = redundancy(Y, Zx), X_given_Y = redundancy(X, Zy))  # per dimension; sum for the total
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "transform-new"
label = "Transform New Data"
desc = "Project new observations into canonical space, and predict Y from X through the X variates"
code = '''
Zx_new = m.px(X_new)  # X_new: same columns as X; n_new x k
Zy_new = m.py(Y_new)  # Y_new: same columns as Y

B     = hcat(ones(size(Zx, 1)), Zx) \ Y  # regress Y on the X variates
Y_hat = hcat(ones(size(Zx_new, 1)), Zx_new) * B  # predicted Y for the new observations
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-dimensions"
label = "Compare Dimensions"
desc = "Correlation, shared variance and cumulative shared variance by dimension"
code = '''
[(dimension = j, correlation = rho[j], shared = rho[j]^2, cumulative = sum(abs2, rho[1:j]) / sum(abs2, rho)) for j in 1:k]
'''

[[actionGroups.actions]]
id = "vs-permuted"
label = "vs Permuted Y"
desc = "Leading correlation after shuffling the rows of Y: what chance alone produces with this many variables"
code = '''
using Random

null = map(1:100) do _
    Yp = Y[shuffle(1:end), :]  # breaks the pairing between rows of X and Y
    mp = fit_cc(X, Yp, 1)
    cor(mp.px(X)[:, 1], mp.py(Yp)[:, 1])
end
(found = rho[1], chance_95 = quantile(null, 0.95))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "canonical-coefficients"
label = "Canonical Coefficients"
desc = "Weights of each variable in each canonical variate"
code = '''
using Plots

cl(A) = (-maximum(abs, A), maximum(abs, A))
plot(heatmap(m.Ax, ylabel="X variable", xlabel="dimension", color=:balance, clims=cl(m.Ax)),
     heatmap(m.Ay, ylabel="Y variable", xlabel="dimension", color=:balance, clims=cl(m.Ay)))
'''

[[actionGroups.actions]]
id = "structure-correlations"
label = "Structure Correlations"
desc = "Correlation of each original variable with the canonical variates: more stable to read than the weights when variables are collinear"
code = '''
(X = cor(X, Zx), Y = cor(Y, Zy))  # p x k and q x k
'''
