[[decisionRows]]
task = "CCA"
context = "Many more observations than variables in X and Y"
purpose = "Pairs of linear combinations with maximal correlation (Hotelling)"

[[decisionRows]]
task = "Regularised CCA"
context = "Many or collinear variables, where CCA overfits"
