[[inputs]]
id = "X"
label = "X (n × p)"
tooltip = "First data matrix: n observations × p variables, one row per observation."
default = "X_train"

[[inputs]]
id = "Y"
label = "Y (n × q)"
tooltip = "Second data matrix: n observations × q variables. Must have the same rows (observations) as X."
default = "Y_train"

[[inputs]]
id = "k"
label = "k"
tooltip = "Number of canonical dimensions to extract. Must satisfy k ≤ min(p, q)."
default = "2"
newRow = true

[[inputs]]
id = "lambda"
label = "lambda (ridge)"
tooltip = "Ridge penalty added to the diagonal of the within-set covariance matrices. 0 recovers classical CCA; larger values move towards PLS. Choose it with the Held-Out Correlations action."
default = "0.1"
models = ["rcca"]

[[inputs]]
id = "scaling"
label = "Scaling"
tooltip = "Standardise when variables are on different scales. Classical CCA is scale invariant; regularised CCA and PLS are not."
kind = "select"
default = "standardise"
models = ["rcca", "pls"]

[[inputs.options]]
value = "standardise"
label = "Standardise"

[[inputs.options]]
value = "centre"
label = "Centre Only"

