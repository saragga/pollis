[[actionGroups.actions]]
id = "nearest-series"
label = "Nearest Training Series"
desc = "The training series closest to a test series, their classes and DTW distances: the evidence behind its predicted class"
models = ["dtw"]
code = '''
x = Xtest[:, 1];  # the first test series; change the column to see another
d = [dist(x, view(Xtrain, :, i), r) for i in axes(Xtrain, 2)];
for i in sortperm(d)[1:5]
	println("training series ", i, "  class ", ytrain[i], "  DTW distance ", round(d[i], digits=3))
end
println("predicted class ", ytrain[argmin(d)], ", true class ", ytest[1])
'''
