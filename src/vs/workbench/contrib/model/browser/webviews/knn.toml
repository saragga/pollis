desc = "A test series, its nearest training series, and the values DTW matches within the window"
models = ["dtw"]
code = '''
using Plots

x  = Xtest[:, 1];  # the first test series; change the column to see another
nb = Xtrain[:, nearest(x, r)];  # its nearest training series
lo, hi = radiuslimits(r, x, nb);  # the window as the first and last value each value may be matched with
cost, i1, i2 = dtw(x, nb, SqEuclidean(), lo, hi);  # the matching with the smallest sum of squared differences
