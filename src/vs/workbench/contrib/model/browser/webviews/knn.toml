[[actionGroups.actions]]
id = "k-distance"
label = "k-Distance Curve"
models = ["knn", "range"]
desc = "Sorted distance of every point to its k-th neighbour; the elbow suggests a good radius r (in standardised units)"
code = '''
using Plots

_, d = knn(tree, Z, {{k}} + 1, true)  # +1: each point is its own nearest neighbour
kdist = sort(last.(d))
plot(kdist, xlabel="point (sorted)", ylabel="distance to k-th neighbour", legend=false)
'''

[[actionGroups.actions]]
id = "brute-check"
label = "Exactness Check"
models = ["knn", "range"]
desc = "Confirm the tree returns the same neighbours as an exhaustive brute-force search"
code = '''
idxs_brute, _ = knn(BruteTree(Z, metric), q, {{k}}, true)
idxs_tree, _  = knn(tree, q, {{k}}, true)
idxs_tree == idxs_brute
'''

[[actionGroups.actions]]
id = "window-curve"
label = "Window Curve"
desc = "Leave-one-out and test error against the window: the best window in training may not be the best in testing, mostly with small training sets (Dau et al. 2019, Fig. 2)"
models = ["dtw"]
code = '''
using Plots

function errors(r)  # leave-one-out error on the training set, and test error, for a window of r points
	n = size(Xtrain, 2)
	D = fill(Inf, n, n)  # a series is not its own neighbour
	for i in 1:n, j in i+1:n
		D[i, j] = D[j, i] = dist(view(Xtrain, :, i), view(Xtrain, :, j), r)
	end
	loo  = mean(ytrain[argmin(D[:, i])] != ytrain[i] for i in 1:n)
	test = mean(ytrain[nearest(x, r)] != c for (x, c) in zip(eachcol(Xtest), ytest))
	(loo, test)
end
ws = 0:10;  # per cent of the length, as in the archive's code
e  = errors.(points.(ws));
plot(ws, first.(e), label="leave-one-out (train)", marker=:circle, xlabel="warping window, per cent", ylabel="error rate")
plot!(ws, last.(e), label="test", marker=:square)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "knn-classify"
label = "kNN Classification"
models = ["knn", "range"]
desc = "Choose k by leave-one-out cross-validation, then label new points by a majority vote of their k nearest training labels"
code = '''
using StatsBase, Statistics

labels = Z[1, :] .+ Z[2, :] .> 0  # replace with the class of each column of the data
nb, _ = knn(tree, Z, 30, true)  # each point first, then its 29 nearest others
loo(k) = mean(mode(labels[n[2:k+1]]) == labels[j] for (j, n) in enumerate(nb))  # leave-one-out accuracy: the point does not vote for itself
ks = 1:2:27  # odd k avoids ties between two classes
k_best = ks[argmax(loo.(ks))]
println("LOO accuracy by k: ", round.(loo.(ks), digits=3), "  best k = ", k_best)

X_new = rand(size(Z, 1), 10)  # replace with a d x m matrix of points to classify, in the original units
nbrs, _ = knn(tree, (X_new .- mu) ./ sd, k_best)  # scaled like the training data
y_hat = [mode(labels[i]) for i in nbrs]
'''

[[actionGroups.actions]]
id = "knn-regress"
label = "kNN Regression"
models = ["knn", "range"]
desc = "Choose k by leave-one-out cross-validation, then predict a continuous target as the inverse-distance weighted mean of the neighbours"
code = '''
using Statistics

y = vec(sum(X, dims=1)) .+ 0.1 .* randn(size(X, 2))  # replace with the target of each column of the data
idw(i, dj) = sum(y[i] ./ (dj .+ 1e-12)) / sum(1 ./ (dj .+ 1e-12))  # inverse-distance weighted mean
nb, nd = knn(tree, Z, 31, true)  # each point first, then its 30 nearest others
loo(k) = sqrt(mean((idw(n[2:k+1], dd[2:k+1]) - y[j])^2 for (j, (n, dd)) in enumerate(zip(nb, nd))))  # leave-one-out RMSE
ks = 1:30
k_best = ks[argmin(loo.(ks))]
println("best k = ", k_best, ", LOO RMSE = ", round(loo(k_best), digits=3))

X_new = rand(size(Z, 1), 10)  # replace with a d x m matrix of points to predict, in the original units
nbrs, d = knn(tree, (X_new .- mu) ./ sd, k_best)  # scaled like the training data
y_hat = [idw(i, dj) for (i, dj) in zip(nbrs, d)]
'''

