# k-Nearest Neighbours Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/knn.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "k-Nearest Neighbours"
viewType = "pollis.knn"
defaultModel = "knn"

[[packages]]
name = "NearestNeighbors.jl"
github = "https://github.com/KristofferC/NearestNeighbors.jl"

[requires]
packages = ["Plots.jl", "StatsBase.jl", "BenchmarkTools.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "kNN Basics"
file = "knn/tutorial-01-basics.ipynb"
bundled = true
description = "Building and querying KDTree and BallTree with NearestNeighbors.jl"

[[notebookSections.notebooks]]
name = "Range Search"
file = "knn/tutorial-02-range.ipynb"
bundled = true
description = "Efficient radius queries and inrange search"

[[notebookSections.notebooks]]
name = "Large-Scale kNN"
file = "knn/tutorial-03-scalable.ipynb"
bundled = true
description = "Scaling nearest-neighbour search to large datasets"

[[wikis]]
name = "Overview"
file = "knn/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "knn/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "knn/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "knn/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "knn/interpretation.md"
bundled = true

[[wikis]]
name = "Decision Guide"
file = "knn/decision-guide.md"
bundled = true

[[models]]
id = "knn"
label = "kNN Search"

[[models]]
id = "range"
label = "Range Search"

[[bullets]]
text = "kNN Search"
detail = "returns the k closest points in a dataset using an efficient spatial index"

[[bullets]]
text = "Range Search"
detail = "returns all points within a given radius r of the query"

[[decisionRows]]
task = "kNN Search"
context = "A fixed number of neighbours is needed"
purpose = "The k closest points, e.g. for kNN classification or regression"

[[decisionRows]]
task = "Range Search"
context = "A meaningful distance threshold exists"
purpose = "Every point within radius r, e.g. for density or DBSCAN-style clustering"

[[inputs]]
id = "data"
label = "Data matrix"
tooltip = "d x n matrix of data points: d features, n samples (one point per column)."
default = "data"

[[inputs]]
id = "query"
label = "Query point(s)"
tooltip = "d-element vector for a single query, or d x m matrix for m simultaneous queries."
default = "query"

[[inputs]]
id = "tree-type"
label = "Tree type"
tooltip = "KDTree is fastest for low-dimensional data (d <= 20) and supports all Minkowski-family metrics (Euclidean, Manhattan, Chebyshev, Minkowski). BallTree works in any metric space. BruteTree checks every point: best for small datasets."
kind = "select"
default = "KDTree"
newRow = true

[[inputs.options]]
value = "KDTree"
label = "KDTree"

[[inputs.options]]
value = "BallTree"
label = "BallTree"

[[inputs.options]]
value = "BruteTree"
label = "BruteTree"

[[inputs]]
id = "metric"
label = "Metric"
tooltip = "All listed metrics are Minkowski-family: Euclidean is L2 (p=2), Manhattan is L1 (p=1), Chebyshev is L-infinity (p to infinity), Minkowski allows any p >= 1. All are compatible with KDTree and BallTree."
kind = "select"
default = "Euclidean"

[[inputs.options]]
value = "Euclidean"
label = "Euclidean (L2)"

[[inputs.options]]
value = "Manhattan"
label = "Manhattan (L1)"

[[inputs.options]]
value = "Chebyshev"
label = "Chebyshev (L-infinity)"

[[inputs.options]]
value = "Minkowski"
label = "Minkowski (Lp)"

[[inputs]]
id = "p"
label = "p"
tooltip = "Minkowski exponent. p=1 gives Manhattan, p=2 gives Euclidean, p to infinity gives Chebyshev. Any p >= 1 is valid."
default = "1.5"
when = "metric=Minkowski"

[[inputs]]
id = "k"
label = "k"
tooltip = "Number of nearest neighbours to return. Must be <= the number of data points. Default 5."
default = "5"
models = ["knn"]
newRow = true

[[inputs]]
id = "r"
label = "r"
tooltip = "Search radius. All points with distance <= r from the query are returned. Default 1.0."
default = "1.0"
models = ["range"]
newRow = true

[[inputs]]
id = "leafsize"
label = "leaf_size"
tooltip = "Minimum number of points in a leaf node. Smaller values produce finer trees with faster queries at the cost of longer build time. Not used by BruteTree. Default 10."
default = "10"
when = "tree-type!=BruteTree"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.knn]
# Scattered points; the query is joined to its three nearest neighbours
svg = '''
var pts = [[10, 24], [18, 60], [40, 20], [44, 66], [12, 44], [36, 50], [22, 36], [34, 34], [46, 40], [26, 70]];
var q = [28, 44];
var near = [6, 7, 5];
var s = '';
for (var j = 0; j < near.length; j++) {
	var n = pts[near[j]];
	s += '<line x1="' + q[0] + '" y1="' + q[1] + '" x2="' + n[0] + '" y2="' + n[1] + '" stroke="currentColor" stroke-width="1"/>';
}
for (var i = 0; i < pts.length; i++) {
	s += '<circle cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="2.2" fill="currentColor" opacity="' + (near.indexOf(i) >= 0 ? 0.9 : 0.35) + '"/>';
}
s += '<rect x="' + (q[0] - 3) + '" y="' + (q[1] - 3) + '" width="6" height="6" fill="currentColor"/>';
return s;
'''

[miniCharts.range]
# Scattered points; those inside the dashed radius around the query are highlighted
svg = '''
var pts = [[10, 24], [18, 60], [40, 20], [44, 66], [12, 44], [36, 50], [22, 36], [34, 34], [46, 40], [26, 70]];
var q = [28, 44];
var r = 13;
var s = '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + r + '" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="1" stroke-dasharray="2,2"/>';
for (var i = 0; i < pts.length; i++) {
	var inside = Math.hypot(pts[i][0] - q[0], pts[i][1] - q[1]) <= r;
	s += '<circle cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="2.2" fill="currentColor" opacity="' + (inside ? 0.9 : 0.35) + '"/>';
}
s += '<rect x="' + (q[0] - 3) + '" y="' + (q[1] - 3) + '" width="6" height="6" fill="currentColor"/>';
return s;
'''

[[codeBranches]]
model = "knn"
code = '''
using NearestNeighbors, Distances

{{?metric=Minkowski}} metric = Minkowski({{p}})
{{?metric!=Minkowski}} metric = {{metric}}()
{{?tree-type=BruteTree}} tree = BruteTree({{data}}, metric)  # d x n data matrix, one point per column
{{?tree-type!=BruteTree}} tree = {{tree-type}}({{data}}, metric, leafsize={{leafsize}})  # d x n data matrix, one point per column
idxs, dists = knn(tree, {{query}}, {{k}}, true)  # {{k}} nearest neighbours, sorted by distance
'''

[[codeBranches]]
model = "range"
code = '''
using NearestNeighbors, Distances

{{?metric=Minkowski}} metric = Minkowski({{p}})
{{?metric!=Minkowski}} metric = {{metric}}()
{{?tree-type=BruteTree}} tree = BruteTree({{data}}, metric)  # d x n data matrix, one point per column
{{?tree-type!=BruteTree}} tree = {{tree-type}}({{data}}, metric, leafsize={{leafsize}})  # d x n data matrix, one point per column
idxs = inrange(tree, {{query}}, {{r}})  # all points within radius {{r}}
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "neighbours-plot"
label = "Query and Neighbours"
desc = "Scatter the first two features with the query and its returned neighbours highlighted"
code = '''
using Plots

scatter({{data}}[1, :], {{data}}[2, :], label="data", alpha=0.4)
scatter!({{data}}[1, idxs], {{data}}[2, idxs], label="neighbours")
scatter!([{{query}}[1]], [{{query}}[2]], label="query", marker=:star5, markersize=10)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "k-distance"
label = "k-Distance Curve"
desc = "Sorted distance of every point to its k-th neighbour; the elbow suggests a good radius r"
code = '''
using Plots

_, d = knn(tree, {{data}}, {{k}} + 1, true)  # +1: each point is its own nearest neighbour
kdist = sort(last.(d))
plot(kdist, xlabel="point (sorted)", ylabel="distance to k-th neighbour", legend=false)
'''

[[actionGroups.actions]]
id = "brute-check"
label = "Exactness Check"
desc = "Confirm the tree returns the same neighbours as an exhaustive brute-force search"
code = '''
idxs_brute, _ = knn(BruteTree({{data}}, metric), {{query}}, {{k}}, true)
idxs_tree, _  = knn(tree, {{query}}, {{k}}, true)
idxs_tree == idxs_brute
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "knn-classify"
label = "kNN Classification"
desc = "Label new points by a majority vote of their k nearest training labels"
code = '''
using StatsBase

nbrs, _ = knn(tree, X_new, {{k}})  # X_new: d x m matrix of points to classify
y_hat = [mode(labels[i]) for i in nbrs]  # labels: class of each column of {{data}}
'''

[[actionGroups.actions]]
id = "knn-regress"
label = "kNN Regression"
desc = "Predict a continuous target as the inverse-distance weighted mean of the neighbours"
code = '''
nbrs, d = knn(tree, X_new, {{k}})  # X_new: d x m matrix of points to predict
y_hat = [sum(y[i] ./ (dj .+ 1e-12)) / sum(1 ./ (dj .+ 1e-12)) for (i, dj) in zip(nbrs, d)]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "tree-speed"
label = "Tree Types"
desc = "Benchmark the query time of KDTree, BallTree and BruteTree on your data"
code = '''
using BenchmarkTools

for T in (KDTree, BallTree, BruteTree)
	t = T({{data}}, metric)
	println(rpad(string(T), 10), @belapsed knn($t, $({{query}}), {{k}}))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "nearest-examples"
label = "Nearest Examples"
desc = "Show which training points drive a prediction and how far away they are"
code = '''
i, d = knn(tree, {{query}}, {{k}}, true)
for (j, dj) in zip(i, d)
	println("point ", j, "  label ", labels[j], "  distance ", round(dj, digits=3))
end
'''
