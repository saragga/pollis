[[models]]
id = "range"
label = "Range Search"

[[models]]
id = "dtw"
label = "DTW Classification"

[[bullets]]
text = "kNN Search"
detail = "returns the k closest points in a dataset using an efficient spatial index"

[[bullets]]
text = "Range Search"
detail = "returns all points within a given radius r of the query"

[[bullets]]
text = "DTW Classification"
detail = "labels a whole time series with the class of its nearest training series under dynamic time warping, which lets similar shapes match when they are shifted or stretched in time"

[[decisionRows]]
task = "kNN Search"
context = "A fixed number of neighbours is needed"
purpose = "The k closest points, e.g. for kNN classification or regression"

[[decisionRows]]
task = "Range Search"
context = "A meaningful distance threshold exists"
purpose = "Every point within radius r, e.g. for density or DBSCAN-style clustering"

[[decisionRows]]
task = "DTW Classification"
context = "Each item is a time series"
purpose = "The class of a series, from labelled series whose shapes may be shifted or stretched in time"

[[inputs]]
id = "data"
label = "Data matrix"
tooltip = "d x n matrix of data points: d features, n samples (one point per column)."
default = "rand(2, 200)"
models = ["knn", "range"]

[[inputs]]
id = "query"
label = "Query point(s)"
tooltip = "d-element vector for a single query, or d x m matrix for m simultaneous queries."
default = "[0.5, 0.5]"
models = ["knn", "range"]

[[inputs]]
id = "tree-type"
label = "Tree type"
tooltip = "KDTree is fastest for low-dimensional data (d <= 20) and supports all Minkowski-family metrics (Euclidean, Manhattan, Chebyshev, Minkowski). BallTree works in any metric space. BruteTree checks every point: best for small datasets."
kind = "select"
default = "KDTree"
newRow = true
models = ["knn", "range"]

[[inputs.options]]
value = "KDTree"
label = "KDTree"

[[inputs.options]]
value = "BallTree"
label = "BallTree"

[[inputs.options]]
value = "BruteTree"
label = "BruteTree"

[[inputs]]
id = "metric"
label = "Metric"
tooltip = "All listed metrics are Minkowski-family: Euclidean is L2 (p=2), Manhattan is L1 (p=1), Chebyshev is L-infinity (p to infinity), Minkowski allows any p >= 1. All are compatible with KDTree and BallTree."
kind = "select"
default = "Euclidean"
models = ["knn", "range"]

[[inputs.options]]
value = "Euclidean"
label = "Euclidean (L2)"

[[inputs.options]]
value = "Manhattan"
label = "Manhattan (L1)"

[[inputs.options]]
value = "Chebyshev"
label = "Chebyshev (L-infinity)"

[[inputs.options]]
value = "Minkowski"
label = "Minkowski (Lp)"

[[inputs]]
id = "p"
label = "p"
tooltip = "Minkowski exponent. p=1 gives Manhattan, p=2 gives Euclidean, p to infinity gives Chebyshev. Any p >= 1 is valid."
default = "1.5"
when = "metric=Minkowski"
models = ["knn", "range"]

[[inputs]]
id = "k"
label = "k"
tooltip = "Number of nearest neighbours to return. Must be <= the number of data points. Default 5."
default = "5"
models = ["knn"]
newRow = true

[[inputs]]
id = "r"
label = "r"
tooltip = "Search radius. All points with distance <= r from the query are returned. Default 1.0."
default = "1.0"
models = ["range"]
newRow = true

[[inputs]]
id = "leafsize"
label = "leaf_size"
tooltip = "Minimum number of points in a leaf node. Smaller values produce finer trees with faster queries at the cost of longer build time. Not used by BruteTree. Default 10."
default = "10"
when = "tree-type!=BruteTree"
models = ["knn", "range"]

[[inputs]]
id = "dtw-data"
label = "Dataset"
tooltip = "Example time series from PollisDatasets, with the UCR archive's own train/test split. ECG200: 200 heartbeats of 96 readings, normal or myocardial infarction. TwoLeadECG: 1162 series of 82 readings, which of two ECG leads. Earthquakes: 461 series of 512 hourly readings, whether a major earthquake followed (slow: a few minutes)."
kind = "select"
default = "ecg200"
models = ["dtw"]

[[inputs.options]]
value = "ecg200"
label = "ECG200"

[[inputs.options]]
value = "twoleadecg"
label = "TwoLeadECG"

[[inputs.options]]
value = "earthquakes"
label = "Earthquakes"

[[inputs]]
id = "window-mode"
label = "Warping window"
tooltip = "How far apart in time two matched values may be. Learned: the window, as a per cent of the length, with the smallest leave-one-out error on the training set, as the UCR archive's baselines do. Fixed: a window you choose. Unconstrained: any value may be matched with any other."
kind = "select"
default = "learned"
models = ["dtw"]

[[inputs.options]]
value = "learned"
label = "Learned"

[[inputs.options]]
value = "fixed"
label = "Fixed"

[[inputs.options]]
value = "unconstrained"
label = "Unconstrained"

[[inputs]]
id = "max-window"
label = "Largest window (%)"
tooltip = "Windows of 0, 1, ..., this many per cent of the length are tried. The UCR archive uses 10. Window 0 is the Euclidean distance."
default = "10"
models = ["dtw"]
when = "window-mode=learned"

[[inputs]]
id = "window"
label = "Window (%)"
tooltip = "Per cent of the series length; a window of w per cent is ceil(length * w / 100) points. 0 gives the Euclidean distance."
default = "5"
models = ["dtw"]
when = "window-mode=fixed"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.knn]
# Scattered points; the query is joined to its three nearest neighbours
svg = '''
var pts = [[10, 24], [18, 60], [40, 20], [44, 66], [12, 44], [36, 50], [22, 36], [34, 34], [46, 40], [26, 70]];
var q = [28, 44];
var near = [6, 7, 5];
var s = '';
for (var j = 0; j < near.length; j++) {
	var n = pts[near[j]];
	s += '<line x1="' + q[0] + '" y1="' + q[1] + '" x2="' + n[0] + '" y2="' + n[1] + '" stroke="currentColor" stroke-width="1"/>';
}
for (var i = 0; i < pts.length; i++) {
	s += '<circle cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="2.2" fill="currentColor" opacity="' + (near.indexOf(i) >= 0 ? 0.9 : 0.35) + '"/>';
}
s += '<rect x="' + (q[0] - 3) + '" y="' + (q[1] - 3) + '" width="6" height="6" fill="currentColor"/>';
return s;
'''

[miniCharts.range]
# Scattered points; those inside the dashed radius around the query are highlighted
svg = '''
var pts = [[10, 24], [18, 60], [40, 20], [44, 66], [12, 44], [36, 50], [22, 36], [34, 34], [46, 40], [26, 70]];
var q = [28, 44];
var r = 13;
var s = '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="' + r + '" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="1" stroke-dasharray="2,2"/>';
for (var i = 0; i < pts.length; i++) {
	var inside = Math.hypot(pts[i][0] - q[0], pts[i][1] - q[1]) <= r;
	s += '<circle cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="2.2" fill="currentColor" opacity="' + (inside ? 0.9 : 0.35) + '"/>';
}
s += '<rect x="' + (q[0] - 3) + '" y="' + (q[1] - 3) + '" width="6" height="6" fill="currentColor"/>';
return s;
'''

[miniCharts.dtw]
# Two series with the same bump, shifted in time; grey lines join the values that DTW matches
svg = '''
var a = [], b = [];
for (var i = 0; i <= 12; i++) {
	var x = 3 + i * 4;
	a.push([x, 30 - 14 * Math.exp(-Math.pow((i - 4) / 1.5, 2))]);
	b.push([x, 70 - 14 * Math.exp(-Math.pow((i - 7) / 1.5, 2))]);
}
var s = '';
for (var i = 0; i <= 12; i++) {
	var j = Math.min(12, Math.round(i + 3 * Math.sin(Math.PI * i / 12)));
	s += '<line x1="' + a[i][0] + '" y1="' + a[i][1] + '" x2="' + b[j][0] + '" y2="' + b[j][1] + '" stroke="currentColor" stroke-width="0.6" opacity="0.4"/>';
}
var pa = '', pb = '';
for (var i = 0; i <= 12; i++) {
	pa += (i ? ' L' : 'M') + a[i][0] + ' ' + a[i][1];
	pb += (i ? ' L' : 'M') + b[i][0] + ' ' + b[i][1];
}
s += '<path d="' + pa + '" fill="none" stroke="currentColor" stroke-width="1.4"/>';
s += '<path d="' + pb + '" fill="none" stroke="currentColor" stroke-width="1.4"/>';
return s;
'''

[[codeBranches]]
model = "knn"
code = '''
using NearestNeighbors, Distances, Statistics

X  = {{data}}  # d x n data matrix, one point per column
mu = vec(mean(X, dims=2)); sd = vec(std(X, dims=2))  # per-feature centre and scale
Z  = (X .- mu) ./ sd  # standardised: otherwise the feature with the largest units dominates every distance
q  = ({{query}} .- mu) ./ sd  # the query on the same scale

{{?metric=Minkowski}} metric = Minkowski({{p}})
{{?metric!=Minkowski}} metric = {{metric}}()
{{?tree-type=BruteTree}} tree = BruteTree(Z, metric)
{{?tree-type!=BruteTree}} tree = {{tree-type}}(Z, metric, leafsize={{leafsize}})
idxs, dists = knn(tree, q, {{k}}, true)  # {{k}} nearest neighbours, sorted by distance
'''

[[codeBranches]]
model = "range"
code = '''
using NearestNeighbors, Distances, Statistics

X  = {{data}}  # d x n data matrix, one point per column
mu = vec(mean(X, dims=2)); sd = vec(std(X, dims=2))  # per-feature centre and scale
Z  = (X .- mu) ./ sd  # standardised: otherwise the feature with the largest units dominates every distance
q  = ({{query}} .- mu) ./ sd  # the query on the same scale

{{?metric=Minkowski}} metric = Minkowski({{p}})
{{?metric!=Minkowski}} metric = {{metric}}()
{{?tree-type=BruteTree}} tree = BruteTree(Z, metric)
{{?tree-type!=BruteTree}} tree = {{tree-type}}(Z, metric, leafsize={{leafsize}})
idxs = inrange(tree, q, {{r}})  # all points within radius {{r}}, in standard deviations
'''

[[codeBranches]]
model = "dtw"
code = '''
using DynamicAxisWarping, Distances, PollisDatasets, Statistics, Tables

# Example data: a dataset of the UCR archive (Dau et al. 2019), one row per series with its split, its class and its readings; datasetinfo("{{dtw-data}}") describes the columns. Replace it with your own series.
t = columntable(dataset("{{dtw-data}}"));
X = permutedims(reduce(hcat, [Float64.(t[k]) for k in keys(t)[3:end]]));  # one series per column
zscore(X) = (X .- mean(X, dims=1)) ./ std(X, dims=1);  # each series to mean 0 and standard deviation 1: DTW then compares shapes, not levels
train = t.split .== "train";  # the archive's own split
Xtrain, ytrain = zscore(X[:, train]), t.label[train];
Xtest, ytest   = zscore(X[:, .!train]), t.label[.!train];

L = size(Xtrain, 1);  # series length
points(w) = cld(w * L, 100);  # a window of w per cent is ceil(L * w / 100) points, as in the archive's code
dist(a, b, r) = dtw_cost(a, b, SqEuclidean(), r);  # value i may be matched with values i-r to i+r; r = 0 is the squared Euclidean distance
nearest(x, r) = argmin([dist(x, view(Xtrain, :, i), r) for i in axes(Xtrain, 2)]);  # 1-NN: the closest training series

{{?window-mode=learned}}function looerror(r)  # leave-one-out error: each training series classified by its nearest other
{{?window-mode=learned}}	n = size(Xtrain, 2)
{{?window-mode=learned}}	D = fill(Inf, n, n)  # a series is not its own neighbour
{{?window-mode=learned}}	for i in 1:n, j in i+1:n
{{?window-mode=learned}}		D[i, j] = D[j, i] = dist(view(Xtrain, :, i), view(Xtrain, :, j), r)
{{?window-mode=learned}}	end
{{?window-mode=learned}}	mean(ytrain[argmin(D[:, i])] != ytrain[i] for i in 1:n)
{{?window-mode=learned}}end
{{?window-mode=learned}}ws = 0:{{max-window}};  # candidate windows, per cent of the length
{{?window-mode=learned}}w  = ws[argmin(looerror.(points.(ws)))];  # the smallest window with the smallest error, from the training set alone
{{?window-mode=fixed}}w = {{window}};  # per cent of the length
{{?window-mode=unconstrained}}w = 100;  # any value may be matched with any other
r = points(w);
yhat = [ytrain[nearest(x, r)] for x in eachcol(Xtest)];  # the class of the nearest training series
println("window ", w, "% (", r, " points), test error ", round(mean(yhat .!= ytest), digits=4))
'''

