# k-Nearest Neighbours Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/knn.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "k-Nearest Neighbours"
viewType = "pollis.knn"
defaultModel = "knn"

[[packages]]
name = "NearestNeighbors.jl"
github = "https://github.com/KristofferC/NearestNeighbors.jl"

[[packages]]
name = "DynamicAxisWarping.jl"
github = "https://github.com/baggepinnen/DynamicAxisWarping.jl"

[requires]
packages = ["Plots.jl", "StatsBase.jl", "BenchmarkTools.jl", "Distances.jl", "Tables.jl"]

