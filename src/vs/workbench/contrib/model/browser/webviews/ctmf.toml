[[bullets]]
text = "Solves asset pricing models via Hamilton-Jacobi-Bellman equations in continuous time using finite difference methods"
detail = ""

[[bullets]]
text = "Supports habit formation (Campbell-Cochrane), long-run risk (Bansal-Yaron), disaster risk, and macro-finance models with financial intermediaries"
detail = ""

[[bullets]]
text = "Produces price-dividend ratios, risk premia, Sharpe ratios, and term structure implications from structural parameters"
detail = ""

[[bullets]]
text = "Epstein-Zin recursive preferences allow risk aversion (gamma) and the elasticity of intertemporal substitution (psi) to be calibrated independently"
detail = ""

[[inputs]]
id = "gamma"
label = "gamma (risk aversion)"
tooltip = "Coefficient of relative risk aversion in the recursive Epstein-Zin utility specification."
default = "10.0"

[[inputs]]
id = "rho"
label = "rho (discount rate)"
tooltip = "Subjective discount rate in continuous time."
default = "0.02"

[[inputs]]
id = "sigma"
label = "sigma (volatility)"
tooltip = "Diffusion volatility of the consumption growth or state variable process."
default = "0.0072"

[[inputs]]
id = "psi"
label = "psi (EIS)"
tooltip = "Elasticity of intertemporal substitution (EIS). Separates risk aversion from intertemporal substitution preferences."
default = "1.5"

[[inputs]]
id = "kappa"
label = "kappa (mean reversion)"
tooltip = "Mean-reversion speed of the state variable (e.g. expected consumption growth or surplus ratio)."
default = "0.3"

[[inputs]]
id = "N"
label = "N (grid points)"
tooltip = "Number of grid points for the state space discretisation. More points give higher accuracy at greater computational cost."
default = "100"

[[codeBranches]]
model = "main"
code = '''
using EconPDEs
using OrderedCollections: OrderedDict

m = BansalYaronModel(  # long-run risk model (Bansal-Yaron 2004)
    gamma = {{gamma}}, rho = {{rho}},  # Epstein-Zin preference parameters
    psi = {{psi}}, sigma = {{sigma}},  # EIS and consumption volatility
    kappa = {{kappa}})

stategrid = OrderedDict(:x => range(-0.03, 0.03; length = {{N}}))  # state grid over expected consumption growth
y0        = OrderedDict(:p => zeros({{N}}))  # initial guess for price-dividend ratio

result, _ = pdesolve(m, stategrid, y0)  # solve the HJB equation

p  = result[:p]  # price-dividend ratio on state grid
mu = result[:mu]  # expected excess return
sr = result[:sr]  # Sharpe ratio
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence"
label = "Convergence Check"
desc = "Verify that the HJB solver converged and inspect the solution residuals"
code = '''
using EconPDEs, OrderedCollections: OrderedDict

m         = BansalYaronModel(gamma = {{gamma}}, rho = {{rho}}, psi = {{psi}}, sigma = {{sigma}}, kappa = {{kappa}})
stategrid = OrderedDict(:x => range(-0.03, 0.03; length = {{N}}))
y0        = OrderedDict(:p => zeros({{N}}))

result, iterations = pdesolve(m, stategrid, y0)

println("Solver iterations: ", iterations)  # Newton iterations to convergence
println("P/D range: [", round(minimum(result[:p]), digits=2), ", ", round(maximum(result[:p]), digits=2), "]")  # price-dividend ratio range
println("Grid-average P/D:  ", round(mean(result[:p]), digits=2))  # equal weight on every grid point, not the unconditional mean (weight by the stationary density of x for that)
'''

[[actionGroups.actions]]
id = "risk_premium"
label = "Risk Premium"
desc = "Plot the conditional equity risk premium as a function of the state variable"
code = '''
using EconPDEs, OrderedCollections: OrderedDict, Plots

m         = BansalYaronModel(gamma = {{gamma}}, rho = {{rho}}, psi = {{psi}}, sigma = {{sigma}}, kappa = {{kappa}})
x_grid    = range(-0.03, 0.03; length = {{N}})
stategrid = OrderedDict(:x => x_grid)
y0        = OrderedDict(:p => zeros({{N}}))

result, _ = pdesolve(m, stategrid, y0)

plot(x_grid, result[:mu] .* 100;  # conditional risk premium in %
    xlabel = "Expected Consumption Growth", ylabel = "Risk Premium (%)",
    title = "Conditional Equity Risk Premium", legend = false)
'''

[[actionGroups.actions]]
id = "pd_ratio"
label = "Price-Dividend Ratio"
desc = "Plot the price-dividend ratio as a function of the state variable and compare to historical levels"
code = '''
using EconPDEs, OrderedCollections: OrderedDict, Plots

m         = BansalYaronModel(gamma = {{gamma}}, rho = {{rho}}, psi = {{psi}}, sigma = {{sigma}}, kappa = {{kappa}})
x_grid    = range(-0.03, 0.03; length = {{N}})
stategrid = OrderedDict(:x => x_grid)
y0        = OrderedDict(:p => zeros({{N}}))

result, _ = pdesolve(m, stategrid, y0)

plot(x_grid, result[:p];  # price-dividend ratio vs state variable
    xlabel = "Expected Consumption Growth", ylabel = "Price-Dividend Ratio",
    title = "Price-Dividend Ratio", legend = false)
hline!([25.0]; linestyle = :dash, color = :red, label = "Historical avg")  # historical US P/D ~25
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "sharpe_ratio"
label = "Sharpe Ratio"
desc = "Compute the maximum Sharpe ratio and compare to the equity premium puzzle benchmark"
code = '''
using EconPDEs, OrderedCollections: OrderedDict, Statistics

m         = BansalYaronModel(gamma = {{gamma}}, rho = {{rho}}, psi = {{psi}}, sigma = {{sigma}}, kappa = {{kappa}})
stategrid = OrderedDict(:x => range(-0.03, 0.03; length = {{N}}))
y0        = OrderedDict(:p => zeros({{N}}))

result, _ = pdesolve(m, stategrid, y0)

sr_mean = mean(result[:sr])  # grid average, not the unconditional mean: the grid gives the tails of x as much weight as the centre
sr_max  = maximum(result[:sr])  # maximum (peak) Sharpe ratio
ep_mean = mean(result[:mu]) * 100  # grid-average equity premium in %

println("Grid-average Sharpe ratio:  ", round(sr_mean, digits=3))
println("Max Sharpe ratio:   ", round(sr_max,  digits=3))
println("Grid-average equity premium: ", round(ep_mean, digits=2), "%")  # US historical ~6%, an unconditional mean: compare with care
'''

[[actionGroups.actions]]
id = "ap_moments"
label = "Asset Pricing Moments"
desc = "Report key model-implied moments: mean return, volatility, P/D ratio, and risk-free rate"
code = '''
using EconPDEs, OrderedCollections: OrderedDict, Statistics

m         = BansalYaronModel(gamma = {{gamma}}, rho = {{rho}}, psi = {{psi}}, sigma = {{sigma}}, kappa = {{kappa}})
stategrid = OrderedDict(:x => range(-0.03, 0.03; length = {{N}}))
y0        = OrderedDict(:p => zeros({{N}}))

result, _ = pdesolve(m, stategrid, y0)

println("--- Model-Implied Asset Pricing Moments ---")  # 
println("Grid-average moments (equal weight on each grid point; weight by the stationary density of x for unconditional moments)")
println("Mean P/D ratio:      ", round(mean(result[:p]),      digits=2))  # grid-average P/D
println("Mean equity premium: ", round(mean(result[:mu])*100, digits=2), "%")  # annualised excess return
println("Return volatility:   ", round(mean(result[:vol])*100, digits=2), "%")  # annualised equity vol
println("Mean Sharpe ratio:   ", round(mean(result[:sr]),      digits=3))  # equity Sharpe ratio
println("Risk-free rate:      ", round(mean(result[:rf])*100,  digits=2), "%")  # annualised risk-free rate
'''

[[actionGroups.actions]]
id = "state_dynamics"
label = "State Variable Dynamics"
desc = "Half-life of shocks to expected consumption growth, and the stationary standard deviation of x as an OU process: vol(x) / sqrt(2 kappa)"
code = '''
using EconPDEs, OrderedCollections: OrderedDict, Statistics

m         = BansalYaronModel(gamma = {{gamma}}, rho = {{rho}}, psi = {{psi}}, sigma = {{sigma}}, kappa = {{kappa}})
stategrid = OrderedDict(:x => range(-0.03, 0.03; length = {{N}}))
y0        = OrderedDict(:p => zeros({{N}}))

result, _ = pdesolve(m, stategrid, y0)

sigma_x = {{sigma}} / sqrt(2 * {{kappa}})  # OU stationary sd, if sigma were the volatility of x; in Bansal-Yaron x moves far less than consumption (about 4% of its volatility), so use the model's own x volatility
half_life = log(2) / {{kappa}}  # half-life of shock in years

println("State variable std:   ", round(sigma_x, digits=5))
println("Shock half-life:      ", round(half_life, digits=2), " years")  # persistence of expected growth shocks
'''
