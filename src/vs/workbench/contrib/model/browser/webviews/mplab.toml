[[bullets]]
text = "Interior Point"
detail = "Uno's ipopt preset: a barrier on the inequalities, Newton steps with the exact Hessian, a line search and Wächter's filter, in the manner of Ipopt"

[[bullets]]
text = "Filter SQP"
detail = "Uno's filtersqp preset, its default: quadratic subproblems with the inequalities kept, in a trust region, with Fletcher's filter"

[[bullets]]
text = "Funnel SQP"
detail = "Uno's funnelsqp preset: the same quadratic subproblems and trust region, with a funnel, a shrinking bound on the infeasibility, in place of the filter"

[[bullets]]
text = "Filter SLP"
detail = "Uno's filterslp preset: linear subproblems with no Hessian, in a trust region, with Fletcher's filter"

[[decisionRows]]
task = "Interior Point"
context = "Large, many inequalities"
purpose = "A barrier that keeps the iterates inside the bounds, with one Newton system per iteration whatever the number of active constraints"

[[decisionRows]]
task = "Filter SQP"
context = "Small or medium, warm starts"
purpose = "Quadratic subproblems that identify the active constraints, usually in few iterations"

[[decisionRows]]
task = "Funnel SQP"
context = "Control of infeasibility"
purpose = "The same subproblems, with steps judged against one shrinking bound on the infeasibility instead of a list of pairs"

[[decisionRows]]
task = "Filter SLP"
context = "No second derivatives"
purpose = "Linear subproblems in a trust region, cheap per iteration, at the cost of many more iterations near the solution"

[[inputs]]
id = "problem"
label = "Problem"
tooltip = "The test problem: HS071 and HS015 from the collection of Hock and Schittkowski, and a complementarity problem, x[1] x[2] <= 0 with x >= 0, at whose solutions no constraint qualification holds. Replace the model with your own JuMP model in the generated code."
kind = "select"
default = "hs071"

[[inputs.options]]
value = "hs071"
label = "HS071 (Four Variables, Two Constraints)"

[[inputs.options]]
value = "hs015"
label = "HS015 (a Constrained Rosenbrock)"

[[inputs.options]]
value = "complementarity"
label = "Degenerate Complementarity"

[[inputs]]
id = "inequality"
label = "Inequality Handling"
tooltip = "How the subproblem treats the inequalities: kept as inequalities in each subproblem (SQP and SLP), or replaced by a barrier (interior point). As in the Preset keeps the tab's choice."
kind = "select"
default = "preset"
newRow = true

[[inputs.options]]
value = "preset"
label = "As in the Preset"

[[inputs.options]]
value = "inequality_constrained"
label = "Inequality-Constrained Subproblems"

[[inputs.options]]
value = "interior_point"
label = "Interior Point"

[[inputs]]
id = "hessian"
label = "Hessian Model"
tooltip = "The second-order information in the subproblem: the exact Hessian of the Lagrangian, a quasi-Newton approximation built from gradients (L-BFGS, L-SR1), the identity, or none (zero, which turns SQP into SLP). As in the Preset keeps the tab's choice."
kind = "select"
default = "preset"

[[inputs.options]]
value = "preset"
label = "As in the Preset"

[[inputs.options]]
value = "exact"
label = "Exact"

[[inputs.options]]
value = "LBFGS"
label = "L-BFGS"

[[inputs.options]]
value = "LSR1"
label = "L-SR1"

[[inputs.options]]
value = "identity"
label = "Identity"

[[inputs.options]]
value = "zero"
label = "Zero"

[[inputs]]
id = "mechanism"
label = "Globalization Mechanism"
tooltip = "How a step is shortened when it is rejected: a trust region, which bounds the step before it is computed, or a line search, which backtracks along it. As in the Preset keeps the tab's choice."
kind = "select"
default = "preset"
newRow = true

[[inputs.options]]
value = "preset"
label = "As in the Preset"

[[inputs.options]]
value = "TR"
label = "Trust Region"

[[inputs.options]]
value = "LS"
label = "Line Search"

[[inputs]]
id = "strategy"
label = "Globalization Strategy"
