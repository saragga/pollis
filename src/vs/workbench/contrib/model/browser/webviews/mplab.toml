kind = "select"
default = "preset"

[[inputs.options]]
value = "preset"
label = "As in the Preset"

[[inputs.options]]
value = "fletcher_filter_method"
label = "Fletcher's Filter"

[[inputs.options]]
value = "waechter_filter_method"
label = "Wächter's Filter"

[[inputs.options]]
value = "funnel_method"
label = "Funnel"

[[inputs.options]]
value = "merit_function"
label = "Merit Function"

[[codeBranches]]
model = "interiorpoint"
code = '''
using JuMP, UnoSolver, NLPModelsJuMP

model = Model()  # the test problem; replace it with your own JuMP model
{{?problem=hs071}}@variable(model, 1 <= x[i = 1:4] <= 5, start = [1, 5, 5, 1][i])  # HS071
{{?problem=hs071}}@objective(model, Min, x[1] * x[4] * (x[1] + x[2] + x[3]) + x[3])
{{?problem=hs071}}@constraint(model, prod(x) >= 25)
{{?problem=hs071}}@constraint(model, sum(x .^ 2) == 40)
{{?problem=hs015}}@variable(model, x[i = 1:2], start = [-2, 1][i])  # HS015
{{?problem=hs015}}set_upper_bound(x[1], 0.5)
{{?problem=hs015}}@objective(model, Min, 100 * (x[2] - x[1]^2)^2 + (1 - x[1])^2)
{{?problem=hs015}}@constraint(model, x[1] * x[2] >= 1)
{{?problem=hs015}}@constraint(model, x[1] + x[2]^2 >= 0)
{{?problem=complementarity}}@variable(model, x[i = 1:2] >= 0, start = [2, 0.5][i])  # x[1] = 0 or x[2] = 0
{{?problem=complementarity}}@objective(model, Min, (x[1] - 1)^2 + (x[2] - 1)^2)
{{?problem=complementarity}}@constraint(model, x[1] * x[2] <= 0)
nlp = MathOptNLPModel(model)  # the JuMP model as an NLPModel, for which Uno reports its counts

preset = "ipopt"  # a barrier, Newton steps, a line search and a filter
ingredients = Dict(  # what the ipopt preset sets
    :inequality_handling_method => "interior_point",
    :hessian_model => "exact",
    :globalization_mechanism => "LS",
    :globalization_strategy => "waechter_filter_method",
)
{{?inequality!=preset}}ingredients[:inequality_handling_method] = "{{inequality}}"
{{?hessian!=preset}}ingredients[:hessian_model] = "{{hessian}}"
{{?mechanism!=preset}}ingredients[:globalization_mechanism] = "{{mechanism}}"
{{?strategy!=preset}}ingredients[:globalization_strategy] = "{{strategy}}"
supported(preset, ing) = !(ing[:inequality_handling_method] == "interior_point" && ing[:globalization_mechanism] == "TR")  # Uno has no trust-region interior-point method
supported(preset, ingredients) || error("Uno has no trust-region interior-point method: choose a Line Search")  # Uno would stop Julia
stats = uno(nlp; preset, logger = "SILENT", ingredients...)

(status = stats.status, objective = stats.objective, x = stats.solution, iterations = stats.iter)
'''

