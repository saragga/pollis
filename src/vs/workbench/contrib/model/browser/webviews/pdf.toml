[[actionGroups.actions]]
id = "check-results"
label = "Check Against Your Results"
desc = "Do your estimates round to the numbers printed in the table? Each row label with your values, column by column"
models = ["tables"]
code = '''
# Your estimates at full precision, by row label and column: example values, to replace with those of your replication
yours = ["Schooling" => [0.0813, 0.0741], "Experience" => [missing, 0.0327], "Constant" => [1.2139, 0.9782]]
for (label, estimates) in yours
	i = findfirst(==(label), cells[:, 1])
	i === nothing && (println(label, ": not a row label of the table"); continue)
	for (j, x) in enumerate(estimates)
		printed = cells[i, j + 1]
		m = match(r"-?\d+\.(?<d>\d+)", replace(printed, "−" => "-"))  # the number, with a Unicode minus as -
		(ismissing(x) || m === nothing) && continue
		same = round(x; digits = length(m[:d])) == parse(Float64, m.match)
		println(rpad(label, 14), "column ", j, ": printed ", rpad(printed, 10), " yours ", rpad(x, 8), same ? " matches" : " <- differs at the printed precision")
	end
end
'''

[[actionGroups.actions]]
id = "extraction-accuracy"
label = "Extraction Accuracy"
desc = "The extracted cells against the true ones in the attached table1.csv: the share right, and each cell that differs"
models = ["tables"]
code = '''
using CSV, Tables

occursin("table1.csv", read(`$(pdfdetach()) $pw -list $pdf`, String)) || error("No table1.csv attached: make a test PDF with Make Your Own Test PDF")
truefile = joinpath(mktempdir(), "table1.csv")
run(`$(pdfdetach()) $pw -savefile table1.csv -o $truefile $pdf`)
truth = coalesce.(Tables.matrix(CSV.File(truefile; delim = ';', header = false, types = String)), "")
size(truth) == size(cells) || println("Size: extracted ", size(cells), ", true ", size(truth))
r, c = min.(size(truth), size(cells))
wrong = [(i, j) for i in 1:r for j in 1:c if strip(cells[i, j]) != strip(truth[i, j])]
right = r * c - length(wrong)
println("Cells right: ", right, " of ", length(truth), " (", round(100 * right / length(truth), digits = 1), "%)")
foreach(((i, j),) -> println("  row ", i, ", column ", j, ": extracted \"", cells[i, j], "\", true \"", truth[i, j], "\""), wrong)
'''

