# PDF Files Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/pdf.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "PDF Files"
viewType = "pollis.pdf"
defaultModel = "text"
decisionFirstColumn = "Tab"

[[packages]]
name = "Poppler_jll.jl"
github = "https://github.com/JuliaBinaryWrappers/Poppler_jll.jl"

# Further packages the examples use: checked by the install indicator, not listed on the Powered-by line
[requires]
packages = ["CSV.jl", "FileIO.jl", "ImageIO.jl", "Plots.jl", "PollisDatasets.jl", "PollisTeX.jl", "Tables.jl"]

[[wikis]]
name = "Factsheet"
file = "pdf/factsheet.md"
bundled = true
description = "The ten tabs, their inputs, the Poppler tool behind each and the files they write"

[[wikis]]
name = "Overview"
file = "pdf/overview.md"
bundled = true
description = "What a PDF holds, what Poppler's tools read from it and how the panel uses them"

[[wikis]]
name = "Diagnostics"
file = "pdf/diagnostics.md"
bundled = true
description = "Scanned pages, fonts that are not embedded, encrypted files and text in the wrong order"

[[wikis]]
name = "Decision Guide"
file = "pdf/decision-guide.md"
bundled = true
description = "Which tab and which options for a task, from quoting a passage to replicating a table"

[[wikis]]
separator = true
label = "Methods"

[[wikis]]
name = "Text and Tables"
file = "pdf/text-and-tables.md"
bundled = true
description = "The three text orders of pdftotext, word boxes, and how the Tables tab builds rows and columns"

[[wikis]]
name = "Areas of a Page"
file = "pdf/areas.md"
bundled = true
description = "Coordinates in points, the area inputs, and how each tab crops to an area"

[[wikis]]
name = "Rendering and Conversion"
file = "pdf/rendering-and-conversion.md"
bundled = true
description = "Page images at a resolution, vector formats, HTML and XML"

[[wikis]]
name = "Pages and Attachments"
file = "pdf/pages-and-attachments.md"
bundled = true
description = "Splitting, merging, and listing, saving and adding embedded files"

[[references]]
separator = true
label = "Software"

[[references]]
key = "PD2025a"

[[references]]
key = "Qui2023a"

[[references]]
key = "Qui2023c"

