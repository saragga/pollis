[[bullets]]
text = "Extract Text"
detail = "<code>pdftotext</code> writes the text of a page range in reading order, in its physical layout or in content stream order, from the whole page or an area"

[[bullets]]
text = "Tables"
detail = "The words of an area, with their boxes from <code>pdftotext -tsv</code>, grouped into rows by height and into columns by the gaps between them"

[[bullets]]
text = "Document Info"
detail = "<code>pdfinfo</code> prints the title, author, pages, page size, PDF version and encryption, or the XMP metadata, page boxes, links, named destinations, structure tree or JavaScript"

[[bullets]]
text = "Fonts"
detail = "<code>pdffonts</code> lists the fonts of a page range: type, encoding, whether each is embedded and subset, or the substitutes used for fonts that are not embedded"

[[bullets]]
text = "Images"
detail = "<code>pdfimages</code> lists the images of a page range with their size, colour and resolution, or saves them in their own format or as PNG"

[[bullets]]
text = "Render Pages"
detail = "<code>pdftoppm</code> draws pages, or an area of them, as PNG, JPEG or TIFF images at a resolution, in colour, grey or black and white"

[[bullets]]
text = "Convert"
detail = "<code>pdftocairo</code>, <code>pdftops</code> and <code>pdftohtml</code> turn pages into SVG, PDF, PostScript, EPS, HTML or XML; SVG and PDF can be cropped to an area"

[[bullets]]
text = "Split"
detail = "<code>pdfseparate</code> writes one file per page, or a page range into one file with <code>pdfunite</code>"

[[bullets]]
text = "Merge"
detail = "<code>pdfunite</code> joins whole files, in order, into one"

[[bullets]]
text = "Attachments"
detail = "<code>pdfdetach</code> lists or saves the files embedded in a PDF, and <code>pdfattach</code> adds one"

