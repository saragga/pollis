{{?last!=end}}pages = {{first}}:{{last}}
{{?region=area}}area = (x = {{left}}, y = {{top}}, W = {{width}}, H = {{height}})  # in points from the top left corner of the page
{{?region=area}}cropargs(scale = 1) = collect(Iterators.flatten(("-$k", string(round(Int, v * scale))) for (k, v) in pairs(area)))

res = {{resolution}}  # pixels per inch
opts = ["-{{imageformat}}", "-r", string(res), "-f", string(first(pages)), "-l", string(last(pages))]
{{?colour=gray}}push!(opts, "-gray")
{{?colour=mono}}push!(opts, "-mono")
{{?region=area}}append!(opts, cropargs(res / 72))  # pdftoppm takes the area in pixels: points x resolution / 72
dir = stem * "_pages"
mkpath(dir)
run(`$(pdftoppm()) $pw $opts $pdf $(joinpath(dir, stem))`)  # one image per page, numbered
foreach(println, readdir(dir; join = true))
'''

[[codeBranches]]
model = "convert"
code = '''
using Poppler_jll  # the Poppler tools: pdftotext(), pdfinfo(), ...

{{?path=sample.pdf}}using PollisDatasets  # curated example datasets and sample files
{{?path=sample.pdf}}# Example file: the sample PDF of PollisDatasets, three pages with a figure, a regression table (Table 1) and notes. Replace "sample.pdf" with your own file.
{{?path=sample.pdf}}pdf = samplefile("sample.pdf")
{{?path!=sample.pdf}}pdf = "{{path}}"
{{?password=}}pw = String[]  # no password
{{?password!=}}pw = ["-upw", "{{password}}"]  # the user password of an encrypted file
info = read(`$(pdfinfo()) $pw $pdf`, String)
npages = parse(Int, match(r"Pages:\s+(?<n>\d+)", info)[:n])
stem = first(splitext(basename(pdf)))  # output files go to the working directory, named after the PDF
{{?last=end}}pages = {{first}}:npages
{{?last!=end}}pages = {{first}}:{{last}}
{{?region=area}}area = (x = {{left}}, y = {{top}}, W = {{width}}, H = {{height}})  # in points from the top left corner of the page
{{?region=area}}cropargs(scale = 1) = collect(Iterators.flatten(("-$k", string(round(Int, v * scale))) for (k, v) in pairs(area)))

{{?region=page}}crop = String[]
{{?region=area}}crop = [cropargs(); "-paperw"; string(area.W); "-paperh"; string(area.H)]  # in points for vector output, on pages the size of the area
{{?format=svg}}for p in pages  # one SVG file per page
{{?format=svg}}	run(`$(pdftocairo()) $pw -svg $crop -f $p -l $p $pdf $(stem)-$p.svg`)
{{?format=svg}}	println("Wrote ", stem, "-", p, ".svg")
{{?format=svg}}end
{{?format=pdf}}{{?region=page}}out = stem * "_cairo.pdf"
{{?format=pdf}}{{?region=area}}out = stem * "_area.pdf"
{{?format=pdf}}run(`$(pdftocairo()) $pw -pdf $crop -f $(first(pages)) -l $(last(pages)) $pdf $out`)
{{?format=pdf}}println("Wrote ", out)
{{?format=ps}}run(`$(pdftops()) $pw -f $(first(pages)) -l $(last(pages)) $pdf $(stem).ps`)  # PostScript level 2; -level3 for level 3
{{?format=ps}}println("Wrote ", stem, ".ps")
{{?format=eps}}run(`$(pdftops()) $pw -eps -f $(first(pages)) -l $(first(pages)) $pdf $(stem)-$(first(pages)).eps`)  # EPS holds one page
{{?format=eps}}println("Wrote ", stem, "-", first(pages), ".eps")
{{?format=html}}dir = stem * "_html"
{{?format=html}}mkpath(dir)
{{?format=html}}run(`$(pdftohtml()) $pw -s -noframes -q -f $(first(pages)) -l $(last(pages)) $pdf $(joinpath(dir, stem))`)  # -s: one HTML file for all pages, with the images beside it
{{?format=html}}foreach(println, readdir(dir; join = true))
{{?format=xml}}run(`$(pdftohtml()) $pw -xml -i -q -f $(first(pages)) -l $(last(pages)) $pdf $stem`)  # -i leaves out the images
{{?format=xml}}println("Wrote ", stem, ".xml: one text element per line of text, with its position, size and font")
'''

