desc = "Fonts that are not embedded or not mapped to Unicode: they print with substitutes, or extract as odd characters"
code = '''
listing = readlines(`$(pdffonts()) $pw $pdf`)
cols = findall(r"-+", listing[2])  # the dashes under the header mark the columns
field(l, k) = strip(l[first(cols[k]):min(last(cols[k]), lastindex(l))])
fonts = listing[3:end]
notembedded = [field(l, 1) for l in fonts if field(l, 4) == "no"]
nounicode = [field(l, 1) for l in fonts if field(l, 6) == "no"]
println(length(fonts), " fonts, ", length(notembedded), " not embedded, ", length(nounicode), " without a Unicode map")
foreach(n -> println("  not embedded: ", n), notembedded)
foreach(n -> println("  no Unicode map: ", n), nounicode)
'''

