[[codeBranches]]
model = "text"
code = '''
using Poppler_jll  # the Poppler tools: pdftotext(), pdfinfo(), ...

{{?path=sample.pdf}}using PollisDatasets  # curated example datasets and sample files
{{?path=sample.pdf}}# Example file: the sample PDF of PollisDatasets, three pages with a figure, a regression table (Table 1) and notes. Replace "sample.pdf" with your own file.
{{?path=sample.pdf}}pdf = samplefile("sample.pdf")
{{?path!=sample.pdf}}pdf = "{{path}}"
{{?password=}}pw = String[]  # no password
{{?password!=}}pw = ["-upw", "{{password}}"]  # the user password of an encrypted file
info = read(`$(pdfinfo()) $pw $pdf`, String)
npages = parse(Int, match(r"Pages:\s+(?<n>\d+)", info)[:n])
stem = first(splitext(basename(pdf)))  # output files go to the working directory, named after the PDF
{{?last=end}}pages = {{first}}:npages
{{?last!=end}}pages = {{first}}:{{last}}
{{?region=area}}area = (x = {{left}}, y = {{top}}, W = {{width}}, H = {{height}})  # in points from the top left corner of the page
{{?region=area}}cropargs(scale = 1) = collect(Iterators.flatten(("-$k", string(round(Int, v * scale))) for (k, v) in pairs(area)))

opts = ["-f", string(first(pages)), "-l", string(last(pages))]
{{?layout=layout}}push!(opts, "-layout")  # keep the physical layout: columns stay side by side
{{?layout=raw}}push!(opts, "-raw")  # the order in which the file draws the text
{{?region=area}}append!(opts, cropargs())  # pdftotext takes the area in pixels at 72 dpi, that is in points
text = read(`$(pdftotext()) $pw $opts $pdf -`, String)  # - writes to standard output
println(first(text, 3000))
println(length(split(text)), " words on pages ", first(pages), " to ", last(pages), " of ", npages)
'''

[[codeBranches]]
model = "tables"
code = '''
using Poppler_jll  # the Poppler tools: pdftotext(), pdfinfo(), ...

{{?path=sample.pdf}}using PollisDatasets  # curated example datasets and sample files
{{?path=sample.pdf}}# Example file: the sample PDF of PollisDatasets, with Table 1, a regression table, on page 2, framed by the default area. Replace "sample.pdf" with your own file.
{{?path=sample.pdf}}pdf = samplefile("sample.pdf")
{{?path!=sample.pdf}}pdf = "{{path}}"
{{?password=}}pw = String[]  # no password
{{?password!=}}pw = ["-upw", "{{password}}"]  # the user password of an encrypted file
info = read(`$(pdfinfo()) $pw $pdf`, String)
npages = parse(Int, match(r"Pages:\s+(?<n>\d+)", info)[:n])
stem = first(splitext(basename(pdf)))  # output files go to the working directory, named after the PDF
page = {{page}}
area = (x = {{left}}, y = {{top}}, W = {{width}}, H = {{height}})  # in points from the top left corner of the page

# One line per word, with its box: level, page, paragraph, block, line, word, left, top, width, height, confidence, text
tsv = read(`$(pdftotext()) $pw -tsv -f $page -l $page $pdf -`, String)
words = @NamedTuple{x::Float64, y::Float64, w::Float64, text::String}[]
for line in split(tsv, '\n')[2:end]
	f = split(line, '\t')
	(length(f) == 12 && f[1] == "5") || continue  # level 5 is a word
	x, y, w, h = parse.(Float64, f[7:10])
	inside = area.x <= x + w / 2 <= area.x + area.W && area.y <= y + h / 2 <= area.y + area.H  # the centre of the word
	inside && push!(words, (x = x, y = y, w = w, text = String(f[12])))
end
isempty(words) && error("No words in the area of page $page: check Page and the area, or the page may be a scan")

# Rows: words whose tops are within the row tolerance
sort!(words, by = w -> (w.y, w.x))
rows = [[words[1]]]
for w in words[2:end]
	w.y - rows[end][1].y <= {{rowtol}} ? push!(rows[end], w) : push!(rows, [w])
end

# Columns: the horizontal spans of the words, merged unless a gap of at least the column gap separates them
spans = sort([(w.x, w.x + w.w) for w in words])
cols = [spans[1]]
for (a, b) in spans[2:end]
	a - cols[end][2] < {{gap}} ? (cols[end] = (cols[end][1], max(cols[end][2], b))) : push!(cols, (a, b))
end

cells = fill("", length(rows), length(cols))
for (i, row) in enumerate(rows), w in sort(row, by = w -> w.x)
	j = findlast(c -> c[1] <= w.x + w.w / 2, cols)
	cells[i, j] = isempty(cells[i, j]) ? w.text : cells[i, j] * " " * w.text
end
widths = [maximum(length, cells[:, j]) for j in axes(cells, 2)]
for i in axes(cells, 1)
	println(join(rpad.(cells[i, :], widths .+ 2)))
end
println(size(cells, 1), " rows x ", size(cells, 2), " columns, from page ", page)
'''

[[codeBranches]]
model = "info"
code = '''
using Poppler_jll  # the Poppler tools: pdftotext(), pdfinfo(), ...

{{?path=sample.pdf}}using PollisDatasets  # curated example datasets and sample files
{{?path=sample.pdf}}# Example file: the sample PDF of PollisDatasets, three pages with a figure, a regression table (Table 1) and notes. Replace "sample.pdf" with your own file.
{{?path=sample.pdf}}pdf = samplefile("sample.pdf")
{{?path!=sample.pdf}}pdf = "{{path}}"
{{?password=}}pw = String[]  # no password
{{?password!=}}pw = ["-upw", "{{password}}"]  # the user password of an encrypted file
info = read(`$(pdfinfo()) $pw -isodates $pdf`, String)  # dates as ISO 8601
npages = parse(Int, match(r"Pages:\s+(?<n>\d+)", info)[:n])
stem = first(splitext(basename(pdf)))  # output files go to the working directory, named after the PDF

{{?detail=summary}}print(info)
{{?detail=meta}}meta = read(`$(pdfinfo()) $pw -meta $pdf`, String)  # the XMP metadata stream
{{?detail=meta}}println(isempty(meta) ? "No XMP metadata stream" : meta)
{{?detail=box}}run(`$(pdfinfo()) $pw -box -f 1 -l $npages $pdf`)  # MediaBox, CropBox, BleedBox, TrimBox and ArtBox of each page, in points
{{?detail=url}}run(`$(pdfinfo()) $pw -url $pdf`)  # page, type and address of each link
{{?detail=dests}}run(`$(pdfinfo()) $pw -dests $pdf`)  # the targets that links and bookmarks jump to
{{?detail=struct}}println(match(r"Tagged:\s+(?<t>\w+)", info)[:t] == "yes" ? read(`$(pdfinfo()) $pw -struct-text $pdf`, String) : "Not tagged: the file has no structure tree")
{{?detail=js}}js = read(`$(pdfinfo()) $pw -js $pdf`, String)
{{?detail=js}}println(isempty(js) ? "No JavaScript" : js)
'''

[[codeBranches]]
model = "fonts"
code = '''
using Poppler_jll  # the Poppler tools: pdftotext(), pdfinfo(), ...

{{?path=sample.pdf}}using PollisDatasets  # curated example datasets and sample files
{{?path=sample.pdf}}# Example file: the sample PDF of PollisDatasets, three pages with a figure, a regression table (Table 1) and notes. Replace "sample.pdf" with your own file.
{{?path=sample.pdf}}pdf = samplefile("sample.pdf")
{{?path!=sample.pdf}}pdf = "{{path}}"
{{?password=}}pw = String[]  # no password
{{?password!=}}pw = ["-upw", "{{password}}"]  # the user password of an encrypted file
info = read(`$(pdfinfo()) $pw $pdf`, String)
npages = parse(Int, match(r"Pages:\s+(?<n>\d+)", info)[:n])
stem = first(splitext(basename(pdf)))  # output files go to the working directory, named after the PDF
{{?last=end}}pages = {{first}}:npages
{{?last!=end}}pages = {{first}}:{{last}}

{{?fontmode=used}}# emb: embedded in the file; sub: a subset, with only the characters used; uni: mapped to Unicode, so its text can be extracted
{{?fontmode=used}}run(`$(pdffonts()) $pw -f $(first(pages)) -l $(last(pages)) $pdf`)
{{?fontmode=subst}}# The fonts drawn in place of those that are not embedded: an empty list when every font is embedded
{{?fontmode=subst}}run(`$(pdffonts()) $pw -subst -f $(first(pages)) -l $(last(pages)) $pdf`)
'''

[[codeBranches]]
model = "images"
code = '''
using Poppler_jll  # the Poppler tools: pdftotext(), pdfinfo(), ...

{{?path=sample.pdf}}using PollisDatasets  # curated example datasets and sample files
{{?path=sample.pdf}}# Example file: the sample PDF of PollisDatasets, with an engraving of Julius Caesar, stored as a JPEG, on page 1. Replace "sample.pdf" with your own file.
{{?path=sample.pdf}}pdf = samplefile("sample.pdf")
{{?path!=sample.pdf}}pdf = "{{path}}"
{{?password=}}pw = String[]  # no password
{{?password!=}}pw = ["-upw", "{{password}}"]  # the user password of an encrypted file
info = read(`$(pdfinfo()) $pw $pdf`, String)
npages = parse(Int, match(r"Pages:\s+(?<n>\d+)", info)[:n])
stem = first(splitext(basename(pdf)))  # output files go to the working directory, named after the PDF
{{?last=end}}pages = {{first}}:npages
{{?last!=end}}pages = {{first}}:{{last}}
pagerange = ["-f", string(first(pages)), "-l", string(last(pages))]

{{?imagemode=list}}# Page, number, type, size in pixels, colour space, components, bits per component, encoding, resolution (ppi) and size in the file
{{?imagemode=list}}run(`$(pdfimages()) $pw -list $pagerange $pdf`)
{{?imagemode!=list}}dir = stem * "_images"
{{?imagemode!=list}}mkpath(dir)
{{?imagemode=all}}run(`$(pdfimages()) $pw -all -p $pagerange $pdf $(joinpath(dir, stem))`)  # -p puts the page number in each file name
{{?imagemode=png}}run(`$(pdfimages()) $pw -png -p $pagerange $pdf $(joinpath(dir, stem))`)  # -p puts the page number in each file name
{{?imagemode!=list}}saved = readdir(dir; join = true)
{{?imagemode!=list}}isempty(saved) ? println("No images on pages ", first(pages), " to ", last(pages)) : foreach(println, saved)
'''

