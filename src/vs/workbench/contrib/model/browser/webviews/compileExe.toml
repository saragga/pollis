# Compile Julia to an Executable Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/compileExe.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Compile Julia to an Executable"
viewType = "pollis.compileExe"
defaultModel = "juliac"
decisionFirstColumn = "Tool"

[[packages]]
name = "JuliaC.jl"
github = "https://github.com/JuliaLang/JuliaC.jl"

[[packages]]
name = "PackageCompiler.jl"
github = "https://github.com/JuliaLang/PackageCompiler.jl"

[[packages]]
name = "StaticCompiler.jl"
github = "https://github.com/tshort/StaticCompiler.jl"

[[packages]]
name = "StaticTools.jl"
github = "https://github.com/brenhinkeller/StaticTools.jl"

[requires]
packages = ["Plots.jl", "PNGFiles.jl"]

[[wikis]]
name = "Overview"
file = "compileExe/overview.md"
bundled = true
description = "Three tools that compile the same Julia program to an executable, the program's command line and output, and the check against Julia pixel by pixel"

[[wikis]]
name = "Factsheet"
file = "compileExe/factsheet.md"
bundled = true
description = "Tools, requirements, build calls, entry points, inputs, files, names and actions at a glance"

[[wikis]]
name = "Entry Points and Arguments"
file = "compileExe/entry-points.md"
bundled = true
description = "Where each program starts: @main of juliac and of julia scripts, julia_main of PackageCompiler, main(argc, argv) of StaticCompiler, and how each reads its command line"

[[wikis]]
name = "Start-Up Time"
file = "compileExe/startup.md"
bundled = true
description = "What happens between starting a program and its first result, for a compiled program and for julia running a script, and how the page times it"

[[wikis]]
name = "Writing for StaticCompiler"
file = "compileExe/staticcompiler.md"
bundled = true
description = "A program with no Julia runtime: memory by hand with MallocArray, strings on the stack with StaticString, files and printing through the C library, and conversions that cannot throw"

[[wikis]]
name = "Shipping an Executable"
file = "compileExe/shipping.md"
bundled = true
description = "The folder each tool makes, what it holds, how the program finds its libraries, and what it needs on another computer"

[[models]]
id = "juliac"
label = "JuliaC"

[[models]]
id = "packagecompiler"
label = "PackageCompiler"

[[models]]
id = "staticcompiler"
label = "StaticCompiler"

[[bullets]]
text = "The same Julia program, which computes the count of every pixel with fill_counts, compiled to an executable by three tools: juliac of JuliaC.jl, PackageCompiler and StaticCompiler"
detail = ""

[[bullets]]
text = "Two examples in every tab: the Mandelbrot set, and the Julia set of a point c, each the number of iterations of z^2 + c before |z| passes 2, for each pixel"
detail = ""

[[bullets]]
text = "The program reads the inputs from its command line, writes the counts to a file and prints the pixels inside; Julia compares the counts with its own, pixel by pixel"
detail = ""

[[bullets]]
text = "Start-Up and Run Time sets each program beside julia running the same code as a script, which has to compile it before it runs"
detail = ""

[[decisionRows]]
task = "JuliaC"
context = "Trimmed runtime"
purpose = "juliac --output-exe --trim=safe compiles a program that starts at @main, with only the code it reaches, into a folder with the Julia libraries it needs; Julia 1.12 or later"

[[decisionRows]]
task = "PackageCompiler"
context = "Whole runtime"
purpose = "create_app compiles a package that has julia_main into an app folder with a whole system image; any Julia code, even code compiled while the program runs, but large and slow to build"

[[decisionRows]]
task = "StaticCompiler"
context = "No runtime"
purpose = "compile_executable compiles main(argc, argv), written with StaticTools, into one small file with no Julia runtime; only for code that manages its memory by hand and throws no errors (experimental)"

[[inputs]]
id = "example"
label = "Example"
tooltip = "The Mandelbrot set starts z at 0 and puts c at the pixel; the Julia set of c starts z at the pixel and keeps c fixed."
kind = "tabs"
default = "mandelbrot"

[[inputs.options]]
value = "mandelbrot"
label = "Mandelbrot Set"

[[inputs.options]]
value = "julia"
label = "Julia Set"

[[inputs]]
id = "width"
label = "Pixels Across"
tooltip = "The number of pixels across the picture; the number down follows from the shape of the region drawn, with square pixels."
default = "800"

[[inputs]]
id = "maxiter"
label = "Iterations"
tooltip = "The most iterations of z^2 + c for a pixel; a pixel that has not escaped by then counts as inside the set."
default = "256"

[[inputs]]
id = "cre"
label = "Real Part of c"
tooltip = "The real part of the fixed point c of the Julia set. The Mandelbrot set does not use it."
default = "-0.8"

[[inputs]]
id = "cim"
label = "Imaginary Part of c"
tooltip = "The imaginary part of the fixed point c of the Julia set. The Mandelbrot set does not use it."
default = "0.156"

[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Where the programs are built, in a folder for each tool: programs/executables of the open Pollis Workspace, otherwise in Pollis's own folder. A program is built again when its source or the Julia version changes."
default = "~/.pollis/programs/executables"
folder = "programs/executables"
newRow = true

[[codeBranches]]
model = "juliac"
code = '''
import Pkg

# The example: the Mandelbrot set, or the Julia set of c, on a grid of pixels
julia_set = "{{example}}" == "julia"
c = complex({{cre}}, {{cim}})  # the fixed point of the Julia set; the Mandelbrot set does not use it
x0, x1, y0, y1 = julia_set ? (-1.6, 1.6, -1.0, 1.0) : (-2.2, 0.8, -1.2, 1.2)
width = {{width}}
height = round(Int, width * (y1 - y0) / (x1 - x0))
spacing = (x1 - x0) / (width - 1)  # the distance between two pixels, across and down
maxiter = Int32({{maxiter}})

# The Julia code that computes the counts and draws them: the iterations of z^2 + c before |z| passes 2 for one pixel;
# fill_counts, which writes the count of every pixel into memory it is given, column by column, and returns the
# number inside; and fill_picture, which writes the picture of the counts as a BMP file into memory it is given. Only
# native types in and out, no allocation, no error thrown: code that every tool can compile
kernel_code = """
function escape_time(zr, zi, cr, ci, maxiter::Int32)
    k = zero(maxiter)
    while k < maxiter
        zr2 = zr * zr
        zi2 = zi * zi
        zr2 + zi2 > 4.0 && return k
        zi = 2.0 * zr * zi + ci
        zr = zr2 - zi2 + cr
        k += one(maxiter)
    end
    return maxiter
end

function fill_counts(counts::Ptr{Int32}, height::Int64, width::Int64, x0::Float64, y0::Float64, spacing::Float64,
                     julia_set::Int32, cr::Float64, ci::Float64, maxiter::Int32)::Int64
    inside = 0
    for j in 1:width, i in 1:height
        x = x0 + (j - 1) * spacing
        y = y0 + (i - 1) * spacing
        steps = julia_set != 0 ? escape_time(x, y, cr, ci, maxiter) : escape_time(0.0, 0.0, x, y, maxiter)
        unsafe_store!(counts, steps, i + (j - 1) * height)
        inside += steps == maxiter
    end
    return inside
end

# The size of the picture as a BMP file: a header of 54 bytes, then each row of pixels, 3 bytes each, padded to a
# multiple of 4 bytes
picture_bytes(height::Int64, width::Int64) = 54 + ((3 * width + 3) & ~3) * height

# The colour of a pixel from its count k: black inside the set; outside, s = k / (k + 8) runs from 0, for a pixel that
# escapes at once, towards 1 near the set, through blue, green and yellow to red
function pixel_colour(k::Int32, maxiter::Int32)
    k == maxiter && return (0x00, 0x00, 0x00)
    s = k / (k + 8.0)
    t = 1.0 - s
    red = unsafe_trunc(UInt8, 255.0 * 9.0 * t * s * s * s)
    green = unsafe_trunc(UInt8, 255.0 * 15.0 * t * t * s * s)
    blue = unsafe_trunc(UInt8, 255.0 * 8.5 * t * t * t * s)
    return (red, green, blue)
end

# Writes value into the picture as count bytes from byte at on, the lowest byte first
function store_bytes!(picture::Ptr{UInt8}, at::Int64, value::Int64, count::Int64)
    for b in 0:count - 1
        unsafe_store!(picture, (value >> (8 * b)) % UInt8, at + b)
    end
end

# Writes the picture into memory of picture_bytes(height, width) bytes: the header, then the rows from the bottom up,
# so that the imaginary part grows upwards, each pixel blue, green and red
function fill_picture(picture::Ptr{UInt8}, counts::Ptr{Int32}, height::Int64, width::Int64, maxiter::Int32)::Int64
    row_bytes = (3 * width + 3) & ~3
    unsafe_store!(picture, 0x42, 1)  # B
    unsafe_store!(picture, 0x4d, 2)  # M
    store_bytes!(picture, 3, picture_bytes(height, width), 4)  # the size of the file
    store_bytes!(picture, 7, 0, 4)  # reserved
    store_bytes!(picture, 11, 54, 4)  # where the pixels start
    store_bytes!(picture, 15, 40, 4)  # the size of the rest of the header
    store_bytes!(picture, 19, width, 4)
    store_bytes!(picture, 23, height, 4)  # positive: the rows from the bottom up
    store_bytes!(picture, 27, 1, 2)  # one plane
    store_bytes!(picture, 29, 24, 2)  # 24 bits a pixel
    store_bytes!(picture, 31, 0, 4)  # no compression
    store_bytes!(picture, 35, row_bytes * height, 4)  # the size of the pixels
    store_bytes!(picture, 39, 2835, 4)  # 72 pixels an inch across, as pixels a metre
    store_bytes!(picture, 43, 2835, 4)  # and down
    store_bytes!(picture, 47, 0, 8)  # no palette
    for i in 1:height
        row = 54 + (i - 1) * row_bytes
        for j in 1:width
            red, green, blue = pixel_colour(unsafe_load(counts, i + (j - 1) * height), maxiter)
            unsafe_store!(picture, blue, row + 3 * j - 2)
            unsafe_store!(picture, green, row + 3 * j - 1)
            unsafe_store!(picture, red, row + 3 * j)
        end
        for p in 3 * width + 1:row_bytes
            unsafe_store!(picture, 0x00, row + p)  # the padding
        end
    end
    return picture_bytes(height, width)
end
"""

# Julia: the same code in this session, filling a Julia matrix through its pointer; GC.@preserve keeps the matrix
# alive while its pointer is in use
include_string(Main, kernel_code)
julia_counts = Matrix{Int32}(undef, height, width)
julia_inside = GC.@preserve julia_counts fill_counts(pointer(julia_counts), height, width, x0, y0, spacing, Int32(julia_set), real(c), imag(c), maxiter)
julia_picture = Vector{UInt8}(undef, picture_bytes(height, width))
GC.@preserve julia_picture julia_counts fill_picture(pointer(julia_picture), pointer(julia_counts), height, width, maxiter)

# The program around fill_counts and fill_picture: it reads the inputs from its command line, fills memory of its own,
# writes the picture and the counts to files and prints the number of pixels inside. Started with no arguments, as by
# a double-click, it draws the Mandelbrot set with the page's defaults into fractal.bmp, in the folder it starts in,
# and opens the picture with the system's viewer through system of the C library; with one argument, it draws the same
# into the file named and opens nothing. It prints to Core.stdout, which a trimmed program keeps
program_code = """
function draw(picture_file::String, counts_file::String, height::Int64, width::Int64, x0::Float64, y0::Float64,
              spacing::Float64, julia_set::Int32, cr::Float64, ci::Float64, maxiter::Int32)::Int64
    counts = Vector{Int32}(undef, height * width)
    picture = Vector{UInt8}(undef, picture_bytes(height, width))
    inside = GC.@preserve counts picture begin
        inside = fill_counts(pointer(counts), height, width, x0, y0, spacing, julia_set, cr, ci, maxiter)
        fill_picture(pointer(picture), pointer(counts), height, width, maxiter)
        inside
    end
    isempty(counts_file) || write(counts_file, counts)
    write(picture_file, picture)
    return inside
end

function fractal(args::Vector{String})::Cint
    if length(args) <= 1
        picture_file = isempty(args) ? "fractal.bmp" : args[1]
        inside = draw(picture_file, "", 640, 800, -2.2, -1.2, 3.0 / 799, Int32(0), 0.0, 0.0, Int32(256))
        println(Core.stdout, "The Mandelbrot set, 800 x 640 pixels, 256 iterations: ", inside, " pixels inside")
        if isempty(args)
            println(Core.stdout, "The picture: fractal.bmp, in the folder the program started in")
            command = Sys.isapple() ? "open fractal.bmp" : Sys.iswindows() ? "start fractal.bmp" : "xdg-open fractal.bmp"
            @ccall system(command::Cstring)::Cint
        else
            println(Core.stdout, "The picture: ", picture_file)
        end
        return 0
    end
    if length(args) != 11
        println(Core.stderr, "usage: fractal [picture.bmp [counts.bin height width x0 y0 spacing julia_set cr ci maxiter]]")
        return 1
    end
    inside = draw(args[1], args[2], parse(Int64, args[3]), parse(Int64, args[4]), parse(Float64, args[5]),
                  parse(Float64, args[6]), parse(Float64, args[7]), parse(Int32, args[8]), parse(Float64, args[9]),
                  parse(Float64, args[10]), parse(Int32, args[11]))
    println(Core.stdout, inside)
    return 0
end
"""

# The whole program as a Julia script: the function marked @main is where it starts, with the arguments of the
# command line, both for juliac and for julia running the script
script_code = kernel_code * program_code * """
function @main(args::Vector{String})::Cint
    return fractal(args)
end
"""

# Toolchain: Julia 1.12 or later and the app juliac of JuliaC.jl, which links the program with the C compiler on the
# path (cc, gcc or clang; MinGW-w64 on Windows)
VERSION >= v"1.12" || error("juliac needs Julia 1.12 or later: this session runs Julia $VERSION")
juliac_app = joinpath(first(DEPOT_PATH), "bin", Sys.iswindows() ? "juliac.bat" : "juliac")
isfile(juliac_app) || Pkg.Apps.add("JuliaC")  # installs juliac in ~/.julia/bin, in an environment of its own

# Build: a program from Julia code that defines fractal(args), started at the function marked @main that calls it, in a
# folder of its own, built again when the code, its packages or the Julia version change, as built_from.txt records. --trim=safe keeps only the code @main reaches; --bundle gathers the
# program in bundle/bin and the Julia libraries it needs in bundle/lib. The project of the folder holds the packages the
# script uses, none here, so that juliac compiles the file alone and not the active environment. The Next Steps that
# add to the program build theirs with build_program too
function build_program(build_folder, code; packages = String[], trim = "safe")
    mkpath(build_folder)
    script = code * "\nfunction @main(args::Vector{String})::Cint\n    return fractal(args)\nend\n"
    script_file = joinpath(build_folder, "fractal.jl")
    write(script_file, script)
    shipped_folder = joinpath(build_folder, "bundle")
    program = joinpath(shipped_folder, "bin", "fractal" * (Sys.iswindows() ? ".exe" : ""))
    built_with = `$juliac_app --output-exe fractal --bundle $shipped_folder --project $build_folder --trim=$trim --experimental $script_file`
    built_from = string("Julia ", VERSION, "\n", join(packages, " "), "\n", trim, "\n\n", script)
    built_from_file = joinpath(build_folder, "built_from.txt")
    if isfile(program) && isfile(built_from_file) && read(built_from_file, String) == built_from
        return (; program, shipped_folder, script_file, built_with, seconds = nothing)
    end
    write(joinpath(build_folder, "Project.toml"), "")
    if !isempty(packages)
        previous = Base.active_project()
        Pkg.activate(build_folder)
        Pkg.add(packages)
        Pkg.activate(previous)
    end
    rm(shipped_folder; force = true, recursive = true)
    seconds = @elapsed run(built_with)
    write(built_from_file, built_from)
    return (; program, shipped_folder, script_file, built_with, seconds)
end

# The program of the page, in juliac/ of the folder
folder = mkpath(joinpath(expanduser(raw"{{folder}}"), "juliac"))
(; program, shipped_folder, script_file, built_with) = build = build_program(folder, kernel_code * program_code)
build_seconds = build.seconds
source_file = script_file

# Run: the files to write and the inputs as arguments, the numbers as repr writes them, which the program reads back
# to the same Float64
counts_file = joinpath(folder, "counts.bin")
picture_file = joinpath(folder, "fractal.bmp")
arguments = [picture_file, counts_file, string(height), string(width), repr(x0), repr(y0), repr(spacing), string(Int(julia_set)), repr(real(c)), repr(imag(c)), string(maxiter)]
command = `$program $arguments`
compiled_inside = parse(Int, readchomp(command))
compiled_counts = read!(counts_file, Matrix{Int32}(undef, height, width))
tool = "JuliaC"

# Julia running the same program as a script, with the same arguments, for Start-Up and Run Time
script_command = `$(Base.julia_cmd()) --startup-file=no $script_file $arguments`

# The programs of this session, tool by tool, for Compare
programs = @isdefined(programs) ? programs : Dict{String, Any}()
programs[tool] = (seconds = something(build_seconds, get(programs, tool, (seconds = NaN,)).seconds), bytes = filesize(program), folder = shipped_folder, command = command)

# Check: the count of every pixel, the program against Julia
differ = count(compiled_counts .!= julia_counts)
println(differ == 0 ? "The program of juliac and Julia give the same count at all $(length(julia_counts)) pixels" : "The program of juliac and Julia differ at $differ of $(length(julia_counts)) pixels")
println("Pixels inside: $compiled_inside from the program, $julia_inside from Julia")
println(read(picture_file) == julia_picture ? "The picture is the same as Julia's, byte for byte" : "The picture differs from Julia's")
println("The picture: ", picture_file)
println("The program: ", program)
println("Run it with: ", command)
'''

