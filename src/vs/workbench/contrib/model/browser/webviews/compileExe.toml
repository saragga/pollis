[[actionGroups.actions]]
id = "contents"
label = "Program Contents"
desc = "The size of the program and of the folder it comes in, and the libraries it needs when it runs"
code = '''
shipped_bytes = sum((lstat(joinpath(root, file)).size for (root, _, files) in walkdir(shipped_folder) for file in files); init = 0)
shipped_files = sum((length(files) for (_, _, files) in walkdir(shipped_folder)); init = 0)
println("The program: ", program, ", ", round(filesize(program) / 2^20, digits = 2), " MiB")
println("Its folder: ", shipped_folder, ", ", shipped_files, " files, ", round(shipped_bytes / 2^20, digits = 2), " MiB in all")

# The libraries it needs when it runs
if Sys.isapple()
    run(`otool -L $program`)
elseif Sys.islinux()
    run(`ldd $program`)
else
    println("On Windows, objdump -p of MinGW-w64 lists the DLLs a program needs, under DLL Name")
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "sizes"
label = "Sizes and Build Times"
desc = "Each tool whose tab was run in this session, with the time its build took, the size of its program and the size of the folder that goes with it"
code = '''
bytes_under(path) = sum((lstat(joinpath(root, file)).size for (root, _, files) in walkdir(path) for file in files); init = 0)
mebibytes(bytes) = string(round(bytes / 2^20, digits = 2), " MiB")
println(rpad("Tool", 18), lpad("Build", 12), lpad("Program", 14), lpad("Folder", 14))
for (name, build) in sort!(collect(programs), by = first)
    seconds = isnan(build.seconds) ? "earlier" : string(round(build.seconds, digits = 1), " s")
    println(rpad(name, 18), lpad(seconds, 12), lpad(mebibytes(build.bytes), 14), lpad(mebibytes(bytes_under(build.folder)), 14))
end
length(programs) == 1 && println("Run another tab of the page to compare its tool with this one")
'''

[[actionGroups.actions]]
id = "times"
label = "Start-Up and Run Time"
desc = "Each tool's program run five times, the fastest kept, from start to end; beside it, julia running the same program as a script, and fill_counts alone in this session"
code = '''
fastest_of_five(command) = minimum(@elapsed(read(command)) for _ in 1:5)
for (name, build) in sort!(collect(programs), by = first)
    println(rpad(name, 18), lpad(round(fastest_of_five(build.command) * 1e3, sigdigits = 4), 10), " ms, the whole program")
end
println(rpad("julia", 18), lpad(round(fastest_of_five(script_command) * 1e3, sigdigits = 4), 10), " ms, julia running fractal.jl as a script")
session_counts = similar(julia_counts)
fill_seconds = minimum(@elapsed(GC.@preserve session_counts fill_counts(pointer(session_counts), height, width, x0, y0, spacing, Int32(julia_set), real(c), imag(c), maxiter)) for _ in 1:5)
println(rpad("Julia", 18), lpad(round(fill_seconds * 1e3, sigdigits = 4), 10), " ms, fill_counts alone in this session")
'''

