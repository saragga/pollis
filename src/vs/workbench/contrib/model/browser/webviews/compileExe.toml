label = "Use All the Cores"
desc = "The program again, its columns shared among threads with Threads.@threads, built with the tab's tool and run with one thread and with one for each core, each the fastest of three runs, its counts checked against Julia's"
models = ["juliac", "packagecompiler"]
code = '''
# fill_counts with its columns shared among the threads the program starts with: each column is written by one thread,
# and the pixels inside are counted after, from the counts, so that no two threads add to the same number
threads_code = """
function fill_counts_threads(counts::Ptr{Int32}, height::Int64, width::Int64, x0::Float64, y0::Float64, spacing::Float64,
                             julia_set::Int32, cr::Float64, ci::Float64, maxiter::Int32)::Int64
    Threads.@threads for j in 1:width
        for i in 1:height
            x = x0 + (j - 1) * spacing
            y = y0 + (i - 1) * spacing
            steps = julia_set != 0 ? escape_time(x, y, cr, ci, maxiter) : escape_time(0.0, 0.0, x, y, maxiter)
            unsafe_store!(counts, steps, i + (j - 1) * height)
        end
    end
    inside = 0
    for p in 1:height * width
        inside += unsafe_load(counts, p) == maxiter
    end
    return inside
end

# The program: the file of the counts and the inputs as arguments, in the order of the page's program without the
# picture; it prints the pixels inside and the number of threads it ran on
function fractal(args::Vector{String})::Cint
    if length(args) != 10
        println(Core.stderr, "usage: fractal counts.bin height width x0 y0 spacing julia_set cr ci maxiter")
        return 1
    end
    height, width = parse(Int64, args[2]), parse(Int64, args[3])
    counts = Vector{Int32}(undef, height * width)
    inside = GC.@preserve counts fill_counts_threads(pointer(counts), height, width, parse(Float64, args[4]),
                                                     parse(Float64, args[5]), parse(Float64, args[6]), parse(Int32, args[7]),
                                                     parse(Float64, args[8]), parse(Float64, args[9]), parse(Int32, args[10]))
    write(args[1], counts)
    println(Core.stdout, inside, " ", Threads.nthreads())
    return 0
end
"""

# Built with the tab's tool in threads/ of its folder
threads = build_program(joinpath(folder, "threads"), kernel_code * threads_code)
threads_counts_file = joinpath(folder, "threads", "counts.bin")
threads_command = `$(threads.program) $threads_counts_file $height $width $(repr(x0)) $(repr(y0)) $(repr(spacing)) $(Int(julia_set)) $(repr(real(c))) $(repr(imag(c))) $maxiter`

# The program starts as many threads as JULIA_NUM_THREADS says, as julia does; an option of its command line would be
# one of its own arguments. Each run once, its counts checked, then three times, the fastest kept, from start to end
runs = map(unique([1, Sys.CPU_THREADS])) do threads_asked
    run_with = addenv(threads_command, "JULIA_NUM_THREADS" => string(threads_asked))
    ran_on = parse(Int, last(split(readchomp(run_with))))
    differ = count(read!(threads_counts_file, Matrix{Int32}(undef, height, width)) .!= julia_counts)
    seconds = minimum(@elapsed(read(run_with)) for _ in 1:3)
    (; ran_on, seconds, differ)
end
println(rpad("Threads", 10), lpad("Time", 14), lpad("Speed-up", 12), lpad("Pixels that differ", 22))
for r in runs
    println(rpad(r.ran_on, 10), lpad(string(round(r.seconds * 1e3, sigdigits = 4), " ms"), 14), lpad(string(round(first(runs).seconds / r.seconds, digits = 2), "x"), 12), lpad(r.differ, 22))
end
println("The time of each run includes the program's start-up; ", Sys.CPU_THREADS, " threads, one for each core this computer reports")
'''

