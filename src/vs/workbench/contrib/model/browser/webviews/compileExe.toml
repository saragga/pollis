# writes the picture and the counts to files and prints the number of pixels inside. Started with no arguments, as by
# a double-click, it draws the Mandelbrot set with the page's defaults into fractal.bmp, in the folder it starts in,
# and opens the picture with the system's viewer through system of the C library; with one argument, it draws the same
# into the file named and opens nothing. It prints to Core.stdout, which a trimmed program keeps
program_code = """
function draw(picture_file::String, counts_file::String, height::Int64, width::Int64, x0::Float64, y0::Float64,
              spacing::Float64, julia_set::Int32, cr::Float64, ci::Float64, maxiter::Int32)::Int64
    counts = Vector{Int32}(undef, height * width)
    picture = Vector{UInt8}(undef, picture_bytes(height, width))
    inside = GC.@preserve counts picture begin
        inside = fill_counts(pointer(counts), height, width, x0, y0, spacing, julia_set, cr, ci, maxiter)
        fill_picture(pointer(picture), pointer(counts), height, width, maxiter)
        inside
    end
