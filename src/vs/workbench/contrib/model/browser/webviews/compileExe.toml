[[actionGroups.actions]]
id = "optionsstatic"
label = "Options with Names"
desc = "The program again, reading options with names, such as --width 1200 --iterations 500, in any order and each with a default, compared with StaticTools, built with StaticCompiler and run with the page's inputs and with a misspelt option"
models = ["staticcompiler"]
code = '''
# The program with options: --example, --width, --iterations, --cr, --ci and --picture, each followed by its value, in
# any order, each with a default. Each argument is a MallocString on argv, compared with == to a StaticString such
# as c"--width"; an option it does not know ends it with status 1. argparse reads a value that is not a number as 0,
# with no error, as nothing here may throw. The default name of the picture is a MallocString too: a StaticString
# passed to draw_named would have to be kept in memory managed by Julia, which a program with no runtime does not have
options_static = """
function draw_named(name, height::Int64, width::Int64, x0::Float64, y0::Float64, spacing::Float64, julia_set::Int32,
                    cr::Float64, ci::Float64, maxiter::Int32)::Int64
    counts = MallocArray{Int32}(undef, height, width)
    picture = MallocArray{UInt8}(undef, picture_bytes(height, width))
    inside = fill_counts(pointer(counts), height, width, x0, y0, spacing, julia_set, cr, ci, maxiter)
    fill_picture(pointer(picture), pointer(counts), height, width, maxiter)
    file = fopen(name, c"wb")
    fwrite(file, picture)
    fclose(file)
    free(picture)
    free(counts)
    return inside
end

function options_main(argc::Int64, argv::Ptr{Ptr{UInt8}})
    julia_set, width, maxiter, cr, ci, picture_at = Int32(0), 800, Int32(256), -0.8, 0.156, 0
    i = 2
    while i <= argc
        name = MallocString(argv, i)
        if i == argc
            printf(stderrp(), c"no value after ")
            puts(stderrp(), name)
            return 1
        end
        value = MallocString(argv, i + 1)
        if name == c"--example" && value == c"julia"
            julia_set = Int32(1)
        elseif name == c"--example" && value == c"mandelbrot"
            julia_set = Int32(0)
        elseif name == c"--width"
            width = argparse(Int64, argv, i + 1)
        elseif name == c"--iterations"
            maxiter = argparse(Int64, argv, i + 1) % Int32
        elseif name == c"--cr"
            cr = argparse(Float64, argv, i + 1)
        elseif name == c"--ci"
            ci = argparse(Float64, argv, i + 1)
        elseif name == c"--picture"
            picture_at = i + 1
        else
            printf(stderrp(), c"unknown option or value: ")
            puts(stderrp(), name)
            printf(stderrp(), c"options: --example mandelbrot|julia --width n --iterations n --cr x --ci y --picture file.bmp\\n")
            return 1
        end
        i += 2
    end
    x0, x1, y0, y1 = julia_set != 0 ? (-1.6, 1.6, -1.0, 1.0) : (-2.2, 0.8, -1.2, 1.2)
    height = unsafe_trunc(Int64, round(width * (y1 - y0) / (x1 - x0)))  # round(Int, ...) could throw
    spacing = (x1 - x0) / (width - 1)
    if picture_at == 0
        default_name = m"fractal.bmp"
        inside = draw_named(default_name, height, width, x0, y0, spacing, julia_set, cr, ci, maxiter)
        free(default_name)
    else
        inside = draw_named(MallocString(argv, picture_at), height, width, x0, y0, spacing, julia_set, cr, ci, maxiter)
    end
    printf(c"%lld x %lld pixels, %d iterations: %lld pixels inside\\n", width, height, maxiter, inside)
    return 0
end
"""

# Built with StaticCompiler in options/ of its folder
include_string(Main, options_static)
options_build = build_program(joinpath(folder, "options"), options_main, kernel_code * options_static)

# The page's inputs as named options, in an order of their own; an option left out keeps the program's default
options_file = joinpath(folder, "options", "options.bmp")
named = ["--picture", options_file, "--iterations", string(maxiter), "--width", string(width), "--example", julia_set ? "julia" : "mandelbrot"]
julia_set && append!(named, ["--cr", repr(real(c)), "--ci", repr(imag(c))])
run(`$(options_build.program) $named`)
println(read(options_file) == julia_picture ? "The picture is the same as Julia's, byte for byte" : "The picture differs from Julia's")

# A misspelt option: the program says what it did not understand, lists its options and ends with status 1
misspelt = run(ignorestatus(`$(options_build.program) --widht 600`))
println("Status of the program with --widht: ", misspelt.exitcode)
'''

