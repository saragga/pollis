        return 1
    end
    inside = draw(args[1], args[2], parse(Int64, args[3]), parse(Int64, args[4]), parse(Float64, args[5]),
                  parse(Float64, args[6]), parse(Float64, args[7]), parse(Int32, args[8]), parse(Float64, args[9]),
                  parse(Float64, args[10]), parse(Int32, args[11]))
