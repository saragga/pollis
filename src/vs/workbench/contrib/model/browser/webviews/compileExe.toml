using Plots

# The Julia sets of c on a circle of radius 0.7885 around 0, in frames: from one frame to the next, c is multiplied by
# w = cos(2 pi / frames) + i sin(2 pi / frames), which turns it by a frame's share of the circle. w is computed here
# and given to the program, so that the program and this session compute the same c at every frame
frames = 36
w = cis(2pi / frames)
c_start = complex(0.7885, 0.0)
jx0, jx1, jy0, jy1 = -1.6, 1.6, -1.0, 1.0
jheight = round(Int, width * (jy1 - jy0) / (jx1 - jx0))
jspacing = (jx1 - jx0) / (width - 1)

# The program: the number of frames and the inputs as arguments, c at the first frame and w; it writes each frame as a
# BMP file in the folder it starts in
frames_code = """
function fractal(args::Vector{String})::Cint
    if length(args) != 11
        println(Core.stderr, "usage: fractal frames height width x0 y0 spacing cr ci wr wi maxiter")
        return 1
    end
    frames, height, width = parse(Int64, args[1]), parse(Int64, args[2]), parse(Int64, args[3])
    x0, y0, spacing = parse(Float64, args[4]), parse(Float64, args[5]), parse(Float64, args[6])
    cr, ci, wr, wi = parse(Float64, args[7]), parse(Float64, args[8]), parse(Float64, args[9]), parse(Float64, args[10])
    maxiter = parse(Int32, args[11])
    counts = Vector{Int32}(undef, height * width)
