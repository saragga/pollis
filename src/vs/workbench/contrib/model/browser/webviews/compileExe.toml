desc = "The program again, writing its picture as a PNG with the package PNGFiles.jl, built with the tab's tool: the PNG beside the page's BMP, in size and pixel by pixel"
models = ["juliac", "packagecompiler"]
code = '''
using PNGFiles

# The program with a package: PNGFiles.jl writes the picture through libpng, with ColorTypes.jl and
# FixedPointNumbers.jl for its colours, which the tool compiles into the program
png_packages = ["PNGFiles", "ColorTypes", "FixedPointNumbers"]
png_code = """
using PNGFiles, ColorTypes, FixedPointNumbers

# The picture as a matrix of colours, its top row first, each colour made from its three bytes with reinterpret, which
# cannot fail; RGB made from numbers would check that each is between 0 and 1, and could throw
function png_picture(counts::Vector{Int32}, height::Int64, width::Int64, maxiter::Int32)
    picture = Matrix{RGB{N0f8}}(undef, height, width)
    for j in 1:width, i in 1:height
        red, green, blue = pixel_colour(counts[i + (j - 1) * height], maxiter)
        picture[height + 1 - i, j] = RGB{N0f8}(reinterpret(N0f8, red), reinterpret(N0f8, green), reinterpret(N0f8, blue))
    end
    return picture
end

# The program: the PNG to write and the inputs as arguments, in the order of the page's program without the counts
function fractal(args::Vector{String})::Cint
    if length(args) != 10
        println(Core.stderr, "usage: fractal picture.png height width x0 y0 spacing julia_set cr ci maxiter")
        return 1
    end
    height, width, maxiter = parse(Int64, args[2]), parse(Int64, args[3]), parse(Int32, args[10])
    counts = Vector{Int32}(undef, height * width)
    inside = GC.@preserve counts fill_counts(pointer(counts), height, width, parse(Float64, args[4]), parse(Float64, args[5]),
                                             parse(Float64, args[6]), parse(Int32, args[7]), parse(Float64, args[8]),
                                             parse(Float64, args[9]), maxiter)
    PNGFiles.save(args[1], png_picture(counts, height, width, maxiter))
    println(Core.stdout, inside)
    return 0
end
"""

# Built with the tab's tool in png/ of its folder, the packages added to its project
{{?model=juliac}}# --trim=safe refuses PNGFiles: libpng calls back into Julia to write to an IO whose type trimming cannot know, and
{{?model=juliac}}# the verifier reports those calls as unresolved. --trim=unsafe-warn still lists them, then builds the program all the
{{?model=juliac}}# same; at run time the IO is a file, which the trimmed program kept
{{?model=juliac}}png = build_program(joinpath(folder, "png"), kernel_code * png_code; packages = png_packages, trim = "unsafe-warn")
{{?model=packagecompiler}}# PackageCompiler compiles the packages whole, with the rest of the runtime, so the program needs nothing more
{{?model=packagecompiler}}png = build_program(joinpath(folder, "png"), kernel_code * png_code; packages = png_packages)
png_file = joinpath(folder, "png", "fractal.png")
run(`$(png.program) $png_file $height $width $(repr(x0)) $(repr(y0)) $(repr(spacing)) $(Int(julia_set)) $(repr(real(c))) $(repr(imag(c))) $maxiter`)

# The PNG read back with PNGFiles, each colour against the bytes of Julia's BMP: its rows from the bottom up, each
# pixel blue, green and red
png_picture = PNGFiles.load(png_file)
row_bytes = (3 * width + 3) & ~3
bmp_colour(i, j) = (julia_picture[54 + (i - 1) * row_bytes + 3 * j], julia_picture[53 + (i - 1) * row_bytes + 3 * j], julia_picture[52 + (i - 1) * row_bytes + 3 * j])
png_colour(i, j) = reinterpret.(UInt8, (png_picture[height + 1 - i, j].r, png_picture[height + 1 - i, j].g, png_picture[height + 1 - i, j].b))
png_differ = count(png_colour(i, j) != bmp_colour(i, j) for i in 1:height, j in 1:width)
println(png_differ == 0 ? "The PNG and Julia's BMP have the same colour at all $(height * width) pixels" : "The PNG and Julia's BMP differ at $png_differ of $(height * width) pixels")
println(rpad("BMP", 6), lpad(round(filesize(picture_file) / 2^10, digits = 1), 10), " KiB, ", picture_file)
println(rpad("PNG", 6), lpad(round(filesize(png_file) / 2^10, digits = 1), 10), " KiB, ", png_file)
# The folder each program comes in, with the libraries it needs: an app's program is a small launcher of the code there
folder_mebibytes(path) = round(sum((lstat(joinpath(root, file)).size for (root, _, files) in walkdir(path) for file in files); init = 0) / 2^20, digits = 2)
println("The folder of the program with PNGFiles: ", folder_mebibytes(png.shipped_folder), " MiB, against ", folder_mebibytes(shipped_folder), " MiB without it")
'''

