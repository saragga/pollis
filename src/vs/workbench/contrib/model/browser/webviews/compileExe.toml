code = '''
# The program with options: --example, --width, --iterations, --cr, --ci and --picture, each followed by its value, in
# any order, each with a default; an option it does not know, or a value it cannot read, ends it with status 1
options_code = """
function options_error(message::String, what::String)::Cint
    println(Core.stderr, message, what)
    println(Core.stderr, "options: --example mandelbrot|julia --width n --iterations n --cr x --ci y --picture file.bmp")
    return 1
end

function fractal(args::Vector{String})::Cint
    julia_set, width, maxiter, cr, ci, picture_file = false, 800, Int32(256), -0.8, 0.156, "fractal.bmp"
    for i in 1:2:length(args)
        name = args[i]
        i == length(args) && return options_error("no value after ", name)
        value = args[i + 1]
        if name == "--example" && (value == "mandelbrot" || value == "julia")
            julia_set = value == "julia"
        elseif name == "--width" && tryparse(Int64, value) !== nothing
            width = parse(Int64, value)
        elseif name == "--iterations" && tryparse(Int32, value) !== nothing
            maxiter = parse(Int32, value)
        elseif name == "--cr" && tryparse(Float64, value) !== nothing
            cr = parse(Float64, value)
        elseif name == "--ci" && tryparse(Float64, value) !== nothing
            ci = parse(Float64, value)
        elseif name == "--picture"
            picture_file = value
        else
            return options_error("unknown option or value: ", name * " " * value)
        end
    end
    x0, x1, y0, y1 = julia_set ? (-1.6, 1.6, -1.0, 1.0) : (-2.2, 0.8, -1.2, 1.2)
    height = round(Int, width * (y1 - y0) / (x1 - x0))
    spacing = (x1 - x0) / (width - 1)
    counts = Vector{Int32}(undef, height * width)
    picture = Vector{UInt8}(undef, picture_bytes(height, width))
    inside = GC.@preserve counts picture begin
        inside = fill_counts(pointer(counts), height, width, x0, y0, spacing, Int32(julia_set), cr, ci, maxiter)
        fill_picture(pointer(picture), pointer(counts), height, width, maxiter)
        inside
    end
    write(picture_file, picture)
    println(Core.stdout, width, " x ", height, " pixels, ", maxiter, " iterations: ", inside, " pixels inside")
    return 0
end
"""

# Built with the tab's tool in options/ of its folder
