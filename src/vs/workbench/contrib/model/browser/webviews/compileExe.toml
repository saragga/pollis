    end
    seconds = @elapsed compile_executable(main_function, (Int64, Ptr{Ptr{UInt8}}), shipped_folder; filename = "fractal")
    write(built_from_file, built_from)
    return (; program, shipped_folder, source_file, built_with, seconds)
