    write(picture_file, picture)
    return inside
end

function fractal(args::Vector{String})::Cint
    if length(args) <= 1
        picture_file = isempty(args) ? "fractal.bmp" : args[1]
        inside = draw(picture_file, "", 640, 800, -2.2, -1.2, 3.0 / 799, Int32(0), 0.0, 0.0, Int32(256))
        println(Core.stdout, "The Mandelbrot set, 800 x 640 pixels, 256 iterations: ", inside, " pixels inside")
        if isempty(args)
            println(Core.stdout, "The picture: fractal.bmp, in the folder the program started in")
            command = Sys.isapple() ? "open fractal.bmp" : Sys.iswindows() ? "start fractal.bmp" : "xdg-open fractal.bmp"
            @ccall system(command::Cstring)::Cint
        else
            println(Core.stdout, "The picture: ", picture_file)
        end
        return 0
    end
    if length(args) != 11
        println(Core.stderr, "usage: fractal [picture.bmp [counts.bin height width x0 y0 spacing julia_set cr ci maxiter]]")
        return 1
    end
    inside = draw(args[1], args[2], parse(Int64, args[3]), parse(Int64, args[4]), parse(Float64, args[5]),
                  parse(Float64, args[6]), parse(Float64, args[7]), parse(Int32, args[8]), parse(Float64, args[9]),
                  parse(Float64, args[10]), parse(Int32, args[11]))
    println(Core.stdout, inside)
    return 0
end
"""

# The whole program as a Julia script, started at the function marked @main, for julia to run beside the app
script_code = kernel_code * program_code * """
function @main(args::Vector{String})::Cint
    return fractal(args)
end
"""

# Build: PackageCompiler compiles a package, here Fractal, written to a folder of its own, into an app: the program in
# app/bin, beside a whole system image and the Julia runtime. The program starts at julia_main, which reads the command
# line from ARGS and calls fractal. It needs a C compiler on the path, and takes several minutes, again only when the
# code, its packages or the Julia version change, as built_from.txt records. The Next Steps that add to the program
# build theirs with build_program too
function build_program(build_folder, code; packages = String[])
    package = joinpath(build_folder, "Fractal")
    shipped_folder = joinpath(build_folder, "app")
    program = joinpath(shipped_folder, "bin", "fractal" * (Sys.iswindows() ? ".exe" : ""))
    source_file = joinpath(package, "src", "Fractal.jl")
    package_code = "module Fractal\n\n" * code * "\njulia_main()::Cint = fractal(ARGS)\n\nend\n"
    built_with = "create_app(\"$package\", \"$shipped_folder\"; executables = [\"fractal\" => \"julia_main\"], filter_stdlibs = true, force = true)"
    built_from = string("Julia ", VERSION, "\n", join(packages, " "), "\n\n", package_code)
    built_from_file = joinpath(build_folder, "built_from.txt")
    if isfile(program) && isfile(built_from_file) && read(built_from_file, String) == built_from
        return (; program, shipped_folder, source_file, built_with, seconds = nothing)
    end
    mkpath(dirname(source_file))
    write(joinpath(package, "Project.toml"), "name = \"Fractal\"\nuuid = \"722f75a4-b007-4460-b744-5cac965dea2b\"\n")
    write(source_file, package_code)
    previous = Base.active_project()
    Pkg.activate(package)
    isempty(packages) ? Pkg.resolve() : Pkg.add(packages)  # the package's Manifest.toml, which create_app expects
    Pkg.activate(previous)
    seconds = @elapsed create_app(package, shipped_folder; executables = ["fractal" => "julia_main"], filter_stdlibs = true, force = true)
    write(built_from_file, built_from)
    return (; program, shipped_folder, source_file, built_with, seconds)
end

# The program of the page, in packagecompiler/ of the folder, and the same program as a script for julia
folder = mkpath(joinpath(expanduser(raw"{{folder}}"), "packagecompiler"))
(; program, shipped_folder, source_file, built_with) = build = build_program(folder, kernel_code * program_code)
build_seconds = build.seconds
script_file = joinpath(folder, "fractal.jl")
write(script_file, script_code)

# Run: the files to write and the inputs as arguments, the numbers as repr writes them, which the program reads back
