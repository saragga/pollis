    store_bytes!(picture, 19, width, 4)
    store_bytes!(picture, 23, height, 4)  # positive: the rows from the bottom up
    store_bytes!(picture, 27, 1, 2)  # one plane
    store_bytes!(picture, 29, 24, 2)  # 24 bits a pixel
