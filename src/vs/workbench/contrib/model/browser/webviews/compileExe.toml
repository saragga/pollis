println("Pixels inside: $compiled_inside from the program, $julia_inside from Julia")
println(read(picture_file) == julia_picture ? "The picture is the same as Julia's, byte for byte" : "The picture differs from Julia's")
println("The picture: ", picture_file)
println("The program: ", program)
println("Run it with: ", command)
'''

[[codeBranches]]
model = "staticcompiler"
code = '''
using StaticCompiler, StaticTools

# The example: the Mandelbrot set, or the Julia set of c, on a grid of pixels
julia_set = "{{example}}" == "julia"
c = complex({{cre}}, {{cim}})  # the fixed point of the Julia set; the Mandelbrot set does not use it
x0, x1, y0, y1 = julia_set ? (-1.6, 1.6, -1.0, 1.0) : (-2.2, 0.8, -1.2, 1.2)
width = {{width}}
height = round(Int, width * (y1 - y0) / (x1 - x0))
spacing = (x1 - x0) / (width - 1)  # the distance between two pixels, across and down
maxiter = Int32({{maxiter}})

# The Julia code that computes the counts and draws them: the iterations of z^2 + c before |z| passes 2 for one pixel;
# fill_counts, which writes the count of every pixel into memory it is given, column by column, and returns the
# number inside; and fill_picture, which writes the picture of the counts as a BMP file into memory it is given. Only
# native types in and out, no allocation, no error thrown: code that every tool can compile
kernel_code = """
function escape_time(zr, zi, cr, ci, maxiter::Int32)
    k = zero(maxiter)
    while k < maxiter
        zr2 = zr * zr
        zi2 = zi * zi
        zr2 + zi2 > 4.0 && return k
        zi = 2.0 * zr * zi + ci
        zr = zr2 - zi2 + cr
        k += one(maxiter)
    end
    return maxiter
end

function fill_counts(counts::Ptr{Int32}, height::Int64, width::Int64, x0::Float64, y0::Float64, spacing::Float64,
                     julia_set::Int32, cr::Float64, ci::Float64, maxiter::Int32)::Int64
    inside = 0
    for j in 1:width, i in 1:height
        x = x0 + (j - 1) * spacing
        y = y0 + (i - 1) * spacing
        steps = julia_set != 0 ? escape_time(x, y, cr, ci, maxiter) : escape_time(0.0, 0.0, x, y, maxiter)
        unsafe_store!(counts, steps, i + (j - 1) * height)
        inside += steps == maxiter
    end
    return inside
end

# The size of the picture as a BMP file: a header of 54 bytes, then each row of pixels, 3 bytes each, padded to a
# multiple of 4 bytes
picture_bytes(height::Int64, width::Int64) = 54 + ((3 * width + 3) & ~3) * height

# The colour of a pixel from its count k: black inside the set; outside, s = k / (k + 8) runs from 0, for a pixel that
# escapes at once, towards 1 near the set, through blue, green and yellow to red
function pixel_colour(k::Int32, maxiter::Int32)
    k == maxiter && return (0x00, 0x00, 0x00)
    s = k / (k + 8.0)
    t = 1.0 - s
    red = unsafe_trunc(UInt8, 255.0 * 9.0 * t * s * s * s)
    green = unsafe_trunc(UInt8, 255.0 * 15.0 * t * t * s * s)
    blue = unsafe_trunc(UInt8, 255.0 * 8.5 * t * t * t * s)
    return (red, green, blue)
end

# Writes value into the picture as count bytes from byte at on, the lowest byte first
function store_bytes!(picture::Ptr{UInt8}, at::Int64, value::Int64, count::Int64)
    for b in 0:count - 1
        unsafe_store!(picture, (value >> (8 * b)) % UInt8, at + b)
    end
end

# Writes the picture into memory of picture_bytes(height, width) bytes: the header, then the rows from the bottom up,
# so that the imaginary part grows upwards, each pixel blue, green and red
function fill_picture(picture::Ptr{UInt8}, counts::Ptr{Int32}, height::Int64, width::Int64, maxiter::Int32)::Int64
    row_bytes = (3 * width + 3) & ~3
    unsafe_store!(picture, 0x42, 1)  # B
    unsafe_store!(picture, 0x4d, 2)  # M
    store_bytes!(picture, 3, picture_bytes(height, width), 4)  # the size of the file
    store_bytes!(picture, 7, 0, 4)  # reserved
    store_bytes!(picture, 11, 54, 4)  # where the pixels start
    store_bytes!(picture, 15, 40, 4)  # the size of the rest of the header
    store_bytes!(picture, 19, width, 4)
    store_bytes!(picture, 23, height, 4)  # positive: the rows from the bottom up
    store_bytes!(picture, 27, 1, 2)  # one plane
    store_bytes!(picture, 29, 24, 2)  # 24 bits a pixel
    store_bytes!(picture, 31, 0, 4)  # no compression
    store_bytes!(picture, 35, row_bytes * height, 4)  # the size of the pixels
    store_bytes!(picture, 39, 2835, 4)  # 72 pixels an inch across, as pixels a metre
    store_bytes!(picture, 43, 2835, 4)  # and down
    store_bytes!(picture, 47, 0, 8)  # no palette
    for i in 1:height
        row = 54 + (i - 1) * row_bytes
        for j in 1:width
            red, green, blue = pixel_colour(unsafe_load(counts, i + (j - 1) * height), maxiter)
            unsafe_store!(picture, blue, row + 3 * j - 2)
            unsafe_store!(picture, green, row + 3 * j - 1)
            unsafe_store!(picture, red, row + 3 * j)
        end
        for p in 3 * width + 1:row_bytes
            unsafe_store!(picture, 0x00, row + p)  # the padding
        end
    end
    return picture_bytes(height, width)
end
"""

# Julia: the same code in this session, filling a Julia matrix through its pointer; GC.@preserve keeps the matrix
# alive while its pointer is in use
include_string(Main, kernel_code)
julia_counts = Matrix{Int32}(undef, height, width)
julia_inside = GC.@preserve julia_counts fill_counts(pointer(julia_counts), height, width, x0, y0, spacing, Int32(julia_set), real(c), imag(c), maxiter)
julia_picture = Vector{UInt8}(undef, picture_bytes(height, width))
GC.@preserve julia_picture julia_counts fill_picture(pointer(julia_picture), pointer(julia_counts), height, width, maxiter)

# The program with no Julia runtime, written with StaticTools: argc and argv as C gives them (argv[1] is the program,
# so the first argument is at 2), memory taken with MallocArray and given back with free, the files written and the
# text printed through the C library. Started with no arguments, as by a double-click, it draws the Mandelbrot set with
# the page's defaults into fractal.bmp and opens it with system of the C library, called with @symbolcall as
# StaticTools calls the C library; with one argument, it draws the same into the file named and opens nothing.
# % Int32 truncates where Int32() could throw, and nothing here may throw. The names of the files reach draw_static as
# MallocStrings, on argv or taken with m"": a StaticString such as c"fractal.bmp" passed to it would have to be kept
# in memory that Julia's garbage collector manages, which a program with no runtime does not have
static_code = """
function draw_static(picture_name, counts_name, write_counts::Bool, height::Int64, width::Int64, x0::Float64,
                     y0::Float64, spacing::Float64, julia_set::Int32, cr::Float64, ci::Float64, maxiter::Int32)::Int64
    counts = MallocArray{Int32}(undef, height, width)
    picture = MallocArray{UInt8}(undef, picture_bytes(height, width))
    inside = fill_counts(pointer(counts), height, width, x0, y0, spacing, julia_set, cr, ci, maxiter)
    fill_picture(pointer(picture), pointer(counts), height, width, maxiter)
    if write_counts
        file = fopen(counts_name, c"wb")
        fwrite(file, counts)
        fclose(file)
    end
    file = fopen(picture_name, c"wb")
    fwrite(file, picture)
    fclose(file)
    free(picture)
    free(counts)
    return inside
end

shell(command) = GC.@preserve command @symbolcall system(pointer(command)::Ptr{UInt8})::Int32

function static_main(argc::Int64, argv::Ptr{Ptr{UInt8}})
    if argc == 1
        name = m"fractal.bmp"
        inside = draw_static(name, name, false, 640, 800, -2.2, -1.2, 3.0 / 799, Int32(0), 0.0, 0.0, Int32(256))
        free(name)
        printf(c"The Mandelbrot set, 800 x 640 pixels, 256 iterations: %lld pixels inside\\n", inside)
        printf(c"The picture: fractal.bmp, in the folder the program started in\\n")
        Sys.isapple() ? shell(c"open fractal.bmp") : Sys.iswindows() ? shell(c"start fractal.bmp") : shell(c"xdg-open fractal.bmp")
        return 0
    end
    if argc == 2
        inside = draw_static(MallocString(argv, 2), MallocString(argv, 2), false, 640, 800, -2.2, -1.2, 3.0 / 799, Int32(0), 0.0, 0.0, Int32(256))
        printf(c"The Mandelbrot set, 800 x 640 pixels, 256 iterations: %lld pixels inside\\n", inside)
        printf(c"The picture: ")
        puts(MallocString(argv, 2))  # puts and not printf, which would read a % in the name as a format
        return 0
    end
    if argc != 12
        printf(stderrp(), c"usage: fractal [picture.bmp [counts.bin height width x0 y0 spacing julia_set cr ci maxiter]]\\n")
        return 1
    end
    inside = draw_static(MallocString(argv, 2), MallocString(argv, 3), true, argparse(Int64, argv, 4),
                         argparse(Int64, argv, 5), argparse(Float64, argv, 6), argparse(Float64, argv, 7),
                         argparse(Float64, argv, 8), argparse(Int64, argv, 9) % Int32, argparse(Float64, argv, 10),
                         argparse(Float64, argv, 11), argparse(Int64, argv, 12) % Int32)
    printf(c"%lld\\n", inside)
    return 0
end
