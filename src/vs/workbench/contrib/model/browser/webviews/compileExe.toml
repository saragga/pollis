function draw(picture_file::String, counts_file::String, height::Int64, width::Int64, x0::Float64, y0::Float64,
              spacing::Float64, julia_set::Int32, cr::Float64, ci::Float64, maxiter::Int32)::Int64
    counts = Vector{Int32}(undef, height * width)
    picture = Vector{UInt8}(undef, picture_bytes(height, width))
    inside = GC.@preserve counts picture begin
        inside = fill_counts(pointer(counts), height, width, x0, y0, spacing, julia_set, cr, ci, maxiter)
        fill_picture(pointer(picture), pointer(counts), height, width, maxiter)
        inside
    end
