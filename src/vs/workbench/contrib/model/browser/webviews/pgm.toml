# Policy Gradient Methods Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/pgm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Policy Gradient Methods"
viewType = "pollis.pgm"
defaultModel = "reinforce"

[[packages]]
name = "ReinforcementLearning.jl"
github = "https://github.com/JuliaReinforcementLearning/ReinforcementLearning.jl"

[[packages.videos]]
title = "High Performance Computing in Julia"
description = "An 18-video course by Jamie Mair on writing fast Julia code"
url = "https://www.youtube.com/playlist?list=PLUAq6xQKFgGr39PiyrPk_C9dhBKvWcjUA"

