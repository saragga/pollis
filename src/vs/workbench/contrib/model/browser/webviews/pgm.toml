[[bullets]]
text = "REINFORCE"
detail = "Monte Carlo policy gradient; updates the policy using the full-episode discounted return as a gradient weight; simple and unbiased but high variance; suited to episodic tasks and small networks (ReinforcementLearning.jl)"

[[bullets]]
text = "Proximal Policy Optimisation (PPO)"
detail = "clips the probability ratio of new to old policy to prevent large updates; reuses each rollout batch for multiple gradient epochs; widely used default choice for continuous control (ReinforcementLearning.jl)"

[[bullets]]
text = "Trust Region Policy Optimisation (TRPO)"
detail = "constrains the Kullback–Leibler divergence between successive policies; guarantees monotonic improvement; natural gradient step computed via conjugate gradient (ReinforcementLearning.jl)"

[[decisionRows]]
task = "REINFORCE"
context = "Simplest policy gradient; teaching, small problems, a baseline"
purpose = "Monte Carlo policy gradient: raises the log-probability of each action in proportion to its advantage (return minus a learned baseline)"

[[decisionRows]]
task = "PPO"
context = "Default choice in practice; robust, reuses each batch for several epochs"
purpose = "Proximal Policy Optimisation: maximises a clipped importance-weighted surrogate so the new policy cannot move far from the one that collected the data"

[[decisionRows]]
task = "TRPO"
context = "When monotone, controlled policy improvement matters"
purpose = "Trust Region Policy Optimisation: natural-gradient step (Fisher matrix via conjugate gradient) with a line search enforcing a KL-divergence limit"

[[inputs]]
id = "iters"
label = "Policy Updates"
tooltip = "Number of collect-then-update iterations."
default = "60"

[[inputs]]
id = "batch"
label = "Episodes per Update"
tooltip = "Episodes collected with the current policy before each update."
default = "10"

[[inputs]]
id = "horizon"
label = "Max Episode Length"
tooltip = "CartPole episodes end when the pole falls, the cart leaves the track or this many steps pass (reward 1 per step)."
default = "500"

[[inputs]]
id = "gamma"
label = "Discount (gamma)"
tooltip = "Discount factor in (0, 1] for the returns G_t."
default = "0.99"

[[inputs]]
id = "seed"
label = "Random Seed"
tooltip = "Seed of the episodes and of the policy updates."
default = "1"

[[inputs]]
id = "lr"
label = "Learning Rate"
tooltip = "Step size of the policy-gradient ascent (Adam)."
default = "0.05"
models = ["reinforce", "ppo"]
newRow = true

[[inputs]]
id = "clip"
label = "Clip (epsilon)"
tooltip = "PPO clipping parameter: the probability ratio is clipped to [1 - epsilon, 1 + epsilon]. Typical value 0.2."
default = "0.2"
models = ["ppo"]

[[inputs]]
id = "epochs"
label = "Epochs"
tooltip = "Gradient epochs on each collected batch. PPO reuses each batch several times."
default = "10"
models = ["ppo"]

[[inputs]]
id = "kl"
label = "Max KL"
tooltip = "Largest mean KL divergence between the old and new policy that a TRPO step may take."
default = "0.01"
models = ["trpo"]
newRow = true

[[inputs]]
id = "damp"
label = "Damping"
tooltip = "Added to the Fisher matrix in the conjugate-gradient solve for numerical stability."
default = "0.1"
models = ["trpo"]

