# CartPole (Barto, Sutton and Anderson 1983), as in OpenAI Gym; actions 1 = push left, 2 = push right
grav, mcart, mpole, halflen, force, dt = 9.8, 1.0, 0.1, 0.5, 10.0, 0.02
function cp_step(s, a)  # returns (next state, reward, done)
    x, xd, th, thd = s
    f = a == 2 ? force : -force
    temp = (f + mpole * halflen * thd^2 * sin(th)) / (mcart + mpole)
    thacc = (grav * sin(th) - cos(th) * temp) / (halflen * (4 / 3 - mpole * cos(th)^2 / (mcart + mpole)))
    xacc = temp - mpole * halflen * thacc * cos(th) / (mcart + mpole)
    s2 = [x + dt * xd, xd + dt * xacc, th + dt * thd, thd + dt * thacc]
    s2, 1.0, abs(s2[1]) > 2.4 || abs(s2[3]) > 12pi / 180
end

# Linear-softmax policy pi(a|s) = softmax(W [s; 1]), W is 2 x 5
feats(s) = [s; 1.0]
softmax(z) = (e = exp.(z .- maximum(z)); e ./ sum(e))
probs(W, s) = softmax(W * feats(s))
glogp(W, s, a) = ((1:2 .== a) .- probs(W, s)) * transpose(feats(s))  # gradient of log pi(a|s) in W
entropy(p) = -sum(p .* log.(p .+ 1e-12))
kl(p, q) = sum(p .* log.((p .+ 1e-12) ./ (q .+ 1e-12)))

function run_episode(W, rng; greedy=false)
    s = 0.1 .* rand(rng, 4) .- 0.05
    S, A, R = Vector{Float64}[], Int[], Float64[]
    for t in 1:horizon
        p = probs(W, s)
        a = greedy ? argmax(p) : (rand(rng) < p[1] ? 1 : 2)
        push!(S, s); push!(A, a)
        s, r, done = cp_step(s, a)
        push!(R, r)
        done && break
    end
    (S = S, A = A, R = R)
end
function discount(R)  # discounted returns G_t
    G = similar(R); acc = 0.0
    for t in length(R):-1:1
        acc = R[t] + gamma * acc; G[t] = acc
    end
    G
end
phi(s) = [1.0; s; s .^ 2]  # critic features

function collect_batch(W, rng; n=batch)  # episodes, flattened states and actions, normalised advantages
    trajs = [run_episode(W, rng) for k in 1:n]
    S, A = reduce(vcat, [t.S for t in trajs]), reduce(vcat, [t.A for t in trajs])
    G = reduce(vcat, [discount(t.R) for t in trajs])
    Phi = reduce(vcat, [transpose(phi(s)) for s in S])
    w = (transpose(Phi) * Phi + 1e-3I) \ (transpose(Phi) * G)  # least-squares critic V(s) = phi(s) w
    adv = G .- Phi * w
    (trajs = trajs, S = S, A = A, adv = (adv .- mean(adv)) ./ (std(adv) + 1e-8), critic = w)
end

function adam_step!(W, g, st; lr)  # gradient ascent with Adam moments st = (m, v, t)
    st.t[] += 1
    st.m .= 0.9 .* st.m .+ 0.1 .* g; st.v .= 0.999 .* st.v .+ 0.001 .* g .^ 2
    W .+= lr .* (st.m ./ (1 - 0.9^st.t[])) ./ (sqrt.(st.v ./ (1 - 0.999^st.t[])) .+ 1e-8)
end
adam_state() = (m = zeros(2, 5), v = zeros(2, 5), t = Ref(0))

function update_reinforce!(W, B, st; lr=0.05)
    g = mean(B.adv[i] * glogp(W, B.S[i], B.A[i]) for i in eachindex(B.A))  # policy gradient
    adam_step!(W, g, st; lr)
    norm(g)
end

function update_ppo!(W, B, st; lr=0.05, clip=0.2, epochs=10)
    old = [probs(W, s)[a] for (s, a) in zip(B.S, B.A)]
    gn = 0.0
    for k in 1:epochs
        g = zeros(2, 5)
        for i in eachindex(B.A)
            ratio = probs(W, B.S[i])[B.A[i]] / old[i]
            clipped = (B.adv[i] > 0 && ratio > 1 + clip) || (B.adv[i] < 0 && ratio < 1 - clip)
            clipped || (g .+= B.adv[i] * ratio .* glogp(W, B.S[i], B.A[i]))  # gradient of the clipped surrogate
        end
        g ./= length(B.A)
        k == 1 && (gn = norm(g))
        adam_step!(W, g, st; lr)
    end
    gn
end

function update_trpo!(W, B, st; maxkl=0.01, damp=0.1)
    P = [probs(W, s) for s in B.S]
    g = mean(B.adv[i] * glogp(W, B.S[i], B.A[i]) for i in eachindex(B.A))
    Fv(V) = mean((Diagonal(p) - p * transpose(p)) * (V * feats(s)) * transpose(feats(s)) for (p, s) in zip(P, B.S)) .+ damp .* V  # Fisher-vector product
    x = zeros(2, 5); r = copy(g); d = copy(g)  # conjugate gradient for F x = g
    for k in 1:10
        Fd = Fv(d); alpha_cg = dot(r, r) / dot(d, Fd)
        x .+= alpha_cg .* d; rnew = r .- alpha_cg .* Fd
        d = rnew .+ (dot(rnew, rnew) / dot(r, r)) .* d; r = rnew
    end
    step = sqrt(2maxkl / dot(x, Fv(x))) .* x
    surr(Wn) = mean(B.adv[i] * probs(Wn, B.S[i])[B.A[i]] / P[i][B.A[i]] for i in eachindex(B.A))
    base = surr(W)
    for frac in 0.5 .^ (0:9)  # backtracking line search
        Wn = W .+ frac .* step
        if mean(kl(p, probs(Wn, s)) for (p, s) in zip(P, B.S)) <= maxkl && surr(Wn) > base
            W .= Wn
            break
        end
    end
    norm(g)
end

maxkl, damp = {{kl}}, {{damp}}  # trust-region size, Fisher damping
update!(W, B, st) = update_trpo!(W, B, st; maxkl=maxkl, damp=damp)

function train(upd=update!; iters=iters, seed=seed, batch=batch)
    rng = MersenneTwister(seed)
    W = zeros(2, 5); st = adam_state()  # uniform initial policy
    hist = (ret = Float64[], entropy = Float64[], gradnorm = Float64[], kl = Float64[])
    for it in 1:iters
        B = collect_batch(W, rng; n=batch)
        P = [probs(W, s) for s in B.S]
        push!(hist.ret, mean(sum(t.R) for t in B.trajs)); push!(hist.entropy, mean(entropy, P))
        push!(hist.gradnorm, upd(W, B, st))
        push!(hist.kl, mean(kl(p, probs(W, s)) for (p, s) in zip(P, B.S)))  # policy change of this update
    end
    (W = W, hist = hist, critic = collect_batch(W, rng).critic)
end

res = train()
(final_mean_return = res.hist.ret[end], best_mean_return = maximum(res.hist.ret), max_return = horizon,
 greedy_return = sum(run_episode(res.W, MersenneTwister(0); greedy=true).R), policy_weights = round.(res.W, digits=2))
