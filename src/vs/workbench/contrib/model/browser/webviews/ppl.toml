'''

[[actionGroups.actions]]
id = "autocorr"
label = "Autocorrelation"
desc = "High autocorrelation lowers the effective sample size: read ESS rather than thinning, which discards draws"
code = '''
using StatsPlots

autocorplot(chain)  # lag-autocorrelation per parameter
summarize(chain)[:, [:parameters, :ess_bulk]]  # what the autocorrelation costs: ESS against the {{n-samples}} x {{n-chains}} draws
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "ppc"
label = "Posterior Predictive Check"
desc = "Compare replicated datasets from the posterior predictive with the observed data"
code = '''
using StatsPlots, Statistics

{{?model=gaussian}} missing_model = gaussian_model(fill(missing, length({{y}})))  # y replaced by missing values of the same length: predict it
{{?model=linear}} missing_model = linear_model({{X}}, fill(missing, length({{y}})))  # y replaced by missing values of the same length: predict it
{{?model=logistic}} missing_model = logistic_model({{X}}, fill(missing, length({{y}})))  # y replaced by missing values of the same length: predict it
{{?model=hierarchical}} missing_model = hierarchical_model(fill(missing, length({{y}})), {{group}}, {{ngroups}})  # y replaced by missing values of the same length: predict it
y_pred = predict(missing_model, chain)  # posterior predictive samples
yrep = reduce(hcat, [vec(Array(y_pred[Symbol("{{y}}[", i, "]")])) for i in eachindex({{y}})])  # draws x observations, in data order
{{?model!=logistic}} plt = density({{y}}; lw=3, color=:black, label="observed")  # observed distribution
{{?model!=logistic}} for d in rand(1:size(yrep, 1), 50) density!(plt, yrep[d, :]; alpha=0.2, color=:steelblue, label="") end  # 50 replicated datasets
{{?model!=logistic}} plt  # the observed curve should look like one of the replicates
{{?model=logistic}} histogram(vec(mean(yrep; dims=2)); label="replicated share of ones")  # binary data: compare the share of ones
{{?model=logistic}} vline!([mean({{y}})]; lw=3, label="observed")
'''

[[actionGroups.actions]]
id = "loo"
label = "LOO-CV"
desc = "Pareto-smoothed importance-sampling leave-one-out cross-validation"
code = '''
import PosteriorStats  # imported, not used: its summarize would clash with the one from MCMCChains

{{?model=gaussian}} fitted = gaussian_model({{y}})  # the model that was sampled
{{?model=linear}} fitted = linear_model({{X}}, {{y}})  # the model that was sampled
{{?model=logistic}} fitted = logistic_model({{X}}, {{y}})  # the model that was sampled
{{?model=hierarchical}} fitted = hierarchical_model({{y}}, {{group}}, {{ngroups}})  # the model that was sampled
obs_syms = [Symbol("{{y}}[", i, "]") for i in eachindex({{y}})]  # observation names, in data order
loglik(m, ch) = (pll = pointwise_loglikelihoods(m, ch; factorize=true); cat([Array(pll[s]) for s in obs_syms]...; dims=3))  # draws x chains x observations
loo_result = PosteriorStats.loo(loglik(fitted, chain))  # LOO-CV via PSIS
print(loo_result)  # ELPD, p_loo, Pareto k diagnostics
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "loo-compare"
label = "LOO Compare"
desc = "Compare the fitted model with a simpler or more robust alternative by expected log predictive density (ELPD)"
code = '''
import PosteriorStats  # imported, not used: its summarize would clash with the one from MCMCChains

{{?model=gaussian}} fitted = gaussian_model({{y}})  # the model that was sampled
{{?model=linear}} fitted = linear_model({{X}}, {{y}})  # the model that was sampled
{{?model=logistic}} fitted = logistic_model({{X}}, {{y}})  # the model that was sampled
{{?model=hierarchical}} fitted = hierarchical_model({{y}}, {{group}}, {{ngroups}})  # the model that was sampled
obs_syms = [Symbol("{{y}}[", i, "]") for i in eachindex({{y}})]  # observation names, in data order
loglik(m, ch) = (pll = pointwise_loglikelihoods(m, ch; factorize=true); cat([Array(pll[s]) for s in obs_syms]...; dims=3))  # draws x chains x observations
{{?model=gaussian}} @model function alt_model({{y}})  # alternative: heavy-tailed Student-t likelihood
{{?model=gaussian}}     mu ~ Normal(0, 10); sigma ~ Exponential(1); nu ~ Gamma(2, 10)
{{?model=gaussian}}     {{y}} .~ mu + sigma * TDist(nu)
{{?model=gaussian}} end
{{?model=gaussian}} alt = alt_model({{y}})
{{?model=linear}} @model function alt_model({{y}})  # alternative: intercept only, no covariate
{{?model=linear}}     alpha ~ Normal(0, 10); sigma ~ Exponential(1)
{{?model=linear}}     {{y}} .~ Normal(alpha, sigma)
{{?model=linear}} end
{{?model=linear}} alt = alt_model({{y}})
{{?model=logistic}} @model function alt_model({{y}})  # alternative: intercept only, no covariate
{{?model=logistic}}     alpha ~ Normal(0, 10)
{{?model=logistic}}     {{y}} .~ Bernoulli(logistic(alpha))
{{?model=logistic}} end
{{?model=logistic}} alt = alt_model({{y}})
{{?model=hierarchical}} @model function alt_model({{y}})  # alternative: complete pooling, one mean for all groups
{{?model=hierarchical}}     mu ~ Normal(0, 10); sigma ~ Exponential(1)
{{?model=hierarchical}}     {{y}} .~ Normal(mu, sigma)
{{?model=hierarchical}} end
{{?model=hierarchical}} alt = alt_model({{y}})
chain_alt = sample(alt, NUTS(), MCMCThreads(), {{n-samples}}, {{n-chains}})  # same data, same draws
mc = PosteriorStats.compare((fitted = PosteriorStats.loo(loglik(fitted, chain)), alternative = PosteriorStats.loo(loglik(alt, chain_alt))))
print(mc)  # rank 1 has the higher ELPD; elpd_diff is each model ELPD below rank 1 (0 for the best): a difference within about 2 se_elpd_diff is not decisive
'''

[[actionGroups.actions]]
id = "waic"
label = "WAIC"
desc = "Widely applicable information criterion for Bayesian model selection"
code = '''
using Statistics

{{?model=gaussian}} fitted = gaussian_model({{y}})  # the model that was sampled
{{?model=linear}} fitted = linear_model({{X}}, {{y}})  # the model that was sampled
{{?model=logistic}} fitted = logistic_model({{X}}, {{y}})  # the model that was sampled
{{?model=hierarchical}} fitted = hierarchical_model({{y}}, {{group}}, {{ngroups}})  # the model that was sampled
obs_syms = [Symbol("{{y}}[", i, "]") for i in eachindex({{y}})]  # observation names, in data order
loglik(m, ch) = (pll = pointwise_loglikelihoods(m, ch; factorize=true); cat([Array(pll[s]) for s in obs_syms]...; dims=3))  # draws x chains x observations
ll = reshape(loglik(fitted, chain), :, length(obs_syms))  # all draws x observations
lme(v) = maximum(v) + log(mean(exp.(v .- maximum(v))))  # log of the mean of exp(v), computed stably
lppd = sum(lme(c) for c in eachcol(ll))  # log pointwise predictive density
p_waic = sum(var(c) for c in eachcol(ll))  # effective number of parameters
(elpd_waic = lppd - p_waic, p_waic = p_waic, waic = -2 * (lppd - p_waic))  # PosteriorStats no longer provides waic; PSIS-LOO is preferred
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary"
label = "Posterior Summary"
desc = "Mean, std, credible intervals, R-hat, and ESS for all parameters"
code = '''
summarize(chain)  # full posterior summary table

quantile(chain; q=[0.025, 0.5, 0.975])  # 2.5%, 50% and 97.5% quantiles: the 95% equal-tailed credible interval
'''

[[actionGroups.actions]]
id = "hdi"
label = "HPD Interval"
desc = "Highest posterior density interval: shortest interval containing p% of probability mass"
code = '''
import PosteriorStats  # imported, not used: its summarize would clash with the one from MCMCChains

{{?model=gaussian}} par = :mu  # the mean
{{?model=linear|logistic}} par = :beta  # the slope
{{?model=hierarchical}} par = :mu0  # the global mean
samples = Array(chain[:, par, :])  # draws of that parameter
PosteriorStats.hdi(vec(samples); prob=0.95)  # 95% HPD interval
'''

[[actionGroups.actions]]
id = "marginals"
label = "Marginal Posteriors"
desc = "Posterior density overlaid with prior to assess prior sensitivity"
code = '''
using StatsPlots, Distributions

{{?model=gaussian}} par = :mu  # the mean
{{?model=linear|logistic}} par = :beta  # the slope
{{?model=hierarchical}} par = :mu0  # the global mean
density(vec(Array(chain[:, par, :])); label="posterior")  # posterior for par
plot!(Normal(0, 10); label="prior Normal(0, 10)")  # its prior: a posterior much narrower than the prior is driven by the data
'''
