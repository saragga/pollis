[[codeBranches]]
model = "gaussian"
code = '''
using Turing, Distributions

@model function gaussian_model({{y}})
    mu ~ Normal(0, 10)  # prior: mean
    sigma ~ Exponential(1)  # prior: std dev
    {{y}} .~ Normal(mu, sigma)  # likelihood
end

{{?sampler=nuts}} sampler = NUTS({{delta}})
{{?sampler=hmc}} sampler = HMC({{epsilon}}, {{leapfrog}}; adtype={{adtype}}())
{{?sampler=mh}} sampler = MH()
chain = sample(gaussian_model({{y}}), sampler, MCMCThreads(), {{n-samples}}, {{n-chains}})  # {{n-samples}} samples, {{n-chains}} chains
summarize(chain)
'''

[[codeBranches]]
model = "linear"
code = '''
using Turing, Distributions

@model function linear_model({{X}}, {{y}})
    alpha ~ Normal(0, 10)  # intercept prior
    beta  ~ Normal(0, 10)  # slope prior
    sigma ~ Exponential(1)  # noise prior
    {{y}} .~ Normal.(alpha .+ beta .* {{X}}, sigma)
end

{{?sampler=nuts}} sampler = NUTS({{delta}})
{{?sampler=hmc}} sampler = HMC({{epsilon}}, {{leapfrog}}; adtype={{adtype}}())
{{?sampler=mh}} sampler = MH()
chain = sample(linear_model({{X}}, {{y}}), sampler, MCMCThreads(), {{n-samples}}, {{n-chains}})  # {{n-samples}} samples, {{n-chains}} chains
summarize(chain)
'''

[[codeBranches]]
model = "logistic"
code = '''
using Turing, Distributions

@model function logistic_model({{X}}, {{y}})
    alpha ~ Normal(0, 10)  # intercept prior
    beta  ~ Normal(0, 10)  # slope prior
    p = logistic.(alpha .+ beta .* {{X}})
    {{y}} .~ Bernoulli.(p)
end

{{?sampler=nuts}} sampler = NUTS({{delta}})
{{?sampler=hmc}} sampler = HMC({{epsilon}}, {{leapfrog}}; adtype={{adtype}}())
{{?sampler=mh}} sampler = MH()
chain = sample(logistic_model({{X}}, {{y}}), sampler, MCMCThreads(), {{n-samples}}, {{n-chains}})  # {{n-samples}} samples, {{n-chains}} chains
summarize(chain)
'''

[[codeBranches]]
model = "hierarchical"
code = '''
using Turing, Distributions

@model function hierarchical_model({{y}}, {{group}}, G)
    mu0   ~ Normal(0, 10)  # hyperprior: global mean
    sigma0 ~ Exponential(1)  # hyperprior: group spread
    sigma  ~ Exponential(1)  # observation noise
    mu = Vector{Real}(undef, G)
    for g in 1:G
        mu[g] ~ Normal(mu0, sigma0)  # group-level means
    end
    for i in eachindex({{y}})
        {{y}}[i] ~ Normal(mu[{{group}}[i]], sigma)
    end
end

{{?sampler=nuts}} sampler = NUTS({{delta}})
{{?sampler=hmc}} sampler = HMC({{epsilon}}, {{leapfrog}}; adtype={{adtype}}())
{{?sampler=mh}} sampler = MH()
chain = sample(hierarchical_model({{y}}, {{group}}, {{ngroups}}), sampler, MCMCThreads(), {{n-samples}}, {{n-chains}})  # {{n-samples}} samples, {{n-chains}} chains
summarize(chain)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "trace-plot"
label = "Trace Plot"
desc = "MCMC chain trajectories per parameter across all iterations"
code = '''
using StatsPlots

plot(chain)  # trace + density for all parameters
'''

[[actionGroups.actions]]
id = "density-plot"
label = "Density Plot"
desc = "Marginal posterior densities for all sampled parameters"
code = '''
using StatsPlots

density(chain)  # posterior density per parameter
'''

[[actionGroups.actions]]
id = "pair-plot"
label = "Pair Plot"
desc = "Joint posteriors and correlations between all parameter pairs"
code = '''
using PairPlots

pairplot(chain)  # corner plot of joint posteriors
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "rhat"
label = "R-hat"
desc = "Gelman-Rubin diagnostic: values close to 1.0 indicate convergence"
code = '''
summarize(chain)  # includes rhat and ess columns

summarize(chain)[:, [:parameters, :rhat]]  # rhat: should be < 1.01
'''

[[actionGroups.actions]]
id = "ess"
label = "Effective Sample Size"
desc = "ESS below 100 per chain is a warning sign for unreliable estimates"
code = '''
summarize(chain)[:, [:parameters, :ess_bulk, :ess_tail]]  # bulk and tail ESS
'''

[[actionGroups.actions]]
id = "autocorr"
label = "Autocorrelation"
desc = "High autocorrelation indicates poor mixing; consider thinning"
code = '''
using StatsPlots

autocorplot(chain)  # lag-autocorrelation per parameter
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "ppc"
label = "Posterior Predictive Check"
desc = "Sample from the posterior predictive to assess model fit"
code = '''
missing_model = gaussian_model(missing)  # replace y with missing to predict
y_pred = predict(missing_model, chain)  # posterior predictive samples

using StatsPlots
density(vec(Array(y_pred)))  # predictive distribution
scatter!({{y}}, zeros(length({{y}})))  # overlay observed data
'''

[[actionGroups.actions]]
id = "loo"
label = "LOO-CV"
desc = "Pareto-smoothed importance-sampling leave-one-out cross-validation"
code = '''
using PosteriorStats, Turing

log_lik = pointwise_loglikelihoods(model, chain)  # log-likelihood per observation
loo_result = loo(stack(log_lik))  # LOO-CV via PSIS
print(loo_result)  # ELPD, p_loo, Pareto k diagnostics
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "loo-compare"
label = "LOO Compare"
desc = "Compare models by expected log predictive density (ELPD)"
code = '''
using PosteriorStats

loo_a = loo(stack(log_lik_a))  # LOO for model A
loo_b = loo(stack(log_lik_b))  # LOO for model B
loo_compare(loo_a, loo_b)  # negative = B preferred
'''

[[actionGroups.actions]]
id = "waic"
label = "WAIC"
desc = "Widely applicable information criterion for Bayesian model selection"
code = '''
using PosteriorStats

log_lik = pointwise_loglikelihoods(model, chain)  # log-likelihood matrix
waic_result = waic(stack(log_lik))  # WAIC and p_waic
print(waic_result)  # ELPD_waic and effective params
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary"
label = "Posterior Summary"
desc = "Mean, std, credible intervals, R-hat, and ESS for all parameters"
code = '''
summarize(chain)  # full posterior summary table

summarize(chain; q=[0.025, 0.5, 0.975])  # with 95% credible intervals
'''

[[actionGroups.actions]]
id = "hdi"
label = "HPD Interval"
desc = "Highest posterior density interval: shortest interval containing p% of probability mass"
code = '''
using PosteriorStats

samples = Array(chain[:, :mu, :])  # extract parameter samples
hdi(vec(samples); prob=0.95)  # 95% HPD interval
'''

[[actionGroups.actions]]
id = "marginals"
label = "Marginal Posteriors"
desc = "Posterior density overlaid with prior to assess prior sensitivity"
code = '''
using StatsPlots, Distributions

density(chain[:, :mu, :])  # posterior for mu
plot!(Normal(0, 10), label="prior")  # overlay prior
'''
