[[actionGroups.actions]]
id = "rhat"
label = "R-hat"
desc = "Gelman-Rubin diagnostic: values close to 1.0 indicate convergence"
code = '''
summarize(chain)  # includes rhat and ess columns

summarize(chain)[:, [:parameters, :rhat]]  # rhat: should be < 1.01
'''

[[actionGroups.actions]]
id = "ess"
label = "Effective Sample Size"
desc = "ESS below 100 per chain is a warning sign for unreliable estimates"
code = '''
