[[codeBranches]]
model = "lcp"
code = '''
using JuMP, PATHSolver, Ipopt, LinearAlgebra, Random, Statistics
M = {{M}}
q = {{q}}
n = length(q)
Fop(x) = M * x .+ q  # affine map
lb, ub = zeros(n), fill(Inf, n)  # x >= 0

function solve_cp(F=Fop; lb=lb, ub=ub, start=fill(1.0, n), iters=nothing)  # mixed complementarity: lb <= x <= ub perp F(x)
    m = Model(PATHSolver.Optimizer); set_silent(m)
    @variable(m, x[i=1:n], start = start[i])
    for i in 1:n
        isfinite(lb[i]) && set_lower_bound(x[i], lb[i])
        isfinite(ub[i]) && set_upper_bound(x[i], ub[i])
    end
    @constraint(m, complements(F(x), x))
    iters === nothing || set_attribute(m, "major_iteration_limit", iters)
    optimize!(m)
    xs = value.(x)
    (x = xs, Fx = F(xs), ok = termination_status(m) == MOI.LOCALLY_SOLVED, status = raw_status(m))
end

mid(a, l, u) = min(max(a, l), u)
residual(x, F=Fop) = norm(x .- mid.(x .- F(x), lb, ub))  # natural residual: zero exactly at a solution

sol = solve_cp()
(x = round.(sol.x, digits=6), F_at_x = round.(sol.Fx, digits=6), residual = residual(sol.x), solved = sol.ok)
'''

