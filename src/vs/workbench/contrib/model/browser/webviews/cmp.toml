[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "plot-residual"
label = "Residual Plot"
desc = "Natural residual ||x - mid(lb, ub, x - F(x))|| after each PATH major iteration: the fast local convergence of the Newton method"
code = '''
using Plots
res = [residual(solve_cp(; iters=k).x) for k in 0:15]
plot(0:15, max.(res, 1e-16), marker=:o, yscale=:log10, xlabel="PATH major iterations", ylabel="Natural residual", legend=false, title="Complementarity residual")
'''

[[actionGroups.actions]]
id = "pairs"
label = "Complementarity Pairs"
desc = "Each component's x_i next to F_i(x): wherever x_i is off its bounds F_i is zero, and wherever F_i is non-zero x_i sits at a bound"
code = '''
using Plots
bar((1:n) .- 0.2, sol.x, bar_width=0.4, label="x", xticks=(1:n, ["i = " * string(i) for i in 1:n]), ylabel="Value", title="Complementarity pairs")
bar!((1:n) .+ 0.2, sol.Fx, bar_width=0.4, label="F(x)")
hline!([0], c=:black, label=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "check-compl"
label = "Complementarity Check"
desc = "Bounds, sign conditions of F at each bound and complementarity at the solution"
code = '''
tol = 1e-6
atl, atu = sol.x .<= lb .+ tol, sol.x .>= ub .- tol
(within_bounds = all(lb .- tol .<= sol.x .<= ub .+ tol),
 F_nonneg_at_lower = all(sol.Fx[atl .& .!atu] .>= -tol), F_nonpos_at_upper = all(sol.Fx[atu .& .!atl] .<= tol),
 F_zero_inside = all(abs.(sol.Fx[.!atl .& .!atu]) .<= tol), max_violation = residual(sol.x))
'''

[[actionGroups.actions]]
id = "check-status"
label = "Solver Status"
desc = "PATH termination message and residual, and whether the Jacobian of F is positive definite at the solution (local uniqueness indicator)"
code = '''
h = 1e-6
J = reduce(hcat, [(Fop(sol.x .+ h .* [j == k ? 1.0 : 0.0 for k in 1:n]) .- sol.Fx) ./ h for j in 1:n])  # finite-difference Jacobian
(solved = sol.ok, status = sol.status, residual = residual(sol.x), min_eig_sym_jacobian = round(minimum(eigvals(Symmetric((J + transpose(J)) / 2))), digits=4))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "parametric"
label = "Parametric Solve"
desc = "Solution path as the map is shifted to F(x) + t (every component), warm-starting each solve from the previous one"
code = '''
using Plots
ts = range(-1, 1, length=41)
function solution_path(ts)
    xs, x0 = Vector{Float64}[], sol.x
    for t in ts
        r = solve_cp(x -> Fop(x) .+ t; start=x0)
        push!(xs, r.ok ? r.x : fill(NaN, n)); r.ok && (x0 = r.x)  # warm start
    end
    reduce(hcat, xs)
end
plot(ts, transpose(solution_path(ts)), lw=2, marker=:circle, ms=2, xlabel="Shift t", ylabel="x*(t)", label=permutedims(["x" * string(i) for i in 1:n]), title="Parametric solve")
'''

[[actionGroups.actions]]
id = "multistart"
label = "Solution Multiplicity"
desc = "Solve from 50 random starting points and list the distinct solutions PATH reaches, with how often each is found"
code = '''
rng = MersenneTwister(1)
found = Dict{Vector{Float64}, Int}()
for _ in 1:50
    r = solve_cp(; start=mid.(3 .* rand(rng, n), lb, ub))
    r.ok && residual(r.x) < 1e-6 && (k = round.(r.x, digits=4); found[k] = get(found, k, 0) + 1)
end
[(x = k, times_found = v) for (k, v) in sort(collect(found), by=last, rev=true)]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "lp-relax"
label = "Merit Function Reformulation"
desc = "Solve the same problem by minimising the squared Fischer-Burmeister merit function with Ipopt, and compare with PATH"
code = '''
fb(a, b) = sqrt(a^2 + b^2 + 1e-12) - a - b  # zero iff a >= 0, b >= 0, ab = 0
function phi(x, Fx, i)  # Billups merit for each bound type
    lo, up = isfinite(lb[i]), isfinite(ub[i])
    lo && up ? fb(x[i] - lb[i], -fb(ub[i] - x[i], -Fx[i])) : lo ? fb(x[i] - lb[i], Fx[i]) : up ? fb(ub[i] - x[i], -Fx[i]) : Fx[i]
end
t = @elapsed begin
    m = Model(Ipopt.Optimizer); set_silent(m)
    @variable(m, x[1:n], start = 1.0)
    Fx = Fop(x)
    @objective(m, Min, sum(phi(x, Fx, i)^2 for i in 1:n))
    optimize!(m)
end
t_path = @elapsed solve_cp()
[(method = "PATH", x = round.(sol.x, digits=4), residual = residual(sol.x), seconds = round(t_path, digits=3)),
 (method = "Fischer-Burmeister + Ipopt", x = round.(value.(x), digits=4), residual = residual(value.(x)), seconds = round(t, digits=3))]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "dual-interp"
label = "Dual Interpretation"
desc = "Classify each pair: at the lower bound (F_i >= 0 acts as a binding constraint), at the upper bound (F_i <= 0), or interior (F_i = 0 holds as an equation)"
code = '''
tol = 1e-6
[(i = i, x = round(sol.x[i], digits=5), F = round(sol.Fx[i], digits=5),
  status = sol.x[i] <= lb[i] + tol ? (abs(sol.Fx[i]) <= tol ? "at lower bound, degenerate" : "at lower bound") :
           sol.x[i] >= ub[i] - tol ? "at upper bound" : "interior, F = 0") for i in 1:n]
'''

[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity Analysis"
desc = "Finite-difference response of the solution to a small shift in each component of F (for the LCP, a shift of q): dx_i / dshift_j"
code = '''
d = 1e-4
S = reduce(hcat, [(solve_cp(x -> Fop(x) .+ d .* [k == j ? 1.0 : 0.0 for k in 1:n]; start=sol.x).x .- sol.x) ./ d for j in 1:n])
round.(S, digits=4)  # column j: response of x to shifting F_j
'''
