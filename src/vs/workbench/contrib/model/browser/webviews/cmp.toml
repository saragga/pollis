[[bullets]]
text = "A complementarity problem finds a point x and an operator F(x) that are mutually non-negative and perpendicular: each component is either zero or its counterpart is zero. The condition x ≥ 0, F(x) ≥ 0, xᵀF(x) = 0 captures equilibrium in markets, mechanical contact, and game theory."
detail = ""

[[bullets]]
text = "LCP and NCP are special cases of the Mixed Complementarity Problem (MCP), which adds box constraints and is the standard form solved by the PATH solver."
detail = ""

[[decisionRows]]
task = "Linear Complementarity"
context = "Affine map F(x) = Mx + q: KKT conditions of convex quadratic programmes, bimatrix games, contact mechanics, American options"
purpose = "Find x >= 0 with Mx + q >= 0 and x'(Mx + q) = 0; a unique solution for every q when M is positive definite. Solved with PATH through JuMP"

[[decisionRows]]
task = "Nonlinear Complementarity"
context = "Nonlinear map F with sign-constrained variables: market equilibria, traffic equilibria, KKT systems of nonlinear programmes"
purpose = "Find x >= 0 with F(x) >= 0 and x'F(x) = 0. Default: the Kojima-Shindo problem, which has two solutions, (1, 0, 3, 0) and (sqrt(6)/2, 0, 0, 1/2)"

[[decisionRows]]
task = "Mixed Complementarity"
context = "Box bounds lb <= x <= ub, including free variables (equations) and upper bounds (capacities): the general form behind GAMS/MCP and PATH"
purpose = "x_i at lb needs F_i >= 0, at ub needs F_i <= 0, strictly between needs F_i = 0. Default: Kojima-Shindo with x1 <= 1, which removes the solution with x1 = sqrt(6)/2 and creates (1, 0, 0, 2/3) with x1 at its upper bound"

[[inputs]]
id = "M"
label = "Matrix M (n x n)"
tooltip = "Matrix of the affine map F(x) = Mx + q, as a Julia matrix literal."
default = "[2.0 1.0 0.0; 1.0 2.0 1.0; 0.0 1.0 2.0]"
models = ["lcp"]

[[inputs]]
id = "q"
label = "Vector q"
tooltip = "Constant of the affine map F(x) = Mx + q; its length sets n."
default = "[-3.0, -2.0, 1.0]"
models = ["lcp"]

[[inputs]]
id = "n"
label = "Dimension n"
tooltip = "Number of variables; must match the length of F."
default = "4"
models = ["ncp", "mcp"]

[[inputs]]
id = "F"
label = "Operator F(x)"
tooltip = "Vector of Julia expressions in x[1] .. x[n]. Default: the Kojima-Shindo test problem."
default = "[3x[1]^2 + 2x[1]*x[2] + 2x[2]^2 + x[3] + 3x[4] - 6, 2x[1]^2 + x[1] + x[2]^2 + 10x[3] + 2x[4] - 2, 3x[1]^2 + x[1]*x[2] + 2x[2]^2 + 2x[3] + 9x[4] - 9, x[1]^2 + 3x[2]^2 + 2x[3] + 3x[4] - 3]"
models = ["ncp", "mcp"]

[[inputs]]
id = "lb"
label = "Lower Bounds lb"
tooltip = "Lower bounds as a Julia vector; use -Inf for a free component (then F_i = 0 is an equation when ub_i is also Inf)."
default = "zeros(4)"
models = ["mcp"]

[[inputs]]
id = "ub"
label = "Upper Bounds ub"
tooltip = "Upper bounds as a Julia vector; use Inf where there is none."
default = "[1.0, Inf, Inf, Inf]"
models = ["mcp"]

