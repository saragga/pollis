[[codeBranches]]
model = "ae"
code = '''
using OutlierDetection, OutlierDetectionNetworks, Flux, Statistics
using OutlierDetectionNetworks.Templates: MLPAutoEncoder
using Random

# Example data: 1000 points near a 2-D plane in 6 dimensions, 5% of them moved off the plane
rng = Xoshiro(42)
n, p = 1000, 6
W = randn(rng, 2, p)  # the plane
X = randn(rng, n, 2) * W .+ 0.1 .* randn(rng, n, p)  # normal points: plane plus small noise
out_idx = randperm(rng, n)[1:50]  # the injected anomalies (ground truth, unknown in real data)
X[out_idx, :] = 1.5 .* randn(rng, 50, p)  # off the plane, but within the range of each feature

lo, hi = minimum({{data}}, dims=1), maximum({{data}}, dims=1)
Xs = Float32.(permutedims(({{data}} .- lo) ./ (hi .- lo)))  # scale to [0, 1], observations in columns

encoder, decoder = MLPAutoEncoder(size(Xs, 1), {{latent}}, {{hidden}}; bias=true)  # input, latent and hidden sizes
detector = AEDetector(encoder=encoder, decoder=decoder, epochs={{epochs}}, opt=Adam(1e-3))
model, scores = OutlierDetection.fit(detector, Xs; verbosity=0)  # score = reconstruction error

threshold = quantile(scores, 1 - {{contam}})  # flag the top {{contam}} share of scores; the contamination is an assumption about the data
anomalies = findall(scores .> threshold)  # row indices of the flagged points
println("Anomalies detected: ", length(anomalies))

hits = length(intersect(anomalies, out_idx))  # flagged points that are injected anomalies (example data only)
println("Precision: ", round(hits / length(anomalies); digits = 2), "  Recall: ", round(hits / length(out_idx); digits = 2))
'''

[[codeBranches]]
model = "deepsad"
code = '''
using OutlierDetection, OutlierDetectionNetworks, Flux, Statistics
using OutlierDetectionNetworks.Templates: MLPAutoEncoder
using Random

# Example data: 1000 points near a 2-D plane in 6 dimensions, 5% of them moved off the plane
rng = Xoshiro(42)
n, p = 1000, 6
W = randn(rng, 2, p)  # the plane
X = randn(rng, n, 2) * W .+ 0.1 .* randn(rng, n, p)  # normal points: plane plus small noise
out_idx = randperm(rng, n)[1:50]  # the injected anomalies (ground truth, unknown in real data)
X[out_idx, :] = 1.5 .* randn(rng, 50, p)  # off the plane, but within the range of each feature
anom_idx = out_idx[1:10]  # only 10 anomalies carry a label; the other 40 stay hidden

lo, hi = minimum({{data}}, dims=1), maximum({{data}}, dims=1)
Xs = Float32.(permutedims(({{data}} .- lo) ./ (hi .- lo)))  # scale to [0, 1], observations in columns
y  = fill("normal", size({{data}}, 1))  # unlabelled rows get the label normal: this package cannot take missing labels (its loss tests y == class);
                                       # with eta = 1 that is exactly the unlabelled term of Deep SAD, with eta != 1 it reweights them as labelled normals
y[{{known}}] .= "outlier"  # rows known to be anomalies

encoder, decoder = MLPAutoEncoder(size(Xs, 1), {{latent}}, {{hidden}}; bias=true)  # the decoder is used for pretraining only
detector = DSADDetector(encoder=encoder, decoder=decoder, epochs=(10, {{epochs}}), eta={{eta}})  # (pretraining, training) epochs
model, scores = OutlierDetection.fit(detector, Xs, to_categorical(y); verbosity=0)  # score = distance to the centre

threshold = quantile(scores, 1 - {{contam}})  # flag the top {{contam}} share of scores; the contamination is an assumption about the data
anomalies = findall(scores .> threshold)  # row indices of the flagged points
println("Anomalies detected: ", length(anomalies))

hits = length(intersect(anomalies, out_idx))  # flagged points that are injected anomalies (example data only)
println("Precision: ", round(hits / length(anomalies); digits = 2), "  Recall: ", round(hits / length(out_idx); digits = 2))
hidden = setdiff(out_idx, {{known}})  # anomalies the detector was not told about
println("Recall on unlabelled anomalies: ", round(mean(in(anomalies), hidden); digits = 2))
'''

[[codeBranches]]
model = "esad"
code = '''
using OutlierDetection, OutlierDetectionNetworks, Flux, Statistics
using OutlierDetectionNetworks.Templates: MLPAutoEncoder
using Random

# Example data: 1000 points near a 2-D plane in 6 dimensions, 5% of them moved off the plane
rng = Xoshiro(42)
n, p = 1000, 6
W = randn(rng, 2, p)  # the plane
X = randn(rng, n, 2) * W .+ 0.1 .* randn(rng, n, p)  # normal points: plane plus small noise
out_idx = randperm(rng, n)[1:50]  # the injected anomalies (ground truth, unknown in real data)
X[out_idx, :] = 1.5 .* randn(rng, 50, p)  # off the plane, but within the range of each feature
anom_idx = out_idx[1:10]  # only 10 anomalies carry a label; the other 40 stay hidden

lo, hi = minimum({{data}}, dims=1), maximum({{data}}, dims=1)
Xs = Float32.(permutedims(({{data}} .- lo) ./ (hi .- lo)))  # scale to [0, 1], observations in columns
y  = fill("normal", size({{data}}, 1))  # unlabelled rows get the label normal, as ESAD assumes; this package cannot take missing labels
y[{{known}}] .= "outlier"  # rows known to be anomalies

encoder, decoder = MLPAutoEncoder(size(Xs, 1), {{latent}}, {{hidden}}; bias=true)
detector = ESADDetector(encoder=encoder, decoder=decoder, epochs={{epochs}})  # one end-to-end training stage
model, scores = OutlierDetection.fit(detector, Xs, to_categorical(y); verbosity=0)  # score = distance in latent space

threshold = quantile(scores, 1 - {{contam}})  # flag the top {{contam}} share of scores; the contamination is an assumption about the data
anomalies = findall(scores .> threshold)  # row indices of the flagged points
println("Anomalies detected: ", length(anomalies))

hits = length(intersect(anomalies, out_idx))  # flagged points that are injected anomalies (example data only)
println("Precision: ", round(hits / length(anomalies); digits = 2), "  Recall: ", round(hits / length(out_idx); digits = 2))
hidden = setdiff(out_idx, {{known}})  # anomalies the detector was not told about
println("Recall on unlabelled anomalies: ", round(mean(in(anomalies), hidden); digits = 2))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "score-scatter"
label = "Score Scatter"
desc = "First two features, coloured by anomaly score, with flagged points marked"
code = '''
using Plots, Statistics

threshold = quantile(scores, 1 - {{contam}})
flagged   = scores .> threshold
scatter({{data}}[:, 1], {{data}}[:, 2], zcolor=scores, markerstrokewidth=0, label="Score", xlabel="Feature 1", ylabel="Feature 2")
scatter!({{data}}[flagged, 1], {{data}}[flagged, 2], marker=:x, markersize=6, color=:red, label="Flagged")
'''

[[actionGroups.actions]]
id = "score-histogram"
label = "Score Distribution"
desc = "Histogram of anomaly scores with the contamination threshold"
code = '''
using Plots, Statistics

threshold = quantile(scores, 1 - {{contam}})
histogram(scores, bins=40, label="Scores", xlabel="Anomaly score", ylabel="Count")
vline!([threshold], color=:red, linestyle=:dash, label="Threshold")  # a clear gap before the tail is reassuring
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "seed-stability"
label = "Seed Stability"
desc = "Refit with three random seeds and compare the score rankings"
code = '''
using OutlierDetection, OutlierDetectionNetworks, Flux, Random, StatsBase
using OutlierDetectionNetworks.Templates: MLPAutoEncoder

runs = map(1:3) do seed
	Random.seed!(seed)  # different initial weights and batches
	encoder, decoder = MLPAutoEncoder(size(Xs, 1), {{latent}}, {{hidden}}; bias=true)
{{?model=ae}}	d = AEDetector(encoder=encoder, decoder=decoder, epochs={{epochs}}, opt=Adam(1e-3))
{{?model=ae}}	OutlierDetection.fit(d, Xs; verbosity=0)[2]
{{?model=deepsad}}	d = DSADDetector(encoder=encoder, decoder=decoder, epochs=(10, {{epochs}}), eta={{eta}})
{{?model=esad}}	d = ESADDetector(encoder=encoder, decoder=decoder, epochs={{epochs}})
{{?model!=ae}}	OutlierDetection.fit(d, Xs, to_categorical(y); verbosity=0)[2]
end
display(corspearman(reduce(hcat, runs)))  # values near 1: the ranking does not depend on the seed
'''

[[actionGroups.actions]]
id = "top-anomalies"
label = "Top Anomalies"
desc = "Row indices and scores of the highest-ranked points"
code = '''
ranked = sortperm(scores, rev=true)  # most anomalous first
for i in ranked[1:10]
	println("row ", i, "  score = ", round(scores[i], sigdigits=4))
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "score-new"
label = "Score New Data"
desc = "Apply the fitted network to new observations X_new"
code = '''
using OutlierDetection, OutlierDetectionNetworks, Statistics

X_new = vcat(randn(200, 2) * W .+ 0.1 .* randn(200, p), 1.5 .* randn(10, p))  # example: 200 points from the plane, 10 off it; use your own new data here
threshold  = quantile(scores, 1 - {{contam}})  # calibrated on the training scores
Xn         = Float32.(permutedims((X_new .- lo) ./ (hi .- lo)))  # same scaling as the training data
new_scores = OutlierDetection.transform(detector, model, Xn)
new_flags  = new_scores .> threshold
println("Flagged ", sum(new_flags), " of ", length(new_flags), " new points")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-lof"
label = "vs Proximity (LOF)"
desc = "Agreement with a Local Outlier Factor baseline"
code = '''
using OutlierDetection, OutlierDetectionNeighbors, Statistics, StatsBase

_, lof = OutlierDetection.fit(LOFDetector(k=20), Xs; verbosity=0)  # needs no training; k above the size of small anomaly clusters
top_nn  = Set(findall(scores .> quantile(scores, 1 - {{contam}})))
top_lof = Set(findall(lof .> quantile(lof, 1 - {{contam}})))
println("Spearman correlation: ", round(corspearman(scores, lof), digits=3))
println("Flagged by both: ", length(intersect(top_nn, top_lof)), " of ", length(top_nn))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "feature-errors"
label = "Feature Attribution"
desc = "Which features make the most anomalous point stand out"
code = '''
using Flux, Statistics

top = argmax(scores)
{{?model=ae}}Flux.testmode!(model.chain)  # inference mode for the BatchNorm layers
{{?model=ae}}err = (model.chain(Xs)[:, top] .- Xs[:, top]) .^ 2  # reconstruction error per feature
{{?model!=ae}}err = abs.(Xs[:, top] .- vec(median(Xs, dims=2)))  # scaled distance from the median, per feature
for j in sortperm(vec(err), rev=true)
	println("feature ", j, "  ", round(err[j], sigdigits=3))
end
'''

[[actionGroups.actions]]
id = "normalise-scores"
label = "Normalise Scores"
desc = "Rescale scores to [0, 1] and to percentile ranks"
code = '''
using StatsBase

scaled = (scores .- minimum(scores)) ./ (maximum(scores) - minimum(scores))  # [0, 1], sensitive to extremes
pct    = ordinalrank(scores) ./ length(scores)  # percentile rank, comparable across detectors
top    = argmax(scores)
println("Top point: row ", top, ", min-max ", round(scaled[top], digits=3), ", percentile ", round(pct[top], digits=3))
'''
