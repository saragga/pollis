[[bullets]]
text = "AutoEncoder (AE)"
detail = "trains an encoder-decoder network to reconstruct the data; anomalies have a high reconstruction error because the network cannot compress them well"

[[bullets]]
text = "Deep Semi-Supervised Anomaly Detection (DeepSAD)"
detail = "learns a latent space in which normal samples gather around a centre; a small set of labelled anomalies is pushed away from it"

[[bullets]]
text = "End-to-End Semi-Supervised Anomaly Detection (ESAD)"
detail = "trains the representation and the detector jointly in one stage, using the labelled anomalies throughout"

[[decisionRows]]
task = "AutoEncoder"
context = "Unlabelled data with nonlinear structure"
purpose = "Anomalies are the points the network cannot reconstruct"

[[decisionRows]]
task = "DeepSAD"
context = "A few labelled anomalies are available"
purpose = "Tighten the normal region around a centre and push known anomalies out"

[[decisionRows]]
task = "ESAD"
context = "Labelled anomalies, single training stage"
purpose = "End-to-end training without a separate pretraining phase"

[[decisionRows]]
task = "Proximity-based instead"
context = "Small, low-dimensional tabular data"
purpose = "KNN or LOF need no training and are easier to explain"

[[inputs]]
id = "data"
label = "Data (X)"
tooltip = "Numeric matrix with observations in rows and features in columns (n x p). The code scales each feature to [0, 1] and passes the transpose, because the networks expect observations in columns."
default = "X"

[[inputs]]
id = "contam"
label = "Contamination"
tooltip = "Expected fraction of anomalies in X, e.g. 0.05. Points scoring above the 1 - contamination quantile are flagged."
default = "0.05"

[[inputs]]
id = "known"
label = "Known Anomalies"
tooltip = "Row indices of X known to be anomalies, e.g. anom_idx = [3, 17, 42]. All other rows are treated as normal during training."
default = "anom_idx"
models = ["deepsad", "esad"]

[[inputs]]
id = "latent"
label = "Latent Size"
tooltip = "Width of the bottleneck layer. It must be well below the number of features, or the network can learn to copy anomalies too."
default = "2"
newRow = true

[[inputs]]
id = "hidden"
label = "Hidden Layers"
tooltip = "Widths of the hidden layers of the encoder, as a Julia vector; the decoder mirrors them. Example: [64, 32]"
default = "[32, 16]"

[[inputs]]
id = "epochs"
label = "Epochs"
tooltip = "Passes over the training data. Start with 50 to 100; too few epochs underfit, too many let the network reconstruct anomalies as well."
default = "50"

[[inputs]]
id = "eta"
label = "Label Weight (eta)"
tooltip = "Weight of the labelled points in the DeepSAD loss. Values above 1 trust the labels more than the unlabelled data."
default = "1"
models = ["deepsad"]

