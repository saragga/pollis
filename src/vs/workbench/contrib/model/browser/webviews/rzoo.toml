[[inputs]]
id = "robot"
label = "Model variable"
tooltip = "Variable name for the created RobotZoo model. Used in subsequent calls to dynamics(), RobotDynamics.dims(), etc."
default = "model"

[[inputs]]
id = "mass-pend"
label = "Mass"
tooltip = "Pendulum bob mass in kg. Affects gravitational torque and inertia."
default = "1.0"
models = ["pend"]

[[inputs]]
id = "len-pend"
label = "Length"
tooltip = "Pendulum arm length in metres from pivot to bob."
default = "0.5"
models = ["pend"]

[[inputs]]
id = "mp"
label = "Pendulum mass"
tooltip = "mp: mass of the pendulum bob in kg."
default = "0.2"
models = ["cart"]

[[inputs]]
id = "mc"
label = "Cart mass"
tooltip = "mc: mass of the cart in kg. The cart can only move horizontally."
default = "1.0"
models = ["cart"]

[[inputs]]
id = "l-cart"
label = "Pendulum length"
tooltip = "l: length of the pendulum arm in metres from cart pivot to bob."
default = "0.5"
models = ["cart"]

[[inputs]]
id = "L"
label = "Wheelbase"
tooltip = "L: distance between front and rear axles in metres. Governs turning radius for a given steering angle."
default = "2.7"
models = ["bicy"]

[[inputs]]
id = "mass-quad"
label = "Mass"
tooltip = "Total quadrotor mass in kg. Sets hover thrust as mass * g / 4 per motor."
default = "0.5"
models = ["quad"]

[[inputs]]
id = "d"
label = "Motor distance"
tooltip = "d: distance from centre of mass to each motor in metres. Determines moment arm for roll and pitch torques."
default = "0.3"
models = ["quad"]

[[codeBranches]]
model = "pend"
code = '''
using RobotZoo, RobotDynamics  # single pendulum: nonlinear swing-up benchmark

{{robot}} = RobotZoo.Pendulum(mass={{mass-pend}}, length={{len-pend}})  # instantiate pendulum with given mass and length
n, m = RobotDynamics.dims({{robot}})  # state dim n=2 [theta, theta_dot], control dim m=1 [torque]

x0 = [0.0, 0.0]  # initial state: hanging downward, at rest
u0 = zeros(m)  # zero torque
xdot = dynamics({{robot}}, x0, u0)  # evaluate continuous dynamics at (x0, u0)
'''

[[codeBranches]]
model = "cart"
code = '''
using RobotZoo, RobotDynamics  # cart-pole: underactuated 2 DOF benchmark

{{robot}} = RobotZoo.Cartpole(mp={{mp}}, mc={{mc}}, l={{l-cart}})  # instantiate cart-pole (pendulum mass, cart mass, arm length)
n, m = RobotDynamics.dims({{robot}})  # state dim n=4 [x, theta, xdot, thetadot], control dim m=1 [force]

x0 = [0.0, 0.0, 0.0, 0.0]  # initial state: cart at origin, pole hanging, at rest
u0 = zeros(m)  # zero force on cart
xdot = dynamics({{robot}}, x0, u0)  # evaluate continuous dynamics at (x0, u0)
'''

[[codeBranches]]
model = "bicy"
code = '''
using RobotZoo, RobotDynamics  # kinematic bicycle model for ground vehicle path planning

{{robot}} = RobotZoo.BicycleModel(L={{L}})  # instantiate bicycle model with wheelbase {{L}} m
n, m = RobotDynamics.dims({{robot}})  # state dim n=4 [x, y, theta, v], control dim m=2 [steering, accel]

x0 = zeros(n)  # initial state: at origin, heading forward, stationary
u0 = zeros(m)  # zero steering and acceleration
xdot = dynamics({{robot}}, x0, u0)  # evaluate continuous kinematics at (x0, u0)
'''

[[codeBranches]]
model = "quad"
code = '''
using RobotZoo, RobotDynamics  # 6 DOF quadrotor with quaternion attitude representation

{{robot}} = RobotZoo.Quadrotor(mass={{mass-quad}}, motor_dist={{d}})  # instantiate quadrotor ({{mass-quad}} kg, motor arm {{d}} m)
n, m = RobotDynamics.dims({{robot}})  # state dim n=13 [pos, quat, vel, omega], control dim m=4 [motor thrusts]

u_h = {{mass-quad}} * 9.81 / 4  # hover thrust per motor (total = mass * g)
x0  = zeros(n); x0[4] = 1.0  # hover at origin: identity quaternion (w=1)
u0  = fill(u_h, m)  # equal thrust on all 4 motors for hover
xdot = dynamics({{robot}}, x0, u0)  # evaluate dynamics: should give near-zero xdot at hover trim
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "simulate-plot"
label = "Simulation Plot"
desc = "Forward simulate the model and plot the state trajectory"
code = '''
using RobotZoo, RobotDynamics, Plots  # simulate and plot state trajectory

n, m = RobotDynamics.dims({{robot}})  # state and control dimensions
dt   = 0.01; N = 500  # time step and number of steps
x_sim = [x0]  # initialise simulation
for _ in 1:N  # integrate forward with explicit Euler
    xdot = dynamics({{robot}}, x_sim[end], u0)
    push!(x_sim, x_sim[end] + dt * xdot)
end
plot((0:N) * dt, transpose(reduce(hcat, x_sim)), xlabel="Time", ylabel="State")  # plot all state components over time
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "linearise"
label = "Linearisation"
desc = "Compute A and B matrices by finite-difference linearisation around an operating point"
code = '''
using RobotZoo, RobotDynamics, LinearAlgebra  # finite-difference linearisation around (x_eq, u_eq)

n, m = RobotDynamics.dims({{robot}})  # state and control dimensions
eps  = 1e-6  # finite difference step size
A    = zeros(n, n); B = zeros(n, m)  # Jacobian matrices
for i in 1:n  # columns of A
    dx = zeros(n); dx[i] = eps
    A[:, i] = (dynamics({{robot}}, x_eq + dx, u_eq) - dynamics({{robot}}, x_eq - dx, u_eq)) / (2eps)
end
for i in 1:m  # columns of B
    du = zeros(m); du[i] = eps
    B[:, i] = (dynamics({{robot}}, x_eq, u_eq + du) - dynamics({{robot}}, x_eq, u_eq - du)) / (2eps)
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "traj-opt"
label = "Trajectory Optimisation"
desc = "Set up and solve a trajectory optimisation problem using ALTRO"
code = '''
using RobotZoo, TrajectoryOptimization, Altro  # trajectory optimisation with RobotZoo model + ALTRO

n, m = RobotDynamics.dims({{robot}})  # model dimensions
N    = 101; tf = 5.0  # time horizon: 101 knot points over 5 seconds
Q    = Diagonal(ones(n))  # state cost: identity weighting
R    = Diagonal(0.1 * ones(m))  # control cost: light penalisation
Qf   = 100 * Diagonal(ones(n))  # terminal cost: strong penalisation
obj  = LQRObjective(Q, R, Qf, xf, N)  # quadratic objective
prob = Problem({{robot}}, obj, xf, tf, x0=x0, N=N)  # trajectory problem
solver = ALTROSolver(prob); solve!(solver)  # solve with ALTRO
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "param-sweep"
label = "Parameter Sensitivity"
desc = "Simulate the model with different parameter values and compare trajectories"
code = '''
using RobotZoo, RobotDynamics, Plots  # parameter sensitivity: vary mass and compare dynamics

for mass in [0.5, 1.0, 2.0]  # sweep over three mass values
    m_i = RobotZoo.Pendulum(mass=mass, length=0.5)
    xdot_i = dynamics(m_i, x0, u0)
    println("mass=", mass, "  xdot=", xdot_i)
end
'''

