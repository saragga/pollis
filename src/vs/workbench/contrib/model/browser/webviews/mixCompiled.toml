        for (int64_t i = 0; i < height; i++) {
            double x = x0 + (double)j * spacing;
            double y = y0 + (double)i * spacing;
            counts[i + j * height] = julia_set ? escape(x, y, cr, ci, maxiter) : escape(0.0, 0.0, x, y, maxiter);
        }
    }
}
"""

# Build: a shared library in ~/.pollis/mix/callback. -ffp-contract=off keeps x0 + j * spacing a product rounded, then
# a sum rounded, as Julia computes it; fast lets the compiler fuse them into one instruction, rounded once
folder = mkpath(joinpath(homedir(), ".pollis", "mix", "callback"))
source_file = joinpath(folder, "fractal.c")
write(source_file, source)
fma_flags(contract) = contract == "fast" && Sys.ARCH === :x86_64 ? ["-mfma"] : String[]  # x86-64 has fused instructions only when told
build_command(contract, library) = `$compiler -O2 -shared -fPIC -ffp-contract=$contract $(fma_flags(contract)) -o $library $source_file`
function build(contract)
    library = joinpath(folder, "fractal-$contract-$(string(hash(source), base = 16)).$(Libdl.dlext)")  # a new name for a new source: a library already loaded is not loaded again
    isfile(library) || run(build_command(contract, library))
    return library
end
built_with = build_command("off", build("off"))

# The callback: @cfunction compiles escape_time for these C types and gives the address C calls. c comes in as
# arguments, so no closure is needed: @cfunction with $ closes over a value, but its result must then be kept alive
escape_pointer = @cfunction(escape_time, Int32, (Float64, Float64, Float64, Float64, Int32))

# Call: C fills the Julia matrix, calling back into Julia once for each pixel
function compiled_fill(contract)
    address = Libdl.dlsym(Libdl.dlopen(build(contract)), :fill_counts)
    return counts -> @ccall $address(counts::Ptr{Int32}, size(counts, 1)::Int64, size(counts, 2)::Int64, x0::Float64, y0::Float64, spacing::Float64, julia_set::Int32, real(c)::Float64, imag(c)::Float64, maxiter::Int32, escape_pointer::Ptr{Cvoid})::Cvoid
end
fill_compiled! = compiled_fill("off")
compiled_counts = Matrix{Int32}(undef, height, width)
fill_compiled!(compiled_counts)
language = "C calling Julia"

# Check: the count of every pixel, the C loop with the Julia callback against Julia alone
differ = count(compiled_counts .!= julia_counts)
println(differ == 0 ? "The C loop calling Julia and Julia alone give the same count at all $(length(julia_counts)) pixels" : "The C loop calling Julia and Julia alone differ at $differ of $(length(julia_counts)) pixels")
'''

[[codeBranches]]
model = "embed"
code = '''
# The example: the Mandelbrot set, or the Julia set of c, on a grid of pixels
julia_set = "{{example}}" == "julia"
c = complex({{cre}}, {{cim}})  # the fixed point of the Julia set; the Mandelbrot set does not use it
x0, x1, y0, y1 = julia_set ? (-1.6, 1.6, -1.0, 1.0) : (-2.2, 0.8, -1.2, 1.2)
width = {{width}}
height = round(Int, width * (y1 - y0) / (x1 - x0))
spacing = (x1 - x0) / (width - 1)  # the distance between two pixels, across and down
maxiter = Int32({{maxiter}})

# The Julia file that this session and the C program both include, in ~/.pollis/mix/embed
folder = mkpath(joinpath(homedir(), ".pollis", "mix", "embed"))
julia_file = joinpath(folder, "fractal.jl")
write(julia_file, """
# The iterations of z^2 + c before |z| passes 2, written with real numbers; zr2 + zi2 > 4 is abs2(z) > 4
function escape_time(zr, zi, cr, ci, maxiter)
    for k in 0:maxiter - 1
        zr2 = zr * zr
        zi2 = zi * zi
        zr2 + zi2 > 4.0 && return Int32(k)
        zi = 2.0 * zr * zi + ci
        zr = zr2 - zi2 + cr
    end
    return maxiter
end

# The count of each pixel, column by column, as Julia stores a matrix: row i is the height y, column j the width x
function fill_counts!(counts, x0, y0, spacing, julia_set, cr, ci, maxiter)
    height, width = size(counts)
    for j in 1:width, i in 1:height
        x = x0 + (j - 1) * spacing
        y = y0 + (i - 1) * spacing
        counts[i, j] = julia_set ? escape_time(x, y, cr, ci, maxiter) : escape_time(0.0, 0.0, x, y, maxiter)
    end
    return counts
end

# For the C program: the counts go to memory the program owns, seen from Julia as a matrix without a copy
function fill_counts_at(address::Ptr{Cvoid}, height, width, x0, y0, spacing, julia_set, cr, ci, maxiter)
    counts = unsafe_wrap(Array, Ptr{Int32}(address), (height, width))
    fill_counts!(counts, x0, y0, spacing, julia_set, cr, ci, maxiter)
    return nothing
end
""")
include(julia_file)
julia_counts = fill_counts!(Matrix{Int32}(undef, height, width), x0, y0, spacing, julia_set, real(c), imag(c), maxiter)

# Toolchain: the C compiler on the path, clang or GCC, and the flags of this Julia from julia-config.jl
function find_compiler(names)
    for name in names
        path = Sys.which(name)
        path === nothing || return path
    end
    return nothing
end
compiler = find_compiler(["cc", "gcc", "clang"])
compiler === nothing && error("No C compiler found: on macOS install the Command Line Tools (xcode-select --install); on Linux install gcc; on Windows install MinGW-w64 with its gcc")
config = joinpath(Sys.BINDIR, Base.DATAROOTDIR, "julia", "julia-config.jl")
julia_flags = Base.shell_split(readchomp(`$(Base.julia_cmd()) $config --allflags`))  # the header folder, libjulia and where to find it

# The C program: starts Julia, includes the file, calls fill_counts_at on its own memory and writes the counts to a file
source = """
#include <julia.h>
#include <stdio.h>
#include <stdlib.h>

JULIA_DEFINE_FAST_TLS

int main(int argc, char *argv[]) {
    if (argc != 12) {
        fprintf(stderr, "usage: fractal file.jl counts.bin height width x0 y0 spacing julia_set cr ci maxiter\\n");
        return 1;
    }
    int64_t height = atoll(argv[3]), width = atoll(argv[4]);
    int32_t *counts = malloc(height * width * sizeof(int32_t));

    jl_init();
    jl_call1(jl_get_function(jl_main_module, "include"), jl_cstr_to_string(argv[1]));
    if (jl_exception_occurred()) {
        fprintf(stderr, "include failed: %s\\n", jl_typeof_str(jl_exception_occurred()));
        jl_atexit_hook(1);
        return 1;
    }

    jl_function_t *fill = jl_get_function(jl_main_module, "fill_counts_at");
    jl_value_t **args;
    JL_GC_PUSHARGS(args, 10);
    args[0] = jl_box_voidpointer(counts);
    args[1] = jl_box_int64(height);
    args[2] = jl_box_int64(width);
    args[3] = jl_box_float64(strtod(argv[5], NULL));
    args[4] = jl_box_float64(strtod(argv[6], NULL));
    args[5] = jl_box_float64(strtod(argv[7], NULL));
    args[6] = jl_box_bool(atoi(argv[8]));
    args[7] = jl_box_float64(strtod(argv[9], NULL));
    args[8] = jl_box_float64(strtod(argv[10], NULL));
    args[9] = jl_box_int32(atoi(argv[11]));
    jl_call(fill, args, 10);
    JL_GC_POP();
    if (jl_exception_occurred()) {
        fprintf(stderr, "fill_counts_at failed: %s\\n", jl_typeof_str(jl_exception_occurred()));
        jl_atexit_hook(1);
        return 1;
    }

    FILE *out = fopen(argv[2], "wb");
    fwrite(counts, sizeof(int32_t), height * width, out);
    fclose(out);
    free(counts);
    jl_atexit_hook(0);
    return 0;
}
"""

# Build: the program in ~/.pollis/mix/embed, compiled and linked against libjulia
source_file = joinpath(folder, "fractal.c")
write(source_file, source)
program = joinpath(folder, "fractal-$(string(hash(source), base = 16))" * (Sys.iswindows() ? ".exe" : ""))
built_with = `$compiler $source_file -o $program $julia_flags`
isfile(program) || run(built_with)

# Run: the numbers as repr writes them, which strtod reads back to the same Float64. On Windows the program finds
# libjulia on the path
counts_file = joinpath(folder, "counts.bin")
command = `$program $julia_file $counts_file $height $width $(repr(x0)) $(repr(y0)) $(repr(spacing)) $(Int(julia_set)) $(repr(real(c))) $(repr(imag(c))) $maxiter`
command = Sys.iswindows() ? addenv(command, "PATH" => Sys.BINDIR * ";" * get(ENV, "PATH", "")) : command
run(command)
compiled_counts = read!(counts_file, Matrix{Int32}(undef, height, width))
language = "C starting Julia"

# Check: the count of every pixel, the program's Julia against this session's
differ = count(compiled_counts .!= julia_counts)
println(differ == 0 ? "The program and this session give the same count at all $(length(julia_counts)) pixels" : "The program and this session differ at $differ of $(length(julia_counts)) pixels")
'''

