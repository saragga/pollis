source = """
#include <stdint.h>

typedef int32_t (*escape_function)(double zr, double zi, double cr, double ci, int32_t maxiter);

void fill_counts(int32_t *counts, int64_t height, int64_t width, double x0, double y0, double spacing,
                 int32_t julia_set, double cr, double ci, int32_t maxiter, escape_function escape) {
