julia_counts = fill_counts!(Matrix{Int32}(undef, height, width), x0, y0, spacing, julia_set, real(c), imag(c), maxiter)

# Toolchain: the C++ compiler on the path, clang++ or g++
function find_compiler(names)
    for name in names
        path = Sys.which(name)
        path === nothing || return path
    end
    return nothing
end
compiler = find_compiler(["c++", "g++", "clang++"])
compiler === nothing && error("No C++ compiler found: on macOS install the Command Line Tools (xcode-select --install); on Linux install g++; on Windows install MinGW-w64 with its g++")

# The same lines in C++. extern "C" keeps the name fill_counts as written: without it, C++ would export a name made
# from the name and the types of the arguments, a mangled name. std::complex<double> holds the real part, then the
# imaginary, as ComplexF64 does, but it is not a C type, so c crosses by pointer
source = """
#include <complex>
#include <cstdint>

static std::int32_t escape_time(double zr, double zi, double cr, double ci, std::int32_t maxiter) {
    for (std::int32_t k = 0; k < maxiter; k++) {
        double zr2 = zr * zr;
        double zi2 = zi * zi;
        if (zr2 + zi2 > 4.0) return k;
        zi = 2.0 * zr * zi + ci;
        zr = zr2 - zi2 + cr;
    }
    return maxiter;
}

extern "C" void fill_counts(std::int32_t *counts, std::int64_t height, std::int64_t width, double x0, double y0,
                            double spacing, std::int32_t julia_set, const std::complex<double> *c, std::int32_t maxiter) {
    const double cr = c->real(), ci = c->imag();
    for (std::int64_t j = 0; j < width; j++) {
        for (std::int64_t i = 0; i < height; i++) {
            double x = x0 + static_cast<double>(j) * spacing;
            double y = y0 + static_cast<double>(i) * spacing;
            counts[i + j * height] = julia_set ? escape_time(x, y, cr, ci, maxiter) : escape_time(0.0, 0.0, x, y, maxiter);
        }
    }
}
"""

# Build: a shared library in ~/.pollis/mix/cpp. -ffp-contract=off keeps a * b + c as a product rounded, then a sum
# rounded, as Julia computes it; fast lets the compiler fuse them into one instruction, rounded once
folder = mkpath(joinpath(homedir(), ".pollis", "mix", "cpp"))
source_file = joinpath(folder, "fractal.cpp")
write(source_file, source)
fma_flags(contract) = contract == "fast" && Sys.ARCH === :x86_64 ? ["-mfma"] : String[]  # x86-64 has fused instructions only when told
build_command(contract, library) = `$compiler -std=c++17 -O2 -shared -fPIC -ffp-contract=$contract $(fma_flags(contract)) -o $library $source_file`
function build(contract)
    library = joinpath(folder, "fractal-$contract-$(string(hash(source), base = 16)).$(Libdl.dlext)")  # a new name for a new source: a library already loaded is not loaded again
    isfile(library) || run(build_command(contract, library))
    return library
end
built_with = build_command("off", build("off"))

# Call: Ref{ComplexF64} passes the address of a copy of c that Julia keeps alive during the call
function compiled_fill(contract)
    address = Libdl.dlsym(Libdl.dlopen(build(contract)), :fill_counts)
    return counts -> @ccall $address(counts::Ptr{Int32}, size(counts, 1)::Int64, size(counts, 2)::Int64, x0::Float64, y0::Float64, spacing::Float64, julia_set::Int32, c::Ref{ComplexF64}, maxiter::Int32)::Cvoid
end
fill_compiled! = compiled_fill("off")
compiled_counts = Matrix{Int32}(undef, height, width)
fill_compiled!(compiled_counts)
language = "C++"

# Check: the count of every pixel, C++ against Julia
differ = count(compiled_counts .!= julia_counts)
println(differ == 0 ? "C++ and Julia give the same count at all $(length(julia_counts)) pixels" : "C++ and Julia differ at $differ of $(length(julia_counts)) pixels")
'''

