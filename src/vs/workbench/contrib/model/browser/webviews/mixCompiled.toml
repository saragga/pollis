# Mix Julia with Compiled Code Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/mixCompiled.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Mix Julia with Compiled Code"
viewType = "pollis.mixCompiled"
defaultModel = "c"
decisionFirstColumn = "Crossing"

[[packages]]
name = "Chairmarks.jl"
github = "https://github.com/LilithHafner/Chairmarks.jl"

[requires]
packages = ["Plots.jl"]

[[wikis]]
name = "Overview"
file = "mixCompiled/overview.md"
bundled = true
description = "The five ways across between Julia and compiled code, the two examples, and the check that every pixel gets the same count"

[[wikis]]
name = "Factsheet"
file = "mixCompiled/factsheet.md"
bundled = true
description = "Tabs, compilers, types across the boundary, inputs, files, names and actions at a glance"

[[wikis]]
name = "Memory Across the Boundary"
file = "mixCompiled/memory-across-the-boundary.md"
bundled = true
description = "Pointers to Julia arrays, the order of a matrix in memory, complex numbers by value and by pointer, and who owns and frees the memory"

[[wikis]]
name = "Callbacks and Embedding"
file = "mixCompiled/callbacks-and-embedding.md"
bundled = true
description = "A Julia function called from C through @cfunction, and a C program that starts Julia, includes a file and calls a function"

[[wikis]]
name = "The Same Result Across Compilers"
file = "mixCompiled/same-result-across-compilers.md"
bundled = true
description = "Why counts of iterations can be checked exactly, fused multiply-add, -ffp-contract, and writing the arithmetic the same in every language"

[[models]]
id = "c"
label = "Call C"

[[models]]
id = "fortran"
label = "Call Fortran"

[[models]]
id = "cpp"
label = "Call C++"

[[models]]
id = "callback"
label = "Julia Callback"

[[models]]
id = "embed"
label = "Julia from C"

[[bullets]]
text = "Five ways across between Julia and compiled code: Julia calls C, Fortran or C++; C calls back a Julia function; a C program starts Julia and calls it"
detail = ""

[[bullets]]
text = "Two examples in every tab: the Mandelbrot set, and the Julia set of a point c, each the number of iterations of z^2 + c before |z| passes 2, for each pixel"
detail = ""

[[bullets]]
text = "The compiled code fills a Julia matrix of counts through a pointer, with nothing copied, and the counts are checked against Julia's pixel by pixel"
detail = ""

[[bullets]]
text = "The arithmetic is written the same in every language and built with -ffp-contract=off, so the counts can agree exactly"
detail = ""

[[decisionRows]]
task = "Call C"
context = "Plain functions"
purpose = "The simplest crossing: a C function with C types, called with @ccall, filling a Julia matrix through a pointer to its first element"

[[decisionRows]]
task = "Call Fortran"
context = "Numerical libraries"
purpose = "A Fortran subroutine with bind(c) and iso_c_binding, which stores a matrix column by column as Julia does and takes c as a complex number by value"

[[decisionRows]]
task = "Call C++"
context = "C++ libraries"
purpose = "C++ behind extern \"C\", which keeps the name as written; c crosses as a std::complex<double>, by pointer, since std::complex is not a C type"

[[decisionRows]]
task = "Julia Callback"
context = "Julia inside a loop"
purpose = "The loop over the pixels in C, calling a Julia function for each pixel through a pointer that @cfunction makes"

[[decisionRows]]
task = "Julia from C"
context = "Julia inside a program"
purpose = "A C program that starts Julia, includes a Julia file and calls a function of it, which fills memory the program owns"

[[inputs]]
id = "example"
label = "Example"
tooltip = "The Mandelbrot set starts z at 0 and puts c at the pixel; the Julia set of c starts z at the pixel and keeps c fixed."
kind = "tabs"
default = "mandelbrot"

[[inputs.options]]
value = "mandelbrot"
label = "Mandelbrot Set"

[[inputs.options]]
value = "julia"
label = "Julia Set"

[[inputs]]
id = "width"
label = "Pixels Across"
tooltip = "The number of pixels across the picture; the number down follows from the shape of the region drawn, with square pixels."
default = "800"

[[inputs]]
id = "maxiter"
label = "Iterations"
tooltip = "The most iterations of z^2 + c for a pixel; a pixel that has not escaped by then counts as inside the set."
default = "256"

[[inputs]]
id = "cre"
label = "Real Part of c"
tooltip = "The real part of the fixed point c of the Julia set. The Mandelbrot set does not use it."
default = "-0.8"

[[inputs]]
id = "cim"
label = "Imaginary Part of c"
tooltip = "The imaginary part of the fixed point c of the Julia set. The Mandelbrot set does not use it."
default = "0.156"

[[codeBranches]]
model = "c"
code = '''
using Libdl

# The example: the Mandelbrot set, or the Julia set of c, on a grid of pixels
julia_set = "{{example}}" == "julia"
c = complex({{cre}}, {{cim}})  # the fixed point of the Julia set; the Mandelbrot set does not use it
x0, x1, y0, y1 = julia_set ? (-1.6, 1.6, -1.0, 1.0) : (-2.2, 0.8, -1.2, 1.2)
width = {{width}}
height = round(Int, width * (y1 - y0) / (x1 - x0))
spacing = (x1 - x0) / (width - 1)  # the distance between two pixels, across and down
maxiter = Int32({{maxiter}})

# Julia: the iterations of z^2 + c before |z| passes 2, written with real numbers so that every language makes the
# same operations in the same order; zr2 + zi2 > 4 is abs2(z) > 4, with no square root
function escape_time(zr, zi, cr, ci, maxiter)
    for k in 0:maxiter - 1
        zr2 = zr * zr
        zi2 = zi * zi
        zr2 + zi2 > 4.0 && return Int32(k)
        zi = 2.0 * zr * zi + ci
        zr = zr2 - zi2 + cr
    end
    return maxiter
end

# The count of each pixel, column by column, as Julia stores a matrix: row i is the height y, column j the width x
function fill_counts!(counts, x0, y0, spacing, julia_set, cr, ci, maxiter)
    height, width = size(counts)
    for j in 1:width, i in 1:height
        x = x0 + (j - 1) * spacing
        y = y0 + (i - 1) * spacing
        counts[i, j] = julia_set ? escape_time(x, y, cr, ci, maxiter) : escape_time(0.0, 0.0, x, y, maxiter)
    end
    return counts
end
julia_counts = fill_counts!(Matrix{Int32}(undef, height, width), x0, y0, spacing, julia_set, real(c), imag(c), maxiter)

# Toolchain: the C compiler on the path, clang or GCC
function find_compiler(names)
    for name in names
        path = Sys.which(name)
        path === nothing || return path
    end
    return nothing
end
compiler = find_compiler(["cc", "gcc", "clang"])
compiler === nothing && error("No C compiler found: on macOS install the Command Line Tools (xcode-select --install); on Linux install gcc; on Windows install MinGW-w64 with its gcc")

# The same lines in C. The matrix arrives as a pointer to its first value: pixel (i, j) is counts[i + j * height]
source = """
#include <stdint.h>

static int32_t escape_time(double zr, double zi, double cr, double ci, int32_t maxiter) {
    for (int32_t k = 0; k < maxiter; k++) {
        double zr2 = zr * zr;
        double zi2 = zi * zi;
        if (zr2 + zi2 > 4.0) return k;
        zi = 2.0 * zr * zi + ci;
        zr = zr2 - zi2 + cr;
    }
    return maxiter;
}

void fill_counts(int32_t *counts, int64_t height, int64_t width, double x0, double y0, double spacing,
                 int32_t julia_set, double cr, double ci, int32_t maxiter) {
    for (int64_t j = 0; j < width; j++) {
        for (int64_t i = 0; i < height; i++) {
            double x = x0 + (double)j * spacing;
            double y = y0 + (double)i * spacing;
            counts[i + j * height] = julia_set ? escape_time(x, y, cr, ci, maxiter) : escape_time(0.0, 0.0, x, y, maxiter);
        }
    }
}
"""

# Build: a shared library in ~/.pollis/mix/c. -ffp-contract=off keeps a * b + c as a product rounded, then a sum
# rounded, as Julia computes it; fast lets the compiler fuse them into one instruction, rounded once
folder = mkpath(joinpath(homedir(), ".pollis", "mix", "c"))
source_file = joinpath(folder, "fractal.c")
write(source_file, source)
fma_flags(contract) = contract == "fast" && Sys.ARCH === :x86_64 ? ["-mfma"] : String[]  # x86-64 has fused instructions only when told
build_command(contract, library) = `$compiler -O2 -shared -fPIC -ffp-contract=$contract $(fma_flags(contract)) -o $library $source_file`
function build(contract)
    library = joinpath(folder, "fractal-$contract-$(string(hash(source), base = 16)).$(Libdl.dlext)")  # a new name for a new source: a library already loaded is not loaded again
    isfile(library) || run(build_command(contract, library))
    return library
end
built_with = build_command("off", build("off"))

# Call: the C function fills a Julia matrix through a pointer to its first value, nothing copied
function compiled_fill(contract)
    address = Libdl.dlsym(Libdl.dlopen(build(contract)), :fill_counts)
    return counts -> @ccall $address(counts::Ptr{Int32}, size(counts, 1)::Int64, size(counts, 2)::Int64, x0::Float64, y0::Float64, spacing::Float64, julia_set::Int32, real(c)::Float64, imag(c)::Float64, maxiter::Int32)::Cvoid
end
fill_compiled! = compiled_fill("off")
compiled_counts = Matrix{Int32}(undef, height, width)
fill_compiled!(compiled_counts)
language = "C"

# Check: the count of every pixel, C against Julia
differ = count(compiled_counts .!= julia_counts)
println(differ == 0 ? "C and Julia give the same count at all $(length(julia_counts)) pixels" : "C and Julia differ at $differ of $(length(julia_counts)) pixels")
'''

[[codeBranches]]
model = "fortran"
code = '''
using Libdl

# The example: the Mandelbrot set, or the Julia set of c, on a grid of pixels
julia_set = "{{example}}" == "julia"
c = complex({{cre}}, {{cim}})  # the fixed point of the Julia set; the Mandelbrot set does not use it
x0, x1, y0, y1 = julia_set ? (-1.6, 1.6, -1.0, 1.0) : (-2.2, 0.8, -1.2, 1.2)
width = {{width}}
height = round(Int, width * (y1 - y0) / (x1 - x0))
spacing = (x1 - x0) / (width - 1)  # the distance between two pixels, across and down
maxiter = Int32({{maxiter}})

# Julia: the iterations of z^2 + c before |z| passes 2, written with real numbers so that every language makes the
# same operations in the same order; zr2 + zi2 > 4 is abs2(z) > 4, with no square root
function escape_time(zr, zi, cr, ci, maxiter)
    for k in 0:maxiter - 1
        zr2 = zr * zr
        zi2 = zi * zi
        zr2 + zi2 > 4.0 && return Int32(k)
        zi = 2.0 * zr * zi + ci
        zr = zr2 - zi2 + cr
    end
    return maxiter
end

# The count of each pixel, column by column, as Julia stores a matrix: row i is the height y, column j the width x
function fill_counts!(counts, x0, y0, spacing, julia_set, cr, ci, maxiter)
    height, width = size(counts)
    for j in 1:width, i in 1:height
        x = x0 + (j - 1) * spacing
        y = y0 + (i - 1) * spacing
        counts[i, j] = julia_set ? escape_time(x, y, cr, ci, maxiter) : escape_time(0.0, 0.0, x, y, maxiter)
    end
    return counts
end
julia_counts = fill_counts!(Matrix{Int32}(undef, height, width), x0, y0, spacing, julia_set, real(c), imag(c), maxiter)

# Toolchain: gfortran on the path
compiler = something(Sys.which("gfortran"), Some(nothing))
compiler === nothing && error("No gfortran found: on macOS install it with Homebrew (brew install gcc); on Linux install gfortran; on Windows install MinGW-w64 with its gfortran")

# The same lines in Fortran. bind(c) gives the subroutine a C name and C arguments; Fortran keeps a matrix column by
# column, as Julia does, so counts(i, j) is the pixel counts[i, j] of Julia. c arrives as a complex number, by value
source = """
module fractal
    use iso_c_binding
    implicit none
contains
    pure function escape_time(zr0, zi0, cr, ci, maxiter) result(k)
        real(c_double), intent(in) :: zr0, zi0, cr, ci
        integer(c_int32_t), intent(in) :: maxiter
        integer(c_int32_t) :: k
        real(c_double) :: zr, zi, zr2, zi2
        zr = zr0
        zi = zi0
        do k = 0, maxiter - 1
            zr2 = zr * zr
            zi2 = zi * zi
            if (zr2 + zi2 > 4.0_c_double) return
            zi = 2.0_c_double * zr * zi + ci
            zr = zr2 - zi2 + cr
        end do
        k = maxiter
    end function escape_time

    subroutine fill_counts(counts, height, width, x0, y0, spacing, julia_set, c, maxiter) bind(c, name = "fill_counts")
        integer(c_int64_t), value :: height, width
        integer(c_int32_t), intent(out) :: counts(height, width)
        real(c_double), value :: x0, y0, spacing
        integer(c_int32_t), value :: julia_set, maxiter
        complex(c_double_complex), value :: c
        integer(c_int64_t) :: i, j
        real(c_double) :: x, y
        do j = 1, width
            do i = 1, height
                x = x0 + real(j - 1, c_double) * spacing
                y = y0 + real(i - 1, c_double) * spacing
                if (julia_set /= 0) then
                    counts(i, j) = escape_time(x, y, real(c), aimag(c), maxiter)
                else
                    counts(i, j) = escape_time(0.0_c_double, 0.0_c_double, x, y, maxiter)
                end if
            end do
        end do
    end subroutine fill_counts
end module fractal
"""

# Build: a shared library in ~/.pollis/mix/fortran, with the module file there too (-J). -ffp-contract=off keeps
# a * b + c as a product rounded, then a sum rounded, as Julia computes it; fast lets gfortran fuse them
folder = mkpath(joinpath(homedir(), ".pollis", "mix", "fortran"))
source_file = joinpath(folder, "fractal.f90")
write(source_file, source)
fma_flags(contract) = contract == "fast" && Sys.ARCH === :x86_64 ? ["-mfma"] : String[]  # x86-64 has fused instructions only when told
build_command(contract, library) = `$compiler -O2 -shared -fPIC -ffp-contract=$contract $(fma_flags(contract)) -J$folder -o $library $source_file`
function build(contract)
    library = joinpath(folder, "fractal-$contract-$(string(hash(source), base = 16)).$(Libdl.dlext)")  # a new name for a new source: a library already loaded is not loaded again
    isfile(library) || run(build_command(contract, library))
    return library
end
built_with = build_command("off", build("off"))

# Call: ComplexF64 of Julia is complex(c_double_complex) of Fortran, so c crosses by value as one argument
function compiled_fill(contract)
    address = Libdl.dlsym(Libdl.dlopen(build(contract)), :fill_counts)
    return counts -> @ccall $address(counts::Ptr{Int32}, size(counts, 1)::Int64, size(counts, 2)::Int64, x0::Float64, y0::Float64, spacing::Float64, julia_set::Int32, c::ComplexF64, maxiter::Int32)::Cvoid
end
fill_compiled! = compiled_fill("off")
compiled_counts = Matrix{Int32}(undef, height, width)
fill_compiled!(compiled_counts)
language = "Fortran"

# Check: the count of every pixel, Fortran against Julia
differ = count(compiled_counts .!= julia_counts)
println(differ == 0 ? "Fortran and Julia give the same count at all $(length(julia_counts)) pixels" : "Fortran and Julia differ at $differ of $(length(julia_counts)) pixels")
'''

