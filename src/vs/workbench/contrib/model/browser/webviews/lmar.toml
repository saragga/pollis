[miniCharts.beach]
# Log-likelihood peak in rho
svg = '''
var d = '';
for (var i = 0; i <= 46; i++) { var r = (i - 28) / 10; d += (i ? 'L' : 'M') + (4 + i) + ',' + (66 - 38 * Math.exp(-r * r)).toFixed(1); }
return '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.5"/>'
	+ '<line x1="32" y1="28" x2="32" y2="66" stroke="currentColor" stroke-width="1" stroke-dasharray="3,2"/>';
'''

[[codeBranches]]
model = "pw2step"
code = '''
using HARE, GLM

yv = Float64.({{y}})
Xm = reshape(Float64.({{X}}), length(yv), :)  # regressors without a constant: HARE adds the intercept
estimate(X, y) = two_step_prais_winsten(X, y)  # rho from OLS residuals, then GLS keeping the first observation
result = estimate(Xm, yv)
'''

[[codeBranches]]
model = "pwiter"
code = '''
using HARE, GLM

yv = Float64.({{y}})
Xm = reshape(Float64.({{X}}), length(yv), :)  # regressors without a constant: HARE adds the intercept
estimate(X, y) = iterated_prais_winsten(X, y)  # alternates rho and GLS steps until convergence
result = estimate(Xm, yv)
'''

[[codeBranches]]
model = "hildreth"
code = '''
using HARE, GLM

yv = Float64.({{y}})
Xm = reshape(Float64.({{X}}), length(yv), :)  # regressors without a constant: HARE adds the intercept
estimate(X, y) = hildreth_lu(X, y)  # grid search over rho for the smallest transformed RSS
result = estimate(Xm, yv)
'''

[[codeBranches]]
model = "beach"
code = '''
using HARE, GLM

yv = Float64.({{y}})
Xm = reshape(Float64.({{X}}), length(yv), :)  # regressors without a constant: HARE adds the intercept
estimate(X, y) = beach_mackinnon(X, y)  # exact maximum likelihood for beta and rho
result = estimate(Xm, yv)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "residuals-time"
label = "Residuals over Time"
desc = "Structural residuals y - Xb against the innovations left after removing the AR(1) part: long runs above or below zero are the autocorrelation the model absorbs"
code = '''
using Plots
e = residuals(result)  # structural residuals y - Xb
v = e[2:end] .- result.rho .* e[1:end-1]  # innovations e_t - rho e_(t-1)
Plots.plot(e, lw=1.4, label="residuals y - Xb", xlabel="t", title="rho = $(round(result.rho, digits=3))")
Plots.plot!(2:length(e), v, lw=1, alpha=0.8, label="innovations")
Plots.hline!([0], color=:gray, ls=:dash, label="")
'''

[[actionGroups.actions]]
id = "acf-pacf"
label = "ACF and PACF"
desc = "Autocorrelation and partial autocorrelation of the residuals, and the ACF of the innovations: a single PACF spike at lag 1 and a clean innovation ACF say AR(1) is enough"
code = '''
using StatsBase, Plots
e = residuals(result)
v = e[2:end] .- result.rho .* e[1:end-1]
lags = 1:20
band = 1.96 / sqrt(length(e))  # approximate 95% band under white noise
panel(vals, t) = Plots.hline!(Plots.bar(lags, vals, label="", title=t), [-band, band], ls=:dash, color=:gray, label="")
Plots.plot(panel(autocor(e, lags), "ACF of residuals"), panel(pacf(e, lags), "PACF of residuals"),
           panel(autocor(v, lags), "ACF of innovations"), layout=(3, 1), size=(700, 700))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "serial-tests"
label = "Serial Correlation Tests"
desc = "Durbin-Watson and Breusch-Godfrey tests on the OLS residuals: the evidence that a correction is needed in the first place (Breusch-Godfrey stays valid with lagged dependent variables)"
code = '''
using HypothesisTests
dw = durbin_watson_test(Xm, yv)
bg1 = breusch_godfrey_test(Xm, yv, 1)
bg4 = breusch_godfrey_test(Xm, yv, 4)
(durbin_watson = round(dw.DW, digits=3), dw_p = pvalue(dw), breusch_godfrey_lag1_p = pvalue(bg1), breusch_godfrey_lag4_p = pvalue(bg4),
 reading = dw.DW < 2 ? "DW below 2: positive autocorrelation" : "DW above 2: negative autocorrelation")
'''

[[actionGroups.actions]]
id = "innovation-check"
label = "Is AR(1) Enough?"
desc = "Ljung-Box and Jarque-Bera tests on the innovations after the AR(1) correction, plus Harvey's test for heteroskedasticity: significant results point to a richer error model"
code = '''
using HypothesisTests
e = residuals(result)
v = e[2:end] .- result.rho .* e[1:end-1]
(ljung_box_innovations_p = pvalue(LjungBoxTest(v, 10)), jarque_bera_p = pvalue(JarqueBeraTest(v)),
 harvey_heteroskedasticity_p = pvalue(harvey_test(Xm, yv)),
 hint = "if Harvey is significant, the Heteroskedasticity + AR(1) panel corrects both at once")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "fitted"
label = "One-Step Predictions"
desc = "In-sample fit from the regression alone against the one-step prediction that also uses last period's residual: the AR(1) term is what makes the second one track the data"
code = '''
using Plots, Statistics
b, e = coef(result), residuals(result)
mean_fit = fitted(result)  # X b
one_step = mean_fit[2:end] .+ result.rho .* e[1:end-1]  # X b + rho e_(t-1)
Plots.plot(yv, lw=1.4, label="data", xlabel="t")
Plots.plot!(mean_fit, lw=1, label="X b")
display(Plots.plot!(2:length(yv), one_step, lw=1, ls=:dash, label="X b + rho e_(t-1)"))
(rmse_regression_only = sqrt(mean(abs2, e)), rmse_one_step = sqrt(mean(abs2, yv[2:end] .- one_step)))
'''

[[actionGroups.actions]]
id = "forecast"
label = "Forecast"
desc = "Forecasts for the future regressor rows: the regression part plus the last residual decaying as rho^h, with 95% intervals from the innovation variance (parameter uncertainty ignored)"
code = '''
using Statistics
Xn = reshape(Float64.({{xnew}}), :, size(Xm, 2))
h = size(Xn, 1)
e = residuals(result)
v = e[2:end] .- result.rho .* e[1:end-1]
s2 = sum(abs2, v) / (length(v) - length(coef(result)))  # innovation variance
fc = hcat(ones(h), Xn) * coef(result) .+ result.rho .^ (1:h) .* e[end]
se = sqrt.(s2 .* cumsum(result.rho .^ (2 .* (0:h-1))))
[(step = j, forecast = round(fc[j], digits=4), lower95 = round(fc[j] - 1.96se[j], digits=4), upper95 = round(fc[j] + 1.96se[j], digits=4)) for j in 1:h]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-ols"
label = "Compare with OLS"
desc = "OLS and the corrected estimates side by side: the coefficients are often close, but OLS standard errors are too small under positive autocorrelation"
code = '''
ols = lm(hcat(ones(length(yv)), Xm), yv)
[(term = n, ols = round(a, digits=4), ols_se = round(sa, digits=4), corrected = round(b, digits=4), corrected_se = round(sb, digits=4))
 for (n, a, sa, b, sb) in zip(coefnames(result), coef(ols), stderror(ols), coef(result), stderror(result))]
'''

[[actionGroups.actions]]
id = "all-estimators"
label = "All AR(1) Estimators"
desc = "Prais-Winsten, Cochrane-Orcutt (which drops the first observation), Hildreth-Lu and Beach-MacKinnon on the same data: agreement means the answer does not hinge on the method"
code = '''
ests = [("Prais-Winsten (2-step)", two_step_prais_winsten), ("Prais-Winsten (iterated)", iterated_prais_winsten),
        ("Cochrane-Orcutt (2-step)", two_step_cochrane_orcutt), ("Cochrane-Orcutt (iterated)", iterated_cochrane_orcutt),
        ("Hildreth-Lu", hildreth_lu), ("Beach-MacKinnon", beach_mackinnon)]
fits = [(n, f(Xm, yv)) for (n, f) in ests]
[(estimator = n, rho = round(r.rho, digits=4), coef = round.(coef(r), digits=4), std_error = round.(stderror(r), digits=4)) for (n, r) in fits]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "rho"
label = "Autocorrelation Strength"
desc = "rho with an approximate 95% interval, the half-life of a shock in the errors and the effective sample size: how much independent information the T observations really carry"
code = '''
n, r = length(yv), result.rho
se_rho = sqrt((1 - r^2) / n)  # asymptotic standard error of rho
(rho = round(r, digits=4), ci95 = round.((r - 1.96se_rho, r + 1.96se_rho), digits=4),
 half_life_periods = r > 0 ? round(log(0.5) / log(r), digits=2) : NaN,
 effective_sample_size = round(n * (1 - r) / (1 + r), digits=1), observations = n)
'''

[[actionGroups.actions]]
id = "coefficients"
label = "Coefficients"
desc = "Estimates with GLS standard errors, t statistics, p-values and 95% confidence intervals: each slope is the change in y for a one-unit change in that regressor"
code = '''
ci = confint(result)
[(term = n, estimate = round(b, digits=4), std_error = round(s, digits=4), t = round(t, digits=2), p = round(p, digits=4), lower95 = round(ci[i, 1], digits=4), upper95 = round(ci[i, 2], digits=4))
 for (i, (n, b, s, t, p)) in enumerate(zip(coefnames(result), coef(result), stderror(result), tstat(result), pvalues(result)))]
'''
