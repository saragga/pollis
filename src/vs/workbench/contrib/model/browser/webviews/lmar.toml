var y = [46, 40, 36, 40, 48, 54, 52, 44, 38];
var d = '';
for (var i = 0; i < y.length; i++) { d += (i ? 'L' : 'M') + (6 + i * 5.5) + ',' + y[i]; }
return '<line x1="4" y1="45" x2="50" y2="45" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>'
	+ '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.5"/>'
	+ '<path d="M17,30 Q20,24 23,30" fill="none" stroke="currentColor" stroke-width="1.2"/>';
'''

