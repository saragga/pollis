[[bullets]]
text = "Prais-Winsten (Two-Step)"
detail = "FGLS preserving the first observation; single-pass estimate of rho from OLS residuals"

[[bullets]]
text = "Prais-Winsten (Iterated)"
detail = "cycles between rho estimation and GLS until convergence; more efficient in small samples"

[[bullets]]
text = "Hildreth-Lu"
detail = "grid search over rho ∈ (−1, 1) minimising the sum of squared residuals; robust to poor starting values"

[[bullets]]
text = "Beach-MacKinnon"
detail = "exact MLE for beta and rho jointly; asymptotically efficient with exact likelihood"

[[decisionRows]]
task = "Prais-Winsten (2-Step)"
context = "Time-series regression whose OLS residuals fail the Durbin-Watson test; moderate or large sample"
purpose = "Estimates rho from the OLS residuals once, then runs GLS on the quasi-differenced data, keeping the first observation"

[[decisionRows]]
task = "Prais-Winsten (Iterated)"
context = "Small samples, or when the two-step rho looks unstable"
purpose = "Repeats the rho and GLS steps until both settle; usually closer to the maximum-likelihood answer"

[[decisionRows]]
task = "Hildreth-Lu"
context = "Strong autocorrelation or a suspected local optimum in the iterative methods"
purpose = "Grid search over rho in (-1, 1) for the smallest transformed residual sum of squares: a global answer"

[[decisionRows]]
task = "Beach-MacKinnon"
context = "When a likelihood is needed (tests, information criteria) or rho may be close to 1"
purpose = "Exact maximum likelihood for beta and rho jointly; the likelihood keeps rho strictly inside the unit circle"

[[inputs]]
id = "X"
label = "Regressors (X)"
tooltip = "Matrix of regressors (T x k), rows ordered in time. Do not add a column of ones: HARE adds the intercept itself."
default = "X"

[[inputs]]
id = "y"
label = "Response (y)"
tooltip = "Vector of the dependent variable (length T), ordered in time."
default = "y"

[[inputs]]
id = "xnew"
label = "Future regressors"
tooltip = "Rows of regressor values for the forecast periods, one row per step. The default reuses the last 5 rows as a placeholder: replace it with the real future values."
default = "Xm[end-4:end, :]"
newRow = true

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

