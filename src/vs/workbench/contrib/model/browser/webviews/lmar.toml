[miniCharts.hildreth]
# Residual sum of squares over a grid of rho with its minimum marked
svg = '''
var d = '', s = '';
for (var i = 0; i <= 10; i++) { var x = 6 + i * 4.2, r = (i - 6.5) / 4; var y = (32 + 26 * r * r).toFixed(1); d += (i ? 'L' : 'M') + x + ',' + y; s += '<circle cx="' + x + '" cy="' + y + '" r="1.2" fill="currentColor"/>'; }
return '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1"/>' + s
