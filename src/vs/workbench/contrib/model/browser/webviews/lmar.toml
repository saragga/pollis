# Linear Models with Autocorrelation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/lmar.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Linear Models with Autocorrelation"
viewType = "pollis.lmar"
defaultModel = "pw2step"

[[packages]]
name = "HARE.jl"
github = "https://github.com/Trumpingtons/HARE.jl"

[[packages.videos]]
title = "Julia in Academia"
description = "Overview of Julia for academic and scientific computing"
url = "https://www.youtube.com/watch?v=wPFPT-Ech2c"

[requires]
packages = ["GLM.jl", "Plots.jl", "StatsBase.jl", "HypothesisTests.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Prais-Winsten (Two-Step)"
file = "lm-ar1/tutorial-01-pw-twostep.ipynb"
bundled = true
description = "Two-step Prais-Winsten FGLS: estimate rho from OLS residuals, then apply GLS transformation preserving the first observation"

[[notebookSections.notebooks]]
name = "Prais-Winsten (Iterated)"
file = "lm-ar1/tutorial-02-pw-iterated.ipynb"
bundled = true
description = "Iterated Prais-Winsten: cycle between rho estimation and GLS until convergence"

[[notebookSections.notebooks]]
name = "Hildreth-Lu"
file = "lm-ar1/tutorial-03-hildreth-lu.ipynb"
bundled = true
description = "Hildreth-Lu grid search over rho in (-1, 1) minimising the sum of squared residuals"

[[notebookSections.notebooks]]
name = "Beach-MacKinnon (MLE)"
file = "lm-ar1/tutorial-04-beach-mackinnon.ipynb"
bundled = true
description = "Beach-MacKinnon exact MLE: joint estimation of beta and rho for asymptotically efficient inference"

