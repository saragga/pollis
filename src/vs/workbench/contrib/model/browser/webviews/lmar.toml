# Circular arrows: rho and beta updated until convergence
svg = '''
return '<path d="M16,40 A11,11 0 0 1 38,40" fill="none" stroke="currentColor" stroke-width="1.5"/>'
	+ '<path d="M38,48 A11,11 0 0 1 16,48" fill="none" stroke="currentColor" stroke-width="1.5"/>'
	+ '<path d="M35,36 L38,41 L41,36" fill="none" stroke="currentColor" stroke-width="1.5"/>'
	+ '<path d="M19,52 L16,47 L13,52" fill="none" stroke="currentColor" stroke-width="1.5"/>';
