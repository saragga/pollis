'''

[[actionGroups.actions]]
id = "aic-bic"
label = "Poisson vs Hawkes"
desc = "AIC and BIC of the Poisson and Hawkes MLEs on the same events"
code = '''
using PointProcesses
import NetworkHawkesProcesses as NHP

n_ev = length(t_obs)  # all nodes pooled for Network Hawkes
hist = History(; times = sort(t_obs), marks = ones(Int, n_ev), tmin = 0.0, tmax = Float64(T))
ll_pois = logdensityof(fit(MultivariatePoissonProcess{Float64}, hist), hist)  # 1 parameter

hawk = NHP.ContinuousStandardHawkesProcess(NHP.HomogeneousProcess([n_ev / T]), NHP.ExponentialImpulseResponse(ones(1, 1)), NHP.DenseWeightModel(fill(0.5, 1, 1)))
ml = NHP.mle!(hawk, (sort(t_obs), ones(Int, n_ev), Float64(T)); guess = [n_ev / (2T), 1.0, 0.5])  # 3 parameters: mu, beta, branching ratio
ll_hawk = ml.maximum  # NetworkHawkesProcesses counts each event's full offspring mass, ignoring truncation at T

for (name, ll, k) in [("Poisson", ll_pois, 1), ("Hawkes", ll_hawk, 3)]
    println(rpad(name, 10), "logL ", rpad(round(ll, digits = 2), 10), "AIC ", rpad(round(-2ll + 2k, digits = 2), 10), "BIC ", round(-2ll + k * log(n_ev), digits = 2))
end
println("Lower is better. No chi-square LR test: under Poisson the branching ratio sits on its boundary (0) and beta is not identified")
'''

