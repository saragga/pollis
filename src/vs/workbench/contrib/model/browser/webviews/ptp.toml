label = "Expected Count"
desc = "Posterior predictive count of events in (T, T + h]"
code = '''
using Statistics, Distributions

h_fc = 50  # forecast horizon
{{?model=inhomogeneous|cox|network}}println("No conditional simulator: forward simulation is available for the Poisson and Hawkes models")
{{?model=poisson}}counts = [rand(Poisson(rand(Gamma(n + 1, 1 / T)) * h_fc)) for _ in 1:4000]  # rate from its posterior (flat prior), then events
{{?model=hawkes}}i_draw = rand(eachindex(mu_draws), 1000)  # one posterior draw per simulated path
{{?model=hawkes}}counts = [length(HP.simulate_forward(t_obs, h_fc, T, mu_draws[i], kappa_draws[i], Exponential(1 / beta_draws[i]))) for i in i_draw]
{{?model=poisson|hawkes}}println("E[N(T, T + h) | history] = ", round(mean(counts), digits = 2), " (Monte Carlo error ", round(std(counts) / sqrt(length(counts)), digits = 2), ")")
{{?model=poisson|hawkes}}println("90% predictive interval: ", quantile(counts, [0.05, 0.95]))
'''

