# Point Processes Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/ptp.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Point Processes"
viewType = "pollis.ptp"
defaultModel = "poisson"

[[packages]]
name = "PointProcesses.jl"
github = "https://github.com/JoseKling/PointProcesses.jl"

[[packages]]
name = "HawkesProcesses.jl"
github = "https://github.com/dm13450/HawkesProcesses.jl"

[[packages]]
name = "NetworkHawkesProcesses.jl"
github = "https://github.com/cswaney/NetworkHawkesProcesses.jl"

[requires]
packages = ["PointProcesses.jl", "HawkesProcesses.jl", "NetworkHawkesProcesses.jl"]

