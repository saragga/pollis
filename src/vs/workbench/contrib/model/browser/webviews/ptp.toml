label = "Intensity Function"
desc = "Plot the fitted intensity lambda(t) over [0, T]"
code = '''
using Plots

ts = collect(range(0, T, length = 1000))  # Hawkes intensities jump at each event
{{?model!=network}}plot(ts, lam.(ts); xlabel = "t", ylabel = "lambda(t)", label = "fitted")
{{?model=cox}}plot!(x_grid, lam_lo; fillrange = lam_hi, fillalpha = 0.2, linewidth = 0, label = "95% band (baseline)")
{{?model!=network}}@isdefined(lam_true) && plot!(ts, lam_true.(ts); linestyle = :dash, label = "true")
{{?model=network}}plot(ts, transpose(reduce(hcat, lam.(ts))); xlabel = "t", ylabel = "lambda_n(t)", label = permutedims(["node $n" for n in 1:N]))
