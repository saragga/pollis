[[actionGroups.actions]]
id = "time-rescaling"
label = "Time-Rescaling Test"
desc = "Rescale gaps by the fitted compensator; KS test against Exp(1)"
code = '''
using HypothesisTests, Distributions

{{?model!=network}}tau = [Lam(a, b) for (a, b) in zip([0.0; t_obs[1:(end - 1)]], t_obs)]  # compensator between events: iid Exp(1) under the model
{{?model=network}}tau = reduce(vcat, [[Lam(a, b)[n] for (a, b) in zip([0.0; tn[1:(end - 1)]], tn)] for (n, tn) in enumerate(node_times)])  # per node, pooled
z = 1 .- exp.(-tau)  # Uniform(0, 1) under the model

println(ExactOneSampleKSTest(z, Uniform()))
println("The model was fitted to these events, so the test rejects less often than its nominal level: treat a large p-value as weak evidence of fit")
'''

[[actionGroups.actions]]
id = "qq-plot"
label = "Q-Q Plot"
desc = "Rescaled inter-event times against Exp(1) quantiles"
code = '''
using Plots, Distributions

{{?model!=network}}tau = [Lam(a, b) for (a, b) in zip([0.0; t_obs[1:(end - 1)]], t_obs)]  # iid Exp(1) under the model
{{?model=network}}tau = reduce(vcat, [[Lam(a, b)[n] for (a, b) in zip([0.0; tn[1:(end - 1)]], tn)] for (n, tn) in enumerate(node_times)])  # per node, pooled
m = length(tau)
q = quantile.(Exponential(1), ((1:m) .- 0.5) ./ m)  # theoretical quantiles

scatter(q, sort(tau); xlabel = "Exp(1) quantiles", ylabel = "rescaled gaps", legend = false)
plot!(identity, 0, maximum(q); linestyle = :dash)  # points above the line at the right: unexplained clustering
'''

[[actionGroups.actions]]
id = "branching-ratio"
label = "Branching Ratio"
desc = "Posterior stationarity check: kappa < 1, or spectral radius < 1"
code = '''
{{?model=hawkes}}println("kappa = alpha/beta: mean ", round(mean(kappa_draws), digits = 3), ", 95% interval ", round.(quantile(kappa_draws, [0.025, 0.975]), digits = 3))
{{?model=hawkes}}println("Posterior P(kappa < 1), stationary: ", mean(kappa_draws .< 1))
{{?model=network}}radius = [maximum(abs.(eigvals(A .* W))) for (A, W) in zip(A_draws, W_draws)]  # spectral radius of the effective weights
{{?model=network}}println("Spectral radius: mean ", round(mean(radius), digits = 3), ", 95% interval ", round.(quantile(radius, [0.025, 0.975]), digits = 3))
{{?model=network}}println("Posterior P(radius < 1), stationary: ", mean(radius .< 1))
{{?model=cox}}println("Self-excitation W: mean ", round(mean(W_draws), digits = 3), ", 95% interval ", round.(quantile(W_draws, [0.025, 0.975]), digits = 3), "; near 0 means the Cox intensity alone explains the clustering")
{{?model=poisson|inhomogeneous}}println("This model has no self-excitation: its branching ratio is 0. Fit the Hawkes model to estimate one.")
'''

