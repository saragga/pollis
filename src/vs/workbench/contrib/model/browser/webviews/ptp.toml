[[actionGroups.actions]]
id = "next-event"
label = "Next Event Time"
desc = "Distribution of the wait to the next event after T"
code = '''
using QuadGK, Plots

{{?model=inhomogeneous|cox}}println("No forecast: this fit describes lambda(t) only on [0, T]")
{{?model=poisson|hawkes|network}}s_grid = collect(range(0, 10T / length(t_obs), length = 200))  # waits up to 10 mean gaps
{{?model=poisson|hawkes}}F = [1 - exp(-quadgk(lam, T, T + s)[1]) for s in s_grid]  # P(next event by T + s); no new event before it, so the history is fixed
{{?model=network}}F = [1 - exp(-sum(quadgk(lam, T, T + s)[1])) for s in s_grid]  # next event on any node
{{?model=poisson|hawkes|network}}println("Median wait to the next event: ", round(s_grid[findfirst(F .>= 0.5)], digits = 3))
{{?model=poisson|hawkes|network}}plot(s_grid, F; xlabel = "s", ylabel = "P(next event by T + s)", legend = false)
'''

