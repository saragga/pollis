[[models]]
id = "poisson"
label = "Poisson"

[[models]]
id = "inhomogeneous"
label = "Inhomogeneous"

[[models]]
id = "cox"
label = "Cox"

[[models]]
id = "hawkes"
label = "Hawkes"

[[models]]
id = "network"
label = "Network Hawkes"

[[bullets]]
text = "Homogeneous Poisson"
detail = "constant rate lambda; fit(MultivariatePoissonProcess{Float64}, history) from PointProcesses.jl gives the MLE N/T, with an exact (Garwood) interval"

[[bullets]]
text = "Inhomogeneous Poisson"
detail = "time-varying rate lambda(t), estimated without a parametric form by a KernelDensity.jl kernel estimate with Diggle's edge correction"

[[bullets]]
text = "Cox"
detail = "doubly stochastic Poisson: log lambda(t) is a Gaussian process; NetworkHawkesProcesses.jl samples the posterior path by elliptical slice sampling, alongside a self-excitation weight that should stay near 0 for Cox data"

[[bullets]]
text = "Hawkes"
detail = "self-exciting: lambda(t) = mu + alpha sum over t_i < t of exp(-beta(t - t_i)); HawkesProcesses.jl samples (mu, kappa = alpha/beta, beta) by Gibbs sampling with latent parents; kappa < 1 for stationarity"

[[bullets]]
text = "Network Hawkes"
detail = "multivariate Hawkes on a directed network: node m excites node n only if the link A[m, n] = 1; NetworkHawkesProcesses.jl samples the links, weights W, decays and baselines by Gibbs sampling"

[[inputs]]
id = "lambda"
label = "Rate (lambda)"
tooltip = "True event rate of the simulated example (events per unit time). It is used only to simulate the default data; the code then estimates lambda from the events."
default = "0.5"
models = ["poisson"]

[[inputs]]
id = "bw"
label = "Bandwidth (h)"
tooltip = "Standard deviation of the Gaussian smoothing kernel, in time units. Small values follow the events closely and are noisy; large values smooth away real changes in the rate. The simulated example has a rate cycle of length T/2."
default = "5"
models = ["inhomogeneous"]

[[inputs]]
id = "mu0"
label = "Log Baseline (mu0)"
tooltip = "Offset of the log-intensity of the simulated example: lambda(t) = exp(mu0 + y(t)) with y a zero-mean Gaussian process. The fit centres its prior at the log of the observed average rate instead."
default = "0.0"
models = ["cox"]

[[inputs]]
id = "gp-var"
label = "GP Variance (sigma2)"
tooltip = "Variance of the Gaussian process y(t), used both to simulate the example and as the prior for the fit. Larger values allow larger swings in the log-intensity."
default = "1.0"
models = ["cox"]

[[inputs]]
id = "gp-ls"
label = "Length Scale (l)"
tooltip = "Length scale of the Gaussian process kernel, in time units, used both to simulate the example and as the prior for the fit. Larger values give smoother intensity paths."
default = "10.0"
models = ["cox"]

[[inputs]]
id = "kernel"
label = "Kernel"
tooltip = "Covariance kernel of the Gaussian process. Squared exponential gives smooth paths; Ornstein-Uhlenbeck (Matern 1/2) gives rough, continuous paths."
kind = "select"
default = "se"
models = ["cox"]

[[inputs.options]]
value = "se"
label = "Squared Exp."

[[inputs.options]]
value = "ou"
label = "Ornstein-Uhlenbeck"

[[inputs]]
id = "mu"
label = "Baseline (mu)"
tooltip = "True immigrant rate of the simulated example: the part of the intensity that does not depend on past events."
default = "0.3"
models = ["hawkes"]

[[inputs]]
id = "alpha"
label = "Excitation (alpha)"
tooltip = "True jump in intensity after each event in the simulated example. The branching ratio kappa = alpha/beta (expected direct offspring per event) must be below 1."
default = "0.5"
models = ["hawkes"]

[[inputs]]
id = "beta"
label = "Decay (beta)"
tooltip = "True decay rate of the simulated example: the excitation from an event at t_i is alpha * exp(-beta * (t - t_i)). The branching ratio alpha/beta must be below 1."
default = "1.0"
models = ["hawkes"]

[[inputs]]
id = "N"
label = "Nodes (N)"
tooltip = "Number of event streams. In the simulated example each directed link is present with probability 0.5 and has weight 0.6/N, so the process is stable."
default = "3"
models = ["network"]

[[inputs]]
id = "net-mu"
label = "Baseline (mu)"
tooltip = "True immigrant rate of every node in the simulated example."
default = "0.3"
models = ["network"]

[[inputs]]
id = "net-beta"
label = "Decay (beta)"
tooltip = "True decay rate of every link in the simulated example: an event on node m adds W[m, n] * beta * exp(-beta * (t - t_i)) to node n when the link exists."
default = "1.0"
models = ["network"]

[[inputs]]
id = "its"
label = "Gibbs Iterations"
tooltip = "Number of Gibbs sweeps. The first quarter is discarded as burn-in. Increase it if the summaries change when you rerun with another seed."
default = "2000"
models = ["cox", "hawkes", "network"]

[[inputs]]
id = "T"
label = "Time Horizon (T)"
tooltip = "Observation window [0, T]. The events must lie in it, and the likelihood counts the quiet time after the last event."
default = "100"

[[inputs]]
id = "data"
label = "Event Times"
tooltip = "Vector of event times in [0, T]. With the default name events, the code simulates an example from the model with the values above; rename it to use your own data."
default = "events"

[[inputs]]
id = "nodes"
label = "Event Nodes"
tooltip = "Vector giving the node (1 to N) of each event, in the same order as the event times. Simulated with the example when the event times keep the default name."
default = "nodes"
models = ["network"]

[[codeBranches]]
model = "poisson"
code = '''
using Random, Distributions, PointProcesses

Random.seed!(1)
T = Float64({{T}})  # observation window [0, T]
{{?data=events}}events = sort(event_times(rand(MultivariatePoissonProcess([Float64({{lambda}})]), 0.0, T)))  # simulated example; rand returns the times unsorted

t_obs = sort(Float64.({{data}}))
h = History(; times = t_obs, marks = ones(Int, length(t_obs)), tmin = 0.0, tmax = T)  # a single mark: a univariate process
process = fit(MultivariatePoissonProcess{Float64}, h)  # MLE: N / T

n = nb_events(h)
lambda_hat = ground_intensity(process)
ci = (quantile(Chisq(2n), 0.025) / (2T), quantile(Chisq(2n + 2), 0.975) / (2T))  # exact (Garwood) 95% interval

println("Events:       ", n)
println("lambda MLE:   ", round(lambda_hat, digits = 4))
println("95% interval: ", round.(ci, digits = 4))
{{?data=events}}println("True lambda:  ", {{lambda}})

lam(t) = ground_intensity(process)  # fitted intensity at t (constant)
Lam(a, b) = integrated_ground_intensity(process, h, a, b)  # fitted compensator on [a, b)
{{?data=events}}lam_true(t) = {{lambda}}
'''

[[codeBranches]]
model = "inhomogeneous"
code = '''
using Random, Distributions, KernelDensity, QuadGK, PointProcesses

Random.seed!(1)
T = Float64({{T}})  # observation window [0, T]
{{?data=events}}lam_true(t) = 1 + 0.8 * sin(4pi * t / T)  # true intensity: two cycles between 0.2 and 1.8
{{?data=events}}candidates = sort(event_times(rand(MultivariatePoissonProcess([1.8]), 0.0, T)))  # homogeneous Poisson at the bound 1.8
{{?data=events}}events = filter(t -> rand() < lam_true(t) / 1.8, candidates)  # Lewis-Shedler thinning

t_obs = sort(Float64.({{data}}))
n = length(t_obs)
bw = {{bw}}  # kernel standard deviation
dens = InterpKDE(kde(t_obs; bandwidth = bw))  # Gaussian kernel density of the event times

edge(t) = cdf(Normal(t, bw), T) - cdf(Normal(t, bw), 0)  # share of the kernel at t that falls inside [0, T]
lam(t) = n * pdf(dens, t) / edge(t)  # Diggle (1985) edge-corrected intensity: no dip at 0 and T
Lam(a, b) = quadgk(lam, a, b)[1]  # fitted compensator on [a, b]

println("Events: ", n, "   average rate: ", round(n / T, digits = 4))
for t in range(0, T, length = 9)
    println("t = ", rpad(round(t, digits = 1), 8), "lambda_hat = ", rpad(round(lam(t), digits = 3), 8), @isdefined(lam_true) ? "true = $(round(lam_true(t), digits = 3))" : "")
end
'''

[[codeBranches]]
model = "cox"
code = '''
using Random, Statistics, Distributions, QuadGK
import NetworkHawkesProcesses as NHP

Random.seed!(1)
T = Float64({{T}})  # observation window [0, T]
G = 50  # grid intervals for the latent Gaussian process
{{?kernel=se}}gp = NHP.GaussianProcess(NHP.SquaredExponentialKernel(sqrt({{gp-var}}), {{gp-ls}}))  # (sigma, length scale)
{{?kernel=ou}}gp = NHP.GaussianProcess(NHP.OrnsteinUhlenbeckKernel(sqrt({{gp-var}}), {{gp-ls}}))  # (sigma, length scale)
{{?data=events}}truth = NHP.LogGaussianCoxProcess(gp, {{mu0}}, T, G, 1)  # one draw of lambda(t) = exp(mu0 + y(t)) on G + 1 grid points
{{?data=events}}events = sort(rand(truth, 1, T))  # Poisson events given the drawn intensity
{{?data=events}}lam_true(t) = NHP.intensity(truth, 1, t)

t_obs = sort(Float64.({{data}}))
data = (t_obs, ones(Int, length(t_obs)), T)  # (times, node of each event, duration)
m_hat = log(length(t_obs) / T)  # prior centre of log lambda: the observed average rate

# Cox baseline plus a self-excitation weight W: for Cox data, W's posterior should sit near 0
process = NHP.ContinuousStandardHawkesProcess(NHP.LogGaussianCoxProcess(gp, m_hat, T, G, 1), NHP.ExponentialImpulseResponse(ones(1, 1)), NHP.DenseWeightModel(fill(0.1, 1, 1)))
its = {{its}}
res = NHP.mcmc!(process, data; nsteps = its)  # Gibbs: parents, GP path (elliptical slice), decay, weight
draws = res.samples[(div(its, 4) + 1):end]  # drop the first quarter as burn-in

x_grid = collect(range(0.0, T, length = G + 1))
lam_draws = reduce(hcat, [s[1:(G + 1)] for s in draws])  # baseline intensity on the grid, one column per draw
lam_mean = vec(mean(lam_draws; dims = 2))
lam_lo = [quantile(r, 0.025) for r in eachrow(lam_draws)]
lam_hi = [quantile(r, 0.975) for r in eachrow(lam_draws)]
W_draws = [s[G + 3] for s in draws]

println("Events: ", length(t_obs))
println("Self-excitation W: mean ", round(mean(W_draws), digits = 3), ", 95% interval ", round.(quantile(W_draws, [0.025, 0.975]), digits = 3))
{{?data=events}}println("Correlation of the posterior mean with the true intensity on the grid: ", round(cor(lam_mean, lam_true.(x_grid)), digits = 3))

NHP.params!(process, mean(draws))  # posterior-mean plug-in
lam(t) = only(NHP.intensity(process, data, t))  # fitted conditional intensity at t
Lam(a, b) = quadgk(lam, a, filter(s -> a < s < b, t_obs)..., b)[1]  # fitted compensator, split at the jumps
'''

[[codeBranches]]
model = "hawkes"
code = '''
using Random, Statistics, Distributions
import HawkesProcesses as HP

Random.seed!(1)
T = Float64({{T}})  # observation window [0, T]
{{?data=events}}events = HP.simulate({{mu}}, {{alpha}} / {{beta}}, Exponential(1 / {{beta}}), T)  # simulated example: (mu, kappa, kernel)

t_obs = sort(Float64.({{data}}))  # event times must be distinct
its = {{its}}
mu_draws, kappa_draws, beta_draws = HP.fit(t_obs, T, its)  # Gibbs sampler with latent parents
keep = (div(its, 4) + 1):its  # drop the first quarter as burn-in
mu_draws, kappa_draws, beta_draws = mu_draws[keep], kappa_draws[keep], beta_draws[keep]
alpha_draws = kappa_draws .* beta_draws  # HawkesProcesses writes alpha * exp(-beta s) as kappa * beta * exp(-beta s)

println("Events: ", length(t_obs))
for (name, d) in [("mu", mu_draws), ("alpha", alpha_draws), ("beta", beta_draws), ("kappa = alpha/beta", kappa_draws)]
    println(rpad(name, 20), "mean ", rpad(round(mean(d), digits = 3), 8), "95% interval ", round.(quantile(d, [0.025, 0.975]), digits = 3))
end
{{?data=events}}println("True values: mu = ", {{mu}}, ", alpha = ", {{alpha}}, ", beta = ", {{beta}}, ", kappa = ", {{alpha}} / {{beta}})

mu_hat, kappa_hat, beta_hat = mean(mu_draws), mean(kappa_draws), mean(beta_draws)  # posterior-mean plug-in
kern = Exponential(1 / beta_hat)
lam(t) = HP.intensity(t, t_obs, mu_hat, kappa_hat, s -> pdf(kern, s))  # fitted conditional intensity at t
Lam(a, b) = HP.compensator(b, t_obs, mu_hat, kappa_hat, kern) - HP.compensator(a, t_obs, mu_hat, kappa_hat, kern)  # fitted compensator on [a, b]
{{?data=events}}lam_true(t) = HP.intensity(t, t_obs, {{mu}}, {{alpha}} / {{beta}}, s -> pdf(Exponential(1 / {{beta}}), s))
'''

[[codeBranches]]
model = "network"
code = '''
using Random, Statistics, LinearAlgebra, Distributions, QuadGK
import NetworkHawkesProcesses as NHP

Random.seed!(1)
N = {{N}}  # number of nodes
T = Float64({{T}})  # observation window [0, T]
{{?data=events}}links = Float64.(rand(Bernoulli(0.5), N, N))  # true links: links[m, n] = 1 means node m excites node n
{{?data=events}}truth = NHP.ContinuousNetworkHawkesProcess(NHP.HomogeneousProcess(fill({{net-mu}}, N)), NHP.ExponentialImpulseResponse(fill({{net-beta}}, N, N)), NHP.DenseWeightModel(fill(0.6 / N, N, N)), links, NHP.BernoulliNetworkModel(0.5, N))
{{?data=events}}events, nodes, _ = rand(truth, T)  # simulated example: event times and the node of each

t_obs = Float64.({{data}})
node_obs = Int.({{nodes}})
data = (t_obs, node_obs, T)  # (times, node of each event, duration)
node_times = [t_obs[node_obs .== n] for n in 1:N]

# Neutral start: equal baselines, unit decays, small weights, all links present
process = NHP.ContinuousNetworkHawkesProcess(NHP.HomogeneousProcess(fill(length(t_obs) / (N * T), N)), NHP.ExponentialImpulseResponse(ones(N, N)), NHP.DenseWeightModel(fill(0.1, N, N)), ones(N, N), NHP.BernoulliNetworkModel(0.5, N))
its = {{its}}
res = NHP.mcmc!(process, data; nsteps = its)  # Gibbs: parents, baselines, weights, decays, links, link probability
draws = res.samples[(div(its, 4) + 1):end]  # drop the first quarter as burn-in

# Each draw is [link probability; baselines (N); W (N x N); decays (N x N); links A (N x N)]
mu_draws = [s[2:(N + 1)] for s in draws]
W_draws = [reshape(s[(N + 2):(N + 1 + N^2)], N, N) for s in draws]
theta_draws = [reshape(s[(N + 2 + N^2):(N + 1 + 2N^2)], N, N) for s in draws]
A_draws = [reshape(s[(N + 2 + 2N^2):end], N, N) for s in draws]
P_link = mean(A_draws)  # posterior probability of each link
AW_hat = mean(A_draws .* W_draws)  # posterior mean effective weights

println("Events per node: ", length.(node_times))
println("Baselines mu: ", round.(mean(mu_draws), digits = 3))
println("Posterior link probabilities P(A[m, n] = 1), row m = source:")
display(round.(P_link, digits = 2))
{{?data=events}}println("True links:")
{{?data=events}}display(links)

fitted = NHP.ContinuousStandardHawkesProcess(NHP.HomogeneousProcess(mean(mu_draws)), NHP.ExponentialImpulseResponse(mean(theta_draws)), NHP.DenseWeightModel(AW_hat))  # posterior-mean plug-in
lam(t) = NHP.intensity(fitted, data, t)  # vector of the N fitted intensities at t
Lam(a, b) = quadgk(lam, a, filter(s -> a < s < b, t_obs)..., b)[1]  # fitted compensators on [a, b], split at the jumps
'''

