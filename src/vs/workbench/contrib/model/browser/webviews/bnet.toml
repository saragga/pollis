[[models]]
id = "define"
label = "Define"

[[models]]
id = "learn"
label = "Learn"

[[models]]
id = "infer"
label = "Exact Inference"

[[models]]
id = "sample"
label = "Approx. Inference"

[[decisionRows]]
task = "Define"
context = "Expert"
purpose = "Domain knowledge encodes the structure; translate expert beliefs into conditional probability tables"

[[decisionRows]]
task = "Learn"
context = "K2 / Naive Bayes"
purpose = "Structure is unknown; learn the Directed Acyclic Graph (DAG) and parameters from observed data"

[[decisionRows]]
task = "Exact Inference"
context = "Variable Elimination"
purpose = "Small network with discrete nodes; need precise posterior probabilities for query nodes"

[[decisionRows]]
task = "Approx. Inference"
context = "Gibbs / LW"
purpose = "Large or mixed network where exact inference is intractable; samples are sufficient"

[[inputs]]
id = "net"
label = "network"
tooltip = "Variable name for the BayesNet object. Used as the target of push!, rand, and infer calls throughout the generated code."
default = "bn"

[[inputs]]
id = "nodes"
label = "nodes"
tooltip = "Comma-separated node names, e.g. rain, sprinkler, wet_grass. Each becomes a Symbol in the BayesNet and must be a valid Julia identifier."
default = "rain, sprinkler, wet_grass"
models = ["define"]

[[inputs]]
id = "data"
label = "data"
tooltip = "Variable name of the DataFrame containing observations. Each column is a node; each row is one observation. Discrete columns should have integer values starting from 1."
default = "df"
models = ["learn"]

[[inputs]]
id = "algo"
label = "algorithm"
tooltip = "Structure learning algorithm. NaiveBayes assumes all nodes are conditionally independent given a class node — fast but restrictive. K2 uses a greedy score-based search with a fixed node ordering."
kind = "select"
default = "K2Score"
models = ["learn"]

[[inputs.options]]
value = "K2Score"
label = "K2 Score"

[[inputs.options]]
value = "NaiveBayes"
label = "Naive Bayes"

[[inputs.options]]
value = "TreeBayes"
label = "Tree Bayes"

[[inputs]]
id = "evidence"
label = "evidence"
tooltip = "Variable name of the Assignment holding observed values, e.g. Assignment(:rain => 1, :sprinkler => 0). Integer values represent discrete states (1-indexed)."
default = "evidence"
models = ["infer"]

[[inputs]]
id = "query"
label = "query"
tooltip = "Node to query as a Julia Symbol, e.g. :wet_grass. The posterior distribution over this node is returned given the evidence."
default = ":wet_grass"
models = ["infer"]

[[inputs]]
id = "sev"
label = "evidence"
tooltip = "Assignment of observed values used to condition the sampling, e.g. Assignment(:rain => 1)."
default = "evidence"
models = ["sample"]

[[inputs]]
id = "n"
label = "samples"
tooltip = "Number of samples to draw. More samples give more accurate posteriors at higher computational cost. Start with 1000; increase to 10000 for precise tail probabilities."
default = "1000"
models = ["sample"]

[[codeBranches]]
model = "define"
code = '''
using BayesNets, Distributions  # Bayesian Network and distributions

{{net}} = BayesNet()  # create empty network

push!({{net}}, StaticCPD(:rain,        Bernoulli(0.3)))  # root node: P(rain = 1) = 0.3
push!({{net}}, StaticCPD(:sprinkler,   Bernoulli(0.4)))  # root node: P(sprinkler = 1) = 0.4
push!({{net}}, CategoricalCPD(:wet_grass, [:rain, :sprinkler], [2,2,2,2],  # child node with two parents
    [Bernoulli(0.01), Bernoulli(0.9), Bernoulli(0.9), Bernoulli(0.99)]))

samples = rand({{net}}, 1000)  # draw 1000 samples from the joint distribution
println("Nodes: ", names({{net}}))  # list all node names
'''

[[codeBranches]]
model = "learn"
code = '''
using BayesNets, DataFrames  # structure learning from data

{{net}} = fit(BayesNet, {{data}}, {{algo}}())  # learn structure and parameters

println("Nodes:  ", names({{net}}))  # discovered node names
println("Edges:  ", edges({{net}}.dag))  # learned directed edges

samples = rand({{net}}, 100)  # sample from the learned network
'''

[[codeBranches]]
model = "infer"
code = '''
using BayesNets  # exact inference via variable elimination

{{evidence}} = Assignment(:rain => 1, :sprinkler => 0)  # observed evidence: rain = true, sprinkler = off

posterior = infer(ExactInference(), {{net}}, [{{query}}], {{evidence}})  # compute P(wet_grass | evidence)

println("P(", {{query}}, " | evidence) = ", posterior)  # print posterior distribution
'''

[[codeBranches]]
model = "sample"
code = '''
using BayesNets  # approximate inference via sampling

{{sev}} = Assignment(:rain => 1)  # condition on rain = true

samples_lw  = infer(LikelihoodWeightingInference({{n}}), {{net}}, [:wet_grass], {{sev}})  # likelihood weighting: {{n}} weighted samples
samples_gb  = infer(GibbsSamplingNodewise({{n}}), {{net}}, [:wet_grass], {{sev}})  # Gibbs sampling: {{n}} MCMC samples

println("LW  posterior: ", samples_lw)  # likelihood weighting result
println("Gibbs posterior: ", samples_gb)  # Gibbs sampling result
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "bnet-plot-dag"
label = "DAG Plot"
desc = "Visualise the directed acyclic graph structure of the network"
code = '''
using BayesNets, GraphPlot, Graphs  # network visualisation

gplot({{net}}.dag, nodelabel=string.(names({{net}})))  # draw the DAG with node labels
'''

[[actionGroups.actions]]
id = "bnet-plot-cpd"
label = "CPD Plot"
desc = "Plot the conditional probability distribution of a selected node"
code = '''
using BayesNets, Plots  # network and plotting

node_name = :wet_grass  # select the node to inspect
cpd = {{net}}.cpds[indexin([node_name], names({{net}}))[1]]  # retrieve CPD for the node
println("CPD for ", node_name, ": ", cpd)  # print conditional probability table
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "bnet-structure-check"
label = "Structure Check"
desc = "Verify the learned DAG has no cycles and report node in-degrees"
code = '''
using BayesNets, Graphs  # network utilities

println("Is DAG: ", is_directed_acyclic_graph({{net}}.dag))  # must be true for a valid BN
println("Node count: ", nv({{net}}.dag))  # number of nodes
println("Edge count: ", ne({{net}}.dag))  # number of directed edges
for (i, name) in enumerate(names({{net}}))  # per-node in-degree (number of parents)
    println(name, " parents: ", indegree({{net}}.dag, i))
end
'''

[[actionGroups.actions]]
id = "bnet-score"
label = "Network Score"
desc = "Compute the BIC score of the learned network on held-out data"
code = '''
using BayesNets  # scoring utilities

score = bayesian_score({{net}}, {{data}})  # log marginal likelihood of data under network
println("Bayesian score: ", score)  # higher = better fit to data
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "bnet-predict"
label = "Predict Query Node"
desc = "Compute the posterior of a query node for new evidence"
code = '''
using BayesNets  # inference

new_ev = Assignment(:rain => 1, :sprinkler => 1)  # new evidence to query against
p = infer(ExactInference(), {{net}}, [{{query}}], new_ev)  # exact posterior
println("P(", {{query}}, " | new evidence) = ", p)  # posterior probability
'''

[[actionGroups.actions]]
id = "bnet-sample-pred"
label = "Sample Predictions"
desc = "Generate predictions by sampling conditioned on evidence"
code = '''
using BayesNets, Statistics  # sampling and statistics

evidence = Assignment(:rain => 1)  # condition on rain = true
samples  = infer(LikelihoodWeightingInference(2000), {{net}}, [:wet_grass], evidence)  # draw 2000 weighted samples
println("P(wet_grass=1 | rain=1) ≈ ", mean(samples .== 1))  # empirical posterior probability
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "bnet-compare-algo"
label = "Algorithm Comparison"
desc = "Compare K2 and NaiveBayes structure scores on the same dataset"
code = '''
using BayesNets  # structure learning

bn_k2  = fit(BayesNet, {{data}}, K2Score())  # K2 score-based search
bn_nb  = fit(BayesNet, {{data}}, NaiveBayes())  # Naive Bayes classifier structure

s_k2   = bayesian_score(bn_k2, {{data}})  # score K2 network
s_nb   = bayesian_score(bn_nb, {{data}})  # score Naive Bayes network
println("K2: ", s_k2, "  NaiveBayes: ", s_nb)  # compare — higher is better
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "bnet-sensitivity"
label = "Sensitivity Analysis"
desc = "Measure how the query posterior changes as evidence nodes vary"
code = '''
using BayesNets  # sensitivity analysis

for rain_val in [0, 1]  # vary evidence over both states
    ev  = Assignment(:rain => rain_val)
    p   = infer(ExactInference(), {{net}}, [{{query}}], ev)
    println("rain=", rain_val, " => P(" + string({{query}}) + "=1) = ", p)
end
'''

[[actionGroups.actions]]
id = "bnet-markov-blanket"
label = "Markov Blanket"
desc = "Find the minimal set of nodes that shield a node from the rest of the network"
code = '''
using BayesNets, Graphs  # network utilities

target = :wet_grass  # node to find the Markov blanket of
idx    = indexin([target], names({{net}}))[1]  # node index

parents   = inneighbors({{net}}.dag, idx)  # direct parent nodes
children  = outneighbors({{net}}.dag, idx)  # direct child nodes
co_parents = unique(vcat([inneighbors({{net}}.dag, ch) for ch in children]...))  # parents of children (co-parents)

blanket   = unique(vcat(parents, children, co_parents))  # Markov blanket = parents + children + co-parents
println("Markov blanket of ", target, ": ", names({{net}})[blanket])  # print blanket node names
'''
