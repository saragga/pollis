[[references]]
separator = true
label = "Original Papers (from packages)"

[[references]]
title = "Fast Algorithms for Mining Association Rules"
authors = "Agrawal, R. & Srikant, R."
year = 1994
journal = ""
url = "https://www.vldb.org/conf/1994/P487.PDF"
openAccess = true

[[references]]
