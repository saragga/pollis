# Rule-Based Methods Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/rulebased.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Rule-Based Methods"
viewType = "pollis.rulebased"
defaultModel = "itemset"

[[packages]]
name = "RuleMiner.jl"
github = "https://github.com/JaredSchwartz/RuleMiner.jl"

[requires]
packages = ["Tables.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Frequent Itemset Mining"
file = "rulebased/tutorial-01-itemsets.ipynb"
bundled = true
description = "Apriori, ECLAT, FP-Growth — mining frequent itemsets with support thresholds"

[[notebookSections.notebooks]]
name = "Closed and Maximal Itemsets"
file = "rulebased/tutorial-02-closed-maximal.ipynb"
bundled = true
description = "FP-Close and FP-Maximal — compact representations of the frequent itemset lattice"

[[notebookSections.notebooks]]
name = "Association Rule Mining"
file = "rulebased/tutorial-03-rules.ipynb"
bundled = true
description = "Rule generation and filtering by confidence, lift, conviction, and leverage"

