[[codeBranches]]
model = "itemset"
code = '''
using RuleMiner

using SparseArrays, Tables

{{?df=df}} using PollisDatasets  # curated example datasets
{{?df=df}} # Example data: Hahsler, Hornik and Reutterer (2006), one month of a grocery outlet's sales, 9835 baskets of 169 product categories. Replace df with your own table.
{{?df=df}} groceries = dataset("groceries")  # long format, columns transaction and item
{{?df=df}} df = (Transaction = groceries.transaction, Item = groceries.item)

t = Tables.columntable({{df}})  # long format: one row per (transaction, item) pair
ids, items = string.(t.Transaction), string.(t.Item)
linekeys, colkeys = unique(ids), sort(unique(items))
row = Dict(k => i for (i, k) in enumerate(linekeys))
col = Dict(k => j for (j, k) in enumerate(colkeys))
matrix = sparse(UInt32[row[i] for i in ids], UInt32[col[x] for x in items], fill(true, length(ids)), length(linekeys), length(colkeys), |)
txns = Txns(matrix, colkeys, linekeys)  # sparse transactions x items incidence matrix

itemsets = {{algorithm}}(txns, {{support}})  # one row per frequent itemset: columns Itemset, Support, N, Length
'''

[[codeBranches]]
model = "rules"
code = '''
using RuleMiner

using SparseArrays, Tables

{{?df=df}} using PollisDatasets  # curated example datasets
{{?df=df}} # Example data: Hahsler, Hornik and Reutterer (2006), one month of a grocery outlet's sales, 9835 baskets of 169 product categories. Replace df with your own table.
{{?df=df}} groceries = dataset("groceries")  # long format, columns transaction and item
{{?df=df}} df = (Transaction = groceries.transaction, Item = groceries.item)

t = Tables.columntable({{df}})  # long format: one row per (transaction, item) pair
ids, items = string.(t.Transaction), string.(t.Item)
linekeys, colkeys = unique(ids), sort(unique(items))
row = Dict(k => i for (i, k) in enumerate(linekeys))
col = Dict(k => j for (j, k) in enumerate(colkeys))
matrix = sparse(UInt32[row[i] for i in ids], UInt32[col[x] for x in items], fill(true, length(ids)), length(linekeys), length(colkeys), |)
txns = Txns(matrix, colkeys, linekeys)  # sparse transactions x items incidence matrix

all_rules = Tables.columntable(apriori(txns, {{support}}, 0.0))  # every rule of the frequent itemsets: RuleMiner prunes by confidence while it grows rules, so min_confidence is applied after
keep = all_rules.Confidence .>= {{confidence}}
rules = map(c -> c[keep], all_rules)  # rules with confidence >= min_confidence
# one row per rule: columns LHS (antecedent), RHS (consequent), Support, Confidence, Coverage, Lift, N, Length
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "top-support"
label = "Most Frequent Patterns"
desc = "Bar chart of the ten itemsets (or rules) with the highest support"
code = '''
using Tables, Plots

{{?model=itemset}} t = Tables.columntable(itemsets)
{{?model=itemset}} names = [join(s, ", ") for s in t.Itemset]
{{?model=rules}} t = Tables.columntable(rules)
{{?model=rules}} names = [join(a, ", ") * " => " * string(c) for (a, c) in zip(t.LHS, t.RHS)]
top = sortperm(t.Support, rev=true)[1:min(10, end)]
bar(names[top], t.Support[top], xrotation=45, ylabel="support", legend=false)
'''

[[actionGroups.actions]]
id = "rule-scatter"
label = "Support vs Confidence"
desc = "Every rule as a point, coloured by lift, to spot strong and surprising rules"
models = ["rules"]
code = '''
using Tables, Plots

r = rules  # the mined rules, as columns
scatter(r.Support, r.Confidence, zcolor=r.Lift, xlabel="support", ylabel="confidence", colorbar_title="lift", legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "support-sweep"
label = "Support Threshold Sweep"
desc = "Number of frequent itemsets as min_support falls, to pick a readable threshold"
code = '''
using Tables, Plots

thresholds = [0.2, 0.1, 0.05, 0.02, 0.01]
counts = [length(Tables.columntable(fpgrowth(txns, s)).Support) for s in thresholds]
plot(thresholds, counts, xflip=true, yscale=:log10, marker=:circle, xlabel="min_support", ylabel="itemsets", legend=false)
'''

[[actionGroups.actions]]
id = "lift-check"
label = "Uninformative Rules"
desc = "Share of rules with lift <= 1, which are no better than independence"
models = ["rules"]
code = '''
using Tables

r = rules  # the mined rules, as columns
count(<=(1), r.Lift) / length(r.Lift)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "recommend"
label = "Recommend Items"
desc = "Items suggested for a basket by the matching rules, ranked by confidence"
models = ["rules"]
code = '''
using Tables

r = rules  # the mined rules, as columns
basket = ["other vegetables", "yogurt"]  # items already in the basket, from the Groceries example: use items of your own data
hits = [i for i in eachindex(r.LHS) if issubset(r.LHS[i], basket) && !(r.RHS[i] in basket)]
unique(r.RHS[hits[sortperm(r.Confidence[hits], rev=true)]])
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "algorithm-timing"
label = "Algorithm Timing"
desc = "Run time and itemset count of ECLAT and FP-Growth on your data"
code = '''
using Tables

for f in (eclat, fpgrowth)
	seconds = @elapsed out = f(txns, {{support}})
	println(rpad(string(f), 10), round(seconds, digits=3), " s  ", length(Tables.columntable(out).Support), " itemsets")
end
'''

[[actionGroups.actions]]
id = "summaries"
label = "All vs Closed vs Maximal"
desc = "How much the closed and maximal summaries shrink the frequent itemsets"
code = '''
using Tables

itemset_count(x) = length(Tables.columntable(x).Support)
(all = itemset_count(fpgrowth(txns, {{support}})), closed = itemset_count(fpclose(txns, {{support}})), maximal = itemset_count(fpmax(txns, {{support}})))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "top-lift"
label = "Strongest Rules"
desc = "The ten rules with the highest lift, read as if-then statements, with their support, count and a one-sided Fisher exact p-value: a high lift on a handful of baskets is often chance"
models = ["rules"]
code = '''
using Tables, HypothesisTests

r = rules  # the mined rules, as columns
n = txns.n_transactions
for i in sortperm(r.Lift, rev=true)[1:min(10, end)]
	a = r.N[i]  # baskets with LHS and RHS
	n_lhs = round(Int, r.Coverage[i] * n)  # baskets with LHS
	n_rhs = round(Int, r.Confidence[i] / r.Lift[i] * n)  # baskets with RHS
	p = pvalue(FisherExactTest(a, n_lhs - a, n_rhs - a, n - n_lhs - n_rhs + a); tail=:right)  # H0: LHS and RHS independent
	println(join(r.LHS[i], " + "), " => ", r.RHS[i], "   supp ", round(r.Support[i], digits=3), "  n ", a, "  conf ", round(r.Confidence[i], digits=2), "  lift ", round(r.Lift[i], digits=2), "  p ", round(p, sigdigits=2))
end
'''
