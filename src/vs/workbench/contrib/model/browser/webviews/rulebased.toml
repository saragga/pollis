label = "Association Rules"

[[bullets]]
text = "Frequent itemset mining"
detail = "ECLAT, FP-Growth"

[[bullets]]
text = "Closed and maximal itemsets"
detail = "FP-Close, FP-Max"

[[bullets]]
text = "Association rule generation"
detail = "Apriori; support, confidence, coverage, lift"

[[decisionRows]]
task = "Apriori"
context = "Rule mining on small to medium transaction sets"
purpose = "Level-wise candidate generation; RuleMiner uses it to mine the association rules"

[[decisionRows]]
task = "ECLAT"
context = "Dense data, many frequent items"
purpose = "Depth-first search over transaction-id sets; fast intersections"

[[decisionRows]]
task = "FP-Growth"
context = "Large or sparse transaction sets"
purpose = "Mines a compressed FP-tree without generating candidates"

[[decisionRows]]
task = "Closed / Maximal"
context = "Too many frequent itemsets to read"
purpose = "Lossless (closed) or most compact (maximal) summary of the itemsets"

[[decisionRows]]
task = "Association Rules"
context = "Cross-selling, co-occurrence patterns"
purpose = "If-then rules scored by support, confidence, coverage and lift"

[[inputs]]
id = "df"
label = "Transactions Table"
tooltip = "Any Tables.jl source in long format, one row per (transaction, item) pair, with columns Transaction and Item (e.g. a NamedTuple of columns or a CSV.File). The default, df, runs on the groceries example from PollisDatasets: 9835 baskets of a grocery outlet."
default = "df"

[[inputs]]
id = "algorithm"
label = "Algorithm"
tooltip = "ECLAT and FP-Growth return all frequent itemsets. FP-Close returns only closed itemsets (no superset with the same support); FP-Max returns only maximal itemsets (no frequent superset). Apriori is used by the Association Rules model."
kind = "select"
default = "fpgrowth"
models = ["itemset"]
newRow = true

[[inputs.options]]
value = "eclat"
label = "ECLAT"

[[inputs.options]]
value = "fpgrowth"
label = "FP-Growth"

[[inputs.options]]
value = "fpclose"
label = "FP-Close (closed)"

[[inputs.options]]
value = "fpmax"
label = "FP-Max (maximal)"

[[inputs]]
id = "support"
label = "min_support"
tooltip = "Minimum fraction of transactions (0-1) that must contain an itemset. Lower values find rarer patterns but grow the output quickly. The default, 0.01, suits the Groceries example, where only eight single items reach 0.1."
default = "0.01"

[[inputs]]
id = "confidence"
label = "min_confidence"
tooltip = "Minimum conditional probability P(consequent | antecedent) for a rule to be kept (0-1). RuleMiner's apriori prunes by confidence while it grows rules, which can lose strong long rules, so the panel mines every rule of the frequent itemsets and keeps those at or above this threshold."
default = "0.2"
models = ["rules"]

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.itemset]
# Itemset lattice: single items at the bottom, pairs and a triple above, frequent ones filled
svg = '''
var rows = [[[27, 20]], [[13, 42], [27, 42], [41, 42]], [[9, 64], [21, 64], [33, 64], [45, 64]]];
var s = '';
var links = [[0, 0, 1, 0], [0, 0, 1, 1], [0, 0, 1, 2], [1, 0, 2, 0], [1, 0, 2, 1], [1, 1, 2, 1], [1, 1, 2, 2], [1, 2, 2, 2], [1, 2, 2, 3]];
for (var i = 0; i < links.length; i++) {
	var a = rows[links[i][0]][links[i][1]], b = rows[links[i][2]][links[i][3]];
	s += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="currentColor" stroke-width="0.8" opacity="0.6"/>';
}
for (var r = 0; r < rows.length; r++) {
	for (var j = 0; j < rows[r].length; j++) {
		var frequent = r > 0 || j === 0;
		s += '<circle cx="' + rows[r][j][0] + '" cy="' + rows[r][j][1] + '" r="3.5" fill="' + (frequent && !(r === 1 && j === 2) ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1"/>';
	}
}
return s;
'''

