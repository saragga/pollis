# Replications Webview Configuration
# A page in the Minimal style of the scaffold, not a panel: Learn More only, as no Julia package powers it. `pageCommand`
# is the command that opens it, which a panel's contribution file would say. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/browseReplications.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Replications"
viewType = "pollis.workflowLibrary"
pageCommand = "chiara.statistics.wfl_sl"

[[wikis]]
name = "Factsheet"
file = "browseReplications/factsheet.md"
bundled = true

[[wikis]]
name = "Overview"
file = "browseReplications/overview.md"
bundled = true

[[wikis]]
name = "Copies and Updates"
file = "browseReplications/copies-and-updates.md"
bundled = true

