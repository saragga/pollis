# Coding Agents Webview Configuration
# A page in the Minimal style of the scaffold, not a panel: Learn More only, as no Julia package powers it. `pageCommand`
# is the command that opens it, which a panel's contribution file would say. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/codingAgent.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Coding Agents"
viewType = "pollis.codingAgent"
pageCommand = "pollis.agents.chooseAgent"

[[wikis]]
name = "Factsheet"
file = "codingAgent/factsheet.md"
bundled = true

[[wikis]]
name = "Overview"
file = "codingAgent/overview.md"
bundled = true

[[wikis]]
name = "Other Agents"
file = "codingAgent/other-agents.md"
bundled = true

[[wikis]]
name = "Pollis Skills"
