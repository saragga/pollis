'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "pred-vs-target"
label = "Prediction vs Target"
desc = "Overlay the in-sample fit and the out-of-sample forecasts on the target series"
code = '''
using Plots  # plotting

plot(1:n, target[1:n]; label="target", color=:black)  # series 1, h steps after each window
plot!(1:ntrain, predict(xtr); label="fit (train)", lw=2)  # in-sample
plot!(ntrain+1:n, predict(xte); label="forecast (test)", lw=2)  # out-of-sample
vline!([ntrain + 0.5]; label="", ls=:dash, color=:gray)  # train/test split
'''

[[actionGroups.actions]]
id = "loss-curve"
label = "Training Loss Curve"
desc = "Continue training and plot train and test loss per epoch"
code = '''
using Plots  # plotting

trn, tst = Float64[], Float64[]  # loss per epoch
for epoch in 1:50  # 50 more full-batch epochs on the model above
    Flux.train!(loss, Flux.params(model), [(xtr, ytr)], opt)
    push!(trn, loss(xtr, ytr)); push!(tst, Flux.mse(predict(xte), yte))
end
plot([trn tst]; label=["train" "test"], xlabel="epoch", ylabel="MSE")  # a rising test curve means overfitting
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals"
label = "Residual Plot"
desc = "Plot out-of-sample forecast residuals and their distribution"
code = '''
using Plots  # plotting

res = predict(xte) .- yte  # test-set forecast errors
p1 = plot(res; title="Test residuals", legend=false)  # h-step errors from overlapping windows are autocorrelated up to lag h - 1 even for an optimal forecast: look for trends and level shifts, not white noise
p2 = histogram(res; title="Residual distribution", legend=false)  # check for skew or heavy tails
plot(p1, p2, layout=(2, 1))  # show both
'''

[[actionGroups.actions]]
id = "grad-norm"
label = "Gradient Norms"
desc = "Inspect per-parameter gradient magnitudes for vanishing or exploding gradients"
code = '''
gs = gradient(() -> loss(xtr, ytr), Flux.params(model))  # one backward pass (implicit params, Flux 0.13)
for p in Flux.params(model)  # each parameter array
    g = gs[p]
    println(rpad(string(size(p)), 14), g === nothing ? "no gradient" : sqrt(sum(abs2, g)))  # L2 norm of the gradient
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forecast"
label = "Forecast Horizon"
desc = "Forecast series 1 h steps after the most recent window, beyond every label used"
code = '''
xnew = input[:, :, :, end:end]  # most recent window: its target time lies after all training and test labels
println("forecast of series 1 (normalised), ", h, " steps after the last window: ", only(predict(xnew)))
'''

[[actionGroups.actions]]
id = "save-model"
label = "Save Model"
desc = "Serialise the trained model with BSON for later reuse"
code = '''
using BSON  # serialisation

BSON.@save "model.bson" model  # write weights to disk
BSON.@load "model.bson" model  # reload later
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "naive-baseline"
label = "Naive Baseline"
desc = "Compare the test MSE against a last-value (random walk) forecast"
code = '''
mse_model = Flux.mse(predict(xte), yte)  # out-of-sample model error
naive = vec(xte[1, end, 1, :])  # last observed value of series 1 in each window
mse_naive = Flux.mse(naive, yte)  # random-walk forecast error, hard to beat for exchange rates
println("naive: ", round(mse_naive, digits=4), "  model: ", round(mse_model, digits=4), "  ratio: ", round(mse_model / mse_naive, digits=3))  # ratio below 1 means the model adds value
'''

[[actionGroups.actions]]
id = "swap-arch"
label = "Swap Architecture"
desc = "Train all four architectures with the same loop and split and compare test MSE"
code = '''
model0 = model  # keep the panel model
archs = ["LSTnet" => () -> LSTnet(inputsize, 2, 3, poollength, 120),  # CNN + GRU + skip + AR
         "DA-RNN" => () -> DARNN(inputsize, 10, 10, poollength, 1),  # dual-stage attention
         "TPA-LSTM" => () -> TPALSTM(inputsize, 10, poollength, 1, 32, 1),  # temporal pattern attention
         "DSANet" => () -> DSANet(inputsize, poollength, 3, 3, 4, 1, 1, 1, 1)]  # dual self-attention
for (name, build) in archs
    global model = build()  # loss and predict use the global model
    Flux.train!(loss, Flux.params(model), Iterators.repeated((xtr, ytr), 20), Flux.Adam(0.007))
    println(rpad(name, 10), " test MSE ", round(Flux.mse(predict(xte), yte), digits=4))
end
model = model0  # restore the panel model
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "param-count"
label = "Parameter Count"
desc = "Count the trainable parameters in the model"
code = '''
n_par = sum(length, Flux.params(model))  # total trainable scalars
println("trainable parameters: ", n_par, "  training windows: ", ntrain)  # capacity relative to the data
'''

[[actionGroups.actions]]
id = "attention-note"
label = "Attention Weights"
desc = "Permutation importance of each input series and time step: what the attention layers learned to weigh"
code = '''
using Random  # shuffle

base = Flux.mse(predict(xte), yte)  # test MSE with intact inputs
for j in 1:inputsize  # input attention: which driving series matter
    xp = copy(xte); xp[j, :, 1, :] = xp[j, :, 1, shuffle(1:size(xp, 4))]  # break series j across windows
    println("series ", j, ": MSE increase ", round(Flux.mse(predict(xp), yte) - base, digits=4))
end
for k in 1:poollength  # temporal attention: which lags matter
    xp = copy(xte); xp[:, k, 1, :] = xp[:, k, 1, shuffle(1:size(xp, 4))]  # break time step k across windows
    println("step ", k, " of ", poollength, ": MSE increase ", round(Flux.mse(predict(xp), yte) - base, digits=4))
end
'''
