name = "FluxArchitectures.jl"
github = "https://github.com/sdobber/FluxArchitectures.jl"

[[packages]]
name = "Flux.jl"
github = "https://github.com/FluxML/Flux.jl"

[requires]
packages = ["FluxArchitectures.jl", "Flux.jl"]

