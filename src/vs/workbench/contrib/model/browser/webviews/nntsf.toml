[[codeBranches]]
model = "lstnet"
code = '''
using FluxArchitectures  # Flux plus the four architectures (FluxArchitectures pins Flux 0.13)

poollength = {{lstnet-pool}}  # past steps per input window
h = 6  # forecast horizon: steps after the last value in each window
horizon = poollength - 1 + h  # get_data counts the horizon from the window start, so a smaller value would put the label inside the window
input, target = get_data(:exchange_rate, poollength, 1000, horizon)  # features x poollength x 1 x windows; label = series 1, h steps after the window
n = 1000 - horizon  # circshift wraps the last labels around to the start: drop them
ntrain = 700  # chronological split: train on the first windows, test on later ones
xtr, ytr = input[:, :, :, 1:ntrain], target[1:ntrain]
xte, yte = input[:, :, :, ntrain+1:n], target[ntrain+1:n]  # every test label lies after every training label
inputsize = size(input, 1)  # number of input series (series 1 is the target)

model = LSTnet(inputsize, {{lstnet-conv}}, {{lstnet-recur}}, poollength, {{lstnet-skip}})  # CNN + GRU + skip-GRU + autoregressive
loss(x, y) = (Flux.ChainRulesCore.ignore_derivatives(() -> Flux.reset!(model)); Flux.mse(model(x), transpose(y)))  # reset recurrent state each pass
predict(x) = (Flux.reset!(model); vec(model(x)))  # forecasts for a block of windows
opt = Flux.Adam(0.007)  # optimiser
Flux.train!(loss, Flux.params(model), Iterators.repeated((xtr, ytr), {{lstnet-epochs}}), opt)  # implicit params: the training API of Flux 0.13, which FluxArchitectures requires
println("train MSE ", round(loss(xtr, ytr), digits=4), "  test MSE ", round(Flux.mse(predict(xte), yte), digits=4))  # out-of-sample error is the one that matters
'''

[[codeBranches]]
model = "darnn"
code = '''
using FluxArchitectures  # Flux plus the four architectures (FluxArchitectures pins Flux 0.13)

poollength = {{darnn-pool}}  # past steps per input window
h = 6  # forecast horizon: steps after the last value in each window
horizon = poollength - 1 + h  # get_data counts the horizon from the window start, so a smaller value would put the label inside the window
