model = "tpalstm"
code = '''
using FluxArchitectures  # Flux plus the four architectures (FluxArchitectures pins Flux 0.13)

poollength = {{tpalstm-pool}}  # past steps per input window
h = 6  # forecast horizon: steps after the last value in each window
horizon = poollength - 1 + h  # get_data counts the horizon from the window start, so a smaller value would put the label inside the window
