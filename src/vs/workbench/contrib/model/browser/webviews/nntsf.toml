[[codeBranches]]
model = "lstnet"
code = '''
using FluxArchitectures  # Flux plus the four architectures

poollength = {{lstnet-pool}}  # past steps per input window
input, target = get_data(:exchange_rate, poollength, 1000, 6)  # sample multivariate series (features x steps)
inputsize = size(input, 1)  # number of input features

model = LSTnet(inputsize, {{lstnet-conv}}, {{lstnet-recur}}, poollength, {{lstnet-skip}})  # CNN + GRU + skip-GRU + autoregressive
loss(x, y) = (Flux.reset!(model); Flux.mse(model(x), transpose(y)))  # reset recurrent state each pass
opt = Flux.ADAM(0.007)  # optimiser
Flux.train!(loss, Flux.params(model), Iterators.repeated((input, target), {{lstnet-epochs}}), opt)  # train for {{lstnet-epochs}} epochs
'''

[[codeBranches]]
model = "darnn"
code = '''
using FluxArchitectures  # Flux plus the four architectures

poollength = {{darnn-pool}}  # past steps per input window
input, target = get_data(:exchange_rate, poollength, 1000, 6)  # sample multivariate series (features x steps)
inputsize = size(input, 1)  # number of input features

model = DARNN(inputsize, {{darnn-encoder}}, {{darnn-decoder}}, poollength, 1)  # dual-stage attention RNN
loss(x, y) = (Flux.reset!(model); Flux.mse(model(x), transpose(y)))  # reset recurrent state each pass
opt = Flux.ADAM(0.007)  # optimiser
Flux.train!(loss, Flux.params(model), Iterators.repeated((input, target), {{darnn-epochs}}), opt)  # train for {{darnn-epochs}} epochs
'''

[[codeBranches]]
model = "tpalstm"
code = '''
using FluxArchitectures  # Flux plus the four architectures

poollength = {{tpalstm-pool}}  # past steps per input window
input, target = get_data(:exchange_rate, poollength, 1000, 6)  # sample multivariate series (features x steps)
inputsize = size(input, 1)  # number of input features

model = TPALSTM(inputsize, {{tpalstm-hidden}}, poollength, {{tpalstm-layers}}, {{tpalstm-filters}}, 1)  # LSTM + temporal pattern attention
loss(x, y) = (Flux.reset!(model); Flux.mse(model(x), transpose(y)))  # reset recurrent state each pass
opt = Flux.ADAM(0.007)  # optimiser
Flux.train!(loss, Flux.params(model), Iterators.repeated((input, target), {{tpalstm-epochs}}), opt)  # train for {{tpalstm-epochs}} epochs
'''

[[codeBranches]]
model = "dsanet"
code = '''
using FluxArchitectures  # Flux plus the four architectures

poollength = {{dsanet-pool}}  # past steps per input window
input, target = get_data(:exchange_rate, poollength, 1000, 6)  # sample multivariate series (features x steps)
inputsize = size(input, 1)  # number of input features

model = DSANet(inputsize, poollength, {{dsanet-local}}, {{dsanet-kernels}}, {{dsanet-dmodel}}, 1, 1, 1, 6)  # global + local self-attention
loss(x, y) = (Flux.reset!(model); Flux.mse(model(x), transpose(y)))  # reset recurrent state each pass
opt = Flux.ADAM(0.007)  # optimiser
Flux.train!(loss, Flux.params(model), Iterators.repeated((input, target), {{dsanet-epochs}}), opt)  # train for {{dsanet-epochs}} epochs
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "pred-vs-target"
label = "Prediction vs Target"
desc = "Overlay the model prediction on the target series"
code = '''
using Plots  # plotting

pred = model(input)  # forward pass over every window
plot(vec(transpose(target)); label="target")  # ground truth
plot!(vec(pred); label="prediction", lw=2)  # model output
'''

[[actionGroups.actions]]
id = "loss-curve"
label = "Training Loss Curve"
desc = "Record the loss each epoch and plot the learning curve"
code = '''
using Plots  # plotting

history = Float64[]  # collect loss per epoch
cb() = push!(history, loss(input, target))  # callback after each epoch
Flux.train!(loss, Flux.params(model), Iterators.repeated((input, target), 50), Flux.ADAM(0.007); cb=cb)  # train with logging
plot(history; xlabel="epoch", ylabel="MSE", legend=false)  # learning curve
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals"
label = "Residual Plot"
desc = "Plot prediction residuals and their distribution"
code = '''
using Plots  # plotting

res = vec(model(input)) .- vec(transpose(target))  # prediction errors
p1 = plot(res; title="Residuals", legend=false)  # 6-step-ahead errors from overlapping windows are autocorrelated up to lag 5 even for an optimal forecast: look for trends and level shifts, not white noise
p2 = histogram(res; title="Residual distribution", legend=false)  # check for skew or heavy tails
plot(p1, p2, layout=(2, 1))  # show both
'''

[[actionGroups.actions]]
id = "grad-norm"
label = "Gradient Norms"
desc = "Inspect per-parameter gradient magnitudes for vanishing or exploding gradients"
code = '''
using Flux  # autodiff

gs = gradient(() -> loss(input, target), Flux.params(model))  # one backward pass
for p in Flux.params(model)  # each parameter array
    println(sqrt(sum(abs2, gs[p])))  # L2 norm of the gradient
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forecast"
label = "Forecast Horizon"
desc = "Run the trained model and read off the most recent forecast"
code = '''
yhat = model(input)  # horizon-step prediction for every window
println(yhat[:, end])  # forecast from the latest window
'''

[[actionGroups.actions]]
id = "save-model"
label = "Save Model"
desc = "Serialise the trained model with BSON for later reuse"
code = '''
using BSON  # serialisation

BSON.@save "model.bson" model  # write weights to disk
BSON.@load "model.bson" model  # reload later
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "naive-baseline"
label = "Naive Baseline"
desc = "Compare the model MSE against a last-value baseline"
code = '''
using Flux  # loss helpers

mse_model = Flux.mse(model(input), transpose(target))  # trained model error
naive = repeat(input[end, :, :], 1, 1)  # last observed value as forecast
mse_naive = Flux.mse(naive, transpose(target))  # baseline error
println("naive: ", mse_naive, "  model: ", mse_model)  # lower is better
'''

[[actionGroups.actions]]
id = "swap-arch"
label = "Swap Architecture"
desc = "All four models share the same training loop; swap only the constructor"
code = '''
model = LSTnet(inputsize, 2, 3, poollength, 120)  # CNN + GRU + skip + AR
model = DARNN(inputsize, 10, 10, poollength, 1)  # dual-stage attention
model = TPALSTM(inputsize, 10, poollength, 1, 32, 1)  # temporal pattern attention
model = DSANet(inputsize, poollength, 3, 3, 4, 1, 1, 1, 6)  # dual self-attention
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "param-count"
label = "Parameter Count"
desc = "Count the trainable parameters in the model"
code = '''
using Flux  # parameter access

n = sum(length, Flux.params(model))  # total trainable scalars
println("trainable parameters: ", n)  # model capacity
'''

[[actionGroups.actions]]
id = "attention-note"
label = "Attention Weights"
desc = "DA-RNN, TPA-LSTM and DSANet learn attention; inspect the weight arrays"
code = '''
using Flux  # parameter access

ps = Flux.params(model)  # all learned weight arrays
println("weight arrays: ", length(ps))  # attention layers are among them
'''
