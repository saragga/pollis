# Import References Webview Configuration
# A page in the Minimal style of the scaffold, not a panel: Learn More only, as no Julia package powers it. `pageCommand`
# is the command that opens it, which a panel's contribution file would say. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/importReferences.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Import References"
viewType = "pollis.importReferences"
pageCommand = "pollis.compose.importReferences"

[[wikis]]
name = "Factsheet"
file = "importReferences/factsheet.md"
bundled = true

[[wikis]]
name = "Overview"
file = "importReferences/overview.md"
bundled = true

[[wikis]]
name = "Looking Up"
file = "importReferences/look-up.md"
bundled = true

[[references]]
separator = true
label = "Software"

[[references]]
key = "Pat1988a"

[[references]]
separator = true
label = "Original Papers"

[[references]]
key = "FS1969a"

[[references]]
key = "HTLF2020a"

[[references]]
key = "PPO2022a"
