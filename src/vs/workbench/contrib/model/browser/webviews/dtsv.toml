# Discrete-Time Stochastic Volatility Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/dtsv.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Discrete-Time Stochastic Volatility Models"
viewType = "pollis.dtsv"
defaultModel = "basic"

[[packages]]
name = "MacroEconometricModels.jl"
github = "https://github.com/FriedmanJP/MacroEconometricModels.jl"

[requires]
packages = ["MacroEconometricModels.jl", "MCMCDiagnosticTools.jl", "Plots.jl", "StatsBase.jl", "HypothesisTests.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Quick Start"
file = "dtsv/tutorial-01-quickstart.ipynb"
bundled = true
description = "Fit a basic stochastic volatility model to financial returns"

[[notebookSections.notebooks]]
name = "Basic SV"
file = "dtsv/tutorial-02-basic.ipynb"
bundled = true
description = "KSC Gibbs sampler: posterior inference for the baseline SV model"

[[notebookSections.notebooks]]
name = "Leverage SV"
file = "dtsv/tutorial-03-leverage.ipynb"
bundled = true
description = "Leverage SV: correlated return and volatility innovations"

[[notebookSections.notebooks]]
name = "Student-t SV"
file = "dtsv/tutorial-04-student.ipynb"
bundled = true
description = "Heavy-tailed SV: Student-t observation equation with estimated degrees of freedom"

[[notebookSections.notebooks]]
name = "Diagnostics"
file = "dtsv/tutorial-05-diagnostics.ipynb"
bundled = true
description = "MCMC convergence checks and latent volatility path extraction"

[[wikis]]
