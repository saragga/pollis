# Copula Estimation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/copula.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Copula Estimation"
viewType = "pollis.copula"
defaultModel = "main"

[[packages]]
name = "Copulas.jl"
github = "https://github.com/lrnv/Copulas.jl"

[[packages]]
name = "VineCopulas.jl"
# From GitHub main, which requires Copulas 1: the registered 0.1.2 does not load with the Copulas it allows; back to the registry once a version requiring Copulas 1 is registered
github = "https://github.com/Santymax98/VineCopulas.jl"
fork = true

[requires]
packages = ["Copulas.jl", "Distributions.jl", "HypothesisTests.jl", "Plots.jl", "StatsBase.jl", "VineCopulas.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Elliptical Copulas"
file = "copula/tutorial-01-elliptical.ipynb"
bundled = true
description = "Gaussian and Student-t copulas — correlation matrices, sampling, tail dependence"

[[notebookSections.notebooks]]
name = "Archimedean Copulas"
file = "copula/tutorial-02-archimedean.ipynb"
bundled = true
description = "Clayton, Gumbel, Frank, and Joe copulas — generators, parameter estimation"

[[notebookSections.notebooks]]
name = "Extreme Value Copulas"
file = "copula/tutorial-03-extreme-value.ipynb"
bundled = true
description = "Max-stable copulas — Gumbel–Hougaard, Galambos, and Pickands representation"

[[notebookSections.notebooks]]
