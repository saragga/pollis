[[inputs]]
id = "marginals"
label = "Marginal Distributions"
tooltip = "One marginal distribution per variable, comma-separated (d = number of entries, d >= 2), e.g. Normal, LogNormal, Gamma. Choices: Normal, Uniform, LogNormal, Exponential, Beta, Gamma, Weibull, Pareto, TDist, Cauchy, Laplace, Gumbel, Frechet, GeneralizedExtremeValue, Poisson, NegativeBinomial. Bivariate-only families (Galambos, Hüsler–Reiss, tEV, Marshall–Olkin, W) are fixed at d = 2. Not used by the empirical families."
default = "Normal, Normal"
when = "family!=EmpiricalCopula|BetaCopula|BernsteinCopula|CheckerboardCopula|EmpiricalEVCopula"

[[inputs]]
id = "method-select"
label = "Estimation Method"
tooltip = ""
kind = "select"
default = ":mle"

[[inputs.options]]
value = ":mle"
label = "Maximum Likelihood Estimation"

[[inputs.options]]
value = ":itau"
label = "Inversion of Kendall’s Tau"

[[inputs.options]]
value = ":irho"
label = "Inversion of Spearman’s Rho"

[[inputs.options]]
value = ":ibeta"
label = "Inversion of Blomqvist’s Beta"

[[inputs.options]]
value = ":ifm"
label = "Two-Stage Maximum Likelihood"

[[inputs.options]]
value = ":ecdf"
label = "Pseudo-observations"

[[inputs]]
id = "nu"
label = "Deg. of Freedom (nu)"
tooltip = "Degrees of freedom nu > 0. For Student-t: lower values give heavier tails; as nu → ∞ it converges to Gaussian. For tEV: same parameter governs the extreme-value tail; lower nu increases tail dependence."
default = "4"
when = "family=TCopula|TEVCopula"

[[inputs]]
id = "data"
label = "Data"
tooltip = ""
default = "data"

[[inputs]]
id = "delta"
label = "delta (shape)"
tooltip = "Second shape parameter delta for the BB1 copula (Joe–Clayton nesting). delta ≥ 1 controls the lower tail dependence strength independently of theta. BB1 nests Clayton (theta → 0) and Gumbel (delta = 1) as special cases."
default = "2.0"
when = "family=BB1Copula"

[[inputs]]
id = "lambda1"
label = "lambda1"
tooltip = ""
default = "1.0"
when = "family=MarshallOlkinCopula"

[[inputs]]
id = "lambda2"
label = "lambda2"
tooltip = ""
default = "1.0"
when = "family=MarshallOlkinCopula"

[[inputs]]
id = "lambda12"
label = "lambda12"
tooltip = ""
default = "0.5"
when = "family=MarshallOlkinCopula"

[[codeBranches]]
model = "main"
code = '''
using Copulas, Distributions, Plots

{{?family=EmpiricalCopula|BetaCopula|BernsteinCopula|CheckerboardCopula|EmpiricalEVCopula}} D = fit({{family}}, {{data}})  # fit empirical copula
{{?family!=EmpiricalCopula|BetaCopula|BernsteinCopula|CheckerboardCopula|EmpiricalEVCopula}} D = fit(CopulaModel, SklarDist{{{family}}, Tuple{{{marginals}}}}, {{data}}; copula_method={{method-select}})  # fit Sklar distribution
plot(D)

sklar = D.dist  # fitted Sklar distribution
copula = sklar.C  # fitted copula
marginals = sklar.m  # fitted marginals
'''
