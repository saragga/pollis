[[inputs]]
id = "n"
label = "n"
tooltip = "Number of observations in the dataset."
default = "100"

[[inputs]]
id = "k"
label = "k"
tooltip = "Number of folds (for k-fold strategies)."
default = "5"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Random seed for reproducibility."
default = "42"

[[codeBranches]]
model = "main"
code = '''
using DataSplits  # resampling strategies

X = rand({{n}}, 4)  # n x p feature matrix
y = rand({{n}})  # response vector

{{?strategy=NestedCV}} inner = KFold({{k}})  # inner loop: hyperparameter tuning
{{?strategy=NestedCV}} outer = KFold({{k}})  # outer loop: performance evaluation
{{?strategy=NestedCV}} cv = NestedCV(inner, outer)  # nested cross-validation
{{?strategy=LeaveOneOut}} cv = LeaveOneOut()  # n folds, each with one test sample
{{?strategy=LeavePOut}} cv = LeavePOut(p=2)  # leave-p-out: C(n,p) test sets
{{?strategy=TimeSplit}} cv = TimeSplit(train_ratio=0.8)  # single chronological split
{{?strategy=BlockedCV}} cv = BlockedCV({{k}})  # blocked CV respecting temporal order
{{?strategy=PurgedKFold}} cv = PurgedKFold({{k}}, embargo=0.01)  # purged + embargo gap for financial series
{{?strategy=TimeSeriesSplit}} cv = TimeSeriesSplit({{k}})  # expanding-window time-series CV
{{?strategy=KennardStoneSplit|LazyKennardStoneSplit|SPXYSplit|MDKSSplit|OptiSimSplit|LazyOptiSimSplit|MinDissimilaritySplit|MaxDissimilaritySplit}} cv = {{strategy}}(train_ratio=0.8)  # distance-based; no random seed needed
{{?strategy=RandomSplit|ShuffleSplit|BootstrapSplit|StratifiedShuffleSplit|GroupShuffleSplit}} cv = {{strategy}}(rng=MersenneTwister({{seed}}))  # random split, seed {{seed}}
{{?strategy=KFold|StratifiedKFold|GroupKFold|RepeatedKFold}} cv = {{strategy}}({{k}}, rng=MersenneTwister({{seed}}))  # {{k}} folds, seed {{seed}}

for (train_idx, test_idx) in splits(cv, X, y)  # iterate folds
    X_train, X_test = X[train_idx, :], X[test_idx, :]
    y_train, y_test = y[train_idx],    y[test_idx]
    println("train: ", length(train_idx), "  test: ", length(test_idx))  # fold sizes
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fold-sizes"
label = "Fold Sizes"
desc = "Bar chart of train and test sizes across folds"
code = '''
using DataSplits, Plots  # resampling + Plots

X = rand({{n}}, 4); y = rand({{n}})  # dummy data
cv = {{strategy}}({{k}}, rng=MersenneTwister({{seed}}))  # strategy

train_sz, test_sz = Int[], Int[]
for (tr, te) in splits(cv, X, y)  # iterate folds
    push!(train_sz, length(tr)); push!(test_sz, length(te))
end

groupedbar([train_sz test_sz]; label=["Train" "Test"], xlabel="Fold", ylabel="n")  # grouped bar chart
'''

[[actionGroups.actions]]
id = "feature-coverage"
label = "Feature Coverage"
desc = "Scatter of train vs test samples in 2D to inspect space coverage"
code = '''
using DataSplits, Plots  # resampling + Plots

X = rand({{n}}, 2)  # 2-D feature matrix for visualisation
y = rand({{n}})  # response
cv = {{strategy}}({{k}}, rng=MersenneTwister({{seed}}))  # strategy

tr, te = first(splits(cv, X, y))  # first fold only
scatter(X[tr,1], X[tr,2]; label="Train", alpha=0.6)
scatter!(X[te,1], X[te,2]; label="Test", alpha=0.9, marker=:diamond)  # overlay test set
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "class-balance"
label = "Class Balance"
desc = "Check class proportions in each fold to detect imbalance"
code = '''
using DataSplits, StatsBase  # resampling + StatsBase

y = rand(["A","B"], {{n}})  # binary labels
cv = {{strategy}}({{k}}, rng=MersenneTwister({{seed}}))  # strategy

for (i, (tr, _)) in enumerate(splits(cv, y, y))  # iterate folds
    println("Fold $i: ", countmap(y[tr]))
end
'''

[[actionGroups.actions]]
id = "leakage-check"
label = "Leakage Check"
desc = "Verify train and test index sets are disjoint in every fold"
code = '''
using DataSplits  # resampling

X = rand({{n}}, 4); y = rand({{n}})  # dummy data
cv = {{strategy}}({{k}}, rng=MersenneTwister({{seed}}))  # strategy

for (i, (tr, te)) in enumerate(splits(cv, X, y))  # each fold
    @assert isempty(intersect(tr, te)) "Fold $i: data leakage!"  # should never fire
end
println("No leakage detected.")  # all folds clean
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "cv-score"
label = "CV Score"
desc = "Compute mean and std of a metric across all folds"
code = '''
using DataSplits, Statistics  # resampling + Statistics

X = rand({{n}}, 4); y = rand({{n}})  # dummy data
cv = {{strategy}}({{k}}, rng=MersenneTwister({{seed}}))  # strategy

scores = Float64[]
for (tr, te) in splits(cv, X, y)  # iterate folds
    score = my_model_eval(X[tr,:], y[tr], X[te,:], y[te])  # user-defined metric function
    push!(scores, score)
end

println("CV mean: ", mean(scores), "  std: ", std(scores))  # summary statistics
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-strategies"
label = "Compare Strategies"
desc = "Run the same model under two strategies and compare score distributions"
code = '''
using DataSplits, Statistics  # resampling + Statistics

X = rand({{n}}, 4); y = rand({{n}})  # dummy data
cv_a = KFold({{k}}, rng=MersenneTwister({{seed}}))  # strategy A: k-fold
cv_b = ShuffleSplit(rng=MersenneTwister({{seed}}))  # strategy B: shuffle split

function cv_scores(cv)
    [my_model_eval(X[tr,:], y[tr], X[te,:], y[te]) for (tr, te) in splits(cv, X, y)]
end

println("KFold:        mean=", mean(cv_scores(cv_a)))  # A results
println("ShuffleSplit: mean=", mean(cv_scores(cv_b)))  # B results
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "optimism"
label = "Optimism Bias"
desc = "Estimate training-set optimism: in-sample minus out-of-sample score"
code = '''
using DataSplits, Statistics  # resampling + Statistics

X = rand({{n}}, 4); y = rand({{n}})  # dummy data
cv = {{strategy}}({{k}}, rng=MersenneTwister({{seed}}))  # strategy

in_s, out_s = Float64[], Float64[]
for (tr, te) in splits(cv, X, y)  # each fold
    push!(in_s,  my_model_eval(X[tr,:], y[tr], X[tr,:], y[tr]))
    push!(out_s, my_model_eval(X[tr,:], y[tr], X[te,:], y[te]))
end

println("Optimism: ", mean(in_s) - mean(out_s))  # positive = overfitting
'''
