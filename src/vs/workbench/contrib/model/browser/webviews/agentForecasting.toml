# Agents' Forecasting Competition Webview Configuration
# A page of Compose > Prediction Competitions in the Time Arrow style of the scaffold, not a panel: only its Powered by and
# Learn More. `pageCommand` is the command that opens it, which a panel's contribution file would say. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/agentForecasting.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Agents' Forecasting Competition"
viewType = "pollis.agentForecasting"
pageCommand = "pollis.orchestration.forecastingCompetition"

[[packages]]
name = "PollisCompetitions.jl"
github = "https://github.com/Trumpingtons/PollisCompetitions.jl"

[[wikis]]
name = "Overview"
file = "agentForecasting/overview.md"
bundled = true
description = "What the page does, its four steps, what each agent does and what Pollis computes in Julia"

[[wikis]]
name = "Factsheet"
file = "agentForecasting/factsheet.md"
bundled = true
description = "Steps, inputs, the files of a study and of an agent, the method's function, the columns of the scores and the requirements at a glance"

[[wikis]]
name = "Keeping the Test Unseen"
file = "agentForecasting/keeping-test-unseen.md"
bundled = true
description = "What the agents get and what stays with Pollis, the rules of the skill, what the rules cannot prevent, and how a method is checked"

[[wikis]]
name = "Combining the Agents' Forecasts"
file = "agentForecasting/combining-forecasts.md"
bundled = true
description = "The mean and the median of the agents' forecasts, which agents enter them, and how to read them beside the agents and the benchmarks"

[[references]]
separator = true
label = "Original Papers"

[[references]]
key = "BG1969a"

[[references]]
key = "MACFH...1982a"

[[references]]
key = "MH2000a"

[[references]]
key = "MSA2018a"

[[references]]
key = "MSA2020a"
