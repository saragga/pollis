[[bullets]]
text = "Exponential"
detail = "variance model: Var(u) = sigma² exp(z′alpha); two-step FWLS or MLE via HARE.jl"

[[bullets]]
text = "Power"
detail = "variance model: std(u) ∝ |z′alpha|p; two-step FWLS or MLE via HARE.jl"

[[bullets]]
