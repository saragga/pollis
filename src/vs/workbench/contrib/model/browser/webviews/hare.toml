# Linear Models with Heteroskedasticity Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/hare.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Linear Models with Heteroskedasticity"
viewType = "pollis.hare"
defaultModel = "exponential"

[[packages]]
name = "HARE.jl"
github = "https://github.com/Trumpingtons/HARE.jl"

[[packages.videos]]
