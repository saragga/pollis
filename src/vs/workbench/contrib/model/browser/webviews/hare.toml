[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "spread"
label = "Residual Spread"
desc = "Absolute residuals against the fitted values with the spread the variance model expects: the envelope should follow the fan of the points"
code = '''
using Plots
s = sqrt.(variance(Zv))
o = sortperm(fitted(result))
Plots.scatter(fitted(result), abs.(residuals(result)), ms=2.5, alpha=0.6, label="|residual|", xlabel="fitted value")
Plots.plot!(fitted(result)[o], sqrt(2 / pi) .* s[o], lw=2, label="expected |residual| from the model")
'''

[[actionGroups.actions]]
id = "standardised"
label = "Standardised Residuals"
desc = "Residuals divided by their fitted standard deviation: if the variance model is right they form an even band of width about 2 around zero"
code = '''
using Plots
r = residuals(result) ./ sqrt.(variance(Zv))
Plots.scatter(fitted(result), r, ms=2.5, alpha=0.6, label="", xlabel="fitted value", ylabel="residual / sigma_i")
Plots.hline!([-2, 0, 2], ls=:dash, color=:gray, label="")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "het-tests"
label = "Heteroskedasticity Tests"
desc = "Harvey (exponential), Glejser (standard deviation), Breusch-Pagan (linear) and White (general) tests on the OLS residuals: small p-values mean the constant-variance assumption fails"
code = '''
(harvey_p = pvalue(harvey_test(Xm, yv; Z=Zm)), glejser_p = pvalue(glejser_test(Xm, yv; Z=Zm)),
 breusch_pagan_p = pvalue(breusch_pagan_test(Xm, yv)), white_p = pvalue(white_test(Xm, yv)))
'''

[[actionGroups.actions]]
id = "after-fit"
label = "Remaining Heteroskedasticity"
desc = "Breusch-Pagan test on the standardised residuals, and their normality: a significant result means the chosen variance model has not captured the pattern"
code = '''
using HypothesisTests
r = residuals(result) ./ sqrt.(variance(Zv))
(breusch_pagan_standardised_p = pvalue(WhiteTest(hcat(ones(length(r)), Zv), r; type=:linear)),
 jarque_bera_p = pvalue(JarqueBeraTest(r)), sd_standardised = round(sqrt(sum(abs2, r) / length(r)), digits=3))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "intervals"
label = "Prediction Intervals"
desc = "95% prediction intervals whose width follows the fitted variance, with their in-sample coverage: close to 95% for the model, while constant-width OLS bands miss in the noisy region"
code = '''
using Plots, Statistics
s = sqrt.(variance(Zv))
o = sortperm(fitted(result))
f = fitted(result)
s_ols = sqrt(sigma2(ols(Xm, yv)))  # OLS residual standard deviation
Plots.scatter(f, yv, ms=2.5, alpha=0.5, label="data", xlabel="fitted value", ylabel="y")
display(Plots.plot!(f[o], f[o], ribbon=1.96 .* s[o], fillalpha=0.25, lw=1.5, label="95% interval"))
(coverage_model = round(mean(abs.(residuals(result)) .<= 1.96 .* s), digits=3), coverage_constant_width = round(mean(abs.(residuals(result)) .<= 1.96s_ols), digits=3))
'''

[[actionGroups.actions]]
id = "forecast"
label = "Predict at New Values"
desc = "Point predictions and 95% intervals at the new regressor rows; the interval width comes from the variance model evaluated at the new drivers (parameter uncertainty ignored)"
code = '''
Xn = reshape(Float64.({{xnew}}), :, size(Xm, 2))
Zn = {{znew}} === nothing ? Xn : reshape(Float64.({{znew}}), size(Xn, 1), :)
m = hcat(ones(size(Xn, 1)), Xn) * coef(result)
s = sqrt.(variance(Zn))
[(row = i, prediction = round(m[i], digits=4), sd = round(s[i], digits=4), lower95 = round(m[i] - 1.96s[i], digits=4), upper95 = round(m[i] + 1.96s[i], digits=4)) for i in eachindex(m)]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-ols"
label = "Compare with OLS"
desc = "OLS with classical and White (HC1) standard errors against the weighted estimates: robust errors fix inference, weighting also gains precision"
code = '''
using LinearAlgebra
fit_ols = ols(Xm, yv)  # OLS: HARE adds the intercept
X1 = hcat(ones(length(yv)), Xm)
e = residuals(fit_ols)
B = inv(transpose(X1) * X1)
hc1 = sqrt.(diag(B * (transpose(X1) * (e .^ 2 .* X1)) * B) .* length(yv) ./ (length(yv) - size(X1, 2)))  # White HC1 standard errors
[(term = n, ols = round(a, digits=4), ols_se = round(sa, digits=4), white_se = round(w, digits=4), weighted = round(b, digits=4), weighted_se = round(sb, digits=4))
 for (n, a, sa, w, b, sb) in zip(coefnames(result), coef(fit_ols), stderror(fit_ols), hc1, coef(result), stderror(result))]
'''

[[actionGroups.actions]]
id = "links"
label = "Compare Variance Models"
desc = "All four variance models fitted by two-step FWLS and scored by their Gaussian log-likelihood and AIC: the best-fitting shape of the heteroskedasticity"
code = '''
Z1 = hcat(ones(length(yv)), Zv)
function fit_or_skip(name, fit, v)  # Quadratic and Linear stop with an error if a fitted value reaches zero
    try
        return (name, fit(), v)
    catch e
        e isa ArgumentError || rethrow()
        println(name, " not fitted. ", e.msg)
        return nothing
    end
end
fits = filter(!isnothing, [fit_or_skip("Exponential", () -> exponential_fwls(Xm, yv; Z=Zm), g -> exp.(Z1 * g)),
        fit_or_skip("Power", () -> power_fwls(Xm, yv; Z=Zv), g -> exp.(hcat(ones(length(yv)), log.(abs.(Zv))) * g)),
        fit_or_skip("Quadratic", () -> quadratic_fwls(Xm, yv; Z=Zm), g -> max.(Z1 * g, 1e-8) .^ 2),
        fit_or_skip("Linear", () -> linear_fwls(Xm, yv; Z=Zm), g -> max.(Z1 * g, 1e-10))])
loglik(r, v) = -0.5 * sum(log.(2pi .* v) .+ residuals(r) .^ 2 ./ v)
rows = [(model = n, loglik = round(loglik(r, v(r.gamma)), digits=2), aic = round(-2loglik(r, v(r.gamma)) + 2(length(coef(r)) + length(r.gamma)), digits=2), coef = round.(coef(r), digits=4)) for (n, r, v) in fits]
sort(rows, by = r -> r.aic)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "variance-equation"
label = "Variance Equation"
desc = "What each variance parameter means for the spread of y; their standard errors and p-values are in the printed result"
code = '''
names = ["intercept"; ["z$j" for j in 1:size(Zv, 2)]]
{{?model=exponential}} meaning(j, g) = j == 1 ? "log of the baseline variance" : "each unit of z$(j-1) multiplies the variance by $(round(exp(g), digits=3))"
{{?model=power}} meaning(j, g) = j == 1 ? "log of the baseline variance" : "elasticity: a 1% rise in |z$(j-1)| raises the variance by $(round(g, digits=3))%"
{{?model=quadratic}} meaning(j, g) = j == 1 ? "baseline standard deviation" : "each unit of z$(j-1) adds $(round(g, digits=4)) to the standard deviation"
{{?model=linear}} meaning(j, g) = j == 1 ? "baseline variance" : "each unit of z$(j-1) adds $(round(g, digits=4)) to the variance"
[(parameter = names[j], estimate = round(g, digits=4), meaning = meaning(j, g))
 for (j, g) in enumerate(result.gamma)]
'''

[[actionGroups.actions]]
id = "coefficients"
label = "Coefficients"
desc = "Mean-equation estimates with weighted standard errors, t statistics, p-values and 95% confidence intervals"
code = '''
ci = confint(result)
[(term = n, estimate = round(b, digits=4), std_error = round(s, digits=4), t = round(t, digits=2), p = round(p, digits=4), lower95 = round(ci[i, 1], digits=4), upper95 = round(ci[i, 2], digits=4))
 for (i, (n, b, s, t, p)) in enumerate(zip(coefnames(result), coef(result), stderror(result), tstat(result), pvalues(result)))]
'''

# ── FAQ: shown in Learn More, and the Panel FAQ test set of Evaluate Answering Models (hidden = true: the test set only) ──

[[faq]]
question = "Which variance form should I choose?"
wiki = "Decision Guide"
answer = """
Exponential when the spread grows multiplicatively with the drivers, or when theory favours no form: the variance is always positive and any real driver is allowed. Power when the variance scales with a power of a non-zero size variable; its slopes are elasticities of the variance. Quadratic when the standard deviation grows in a straight line with z. Linear when the variance itself is additive in z, with fitted values well above zero.

Compare Variance Models ranks the four forms by AIC, approximately: a difference of a few units is weak evidence.
"""

[[faq]]
question = "Should I model the variance or just use robust standard errors?"
wiki = "Decision Guide"
answer = """
When the aim is valid inference on OLS and no variance form has support, leave the coefficients alone: `white_se` in Compare with OLS gives that inference without assuming any form. Model the variance when the form is credible, when the efficiency gain matters, or when the prediction intervals need to follow the spread. Romano and Wolf (2017) argue for a combination, weighted fits with robust standard errors.
"""

[[faq]]
question = "FWLS or maximum likelihood?"
wiki = "Decision Guide"
answer = """
Maximum likelihood is efficient when the errors are normal and the variance form is right, but more sensitive to a small misspecification of the form. Two-step and Iterated FWLS need no optimiser, but their coefficient standard errors treat the fitted weights as known. Use FWLS when the optimiser struggles, and compare its standard errors with the likelihood fit when you can.
"""

[[faq]]
question = "Why does this tab stop with an error about fitted values reaching zero?"
wiki = "Assumptions"
hidden = true
answer = """
The Linear and Quadratic forms can produce zero or negative fitted values for some rows, and no weight exists for such a row, so `HARE.jl` stops with an error that gives the number of rows. A value below 1e-6 of the mean fitted value counts as zero. It usually means a straight line is the wrong form; use Exponential, Power, or OLS with robust standard errors.
"""

[[faq]]
question = "Can I use a dummy variable as a variance driver with the Power form?"
wiki = "Power"
hidden = true
answer = """
No: Power takes logarithms of the absolute drivers, so every driver must be non-zero. A dummy or a value close to zero gets a very large negative logarithm and great leverage in the auxiliary regression, which gives meaningless exponents. The default drivers, `nothing`, use every regressor, so a dummy in X breaks this too. Use Exponential when the drivers contain zeros.
"""

[[faq]]
question = "Are the prediction intervals of Predict at New Values too narrow?"
wiki = "Interpretation"
hidden = true
answer = """
Yes. The interval is 1.96 times the fitted error standard deviation at the new drivers, around the prediction, and it ignores the uncertainty in beta and gamma, so it is too narrow, most of all far from the data. When Variance drivers (Z) was set, supply New variance drivers too.
"""
