[[codeBranches]]
model = "sdp"
code = '''
using JuMP, {{solver}}, LinearAlgebra, Random

Random.seed!(1)
n = {{n}}  # matrix dimension
C = {{C}}  # symmetric cost matrix

model = Model({{solver}}.Optimizer)
set_silent(model)
@variable(model, X[1:n, 1:n], PSD)  # n x n positive semidefinite matrix variable
@objective(model, {{sense}}, tr(C * X))
con = @constraint(model, {{cons}})
optimize!(model)

# re-solve with a new right-hand side (used by the Parametric Sweep)
resolve(v) = (set_normalized_rhs(con, v); optimize!(model); objective_value(model))
rhs0 = normalized_rhs(con)  # original right-hand side, restored after the sweep
grid = rhs0 .* range(0.25, 2, length=15)
param_name = "constraint right-hand side"
X_opt = value.(X)
(status = termination_status(model), objective = objective_value(model), eigenvalues_C = eigvals(Symmetric(C)))
'''

[[codeBranches]]
model = "sdprelax"
code = '''
using JuMP, {{solver}}, LinearAlgebra, Random

Random.seed!(1)
n = {{n}}  # number of nodes
W = {{W}}  # symmetric edge weights
L = Diagonal(vec(sum(W, dims=2))) - W  # graph Laplacian: cut(x) = x' L x / 4 for x in {-1, 1}^n
cutvalue(x) = dot(x, L, x) / 4

model = Model({{solver}}.Optimizer)
set_silent(model)
@variable(model, X[1:n, 1:n], PSD)  # relaxes x x' (the Gram matrix of unit node vectors)
@objective(model, Max, tr(L * X) / 4)
@constraint(model, diag(X) .== 1)  # unit vectors
optimize!(model)
X_opt = value.(X)

# Goemans-Williamson rounding: node vectors V, cut by random hyperplanes, keep the best
V = cholesky(Symmetric(X_opt + 1e-8I)).U
function round_cut(trials=100)
    cuts = [sign.(V' * randn(n)) for _ in 1:trials]
    cuts[argmax(cutvalue.(cuts))]
end
x_cut = round_cut()

resolve(v) = (Random.seed!(1); cutvalue(round_cut(round(Int, v))))  # best cut vs number of rounding trials
grid = [1, 2, 5, 10, 20, 50, 100, 200]
param_name = "rounding trials"
(status = termination_status(model), sdp_bound = objective_value(model), cut = cutvalue(x_cut),
 ratio = cutvalue(x_cut) / objective_value(model), partition = x_cut)  # ratio >= 0.878 in expectation
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "matrix-heatmap"
label = "Matrix Heatmap"
desc = "The optimal PSD matrix X"
code = '''
using Plots

heatmap(X_opt, aspect_ratio=:equal, yflip=true, color=:RdBu, clims=(-1, 1) .* maximum(abs, X_opt), title="optimal X")
'''

[[actionGroups.actions]]
id = "eigenvalues"
label = "Eigenvalue Spectrum"
desc = "Eigenvalues of X: all non-negative when PSD; a single non-zero one means rank 1"
code = '''
using Plots

bar(sort(eigvals(Symmetric(X_opt)), rev=true), xlabel="index", ylabel="eigenvalue", legend=false)
hline!([0], linestyle=:dash, color=:red)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "feasibility"
label = "Feasibility Check"
desc = "Termination, primal and dual status, the smallest eigenvalue of X and any violated constraint"
code = '''
(termination = termination_status(model), primal = primal_status(model), dual = dual_status(model),
 min_eigenvalue = eigmin(Symmetric(X_opt)),  # >= -tolerance
 violated = primal_feasibility_report(model; atol=1e-6))  # empty Dict = feasible
'''

[[actionGroups.actions]]
id = "rank-check"
label = "Rank Check"
desc = "Numerical rank of X: rank 1 means the relaxation is tight (the SDP solves the original problem)"
code = '''
ev = eigvals(Symmetric(X_opt))
(rank = count(>(1e-6 * maximum(ev)), ev), eigenvalues = round.(ev; digits=6))
'''

[[actionGroups.actions]]
id = "duality-gap"
label = "Duality Gap"
desc = "Primal and dual objectives and their relative gap: near 0 certifies optimality"
code = '''
primal = objective_value(model)
dual   = dual_objective_value(model)
(primal = primal, dual = dual, relative_gap = abs(primal - dual) / (1 + abs(primal)))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity Analysis"
desc = "Shadow prices of the scalar constraints: the change in the optimal value per unit change in each right-hand side"
code = '''
cons = all_constraints(model, AffExpr, MOI.EqualTo{Float64})
append!(cons, all_constraints(model, AffExpr, MOI.LessThan{Float64}), all_constraints(model, AffExpr, MOI.GreaterThan{Float64}))
[(constraint = c, shadow_price = shadow_price(c)) for c in cons]
'''

[[actionGroups.actions]]
id = "parametric"
label = "Parametric Sweep"
desc = "SDP: the optimal value across a range of the constraint's right-hand side. Relaxation: the best rounded cut against the number of rounding trials"
code = '''
using Plots

vals = resolve.(grid)
{{?model=sdp}} resolve(rhs0)  # restore the original right-hand side and solution
plot(grid, vals, marker=:circle, xlabel=param_name, ylabel="value", legend=false)
{{?model=sdprelax}} hline!([objective_value(model)], linestyle=:dash, label="SDP bound")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "solver-compare"
label = "Solver Comparison"
desc = "Clarabel, COSMO, SCS and Hypatia on the same problem: status, objective and time"
code = '''
using Clarabel, COSMO, SCS, Hypatia

res = map(["Clarabel" => Clarabel.Optimizer, "COSMO" => COSMO.Optimizer, "SCS" => SCS.Optimizer, "Hypatia" => Hypatia.Optimizer]) do (name, opt)
    set_optimizer(model, opt)
    set_silent(model)
    t = @elapsed optimize!(model)
    (solver = name, status = termination_status(model), objective = objective_value(model), seconds = t)
end
set_optimizer(model, {{solver}}.Optimizer); set_silent(model); optimize!(model)  # back on the chosen solver for later actions
res
'''

[[actionGroups.actions]]
id = "baseline"
label = "vs Baseline"
desc = "SDP: the optimum against the extreme eigenvalues of C (equal when the constraint is tr(X) == 1). Relaxation: the SDP bound and rounded cut against a random partition and brute force (n <= 20)"
code = '''
{{?model=sdp}} ev = eigvals(Symmetric(C))
{{?model=sdp}} (sdp = objective_value(model), lambda_min = minimum(ev), lambda_max = maximum(ev))
{{?model=sdprelax}} brute = n <= 20 ? maximum(cutvalue([(k >> i) & 1 == 1 ? 1.0 : -1.0 for i in 0:n-1]) for k in 0:2^(n-1)-1) : missing
{{?model=sdprelax}} (sdp_bound = objective_value(model), rounded = cutvalue(x_cut), random = cutvalue(rand([-1.0, 1.0], n)), optimum = brute)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "dual-matrix"
label = "Dual Matrix"
desc = "The dual PSD matrix S of the constraint X in PSD, and complementarity tr(X S) (about 0 at the optimum)"
code = '''
psd = only(all_constraints(model, Vector{VariableRef}, MOI.PositiveSemidefiniteConeTriangle))
S = Symmetric(reshape_vector(dual(psd), SymmetricMatrixShape(n)))
(complementarity = tr(X_opt * S), dual_eigenvalues = eigvals(S))
'''

[[actionGroups.actions]]
id = "eigenvectors"
label = "Eigenvector Extraction"
desc = "Leading eigenvector of X: the SDP solution in the rank-1 case (SDP), or a deterministic partition by its signs (relaxation)"
code = '''
F = eigen(Symmetric(X_opt))
v1 = F.vectors[:, end]  # eigenvector of the largest eigenvalue
{{?model=sdp}} (leading_eigenvalue = F.values[end], share_of_trace = F.values[end] / tr(X_opt), vector = v1)
{{?model=sdprelax}} x_eig = sign.(v1)
{{?model=sdprelax}} (leading_eigenvalue = F.values[end], partition = x_eig, cut = cutvalue(x_eig), rounded_cut = cutvalue(x_cut))
'''
