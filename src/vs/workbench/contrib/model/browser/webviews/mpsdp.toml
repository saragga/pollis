[[models]]
id = "sdp"
label = "Semidefinite Programming"

[[models]]
id = "sdprelax"
label = "SDP Relaxation"

[[decisionRows]]
task = "Semidefinite Programming"
context = "Optimising over a positive semidefinite matrix: eigenvalue bounds, covariance and kernel fitting, control (LMIs)"
purpose = "Linear objective in X subject to linear constraints and X being PSD"

[[decisionRows]]
task = "SDP Relaxation"
context = "Hard combinatorial problems with +/-1 decisions, such as max-cut or graph partitioning"
purpose = "Lift x x' to a PSD matrix for an upper bound, then round it back to a partition (Goemans-Williamson)"

[[inputs]]
id = "n"
label = "n"
tooltip = "Matrix dimension: X is an n x n positive semidefinite matrix (for the relaxation, n is the number of graph nodes)."
default = "6"

[[inputs]]
id = "C"
label = "Cost Matrix C"
tooltip = "Symmetric n x n matrix of the objective tr(C X). With the default constraint tr(X) == 1, the minimum is the smallest eigenvalue of C."
default = "Symmetric(randn(n, n))"
models = ["sdp"]

[[inputs]]
id = "cons"
label = "Constraint"
tooltip = "One scalar linear constraint in X, for example tr(X) == 1 or X[1, 1] + X[2, 2] <= 2. The Parametric Sweep varies its right-hand side."
default = "tr(X) == 1"
models = ["sdp"]

[[inputs]]
id = "sense"
label = "Sense"
tooltip = "Direction of optimisation: Minimise or Maximise."
kind = "select"
default = "Min"
models = ["sdp"]

[[inputs.options]]
value = "Min"
label = "Minimise"

[[inputs.options]]
value = "Max"
label = "Maximise"

[[inputs]]
id = "W"
label = "Weight Matrix W"
tooltip = "Symmetric n x n matrix of non-negative edge weights of the graph to cut (0 = no edge). The default is a random graph."
default = "(E = triu(rand(n, n) .< 0.5, 1); float.(E + E'))"
models = ["sdprelax"]

[[inputs]]
id = "solver"
label = "Solver"
tooltip = "Clarabel: interior point, the default and most accurate. COSMO: ADMM, lower memory for large sparse problems. SCS: first-order, very large problems when a rough bound suffices. Hypatia: interior point, robust on degenerate or ill-conditioned problems."
kind = "select"
default = "Clarabel"
newRow = true

[[inputs.options]]
value = "Clarabel"
label = "Clarabel"

[[inputs.options]]
value = "COSMO"
label = "COSMO"

[[inputs.options]]
value = "SCS"
label = "SCS"

[[inputs.options]]
value = "Hypatia"
label = "Hypatia"

