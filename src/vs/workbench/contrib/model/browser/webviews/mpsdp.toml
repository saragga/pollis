[miniCharts.sdprelax]
# A small graph split by a cut
svg = '''
var p = [[12, 32], [20, 58], [36, 30], [42, 56]], e = [[0, 1], [0, 2], [1, 3], [2, 3], [0, 3]], s = '';
e.forEach(function (d) { s += '<line x1="' + p[d[0]][0] + '" y1="' + p[d[0]][1] + '" x2="' + p[d[1]][0] + '" y2="' + p[d[1]][1] + '" stroke="currentColor" stroke-width="1" opacity="0.6"/>'; });
p.forEach(function (q, i) { s += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="3.2" fill="currentColor" fill-opacity="' + (i % 3 === 0 ? 1 : 0.3) + '" stroke="currentColor"/>'; });
return s + '<line x1="27" y1="24" x2="29" y2="66" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3,2"/>';
