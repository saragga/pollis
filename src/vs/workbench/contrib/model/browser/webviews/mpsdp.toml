for (var i = 0; i < 3; i++) { for (var j = 0; j < 3; j++) { s += '<rect x="' + (10 + j * 11.5) + '" y="' + (28 + i * 11.5) + '" width="10.5" height="10.5" fill="currentColor" fill-opacity="' + v[i][j] + '"/>'; } }
return s;
