[[codeBranches]]
model = "esn"
code = '''
using Flux, LinearAlgebra

input_size     = {{input-size}}  # input features per time step
reservoir_size = {{reservoir-size}}  # fixed reservoir neurons
output_size    = {{output-size}}  # output dimension
alpha          = {{leaking-rate}}  # leaking rate in (0, 1]
rho            = {{spectral-radius}}  # target spectral radius
sparsity       = {{sparsity}}  # fraction of zero reservoir weights

W_in  = randn(Float32, reservoir_size, input_size) .* 0.1f0  # input weights (fixed)
W_res = randn(Float32, reservoir_size, reservoir_size) .* (rand(Float32, reservoir_size, reservoir_size) .> sparsity)
W_res .*= rho / maximum(abs, eigvals(W_res))  # rescale the fixed reservoir to spectral radius rho

function reservoir_states(x)  # x: input_size x T; returns reservoir_size x T
    h = zeros(Float32, reservoir_size)
    states = map(eachcol(x)) do u
        h = (1 - alpha) .* h .+ alpha .* tanh.(W_in * u .+ W_res * h)  # leaky-integrator update
    end
    reduce(hcat, states)
end

final_states(X) = reduce(hcat, [reservoir_states(X[:, :, i])[:, end] for i in axes(X, 3)])  # one column per sequence
ridge_readout(H, Y, beta) = (Y * H') / (H * H' + beta * I)  # closed-form ridge regression

H = final_states({{xvar}})  # {{xvar}}: input_size x T x sequences
W_out = ridge_readout(H, {{yvar}}, 1e-6)  # the readout is the only fitted weight matrix
model(x) = W_out * final_states(x)
loss(model, x, y) = Flux.mse(model(x), y)
'''

[[codeBranches]]
model = "attn"
code = '''
using Flux

input_size  = {{input-size}}  # input features per time step
hidden_size = {{hidden-size}}  # GRU hidden units
output_size = {{output-size}}  # output dimension
num_heads   = {{num-heads}}  # attention heads (must divide hidden_size)

struct AttnRNN  # GRU encoder, then the last state attends over every step
    rnn; attn; readout
end
Flux.@layer AttnRNN

function (m::AttnRNN)(x)
    H = m.rnn(x)  # hidden_size x T x batch
    c, _ = m.attn(H[:, end:end, :], H, H)  # query: last hidden state; keys and values: all steps
    m.readout(dropdims(c; dims=2))
end

model = AttnRNN(GRU(input_size => hidden_size), MultiHeadAttention(hidden_size; nheads=num_heads), Dense(hidden_size => output_size))

loss(model, x, y) = Flux.mse(model(x), y)
opt_state = Flux.setup(Adam(1f-3), model)
loader = Flux.DataLoader(({{xvar}}, {{yvar}}), batchsize=32, shuffle=true)  # {{xvar}}: input_size x T x sequences
for epoch in 1:100
    Flux.train!(loss, model, loader, opt_state)
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fit-plot"
label = "Predictions vs Targets"
desc = "Scatter every prediction against its target; points should hug the diagonal"
code = '''
using Plots

y_hat = model({{xvar}})
scatter(vec({{yvar}}), vec(y_hat), xlabel="target", ylabel="prediction", alpha=0.5, legend=false)
plot!(identity, extrema(vec({{yvar}}))..., linestyle=:dash)
'''

[[actionGroups.actions]]
id = "hidden-states"
label = "Hidden States"
desc = "Heatmap of the hidden units over time for the first sequence"
code = '''
using Plots

{{?model=esn}} H1 = reservoir_states({{xvar}}[:, :, 1])  # reservoir_size x T
{{?model=lstm|gru}} H1 = dropdims(model[1]({{xvar}}[:, :, 1:1]); dims=3)  # first recurrent layer, units x T
{{?model=attn}} H1 = dropdims(model.rnn({{xvar}}[:, :, 1:1]); dims=3)  # GRU encoder, units x T
heatmap(H1, xlabel="time step", ylabel="unit", title="hidden states, first sequence")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "training-curve"
label = "Training Curve"
desc = "Training MSE per epoch (for the echo state network: per ridge penalty, since its readout is solved in closed form)"
code = '''
using Plots, Statistics

{{?model!=esn}} history = Float32[]
{{?model!=esn}} for epoch in 1:100
{{?model!=esn}}     Flux.train!(loss, model, loader, opt_state)
{{?model!=esn}}     push!(history, mean(loss(model, x, y) for (x, y) in loader))
{{?model!=esn}} end
{{?model!=esn}} plot(history, xlabel="epoch", ylabel="MSE", yscale=:log10, legend=false)
{{?model=esn}} betas = 10.0 .^ (-8:1)
{{?model=esn}} errs = [Flux.mse(ridge_readout(H, {{yvar}}, b) * H, {{yvar}}) for b in betas]
{{?model=esn}} plot(betas, errs, xscale=:log10, xlabel="ridge penalty", ylabel="training MSE", legend=false)
'''

[[actionGroups.actions]]
id = "holdout"
label = "Held-Out Error"
desc = "MSE on the training sequences against held-out sequences; a large gap signals overfitting"
code = '''
(train = loss(model, {{xvar}}, {{yvar}}), test = loss(model, X_test, y_test))  # X_test: input_size x T x m, y_test: output_size x m
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "predict-new"
label = "Predict New Sequences"
desc = "One prediction per new sequence of the same shape as the training data"
code = '''
y_new = model(X_new)  # X_new: input_size x T x m
'''

[[actionGroups.actions]]
id = "multi-step"
label = "Recursive Multi-Step Forecast"
desc = "Feed each one-step prediction back as the newest input to forecast 12 steps ahead"
code = '''
window = {{xvar}}[:, :, end:end]  # most recent input window, input_size x T x 1 (needs input_size == output_size)
forecast = Vector{Float32}[]
for h in 1:12
    y_next = vec(model(window))
    push!(forecast, y_next)
    global window = cat(window[:, 2:end, :], reshape(y_next, :, 1, 1); dims=2)  # slide the window forward
end
reduce(hcat, forecast)  # output_size x 12
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "linear-baseline"
label = "vs Linear Baseline"
desc = "Training MSE of the network against least squares on the flattened input windows (both in-sample; with fewer sequences than features the linear fit can interpolate, MSE near 0)"
code = '''
Z = reshape({{xvar}}, :, size({{xvar}}, 3))  # flatten each window into one feature vector
Z1 = vcat(Z, ones(Float32, 1, size(Z, 2)))  # add an intercept row
W = {{yvar}} / Z1  # least-squares coefficients
(network = loss(model, {{xvar}}, {{yvar}}), linear = Flux.mse(W * Z1, {{yvar}}), linear_can_interpolate = size(Z1, 1) >= size(Z1, 2))  # in-sample for both
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "saliency"
label = "Input Saliency"
desc = "Gradient of the prediction with respect to every input feature and time step of one sequence"
code = '''
using Plots

x = {{xvar}}[:, :, 1:1]
g = Flux.gradient(x -> sum(model(x)), x)[1]
heatmap(abs.(dropdims(g; dims=3)), xlabel="time step", ylabel="input feature", title="|d prediction / d input|")
'''
