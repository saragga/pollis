[[codeBranches]]
model = "lstm"
code = '''
using Flux, Statistics

input_size  = {{input-size}}  # input features per time step
hidden_size = {{hidden-size}}  # hidden units per layer
output_size = {{output-size}}  # output dimension
num_layers  = {{num-layers}}  # stacked LSTM layers

{{?direction=uni}} layer(n_in) = LSTM(n_in => hidden_size)
{{?direction=uni}} width = hidden_size
{{?direction=bi}} struct BiRNN  # forward and backward pass over the same sequence
{{?direction=bi}}     fwd; bwd
{{?direction=bi}} end
{{?direction=bi}} Flux.@layer BiRNN
{{?direction=bi}} (b::BiRNN)(x) = vcat(b.fwd(x), reverse(b.bwd(reverse(x; dims=2)); dims=2))
{{?direction=bi}} layer(n_in) = BiRNN(LSTM(n_in => hidden_size), LSTM(n_in => hidden_size))
{{?direction=bi}} width = 2hidden_size  # forward and backward states side by side

model = Chain(
    layer(input_size),
    [layer(width) for _ in 2:num_layers]...,
    Dropout({{dropout}}),
{{?direction=uni}}     x -> x[:, end, :],  # last hidden state of every sequence
{{?direction=bi}}     x -> dropdims(mean(x; dims=2); dims=2),  # average over time: both directions see the whole sequence
    Dense(width => output_size),
)

loss(model, x, y) = Flux.mse(model(x), y)
opt_state = Flux.setup(Adam(1f-3), model)
loader = Flux.DataLoader(({{xvar}}, {{yvar}}), batchsize=32, shuffle=true)  # {{xvar}}: input_size x T x sequences
for epoch in 1:100
    Flux.train!(loss, model, loader, opt_state)
end
'''

[[codeBranches]]
model = "gru"
code = '''
using Flux, Statistics

input_size  = {{input-size}}  # input features per time step
hidden_size = {{hidden-size}}  # hidden units per layer
output_size = {{output-size}}  # output dimension
num_layers  = {{num-layers}}  # stacked GRU layers

{{?direction=uni}} layer(n_in) = GRU(n_in => hidden_size)
{{?direction=uni}} width = hidden_size
{{?direction=bi}} struct BiRNN  # forward and backward pass over the same sequence
{{?direction=bi}}     fwd; bwd
{{?direction=bi}} end
{{?direction=bi}} Flux.@layer BiRNN
{{?direction=bi}} (b::BiRNN)(x) = vcat(b.fwd(x), reverse(b.bwd(reverse(x; dims=2)); dims=2))
{{?direction=bi}} layer(n_in) = BiRNN(GRU(n_in => hidden_size), GRU(n_in => hidden_size))
{{?direction=bi}} width = 2hidden_size  # forward and backward states side by side

model = Chain(
    layer(input_size),
    [layer(width) for _ in 2:num_layers]...,
    Dropout({{dropout}}),
{{?direction=uni}}     x -> x[:, end, :],  # last hidden state of every sequence
{{?direction=bi}}     x -> dropdims(mean(x; dims=2); dims=2),  # average over time: both directions see the whole sequence
    Dense(width => output_size),
)

loss(model, x, y) = Flux.mse(model(x), y)
opt_state = Flux.setup(Adam(1f-3), model)
loader = Flux.DataLoader(({{xvar}}, {{yvar}}), batchsize=32, shuffle=true)  # {{xvar}}: input_size x T x sequences
for epoch in 1:100
