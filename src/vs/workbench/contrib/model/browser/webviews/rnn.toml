[[models]]
id = "lstm"
label = "LSTM"

[[models]]
id = "gru"
label = "GRU"

[[models]]
id = "esn"
label = "Echo State"

[[models]]
id = "attn"
label = "Attention"

[[bullets]]
text = "LSTM"
detail = "gated cell with separate memory stream; excels at long-range dependencies"

[[bullets]]
text = "GRU"
detail = "simplified gating with fewer parameters; often matches LSTM on shorter sequences"

[[bullets]]
text = "Echo State Network"
detail = "fixed random reservoir; only the readout layer is trained"

[[bullets]]
text = "Attention-Augmented"
detail = "recurrent encoder followed by multi-head attention over hidden states"

[[decisionRows]]
task = "LSTM"
context = "Long sequences with long-range dependencies"
purpose = "Separate memory cell protected by input, forget and output gates"

[[decisionRows]]
task = "GRU"
context = "Shorter sequences or limited data"
purpose = "Two gates and fewer parameters; often matches LSTM"

[[decisionRows]]
task = "Echo State"
context = "Chaotic or fast dynamics, very little tuning budget"
purpose = "Fixed random reservoir; only a linear readout is fitted, in closed form"

[[decisionRows]]
task = "Attention"
context = "The relevant time steps vary between sequences"
purpose = "Recurrent encoder plus attention over every hidden state"

[[inputs]]
id = "xvar"
label = "Sequence data"
tooltip = "input_size x T x n array: n sequences of T time steps, each step a vector of input_size features."
default = "X"

[[inputs]]
id = "yvar"
label = "Target variable"
tooltip = "output_size x n matrix: one target vector per sequence (e.g. the next value after the window)."
default = "y"

[[inputs]]
id = "input-size"
label = "input_size"
tooltip = "Number of features observed at each time step."
default = "10"
newRow = true

[[inputs]]
id = "output-size"
label = "output_size"
tooltip = "Dimension of the prediction made from each sequence."
default = "1"

[[inputs]]
id = "hidden-size"
label = "hidden_size"
tooltip = "Number of hidden units in each recurrent layer. Larger values increase capacity but also memory use and training time. For attention it must be divisible by num_heads. Typical range: 32-512."
default = "64"
models = ["lstm", "gru", "attn"]

[[inputs]]
id = "num-layers"
label = "num_layers"
tooltip = "Number of stacked recurrent layers. Deeper stacks can capture more abstract temporal patterns. Typical range: 1-4."
default = "1"
models = ["lstm", "gru"]
newRow = true

[[inputs]]
id = "dropout"
label = "dropout"
tooltip = "Dropout probability applied to the recurrent output before the readout. Set to 0 to disable. Typical range: 0.1-0.5."
default = "0.0"
models = ["lstm", "gru"]

[[inputs]]
id = "direction"
label = "Direction"
tooltip = "Unidirectional reads the sequence forwards and predicts from the last hidden state. Bidirectional adds a second layer that reads it backwards and averages both over time: useful when the whole sequence is known in advance (classification, tagging), not for forecasting."
kind = "select"
default = "uni"
models = ["lstm", "gru"]

[[inputs.options]]
value = "uni"
label = "Unidirectional"

[[inputs.options]]
value = "bi"
label = "Bidirectional"

[[inputs]]
id = "reservoir-size"
label = "reservoir_size"
tooltip = "Number of neurons in the fixed random reservoir. More neurons give higher memory capacity. Typical range: 100-2000."
default = "100"
models = ["esn"]
newRow = true

[[inputs]]
id = "spectral-radius"
label = "rho (spectral)"
tooltip = "Largest eigenvalue magnitude of the reservoir weight matrix. Values < 1 ensure the echo state property (fading memory). Typical range: 0.7-0.99."
default = "0.9"
models = ["esn"]

[[inputs]]
id = "sparsity"
label = "sparsity"
tooltip = "Fraction of reservoir connections set to zero. Sparse reservoirs (0.8-0.99) are computationally efficient and often generalise better."
default = "0.9"
models = ["esn"]

[[inputs]]
id = "leaking-rate"
label = "alpha (leaking)"
tooltip = "Leaking rate alpha in (0, 1]. Controls how fast reservoir states respond to new inputs. Lower values produce slower, smoother dynamics."
default = "0.3"
models = ["esn"]

[[inputs]]
id = "num-heads"
label = "num_heads"
tooltip = "Number of parallel attention heads. Each head attends to a different subspace of the hidden states. Must divide hidden_size evenly. Typical: 4 or 8."
default = "4"
models = ["attn"]
newRow = true

