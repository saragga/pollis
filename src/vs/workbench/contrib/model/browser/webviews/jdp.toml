[[decisionRows]]
task = "Compound Poisson"
context = "Any jump-size distribution"
purpose = "Rare discrete events with arbitrary jump sizes; constant arrival rate lambda"

[[decisionRows]]
task = "Gaussian Jumps"
context = "Normal(muJ, sigmaJ) jump sizes"
