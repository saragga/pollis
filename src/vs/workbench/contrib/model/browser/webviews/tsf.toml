[[decisionRows]]
task = "LOESS"
context = "Exploring the shape of a trend without committing to a model; no forecast beyond a short extrapolation"
purpose = "Locally weighted polynomial regression on time: a smooth trend whose flexibility is set by the span"

[[decisionRows]]
task = "Local Level / Trend"
context = "A series that wanders with no seasonality: a level (random walk plus noise) or a level with a drifting slope"
purpose = "Separates signal from noise with the Kalman filter; the signal-to-noise ratio decides how quickly the level adapts"

[[decisionRows]]
task = "Seasonal Model"
context = "A trending series with a stable seasonal pattern of known period"
purpose = "Basic structural model: stochastic level, slope and dummy seasonal, each with its own variance"

[[decisionRows]]
task = "ETS Framework"
context = "Operational forecasting of many series; a fast, reliable benchmark"
purpose = "Exponential smoothing in state space form: weighted averages of the past with optional (damped) trend and seasonality"

[[decisionRows]]
task = "ARIMA"
context = "Series whose autocorrelation structure, after differencing, is short and regular"
purpose = "Differenced autoregressive moving-average model; the order is picked from the ACF and PACF or by AICc"

[[decisionRows]]
task = "Unobserved Components"
context = "When trend, seasonal and cycle should be estimated and read as separate components"
purpose = "Harvey's structural model: choose a trend type and stochastic or deterministic seasonality, all estimated jointly"

[[inputs]]
