tooltip = "Forecast horizon in observations."
default = "12"

[[inputs]]
id = "span"
label = "Span"
tooltip = "Share of the data in each local fit: small values follow the data closely, large values give a smoother trend. Typical: 0.3 to 0.9."
default = "0.5"
