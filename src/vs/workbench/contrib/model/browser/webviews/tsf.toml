# Time-Series Forecasting Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/tsf.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Time-Series Forecasting"
viewType = "pollis.tsf"
defaultModel = "loess"

[[packages]]
name = "StateSpaceModels.jl"
github = "https://github.com/LAMPSPUC/StateSpaceModels.jl"

[requires]
packages = ["Loess.jl", "Plots.jl", "HypothesisTests.jl", "StatsBase.jl"]

