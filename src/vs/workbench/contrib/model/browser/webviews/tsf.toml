[[codeBranches]]
model = "loess"
code = '''
using Loess

y = Float64.({{yvar}})
t = collect(1.0:length(y))  # time index
build(y) = loess(collect(1.0:length(y)), y; span={{span}}, degree={{degree}})
model = build(y)  # local polynomial regression on time
trend = predict(model, t)
fc = predict(model, [Float64(length(y))])[1] .+ (trend[end] - trend[end-1]) .* (1:{{h}})  # extrapolate the last local slope
(span = {{span}}, degree = {{degree}}, residual_sd = sqrt(sum(abs2, y .- trend) / (length(y) - 1)), forecast = round.(fc, digits=3))
'''

[[codeBranches]]
model = "local"
code = '''
using StateSpaceModels

y = Float64.({{yvar}})
build(y) = {{ltype}}(y)
model = build(y)
fit!(model)  # maximum likelihood via the Kalman filter
print_results(model)
'''

[[codeBranches]]
model = "seasonal"
code = '''
using StateSpaceModels

y = Float64.({{yvar}})
build(y) = BasicStructural(y, {{period}})  # level + slope + seasonal({{period}})
model = build(y)
fit!(model)  # maximum likelihood via the Kalman filter
print_results(model)
'''

[[codeBranches]]
model = "ets"
code = '''
using StateSpaceModels

y = Float64.({{yvar}})
{{?etstrend=none}} build(y) = ExponentialSmoothing(y; seasonal={{period}})  # level only, plus a seasonal component of period {{period}} (0: simple exponential smoothing)
{{?etstrend=additive}} build(y) = ExponentialSmoothing(y; trend=true, seasonal={{period}})  # Holt's linear trend, plus seasonal period {{period}} (0: none)
{{?etstrend=damped}} build(y) = ExponentialSmoothing(y; trend=true, damped_trend=true, seasonal={{period}})  # damped trend, plus seasonal period {{period}} (0: none)
model = build(y)
fit!(model)  # maximum likelihood via the Kalman filter
print_results(model)
'''

[[codeBranches]]
model = "arima"
code = '''
using StateSpaceModels

y = Float64.({{yvar}})
build(y) = SARIMA(y; order={{order}})
model = build(y)  # ARIMA{{order}}
fit!(model)  # maximum likelihood via the Kalman filter
print_results(model)
'''

[[codeBranches]]
model = "ucm"
code = '''
using StateSpaceModels

y = Float64.({{yvar}})
{{?ucseas!=no}} build(y) = UnobservedComponents(y; trend="{{uctrend}}", seasonal="{{ucseas}} {{period}}")
{{?ucseas=no}} build(y) = UnobservedComponents(y; trend="{{uctrend}}")
model = build(y)
fit!(model)  # maximum likelihood via the Kalman filter
print_results(model)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "plot-fit"
label = "Fitted Values"
desc = "The data against the model's in-sample fit (smoothed trend for LOESS, one-step-ahead predictions for the state space models)"
code = '''
using Plots
{{?model=loess}} fit = trend; lab = "LOESS trend"
{{?model!=loess}} fit = y .- vec(get_innovations(kalman_filter(model))); lab = "one-step prediction"
{{?model!=loess}} fit[1:2] .= NaN  # diffuse start
plot(y, lw=1.5, label="data", xlabel="t", title="Fitted values")
plot!(fit, lw=1.5, ls=:dash, label=lab)
'''

[[actionGroups.actions]]
id = "decomposition"
label = "Components"
desc = "Smoothed states of the model (level, slope, seasonal ...) from the Kalman smoother; for LOESS, the trend and the remainder"
code = '''
using Plots
{{?model=loess}} plot(plot(t, [y trend], label=["data" "trend"]), plot(t, y .- trend, label="remainder"), layout=(2, 1))
{{?model!=loess}} a = get_smoothed_state(kalman_smoother(model))  # T x states
{{?model!=loess}} k = min(size(a, 2), 3)
{{?model!=loess}} plot(a[:, 1:k], layout=(k, 1), label=permutedims(["state " * string(i) for i in 1:k]), title="Smoothed states", titlefontsize=9)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals"
label = "Residual Analysis"
desc = "Standardised residuals over time and their histogram: they should look like white noise with no pattern or outliers"
code = '''
using Statistics, Plots
{{?model=loess}} r = (y .- trend) ./ std(y .- trend)
{{?model!=loess}} r = filter(isfinite, vec(StateSpaceModels.get_standard_residuals(kalman_filter(model))))[3:end]
plot(plot(r, legend=false, title="Standardised residuals"), histogram(r, legend=false, title="Distribution"), layout=(1, 2))
'''

[[actionGroups.actions]]
id = "ljung-box"
label = "Ljung-Box and ACF"
desc = "Residual autocorrelation with 95% bands and the Ljung-Box test up to lag 20: p above 0.05 means no leftover structure"
code = '''
using HypothesisTests, StatsBase, Plots
{{?model=loess}} r = y .- trend
{{?model!=loess}} r = filter(isfinite, vec(StateSpaceModels.get_standard_residuals(kalman_filter(model))))[3:end]
{{?model=arima}}dof = model.order.p + model.order.q + model.order.P + model.order.Q  # lose one degree of freedom per estimated ARMA coefficient
{{?model!=arima}}dof = 0  # no ARMA coefficients; for the structural models Harvey suggests (number of hyperparameters - 1)
L = max(min(20, div(length(r), 4)), dof + 1)
display((ljung_box_lags = L, dof = dof, p_value = pvalue(LjungBoxTest(r, L, dof))))
bar(1:L, autocor(r, 1:L), legend=false, xlabel="Lag", title="Residual ACF")
hline!([-1.96, 1.96] ./ sqrt(length(r)), c=:red, ls=:dash)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forecast-plot"
label = "Forecast with Intervals"
desc = "Point forecasts over the horizon with 80% and 95% prediction intervals (LOESS: linear extrapolation of the last local slope, no interval)"
code = '''
using Plots
{{?model=loess}} plot(t, y, label="data", title="LOESS trend extrapolation"); plot!(t, trend, label="trend"); plot!(length(y) .+ (1:{{h}}), fc, ls=:dash, label="extrapolation")
{{?model!=loess}} plot(model, forecast(model, {{h}}); label="data", title="Forecast, {{h}} steps")
'''

[[actionGroups.actions]]
id = "intervals"
label = "Forecast Table"
desc = "Mean forecast and 95% prediction interval for each step of the horizon"
code = '''
{{?model=loess}} [(step = i, mean = round(fc[i], digits=3)) for i in 1:{{h}}]
{{?model!=loess}} f = forecast(model, {{h}})
{{?model!=loess}} m = [v[1] for v in f.expected_value]; s = [sqrt(c[1, 1]) for c in f.covariance]
{{?model!=loess}} [(step = i, mean = round(m[i], digits=3), lower95 = round(m[i] - 1.96s[i], digits=3), upper95 = round(m[i] + 1.96s[i], digits=3)) for i in 1:{{h}}]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "aic-bic"
label = "Information Criteria"
desc = "AIC, AICc and BIC of local level, local linear trend, basic structural, ETS (auto_ets) and ARIMA (auto_arima) fitted to the same series; the seasonal auto_arima search can take a couple of minutes"
code = '''
using StateSpaceModels
s = {{period}}
cands = [("Local Level", () -> LocalLevel(y)), ("Local Linear Trend", () -> LocalLinearTrend(y)),
         ("Basic Structural", () -> BasicStructural(y, max(s, 2))), ("ETS (auto)", () -> auto_ets(y; seasonal=s)), ("ARIMA (auto)", () -> auto_arima(y; seasonal=s))]
rows = []
for (name, make) in cands
    m = make(); StateSpaceModels.isfitted(m) || StateSpaceModels.fit!(m)
    skip = StateSpaceModels.default_filter(m).skip_llk_instants  # diffuse instants left out of the likelihood
    push!(rows, (model = name, llk_observations = length(y) - skip, aic = round(m.results.aic, digits=1), aicc = round(m.results.aicc, digits=1), bic = round(m.results.bic, digits=1)))
end
# Each model drops a different number of diffuse start-up observations (differencing order, number of nonstationary states),
# so its likelihood is on a different sample: compare the criteria only between rows with the same llk_observations
length(unique(r.llk_observations for r in rows)) > 1 && @warn "Likelihoods use different numbers of observations; rank only within equal llk_observations"
sort(rows, by = r -> (r.llk_observations, r.aic))
'''

[[actionGroups.actions]]
id = "cross-validate"
label = "Rolling-Origin Backtest"
desc = "Refits the model on expanding windows (last 30% of the data) and scores the forecasts that followed: mean absolute error by horizon"
code = '''
using Statistics, Plots
H = min({{h}}, 12); origins = round.(Int, range(0.7 * length(y), length(y) - H, length=8))
err = zeros(length(origins), H)
for (k, n) in enumerate(origins)
{{?model=loess}}     m = build(y[1:n]); tr = predict(m, collect(1.0:n)); f = tr[end] .+ (tr[end] - tr[end-1]) .* (1:H)
{{?model!=loess}}     m = build(y[1:n]); StateSpaceModels.fit!(m); f = [v[1] for v in forecast(m, H).expected_value]
    err[k, :] = abs.(y[n+1:n+H] .- f)
end
display((mae_by_horizon = round.(vec(mean(err, dims=1)), digits=3),))
plot(1:H, vec(mean(err, dims=1)), marker=:o, lw=2, legend=false, xlabel="Horizon", ylabel="MAE", title="Out-of-sample error by horizon")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "parameters"
label = "Model Parameters"
desc = "Estimated variances and smoothing parameters with standard errors; for LOESS, the span, degree and equivalent smoothness"
code = '''
{{?model=loess}} (span = {{span}}, degree = {{degree}}, observations_per_local_fit = round(Int, {{span}} * length(y)))
{{?model!=loess}} ct = model.results.coef_table
{{?model!=loess}} [(parameter = n, estimate = round(c, sigdigits=4), std_error = round(s, sigdigits=3)) for (n, c, s) in zip(ct.names, ct.coef, ct.std_err)]
'''

[[actionGroups.actions]]
id = "signal-noise"
label = "Adaptiveness"
desc = "How quickly the model reacts to new data: signal-to-noise ratios of the state variances (structural models), the memory implied by the smoothing weights (ETS), the persistence of shocks (ARIMA) or the window of each local fit (LOESS)"
code = '''
{{?model=loess}} (span = {{span}}, observations_per_local_fit = round(Int, {{span}} * length(y)), note = "larger windows react more slowly")
{{?model!=loess}} ct = model.results.coef_table
{{?model=local|seasonal|ucm}} iv = findfirst(n -> endswith(n, "\u03b5") || n == "sigma2_irregular", ct.names)  # observation noise variance
{{?model=local|seasonal|ucm}} [(component = n, variance = round(c, sigdigits=4), ratio_to_noise = round(c / ct.coef[iv], sigdigits=3)) for (n, c) in zip(ct.names, ct.coef) if startswith(n, "sigma2") && n != ct.names[iv]]
{{?model=ets}} [(parameter = n, weight = round(c, digits=4), memory_in_observations = round(1 / max(c, 1e-6), sigdigits=3)) for (n, c) in zip(ct.names, ct.coef) if startswith(n, "smoothing")]
{{?model=arima}} phi = [c for (n, c) in zip(ct.names, ct.coef) if startswith(n, "ar_L")]
{{?model=arima}} (ar_persistence = round(sum(phi; init=0.0), digits=4), shock_half_life = isempty(phi) || sum(phi) <= 0 ? 0.0 : round(log(0.5) / log(min(sum(phi), 0.9999)), digits=2), note = "on the differenced series; with d >= 1 every shock also shifts the level permanently")
'''
