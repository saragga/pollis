# Hyperparameter Tuning Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/hpt.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Hyperparameter Tuning"
viewType = "pollis.hpt"
defaultModel = "grid"

[[packages]]
name = "MLJ.jl"
github = "https://github.com/alan-turing-institute/MLJ.jl"

[[packages]]
name = "TreeParzen.jl"
github = "https://github.com/IQVIA-ML/TreeParzen.jl"

[[packages]]
name = "PollisDatasets.jl"
github = "https://github.com/Trumpingtons/PollisDatasets.jl"

[requires]
packages = ["MLJ.jl", "TreeParzen.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Grid Search"
file = "model-workflow/tutorial-01-grid-search.ipynb"
bundled = true
description = "Exhaustive grid search over hyperparameter combinations with MLJ.jl"

[[notebookSections.notebooks]]
name = "Random Search"
file = "model-workflow/tutorial-02-random-search.ipynb"
bundled = true
description = "Efficient random sampling from parameter distributions with MLJ.jl"

[[notebookSections.notebooks]]
name = "Bayesian Optimisation"
file = "model-workflow/tutorial-03-bayesian-hpt.ipynb"
bundled = true
description = "Bayesian optimisation of hyperparameters with a Tree-structured Parzen Estimator (TreeParzen.jl)"

[[wikis]]
name = "Overview"
file = "model-workflow/hpt-overview.md"
bundled = true

[[wikis]]
name = "Grid Search"
file = "model-workflow/hpt-grid.md"
bundled = true

[[wikis]]
name = "Random Search"
file = "model-workflow/hpt-random.md"
bundled = true

[[wikis]]
name = "Bayesian Optimisation"
file = "model-workflow/hpt-bayesian.md"
bundled = true

[[wikis]]
name = "Choosing a Strategy"
file = "model-workflow/hpt-strategy.md"
bundled = true

[[references]]
separator = true
label = "Original Papers (from packages)"

[[references]]
key = "BKLSA...2020a"

[[models]]
id = "grid"
label = "Grid Search"

[[models]]
id = "random"
label = "Random Search"

[[models]]
id = "bayesian"
label = "Bayesian"

[[bullets]]
text = "Grid Search"
detail = "exhaustive evaluation of every combination in a discrete hyperparameter lattice; exact but scales exponentially with dimension (MLJ.jl)"

[[bullets]]
text = "Random Search"
detail = "sample configurations uniformly from the search space; often finds near-optimal solutions with far fewer evaluations than grid search (MLJ.jl)"

[[bullets]]
text = "Bayesian Optimisation"
detail = "sequential model-guided search with a Tree-structured Parzen Estimator; concentrates budget on promising regions (TreeParzen.jl)"

[[inputs]]
id = "learner"
label = "Model"
tooltip = "MLJ model type, e.g. DecisionTreeClassifier or EvoTreeRegressor. Use @load to import it."
default = "DecisionTreeClassifier"

[[inputs]]
id = "pkg"
label = "Package"
tooltip = "The package that provides the model type, e.g. DecisionTree for DecisionTreeClassifier or EvoTrees for EvoTreeRegressor."
default = "DecisionTree"

[[inputs]]
id = "measure"
label = "Performance Measure"
tooltip = "MLJ measure used to score each configuration, e.g. accuracy, rmse, cross_entropy. Must match your task type."
default = "accuracy"

[[inputs]]
id = "X"
label = "Feature Matrix"
tooltip = "n_samples × n_features matrix or table of input features passed to the machine. The default, X_train, is the Wine data from PollisDatasets: 178 wines by 13 chemical measurements, with their cultivar as y_train. With the default model, DecisionTreeClassifier, the ranges tune max_depth and min_purity_increase; for another model, replace :param1 and :param2 with its hyperparameters."
default = "X_train"

[[inputs]]
id = "y"
label = "Target Vector"
tooltip = "n_samples response vector. Use categorical(y) for classification tasks."
default = "y_train"

[[inputs]]
id = "cv"
label = "CV Folds"
tooltip = "Number of cross-validation folds used to evaluate each hyperparameter configuration. 5 or 10 is typical."
default = "5"

[[inputs]]
id = "resolution"
label = "Resolution"
tooltip = "Number of equally-spaced values sampled per continuous range. Applies to all ranges that do not specify their own values list."
default = "5"
models = ["grid"]

[[inputs]]
id = "niter"
label = "Iterations"
tooltip = "Total number of random configurations to evaluate. More iterations give a better chance of finding the optimum."
default = "50"
models = ["random"]

[[inputs]]
id = "ncalls"
label = "Calls"
tooltip = "Total number of configurations to evaluate. After the first random draws, the Parzen estimator is updated after each call and guides subsequent sampling."
default = "30"
models = ["bayesian"]

[[codeBranches]]
model = "grid"
code = '''
using MLJ
{{?X=X_train}} using PollisDatasets

{{?X=X_train}} w = dataset("wine");  # 178 wines from three cultivars; datasetinfo("wine") describes the columns
{{?X=X_train}} X_train = w[filter(!=(:cultivar), keys(w))];  # the 13 chemical measurements, as a table
{{?X=X_train}} y_train = coerce(w.cultivar, Multiclass);  # the cultivar of each wine, the class to predict

{{learner}} = @load {{learner}} pkg={{pkg}} verbosity=0  # import the model type from its package
model  = {{learner}}()  # instantiate with defaults

{{?learner=DecisionTreeClassifier}} r1 = range(model, :max_depth, values=[2, 3, 4, 5, 6])  # discrete: the depth of the tree
{{?learner=DecisionTreeClassifier}} r2 = range(model, :min_purity_increase, lower=0.001, upper=0.3, scale=:log)  # continuous log-scale: the smallest impurity gain worth a split
{{?learner!=DecisionTreeClassifier}} r1 = range(model, :param1, values=[v1, v2, v3])  # discrete hyperparameter range
{{?learner!=DecisionTreeClassifier}} r2 = range(model, :param2, lower=0.01, upper=1.0, scale=:log)  # continuous log-scale range

tuned = TunedModel(
    model      = model,  # 
    tuning     = Grid(resolution={{resolution}}),  # {{resolution}} values per continuous range
    resampling = CV(nfolds={{cv}}),  # {{cv}}-fold cross-validation
    measure    = {{measure}},  # optimisation criterion
    range      = [r1, r2],
)

mach = machine(tuned, {{X}}, {{y}})  # bind tuned model to data
fit!(mach)  # run grid search

best = fitted_params(mach).best_model  # retrieve best hyperparameter configuration
rep  = report(mach)  # full tuning history
'''

[[codeBranches]]
model = "random"
code = '''
using MLJ
{{?X=X_train}} using PollisDatasets

{{?X=X_train}} w = dataset("wine");  # 178 wines from three cultivars; datasetinfo("wine") describes the columns
{{?X=X_train}} X_train = w[filter(!=(:cultivar), keys(w))];  # the 13 chemical measurements, as a table
{{?X=X_train}} y_train = coerce(w.cultivar, Multiclass);  # the cultivar of each wine, the class to predict

{{learner}} = @load {{learner}} pkg={{pkg}} verbosity=0  # import the model type from its package
model  = {{learner}}()  # instantiate with defaults

{{?learner=DecisionTreeClassifier}} r1 = range(model, :min_purity_increase, lower=0.0, upper=0.3)  # continuous uniform: the smallest impurity gain worth a split
{{?learner=DecisionTreeClassifier}} r2 = range(model, :max_depth, values=[2, 3, 4, 5, 6])  # discrete: the depth of the tree
{{?learner!=DecisionTreeClassifier}} r1 = range(model, :param1, lower=v_lo, upper=v_hi)  # continuous uniform range
{{?learner!=DecisionTreeClassifier}} r2 = range(model, :param2, values=[v1, v2, v3])  # discrete range

tuned = TunedModel(
    model      = model,  # 
    tuning     = RandomSearch(rng=42),  # reproducible random search
    n          = {{niter}},  # {{niter}} sampled configurations
    resampling = CV(nfolds={{cv}}),  # {{cv}}-fold cross-validation
    measure    = {{measure}},  # optimisation criterion
    range      = [r1, r2],
)

mach = machine(tuned, {{X}}, {{y}})  # bind tuned model to data
fit!(mach)  # run random search

best = fitted_params(mach).best_model  # best configuration
'''

[[codeBranches]]
model = "bayesian"
code = '''
using MLJ, TreeParzen
{{?X=X_train}} using PollisDatasets

{{?X=X_train}} w = dataset("wine");  # 178 wines from three cultivars; datasetinfo("wine") describes the columns
{{?X=X_train}} X_train = w[filter(!=(:cultivar), keys(w))];  # the 13 chemical measurements, as a table
{{?X=X_train}} y_train = coerce(w.cultivar, Multiclass);  # the cultivar of each wine, the class to predict

{{learner}} = @load {{learner}} pkg={{pkg}} verbosity=0  # import the model type from its package
model  = {{learner}}()  # instantiate with defaults

{{?learner=DecisionTreeClassifier}} space = Dict(
{{?learner=DecisionTreeClassifier}}     :max_depth => HP.Choice(:max_depth, [2, 3, 4, 5, 6]),  # discrete candidates: the depth of the tree
{{?learner=DecisionTreeClassifier}}     :min_purity_increase => HP.LogUniform(:min_purity_increase, log(0.001), log(0.3)),  # continuous log-scale range (bounds as logs)
{{?learner=DecisionTreeClassifier}} )
{{?learner!=DecisionTreeClassifier}} space = Dict(
{{?learner!=DecisionTreeClassifier}}     :param1 => HP.Choice(:param1, [v1, v2, v3]),  # discrete candidates
{{?learner!=DecisionTreeClassifier}}     :param2 => HP.LogUniform(:param2, log(0.01), log(1.0)),  # continuous log-scale range (bounds as logs)
{{?learner!=DecisionTreeClassifier}} )

tuned = TunedModel(
    model      = model,  # 
    tuning     = MLJTreeParzenTuning(random_trials=10),  # 10 random draws, then Parzen-estimator guided
    n          = {{ncalls}},  # {{ncalls}} evaluated configurations
    resampling = CV(nfolds={{cv}}),  # {{cv}}-fold cross-validation
    measure    = {{measure}},  # optimisation criterion
    range      = space,
)

mach = machine(tuned, {{X}}, {{y}})  # bind tuned model to data
fit!(mach)  # run Bayesian optimisation

best = fitted_params(mach).best_model  # best configuration
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "tuning-curve"
label = "Tuning Curve"
desc = "CV score plotted against each hyperparameter individually; reveals sensitivity and optimal range"
code = '''
using MLJ, Plots

{{?learner=DecisionTreeClassifier}} r = range(model, :max_depth, lower=1, upper=10)  # hyperparameter to sweep
{{?learner!=DecisionTreeClassifier}} r = range(model, :param1, lower=lo, upper=hi)  # hyperparameter to sweep
curve = learning_curve(model, {{X}}, {{y}};  # 
    range=r, resampling=CV(nfolds={{cv}}), measure={{measure}})  # 

plot(curve.parameter_values, curve.measurements,  # 
    xlabel=string(r.field), ylabel=string({{measure}}), legend=false)  # tuning curve
'''

[[actionGroups.actions]]
id = "learning-curve"
label = "Learning Curve"
desc = "CV score vs training set size; diagnoses bias/variance and the value of collecting more data"
code = '''
using MLJ, Plots, Random

best  = fitted_params(mach).best_model  # best hyperparameter configuration
perm  = randperm(Xoshiro(42), nrows({{X}}))  # random row order, so each subset is representative
sizes = round.(Int, (0.1:0.1:1.0) .* length(perm))  # 10 % to 100 % of the training data
scores = map(sizes) do k
    evaluate(best, {{X}}, {{y}}; rows=perm[1:k],  # 
        resampling=CV(nfolds={{cv}}), measure={{measure}}, verbosity=0).measurement[1]
end

plot(sizes, scores,  # 
    xlabel="Training size", ylabel=string({{measure}}), legend=false)  # learning curve
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "best-params"
label = "Best Parameters Summary"
desc = "Print the optimal hyperparameter configuration and its cross-validated score"
code = '''
using MLJ

rep = report(mach)  # full tuning history

best_entry = rep.best_history_entry  # entry with optimal {{measure}}
println("Best {{measure}}: ", best_entry.measurement[1])  # 
println("Best params:  ", best_entry.model)  # 

scores = [entry.measurement[1] for entry in rep.history]  # one score per evaluated configuration
higher_is_better = best_entry.measurement[1] == maximum(scores)  # score (accuracy) or loss (rmse)
top = sortperm(scores, rev=higher_is_better)[1:min(5, length(scores))]
[(rank = i, score = scores[j], model = rep.history[j].model) for (i, j) in enumerate(top)]  # top-5 configurations
'''
