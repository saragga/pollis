# Hyperparameter Tuning Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/hpt.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Hyperparameter Tuning"
viewType = "pollis.hpt"
defaultModel = "grid"

[[packages]]
name = "MLJ.jl"
github = "https://github.com/alan-turing-institute/MLJ.jl"

[[packages]]
name = "Hyperopt.jl"
github = "https://github.com/baggepinnen/Hyperopt.jl"

[requires]
packages = ["MLJ.jl", "Hyperopt.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Grid Search"
file = "model-workflow/tutorial-01-grid-search.ipynb"
bundled = true
description = "Exhaustive grid search over hyperparameter combinations with MLJ.jl"

[[notebookSections.notebooks]]
name = "Random Search"
file = "model-workflow/tutorial-02-random-search.ipynb"
bundled = true
description = "Efficient random sampling from parameter distributions with MLJ.jl"

[[notebookSections.notebooks]]
name = "Bayesian Optimisation"
file = "model-workflow/tutorial-03-bayesian-hpt.ipynb"
bundled = true
description = "GP-guided Bayesian optimisation of hyperparameters with Hyperopt.jl"

[[wikis]]
name = "Overview"
file = "model-workflow/hpt-overview.md"
bundled = true

[[wikis]]
name = "Grid Search"
file = "model-workflow/hpt-grid.md"
bundled = true

[[wikis]]
name = "Random Search"
file = "model-workflow/hpt-random.md"
bundled = true

[[wikis]]
