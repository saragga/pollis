[[bullets]]
text = "Solves the constrained least squares problem: minimise ||Ax − b||² subject to x ≥ 0"
detail = ""

[[bullets]]
text = "Five solver algorithms: :pivot (Lawson–Hanson, default), :fnnls (fast dense), :admm (large sparse), :blockpivot (batch), :nnls (classic)"
detail = ""

[[bullets]]
text = "Accepts multiple right-hand sides: when b is a matrix (m × k), returns a solution matrix X (n × k) column-by-column"
detail = ""

[[bullets]]
text = "Applications: spectral unmixing, signal recovery, non-negative matrix factorisation pre-processing, portfolio constraints"
detail = ""

[[inputs]]
id = "A"
label = "Matrix A"
tooltip = "m × n coefficient matrix. Each column is a predictor; each row is an observation."
default = "A"

[[inputs]]
id = "b"
label = "Vector b"
tooltip = "Response vector of length m. Pass a matrix (m × k) to solve k systems simultaneously."
default = "b"

[[inputs]]
id = "alg"
label = "Algorithm"
tooltip = "Solver algorithm: :pivot (Lawson–Hanson, default), :fnnls (fast, dense), :admm (large sparse), :blockpivot (batch NMF), :nnls (classic)."
kind = "select"
default = "pivot"

[[inputs.options]]
value = "pivot"
label = ":pivot"

[[inputs.options]]
value = "nnls"
label = ":nnls"

[[inputs.options]]
value = "fnnls"
label = ":fnnls"

[[inputs.options]]
value = "admm"
label = ":admm"

[[inputs.options]]
value = "blockpivot"
label = ":blockpivot"

[[codeBranches]]
model = "main"
code = '''
using NonNegLeastSquares
using LinearAlgebra: norm

x = nonneg_lsq({{A}}, {{b}}; alg = :{{alg}})  # minimise ||A*x - b||^2 subject to x >= 0

println("Solution x:  ", x)  # non-negative solution vector
println("Residual:    ", norm({{A}} * x - {{b}}))  # Euclidean residual norm
println("Nonzeros:    ", sum(x .> 0))  # number of strictly positive components
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals"
label = "Residual Analysis"
desc = "Compute per-observation residuals and summary statistics of the fit quality"
code = '''
using NonNegLeastSquares
using LinearAlgebra: norm

x         = nonneg_lsq({{A}}, {{b}}; alg = :{{alg}})  # NNLS solution
residuals = {{A}} * x - {{b}}  # per-observation residuals

println("Residual norm:  ", norm(residuals))  # ||Ax - b||
println("Max abs error:  ", maximum(abs.(residuals)))  # largest individual error
println("Mean abs error: ", sum(abs.(residuals)) / length(residuals))  # average absolute error
'''

[[actionGroups.actions]]
id = "active_set"
label = "Active Set"
desc = "Identify which components of the solution are strictly positive (active) versus zero (at the bound)"
code = '''
using NonNegLeastSquares

x        = nonneg_lsq({{A}}, {{b}}; alg = :{{alg}})  # NNLS solution
active   = findall(x .> 0)  # indices with nonzero solution
inactive = findall(x .<= 0)  # indices at the zero lower bound

println("Active (nonzero): ", length(active),   " / ", length(x))  # count of nonzero components
println("Inactive (zero):  ", length(inactive), " / ", length(x))  # count of zero components
println("Active indices:   ", active)  # list of active variable positions
'''

[[actionGroups.actions]]
id = "kkt"
label = "KKT Conditions"
desc = "Verify optimality via Karush-Kuhn-Tucker conditions: dual feasibility and complementary slackness"
code = '''
using NonNegLeastSquares
using LinearAlgebra: norm, transpose

x = nonneg_lsq({{A}}, {{b}}; alg = :{{alg}})  # NNLS solution

w = transpose({{A}}) * ({{b}} - {{A}} * x)  # dual variable: negative gradient at solution

println("Dual feasibility (w <= 0):    ", all(w .<= 1e-8))  # should be true at optimum
println("Complementary slackness max:  ", maximum(abs.(w .* x)))  # should be ~0 at optimum
println("Primal feasibility (x >= 0):  ", all(x .>= 0))  # solution is non-negative
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "sparsity"
label = "Solution Sparsity"
desc = "Fraction of solution components driven to zero by the non-negativity constraint"
code = '''
using NonNegLeastSquares

x        = nonneg_lsq({{A}}, {{b}}; alg = :{{alg}})  # NNLS solution
n_active = sum(x .> 0)  # number of nonzero components
sparsity = 1.0 - n_active / length(x)  # fraction of zero components

println("Active components: ", n_active, " / ", length(x))  # nonzero count
println("Sparsity:          ", round(sparsity, digits = 3))  # 0 = dense; 1 = all zeros
'''

[[actionGroups.actions]]
id = "relative_residual"
label = "Relative Residual"
desc = "Normalised residual ||Ax - b|| / ||b|| measuring the fit relative to the scale of the response"
code = '''
using NonNegLeastSquares
using LinearAlgebra: norm

x       = nonneg_lsq({{A}}, {{b}}; alg = :{{alg}})  # NNLS solution
abs_res = norm({{A}} * x - {{b}})  # absolute residual norm
rel_res = abs_res / norm({{b}})  # relative residual (scale-free)

println("Absolute residual: ", round(abs_res, digits = 4))  # ||Ax - b||
println("Relative residual: ", round(rel_res, digits = 4))  # ||Ax - b|| / ||b||
'''

[[actionGroups.actions]]
id = "fitted_vs_observed"
label = "Fitted vs Observed"
desc = "Scatter plot of model-fitted values A*x against observed response b to assess systematic bias"
code = '''
using NonNegLeastSquares
import StatsPlots

x     = nonneg_lsq({{A}}, {{b}}; alg = :{{alg}})  # NNLS solution
b_hat = {{A}} * x  # fitted values

StatsPlots.scatter({{b}}, b_hat;  # scatter: observed vs fitted
    xlabel = "Observed", ylabel = "Fitted",
    title  = "Fitted vs Observed", legend = false)
StatsPlots.plot!([minimum({{b}}), maximum({{b}})],  # add 45-degree reference line
     [minimum({{b}}), maximum({{b}})]; color = :red, linestyle = :dash)
'''
