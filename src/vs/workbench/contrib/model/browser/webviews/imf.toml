[[codeBranches]]
model = "weo"
code = """
using HTTP, CSV, Tables

# The IMF Data API needs no API key. It returns CSV only when asked for it
# through the Accept header (format=csv in the URL is ignored).
base = "https://api.imf.org/external/sdmx/2.1/data"
csvheader = ["Accept" => "application/vnd.sdmx.data+csv;version=1.0.0"]
imf(series; query = "") = CSV.File(HTTP.get("$base/$series?$query", csvheader).body)

# The series above: Portugal, real GDP growth (WEO dataflow), annual, forecasts included, by default
tbl = imf("{{weoSeries}}"; query = "startPeriod=2015")

years  = Tables.getcolumn(tbl, :TIME_PERIOD)
growth = Tables.getcolumn(tbl, :OBS_VALUE)
actual = first(Tables.getcolumn(tbl, :LATEST_ACTUAL_ANNUAL_DATA))  # later years are forecasts
println("Real GDP growth (%), actual data up to $actual:")
foreach((y, g) -> println(y, "  ", round(g; digits = 2), y > actual ? "  (forecast)" : ""), years, growth)
"""

[[codeBranches]]
model = "cpi"
code = """
using HTTP, CSV, Tables

base = "https://api.imf.org/external/sdmx/2.1/data"
csvheader = ["Accept" => "application/vnd.sdmx.data+csv;version=1.0.0"]
imf(series; query = "") = CSV.File(HTTP.get("$base/$series?$query", csvheader).body)

# The series above: United States, headline CPI (COICOP _T = all items), year-on-year % change, monthly, by default
# Key: COUNTRY.INDEX_TYPE.COICOP_1999.TYPE_OF_TRANSFORMATION.FREQUENCY
tbl = imf("{{cpiSeries}}"; query = "startPeriod=2020-01")

months = Tables.getcolumn(tbl, :TIME_PERIOD)
infl   = Tables.getcolumn(tbl, :OBS_VALUE)
println(last(months, 12))
println(round.(last(infl, 12); digits = 2))
"""

[[codeBranches]]
model = "fx"
code = """
using HTTP, CSV, Tables

base = "https://api.imf.org/external/sdmx/2.1/data"
csvheader = ["Accept" => "application/vnd.sdmx.data+csv;version=1.0.0"]
imf(series; query = "") = CSV.File(HTTP.get("$base/$series?$query", csvheader).body)

# The series above: Japanese yen per US dollar (XDC_USD), period average (PA_RT), monthly (ER dataflow), by default
# Key: COUNTRY.INDICATOR.TYPE_OF_TRANSFORMATION.FREQUENCY
tbl = imf("{{fxSeries}}"; query = "startPeriod=2020-01")

months = Tables.getcolumn(tbl, :TIME_PERIOD)
rate   = Tables.getcolumn(tbl, :OBS_VALUE)
println(last(months, 6))
println(round.(last(rate, 6); digits = 2))
"""

[[codeBranches]]
model = "reserves"
code = """
using HTTP, CSV, Tables

base = "https://api.imf.org/external/sdmx/2.1/data"
csvheader = ["Accept" => "application/vnd.sdmx.data+csv;version=1.0.0"]
imf(series; query = "") = CSV.File(HTTP.get("$base/$series?$query", csvheader).body)

# The series above: the share (SHRO_PT) of the US dollar in allocated world (G001) reserves, quarterly (COFER dataflow), by default
# Key: COUNTRY.INDICATOR.FXR_CURRENCY.TYPE_OF_TRANSFORMATION.FREQUENCY
tbl = imf("{{reservesSeries}}"; query = "startPeriod=2000-Q1")

quarters = Tables.getcolumn(tbl, :TIME_PERIOD)
share    = Tables.getcolumn(tbl, :OBS_VALUE)
println("US dollar share of allocated reserves (%):")
println(first(quarters), "  ", round(first(share); digits = 1))
println(last(quarters), "  ", round(last(share); digits = 1))
"""

