# IMF Data Webview Configuration
# Declarative source. The build script generates imf.data.ts.
# Run: npm run gulp compile-toml
#
# Approach: the IMF Data portal exposes a standard SDMX 2.1 REST API at
# https://api.imf.org/external/sdmx/2.1/ and needs NO API key. It returns a
# flat CSV table when the request carries the SDMX-CSV Accept header (the
# format=csv parameter alone is ignored). We read it with HTTP.jl + CSV.jl
# into a Tables.jl-compatible table. IMFData.jl is not used: it calls the
# retired dataservices.imf.org service, which no longer resolves.

[meta]
title = "IMF Data"
viewType = "pollis.imf"
defaultModel = "weo"
models = ["weo", "cpi", "fx", "reserves", "commodities"]
illusCollapsed = true
illustrationText = "Pull International Monetary Fund statistics into Julia: World Economic Outlook forecasts, consumer prices, exchange rates, the currency composition of reserves, and primary commodity prices."

[[packages]]
name = "HTTP.jl"
github = "https://github.com/JuliaWeb/HTTP.jl"

[[packages]]
name = "CSV.jl"
github = "https://github.com/JuliaData/CSV.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "Plots.jl"
github = "https://github.com/JuliaPlots/Plots.jl"

[requires]
packages = ["HTTP.jl", "CSV.jl", "Tables.jl", "Plots.jl"]

