# Next Steps action groups (task-oriented, matched to the IMF datasets)
[[actionGroups]]
id = "weo"
label = "World Economic Outlook"

[[actionGroups.actions]]
id = "imf-weo-countries"
label = "Compare Countries"
desc = "Real GDP growth for several countries on one chart, forecasts included"
code = """
using HTTP, CSV, Tables, Plots

base = "https://api.imf.org/external/sdmx/2.1/data"
csvheader = ["Accept" => "application/vnd.sdmx.data+csv;version=1.0.0"]
# Join several countries with + in one key
tbl = CSV.File(HTTP.get("$base/IMF.RES,WEO/USA+DEU+PRT+CHN.NGDP_RPCH.A?startPeriod=2010", csvheader).body)

country = Tables.getcolumn(tbl, :COUNTRY)
year    = Tables.getcolumn(tbl, :TIME_PERIOD)
growth  = Tables.getcolumn(tbl, :OBS_VALUE)
p = plot(xlabel = "year", ylabel = "real GDP growth (%)")
for c in unique(country)
    i = country .== c
    plot!(p, year[i], growth[i], label = c, marker = :circle)
end
p
"""

[[actionGroups.actions]]
id = "imf-weo-dashboard"
label = "Country Dashboard"
desc = "Growth, inflation, unemployment, and public debt for one country"
code = """
using HTTP, CSV, Tables

base = "https://api.imf.org/external/sdmx/2.1/data"
csvheader = ["Accept" => "application/vnd.sdmx.data+csv;version=1.0.0"]
key = "PRT.NGDP_RPCH+PCPIPCH+LUR+GGXWDG_NGDP.A"
tbl = CSV.File(HTTP.get("$base/IMF.RES,WEO/$key?startPeriod=2024&endPeriod=2026", csvheader).body)

for (ind, year, v, name) in zip(Tables.getcolumn(tbl, :INDICATOR), Tables.getcolumn(tbl, :TIME_PERIOD),
                                Tables.getcolumn(tbl, :OBS_VALUE), Tables.getcolumn(tbl, :SERIES_NAME))
    println(rpad(ind, 14), year, "  ", rpad(round(v; digits = 2), 8), name)
end
"""

