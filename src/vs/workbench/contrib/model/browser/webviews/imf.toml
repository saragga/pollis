[[actionGroups.actions]]
id = "imf-cpi-plot"
label = "Inflation Chart"
desc = "Monthly headline inflation for two countries on one chart"
code = """
using HTTP, CSV, Tables, Plots, Dates

base = "https://api.imf.org/external/sdmx/2.1/data"
csvheader = ["Accept" => "application/vnd.sdmx.data+csv;version=1.0.0"]
tbl = CSV.File(HTTP.get("$base/IMF.STA,CPI/USA+GBR.CPI._T.YOY_PCH_PA_PT.M?startPeriod=2019-01", csvheader).body)

# Monthly periods look like 2024-M07; turn them into dates so gaps stay visible
monthdate(s) = Date(replace(s, "-M" => "-"), dateformat"yyyy-mm")
country = Tables.getcolumn(tbl, :COUNTRY)
month   = monthdate.(Tables.getcolumn(tbl, :TIME_PERIOD))
infl    = Tables.getcolumn(tbl, :OBS_VALUE)
p = plot(xlabel = "month", ylabel = "CPI inflation, y/y (%)")
for c in unique(country)
    i = country .== c
    plot!(p, month[i], infl[i], label = c)
end
p
"""

