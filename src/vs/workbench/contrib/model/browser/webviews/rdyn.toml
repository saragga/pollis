[[inputs]]
id = "R"
label = "Rotation source"
tooltip = "Any Rotations.jl rotation type: RotMatrix, QuatRotation, MRP, AngleAxis, etc. The code will convert this to other representations."
default = "R"
models = ["rot"]

[[inputs]]
id = "vec"
label = "Vector to rotate"
tooltip = "A 3-element vector in the source frame. The code shows how to apply the rotation R to transform it."
default = "v"
models = ["rot"]

[[inputs]]
id = "mechanism"
label = "Mechanism"
tooltip = "A RigidBodyDynamics.jl Mechanism object representing the robot kinematic chain."
default = "mechanism"
models = ["fk"]

[[inputs]]
id = "q-fk"
label = "Joint configuration"
tooltip = "q: vector of joint angles / positions (length nq). Sets the pose of the kinematic chain."
default = "q"
models = ["fk"]

[[inputs]]
id = "ee"
label = "End-effector body"
tooltip = "The RigidBody object for the end-effector link. Used to query its pose relative to the root body."
default = "ee_body"
models = ["fk"]

[[inputs]]
id = "model-fd"
label = "Model"
tooltip = "A RobotDynamics.jl AbstractModel representing the robot dynamics and state/control dimensions."
default = "model"
models = ["fd"]

[[inputs]]
id = "x"
label = "State vector"
tooltip = "x = [q; v]: stacked joint configuration q (length nq) and joint velocity v (length nv)."
default = "x"
models = ["fd"]

[[inputs]]
id = "u"
label = "Control torques"
tooltip = "u: applied joint torques (length nu). The ABA computes accelerations from these torques plus gravity."
default = "u"
models = ["fd"]

[[inputs]]
id = "model-id"
label = "Model"
tooltip = "A RobotDynamics.jl AbstractModel representing the robot dynamics and state/control dimensions."
default = "model"
models = ["id"]

[[inputs]]
id = "q-id"
label = "Joint configuration"
tooltip = "q: joint angles / positions (length nq). The pose at which to evaluate the dynamics."
default = "q"
models = ["id"]

[[inputs]]
id = "vel"
label = "Joint velocity"
tooltip = "v: joint velocities (length nv). Used by RNEA to compute Coriolis and centrifugal forces."
default = "v"
models = ["id"]

[[inputs]]
id = "acc"
label = "Joint acceleration"
tooltip = "a: desired joint accelerations (length nv). RNEA computes the torques needed to produce this acceleration."
default = "a"
models = ["id"]

[[codeBranches]]
model = "rot"
code = '''
using Rotations  # SO(3) rotation representations and conversions

R_quat = QuatRotation({{R}})  # convert R to unit quaternion (w, x, y, z)
R_mat  = RotMatrix{3}(R_quat)  # 3x3 orthogonal rotation matrix
R_aa   = AngleAxis(R_quat)  # axis-angle representation (theta, nx, ny, nz)

v_rot  = R_mat * {{vec}}  # apply rotation: transform vector {{vec}} to new frame
R_comp = R_quat * R_quat  # compose rotations multiplicatively
R_inv  = inv(R_quat)  # inverse rotation: R_inv * R_quat = identity
'''

[[codeBranches]]
model = "fk"
code = '''
using RigidBodyDynamics, Rotations  # forward kinematics via kinematic chain integration

state = MechanismState({{mechanism}})  # mutable state object for the mechanism
set_configuration!(state, {{q-fk}})  # set joint configuration to q

T_ee  = transform(state, {{ee}}, root_body({{mechanism}}))  # homogeneous transform from root to end-effector
p_ee  = translation(T_ee)  # end-effector position (3-vector in root frame)
R_ee  = rotation(T_ee)  # end-effector orientation (RotMatrix{3})
'''

[[codeBranches]]
model = "fd"
code = '''
using RobotDynamics  # forward dynamics via Articulated Body Algorithm (ABA)

xdot   = dynamics({{model-fd}}, {{x}}, {{u}})  # continuous state derivative: [q_dot; q_ddot]
q_ddot = xdot[RobotDynamics.nv({{model-fd}})+1:end]  # joint accelerations from applied torques u
q_dot  = xdot[1:RobotDynamics.nv({{model-fd}})]  # joint velocities: velocity part of state x
'''

[[codeBranches]]
model = "id"
code = '''
using RobotDynamics  # inverse dynamics via Recursive Newton-Euler Algorithm (RNEA)

tau = inverse_dynamics({{model-id}}, {{q-id}}, {{vel}}, {{acc}})  # joint torques needed to produce acceleration {{acc}}
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "rotation-viz"
label = "Rotation Visualisation"
desc = "Plot rotation axes and the effect of applying R to a set of basis vectors"
code = '''
using Rotations, Plots  # visualise rotation by transforming standard basis vectors

R_mat  = RotMatrix{3}({{R}})  # rotation matrix
basis  = [SVector(1,0,0), SVector(0,1,0), SVector(0,0,1)]  # standard basis in source frame
rotated = [R_mat * b for b in basis]  # rotated basis vectors (R_mat .* basis would broadcast the matrix entry by entry)
quiver([0,0,0], [0,0,0], [0,0,0], quiver=(getindex.(rotated,1), getindex.(rotated,2), getindex.(rotated,3)))  # plot rotated frame axes
'''

[[actionGroups.actions]]
id = "ee-trajectory"
label = "End-Effector Path"
desc = "Plot end-effector position over a range of joint configurations"
code = '''
using RigidBodyDynamics, Plots  # trace end-effector position over joint sweep

state  = MechanismState({{mechanism}})  # mechanism state object
path   = range(-pi, pi, length=100)  # sweep first joint from -pi to pi
points = [(set_configuration!(state, [q]); translation(transform(state, ee_body, root_body({{mechanism}})))) for q in path]  # end-effector positions
plot(getindex.(points,1), getindex.(points,2), label="End-effector path")  # 2D projection of the workspace trace
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "rot-orthogonality"
label = "Orthogonality Check"
desc = "Verify that a rotation matrix satisfies R * R^T = I and det(R) = 1"
code = '''
using Rotations, LinearAlgebra  # verify rotation matrix properties

R_mat  = RotMatrix{3}({{R}})  # rotation matrix
err_orth = norm(R_mat * transpose(R_mat) - I(3))  # should be near machine epsilon
det_R    = det(R_mat)  # should equal 1.0 for proper rotation
@assert det_R > 0 && err_orth < 1e-10  # fails if R is not a valid SO(3) element
'''

[[actionGroups.actions]]
id = "dynamics-check"
label = "Dynamics Consistency"
desc = "Check that forward and inverse dynamics are consistent at a given state"
code = '''
using RobotDynamics, LinearAlgebra  # verify FD and ID are mutually consistent

nv     = RobotDynamics.nv({{model-fd}})  # velocity dimension
xdot   = dynamics({{model-fd}}, {{x}}, {{u}})  # forward dynamics: get accelerations
a_fd   = xdot[nv+1:end]  # joint accelerations from FD
q      = {{x}}[1:nv]; v = {{x}}[nv+1:end]  # extract q and v from state
tau_id = inverse_dynamics({{model-fd}}, q, v, a_fd)  # ID from FD accelerations: should recover u
norm(tau_id - {{u}})  # residual: should be near zero
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "fd-simulate"
label = "Forward Simulation"
desc = "Integrate forward dynamics with explicit Euler to simulate robot motion"
code = '''
using RobotDynamics  # explicit Euler integration of forward dynamics

dt   = 0.01  # time step in seconds
N    = 200  # number of integration steps
x_sim = [{{x}}]  # initialise state history
for _ in 1:N  # integrate over N steps
    xdot = dynamics({{model-fd}}, x_sim[end], {{u}})
    push!(x_sim, x_sim[end] + dt * xdot)
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "fd-vs-id"
label = "FD vs ID Roundtrip"
desc = "Verify FD and ID are inverses: applying ID to FD output recovers the original torque"
code = '''
using RobotDynamics, LinearAlgebra  # FD and ID roundtrip consistency check

nv     = RobotDynamics.nv({{model-fd}})  # velocity dimension
xdot   = dynamics({{model-fd}}, {{x}}, {{u}})  # FD: torques -> accelerations
a      = xdot[nv+1:end]  # joint accelerations
q, v   = {{x}}[1:nv], {{x}}[nv+1:end]  # configuration and velocity from state
tau    = inverse_dynamics({{model-fd}}, q, v, a)  # ID: accelerations -> torques
norm(tau - {{u}})  # should be near zero for a consistent dynamics model
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "rotation-angle"
label = "Rotation Angle"
desc = "Extract the rotation angle and axis from any rotation type"
code = '''
using Rotations, LinearAlgebra  # extract rotation angle and axis from R

R_aa   = AngleAxis({{R}})  # convert to axis-angle representation
theta  = R_aa.theta  # rotation angle in radians
axis   = [R_aa.x, R_aa.y, R_aa.z]  # unit rotation axis
norm(axis)  # should equal 1.0 for valid rotation axis
'''
