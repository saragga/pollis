o = LinReg(size({{X}}, 2))  # online regression
fit!(o, zip(eachrow({{X}}), {{data}}))  # stream data

println("Coefficients: ", coef(o))  # ordinary least squares from the running sums of cross-products
println("Observations: ", nobs(o))  # number of observations processed
'''
