# Online Algorithms Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/oa.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Online Algorithms"
viewType = "pollis.oa"
defaultModel = "desc"

