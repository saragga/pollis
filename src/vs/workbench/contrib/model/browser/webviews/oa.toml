[[actionGroups.actions]]
id = "compare-batch"
label = "vs Batch Statistics"
desc = "Compare online estimates against exact batch values to verify accuracy"
code = '''
using OnlineStats, Statistics

o = Series(Mean(), Variance())  # online estimators
fit!(o, {{data}})  # single pass

println("Online mean:      ", value(o[1]))  # online estimate
println("Batch  mean:      ", mean({{data}}))  # exact batch value
println("Online variance:  ", value(o[2]))  # online estimate
println("Batch  variance:  ", var({{data}}))  # exact batch value
'''

[[actionGroups.actions]]
id = "nobs"
label = "Observation Count"
desc = "Inspect how many observations have been processed by each online stat"
code = '''
using OnlineStats

o = Mean()  # online mean
fit!(o, {{data}})  # process data stream

println("Observations processed: ", nobs(o))  # number of observations seen
println("Current estimate:       ", value(o))  # current statistic value
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "predict-linreg"
models = ["linreg"]
label = "Regression Predictions"
desc = "Use the online regression model to predict responses for new covariates"
code = '''
using OnlineStats

o = LinReg(size({{X}}, 2))  # online linear regression
fit!(o, zip(eachrow({{X}}), {{data}}))  # stream training data
coef(o)  # solve for the coefficients (predict uses the last solved values)

x_new = [1.0, 2.0]  # new covariate vector, one entry per column of X (no intercept is added automatically)
println("Prediction: ", predict(o, x_new))  # out-of-sample prediction
'''

[[actionGroups.actions]]
id = "stream-predict"
models = ["linreg"]
label = "One-Step-Ahead Predictions"
desc = "Predict each response from the coefficients so far, then update the model with it"
code = '''
using OnlineStats

o = LinReg(size({{X}}, 2))  # online model
preds = Float64[]  # store rolling predictions

for (x_t, y_t) in zip(eachrow({{X}}), {{data}})
    push!(preds, nobs(o) > length(x_t) ? (coef(o); predict(o, x_t)) : NaN)  # predict before update, once there are more rows than coefficients
    fit!(o, (x_t, y_t))  # then update with true label
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "merge-stats"
label = "Merge Parallel Streams"
desc = "Combine online stats from two independent data partitions without re-reading data"
code = '''
using OnlineStats

n = length({{data}})  # total observations
o1 = fit!(Mean(), {{data}}[1:div(n,2)])  # stats on first half
o2 = fit!(Mean(), {{data}}[div(n,2)+1:end])  # stats on second half

merge!(o1, o2)  # combine both estimates exactly
println("Merged mean: ", value(o1))  # equivalent to batch mean over all data
'''

[[actionGroups.actions]]
id = "memory-schemes"
label = "Incremental, Rolling and Exponential"
desc = "Plot the running mean under the three kinds of memory: every observation, the last span observations, and exponentially decaying weights"
code = '''
using OnlineStats, Statistics, Plots

span = 100  # window length and span: change it to see how fast each estimate forgets
incremental = Mean()  # every observation so far, equally weighted
rolling = MovingWindow(span, Float64)  # the last span observations
weighted = Mean(weight=ExponentialWeight(span))  # each new observation gets the weight 2/(span + 1)

mi = Float64[]; mr = Float64[]; me = Float64[]
for x in {{data}}
    fit!(incremental, x); fit!(rolling, x); fit!(weighted, x)
    push!(mi, value(incremental)); push!(mr, mean(value(rolling))); push!(me, value(weighted))
end
plot([mi mr me], label=["Incremental" "Rolling Window" "Exponentially Weighted"], xlabel="Observations", ylabel="Mean")  # how each estimate follows the stream
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary-stats"
label = "Summary Statistics"
desc = "Full descriptive summary: mean, variance, skewness, kurtosis and extrema in one pass"
code = '''
using OnlineStats

o = Series(Mean(), Variance(), Moments(), Extrema())  # full summary in one pass
fit!(o, {{data}})  # single-pass computation

println("Mean:     ", value(o[1]))  # first moment
println("Variance: ", value(o[2]))  # second central moment
println("Skewness: ", skewness(o[3]))  # third standardised moment
println("Kurtosis: ", kurtosis(o[3]))  # excess kurtosis (0 for a normal)
println("Extrema:  ", value(o[4]))  # min and max
'''

[[actionGroups.actions]]
id = "regression-coefs"
models = ["linreg"]
label = "Regression Coefficients"
desc = "Display the coefficient estimates, solved from the running sums of cross-products, and the number of observations"
