[[actionGroups.actions]]
id = "predict-linreg"
models = ["linreg"]
label = "Regression Predictions"
desc = "Use the online regression model to predict responses for new covariates"
code = '''
using OnlineStats

o = LinReg(size({{X}}, 2))  # online linear regression
fit!(o, zip(eachrow({{X}}), {{data}}))  # stream training data
coef(o)  # solve for the coefficients (predict uses the last solved values)

x_new = [1.0, 2.0]  # new covariate vector, one entry per column of X (no intercept is added automatically)
println("Prediction: ", predict(o, x_new))  # out-of-sample prediction
'''

[[actionGroups.actions]]
id = "stream-predict"
models = ["linreg"]
label = "One-Step-Ahead Predictions"
desc = "Predict each response from the coefficients so far, then update the model with it"
code = '''
using OnlineStats

o = LinReg(size({{X}}, 2))  # online model
preds = Float64[]  # store rolling predictions

for (x_t, y_t) in zip(eachrow({{X}}), {{data}})
    push!(preds, nobs(o) > length(x_t) ? (coef(o); predict(o, x_t)) : NaN)  # predict before update, once there are more rows than coefficients
    fit!(o, (x_t, y_t))  # then update with true label
end
'''

