[[bullets]]
text = "Running Summary Statistics"
detail = "mean, variance, extrema, skewness and kurtosis in one pass, each new observation updating them at a fixed cost and without storing the data; incremental, rolling window or exponentially weighted memory"

[[bullets]]
text = "Quantile Estimation"
detail = "the P-squared algorithm of Jain and Chlamtac: five markers per quantile, moved as observations arrive, with no sorting and no stored data"

[[bullets]]
text = "Online Histogram"
detail = "a fixed number of bins whose centres follow the data: each new value becomes a bin and the two closest bins merge, as in Ben-Haim and Tom-Tov; density and quantiles read from the bins"

[[bullets]]
text = "Online Linear Regression"
detail = "exact least squares from running sums of cross-products, with the coefficients solved when asked for; equal or exponential weights"

[[bullets]]
text = "Covariance and Correlation"
detail = "covariance and correlation matrices of several variables from running averages of each row and its cross-products; incremental, rolling window, time window or exponentially weighted memory"

[[bullets]]
text = "Autocorrelation"
detail = "autocovariances and autocorrelations of a stream up to a chosen lag, from running averages of each observation and its lagged values; incremental, rolling window, time window or exponentially weighted memory"

[[decisionRows]]
task = "Running Summary"
context = "Centre, spread and shape"
purpose = "Mean, variance, extrema, skewness and kurtosis of a stream, updated with each observation"

[[decisionRows]]
task = "Quantile"
context = "Median or percentiles"
purpose = "One quantile per estimator, from five markers, without sorting or storing the data"

[[decisionRows]]
task = "Histogram"
context = "Whole distribution"
purpose = "The shape of the stream in a fixed number of bins, with density and quantiles read from them"

[[decisionRows]]
task = "Linear Regression"
context = "Response on predictors"
purpose = "Least squares coefficients from running sums, solved whenever they are needed"

[[decisionRows]]
task = "Correlation"
context = "Co-movement of variables"
purpose = "Covariance and correlation matrices of several streams, updated with each row of observations"

[[decisionRows]]
task = "Autocorrelation"
context = "Dependence on the past"
purpose = "How strongly each observation is related to those one, two or more steps before it"

[[decisionRows]]
task = "Incremental"
context = "Stable process"
purpose = "Every observation counts equally, so the estimate settles on the value of the whole stream"

[[decisionRows]]
task = "Rolling Window"
context = "Last n observations"
purpose = "Only the most recent observations count, and each leaves the window after n more arrive"

[[decisionRows]]
task = "Time Window"
context = "Last period of time"
purpose = "Only the observations of a recent period count, however many there were, which needs a time stamp for each"

[[decisionRows]]
task = "Exponentially Weighted"
context = "Gradual change"
purpose = "Every observation counts, with weights that fall geometrically with age"

[[inputs]]
id = "data"
models = ["desc", "quantile", "hist", "linreg", "acf"]
label = "Data stream"
tooltip = "Vector or iterator of observations. Can be processed in a single pass with fit! or flushed observation by observation. The default simulates 10,000 draws from Exponential(1), a skewed stream whose true mean (1), variance (1), median (0.693), skewness (2) and excess kurtosis (6) the online estimates should approach; on the Linear Regression tab it is the response y = 1 + 2x + noise, and on the Autocorrelation tab an AR(1) stream, y(t) = 0.7 y(t-1) + e(t), whose autocorrelation at lag k is 0.7^k."
default = "data"

[[inputs]]
id = "X"
models = ["linreg"]
label = "Covariate matrix (X)"
tooltip = "Design matrix (T x k) paired row-by-row with the response vector. Include a column of ones for the intercept. The default simulates 10,000 rows: a column of ones and one standard normal predictor."
default = "X"

[[inputs]]
id = "vars"
models = ["cor"]
label = "Variables matrix"
tooltip = "Matrix with one row per observation and one column per variable (T x p), read row by row. The default simulates 10,000 rows of three standard normal variables whose true correlations are 0.6 (columns 1 and 2), 0.3 (1 and 3) and 0.5 (2 and 3)."
default = "vars"

[[inputs]]
id = "memory"
models = ["desc", "cor", "acf"]
label = "Memory"
tooltip = "Incremental weighs every observation so far equally. Rolling Window keeps the last observations, as many as Window or span, and summarises them. Time Window keeps the observations whose time stamps fall within Time window of the latest one. Exponentially Weighted gives each new observation the weight 2/(span + 1), so older observations count less and less; on Running Summary, Extrema still covers every observation."
kind = "select"
default = "incremental"

[[inputs.options]]
value = "incremental"
label = "Incremental"

[[inputs.options]]
value = "rolling"
label = "Rolling Window"

[[inputs.options]]
value = "time"
label = "Time Window"

[[inputs.options]]
value = "exponential"
label = "Exponentially Weighted"

[[inputs]]
id = "memoryLr"
models = ["linreg"]
label = "Memory"
tooltip = "Incremental weighs every observation so far equally, which gives ordinary least squares. Exponentially Weighted gives each new observation the weight 2/(span + 1), which gives least squares weighted towards recent observations. LinReg keeps no window of observations, so there is no Rolling Window."
kind = "select"
default = "incremental"

[[inputs.options]]
value = "incremental"
label = "Incremental"

[[inputs.options]]
value = "exponential"
label = "Exponentially Weighted"

[[inputs]]
id = "span"
models = ["desc", "linreg", "cor", "acf"]
label = "Window or span"
tooltip = "Rolling Window: the number of most recent observations kept. Exponentially Weighted: the span s of ExponentialWeight(s), which gives each new observation the weight 2/(s + 1). Not used by Incremental or Time Window."
default = "100"

[[inputs]]
id = "times"
models = ["desc", "cor", "acf"]
when = "memory=time"
label = "Time stamps"
tooltip = "A DateTime for each observation, in the order of the observations. The default gives one observation per second from 2 January 2026, 09:30."
default = "times"

[[inputs]]
id = "period"
models = ["desc", "cor", "acf"]
when = "memory=time"
label = "Time window"
tooltip = "A period from Dates, such as Minute(30), Hour(1) or Day(5). The window keeps the observations whose time stamps are no more than this period before the latest time stamp."
default = "Minute(30)"

[[inputs]]
id = "lags"
models = ["acf"]
label = "Lags"
tooltip = "The largest lag k: the tab estimates the autocovariances and autocorrelations at lags 0, 1, ..., k."
default = "10"

[[codeBranches]]
model = "desc"
code = '''
using OnlineStats
{{?data=data}} using Random

{{?data=data}} Random.seed!(1)  # simulated: a stream of 10,000 draws from Exponential(1), whose mean and variance are 1, median log(2) = 0.693, skewness 2 and excess kurtosis 6
{{?data=data}} data = randexp(10_000)  # Replace data with your own stream of observations.

{{?memory=incremental}} s = fit!(Series(Mean(), Variance(), Extrema(), Moments()), {{data}})  # every observation so far, equally weighted
{{?memory=exponential}} w = ExponentialWeight({{span}})  # each new observation gets the weight 2/(span + 1)
{{?memory=exponential}} s = fit!(Series(Mean(weight=w), Variance(weight=w), Extrema(), Moments(weight=w)), {{data}})  # older observations count less and less; Extrema has no weight
{{?memory=rolling}} window = fit!(MovingWindow({{span}}, Float64), {{data}})  # keeps only the last span observations
{{?memory=rolling}} s = fit!(Series(Mean(), Variance(), Extrema(), Moments()), value(window))  # the summary of the window, from the values kept
{{?memory=time}} using Dates
{{?memory=time}} {{?times=times}} times = DateTime(2026, 1, 2, 9, 30) .+ Second.(0:length({{data}}) - 1)  # one observation per second. Replace times with the time stamps of your observations.
{{?memory=time}} window = fit!(MovingTimeWindow({{period}}; timetype=DateTime, valtype=Float64), zip({{times}}, {{data}}))  # keeps the observations within the period before the latest time stamp
{{?memory=time}} s = fit!(Series(Mean(), Variance(), Extrema(), Moments()), last.(value(window)))  # the summary of the observations in the window

println("Mean:     ", value(s[1]))
println("Variance: ", value(s[2]))
println("Std dev:  ", sqrt(value(s[2])))  # standard deviation: the square root of the variance
println("Extrema:  ", extrema(s[3]))  # min and max
println("Skewness: ", skewness(s[4]))
println("Kurtosis: ", kurtosis(s[4]))  # excess kurtosis: 0 for a normal distribution
'''

[[codeBranches]]
model = "quantile"
code = '''
using OnlineStats
{{?data=data}} using Random

{{?data=data}} Random.seed!(1)  # simulated: a stream of 10,000 draws from Exponential(1), whose mean and variance are 1, median log(2) = 0.693, skewness 2 and excess kurtosis 6
{{?data=data}} data = randexp(10_000)  # Replace data with your own stream of observations.

o = P2Quantile(0.5)  # online median via P-squared algorithm
fit!(o, {{data}})  # update quantile estimate

println("Median: ", value(o))  # current quantile estimate

qs = Series(P2Quantile(0.25), P2Quantile(0.5), P2Quantile(0.75))  # quartiles in one pass
fit!(qs, {{data}})  # update all quartile estimators
println("Quartiles: ", value(qs))  # first quartile, median, third quartile
'''

[[codeBranches]]
model = "hist"
code = '''
using OnlineStats
{{?data=data}} using Random

{{?data=data}} Random.seed!(1)  # simulated: a stream of 10,000 draws from Exponential(1), whose mean and variance are 1, median log(2) = 0.693, skewness 2 and excess kurtosis 6
{{?data=data}} data = randexp(10_000)  # Replace data with your own stream of observations.

o = KHist(20)  # adaptive histogram with up to 20 bins
fit!(o, {{data}})  # update histogram as data arrives

println(value(o))  # bin centres and counts
println(ecdf(o)(1.0))  # share of the stream at or below 1, read from the bins (for the default stream, the true share is 1 - exp(-1) = 0.632)
'''

[[codeBranches]]
model = "linreg"
code = '''
using OnlineStats
{{?X=X}} {{?data=data}} using Random

{{?X=X}} {{?data=data}} Random.seed!(1)  # simulated: y = 1 + 2x + noise, so the coefficients should come out near [1, 2]
{{?X=X}} X = [ones(10_000) randn(10_000)]  # an intercept column and one predictor
{{?X=X}} {{?data=data}} data = X * [1.0, 2.0] .+ randn(10_000)  # the response stream. Replace X and data with your own.

{{?memoryLr=incremental}} o = LinReg()  # ordinary least squares from every observation so far
{{?memoryLr=exponential}} o = LinReg(weight=ExponentialWeight({{span}}))  # least squares weighted towards recent observations
fit!(o, zip(eachrow({{X}}), {{data}}))  # stream (x_t, y_t) pairs row by row

beta = coef(o)  # current coefficient estimates
println("Coefficients: ", beta)  # solved from the running sums of cross-products
'''

[[codeBranches]]
model = "cor"
code = '''
using OnlineStats
{{?vars=vars}} using Random, LinearAlgebra

{{?vars=vars}} Random.seed!(1)  # simulated: three variables whose true correlations are 0.6, 0.3 and 0.5
{{?vars=vars}} S = [1.0 0.6 0.3; 0.6 1.0 0.5; 0.3 0.5 1.0]  # the true covariance matrix, also the correlation matrix (unit variances)
{{?vars=vars}} vars = randn(10_000, 3) * cholesky(S).U  # one row per observation. Replace vars with your own matrix, one row per observation and one column per variable.

{{?memory=incremental}} o = fit!(CovMatrix(), eachrow({{vars}}))  # every row so far, equally weighted
{{?memory=exponential}} o = fit!(CovMatrix(weight=ExponentialWeight({{span}})), eachrow({{vars}}))  # each new row gets the weight 2/(span + 1)
{{?memory=rolling}} window = fit!(MovingWindow({{span}}, Vector{Float64}), collect.(eachrow({{vars}})))  # keeps only the last span rows
{{?memory=rolling}} o = fit!(CovMatrix(), value(window))  # covariance of the window, from the rows kept
{{?memory=time}} using Dates
{{?memory=time}} {{?times=times}} times = DateTime(2026, 1, 2, 9, 30) .+ Second.(0:size({{vars}}, 1) - 1)  # one row per second. Replace times with the time stamps of your rows.
{{?memory=time}} window = fit!(MovingTimeWindow({{period}}; timetype=DateTime, valtype=Vector{Float64}), zip({{times}}, collect.(eachrow({{vars}}))))  # keeps the rows within the period before the latest time stamp
{{?memory=time}} o = fit!(CovMatrix(), last.(value(window)))  # covariance of the rows in the window

C = copy(cov(o))  # covariance matrix (copied: cov and cor return the same stored matrix)
R = copy(cor(o))  # correlation matrix
println("Means:               ", mean(o))
println("Standard deviations: ", sqrt.(var(o)))
println("Covariance matrix:   ", round.(C, digits=3))
println("Correlation matrix:  ", round.(R, digits=3))
'''

[[codeBranches]]
model = "acf"
code = '''
using OnlineStats
{{?data=data}} using Random

{{?data=data}} Random.seed!(1)  # simulated: an AR(1) stream, y(t) = 0.7 y(t-1) + e(t), whose autocorrelation at lag k is 0.7^k
{{?data=data}} e = randn(10_000); data = zeros(10_000); data[1] = e[1]
{{?data=data}} for t in 2:10_000; data[t] = 0.7 * data[t - 1] + e[t]; end  # Replace data with your own stream of observations, in time order.

{{?memory=incremental}} o = fit!(AutoCov({{lags}}), {{data}})  # every observation so far, equally weighted
{{?memory=exponential}} o = fit!(AutoCov({{lags}}, weight=ExponentialWeight({{span}})), {{data}})  # each new observation gets the weight 2/(span + 1)
{{?memory=rolling}} window = fit!(MovingWindow({{span}}, Float64), {{data}})  # keeps only the last span observations, in order
{{?memory=rolling}} o = fit!(AutoCov({{lags}}), value(window))  # autocovariances of the window
{{?memory=time}} using Dates
{{?memory=time}} {{?times=times}} times = DateTime(2026, 1, 2, 9, 30) .+ Second.(0:length({{data}}) - 1)  # one observation per second. Replace times with the time stamps of your observations.
{{?memory=time}} window = fit!(MovingTimeWindow({{period}}; timetype=DateTime, valtype=Float64), zip({{times}}, {{data}}))  # keeps the observations within the period before the latest time stamp
{{?memory=time}} o = fit!(AutoCov({{lags}}), last.(value(window)))  # autocovariances of the observations in the window, in time order

println("Lags:             ", 0:{{lags}})
println("Autocovariances:  ", round.(autocov(o), digits=3))
println("Autocorrelations: ", round.(autocor(o), digits=3))  # 1 at lag 0
'''

