[[actionGroups.actions]]
id = "merge-stats"
models = ["desc", "quantile", "hist", "linreg", "acf"]
label = "Merge Parallel Streams"
desc = "Combine online stats from two independent data partitions without re-reading data"
code = '''
using OnlineStats

n = length({{data}})  # total observations
o1 = fit!(Mean(), {{data}}[1:div(n,2)])  # stats on first half
o2 = fit!(Mean(), {{data}}[div(n,2)+1:end])  # stats on second half

merge!(o1, o2)  # combine both estimates exactly
println("Merged mean: ", value(o1))  # equivalent to batch mean over all data
'''

[[actionGroups.actions]]
id = "memory-schemes"
models = ["desc", "quantile", "hist", "linreg", "acf"]
label = "Incremental, Rolling and Exponential"
desc = "Plot the running mean under the three kinds of memory: every observation, the last span observations, and exponentially decaying weights"
code = '''
using OnlineStats, Statistics, Plots

span = 100  # window length and span: change it to see how fast each estimate forgets
incremental = Mean()  # every observation so far, equally weighted
rolling = MovingWindow(span, Float64)  # the last span observations
weighted = Mean(weight=ExponentialWeight(span))  # each new observation gets the weight 2/(span + 1)

mi = Float64[]; mr = Float64[]; me = Float64[]
for x in {{data}}
    fit!(incremental, x); fit!(rolling, x); fit!(weighted, x)
    push!(mi, value(incremental)); push!(mr, mean(value(rolling))); push!(me, value(weighted))
end
plot([mi mr me], label=["Incremental" "Rolling Window" "Exponentially Weighted"], xlabel="Observations", ylabel="Mean")  # how each estimate follows the stream
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary-stats"
models = ["desc", "quantile", "hist", "linreg", "acf"]
label = "Summary Statistics"
desc = "Full descriptive summary: mean, variance, skewness, kurtosis and extrema in one pass"
code = '''
using OnlineStats

o = Series(Mean(), Variance(), Moments(), Extrema())  # full summary in one pass
fit!(o, {{data}})  # single-pass computation

println("Mean:     ", value(o[1]))  # first moment
println("Variance: ", value(o[2]))  # second central moment
println("Skewness: ", skewness(o[3]))  # third standardised moment
println("Kurtosis: ", kurtosis(o[3]))  # excess kurtosis (0 for a normal)
println("Extrema:  ", value(o[4]))  # min and max
'''

[[actionGroups.actions]]
id = "regression-coefs"
models = ["linreg"]
label = "Regression Coefficients"
desc = "Display the coefficient estimates, solved from the running sums of cross-products, and the number of observations"
code = '''
using OnlineStats

o = LinReg(size({{X}}, 2))  # online regression
fit!(o, zip(eachrow({{X}}), {{data}}))  # stream data

println("Coefficients: ", coef(o))  # ordinary least squares from the running sums of cross-products
println("Observations: ", nobs(o))  # number of observations processed
'''
