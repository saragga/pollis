[[codeBranches]]
model = "gcn"
code = '''
using Flux, GraphNeuralNetworks

in_channels     = {{in-channels}}  # input node features
hidden_channels = {{hidden-channels}}  # hidden dimension
out_channels    = {{out-channels}}  # output dimension
num_layers      = {{num-layers}}  # message-passing hops
{{?graph-type=hetero}} num_relations   = {{num-relations}}  # edge types

conv(n_in, n_out) = GCNConv(n_in => n_out, relu)  # symmetric-normalised neighbourhood average

{{?graph-type=homo}} model = GNNChain(
{{?graph-type=homo}}     GNNChain(conv(in_channels, hidden_channels), [conv(hidden_channels, hidden_channels) for _ in 2:num_layers]..., Dropout({{dropout}})),  # encoder
{{?graph-type=homo}}     Dense(hidden_channels => out_channels),  # node readout
{{?graph-type=homo}} )
{{?graph-type=homo}} embed(model, g, x) = model[1](g, x)
{{?graph-type=homo}} forward(model, g, x) = model(g, x)
{{?graph-type=hetero}} relations = [(:node, Symbol("rel_", r), :node) for r in 1:num_relations]
{{?graph-type=hetero}} hconv(n_in, n_out) = HeteroGraphConv([rel => conv(n_in, n_out) for rel in relations]...; aggr=+)  # one conv per relation, summed
{{?graph-type=hetero}} struct HeteroGNN
{{?graph-type=hetero}}     layers; drop; readout
{{?graph-type=hetero}} end
{{?graph-type=hetero}} Flux.@layer HeteroGNN
{{?graph-type=hetero}} function embed(m::HeteroGNN, g, x)
{{?graph-type=hetero}}     h = (node = x,)  # features keyed by node type
{{?graph-type=hetero}}     for layer in m.layers
{{?graph-type=hetero}}         h = layer(g, h)
{{?graph-type=hetero}}     end
{{?graph-type=hetero}}     m.drop(h.node)
{{?graph-type=hetero}} end
{{?graph-type=hetero}} forward(m, g, x) = m.readout(embed(m, g, x))
{{?graph-type=hetero}} model = HeteroGNN(
{{?graph-type=hetero}}     [hconv(in_channels, hidden_channels); [hconv(hidden_channels, hidden_channels) for _ in 2:num_layers]],
{{?graph-type=hetero}}     Dropout({{dropout}}),
{{?graph-type=hetero}}     Dense(hidden_channels => out_channels),
{{?graph-type=hetero}} )

# Transductive split: every node takes part in message passing, but only the training labels
# enter the loss; the validation nodes pick the epoch and the test nodes are scored once
using Random
n_nodes = size({{yvar}}, 2)
perm = randperm(Xoshiro(1), n_nodes)
n_train, n_val = round(Int, 0.6 * n_nodes), round(Int, 0.2 * n_nodes)
train_idx, val_idx, test_idx = perm[1:n_train], perm[n_train+1:n_train+n_val], perm[n_train+n_val+1:end]

loss(model, g, x, y; idx=train_idx) = Flux.mse(forward(model, g, x)[:, idx], y[:, idx])  # node-level MSE on the chosen nodes
opt_state = Flux.setup(Adam(1f-3), model)
best_val, best_model = Inf, deepcopy(model)
for epoch in 1:200
    Flux.train!(loss, model, [({{gvar}}, {{xvar}}, {{yvar}})], opt_state)  # full batch: the whole graph is propagated, the loss sees the training nodes only
    v = loss(model, {{gvar}}, {{xvar}}, {{yvar}}; idx=val_idx)
    if v < best_val  # keep the epoch with the lowest validation MSE
        global best_val, best_model = v, deepcopy(model)
    end
end
model = best_model
(train = loss(model, {{gvar}}, {{xvar}}, {{yvar}}), validation = best_val, test = loss(model, {{gvar}}, {{xvar}}, {{yvar}}; idx=test_idx))
'''

[[codeBranches]]
model = "gat"
code = '''
using Flux, GraphNeuralNetworks

in_channels     = {{in-channels}}  # input node features
hidden_channels = {{hidden-channels}}  # hidden dimension (per head x heads)
out_channels    = {{out-channels}}  # output dimension
num_layers      = {{num-layers}}  # message-passing hops
num_heads       = {{num-heads}}  # attention heads (must divide hidden_channels)
{{?graph-type=hetero}} num_relations   = {{num-relations}}  # edge types

conv(n_in, n_out) = GATConv(n_in => div(n_out, num_heads), elu; heads=num_heads, concat=true)  # heads concatenated back to n_out

{{?graph-type=homo}} model = GNNChain(
{{?graph-type=homo}}     GNNChain(conv(in_channels, hidden_channels), [conv(hidden_channels, hidden_channels) for _ in 2:num_layers]..., Dropout({{dropout}})),  # encoder
{{?graph-type=homo}}     Dense(hidden_channels => out_channels),  # node readout
{{?graph-type=homo}} )
{{?graph-type=homo}} embed(model, g, x) = model[1](g, x)
{{?graph-type=homo}} forward(model, g, x) = model(g, x)
{{?graph-type=hetero}} relations = [(:node, Symbol("rel_", r), :node) for r in 1:num_relations]
{{?graph-type=hetero}} hconv(n_in, n_out) = HeteroGraphConv([rel => conv(n_in, n_out) for rel in relations]...; aggr=+)  # own attention weights per relation
{{?graph-type=hetero}} struct HeteroGNN
{{?graph-type=hetero}}     layers; drop; readout
{{?graph-type=hetero}} end
{{?graph-type=hetero}} Flux.@layer HeteroGNN
{{?graph-type=hetero}} function embed(m::HeteroGNN, g, x)
{{?graph-type=hetero}}     h = (node = x,)  # features keyed by node type
{{?graph-type=hetero}}     for layer in m.layers
{{?graph-type=hetero}}         h = layer(g, h)
{{?graph-type=hetero}}     end
{{?graph-type=hetero}}     m.drop(h.node)
{{?graph-type=hetero}} end
{{?graph-type=hetero}} forward(m, g, x) = m.readout(embed(m, g, x))
{{?graph-type=hetero}} model = HeteroGNN(
{{?graph-type=hetero}}     [hconv(in_channels, hidden_channels); [hconv(hidden_channels, hidden_channels) for _ in 2:num_layers]],
{{?graph-type=hetero}}     Dropout({{dropout}}),
{{?graph-type=hetero}}     Dense(hidden_channels => out_channels),
{{?graph-type=hetero}} )

# Transductive split: every node takes part in message passing, but only the training labels
