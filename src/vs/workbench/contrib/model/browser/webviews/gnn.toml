[[codeBranches]]
model = "temporal"
code = '''
using Flux, GraphNeuralNetworks

in_channels     = {{in-channels}}  # input node features
hidden_channels = {{hidden-channels}}  # hidden dimension
out_channels    = {{out-channels}}  # output dimension

# EvolveGCN-O: a GRU evolves the GCN weight matrix from one snapshot to the next
model = (evolve = EvolveGCNO(in_channels => hidden_channels), readout = Dense(hidden_channels => out_channels))

embed(model, snapshots, xs) = model.evolve(TemporalSnapshotsGNNGraph(snapshots), xs)[end]  # embeddings after the final snapshot
forward(model, snapshots, xs) = model.readout(embed(model, snapshots, xs))

# Transductive split: every node takes part in message passing, but only the training labels
# enter the loss; the validation nodes pick the epoch and the test nodes are scored once
using Random
n_nodes = size({{yvar}}, 2)
perm = randperm(Xoshiro(1), n_nodes)
n_train, n_val = round(Int, 0.6 * n_nodes), round(Int, 0.2 * n_nodes)
train_idx, val_idx, test_idx = perm[1:n_train], perm[n_train+1:n_train+n_val], perm[n_train+n_val+1:end]

loss(model, g, x, y; idx=train_idx) = Flux.mse(forward(model, g, x)[:, idx], y[:, idx])  # node-level MSE on the chosen nodes
opt_state = Flux.setup(Adam(1f-3), model)
best_val, best_model = Inf, deepcopy(model)
for epoch in 1:200
    Flux.train!(loss, model, [({{gvar}}, {{xvar}}, {{yvar}})], opt_state)  # {{gvar}}: vector of snapshots, {{xvar}}: one feature matrix per snapshot
    v = loss(model, {{gvar}}, {{xvar}}, {{yvar}}; idx=val_idx)
    if v < best_val  # keep the epoch with the lowest validation MSE
        global best_val, best_model = v, deepcopy(model)
    end
end
model = best_model
(train = loss(model, {{gvar}}, {{xvar}}, {{yvar}}), validation = best_val, test = loss(model, {{gvar}}, {{xvar}}, {{yvar}}; idx=test_idx))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fit-plot"
label = "Predictions vs Targets"
desc = "Scatter each held-out test node's prediction against its target; points should hug the diagonal"
code = '''
using Plots

y_hat = forward(model, {{gvar}}, {{xvar}})[:, test_idx]
y_test = {{yvar}}[:, test_idx]
scatter(vec(y_test), vec(y_hat), xlabel="target", ylabel="prediction", title="test nodes", alpha=0.5, legend=false)
plot!(identity, extrema(vec(y_test))..., linestyle=:dash)
'''

