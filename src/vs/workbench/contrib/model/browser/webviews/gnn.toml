[[actionGroups.actions]]
id = "mlp-baseline"
label = "vs Graph-Free MLP"
desc = "Train an MLP on the node features alone, on the same training nodes and with the same validation epoch choice: the test-MSE gap shows how much the graph structure adds"
code = '''
{{?model!=temporal}} Xn = {{xvar}}
{{?model=temporal}} Xn = {{xvar}}[end]  # features of the final snapshot
mlp_loss(m, idx) = Flux.mse(m(Xn[:, idx]), {{yvar}}[:, idx])
mlp = Chain(Dense(size(Xn, 1) => hidden_channels, relu), Dense(hidden_channels => out_channels))
mlp_state = Flux.setup(Adam(1f-3), mlp)
best_mlp_val, best_mlp = Inf, deepcopy(mlp)
for epoch in 1:200
    Flux.train!((m, x, y) -> Flux.mse(m(x), y), mlp, [(Xn[:, train_idx], {{yvar}}[:, train_idx])], mlp_state)
    v = mlp_loss(mlp, val_idx)
    if v < best_mlp_val
        global best_mlp_val, best_mlp = v, deepcopy(mlp)
    end
end
(gnn_test = loss(model, {{gvar}}, {{xvar}}, {{yvar}}; idx=test_idx), mlp_test = mlp_loss(best_mlp, test_idx))  # out-of-sample comparison
'''

