[[models]]
id = "gcn"
label = "GCN"

[[models]]
id = "gat"
label = "GAT"

[[models]]
id = "sage"
label = "GraphSAGE"

[[models]]
id = "temporal"
label = "Temporal GNN"

[[bullets]]
text = "GCN"
detail = "spectral convolution with symmetric normalisation; efficient baseline for homogeneous graphs"

[[bullets]]
text = "GAT"
detail = "attention-weighted aggregation; learns which neighbours matter most"

[[bullets]]
text = "GraphSAGE"
detail = "inductive sampling-based aggregation; scales to graphs with unseen nodes at inference"

[[bullets]]
text = "Temporal GNN"
detail = "EvolveGCN-O; GRU evolves GCN weight matrices across discrete graph snapshots"

[[decisionRows]]
task = "GCN"
context = "Homogeneous graph, neighbours roughly equally informative"
purpose = "Normalised neighbourhood averaging; fast, strong baseline"

[[decisionRows]]
task = "GAT"
context = "Some neighbours matter much more than others"
purpose = "Learned attention weights over each node's neighbours"

[[decisionRows]]
task = "GraphSAGE"
context = "Large graphs, or new nodes appear at prediction time"
purpose = "Inductive: combines a node with an aggregate (mean, max, sum) of its neighbours"

[[decisionRows]]
task = "Temporal GNN"
context = "A sequence of graph snapshots over time"
purpose = "EvolveGCN-O: a GRU evolves the GCN weights from snapshot to snapshot"

[[decisionRows]]
task = "Heterogeneous"
context = "Several edge types with different meaning"
purpose = "Separate convolution weights per relation, summed per node"

[[inputs]]
id = "gvar"
label = "Graph"
tooltip = "A GNNGraph (a GNNHeteroGraph with relations (:node, :rel_1, :node), ... when Graph type is Heterogeneous). For the Temporal GNN: a vector of GNNGraph snapshots over the same nodes."
default = "g"

[[inputs]]
id = "xvar"
label = "Node features"
tooltip = "in_channels x num_nodes matrix of node features. For the Temporal GNN: a vector with one such matrix per snapshot."
default = "X"

[[inputs]]
id = "yvar"
label = "Target variable"
tooltip = "out_channels x num_nodes matrix of node targets (for the Temporal GNN: the targets after the final snapshot)."
default = "y"

[[inputs]]
id = "in-channels"
label = "in_channels"
tooltip = "Number of input node features. In financial graphs, features might include balance-sheet ratios, trading volumes, or sector embeddings."
default = "16"
newRow = true

[[inputs]]
id = "hidden-channels"
label = "hidden_channels"
tooltip = "Size of the hidden node embedding produced by each GNN layer. Larger values increase model capacity. For GAT it must be divisible by num_heads. Typical range: 32-256."
default = "64"

[[inputs]]
id = "out-channels"
label = "out_channels"
tooltip = "Output dimension per node: 1 for node regression, or the embedding size fed to a downstream head."
default = "1"

[[inputs]]
id = "num-layers"
label = "num_layers"
tooltip = "Number of stacked graph convolution layers. Each layer aggregates one additional hop of neighbours. More layers risk over-smoothing on dense graphs. Typical range: 2-4."
default = "2"
models = ["gcn", "gat", "sage"]
newRow = true

[[inputs]]
id = "dropout"
label = "dropout"
tooltip = "Dropout probability applied to the node embeddings before the readout. Set to 0 to disable. Typical range: 0.1-0.5."
default = "0.0"
models = ["gcn", "gat", "sage"]

[[inputs]]
id = "num-heads"
label = "num_heads"
tooltip = "Number of parallel attention heads in GAT. Each head attends to neighbours independently and their outputs are concatenated. Must divide hidden_channels evenly. Typical: 4 or 8."
default = "4"
models = ["gat"]

[[inputs]]
id = "aggr"
label = "aggr"
tooltip = "How GraphSAGE combines neighbour embeddings: mean (smooth, degree-independent), max (picks the strongest signal) or sum (keeps degree information)."
kind = "select"
default = "mean"
models = ["sage"]

[[inputs.options]]
value = "mean"
label = "mean"

[[inputs.options]]
value = "max"
label = "max"

[[inputs.options]]
value = "+"
label = "sum"

[[inputs]]
id = "graph-type"
label = "Graph type"
tooltip = "Heterogeneous assigns separate weight matrices to each relation type via HeteroGraphConv. Use it when edge types carry different meaning, e.g. ownership, co-trading and sentiment links between firms."
kind = "select"
default = "homo"
models = ["gcn", "gat", "sage"]
newRow = true

[[inputs.options]]
value = "homo"
label = "Homogeneous"

[[inputs.options]]
value = "hetero"
label = "Heterogeneous"

[[inputs]]
id = "num-relations"
label = "num_relations"
tooltip = "Number of distinct edge (relation) types in the heterogeneous graph. Each relation type has its own convolution weights."
default = "3"
models = ["gcn", "gat", "sage"]
when = "graph-type=hetero"

