id = "training-curve"
label = "Training Curve"
desc = "Train a copy of the network further, recording the training and validation MSE after every epoch; a rising validation curve means over-fitting"
code = '''
using Plots

m = deepcopy(model)  # leave the selected model untouched
m_state = Flux.setup(Adam(1f-3), m)
train_hist, val_hist = Float32[], Float32[]
for epoch in 1:200
    Flux.train!(loss, m, [({{gvar}}, {{xvar}}, {{yvar}})], m_state)
    push!(train_hist, loss(m, {{gvar}}, {{xvar}}, {{yvar}}))
    push!(val_hist, loss(m, {{gvar}}, {{xvar}}, {{yvar}}; idx=val_idx))
end
plot([train_hist val_hist], label=["train" "validation"], xlabel="epoch", ylabel="MSE", yscale=:log10)
'''

