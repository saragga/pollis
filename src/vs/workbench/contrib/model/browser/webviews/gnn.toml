# Graph Neural Networks Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/gnn.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Graph Neural Networks"
viewType = "pollis.gnn"
defaultModel = "gcn"

[[packages]]
name = "Flux.jl"
github = "https://github.com/FluxML/Flux.jl"

[[packages.videos]]
title = "High Performance Computing in Julia"
description = "An 18-video course by Jamie Mair on writing fast Julia code"
url = "https://www.youtube.com/playlist?list=PLUAq6xQKFgGr39PiyrPk_C9dhBKvWcjUA"

[[packages]]
name = "GraphNeuralNetworks.jl"
github = "https://github.com/CarloLucibello/GraphNeuralNetworks.jl"

[requires]
packages = ["Plots.jl", "MultivariateStats.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "GCN Basics"
file = "gnn/tutorial-01-gcn.ipynb"
bundled = true
description = "Node classification with Graph Convolutional Networks using GraphNeuralNetworks.jl"

[[notebookSections.notebooks]]
name = "Graph Attention Networks"
file = "gnn/tutorial-02-gat.ipynb"
bundled = true
description = "Attention-weighted neighbourhood aggregation with GATConv"

[[notebookSections.notebooks]]
name = "GraphSAGE"
file = "gnn/tutorial-03-graphsage.ipynb"
bundled = true
description = "Inductive learning on large graphs with neighbour sampling"

[[notebookSections.notebooks]]
name = "Temporal GNNs"
file = "gnn/tutorial-04-temporal.ipynb"
bundled = true
description = "EvolveGCN for dynamic graphs with time-varying topology"

