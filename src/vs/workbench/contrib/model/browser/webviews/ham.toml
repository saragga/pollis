[[bullets]]
text = "Solves Hamilton-Jacobi-Bellman (HJB) equations and Kolmogorov Forward Equations (KFE) for heterogeneous-agent models using finite difference methods"
detail = ""

[[bullets]]
text = "Handles Huggett, Aiyagari, and HANK-style models with idiosyncratic income risk and incomplete asset markets"
detail = ""

