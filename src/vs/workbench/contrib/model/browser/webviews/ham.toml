[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "equilibrium_rate"
label = "Equilibrium Interest Rate"
desc = "Find the market-clearing risk-free rate such that aggregate asset demand equals supply"
code = '''
using EconPDEs, OrderedCollections: OrderedDict

function excess_demand(r)  # net asset demand as function of interest rate r
    m         = HuggettModel(gamma = {{gamma}}, rho = {{rho}}, r = r, sigma = {{sigma}}, kappa = {{kappa}}, phi = {{phi}})
    stategrid = OrderedDict(:w => range({{phi}}, 20.0; length = {{N}}))
    y0        = OrderedDict(:V => zeros({{N}}), :g => zeros({{N}}))
    res, _    = pdesolve(m, stategrid, y0)
    return dot(res[:g], collect(range({{phi}}, 20.0; length = {{N}})))  # aggregate wealth (should = 0 in equilibrium)
end

r_eq = find_zero(excess_demand, ({{rho}} - 0.02, {{rho}}))  # bisection over plausible interest rate range
println("Equilibrium interest rate: ", round(r_eq, digits = 5))
'''

[[actionGroups.actions]]
id = "wealth_gini"
label = "Wealth Gini Coefficient"
desc = "Compute the Gini index of the stationary wealth distribution as a measure of inequality"
code = '''
using EconPDEs, OrderedCollections: OrderedDict

m         = HuggettModel(gamma = {{gamma}}, rho = {{rho}}, sigma = {{sigma}}, kappa = {{kappa}}, phi = {{phi}})
w_grid    = collect(range({{phi}}, 20.0; length = {{N}}))
stategrid = OrderedDict(:w => w_grid)
y0        = OrderedDict(:V => zeros({{N}}), :g => zeros({{N}}))

result, _ = pdesolve(m, stategrid, y0)

g   = result[:g]  # stationary distribution weights
mu  = dot(g, w_grid)  # mean wealth
mad = sum(g[i] * g[j] * abs(w_grid[i] - w_grid[j]) for i in 1:{{N}} for j in 1:{{N}})  # mean absolute difference (expensive for large N)
gini = mad / (2 * mu)  # Gini = MAD / (2 * mean)
println("Wealth Gini: ", round(gini, digits = 4))
'''

[[actionGroups.actions]]
id = "consumption_insurance"
label = "Consumption Insurance"
desc = "Assess the degree of consumption smoothing relative to income risk"
code = '''
using EconPDEs, OrderedCollections: OrderedDict

m         = HuggettModel(gamma = {{gamma}}, rho = {{rho}}, sigma = {{sigma}}, kappa = {{kappa}}, phi = {{phi}})
w_grid    = collect(range({{phi}}, 20.0; length = {{N}}))
stategrid = OrderedDict(:w => w_grid)
y0        = OrderedDict(:V => zeros({{N}}), :g => zeros({{N}}))

result, _ = pdesolve(m, stategrid, y0)

g     = result[:g]  # stationary distribution
c_pol = result[:c]  # consumption policy
c_mean = dot(g, c_pol)  # mean consumption
c_var  = dot(g, (c_pol .- c_mean).^2)  # consumption variance
c_cv   = sqrt(c_var) / c_mean  # consumption coefficient of variation
inc_cv = {{sigma}} / sqrt(2 * {{kappa}})  # income CV under Ornstein-Uhlenbeck

println("Consumption CV: ", round(c_cv, digits=4))
println("Income CV:      ", round(inc_cv, digits=4))
println("Insurance ratio: ", round(1 - c_cv/inc_cv, digits=4))  # 0 = no insurance, 1 = full insurance
'''
