detail = ""

[[inputs]]
id = "gamma"
label = "gamma (risk aversion)"
tooltip = "Coefficient of relative risk aversion. Higher values imply stronger preference for consumption smoothing."
default = "2.0"

[[inputs]]
id = "rho"
label = "rho (discount rate)"
tooltip = "Subjective discount rate in continuous time. Sets the agent’s time preference."
default = "0.05"

[[inputs]]
id = "sigma"
label = "sigma (income vol)"
tooltip = "Standard deviation of the idiosyncratic income shock in the diffusion process."
default = "0.1"

[[inputs]]
id = "kappa"
label = "kappa (mean reversion)"
tooltip = "Mean-reversion speed of the income process. Higher values imply faster return to the long-run mean."
default = "0.3"

[[inputs]]
id = "phi"
label = "phi (borrowing limit)"
tooltip = "Borrowing limit (ad hoc constraint). phi = 0 means no borrowing; negative values allow debt up to |phi|."
default = "0.0"

[[inputs]]
id = "N"
label = "N (grid points)"
tooltip = "Number of grid points for the wealth state space discretisation. More points give higher accuracy."
default = "500"

[[codeBranches]]
model = "main"
code = '''
using EconPDEs
using OrderedCollections: OrderedDict

m = HuggettModel(  # define the heterogeneous-agent model
    gamma = {{gamma}}, rho = {{rho}},  # utility parameters
    sigma = {{sigma}}, kappa = {{kappa}},  # income process
    phi   = {{phi}})

stategrid = OrderedDict(:w => range({{phi}}, 20.0; length = {{N}}))  # wealth state grid from borrowing limit to max wealth
y0        = OrderedDict(:V => zeros({{N}}), :g => zeros({{N}}))  # initial guess: value function and distribution

result, _ = pdesolve(m, stategrid, y0)  # solve HJB + KFE system

V = result[:V]  # value function on wealth grid
g = result[:g]  # stationary wealth distribution
c_pol = result[:c]  # consumption policy function
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence"
label = "Convergence Check"
desc = "Verify that the PDE solver converged and inspect the residual of the HJB equation"
code = '''
using EconPDEs, OrderedCollections: OrderedDict

m         = HuggettModel(gamma = {{gamma}}, rho = {{rho}}, sigma = {{sigma}}, kappa = {{kappa}}, phi = {{phi}})
stategrid = OrderedDict(:w => range({{phi}}, 20.0; length = {{N}}))
y0        = OrderedDict(:V => zeros({{N}}), :g => zeros({{N}}))

result, iterations = pdesolve(m, stategrid, y0)

println("Solver iterations: ", iterations)  # number of Newton iterations to convergence
println("V range: [", round(minimum(result[:V]), digits=4), ", ", round(maximum(result[:V]), digits=4), "]")  # value function range
println("Distribution mass: ", round(sum(result[:g]), digits=6))  # should integrate to 1
'''

[[actionGroups.actions]]
id = "wealth_dist"
label = "Wealth Distribution"
desc = "Plot the cross-sectional stationary wealth distribution on the state grid"
code = '''
using EconPDEs, OrderedCollections: OrderedDict, Plots

m         = HuggettModel(gamma = {{gamma}}, rho = {{rho}}, sigma = {{sigma}}, kappa = {{kappa}}, phi = {{phi}})
w_grid    = range({{phi}}, 20.0; length = {{N}})
stategrid = OrderedDict(:w => w_grid)
y0        = OrderedDict(:V => zeros({{N}}), :g => zeros({{N}}))

result, _ = pdesolve(m, stategrid, y0)

plot(w_grid, result[:g];  # stationary wealth density
    xlabel = "Wealth", ylabel = "Density",
    title = "Stationary Wealth Distribution", legend = false)
'''

