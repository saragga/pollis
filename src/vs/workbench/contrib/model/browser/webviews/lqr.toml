[[models]]
id = "of"
label = "Output-Feedback LQG"

[[bullets]]
text = "State-Feedback Linear Quadratic Regulator (LQR)"
detail = "Computes optimal state-feedback gain K to minimize a quadratic cost function. All state variables must be measurable; cost penalizes both state deviation and control effort. Yields closed-loop poles with optimal stability-performance tradeoff via the Discrete Algebraic Riccati Equation (DARE)."

[[bullets]]
text = "Output-Feedback Linear Quadratic Gaussian (LQG)"
detail = "Combines LQR with a Kalman filter when only partial/noisy measurements are available. Computes both the optimal state-feedback gain K (DARE for control) and the optimal observer gain L (dual DARE for filtering). The separation principle guarantees optimality of the combined controller."

[[decisionRows]]
task = "State-Feedback LQR"
context = "Every state is measured (or cheaply estimated) and the model is linear"
purpose = "Solve the discrete Riccati equation once for the gain K; u = -K x minimises the sum of x'Qx + u'Ru"

[[decisionRows]]
task = "Output-Feedback LQG"
context = "Only outputs y = Cx are measured, with process and measurement noise"
purpose = "Separation principle: combine the LQR gain with a Kalman filter estimate, u = -K x_hat"

[[inputs]]
id = "A"
label = "System Matrix A"
tooltip = "Discrete-time state transition matrix (n x n): x[k+1] = A x[k] + B u[k]. Default: a double integrator sampled at 0.1 s."
default = "[1.0 0.1; 0.0 1.0]"

[[inputs]]
id = "B"
label = "Input Matrix B"
tooltip = "Input-to-state matrix (n x m); a single input still needs a matrix, e.g. reshape([0.005, 0.1], 2, 1)."
default = "reshape([0.005, 0.1], 2, 1)"

[[inputs]]
id = "Ts"
label = "Sample Time"
tooltip = "Sampling period of the discrete-time model in seconds, used for the time axis and the frequency analysis."
default = "0.1"

[[inputs]]
id = "Q"
label = "State Cost Q"
tooltip = "Symmetric positive-semidefinite (n x n) penalty on state deviation. Larger entries drive those states to zero faster."
default = "[1.0 0.0; 0.0 0.1]"
newRow = true

[[inputs]]
id = "R"
label = "Control Cost R"
tooltip = "Symmetric positive-definite (m x m) penalty on control effort. Larger values give gentler control and slower regulation."
default = "fill(0.01, 1, 1)"

[[inputs]]
id = "x0"
label = "Initial State x0"
tooltip = "Initial state for the simulations, as a Julia vector of length n."
default = "[1.0, 0.0]"

[[inputs]]
id = "N"
label = "Steps"
tooltip = "Number of simulation steps."
default = "100"

[[inputs]]
id = "C"
label = "Output Matrix C"
tooltip = "Measurement matrix (p x n): y = C x + v. Default: position only."
default = "[1.0 0.0]"
models = ["of"]
newRow = true

[[inputs]]
id = "W"
label = "Process Noise W"
tooltip = "Covariance (n x n, positive semidefinite) of the process noise w in x[k+1] = A x + B u + w."
default = "[1e-4 0.0; 0.0 1e-4]"
models = ["of"]

[[inputs]]
id = "V"
label = "Measurement Noise V"
tooltip = "Covariance (p x p, positive definite) of the measurement noise v. Larger V makes the Kalman filter trust the model more than the data."
default = "fill(1e-2, 1, 1)"
models = ["of"]

