[[codeBranches]]
model = "sf"
code = '''
using ControlSystemsBase, LinearAlgebra, Random

A, B = {{A}}, {{B}}  # x[k+1] = A x[k] + B u[k]
Q, R = {{Q}}, {{R}}  # stage cost x'Qx + u'Ru
Ts = {{Ts}}  # sample time
x0 = {{x0}}  # initial state
N  = {{N}}  # simulation steps
n, m = size(B)

sys = ss(A, B, I(n), 0, Ts)  # full-state measurement
K = lqr(sys, Q, R)  # optimal gain from the discrete Riccati equation: u = -K x

function simulate(K; x0=x0, N=N)
    X = zeros(N + 1, n); U = zeros(N, m); X[1, :] = x0
    for k in 1:N
        u = -K * X[k, :]
        U[k, :] = u
        X[k+1, :] = A * X[k, :] + B * u
    end
    (X = X, U = U, cost = sum(dot(X[k, :], Q * X[k, :]) + dot(U[k, :], R * U[k, :]) for k in 1:N))
end

sim = simulate(K)
A_cl = A - B * K  # closed-loop state matrix
(gain = K, closed_loop_poles = eigvals(A_cl), stable = maximum(abs, eigvals(A_cl)) < 1, simulated_cost = sim.cost)
'''

[[codeBranches]]
model = "of"
code = '''
using ControlSystemsBase, LinearAlgebra, Random

A, B = {{A}}, {{B}}  # x[k+1] = A x[k] + B u[k]
Q, R = {{Q}}, {{R}}  # stage cost x'Qx + u'Ru
Ts = {{Ts}}  # sample time
x0 = {{x0}}  # initial state
N  = {{N}}  # simulation steps
n, m = size(B)
C, W, V = {{C}}, {{W}}, {{V}}  # y = C x + v, process noise cov W, measurement noise cov V
p = size(C, 1)

sys = ss(A, B, C, 0, Ts)
K = lqr(sys, Q, R)  # state-feedback gain
L = kalman(sys, W, V)  # Kalman gain: x_hat[k+1] = A x_hat + B u + L (y - C x_hat)

function simulate(K; x0=x0, N=N, seed=1)
    rng = Xoshiro(seed)
    Wc = cholesky(Symmetric(float.(W) + 1e-12I)).L; Vc = cholesky(Symmetric(float.(V))).L
    X = zeros(N + 1, n); Xhat = zeros(N + 1, n); U = zeros(N, m); X[1, :] = x0
    for k in 1:N
        x, xh = X[k, :], Xhat[k, :]
        y = C * x + Vc * randn(rng, p)
        u = -K * xh  # certainty equivalence: act on the estimate
        U[k, :] = u
        X[k+1, :] = A * x + B * u + Wc * randn(rng, n)
        Xhat[k+1, :] = A * xh + B * u + L * (y - C * xh)
    end
    (X = X, Xhat = Xhat, U = U, cost = sum(dot(X[k, :], Q * X[k, :]) + dot(U[k, :], R * U[k, :]) for k in 1:N))
end

sim = simulate(K)
A_cl = A - B * K  # closed-loop state matrix
(gain = K, closed_loop_poles = eigvals(A_cl), stable = maximum(abs, eigvals(A_cl)) < 1, simulated_cost = sim.cost)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "state-trajectory"
label = "State Trajectory"
desc = "The closed-loop states from x0 (with the Kalman estimates dashed for LQG)"
code = '''
using Plots

t = Ts .* (0:N)
p = plot(t, sim.X, label=permutedims(["x$i" for i in 1:n]), xlabel="time", ylabel="state")
{{?model=of}} plot!(p, t, sim.Xhat, linestyle=:dash, label=permutedims(["x$(i) estimate" for i in 1:n]))
p
'''

[[actionGroups.actions]]
id = "control-signal"
label = "Control Signal"
desc = "The optimal input u[k] = -K x[k] held over each sample"
code = '''
using Plots

plot(Ts .* (0:N-1), sim.U, linetype=:steppost, label=permutedims(["u$j" for j in 1:m]), xlabel="time", ylabel="control")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "structural-check"
label = "Controllability & Observability"
desc = "Ranks of the controllability matrix (must be n for arbitrary pole placement) and of the observability matrix of the measured or penalised outputs (needed for a stabilising, unique Riccati solution)"
code = '''
Cq = sqrt(Symmetric(float.(Q)))  # the cost sees the states through Q^(1/2)
(n = n, controllability_rank = rank(ctrb(A, B)), cost_observability_rank = rank(obsv(A, Cq)),
{{?model=of}}  measurement_observability_rank = rank(obsv(A, C)),
 open_loop_poles = eigvals(A))
'''

[[actionGroups.actions]]
id = "closed-loop-poles"
label = "Closed-Loop Poles"
desc = "Open- and closed-loop eigenvalues against the unit circle (inside = stable), with the estimator poles A - LC for LQG"
code = '''
using Plots

pl = plot(cos.(0:0.01:2pi), sin.(0:0.01:2pi), color=:gray, label="unit circle", aspect_ratio=:equal, xlabel="Re", ylabel="Im")
scatter!(pl, real(eigvals(A)), imag(eigvals(A)), marker=:x, markersize=6, label="open loop")
scatter!(pl, real(eigvals(A - B * K)), imag(eigvals(A - B * K)), label="LQR closed loop")
{{?model=of}} scatter!(pl, real(eigvals(A - L * C)), imag(eigvals(A - L * C)), marker=:diamond, label="estimator")
pl
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "new-initial-state"
label = "Response from New State"
desc = "Simulate the controlled system from a different initial state"
code = '''
using Plots

x_new = 2 .* x0  # replace with the initial state of interest
s = simulate(K; x0=x_new)
display(plot(Ts .* (0:N), s.X, label=permutedims(["x$i" for i in 1:n]), xlabel="time"))
(final_state = s.X[end, :], cost = s.cost, peak_control = maximum(abs, s.U))
'''

[[actionGroups.actions]]
id = "cost-to-go"
label = "Predicted Cost"
desc = "The Riccati solution P predicts the infinite-horizon cost x0' P x0 before simulating; compare it with the simulated cost"
code = '''
using MatrixEquations

P = ared(A, B, R, Q)[1]  # stabilising solution of the discrete algebraic Riccati equation
(predicted_cost = dot(x0, P * x0), simulated_cost = sim.cost, riccati_solution = P)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-uncontrolled"
label = "vs. Uncontrolled"
desc = "The closed-loop state norm against the open-loop system (u = 0) from the same initial state"
code = '''
using Plots

Xol = zeros(N + 1, n); Xol[1, :] = x0
for k in 1:N
    Xol[k+1, :] = A * Xol[k, :]
end
t = Ts .* (0:N)
plot(t, norm.(eachrow(Xol)), label="open loop", xlabel="time", ylabel="state norm")
plot!(t, norm.(eachrow(sim.X)), label="closed loop")
'''

[[actionGroups.actions]]
id = "weight-sweep"
label = "Control-Weight Sweep"
desc = "Scale R over four orders of magnitude: state cost against control cost (the LQR trade-off curve) and how fast the state settles"
code = '''
using Plots

res = map(10.0 .^ (-2:1:2)) do s
    Ks = lqr(sys, Q, s .* R)
    r = simulate(Ks)
    xc = sum(dot(r.X[k, :], Q * r.X[k, :]) for k in 1:N)
    uc = sum(dot(r.U[k, :], R * r.U[k, :]) for k in 1:N)
    (R_scale = s, state_cost = xc, control_cost = uc, spectral_radius = maximum(abs, eigvals(A - B * Ks)))
end
display(plot(getfield.(res, :control_cost), getfield.(res, :state_cost), marker=:circle, xlabel="control cost", ylabel="state cost", legend=false))
res
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "gain-analysis"
label = "Gain Analysis"
desc = "The optimal gain (rows = inputs, columns = states) and each row normalised by its largest entry: which states the controller reacts to most"
code = '''
(gain = K, relative_gain = K ./ maximum(abs.(K), dims=2))
'''

[[actionGroups.actions]]
id = "robustness"
label = "Stability Margins"
desc = "Gain and phase margins of the loop broken at the plant input (SISO): LQR guarantees generous margins with full state; LQG can lose them"
code = '''
{{?model=sf}} loop = ss(A, B, K, 0, Ts)  # loop transfer K (zI - A)^-1 B
{{?model=of}} ctrl = ss(A - B * K - L * C, L, K, 0, Ts); loop = ctrl * ss(A, B, C, 0, Ts)  # LQG controller in series with the plant
wgm, gm, wpm, pm = margin(loop)
(gain_margin = gm, gain_crossover = wgm, phase_margin_degrees = pm, phase_crossover = wpm)
'''
