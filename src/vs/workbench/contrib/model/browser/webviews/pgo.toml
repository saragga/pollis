[[decisionRows]]
task = "MLSL"
context = "Smooth multimodal problems where a good local solver is available"
purpose = "Multi-level single-linkage: sample low-discrepancy points and start a local search only from points not already near a found basin"

[[decisionRows]]
task = "StoGO-R"
context = "Smooth problems with cheap gradients"
purpose = "Branch-and-bound over boxes with gradient-based local searches inside each, with randomised box sampling"

[[decisionRows]]
task = "TikTak"
context = "Economic models estimated by minimising a loss (for example matching moments), where each local search is affordable"
purpose = "Evaluate a Sobol sequence, keep the best 10%, and start local searches from points pulled ever closer to the best minimum found; deterministic"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, using x[1], x[2], ... StoGO-R needs gradients, which are computed automatically with ForwardDiff. Default: the Rastrigin function (global minimum 0 at the origin, a grid of local minima around it)."
default = "20 + x[1]^2 + x[2]^2 - 10 * (cos(2pi * x[1]) + cos(2pi * x[2]))"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds, one per variable; its length sets the dimension."
default = "[-5.12, -5.12]"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds, one per variable. The default box is deliberately not centred on the Rastrigin optimum at the origin: DIRECT samples the centre first and the search starts there, so a symmetric box would hand every method the answer at its first evaluation."
default = "[7.0, 6.0]"

[[inputs]]
id = "budget"
label = "Budget"
tooltip = "Maximum number of objective evaluations (maxeval). Reaching it (MAXEVAL_REACHED) is the normal way these methods stop."
default = "2000"

[[inputs]]
id = "localopt"
label = "Local Optimiser"
tooltip = "Local algorithm MLSL and TikTak start from promising sample points. BOBYQA and Nelder-Mead are derivative-free; L-BFGS uses gradients from ForwardDiff."
kind = "select"
default = "LN_BOBYQA"
models = ["mlsl", "tiktak"]

[[inputs.options]]
value = "LN_BOBYQA"
label = "BOBYQA"

[[inputs.options]]
value = "LN_NELDERMEAD"
label = "Nelder-Mead"

[[inputs.options]]
value = "LD_LBFGS"
label = "L-BFGS"

