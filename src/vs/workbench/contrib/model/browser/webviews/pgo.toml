[[codeBranches]]
model = "mlsl"
code = '''
using NLopt, ForwardDiff, LinearAlgebra

f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
n = length(lb)
budget = {{budget}}  # evaluation budget
ALG = :G_MLSL_LDS  # multi-level single-linkage on a low-discrepancy sequence
LOCAL = :{{localopt}}  # local optimiser started from promising samples

# every evaluation is recorded so the search can be inspected afterwards
function search(; alg=ALG, budget=budget, lb=lb, ub=ub, seed=1)
    NLopt.srand(seed)  # fixes the random sampling of the stochastic methods
    pts, vals = Vector{Float64}[], Float64[]
    opt = Opt(alg, n)
    opt.lower_bounds, opt.upper_bounds, opt.maxeval = lb, ub, budget
    if alg == :G_MLSL_LDS
        loc = Opt(LOCAL, n); loc.xtol_rel = 1e-6
        opt.local_optimizer = loc
    end
    opt.min_objective = function (x, g)
        v = f(x)
        if length(g) > 0  # gradient-based algorithms request it
            g .= ForwardDiff.gradient(f, x)
        end
        push!(pts, copy(x)); push!(vals, v)
        v
    end
    fx, x, ret = optimize(opt, (lb .+ ub) ./ 2)  # NLopt needs a start point; AGS, DIRECT-L and StoGO ignore it and search the whole box
    (x = x, fx = fx, ret = ret, points = pts, values = vals)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = length(res.values), return_code = res.ret)
'''

[[codeBranches]]
model = "stogo-r"
code = '''
using NLopt, ForwardDiff, LinearAlgebra

f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
n = length(lb)
budget = {{budget}}  # evaluation budget
ALG = :GD_STOGO_RAND  # randomised StoGO: branch-and-bound with gradient local search
LOCAL = :LN_BOBYQA  # unused by StoGO

# every evaluation is recorded so the search can be inspected afterwards
function search(; alg=ALG, budget=budget, lb=lb, ub=ub, seed=1)
    NLopt.srand(seed)  # fixes the random sampling of the stochastic methods
    pts, vals = Vector{Float64}[], Float64[]
    opt = Opt(alg, n)
    opt.lower_bounds, opt.upper_bounds, opt.maxeval = lb, ub, budget
    if alg == :G_MLSL_LDS
        loc = Opt(LOCAL, n); loc.xtol_rel = 1e-6
        opt.local_optimizer = loc
    end
    opt.min_objective = function (x, g)
        v = f(x)
        if length(g) > 0  # gradient-based algorithms request it
            g .= ForwardDiff.gradient(f, x)
        end
        push!(pts, copy(x)); push!(vals, v)
        v
    end
    fx, x, ret = optimize(opt, (lb .+ ub) ./ 2)  # NLopt needs a start point; AGS, DIRECT-L and StoGO ignore it and search the whole box
    (x = x, fx = fx, ret = ret, points = pts, values = vals)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = length(res.values), return_code = res.ret)
'''

[[codeBranches]]
model = "tiktak"
code = '''
using NLopt, MultistartOptimization, ForwardDiff, LinearAlgebra

f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
n = length(lb)
budget = {{budget}}  # evaluation budget
ALG = :TIKTAK  # TikTak multistart (MultistartOptimization.jl); other values run that NLopt algorithm
LOCAL = :{{localopt}}  # local optimiser started from the kept points

# every evaluation is recorded so the search can be inspected afterwards
function search(; alg=ALG, budget=budget, lb=lb, ub=ub, seed=1)
    NLopt.srand(seed)  # fixes the random sampling of the stochastic methods; TikTak itself is deterministic
    pts, vals = Vector{Float64}[], Float64[]
    obj(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    function obj(x, g)  # NLopt form, used by the local searches
        if length(g) > 0  # gradient-based algorithms request it
            g .= ForwardDiff.gradient(f, x)
        end
        obj(x)
    end
    if alg == :TIKTAK
        N = max(div(budget, 4), 2)  # a quarter of the budget on Sobol points
        tiktak = TikTak(N)  # keeps the best 10% as starting points
        local_evals = div(budget - N, max(tiktak.initial_N - 1, 1))  # the rest split among the local searches
        local_method = NLopt_local_method(getfield(NLopt, LOCAL); xtol_rel=1e-6, maxeval=max(local_evals, 1))
        m = multistart_minimization(tiktak, local_method, MinimizationProblem(obj, lb, ub); use_threads=false)
        ret = hasproperty(m, :ret) ? m.ret : :SUCCESS  # no ret when the best point is a Sobol point
        return (x = m.location, fx = m.value, ret = ret, points = pts, values = vals)
    end
    opt = Opt(alg, n)
    opt.lower_bounds, opt.upper_bounds, opt.maxeval = lb, ub, budget
    if alg == :G_MLSL_LDS
        loc = Opt(LOCAL, n); loc.xtol_rel = 1e-6
        opt.local_optimizer = loc
    end
    opt.min_objective = obj
    fx, x, ret = optimize(opt, (lb .+ ub) ./ 2)  # NLopt needs a start point; AGS, DIRECT-L and StoGO ignore it and search the whole box
    (x = x, fx = fx, ret = ret, points = pts, values = vals)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = length(res.values), return_code = res.ret)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "landscape"
label = "Objective Landscape"
desc = "Heatmap of f over the box (first two variables; others held at the best point) with every evaluated point and the optimum"
code = '''
using Plots

xs = range(lb[1], ub[1], length=150); ys = range(lb[2], ub[2], length=150)
heatmap(xs, ys, (a, b) -> f([a; b; x_best[3:end]]), xlabel="x1", ylabel="x2")
scatter!(getindex.(res.points, 1), getindex.(res.points, 2), markersize=1.5, color=:white, alpha=0.5, label="evaluations")
scatter!([x_best[1]], [x_best[2]], marker=:star, markersize=10, color=:red, label="best")
'''

[[actionGroups.actions]]
id = "convergence"
label = "Convergence Curve"
desc = "Best value found against evaluations; the jumps are new basins found"
code = '''
using Plots

plot(accumulate(min, res.values), xlabel="evaluations", ylabel="best f", legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "return-status"
label = "Return Status"
desc = "What the return code means, the evaluations used and when the final best value was first reached"
code = '''
meaning = Dict(:SUCCESS => "generic success", :STOPVAL_REACHED => "reached the target value", :FTOL_REACHED => "function tolerance met",
               :XTOL_REACHED => "step tolerance met", :MAXEVAL_REACHED => "budget used up (normal for global methods)", :MAXTIME_REACHED => "time limit reached")
first_hit = findfirst(<=(f_best + 1e-9 * max(1, abs(f_best))), accumulate(min, res.values))
(return_code = res.ret, meaning = get(meaning, res.ret, "failure: check the bounds and the objective"),
 budget = budget, used = length(res.values), best_first_reached_at = first_hit)
'''

[[actionGroups.actions]]
id = "seed-robustness"
label = "Seed Robustness"
desc = "Repeat the search with 5 random seeds: MLSL and StoGO-R sample at random, so their results vary, while TikTak is deterministic; a spread of best values means the budget is too small"
code = '''
using Statistics

runs = [search(seed=s) for s in 1:5]
v = getfield.(runs, :fx)
(best_values = v, mean = mean(v), spread = std(v), max_distance_between_solutions = maximum(norm(r.x - runs[1].x) for r in runs))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "solution"
label = "Solution"
desc = "Best point and value, with the gradient norm there (near 0 at an interior minimum)"
code = '''
(best_point = x_best, best_value = f_best, gradient_norm = norm(ForwardDiff.gradient(f, x_best)), return_code = res.ret)
'''

[[actionGroups.actions]]
id = "local-polish"
label = "Local Polish"
desc = "Refine the global answer with a gradient-based local solver (L-BFGS with ForwardDiff gradients) inside the bounds"
code = '''
loc = Opt(:LD_LBFGS, n)
loc.lower_bounds, loc.upper_bounds, loc.xtol_rel, loc.maxeval = lb, ub, 1e-12, 1000
loc.min_objective = (x, g) -> (length(g) > 0 && (g .= ForwardDiff.gradient(f, x)); f(x))
f_loc, x_loc, ret_loc = optimize(loc, copy(x_best))
(global_point = x_best, global_value = f_best, polished_point = x_loc, polished_value = f_loc, improvement = f_best - f_loc, return_code = ret_loc)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-methods"
label = "Compare Methods"
desc = "MLSL, StoGO-R, AGS, DIRECT-L and CRS2 (and TikTak on its tab) at the same budget, averaged over 3 seeds; each method is run once on a tiny budget first, so the times exclude compilation"
code = '''
using Statistics

algs = ["MLSL" => :G_MLSL_LDS, "StoGO-R" => :GD_STOGO_RAND, "AGS" => :GN_AGS, "DIRECT-L" => :GN_DIRECT_L, "CRS2" => :GN_CRS2_LM]
{{?model=tiktak}}pushfirst!(algs, "TikTak" => :TIKTAK)
map(algs) do (name, a)
    search(alg=a, budget=20)  # warm-up: compile before timing
    sec = @elapsed runs = [search(alg=a, seed=s) for s in 1:3]
    (method = name, mean_best = mean(getfield.(runs, :fx)), worst_best = maximum(getfield.(runs, :fx)), seconds_per_run = sec / 3)
end
'''

[[actionGroups.actions]]
id = "budget-study"
label = "Budget Study"
desc = "Best value found as the evaluation budget grows"
code = '''
using Plots

budgets = [100, 250, 500, 1000, 2000, 5000]
best = [search(budget=b).fx for b in budgets]
display(plot(budgets, best, xscale=:log10, marker=:circle, xlabel="budget", ylabel="best f", legend=false))
[(budget = b, best_value = v) for (b, v) in zip(budgets, best)]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "algorithm-properties"
label = "Algorithm Properties"
desc = "What the selected algorithm assumes and guarantees"
code = '''
{{?model=mlsl}} (algorithm = "MLSL", deterministic = false, needs_gradient = LOCAL == :LD_LBFGS, local_refinement = true, local_optimizer = LOCAL, guarantee = "finds every local minimum with probability 1 as samples grow", practical_dimension = "up to about 20")
{{?model=tiktak}} (algorithm = "TikTak", deterministic = true, needs_gradient = LOCAL == :LD_LBFGS, local_refinement = true, local_optimizer = LOCAL, guarantee = "none: a heuristic; see the benchmarks of Arnoud, Guvenen and Kleineberg (2019)")
{{?model=stogo-r}} (algorithm = "StoGO-R", deterministic = false, needs_gradient = true, local_refinement = true, guarantee = "branch-and-bound with bounds from gradients", practical_dimension = "up to about 10")
'''

[[actionGroups.actions]]
id = "solution-summary"
label = "Solution Summary"
desc = "Best point, value, return code, evaluations and the box"
code = '''
(best_point = x_best, best_value = f_best, return_code = res.ret, evaluations = length(res.values), budget = budget,
 lower_bounds = lb, upper_bounds = ub, relative_position = (x_best .- lb) ./ (ub .- lb))
