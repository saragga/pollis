[[models]]
id = "me"
label = "Mean Excess"

[[models]]
id = "hill"
label = "Hill Plot"

[[models]]
id = "qq"
label = "QQ Plot"

[[bullets]]
text = "Mean excess plot: assess linearity to guide threshold selection"
detail = ""

[[bullets]]
text = "Hill plot: tail index estimation across order statistics"
detail = ""

[[bullets]]
text = "QQ plot: compare empirical and theoretical quantiles for Generalized Extreme Value or Generalized Pareto fit"
detail = ""

[[inputs]]
id = "evtd-data"
label = "Data series"
tooltip = ""
default = "losses"

[[inputs]]
id = "evtd-n-thresholds"
label = "Grid points"
tooltip = ""
default = "100"
models = ["me"]

[[inputs]]
id = "evtd-max-pct"
label = "Upper pct"
tooltip = ""
default = "0.95"
models = ["me"]

[[inputs]]
id = "evtd-min-obs"
label = "Min obs"
tooltip = ""
default = "10"
models = ["me"]

[[inputs]]
id = "evtd-dist-select"
label = "Distribution"
tooltip = ""
kind = "select"
default = "gev"
models = ["qq"]

[[inputs.options]]
value = "gev"
label = "GEV"

[[inputs.options]]
value = "gp"
label = "GP"

[[inputs]]
id = "evtd-qq-method"
label = "Estimation method"
tooltip = ""
kind = "select"
default = "mle"
models = ["qq"]

[[inputs.options]]
value = "mle"
label = "Maximum Likelihood"

[[inputs.options]]
value = "pwm"
label = "Probability-Weighted Moments"

[[inputs.options]]
value = "bayes"
label = "Bayesian Estimation"

[[inputs]]
id = "evtd-threshold-qq"
label = "Threshold u (GP)"
tooltip = "A high threshold: the generalised Pareto describes only the excesses over it. The 90th percentile of the losses is a common start; check it with the mean excess and threshold stability plots."
default = "quantile(losses, 0.9)"
models = ["qq"]

[[codeBranches]]
model = "me"
code = '''
using Statistics, Plots

u_grid  = range(minimum({{evtd-data}}), quantile({{evtd-data}}, {{evtd-max-pct}}); length = {{evtd-n-thresholds}})  # threshold grid up to {{evtd-max-pct}} percentile
me_vals = [mean({{evtd-data}}[{{evtd-data}} .> u] .- u) for u in u_grid if sum({{evtd-data}} .> u) >= {{evtd-min-obs}}]  # mean excess (skip thresholds with too few obs)
u_vals  = [u for u in u_grid if sum({{evtd-data}} .> u) >= {{evtd-min-obs}}]  # valid threshold values

scatter(u_vals, me_vals;
    xlabel = "Threshold u", ylabel = "Mean Excess",
    title  = "Mean Excess Plot", legend = false)

u50 = quantile({{evtd-data}}, 0.50)  # median threshold
u75 = quantile({{evtd-data}}, 0.75)  # 75th percentile threshold
u90 = quantile({{evtd-data}}, 0.90)  # 90th percentile threshold
println("Mean excess at Q50: ", round(mean({{evtd-data}}[{{evtd-data}} .> u50] .- u50), digits = 4))
println("Mean excess at Q75: ", round(mean({{evtd-data}}[{{evtd-data}} .> u75] .- u75), digits = 4))
println("Mean excess at Q90: ", round(mean({{evtd-data}}[{{evtd-data}} .> u90] .- u90), digits = 4))
'''

[[codeBranches]]
model = "hill"
code = '''
using Statistics, Plots

xs      = sort({{evtd-data}}; rev = true)  # descending order statistics
n       = length(xs)  # sample size
k_vals  = 2:min(n-1, 200)  # order statistic indices (up to 200)
hill_k  = [mean(log.(xs[1:k] ./ xs[k+1])) for k in k_vals]  # Hill estimator for each k

plot(k_vals, hill_k;
    xlabel = "k (order statistic)", ylabel = "Hill Estimate",
    title  = "Hill Plot", legend = false)

println("Hill(k=10):  ", round(mean(log.(xs[1:10]  ./ xs[11])),  digits = 4))
println("Hill(k=50):  ", round(mean(log.(xs[1:50]  ./ xs[51])),  digits = 4))
println("Hill(k=100): ", round(mean(log.(xs[1:100] ./ xs[101])), digits = 4))
'''

[[codeBranches]]
model = "qq"
code = '''
using Extremes, Distributions, Statistics, Plots

{{?evtd-dist-select=gev}} fm                        = gevfit({{evtd-data}}; method = :{{evtd-qq-method}})  # fit Generalized Extreme Value: the data must be block maxima (e.g. monthly maximum losses), since the GEV describes maxima, not every loss
{{?evtd-dist-select=gev}} mu_hat, sigma_hat, xi_hat = params(fm)  # extract parameters
{{?evtd-dist-select=gev}} d_gev                     = GeneralizedExtremeValue(mu_hat, sigma_hat, xi_hat)  # GEV distribution
{{?evtd-dist-select=gev}} n                         = length({{evtd-data}})  # sample size
{{?evtd-dist-select=gev}} p_vals                    = [(i - 0.5)/n for i in 1:n]  # plotting positions
{{?evtd-dist-select=gev}} empirical                 = sort({{evtd-data}})  # sorted data
{{?evtd-dist-select=gev}} theoretical               = quantile.(Ref(d_gev), p_vals)  # theoretical quantiles
{{?evtd-dist-select=gp}} exceedances               = {{evtd-data}}[{{evtd-data}} .> {{evtd-threshold-qq}}] .- {{evtd-threshold-qq}}  # excesses above threshold
{{?evtd-dist-select=gp}} fm_gp                     = gpfit(exceedances; method = :{{evtd-qq-method}})  # fit Generalized Pareto
{{?evtd-dist-select=gp}} sigma_hat, xi_hat         = params(fm_gp)  # extract parameters
{{?evtd-dist-select=gp}} d_gp                      = GeneralizedPareto({{evtd-threshold-qq}}, sigma_hat, xi_hat)  # GP distribution
{{?evtd-dist-select=gp}} n                         = length(exceedances)  # number of exceedances
{{?evtd-dist-select=gp}} p_vals                    = [(i - 0.5)/n for i in 1:n]  # plotting positions
{{?evtd-dist-select=gp}} empirical                 = sort(exceedances)  # sorted exceedances
{{?evtd-dist-select=gp}} theoretical               = quantile.(Ref(d_gp), p_vals)  # theoretical quantiles

scatter(theoretical, empirical;
    xlabel = "Theoretical quantiles", ylabel = "Empirical quantiles",
{{?evtd-dist-select=gev}}     title  = "QQ Plot (GEV)", legend = false)
{{?evtd-dist-select=gp}}     title  = "QQ Plot (GP)", legend = false)
plot!(theoretical, theoretical; color = :red, label = "45° line")

sse = sum((empirical .- theoretical).^2)  # sum of squared deviations
{{?evtd-dist-select=gev}} println("SSE (GEV fit): ", round(sse, digits = 4))
{{?evtd-dist-select=gp}} println("SSE (GP fit): ", round(sse, digits = 4))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "mean_excess_plot"
label = "Mean Excess Plot"
desc = "Plot the sample mean excess function to identify a suitable threshold"
code = '''
using Statistics, Plots
u_grid  = range(minimum({{evtd-data}}), quantile({{evtd-data}}, 0.95); length = {{evtd-n-thresholds}})  # threshold grid
me_vals = [mean({{evtd-data}}[{{evtd-data}} .> u] .- u) for u in u_grid if sum({{evtd-data}} .> u) >= 10]  # mean excess
u_vals  = [u for u in u_grid if sum({{evtd-data}} .> u) >= 10]  # valid thresholds
scatter(u_vals, me_vals;
    xlabel = "Threshold u", ylabel = "Mean Excess",
    title  = "Mean Excess Plot", legend = false)
'''

[[actionGroups.actions]]
id = "hill_estimator_plot"
label = "Hill Estimator Plot"
desc = "Plot the Hill tail index estimates across order statistics"
code = '''
using Statistics, Plots
xs     = sort({{evtd-data}}; rev = true)  # descending order statistics
n      = length(xs)  # sample size
k_vals = 2:min(n-1, 200)  # consider first 200 order statistics
hill_k = [mean(log.(xs[1:k] ./ xs[k+1])) for k in k_vals]  # Hill estimates
plot(k_vals, hill_k;
    xlabel = "k (order statistic)", ylabel = "Hill Estimate",
    title  = "Hill Plot", legend = false)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "threshold_stability"
label = "Threshold Stability"
desc = "Assess stability of GP shape parameter across candidate thresholds"
code = '''
using Extremes, Statistics
candidates = quantile.(Ref({{evtd-data}}), [0.7, 0.75, 0.8, 0.85, 0.9])  # candidate thresholds
for u in candidates
    exc = {{evtd-data}}[{{evtd-data}} .> u] .- u  # exceedances above u
    if length(exc) > 10  # require minimum exceedances
        fm               = gpfit(exc; method = :mle)  # fit GP
        sigma_hat, xi_hat = params(fm)  # extract parameters
        println("u=", round(u,digits=2), "  xi_hat=", round(xi_hat,digits=3), "  sigma_hat=", round(sigma_hat,digits=3), "  n=", length(exc))
    end
end
'''
