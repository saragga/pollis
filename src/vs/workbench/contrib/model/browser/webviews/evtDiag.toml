title = "Extreme Value Diagnostics"
viewType = "pollis.evtDiag"
defaultModel = "me"

[[packages]]
name = "Extremes.jl"
github = "https://github.com/jojal5/Extremes.jl"

[requires]
packages = ["Extremes.jl"]

