{{?model=rsp}}g = SimpleDiGraph(W)
{{?model=rsp}}cand = ["robust (min-max regret)" => sol.path, "nominal (lower bounds)" => enumerate_paths(dijkstra_shortest_paths(g, source, W), target),
{{?model=rsp}}        "pessimistic (upper bounds)" => enumerate_paths(dijkstra_shortest_paths(g, source, Wu), target),
{{?model=rsp}}        "midpoint" => enumerate_paths(dijkstra_shortest_paths(g, source, (W .+ Wu) ./ 2), target)]
{{?model=rsp}}[(path_type = name, path = p, max_regret = regret(p, W, Wu, g), cost_low = pathcost(p, W), cost_high = pathcost(p, Wu)) for (name, p) in cand]
{{?model=nf}}[(algorithm = name, max_flow = solve(; algorithm=a).value, seconds = bench(() -> solve(; algorithm=a)))
{{?model=nf}} for (name, a) in ["Push-relabel" => PushRelabelAlgorithm(), "Edmonds-Karp" => EdmondsKarpAlgorithm(),
{{?model=nf}}                   "Dinic" => DinicAlgorithm(), "Boykov-Kolmogorov" => BoykovKolmogorovAlgorithm()]]
{{?model=st}}Wu = max.(W, transpose(W)); g = SimpleGraph(Wu)
{{?model=st}}[(algorithm = "Kruskal", seconds = bench(() -> kruskal_mst(g, Wu))), (algorithm = "Prim", seconds = bench(() -> prim_mst(g, Wu)))]
{{?model=bm|am}}using JuMP, HiGHS
{{?model=bm|am}}function lp_solve(W)
{{?model=bm|am}}    m, k = size(W)
{{?model=bm|am}}    lp = Model(HiGHS.Optimizer); set_silent(lp)
{{?model=bm|am}}    @variable(lp, 0 <= x[1:m, 1:k] <= 1)
{{?model=bm|am}}    @constraint(lp, [i in 1:m], sum(x[i, :]) <= 1)
{{?model=bm|am}}    @constraint(lp, [j in 1:k], sum(x[:, j]) <= 1)
{{?model=bm}}    @objective(lp, Max, sum(W .* x))
{{?model=am}}    @constraint(lp, sum(x) == min(m, k))
{{?model=am}}    @objective(lp, Min, sum(W .* x))
{{?model=bm|am}}    optimize!(lp); objective_value(lp)
{{?model=bm|am}}end
{{?model=bm|am}}[(algorithm = "Hungarian", objective = objective(sol), seconds = bench(() -> solve(W))),
{{?model=bm|am}} (algorithm = "Linear programming (HiGHS)", objective = lp_solve(W), seconds = bench(() -> lp_solve(W)))]
'''

