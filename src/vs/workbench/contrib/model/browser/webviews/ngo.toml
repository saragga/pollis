code = '''
bench(f) = (f(); @elapsed f())  # second run, after compilation
{{?model=sp}}g = SimpleDiGraph(W)
{{?model=sp}}[(algorithm = "Dijkstra", seconds = bench(() -> dijkstra_shortest_paths(g, source, W))),
