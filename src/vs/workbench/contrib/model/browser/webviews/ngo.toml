{{?model!=rsp}}    s2 = solve(W .* Fm)
{{?model=rsp}}    s2 = solve(W .* Fm; Wu=Wu .* Fm)
    (objective = objective(s2), same_solution = sort(sol_edges(s2)) == sort(sol_edges(sol)))
end
(same_solution_share = count(r -> r.same_solution, runs) / length(runs), objective_mean = sum(r.objective for r in runs) / length(runs),
