[[codeBranches]]
model = "sp"
code = '''
using Graphs, Random

n = {{n}}  # number of vertices
density = {{density}}  # probability of each directed edge
seed = {{seed}}  # random seed for the generated weights
function random_weights(n, density, seed)  # random integer weights 1-9; 0 = no edge
    rng = MersenneTwister(seed)
    W = [i != j && rand(rng) < density ? Float64(rand(rng, 1:9)) : 0.0 for i in 1:n, j in 1:n]
    for i in 1:n-1  # the chain 1 -> 2 -> ... -> n keeps every vertex reachable from 1
        W[i, i+1] == 0 && (W[i, i+1] = Float64(rand(rng, 5:9)))
    end
    W
end
W = {{mat}}  # W[i, j] > 0 is an edge i -> j with that weight
source = {{src}}  # start vertex
target = {{dst}}  # end vertex
remove_edge(W, i, j) = (W2 = copy(W); W2[i, j] = 0; W2)  # the graph without edge i -> j

function solve(W=W; source=source, target=target)
    g = SimpleDiGraph(W)
    ds = dijkstra_shortest_paths(g, source, W)  # Dijkstra with the weights as edge lengths
    (path = enumerate_paths(ds, target), cost = ds.dists[target], dists = ds.dists)
end
objective(s) = s.cost
sol_edges(s) = [(s.path[k], s.path[k+1]) for k in 1:length(s.path)-1]

sol = solve()
(path = sol.path, cost = sol.cost, reachable = isfinite(sol.cost), distances_from_source = sol.dists)
'''

[[codeBranches]]
model = "rsp"
code = '''
using Graphs, Random

n = {{n}}  # number of vertices
density = {{density}}  # probability of each directed edge
seed = {{seed}}  # random seed for the generated weights
function random_weights(n, density, seed)  # random integer weights 1-9; 0 = no edge
    rng = MersenneTwister(seed)
    W = [i != j && rand(rng) < density ? Float64(rand(rng, 1:9)) : 0.0 for i in 1:n, j in 1:n]
    for i in 1:n-1  # the chain 1 -> 2 -> ... -> n keeps every vertex reachable from 1
        W[i, i+1] == 0 && (W[i, i+1] = Float64(rand(rng, 5:9)))
    end
    W
end
W = {{mat}}  # W[i, j] > 0 is an edge i -> j with that weight
Wu = {{matub}}  # upper bounds: the true weight of edge i -> j lies in [W[i, j], Wu[i, j]]
source = {{src}}  # start vertex
target = {{dst}}  # end vertex
remove_edge(W, i, j) = (W2 = copy(W); W2[i, j] = 0; W2)  # the graph without edge i -> j

pathcost(p, C) = sum(C[p[k], p[k+1]] for k in 1:length(p)-1)
function regret(p, W, Wu, g; source=source, target=target)  # worst case: p's edges at their upper bounds, all others at their lower bounds
    C = copy(W)
    for k in 1:length(p)-1
        C[p[k], p[k+1]] = Wu[p[k], p[k+1]]
    end
    pathcost(p, C) - dijkstra_shortest_paths(g, source, C).dists[target]
end
function solve(W=W; source=source, target=target, Wu=Wu)
    g = SimpleDiGraph(W)
    paths = collect(all_simple_paths(g, source, target))  # every simple path (exact, small graphs only)
    isempty(paths) && return (path = Int[], regret = Inf, cost_low = Inf, cost_high = Inf, paths = paths, regrets = Float64[])
    r = [regret(p, W, Wu, g; source, target) for p in paths]
    k = argmin(r)  # min-max regret
    (path = paths[k], regret = r[k], cost_low = pathcost(paths[k], W), cost_high = pathcost(paths[k], Wu), paths = paths, regrets = r)
end
objective(s) = s.regret
sol_edges(s) = [(s.path[k], s.path[k+1]) for k in 1:length(s.path)-1]

sol = solve()
(robust_path = sol.path, max_regret = sol.regret, cost_if_all_low = sol.cost_low, cost_if_all_high = sol.cost_high, paths_enumerated = length(sol.paths))
'''

[[codeBranches]]
model = "nf"
code = '''
using Graphs, Random

n = {{n}}  # number of vertices
density = {{density}}  # probability of each directed edge
seed = {{seed}}  # random seed for the generated weights
function random_weights(n, density, seed)  # random integer weights 1-9; 0 = no edge
    rng = MersenneTwister(seed)
    W = [i != j && rand(rng) < density ? Float64(rand(rng, 1:9)) : 0.0 for i in 1:n, j in 1:n]
    for i in 1:n-1  # the chain 1 -> 2 -> ... -> n keeps every vertex reachable from 1
        W[i, i+1] == 0 && (W[i, i+1] = Float64(rand(rng, 5:9)))
    end
    W
end
W = {{mat}}  # W[i, j] > 0 is an edge i -> j with that weight
source = {{src}}  # start vertex
target = {{dst}}  # end vertex
remove_edge(W, i, j) = (W2 = copy(W); W2[i, j] = 0; W2)  # the graph without edge i -> j
using GraphsFlows

function solve(W=W; source=source, target=target, algorithm=PushRelabelAlgorithm())
    g = SimpleDiGraph(W)
    value, F = maximum_flow(g, source, target, W, algorithm)  # W holds the arc capacities
    (value = value, flow = F)
end
objective(s) = s.value
sol_edges(s) = [(i, j) for i in axes(s.flow, 1), j in axes(s.flow, 2) if s.flow[i, j] > 1e-9]  # arcs carrying flow

sol = solve()
(max_flow = sol.value, arcs_used = sol_edges(sol))
'''

[[codeBranches]]
model = "st"
code = '''
using Graphs, Random

n = {{n}}  # number of vertices
density = {{density}}  # probability of each directed edge
seed = {{seed}}  # random seed for the generated weights
function random_weights(n, density, seed)  # random integer weights 1-9; 0 = no edge
    rng = MersenneTwister(seed)
    W = [i != j && rand(rng) < density ? Float64(rand(rng, 1:9)) : 0.0 for i in 1:n, j in 1:n]
    for i in 1:n-1  # the chain 1 -> 2 -> ... -> n keeps every vertex reachable from 1
        W[i, i+1] == 0 && (W[i, i+1] = Float64(rand(rng, 5:9)))
    end
    W
end
W = {{mat}}  # W[i, j] > 0 is an edge i -> j with that weight
remove_edge(W, i, j) = (W2 = copy(W); W2[i, j] = 0; W2[j, i] = 0; W2)  # the graph without edge i -- j

function solve(W=W)
    Wu = max.(W, transpose(W))  # undirected: i -- j is an edge if either direction has a weight
    g = SimpleGraph(Wu)
    tree = [(src(e), dst(e)) for e in kruskal_mst(g, Wu)]  # Kruskal's algorithm
    (tree = tree, weight = sum(Wu[i, j] for (i, j) in tree; init=0.0), spanning = length(tree) == size(W, 1) - 1)
end
objective(s) = s.weight
sol_edges(s) = s.tree

sol = solve()
(tree_edges = sol.tree, total_weight = sol.weight, spans_all_vertices = sol.spanning)
'''

[[codeBranches]]
model = "bm"
code = '''
using Graphs, Random

n = {{n}}  # number of vertices
density = {{density}}  # probability of each directed edge
seed = {{seed}}  # random seed for the generated weights
function random_weights(n, density, seed)  # random integer weights 1-9; 0 = no edge
    rng = MersenneTwister(seed)
    W = [i != j && rand(rng) < density ? Float64(rand(rng, 1:9)) : 0.0 for i in 1:n, j in 1:n]
    for i in 1:n-1  # the chain 1 -> 2 -> ... -> n keeps every vertex reachable from 1
        W[i, i+1] == 0 && (W[i, i+1] = Float64(rand(rng, 5:9)))
    end
    W
end
W = {{mat}}  # W[i, j] > 0 is an edge i -> j with that weight
remove_edge(W, i, j) = (W2 = copy(W); W2[i, j] = 0; W2)  # the graph without edge i -> j
using Hungarian

function solve(W=W)  # rows are the left vertices, columns the right vertices
    assignment = hungarian(maximum(W) .- W)[1]  # maximum weight = minimum shifted cost; non-edges get the largest cost
    pairs = [(i, j) for (i, j) in enumerate(assignment) if j > 0 && W[i, j] > 0]  # keep real edges only
    (pairs = pairs, weight = sum(W[i, j] for (i, j) in pairs; init=0.0))
end
objective(s) = s.weight
sol_edges(s) = s.pairs

sol = solve()
(matched_pairs = sol.pairs, total_weight = sol.weight, matching_size = length(sol.pairs))
'''

[[codeBranches]]
model = "am"
code = '''
using Hungarian, Random

n = {{n}}  # number of workers and jobs
seed = {{seed}}  # random seed for the generated costs
W = {{cost}}  # W[i, j] = cost of assigning worker i to job j
remove_edge(W, i, j) = (W2 = copy(W); W2[i, j] = 10 * sum(W); W2)  # forbid the pair with a prohibitive cost

function solve(W=W)
    assignment, cost = hungarian(W)  # Hungarian algorithm, minimises the total cost
    (pairs = [(i, j) for (i, j) in enumerate(assignment) if j > 0], cost = cost)
end
objective(s) = s.cost
sol_edges(s) = s.pairs

sol = solve()
(assignment = sol.pairs, total_cost = sol.cost)
'''

