id = "directed-vs-undirected"
label = "Baseline Comparison"
desc = "Directed against undirected graph (paths and flows), shortest-path tree against spanning tree, or greedy against optimal pairing"
code = '''
{{?model=sp|nf}}Ws = max.(W, transpose(W))  # every edge usable in both directions
{{?model=sp|nf}}(directed = objective(sol), undirected = objective(solve(Ws)))
{{?model=rsp}}(directed = objective(sol), undirected = objective(solve(max.(W, transpose(W)); Wu=max.(Wu, transpose(Wu)))))
{{?model=st}}Ws = max.(W, transpose(W)); m = size(W, 1)
{{?model=st}}ds = dijkstra_shortest_paths(SimpleGraph(Ws), 1, Ws)
{{?model=st}}(minimum_spanning_tree = sol.weight, shortest_path_tree_from_1 = sum(Ws[ds.parents[v], v] for v in 2:m if ds.parents[v] > 0))
{{?model=bm|am}}used_rows = Set{Int}(); used_cols = Set{Int}(); greedy = 0.0
{{?model=bm}}for (i, j) in sort([(i, j) for i in axes(W, 1), j in axes(W, 2) if W[i, j] > 0], by=e -> -W[e...])  # heaviest edge first
{{?model=am}}for (i, j) in sort([(i, j) for i in axes(W, 1), j in axes(W, 2)], by=e -> W[e...])  # cheapest pair first
{{?model=bm|am}}    if !(i in used_rows) && !(j in used_cols)
{{?model=bm|am}}        push!(used_rows, i); push!(used_cols, j); global greedy += W[i, j]
{{?model=bm|am}}    end
{{?model=bm|am}}end
{{?model=bm|am}}(optimal = objective(sol), greedy = greedy, gap = abs(objective(sol) - greedy))
'''

