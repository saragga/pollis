[[actionGroups.actions]]
id = "path-validation"
label = "Solution Validation"
desc = "Check that the solution satisfies every constraint of the problem"
code = '''
{{?model=sp|rsp}}p = sol.path
{{?model=sp|rsp}}(starts_at_source = first(p) == source, ends_at_target = last(p) == target, edges_exist = all(W[i, j] > 0 for (i, j) in sol_edges(sol)),
{{?model=sp}} simple_path = allunique(p), weight_sum = sum(W[i, j] for (i, j) in sol_edges(sol); init=0.0), reported_cost = sol.cost)
{{?model=rsp}} simple_path = allunique(p), regret_nonnegative = sol.regret >= 0, bounds_ordered = all(Wu .>= W))
{{?model=nf}}F = sol.flow; m = size(W, 1)
{{?model=nf}}net = [sum(max.(F[i, :], 0)) - sum(max.(F[:, i], 0)) for i in 1:m]  # outflow minus inflow
{{?model=nf}}(within_capacity = all(F .<= W .+ 1e-9), conserved_at_inner_vertices = all(abs(net[i]) < 1e-9 for i in 1:m if i != source && i != target),
{{?model=nf}} source_outflow = net[source], reported_value = sol.value)
{{?model=st}}tg = SimpleGraph(size(W, 1))
{{?model=st}}for (i, j) in sol.tree
{{?model=st}}    add_edge!(tg, i, j)
{{?model=st}}end
{{?model=st}}(edges = ne(tg), vertices = nv(tg), connected = is_connected(tg), acyclic = ne(tg) == nv(tg) - 1 && is_connected(tg))
{{?model=bm}}(rows_used_once = allunique(first.(sol.pairs)), columns_used_once = allunique(last.(sol.pairs)),
{{?model=bm}} edges_exist = all(W[i, j] > 0 for (i, j) in sol.pairs), weight_sum = sum(W[i, j] for (i, j) in sol.pairs; init=0.0), reported_weight = sol.weight)
{{?model=am}}(rows_used_once = allunique(first.(sol.pairs)), columns_used_once = allunique(last.(sol.pairs)), pairs = length(sol.pairs),
{{?model=am}} expected_pairs = minimum(size(W)), cost_sum = sum(W[i, j] for (i, j) in sol.pairs), reported_cost = sol.cost)
'''

[[actionGroups.actions]]
id = "algorithm-variants"
label = "Cross-Check"
desc = "Confirm the optimum independently: Bellman-Ford, sampled scenarios, min-cut, Prim, or the linear-programming relaxation"
code = '''
{{?model=sp}}bf = bellman_ford_shortest_paths(SimpleDiGraph(W), source, W)
{{?model=sp}}(dijkstra = sol.cost, bellman_ford = bf.dists[target], same_path = enumerate_paths(bf, target) == sol.path)
{{?model=rsp}}Random.seed!(2); g = SimpleDiGraph(W)
{{?model=rsp}}sampled = map(1:500) do k  # random scenarios inside the intervals
{{?model=rsp}}    C = W .+ rand(size(W)...) .* (Wu .- W)
{{?model=rsp}}    pathcost(sol.path, C) - dijkstra_shortest_paths(g, source, C).dists[target]
{{?model=rsp}}end
{{?model=rsp}}(largest_sampled_regret = maximum(sampled), worst_case_regret = sol.regret, bound_holds = maximum(sampled) <= sol.regret + 1e-9)
{{?model=nf}}part1, part2, cut = mincut(SimpleDiGraph(W), source, target, W, PushRelabelAlgorithm())
{{?model=nf}}(max_flow = sol.value, min_cut = cut, equal = isapprox(sol.value, cut), source_side = part1, sink_side = part2)
{{?model=st}}Wu = max.(W, transpose(W))
{{?model=st}}prim = sum(Wu[src(e), dst(e)] for e in prim_mst(SimpleGraph(Wu), Wu); init=0.0)
{{?model=st}}(kruskal = sol.weight, prim = prim, equal = isapprox(sol.weight, prim))
{{?model=bm|am}}using JuMP, HiGHS
{{?model=bm|am}}m, k = size(W)
{{?model=bm|am}}lp = Model(HiGHS.Optimizer); set_silent(lp)
{{?model=bm|am}}@variable(lp, 0 <= x[1:m, 1:k] <= 1)
{{?model=bm|am}}@constraint(lp, [i in 1:m], sum(x[i, :]) <= 1)
{{?model=bm|am}}@constraint(lp, [j in 1:k], sum(x[:, j]) <= 1)
{{?model=bm}}@constraint(lp, [i in 1:m, j in 1:k; W[i, j] == 0], x[i, j] == 0)
{{?model=bm}}@objective(lp, Max, sum(W .* x))
{{?model=am}}@constraint(lp, sum(x) == min(m, k))
{{?model=am}}@objective(lp, Min, sum(W .* x))
{{?model=bm|am}}optimize!(lp)
{{?model=bm|am}}(hungarian = objective(sol), linear_relaxation = objective_value(lp), equal = isapprox(objective(sol), objective_value(lp)),
{{?model=bm|am}} relaxation_integral = all(v -> min(v, 1 - v) < 1e-6, value.(x)))
'''

