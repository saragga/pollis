[[bullets]]
text = "Shortest Path"
detail = "Dijkstra, Bellman-Ford, A*; minimum-cost path from source to destination"

[[bullets]]
text = "Network Flow"
detail = "maximum flow and minimum cut on directed capacity networks"

[[bullets]]
text = "Spanning Tree"
detail = "Kruskal and Prim MST; minimum-weight connected spanning subgraph"

[[bullets]]
text = "Bipartite Matching"
detail = "maximum weight matching on a bipartite graph; maximises matched pairs"

[[bullets]]
text = "Assignment"
detail = "minimum cost assignment via the Hungarian method"

[[decisionRows]]
task = "Shortest Path"
context = "Cheapest route between two vertices of a directed graph with non-negative weights"
purpose = "Dijkstra's algorithm; returns the path, its cost and the distances from the source to every vertex"

[[decisionRows]]
task = "Robust Shortest Path"
context = "Edge weights are only known to lie in intervals [lower, upper]"
purpose = "Min-max regret path: the path whose worst-case gap to the best path in hindsight is smallest (exact enumeration, small graphs)"

[[decisionRows]]
task = "Network Flow"
context = "Capacities on arcs; how much can be sent from a source to a sink"
purpose = "Maximum flow by push-relabel (GraphsFlows.jl); equal to the capacity of the minimum cut"

[[decisionRows]]
task = "Spanning Tree"
context = "Connect all vertices at minimum total cost (networks, clustering)"
purpose = "Kruskal's minimum spanning tree on the undirected version of the graph"

[[decisionRows]]
task = "Bipartite Matching"
context = "Pair rows with columns along existing edges, maximising total weight"
purpose = "Maximum-weight bipartite matching of the rows and columns of the matrix, solved by the Hungarian algorithm on shifted costs"

[[decisionRows]]
task = "Assignment"
context = "Assign every worker to one job at minimum total cost"
purpose = "Linear assignment problem solved exactly by the Hungarian algorithm; rectangular matrices allowed"

[[inputs]]
id = "n"
label = "Vertices (n)"
tooltip = "Number of vertices of the generated graph (rows and columns of the generated matrix)."
default = "8"

[[inputs]]
id = "density"
label = "Edge Density"
tooltip = "Probability that each directed edge i -> j exists in the generated graph. A chain 1 -> 2 -> ... -> n is always added so every vertex is reachable from 1."
default = "0.4"
models = ["sp", "rsp", "nf", "st", "bm"]

[[inputs]]
id = "seed"
label = "Random Seed"
tooltip = "Seed for the generated weights."
default = "1"

[[inputs]]
id = "mat"
label = "Weight Matrix (n x n)"
tooltip = "W[i, j] > 0 is an edge i -> j with that weight (0 = no edge). Shortest paths: lengths; Robust: lower bounds; Network Flow: capacities; Spanning Tree: weights (symmetrised); Bipartite Matching: row-column weights. Replace with your own matrix literal if you like."
default = "random_weights(n, density, seed)"
models = ["sp", "rsp", "nf", "st", "bm"]
newRow = true

[[inputs]]
id = "matub"
label = "Upper Bounds (n x n)"
tooltip = "Upper bounds of the interval weights for the Robust Shortest Path; must satisfy upper >= lower on every edge."
default = "W .+ (W .> 0) .* rand(MersenneTwister(seed + 1), 0:6, n, n)"
models = ["rsp"]

[[inputs]]
id = "cost"
label = "Cost Matrix (n x p)"
tooltip = "Cost of assigning worker i (row) to job j (column). Need not be square."
default = "Float64.(rand(MersenneTwister(seed), 1:20, n, n))"
models = ["am"]
newRow = true

[[inputs]]
id = "src"
label = "Source"
tooltip = "Start vertex for the shortest paths; source for the network flow."
default = "1"
models = ["sp", "rsp", "nf"]
newRow = true

[[inputs]]
id = "dst"
label = "Target"
tooltip = "End vertex for the shortest paths; sink for the network flow."
default = "n"
models = ["sp", "rsp", "nf"]

