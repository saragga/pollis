[[codeBranches]]
model = "browse"
code = """
using HTTP, JSON3

# The Hub catalogue is a public REST API. A token is only needed for gated or
# private datasets; click "Set token" on the Powered-by line to add one (it is
# injected into this REPL session as ENV["HUGGING_FACE_HUB_TOKEN"], never saved).
auth = haskey(ENV, "HUGGING_FACE_HUB_TOKEN") ? ["Authorization" => "Bearer $(ENV["HUGGING_FACE_HUB_TOKEN"])"] : Pair{String, String}[]
get_json(url) = JSON3.read(HTTP.get(url, auth).body)

# List the most-downloaded datasets, full metadata included
url = "https://huggingface.co/api/datasets?sort=downloads&direction=-1&limit=10&full=true"
datasets = get_json(url)

for d in datasets
    println(d.id, "  downloads=", get(d, :downloads, 0), "  likes=", get(d, :likes, 0))
end
"""

[[codeBranches]]
model = "load"
code = """
using HuggingFaceDatasets

# load_dataset wraps the Python `datasets` library (PythonCall + CondaPkg). The
# first call sets up a one-time Conda environment. A token in
# ENV["HUGGING_FACE_HUB_TOKEN"] is used automatically for gated datasets.
# with_format("julia") returns native Julia objects rather than Python ones.
train = load_dataset("imdb", split = "train").with_format("julia")

println("rows: ", length(train))   # number of observations in the split
first_row = train[1]                # one observation as a Julia object
println(first_row)
"""

[[codeBranches]]
model = "inspect"
code = """
using HuggingFaceDatasets

train = load_dataset("imdb", split = "train").with_format("julia")

# A Dataset behaves like a Julia collection: length, indexing, and slicing
println("rows:   ", length(train))
sample = train[1]                   # one observation (a Dict of fields)
println("fields: ", keys(sample))
batch = train[1:4]                  # a small batch of observations

# Index-based iteration is memory-friendly for large splits
for i in 1:3
    println(i, "  label=", train[i]["label"])
end
"""

[[codeBranches]]
model = "files"
code = """
using HTTP, JSON3, Parquet2, Tables

auth = haskey(ENV, "HUGGING_FACE_HUB_TOKEN") ? ["Authorization" => "Bearer $(ENV["HUGGING_FACE_HUB_TOKEN"])"] : Pair{String, String}[]

# Hugging Face auto-converts every dataset to Parquet. List the shards (the
# response is nested: config => split => [shard URLs]).
listing = JSON3.read(HTTP.get("https://huggingface.co/api/datasets/imdb/parquet", auth).body)
println(listing)

# Download one Parquet shard and read it lazily through the Tables.jl interface
shard = "https://huggingface.co/api/datasets/imdb/parquet/plain_text/train/0.parquet"
path = download(shard)
ds = Parquet2.Dataset(path)
println(Tables.schema(ds))          # column names and types, without loading all rows
"""

[[codeBranches]]
model = "info"
code = """
using HTTP, JSON3

auth = haskey(ENV, "HUGGING_FACE_HUB_TOKEN") ? ["Authorization" => "Bearer $(ENV["HUGGING_FACE_HUB_TOKEN"])"] : Pair{String, String}[]
get_json(url) = JSON3.read(HTTP.get(url, auth).body)

# Full metadata for one dataset: tags, licence, downloads, likes, ...
info = get_json("https://huggingface.co/api/datasets/imdb")

println("id:        ", info.id)
println("downloads: ", get(info, :downloads, 0))
println("likes:     ", get(info, :likes, 0))
println("tags:      ", get(info, :tags, String[]))
"""

[[actionGroups]]
id = "browse"
label = "Browse the Hub"

[[actionGroups.actions]]
id = "hfds-browse-search"
label = "Search by Query"
desc = "Filter the catalogue by a free-text search string"
code = """
using HTTP, JSON3

auth = haskey(ENV, "HUGGING_FACE_HUB_TOKEN") ? ["Authorization" => "Bearer $(ENV["HUGGING_FACE_HUB_TOKEN"])"] : Pair{String, String}[]

q = HTTP.escapeuri("sentiment")
res = JSON3.read(HTTP.get("https://huggingface.co/api/datasets?search=$q&limit=10", auth).body)
for d in res
    println(d.id)
end
"""

[[actionGroups.actions]]
id = "hfds-browse-tag"
label = "Filter by Task"
desc = "List the top datasets for a task category, by downloads"
code = """
using HTTP, JSON3

auth = haskey(ENV, "HUGGING_FACE_HUB_TOKEN") ? ["Authorization" => "Bearer $(ENV["HUGGING_FACE_HUB_TOKEN"])"] : Pair{String, String}[]

# Task tags follow the form task_categories:<name> (text-classification, etc.)
url = "https://huggingface.co/api/datasets?filter=task_categories:text-classification&sort=downloads&direction=-1&limit=10"
for d in JSON3.read(HTTP.get(url, auth).body)
    println(d.id)
end
"""

