id = "hfds-load-dict"
label = "Load All Splits"
desc = "Omit split to get a DatasetDict keyed by split name"
code = """
using HuggingFaceDatasets

# Omit `split` to load every split as a DatasetDict
dd = load_dataset("imdb")
println(dd)                         # shows the available splits and features

train = dd["train"].with_format("julia")
println("train rows: ", length(train))
"""

[[actionGroups.actions]]
id = "hfds-load-subset"
label = "Take a Subset"
desc = "Slice a small subset for quick experiments"
code = """
using HuggingFaceDatasets

train = load_dataset("imdb", split = "train").with_format("julia")

subset = train[1:100]               # first 100 observations
labels = [train[i]["label"] for i in 1:100]
println("positive in first 100: ", count(==(1), labels))
"""

