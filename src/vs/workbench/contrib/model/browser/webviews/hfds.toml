label = "Read a Shard"
desc = "Download one Parquet shard and read it via Tables.jl"
code = """
using HTTP, Parquet2, Tables

shard = "https://huggingface.co/api/datasets/imdb/parquet/plain_text/train/0.parquet"
path = download(shard)
ds = Parquet2.Dataset(path)
println(Tables.schema(ds))          # column names and types, lazily
"""
