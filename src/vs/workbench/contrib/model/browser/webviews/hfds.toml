# Hugging Face Datasets Webview Configuration
# Declarative source. The build script generates hfds.data.ts.
# Run: npm run gulp compile-toml
#
# Approach: the Hugging Face Hub exposes a public REST API at huggingface.co/api
# that returns JSON — no token needed for public datasets. Browsing, file listings
# and metadata use HTTP.jl + JSON3.jl (pure Julia). Loading splits into Julia uses
# HuggingFaceDatasets.jl, which wraps the Python `datasets` library via PythonCall.
# A personal access token (shared with the Hugging Face Models webview) is only
# required for gated or private datasets; it is injected into the REPL session as
# ENV["HUGGING_FACE_HUB_TOKEN"] and never written to a file.

[meta]
title = "Hugging Face Datasets"
viewType = "pollis.hfds"
defaultModel = "browse"
models = ["browse", "load", "inspect", "files", "info"]
illusCollapsed = true
illustrationText = "Search the Hugging Face Hub, then load datasets into Julia: browse the catalogue over the REST API, load splits with HuggingFaceDatasets.jl, inspect rows, download the underlying Parquet files, and read dataset metadata."

# Per-pane intro/footnote notes (optional, keyed by pane: keyPoints / decision / explore).
[notes.decision]
footnote = "Browse, Download Files, and Dataset Info use the Hub REST API directly (HTTP.jl + JSON3.jl) — pure Julia, no Python, no token for public datasets. Load and Inspect use HuggingFaceDatasets.jl, which wraps the Python `datasets` library through PythonCall, so the first call triggers a one-time CondaPkg environment setup."

[notes.explore]
intro = "The sub-categories (Computer Vision, Natural Language Processing, …) are visual groupings that all belong to one Task category. A query joins your selections with <strong>OR</strong> inside a category and <strong>AND</strong> across categories. For example, picking <em>Image Classification</em> plus <em>Text Classification</em> under Task, plus <em>Medical</em> plus <em>Biology</em> under Domain, builds: <code>(Image Classification OR Text Classification) AND (Medical OR Biology)</code>"

# Interactive Explore pane (replaces the static Illustration pane). Groups are the
# collapsible sub-categories shown in the left column; groups sharing an `axis` are
# OR-ed in the query, different axes AND-ed. A chip's filter token is filterPrefix +
# value. `separatorBefore` draws a divider above a group. Queried live against the Hub.
