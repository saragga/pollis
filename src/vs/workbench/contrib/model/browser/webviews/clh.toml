[[models]]
id = "ward"
label = "Ward"

[[models]]
id = "complete"
label = "Complete"

[[models]]
id = "average"
label = "Average"

[[models]]
id = "single"
label = "Single"

[[bullets]]
text = "Ward"
detail = "minimise total within-cluster variance at each merge step; produces compact, equal-sized clusters (Clustering.jl)"

[[bullets]]
text = "Complete"
detail = "merge clusters by maximum pairwise distance between members; produces tight, well-separated clusters (Clustering.jl)"

[[bullets]]
text = "Average"
detail = "merge by average pairwise distance (UPGMA); a balanced trade-off between Ward and Single (Clustering.jl)"

[[bullets]]
text = "Single"
detail = "merge by minimum pairwise distance; sensitive to outliers but finds elongated chains (Clustering.jl)"

[[decisionRows]]
task = "Ward"
context = "Compact, similarly sized clusters; Euclidean features"
purpose = "Merge the pair that least increases total within-cluster variance"

[[decisionRows]]
task = "Complete"
context = "Tight, well-separated clusters; any dissimilarity"
purpose = "Cluster distance = the largest pairwise distance between members"

[[decisionRows]]
task = "Average"
context = "A balanced default; best cophenetic fit in many data sets"
purpose = "Cluster distance = the mean pairwise distance between members (UPGMA)"

[[decisionRows]]
task = "Single"
context = "Elongated or chained shapes; outlier detection"
purpose = "Cluster distance = the smallest pairwise distance (nearest neighbours)"

[[inputs]]
id = "X"
label = "Feature Matrix"
tooltip = "n_samples × n_features matrix of input features (one row per observation). Standardise the columns first when they are on different scales."
default = "X_train"

[[inputs]]
id = "k"
label = "k"
tooltip = "Number of flat clusters cut from the dendrogram with cutree. Look for a large jump in the merge heights, or compare mean silhouettes."
default = "3"
newRow = true

[[inputs]]
id = "metric"
label = "Distance"
tooltip = "Dissimilarity between observations. Ward linkage is defined for Euclidean distance only."
kind = "select"
default = "Euclidean()"
models = ["complete", "average", "single"]

[[inputs.options]]
value = "Euclidean()"
label = "Euclidean"

[[inputs.options]]
value = "Cityblock()"
label = "Manhattan"

[[inputs.options]]
value = "CosineDist()"
label = "Cosine"

[[inputs.options]]
value = "Chebyshev()"
label = "Chebyshev"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.ward]
# Low merges and a tall final merge (compact groups)
svg = '''
var y0 = 70, s = '';
function u(x1, x2, h1, h2, top) {
	s += '<path d="M' + x1 + ',' + h1 + ' L' + x1 + ',' + top + ' L' + x2 + ',' + top + ' L' + x2 + ',' + h2 + '" fill="none" stroke="currentColor" stroke-width="1.3"/>';
}
u(8, 18, y0, y0, 54);
u(36, 46, y0, y0, 50);
u(13, 41, 54, 50, 22);
return s;
'''

