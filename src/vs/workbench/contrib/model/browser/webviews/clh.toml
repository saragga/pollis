[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "dendrogram"
label = "Dendrogram"
desc = "The full merge tree with a dashed line where it is cut into k clusters"
code = '''
using StatsPlots

plot(hc, xticks=false, ylabel="merge height", legend=false)
hline!([mean(hc.heights[end-k+1:end-k+2])], linestyle=:dash)  # between the k-th and (k-1)-th largest merges
'''

[[actionGroups.actions]]
id = "scatter"
label = "Cluster Scatter"
desc = "Observations on their first two principal components, coloured by cluster"
code = '''
using Plots, LinearAlgebra

Xc  = X .- mean(X, dims=1)  # centre the columns
pcs = Xc * svd(Xc).V[:, 1:2]  # scores on the first two principal components
scatter(pcs[:, 1], pcs[:, 2], group=labels, xlabel="PC1", ylabel="PC2", markersize=3, alpha=0.7)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "silhouette"
label = "Silhouette Analysis"
desc = "Per-observation cohesion vs separation (-1 to 1); the mean summarises how well separated the clusters are"
code = '''
using Plots

scores = silhouettes(labels, D)  # per-observation silhouette
order  = sortperm(collect(zip(labels, -scores)))  # group by cluster, best first
bar(scores[order], group=labels[order], linewidth=0, xlabel="observation", ylabel="silhouette")
hline!([mean(scores)], linestyle=:dash, label="mean")
'''

[[actionGroups.actions]]
id = "cophenetic"
label = "Cophenetic Correlation"
desc = "Correlation between the original dissimilarities and the heights at which pairs first merge: how faithfully the tree keeps the data's structure"
code = '''
function cophenetic(hc, n)  # C[i, j] = height of the merge that first joins i and j
    C = zeros(n, n)
    members = Vector{Vector{Int}}(undef, size(hc.merges, 1))
    for s in axes(hc.merges, 1)
        a, b = hc.merges[s, 1], hc.merges[s, 2]  # negative = observation, positive = earlier merge
        left  = a < 0 ? [-a] : members[a]
        right = b < 0 ? [-b] : members[b]
        for i in left, j in right
            C[i, j] = C[j, i] = hc.heights[s]
        end
        members[s] = vcat(left, right)
    end
    C
end

C = cophenetic(hc, size(X, 1))
upper = [(i, j) for j in axes(D, 2) for i in 1:j-1]
cor([D[i, j] for (i, j) in upper], [C[i, j] for (i, j) in upper])  # closer to 1 = more faithful tree
'''

[[actionGroups.actions]]
id = "heights"
label = "Merge Heights"
desc = "The last 20 merge heights: a large jump before the final merges suggests where to cut"
code = '''
using Plots

h = reverse(hc.heights)[1:min(20, length(hc.heights))]  # largest first
plot(2:length(h)+1, h, marker=:circle, xlabel="k (clusters when cut just below this merge)", ylabel="merge height", legend=false)
vline!([k], linestyle=:dash)
'''

[[actionGroups.actions]]
id = "choose-k"
label = "Choosing k"
desc = "Mean silhouette for k = 2 to 10 cut from the same tree"
code = '''
using Plots

ks  = 2:10
sil = [mean(silhouettes(cutree(hc, k=kk), D)) for kk in ks]
plot(ks, sil, marker=:circle, xlabel="k", ylabel="mean silhouette", legend=false)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "assign-new"
label = "Assign New Data"
desc = "Place new observations in the cluster that the linkage rule makes closest"
code = '''
{{?model=ward}} Dnew = pairwise(Euclidean(), X_new, X, dims=1)  # new x training dissimilarities
{{?model!=ward}} Dnew = pairwise({{metric}}, X_new, X, dims=1)  # new x training dissimilarities
{{?model=ward}} link(d) = mean(d)  # centroid-like: mean distance
{{?model=complete}} link(d) = maximum(d)  # farthest member
{{?model=average}} link(d) = mean(d)  # average member
{{?model=single}} link(d) = minimum(d)  # nearest member
new_labels = [argmin([link(Dnew[r, labels .== c]) for c in 1:k]) for r in axes(Dnew, 1)]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "linkages"
label = "Linkage Comparison"
desc = "All four linkages on the same data: mean silhouette and smallest cluster size when cut at k"
code = '''
Deuc = pairwise(Euclidean(), X, dims=1)  # Ward needs Euclidean distances
map([:ward, :complete, :average, :single]) do l
    lab = cutree(hclust(l == :ward ? Deuc : D, linkage=l), k=k)
    (linkage = l, silhouette = mean(silhouettes(lab, D)), smallest = minimum(count(==(c), lab) for c in 1:k))
end
'''

[[actionGroups.actions]]
id = "vs-kmeans"
label = "Agreement with K-Means"
desc = "Adjusted Rand index against K-Means with the same k: near 1 means both find the same partition"
code = '''
other = assignments(kmeans(permutedims(X), k))
randindex(labels, other)  # (adjusted Rand, Rand, Mirkin, Hubert)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "profiles"
label = "Cluster Profiles"
desc = "Per-cluster feature means and standard deviations to characterise what each cluster represents"
code = '''
ids   = sort(unique(labels))  # 0 = DBSCAN noise
means = [mean(X[labels .== c, j]) for c in ids, j in 1:size(X, 2)]  # clusters x features
sds   = [std(X[labels .== c, j]) for c in ids, j in 1:size(X, 2)]
(clusters = ids, means = means, sds = sds)
'''

[[actionGroups.actions]]
id = "distinguishing"
label = "Distinguishing Features"
desc = "Standardised difference between each cluster's mean and the overall mean: large values name what sets a cluster apart"
code = '''
using Plots

ids = sort(unique(labels))
z   = [(mean(X[labels .== c, j]) - mean(X[:, j])) / std(X[:, j]) for c in ids, j in 1:size(X, 2)]
heatmap(1:size(X, 2), string.(ids), z, xlabel="feature", ylabel="cluster", color=:balance, clims=(-maximum(abs, z), maximum(abs, z)))
'''

[[actionGroups.actions]]
id = "surrogate"
label = "Surrogate Tree Rules"
desc = "A shallow decision tree trained to reproduce the clusters: its splits give readable rules and its accuracy says how faithful they are"
code = '''
using DecisionTree

tree = DecisionTreeClassifier(max_depth=3)
fit!(tree, X, labels)
print_tree(tree)  # feature thresholds that separate the clusters
mean(predict(tree, X) .== labels)  # fidelity: share of observations the rules place correctly
'''
