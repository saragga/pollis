[[codeBranches]]
model = "ward"
code = '''
using Clustering, Distances, Statistics

X = {{X}}  # n x p feature matrix, one row per observation
k = {{k}}  # number of flat clusters
D = pairwise(Euclidean(), X, dims=1)  # n x n dissimilarity matrix

hc     = hclust(D, linkage=:ward)  # agglomerative merges and their heights
labels = cutree(hc, k=k)  # cut the dendrogram into k flat clusters

[count(==(c), labels) for c in 1:k]  # cluster sizes
'''

