# SQL Databases Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/sql.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "SQL Databases"
viewType = "pollis.sql"
defaultModel = "query"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/duckdb"

[[packages.videos]]
title = "High Performance Computing in Julia"
