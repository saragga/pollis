[[bullets]]
text = "Query"
detail = "<code>DBInterface.execute</code> runs a SQL statement in the database, and <code>Tables.columntable</code> brings the result into Julia as a named tuple of column vectors"

[[bullets]]
text = "Import File"
detail = "DuckDB reads CSV, Parquet and JSON files itself with <code>read_csv</code>, <code>read_parquet</code> and <code>read_json</code>, inferring the column types, and stores them as a table"

[[bullets]]
text = "Save Table"
detail = "<code>DuckDB.register_table</code> shows any Tables.jl source to SQL as a view without copying it, so <code>CREATE TABLE ... AS SELECT</code> stores it in the database"

[[bullets]]
text = "Export"
detail = "<code>COPY (query) TO 'file'</code> writes a query result straight to a CSV, Parquet or JSON file, without passing it through Julia"

[[decisionRows]]
task = "Query"
context = "Data already in the database"
purpose = "Filter, join and aggregate in SQL, then analyse the result in Julia"

[[decisionRows]]
task = "Import File"
context = "Data in CSV, Parquet or JSON files"
purpose = "Store the file as a table, to query it again without re-reading it"

[[decisionRows]]
task = "Save Table"
context = "Data computed in Julia"
purpose = "Keep a result in the database, to query it with SQL or share it"

[[decisionRows]]
task = "Export"
context = "Result needed outside the database"
purpose = "Hand a query result to other tools as a file"

[[inputs]]
id = "con"
label = "Connection"
tooltip = "Variable holding the DuckDB connection. The Databases view connects the built-in Pollis database, which holds the PollisDatasets, as pollis. If the variable does not exist yet, the code connects it to the built-in database."
default = "pollis"
models = ["query", "export"]

[[inputs]]
id = "owncon"
label = "Connection"
tooltip = "Variable to hold the connection to your own database. Your tables go there: the built-in Pollis database is kept for the PollisDatasets."
default = "mydb"
models = ["import", "save"]

[[inputs]]
id = "database"
label = "Database"
tooltip = "Your own DuckDB database file, relative to the Julia working directory or absolute. It is created if it does not exist yet."
default = "mydata.duckdb"
models = ["import", "save"]

[[inputs]]
id = "file"
label = "File"
tooltip = "Path of the file to import, relative to the Julia working directory or absolute. Compressed files ending in .gz are read directly."
default = "data.csv"
models = ["import"]

[[inputs]]
id = "reader"
label = "Reader"
tooltip = "DuckDB function that reads the file. read_csv detects the delimiter, header and column types from the first rows."
kind = "select"
default = "read_csv"
models = ["import"]

[[inputs.options]]
value = "read_csv"
label = "CSV (read_csv)"

[[inputs.options]]
value = "read_parquet"
label = "Parquet (read_parquet)"

[[inputs.options]]
value = "read_json"
label = "JSON (read_json)"

[[inputs]]
id = "data"
label = "Data"
tooltip = "Variable name of the Julia table to save: any Tables.jl source, e.g. a named tuple of vectors, a CSV.File or a query result."
default = "tbl"
models = ["save"]

[[inputs]]
id = "table"
label = "Table"
tooltip = "Name of the database table to create or append to. Names with spaces or capitals need double quotes, e.g. \"Sales 2026\"."
default = "data"
models = ["import", "save"]

[[inputs]]
id = "mode"
label = "If It Exists"
tooltip = "Replace drops the existing table and creates it again. Append inserts the new rows, which need the same columns in the same order."
kind = "select"
default = "replace"
models = ["import", "save"]

[[inputs.options]]
value = "replace"
label = "replace"

[[inputs.options]]
value = "append"
label = "append"

[[inputs]]
id = "out"
label = "Output File"
tooltip = "Path of the file to write, relative to the Julia working directory or absolute. An existing file is overwritten."
default = "result.parquet"
models = ["export"]

[[inputs]]
id = "format"
label = "Format"
tooltip = "File format to write. Parquet keeps the column types and compresses well; CSV opens anywhere; JSON writes one object per line."
kind = "select"
default = "parquet"
models = ["export"]

[[inputs.options]]
value = "parquet"
label = "Parquet"

[[inputs.options]]
value = "csv"
label = "CSV"

[[inputs.options]]
value = "json"
label = "JSON"

[[inputs]]
id = "sql"
label = "SQL"
tooltip = "SELECT statement to run. Tables of the built-in database are listed in the Databases view."
kind = "textarea"
default = '''
SELECT *
FROM data
LIMIT 1000
'''
models = ["query", "export"]
newRow = true

