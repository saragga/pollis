code = '''
using TopicModelsVB, LinearAlgebra, Random, Statistics

docs  = {{corpus}}  # vector of strings, one per document
words = [split(lowercase(replace(d, r"[^A-Za-z ]" => " "))) for d in docs]  # lowercase words, punctuation stripped
vocab = sort(unique(reduce(vcat, words)))  # vocabulary
key   = Dict(w => i for (i, w) in enumerate(vocab))  # word -> vocabulary key
corp  = Corpus([Document([key[w] for w in ws]) for ws in words], vocab=vocab)  # TopicModelsVB corpus (its own type, not a document-term matrix)
fixcorp!(corp, stop=true, condense=true, remove_empty_docs=true, trim=true)  # drop stop words, merge repeated words into counts
test  = randperm(Xoshiro(1), length(corp))[1:max(1, div(length(corp), 5))]  # hold out 20% of the documents
train = Corpus(docs=corp.docs[setdiff(eachindex(corp.docs), test)], vocab=corp.vocab)  # same vocabulary keys
held  = filter(d -> length(d.terms) >= 2, corp.docs[test])  # held-out documents with at least two distinct words

function heldout_perplexity(model, held)  # document completion: infer each topic mix from half the words, score the other half
    obs = Corpus(docs=[Document(terms=d.terms[1:2:end], counts=d.counts[1:2:end]) for d in held], vocab=model.corp.vocab)
    fit = predict(obs, model)  # topic proportions of the held-out documents, topics fixed
    ll, n = 0.0, 0
    for (j, d) in enumerate(held)
        t, c = d.terms[2:2:end], d.counts[2:2:end]  # the unseen half
        keep = vec(sum(model.beta[:, t], dims=1)) .> 0; t, c = t[keep], c[keep]  # words absent from the training documents have zero topic weight, so are not scored
        pw = transpose(model.beta[:, t]) * topicdist(fit, j)  # p(word) = sum over topics of theta times beta
        model isa fCTM && (pw = model.eta .* pw .+ (1 - model.eta) .* model.kappa[t])  # fCTM: mix in the filtered background words
        ll += dot(c, log.(pw)); n += sum(c)
    end
    exp(-ll / n)  # lower is better, comparable across k because the documents were not used for fitting
end

function umass(model, corp; n=10)  # UMass coherence of each topic from document co-occurrence: closer to 0 is more coherent
    D = [Set(d.terms) for d in corp.docs]
    nd(a) = count(S -> a in S, D)
    nd(a, b) = count(S -> a in S && b in S, D)
    map(1:model.K) do i
        top = sortperm(model.beta[i, :], rev=true)[1:n]  # top n words of topic i
        sum(log((nd(top[m], top[j]) + 1) / nd(top[j])) for m in 2:n for j in 1:m-1)
    end
end

for k in [5, 10, 20, 50]  # sweep over topic counts
    m = CTM(train, k); train!(m, iter={{iters}}, printelbo=false)  # fit on the training documents only
    println("k=", k, "  held-out perplexity=", round(heldout_perplexity(m, held), digits=1), "  mean coherence=", round(mean(umass(m, corp)), digits=2))
end
'''

[[actionGroups.actions]]
id = "ctm-vs-fctm"
label = "CTM vs Focused CTM"
desc = "Topic quality with and without background separation: held-out perplexity and topic coherence"
code = '''
using TopicModelsVB, LinearAlgebra, Random, Statistics

docs  = {{corpus}}  # vector of strings, one per document
words = [split(lowercase(replace(d, r"[^A-Za-z ]" => " "))) for d in docs]  # lowercase words, punctuation stripped
vocab = sort(unique(reduce(vcat, words)))  # vocabulary
key   = Dict(w => i for (i, w) in enumerate(vocab))  # word -> vocabulary key
corp  = Corpus([Document([key[w] for w in ws]) for ws in words], vocab=vocab)  # TopicModelsVB corpus (its own type, not a document-term matrix)
fixcorp!(corp, stop=true, condense=true, remove_empty_docs=true, trim=true)  # drop stop words, merge repeated words into counts
test  = randperm(Xoshiro(1), length(corp))[1:max(1, div(length(corp), 5))]  # hold out 20% of the documents
train = Corpus(docs=corp.docs[setdiff(eachindex(corp.docs), test)], vocab=corp.vocab)  # same vocabulary keys
held  = filter(d -> length(d.terms) >= 2, corp.docs[test])  # held-out documents with at least two distinct words

function umass(model, corp; n=10)  # UMass coherence of each topic from document co-occurrence: closer to 0 is more coherent
    D = [Set(d.terms) for d in corp.docs]
    nd(a) = count(S -> a in S, D)
    nd(a, b) = count(S -> a in S && b in S, D)
    map(1:model.K) do i
        top = sortperm(model.beta[i, :], rev=true)[1:n]  # top n words of topic i
        sum(log((nd(top[m], top[j]) + 1) / nd(top[j])) for m in 2:n for j in 1:m-1)
    end
end

function heldout_perplexity(model, held)  # document completion: infer each topic mix from half the words, score the other half
    obs = Corpus(docs=[Document(terms=d.terms[1:2:end], counts=d.counts[1:2:end]) for d in held], vocab=model.corp.vocab)
    fit = predict(obs, model)  # topic proportions of the held-out documents, topics fixed
    ll, n = 0.0, 0
    for (j, d) in enumerate(held)
        t, c = d.terms[2:2:end], d.counts[2:2:end]  # the unseen half
        keep = vec(sum(model.beta[:, t], dims=1)) .> 0; t, c = t[keep], c[keep]  # words absent from the training documents have zero topic weight, so are not scored
        pw = transpose(model.beta[:, t]) * topicdist(fit, j)  # p(word) = sum over topics of theta times beta
        model isa fCTM && (pw = model.eta .* pw .+ (1 - model.eta) .* model.kappa[t])  # fCTM: mix in the filtered background words
        ll += dot(c, log.(pw)); n += sum(c)
    end
    exp(-ll / n)
end

m1 = CTM(train, {{k}}); train!(m1, iter={{iters}}, printelbo=false)  # standard CTM
m2 = fCTM(train, {{k}}); train!(m2, iter={{iters}}, printelbo=false)  # filtered CTM
println("CTM  held-out perplexity: ", round(heldout_perplexity(m1, held), digits=1), "  mean coherence: ", round(mean(umass(m1, corp)), digits=2))
println("fCTM held-out perplexity: ", round(heldout_perplexity(m2, held), digits=1), "  mean coherence: ", round(mean(umass(m2, corp)), digits=2))
'''

