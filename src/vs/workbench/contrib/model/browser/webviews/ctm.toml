[[models]]
id = "fctm"
label = "Focused CTM"

[[bullets]]
text = "CTM"
detail = "extends LDA with a logistic-normal prior; captures correlations between topics via a covariance matrix"

[[bullets]]
text = "Focused CTM"
detail = "structured variant of CTM; separates background words from topic-specific words"

[[bullets]]
text = "TopicModels.jl"
detail = "Julia implementation of CTM, Focused CTM, LDA and related topic models"

[[inputs]]
id = "corpus"
label = "Corpus"
tooltip = "Array of text documents, e.g. docs = [\"first doc\", \"second doc\"]"
default = "corpus"

[[inputs]]
id = "k"
label = "Topics (k)"
tooltip = "Number of latent topics to discover"
default = "10"

[[inputs]]
id = "iters"
label = "Iterations"
tooltip = "Number of variational EM training iterations"
default = "1000"

[[codeBranches]]
model = "ctm"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])  # wrap documents
prepare!(crps, strip_punctuation | strip_case)  # normalise text
update_lexicon!(crps)  # build vocabulary
dtm   = DocumentTermMatrix(crps)  # document-term matrix

model = CTM(dtm.dtm, {{k}})  # logistic-normal prior; {{k}} topics
train!(model, iter={{iters}})  # variational EM training

topicdist(model)  # topic-word distributions (k x V)
'''

[[codeBranches]]
model = "fctm"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])  # wrap documents
prepare!(crps, strip_punctuation | strip_case)  # normalise text
update_lexicon!(crps)  # build vocabulary
dtm   = DocumentTermMatrix(crps)  # document-term matrix

model = fCTM(dtm.dtm, {{k}})  # focused CTM with {{k}} topics
train!(model, iter={{iters}})  # variational EM training

topicdist(model)  # topic-word distributions (k x V)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "topic-words"
label = "Top Words per Topic"
desc = "Highest-probability words for each discovered topic"
code = '''
using TopicModels, TextAnalysis

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)  # normalise
dtm = DocumentTermMatrix(crps)  # document-term matrix
model = CTM(dtm.dtm, {{k}}); train!(model)  # fit CTM

showtopics(model, 10)  # top 10 words per topic
'''

[[actionGroups.actions]]
id = "topic-correlation"
label = "Topic Correlations"
desc = "Heatmap of the topic covariance matrix"
code = '''
using TopicModels, TextAnalysis, Plots

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)  # normalise
dtm = DocumentTermMatrix(crps)  # document-term matrix
model = CTM(dtm.dtm, {{k}}); train!(model)  # fit CTM

heatmap(model.sigma, title="Topic Covariance")  # covariance matrix heatmap
'''

