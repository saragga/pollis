[[actionGroups.actions]]
id = "perplexity"
label = "Perplexity"
desc = "Perplexity on the training documents (in-sample: it keeps falling as topics are added, so hold out documents to compare models); lower is better"
code = '''
using TopicModels, TextAnalysis

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)  # normalise
dtm = DocumentTermMatrix(crps)  # document-term matrix
model = CTM(dtm.dtm, {{k}}); train!(model, iter={{iters}})  # fit CTM

perplexity(model)  # perplexity on training corpus
'''

[[actionGroups.actions]]
id = "topic-coherence"
label = "Topic Coherence"
desc = "Average PMI of top word pairs within each topic"
code = '''
using TopicModels, TextAnalysis

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)  # normalise
dtm = DocumentTermMatrix(crps)  # document-term matrix
model = CTM(dtm.dtm, {{k}}); train!(model, iter={{iters}})  # fit CTM

coherence(model, dtm.dtm, 10)  # average PMI coherence using top 10 words
'''

