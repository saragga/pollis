[[codeBranches]]
model = "ctm"
code = '''
using TopicModelsVB

docs  = {{corpus}}  # vector of strings, one per document
words = [split(lowercase(replace(d, r"[^A-Za-z ]" => " "))) for d in docs]  # lowercase words, punctuation stripped
vocab = sort(unique(reduce(vcat, words)))  # vocabulary
key   = Dict(w => i for (i, w) in enumerate(vocab))  # word -> vocabulary key
corp  = Corpus([Document([key[w] for w in ws]) for ws in words], vocab=vocab)  # TopicModelsVB corpus (its own type, not a document-term matrix)
fixcorp!(corp, stop=true, condense=true, remove_empty_docs=true, trim=true)  # drop stop words, merge repeated words into counts

model = CTM(corp, {{k}})  # logistic-normal prior on topic proportions; {{k}} topics
train!(model, iter={{iters}})  # variational EM training

showtopics(model, 10)  # top 10 words of each topic
topicdist(model, 1)  # topic proportions of document 1 (sums to 1)
'''

