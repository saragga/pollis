[[actionGroups.actions]]
id = "infer-topics"
label = "Infer Topics"
desc = "Topic distribution for a new document"
code = '''
using TopicModels, TextAnalysis

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)  # normalise
dtm = DocumentTermMatrix(crps)  # document-term matrix
model = CTM(dtm.dtm, {{k}}); train!(model)  # fit CTM

