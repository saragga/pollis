[[actionGroups.actions]]
id = "top-docs"
label = "Top Documents"
desc = "Documents most representative of a given topic"
code = '''
using TopicModels, TextAnalysis

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)  # normalise
dtm = DocumentTermMatrix(crps)  # document-term matrix
model = CTM(dtm.dtm, {{k}}); train!(model)  # fit CTM

gamma = topicdist(model)  # document-topic matrix
sortperm(gamma[:, topic_idx], rev=true)[1:10]  # top 10 documents for a chosen topic
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-k"
label = "Compare k Topics"
desc = "Perplexity across different numbers of topics"
code = '''
using TopicModels, TextAnalysis

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)  # normalise
dtm = DocumentTermMatrix(crps)  # document-term matrix

for k in [5, 10, 20, 50]  # sweep over topic counts
    m = CTM(dtm.dtm, k); train!(m, iter={{iters}})  # fit model
    println("k=", k, " perplexity=", perplexity(m))  # report perplexity
end
'''

[[actionGroups.actions]]
id = "ctm-vs-fctm"
label = "CTM vs Focused CTM"
desc = "Topic quality with and without background separation"
code = '''
using TopicModels, TextAnalysis

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)  # normalise
dtm = DocumentTermMatrix(crps)  # document-term matrix

m1 = CTM(dtm.dtm, {{k}}); train!(m1, iter={{iters}})  # standard CTM
m2 = fCTM(dtm.dtm, {{k}}); train!(m2, iter={{iters}})  # focused CTM
println("CTM perplexity:  ", perplexity(m1))  # compare perplexity
println("fCTM perplexity: ", perplexity(m2))  # compare perplexity
'''

