id = "infer-topics"
label = "Infer Topics"
desc = "Topic distribution for a new document"
code = '''
using TopicModelsVB

docs  = {{corpus}}  # vector of strings, one per document
words = [split(lowercase(replace(d, r"[^A-Za-z ]" => " "))) for d in docs]  # lowercase words, punctuation stripped
vocab = sort(unique(reduce(vcat, words)))  # vocabulary
key   = Dict(w => i for (i, w) in enumerate(vocab))  # word -> vocabulary key
corp  = Corpus([Document([key[w] for w in ws]) for ws in words], vocab=vocab)  # TopicModelsVB corpus (its own type, not a document-term matrix)
fixcorp!(corp, stop=true, condense=true, remove_empty_docs=true, trim=true)  # drop stop words, merge repeated words into counts
model = CTM(corp, {{k}}); train!(model, iter={{iters}}, printelbo=false)  # fit CTM

new_text = "replace with the text of a new document"
ids = [key[w] for w in split(lowercase(replace(new_text, r"[^A-Za-z ]" => " "))) if haskey(key, w)]  # known words only
new_corp = Corpus(Document(ids), vocab=corp.vocab)  # same vocabulary keys as the training corpus
fixcorp!(new_corp, condense=true)  # merge repeated words into counts
topicdist(predict(new_corp, model), 1)  # topic proportions of the new document, topics held fixed
'''

