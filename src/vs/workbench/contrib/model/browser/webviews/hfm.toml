[[codeBranches]]
model = "multimodal"
code = """
using Transformers, Transformers.HuggingFace
using Images

proc  = HuggingFace.load_processor("openai/clip-vit-base-patch32")  # load CLIP processor
model = HuggingFace.load_model(HuggingFace.CLIPModel, "openai/clip-vit-base-patch32")  # load CLIP model

img   = load("photo.jpg") |> proc  # preprocess image
txt   = proc("a cat sitting on a mat")  # tokenise text query
out   = model(img.pixel_values, txt.input_ids, txt.attention_mask)  # joint vision–language forward pass
sim   = out.logits_per_image  # image–text similarity logits
"""

[[codeBranches]]
model = "nlp"
code = """
using Transformers, Transformers.HuggingFace

tkr   = HuggingFace.load_tokenizer("meta-llama/Llama-3.2-3B-Instruct")  # load tokenizer
model = HuggingFace.load_model(HuggingFace.GPTModel, "meta-llama/Llama-3.2-3B-Instruct")  # load language model

prompt = tkr("The capital of France is")  # tokenise prompt
out    = generate(model, prompt.token; max_new_tokens=32)  # autoregressive generation
text   = tkr.decode(out[1])  # decode generated token ids
"""

[[codeBranches]]
model = "vision"
code = """
using Transformers, Transformers.HuggingFace
using Images

proc   = HuggingFace.load_processor("google/vit-base-patch16-224")  # load image processor
model  = HuggingFace.load_model(HuggingFace.ViTModel, "google/vit-base-patch16-224")  # load ViT model

img    = load("image.jpg") |> proc  # load and preprocess image
logits = model(img.pixel_values).logits  # forward pass; shape: (num_classes,)
pred   = argmax(logits)  # predicted class index
"""

[[codeBranches]]
model = "audio"
code = """
using Transformers, Transformers.HuggingFace
using WAV

proc   = HuggingFace.load_processor("openai/whisper-large-v3")  # load audio processor
model  = HuggingFace.load_model(HuggingFace.WhisperModel, "openai/whisper-large-v3")  # load Whisper model

wave, sr = wavread("audio.wav")  # load 16 kHz mono waveform
inputs   = proc(wave)  # extract log-mel spectrogram
out      = generate(model, inputs.input_features)  # decode with greedy search
text     = proc.decode(out[1])  # decoded transcript
"""

[[codeBranches]]
model = "embedding"
code = """
using Transformers, Transformers.HuggingFace

tkr   = HuggingFace.load_tokenizer("sentence-transformers/all-MiniLM-L6-v2")  # load tokenizer
model = HuggingFace.load_model(HuggingFace.TextEncoderModel, "sentence-transformers/all-MiniLM-L6-v2")  # load embedding model

enc   = tkr("Hello, world!")  # tokenise input text
emb   = model(enc.token, enc.segment, enc.attention_mask).hidden_state[:, 1, :]  # CLS token embedding
"""

# Tabular, RL and Graph ML share the generic loading example.
