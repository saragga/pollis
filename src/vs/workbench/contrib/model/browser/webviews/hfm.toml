desc = "Visualise last-layer attention for a single input"
code = """
using Transformers, Transformers.HuggingFace, Plots

tkr   = HuggingFace.load_tokenizer("bert-base-uncased")  # load tokenizer
model = HuggingFace.load_model(HuggingFace.BertModel, "bert-base-uncased")  # load BERT

enc   = tkr("Transformers changed NLP")  # tokenise text
out   = model(enc.token, enc.segment, enc.attention_mask; output_attentions=true)  # forward with attention
attn  = out.attentions[end][:, :, 1, 1]  # last-layer attention, head 1
heatmap(attn, title="Attention")  # plot attention heatmap
"""
