[[actionGroups.actions]]
id = "embedding-scatter"
label = "Embedding Scatter"
desc = "Project model embeddings to 2D with UMAP for visual inspection"
code = """
using Transformers, UMAP, Plots
using Transformers.HuggingFace

tkr  = HuggingFace.load_tokenizer("sentence-transformers/all-MiniLM-L6-v2")  # load tokenizer
model = HuggingFace.load_model(HuggingFace.TextEncoderModel, "sentence-transformers/all-MiniLM-L6-v2")  # load embedding model

embs = hcat([vec(model(tkr(d).token, tkr(d).segment, tkr(d).attention_mask).hidden_state[:, 1, :]) for d in docs]...)  # embed all documents
proj = umap(embs, 2)  # reduce to 2D with UMAP
scatter(proj[1, :], proj[2, :], xlabel="UMAP 1", ylabel="UMAP 2")  # scatter plot of embeddings
"""

