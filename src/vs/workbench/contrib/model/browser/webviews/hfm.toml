# Hugging Face Models Webview Configuration
# Declarative source. The build script generates hfm.data.ts.
# Run: npm run gulp compile-toml
#
# Approach: models are loaded in Julia with Transformers.jl (HuggingFace submodule),
# exported ONNX models run with ONNX.jl. The Explore pane queries the public Hub REST
# API (huggingface.co/api/models) live. A personal access token (shared with the
# Hugging Face Datasets webview) is only required for gated or private models; it is
# injected into the REPL session as ENV["HUGGING_FACE_HUB_TOKEN"] and never written
# to a file.

[meta]
title = "Hugging Face Models"
viewType = "pollis.hfm"
defaultModel = "nlp"

[notes.explore]
intro = "The Task sub-categories (Computer Vision, Natural Language Processing, …) are visual groupings that all belong to one Task category. A query joins your selections with <strong>OR</strong> inside a category and <strong>AND</strong> across categories. For example, picking <em>Text Generation</em> plus <em>Summarization</em> under Task, plus <em>PyTorch</em> under Framework, builds: <code>(Text Generation OR Summarization) AND (PyTorch)</code>"

# Interactive Explore pane (replaces the static Illustration pane). Groups sharing an
# `axis` are OR-ed in the query, different axes AND-ed. The axes map onto the Hub API:
# task -> pipeline_tag, framework -> filter, author -> author. Queried live against the Hub.
[explore]
label = "Explore by Task / Framework / Author"

