[[actionGroups.actions]]
id = "batch-inference"
label = "Batch Inference"
desc = "Run inference over a list of inputs in mini-batches"
code = """
using Transformers, Transformers.HuggingFace

tkr    = HuggingFace.load_tokenizer("sentence-transformers/all-MiniLM-L6-v2")  # load tokenizer
model  = HuggingFace.load_model(HuggingFace.TextEncoderModel, "sentence-transformers/all-MiniLM-L6-v2")  # load model

batch  = 16  # mini-batch size
for i in 1:batch:length(texts)
    chunk = texts[i:min(i+batch-1, end)]  # current mini-batch
    enc   = tkr.(chunk)  # tokenise batch
    out   = model.(enc)  # forward pass over batch
end
"""

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-models"
label = "Compare Models"
desc = "Benchmark two HF models on the same input"
code = """
using Transformers, Transformers.HuggingFace

ids   = ["bert-base-uncased", "sentence-transformers/all-MiniLM-L6-v2"]  # models to compare

for id in ids
    tkr   = HuggingFace.load_tokenizer(id)  # tokenizer for model
    model = HuggingFace.load_model(HuggingFace.BertModel, id)  # load model
    enc   = tkr("benchmark text")  # tokenise input
    out   = model(enc.token, enc.segment, enc.attention_mask)  # forward pass
    println(id, " hidden_size: ", size(out.hidden_state, 1))  # print hidden dimension
end
"""

[[actionGroups.actions]]
id = "julia-onnx-vs-python"
label = "Julia (ONNX) vs Python"
desc = "Run the same HF ONNX model in Julia and Python; compare outputs and latency"
code = """
# ── Julia side (ONNX.jl) ──────────────────────────────────────
using ONNX, BenchmarkTools

model  = ONNX.load("minilm.onnx")  # load exported ONNX model
input  = rand(Float32, 1, 128)  # dummy token-id input (batch=1, seq=128)
out_jl = model(input)  # forward pass
emb_jl = out_jl["last_hidden_state"][:, 1, :]  # CLS token embedding

t_jl   = @benchmark model(input)  # benchmark
println("Julia  median: ", median(t_jl).time ÷ 1_000_000, " ms")  # report latency

