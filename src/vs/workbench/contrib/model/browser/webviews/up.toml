# Uncertainty Propagation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/up.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Uncertainty Propagation"
viewType = "pollis.up"
defaultModel = "main"

[[packages]]
name = "MonteCarloMeasurements.jl"
github = "https://github.com/baggepinnen/MonteCarloMeasurements.jl"

[[packages]]
name = "Distributions.jl"
github = "https://github.com/JuliaStats/Distributions.jl"

[requires]
packages = ["MonteCarloMeasurements.jl", "Distributions.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Uncertainty Propagation Basics"
file = "up/tutorial-01-basics.ipynb"
bundled = true
description = "Introduction to uncertain particles and basic arithmetic propagation"

[[notebookSections.notebooks]]
name = "Nonlinear Propagation"
file = "up/tutorial-02-nonlinear.ipynb"
bundled = true
description = "Propagating uncertainty through nonlinear functions and composite expressions"

[[notebookSections.notebooks]]
name = "Confidence Intervals"
file = "up/tutorial-03-confidence-intervals.ipynb"
bundled = true
description = "Computing credible intervals and percentile statistics from particles"

[[notebookSections.notebooks]]
name = "Sensitivity Analysis"
file = "up/tutorial-04-sensitivity.ipynb"
bundled = true
description = "Identifying which uncertain inputs contribute most to output variance"

[[notebookSections.notebooks]]
name = "Correlated Inputs"
file = "up/tutorial-05-correlated-inputs.ipynb"
bundled = true
description = "Propagating uncertainty when input variables are statistically correlated using copulas and multivariate distributions"

[[wikis]]
name = "Overview"
file = "up/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "up/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "up/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "up/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "up/interpretation.md"
bundled = true

[[wikis]]
name = "Decision Guide"
file = "up/decision-guide.md"
bundled = true

[[bullets]]
text = "Particles (n)"
detail = "Monte Carlo representation of uncertain quantities using n random samples from each input distribution"

[[bullets]]
text = "Uncertain Inputs"
detail = "define uncertain variables as probability distributions (Normal, Uniform, Beta, and more)"

[[bullets]]
text = "Statistics"
detail = "mean, standard deviation, and confidence intervals (CI) of the propagated output"

[[inputs]]
id = "variables"
label = "Uncertain Variables"
tooltip = "One variable per line: name = Particles(n, Distribution(parameters)). Distributions: Normal, Uniform, LogNormal, Exponential, Beta, Gamma, Weibull, TDist, ..."
kind = "textarea"
default = "x = Particles(n, Normal(0.0, 1.0))\ny = Particles(n, Uniform(0.0, 1.0))"

[[inputs]]
id = "expression"
label = "Expression"
tooltip = "Julia expression of the uncertain variables, e.g. x^2 * sin(y) or a call to your own function. Every particle is pushed through it."
default = "x + y"

[[inputs]]
id = "n-particles"
label = "Particles (n)"
tooltip = "Monte Carlo samples carried by each uncertain variable. More particles give smoother estimates at a higher cost."
kind = "select"
default = "1000"

[[inputs.options]]
value = "100"
label = "100"

[[inputs.options]]
value = "500"
label = "500"

[[inputs.options]]
value = "1000"
label = "1000"

[[inputs.options]]
value = "2000"
label = "2000"

[[inputs.options]]
value = "5000"
label = "5000"

[[inputs.options]]
value = "10000"
label = "10000"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Random seed, so that the particles are reproducible."
default = "42"

[[inputs]]
id = "ci-level"
label = "CI Level"
tooltip = "Central interval reported from the quantiles of the output particles."
kind = "select"
default = "95"

[[inputs.options]]
value = "90"
label = "90%"

[[inputs.options]]
value = "95"
label = "95%"

[[inputs.options]]
value = "99"
label = "99%"

[[codeBranches]]
model = "main"
code = '''
using MonteCarloMeasurements, Distributions
using Random
Random.seed!({{seed}})  # for reproducibility

n = {{n-particles}}  # number of particles
{{variables}}

result = {{expression}}  # propagated output

here = @__MODULE__
ins = [s => getfield(here, s) for s in names(here) if s !== :result && isdefined(here, s) && getfield(here, s) isa Particles]  # the uncertain inputs
fexpr = eval(Expr(:->, Expr(:tuple, first.(ins)...), :({{expression}})))  # the expression as a function of the inputs
tail = (100 - {{ci-level}}) / 200  # tail probability on each side

println("Mean:  ", pmean(result))
println("Std:   ", pstd(result))
println("{{ci-level}}% CI: [", pquantile(result, tail), ", ", pquantile(result, 1 - tail), "]")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "distribution"
label = "Output Distribution"
desc = "Histogram of the output particles with the mean and the {{ci-level}}% interval"
code = '''
using Plots
histogram(result.particles, bins=60, normalize=:pdf, alpha=0.6, label="output particles")
vline!([pmean(result)], lw=2, label="mean")
vline!([pquantile(result, tail), pquantile(result, 1 - tail)], ls=:dash, label="{{ci-level}}% interval")
'''

[[actionGroups.actions]]
id = "scatter"
label = "Output Against Each Input"
desc = "Scatter of the output particles against each input: a clear pattern shows which inputs drive the output, and whether the relation is linear"
code = '''
using Plots
plot([scatter(v.particles, result.particles, ms=1, alpha=0.3, legend=false, xlabel=string(k), ylabel="output") for (k, v) in ins]..., layout=(1, length(ins)), size=(320 * length(ins), 300))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence"
label = "Convergence in Particles"
desc = "Running mean and standard deviation over the first k particles, and the Monte Carlo standard error of the mean: flat curves mean n is large enough"
code = '''
using Plots, Statistics
ks = unique(round.(Int, range(20, n; length=100)))
p = result.particles
println("Monte Carlo standard error of the mean: ", pstd(result) / sqrt(n))
plot(plot(ks, [mean(p[1:k]) for k in ks], legend=false, title="running mean"), plot(ks, [std(p[1:k]) for k in ks], legend=false, title="running std"), xlabel="particles", size=(700, 300))
'''

[[actionGroups.actions]]
id = "normality"
label = "Shape of the Output"
desc = "Skewness and excess kurtosis of the output: far from 0, a mean plus or minus a standard deviation misdescribes the uncertainty, and the quantile interval should be used"
code = '''
using Distributions
p = result.particles
(skewness = skewness(p), excess_kurtosis = kurtosis(p), normal_interval = (pmean(result) + quantile(Normal(), tail) * pstd(result), pmean(result) + quantile(Normal(), 1 - tail) * pstd(result)), quantile_interval = (pquantile(result, tail), pquantile(result, 1 - tail)))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "percentiles"
label = "Percentiles"
desc = "Output percentiles from 1% to 99%"
code = '''
[(percentile = 100q, value = pquantile(result, q)) for q in [0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.99]]
'''

[[actionGroups.actions]]
id = "tails"
label = "Tail Probabilities"
desc = "Probability that the output exceeds its mean by 1, 2 and 3 standard deviations, next to what a normal distribution would give"
code = '''
using Distributions
m, s = pmean(result), pstd(result)
[(threshold = "mean + $(k) sd", probability = @prob(result > m + k * s), if_normal = ccdf(Normal(), k)) for k in 1:3]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "linear"
label = "Against Linear Propagation"
desc = "First-order (delta method) propagation with Measurements.jl, from the mean and standard deviation of each input: it misses nonlinearity and the correlation between inputs"
code = '''
using Measurements
lin = Base.invokelatest(fexpr, [measurement(pmean(v), pstd(v)) for (_, v) in ins]...)
(monte_carlo = (mean = pmean(result), std = pstd(result)), linear = (mean = Measurements.value(lin), std = Measurements.uncertainty(lin)))
'''

[[actionGroups.actions]]
id = "fewer-particles"
label = "Fewer Particles"
desc = "The same expression evaluated on the first 10%, 25% and 50% of the particles: how much the estimates move with a smaller sample"
code = '''
sub(m) = Base.invokelatest(fexpr, [Particles(v.particles[1:m]) for (_, v) in ins]...)
[(particles = m, mean = pmean(r), std = pstd(r), lower = pquantile(r, tail), upper = pquantile(r, 1 - tail)) for (m, r) in ((m, sub(m)) for m in unique([div(n, 10), div(n, 4), div(n, 2), n]))]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary"
label = "In Plain Terms"
desc = "The result as a value with its uncertainty, the relative uncertainty and the {{ci-level}}% interval"
code = '''
m, s = pmean(result), pstd(result)
println("The output is ", round(m, sigdigits=4), " +/- ", round(s, sigdigits=2), " (one standard deviation).")
println("Relative uncertainty: ", round(100 * s / abs(m), digits=1), "% of the mean.")
println("With {{ci-level}}% probability it lies between ", round(pquantile(result, tail), sigdigits=4), " and ", round(pquantile(result, 1 - tail), sigdigits=4), ".")
'''

[[actionGroups.actions]]
id = "sensitivity"
label = "Which Input Matters"
desc = "Squared correlation between each input and the output: roughly the share of output variance each input explains (exact for linear, independent inputs)"
code = '''
using Statistics
sort([(input = k, share_of_variance = round(cor(v.particles, result.particles)^2, digits=3)) for (k, v) in ins], by = r -> -r.share_of_variance)
'''
