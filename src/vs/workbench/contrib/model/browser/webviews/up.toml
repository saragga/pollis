[[codeBranches]]
model = "main"
code = '''
using MonteCarloMeasurements, Distributions
using Random
Random.seed!({{seed}})  # for reproducibility

n = {{n-particles}}  # number of particles
{{variables}}

result = {{expression}}  # propagated output

here = @__MODULE__
used = Set{Symbol}()  # every name the expression mentions
function collect_names!(used, ex)
    ex isa Symbol && push!(used, ex)
    ex isa Expr && foreach(a -> collect_names!(used, a), ex.args)
    return used
end
collect_names!(used, :({{expression}}))
ins = [s => getfield(here, s) for s in sort!(collect(used)) if isdefined(here, s) && getfield(here, s) isa Particles]  # the uncertain inputs the expression uses
fexpr = eval(Expr(:->, Expr(:tuple, first.(ins)...), :({{expression}})))  # the expression as a function of the inputs
tail = (100 - {{ci-level}}) / 200  # tail probability on each side
tolerance(u) = 0.5 * 10.0^(floor(Int, log10(u)) - 1)  # numerical tolerance of u with two significant digits (JCGM 101 7.9.2)

println("Mean:  ", pmean(result))
println("Std:   ", pstd(result))
println("{{ci-level}}% coverage interval: [", pquantile(result, tail), ", ", pquantile(result, 1 - tail), "]")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "distribution"
label = "Output Distribution"
desc = "Histogram of the output particles with the mean and the probabilistically symmetric coverage interval"
code = '''
using Plots
histogram(result.particles, bins=60, normalize=:pdf, alpha=0.6, label="output particles")
vline!([pmean(result)], lw=2, label="mean")
vline!([pquantile(result, tail), pquantile(result, 1 - tail)], ls=:dash, label="{{ci-level}}% coverage interval")
'''

[[actionGroups.actions]]
id = "scatter"
label = "Output Against Each Input"
desc = "Scatter of the output particles against each input: a clear pattern shows which inputs drive the output, and whether the relation is linear"
code = '''
using Plots
plot([scatter(v.particles, result.particles, ms=1, alpha=0.3, legend=false, xlabel=string(k), ylabel="output") for (k, v) in ins]..., layout=(1, length(ins)), size=(320 * length(ins), 300))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence"
label = "Convergence in Particles"
desc = "Running mean and standard deviation over the first k particles, and ten more runs with new seeds: twice the standard deviation of the average of the estimates against the numerical tolerance, as in the adaptive procedure of JCGM 101 7.9.4"
code = '''
using Plots, Statistics
function rerun(s)  # one more application of the Monte Carlo method with seed s
    Random.seed!(s)
    {{variables}}
    r = {{expression}}
    [pmean(r), pstd(r), pquantile(r, tail), pquantile(r, 1 - tail)]
end
h = 10
est = reduce(hcat, [rerun({{seed}} + k) for k in 1:h])  # one column per run
s_avg = [std(est[i, :]) / sqrt(h) for i in 1:4]  # standard deviation of the average of h estimates (JCGM 101 7.9.4 g)
delta = tolerance(mean(est[2, :]))
display([(quantity = q, twice_sd_of_average = 2s, tolerance = delta, stabilised = 2s <= delta) for (q, s) in zip(["mean", "std", "lower end", "upper end"], s_avg)])
ks = unique(round.(Int, range(20, n; length=100)))
p = result.particles
plot(plot(ks, [mean(p[1:k]) for k in ks], legend=false, title="running mean"), plot(ks, [std(p[1:k]) for k in ks], legend=false, title="running std"), xlabel="particles", size=(700, 300))
'''

[[actionGroups.actions]]
id = "normality"
label = "Shape of the Output"
desc = "Skewness and excess kurtosis of the output, and the interval mean plus or minus k standard deviations, with k the normal quantile, beside the probabilistically symmetric coverage interval"
code = '''
using Distributions
p = result.particles
(skewness = skewness(p), excess_kurtosis = kurtosis(p), normal_interval = (pmean(result) + quantile(Normal(), tail) * pstd(result), pmean(result) + quantile(Normal(), 1 - tail) * pstd(result)), quantile_interval = (pquantile(result, tail), pquantile(result, 1 - tail)))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "percentiles"
label = "Percentiles"
desc = "Output percentiles from 1% to 99%"
code = '''
[(percentile = 100q, value = pquantile(result, q)) for q in [0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.99]]
'''

[[actionGroups.actions]]
id = "tails"
label = "Tail Probabilities"
desc = "Probability that the output exceeds its mean by 1, 2 and 3 standard deviations, next to what a normal distribution would give"
code = '''
using Distributions
m, s = pmean(result), pstd(result)
[(threshold = "mean + $(k) sd", probability = @prob(result > m + k * s), if_normal = ccdf(Normal(), k)) for k in 1:3]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "linear"
label = "Against Linear Propagation"
desc = "First-order propagation with Measurements.jl, from the mean and standard deviation of each input taken as independent, compared with the Monte Carlo coverage interval as in JCGM 101 8.1.3: the endpoint differences against the numerical tolerance"
code = '''
using Measurements
lin = Base.invokelatest(fexpr, [measurement(pmean(v), pstd(v)) for (_, v) in ins]...)
y, U = Measurements.value(lin), quantile(Normal(), 1 - tail) * Measurements.uncertainty(lin)  # y +/- U_p with a normal coverage factor
d_low, d_high = abs(y - U - pquantile(result, tail)), abs(y + U - pquantile(result, 1 - tail))  # JCGM 101 (19) and (20)
delta = tolerance(pstd(result))
(monte_carlo = (mean = pmean(result), std = pstd(result)), linear = (mean = y, std = Measurements.uncertainty(lin)),
 d_low = d_low, d_high = d_high, tolerance = delta, linear_validated = d_low <= delta && d_high <= delta)
'''

[[actionGroups.actions]]
id = "fewer-particles"
label = "Fewer Particles"
desc = "The same expression evaluated on the first 10%, 25% and 50% of the particles: how much the estimates move with a smaller sample"
code = '''
sub(m) = Base.invokelatest(fexpr, [Particles(v.particles[1:m]) for (_, v) in ins]...)
[(particles = m, mean = pmean(r), std = pstd(r), lower = pquantile(r, tail), upper = pquantile(r, 1 - tail)) for (m, r) in ((m, sub(m)) for m in unique([div(n, 10), div(n, 4), div(n, 2), n]))]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary"
label = "In Plain Terms"
desc = "The result with its standard uncertainty and coverage interval, rounded as in JCGM 101 5.5.2, and the relative uncertainty"
code = '''
m, s = pmean(result), pstd(result)
d = s > 0 ? 1 - floor(Int, log10(s)) : 4  # decimals that give s two significant digits; the other values keep the same decimal position (JCGM 101 5.5.2)
r(v) = round(v; digits=d)
println("The output is ", r(m), " with standard uncertainty ", r(s), ".")
println("Relative uncertainty: ", round(100 * s / abs(m), digits=1), "% of the mean.")
println("The probabilistically symmetric {{ci-level}}% coverage interval is [", r(pquantile(result, tail)), ", ", r(pquantile(result, 1 - tail)), "].")
'''

[[actionGroups.actions]]
id = "sensitivity"
label = "Which Input Matters"
desc = "For each input, the output with all other inputs held at their means, as in JCGM 101 Annex B: its standard deviation is the contribution of the input, and the ratio to the input's standard deviation a sensitivity coefficient"
code = '''
one_at_a_time(k) = Base.invokelatest(fexpr, [j == k ? v : pmean(v) for (j, (_, v)) in enumerate(ins)]...)  # the other inputs at their best estimates
sort([(input = name, contribution = pstd(one_at_a_time(k)), sensitivity = pstd(one_at_a_time(k)) / pstd(v), output_std = pstd(result)) for (k, (name, v)) in enumerate(ins)], by = r -> -r.contribution)
'''
