[[inputs]]
id = "variables"
label = "Uncertain Variables"
tooltip = "One input per line: name = Particles(n, Distribution(parameters)), independent of the others. Distributions: Normal, Uniform, LogNormal, Exponential, Beta, Gamma, Weibull, TDist, ... Correlated inputs come from one multivariate distribution: x, y = Particles(n, MvNormal([0.0, 0.0], [1.0 0.5; 0.5 1.0])). Write derived quantities (z = x * y) into the expression, not here."
kind = "textarea"
default = "x = Particles(n, Normal(0.0, 1.0))\ny = Particles(n, Uniform(0.0, 1.0))"

[[inputs]]
id = "expression"
label = "Expression"
tooltip = "Julia expression of the uncertain variables, e.g. x^2 * sin(y). Every particle is pushed through it. Constants and your own functions are fine if the variables are passed as arguments, f(x, y): the comparison, scatter and sensitivity actions treat each variable named in the expression as an input, and miss variables a function reads as globals."
default = "x + y"

[[inputs]]
id = "n-particles"
label = "Particles (n)"
tooltip = "Monte Carlo samples carried by each uncertain variable. JCGM 101 7.2.2 suggests at least 10^4/(1 - p) trials for a coverage probability p: 100000 at 90%, 200000 at 95% and 1000000 at 99%."
kind = "select"
default = "1000"

