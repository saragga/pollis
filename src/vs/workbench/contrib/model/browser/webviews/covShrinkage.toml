code = '''
using CovarianceEstimation, LinearAlgebra, Statistics, Random

X = {{X}}  # n x p data matrix, rows = observations
n, p = size(X)

estimator = WoodburyEstimator({{rank}})  # low-rank plus diagonal structured estimator

estimate(A) = Matrix(Symmetric(Matrix(cov(estimator, A))))  # dense symmetric p x p estimate
S        = estimate(X)
S_sample = cov(X)  # plain sample covariance, for reference

# mean Gaussian log-likelihood of a random half of the rows under a covariance fitted on the other half
function holdout(fitcov; seed=1)
    idx = randperm(MersenneTwister(seed), n)
    tr, te = idx[1:div(n, 2)], idx[div(n, 2)+1:end]
    Sig = Symmetric(fitcov(X[tr, :]))
    isposdef(Sig) || return -Inf  # singular (e.g. the sample covariance when p > n/2)
    Z = X[te, :] .- mean(X[tr, :], dims=1)
    -0.5 * (logdet(Sig) + mean(sum((Z * inv(Sig)) .* Z, dims=2)) + p * log(2pi))
end

(n = n, p = p, cond_sample = cond(S_sample), cond_estimate = cond(S))
'''

[[codeBranches]]
model = "biweight"
code = '''
using CovarianceEstimation, LinearAlgebra, Statistics, Random

X = {{X}}  # n x p data matrix, rows = observations
n, p = size(X)

estimator = BiweightMidcovariance(c={{c}})  # robust covariance via Tukey biweight

estimate(A) = Matrix(Symmetric(Matrix(cov(estimator, A))))  # dense symmetric p x p estimate
S        = estimate(X)
S_sample = cov(X)  # plain sample covariance, for reference

# mean Gaussian log-likelihood of a random half of the rows under a covariance fitted on the other half
function holdout(fitcov; seed=1)
    idx = randperm(MersenneTwister(seed), n)
    tr, te = idx[1:div(n, 2)], idx[div(n, 2)+1:end]
    Sig = Symmetric(fitcov(X[tr, :]))
    isposdef(Sig) || return -Inf  # singular (e.g. the sample covariance when p > n/2)
    Z = X[te, :] .- mean(X[tr, :], dims=1)
    -0.5 * (logdet(Sig) + mean(sum((Z * inv(Sig)) .* Z, dims=2)) + p * log(2pi))
end

(n = n, p = p, cond_sample = cond(S_sample), cond_estimate = cond(S))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "cov-heatmap"
label = "Correlation Heatmap"
desc = "Correlations implied by the sample covariance and by this estimate, side by side"
code = '''
using Plots

corr(C) = C ./ sqrt.(diag(C) * permutedims(diag(C)))
plot(heatmap(corr(S_sample), clims=(-1, 1), color=:balance, yflip=true, title="sample"),
     heatmap(corr(S), clims=(-1, 1), color=:balance, yflip=true, title="estimate"), layout=(1, 2), size=(900, 400))
'''

[[actionGroups.actions]]
id = "eigenvalue-spectrum"
label = "Eigenvalue Spectrum"
desc = "Sorted eigenvalues of the sample covariance and of this estimate (log scale): shrinkage lifts the smallest and lowers the largest"
code = '''
using Plots

plot(sort(eigvals(Symmetric(S_sample)), rev=true), label="sample", yscale=:log10, marker=:circle, markersize=2)
plot!(sort(eigvals(Symmetric(S)), rev=true), label="estimate", marker=:circle, markersize=2, xlabel="rank", ylabel="eigenvalue")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "conditioning"
label = "Conditioning"
desc = "Condition number, smallest eigenvalue and positive definiteness of the sample covariance and of this estimate"
code = '''
summ(C) = (cond = cond(C), min_eig = minimum(eigvals(Symmetric(C))), posdef = isposdef(Symmetric(C)))
(sample = summ(S_sample), estimate = summ(S))
'''

[[actionGroups.actions]]
id = "distance"
label = "Distance from Sample Covariance"
desc = "How far the estimate moved from the sample covariance: relative Frobenius distance and the largest change in any correlation"
code = '''
corr(C) = C ./ sqrt.(diag(C) * permutedims(diag(C)))
(relative_frobenius = norm(S - S_sample) / norm(S_sample), max_corr_change = maximum(abs, corr(S) - corr(S_sample)))
'''

[[actionGroups.actions]]
id = "holdout"
label = "Held-Out Log-Likelihood"
desc = "Gaussian log-likelihood of held-out rows over 10 random splits, for this estimator and the sample covariance (higher is better)"
code = '''
(estimate = mean(holdout(estimate; seed=s) for s in 1:10), sample = mean(holdout(cov; seed=s) for s in 1:10))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "precision-matrix"
label = "Precision and Partial Correlations"
desc = "Invert the estimate: the precision matrix and the partial correlation between each pair of variables given all others"
code = '''
using Plots

P = inv(Symmetric(S))  # precision matrix
partial = -P ./ sqrt.(diag(P) * permutedims(diag(P)))
partial[diagind(partial)] .= 1
heatmap(partial, clims=(-1, 1), color=:balance, yflip=true, title="partial correlations")
'''

[[actionGroups.actions]]
id = "mahalanobis"
label = "Mahalanobis Outlier Scores"
desc = "Squared Mahalanobis distance of new observations under this estimate, with chi-square p-values"
code = '''
using Distributions

P  = inv(Symmetric(S))
Z  = X_new .- mean(X, dims=1)  # X_new: same columns as X
d2 = vec(sum((Z * P) .* Z, dims=2))  # squared Mahalanobis distances
pvalues  = ccdf.(Chisq(p), d2)
outliers = findall(pvalues .< 0.01)
'''

[[actionGroups.actions]]
id = "min-variance"
label = "Minimum-Variance Weights"
desc = "Global minimum-variance portfolio weights implied by this estimate (columns of X are asset returns)"
code = '''
P = inv(Symmetric(S))
w = P * ones(p) ./ sum(P * ones(p))  # weights sum to 1
(weights = w, variance = dot(w, S * w))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-estimators"
label = "Compare Estimators"
desc = "Held-out log-likelihood and condition number for the sample covariance and several shrinkage estimators on the same data"
code = '''
candidates = [
    "sample" => cov,
    "Ledoit-Wolf, constant correlation" => A -> cov(LinearShrinkage(ConstantCorrelation(), :lw), A),
    "OAS, common variance" => A -> cov(LinearShrinkage(DiagonalCommonVariance(), :oas), A),
    "analytical nonlinear" => A -> cov(AnalyticalNonlinearShrinkage(), A),
    "biweight" => A -> cov(BiweightMidcovariance(), A),
    "this estimate" => estimate,
]
map(candidates) do (name, f)
    (estimator = name, holdout_loglik = mean(holdout(f; seed=s) for s in 1:10), cond = cond(Matrix(f(X))))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "eigen-map"
label = "Eigenvalue Shrinkage Map"
desc = "Each sample eigenvalue against the eigenvalue of the estimate in the same rank position; the diagonal is no shrinkage"
code = '''
using Plots

ls = sort(eigvals(Symmetric(S_sample)))
le = sort(eigvals(Symmetric(S)))
scatter(ls, le, xlabel="sample eigenvalue", ylabel="estimated eigenvalue", legend=false, markersize=3)
plot!([0, maximum(ls)], [0, maximum(ls)], linestyle=:dash)
'''

[[actionGroups.actions]]
id = "corr-change"
label = "Correlation Changes"
desc = "Heatmap of estimated minus sample correlations: where the estimator pulled pairs together or apart"
code = '''
using Plots

corr(C) = C ./ sqrt.(diag(C) * permutedims(diag(C)))
dC = corr(S) - corr(S_sample)
heatmap(dC, color=:balance, clims=(-maximum(abs, dC), maximum(abs, dC)), yflip=true, title="estimate - sample")
'''
