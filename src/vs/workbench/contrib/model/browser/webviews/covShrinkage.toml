[[bullets]]
text = "Linear Shrinkage"
detail = "convex combination (1 - alpha) S + alpha T of the sample covariance S and a structured target T; alpha chosen by Ledoit-Wolf, Schafer-Strimmer, OAS or RBLW"

[[bullets]]
text = "Analytical Nonlinear Shrinkage"
detail = "oracle-optimal per-eigenvalue shrinkage via the Ledoit-Wolf (2020) closed-form formula; superior to linear shrinkage for large p/n"

[[bullets]]
text = "Woodbury Estimator"
detail = "low-rank plus diagonal estimate (spiked covariance model) suited to very high-dimensional problems where p is large relative to n"

[[bullets]]
text = "Biweight Midcovariance"
detail = "robust estimator based on Tukey biweight; highly resistant to outliers and heavy-tailed distributions"

[[decisionRows]]
task = "Linear"
context = "The default for p comparable to n; portfolio and risk models"
purpose = "Blend the sample covariance with a structured target by an estimated weight alpha"

[[decisionRows]]
task = "Nonlinear"
context = "Large p/n ratios where eigenvalues need different amounts of shrinkage"
purpose = "Shrink each sample eigenvalue separately with the Ledoit-Wolf (2020) closed-form oracle"

[[decisionRows]]
task = "Woodbury"
context = "A few strong factors plus idiosyncratic noise"
purpose = "Low-rank plus diagonal structure with optimally shrunk spike eigenvalues"

[[decisionRows]]
task = "Biweight"
context = "Outliers or heavy-tailed data"
purpose = "Robust midcovariance that down-weights observations far from the median"

[[inputs]]
id = "X"
label = "X (n × p)"
tooltip = "Data matrix: n observations × p features. CovarianceEstimation.jl uses the standard Julia convention (rows = observations), so no transposing is needed."
default = "X_train"

[[inputs]]
id = "target"
label = "Target"
tooltip = "Structured matrix T towards which the sample covariance is shrunk. DiagonalUnitVariance: identity. DiagonalCommonVariance: diagonal with equal variances. DiagonalUnequalVariance: diagonal with individual variances. CommonCovariance: equal variances and equal covariances. PerfectPositiveCorrelation: all correlations = 1. ConstantCorrelation: equal off-diagonal correlations."
kind = "select"
default = "ConstantCorrelation()"
models = ["linear"]
newRow = true

[[inputs.options]]
value = "ConstantCorrelation()"
label = "ConstantCorrelation"

[[inputs.options]]
value = "DiagonalCommonVariance()"
label = "DiagonalCommonVariance"

[[inputs.options]]
value = "DiagonalUnequalVariance()"
label = "DiagonalUnequalVariance"

[[inputs.options]]
value = "DiagonalUnitVariance()"
label = "DiagonalUnitVariance"

[[inputs.options]]
value = "CommonCovariance()"
label = "CommonCovariance"

[[inputs.options]]
value = "PerfectPositiveCorrelation()"
label = "PerfectPositiveCorrelation"

[[inputs]]
id = "shrinkage"
label = "Shrinkage Method"
tooltip = ":lw: Ledoit-Wolf (2004) analytical formula. :ss: Schafer-Strimmer. :oas: Oracle Approximating Shrinkage (Chen et al. 2010), lower MSE for Gaussian data. :rblw: Rao-Blackwell Ledoit-Wolf. OAS and RBLW are defined for the DiagonalCommonVariance target only."
kind = "select"
default = ":lw"
models = ["linear"]

[[inputs.options]]
value = ":lw"
label = "Ledoit-Wolf (:lw)"

[[inputs.options]]
value = ":ss"
label = "Schafer-Strimmer (:ss)"

[[inputs.options]]
value = ":oas"
label = "OAS (:oas)"

[[inputs.options]]
value = ":rblw"
label = "RBLW (:rblw)"

[[inputs]]
id = "rank"
label = "Rank"
tooltip = "Rank of the low-rank component. Choose it well below p to reflect a belief that most variation lies in a few factors. A higher rank captures more structure but shrinks less."
default = "2"
models = ["woodbury"]
newRow = true

[[inputs]]
id = "c"
label = "Tuning Constant c"
tooltip = "Biweight tuning constant, in units of the median absolute deviation. Smaller values reject outliers more aggressively; 9 is the standard choice."
default = "9.0"
models = ["biweight"]
newRow = true

