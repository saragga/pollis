# Regularised Covariance Estimation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/covShrinkage.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Regularised Covariance Estimation"
viewType = "pollis.cov-shrinkage"
defaultModel = "linear"

[[packages]]
name = "CovarianceEstimation.jl"
github = "https://mateuszbaran.github.io/CovarianceEstimation.jl/stable/"

[requires]
packages = ["CovarianceEstimation.jl", "Plots.jl", "Distributions.jl"]

[[notebookSections]]
label = ""

