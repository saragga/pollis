# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.sos]
# A quartic curve that stays above zero
svg = '''
var d = 'M8,28';
for (var x = 8; x <= 46; x++) { var u = (x - 27) / 10; d += ' L' + x + ',' + (58 - 8 * (Math.pow(u, 4) - Math.pow(u, 2) + 1) + 8).toFixed(1); }
return '<line x1="6" y1="66" x2="48" y2="66" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,2"/><path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.4"/>';
'''

[miniCharts.polyopt]
# A double-well polynomial with its global minimum and a lower bound
svg = '''
var d = '', first = true;
for (var x = 8; x <= 46; x++) { var u = (x - 27) / 9; var y = 30 + 10 * (Math.pow(u, 4) - 2 * Math.pow(u, 2) + 0.3 * u + 2); if (y < 26) { y = 26; } d += (first ? 'M' : ' L') + x + ',' + (96 - y).toFixed(1); first = false; }
return '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="6" y1="61" x2="48" y2="61" stroke="currentColor" stroke-width="1" stroke-dasharray="3,2"/>';
'''

[[codeBranches]]
model = "sos"
code = '''
using SumOfSquares, DynamicPolynomials, {{solver}}, LinearAlgebra

n = {{n}}
@polyvar x[1:n]
p = {{poly}}

model = SOSModel({{solver}}.Optimizer)
set_silent(model)
c = @constraint(model, p >= 0)  # p is a sum of squares
optimize!(model)
certified = termination_status(model) == MOI.OPTIMAL  # true = p >= 0 for every x

# lower bound on min p over a set (used by the degree and sampling actions)
function lower_bound(d; S = FullSpace())
    m = SOSModel({{solver}}.Optimizer)
    set_silent(m)
    @variable(m, t)
    @objective(m, Max, t)
    @constraint(m, p >= t, domain = S, maxdegree = d)
    optimize!(m)
    objective_value(m)
end
box = 2.0  # half-width of the region sampled by the sampling action
(status = termination_status(model), certified = certified)
'''

[[codeBranches]]
model = "polyopt"
code = '''
using SumOfSquares, DynamicPolynomials, {{solver}}, LinearAlgebra

n = {{n}}
@polyvar x[1:n]
p = {{poly}}
S = @set {{domain}}

function lower_bound(d; S = S)
    m = SOSModel({{solver}}.Optimizer)
    set_silent(m)
    @variable(m, t)
    @objective(m, Max, t)
    cref = @constraint(m, p >= t, domain = S, maxdegree = d)  # p - t = sigma_0 + sum sigma_i g_i
    optimize!(m)
    m, cref
end

model, c = lower_bound({{degree}})
box = 2.0  # half-width of the region sampled by the sampling action
(status = termination_status(model), lower_bound = objective_value(model))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "gram-heatmap"
label = "Gram Matrix Heatmap"
desc = "The PSD Gram matrix Q of the certificate p = m' Q m (rows and columns are the monomials of m)"
code = '''
using Plots

g = gram_matrix(c)
Q = Matrix(g.Q)
labels = string.(g.basis.monomials)
heatmap(labels, labels, Q, aspect_ratio=:equal, yflip=true, color=:RdBu, clims=(-1, 1) .* maximum(abs, Q), xrotation=45)
'''

[[actionGroups.actions]]
id = "polynomial-surface"
label = "Polynomial Contours"
desc = "p over the (x1, x2) plane, the other variables held at 0"
code = '''
using Plots

xs = range(-box, box, length=80)
f(a, b) = p(x => [a; b; zeros(n - 2)])
contour(xs, xs, f, fill=true, xlabel="x1", ylabel="x2", color=:viridis)
{{?model=polyopt}} contour!(xs, xs, (a, b) -> f(a, b) - objective_value(model), levels=[0], color=:white, linewidth=2, label="p = lower bound")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "feasibility"
label = "Feasibility Check"
desc = "Termination, primal and dual status of the SOS semidefinite programme. For certification, INFEASIBLE means no SOS certificate exists at this degree (p may still be non-negative)"
code = '''
(termination = termination_status(model), primal = primal_status(model), dual = dual_status(model))
'''

[[actionGroups.actions]]
id = "gram-psd"
label = "Gram PSD Check"
desc = "Eigenvalues of the Gram matrix (all >= 0 for a valid certificate) and the residual of p - m' Q m"
code = '''
g = gram_matrix(c)
ev = eigvals(Symmetric(Matrix(g.Q)))
m = g.basis.monomials
{{?model=sos}} residual = p - dot(m, Matrix(g.Q) * m)
{{?model=sos}} (min_eigenvalue = minimum(ev), psd = minimum(ev) >= -1e-6, max_residual_coefficient = maximum(abs, coefficients(residual); init=0.0))
{{?model=polyopt}} (min_eigenvalue = minimum(ev), psd = minimum(ev) >= -1e-6)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "tighten"
label = "Tighten Relaxation"
desc = "Lower bound on min p at increasing relaxation degrees (the Lasserre hierarchy)"
code = '''
using Plots

degs = maxdegree(p):2:maxdegree(p) + 6
{{?model=sos}} lbs = [lower_bound(d; S = @set(sum(x .^ 2) <= box^2)) for d in degs]
{{?model=polyopt}} lbs = [objective_value(first(lower_bound(d))) for d in degs]
plot(degs, lbs, marker=:circle, xlabel="relaxation degree", ylabel="lower bound on min p", legend=false)
'''

[[actionGroups.actions]]
id = "minimiser"
label = "Extract Minimiser"
desc = "Global minimiser(s) read from the moment matrix (the dual of the SOS constraint); nothing when the relaxation is not tight"
code = '''
{{?model=sos}} m_, c_ = let m = SOSModel({{solver}}.Optimizer); set_silent(m); @variable(m, t); @objective(m, Max, t); cr = @constraint(m, p >= t); optimize!(m); (m, cr) end
{{?model=polyopt}} m_, c_ = model, c
atoms = atomic_measure(moment_matrix(c_), 1e-4)  # nothing if no atoms found
(lower_bound = objective_value(m_), minimisers = atoms === nothing ? nothing : [a.center for a in atoms.atoms],
 p_at_minimisers = atoms === nothing ? nothing : [p(x => a.center) for a in atoms.atoms])
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "solver-compare"
label = "Solver Comparison"
desc = "Clarabel, COSMO and SCS on the same SOS problem: status, objective and time"
code = '''
using Clarabel, COSMO, SCS

map(["Clarabel" => Clarabel.Optimizer, "COSMO" => COSMO.Optimizer, "SCS" => SCS.Optimizer]) do (name, opt)
    set_optimizer(model, opt)
    set_silent(model)
    t = @elapsed optimize!(model)
    (solver = name, status = termination_status(model), objective = objective_value(model), seconds = t)
end
'''

[[actionGroups.actions]]
id = "sos-vs-sample"
label = "SOS vs Sampling"
desc = "The certified SOS lower bound against the smallest value of p at 100,000 random points (an upper bound on the minimum, never a certificate)"
code = '''
{{?model=sos}} sos_lb = lower_bound(maxdegree(p))
{{?model=polyopt}} sos_lb = objective_value(model)
pts = [box .* (2 .* rand(n) .- 1) for _ in 1:100_000]
{{?model=polyopt}} filter!(q -> all(g(x => q) >= 0 for g in inequalities(S)), pts)  # keep points in the domain
sampled = minimum(q -> p(x => q), pts)
(sos_lower_bound = sos_lb, sampled_minimum = sampled, gap = sampled - sos_lb)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "gram-decomp"
label = "Gram Decomposition"
desc = "The explicit squares: p = sum_i s_i(x)^2, from the eigendecomposition of the Gram matrix"
code = '''
g = gram_matrix(c)
F = eigen(Symmetric(Matrix(g.Q)))
m = g.basis.monomials
keep = findall(>(1e-8), F.values)
squares = [sqrt(F.values[i]) * dot(F.vectors[:, i], m) for i in keep]  # p = sum(s .^ 2) (plus t for the bound)
(number_of_squares = length(squares), squares = squares)
'''

[[actionGroups.actions]]
id = "dual-certificate"
label = "Dual Certificate"
desc = "The moment matrix (the dual of the SOS constraint) and, on a domain, the SOS multipliers of each constraint"
code = '''
mm = moment_matrix(c)
{{?model=sos}} (moment_matrix = mm,)
{{?model=polyopt}} (moment_matrix = mm, multipliers = lagrangian_multipliers(c))  # sigma_i with p - t = sigma_0 + sum sigma_i g_i
'''
