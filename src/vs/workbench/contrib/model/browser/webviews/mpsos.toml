[[models]]
id = "sos"
label = "Sum of Squares Certification"

[[models]]
id = "polyopt"
label = "Polynomial Optimisation"

[[bullets]]
text = "Sum of Squares (SOS) Certification"
detail = "decomposes a polynomial as a sum of squares via a Gram matrix semidefinite programme, certifying non-negativity."

[[bullets]]
text = "Polynomial Optimisation"
detail = "applies the Lasserre moment-SOS hierarchy to compute converging semidefinite programme lower bounds on a polynomial's global minimum."

[[bullets]]
text = "SumOfSquares.jl"
detail = "handles the SOS reformulation automatically; the solvers (Clarabel, COSMO, SCS) solve the resulting semidefinite programme."

[[decisionRows]]
task = "Sum of Squares Certification"
context = "Proving a polynomial is non-negative everywhere: Lyapunov functions, safety and stability certificates"
purpose = "Find a PSD Gram matrix Q with p = m' Q m for a vector of monomials m"

[[decisionRows]]
task = "Polynomial Optimisation"
context = "Global minimum of a non-convex polynomial, optionally on a semialgebraic set"
purpose = "Maximise t such that p - t is SOS on the set (Putinar); converging lower bounds as the degree grows"

[[inputs]]
id = "n"
label = "n"
tooltip = "Number of polynomial variables x[1], ..., x[n]."
default = "2"

[[inputs]]
id = "poly"
label = "Polynomial p(x)"
tooltip = "Polynomial expression in the vector x, for example sum(x .^ 4) - sum(x .^ 2) + 1 or x[1]^4 + x[1] * x[2] - x[2]^2. Its degree must be even for a certificate to exist."
default = "sum(x .^ 4) - sum(x .^ 2) + 1"

[[inputs]]
id = "domain"
label = "Domain"
tooltip = "Semialgebraic set to minimise over, in the @set syntax: for example sum(x .^ 2) <= 4 or x[1] >= 0 && x[2] >= 0. Use sum(x .^ 2) <= 1e6 for (essentially) all of R^n."
default = "sum(x .^ 2) <= 4"
models = ["polyopt"]

[[inputs]]
id = "degree"
label = "Relaxation Degree"
tooltip = "Maximum degree of the SOS multipliers (the level of the Lasserre hierarchy). At least the degree of p; higher values give tighter bounds at greater cost."
default = "4"
models = ["polyopt"]

[[inputs]]
id = "solver"
label = "Solver"
tooltip = "SOS problems reduce to semidefinite programmes. Clarabel: interior point, the default and most accurate. COSMO: ADMM, lower memory for large or sparse problems. SCS: first-order, very large problems when a rough bound suffices."
kind = "select"
default = "Clarabel"
newRow = true

[[inputs.options]]
value = "Clarabel"
label = "Clarabel"

[[inputs.options]]
value = "COSMO"
label = "COSMO"

[[inputs.options]]
value = "SCS"
label = "SCS"

