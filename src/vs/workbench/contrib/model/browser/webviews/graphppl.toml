[[codeBranches]]
model = "bp"
code = '''
using RxInfer  # reactive Bayesian inference via factor graph message passing

@model function {{bp-model}}({{bp-data}})  # GraphPPL @model macro — distributions use keyword arguments unlike Turing.jl
    mu    ~ Normal(mean = 0.0, variance = 1.0)
    sigma ~ Gamma(shape = 1.0, rate = 1.0)  # despite the name, sigma is the variance of y below, not its standard deviation
    {{bp-data}} .~ Normal(mean = mu, variance = sigma)  # .~ broadcasts the scalar distribution element-wise over the vector
end

result = infer(  # sum-product belief propagation: exact only when every factor is conjugate; an unknown mean and variance together are not, so check against the VMP toggle
    model      = {{bp-model}}({{bp-data}} = {{bp-data}}_data),
    returnvars = (mu = KeepLast(), sigma = KeepLast()),
    iterations = {{bp-iter}}
)

println(result.posteriors[:mu])  # posterior marginal of mu after BP message passing
'''

[[codeBranches]]
model = "vmp"
code = '''
using RxInfer  # reactive Bayesian inference via factor graph message passing

@model function {{vmp-model}}({{vmp-data}})  # GraphPPL @model macro — distributions use keyword arguments unlike Turing.jl
    mu    ~ Normal(mean = 0.0, variance = 1.0)
    sigma ~ Gamma(shape = 1.0, rate = 1.0)  # despite the name, sigma is the variance of y below, not its standard deviation
    {{vmp-data}} .~ Normal(mean = mu, variance = sigma)  # .~ broadcasts the scalar distribution element-wise over the vector
end

result = infer(  # Variational Message Passing with mean-field factorization
    model       = {{vmp-model}}({{vmp-data}} = {{vmp-data}}_data),
    constraints = MeanField(),
    free_energy = true,  # track ELBO convergence across iterations
    returnvars  = (mu = KeepLast(), sigma = KeepLast()),
    iterations  = {{vmp-iter}}
)

println(result.free_energy)  # free energy (minus the ELBO) should decrease and level off as VMP converges
'''

[[codeBranches]]
model = "ep"
code = '''
using RxInfer  # reactive Bayesian inference via factor graph message passing

@model function {{ep-model}}({{ep-data}})  # GraphPPL @model macro — distributions use keyword arguments unlike Turing.jl
    mu    ~ Normal(mean = 0.0, variance = 1.0)
    sigma ~ Gamma(shape = 1.0, rate = 1.0)  # despite the name, sigma is the variance of y below, not its standard deviation
    {{ep-data}} .~ Normal(mean = mu, variance = sigma)  # .~ broadcasts the scalar distribution element-wise over the vector
end

@constraints function ep_constraints()  # declare EP approximation for the likelihood factor
    q(mu, {{ep-data}}) :: ExpectationPropagation()
end

result = infer(  # EP projects non-Gaussian messages onto the exponential family
    model       = {{ep-model}}({{ep-data}} = {{ep-data}}_data),
    constraints = ep_constraints(),
    returnvars  = (mu = KeepLast(), sigma = KeepLast()),
    iterations  = {{ep-iter}}
)

println(result.posteriors[:mu])  # posterior marginal of mu after EP message passing
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "posterior-mean"
label = "Posterior Mean"
desc = "Plot the posterior mean of each parameter across iterations"
code = '''
using Plots  # plotting library

plot(mean.(result.posteriors[:mu]), label="mu")  # posterior mean of mu per iteration
plot!(mean.(result.posteriors[:sigma]), label="sigma")  # posterior mean of sigma per iteration
'''

[[actionGroups.actions]]
id = "posterior-dist"
label = "Posterior Distribution"
desc = "Plot the final posterior marginal distribution of each parameter"
code = '''
using Plots, Distributions  # plotting and distributions

mu_post    = result.posteriors[:mu]  # final posterior marginal of mu
sigma_post = result.posteriors[:sigma]  # final posterior marginal of sigma
plot(mu_post,    label="p(mu | y)")  # plot posterior of mu
plot(sigma_post, label="p(sigma | y)")  # plot posterior of sigma
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "free-energy"
label = "Free Energy"
desc = "Track variational free energy to assess VMP convergence"
code = '''
using Plots  # plotting library

result_fe = infer(model = model, constraints = MeanField(), free_energy = true, iterations = 50)  # run VMP with free energy tracking
plot(result_fe.free_energy, xlabel="iteration", ylabel="Free Energy", label="")  # free energy = minus the ELBO: it should decrease and level off, an upper bound on minus the log evidence
'''

[[actionGroups.actions]]
id = "convergence"
label = "Convergence Check"
desc = "Compare posterior means across iterations to check for convergence"
code = '''
using Plots  # plotting library

mu_means = mean.(result.posteriors[:mu])  # posterior mean of mu at each iteration
plot(mu_means, xlabel="iteration", ylabel="E[mu]", label="mu")  # should stabilize when converged
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "prior-pred"
label = "Prior Predictive"
desc = "Generate samples from the model prior to data conditioning"
code = '''
using RxInfer  # reactive Bayesian inference

prior_result = infer(model = my_model(), returnvars = (mu = KeepLast(), sigma = KeepLast()))  # run without data to get prior marginals
println(prior_result.posteriors[:mu])  # prior distribution of mu
'''

[[actionGroups.actions]]
id = "post-pred"
label = "Posterior Predictive"
desc = "Generate new observations from the posterior predictive distribution"
code = '''
using RxInfer, Random  # inference and RNG

mu_post    = result.posteriors[:mu]  # final posterior marginal of mu
sigma_post = result.posteriors[:sigma]  # final posterior marginal of sigma
mu_sample    = rand(mu_post)  # draw a sample from posterior of mu
sigma_sample = rand(sigma_post)  # draw a sample from posterior of sigma
y_pred = rand(Normal(mean = mu_sample, variance = sigma_sample), 100)  # generate 100 posterior predictive observations
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-algorithms"
label = "Compare Algorithms"
desc = "Run BP and VMP on the same model and compare posterior means"
code = '''
using RxInfer  # reactive Bayesian inference

res_bp  = infer(model = my_model(y = y_data), iterations = 10)  # Belief Propagation
res_vmp = infer(model = my_model(y = y_data), constraints = MeanField(), iterations = 50)  # Variational Message Passing

println("BP  mu: ", mean(res_bp.posteriors[:mu]))  # compare posterior mean of mu
println("VMP mu: ", mean(res_vmp.posteriors[:mu]))  # compare posterior mean of mu
'''

[[actionGroups.actions]]
id = "iter-sensitivity"
label = "Iteration Sensitivity"
desc = "Vary the number of message-passing iterations and compare posteriors"
code = '''
using RxInfer  # reactive Bayesian inference

for n_iter in [5, 10, 25, 50]  # sweep iteration count
    res = infer(model = my_model(y = y_data), iterations = n_iter)  # run with current iteration count
    println("iter=", n_iter, " -> mu mean=", mean(res.posteriors[:mu]))  # print posterior mean at each count
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "posterior-summary"
label = "Posterior Summary"
desc = "Print mean and variance of the final posterior marginals"
code = '''
mu_post    = result.posteriors[:mu]  # final posterior of mu
sigma_post = result.posteriors[:sigma]  # final posterior of sigma

println("mu    mean=", mean(mu_post),    " var=", var(mu_post))  # posterior summary for mu
println("sigma mean=", mean(sigma_post), " var=", var(sigma_post))  # posterior summary for sigma
'''

[[actionGroups.actions]]
id = "credible-interval"
label = "Credible Interval"
desc = "Compute 95% credible intervals from the posterior marginals"
code = '''
using Distributions  # distributions library

mu_post = result.posteriors[:mu]  # final posterior of mu
ci_lo, ci_hi = quantile(mu_post, [0.025, 0.975])  # 95% credible interval for mu
println("mu 95% CI: [", ci_lo, ", ", ci_hi, "]")  # print credible interval
'''
