github = "https://github.com/JuliaStats/GLM.jl"

[[packages]]
name = "CalibrationErrors.jl"
github = "https://github.com/devmotion/CalibrationErrors.jl"

[requires]
packages = ["GLM.jl", "CalibrationErrors.jl"]

