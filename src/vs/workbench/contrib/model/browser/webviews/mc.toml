[[models]]
id = "platt"
label = "Platt Scaling"

[[models]]
id = "isotonic"
label = "Isotonic"

[[models]]
id = "temperature"
label = "Temperature"

[[bullets]]
text = "Platt Scaling"
detail = "fit a logistic regression on raw classifier scores; parametric, fast, and suitable when the score distribution is roughly sigmoid-shaped (GLM.jl)"

[[bullets]]
text = "Isotonic Regression"
detail = "non-parametric monotone recalibration via the Pool Adjacent Violators algorithm; no distributional assumptions (no external package)"

[[bullets]]
text = "Temperature Scaling"
detail = "single-parameter logit rescaling for neural networks; minimises NLL over a held-out set without changing accuracy (Optim.jl)"

[[inputs]]
id = "scores"
label = "Raw Scores / Logits"
tooltip = "Vector of uncalibrated classifier scores or logits from the validation set. For Platt/Isotonic use probability scores; for Temperature use raw logits."
default = "scores_val"

[[inputs]]
id = "y"
label = "True Labels"
tooltip = "Binary ground-truth labels (0/1 or false/true) for the validation set corresponding to the scores vector."
default = "y_val"

[[codeBranches]]
model = "platt"
code = '''
using GLM

tbl = (score = {{scores}}, y = {{y}})  # validation scores and labels as a Tables.jl column table

platt = glm(@formula(y ~ score), tbl, Binomial(), LogitLink())  # logistic regression on raw scores

cal_probs = predict(platt, tbl)  # calibrated probabilities
'''

[[codeBranches]]
model = "isotonic"
code = '''
function pav(scores, labels)  # Pool Adjacent Violators: the least-squares non-decreasing fit of labels on scores
    idx = sortperm(scores)  # sort by score ascending
    means, sizes = Float64[], Int[]  # one entry per pooled block
    for yi in float(labels[idx])
        push!(means, yi); push!(sizes, 1)
        while length(means) > 1 && means[end-1] > means[end]  # violation: merge the last two blocks, repeat backwards
            w = sizes[end-1] + sizes[end]
            means[end-1] = (sizes[end-1] * means[end-1] + sizes[end] * means[end]) / w
            sizes[end-1] = w
            pop!(means); pop!(sizes)
        end
    end
    fitted = similar(means, length(scores))
    fitted[idx] = reduce(vcat, [fill(m, k) for (m, k) in zip(means, sizes)])  # back to the original order, aligned with labels
    fitted
end

cal_probs = pav({{scores}}, {{y}})  # calibrated probabilities
'''

[[codeBranches]]
model = "temperature"
code = '''
using Optim

logits = {{scores}}  # raw pre-sigmoid logits from the model

function nll(T)  # negative log-likelihood under temperature T
    p = 1 ./ (1 .+ exp.(-logits ./ T[1]))  # sigmoid with temperature
    return -sum({{y}} .* log.(p .+ 1e-12) .+ (1 .- {{y}}) .* log.(1 .- p .+ 1e-12))  # 
end

res   = optimize(nll, [1.0], LBFGS())  # optimise T on validation set
T_opt = Optim.minimizer(res)[1]  # optimal temperature

cal_probs = 1 ./ (1 .+ exp.(-logits ./ T_opt))  # calibrated probabilities
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "reliability"
label = "Reliability Diagram"
desc = "Binned calibration curve comparing mean predicted probability to observed fraction of positives"
code = '''
using Plots, Statistics

n_bins = 10  # number of equal-width bins
bins   = range(0, 1, length=n_bins+1)  # bin edges

mean_pred = zeros(n_bins)  # mean predicted probability per bin
frac_pos  = zeros(n_bins)  # observed positive fraction per bin

for i in 1:n_bins
    mask         = (bins[i] .<= cal_probs .< bins[i+1]) .| ((i == n_bins) .& (cal_probs .== 1))  # the last bin includes 1
    mean_pred[i] = any(mask) ? mean(cal_probs[mask]) : NaN  # empty bins are left out, not drawn at 0
    frac_pos[i]  = any(mask) ? mean({{y}}[mask]) : NaN
end

plot([0,1], [0,1], lc=:grey, ls=:dash, label="Perfect calibration")  # diagonal reference
scatter!(mean_pred, frac_pos,  # 
    xlabel="Mean predicted probability", ylabel="Fraction of positives", legend=:topleft)  # 
'''

[[actionGroups.actions]]
id = "ece"
label = "Expected Calibration Error (ECE)"
desc = "Weighted mean absolute deviation between predicted probabilities and observed frequencies across bins"
code = '''
using CalibrationErrors

ece_raw = ECE(UniformBinning(10))  # ECE estimator with 10 bins
ece_cal = ECE(UniformBinning(10))  # 

{{?model=temperature}}raw = 1 ./ (1 .+ exp.(-{{scores}}))  # uncalibrated probabilities: sigmoid of the logits (T = 1)
{{?model!=temperature}}raw = {{scores}}  # uncalibrated probability scores
calibrationerror(ece_raw, raw, {{y}})  # ECE of raw scores
calibrationerror(ece_cal, cal_probs, {{y}})  # ECE after calibration
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "brier"
label = "Brier Score Comparison"
desc = "Mean squared error of probability predictions; lower is better — compare raw vs calibrated scores"
code = '''
using Statistics

{{?model=temperature}}raw = 1 ./ (1 .+ exp.(-{{scores}}))  # uncalibrated probabilities: sigmoid of the logits (T = 1)
{{?model!=temperature}}raw = {{scores}}  # uncalibrated probability scores
brier_raw = mean((raw .- {{y}}) .^ 2)  # Brier score of uncalibrated model
brier_cal = mean((cal_probs .- {{y}}) .^ 2)  # Brier score after calibration

println("Brier (raw):  ", round(brier_raw, digits=4))  # 
println("Brier (cal):  ", round(brier_cal, digits=4))  # 
println("Improvement:  ", round(brier_raw - brier_cal, digits=4))  # positive = calibration helped
'''
