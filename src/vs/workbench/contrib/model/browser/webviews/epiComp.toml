[[bullets]]
text = "Compartmental models divide a population into discrete health states"
detail = "susceptible (S), exposed (E), infectious (I), recovered (R), or dead (D) — and describe transmission dynamics via ordinary differential equations. The choice of variant controls which transitions are modelled."

[[bullets]]
text = "Best suited to large, well-mixed populations where average-rate assumptions hold: national-level influenza forecasting, endemic disease modelling, and policy evaluation."
detail = ""

[[decisionRows]]
task = "SIR"
context = "S → I → R"
purpose = "Outbreaks with permanent immunity after recovery"

[[decisionRows]]
task = "SIS"
context = "S → I → S"
purpose = "Endemic diseases where immunity wanes immediately"

[[decisionRows]]
task = "SEIR"
context = "S → E → I → R"
purpose = "Diseases with a latent incubation period before infectiousness"

[[decisionRows]]
task = "SIRS"
context = "S → I → R → S"
purpose = "Waning immunity leading to recurrent epidemic waves"

[[decisionRows]]
task = "SEIRD"
context = "S → E → I → R/D"
purpose = "Tracking disease-attributable mortality alongside recovery"

[[inputs]]
id = "N"
label = "N (population)"
tooltip = "Total population size. Compartmental models are deterministic ODE systems, so N scales the initial conditions but does not affect the dynamics qualitatively."
default = "10000"

[[inputs]]
id = "T"
label = "T (days)"
tooltip = "Simulation duration in days. Choose long enough to see the epidemic peak and resolution, or the endemic steady state for SIS/SIRS."
default = "160"

[[inputs]]
id = "beta"
label = "beta (transmission)"
tooltip = "Transmission rate: expected contacts per day times probability of transmission per contact. The basic reproduction number R0 = beta / gamma for SIR/SIS."
default = "0.3"

[[inputs]]
id = "gamma"
label = "gamma (recovery)"
tooltip = "Recovery rate: inverse of the mean infectious period in days. For example, gamma = 0.1 gives a 10-day mean infectious period."
default = "0.1"

[[codeBranches]]
model = "sir"
code = '''
using DifferentialEquations, Plots

beta  = {{beta}}  # transmission rate
gamma = {{gamma}}  # recovery rate
N     = {{N}}  # total population

function sir!(du, u, p, t)
    S, I, R = u; b, g = p
    du[1] = -b * S * I / N  # dS/dt
    du[2] =  b * S * I / N - g * I  # dI/dt
    du[3] =  g * I  # dR/dt
end

u0  = [{{N}} - 1.0, 1.0, 0.0]  # S0, I0, R0
tspan = (0.0, {{T}})  # time span in days
prob = ODEProblem(sir!, u0, tspan, (beta, gamma))
sol  = solve(prob, Tsit5())

R0 = beta / gamma  # basic reproduction number
println("R0 = ", round(R0; digits=2), "  Peak I = ", round(maximum(sol[2,:]); digits=0))  # epidemic summary
'''

[[codeBranches]]
model = "sis"
code = '''
using DifferentialEquations, Plots

beta  = {{beta}}  # transmission rate
gamma = {{gamma}}  # recovery rate
N     = {{N}}  # total population

function sis!(du, u, p, t)
    S, I = u; b, g = p
    du[1] = -b * S * I / N + g * I  # dS/dt: infection out, recovery in
    du[2] =  b * S * I / N - g * I  # dI/dt
end

u0    = [{{N}} - 1.0, 1.0]  # S0, I0
prob  = ODEProblem(sis!, u0, (0.0, {{T}}), (beta, gamma))
sol   = solve(prob, Tsit5())

R0    = beta / gamma  # basic reproduction number
I_end = R0 > 1 ? (1 - 1/R0) * {{N}} : 0.0  # endemic equilibrium
println("R0 = ", round(R0;digits=2), "  Endemic I* = ", round(I_end;digits=0))  # endemic summary
'''

[[codeBranches]]
model = "seir"
code = '''
using DifferentialEquations, Plots

beta   = {{beta}}  # transmission rate
sigma  = 1.0/5.0  # progression rate (5-day latent period)
gamma  = {{gamma}}  # recovery rate
N      = {{N}}  # total population

function seir!(du, u, p, t)
    S, E, I, R = u; b, s, g = p
    du[1] = -b * S * I / N  # dS/dt
    du[2] =  b * S * I / N - s * E  # dE/dt: exposed become infectious
    du[3] =  s * E - g * I  # dI/dt
    du[4] =  g * I  # dR/dt
end

u0   = [{{N}}-1.0, 0.0, 1.0, 0.0]  # S0, E0, I0, R0
prob = ODEProblem(seir!, u0, (0.0, {{T}}), (beta, sigma, gamma))
sol  = solve(prob, Tsit5())

R0 = beta / gamma  # basic reproduction number
println("R0 = ", round(R0;digits=2), "  Peak I = ", round(maximum(sol[3,:]);digits=0))  # SEIR summary
'''

[[codeBranches]]
model = "sirs"
code = '''
using DifferentialEquations, Plots

beta  = {{beta}}  # transmission rate
gamma = {{gamma}}  # recovery rate
xi    = 1.0/180.0  # waning immunity rate (180-day immunity)
N     = {{N}}  # total population

function sirs!(du, u, p, t)
    S, I, R = u; b, g, x = p
    du[1] = -b * S * I / N + x * R  # dS/dt: waning immunity returns R to S
    du[2] =  b * S * I / N - g * I  # dI/dt
    du[3] =  g * I - x * R  # dR/dt
end

u0   = [{{N}}-1.0, 1.0, 0.0]  # S0, I0, R0
prob = ODEProblem(sirs!, u0, (0.0, {{T}}), (beta, gamma, xi))
sol  = solve(prob, Tsit5())

R0 = beta / gamma  # basic reproduction number
println("R0 = ", round(R0;digits=2), "  Recurrent waves expected: ", R0 > 1)  # SIRS summary
'''

[[codeBranches]]
model = "seird"
code = '''
using DifferentialEquations, Plots

beta   = {{beta}}  # transmission rate
sigma  = 1.0/5.0  # progression rate from E to I
gamma  = {{gamma}}  # recovery rate
mu     = 0.01  # disease-induced mortality rate
N      = {{N}}  # total population

function seird!(du, u, p, t)
    S, E, I, R, D = u; b, s, g, m = p
    du[1] = -b * S * I / N  # dS/dt
    du[2] =  b * S * I / N - s * E  # dE/dt
    du[3] =  s * E - g * I - m * I  # dI/dt: recovery and death
    du[4] =  g * I  # dR/dt
    du[5] =  m * I  # dD/dt: disease-attributable deaths
end

u0   = [{{N}}-1.0, 0.0, 1.0, 0.0, 0.0]  # S0, E0, I0, R0, D0
prob = ODEProblem(seird!, u0, (0.0, {{T}}), (beta, sigma, gamma, mu))
sol  = solve(prob, Tsit5())

println("Peak I = ", round(maximum(sol[3,:]);digits=0), "  Total deaths = ", round(sol[5,end];digits=0))  # SEIRD summary
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "epidemic-curve"
label = "Epidemic Curve"
desc = "Plot all compartment trajectories over time for the selected model"
code = '''
using DifferentialEquations, GLMakie

function sir!(du,u,p,t); S,I,R=u; b,g=p; du[1]=-b*S*I/{{N}}; du[2]=b*S*I/{{N}}-g*I; du[3]=g*I; end
sol = solve(ODEProblem(sir!,[{{N}}-1.0,1.0,0.0],(0.0,{{T}}),({{beta}},{{gamma}})),Tsit5())

fig,ax=Figure(),Axis(fig[1,1],xlabel="Days",ylabel="People",title="SIR Epidemic Curve")
lines!(ax,sol.t,sol[1,:],label="S",color=:blue)
lines!(ax,sol.t,sol[2,:],label="I",color=:red)
lines!(ax,sol.t,sol[3,:],label="R",color=:green)
axislegend(ax); display(fig)
'''

[[actionGroups.actions]]
id = "phase-portrait"
label = "Phase Portrait"
desc = "Plot the S-I phase plane trajectory to visualise the epidemic path from initial seed to final state"
code = '''
using DifferentialEquations, GLMakie

function sir!(du,u,p,t); S,I,R=u; b,g=p; du[1]=-b*S*I/{{N}}; du[2]=b*S*I/{{N}}-g*I; du[3]=g*I; end
sol = solve(ODEProblem(sir!,[{{N}}-1.0,1.0,0.0],(0.0,{{T}}),({{beta}},{{gamma}})),Tsit5())

fig,ax=Figure(),Axis(fig[1,1],xlabel="S",ylabel="I",title="SIR Phase Portrait")
lines!(ax, sol[1,:], sol[2,:], color=:red)
scatter!(ax, [sol[1,1]], [sol[2,1]], color=:blue, markersize=10)  # initial state
display(fig)
'''

