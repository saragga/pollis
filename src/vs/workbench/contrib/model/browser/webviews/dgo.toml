[[bullets]]
text = "DIRECT"
detail = "recursive hyperrectangle subdivision; provably converges for Lipschitz objectives; no gradient needed"

[[bullets]]
text = "DIRECT-L"
detail = "locally biased variant; gives more weight to local search within promising regions"

[[bullets]]
text = "QuadDirect"
detail = "quadratic interpolation within subdivisions (QuadDIRECT.jl); fewer function evaluations than standard DIRECT"

[[decisionRows]]
task = "DIRECT"
context = "Low-dimensional black-box problems (up to about 10 variables) with box bounds"
purpose = "Divide the box into hyperrectangles and split every one that could hold the minimum for some Lipschitz constant; no gradients or tuning"

[[decisionRows]]
task = "DIRECT-L"
context = "The same problems when a few local minima dominate and evaluations are expensive"
purpose = "Locally biased DIRECT: splits fewer boxes per round, converging faster at some risk to global coverage"

[[decisionRows]]
task = "QuadDirect"
context = "Smooth objectives where local curvature can be exploited"
purpose = "Coordinate-wise splitting with quadratic models of the objective and local refinement of promising boxes"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, using x[1], x[2], ... Default: the six-hump camel function (two global minima near (0.09, -0.71) and (-0.09, 0.71), f = -1.0316)."
default = "(4 - 2.1 * x[1]^2 + x[1]^4 / 3) * x[1]^2 + x[1] * x[2] + (-4 + 4 * x[2]^2) * x[2]^2"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds, one per variable; its length sets the dimension."
default = "[-3.0, -2.0]"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds, one per variable."
default = "[3.0, 2.0]"

[[inputs]]
id = "maxeval"
label = "Max Evaluations"
tooltip = "Budget of objective evaluations. Deterministic global methods stop when it is used up, so a MAXEVAL_REACHED return code is normal."
default = "1000"

