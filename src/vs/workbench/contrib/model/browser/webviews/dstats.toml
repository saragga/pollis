label = "Summary"

[[models]]
id = "freq"
label = "Frequency"

[[models]]
id = "corr"
label = "Correlation"

[[bullets]]
text = "Summary"
detail = "central tendency, spread, and shape of a numeric variable: mean, median, standard deviation, quantiles, skewness, and kurtosis via StatsBase.jl"

[[bullets]]
text = "Frequency"
detail = "count and proportion tables for categorical or discrete data; cross-tabulation for two variables via FreqTables.jl"

[[bullets]]
text = "Correlation"
detail = "pairwise Pearson or Spearman correlation and covariance matrix for a numeric data matrix via Statistics.jl"

[[decisionRows]]
task = "Summary"
context = "Numeric vector"
purpose = "Describe the centre, spread and shape of one variable before modelling it"

[[decisionRows]]
task = "Frequency"
context = "Categorical or discrete vector"
purpose = "Count how often each level occurs and compare level proportions"

[[decisionRows]]
task = "Correlation (Pearson)"
context = "Numeric matrix, roughly linear relations"
purpose = "Measure linear association between every pair of variables"

[[decisionRows]]
task = "Correlation (Spearman)"
context = "Numeric or ordinal matrix, outliers or monotonic curves"
purpose = "Measure rank (monotonic) association that is robust to outliers"

[[inputs]]
id = "data"
label = "Data"
tooltip = "Variable name of a numeric vector (Summary/Frequency) or matrix with observations in rows and variables in columns (Correlation)"
default = "x"

[[inputs]]
id = "method"
label = "Method"
tooltip = "Pearson measures linear association; Spearman measures monotonic association and is robust to outliers"
kind = "select"
models = ["corr"]

[[inputs.options]]
value = "pearson"
label = "Pearson"

[[inputs.options]]
value = "spearman"
label = "Spearman"

[miniCharts]
