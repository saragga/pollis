var s = '<line x1="27" y1="14" x2="27" y2="26" stroke="currentColor" stroke-width="1"/>';
s += '<line x1="20" y1="14" x2="34" y2="14" stroke="currentColor" stroke-width="1"/>';
s += '<rect x="15" y="26" width="24" height="30" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.2"/>';
s += '<line x1="15" y1="38" x2="39" y2="38" stroke="currentColor" stroke-width="2"/>';
