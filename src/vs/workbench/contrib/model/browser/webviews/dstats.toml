[miniCharts.freq]
# Frequency bars
svg = '''
var s = '<line x1="6" y1="74" x2="48" y2="74" stroke="currentColor" stroke-width="1"/>';
var h = [30, 18, 44, 26, 14];
for (var i = 0; i < h.length; i++) {
	s += '<rect x="' + (8 + i * 8) + '" y="' + (74 - h[i]) + '" width="6" height="' + h[i] + '" fill="currentColor" opacity="0.45"/>';
}
