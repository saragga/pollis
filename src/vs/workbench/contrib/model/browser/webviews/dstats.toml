[miniCharts.corr]
# 3 x 3 correlation matrix
svg = '''
var v = [[1, 0.8, -0.3], [0.8, 1, 0.5], [-0.3, 0.5, 1]];
var s = '';
for (var r = 0; r < 3; r++) {
	for (var c = 0; c < 3; c++) {
		s += '<rect x="' + (6 + c * 14) + '" y="' + (22 + r * 14) + '" width="13" height="13" fill="currentColor" opacity="' + (Math.abs(v[r][c]) * 0.6).toFixed(2) + '"/>';
	}
}
return s;
'''

[[codeBranches]]
model = "summ"
code = '''
using StatsBase, Statistics

s = summarystats({{data}})  # min, Q1, median, mean, Q3, max
println(s)  # print summary table

println("Mean:     ", mean({{data}}))  # arithmetic mean
println("Std:      ", std({{data}}))  # sample standard deviation
println("Median:   ", median({{data}}))  # 50th percentile
println("Q1 / Q3:  ", quantile({{data}}, [0.25, 0.75]))  # interquartile range endpoints
println("Skewness: ", skewness({{data}}))  # third standardised moment
println("Kurtosis: ", kurtosis({{data}}))  # excess kurtosis (0 for normal)
println("Missing:  ", count(ismissing, {{data}}))  # number of missing values
'''

[[codeBranches]]
model = "freq"
code = '''
using FreqTables, StatsBase

ft = freqtable({{data}})  # frequency table (counts per level)
println(ft)  # display counts

pt = prop(ft)  # proportions (sums to 1)
println(pt)  # display proportions

cm = countmap({{data}})  # Dict mapping each level to its count
println(cm)  # display count dictionary
'''

[[codeBranches]]
model = "corr"
code = '''
using Statistics, StatsBase

{{?method=pearson}}C = cor({{data}})  # Pearson correlation matrix (p × p)
{{?method=spearman}}C = corspearman({{data}})  # Spearman rank correlation matrix (p × p)
V = cov({{data}})  # sample covariance matrix

println("Correlation matrix:\n", C)  # print correlation matrix
println("Covariance matrix:\n", V)  # print covariance matrix
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "boxplot"
label = "Box Plot"
desc = "Five-number summary as a box-and-whisker plot"
code = '''
using StatsPlots

boxplot({{data}}, label=false, ylabel="Value")  # box spans Q1-Q3; line is median; whiskers at 1.5 IQR
'''

[[actionGroups.actions]]
id = "violin"
label = "Violin Plot"
desc = "Kernel density mirrored around the axis"
code = '''
using StatsPlots

violin({{data}}, label=false, ylabel="Value")  # violin shows full density shape
boxplot!({{data}}, label=false, fillalpha=0.3)  # overlay box plot for quantile reference
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "outliers-iqr"
label = "Outlier Check"
desc = "Flag values outside 1.5 IQR from Q1/Q3"
code = '''
using StatsBase

q1, q3 = quantile({{data}}, [0.25, 0.75])  # first and third quartiles
iqr    = q3 - q1  # interquartile range
lo, hi = q1 - 1.5 * iqr, q3 + 1.5 * iqr  # Tukey fence bounds
outliers = {{data}}[{{data}} .< lo .|| {{data}} .> hi]  # values outside fences
println("Outliers: ", outliers)  # print flagged values
'''

[[actionGroups.actions]]
id = "missing-values"
label = "Missing Values"
desc = "Count and proportion of missing entries"
code = '''
n_miss = count(ismissing, {{data}})  # total missing count
p_miss = n_miss / length({{data}})  # fraction missing
println("Missing: ", n_miss, " (", round(100p_miss; digits=1), "%)")  # print summary
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "zscore"
label = "Z-Score Standardise"
desc = "Subtract mean and divide by standard deviation"
code = '''
using StatsBase

z = zscore({{data}})  # zero mean, unit variance
println("Mean: ", mean(z), "  Std: ", std(z))  # verify standardisation
'''

[[actionGroups.actions]]
id = "minmax"
label = "Min-Max Scale"
desc = "Rescale to [0, 1] interval"
code = '''
xmin, xmax = minimum({{data}}), maximum({{data}})  # data range
x_scaled   = ({{data}} .- xmin) ./ (xmax - xmin)  # rescale to [0, 1]
println("Range: [", minimum(x_scaled), ", ", maximum(x_scaled), "]")  # verify bounds
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "two-groups"
label = "Two Groups"
desc = "Side-by-side summary for two subsets"
code = '''
using StatsBase

g1, g2 = {{data}}[mask], {{data}}[.!mask]  # split by Boolean mask
println("Group 1: ", summarystats(g1))  # summary for group 1
println("Group 2: ", summarystats(g2))  # summary for group 2
'''

[[actionGroups.actions]]
id = "rolling-stats"
label = "Rolling Statistics"
desc = "Sliding-window mean and std over a time series"
code = '''
using StatsBase

w       = 20  # window size
n       = length({{data}})  # series length
rmean   = [mean({{data}}[i:i+w-1]) for i in 1:n-w+1]  # rolling mean
rstd    = [std({{data}}[i:i+w-1])  for i in 1:n-w+1]  # rolling standard deviation
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "skew-kurt"
label = "Shape Interpretation"
desc = "Rule-of-thumb interpretation of skewness and kurtosis"
code = '''
using StatsBase

sk = skewness({{data}})  # positive = right-tailed; negative = left-tailed
ku = kurtosis({{data}})  # excess kurtosis: >0 heavy-tailed; <0 light-tailed

println("Skewness: ", round(sk; digits=3))  # print with interpretation hint
println("Kurtosis: ", round(ku; digits=3))  # print with interpretation hint
println(abs(sk) < 0.5 ? "Approx. symmetric" : sk > 0 ? "Right-skewed" : "Left-skewed")  # skewness rule of thumb
'''

[[actionGroups.actions]]
id = "percentile-report"
label = "Percentile Report"
desc = "Full percentile profile at common quantile levels"
code = '''
using StatsBase

pcts = [0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99]  # percentile levels
vals = quantile({{data}}, pcts)  # values at each percentile
for (p, v) in zip(pcts, vals)
    println(lpad(string(round(Int, 100p)), 3), "th pct: ", round(v; digits=4))
end
'''
