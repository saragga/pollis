[[models]]
id = "sophia"
label = "SOPHIA"

[[bullets]]
text = "SOPHIA"
detail = "scalable second-order method; Hessian diagonal estimate with clip-by-value update rule"

[[decisionRows]]
task = "SOPHIA"
context = "Loss surfaces whose curvature differs strongly across parameters (heterogeneous, badly scaled), including large-model training"
purpose = "Divide the momentum by a cheap diagonal-Hessian estimate and clip each coordinate so no step exceeds lr * rho; clipping also guards negative curvature"

[[inputs]]
id = "f"
label = "Objective f(x)"
tooltip = "Julia expression for the scalar loss to minimise; it must be twice differentiable. Use x[1], x[2], ... for the components."
default = "(x[1] - 1)^2 + 25 * (x[2] + 0.5)^2"

[[inputs]]
id = "x0"
label = "Initial Parameters x0"
tooltip = "Starting parameter vector as a Julia array."
default = "[-2.0, 1.5]"

[[inputs]]
id = "lr"
label = "Learning Rate"
tooltip = "Step scale. The largest move of any coordinate in one step is lr * rho, so lr can be much larger than for Adam."
default = "0.5"
newRow = true

[[inputs]]
id = "rho"
label = "Clip rho"
tooltip = "Clipping threshold on the curvature-scaled momentum m / h. Small values make SOPHIA behave like sign descent; large values like a diagonal Newton step. Typical range 0.01 to 0.1."
default = "0.04"

[[inputs]]
id = "k"
label = "Hessian Interval k"
tooltip = "The diagonal-Hessian estimate is refreshed every k steps (one Hessian-vector product each time), which keeps the cost close to a first-order method."
default = "10"

[[inputs]]
id = "iters"
label = "Iterations"
tooltip = "Number of update steps."
default = "1000"

[miniCharts]
