label = "Predict"

[[actionGroups.actions]]
id = "density-at"
label = "Density at New Points"
desc = "The estimated density at chosen points (first margin for bivariate histograms and kernel densities)"
code = '''
using StatsBase
x = data isa Tuple ? data[1] : data isa AbstractMatrix ? data[1, :] : data  # the first margin
xs = quantile(x, [0.05, 0.25, 0.5, 0.75, 0.95])  # the points to evaluate
{{?model=histogram}} h1 = fit(Histogram, x, h.edges[1])
{{?model=histogram}} dens(v) = (i = StatsBase.binindex(h1, v); 1 <= i <= length(h1.weights) ? h1.weights[i] / (sum(h1.weights) * (h1.edges[1][i + 1] - h1.edges[1][i])) : 0.0)
{{?model=histogram}} [xs dens.(xs)]
{{?model=kde}} k isa UnivariateKDE ? [xs pdf(k, xs)] : pdf(k, xs, quantile(data[2], [0.05, 0.25, 0.5, 0.75, 0.95]))
{{?model=parametric}} d isa UnivariateDistribution ? [xs pdf.(d, d isa DiscreteDistribution ? round.(Int, xs) : xs)] : pdf(d, data[:, 1:5])
'''

[[actionGroups.actions]]
id = "sample"
label = "Draw New Samples"
desc = "1,000 new draws from the estimate: bins picked by their counts, a smoothed bootstrap for kernel densities, or random draws from the fitted distribution"
code = '''
using StatsBase, Random
x = data isa Tuple ? data[1] : data isa AbstractMatrix ? data[1, :] : data  # the first margin
{{?model=histogram}} h1 = fit(Histogram, x, h.edges[1])
{{?model=histogram}} e = h1.edges[1]
{{?model=histogram}} bins = sample(1:length(h1.weights), Weights(h1.weights), 1000)
{{?model=histogram}} draws = e[bins] .+ rand(1000) .* (e[bins .+ 1] .- e[bins])
{{?model=kde}} draws = rand(x, 1000) .+ rand(KernelDensity.kernel_dist({{kernel}}, first(bw)), 1000)
{{?model=parametric}} draws = rand(d, 1000)
{{?model!=parametric}} println("Mean of the draws: ", mean(draws), "   Mean of the data: ", mean(x))
{{?model=parametric}} println("Mean of the draws: ", mean(draws; dims=ndims(draws)), "   Mean of the data: ", mean(data; dims=ndims(data)))
draws
'''

