[[actionGroups.actions]]
id = "three-estimators"
label = "Histogram, Kernel Density and Normal Fit"
desc = "The three estimators side by side on the same data (first margin)"
code = '''
using StatsBase, KernelDensity, Distributions, Plots
x = data isa Tuple ? data[1] : data isa AbstractMatrix ? data[1, :] : data  # the first margin
x = float.(x)
histogram(x, normalize=:pdf, alpha=0.35, label="histogram", title="Three estimators")
kx = kde(x)
plot!(kx.x, kx.density, lw=2, label="kernel density")
xs = range(extrema(x)..., length=300)
plot!(xs, pdf.(fit(Normal, x), xs), lw=2, ls=:dash, label="normal fit")
'''

[[actionGroups.actions]]
id = "families"
label = "Candidate Distributions by AIC"
desc = "Log-likelihood, AIC and BIC of several parametric families fitted to the data (first margin); families that do not fit the support are skipped"
code = '''
using Distributions
x = data isa Tuple ? data[1] : data isa AbstractMatrix ? data[1, :] : data  # the first margin
x = float.(x)
rows = []
for D in (Normal, Laplace, LogNormal, Gamma, Exponential, Weibull, InverseGaussian, Rayleigh)
    try
        f = fit(D, x)
        ll, k = loglikelihood(f, x), length(params(f))
        push!(rows, (family = string(D), loglik = ll, aic = 2k - 2ll, bic = k * log(length(x)) - 2ll))
    catch
    end
end
sort!(rows, by = r -> r.aic)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary"
label = "Summary of the Estimate"
desc = "Mode, mean, spread and quantiles implied by the estimate (first margin for bivariate histograms and kernel densities)"
code = '''
using StatsBase
