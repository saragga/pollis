[[actionGroups.actions]]
id = "interval-probability"
label = "Probability of an Interval"
desc = "The estimated probability that X falls between a and b, next to the share of the data that does (first margin)"
code = '''
using StatsBase
x = data isa Tuple ? data[1] : data isa AbstractMatrix ? data[1, :] : data  # the first margin
a, b = -1.0, 1.0  # the interval (a, b]
{{?model=histogram}} h1 = fit(Histogram, x, h.edges[1])
{{?model=histogram}} inside = [a <= lo && hi <= b for (lo, hi) in zip(h1.edges[1][1:end-1], h1.edges[1][2:end])]
{{?model=histogram}} estimate = sum(h1.weights[inside]) / sum(h1.weights)  # whole bins inside (a, b]
{{?model=kde}} k1 = k isa UnivariateKDE ? k : kde(x)
{{?model=kde}} estimate = sum(k1.density[a .< k1.x .<= b]) * step(k1.x)
{{?model=parametric}} estimate = d isa UnivariateDistribution ? cdf(d, b) - cdf(d, a) : missing
(estimate = estimate, share_of_data = mean(a .< x .<= b))
'''
