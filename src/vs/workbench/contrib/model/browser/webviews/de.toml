[[codeBranches]]
model = "histogram"
code = '''
{{?hist-norm=none}} using StatsBase, Random
{{?hist-norm!=none}} using StatsBase, Random, LinearAlgebra

{{?hist-dim=uni}} data = {{data-hist}}
{{?hist-dim=multi}} data = {{data-hist2}}
{{?hist-mode=nbins}} h = fit(Histogram, data; nbins={{nbins}}, closed={{closed}})
{{?hist-mode=edges}} h = fit(Histogram, data, {{edges}}; closed={{closed}})
{{?hist-dim=uni}} println("Bin edges: ", h.edges[1])
{{?hist-dim=multi}} println("Bin edges: ", h.edges)
{{?hist-norm!=none}} h = normalize(h, mode=:{{hist-norm}})
println("Counts:    ", h.weights)
'''

[[codeBranches]]
model = "kde"
code = '''
using KernelDensity, Random

{{?kde-dim=uni}} data = {{data-kde}}
{{?kde-dim=bi}} data = {{data-kde2}}
k = kde(data; kernel={{kernel}}, bandwidth={{bandwidth}})
println("Bandwidth: ", k.bw)
println("x range:   ", (minimum(k.x), maximum(k.x)))
{{?kde-dim=bi}} println("y range:   ", (minimum(k.y), maximum(k.y)))
'''

[[codeBranches]]
model = "parametric"
code = '''
using Distributions, Random

{{?param-dim=uni}} data = {{data-param}}
{{?param-dim=multi}} data = {{data-param2}}
{{?dist!=Binomial}} d = fit({{dist}}, data)
{{?dist=Binomial}} d = fit(Binomial, n, data)  # n = number of trials, must be provided

println("Parameters: ", params(d))
println("Mean:       ", mean(d))
{{?param-dim=uni}} println("Std:        ", std(d))
{{?dist=MvNormal}} println("Covariance: ", cov(d))
'''
