{{?model=parametric}} d isa UnivariateDistribution ? (mean = mean(d), median = median(d), mode = mode(d), std = std(d), skewness = skewness(d), kurtosis = kurtosis(d), q05_q95 = quantile.(d, [0.05, 0.95])) : (mean = mean(d), cov = cov(d))
