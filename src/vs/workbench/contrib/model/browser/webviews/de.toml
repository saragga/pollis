# Density Estimation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/de.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Density Estimation"
viewType = "pollis.de"
defaultModel = "histogram"

[[packages]]
name = "StatsBase.jl"
github = "https://github.com/JuliaStats/StatsBase.jl"

[[packages]]
name = "KernelDensity.jl"
github = "https://github.com/JuliaStats/KernelDensity.jl"

[[packages]]
name = "Distributions.jl"
github = "https://github.com/JuliaStats/Distributions.jl"

[requires]
packages = ["StatsBase.jl", "KernelDensity.jl", "Distributions.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Non-Parametric Methods"
file = "de/tutorial-01-nonparametric.ipynb"
bundled = true
description = "Histogram, kernel density and average shifted histogram estimation"

[[notebookSections.notebooks]]
name = "Parametric Fitting"
file = "de/tutorial-02-parametric.ipynb"
bundled = true
description = "Fitting parametric distributions to data via MLE"

[[wikis]]
name = "Overview"
file = "de/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "de/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "de/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "de/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "de/interpretation.md"
bundled = true

[[wikis]]
name = "Decision Guide"
file = "de/decision-guide.md"
bundled = true

[[models]]
id = "histogram"
label = "Histogram"

[[models]]
id = "kde"
label = "Kernel Density"

[[models]]
id = "parametric"
label = "Parametric"

[[bullets]]
text = "Histogram"
detail = "bin-based density estimate (StatsBase.jl)"

[[bullets]]
text = "Kernel Density"
detail = "smooth non-parametric density estimate (KernelDensity.jl)"

[[bullets]]
text = "Parametric"
detail = "fit a parametric distribution to data (Distributions.jl)"

[[inputs]]
id = "hist-dim"
label = "Dimensions"
tooltip = ""
kind = "select"
default = "uni"
models = ["histogram"]

[[inputs.options]]
value = "uni"
label = "Univariate"

[[inputs.options]]
value = "multi"
label = "Multivariate"

[[inputs]]
id = "data-hist"
label = "Data"
tooltip = ""
default = "randn(100)"
models = ["histogram"]
when = "hist-dim=uni"

[[inputs]]
id = "data-hist2"
label = "Data"
tooltip = ""
default = "(randn(100), randn(100))"
models = ["histogram"]
when = "hist-dim=multi"

[[inputs]]
id = "hist-mode"
label = "Specification"
tooltip = ""
kind = "select"
default = "nbins"
models = ["histogram"]

[[inputs.options]]
value = "nbins"
label = "Bins"

[[inputs.options]]
value = "edges"
label = "Edges"

[[inputs]]
id = "nbins"
label = "Bins (n)"
tooltip = "Number of bins; a tuple such as (10, 10) for multivariate data."
default = "10"
models = ["histogram"]
when = "hist-mode=nbins"

[[inputs]]
id = "edges"
label = "Edges"
tooltip = "Bin edges; a tuple of edge vectors such as ([0.0, 0.5, 1.0], [0.0, 0.5, 1.0]) for multivariate data."
default = "[0.0, 0.5, 1.0, 1.5, 2.0]"
models = ["histogram"]
when = "hist-mode=edges"

