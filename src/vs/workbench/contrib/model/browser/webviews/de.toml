{{?model=histogram}} (modal_bin = mids[argmax(w)], mean = sum(mids .* w), std = sqrt(sum(w .* (mids .- sum(mids .* w)).^2)), median_data = median(x))
{{?model=kde}} k1 = k isa UnivariateKDE ? k : kde(x)
