code = '''
gx = g(x_star)
cons = [(name = "g$i", value = gx[i], binding = gx[i] >= -1e-6) for i in eachindex(gx)]
bnds = [(name = "x$i bound", value = min(x_star[i] - lb[i], ub[i] - x_star[i]), binding = min(x_star[i] - lb[i], ub[i] - x_star[i]) <= 1e-8) for i in eachindex(x_star)]
[cons; bnds]
'''

