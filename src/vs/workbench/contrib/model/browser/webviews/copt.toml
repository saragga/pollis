desc = "Key properties and trade-offs of the selected method"
code = '''
{{?model=slsqp}} (method = "SLSQP (NLopt)", needs = "gradients of f and g", handles = "nonlinear equality and inequality constraints", convergence = "superlinear near the solution", caveat = "dense quasi-Newton matrix: small to medium n")
{{?model=mma}} (method = "MMA (NLopt)", needs = "gradients of f and g", handles = "nonlinear inequality constraints", convergence = "globally convergent, conservative", caveat = "no equality constraints; slower final convergence")
{{?model=ip}} (method = "Interior point (Ipopt via JuMP)", needs = "gradients and Hessians (JuMP computes them)", handles = "large sparse equality and inequality constraints", convergence = "superlinear, returns multipliers", caveat = "local solutions of non-convex problems")
{{?model=fw}} (method = "Frank-Wolfe (FrankWolfe.jl)", needs = "gradient of f and a linear minimisation oracle", handles = "convex feasible sets", convergence = "O(1/k) in the objective, reports a dual gap", caveat = "the oracle here solves a small SLSQP problem, exact only for convex sets")
{{?model=gp}} (method = "Gradient projection", needs = "gradient of f and a projection", handles = "convex feasible sets", convergence = "like gradient descent, O(1/k) for convex f", caveat = "the projection here solves a small SLSQP problem, unique only for convex sets")
'''
