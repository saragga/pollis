id = "eval-at-solution"
label = "Evaluate at Solution"
desc = "f, g and the gradient of f at the solution"
code = '''
(solution = x_star, objective = f(x_star), constraints = g(x_star), gradient = ForwardDiff.gradient(f, x_star))
'''

[[actionGroups.actions]]
id = "sensitivity-bounds"
label = "Bounds Sensitivity"
desc = "Re-solve with the box shrunk by 10, 25 and 50 percent around its centre"
code = '''
c, w = (lb .+ ub) ./ 2, (ub .- lb) ./ 2
map([0.0, 0.1, 0.25, 0.5]) do s
    l, u = c .- (1 - s) .* w, c .+ (1 - s) .* w
    r = solve(lb=l, ub=u, x0=c)
    (shrink = s, objective = r.fx, change = r.fx - f_star, solution = round.(r.x, digits=4), max_violation = violation(r.x; lb=l, ub=u))
end
'''

[[actionGroups.actions]]
id = "constraint-relaxation"
label = "Constraint Relaxation"
desc = "Re-solve with g(x) <= delta: the slope of the optimal value against delta is minus the multiplier (the shadow price)"
code = '''
using Plots

deltas = [-0.2, -0.1, 0.0, 0.1, 0.2]
vals = [solve(g=x -> g(x) .- d).fx for d in deltas]
display(plot(deltas, vals, marker=:circle, xlabel="relaxation delta (all constraints)", ylabel="optimal f", legend=false))
(deltas = deltas, optimal_values = round.(vals, sigdigits=6), slope_at_0 = (vals[4] - vals[2]) / 0.2)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "slsqp-vs-mma"
label = "Compare Methods"
desc = "The selected method against NLopt SLSQP, MMA and derivative-free COBYLA from the same start"
code = '''
x0 = (lb .+ ub) ./ 2
function nl(alg)
    k = Ref(0)
    sec = @elapsed fx, x, ret = NLopt.optimize(nlopt_model(alg, x0; rec=_ -> k[] += 1), x0)
    (method = string(alg), objective = fx, max_violation = violation(x), evaluations = k[], seconds = sec, status = ret)
end
sec = @elapsed r = solve()
[(method = "selected", objective = r.fx, max_violation = violation(r.x), evaluations = length(r.hf), seconds = sec, status = r.status);
 nl(:LD_SLSQP); nl(:LD_MMA); nl(:LN_COBYLA)]
'''

[[actionGroups.actions]]
id = "constrained-vs-unconstrained"
label = "vs Unconstrained"
desc = "The box-only optimum (L-BFGS) against the constrained one: what the constraints cost"
code = '''
x0 = (lb .+ ub) ./ 2
opt = Opt(:LD_LBFGS, length(x0))
opt.lower_bounds, opt.upper_bounds, opt.maxeval = lb, ub, 2000
opt.min_objective = (x, grad) -> (length(grad) > 0 && (grad .= ForwardDiff.gradient(f, x)); f(x))
fu, xu, _ = NLopt.optimize(opt, x0)
(box_only_solution = round.(xu, digits=6), box_only_objective = fu, box_only_violates = findall(g(xu) .> 1e-8),
 constrained_solution = round.(x_star, digits=6), constrained_objective = f_star, cost_of_constraints = f_star - fu)
'''

