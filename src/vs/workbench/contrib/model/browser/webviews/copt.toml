id = "convergence-curve"
label = "Convergence Curve"
desc = "Objective value at each recorded iterate (evaluations for SLSQP and MMA, iterations otherwise)"
code = '''
using Plots

plot(res.hf, xlabel="iteration", ylabel="f(x)", legend=false, marker=:circle, markersize=2)
hline!([f_star], linestyle=:dash)
'''

[[actionGroups.actions]]
id = "constraint-violation"
label = "Constraint Violation"
desc = "Largest violation of the constraints and bounds at each recorded iterate (Ipopt: its primal infeasibility)"
code = '''
using Plots

plot(max.(res.hv, 1e-16), yscale=:log10, xlabel="iteration", ylabel="max violation", legend=false)
'''

[[actionGroups.actions]]
id = "solution-path"
label = "Solution Path"
desc = "Objective contours, the constraint boundaries g(x) = 0 and the path of the iterates in the (x1, x2) plane (Ipopt shows only the start and the solution)"
code = '''
using Plots

xs = range(lb[1], ub[1], length=150); ys = range(lb[2], ub[2], length=150)
p = contour(xs, ys, (a, b) -> f([a; b; x_star[3:end]]), levels=25, xlabel="x1", ylabel="x2", colorbar=false)
for i in eachindex(g(x_star))
    contour!(p, xs, ys, (a, b) -> g([a; b; x_star[3:end]])[i], levels=[0.0], color=:black, linewidth=2)
end
pts = isempty(res.path) ? [(lb .+ ub) ./ 2, x_star] : res.path
plot!(p, getindex.(pts, 1), getindex.(pts, 2), marker=:circle, markersize=2, color=:red, label="iterates")
scatter!(p, [x_star[1]], [x_star[2]], marker=:star, markersize=10, color=:red, label="solution")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "feasibility-check"
label = "Feasibility Check"
desc = "Constraint values and bound slacks at the solution"
code = '''
gx = g(x_star)
(constraint_values = round.(gx, sigdigits=6), constraints_satisfied = all(gx .<= 1e-6),
 bounds_satisfied = all(lb .- 1e-9 .<= x_star .<= ub .+ 1e-9), max_violation = violation(x_star))
'''

[[actionGroups.actions]]
id = "kkt-check"
label = "KKT Conditions"
desc = "Estimate the multipliers of the active constraints by least squares and check stationarity, dual feasibility and complementary slackness"
code = '''
gx, J, gradf = g(x_star), ForwardDiff.jacobian(g, x_star), ForwardDiff.gradient(f, x_star)
active = findall(gx .>= -1e-6)
free = findall((x_star .> lb .+ 1e-8) .& (x_star .< ub .- 1e-8))  # bound-active coordinates are excluded
JA = J[active, free]
lambda = zeros(length(gx))
isempty(active) || (lambda[active] = -(transpose(JA) \ gradf[free]))  # solve grad f + JA^T lambda = 0
stationarity = gradf[free] + transpose(J[:, free]) * lambda
(active_constraints = active, multipliers = round.(lambda, sigdigits=6),
{{?model=ip}} ipopt_multipliers = round.(res.multipliers, sigdigits=6),
 stationarity_residual = norm(stationarity), dual_feasible = all(lambda .>= -1e-6),
 complementary_slackness = maximum(abs.(lambda .* gx)))
'''

[[actionGroups.actions]]
id = "multi-start"
label = "Multi-Start"
desc = "Solve from 10 random starting points: several distinct solutions mean a non-convex problem with local optima"
code = '''
using Random, Statistics

Random.seed!(1)
runs = [solve(x0=lb .+ rand(length(lb)) .* (ub .- lb)) for _ in 1:10]
fv = getfield.(runs, :fx)
(objectives = round.(fv, sigdigits=6), feasible = [violation(r.x) < 1e-6 for r in runs],
 distinct_solutions = length(unique(round.(getfield.(runs, :x), digits=4))), best = minimum(fv), spread = std(fv))
'''

