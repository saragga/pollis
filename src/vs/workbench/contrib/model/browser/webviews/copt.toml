[[codeBranches]]
model = "ip"
code = '''
using ForwardDiff, LinearAlgebra, NLopt

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
g(x) = {{constr}}  # inequality constraints, feasible when every entry is <= 0
lb, ub = {{lb}}, {{ub}}  # bounds
maxiter = {{maxiter}}  # iteration limit

# largest violation of the constraints and bounds (0 when feasible)
violation(x; g=g, lb=lb, ub=ub) = max(0, maximum(g(x)), maximum(lb .- x), maximum(x .- ub))

# NLopt problem with ForwardDiff gradients and Jacobians; rec(x) is called at every objective evaluation
function nlopt_model(alg, x0; obj=f, g=g, lb=lb, ub=ub, maxeval=maxiter, tol=1e-8, rec=nothing)
    opt = Opt(alg, length(x0))
    opt.lower_bounds, opt.upper_bounds, opt.maxeval, opt.xtol_rel = lb, ub, maxeval, 1e-10
    opt.min_objective = function (x, grad)
        length(grad) > 0 && (grad .= ForwardDiff.gradient(obj, x))
        rec === nothing || rec(x)
        obj(x)
    end
    inequality_constraint!(opt, function (res, x, jac)
        res .= g(x)
        length(jac) > 0 && (jac .= transpose(ForwardDiff.jacobian(g, x)))  # NLopt expects n x m
    end, fill(tol, length(g(x0))))
    opt
end
using JuMP, Ipopt

function solve(; x0=(lb .+ ub) ./ 2, g=g, lb=lb, ub=ub, maxiter=maxiter)
    model = Model(Ipopt.Optimizer)
    set_silent(model)
    set_attribute(model, "max_iter", maxiter)
    @variable(model, lb[i] <= x[i=1:length(lb)] <= ub[i], start = x0[i])
    @objective(model, Min, f(x))
    c = @constraint(model, g(x) .<= 0)
    hf, hv = Float64[], Float64[]  # objective and primal infeasibility at each Ipopt iteration
    MOI.set(model, Ipopt.CallbackFunction(), (alg_mod, iter, obj, inf_pr, rest...) -> (push!(hf, obj); push!(hv, inf_pr); true))
    optimize!(model)
    (x = value.(x), fx = objective_value(model), path = Vector{Float64}[], hf = hf, hv = hv,
     status = termination_status(model), multipliers = -dual.(c))  # Lagrange multipliers of g(x) <= 0
end

res = solve()
x_star, f_star = res.x, res.fx
(solution = x_star, objective = f_star, max_violation = violation(x_star), status = res.status)
'''

[[codeBranches]]
model = "fw"
code = '''
using ForwardDiff, LinearAlgebra, NLopt

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
g(x) = {{constr}}  # inequality constraints, feasible when every entry is <= 0
lb, ub = {{lb}}, {{ub}}  # bounds
maxiter = {{maxiter}}  # iteration limit

# largest violation of the constraints and bounds (0 when feasible)
violation(x; g=g, lb=lb, ub=ub) = max(0, maximum(g(x)), maximum(lb .- x), maximum(x .- ub))

# NLopt problem with ForwardDiff gradients and Jacobians; rec(x) is called at every objective evaluation
function nlopt_model(alg, x0; obj=f, g=g, lb=lb, ub=ub, maxeval=maxiter, tol=1e-8, rec=nothing)
    opt = Opt(alg, length(x0))
    opt.lower_bounds, opt.upper_bounds, opt.maxeval, opt.xtol_rel = lb, ub, maxeval, 1e-10
    opt.min_objective = function (x, grad)
        length(grad) > 0 && (grad .= ForwardDiff.gradient(obj, x))
        rec === nothing || rec(x)
        obj(x)
    end
    inequality_constraint!(opt, function (res, x, jac)
        res .= g(x)
        length(jac) > 0 && (jac .= transpose(ForwardDiff.jacobian(g, x)))  # NLopt expects n x m
    end, fill(tol, length(g(x0))))
    opt
end
using FrankWolfe

# linear minimisation oracle over {lb <= v <= ub, g(v) <= 0}, solved as a small SLSQP problem (exact when the set is convex)
struct SetLMO <: FrankWolfe.LinearMinimizationOracle
    g::Function
    lb::Vector{Float64}
    ub::Vector{Float64}
end
function FrankWolfe.compute_extreme_point(lmo::SetLMO, d; kwargs...)
    x0, dir = (lmo.lb .+ lmo.ub) ./ 2, collect(d)
    NLopt.optimize(nlopt_model(:LD_SLSQP, x0; obj=v -> dot(dir, v), g=lmo.g, lb=lmo.lb, ub=lmo.ub, maxeval=500), x0)[2]
end

function solve(; x0=(lb .+ ub) ./ 2, g=g, lb=lb, ub=ub, maxiter=maxiter)
    lmo = SetLMO(g, float.(lb), float.(ub))
    dir = x0 .- (lb .+ ub) ./ 2
    start = FrankWolfe.compute_extreme_point(lmo, iszero(dir) ? -ones(length(lb)) : -dir)  # a feasible start: the vertex towards x0
    path, hf, hv = Vector{Float64}[], Float64[], Float64[]
    cb = (state, args...) -> (push!(path, copy(state.x)); push!(hf, f(state.x)); push!(hv, violation(state.x; g=g, lb=lb, ub=ub)); true)
    grad!(s, x) = ForwardDiff.gradient!(s, f, x)
    x, v, primal, gap = FrankWolfe.frank_wolfe(f, grad!, lmo, start; max_iteration=maxiter, line_search=FrankWolfe.Adaptive(), callback=cb, verbose=false)
    (x = x, fx = primal, path = path, hf = hf, hv = hv, status = "dual gap $(round(gap, sigdigits=3))")
end

res = solve()
x_star, f_star = res.x, res.fx
(solution = x_star, objective = f_star, max_violation = violation(x_star), status = res.status)
'''

[[codeBranches]]
model = "gp"
code = '''
using ForwardDiff, LinearAlgebra, NLopt

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
g(x) = {{constr}}  # inequality constraints, feasible when every entry is <= 0
lb, ub = {{lb}}, {{ub}}  # bounds
maxiter = {{maxiter}}  # iteration limit

# largest violation of the constraints and bounds (0 when feasible)
violation(x; g=g, lb=lb, ub=ub) = max(0, maximum(g(x)), maximum(lb .- x), maximum(x .- ub))

# NLopt problem with ForwardDiff gradients and Jacobians; rec(x) is called at every objective evaluation
function nlopt_model(alg, x0; obj=f, g=g, lb=lb, ub=ub, maxeval=maxiter, tol=1e-8, rec=nothing)
    opt = Opt(alg, length(x0))
    opt.lower_bounds, opt.upper_bounds, opt.maxeval, opt.xtol_rel = lb, ub, maxeval, 1e-10
    opt.min_objective = function (x, grad)
        length(grad) > 0 && (grad .= ForwardDiff.gradient(obj, x))
        rec === nothing || rec(x)
        obj(x)
    end
    inequality_constraint!(opt, function (res, x, jac)
        res .= g(x)
        length(jac) > 0 && (jac .= transpose(ForwardDiff.jacobian(g, x)))  # NLopt expects n x m
    end, fill(tol, length(g(x0))))
    opt
end

# Euclidean projection onto {lb <= y <= ub, g(y) <= 0}, as a small SLSQP problem (unique when the set is convex)
function proj(z; g=g, lb=lb, ub=ub)
    y0 = clamp.(z, lb, ub)
    NLopt.optimize(nlopt_model(:LD_SLSQP, y0; obj=y -> sum(abs2, y .- z), g=g, lb=lb, ub=ub, maxeval=500), y0)[2]
end

function solve(; x0=(lb .+ ub) ./ 2, g=g, lb=lb, ub=ub, maxiter=maxiter)
    x, t = proj(x0; g=g, lb=lb, ub=ub), 1.0
    path, hf, hv = Vector{Float64}[], Float64[], Float64[]
    rec(x) = (push!(path, copy(x)); push!(hf, f(x)); push!(hv, violation(x; g=g, lb=lb, ub=ub)))
    status = "iteration limit"
    for k in 1:maxiter
        rec(x)
        d = ForwardDiff.gradient(f, x)
        y = proj(x .- t .* d; g=g, lb=lb, ub=ub)
        while f(y) > f(x) + 1e-4 * dot(d, y .- x) && t > 1e-12  # Armijo backtracking along the projection arc
            t /= 2
            y = proj(x .- t .* d; g=g, lb=lb, ub=ub)
        end
        if norm(y .- x) < 1e-9
            x, status = y, "converged (projected step below 1e-9)"
            break
        end
        x, t = y, min(1.0, 2t)  # try a longer step next time
    end
    rec(x)
    (x = x, fx = f(x), path = path, hf = hf, hv = hv, status = status)
end

res = solve()
x_star, f_star = res.x, res.fx
(solution = x_star, objective = f_star, max_violation = violation(x_star), status = res.status)
'''

