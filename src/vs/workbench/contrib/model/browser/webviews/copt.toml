[[codeBranches]]
model = "slsqp"
code = '''
using ForwardDiff, LinearAlgebra, NLopt

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
g(x) = {{constr}}  # inequality constraints, feasible when every entry is <= 0
lb, ub = {{lb}}, {{ub}}  # bounds
maxiter = {{maxiter}}  # iteration limit

# largest violation of the constraints and bounds (0 when feasible)
violation(x; g=g, lb=lb, ub=ub) = max(0, maximum(g(x)), maximum(lb .- x), maximum(x .- ub))

# NLopt problem with ForwardDiff gradients and Jacobians; rec(x) is called at every objective evaluation
function nlopt_model(alg, x0; obj=f, g=g, lb=lb, ub=ub, maxeval=maxiter, tol=1e-8, rec=nothing)
    opt = Opt(alg, length(x0))
    opt.lower_bounds, opt.upper_bounds, opt.maxeval, opt.xtol_rel = lb, ub, maxeval, 1e-10
    opt.min_objective = function (x, grad)
        length(grad) > 0 && (grad .= ForwardDiff.gradient(obj, x))
        rec === nothing || rec(x)
        obj(x)
    end
    inequality_constraint!(opt, function (res, x, jac)
        res .= g(x)
        length(jac) > 0 && (jac .= transpose(ForwardDiff.jacobian(g, x)))  # NLopt expects n x m
    end, fill(tol, length(g(x0))))
    opt
end

ALG = :LD_SLSQP  # sequential least-squares quadratic programming

function solve(; x0=(lb .+ ub) ./ 2, g=g, lb=lb, ub=ub, maxiter=maxiter)
    path, hf, hv = Vector{Float64}[], Float64[], Float64[]
    rec(x) = (push!(path, copy(x)); push!(hf, f(x)); push!(hv, violation(x; g=g, lb=lb, ub=ub)))
    fx, x, ret = NLopt.optimize(nlopt_model(ALG, x0; g=g, lb=lb, ub=ub, maxeval=maxiter, rec=rec), x0)
    (x = x, fx = fx, path = path, hf = hf, hv = hv, status = ret)
end

res = solve()
x_star, f_star = res.x, res.fx
(solution = x_star, objective = f_star, max_violation = violation(x_star), status = res.status)
'''

