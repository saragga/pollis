[[decisionRows]]
task = "SLSQP"
context = "Smooth problems of small to medium size with nonlinear constraints"
purpose = "Sequential least-squares quadratic programming: a quasi-Newton QP model of the Lagrangian at each step; fast local convergence"

[[decisionRows]]
task = "MMA"
context = "Many variables with few constraints, e.g. structural and topology design"
purpose = "Method of moving asymptotes: a separable convex approximation that stays conservative, so iterates remain feasible once feasible"

[[decisionRows]]
task = "Interior Point"
context = "Large sparse problems with many constraints"
purpose = "Ipopt: follows a barrier path from the interior of the feasible set, solving Newton systems for primal and dual variables together"

[[decisionRows]]
task = "Frank-Wolfe"
context = "Convex feasible sets where minimising a linear function is cheap"
purpose = "Conditional gradient: moves towards the point of the set that minimises the linearised objective; projection-free, sparse iterates"

[[decisionRows]]
task = "Gradient Projection"
context = "Convex feasible sets with a cheap projection (boxes, balls, simplices)"
purpose = "Takes a gradient step, projects back onto the set, and backtracks along the projection arc"

[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables."
default = "2"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, in terms of the vector x. Default: the squared distance to (1.5, 1), whose unconstrained minimum lies outside the unit disk."
default = "(x[1] - 1.5)^2 + (x[2] - 1.0)^2"

[[inputs]]
id = "constr"
label = "Constraints g(x) <= 0"
tooltip = "Julia vector of inequality constraints, feasible when every entry is <= 0. Default: the unit disk (active at the solution) and x2 <= x1 (inactive). Frank-Wolfe and Gradient Projection assume the feasible set is convex."
default = "[x[1]^2 + x[2]^2 - 1.0, x[2] - x[1]]"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds on x."
default = "fill(-2.0, n)"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds on x."
default = "fill(2.0, n)"

[[inputs]]
id = "maxiter"
label = "Max Iterations"
tooltip = "Iteration limit (objective evaluations for SLSQP and MMA)."
default = "500"

