[[references]]
separator = true
label = "Original Papers (from packages)"

[[references]]
title = "Bayesian Solutions for the Factor Zoo: We Just Ran Two Quadrillion Models"
authors = "Bryzgalova, Huang & Julliard"
year = 2023
journal = "Journal of Finance"
doi = "10.1111/jofi.13197"
openAccess = false

[[references]]
title = "Risk, Return, and Equilibrium: Empirical Tests"
authors = "Fama & MacBeth"
year = 1973
journal = "Journal of Political Economy"
doi = "10.1086/260061"
openAccess = false

[[models]]
id = "bayesian"
label = "Bayesian"

[[models]]
id = "classical"
label = "Classical"

[[bullets]]
text = "Bayesian"
detail = "BayesianFM() from BayesianFactorZoo.jl: normal shrinkage prior on risk prices lambda, optional pricing-error prior weighted by d, full MCMC posterior"

[[bullets]]
text = "Classical"
detail = "TwoPassRegression() from BayesianFactorZoo.jl: standard two-pass regression with time-series betas and cross-sectional risk prices (OLS and GLS), Shanken-corrected standard errors"

[[decisionRows]]
task = "Bayesian"
context = "Many candidate factors, weak or useless factors, short samples"
purpose = "Full posterior of risk prices with shrinkage; robust to weak factors"

[[decisionRows]]
task = "Classical"
context = "A few well-established factors, long samples"
purpose = "Two-pass OLS/GLS risk premia with Shanken-corrected t-statistics"

[[inputs]]
id = "f"
label = "Factor returns (f)"
tooltip = "T x K matrix of factor excess returns. Rows are time periods, columns are factors. Use monthly excess returns (in percent) for standard asset pricing."
default = "f"

[[inputs]]
id = "R"
label = "Test asset returns (R)"
tooltip = "T x N matrix of test asset excess returns. Rows are time periods, columns are portfolios (e.g. 25 Fama-French size/value portfolios)."
default = "R"

[[inputs]]
id = "psi0"
label = "psi0"
tooltip = "Prior scale on risk prices lambda. Larger values give a more diffuse (less informative) prior. Default 5.0 is calibrated for monthly excess returns in percent."
default = "5.0"
models = ["bayesian"]

[[inputs]]
id = "d"
label = "d"
tooltip = "Prior weight on pricing errors (alpha). 0 = exact factor pricing imposed; 1 = diffuse prior on intercepts (default). Intermediate values shrink pricing errors toward zero."
default = "1.0"
models = ["bayesian"]

[[inputs]]
id = "intercept"
label = "Intercept"
tooltip = "true to allow non-zero pricing errors in the cross-sectional regression; false to impose that factors explain all expected returns exactly."
default = "true"
models = ["bayesian"]

[[inputs]]
id = "sim-length"
label = "MCMC draws"
tooltip = "Number of MCMC posterior draws retained after burnin. Increase to 50 000 or more for publication-quality inference."
default = "10_000"
models = ["bayesian"]

[[inputs]]
id = "burnin"
label = "Burnin"
tooltip = "Number of initial MCMC draws to discard as warmup. Should be at least 10-20% of sim_length."
default = "1_000"
models = ["bayesian"]

[[inputs]]
id = "estimator"
label = "Estimator"
tooltip = "OLS for the two-pass OLS risk premia, GLS for the GLS estimates. TwoPassRegression() always includes an intercept and reports Shanken (1992) errors-in-variables corrected t-statistics for both."
kind = "select"
default = "ols"
models = ["classical"]

[[inputs.options]]
value = "ols"
label = "OLS"

[[inputs.options]]
value = "gls"
label = "GLS"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.bayesian]
# Posterior density of a risk price with its credible band
svg = '''
var s = '<line x1="4" y1="70" x2="50" y2="70" stroke="currentColor" stroke-width="1"/>';
var d = '';
for (var i = 0; i <= 40; i++) {
	var z = (i - 20) / 7;
	d += (i ? 'L' : 'M') + (7 + i) + ',' + (70 - Math.exp(-z * z / 2) * 44).toFixed(1);
}
s += '<rect x="15" y="26" width="24" height="44" fill="currentColor" opacity="0.15"/>';
s += '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
s += '<line x1="27" y1="24" x2="27" y2="70" stroke="currentColor" stroke-width="1" stroke-dasharray="2,2"/>';
return s;
'''

[miniCharts.classical]
# Average returns against betas with the cross-sectional regression line
svg = '''
var s = '<line x1="6" y1="76" x2="50" y2="76" stroke="currentColor" stroke-width="1"/><line x1="6" y1="14" x2="6" y2="76" stroke="currentColor" stroke-width="1"/>';
var x = [12, 16, 20, 25, 29, 33, 38, 43];
var y = [64, 58, 60, 50, 46, 42, 36, 30];
for (var i = 0; i < x.length; i++) { s += '<circle cx="' + x[i] + '" cy="' + y[i] + '" r="2" fill="currentColor" opacity="0.7"/>'; }
s += '<line x1="9" y1="68" x2="47" y2="26" stroke="currentColor" stroke-width="1.5"/>';
return s;
'''

[[codeBranches]]
model = "bayesian"
code = '''
using BayesianFactorZoo, Statistics  # Bayesian factor pricing + Statistics stdlib

result = BayesianFM({{f}}, {{R}};  # Bayesian Fama-MacBeth cross-sectional regression
    psi0       = {{psi0}},  # prior scale on risk prices lambda
    d          = {{d}},  # prior weight on pricing errors alpha
    intercept  = {{intercept}},  # allow non-zero pricing errors
    sim_length = {{sim-length}},  # MCMC posterior draws
    burnin     = {{burnin}}
)

lambda_mean = mean(result.lambda, dims=2)  # posterior mean risk prices (K-vector)
lambda_std  = std(result.lambda, dims=2)  # posterior std of risk prices
R2_mean     = mean(result.R2_oos)  # posterior mean cross-sectional R²

println("lambda (mean): ", lambda_mean)  # print posterior mean risk prices
println("lambda (std):  ", lambda_std)  # print posterior std of risk prices
println("R² (mean):  ", R2_mean)  # print posterior mean R²
'''

[[codeBranches]]
model = "classical"
code = '''
using BayesianFactorZoo  # Bayesian factor pricing, incl. classical two-pass

result = TwoPassRegression({{f}}, {{R}})  # classical two-pass Fama-MacBeth regression

{{?estimator=ols}} lambda_est = result.lambda[2:end]  # risk price estimates (OLS, intercept dropped)
{{?estimator=ols}} t_stat     = result.t_stat[2:end]  # Shanken-corrected t-statistics
{{?estimator=ols}} R2         = result.R2_adj  # adjusted cross-sectional R²
{{?estimator=gls}} lambda_est = result.lambda_gls[2:end]  # risk price estimates (GLS, intercept dropped)
{{?estimator=gls}} t_stat     = result.t_stat_gls[2:end]  # Shanken-corrected t-statistics
{{?estimator=gls}} R2         = result.R2_adj_GLS  # adjusted cross-sectional R²

println("lambda (estimate): ", lambda_est)  # print risk price estimates
println("t-statistics:      ", t_stat)  # print Shanken t-statistics
println("R²:                ", R2)  # print adjusted cross-sectional R²
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "posterior-density"
label = "Posterior Density"
desc = "Histogram of the posterior draws of each risk price"
code = '''
using BayesianFactorZoo, Plots

result = BayesianFM({{f}}, {{R}}, {{sim-length}})  # draws x (1 + K); column 1 is the intercept
lam = result.lambda_ols_path[:, 2:end]  # factor risk-price draws
plot([histogram(lam[:, k]; bins = 50, normalize = :pdf, title = "lambda " * string(k), legend = false) for k in 1:size(lam, 2)]...)
'''

[[actionGroups.actions]]
id = "pricing-plot"
label = "Pricing Plot"
desc = "Average test-asset returns against the returns the factors predict"
code = '''
using BayesianFactorZoo, Plots, Statistics

result = TwoPassRegression({{f}}, {{R}})  # classical two-pass regression
X     = hcat(ones(size({{f}}, 1)), {{f}})  # time-series regressors with intercept
betas = (X \ {{R}})[2:end, :]'  # N x K factor loadings
avg   = vec(mean({{R}}, dims = 1))  # realised average returns
fit   = result.lambda[1] .+ betas * result.lambda[2:end]  # fitted expected returns
scatter(fit, avg; xlabel = "Predicted", ylabel = "Realised", label = "Test assets")
plot!(identity, extrema(fit)...; linestyle = :dash, label = "45-degree line")  # perfect pricing
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "mcmc-trace"
label = "MCMC Trace"
desc = "Trace plots of the risk-price draws to check mixing and convergence"
code = '''
using BayesianFactorZoo, Plots

result = BayesianFM({{f}}, {{R}}, {{sim-length}})  # draws x (1 + K); column 1 is the intercept
plot(result.lambda_ols_path[:, 2:end]; xlabel = "Draw", ylabel = "lambda", alpha = 0.7)  # one line per factor; should look like noise
'''

[[actionGroups.actions]]
id = "pricing-errors"
label = "Pricing Errors"
desc = "Cross-sectional pricing errors (alphas) of each test asset"
code = '''
using BayesianFactorZoo, Statistics

result = TwoPassRegression({{f}}, {{R}})  # classical two-pass regression
X     = hcat(ones(size({{f}}, 1)), {{f}})  # time-series regressors with intercept
betas = (X \ {{R}})[2:end, :]'  # N x K factor loadings
alpha = vec(mean({{R}}, dims = 1)) .- (result.lambda[1] .+ betas * result.lambda[2:end])  # pricing errors
println("Mean absolute pricing error: ", round(mean(abs.(alpha)), digits = 4))
println("Largest pricing error:       ", round(maximum(abs.(alpha)), digits = 4))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "expected-returns"
label = "Implied Expected Returns"
desc = "Expected return of each test asset implied by its betas and the risk prices"
code = '''
using BayesianFactorZoo

result = TwoPassRegression({{f}}, {{R}})  # classical two-pass regression
X     = hcat(ones(size({{f}}, 1)), {{f}})  # time-series regressors with intercept
betas = (X \ {{R}})[2:end, :]'  # N x K factor loadings
er = betas * result.lambda[2:end]  # expected excess return = beta * lambda
println("Implied expected excess returns: ", round.(er, digits = 3))
'''

[[actionGroups.actions]]
id = "posterior-predictive"
label = "Posterior Expected Returns"
desc = "Posterior mean and 90% band of each asset's implied expected return"
code = '''
using BayesianFactorZoo, Statistics

result = BayesianFM({{f}}, {{R}}, {{sim-length}})  # draws x (1 + K); column 1 is the intercept
X     = hcat(ones(size({{f}}, 1)), {{f}})  # time-series regressors with intercept
betas = (X \ {{R}})[2:end, :]'  # N x K factor loadings
draws = betas * result.lambda_ols_path[:, 2:end]'  # N x draws implied expected returns
for i in 1:size(draws, 1)
    q = quantile(draws[i, :], [0.05, 0.95])
    println("Asset ", i, ": ", round(mean(draws[i, :]), digits = 3), "  [", round(q[1], digits = 3), ", ", round(q[2], digits = 3), "]")
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "bayes-vs-classical"
label = "Bayesian vs Classical"
desc = "Posterior mean risk prices next to the two-pass OLS estimates"
code = '''
using BayesianFactorZoo, Statistics

bayes = BayesianFM({{f}}, {{R}}, {{sim-length}})  # draws x (1 + K); column 1 is the intercept
twop  = TwoPassRegression({{f}}, {{R}})

println("Bayesian (posterior mean): ", round.(vec(mean(bayes.lambda_ols_path, dims = 1)), digits = 4))
println("Classical (OLS):           ", round.(twop.lambda, digits = 4))  # Bayesian shrinks weak factors toward zero
'''

[[actionGroups.actions]]
id = "ols-vs-gls"
label = "OLS vs GLS"
desc = "Two-pass risk premia and t-statistics under both weighting schemes"
code = '''
using BayesianFactorZoo

result = TwoPassRegression({{f}}, {{R}})
println("OLS lambda: ", round.(result.lambda[2:end], digits = 4), "  t: ", round.(result.t_stat[2:end], digits = 2))
println("GLS lambda: ", round.(result.lambda_gls[2:end], digits = 4), "  t: ", round.(result.t_stat_gls[2:end], digits = 2))
println("Adj. R² OLS / GLS: ", round(result.R2_adj, digits = 3), " / ", round(result.R2_adj_GLS, digits = 3))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "credible-intervals"
label = "Credible Intervals"
desc = "95% posterior credible interval of each risk price and whether it excludes zero"
code = '''
using BayesianFactorZoo, Statistics

result = BayesianFM({{f}}, {{R}}, {{sim-length}})  # draws x (1 + K); column 1 is the intercept
for k in 2:size(result.lambda_ols_path, 2)  # column 1 is the intercept
    lo, hi = quantile(result.lambda_ols_path[:, k], [0.025, 0.975])  # 95% credible interval
    println("lambda ", k - 1, ": [", round(lo, digits = 4), ", ", round(hi, digits = 4), "]", (lo > 0 || hi < 0) ? "  priced" : "  not priced")
end
'''

[[actionGroups.actions]]
id = "significance"
label = "Risk Premium Significance"
desc = "Which factors carry a significant price of risk at the 5% level"
code = '''
using BayesianFactorZoo

result = TwoPassRegression({{f}}, {{R}})
for (k, t) in enumerate(result.t_stat[2:end])
    println("Factor ", k, ": t = ", round(t, digits = 2), abs(t) > 1.96 ? "  significant" : "  not significant")  # Shanken-corrected
end
'''
