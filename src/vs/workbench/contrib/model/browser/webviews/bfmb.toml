# Fama-MacBeth Regression Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/bfmb.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Fama-MacBeth Regression"
viewType = "pollis.bfmb"
defaultModel = "bayesian"

[[packages]]
name = "BayesianFactorZoo.jl"
github = "https://github.com/eohne/BayesianFactorZoo.jl"

[[packages]]
name = "FamaFrenchData.jl"
github = "https://github.com/tbeason/FamaFrenchData.jl"

[requires]
packages = ["Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "BayesianFM Basics"
file = "bfmb/tutorial-01-basics.ipynb"
bundled = true
description = "Introduction to Bayesian Fama-MacBeth regression with BayesianFM()"

[[notebookSections.notebooks]]
name = "Prior Sensitivity"
file = "bfmb/tutorial-02-priors.ipynb"
bundled = true
description = "Effect of psi0 and d on posterior risk price estimates"

[[notebookSections.notebooks]]
name = "Model Comparison"
file = "bfmb/tutorial-03-model-comparison.ipynb"
bundled = true
description = "Bayesian factor selection and model comparison across candidate factors"

[[notebookSections.notebooks]]
name = "Factor Zoo Application"
file = "bfmb/tutorial-04-factor-zoo.ipynb"
bundled = true
description = "Running two-quadrillion-model Bayesian factor selection on real data"

[[notebookSections.notebooks]]
name = "Classical FM Basics"
file = "bfmb/tutorial-05-classical.ipynb"
bundled = true
description = "Classical two-pass Fama-MacBeth regression with TwoPassRegression()"

[[notebookSections.notebooks]]
name = "Newey-West Standard Errors"
file = "bfmb/tutorial-06-newey-west.ipynb"
bundled = true
description = "HAC-robust inference for cross-sectional risk price estimates"

