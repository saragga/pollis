# Kenneth French Data Library Webview Configuration
# Declarative source. The build script generates ffd.data.ts.
# Run: npm run gulp compile-toml
#
# Approach: FamaFrenchData.jl downloads the zipped CSV files of Kenneth
# French's Data Library (no API key) and returns, for each file, a vector of
# tables plus their notes. The tables are Tables.jl-compatible, so the code
# reads columns with Tables.getcolumn and never loads a data-frame package
# itself. Returns are in percent; dates are integers such as 192607 (monthly)
# or 1927 (annual).

[meta]
title = "Kenneth French Data Library"
viewType = "pollis.ffd"
defaultModel = "factors3"
models = ["factors3", "factors5", "momentum", "portfolios", "industries", "library"]
illusCollapsed = true
illustrationText = "Pull Kenneth French's factor and portfolio returns into Julia: the three and five Fama-French factors, momentum, the 25 size and book-to-market portfolios, industry portfolios, and the full list of files in the library."

