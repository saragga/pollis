[[actionGroups]]
id = "portfolios"
label = "Portfolios"

[[actionGroups.actions]]
id = "ffd-p25-grid"
label = "Average Returns Grid"
desc = "Mean monthly return of each of the 25 portfolios since July 1963, size by book-to-market"
code = """
using FamaFrenchData, Tables, Statistics

vw = first(readFamaFrench("25_Portfolios_5x5"))[1]
keep = Tables.getcolumn(vw, :Date) .>= 196307
names = Tables.columnnames(vw)[2:26]                 # size quintile varies slowest
m = [mean(Tables.getcolumn(vw, n)[keep]) for n in names]
grid = permutedims(reshape(m, 5, 5))                 # rows: size, columns: book-to-market
println("          BM1    BM2    BM3    BM4    BM5")
for i in 1:5
    println("ME", i, "   ", join(lpad.(round.(grid[i, :]; digits = 2), 7)))
end
"""

[[actionGroups.actions]]
id = "ffd-p25-capm"
label = "CAPM Alphas"
desc = "Join the portfolios to the factors by date and estimate each portfolio's CAPM alpha"
code = """
using FamaFrenchData, Tables, Statistics

vw = first(readFamaFrench("25_Portfolios_5x5"))[1]
ff = first(readFamaFrench("F-F_Research_Data_Factors"))[1]
start = 196307
pk = Tables.getcolumn(vw, :Date) .>= start
fk = Tables.getcolumn(ff, :Date) .>= start
@assert Tables.getcolumn(vw, :Date)[pk] == Tables.getcolumn(ff, :Date)[fk]

rf = Tables.getcolumn(ff, :RF)[fk]
X = [ones(count(fk)) Tables.getcolumn(ff, Symbol("Mkt-RF"))[fk]]
alpha = [first(X \\ (Tables.getcolumn(vw, n)[pk] .- rf)) for n in Tables.columnnames(vw)[2:26]]
grid = permutedims(reshape(alpha, 5, 5))
println("CAPM alpha, % per month")
println("          BM1    BM2    BM3    BM4    BM5")
for i in 1:5
    println("ME", i, "   ", join(lpad.(round.(grid[i, :]; digits = 2), 7)))
end
"""

