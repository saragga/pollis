[[codeBranches]]
model = "factors3"
code = """
using FamaFrenchData, Tables

# readFamaFrench returns (tables, table notes, file notes); no API key is needed.
# Table 1 is monthly, table 2 annual; returns are in percent.
tables, tablenotes, filenotes = readFamaFrench("F-F_Research_Data_Factors")
monthly = tables[1]

date = Tables.getcolumn(monthly, :Date)          # integers such as 192607
mktrf = Tables.getcolumn(monthly, Symbol("Mkt-RF"))
smb = Tables.getcolumn(monthly, :SMB)
hml = Tables.getcolumn(monthly, :HML)
rf = Tables.getcolumn(monthly, :RF)

println(first(date), " to ", last(date), ", ", length(date), " months")
for i in length(date)-5:length(date)
    println(date[i], "   Mkt-RF ", lpad(mktrf[i], 6), "   SMB ", lpad(smb[i], 6), "   HML ", lpad(hml[i], 6), "   RF ", rf[i])
end
"""

[[codeBranches]]
model = "factors5"
code = """
using FamaFrenchData, Tables

# Five factors (2x3 sorts): adds RMW (profitability) and CMA (investment)
tables, tablenotes, filenotes = readFamaFrench("F-F_Research_Data_5_Factors_2x3")
monthly = tables[1]

names = [:SMB, :HML, :RMW, :CMA]
println(first(Tables.getcolumn(monthly, :Date)), " to ", last(Tables.getcolumn(monthly, :Date)))
for n in [Symbol("Mkt-RF"); names]
    x = Tables.getcolumn(monthly, n)
    println(rpad(n, 8), "mean ", lpad(round(sum(x) / length(x); digits = 3), 6), " % per month")
end
"""

