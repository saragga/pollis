[[actionGroups.actions]]
id = "ffd-ff5-corr"
label = "Correlations"
desc = "Correlation matrix of the five factors"
code = """
using FamaFrenchData, Tables, Statistics

monthly = first(readFamaFrench("F-F_Research_Data_5_Factors_2x3"))[1]
names = [Symbol("Mkt-RF"), :SMB, :HML, :RMW, :CMA]
C = cor(reduce(hcat, [Tables.getcolumn(monthly, n) for n in names]))
println(" " ^ 8, join(lpad.(string.(names), 8)))
for (i, n) in enumerate(names)
    println(rpad(n, 8), join(lpad.(round.(C[i, :]; digits = 2), 8)))
end
"""

[[actionGroups.actions]]
id = "ffd-ff5-hml"
label = "Is HML Redundant?"
desc = "Regress HML on the other four factors, as in Fama and French (2015)"
code = """
using FamaFrenchData, Tables, Statistics, LinearAlgebra

monthly = first(readFamaFrench("F-F_Research_Data_5_Factors_2x3"))[1]
col(n) = Tables.getcolumn(monthly, n)
y = col(:HML)
X = [ones(length(y)) col(Symbol("Mkt-RF")) col(:SMB) col(:RMW) col(:CMA)]
b = X \\ y
e = y - X * b
se = sqrt.(sum(abs2, e) / (length(y) - size(X, 2)) .* diag(inv(X' * X)))
for (n, bi, si) in zip(["intercept", "Mkt-RF", "SMB", "RMW", "CMA"], b, se)
    println(rpad(n, 10), lpad(round(bi; digits = 3), 7), "   t = ", round(bi / si; digits = 2))
end
println("R2 = ", round(1 - var(e) / var(y); digits = 3))
"""

