[[actionGroups]]
id = "factors3"
label = "Three Factors"

[[actionGroups.actions]]
id = "ffd-ff3-cumulative"
label = "Cumulative Returns"
desc = "Growth of one dollar invested in the market, size, and value factors since 1926"
code = """
using FamaFrenchData, Tables, Plots, Dates

monthly = first(readFamaFrench("F-F_Research_Data_Factors"))[1]
date = [Date(div(d, 100), rem(d, 100)) for d in Tables.getcolumn(monthly, :Date)]
growth(r) = cumprod(1 .+ r ./ 100)

mkt = Tables.getcolumn(monthly, Symbol("Mkt-RF")) .+ Tables.getcolumn(monthly, :RF)
p = plot(date, growth(mkt), label = "Market", yscale = :log10, ylabel = "value of one dollar (log)", legend = :topleft)
plot!(p, date, growth(Tables.getcolumn(monthly, :SMB)), label = "SMB")
plot!(p, date, growth(Tables.getcolumn(monthly, :HML)), label = "HML")
p
"""

[[actionGroups.actions]]
id = "ffd-ff3-sharpe"
label = "Annualised Statistics"
desc = "Mean, volatility, and Sharpe ratio of each factor, annualised from monthly returns"
code = """
using FamaFrenchData, Tables, Statistics

monthly = first(readFamaFrench("F-F_Research_Data_Factors"))[1]
for n in [Symbol("Mkt-RF"), :SMB, :HML]
    x = Tables.getcolumn(monthly, n)
    m, s = 12 * mean(x), sqrt(12) * std(x)
    println(rpad(n, 7), "mean ", lpad(round(m; digits = 2), 6), " %   vol ", lpad(round(s; digits = 2), 6),
            " %   Sharpe ", round(m / s; digits = 2))
end
"""

[[actionGroups.actions]]
id = "ffd-ff3-annual"
label = "Annual Factors"
desc = "The last ten years from the annual table in the same file"
code = """
using FamaFrenchData, Tables

tables, tablenotes, _ = readFamaFrench("F-F_Research_Data_Factors")
println(tablenotes[2])
for r in Iterators.drop(Tables.rows(tables[2]), length(Tables.getcolumn(tables[2], :Date)) - 10)
    println(r.Date, "   Mkt-RF ", lpad(r[Symbol("Mkt-RF")], 7), "   SMB ", lpad(r.SMB, 7), "   HML ", lpad(r.HML, 7))
end
"""

[[actionGroups]]
id = "factors5"
