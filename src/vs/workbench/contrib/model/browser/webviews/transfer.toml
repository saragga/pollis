[[models]]
id = "features"
label = "Feature Extraction"

[[models]]
id = "last"
label = "Last Block"

[[models]]
id = "full"
label = "Fully Fine-Tuned"

[[bullets]]
text = "Feature Extraction"
detail = "ResNet-18, trained on ImageNet, kept as it is: its 512 pooled channels are the input of a new last layer, the only part trained"

[[bullets]]
text = "Last Block"
detail = "The first three stages kept as they are, the fourth stage and a new last layer trained again on the new images"

[[bullets]]
text = "Fully Fine-Tuned"
detail = "Every layer trained again on the new images, starting from ImageNet's weights, at a small learning rate"

[[bullets]]
text = "On Another Dataset"
detail = "Each model, trained on MNIST's handwritten digits, applied to SVHN's photographed house numbers, which it has not seen"

[[decisionRows]]
task = "Feature Extraction"
context = "Few labelled images"
purpose = "A linear classifier on fixed features: fast, and nothing of the network can be overfitted"

[[decisionRows]]
task = "Last Block"
context = "Some thousands of images"
purpose = "The most specific stage adapted to the new images, the general stages beneath kept"

[[decisionRows]]
task = "Fully Fine-Tuned"
context = "Many images, distant task"
purpose = "Every layer adapted, at the cost of a full pass backwards for every image"

[[inputs]]
id = "train"
label = "Training Images"
tooltip = "How many of MNIST's 60,000 training images, drawn at random, the model is trained on."
default = "2000"

[[inputs]]
id = "test"
label = "Test Images"
tooltip = "How many of MNIST's 10,000 test images, drawn at random, the model is scored on. No tab trains on them."
default = "1000"

[[inputs]]
id = "side"
label = "Image Size"
tooltip = "The images are enlarged from 28 pixels (MNIST) and 32 pixels (SVHN) to this size. ResNet-18 halves an image five times, so 64 pixels leave a grid of 2 by 2 at its last stage. Larger images give the network more to see and take longer."
default = "64"

[[inputs]]
id = "batch"
label = "Batch"
tooltip = "Images in each step of Adam."
default = "64"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Seed of the random draws: the images sampled, the new last layer's first weights and the order of the batches."
default = "1"

[[inputs]]
id = "rate"
label = "Learning Rate"
tooltip = "The learning rate of Adam for the new last layer."
default = "0.001"
models = ["features"]
newRow = true

[[inputs]]
id = "epochs"
label = "Epochs"
tooltip = "How many times the training goes through the training images. Each epoch is fast: the pooled channels of every image are computed once, before training."
default = "10"
models = ["features"]

[[inputs]]
id = "tuneRate"
label = "Learning Rate"
tooltip = "The learning rate of Adam for the layers trained again: small, so that they move away from ImageNet's weights only as far as the new images need."
default = "0.0001"
models = ["last", "full"]
newRow = true

[[inputs]]
id = "tuneEpochs"
label = "Epochs"
tooltip = "How many times the training goes through the training images. Each epoch runs the trained layers forwards and backwards over every image."
default = "3"
models = ["last", "full"]

[[inputs]]
id = "other"
label = "SVHN Images"
tooltip = "How many of SVHN's 26,032 test images, drawn at random, On Another Dataset and Three Tabs and From Scratch score each model on. SVHN's test split, about 64 MB, is downloaded the first time."
default = "1000"

[[codeBranches]]
model = "*"
code = '''
using Flux, Metalhead, MLDatasets, MAT, Downloads, Statistics, Random
ENV["DATADEPS_ALWAYS_ACCEPT"] = "true"  # MLDatasets downloads MNIST the first time without asking
Random.seed!({{seed}})  # the new last layer's first weights
rng = Xoshiro({{seed}})  # the images sampled and the order of the batches
digits = 0:9
side = {{side}}  # the images are enlarged to side by side pixels

# The images scaled as ResNet-18's images of ImageNet were: three channels, normalised by ImageNet's mean and standard deviation
function prepare(images)
    x = Float32.(images)
    ndims(x) == 3 && (x = repeat(reshape(x, size(x, 1), size(x, 2), 1, :), 1, 1, 3, 1))  # grey: the same values in red, green and blue
    x = Flux.upsample_bilinear(x; size = (side, side))
    return (x .- reshape(Float32[0.485, 0.456, 0.406], 1, 1, 3, 1)) ./ reshape(Float32[0.229, 0.224, 0.225], 1, 1, 3, 1)
end

# MNIST's handwritten digits: a sample of its training images to train on, and of its test images to score on
mnist_train, mnist_test = MNIST(:train), MNIST(:test)
i = randperm(rng, length(mnist_train.targets))[1:{{train}}]
j = randperm(rng, length(mnist_test.targets))[1:{{test}}]
x_train, y_train = prepare(mnist_train.features[:, :, i]), mnist_train.targets[i]
x_test, y_test = prepare(mnist_test.features[:, :, j]), mnist_test.targets[j]

# A sample of n of SVHN's photographed house numbers, for On Another Dataset: its test split, about 64 MB, downloaded the first time
function svhn_test(n)
    file = joinpath(first(DEPOT_PATH), "datadeps", "SVHN-test", "test_32x32.mat")
    if !isfile(file)
        mkpath(dirname(file))
        Downloads.download("https://ufldl.stanford.edu/housenumbers/test_32x32.mat", file * ".part")
        mv(file * ".part", file)
    end
    svhn = matread(file)  # X: height, width, channel and image, as bytes; y: the digit, 10 for the digit 0
    k = randperm(rng, size(svhn["X"], 4))[1:n]
    return prepare(permutedims(svhn["X"][:, :, :, k], (2, 1, 3, 4)) ./ 255.0f0), mod.(Int.(vec(svhn["y"])[k]), 10)
end

# ResNet-18 trained on ImageNet (torchvision's weights), with a new last layer for the ten digits
model = create_model("timm/resnet18.tv_in1k"; num_classes = 10)
in_batches(f, x) = cat((f(x[:, :, :, b]) for b in Iterators.partition(axes(x, 4), 250))...; dims = ndims(f(x[:, :, :, 1:1])))
pooled(m, x) = in_batches(x -> forward_head(m, forward_features(m, x); pre_logits = true), x)  # the 512 channels averaged over the image
stage3(m, x) = in_batches(x -> only(forward_intermediates(m, x; indices = [4], intermediates_only = true, stop_early = true)), x)  # the output of the third stage
predict(m, x) = Flux.onecold(in_batches(m, x), digits)
accuracy(m, x, y) = mean(predict(m, x) .== y)
loss(m, x, y) = Flux.logitcrossentropy(m(x), Flux.onehotbatch(y, digits))

# Train `part` of `m` on `inputs`, what the layers beneath it give for the training images; score `m` on the test images after each epoch
function fit!(m, part, inputs; rate, epochs)
    opt, history = Flux.setup(Adam(rate), part), []
    for epoch in 1:epochs
        Flux.trainmode!(part)  # batch normalisation by each batch, its statistics updated
        losses = Float32[]
        for (x, y) in Flux.DataLoader((inputs, y_train); batchsize = {{batch}}, shuffle = true, rng)
            l, g = Flux.withgradient(p -> loss(p, x, y), part)
            Flux.update!(opt, part, g[1])
            push!(losses, l)
        end
        Flux.testmode!(m)
        push!(history, (epoch = epoch, loss = mean(losses), accuracy = accuracy(m, x_test, y_test)))
        println("epoch ", epoch, ": loss ", round(mean(losses); digits = 3), ", accuracy on MNIST's test images ", round(history[end].accuracy; digits = 3))
    end
    return history
end

{{?model=features}}# Feature Extraction: the network kept as it is, its pooled channels computed once for each image; only the new last layer trained
{{?model=features}}history = fit!(model, model.fc, pooled(model, x_train); rate = {{rate}}, epochs = {{epochs}})
{{?model=last}}# Last Block: the first three stages kept as they are, their output computed once for each image; the fourth stage and the new last layer trained
{{?model=last}}history = fit!(model, Chain(model.layer4, model.global_pool, model.fc), stage3(model, x_train); rate = {{tuneRate}}, epochs = {{tuneEpochs}})
{{?model=full}}# Fully Fine-Tuned: every layer trained, from ImageNet's weights
{{?model=full}}history = fit!(model, model, x_train; rate = {{tuneRate}}, epochs = {{tuneEpochs}})
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "training-curves"
label = "Training Curves"
desc = "The loss on the training images and the accuracy on MNIST's test images after each epoch"
code = '''
using Plots
epoch = [h.epoch for h in history]
plot(plot(epoch, [h.loss for h in history]; xlabel = "epoch", ylabel = "cross-entropy", label = "training images", marker = :circle),
    plot(epoch, [h.accuracy for h in history]; xlabel = "epoch", ylabel = "accuracy", label = "MNIST test images", marker = :circle, color = 2);
    layout = (1, 2), size = (900, 350))
'''

[[actionGroups.actions]]
id = "misclassified"
label = "Misclassified Digits"
desc = "Up to 16 of MNIST's test images the model gets wrong, each with the digit it gives and the true one"
code = '''
using Plots
predicted = predict(model, x_test)
wrong = findall(predicted .!= y_test)
println(length(wrong), " of ", length(y_test), " test images misclassified")
panels = [heatmap(permutedims(mnist_test.features[:, :, j[k]]); yflip = true, color = :grays, colorbar = false, axis = false, ticks = false,
    title = "$(predicted[k]), not $(y_test[k])", titlefontsize = 9) for k in first(wrong, 16)]
isempty(panels) ? println("None") : plot(panels...; layout = length(panels), size = (700, 700))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "confusion"
label = "Confusion Matrix"
desc = "How often each true digit of MNIST's test images is given each digit by the model"
code = '''
using Plots
predicted = predict(model, x_test)
counts = [count((y_test .== a) .& (predicted .== b)) for a in digits, b in digits]
for (k, a) in enumerate(digits)
    println("digit ", a, ": ", round(counts[k, k] / max(1, sum(counts[k, :])); digits = 3), " right of ", sum(counts[k, :]))
end
heatmap(digits, digits, counts; xlabel = "given", ylabel = "true", yflip = true, xticks = digits, yticks = digits, color = :blues, size = (500, 450))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "another-dataset"
label = "On Another Dataset"
desc = "The model trained on MNIST's handwritten digits applied to SVHN's photographed house numbers, which it has not seen, beside its accuracy on MNIST"
code = '''
x_svhn, y_svhn = svhn_test({{other}})
predicted = predict(model, x_svhn)
println("Accuracy on MNIST's test images: ", round(accuracy(model, x_test, y_test); digits = 3))
println("Accuracy on SVHN's test images:  ", round(mean(predicted .== y_svhn); digits = 3), " (chance: 0.1)")
for a in digits
    println("  digit ", a, ": ", round(mean(predicted[y_svhn .== a] .== a); digits = 3), " right of ", count(==(a), y_svhn))
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "three-tabs"
label = "Three Tabs and From Scratch"
desc = "The three tabs and ResNet-18 trained from random weights, each on the same training images with the inputs of its tab, scored on MNIST's and SVHN's test images; it trains four models, about a quarter of an hour without a GPU"
code = '''
using Printf
if !@isdefined(x_svhn)  # SVHN's images, unless On Another Dataset has read them
    x_svhn, y_svhn = svhn_test({{other}})
end
results = []
m = create_model("timm/resnet18.tv_in1k"; num_classes = 10)
fit!(m, m.fc, pooled(m, x_train); rate = {{rate}}, epochs = {{epochs}})
push!(results, ("Feature Extraction", m))
m = create_model("timm/resnet18.tv_in1k"; num_classes = 10)
fit!(m, Chain(m.layer4, m.global_pool, m.fc), stage3(m, x_train); rate = {{tuneRate}}, epochs = {{tuneEpochs}})
push!(results, ("Last Block", m))
m = create_model("timm/resnet18.tv_in1k"; num_classes = 10)
fit!(m, m, x_train; rate = {{tuneRate}}, epochs = {{tuneEpochs}})
push!(results, ("Fully Fine-Tuned", m))
m = create_model("resnet18"; num_classes = 10)  # the same network, from random weights
fit!(m, m, x_train; rate = {{rate}}, epochs = {{tuneEpochs}})
push!(results, ("From Scratch", m))
println(rpad("", 20), "MNIST   SVHN")
for (name, m) in results
    @printf("%-20s%.3f   %.3f\n", name, accuracy(m, x_test, y_test), accuracy(m, x_svhn, y_svhn))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "what-retrained"
label = "What Was Retrained"
desc = "The weights of ResNet-18 kept as they are, against those the tab trains on the new images"
code = '''
n(layer) = sum(length, Flux.trainables(layer))
total = n(model)
{{?model=features}}trained = n(model.fc)
{{?model=last}}trained = n(model.layer4) + n(model.fc)
{{?model=full}}trained = total
println("ResNet-18 with its new last layer: ", total, " weights")
for (name, layer) in [("first stages", Chain(model.conv1, model.bn1)), ("stage 1", model.layer1), ("stage 2", model.layer2), ("stage 3", model.layer3), ("stage 4", model.layer4), ("new last layer", model.fc)]
    println("  ", rpad(name, 16), lpad(n(layer), 10))
end
println("Trained on the new images: ", trained, " weights, ", round(100 * trained / total; digits = 2), "% of the model")
'''

[[actionGroups.actions]]
id = "cut-layer"
label = "Accuracy by Cut Layer"
desc = "A new last layer trained on the averaged output of each of the four stages of ResNet-18 as trained on ImageNet, scored on MNIST's and SVHN's test images: how general the features of each stage are"
code = '''
using Printf
if !@isdefined(x_svhn)  # SVHN's images, unless On Another Dataset has read them
    x_svhn, y_svhn = svhn_test({{other}})
end
imagenet = create_model("timm/resnet18.tv_in1k"; num_classes = 10)  # as trained on ImageNet, whatever the tab trained
stages(x) = in_batches(x -> reduce(vcat, [dropdims(mean(f; dims = (1, 2)); dims = (1, 2)) for f in forward_intermediates(imagenet, x; indices = 2:5, intermediates_only = true)]), x)
s_train, s_test, s_svhn = stages(x_train), stages(x_test), stages(x_svhn)
println("stage  channels  MNIST   SVHN")
for (stage, rows) in enumerate([1:64, 65:192, 193:448, 449:960])
    head = Dense(length(rows) => 10)
    opt = Flux.setup(Adam(0.001), head)
    for epoch in 1:{{epochs}}, (z, y) in Flux.DataLoader((s_train[rows, :], y_train); batchsize = {{batch}}, shuffle = true, rng)
        Flux.update!(opt, head, Flux.gradient(h -> loss(h, z, y), head)[1])
    end
    @printf("%d      %4d      %.3f   %.3f\n", stage, length(rows), mean(Flux.onecold(head(s_test[rows, :]), digits) .== y_test), mean(Flux.onecold(head(s_svhn[rows, :]), digits) .== y_svhn))
end
'''
