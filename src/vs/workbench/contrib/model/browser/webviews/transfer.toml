# Transfer Learning and Fine-Tuning Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/transfer.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Transfer Learning and Fine-Tuning"
viewType = "pollis.transfer"
defaultModel = "published"
decisionFirstColumn = "Tab"

[[packages]]
name = "ArchaeologicalDetection.jl"
github = "https://github.com/Trumpingtons/ArchaeologicalDetection.jl"

[[packages]]
name = "NNlib.jl"
github = "https://github.com/FluxML/NNlib.jl"

[[packages]]
name = "DecisionTree.jl"
github = "https://github.com/JuliaAI/DecisionTree.jl"

[[packages]]
name = "Rasters.jl"
github = "https://github.com/rafaqz/Rasters.jl"

[requires]
packages = ["ArchGDAL.jl", "DuckDB.jl", "Plots.jl"]

