# Feedforward Neural Networks Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/fnn.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Feedforward Neural Networks"
viewType = "pollis.fnn"
defaultModel = "mlp"

[[packages]]
name = "Flux.jl"
github = "https://github.com/FluxML/Flux.jl"

