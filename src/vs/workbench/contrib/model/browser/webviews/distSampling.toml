id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "sample-size"
label = "Error Against Sample Size"
desc = "How far the sample median (univariate) or mean (multivariate) is from the exact value as n grows: roughly 1/sqrt(n)"
code = '''
using Statistics
rng2 = MersenneTwister({{seed-param}})
{{?model=discrete|continuous|truncated|mixture|convolutions}} [(n = m, median_error = abs(median(rand(rng2, d, m)) - median(d))) for m in (10, 100, 1000, 10_000)]
{{?model=multivariate|product}} [(n = m, max_mean_error = maximum(abs, vec(mean(rand(rng2, d, m), dims=2)) .- mean(d))) for m in (10, 100, 1000, 10_000)]
{{?model=matrixvariate}} [(n = m, max_mean_error = maximum(abs, mean(rand(rng2, d, m)) .- mean(d))) for m in (10, 100, 1000, 10_000)]
'''

[[actionGroups.actions]]
id = "samplers"
label = "Samplers Compared"
desc = "Time for 100,000 draws with rand, with a precomputed sampler(d), and (univariate) by inverse transform quantile(d, U)"
code = '''
rng2 = MersenneTwister({{seed-param}})
rand(rng2, d, 10); rand(rng2, sampler(d), 10)  # compile first
t_rand = @elapsed rand(rng2, d, 100_000)
t_sampler = @elapsed rand(rng2, sampler(d), 100_000)
{{?model=discrete|continuous|truncated|mixture|convolutions}} t_inverse = @elapsed quantile.(d, rand(rng2, 100_000))
{{?model=multivariate|product|matrixvariate}} t_inverse = missing
(rand_ms = 1000 * t_rand, sampler_ms = 1000 * t_sampler, inverse_cdf_ms = 1000 * t_inverse)
'''

