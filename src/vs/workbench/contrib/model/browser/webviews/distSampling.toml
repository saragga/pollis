# Distribution Sampling Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/distSampling.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Distribution Sampling"
viewType = "pollis.dist.sampling"
defaultModel = "discrete"

[[packages]]
name = "Distributions.jl"
github = "https://github.com/JuliaStats/Distributions.jl"

[requires]
packages = ["Distributions.jl", "HypothesisTests.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Univariate Distributions (Jupyter)"
file = "dist/tutorial-01-univariate.ipynb"
bundled = true
description = "Working with discrete and continuous univariate distributions"

[[notebookSections.notebooks]]
name = "Univariate Distributions (Pluto)"
file = "dist/tutorial-01-univariate.jl"
bundled = true
description = "Reactive Pluto notebook — discrete and continuous univariate distributions"

[[notebookSections.notebooks]]
name = "Truncated and Censored"
file = "dist/tutorial-02-truncated-censored.ipynb"
bundled = true
description = "Constraining distributions with bounds"

[[notebookSections.notebooks]]
name = "Multivariate Distributions"
file = "dist/tutorial-03-multivariate.ipynb"
bundled = true
description = "Vector-valued distributions including MvNormal and Dirichlet"

[[notebookSections.notebooks]]
name = "Mixture and Composite"
file = "dist/tutorial-04-mixture-composite.ipynb"
bundled = true
description = "Mixture models, product distributions, and convolutions"

[[wikis]]
name = "Overview"
file = "dist/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "dist/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "dist/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "dist/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "dist/interpretation.md"
bundled = true

[[wikis]]
