default = "42"

[[codeBranches]]
model = "discrete"
code = '''
using Distributions, Random  # Distributions.jl + Random stdlib for seeding

{{?dist-discrete=Bernoulli}} d = Bernoulli({{discrete-Bernoulli}})
{{?dist-discrete=Binomial}} d = Binomial({{discrete-Binomial}})
{{?dist-discrete=Poisson}} d = Poisson({{discrete-Poisson}})
{{?dist-discrete=Geometric}} d = Geometric({{discrete-Geometric}})
{{?dist-discrete=NegativeBinomial}} d = NegativeBinomial({{discrete-NegativeBinomial}})
{{?dist-discrete=DiscreteUniform}} d = DiscreteUniform({{discrete-DiscreteUniform}})
{{?dist-discrete=Hypergeometric}} d = Hypergeometric({{discrete-Hypergeometric}})
{{?dist-discrete=Categorical}} d = Categorical({{discrete-Categorical}})
rng = MersenneTwister({{seed-param}})  # reproducible seed
x = rand(rng, d, {{method-param}})  # draw {{method-param}} samples
xs = rand(rng, d, 10_000)  # a large sample, used by the Next Steps
println("Mean:    ", mean(d))  # mean of the distribution
{{?dist-discrete=Bernoulli|Binomial|Poisson|Geometric|NegativeBinomial|DiscreteUniform|Hypergeometric}} println("Var:     ", var(d))  # variance
println("Samples: ", x)  # inspect drawn samples
'''

[[codeBranches]]
model = "continuous"
code = '''
using Distributions, Random  # Distributions.jl + Random stdlib for seeding

{{?dist-continuous=Normal}} d = Normal({{continuous-Normal}})
{{?dist-continuous=Uniform}} d = Uniform({{continuous-Uniform}})
{{?dist-continuous=Exponential}} d = Exponential({{continuous-Exponential}})
{{?dist-continuous=Gamma}} d = Gamma({{continuous-Gamma}})
{{?dist-continuous=Beta}} d = Beta({{continuous-Beta}})
{{?dist-continuous=LogNormal}} d = LogNormal({{continuous-LogNormal}})
{{?dist-continuous=Cauchy}} d = Cauchy({{continuous-Cauchy}})
{{?dist-continuous=Laplace}} d = Laplace({{continuous-Laplace}})
{{?dist-continuous=Logistic}} d = Logistic({{continuous-Logistic}})
{{?dist-continuous=TDist}} d = TDist({{continuous-TDist}})
{{?dist-continuous=Chisq}} d = Chisq({{continuous-Chisq}})
{{?dist-continuous=Weibull}} d = Weibull({{continuous-Weibull}})
{{?dist-continuous=Gumbel}} d = Gumbel({{continuous-Gumbel}})
{{?dist-continuous=Pareto}} d = Pareto({{continuous-Pareto}})
{{?dist-continuous=Triangular}} d = Triangular({{continuous-Triangular}})
{{?dist-continuous=InverseGaussian}} d = InverseGaussian({{continuous-InverseGaussian}})
{{?dist-continuous=Epanechnikov}} d = Epanechnikov()
{{?dist-continuous=GeneralizedExtremeValue}} d = GeneralizedExtremeValue({{continuous-GeneralizedExtremeValue}})
{{?dist-continuous=GeneralizedPareto}} d = GeneralizedPareto({{continuous-GeneralizedPareto}})
{{?dist-continuous=Levy}} d = Levy({{continuous-Levy}})
{{?dist-continuous=SkewNormal}} d = SkewNormal({{continuous-SkewNormal}})
rng = MersenneTwister({{seed-param}})  # reproducible seed
x = rand(rng, d, {{method-param}})  # draw {{method-param}} samples
xs = rand(rng, d, 10_000)  # a large sample, used by the Next Steps
{{?dist-continuous=Normal|Uniform|Exponential|Gamma|Beta|LogNormal|Laplace|Logistic|TDist|Chisq|Weibull|Gumbel|Pareto|Triangular|InverseGaussian|Epanechnikov|GeneralizedExtremeValue|GeneralizedPareto|Levy|SkewNormal}} println("Mean:    ", mean(d))  # mean of the distribution
{{?dist-continuous=Chisq}} println("Var:     ", var(d))  # variance
{{?dist-continuous=Normal|Uniform|Exponential|Gamma|Beta|LogNormal|Laplace|Logistic|TDist|Weibull|Gumbel|Pareto|Triangular|InverseGaussian|Epanechnikov|GeneralizedExtremeValue|GeneralizedPareto|Levy|SkewNormal}} println("Std:     ", std(d))  # standard deviation
{{?dist-continuous=Cauchy}} println("Median:  ", median(d))  # median of the distribution
println("Samples: ", x)  # inspect drawn samples
'''

[[codeBranches]]
model = "truncated"
code = '''
using Distributions, Random  # Distributions.jl + Random stdlib for seeding

{{?dist-truncated=Normal}} base = Normal({{truncated-Normal}})
{{?dist-truncated=Gamma}} base = Gamma({{truncated-Gamma}})
{{?dist-truncated=Exponential}} base = Exponential({{truncated-Exponential}})
{{?dist-truncated=LogNormal}} base = LogNormal({{truncated-LogNormal}})
{{?dist-truncated=Weibull}} base = Weibull({{truncated-Weibull}})
{{?dist-truncated=Pareto}} base = Pareto({{truncated-Pareto}})
d = truncated(base, lower={{lower}}, upper={{upper}})  # restrict support to [lower, upper]
rng = MersenneTwister({{seed-param}})  # reproducible seed
x = rand(rng, d, {{method-param}})  # draw {{method-param}} samples
xs = rand(rng, d, 10_000)  # a large sample, used by the Next Steps
println("Mean:    ", mean(d))  # mean of the distribution
println("Std:     ", std(d))  # standard deviation
println("Samples: ", x)  # inspect drawn samples
'''

[[codeBranches]]
model = "multivariate"
code = '''
using Distributions, Random  # Distributions.jl + Random stdlib for seeding

{{?dist-multivariate=MvNormal}} mu = {{multivariate-MvNormal-mu}}
{{?dist-multivariate=MvNormal}} Sigma = {{multivariate-MvNormal-sigma}}
{{?dist-multivariate=MvNormal}} d = MvNormal(mu, Sigma)
{{?dist-multivariate=Dirichlet}} alpha = {{multivariate-Dirichlet-alpha}}
{{?dist-multivariate=Dirichlet}} d = Dirichlet(alpha)
{{?dist-multivariate=Multinomial}} p = {{multivariate-Multinomial-probs}}
{{?dist-multivariate=Multinomial}} d = Multinomial({{multivariate-Multinomial-n}}, p)
rng = MersenneTwister({{seed-param}})  # reproducible seed
x = rand(rng, d, {{method-param}})  # draw {{method-param}} samples
xs = rand(rng, d, 10_000)  # a large sample, used by the Next Steps
println("Mean:    ", mean(d))  # mean of the distribution
{{?dist-multivariate=MvNormal}} println("Cov:     ", cov(d))  # covariance matrix
println("Samples: ", x)  # inspect drawn samples
'''

[[codeBranches]]
model = "matrixvariate"
code = '''
using Distributions, Random  # Distributions.jl + Random stdlib for seeding

{{?dist-matrixvariate=Wishart}} nu = {{matrixvariate-Wishart-nu}}
{{?dist-matrixvariate=Wishart}} S = {{matrixvariate-Wishart-s}}
{{?dist-matrixvariate=Wishart}} d = Wishart(nu, S)
{{?dist-matrixvariate=InverseWishart}} nu = {{matrixvariate-InverseWishart-nu}}
{{?dist-matrixvariate=InverseWishart}} S = {{matrixvariate-InverseWishart-s}}
{{?dist-matrixvariate=InverseWishart}} d = InverseWishart(nu, S)
{{?dist-matrixvariate=MatrixNormal}} M = {{matrixvariate-MatrixNormal-m}}
{{?dist-matrixvariate=MatrixNormal}} U = {{matrixvariate-MatrixNormal-u}}
{{?dist-matrixvariate=MatrixNormal}} V = {{matrixvariate-MatrixNormal-vv}}
{{?dist-matrixvariate=MatrixNormal}} d = MatrixNormal(M, U, V)
rng = MersenneTwister({{seed-param}})  # reproducible seed
x = rand(rng, d, {{method-param}})  # draw {{method-param}} samples
xs = rand(rng, d, 10_000)  # a large sample, used by the Next Steps
println("Mean:    ", mean(d))  # mean of the distribution
println("Samples: ", x)  # inspect drawn samples
'''

[[codeBranches]]
model = "mixture"
code = '''
using Distributions, Random  # Distributions.jl + Random stdlib for seeding

d = MixtureModel([{{mix-components}}], {{mix-weights}})  # weighted mixture of component distributions
rng = MersenneTwister({{seed-param}})  # reproducible seed
x = rand(rng, d, {{method-param}})  # draw {{method-param}} samples
xs = rand(rng, d, 10_000)  # a large sample, used by the Next Steps
println("Samples: ", x)  # inspect drawn samples
'''

[[codeBranches]]
model = "product"
code = '''
using Distributions, Random  # Distributions.jl + Random stdlib for seeding

d = product_distribution([{{prod-components}}])  # independent product of marginal distributions
rng = MersenneTwister({{seed-param}})  # reproducible seed
x = rand(rng, d, {{method-param}})  # draw {{method-param}} samples
xs = rand(rng, d, 10_000)  # a large sample, used by the Next Steps
println("Samples: ", x)  # inspect drawn samples
'''

[[codeBranches]]
model = "convolutions"
code = '''
using Distributions, Random  # Distributions.jl + Random stdlib for seeding

d = convolve({{conv-d1}}, {{conv-d2}})  # convolution: distribution of X1 + X2
rng = MersenneTwister({{seed-param}})  # reproducible seed
x = rand(rng, d, {{method-param}})  # draw {{method-param}} samples
xs = rand(rng, d, 10_000)  # a large sample, used by the Next Steps
println("Samples: ", x)  # inspect drawn samples
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "draws"
label = "Sample Against Distribution"
desc = "Univariate: histogram of 10,000 draws with the density (or bars against the probability mass). Multivariate: the first two components. Matrix-variate: the mean next to one draw"
code = '''
using Plots
{{?model=discrete|continuous|truncated|mixture|convolutions}} lo, hi = quantile(d, 0.001), quantile(d, 0.999)
{{?model=discrete|continuous|truncated|mixture|convolutions}} if d isa DiscreteUnivariateDistribution
{{?model=discrete|continuous|truncated|mixture|convolutions}}     k = round(Int, lo):round(Int, hi)
{{?model=discrete|continuous|truncated|mixture|convolutions}}     bar(k, [mean(xs .== v) for v in k], alpha=0.5, label="sample"); scatter!(k, pdf.(d, k), label="pmf")
{{?model=discrete|continuous|truncated|mixture|convolutions}} else
{{?model=discrete|continuous|truncated|mixture|convolutions}}     histogram(filter(t -> lo <= t <= hi, xs), bins=80, normalize=:pdf, alpha=0.5, label="sample"); plot!(t -> pdf(d, t), lo, hi, lw=2, label="pdf")
{{?model=discrete|continuous|truncated|mixture|convolutions}} end
{{?model=multivariate|product}} scatter(xs[1, :], xs[2, :], ms=1, alpha=0.3, legend=false, xlabel="component 1", ylabel="component 2")
{{?model=matrixvariate}} plot(heatmap(mean(d), title="mean", yflip=true), heatmap(first(xs), title="one draw", yflip=true), size=(700, 300))
'''

[[actionGroups.actions]]
id = "cdf"
label = "Cumulative and Marginals"
desc = "Univariate: empirical against exact CDF. Multivariate: histogram of each component. Matrix-variate: distribution of the largest singular value"
code = '''
using Plots
{{?model=discrete|continuous|truncated|mixture|convolutions}} lo, hi = quantile(d, 0.001), quantile(d, 0.999)
{{?model=discrete|continuous|truncated|mixture|convolutions}} plot(sort(xs), (1:length(xs)) ./ length(xs), seriestype=:steppost, label="empirical", xlims=(lo, hi)); plot!(t -> cdf(d, t), lo, hi, lw=2, ls=:dash, label="exact")
{{?model=multivariate|product}} plot([histogram(xs[i, :], bins=40, legend=false, title="component $(i)") for i in 1:min(size(xs, 1), 4)]..., size=(700, 300))
{{?model=matrixvariate}} using LinearAlgebra
{{?model=matrixvariate}} histogram([maximum(svdvals(x)) for x in xs], bins=60, legend=false, xlabel="largest singular value")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "moments"
label = "Sample Against Exact Moments"
desc = "Theoretical moments next to those of the sample (NaN where a moment is undefined, e.g. the Cauchy mean)"
code = '''
using Statistics
theory(f) = try f(d) catch; NaN end
{{?model=discrete|continuous|truncated|mixture|convolutions}} [(moment = string(f), exact = theory(f), sample = f(xs)) for f in (mean, var, skewness, kurtosis)]
{{?model=multivariate|product}} (max_mean_error = maximum(abs, vec(mean(xs, dims=2)) .- theory(mean)), max_cov_error = maximum(abs, cov(transpose(xs)) .- theory(cov)))
{{?model=matrixvariate}} (max_mean_error = maximum(abs, mean(xs) .- theory(mean)),)
'''

[[actionGroups.actions]]
id = "fit-check"
label = "Goodness of Fit"
desc = "Every draw in the support, the average negative log-density against the entropy (they should agree), and for continuous univariate laws a Kolmogorov-Smirnov test"
code = '''
using Statistics
{{?model=discrete|continuous|truncated|mixture|convolutions}} lp = logpdf.(d, xs)
{{?model=multivariate|product}} lp = [logpdf(d, c) for c in eachcol(xs)]
{{?model=matrixvariate}} lp = logpdf.(Ref(d), xs)
{{?model=discrete|continuous|truncated|mixture|convolutions}} using HypothesisTests
{{?model=discrete|continuous|truncated|mixture|convolutions}} ks_pvalue = d isa ContinuousUnivariateDistribution ? pvalue(ApproximateOneSampleKSTest(xs, d)) : missing
{{?model=multivariate|product|matrixvariate}} ks_pvalue = missing
(all_in_support = all(isfinite, lp), average_neg_logpdf = -mean(lp), entropy = try entropy(d) catch; NaN end, ks_pvalue = ks_pvalue)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "quantiles"
label = "Quantiles"
desc = "Univariate: exact and sample quantiles. Multivariate: sample quantiles of each component. Matrix-variate: 5%, 50% and 95% of each entry"
code = '''
qs = [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99]
{{?model=discrete|continuous|truncated|mixture|convolutions}} [(q = q, exact = quantile(d, q), sample = quantile(xs, q)) for q in qs]
{{?model=multivariate|product}} [(; component = i, (Symbol("q", round(Int, 100q)) => quantile(xs[i, :], q) for q in qs)...) for i in axes(xs, 1)]
{{?model=matrixvariate}} [(entry = (i, j), q05 = quantile([x[i, j] for x in xs], 0.05), median = quantile([x[i, j] for x in xs], 0.5), q95 = quantile([x[i, j] for x in xs], 0.95)) for i in axes(mean(d), 1), j in axes(mean(d), 2)]
'''

[[actionGroups.actions]]
id = "probabilities"
label = "Event Probabilities"
desc = "Univariate: exact CDF against the Monte Carlo frequency at three points. Multivariate and matrix-variate: Monte Carlo probabilities of simple events"
code = '''
using Statistics
{{?model=discrete|continuous|truncated|mixture|convolutions}} [(event = "X <= $(round(t, sigdigits=3))", exact = cdf(d, t), monte_carlo = mean(xs .<= t)) for t in quantile.(d, [0.1, 0.5, 0.9])]
{{?model=multivariate|product}} (all_components_below_mean = mean(all(xs .<= mean(d), dims=1)), some_component_above_mean = 1 - mean(all(xs .<= mean(d), dims=1)))
{{?model=matrixvariate}} (sum_of_entries_above_its_mean = mean(sum.(xs) .> sum(mean(d))),)
'''

