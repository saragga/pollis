{{?model=discrete|continuous|truncated|mixture|convolutions}} (tail_ratio = tail_ratio, normal = 3.45, reading = tail_ratio > 4 ? "heavier right tail than the normal" : tail_ratio < 3 ? "lighter right tail than the normal" : "normal-like right tail")
{{?model=multivariate|product}} cor(transpose(xs))
{{?model=matrixvariate}} cor(reduce(hcat, vec.(xs)), dims=2)
