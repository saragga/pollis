[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.discrete]
# Probability mass bars
svg = '''
var h = [6, 16, 26, 30, 24, 14, 7, 3];
var s = '<line x1="4" y1="66" x2="50" y2="66" stroke="currentColor" stroke-width="1" opacity="0.5"/>';
for (var i = 0; i < h.length; i++) {
	s += '<rect x="' + (6 + i * 5.5) + '" y="' + (66 - h[i]) + '" width="3.5" height="' + h[i] + '" fill="currentColor" opacity="0.6"/>';
}
return s;
'''

[miniCharts.continuous]
# Bell-shaped density
svg = '''
var p = '';
for (var i = 0; i <= 44; i++) {
	var x = 5 + i, z = (i - 22) / 7;
	p += (i ? ' L' : 'M') + x + ' ' + (66 - 32 * Math.exp(-z * z / 2)).toFixed(1);
}
return '<line x1="4" y1="66" x2="50" y2="66" stroke="currentColor" stroke-width="1" opacity="0.5"/>'
	+ '<path d="' + p + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
'''

[miniCharts.truncated]
# Density cut off at two bounds
svg = '''
var p = 'M14 66';
for (var i = 9; i <= 35; i++) {
	var x = 5 + i, z = (i - 22) / 7;
	p += ' L' + x + ' ' + (66 - 40 * Math.exp(-z * z / 2)).toFixed(1);
}
p += ' L40 66 Z';
return '<line x1="4" y1="66" x2="50" y2="66" stroke="currentColor" stroke-width="1" opacity="0.5"/>'
	+ '<path d="' + p + '" fill="currentColor" opacity="0.25" stroke="currentColor" stroke-width="1.5"/>'
	+ '<line x1="14" y1="22" x2="14" y2="68" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>'
	+ '<line x1="40" y1="22" x2="40" y2="68" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/>';
'''

[miniCharts.multivariate]
# Contours of a correlated bivariate density
svg = '''
var s = '';
var r = [[20, 9], [14, 6], [7, 3]];
for (var i = 0; i < r.length; i++) {
	s += '<ellipse cx="27" cy="46" rx="' + r[i][0] + '" ry="' + r[i][1] + '" transform="rotate(-35 27 46)" fill="none" stroke="currentColor" stroke-width="1.2" opacity="' + (0.4 + i * 0.3) + '"/>';
}
return s;
'''

[miniCharts.matrixvariate]
# A random matrix of cells
svg = '''
var v = [0.9, 0.3, 0.1, 0.3, 0.8, 0.4, 0.1, 0.4, 0.7];
var s = '';
for (var i = 0; i < 9; i++) {
	s += '<rect x="' + (10 + (i % 3) * 12) + '" y="' + (30 + Math.floor(i / 3) * 12) + '" width="10" height="10" fill="currentColor" opacity="' + v[i] + '"/>';
}
return s;
'''

[miniCharts.mixture]
# Two-component bimodal density
svg = '''
var p = '';
for (var i = 0; i <= 44; i++) {
	var x = 5 + i, a = (i - 13) / 5, b = (i - 32) / 6;
	p += (i ? ' L' : 'M') + x + ' ' + (66 - 30 * Math.exp(-a * a / 2) - 20 * Math.exp(-b * b / 2)).toFixed(1);
}
return '<line x1="4" y1="66" x2="50" y2="66" stroke="currentColor" stroke-width="1" opacity="0.5"/>'
	+ '<path d="' + p + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
'''

[miniCharts.product]
# Independent marginals along both axes
svg = '''
var px = '', py = '';
for (var i = 0; i <= 30; i++) {
	var z = (i - 15) / 5, f = 12 * Math.exp(-z * z / 2);
	px += (i ? ' L' : 'M') + (18 + i) + ' ' + (70 - f).toFixed(1);
	py += (i ? ' L' : 'M') + (14 - f).toFixed(1) + ' ' + (58 - i);
}
var s = '<line x1="16" y1="70" x2="50" y2="70" stroke="currentColor" stroke-width="1" opacity="0.5"/>'
	+ '<line x1="14" y1="24" x2="14" y2="60" stroke="currentColor" stroke-width="1" opacity="0.5"/>';
for (var j = 0; j < 9; j++) {
	s += '<circle cx="' + (24 + (j % 3) * 9) + '" cy="' + (34 + Math.floor(j / 3) * 9) + '" r="1.8" fill="currentColor" opacity="0.5"/>';
}
return s + '<path d="' + px + '" fill="none" stroke="currentColor" stroke-width="1.3"/>'
	+ '<path d="' + py + '" fill="none" stroke="currentColor" stroke-width="1.3"/>';
'''

[miniCharts.convolutions]
# Two narrow densities and their wider sum
svg = '''
function curve(c, w, h) {
	var p = '';
	for (var i = 0; i <= 44; i++) {
		var z = (i - c) / w;
		p += (i ? ' L' : 'M') + (5 + i) + ' ' + (66 - h * Math.exp(-z * z / 2)).toFixed(1);
	}
	return p;
}
return '<line x1="4" y1="66" x2="50" y2="66" stroke="currentColor" stroke-width="1" opacity="0.5"/>'
	+ '<path d="' + curve(10, 3.5, 26) + '" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>'
	+ '<path d="' + curve(20, 3.5, 26) + '" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>'
	+ '<path d="' + curve(30, 5, 18) + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
'''

