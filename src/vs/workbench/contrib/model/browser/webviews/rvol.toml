O, H, L, C = Float64.({{open}}), Float64.({{high}}), Float64.({{low}}), Float64.({{close}})
T = {{periods}}  # trading periods per year
est(O, H, L, C; T=1) = parkinson(H, L; trading_periods=T)  # high-low range; assumes no drift and no overnight gaps
