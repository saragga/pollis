[[codeBranches]]
model = "yz"
code = '''
using RangeVol

O, H, L, C = Float64.({{open}}), Float64.({{high}}), Float64.({{low}}), Float64.({{close}})
T = {{periods}}  # trading periods per year
est(O, H, L, C; T=1) = yang_zhang(O, H, L, C; trading_periods=T)  # robust to drift and overnight gaps
sigma = est(O, H, L, C; T=T)

(annualised_pct = round(100sigma, digits=2), daily_pct = round(100est(O, H, L, C), digits=3), observations = length(C))
'''

[[codeBranches]]
model = "abd"
code = '''
using RangeVol, Statistics

O, H, L, C = Float64.({{open}}), Float64.({{high}}), Float64.({{low}}), Float64.({{close}})
T = {{periods}}  # trading periods per year
lr = alizadeh_brandt_diebold(H, L)  # daily log-range log(H/L): the observation for a log-volatility state-space model
# Under geometric Brownian motion E[log(log(H/L))] = log(sigma_daily) + 0.43 (sd 0.29), which gives an implied volatility
est(O, H, L, C; T=1) = exp(mean(log.(filter(>(0), alizadeh_brandt_diebold(H, L)))) - 0.43) * sqrt(T)
sigma = est(O, H, L, C; T=T)

(annualised_pct = round(100sigma, digits=2), daily_pct = round(100est(O, H, L, C), digits=3),
 mean_log_range = round(mean(log.(filter(>(0), lr))), digits=3), sd_log_range = round(std(log.(filter(>(0), lr))), digits=3))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "rolling-vol"
label = "Rolling Volatility"
desc = "Annualised volatility over a rolling window for this estimator, against close-to-close: the range-based line is smoother because each day carries more information"
code = '''
using Plots
w = {{window}}
roll(f) = [f(O[i-w+1:i], H[i-w+1:i], L[i-w+1:i], C[i-w+1:i]; T=T) for i in w:length(C)]
ctc_f(O, H, L, C; T=1) = close_to_close(C; trading_periods=T)
Plots.plot(w:length(C), 100 .* roll(ctc_f), lw=1, alpha=0.6, label="close-to-close", xlabel="day", ylabel="annualised volatility (%)")
Plots.plot!(w:length(C), 100 .* roll(est), lw=1.8, label="this estimator", title="Rolling {{window}}-day volatility")
'''

[[actionGroups.actions]]
id = "range-plot"
label = "Prices and Ranges"
desc = "Closing price inside its daily high-low band, and the daily range log(H/L) that the range-based estimators feed on"
code = '''
using Plots
t = 1:length(C)
p1 = Plots.plot(t, C, ribbon=(C .- L, H .- C), fillalpha=0.3, lw=1, label="close within high-low", ylabel="price")
p2 = Plots.bar(t, 100 .* log.(H ./ L), lw=0, label="daily range log(H/L) (%)", xlabel="day")
Plots.plot(p1, p2, layout=(2, 1), link=:x)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "clustering"
label = "Volatility Clustering"
desc = "Autocorrelation of squared returns and of the daily range with a Ljung-Box test: persistent volatility means a single full-sample number hides a lot, so look at the rolling estimates"
code = '''
using StatsBase, HypothesisTests, Plots
r = diff(log.(C))  # daily log-returns
lags = 1:20
acf = hcat(autocor(r .^ 2, lags), autocor(log.(H ./ L), lags))
Plots.plot(lags, acf, marker=:circle, label=["squared returns" "daily range"], xlabel="lag", ylabel="autocorrelation")
display(Plots.hline!([-1.96, 1.96] ./ sqrt(length(r)), ls=:dash, color=:gray, label="95% band"))
(ljung_box_squared_returns_p = pvalue(LjungBoxTest(r .^ 2, 20)), ljung_box_range_p = pvalue(LjungBoxTest(log.(H ./ L), 20)))
'''

[[actionGroups.actions]]
id = "assumptions"
label = "Drift and Overnight Gaps"
desc = "Checks the assumptions that separate the estimators: a trend in prices biases Parkinson and Garman-Klass, overnight gaps bias every estimator that ignores the close-to-open jump; also flags inconsistent OHLC rows"
code = '''
using Statistics
r = diff(log.(C))  # close-to-close returns
ro = log.(O[2:end] ./ C[1:end-1])  # overnight: previous close to open
rc = log.(C ./ O)  # intraday: open to close
drift_t = mean(r) / (std(r) / sqrt(length(r)))
gap_share = var(ro) / (var(ro) + var(rc))
bad_rows = count((H .< max.(O, C)) .| (L .> min.(O, C)))
(drift_t_stat = round(drift_t, digits=2), overnight_variance_share = round(gap_share, digits=3),
 zero_range_days = count(H .== L), inconsistent_ohlc_rows = bad_rows,
 advice = gap_share > 0.1 ? "overnight gaps matter: prefer Yang-Zhang or GK-Yang-Zhang" :
          abs(drift_t) > 2 ? "noticeable drift: prefer Rogers-Satchell or Yang-Zhang" :
          "gaps and drift are small: Parkinson and Garman-Klass are fine")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forecast"
label = "Volatility Forecast"
desc = "Persistence forecast: the volatility of the last window carried forward over the horizon, scaled by the square root of time, with the implied 95% price band"
code = '''
w, h = {{window}}, {{h}}
s_now = est(O[end-w+1:end], H[end-w+1:end], L[end-w+1:end], C[end-w+1:end])  # daily volatility of the last window
s_h = s_now * sqrt(h)  # volatility over the horizon
(daily_pct = round(100s_now, digits=3), annualised_pct = round(100s_now * sqrt(T), digits=2),
 horizon_pct = round(100s_h, digits=2), price_band_95 = round.(C[end] .* exp.((-1.96s_h, 1.96s_h)), digits=2),
 full_sample_annualised_pct = round(100sigma, digits=2))
'''

[[actionGroups.actions]]
id = "backtest"
label = "Forecast Backtest"
desc = "Each rolling estimate forecasts the realised volatility of the next window; RMSE and correlation of this estimator against close-to-close show whether the extra efficiency pays off out of sample"
code = '''
using Statistics
w = {{window}}
r = diff(log.(C))  # r[i] is the return from day i to day i+1
idx = w:(length(C) - w)
f_this = [est(O[i-w+1:i], H[i-w+1:i], L[i-w+1:i], C[i-w+1:i]) for i in idx]
f_ctc = [close_to_close(C[i-w+1:i]) for i in idx]
realised = [sqrt(mean(r[i:i+w-1] .^ 2)) for i in idx]  # next-window realised volatility
rmse(f) = round(100sqrt(mean((f .- realised) .^ 2)), digits=4)
(windows = length(idx), rmse_this_pct = rmse(f_this), rmse_close_to_close_pct = rmse(f_ctc),
 correlation_this = round(cor(f_this, realised), digits=3), correlation_close_to_close = round(cor(f_ctc, realised), digits=3))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-all"
label = "All Estimators"
desc = "All seven estimators on the same data with their theoretical efficiency relative to close-to-close; large disagreements point to drift, gaps or bad OHLC rows"
code = '''
using RangeVol, Statistics
abd(H, L) = exp(mean(log.(filter(>(0), alizadeh_brandt_diebold(H, L)))) - 0.43)
rows = [("Close-to-Close", close_to_close(C; trading_periods=T), "1 (baseline)"),
        ("Parkinson", parkinson(H, L; trading_periods=T), "about 5.2"),
        ("Garman-Klass", garman_klass(O, H, L, C; trading_periods=T), "about 7.4"),
        ("Rogers-Satchell", rogers_satchell(O, H, L, C; trading_periods=T), "about 8, drift-free"),
        ("GK-Yang-Zhang", garman_klass_yang_zhang(O, H, L, C; trading_periods=T), "Garman-Klass with gaps"),
        ("Yang-Zhang", yang_zhang(O, H, L, C; trading_periods=T), "about 14"),
        ("Alizadeh-Brandt-Diebold", abd(H, L) * sqrt(T), "implied from log-range")]
[(estimator = e, annualised_pct = round(100v, digits=2), efficiency = k) for (e, v, k) in rows]
'''

[[actionGroups.actions]]
id = "compare-garch"
label = "Compare with GARCH"
desc = "GARCH(1,1) conditional volatility from close-to-close returns against the rolling range-based estimate: GARCH reacts to shocks, the range estimate measures what happened inside each day"
code = '''
using ARCHModels, Statistics, Plots
r = diff(log.(C))
am = fit(GARCH{1, 1}, r)  # GARCH(1,1) by maximum likelihood
g = volatilities(am)  # conditional standard deviation per day
w = {{window}}
rolling = [est(O[i-w+1:i], H[i-w+1:i], L[i-w+1:i], C[i-w+1:i]) for i in w:length(C)]
Plots.plot(2:length(C), 100sqrt(T) .* g, lw=1, label="GARCH(1,1)", xlabel="day", ylabel="annualised volatility (%)")
display(Plots.plot!(w:length(C), 100sqrt(T) .* rolling, lw=1.8, label="this estimator, {{window}}-day"))
(garch_latest_pct = round(100sqrt(T) * g[end], digits=2), garch_mean_pct = round(100sqrt(T) * mean(g), digits=2),
 this_latest_pct = round(100sqrt(T) * rolling[end], digits=2), this_full_sample_pct = round(100sigma, digits=2))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "annualisation"
label = "Time Scaling"
desc = "The same volatility over a day, a week, a month and a year: volatility scales with the square root of time when returns are uncorrelated"
code = '''
s = est(O, H, L, C)  # daily volatility
(daily_pct = round(100s, digits=3), weekly_pct = round(100s * sqrt(5), digits=2),
 monthly_pct = round(100s * sqrt(21), digits=2), annualised_pct = round(100s * sqrt(T), digits=2),
 rule = "sigma over k days = daily sigma x sqrt(k)")
'''

[[actionGroups.actions]]
id = "efficiency"
label = "Empirical Efficiency"
desc = "Relative sampling variance of this estimator against close-to-close over non-overlapping windows: above 1 means it pins down volatility with fewer days of data (genuine volatility changes add to both, so this understates the theoretical gain)"
code = '''
using Statistics
w = {{window}}
blocks = [(i - w + 1):i for i in w:w:length(C)]
ctc_b = [close_to_close(C[b]) for b in blocks]
this_b = [est(O[b], H[b], L[b], C[b]) for b in blocks]
cv2(x) = var(x) / mean(x)^2  # squared coefficient of variation
(windows = length(blocks), cv_close_to_close = round(sqrt(cv2(ctc_b)), digits=3), cv_this = round(sqrt(cv2(this_b)), digits=3),
 empirical_efficiency = round(cv2(ctc_b) / cv2(this_b), digits=2))
'''
