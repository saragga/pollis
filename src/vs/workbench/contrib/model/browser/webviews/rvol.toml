[[decisionRows]]
task = "Close-to-Close"
context = "Only closing prices are available, or a textbook baseline is needed"
purpose = "Sample standard deviation of daily log-returns; unbiased but the least efficient use of the data"

[[decisionRows]]
task = "Parkinson"
context = "High and low prices, negligible drift and no overnight trading gaps (24-hour markets such as FX or crypto)"
purpose = "Uses the daily high-low range only; about 5 times more efficient than close-to-close"

[[decisionRows]]
task = "Garman-Klass"
context = "Full OHLC data, negligible drift and no overnight gaps"
purpose = "Adds the open-to-close return to the range; about 7 times more efficient than close-to-close"

[[decisionRows]]
task = "Rogers-Satchell"
context = "Full OHLC data from a trending asset without large overnight gaps"
purpose = "Drift-independent range estimator; stays unbiased when prices trend within the day"

[[decisionRows]]
task = "GK-Yang-Zhang"
context = "Full OHLC data from an exchange that closes overnight"
purpose = "Garman-Klass plus the overnight close-to-open jump, so gaps are no longer ignored"

[[decisionRows]]
task = "Yang-Zhang"
context = "Full OHLC data with both drift and overnight gaps: the usual case for equities"
purpose = "Minimum-variance blend of overnight, open-to-close and Rogers-Satchell variances; about 14 times more efficient"

[[decisionRows]]
task = "Alizadeh-Brandt-Diebold"
context = "Building a stochastic-volatility or state-space model of log-volatility"
purpose = "The log of the daily range is nearly Gaussian around log-volatility, which makes it a clean observation for a Kalman filter"

[[inputs]]
id = "open"
label = "Open prices (O)"
tooltip = "Vector of daily opening prices, oldest first. All four price vectors must have the same length."
default = "open"

[[inputs]]
id = "high"
label = "High prices (H)"
tooltip = "Vector of daily high prices."
default = "high"

[[inputs]]
id = "low"
label = "Low prices (L)"
tooltip = "Vector of daily low prices."
default = "low"

[[inputs]]
id = "close"
label = "Close prices (C)"
tooltip = "Vector of daily closing prices."
default = "close"

[[inputs]]
id = "periods"
label = "Trading periods"
tooltip = "Periods per year used to annualise: 252 for equities, 260 for FX, 365 for crypto."
default = "252"
newRow = true

[[inputs]]
id = "window"
label = "Window (days)"
tooltip = "Rolling window used by the rolling, forecast, backtest and efficiency actions. Typical: 20 to 60."
default = "30"

[[inputs]]
id = "h"
label = "Horizon (days)"
tooltip = "Forecast horizon in trading days for the Predict actions."
default = "10"

