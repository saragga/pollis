[[bullets]]
text = "Close-to-Close"
detail = "classical baseline; sample std of log-returns, annualised by √T"

[[bullets]]
text = "Parkinson"
detail = "high-low range; ~5.2× more efficient than close-to-close"

[[bullets]]
text = "Garman-Klass"
detail = "OHLC estimator; ~7.4× more efficient; assumes zero drift and no overnight gaps"

[[bullets]]
text = "Rogers-Satchell"
detail = "OHLC estimator; drift-independent; ~8× more efficient"

[[bullets]]
text = "Garman-Klass-Yang-Zhang"
detail = "extends Garman-Klass to account for overnight price gaps"

[[bullets]]
text = "Yang-Zhang"
detail = "minimum-variance combination of overnight, open-to-close, and Rogers-Satchell; ~14× more efficient"

[[bullets]]
text = "Alizadeh-Brandt-Diebold"
detail = "log-range proxy log(H/L); near-Gaussian signal for latent log-volatility"

