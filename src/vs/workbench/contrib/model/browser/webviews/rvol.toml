[[codeBranches]]
model = "ctc"
code = '''
using RangeVol

O, H, L, C = Float64.({{open}}), Float64.({{high}}), Float64.({{low}}), Float64.({{close}})
T = {{periods}}  # trading periods per year
est(O, H, L, C; T=1) = close_to_close(C; trading_periods=T)  # std of daily log-returns; uses closes only
sigma = est(O, H, L, C; T=T)

(annualised_pct = round(100sigma, digits=2), daily_pct = round(100est(O, H, L, C), digits=3), observations = length(C))
'''

[[codeBranches]]
model = "park"
code = '''
