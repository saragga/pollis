[[decisionRows]]
task = "ARX"
context = "A(q)y = B(q)u + e"
purpose = "Autoregressive model with exogenous input, fast linear least-squares fit via arx"

[[decisionRows]]
task = "ARMAX"
context = "A(q)y = B(q)u + C(q)e"
purpose = "ARX with coloured noise model, C(q) shapes the noise spectrum independently"

[[decisionRows]]
task = "N4SID"
context = "State-space: x′ = Ax + Bu + Ke, y = Cx + Du"
purpose = "Subspace identification of state-space models; handles MIMO systems and unknown model order"

[[decisionRows]]
task = "OE"
context = "y = [B(q)/F(q)]u + e"
purpose = "Output-error model, plant dynamics decoupled from noise model"

[[inputs]]
id = "y"
label = "Output data (y)"
tooltip = "Measured output signal (n x 1 vector). Must be sampled at constant rate h."
default = "y"

[[inputs]]
id = "u"
label = "Input data (u)"
tooltip = "Measured input signal (n x 1 for SISO, n x m for MIMO). Use a persistently exciting signal for accurate identification."
default = "u"

[[inputs]]
id = "h"
label = "h"
tooltip = "Sample time in seconds. Must be constant throughout the experiment."
default = "0.01"

[[inputs]]
id = "na"
label = "na"
tooltip = "Order of the A(q) polynomial (autoregressive part). Number of past outputs used to predict the current output."
default = "2"
models = ["arx", "armax"]

[[inputs]]
id = "nb"
label = "nb"
tooltip = "Order of the B(q) polynomial (exogenous input part). Number of past inputs used in the model."
default = "2"
models = ["arx", "armax"]

[[inputs]]
id = "nc"
label = "nc"
tooltip = "Order of the C(q) polynomial (moving-average noise model). Only used in ARMAX."
default = "1"
models = ["armax"]

[[inputs]]
id = "nf"
label = "nf"
tooltip = "Order of the F(q) polynomial (denominator of plant transfer function). Only used in OE models."
default = "2"
models = ["oe"]

[[inputs]]
id = "nk"
label = "nk"
tooltip = "Input delay (dead time) in samples. Use nk=1 when there is no extra delay beyond the inherent one-step delay."
default = "1"
models = ["arx", "armax"]

[[inputs]]
id = "nx"
label = "nx"
tooltip = "Number of states (model order) for the identified state-space system. Use model order selection (svd plot) to choose nx."
default = "4"
models = ["n4sid"]

[[inputs]]
id = "l"
label = "l (horizon)"
tooltip = "Future horizon for the subspace algorithm. Larger values improve accuracy but increase computation. Leave blank for automatic selection."
default = ""
models = ["n4sid"]

[[codeBranches]]
model = "arx"
code = '''
using ControlSystemIdentification, ControlSystems, LinearAlgebra, Plots  # SI toolbox

data = iddata({{y}}, {{u}}, {{h}})  # create identification dataset
ntr = round(Int, 0.7 * length(data))  # first 70% for estimation, last 30% held out for validation
dtr, dval = data[1:ntr], data[ntr+1:end]

fitm(d) = arx(d, {{na}}, {{nb}}; inputdelay = {{nk}})  # ARX: A(q)y = B(q)u + e, input delay nk
model = fitm(dtr)

# The package predicts h > 1 steps only for state-space models, so build the predictor of A(q)y = B(q)u + C(q)e
function predictor(G, c = Float64[])  # innovation form in observer canonical form (Ljung, ch. 4), C = 1 + c1/q + ...
    a, b = denvec(G)[1], numvec(G)[1]
    b = [zeros(length(a) - length(b)); b]  # B over the same powers of z as A
    n = max(length(a) - 1, length(c))
    pad(v, m) = [v; zeros(m - length(v))]  # extra powers of 1/q with zero coefficients
    a, b, c = pad(a, n + 1), pad(b, n + 1), pad(c, n)
    F = [-a[2:end] [I(n - 1); zeros(1, n - 1)]]
    sys = ss(F, reshape(b[2:end] .- b[1] .* a[2:end], n, 1), [1 zeros(1, n - 1)], fill(b[1], 1, 1), G.Ts)
    PredictionStateSpace(sys, reshape(c .- a[2:end], n, 1))  # innovation gain K = c - a
end
pmodel = predictor(model)  # predictor with the ARX noise model 1/A

println(model)  # display identified model
println("Validation fit (simulation): ", round(modelfit(vec(output(dval)), vec(simulate(model, dval))), digits = 2), "%")
bodeplot(model)  # Bode plot of frequency response
'''

[[codeBranches]]
model = "armax"
code = '''
using ControlSystemIdentification, ControlSystems, LinearAlgebra, Plots  # SI toolbox

data = iddata({{y}}, {{u}}, {{h}})  # create identification dataset
ntr = round(Int, 0.7 * length(data))  # first 70% for estimation, last 30% held out for validation
dtr, dval = data[1:ntr], data[ntr+1:end]

zd = tf(1, [1; zeros({{nk}} - 1)], {{h}})  # pure delay of nk - 1 samples (armax has a built-in delay of one)
function fitm(d; noise = false)
    k = {{nk}}
    ds = iddata(output(d)[:, k:end], input(d)[:, 1:end-k+1], d.Ts)  # shift the input by nk - 1 samples
    G, Gn = armax(ds, {{na}}, {{nb}}, {{nc}})  # ARMAX: A(q)y = B(q)u + C(q)e; returns system and noise model (its numerator holds c1..cnc)
    noise ? (G * zd, Gn) : G * zd  # restore the delay
end
model, noisemodel = fitm(dtr; noise = true)

# The package predicts h > 1 steps only for state-space models, so build the predictor of A(q)y = B(q)u + C(q)e
function predictor(G, c = Float64[])  # innovation form in observer canonical form (Ljung, ch. 4), C = 1 + c1/q + ...
    a, b = denvec(G)[1], numvec(G)[1]
    b = [zeros(length(a) - length(b)); b]  # B over the same powers of z as A
    n = max(length(a) - 1, length(c))
    pad(v, m) = [v; zeros(m - length(v))]  # extra powers of 1/q with zero coefficients
    a, b, c = pad(a, n + 1), pad(b, n + 1), pad(c, n)
    F = [-a[2:end] [I(n - 1); zeros(1, n - 1)]]
    sys = ss(F, reshape(b[2:end] .- b[1] .* a[2:end], n, 1), [1 zeros(1, n - 1)], fill(b[1], 1, 1), G.Ts)
    PredictionStateSpace(sys, reshape(c .- a[2:end], n, 1))  # innovation gain K = c - a
end
pmodel = predictor(model, numvec(noisemodel)[1])  # predictor with the ARMAX noise model C/A

println(model)  # display identified model
println("Validation fit (simulation): ", round(modelfit(vec(output(dval)), vec(simulate(model, dval))), digits = 2), "%")
bodeplot(model)  # Bode plot of frequency response
'''

[[codeBranches]]
model = "n4sid"
code = '''
using ControlSystemIdentification, ControlSystems, Plots  # SI toolbox

data = iddata({{y}}, {{u}}, {{h}})  # create identification dataset
ntr = round(Int, 0.7 * length(data))  # first 70% for estimation, last 30% held out for validation
dtr, dval = data[1:ntr], data[ntr+1:end]

{{?l=}} fitm(d) = n4sid(d, {{nx}})  # subspace ID: state-space, nx={{nx}} states
{{?l!=}} fitm(d) = n4sid(d, {{nx}}; i = {{l}})  # subspace ID: state-space, nx states, horizon {{l}}
model = fitm(dtr)
pmodel = model  # already a predictor model (Kalman gain for N4SID; noise model 1 for OE)

println(model)  # display identified model
println("Validation fit (simulation): ", round(modelfit(vec(output(dval)), vec(simulate(model, dval))), digits = 2), "%")
bodeplot(model)  # Bode plot of frequency response
'''

[[codeBranches]]
model = "oe"
code = '''
using ControlSystemIdentification, ControlSystems, Plots  # SI toolbox

data = iddata({{y}}, {{u}}, {{h}})  # create identification dataset
ntr = round(Int, 0.7 * length(data))  # first 70% for estimation, last 30% held out for validation
dtr, dval = data[1:ntr], data[ntr+1:end]

# The package has no polynomial OE estimator; minimising the simulation error (focus = :simulation, noise model 1)
# is the OE criterion, here in state-space form with nf = {{nf}} poles
fitm(d) = first(newpem(d, {{nf}}; focus = :simulation, show_trace = false))  # returns (model, x0, optimiser result)
model = fitm(dtr)
pmodel = model  # already a predictor model (Kalman gain for N4SID; noise model 1 for OE)

println(model)  # display identified model
println("Validation fit (simulation): ", round(modelfit(vec(output(dval)), vec(simulate(model, dval))), digits = 2), "%")
bodeplot(model)  # Bode plot of frequency response
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "bode-plot"
label = "Bode Plot"
desc = "Frequency response magnitude and phase of the identified model"
code = '''
using ControlSystemIdentification, ControlSystems, Plots  # SI + plotting

bodeplot(model)  # magnitude and phase vs. frequency
'''

[[actionGroups.actions]]
id = "predicted-output"
label = "Predicted Output"
desc = "One-step-ahead prediction overlaid on the held-out validation data. N4SID uses its Kalman predictor; ARX and ARMAX use their innovation-form predictor (noise model 1/A or C/A); OE has no noise model, so its prediction equals simulation"
code = '''
using ControlSystemIdentification, Plots  # SI + plotting

predplot(pmodel, dval)  # predicted vs. measured output on validation data
'''

[[actionGroups.actions]]
id = "pole-zero-map"
label = "Pole-Zero Map"
desc = "Poles and zeros of the identified transfer function"
code = '''
using ControlSystemIdentification, ControlSystems, Plots  # SI + plotting

pzmap(model)  # poles marked with x, zeros with o
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residual-analysis"
label = "Residual Analysis"
desc = "Autocorrelation of the validation residuals and their cross-correlation with the input: a good model leaves white residuals uncorrelated with past inputs"
code = '''
using ControlSystemIdentification, Plots  # SI + plotting

residualplot(pmodel, dval)  # auto- and cross-correlation of one-step prediction errors on validation data; should be white
'''

[[actionGroups.actions]]
id = "fit-percent"
label = "Fit Percentage"
desc = "NRMSE fit of the simulated output on the held-out validation data: 100 * (1 - norm(y - yhat) / norm(y - mean(y))). 100% is perfect, 0% is no better than the mean; it is a norm ratio, not variance explained"
code = '''
using ControlSystemIdentification  # SI toolbox

yv  = vec(output(dval))  # held-out measured output
ysim = vec(simulate(model, dval))  # free-run simulation from the validation input (initial state estimated)
fit = modelfit(yv, ysim)  # NRMSE fit in percent
println("Validation fit (simulation): ", round(fit, digits = 2), "%")
println("Estimation fit (simulation): ", round(modelfit(vec(output(dtr)), vec(simulate(model, dtr))), digits = 2), "%  (a much higher value suggests overfitting)")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "simulate"
label = "Simulate"
desc = "Free-run simulation of the identified model driven by a new random input, beside its simulation on the held-out validation data"
code = '''
using ControlSystemIdentification, ControlSystems, Plots  # SI + control

u_new = randn(1, 200)  # new test input (200 samples)
res = lsim(model, u_new)  # free-run simulation from zero initial state
p1 = plot(res, title = "Response to a new random input")
p2 = simplot(model, dval)  # simulated vs. measured output on validation data
plot(p1, p2, layout = (2, 1), size = (700, 600))
'''

[[actionGroups.actions]]
id = "predict-kstep"
label = "k-Step Prediction"
desc = "5-step-ahead prediction on the validation data. N4SID uses its Kalman predictor; ARX and ARMAX use their innovation-form predictor (noise model 1/A or C/A); OE has no noise model, so its prediction equals simulation"
code = '''
using ControlSystemIdentification, Plots  # SI + plotting

predplot(pmodel, dval; h = 5)  # 5-step predictions vs. measured
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "order-selection"
label = "Order Selection"
desc = "Refit the current structure over a grid of orders and rank them by simulation fit on the held-out validation data, which penalises overfitting directly"
code = '''
using ControlSystemIdentification, ControlSystems  # SI toolbox

vfit(m) = modelfit(vec(output(dval)), vec(simulate(m, dval)))  # validation NRMSE fit
{{?model=arx}} grid = [(na, nb) => arx(dtr, na, nb; inputdelay = {{nk}}) for na in 1:4 for nb in 1:4]
{{?model=armax}} grid = [(na, nb) => first(armax(dtr, na, nb, {{nc}})) for na in 1:4 for nb in 1:na]  # armax needs nb <= na; delay of one sample
{{?model=n4sid}} grid = [nx => n4sid(dtr, nx) for nx in 1:8]
{{?model=oe}} grid = [nf => first(newpem(dtr, nf; focus = :simulation, show_trace = false)) for nf in 1:4]
scores = sort([o.first => vfit(o.second) for o in grid], by = last, rev = true)
foreach(s -> println(rpad(string(s.first), 10), " validation fit = ", round(s.second, digits = 2), "%"), scores)
'''

[[actionGroups.actions]]
id = "compare-structures"
label = "Compare Structures"
desc = "ARX, ARMAX, N4SID and simulation-focused (OE) models fitted to the same estimation data, compared by validation fit and frequency response"
code = '''
using ControlSystemIdentification, ControlSystems, Plots  # SI + plotting

vfit(m) = modelfit(vec(output(dval)), vec(simulate(m, dval)))  # validation NRMSE fit
cands = [
    "ARX"   => arx(dtr, {{na}}, {{nb}}; inputdelay = {{nk}}),
    "ARMAX" => first(armax(dtr, {{na}}, {{nb}}, {{nc}})),  # delay of one sample
    "N4SID" => n4sid(dtr, {{nx}}),
    "OE"    => first(newpem(dtr, {{nf}}; focus = :simulation, show_trace = false)),
]
foreach(c -> println(rpad(c.first, 7), " validation fit = ", round(vfit(c.second), digits = 2), "%"), cands)
bodeplot(last.(cands); label = permutedims(first.(cands)))  # compare frequency responses
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "transfer-function"
label = "Transfer Function"
desc = "Extract and display the identified discrete-time transfer function"
code = '''
using ControlSystemIdentification, ControlSystems  # SI + control

G = tf(model)  # discrete-time transfer function
println(G)  # display B(q)/A(q)
println(poles(G))  # display poles
println(tzeros(G))  # display transmission zeros
'''

[[actionGroups.actions]]
id = "uncertainty"
label = "Parameter Uncertainty"
desc = "ARX: coefficient means and standard deviations from the least-squares covariance. All models: refit on each half of the estimation data and overlay the Bode plots; large differences mean poorly determined dynamics"
code = '''
using ControlSystemIdentification, ControlSystems, Plots  # SI + control + plotting

{{?model=arx}} println(arx(dtr, {{na}}, {{nb}}; inputdelay = {{nk}}, stochastic = true))  # coefficients as mean +/- std (MonteCarloMeasurements particles)
m = div(length(dtr), 2)
halves = [fitm(dtr[1:m]), fitm(dtr[m+1:end])]  # split-sample refits
bodeplot([model; halves]; label = ["all estimation data" "first half" "second half"])
'''
