[[models]]
id = "lyap"
label = "Lyapunov Exponents"

[[models]]
id = "fracdim"
label = "Fractal Dimension"

[[models]]
id = "rqa"
label = "Recurrence (RQA)"

[[bullets]]
text = "Lyapunov Exponents"
detail = "quantify the average exponential rate of divergence of nearby trajectories; positive maximal exponent indicates chaos"

[[bullets]]
text = "Fractal Dimension"
detail = "estimate the self-similar geometry of an attractor via the correlation dimension (Grassberger–Procaccia)"

[[bullets]]
text = "Recurrence Analysis (RQA)"
detail = "build a recurrence matrix from a time series and extract quantifiers such as RR, DET, and LAM"

[[inputs]]
id = "x"
label = "Time series (x)"
tooltip = "A univariate time series vector. For Lyapunov and fractal dimension this can also be a trajectory matrix from trajectory(ds, T)."
default = "x"

[[inputs]]
id = "T"
label = "Integration time (T)"
tooltip = "Total time for ODE integration or number of map iterations used to generate the trajectory before characterisation."
default = "200"

[[inputs]]
id = "eps"
label = "Threshold (epsilon, fraction of sd)"
tooltip = "Recurrence threshold as a fraction of the sd of x: two states are recurrent if their distance is below epsilon times sd(x). Typical: 0.05-0.2, or aim for a recurrence rate of 1-5%."
default = "0.1"

[[codeBranches]]
model = "lyap"
code = '''
using DynamicalSystems

ds = Systems.lorenz([1.0, 0.0, 0.0])  # Lorenz (1963), sigma = 10, rho = 28, beta = 8/3
# Ttr discards the transient from (1, 0, 0), so the estimates are taken on the attractor
lambda_max = lyapunov(ds, {{T}}; Ttr = 100)  # maximal Lyapunov exponent
spectrum  = lyapunovspectrum(ds, {{T}}; Ttr = 100)  # full Lyapunov spectrum

println("Max exponent:  ", lambda_max)  # positive => chaotic; zero => periodic or quasiperiodic (a flow always has one zero exponent); negative => stable fixed point
println("Full spectrum: ", spectrum)  # all exponents ordered descending
println("KY dimension:  ", kaplanyorke_dim(spectrum))  # Kaplan-Yorke attractor dimension
'''

[[codeBranches]]
model = "fracdim"
code = '''
using DynamicalSystems

ds = Systems.lorenz([1.0, 0.0, 0.0])  # Lorenz (1963), sigma = 10, rho = 28, beta = 8/3
tr, _ = trajectory(ds, {{T}}; Dt = 0.01, Ttr = 100)  # generate orbit

using FractalDimensions  # correlation dimension module
eps_vals = exp10.(range(-2, 1; length=20))  # log-spaced length scales
D2 = grassberger_proccacia_dim(tr, eps_vals)  # Grassberger-Procaccia dimension

println("Correlation dimension D2: ", D2)  # Lorenz ~ 2.05; a non-integer D2 suggests a strange attractor but does not by itself prove chaos (check the Lyapunov exponent)
'''

[[codeBranches]]
model = "rqa"
code = '''
using DynamicalSystems

using RecurrenceAnalysis, Statistics  # recurrence analysis module

threshold = {{eps}} * std({{x}})  # epsilon is a fraction of the sd of x, so the result does not depend on its units
R = RecurrenceMatrix({{x}}, threshold)  # build recurrence matrix

stats = rqa(R)  # compute all RQA quantifiers
println("RR  (recurrence rate):   ", stats[:RR])  # fraction of recurrent points
println("DET (determinism):       ", stats[:DET])  # fraction in diagonal lines
println("LAM (laminarity):        ", stats[:LAM])  # fraction in vertical lines
println("L   (avg diagonal len):  ", stats[:L])  # average diagonal line length
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "lyap-convergence"
label = "Lyapunov Convergence"
desc = "Plot how the maximal Lyapunov exponent estimate converges as integration time grows"
code = '''
using DynamicalSystems, GLMakie

ds = Systems.lorenz([1.0, 0.0, 0.0])  # Lorenz (1963), sigma = 10, rho = 28, beta = 8/3
Ts = range(10, 500; length=50)  # integration times to test
lambdas = [lyapunov(ds, T; Ttr = 100) for T in Ts]  # estimate at each T

lines(Ts, lambdas, axis=(xlabel="T", ylabel="lambda_max"))  # convergence to true value
'''

[[actionGroups.actions]]
id = "recurrence-plot"
label = "Recurrence Plot"
desc = "Visualise the recurrence matrix as a binary image to identify periodic and chaotic structure"
code = '''
using RecurrenceAnalysis, Statistics, GLMakie

R = RecurrenceMatrix({{x}}, {{eps}} * std({{x}}))  # threshold as a fraction of the sd of x  # build recurrence matrix
heatmap(Array(R), colormap=:binary)  # plot as binary image
'''

[[actionGroups.actions]]
id = "corr-dim-plot"
label = "Correlation Dimension"
desc = "Log-log plot of correlation sum vs length scale to read off the fractal dimension as a slope"
code = '''
using DynamicalSystems, FractalDimensions, GLMakie

ds = Systems.lorenz([1.0, 0.0, 0.0])  # Lorenz (1963), sigma = 10, rho = 28, beta = 8/3
tr, _ = trajectory(ds, {{T}}; Dt = 0.01, Ttr = 100)  # orbit
eps_vals = exp10.(range(-2, 1; length=20))  # scales
Cs = correlationsum(tr, eps_vals)  # correlation sum at each scale

lines(log10.(eps_vals), log10.(Cs), axis=(xlabel="log eps", ylabel="log C(eps)"))  # slope = D2
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "stationarity"
label = "Stationarity Check"
desc = "Split the series in halves and compare their determinism (RQA DET): a large difference suggests the dynamics are not stationary"
code = '''
using RecurrenceAnalysis, Statistics

n = length({{x}})  # series length
threshold = {{eps}} * std({{x}})  # one threshold for both halves, a fraction of the sd of the whole series
R1 = RecurrenceMatrix({{x}}[1:div(n,2)], threshold)  # first half
R2 = RecurrenceMatrix({{x}}[div(n,2)+1:end], threshold)  # second half

s1 = rqa(R1); s2 = rqa(R2)  # RQA on each half
println("DET half 1: ", s1[:DET], "  half 2: ", s2[:DET])  # large difference => non-stationary
'''

[[actionGroups.actions]]
id = "noise-sensitivity"
label = "Noise Sensitivity"
desc = "Add small noise and observe the change in Lyapunov exponent to assess robustness"
code = '''
using DynamicalSystems, Statistics

ds = Systems.lorenz([1.0, 0.0, 0.0])  # Lorenz (1963), sigma = 10, rho = 28, beta = 8/3
lambda_clean = lyapunov(ds, {{T}}; Ttr = 100)  # clean estimate

tr, t = trajectory(ds, {{T}}; Dt = 0.01, Ttr = 100)  # generate orbit
X = Matrix(tr)
X_noisy = X .+ 0.01 .* std(X, dims=1) .* randn(size(X))  # measurement noise of 1% of each variable's sd

ks = 0:4:100  # steps ahead; the exponent is the slope of the log divergence E(k)
slope(E) = cov(ks .* 0.01, E) / var(ks .* 0.01)  # per unit time (Dt = 0.01)
lambda_data  = slope(lyapunov_from_data(StateSpaceSet(X), ks; w=10))  # estimated from the clean orbit
lambda_noisy = slope(lyapunov_from_data(StateSpaceSet(X_noisy), ks; w=10))  # estimated from the noisy orbit

println("From the equations: ", lambda_clean)  # baseline
println("From clean data:    ", lambda_data)
println("From noisy data:    ", lambda_noisy)  # a large change means the estimate is fragile to measurement noise
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "predictability-horizon"
label = "Predictability Horizon"
desc = "Estimate how many time steps ahead the system remains predictable using the Lyapunov time"
code = '''
using DynamicalSystems

ds = Systems.lorenz([1.0, 0.0, 0.0])  # Lorenz (1963), sigma = 10, rho = 28, beta = 8/3
lambda_max = lyapunov(ds, {{T}}; Ttr = 100)  # maximal Lyapunov exponent

T_lyapunov = 1.0 / lambda_max  # Lyapunov time = inverse of max exponent
delta0 = 1e-6  # initial error magnitude
delta_max = 0.1  # acceptable error threshold
T_pred = T_lyapunov * log(delta_max / delta0)  # predictability horizon

println("Lyapunov time:        ", T_lyapunov)  # 1/lambda
println("Predictability horizon: ", T_pred)  # time until error reaches threshold
'''

[[actionGroups.actions]]
id = "embedding-dim"
label = "Embedding Dimension"
desc = "Estimate the delay and minimal embedding dimension (Cao averaged false nearest neighbours) for phase-space reconstruction"
code = '''
using DynamicalSystems

# Delay from the first minimum of the mutual information, dimension from Cao (1997)
# averaged false nearest neighbours, checked up to d = 10
Y, tau, E1 = optimal_separated_de({{x}}, "afnn", "mi_min")  # Y is the embedded series
d_emb = dimension(Y)

println("Optimal delay tau:      ", tau)  # time-delay for embedding
println("Embedding dimension d:  ", d_emb)  # minimum d for unfolding attractor
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "surrogate"
label = "vs Linear Surrogate"
desc = "Compare the Lyapunov exponent of the original data against phase-randomised surrogates"
code = '''
using DynamicalSystems, TimeseriesSurrogates, Statistics

tau = estimate_delay({{x}}, "mi_min")  # embedding delay
d   = 3  # embedding dimension
X   = embed({{x}}, d, tau)  # reconstruct phase space

ks = 0:20  # steps ahead
slope(E) = cov(ks, E) / var(ks)  # exponent per sampling step, from the growth of the log divergence
lam(Y) = slope(lyapunov_from_data(Y, ks; w=10 * tau))  # Theiler window excludes temporal neighbours

surr = surrogenerator({{x}}, RandomFourier())  # phase-randomised surrogate generator
surr_lambdas = [lam(embed(surr(), d, tau)) for _ in 1:19]  # 19 surrogates: a one-sided test at the 5% level

println("Data lambda:     ", lam(X))  # original
println("Surrogate range: ", extrema(surr_lambdas))  # data above every surrogate: nonlinear structure beyond the linear spectrum
'''

[[actionGroups.actions]]
id = "lyap-vs-fracdim"
label = "Lyapunov vs Fractal Dim"
desc = "Compute both the Lyapunov exponent and correlation dimension and check Kaplan-Yorke consistency"
code = '''
using DynamicalSystems, FractalDimensions

ds = Systems.lorenz([1.0, 0.0, 0.0])  # Lorenz (1963), sigma = 10, rho = 28, beta = 8/3
spectrum = lyapunovspectrum(ds, {{T}}; Ttr = 100)  # full spectrum
D_KY = kaplanyorke_dim(spectrum)  # Kaplan-Yorke dimension

tr, _ = trajectory(ds, {{T}}; Dt = 0.01, Ttr = 100)  # orbit
eps_vals = exp10.(range(-2, 1; length=20))  # scales
D2 = grassberger_proccacia_dim(tr, eps_vals)  # correlation dimension

println("Kaplan-Yorke D_KY: ", D_KY)  # from Lyapunov spectrum
println("Correlation D2:    ", D2)  # from GP algorithm; should be close
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "chaos-classification"
label = "Chaos Classification"
desc = "Classify the orbit as periodic, quasiperiodic, or chaotic from the Lyapunov spectrum"
code = '''
using DynamicalSystems

ds = Systems.lorenz([1.0, 0.0, 0.0])  # Lorenz (1963), sigma = 10, rho = 28, beta = 8/3
spectrum = lyapunovspectrum(ds, {{T}}; Ttr = 100)  # full Lyapunov spectrum

lambda1, lambda2 = spectrum[1], spectrum[2]  # the two largest exponents; a flow always has one near zero along the orbit
tol = 0.01  # numerical tolerance for "zero"
if lambda1 > tol
    println("Chaotic: sensitive dependence on ICs")
elseif abs(lambda1) <= tol && abs(lambda2) <= tol
    println("Quasiperiodic: two zero exponents (motion on a torus)")
elseif abs(lambda1) <= tol
    println("Periodic: one zero exponent (a limit cycle)")
else
    println("Stable fixed point: all exponents negative")
end
'''

[[actionGroups.actions]]
id = "rqa-summary"
label = "RQA Summary"
desc = "Print all standard RQA quantifiers and interpret their values for the input series"
code = '''
using RecurrenceAnalysis, Statistics

R = RecurrenceMatrix({{x}}, {{eps}} * std({{x}}))  # threshold as a fraction of the sd of x
s = rqa(R)  # all quantifiers

println("RR:  ", s[:RR],  "  (recurrence rate; near 0 = rare recurrence)")  # density
println("DET: ", s[:DET], "  (determinism; near 1 = predictable)")  # diagonal structure
println("LAM: ", s[:LAM], "  (laminarity; near 1 = laminar phases)")  # vertical structure
println("L:   ", s[:L],   "  (mean diagonal length)")  # avg predictability
println("TT:  ", s[:TT],  "  (trapping time)")  # avg vertical line length
'''
