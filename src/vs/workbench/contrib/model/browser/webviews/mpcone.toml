[[models]]
id = "convex"
label = "Convex Programming"

[[models]]
id = "socp"
label = "Second-Order Cone"

[[models]]
id = "expcone"
label = "Exponential Cone"

[[models]]
id = "powcone"
label = "Power Cone"

[[decisionRows]]
task = "Convex"
context = "Convex objective over linear or convex constraints"
purpose = "JuMP bridges the expression to cones and an interior-point solver certifies the optimum"

[[decisionRows]]
task = "Second-Order Cone"
context = "Norms and Euclidean distances: robust or norm-constrained least squares, portfolio risk"
purpose = "Constraints of the form ||u|| <= t"

[[decisionRows]]
task = "Exponential Cone"
context = "Logs, exponentials and entropy: maximum entropy, logistic losses, geometric programmes"
purpose = "Constraints of the form y exp(x / y) <= z"

[[decisionRows]]
task = "Power Cone"
context = "Powers and p-norms with 1 < p < 2: robust regression, geometric means"
purpose = "Constraints of the form x^a y^(1 - a) >= |z|"

[[inputs]]
id = "n"
label = "n"
tooltip = "Number of decision variables x[1], ..., x[n]."
default = "5"
models = ["convex", "expcone"]

[[inputs]]
id = "obj"
label = "Objective (minimised)"
tooltip = "Convex expression in the vector x, for example sum((x .- 1) .^ 2) or sum(x .^ 2) + x[1]. JuMP reformulates quadratic terms as cones automatically."
default = "sum((x .- (1:n) ./ n) .^ 2)"
models = ["convex"]

[[inputs]]
id = "cons"
label = "Constraint"
tooltip = "One scalar linear constraint in x, for example sum(x) == 1. The Parametric Sweep varies its right-hand side. The variables are also non-negative."
default = "sum(x) == 1"
models = ["convex"]

[[inputs]]
id = "A"
label = "Design Matrix A"
tooltip = "m × n matrix of the regression min ||A x - b||. The default is random data for trying the panel."
default = "randn(40, 5)"
models = ["socp", "powcone"]

[[inputs]]
id = "b"
label = "Response b"
tooltip = "Length-m response vector."
default = "randn(40)"
models = ["socp", "powcone"]

[[inputs]]
id = "radius"
label = "Norm Radius"
tooltip = "Constraint ||x||_2 <= radius on the coefficients (a norm-constrained, ridge-like fit). The Parametric Sweep varies it."
default = "1.0"
models = ["socp"]

[[inputs]]
id = "mu"
label = "Target Mean"
tooltip = "Maximum-entropy distribution on the values 1, ..., n with this mean. Must lie between 1 and n."
default = "2.0"
models = ["expcone"]

[[inputs]]
id = "p"
label = "p"
tooltip = "Exponent of the p-norm loss sum |A x - b|^p. p = 2 is least squares; values nearer 1 are more robust to outliers."
default = "1.5"
models = ["powcone"]

[[inputs]]
id = "solver"
label = "Solver"
tooltip = "Clarabel: interior point, accurate, supports every cone here. COSMO: ADMM, scales to large sparse problems. SCS: first-order splitting, fast but less accurate."
kind = "select"
default = "Clarabel"
newRow = true

[[inputs.options]]
value = "Clarabel"
label = "Clarabel"

[[inputs.options]]
value = "COSMO"
label = "COSMO"

[[inputs.options]]
value = "SCS"
label = "SCS"

