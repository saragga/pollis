[[codeBranches]]
model = "convex"
code = '''
using JuMP, {{solver}}, LinearAlgebra, Random

n = {{n}}  # number of decision variables

model = Model({{solver}}.Optimizer)
set_silent(model)
@variable(model, x[1:n] >= 0)
@objective(model, Min, {{obj}})
con = @constraint(model, {{cons}})

# re-solve with a new right-hand side for the constraint (used by the Parametric Sweep)
resolve(v) = (set_normalized_rhs(con, v); optimize!(model); objective_value(model))
grid = normalized_rhs(con) .* range(0.5, 2, length=15)
param_name = "constraint right-hand side"

optimize!(model)
(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[codeBranches]]
model = "socp"
code = '''
using JuMP, {{solver}}, LinearAlgebra, Random

Random.seed!(1)
A = {{A}}  # m x n design matrix
b = {{b}}  # length-m response
n = size(A, 2)

model = Model({{solver}}.Optimizer)
set_silent(model)
@variable(model, x[1:n])
@variable(model, t)  # epigraph variable for the residual norm
@variable(model, r == {{radius}})  # the radius, fixed so it can be changed later
@constraint(model, [t; A * x - b] in SecondOrderCone())  # t >= ||A x - b||
@constraint(model, [r; x] in SecondOrderCone())  # ||x|| <= radius
@objective(model, Min, t)

resolve(v) = (fix(r, v); optimize!(model); objective_value(model))
grid = range(0.05, 3, length=15)
param_name = "norm radius"

optimize!(model)
(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[codeBranches]]
model = "expcone"
code = '''
using JuMP, {{solver}}, LinearAlgebra, Random

n = {{n}}  # support 1, ..., n
s = 1:n

model = Model({{solver}}.Optimizer)
set_silent(model)
@variable(model, x[1:n] >= 0)  # probabilities
@variable(model, u[1:n])  # u[i] <= -x[i] log x[i]
@constraint(model, [i = 1:n], [u[i]; x[i]; 1] in MOI.ExponentialCone())  # x exp(u / x) <= 1
@constraint(model, sum(x) == 1)
con = @constraint(model, sum(s .* x) == {{mu}})  # mean constraint
@objective(model, Max, sum(u))  # entropy

resolve(v) = (set_normalized_rhs(con, v); optimize!(model); objective_value(model))
grid = range(1.1, n - 0.1, length=15)
param_name = "target mean"

optimize!(model)
(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[codeBranches]]
model = "powcone"
code = '''
using JuMP, {{solver}}, LinearAlgebra, Random

Random.seed!(1)
A = {{A}}  # m x n design matrix
b = {{b}}  # length-m response
n = size(A, 2)

function fit(p)  # minimise sum |A x - b|^p through power cones
    m = Model({{solver}}.Optimizer)
    set_silent(m)
    @variable(m, x[1:n])
    @variable(m, e[1:size(A, 1)])  # e[i] >= |r[i]|^p
    res = A * x - b
    @constraint(m, [i = eachindex(res)], [e[i]; 1; res[i]] in MOI.PowerCone(1 / p))  # e^(1/p) >= |r|
    @objective(m, Min, sum(e))
    optimize!(m)
    m, x
end

p = {{p}}
model, x = fit(p)

resolve(v) = objective_value(fit(v)[1]) ^ (1 / v)  # p-norm of the residuals
grid = range(1.1, 3, length=15)
param_name = "p"

(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "solution-profile"
label = "Solution Profile"
desc = "The optimal x (for the exponential cone, the maximum-entropy distribution with its mean)"
code = '''
using Plots

{{?model!=expcone}} bar(value.(x), xlabel="i", ylabel="x[i]", legend=false)
{{?model=expcone}} bar(s, value.(x), xlabel="value", ylabel="probability", legend=false)
{{?model=expcone}} vline!([{{mu}}], linestyle=:dash)
'''

[[actionGroups.actions]]
id = "residuals"
label = "Residuals and Slacks"
desc = "Regression cones: the distribution of the residuals A x - b. Otherwise: the slack of every scalar constraint and bound"
code = '''
using Plots

{{?model=socp|powcone}} histogram(A * value.(x) - b, bins=20, xlabel="residual", ylabel="count", legend=false)
{{?model=convex|expcone}} cons = [c for c in all_constraints(model; include_variable_in_set_constraints=true)
{{?model=convex|expcone}}         if constraint_object(c).set isa Union{MOI.LessThan, MOI.GreaterThan, MOI.EqualTo}]
{{?model=convex|expcone}} bar([abs(value(c) - MOI.constant(constraint_object(c).set)) for c in cons], xlabel="constraint", ylabel="slack", legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "feasibility"
label = "Status and Feasibility"
desc = "Termination, primal and dual status, and any constraint (cones included) violated by more than 1e-6"
code = '''
(termination = termination_status(model), primal = primal_status(model), dual = dual_status(model),
 violated = primal_feasibility_report(model; atol=1e-6))  # empty Dict = feasible
'''

[[actionGroups.actions]]
id = "duality-gap"
label = "Duality Gap"
desc = "Primal and dual objectives and their relative gap: near 0 certifies optimality"
code = '''
primal = objective_value(model)
dual   = dual_objective_value(model)
(primal = primal, dual = dual, relative_gap = abs(primal - dual) / (1 + abs(primal)))
'''

[[actionGroups.actions]]
id = "solver-stats"
label = "Solver Statistics"
desc = "Solve time and iterations, where the solver reports them"
code = '''
stat(f) = try f(model) catch; missing end
(time = stat(solve_time), iterations = stat(barrier_iterations), raw_status = stat(raw_status))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity Analysis"
desc = "Dual values of every constraint: scalar shadow prices and cone dual vectors"
code = '''
[(constraint = c, dual = dual(c)) for c in all_constraints(model; include_variable_in_set_constraints=false)]
'''

[[actionGroups.actions]]
id = "parametric"
label = "Parametric Sweep"
desc = "Re-solve across a range of the model's key parameter (constraint bound, radius, target mean or p) and plot the optimal value"
code = '''
using Plots

vals = resolve.(grid)
plot(grid, vals, marker=:circle, xlabel=param_name, ylabel="optimal value", legend=false)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "solver-compare"
label = "Solver Comparison"
desc = "Clarabel, COSMO and SCS on the same problem: status, objective and time"
code = '''
using Clarabel, COSMO, SCS

m0 = model
res = map(["Clarabel" => Clarabel.Optimizer, "COSMO" => COSMO.Optimizer, "SCS" => SCS.Optimizer]) do (name, opt)
    set_optimizer(m0, opt)
    set_silent(m0)
    t = @elapsed optimize!(m0)
    (solver = name, status = termination_status(m0), objective = objective_value(m0), seconds = t)
end
set_optimizer(model, {{solver}}.Optimizer); set_silent(model); optimize!(model)  # m0 is the model itself: back on the chosen solver for later actions
res
'''

[[actionGroups.actions]]
id = "baseline"
label = "vs Baseline"
desc = "Convex: the minimiser without the constraint. SOCP: ordinary least squares. Exponential cone: the uniform distribution. Power cone: least squares (p = 2) and least absolute deviations (p near 1)"
code = '''
{{?model=convex}} v0 = objective_value(model)
{{?model=convex}} delete(model, con); optimize!(model)
{{?model=convex}} (constrained = v0, unconstrained = objective_value(model))  # rebuild the model to restore the constraint
{{?model=socp}} xls = A \ b
{{?model=socp}} (constrained = objective_value(model), ols = norm(A * xls - b), ols_coef_norm = norm(xls), radius = value(r))
{{?model=expcone}} (entropy = objective_value(model), uniform_entropy = log(n), uniform_mean = (n + 1) / 2)
{{?model=powcone}} pnorm(xx, q) = sum(abs.(A * xx - b) .^ q) ^ (1 / q)
{{?model=powcone}} x2 = A \ b
{{?model=powcone}} x1 = value.(fit(1.01)[2])
{{?model=powcone}} (this_p = pnorm(value.(x), p), least_squares = pnorm(x2, p), near_lad = pnorm(x1, p), coef_distance_to_ls = norm(value.(x) - x2))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "dual-variables"
label = "Dual Variables"
desc = "Shadow prices of the scalar constraints: the change in the optimal value per unit change in each right-hand side"
code = '''
cons = [c for c in all_constraints(model; include_variable_in_set_constraints=false)
        if constraint_object(c).set isa Union{MOI.LessThan, MOI.GreaterThan, MOI.EqualTo}]
isempty(cons) ? "no scalar constraints: see the cone duals in Sensitivity Analysis" :
    [(constraint = c, shadow_price = shadow_price(c)) for c in cons]
'''

[[actionGroups.actions]]
id = "cone-membership"
label = "Cone Membership"
desc = "For every cone constraint, the distance of the solution to the cone (about 0 = inside) and whether it is on the boundary"
code = '''
cones = [c for c in all_constraints(model; include_variable_in_set_constraints=false)
         if constraint_object(c).set isa Union{MOI.SecondOrderCone, MOI.ExponentialCone, MOI.PowerCone}]
map(cones) do c
    v = value(c)
    (constraint = c, distance = MOI.Utilities.distance_to_set(v, constraint_object(c).set))
end
'''
