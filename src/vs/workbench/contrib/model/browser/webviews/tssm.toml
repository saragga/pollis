[[codeBranches]]
model = "lg"
code = '''
using StateSpaceModels, Random  # state-space models and random number generator
Random.seed!({{lg-seed}})  # fix random seed for reproducibility

n = {{lg-n}}  # number of time steps to simulate

sigma_lev = {{lg-sigma-lev}}  # level disturbance std
{{?lg-model=llt}} sigma_slp = {{lg-sigma-slp}}  # slope disturbance std
sigma_obs = {{lg-sigma-obs}}  # observation noise std

{{?lg-model=ll}} model = LocalLevel(zeros(n))  # y_t = mu_t + eps, mu_{t+1} = mu_t + eta
{{?lg-model=ll}} update_hyperparameters!(model, [sigma_lev, sigma_obs])  # set noise parameters before simulation
{{?lg-model=llt}} model = LocalLinearTrend(zeros(n))  # level + slope state; level_{t+1} = level_t + slope_t + eta1
{{?lg-model=llt}} update_hyperparameters!(model, [sigma_lev, sigma_slp, sigma_obs])  # set level, slope, and obs noise

y, alpha = simulate(model, n)  # simulate n observations and latent state path
'''

[[codeBranches]]
model = "nl"
code = '''
using LowLevelParticleFilters, LinearAlgebra, Random  # particle and Kalman filters, matrix utilities, RNG
Random.seed!({{nl-seed}})  # fix random seed for reproducibility

nx, ny, nu = {{nl-nx}}, {{nl-ny}}, {{nl-nu}}  # state / observation / input dimensions

{{?nl-filter=pf}} function dynamics(x, u, p, t, noise)  # stochastic state transition with additive noise
{{?nl-filter=pf}}     {{nl-dyn}} .+ noise
{{?nl-filter=ukf}} function dynamics(x, u, p, t)  # deterministic state transition function
{{?nl-filter=ukf}}     {{nl-dyn}}
end

function measurement(x, u, p, t)  # nonlinear measurement function
    {{nl-meas}}
end

{{?nl-filter=pf}} noise_dist = MvNormal(zeros(nx), {{nl-sigma-x}}^2 * I)  # process noise distribution
{{?nl-filter=pf}} x0         = MvNormal(zeros(nx), I)  # initial state distribution
{{?nl-filter=pf}}
{{?nl-filter=pf}} pf       = ParticleFilter({{nl-N}}, dynamics, measurement, noise_dist, x0; ny)  # build Particle Filter with {{nl-N}} particles
{{?nl-filter=pf}} sol_sim  = simulate(pf, {{nl-n}})  # simulate {{nl-n}} steps of synthetic data from the nonlinear SSM
{{?nl-filter=pf}} sol_filt = forward_trajectory(pf, sol_sim.u, sol_sim.y)  # filter simulated observations with Particle Filter
{{?nl-filter=ukf}} Q  = {{nl-sigma-x}}^2 * Matrix(I, nx, nx)  # process noise covariance
{{?nl-filter=ukf}} R  = {{nl-sigma-y}}^2 * Matrix(I, ny, ny)  # observation noise covariance
{{?nl-filter=ukf}} x0 = MvNormal(zeros(nx), I)  # initial state distribution
{{?nl-filter=ukf}}
{{?nl-filter=ukf}} ukf      = UnscentedKalmanFilter(dynamics, measurement, Q, R, x0; nu)  # build Unscented Kalman Filter (UKF)
{{?nl-filter=ukf}} sol_sim  = simulate(ukf, {{nl-n}})  # simulate {{nl-n}} steps of synthetic data from the nonlinear SSM
{{?nl-filter=ukf}} sol_filt = forward_trajectory(ukf, sol_sim.u, sol_sim.y)  # filter simulated observations with UKF
'''

[[codeBranches]]
model = "custom"
code = '''
using StateSpaceModels, LinearAlgebra, Random  # SSM, matrix utilities, RNG
Random.seed!({{c-seed}})  # fix random seed for reproducibility

m, p = {{c-m}}, {{c-p}}  # state dimension, observation dimension
n    = {{c-n}}  # number of time steps to simulate

T_mat = {{c-T}}  # state transition matrix (m x m)
Z_mat = {{c-Z}}  # measurement matrix (p x m)
Q_mat = {{c-Q}}  # process noise covariance (m x m)
H_mat = {{c-H}}  # observation noise covariance (p x p)
a1    = zeros(m)  # initial state mean
P1    = Matrix(I, m, m)  # initial state covariance

sys      = LinearUnivariateTimeInvariant(T_mat, Z_mat, Q_mat, H_mat, a1, P1)  # build custom linear Gaussian SSM
y, alpha = simulate(sys, n)  # simulate n observations and state path
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "plot-series"
label = "Plot Simulated Series"
desc = "Plot the simulated observation series y over time"
code = '''
using Plots  # plotting library

plot(y, label="y", xlabel="t", ylabel="value")  # plot simulated observations
'''

[[actionGroups.actions]]
id = "plot-state"
label = "Plot State Path"
desc = "Overlay latent state and noisy observations"
code = '''
using Plots  # plotting library

plot(y,     label="observations", alpha=0.6)  # simulated noisy observations
plot!(alpha, label="state path",   lw=2)  # latent state trajectory
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "acf"
label = "Autocorrelation"
desc = "Check ACF of observations for temporal structure"
code = '''
using StatsBase, Plots  # statistics and plotting

lags  = 0:40  # lag range to inspect
acf_y = autocor(y, collect(lags))  # compute autocorrelation of observations
bar(lags, acf_y, xlabel="Lag", ylabel="ACF", label="")  # bar plot of ACF
'''

[[actionGroups.actions]]
id = "histogram"
label = "Distribution"
desc = "Histogram of simulated observation values"
code = '''
using Plots  # plotting library

histogram(y, bins=30, xlabel="value", ylabel="count", label="")  # empirical distribution of observations
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "extend"
label = "Extend Forward"
desc = "Simulate additional steps from the end of the current path"
code = '''
n_ahead = 50  # additional steps to simulate
y_ext, alpha_ext = simulate(model, n_ahead)  # simulate forward from current model
using Plots  # plotting library
plot([y; y_ext], label="extended series")  # concatenate and plot original + extension
'''

[[actionGroups.actions]]
id = "scenarios"
label = "Multiple Scenarios"
desc = "Generate K independent realisations from the same model"
code = '''
K = 10  # number of independent realisations
scenarios = [simulate(model, n)[1] for _ in 1:K]  # simulate K independent observation paths
using Plots  # plotting library
plot(hcat(scenarios...), alpha=0.4, legend=false)  # overlay all K scenarios
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "snr"
label = "Signal-to-Noise Ratio"
desc = "Compute the ratio of state variance to observation noise variance"
code = '''
state_var = var(alpha)  # variance of the latent state path
obs_var   = var(y .- alpha)  # variance of the observation noise
snr       = state_var / obs_var  # signal-to-noise ratio
println("SNR = ", round(snr, digits=3))  # print result
'''

[[actionGroups.actions]]
id = "noise-sweep"
label = "Noise Sensitivity"
desc = "Vary observation noise and compare simulated paths"
code = '''
using Plots  # plotting library
plot(title="Noise sensitivity")  # initialise plot
for s in [0.05, 0.1, 0.2, 0.5]  # sweep over sigma_obs values
    update_hyperparameters!(model, [sigma_lev, s])  # update observation noise
    y_s, _ = simulate(model, n)  # simulate with current noise level
    plot!(y_s, label="sigma=" * string(s), alpha=0.7)  # overlay on plot
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "decompose"
label = "Decompose Components"
desc = "Separate trend, slope and noise contributions"
code = '''
using Plots  # plotting library

noise = y .- alpha  # observation noise realisation
plot(alpha, label="state (trend)")  # latent trend component
plot(noise, label="observation noise")  # noise component
'''

[[actionGroups.actions]]
id = "marginal-var"
label = "Marginal Variance"
desc = "Compute and print marginal variance of observations"
code = '''
sigma2_y = var(y)  # marginal variance of the simulated series
sigma2_a = var(alpha)  # variance of the latent state
println("Var(y) = ",     round(sigma2_y, digits=4))  # print obs variance
println("Var(alpha) = ", round(sigma2_a, digits=4))  # print state variance
'''
