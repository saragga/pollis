[[codeBranches]]
model = "lg"
code = '''
using StateSpaceModels, LinearAlgebra, Random  # state-space models, diagm, random number generator
Random.seed!({{lg-seed}})  # fix random seed for reproducibility

n = {{lg-n}}  # number of time steps to simulate

sigma_lev = {{lg-sigma-lev}}  # level disturbance std
{{?lg-model=llt}} sigma_slp = {{lg-sigma-slp}}  # slope disturbance std
sigma_obs = {{lg-sigma-obs}}  # observation noise std

{{?lg-model=ll}} model = LocalLevel(zeros(n))  # y_t = mu_t + eps_t, mu_{t+1} = mu_t + eta_t
{{?lg-model=ll}} model.system.Q .= sigma_lev^2  # level disturbance variance
{{?lg-model=llt}} model = LocalLinearTrend(zeros(n))  # level_{t+1} = level_t + slope_t + xi_t, slope_{t+1} = slope_t + zeta_t
{{?lg-model=llt}} model.system.Q .= diagm([sigma_lev^2, sigma_slp^2])  # level and slope disturbance variances
model.system.H = sigma_obs^2  # observation noise variance
sys = model.system  # the model's system matrices Z, T, R, H, Q

# n observations and the n x m state path; from = a previous state to continue (default: start at zero)
function sim(n; obs_sd=sigma_obs, from=nothing)
    s = deepcopy(sys); s.H = obs_sd^2
    a0 = from === nothing ? zeros(size(s.T, 1)) : s.T * from
    simulate(s, a0, n; return_simulated_states=true)
end

y, alpha = sim(n)  # simulated observations and latent states
signal = alpha * sys.Z  # noise-free part of y: Z * alpha_t
'''

[[codeBranches]]
model = "nl"
code = '''
using LowLevelParticleFilters, LinearAlgebra, Distributions, Random  # filters, I, MvNormal, RNG
Random.seed!({{nl-seed}})  # fix random seed for reproducibility

nx, ny, nu = {{nl-nx}}, {{nl-ny}}, {{nl-nu}}  # state / observation / input dimensions
n = {{nl-n}}  # number of time steps to simulate
sigma_x, sigma_y = {{nl-sigma-x}}, {{nl-sigma-y}}  # process and observation noise std

function dynamics(x, u, p, t)  # state transition; the noise is added outside
    {{nl-dyn}}
end

function measurement(x, u, p, t)  # nonlinear measurement function
    {{nl-meas}}
end

x0 = MvNormal(zeros(nx), I)  # initial state distribution

# n observation vectors and the n x nx state path, with additive Gaussian noise; from = a previous state to continue
function sim(n; obs_sd=sigma_y, from=nothing)
    xs = [from === nothing ? rand(x0) : dynamics(from, zeros(nu), nothing, 0) .+ sigma_x .* randn(nx)]
    for t in 2:n
        push!(xs, dynamics(xs[end], zeros(nu), nothing, t) .+ sigma_x .* randn(nx))
    end
    ys = [measurement(x, zeros(nu), nothing, 0) .+ obs_sd .* randn(ny) for x in xs]
    (first.(ys), permutedims(reduce(hcat, xs)), ys)  # first observed signal, states, all observations
end

y, alpha, ys = sim(n)
signal = [measurement(x, zeros(nu), nothing, 0)[1] for x in eachrow(alpha)]  # noise-free part of y

{{?nl-filter=ukf}} filt = UnscentedKalmanFilter(dynamics, measurement, sigma_x^2 * Matrix(I, nx, nx), sigma_y^2 * Matrix(I, ny, ny), x0; nu, ny)  # Unscented Kalman Filter
{{?nl-filter=pf}} filt = ParticleFilter({{nl-N}}, dynamics, measurement, MvNormal(zeros(nx), sigma_x^2 * I), MvNormal(zeros(ny), sigma_y^2 * I), x0)  # bootstrap Particle Filter, {{nl-N}} particles
sol_filt = forward_trajectory(filt, [zeros(nu) for _ in 1:n], ys)  # filter the simulated observations
'''

[[codeBranches]]
model = "custom"
code = '''
using StateSpaceModels, LinearAlgebra, Random  # SSM, matrix utilities, RNG
Random.seed!({{c-seed}})  # fix random seed for reproducibility

m, p = {{c-m}}, {{c-p}}  # state dimension, observation dimension (LinearUnivariateTimeInvariant needs p = 1)
n    = {{c-n}}  # number of time steps to simulate

T_mat = Float64.({{c-T}})  # state transition matrix (m x m)
Z_vec = vec(Float64.({{c-Z}}))  # measurement matrix (1 x m), as a vector
Q_mat = Float64.({{c-Q}})  # process noise covariance (m x m)
H     = only({{c-H}})  # observation noise variance (scalar for p = 1)
sigma_obs = sqrt(H)

# y_t = Z alpha_t + eps_t, alpha_{t+1} = T alpha_t + eta_t (y, Z, T, R, d, c, H, Q; R = I, no intercepts)
sys = LinearUnivariateTimeInvariant{Float64}(zeros(n), Z_vec, T_mat, Matrix(1.0I, m, m), 0.0, zeros(m), H, Q_mat)

# n observations and the n x m state path; from = a previous state to continue (default: start at zero)
function sim(n; obs_sd=sigma_obs, from=nothing)
    s = deepcopy(sys); s.H = obs_sd^2
    a0 = from === nothing ? zeros(m) : s.T * from
    simulate(s, a0, n; return_simulated_states=true)
end

y, alpha = sim(n)  # simulated observations and latent states
signal = alpha * Z_vec  # noise-free part of y: Z * alpha_t
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "plot-series"
label = "Plot Simulated Series"
desc = "Plot the simulated observation series y over time"
code = '''
using Plots  # plotting library

plot(y, label="y", xlabel="t", ylabel="value")  # plot simulated observations
'''

[[actionGroups.actions]]
id = "plot-state"
label = "Plot State Path"
desc = "Overlay the noise-free signal on the noisy observations"
code = '''
using Plots  # plotting library

plot(y,      label="observations", alpha=0.6)  # simulated noisy observations
plot!(signal, label="signal (noise-free)", lw=2)  # what y would be without observation noise
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "acf"
label = "Autocorrelation"
desc = "Check ACF of observations for temporal structure"
code = '''
using StatsBase, Plots  # statistics and plotting

lags  = 0:min(40, length(y) - 1)  # lag range to inspect
acf_y = autocor(y, collect(lags))  # slow decay means a trend or random walk, not short memory
bar(lags, acf_y, xlabel="Lag", ylabel="ACF", label="")  # bar plot of ACF
'''

[[actionGroups.actions]]
id = "histogram"
label = "Distribution"
desc = "Histogram of simulated observation values"
code = '''
using Plots  # plotting library

histogram(y, bins=30, xlabel="value", ylabel="count", label="")  # empirical distribution of observations
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "extend"
label = "Extend Forward"
desc = "Simulate additional steps from the end of the current path"
code = '''
n_ahead = 50  # additional steps to simulate
y_ext, _ = sim(n_ahead; from=alpha[end, :])  # continue from the last simulated state
using Plots  # plotting library
plot(1:length(y), y, label="simulated")
plot!(length(y) .+ (1:n_ahead), y_ext, label="extension")
'''

[[actionGroups.actions]]
id = "scenarios"
label = "Multiple Scenarios"
desc = "Generate K independent realisations from the same model"
code = '''
K = 10  # number of independent realisations
scenarios = [sim(n)[1] for _ in 1:K]  # simulate K independent observation paths
using Plots  # plotting library
plot(reduce(hcat, scenarios), alpha=0.4, legend=false)  # overlay all K scenarios
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "snr"
label = "Signal-to-Noise Ratio"
desc = "Compute the ratio of signal variance to observation noise variance"
code = '''
using Statistics

signal_var = var(signal)  # sample variance of the noise-free signal
noise_var  = var(y .- signal)  # sample variance of the observation noise
println("Sample SNR = ", round(signal_var / noise_var, digits=3))  # for a random-walk level this grows with n
{{?model=lg}} println("q = level variance / noise variance = ", round(sigma_lev^2 / sigma_obs^2, digits=3))  # the SNR of structural models
'''

[[actionGroups.actions]]
id = "noise-sweep"
label = "Noise Sensitivity"
desc = "Vary observation noise and compare simulated paths"
code = '''
using Plots, Random  # plotting library, seed
plot(title="Noise sensitivity")  # initialise plot
for s in [0.05, 0.1, 0.2, 0.5]  # sweep over the observation noise std
    Random.seed!(1)  # same draws each time, so only the noise level changes
    y_s, _ = sim(n; obs_sd=s)  # simulate with this observation noise
    plot!(y_s, label="sigma=" * string(s), alpha=0.7)  # overlay on plot
end
plot!()
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "decompose"
label = "Decompose Components"
desc = "Separate the latent states (level, slope, ...) from the observation noise"
code = '''
using Plots  # plotting library

noise = y .- signal  # observation noise realisation
plot(plot(alpha, label=permutedims(["state $i" for i in 1:size(alpha, 2)]), title="latent states"),
     plot(noise, label="observation noise"), layout=(2, 1))
'''

[[actionGroups.actions]]
id = "marginal-var"
label = "Marginal Variance"
desc = "Compute and print marginal variance of observations"
code = '''
using Statistics

sigma2_y = var(y)  # sample variance of the simulated series
sigma2_s = var(signal)  # sample variance of the noise-free signal
println("Var(y) = ",      round(sigma2_y, digits=4))  # for non-stationary states (random walks) these depend on n
println("Var(signal) = ", round(sigma2_s, digits=4))
println("Var(y - signal) = ", round(var(y .- signal), digits=4))  # should be close to the observation noise variance
'''
