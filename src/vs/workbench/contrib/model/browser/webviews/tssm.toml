models = ["lg"]

[[inputs.options]]
value = "ll"
label = "Local Level"

[[inputs.options]]
value = "llt"
label = "Local Linear Trend"

[[inputs]]
id = "lg-n"
label = "Time Steps (n)"
tooltip = "Number of time steps to simulate."
default = "200"
models = ["lg"]

[[inputs]]
id = "lg-sigma-lev"
