[[codeBranches]]
model = "lp"
code = '''
using JuMP, {{solver}}, LinearAlgebra

c = {{c}}  # objective coefficients
A = {{A}}  # constraint matrix
b = {{b}}  # right-hand side
n = length(c)

function build(optimizer; integer=false)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, x[1:n] >= 0, integer = integer)
    @objective(m, {{sense}}, dot(c, x))
    @constraint(m, cons, A * x .<= b)
    m, x
end

model, x = build({{solver}}.Optimizer)
optimize!(model)
(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[codeBranches]]
model = "milp"
code = '''
using JuMP, {{misolver}}, LinearAlgebra

c = {{c}}  # objective coefficients
A = {{A}}  # constraint matrix
b = {{b}}  # right-hand side
n = length(c)

function build(optimizer; integer=true)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, x[1:n] >= 0, integer = integer)
    @objective(m, {{sense}}, dot(c, x))
    @constraint(m, cons, A * x .<= b)
    m, x
end

model, x = build({{misolver}}.Optimizer)
optimize!(model)
(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "feasible-region"
label = "Feasible Region"
desc = "The feasible region in the (x1, x2) plane with objective contours and the optimum (other variables held at their optimal values)"
code = '''
using Plots

xs_opt = value.(x)
rest = xs_opt[3:end]
feasible(a, u) = all(A * [a; u; rest] .<= b .+ 1e-9)
hi = 1.5 * max(maximum(xs_opt[1:2]), 1)
g = range(0, hi, length=200)
contour(g, g, (a, u) -> c[1] * a + c[2] * u, levels=15, color=:grey, colorbar=false, xlabel="x1", ylabel="x2")
contourf!(g, g, (a, u) -> feasible(a, u) ? 1.0 : NaN, color=:blues, alpha=0.3, colorbar=false)
{{?model=milp}} pts = [(a, u) for a in 0:floor(Int, hi), u in 0:floor(Int, hi) if feasible(a, u)]
{{?model=milp}} scatter!(first.(pts), last.(pts), color=:black, markersize=2, label="integer points")
scatter!([xs_opt[1]], [xs_opt[2]], marker=:star, markersize=10, color=:red, label="optimum")
'''

[[actionGroups.actions]]
id = "solution-plot"
label = "Solution Plot"
desc = "The optimal x, and each constraint's usage A x against its limit b"
code = '''
using Plots

p1 = bar(value.(x), xlabel="variable", ylabel="x[i]", legend=false, title="solution")
p2 = bar([A * value.(x) b], xlabel="constraint", label=["A x" "b"], title="usage vs limit")
plot(p1, p2, layout=(1, 2))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "feasibility"
label = "Feasibility Check"
desc = "Termination and primal status (INFEASIBLE, or DUAL_INFEASIBLE = unbounded), and any violated constraint"
code = '''
(termination = termination_status(model), primal = primal_status(model),
{{?model=milp}}  relative_gap = relative_gap(model),
 violated = primal_feasibility_report(model; atol=1e-6))  # empty Dict = feasible
'''

[[actionGroups.actions]]
id = "constraint-activity"
label = "Constraint Activity"
desc = "Slack b - A x of every constraint; binding constraints (slack about 0) determine the optimum"
code = '''
slack = b - A * value.(x)
[(constraint = i, usage = (A * value.(x))[i], limit = b[i], slack = slack[i], binding = abs(slack[i]) < 1e-6) for i in eachindex(b)]
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity Analysis"
desc = "Ranges over which each objective coefficient and right-hand side can move without changing the optimal basis (MILP: with the integers fixed)"
code = '''
{{?model=milp}} undo = fix_discrete_variables(model); optimize!(model)  # duals hold for the LP with the integers fixed
report = lp_sensitivity_report(model)
objective_ranges = [(variable = i, c = c[i], range = c[i] .+ report[x[i]]) for i in 1:n]
rhs_ranges = [(constraint = i, b = b[i], range = b[i] .+ report[model[:cons][i]]) for i in eachindex(b)]
{{?model=milp}} undo(); optimize!(model)
(objective_ranges = objective_ranges, rhs_ranges = rhs_ranges)
'''

[[actionGroups.actions]]
id = "parametric"
label = "Parametric Analysis"
desc = "Sweep the cost coefficient c[1] and plot the optimal value and x[1] (piecewise linear for an LP, step-wise for a MILP)"
code = '''
using Plots

grid = range(0, 2 * max(abs(c[1]), 1), length=25)
res = map(grid) do v
    set_objective_coefficient(model, x[1], v)
    optimize!(model)
    (objective_value(model), value(x[1]))
end
set_objective_coefficient(model, x[1], c[1]); optimize!(model)
p1 = plot(grid, first.(res), marker=:circle, ylabel="optimal value", legend=false)
p2 = plot(grid, last.(res), marker=:circle, xlabel="c[1]", ylabel="x[1]", legend=false, linetype=:steppost)
plot(p1, p2, layout=(2, 1))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "milp-gap"
label = "LP Relaxation Gap"
desc = "The integer optimum against the LP relaxation bound: the integrality gap"
code = '''
{{?model=lp}} mi, xi = build({{solver}}.Optimizer; integer=true)
{{?model=lp}} optimize!(mi)
{{?model=lp}} (lp = objective_value(model), milp = objective_value(mi), gap = abs(objective_value(model) - objective_value(mi)), x_milp = value.(xi))
{{?model=milp}} undo = relax_integrality(model); optimize!(model)
{{?model=milp}} lp_bound = objective_value(model); x_lp = value.(x)
{{?model=milp}} undo(); optimize!(model)
{{?model=milp}} (milp = objective_value(model), lp = lp_bound, gap = abs(lp_bound - objective_value(model)), x_lp = x_lp)
'''

[[actionGroups.actions]]
id = "solver-compare"
label = "Solver Comparison"
desc = "The same problem with each solver: status, objective and time"
code = '''
{{?model=lp}} using HiGHS, Clp, GLPK
{{?model=lp}} solvers = ["HiGHS" => HiGHS.Optimizer, "Clp" => Clp.Optimizer, "GLPK" => GLPK.Optimizer]
{{?model=milp}} using HiGHS, GLPK
{{?model=milp}} solvers = ["HiGHS" => HiGHS.Optimizer, "GLPK" => GLPK.Optimizer]
map(solvers) do (name, opt)
{{?model=lp}}     m, _ = build(opt)
{{?model=milp}}     m, _ = build(opt; integer=true)
    t = @elapsed optimize!(m)
    (solver = name, status = termination_status(m), objective = objective_value(m), seconds = t)
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "shadow-prices"
label = "Shadow Prices"
desc = "The change in the optimal value per extra unit of each right-hand side (MILP: with the integers fixed, so valid only locally)"
code = '''
{{?model=milp}} undo = fix_discrete_variables(model); optimize!(model)  # duals hold for the LP with the integers fixed
sp = shadow_price.(model[:cons])
{{?model=milp}} undo(); optimize!(model)
[(constraint = i, limit = b[i], shadow_price = sp[i]) for i in eachindex(b)]
'''

[[actionGroups.actions]]
id = "reduced-costs"
label = "Reduced Costs"
desc = "How much each variable's cost must improve before it enters the solution (non-zero only for variables at 0)"
code = '''
{{?model=milp}} undo = fix_discrete_variables(model); optimize!(model)  # duals hold for the LP with the integers fixed
rc = reduced_cost.(x)
{{?model=milp}} undo(); optimize!(model)
[(variable = i, value = value(x[i]), cost = c[i], reduced_cost = rc[i]) for i in 1:n]
'''
