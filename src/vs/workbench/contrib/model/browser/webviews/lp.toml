[[bullets]]
text = "JuMP.jl"
detail = "unified modelling layer; define problems with @variable, @objective, and @constraint; solver-independent"

[[bullets]]
text = "HiGHS.jl"
detail = "Linear Programming (LP) and Mixed-Integer LP (MILP); recommended default; state-of-the-art open-source performance"

[[bullets]]
text = "GLPK.jl"
detail = "Linear Programming (LP) and Mixed-Integer LP (MILP); lightweight; good for teaching and small-to-medium problems"

[[bullets]]
text = "Clp.jl"
detail = "Linear Programming (LP) only; continuous variables; fast for large-scale problems"

[[decisionRows]]
task = "Linear Programming (LP)"
context = "Continuous quantities: production planning, blending, transport, diet problems"
purpose = "Optimise a linear objective over a polyhedron; the optimum is a vertex and comes with shadow prices"

[[decisionRows]]
task = "Mixed-Integer LP (MILP)"
context = "Indivisible units or yes/no decisions: scheduling, facility location, knapsack"
purpose = "Branch and bound over LP relaxations; the optimum is exact but duals only hold with the integers fixed"

[[inputs]]
id = "c"
label = "Objective Coefficients c"
tooltip = "Vector of objective coefficients; its length sets the number of variables n. The objective is c' x."
default = "[5.0, 4.0, 3.0]"

[[inputs]]
id = "A"
label = "Constraint Matrix A"
tooltip = "m × n matrix of the constraints A x <= b (one row per constraint). Write >= constraints as <= by negating the row."
default = "[2 3 1; 4 1 2; 3 4 2]"

[[inputs]]
id = "b"
label = "Right-Hand Side b"
tooltip = "Length-m vector of constraint limits (for example resource capacities)."
default = "[5.0, 11.0, 8.0]"

[[inputs]]
id = "sense"
label = "Sense"
tooltip = "Direction of optimisation: Minimise or Maximise. The variables are non-negative."
kind = "select"
default = "Max"
newRow = true

[[inputs.options]]
value = "Max"
label = "Maximise"

[[inputs.options]]
value = "Min"
label = "Minimise"

[[inputs]]
id = "solver"
label = "Solver"
tooltip = "HiGHS: the default and fastest (simplex and interior point). Clp: mature simplex. GLPK: lightweight open-source simplex."
kind = "select"
default = "HiGHS"
models = ["lp"]

[[inputs.options]]
value = "HiGHS"
label = "HiGHS"

[[inputs.options]]
value = "Clp"
label = "Clp"

[[inputs.options]]
value = "GLPK"
label = "GLPK"

[[inputs]]
id = "misolver"
label = "Solver"
tooltip = "HiGHS: the default, fast branch and cut. GLPK: lightweight open-source branch and bound. (Clp solves LPs only.)"
