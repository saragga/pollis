# Generalized Linear Mixed-Effects Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/glmm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Generalized Linear Mixed-Effects Models"
viewType = "pollis.glmm"
defaultModel = "main"

[[packages]]
name = "MixedModels.jl"
github = "https://github.com/JuliaStats/MixedModels.jl"

[requires]
packages = ["MixedModels.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "GLMM Basics"
file = "glmm/tutorial-01-glmm-basics.ipynb"
bundled = true
description = "Introduction to generalized linear mixed-effects models"

[[notebookSections.notebooks]]
name = "Binary GLMM"
file = "glmm/tutorial-02-glmm-binary.ipynb"
bundled = true
description = "Logistic mixed-effects models for binary outcomes"

[[notebookSections.notebooks]]
name = "Count GLMM"
file = "glmm/tutorial-03-glmm-count.ipynb"
bundled = true
description = "Poisson and Negative Binomial mixed-effects models"

[[notebookSections.notebooks]]
name = "Model Comparison"
file = "glmm/tutorial-04-glmm-model-comparison.ipynb"
bundled = true
description = "Model selection and likelihood ratio tests for GLMM"

[[wikis]]
name = "Overview"
file = "glmm/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "glmm/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "glmm/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "glmm/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "glmm/interpretation.md"
bundled = true

[[wikis]]
name = "Decision Guide"
file = "glmm/decision-guide.md"
bundled = true

[[bullets]]
text = "Binary and count outcomes with random intercepts and slopes"
detail = ""

[[bullets]]
text = "Non-Gaussian families"
detail = "Bernoulli, Binomial, Poisson, NegativeBinomial, Gamma, InverseGaussian"

[[bullets]]
text = "Likelihood-based inference"
detail = "ML and REML estimation with likelihood ratio tests"

[[inputs]]
id = "formula"
label = "Formula"
tooltip = "Fixed effects only (response ~ predictors); random effects go in the Random Effects input."
default = "y ~ x1 + x2"

[[inputs]]
id = "family"
label = "Family"
tooltip = "Response distribution for the GLMM.\nBernoulli — binary 0/1 outcome\nBinomial — proportion or count with known N\nPoisson — count data\nNegativeBinomial — overdispersed counts\nGamma — positive skewed continuous\nInverseGaussian — positive heavy-tailed continuous"
kind = "select"
default = "Bernoulli"

[[inputs.options]]
value = "Bernoulli"
label = "Bernoulli"

[[inputs.options]]
value = "Binomial"
label = "Binomial"

[[inputs.options]]
value = "Poisson"
label = "Poisson"

[[inputs.options]]
value = "NegativeBinomial"
label = "NegativeBinomial"

[[inputs.options]]
value = "Gamma"
label = "Gamma"

[[inputs.options]]
value = "InverseGaussian"
label = "InverseGaussian"

[[inputs.options]]
value = "Normal"
label = "Normal"

[[inputs]]
id = "link"
label = "Link"
tooltip = "Link function connecting the linear predictor to the mean. Canonical uses each family's default link (logit for Bernoulli/Binomial, log for Poisson/NegativeBinomial, inverse for Gamma) — override only when theory requires a different link."
kind = "select"
default = "canonical"

[[inputs.options]]
value = "canonical"
label = "Canonical (Family Default)"

[[inputs.options]]
value = "LogitLink"
label = "LogitLink"

[[inputs.options]]
value = "ProbitLink"
label = "ProbitLink"

[[inputs.options]]
value = "CloglogLink"
label = "CloglogLink"

[[inputs.options]]
value = "LogLink"
label = "LogLink"

[[inputs.options]]
value = "IdentityLink"
label = "IdentityLink"

[[inputs.options]]
value = "InverseLink"
label = "InverseLink"

[[inputs.options]]
value = "SqrtLink"
label = "SqrtLink"
[[inputs]]
id = "data"
label = "Data"
tooltip = "DataFrame containing all variables referenced in the formula. Column names must match the formula symbols exactly."
default = "df"

[[inputs]]
id = "group"
label = "Group"
tooltip = "Grouping factor named in the plots and the ICC (the factor of the first random-effects term)."
default = "group"

[[inputs]]
id = "re"
label = "Random Effects"
tooltip = "Random-effects terms of the MixedModels formula, each in parentheses.\n(1|group) - random intercept\n(1+x|group) - random intercept + slope\n(0+x|group) - random slope only\n(1|g1) + (1|g2) - crossed random effects\n(1|g1/g2) - nested random effects\n\nThe Group input names the factor the caterpillar plot and ICC refer to: list its term first."
default = "(1|group)"

[[codeBranches]]
model = "main"
code = '''
using MixedModels  # mixed-effects models

{{?family!=NegativeBinomial}} fam = {{family}}()
{{?family=NegativeBinomial}} fam = MixedModels.GLM.Distributions.NegativeBinomial()  # not exported by MixedModels
{{?link=canonical}} lk = MixedModels.GLM.canonicallink(fam)
{{?link!=canonical}} lk = MixedModels.GLM.{{link}}()
model = fit(MixedModel, @formula({{formula}} + {{re}}), {{data}}, fam, lk)  # random effects: {{re}}

println(model)  # model summary
println(VarCorr(model))  # variance components
println(ranef(model))  # random effects BLUPs
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "caterpillar"
label = "Random Effects Caterpillar"
desc = "Random intercepts per group on the linear-predictor scale, sorted, with approximate 95% intervals"
code = '''
using Plots
b = vec(ranef(model)[1][1, :]); se = sqrt.(condVar(model.LMM)[1][1, 1, :])  # conditional modes and approximate std. errors
o = sortperm(b)
scatter(b[o], 1:length(b), xerror=1.96 .* se[o], ms=3, label=false, xlabel="Random intercept (link scale)", ylabel="{{group}} (sorted)", title="Caterpillar plot")
vline!([0], c=:red, ls=:dash, label=false)
'''

[[actionGroups.actions]]
id = "calibration"
label = "Calibration Plot"
desc = "Observations grouped into ten bins of fitted mean: observed against predicted average per bin; points on the diagonal mean a well-calibrated model"
code = '''
using Plots, Statistics
y, mu = response(model), fitted(model)
edges = quantile(mu, 0:0.1:1); bin = clamp.(searchsortedlast.(Ref(edges), mu), 1, 10)
pm = [mean(mu[bin .== k]) for k in 1:10 if any(bin .== k)]
om = [mean(y[bin .== k]) for k in 1:10 if any(bin .== k)]
scatter(pm, om, ms=5, label="bins", xlabel="Mean predicted", ylabel="Mean observed", title="Calibration")
plot!(identity, extrema(vcat(pm, om))..., c=:red, ls=:dash, label=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "sim-residuals"
label = "Simulated Residuals"
desc = "Simulation-based (DHARMa-style) residuals: the rank of each observation among 250 simulated responses should be uniform; a KS test and uniform Q-Q plot check it"
code = '''
using Plots, Random, HypothesisTests, Distributions
rng = MersenneTwister(1); y = response(model); nsim = 250
S = reduce(hcat, [simulate(rng, model) for _ in 1:nsim])  # n x nsim simulated responses
u = [(count(<(y[i]), S[i, :]) + rand(rng) * (count(==(y[i]), S[i, :]) + 1)) / (nsim + 1) for i in eachindex(y)]  # randomised for discrete data
display((ks_uniform_p = pvalue(ExactOneSampleKSTest(u, Uniform())),))
scatter(((1:length(u)) .- 0.5) ./ length(u), sort(u), ms=2, msw=0, label=false, xlabel="Expected", ylabel="Observed", title="Simulated residuals: uniform Q-Q")
plot!(identity, 0, 1, c=:red, ls=:dash, label=false)
'''

[[actionGroups.actions]]
id = "overdispersion"
label = "Overdispersion Check"
desc = "Pearson chi-square over residual degrees of freedom: well above 1 for a Poisson or Binomial model means overdispersion (try NegativeBinomial or an observation-level random effect)"
code = '''
using GLM, Distributions
y, mu = response(model), fitted(model)
pr = (y .- mu) ./ sqrt.(GLM.glmvar.(Distribution(model)(), mu))  # Pearson residuals
ratio = sum(abs2, pr) / dof_residual(model)
println("Pearson chi2 / df = ", round(ratio, digits=3), ratio > 1.5 ? "  -> overdispersed" : "  -> no strong sign of overdispersion")
'''

[[actionGroups.actions]]
id = "singularity"
label = "Singular Fit Check"
desc = "Detect variance components estimated at zero (or correlations of +/-1): a singular fit means the random-effects structure is too rich for the data"
code = '''
println("Singular fit: ", issingular(model))  # true: simplify the random-effects structure
println(VarCorr(model))  # look for zero variances or correlations of +/-1
'''

[[actionGroups.actions]]
id = "qq-ranef"
label = "Random-Effects Q-Q Plot"
desc = "Normal Q-Q plot of the random intercepts of the first random-effects term: the model assumes they are normally distributed"
code = '''
using Plots, Distributions, Statistics
b = sort(vec(ranef(model)[1][1, :]))  # first coefficient of the first random-effects term
q = quantile.(Normal(), ((1:length(b)) .- 0.5) ./ length(b))
scatter(q, b, ms=3, label=false, xlabel="Normal quantiles", ylabel="Random-effect quantiles", title="Random-effects Q-Q plot")
plot!(q, mean(b) .+ std(b) .* q, c=:red, ls=:dash, label=false)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "conditional-population"
label = "Conditional vs Population Predictions"
desc = "Predictions including each group's random effect against population-level predictions (random effects at zero): the spread between them is the group effect"
code = '''
using Plots, GLM
cond = fitted(model)  # includes the random effects
pop = GLM.linkinv.(Ref(GLM.Link(model)), modelmatrix(model) * fixef(model))  # fixed effects only
scatter(pop, cond, ms=2, msw=0, alpha=0.5, label=false, xlabel="Population-level prediction", ylabel="Conditional prediction", title="Effect of the random intercepts")
plot!(identity, extrema(vcat(pop, cond))..., c=:red, ls=:dash, label=false)
'''

[[actionGroups.actions]]
id = "accuracy"
label = "Predictive Accuracy"
desc = "Bernoulli: confusion matrix at 0.5 and the AUC. Other families: RMSE and MAE of the fitted means"
code = '''
using Statistics
y, p = response(model), fitted(model)
{{?family=Bernoulli}} yhat = p .>= 0.5
{{?family=Bernoulli}} println("TP=", count(yhat .& (y .== 1)), "  FP=", count(yhat .& (y .== 0)), "  FN=", count(.!yhat .& (y .== 1)), "  TN=", count(.!yhat .& (y .== 0)))
{{?family=Bernoulli}} r = invperm(sortperm(p)); n1 = count(==(1), y); n0 = length(y) - n1
{{?family=Bernoulli}} println("AUC = ", round((sum(r[y .== 1]) - n1 * (n1 + 1) / 2) / (n1 * n0), digits=4))  # Mann-Whitney form
{{?family!=Bernoulli}} println("RMSE = ", round(sqrt(mean((y .- p) .^ 2)), digits=4), "   MAE = ", round(mean(abs.(y .- p)), digits=4))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-glm"
label = "Against a GLM Without Random Effects"
desc = "Likelihood ratio test of the random intercept against the same GLM without grouping, with AIC and BIC for both"
code = '''
using GLM
g = glm(@formula({{formula}}), {{data}}, fam, lk)  # no random effects
display(MixedModels.likelihoodratiotest(g, model))
println("AIC: GLM ", round(aic(g), digits=2), "  GLMM ", round(aic(model), digits=2))
println("BIC: GLM ", round(bic(g), digits=2), "  GLMM ", round(bic(model), digits=2))
'''

[[actionGroups.actions]]
id = "quadrature"
label = "Laplace vs Adaptive Quadrature"
desc = "Refits with 9-point adaptive Gauss-Hermite quadrature: if the estimates move, the default Laplace approximation is not accurate enough"
code = '''
mq = fit(MixedModel, @formula({{formula}} + {{re}}), {{data}}, fam, lk; nAGQ=9)  # nAGQ > 1 needs a single scalar random-effects term such as (1|g)
foreach((n, a, b) -> println(rpad(n, 20), " Laplace = ", round(a, digits=4), "   AGQ(9) = ", round(b, digits=4)), coefnames(model), fixef(model), fixef(mq))
println("Deviance: Laplace ", round(deviance(model), digits=3), "   AGQ(9) ", round(deviance(mq), digits=3))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "ratios"
label = "Exponentiated Coefficients"
desc = "exp(coefficient) with 95% intervals: odds ratios under a logit link, rate ratios under a log link"
code = '''
b, se = fixef(model), stderror(model)
println(lk isa LogitLink ? "Odds ratios (multiplicative change in the odds per unit increase):" :
    lk isa LogLink ? "Rate ratios (multiplicative change in the mean per unit increase):" :
    "exp(coef) - a ratio interpretation holds for logit (odds) and log (rates) links only:")
foreach((n, a, s) -> println(rpad(n, 20), round(exp(a), digits=4), "   [", round(exp(a - 1.96s), digits=4), ", ", round(exp(a + 1.96s), digits=4), "]"), coefnames(model), b, se)
'''

[[actionGroups.actions]]
id = "icc"
label = "Latent-Scale ICC"
desc = "Intraclass correlation on the latent scale: the share of variance between groups, using pi^2/3 for the logit link and 1 for probit"
code = '''
sg = model.theta[1]  # random-intercept SD (dispersion fixed at 1)
lv = lk isa LogitLink ? pi^2 / 3 :                   # latent logistic variance
    lk isa ProbitLink ? 1.0 :                          # latent normal variance
    lk isa MixedModels.GLM.CloglogLink ? pi^2 / 6 :   # latent extreme-value variance
    error("The latent-scale ICC is defined for logit, probit and cloglog links")
println("Random-intercept SD: ", round(sg, digits=4))
println("Latent-scale ICC: ", round(sg^2 / (sg^2 + lv), digits=3))
'''

[[actionGroups.actions]]
id = "bootstrap"
label = "Parametric Bootstrap"
desc = "Bootstrap confidence intervals for all parameters, variance components included (MixedModels parametric bootstrap); the Bootstrap Resampling panel in the Simulate menu compares interval methods, resampling schemes and their coverage"
code = '''
using MixedModels, Random
boot = parametricbootstrap(MersenneTwister(42), 1000, model)  # 1000 simulated refits
println(confint(boot))  # shortest 95% coverage intervals
'''
