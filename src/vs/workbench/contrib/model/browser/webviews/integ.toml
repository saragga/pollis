[[inputs]]
id = "method"
label = "Method"
tooltip = "Adaptive Gauss-Kronrod (QuadGK): refines where needed, handles infinite limits and returns an error estimate. Gauss-Legendre: n nodes, exact for polynomials of degree 2n - 1. Simpson: parabolas, error of order 1/n^4. Trapezoid and Midpoint: straight lines and rectangles, error of order 1/n^2."
