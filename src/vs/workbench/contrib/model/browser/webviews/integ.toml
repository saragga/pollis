[[models]]
id = "def"
label = "Definite Integral"

[[models]]
id = "multi"
label = "Multiple Integral"

[[models]]
id = "data"
label = "Sampled Data"

[[bullets]]
text = "Definite Integral"
detail = "the integral of f(x) from a to b, by an adaptive method (infinite limits allowed) or a fixed rule with n points"

[[bullets]]
text = "Multiple Integral"
detail = "the integral of f over a box in several variables, by adaptive cubature or Monte Carlo sampling"

[[bullets]]
text = "Sampled Data"
detail = "the area under a curve known only at sample points, e.g. a marginal cost observed at a few output levels"

[[decisionRows]]
task = "Definite Integral"
context = "A formula in one variable: total cost from marginal cost, consumer surplus, present value, an expected value or a probability"
purpose = "Adaptive Gauss-Kronrod refines where the integrand is hard and reports an error estimate; fixed rules show how accuracy grows with the number of points"

[[decisionRows]]
task = "Multiple Integral"
context = "A function of several variables over a rectangle or box: expected utility over two shocks, a joint probability, a volume"
purpose = "Adaptive cubature is precise in 2 to about 5 dimensions; Monte Carlo's error falls like one over the square root of the draws in any dimension"

[[decisionRows]]
task = "Sampled Data"
context = "Values observed at points rather than a formula: survey measurements, a price path, a marginal cost schedule"
purpose = "The trapezoid rule joins the points with straight lines; Simpson's rule fits parabolas and is more accurate for smooth data at equal spacing"

