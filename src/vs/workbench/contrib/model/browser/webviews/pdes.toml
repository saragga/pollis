[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "grid-convergence"
label = "Grid Convergence"
desc = "Re-solves on coarser and finer grids and measures the change against the finest one. An observed order near 2 confirms the second-order finite differences; a much lower order points to a kink, a discontinuity or too coarse a grid"
code = '''
using Plots
{{?model=heat|wave}} probes = range(0.2L, 0.8L, length=7)
{{?model=heat|wave}} endprofile(n) = (Q = setup(n); s = solve_with(alg, Q.prob; reltol=1e-10); (Q.h, [interp(Q.xs, Q.ufield(s.u[end]), x) for x in probes]))
{{?model=heat|wave}} ns = [div(nx, 4), div(nx, 2), nx]; ref = endprofile(4nx)[2]
{{?model=heat|wave}} res = endprofile.(ns); errs = [maximum(abs.(r[2] .- ref)) for r in res]
{{?model=poisson}} centre(n) = (Q = setup(n); m = div(n + 1, 2); (Q.h, (Q.A \ Q.b)[m + (m - 1) * n]))  # value at (L/2, L/2)
{{?model=poisson}} ns = [7, 15, 31, 63, 127]; ref = centre(255)[2]
{{?model=poisson}} res = centre.(ns); errs = [abs(r[2] - ref) for r in res]
hs = first.(res)
display(Plots.plot(hs, errs, xscale=:log10, yscale=:log10, m=:circle, lw=2, label="change against the finest grid", xlabel="grid spacing h", ylabel="error", title="Grid convergence"))
[(grid_points = ns[k], spacing = hs[k], error = errs[k], observed_order = k == 1 ? missing : log(errs[k - 1] / errs[k]) / log(hs[k - 1] / hs[k])) for k in eachindex(ns)]
'''

[[actionGroups.actions]]
id = "stability-check"
label = "Stiffness and Conditioning"
desc = "Heat: the decay rates of the discrete diffusion operator, the forward-Euler step limit h^2 / 2D and the stiffness ratio. Wave: the CFL time step h / c. Poisson: the condition number of the linear system and the conjugate-gradient iterations it implies"
code = '''
using LinearAlgebra
{{?model=heat|wave}} ev = abs.(eigvals(Symmetric(Matrix(P.A))))  # decay rates of the discrete second derivative
{{?model=heat|wave}} rates = filter(>(1e-9 * maximum(ev)), ev)  # drop the zero mode of no-flux and periodic boundaries
{{?model=heat|wave}} avg_step = (tspan[2] - tspan[1]) / (length(sol.t) - 1)
{{?model=heat}} (fastest_decay_rate = D * maximum(rates), slowest_decay_rate = D * minimum(rates), stiffness_ratio = maximum(rates) / minimum(rates), forward_euler_step_limit = 2 / (D * maximum(rates)), steps_taken = length(sol.t) - 1, average_step = avg_step, note = "the stiffness ratio grows like 1/h^2: refining the grid makes explicit solvers hopeless and implicit ones essential")
{{?model=wave}} (highest_frequency = c * sqrt(maximum(rates)), lowest_frequency = c * sqrt(minimum(rates)), cfl_time_step = h / c, steps_taken = length(sol.t) - 1, average_step = avg_step, note = "waves oscillate rather than decay, so they are not stiff: explicit solvers need steps of order h / c, and implicit ones add numerical damping")
{{?model=poisson}} lmin = 8 / h^2 * sin(pi * h / (2L))^2; lmax = 8 / h^2 * cos(pi * h / (2L))^2
{{?model=poisson}} (smallest_eigenvalue = lmin, largest_eigenvalue = lmax, condition_number = lmax / lmin, expected_cg_iterations = ceil(Int, sqrt(lmax / lmin) / 2 * log(2 / {{ptol}})), cg_iterations_taken = psolve("cg", P)[2], note = "the condition number grows like 1/h^2, so conjugate gradients needs about twice the iterations each time h is halved")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "probe"
label = "Probes and Cross-Sections"
desc = "Heat and wave: u over time at x = L/4, L/2 and 3L/4, like sensors placed along the rod or string. Poisson: the solution along the two lines through the centre of the square"
code = '''
using Plots
{{?model=heat|wave}} ts = range(tspan[1], tspan[2], length=300); pts = [L / 4, L / 2, 3L / 4]
{{?model=heat|wave}} p = Plots.plot(xlabel="t", ylabel="u", title="u over time at three points")
{{?model=heat|wave}} for x in pts; Plots.plot!(p, ts, [interp(xs, u_at(t), x) for t in ts], lw=2, label="x = $(round(x, sigdigits=3))"); end
{{?model=heat|wave}} display(p)
{{?model=heat|wave}} [(x = x, at_start = interp(xs, u_at(tspan[1]), x), at_middle = interp(xs, u_at(sum(tspan) / 2), x), at_end = interp(xs, u_at(tspan[2]), x)) for x in pts]
{{?model=poisson}} m = div(np + 1, 2)
{{?model=poisson}} display(Plots.plot(xs, [U[:, m] U[m, :]], lw=2, label=["along x at y = $(round(xs[m], sigdigits=3))" "along y at x = $(round(xs[m], sigdigits=3))"], xlabel="position", ylabel="u", title="Cross-sections through the centre"))
{{?model=poisson}} (centre_value = U[m, m], average_on_line_along_x = sum(U[:, m]) / np, average_on_line_along_y = sum(U[m, :]) / np)
'''

[[actionGroups.actions]]
id = "long-run"
label = "Long-Run Behaviour"
desc = "Heat: solves to ten times the horizon and tracks how fast u is still changing; a straight fall on the log scale is exponential approach to steady state. Wave: the amplitude over ten times the horizon, which should not decay. Poisson: runs the heat equation with this source and shows it settling to the Poisson solution"
code = '''
using Plots, LinearAlgebra
{{?model=heat|wave}} long = solve_with(alg, remake(prob; tspan=(0.0, 10 * tspan[2]))); tl = range(0.0, 10 * tspan[2], length=400)
{{?model=heat}} rate = [sqrt(h) * norm(prob.f(long(t), nothing, t)) for t in tl]
{{?model=heat}} display(Plots.plot(tl, max.(rate, 1e-16), yscale=:log10, lw=2, label="", xlabel="t", ylabel="size of du/dt", title="Approach to steady state"))
{{?model=heat}} (final_minimum = minimum(long.u[end]), final_maximum = maximum(long.u[end]), final_rate_of_change = rate[end], note = "a straight fall on the log scale means exponential decay at the rate of the slowest mode")
{{?model=wave}} amp = [maximum(abs, P.ufield(long(t))) for t in tl]
{{?model=wave}} display(Plots.plot(tl, amp, lw=2, label="", xlabel="t", ylabel="largest |u|", title="Amplitude over a long run ($alg)"))
{{?model=wave}} (initial_amplitude = amp[1], final_amplitude = amp[end], steps = length(long.t) - 1, note = "the exact wave equation never loses energy; a steady fall here is numerical damping by the solver")
{{?model=poisson}} F = lu(I + 0.01 * P.A)  # implicit Euler with step 0.01 for u_t = Laplacian(u) + f, starting from u = 0
{{?model=poisson}} ws = accumulate((w, _) -> F \ (w .+ 0.01 .* P.b), 1:300; init=zeros(length(P.b))); gaps = [norm(w - uvec) / norm(uvec) for w in ws]
{{?model=poisson}} display(Plots.plot(0.01 .* (1:300), gaps, yscale=:log10, lw=2, label="", xlabel="t", ylabel="relative gap to the Poisson solution", title="Heat flow settling to the steady state"))
{{?model=poisson}} (gap_at_t_1 = gaps[100], gap_at_t_3 = gaps[300], time_to_1_percent = something(findfirst(<(0.01), gaps), missing) * 0.01)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-solvers"
label = "Compare Solvers"
desc = "Heat and wave: every time-stepper on the same grid, with its error against a tight-tolerance reference, steps, function and Jacobian evaluations and time. Poisson: the sparse direct solve against conjugate gradients"
code = '''
using LinearAlgebra
{{?model=heat}} candidates = ["fbdf", "rodas5p", "rock2", "tsit5"]; ref = solve_with("rodas5p", prob; reltol=1e-10)
{{?model=wave}} candidates = ["tsit5", "vern9", "fbdf"]; ref = solve_with("vern9", prob; reltol=1e-12)
{{?model=heat|wave}} map(candidates) do m
{{?model=heat|wave}}     try
{{?model=heat|wave}}         solve_with(m, prob)  # compile
{{?model=heat|wave}}         t = @elapsed s = solve_with(m, prob)
{{?model=heat|wave}}         (solver = m, error_at_final_time = maximum(abs.(P.ufield(s.u[end]) .- P.ufield(ref.u[end]))), steps = length(s.t) - 1, f_evaluations = s.stats.nf, jacobians = s.stats.njacs, seconds = round(t, sigdigits=3), retcode = string(s.retcode))
{{?model=heat|wave}}     catch e
{{?model=heat|wave}}         (solver = m, error_at_final_time = missing, steps = missing, f_evaluations = missing, jacobians = missing, seconds = missing, retcode = sprint(showerror, e))
{{?model=heat|wave}}     end
{{?model=heat|wave}} end
{{?model=poisson}} map(["direct", "cg"]) do m
{{?model=poisson}}     psolve(m, P)  # compile
{{?model=poisson}}     t = @elapsed (x, its) = psolve(m, P)
{{?model=poisson}}     (method = m, iterations = its, seconds = round(t, sigdigits=3), relative_residual = norm(P.A * x - P.b) / norm(P.b), difference_from_direct = norm(x - P.A \ P.b) / norm(P.A \ P.b))
{{?model=poisson}} end
'''

[[actionGroups.actions]]
id = "exact-solution"
label = "Exact-Solution Test"
desc = "Runs the same code on a problem with a known answer, a decaying sine mode (heat), a standing wave (wave) or u = sin sin (Poisson), on this grid and on one twice as fine. The error should fall by about four: that verifies the discretisation, not just the solver"
code = '''
using Plots, LinearAlgebra
mode(x) = sin(pi * x / L)
{{?model=heat}} exact(x, t) = mode(x) * exp(-D * (pi / L)^2 * t)
{{?model=heat}} test(n) = (Q = setup(n; init=mode, bcond="dirichlet", ends=(0.0, 0.0), reac=(u, x, t) -> 0.0); s = solve_with(alg, Q.prob; reltol=1e-10); (Q.xs, Q.ufield(s.u[end]), exact.(Q.xs, tspan[2])))
{{?model=wave}} exact(x, t) = mode(x) * cos(c * pi * t / L)
{{?model=wave}} test(n) = (Q = setup(n; init=mode, vel=x -> 0.0, bcond="dirichlet", ends=(0.0, 0.0)); s = solve_with(alg, Q.prob; reltol=1e-10); (Q.xs, Q.ufield(s.u[end]), exact.(Q.xs, tspan[2])))
{{?model=heat|wave}} n1 = nx
{{?model=poisson}} test(n) = (Q = setup(n; f=(x, y) -> 2 * (pi / L)^2 * mode(x) * mode(y)); (Q.xs, psolve(method, Q)[1], vec([mode(x) * mode(y) for x in Q.xs, y in Q.xs])))
{{?model=poisson}} n1 = np
coarse = test(n1); fine = test(2n1 + 1)
e1 = maximum(abs.(coarse[2] .- coarse[3])); e2 = maximum(abs.(fine[2] .- fine[3]))
{{?model=heat|wave}} p = Plots.plot(coarse[1], coarse[3], lw=3, c=:black, label="exact", xlabel="x", title="Numerical against exact at t = $(tspan[2])")
{{?model=heat|wave}} Plots.scatter!(p, coarse[1], coarse[2], ms=2, label="numerical, $n1 points")
{{?model=poisson}} p = Plots.heatmap(coarse[1], coarse[1], permutedims(reshape(coarse[2] .- coarse[3], n1, n1)), aspect_ratio=1, xlabel="x", ylabel="y", title="Numerical minus exact")
display(p)
(error_on_this_grid = e1, error_with_half_the_spacing = e2, ratio = e1 / e2, note = "a ratio near 4 confirms second-order accuracy in space")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "conservation"
label = "Conservation Check"
desc = "Heat: total amount h * sum(u) over time, constant with no-flux or periodic boundaries and no reaction, otherwise changed only by the boundaries and the reaction. Wave: total energy, which should stay constant. Poisson: total source against the outflow through the boundary"
code = '''
using Plots, LinearAlgebra
{{?model=heat|wave}} ts = range(tspan[1], tspan[2], length=300)
{{?model=heat}} q = [h * sum(u_at(t)) for t in ts]; what = "total amount h * sum(u)"
{{?model=wave}} energy(w) = (u = P.ufield(w); v = w[length(xs)+1:end]; h * (dot(v, v) / 2 - c^2 * (dot(u, P.A * u) / 2 + dot(P.bvec, u))))
{{?model=wave}} q = [energy(sol(t)) for t in ts]; what = "energy (kinetic + stretching)"
{{?model=heat|wave}} display(Plots.plot(ts, q, lw=2, label="", xlabel="t", ylabel=what, title="Conservation over time"))
{{?model=heat|wave}} (quantity = what, at_start = q[1], at_end = q[end], relative_change = (q[end] - q[1]) / max(abs(q[1]), eps()))
{{?model=poisson}} outflow = sum(U[1, :]) + sum(U[end, :]) + sum(U[:, 1]) + sum(U[:, end])  # flux u / h through each boundary edge of length h
{{?model=poisson}} (total_source = h^2 * sum(P.b), boundary_outflow = outflow, relative_difference = (outflow - h^2 * sum(P.b)) / (h^2 * sum(P.b)), note = "in steady state everything the source produces must leave through the boundary")
'''

[[actionGroups.actions]]
id = "field-summary"
label = "Field Summary"
desc = "Heat and wave: minimum, maximum, where the maximum sits and the spatial average at the start, the midpoint and the end. Poisson: the maximum, where it occurs, and the average over the square"
code = '''
{{?model=heat|wave}} map([tspan[1], sum(tspan) / 2, tspan[2]]) do t
{{?model=heat|wave}}     u = u_at(t)
{{?model=heat|wave}}     (t = t, minimum = minimum(u), maximum = maximum(u), location_of_maximum = xs[argmax(u)], spatial_average = sum(u) / length(u))
{{?model=heat|wave}} end
{{?model=poisson}} k = argmax(U)
{{?model=poisson}} (maximum = U[k], at_x = xs[k[1]], at_y = xs[k[2]], average_over_square = sum(U) / length(U), minimum = minimum(U))
'''
