# Partial Differential Equations Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/pdes.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Partial Differential Equations"
viewType = "pollis.pdes"
defaultModel = "heat"

[[packages]]
name = "OrdinaryDiffEq.jl"
github = "https://github.com/SciML/OrdinaryDiffEq.jl"

[[packages.videos]]
