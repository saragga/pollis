[[models]]
id = "heat"
label = "Heat Equation"

[[models]]
id = "wave"
label = "Wave Equation"

[[models]]
id = "poisson"
label = "Poisson Equation"

[[bullets]]
text = "Heat Equation"
detail = "u_t = D u_xx + r(u, x, t) on [0, L]: diffusion of heat, pollutants, prices or genes, optionally with a reaction term such as logistic growth"

[[bullets]]
text = "Wave Equation"
detail = "u_tt = c^2 u_xx on [0, L]: vibrating strings, sound, water waves; disturbances travel at speed c and reflect at the ends"

[[bullets]]
text = "Poisson Equation"
detail = "-(u_xx + u_yy) = f(x, y) on a square with u = 0 on the edge: steady temperature with a heat source, electric potential, a loaded membrane"

[[decisionRows]]
task = "Heat Equation"
context = "A quantity that spreads out and smooths over time: temperature, concentration, a population diffusing and growing"
purpose = "Method of lines: finite differences in x turn the PDE into a large stiff ODE system, solved by an implicit or stabilised solver"

[[decisionRows]]
task = "Wave Equation"
context = "Disturbances that travel without spreading: a plucked string, an acoustic pulse, a signal on a line"
purpose = "Method of lines with position and velocity as states, solved by an explicit solver whose step is limited by the CFL condition"

[[decisionRows]]
task = "Poisson Equation"
context = "A steady state with no time: where heat flow balances the sources, an electrostatic potential, a membrane under load"
purpose = "The five-point Laplacian gives a sparse symmetric linear system, solved directly or by conjugate gradients"

[[inputs]]
id = "L"
label = "Domain Length L"
tooltip = "The interval is [0, L]; for the Poisson equation, the square [0, L] x [0, L]."
default = "1.0"
models = ["heat", "wave", "poisson"]

[[inputs]]
id = "D"
label = "Diffusion Coefficient D"
tooltip = "How fast u spreads: a bump of width w flattens over a time of about w^2 / D."
default = "0.01"
models = ["heat"]

[[inputs]]
id = "ic"
label = "Initial Profile u(x, 0)"
tooltip = "A Julia expression in x, e.g. exp(-100 * (x - 0.5)^2) (a bump), sin(pi * x) or (x < 0.5) * 1.0 (a step)."
default = "exp(-100 * (x - 0.5)^2)"
models = ["heat"]

[[inputs]]
id = "react"
label = "Reaction Term r(u, x, t)"
tooltip = "Added to the right-hand side: 0.0 for pure diffusion, u * (1 - u) for Fisher-KPP growth, -0.5u for decay."
default = "0.0"
models = ["heat"]

[[inputs]]
id = "c"
label = "Wave Speed c"
tooltip = "The speed at which disturbances travel."
default = "0.5"
models = ["wave"]

[[inputs]]
id = "wic"
label = "Initial Displacement u(x, 0)"
tooltip = "A Julia expression in x, e.g. exp(-200 * (x - 0.3)^2) (a pulse that splits into two) or sin(pi * x) (a standing wave)."
default = "exp(-200 * (x - 0.3)^2)"
models = ["wave"]

[[inputs]]
id = "wvel"
label = "Initial Velocity u_t(x, 0)"
tooltip = "A Julia expression in x; 0.0 releases the string from rest."
default = "0.0"
models = ["wave"]

[[inputs]]
id = "bc"
label = "Boundary Conditions"
tooltip = "Fixed values: u is held at the left and right values. No flux: nothing enters or leaves (the end values are ignored). Periodic: the right end joins the left."
kind = "select"
default = "dirichlet"
models = ["heat", "wave"]
newRow = true

[[inputs.options]]
value = "dirichlet"
label = "Fixed Values (Dirichlet)"

[[inputs.options]]
value = "neumann"
label = "No Flux (Neumann)"

[[inputs.options]]
value = "periodic"
label = "Periodic"

[[inputs]]
id = "uleft"
label = "Left Value u(0, t)"
tooltip = "Used only with fixed-value boundaries."
default = "0.0"
models = ["heat", "wave"]

[[inputs]]
id = "uright"
label = "Right Value u(L, t)"
tooltip = "Used only with fixed-value boundaries."
default = "0.0"
models = ["heat", "wave"]

[[inputs]]
id = "nx"
label = "Grid Points"
tooltip = "Interior grid points; the spacing h is about L / nx. Halving h cuts the spatial error by about four."
default = "100"
models = ["heat", "wave"]
newRow = true

[[inputs]]
id = "T"
label = "Final Time"
tooltip = "Solve from t = 0 to this time."
default = "5.0"
models = ["heat", "wave"]

[[inputs]]
id = "halg"
label = "Solver"
tooltip = "FBDF and Rodas5P: implicit, for the stiff systems diffusion produces. ROCK2: stabilised explicit, cheap per step and good for moderately stiff diffusion. Tsit5: explicit, forced into tiny steps by stiffness (for comparison)."
kind = "select"
default = "fbdf"
models = ["heat"]

[[inputs.options]]
value = "fbdf"
label = "FBDF (Stiff)"

[[inputs.options]]
value = "rodas5p"
label = "Rodas5P (Stiff)"

[[inputs.options]]
value = "rock2"
label = "ROCK2 (Stabilised Explicit)"

[[inputs.options]]
value = "tsit5"
label = "Tsit5 (Explicit)"

[[inputs]]
id = "walg"
label = "Solver"
tooltip = "Tsit5: explicit, the default for waves. Vern9: high-order explicit, least numerical dispersion. FBDF: implicit, which damps waves numerically (for comparison)."
kind = "select"
default = "tsit5"
models = ["wave"]

[[inputs.options]]
value = "tsit5"
label = "Tsit5 (Explicit)"

[[inputs.options]]
value = "vern9"
label = "Vern9 (High Accuracy)"

[[inputs.options]]
value = "fbdf"
label = "FBDF (Implicit)"

[[inputs]]
id = "tol"
label = "Relative Tolerance"
tooltip = "The time-stepping tolerance. The spatial error, set by the grid, does not shrink with it."
default = "1e-6"
models = ["heat", "wave"]

[[inputs]]
id = "src"
label = "Source f(x, y)"
tooltip = "A Julia expression in x and y, e.g. 1.0 (uniform heating) or 100 * exp(-50 * ((x - 0.3)^2 + (y - 0.6)^2)) (a hot spot)."
default = "1.0"
models = ["poisson"]

[[inputs]]
id = "np"
label = "Grid Points per Side"
tooltip = "Interior points in each direction; the system has this number squared unknowns. Odd numbers put a grid point at the centre."
default = "49"
models = ["poisson"]

[[inputs]]
id = "pmethod"
label = "Linear Solver"
tooltip = "Direct: sparse factorisation, exact up to rounding, fast for 2-D grids of this size. Conjugate Gradients: iterative, low memory, the standard for large 3-D problems; its iteration count grows with the grid."
kind = "select"
default = "direct"
models = ["poisson"]
newRow = true

[[inputs.options]]
value = "direct"
label = "Direct (Sparse LU)"

[[inputs.options]]
value = "cg"
label = "Conjugate Gradients"

[[inputs]]
id = "ptol"
label = "CG Tolerance"
tooltip = "Conjugate gradients stops when the residual has fallen by this factor."
default = "1e-8"
models = ["poisson"]

[[codeBranches]]
model = "heat"
code = '''
using OrdinaryDiffEq, SparseArrays, LinearAlgebra

L = float({{L}})
D = float({{D}})
u_init(x) = {{ic}}
reaction(u, x, t) = {{react}}
bc = "{{bc}}"
uL, uR = float({{uleft}}), float({{uright}})
nx = {{nx}}
function grid(n, bcond, ends)  # grid points, spacing, second-difference matrix and boundary vector
    h = bcond == "dirichlet" ? L / (n + 1) : L / n
    xs = bcond == "dirichlet" ? h .* (1:n) : bcond == "neumann" ? h .* ((1:n) .- 0.5) : h .* (0:n-1)
    A = spdiagm(-1 => ones(n - 1), 0 => fill(-2.0, n), 1 => ones(n - 1))
    bvec = zeros(n)
    if bcond == "dirichlet"
        bvec[1], bvec[n] = ends
    elseif bcond == "neumann"
        A[1, 1] = A[n, n] = -1.0  # homogeneous no-flux ends (ghost cells): uleft and uright are not used
    else
        A[1, n] = A[n, 1] = 1.0
    end
    return collect(xs), h, A ./ h^2, bvec ./ h^2
end
function setup(n; init=u_init, bcond=bc, ends=(uL, uR), reac=reaction, tmax=float({{T}}))
    xs, h, A, bvec = grid(n, bcond, ends)
    rhs(u, p, t) = D .* (A * u .+ bvec) .+ reac.(u, xs, t)  # method of lines: one ODE per grid point
    return (prob = ODEProblem(rhs, init.(xs), (0.0, tmax)), xs = xs, h = h, A = A, bvec = bvec, ufield = u -> u)
end
interp(xg, ug, x) = (i = clamp(searchsortedlast(xg, x), 1, length(xg) - 1); w = (x - xg[i]) / (xg[i + 1] - xg[i]); (1 - w) * ug[i] + w * ug[i + 1])
algs = Dict("fbdf" => FBDF(), "rodas5p" => Rodas5P(), "rock2" => ROCK2(), "tsit5" => Tsit5(), "vern9" => Vern9())
solve_with(name, problem; reltol={{tol}}) = solve(problem, algs[name]; reltol, abstol=reltol / 1000)
alg = "{{halg}}"
P = setup(nx)
prob, xs, h, tspan = P.prob, P.xs, P.h, P.prob.tspan
sol = solve_with(alg, prob)
u_at(t) = P.ufield(sol(t))
(grid_points = nx, spacing = h, final_minimum = minimum(u_at(tspan[2])), final_maximum = maximum(u_at(tspan[2])), steps = length(sol.t) - 1, f_evaluations = sol.stats.nf, retcode = sol.retcode, solver = alg)
'''

[[codeBranches]]
model = "wave"
code = '''
using OrdinaryDiffEq, SparseArrays, LinearAlgebra

L = float({{L}})
c = float({{c}})
u_init(x) = {{wic}}
v_init(x) = {{wvel}}
bc = "{{bc}}"
uL, uR = float({{uleft}}), float({{uright}})
nx = {{nx}}
function grid(n, bcond, ends)  # grid points, spacing, second-difference matrix and boundary vector
    h = bcond == "dirichlet" ? L / (n + 1) : L / n
    xs = bcond == "dirichlet" ? h .* (1:n) : bcond == "neumann" ? h .* ((1:n) .- 0.5) : h .* (0:n-1)
    A = spdiagm(-1 => ones(n - 1), 0 => fill(-2.0, n), 1 => ones(n - 1))
    bvec = zeros(n)
    if bcond == "dirichlet"
        bvec[1], bvec[n] = ends
    elseif bcond == "neumann"
        A[1, 1] = A[n, n] = -1.0  # homogeneous no-flux ends (ghost cells): uleft and uright are not used
    else
        A[1, n] = A[n, 1] = 1.0
    end
    return collect(xs), h, A ./ h^2, bvec ./ h^2
end
function setup(n; init=u_init, vel=v_init, bcond=bc, ends=(uL, uR), tmax=float({{T}}))
    xs, h, A, bvec = grid(n, bcond, ends)
    rhs(w, p, t) = [w[n+1:end]; c^2 .* (A * w[1:n] .+ bvec)]  # state w = [u; u_t]
    return (prob = ODEProblem(rhs, [init.(xs); vel.(xs)], (0.0, tmax)), xs = xs, h = h, A = A, bvec = bvec, ufield = w -> w[1:n])
end
interp(xg, ug, x) = (i = clamp(searchsortedlast(xg, x), 1, length(xg) - 1); w = (x - xg[i]) / (xg[i + 1] - xg[i]); (1 - w) * ug[i] + w * ug[i + 1])
algs = Dict("fbdf" => FBDF(), "rodas5p" => Rodas5P(), "rock2" => ROCK2(), "tsit5" => Tsit5(), "vern9" => Vern9())
solve_with(name, problem; reltol={{tol}}) = solve(problem, algs[name]; reltol, abstol=reltol / 1000)
alg = "{{walg}}"
P = setup(nx)
prob, xs, h, tspan = P.prob, P.xs, P.h, P.prob.tspan
sol = solve_with(alg, prob)
u_at(t) = P.ufield(sol(t))
(grid_points = nx, spacing = h, cfl_time_step = h / c, final_minimum = minimum(u_at(tspan[2])), final_maximum = maximum(u_at(tspan[2])), steps = length(sol.t) - 1, f_evaluations = sol.stats.nf, retcode = sol.retcode, solver = alg)
'''

[[codeBranches]]
model = "poisson"
code = '''
using SparseArrays, LinearAlgebra, Krylov

L = float({{L}})
src(x, y) = {{src}}
np = {{np}}
method = "{{pmethod}}"
function setup(n; f=src)  # the five-point Laplacian with u = 0 on the boundary of [0, L]^2
    h = L / (n + 1)
    xs = collect(h .* (1:n))
    T1 = spdiagm(-1 => fill(-1.0, n - 1), 0 => fill(2.0, n), 1 => fill(-1.0, n - 1)) ./ h^2
    Id = sparse(1.0I, n, n)
    A = kron(Id, T1) + kron(T1, Id)  # minus the 2-D Laplacian: symmetric positive definite
    b = vec([f(x, y) for x in xs, y in xs])
    return (A = A, b = b, xs = xs, h = h)
end
function psolve(m, Q; rtol={{ptol}})  # returns the solution vector and the iteration count
    m == "direct" && return (Q.A \ Q.b, 0)
    x, stats = cg(Q.A, Q.b; atol=0.0, rtol)
    return (x, stats.niter)
end
P = setup(np)
xs, h = P.xs, P.h
uvec, iterations = psolve(method, P)
U = reshape(uvec, np, np)  # U[i, j] = u(xs[i], xs[j])
(grid = "$np x $np", unknowns = np^2, spacing = h, maximum = maximum(U), iterations = iterations, relative_residual = norm(P.A * uvec - P.b) / norm(P.b), method = method)
'''

