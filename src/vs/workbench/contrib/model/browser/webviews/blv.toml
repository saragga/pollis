[[bullets]]
text = "Bilevel Optimisation has a strategic hierarchy: a leader chooses their strategy knowing that rational followers will respond by solving their own optimisation problem. The leader anticipates this response and optimises accordingly."
detail = ""

[[bullets]]
text = "Examples: a government setting road tolls knowing drivers will re-route to minimise travel time; a firm choosing prices knowing competitors respond; adversarial machine learning where an attacker anticipates model retraining."
detail = ""

[[bullets]]
text = "The standard solution approach replaces the lower-level problem with its Karush-Kuhn-Tucker (KKT) optimality conditions, converting the bilevel problem into an MPEC solved via complementarity. BilevelJuMP.jl automates this reformulation."
detail = ""

[[models]]
id = "kkt"
label = "KKT Reformulation"

[[models]]
id = "grid"
label = "Leader Grid Search"

[[decisionRows]]
task = "KKT Reformulation"
context = "Follower problem is convex (here linear); the standard exact approach for any number of leader variables"
purpose = "Default: Bard (1998) Example 5.1.1. BilevelJuMP replaces the follower by its KKT conditions and linearises complementarity with big-M constraints (Fortuny-Amat and McCarl); HiGHS solves the resulting MILP"

[[decisionRows]]
task = "Leader Grid Search"
context = "One leader variable and a cheap follower; a transparent check that needs no reformulation or big-M"
purpose = "Evaluate the optimistic follower response y*(x) by LP on a grid of leader decisions and keep the best feasible leader objective"

[[inputs]]
id = "obj"
label = "Leader Objective F(x, y)"
tooltip = "Julia expression in the leader decision x and the follower decision y (both scalars) that the leader minimises."
default = "x - 4y"

[[inputs]]
id = "cons"
label = "Leader Constraints G(x, y) <= 0"
tooltip = "Vector of Julia expressions in x and y, each required to be <= 0 by the leader."
default = "[-x]"

[[inputs]]
id = "f"
label = "Follower Objective f(x, y)"
tooltip = "Julia expression the follower minimises over y once x is announced; must be linear in y."
default = "y"

[[inputs]]
id = "g"
label = "Follower Constraints g(x, y) <= 0"
tooltip = "Vector of Julia expressions in x and y, each required to be <= 0 in the follower problem; must be linear in y."
default = "[3 - x - y, y - 2x, 2x + y - 12, 3x - 2y - 4, -y]"

[[inputs]]
id = "bigM"
label = "Big-M"
tooltip = "Bound used to linearise complementarity for both primal slacks and follower duals. Too small cuts off the true solution; too large weakens the MILP."
default = "100"
models = ["kkt"]

[[inputs]]
id = "npts"
label = "Grid Points"
tooltip = "Number of leader decisions evaluated between the smallest and largest feasible x; each needs two follower LPs."
default = "401"
models = ["grid"]

