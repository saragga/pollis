# Score Models Webview Configuration
# A page of Compose > Prediction Challenges in the Time Arrow style of the scaffold, not a panel: only its Powered by and
# Learn More. `pageCommand` is the command that opens it, which a panel's contribution file would say. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/forecastingCompetitions.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Score Models"
viewType = "pollis.forecastingCompetitions"
pageCommand = "pollis.competitions.forecastingCompetitions"

[[packages]]
name = "PollisCompetitions.jl"
github = "https://github.com/Trumpingtons/PollisCompetitions.jl"

[[wikis]]
name = "Overview"
file = "forecastingCompetitions/overview.md"
bundled = true
description = "What the page does, its four steps, the datasets it scores models on, and how a method of your own is run and scored"

[[wikis]]
name = "Factsheet"
file = "forecastingCompetitions/factsheet.md"
bundled = true
description = "What a dataset of each kind gives, the files of a run, what a method is scored beside and the requirements at a glance"

[[wikis]]
name = "The Error Measures"
file = "forecastingCompetitions/error-measures.md"
bundled = true
description = "sMAPE, MASE and OWA: what each measures, how it is scaled, and how the totals are taken"

[[wikis]]
name = "Tabular and Survival Measures"
file = "forecastingCompetitions/tabular-survival-measures.md"
bundled = true
description = "Which measures score tabular and survival datasets, what each measures, and how a method is ranked among the published runs"

[[wikis]]
name = "Scoring a Method"
file = "forecastingCompetitions/scoring-method.md"
bundled = true
description = "Writing the forecast and predict functions, what a method is scored beside, samples of series, the splits to run, and the Next Steps"

[[wikis]]
name = "Licences and Downloads"
file = "forecastingCompetitions/licences-downloads.md"
bundled = true
description = "Where a dataset's data come from, their licence, where they are kept on this computer, and their size"

