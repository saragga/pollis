# Automatic Time-Series Forecasting Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/autotsf.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Automatic Time-Series Forecasting"
viewType = "pollis.autotsf"
defaultModel = "arima"

[[packages]]
name = "Durbyn.jl"
github = "https://github.com/taf-society/Durbyn.jl"

[requires]
packages = ["Durbyn.jl", "Plots.jl", "HypothesisTests.jl", "StatsBase.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Automatic ARIMA"
file = "autotsf/tutorial-01-auto-arima.ipynb"
bundled = true
description = "Unit-root tests pick the differencing, then a stepwise search picks the ARMA orders"

[[notebookSections.notebooks]]
name = "Automatic Exponential Smoothing"
file = "autotsf/tutorial-02-auto-ets.ipynb"
bundled = true
description = "Search the ETS family of error, trend and seasonal forms by information criterion"

[[notebookSections.notebooks]]
name = "ARAR and ARARMA"
file = "autotsf/tutorial-03-ararma.ipynb"
bundled = true
description = "Memory-shortening filters followed by a short AR or ARMA fit"

[[notebookSections.notebooks]]
name = "Model Race and Combinations"
file = "autotsf/tutorial-04-model-race.ipynb"
bundled = true
description = "Let holdout accuracy choose between automatic methods, or average them"

