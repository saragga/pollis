[[bullets]]
text = "OLS"
detail = "Ordinary Least-Squares: minimise the sum of squared residuals with equal weight on every observation"

[[bullets]]
text = "Robust Inference"
detail = "Heteroskedasticity-Consistent (HC0&#8211;HC3), Heteroskedasticity and Autocorrelation Consistent (HAC), Clustered, and Driscoll-Kraay covariance matrix estimators via Regress.jl and CovarianceMatrices.jl"

[[decisionRows]]
task = "OLS"
context = "Continuous response"
purpose = "Errors have roughly constant variance, or robust standard errors will be used"

[[decisionRows]]
task = "OLS + HC0-HC3"
context = "Heteroskedastic errors"
purpose = "Keep OLS estimates but make standard errors valid under unknown heteroskedasticity"

[[decisionRows]]
task = "OLS + HAC"
context = "Time series"
purpose = "Errors are autocorrelated as well as heteroskedastic"

[[decisionRows]]
task = "OLS + Clustered / Driscoll-Kraay"
context = "Grouped or panel data"
purpose = "Errors are correlated within clusters, or across entities and over time"

[[codeBranches]]
model = "*"
code = '''
{{?model=standard}}using GLM, Random
{{?model=hc|hac}}using Regress, Random  # least squares with robust standard errors
{{?model=clustered|dk}}using Regress, PollisDatasets  # least squares with robust standard errors; curated example datasets

{{?model=standard}}# Simulated example data: 500 independent observations with constant error variance. Replace it with your own table.
{{?model=hc}}# Simulated example data: 500 independent observations whose error variance grows with x1. Replace it with your own table.
{{?model=hac}}# Simulated example data: one series observed over 200 periods, with autocorrelated errors. Replace it with your own table.
{{?model=clustered|dk}}# Example data: Munnell (1990), output, capital and employment of 48 US states observed yearly over 1970-1986. Replace it with your own table.
{{?model!=clustered|dk}}rng  = Xoshiro(42);  # fixed seed: the same data on every run
{{?model=standard|hc}}n  = 500;
{{?model=standard|hc}}x1 = randn(rng, n);
{{?model=standard|hc}}x2 = randn(rng, n);
{{?model=standard}}e  = randn(rng, n);  # independent errors with constant variance
{{?model=hc}}e  = exp.(0.5 .* x1) .* randn(rng, n);  # error spread grows with x1: heteroskedastic
{{?model=hac}}n  = 200;
{{?model=hac}}x1 = zeros(n);
{{?model=hac}}e  = zeros(n);
{{?model=hac}}for i in 2:n
{{?model=hac}}	x1[i] = 0.7 * x1[i-1] + randn(rng)  # persistent predictor
{{?model=hac}}	e[i]  = 0.6 * e[i-1] + randn(rng)  # AR(1) errors: autocorrelated
{{?model=hac}}end
{{?model=hac}}x2 = randn(rng, n);
{{?model!=clustered|dk}}y  = 1.0 .+ 2.0 .* x1 .- 1.5 .* x2 .+ e;  # true coefficients 1, 2 and -1.5
{{?model=standard|hc}}data = (; y, x1, x2);  # a named tuple of columns is a Tables.jl table
{{?model=hac}}data = (; y, x1, x2);  # rows in time order, as HAC requires
{{?model=clustered|dk}}data = dataset("produc");  # one row per state and year; datasetinfo("produc") describes the columns

{{?model=standard}}model = lm(@formula(y ~ x1 + x2), data);  # least squares, classical standard errors
{{?model=hc}}model = Regress.ols(data, @formula(y ~ x1 + x2)) + vcov(HC3());  # heteroskedasticity-robust; HC0, HC1, HC2 and HC3 all work
{{?model=hac}}model = Regress.ols(data, @formula(y ~ x1 + x2)) + vcov(Bartlett{NeweyWest}());  # Newey-West HAC, data-driven bandwidth
{{?model=clustered}}model = Regress.ols(data, @formula(log(gsp) ~ log(pcap) + log(pc) + log(emp) + unemp), save_cluster=:state) + vcov(CR1(:state));  # production function, cluster-robust by state
{{?model=dk}}model = Regress.ols(data, @formula(log(gsp) ~ log(pcap) + log(pc) + log(emp) + unemp)) + vcov(DriscollKraay(Bartlett(2), tis=data.year, iis=data.state));  # production function, Driscoll-Kraay with 2 lags (rule of thumb for 17 years)

display(coeftable(model))  # estimates, standard errors, t-values, p-values and 95% intervals
println("R2 = ", r2(model))  # share of variance explained
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fitted-observed"
label = "Fitted vs Observed"
desc = "Fitted values against the observed response"
code = '''
using Plots

yhat = fitted(model);
y    = response(model);  # observed response
scatter(yhat, y, xlabel="Fitted", ylabel="Observed", label=false, alpha=0.5)
plot!(identity, extrema(yhat)..., linestyle=:dash, label="45-degree line")  # perfect-fit reference
'''

[[actionGroups.actions]]
id = "coef-plot"
label = "Coefficient Plot"
desc = "Estimates with 95% confidence intervals from the selected standard errors"
code = '''
using Plots, Distributions

est = coef(model);
hw  = quantile(TDist(dof_residual(model)), 0.975) .* stderror(model);  # 95% half-width
k   = length(est);
scatter(est, 1:k, xerror=hw, yticks=(1:k, coefnames(model)), label=false)
vline!([0], linestyle=:dash, label=false)  # zero-effect reference
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals-fitted"
label = "Residuals vs Fitted"
desc = "Check linearity and constant variance"
code = '''
using Plots

scatter(fitted(model), residuals(model), xlabel="Fitted", ylabel="Residual", label=false, alpha=0.5)
hline!([0], linestyle=:dash, label=false)  # a funnel shape suggests heteroskedasticity
'''

[[actionGroups.actions]]
id = "qq-residuals"
label = "Residual Q-Q Plot"
desc = "Compare residuals with a normal distribution"
code = '''
using StatsPlots, Distributions, Statistics

r = residuals(model)
qqplot(Normal(), (r .- mean(r)) ./ std(r), xlabel="Normal quantiles", ylabel="Standardised residual quantiles")  # points near the line = normal errors
'''

[[actionGroups.actions]]
id = "influence"
label = "Leverage and Influence"
desc = "Hat-matrix leverage and Cook distance"
code = '''
X  = modelmatrix(model);
h  = vec(sum((X / (transpose(X) * X)) .* X, dims=2));  # diagonal of the hat matrix
n, p = size(X);
s2 = deviance(model) / dof_residual(model);  # residual variance
d  = residuals(model) .^ 2 .* h ./ (p .* s2 .* (1 .- h) .^ 2);  # Cook distance of each observation
println("High leverage (h > 2p/n): ", findall(h .> 2p / n))
println("Influential (D > 4/n):    ", findall(d .> 4 / n))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "predict-ci"
label = "Confidence Interval"
desc = "Predicted mean with a 95% confidence interval"
code = '''
using Distributions

newdata = map(c -> c[1:5], data);  # first 5 rows; replace with new observations
X0   = modelcols(formula(model).rhs, newdata);  # design matrix of the new rows
yhat = X0 * coef(model);
se   = sqrt.(vec(sum((X0 * vcov(model)) .* X0, dims=2)));  # standard error of the mean
q    = quantile(TDist(dof_residual(model)), 0.975);
println((prediction=yhat, lower=yhat .- q .* se, upper=yhat .+ q .* se))
'''

[[actionGroups.actions]]
id = "predict-pi"
label = "Prediction Interval"
desc = "Range for a new individual observation"
code = '''
using Distributions

newdata = map(c -> c[1:5], data);  # first 5 rows; replace with new observations
X0   = modelcols(formula(model).rhs, newdata);  # design matrix of the new rows
yhat = X0 * coef(model);
s2   = deviance(model) / dof_residual(model);  # error variance of one observation (assumes constant variance)
se   = sqrt.(vec(sum((X0 * vcov(model)) .* X0, dims=2)) .+ s2);  # mean uncertainty + noise of one new observation
q    = quantile(TDist(dof_residual(model)), 0.975);
println((prediction=yhat, lower=yhat .- q .* se, upper=yhat .+ q .* se))  # wider than the confidence interval
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "nested-ftest"
label = "Nested F-Test"
desc = "Does x2 improve the fit? F-test of the model without it against the full model"
models = ["standard"]
code = '''
small = lm(@formula(y ~ x1), data);  # the same model without x2
ftest(small.model, model.model)  # a small p-value: x2 improves the fit
'''

[[actionGroups.actions]]
id = "hc-variants"
label = "HC Variants"
desc = "Classical standard errors against HC0, HC1, HC2 and HC3"
models = ["hc"]
code = '''
using Printf, LinearAlgebra

X  = modelmatrix(model);
s2 = deviance(model) / dof_residual(model);
classical = sqrt.(s2 .* diag(inv(transpose(X) * X)));  # assumes iid errors
se = ["Classical" => classical,
	"HC0" => stderror(model + vcov(HC0())),  # White (1980)
	"HC1" => stderror(model + vcov(HC1())),  # degrees-of-freedom correction
	"HC2" => stderror(model + vcov(HC2())),  # leverage-adjusted
	"HC3" => stderror(model + vcov(HC3()))];  # jackknife-like, safest in small samples
@printf("%-12s", ""); foreach(p -> @printf("%14s", first(p)), se); println()
for (i, name) in enumerate(coefnames(model))
	@printf("%-12s", name); foreach(p -> @printf("%14.4f", last(p)[i]), se); println()
end
'''

[[actionGroups.actions]]
id = "hac-kernels"
label = "HAC Kernels"
desc = "Classical standard errors against the Newey-West, Parzen and Andrews quadratic spectral estimators"
models = ["hac"]
code = '''
using Printf, LinearAlgebra

X  = modelmatrix(model);
s2 = deviance(model) / dof_residual(model);
classical = sqrt.(s2 .* diag(inv(transpose(X) * X)));  # assumes iid errors
se = ["Classical" => classical,
	"Newey-West" => stderror(model + vcov(Bartlett{NeweyWest}())),  # Newey-West (1987): Bartlett kernel
	"Parzen" => stderror(model + vcov(Parzen{NeweyWest}())),  # Gallant (1987): Parzen kernel
	"Andrews QS" => stderror(model + vcov(QuadraticSpectral{Andrews}()))];  # Andrews (1991): quadratic spectral kernel, plug-in bandwidth
@printf("%-12s", ""); foreach(p -> @printf("%14s", first(p)), se); println()
for (i, name) in enumerate(coefnames(model))
	@printf("%-12s", name); foreach(p -> @printf("%14.4f", last(p)[i]), se); println()
end
'''

[[actionGroups.actions]]
id = "clustering-effect"
label = "Clustering Effect"
desc = "Classical, heteroskedasticity-robust (HC1) and clustered standard errors"
models = ["clustered"]
code = '''
using Printf, LinearAlgebra

X  = modelmatrix(model);
s2 = deviance(model) / dof_residual(model);
classical = sqrt.(s2 .* diag(inv(transpose(X) * X)));  # assumes iid errors
se = ["Classical" => classical,
	"HC1" => stderror(model + vcov(HC1())),  # robust to heteroskedasticity only
	"Clustered" => stderror(model)];  # also robust to correlation within each state
@printf("%-12s", ""); foreach(p -> @printf("%14s", first(p)), se); println()
for (i, name) in enumerate(coefnames(model))
	@printf("%-12s", name); foreach(p -> @printf("%14.4f", last(p)[i]), se); println()
end
'''

[[actionGroups.actions]]
id = "cross-sectional-dependence"
label = "Cross-Sectional Dependence"
desc = "Classical, clustered by state and Driscoll-Kraay standard errors"
models = ["dk"]
code = '''
using Printf, LinearAlgebra

X  = modelmatrix(model);
s2 = deviance(model) / dof_residual(model);
classical = sqrt.(s2 .* diag(inv(transpose(X) * X)));  # assumes iid errors
clustered = Regress.ols(data, @formula(log(gsp) ~ log(pcap) + log(pc) + log(emp) + unemp), save_cluster=:state) + vcov(CR1(:state));
se = ["Classical" => classical,
	"Clustered" => stderror(clustered),  # correlation within each state over time
	"Driscoll-Kraay" => stderror(model)];  # also correlation across states in the same year
@printf("%-12s", ""); foreach(p -> @printf("%14s", first(p)), se); println()
for (i, name) in enumerate(coefnames(model))
	@printf("%-12s", name); foreach(p -> @printf("%14.4f", last(p)[i]), se); println()
end
'''

[[actionGroups.actions]]
id = "replicate"
label = "Replicate"
desc = "Rerun this code on data with published results: Baltagi (2005, p. 25, Table 2.6) and Petersen's test data (Kellogg web page, published tables)"
models = ["clustered", "dk"]
code = '''
using Downloads, LinearAlgebra, Printf

# 1. Baltagi (2005, p. 25, Table 2.6), OLS row: this model on Munnell's data, classical standard errors, published to 3 decimals
baltagi = Dict("log(pcap)" => (0.155, 0.017), "log(pc)" => (0.309, 0.010), "log(emp)" => (0.594, 0.014), "unemp" => (-0.007, 0.001));
X  = modelmatrix(model);
s2 = deviance(model) / dof_residual(model);
classical = sqrt.(s2 .* diag(inv(transpose(X) * X)));  # Baltagi reports classical standard errors
@printf("%-12s%12s%10s%11s%12s%10s%11s\n", "Baltagi", "Coef", "rounded", "published", "SE", "rounded", "published")
for (i, name) in enumerate(coefnames(model))
	haskey(baltagi, name) || continue  # the intercept is not published
	b, se = baltagi[name]
	same = round(coef(model)[i], digits=3) == b && round(classical[i], digits=3) == se
	@printf("%-12s%12.6f%10.3f%11.3f%12.6f%10.3f%11.3f  %s\n", name, coef(model)[i], coef(model)[i], b, classical[i], classical[i], se, same ? "same to 3 decimals" : "DIFFERENT")
end

# 2. Petersen's test data (Kellogg web page, tables of OLS, White and clustered standard errors): 5000 firm-years, published estimates for x to 4 decimals
file = Downloads.download("https://www.kellogg.northwestern.edu/faculty/petersen/htm/papers/se/test_data.txt");
rows = split.(readlines(file));  # firm, year, x, y
test = (firmid = parse.(Int, getindex.(rows, 1)), year = parse.(Int, getindex.(rows, 2)), x = parse.(Float64, getindex.(rows, 3)), y = parse.(Float64, getindex.(rows, 4)));
ols = Regress.ols(test, @formula(y ~ x));  # Regress reports White (HC1) standard errors by default
k   = findfirst(==("x"), coefnames(ols));
Xt  = modelmatrix(ols);
petersen = ["Coefficient"       => (coef(ols)[k], 1.0348),
	"OLS SE"            => (sqrt(deviance(ols) / dof_residual(ols) * inv(transpose(Xt) * Xt)[k, k]), 0.0286),
	"White SE"          => (stderror(ols + vcov(HC1()))[k], 0.0284),
	"Firm-clustered SE" => (stderror(Regress.ols(test, @formula(y ~ x), save_cluster=:firmid) + vcov(CR1(:firmid)))[k], 0.0506),
	"Year-clustered SE" => (stderror(Regress.ols(test, @formula(y ~ x), save_cluster=:year) + vcov(CR1(:year)))[k], 0.0334)];
@printf("\n%-20s%12s%10s%11s\n", "Petersen: x", "Julia", "rounded", "published")
for (label, (value, published)) in petersen
	@printf("%-20s%12.6f%10.4f%11.4f  %s\n", label, value, value, published, round(value, digits=4) == published ? "same to 4 decimals" : "DIFFERENT")
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "coefficients"
label = "Confidence Intervals"
desc = "95% confidence intervals of the coefficients, from the selected standard errors"
code = '''
confint(model)  # one row per coefficient: lower and upper bound
'''

[[actionGroups.actions]]
id = "standardised"
label = "Standardised Coefficients"
desc = "Effect of a one-standard-deviation change in each predictor"
code = '''
using Statistics

X = modelmatrix(model)[:, 2:end];  # predictors without the intercept
beta_std = coef(model)[2:end] .* vec(std(X; dims=1)) ./ std(response(model));  # standardised effects
println(beta_std)
'''
