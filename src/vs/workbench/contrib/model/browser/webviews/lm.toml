# Linear Regression Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/lm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Linear Regression"
viewType = "pollis.lm"
defaultModel = "standard"

[requires]
packages = ["Distributions.jl", "Plots.jl", "StatsPlots.jl"]

