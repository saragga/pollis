[[models]]
id = "ols"
label = "OLS"

[[models]]
id = "wls"
label = "WLS"

[[bullets]]
text = "OLS"
detail = "Ordinary Least-Squares: minimise the sum of squared residuals with equal weight on every observation"

[[bullets]]
text = "WLS"
detail = "Weighted Least-Squares: weight each observation, e.g. by inverse variance, when errors are heteroskedastic with a known pattern"

[[bullets]]
text = "Robust Inference"
detail = "Heteroskedasticity-Consistent (HC0&#8211;HC3), Heteroskedasticity and Autocorrelation Consistent (HAC), Clustered, and Driscoll-Kraay covariance matrix estimators via CovarianceMatrices.jl"

[[decisionRows]]
task = "OLS"
context = "Continuous response"
purpose = "Errors have roughly constant variance, or robust standard errors will be used"

[[decisionRows]]
task = "WLS"
context = "Continuous response with weights"
purpose = "Error variance differs across observations in a known way, or rows are group averages"

[[decisionRows]]
task = "OLS + HC0-HC3"
context = "Heteroskedastic errors"
purpose = "Keep OLS estimates but make standard errors valid under unknown heteroskedasticity"

[[decisionRows]]
task = "OLS + HAC"
context = "Time series"
purpose = "Errors are autocorrelated as well as heteroskedastic"

[[decisionRows]]
task = "OLS + Clustered / Driscoll-Kraay"
context = "Grouped or panel data"
purpose = "Errors are correlated within clusters, or across entities and over time"

[[inputs]]
id = "formula"
label = "Formula"
tooltip = "Julia formula using the @formula macro. The response variable goes on the left of ~, predictors on the right. Example: y ~ x1 + x2. Use x1*x2 for interaction terms (includes main effects), x1:x2 for the interaction only."
default = "y ~ x1 + x2"

[[inputs]]
id = "data"
label = "Data"
tooltip = "Table containing all variables referenced in the formula: any Tables.jl source, e.g. a named tuple of vectors or a CSV.File. Column names must match the formula symbols exactly."
default = "data"

[[inputs]]
id = "weights"
label = "Weights"
tooltip = "Weight vector for weighted least squares (WLS). Must have the same length as the number of rows in the data."
default = "w"
models = ["wls"]

[[inputs]]
id = "inference"
label = "Inference"
tooltip = "Standard errors: model-based (Standard), heteroskedasticity-consistent (HC0-HC3), heteroskedasticity and autocorrelation consistent (HAC), clustered, or Driscoll-Kraay (cross-sectional and serial dependence in panels) via CovarianceMatrices.jl"
kind = "select"
newRow = true

[[inputs.options]]
value = "standard"
label = "Standard"

[[inputs.options]]
value = "HC0"
label = "HC0"

[[inputs.options]]
value = "HC1"
label = "HC1"

[[inputs.options]]
value = "HC2"
label = "HC2"

[[inputs.options]]
value = "HC3"
label = "HC3"

[[inputs.options]]
value = "HAC"
label = "HAC"

[[inputs.options]]
value = "clustered"
label = "Clustered"

[[inputs.options]]
value = "driscoll-kraay"
label = "Driscoll-Kraay"

[[inputs]]
id = "cluster"
label = "Cluster Variable"
tooltip = "Column of the data table that identifies the clusters (e.g. firm or school)"
default = "cluster_id"
when = "inference=clustered"

[[inputs]]
id = "dktime"
label = "Time Variable"
tooltip = "Column of the data table with the time period of each observation"
default = "year"
when = "inference=driscoll-kraay"

[[inputs]]
id = "dkentity"
label = "Entity Variable"
tooltip = "Column of the data table that identifies the panel entity of each observation"
default = "firm"
when = "inference=driscoll-kraay"

