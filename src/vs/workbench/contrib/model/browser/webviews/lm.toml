[[codeBranches]]
model = "*"
code = '''
{{?inference=standard}}using GLM  # linear models
{{?inference!=standard}}using GLM, CovarianceMatrices  # linear models + robust standard errors

{{?model=ols}}model = lm(@formula({{formula}}), {{data}})  # ordinary least squares
{{?model=wls}}model = lm(@formula({{formula}}), {{data}}, wts={{weights}})  # weighted least squares

{{?inference=HC0|HC1|HC2|HC3}}V = vcov(model, {{inference}}())  # robust variance-covariance matrix
{{?inference=HAC}}V = vcov(model, HAC(BartlettKernel(), NeweyWest()))  # robust variance-covariance matrix
{{?inference=clustered}}V = vcov(model, CRHC0({{data}}[:, :{{cluster}}]))  # cluster-robust variance-covariance matrix
{{?inference=driscoll-kraay}}V = vcov(DriscollKraay(Bartlett(5), tis={{data}}.{{dktime}}, iis={{data}}.{{dkentity}}), model)  # Driscoll-Kraay variance-covariance matrix
{{?inference!=standard}}println(coeftable(model, V))  # coefficients with robust SEs
{{?inference=standard}}println(coeftable(model))  # coefficient table

println("R² = ", r2(model))  # share of variance explained
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fitted-observed"
label = "Fitted vs Observed"
desc = "Fitted values against the observed response"
code = '''
using GLM, Plots

yhat = predict(model)  # fitted values
y    = response(model)  # observed response
scatter(yhat, y, xlabel="Fitted", ylabel="Observed", label=false, alpha=0.5)
plot!(identity, extrema(yhat)..., linestyle=:dash, label="45-degree line")  # perfect-fit reference
'''

[[actionGroups.actions]]
id = "coef-plot"
label = "Coefficient Plot"
desc = "Estimates with 95% confidence intervals"
code = '''
using GLM, Plots

est = coef(model)  # point estimates
ci  = confint(model)  # 95% confidence intervals (p x 2)
k   = length(est)
scatter(est, 1:k, xerror=(est .- ci[:, 1], ci[:, 2] .- est), yticks=(1:k, coefnames(model)), label=false)
vline!([0], linestyle=:dash, label=false)  # zero-effect reference
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals-fitted"
label = "Residuals vs Fitted"
desc = "Check linearity and constant variance"
code = '''
using GLM, Plots

r = residuals(model)  # raw residuals
scatter(predict(model), r, xlabel="Fitted", ylabel="Residual", label=false, alpha=0.5)
hline!([0], linestyle=:dash, label=false)  # a funnel shape suggests heteroskedasticity
'''

[[actionGroups.actions]]
id = "qq-residuals"
label = "Residual Q-Q Plot"
desc = "Compare residuals with a normal distribution"
code = '''
using GLM, StatsPlots, Distributions

qqplot(Normal(), residuals(model), xlabel="Normal quantiles", ylabel="Residual quantiles")  # points near the line = normal errors
'''

[[actionGroups.actions]]
id = "influence"
label = "Leverage and Influence"
desc = "Hat-matrix leverage and Cook distance"
code = '''
using GLM

h = leverage(model)  # diagonal of the hat matrix
d = cooksdistance(model)  # Cook distance of each observation
n, p = nobs(model), length(coef(model))
println("High leverage (h > 2p/n): ", findall(h .> 2p / n))
println("Influential (D > 4/n):    ", findall(d .> 4 / n))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "predict-ci"
label = "Confidence Interval"
desc = "Predicted mean with a 95% confidence interval"
code = '''
using GLM

newdata = {{data}}[1:5, :]  # replace with new observations
pred = predict(model, newdata; interval=:confidence, level=0.95)  # prediction, lower, upper
println(pred)
'''

[[actionGroups.actions]]
id = "predict-pi"
label = "Prediction Interval"
desc = "Range for a new individual observation"
code = '''
using GLM

newdata = {{data}}[1:5, :]  # replace with new observations
pred = predict(model, newdata; interval=:prediction, level=0.95)  # wider than the confidence interval
println(pred)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "f-test"
label = "Nested F-Test"
desc = "Test whether extra predictors improve the fit"
code = '''
using GLM

model0 = lm(@formula(y ~ x1), {{data}})  # restricted model (edit to a nested formula)
println(ftest(model0.model, model.model))  # F-test of the nested models
'''

[[actionGroups.actions]]
id = "info-criteria"
label = "Information Criteria"
desc = "Adjusted R², AIC and BIC for model comparison"
code = '''
using GLM

println("Adjusted R²: ", adjr2(model))  # penalised for the number of predictors
println("AIC: ", aic(model))  # lower is better
println("BIC: ", bic(model))  # stronger penalty on parameters
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "coefficients"
label = "Coefficient Table"
desc = "Estimates, confidence intervals and p-values"
code = '''
using GLM

ct = coeftable(model)  # estimate, SE, t, p, 95% CI
for (name, b, lo, hi) in zip(coefnames(model), coef(model), confint(model)[:, 1], confint(model)[:, 2])
    println(rpad(name, 16), round(b; digits=4), "  [", round(lo; digits=4), ", ", round(hi; digits=4), "]")
end
'''

[[actionGroups.actions]]
id = "standardised"
label = "Standardised Coefficients"
desc = "Effect of a one-standard-deviation change in each predictor"
code = '''
using GLM, Statistics

X = modelmatrix(model)[:, 2:end]  # predictors without the intercept
beta_std = coef(model)[2:end] .* transpose(std(X; dims=1)) ./ std(response(model))  # standardised effects
println(beta_std)
'''
