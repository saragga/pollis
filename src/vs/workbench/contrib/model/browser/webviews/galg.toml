[[codeBranches]]
model = "ga"
code = '''
using Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
NP = {{pop}}  # population size (virtual size for the compact GAs)
budget = {{budget}}  # generations

# per-generation history: best value so far and a diversity measure
newhist() = (best = Float64[], diversity = Float64[])

PC, PM = {{pc}}, {{pm}}  # crossover and per-gene mutation rates

function search(; gens=budget, NP=NP, seed=1, lb=lb, ub=ub)
    Random.seed!(seed)
    d, w = length(lb), ub .- lb
    X = [lb .+ rand(d) .* w for _ in 1:NP]; fX = f.(X)
    h, evals = newhist(), NP
    for g in 1:gens
        tournament() = (c = rand(1:NP, 3); X[c[argmin(fX[c])]])  # best of 3 random members
        elite = argmin(fX)
        Y = [copy(X[elite])]  # elitism: the best survives unchanged
        while length(Y) < NP
            a, b = tournament(), tournament()
            child = rand() < PC ? a .+ (1.5 .* rand(d) .- 0.25) .* (b .- a) : copy(a)  # intermediate crossover (BLX-0.25)
            mask = rand(d) .< PM
            child[mask] .+= 0.1 .* w[mask] .* randn(count(mask))  # Gaussian mutation
            push!(Y, clamp.(child, lb, ub))
        end
        fX = [fX[elite]; f.(Y[2:end])]; X = Y
        evals += NP - 1
        push!(h.best, minimum(fX)); push!(h.diversity, mean(std(reduce(hcat, X), dims=2)))
    end
    k = argmin(fX)
    (x = X[k], fx = fX[k], h..., evals = evals)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, generations = length(res.best), evaluations = res.evals)
'''

[[codeBranches]]
model = "cga"
code = '''
using Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
NP = {{pop}}  # population size (virtual size for the compact GAs)
budget = {{budget}}  # generations

# per-generation history: best value so far and a diversity measure
newhist() = (best = Float64[], diversity = Float64[])

BITS = {{bits}}  # fixed-point bits per variable

# bits (most significant first) to a point in the box
decode(bits, lb, ub) = [lb[i] + (ub[i] - lb[i]) * evalpoly(2, reverse(bits[(i - 1) * BITS + 1:i * BITS])) / (2^BITS - 1) for i in eachindex(lb)]

function search(; gens=budget, NP=NP, seed=1, lb=lb, ub=ub)
    Random.seed!(seed)
    p = fill(0.5, BITS * length(lb))  # probability that each bit is 1
    bx = decode(rand(length(p)) .< p, lb, ub); bf = f(bx)
    h, evals = newhist(), 1
    for g in 1:gens, c in 1:max(1, div(NP, 2))  # NP / 2 competitions per generation
        a, b = rand(length(p)) .< p, rand(length(p)) .< p  # two samples from the model
        xa, xb = decode(a, lb, ub), decode(b, lb, ub)
        fa, fb = f(xa), f(xb); evals += 2
        win, lose = fa <= fb ? (a, b) : (b, a)
        differ = win .!= lose
        p[differ] .= clamp.(p[differ] .+ ifelse.(win[differ], 1, -1) ./ NP, 0, 1)  # move towards the winner
        fa < bf && ((bx, bf) = (xa, fa))
        fb < bf && ((bx, bf) = (xb, fb))
        if c == max(1, div(NP, 2))
            push!(h.best, bf); push!(h.diversity, 4 * mean(p .* (1 .- p)))  # 1 = undecided, 0 = converged
            all(q -> q < 1e-9 || q > 1 - 1e-9, p) && break  # probability vector converged
        end
    end
    (x = bx, fx = bf, h..., evals = evals, probabilities = p)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, generations = length(res.best), evaluations = res.evals)
'''

[[codeBranches]]
model = "brkga"
code = '''
using Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
NP = {{pop}}  # population size (virtual size for the compact GAs)
budget = {{budget}}  # generations

# per-generation history: best value so far and a diversity measure
newhist() = (best = Float64[], diversity = Float64[])

PE, PMUT, RHO = {{elite}}, {{mutants}}, {{rho}}  # elite share, mutant share, elite inheritance probability

function search(; gens=budget, NP=NP, seed=1, lb=lb, ub=ub)
    Random.seed!(seed)
    d = length(lb)
    decode(k) = lb .+ k .* (ub .- lb)  # random keys in [0, 1]^d to a point in the box
    K = [rand(d) for _ in 1:NP]; fK = f.(decode.(K))
    ne, nm = max(1, round(Int, PE * NP)), round(Int, PMUT * NP)
    h, evals = newhist(), NP
    for g in 1:gens
        o = sortperm(fK)
        E, R = K[o[1:ne]], K[o[ne+1:end]]
        mutants = [rand(d) for _ in 1:nm]  # fresh random individuals
        children = map(1:NP - ne - nm) do _
            e, r = rand(E), rand(R)
            ifelse.(rand(d) .< RHO, e, r)  # biased uniform crossover
        end
        K = [E; mutants; children]
        fK = [fK[o[1:ne]]; f.(decode.(mutants)); f.(decode.(children))]
        evals += NP - ne
        push!(h.best, minimum(fK)); push!(h.diversity, mean(std(reduce(hcat, decode.(K)), dims=2)))
    end
    k = argmin(fK)
    (x = decode(K[k]), fx = fK[k], h..., evals = evals)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, generations = length(res.best), evaluations = res.evals)
'''

[[codeBranches]]
model = "mccga"
code = '''
using Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
NP = {{pop}}  # population size (virtual size for the compact GAs)
budget = {{budget}}  # generations

# per-generation history: best value so far and a diversity measure
newhist() = (best = Float64[], diversity = Float64[])

# a Float32 as 32 bits (sign, 8 exponent bits, 23 mantissa bits; most significant first) and back
tobits(v::Float32) = [((reinterpret(UInt32, v) >> (32 - k)) & 0x1) == 0x1 for k in 1:32]
frombits(b) = reinterpret(Float32, foldl((acc, bit) -> (acc << 1) | UInt32(bit), b; init=UInt32(0)))
function decode(bits, lb, ub)
    map(eachindex(lb)) do i
        v = Float64(frombits(bits[32(i - 1) + 1:32i]))
        isfinite(v) ? clamp(v, lb[i], ub[i]) : (lb[i] + ub[i]) / 2  # patterns outside the box are pulled back in
    end
end
# initial bit probabilities: the bit frequencies of uniform samples from the box
initial_p(lb, ub) = reduce(vcat, [mean(tobits.(Float32.(lb[i] .+ rand(10_000) .* (ub[i] - lb[i])))) for i in eachindex(lb)])

function search(; gens=budget, NP=NP, seed=1, lb=lb, ub=ub)
    Random.seed!(seed)
    p = initial_p(lb, ub)  # probability that each bit is 1
    bx = decode(rand(length(p)) .< p, lb, ub); bf = f(bx)
    h, evals = newhist(), 1
    for g in 1:gens, c in 1:max(1, div(NP, 2))  # NP / 2 competitions per generation
        a, b = rand(length(p)) .< p, rand(length(p)) .< p  # two samples from the model
        xa, xb = decode(a, lb, ub), decode(b, lb, ub)
        fa, fb = f(xa), f(xb); evals += 2
        win, lose = fa <= fb ? (a, b) : (b, a)
        differ = win .!= lose
        p[differ] .= clamp.(p[differ] .+ ifelse.(win[differ], 1, -1) ./ NP, 0, 1)  # move towards the winner
        fa < bf && ((bx, bf) = (xa, fa))
        fb < bf && ((bx, bf) = (xb, fb))
        if c == max(1, div(NP, 2))
            push!(h.best, bf); push!(h.diversity, 4 * mean(p .* (1 .- p)))  # 1 = undecided, 0 = converged
            all(q -> q < 1e-9 || q > 1 - 1e-9, p) && break  # probability vector converged
        end
    end
    (x = bx, fx = bf, h..., evals = evals, probabilities = p)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, generations = length(res.best), evaluations = res.evals)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "convergence-plot"
label = "Convergence Plot"
desc = "Best value found at each generation (log scale)"
code = '''
using Plots

shift = min(0, minimum(res.best)) - 1e-12  # keeps the log scale defined
plot(res.best .- shift, yscale=:log10, xlabel="generation", ylabel="best f - shift", legend=false)
'''

[[actionGroups.actions]]
id = "population-diversity"
label = "Population Diversity"
desc = "Spread of the population per generation (GA, BRKGA), or the undecidedness of the probability vector, 4 p (1 - p) averaged over bits (compact GAs)"
code = '''
using Plots

plot(max.(res.diversity, 1e-16), yscale=:log10, xlabel="generation", ylabel="diversity", legend=false)
'''

[[actionGroups.actions]]
id = "fitness-landscape"
label = "Fitness Landscape"
desc = "Heatmap of f over the first two variables, with the others held at the best point"
code = '''
using Plots

xs = range(lb[1], ub[1], length=150); ys = range(lb[2], ub[2], length=150)
heatmap(xs, ys, (a, b) -> f([a; b; x_best[3:end]]), xlabel="x1", ylabel="x2")
scatter!([x_best[1]], [x_best[2]], marker=:star, markersize=10, color=:red, label="best")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "stagnation-check"
label = "Stagnation Check"
desc = "When the best value last improved and whether diversity collapsed first (premature convergence)"
code = '''
last_gain = something(findlast(diff(res.best) .< 0), 0) + 1
(generations = length(res.best), last_improvement_generation = last_gain,
 idle_generations = length(res.best) - last_gain, final_diversity = res.diversity[end],
 premature = res.diversity[end] < 1e-6 && last_gain < 0.5 * length(res.best))
'''

[[actionGroups.actions]]
id = "convergence-rate"
label = "Convergence Rate"
desc = "Generations needed to come within 1, 0.1, 0.01 and 0.0001 of the final best value"
code = '''
map([1.0, 0.1, 0.01, 1e-4]) do tol
    (tolerance = tol, generation = findfirst(<=(f_best + tol), res.best))
end
'''

[[actionGroups.actions]]
id = "multi-run"
label = "Multi-Run Reliability"
desc = "Repeat the search with 10 seeds: the spread of best values and how far apart the solutions are"
code = '''
runs = [search(seed=s) for s in 1:10]
v = getfield.(runs, :fx)
(best_values = round.(v, sigdigits=6), mean = mean(v), spread = std(v), share_at_best = mean(v .<= minimum(v) + 1e-6),
 max_distance_between_solutions = maximum(norm(a.x - b.x) for a in runs, b in runs))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "best-solution"
label = "Best Solution"
desc = "The best point and its objective value, re-evaluated"
code = '''
(best_point = round.(x_best, sigdigits=6), reported_value = f_best, re_evaluated = f(x_best))
'''

[[actionGroups.actions]]
id = "evaluate-new"
label = "Evaluate New Point"
desc = "Objective at a point of your choice (edit x_new) compared with the best one"
code = '''
x_new = (lb .+ ub) ./ 2  # edit: any point in the box
(x_new = x_new, f_new = f(x_new), f_best = f_best, difference = f(x_new) - f_best, distance_to_best = norm(x_new - x_best))
'''

[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity Analysis"
desc = "Sample 2000 points around the best one at several radii: the share that is better shows whether it is a local minimum at that scale"
code = '''
map([1e-4, 1e-3, 1e-2, 1e-1]) do r
    samples = [clamp.(x_best .+ r .* (ub .- lb) .* randn(length(x_best)), lb, ub) for _ in 1:2000]
    fv = f.(samples)
    (radius = r, share_better = mean(fv .< f_best), mean_increase = mean(fv) - f_best)
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-de"
label = "Compare with DE"
desc = "The selected GA against adaptive differential evolution (BlackBoxOptim) at the same number of evaluations, over 5 seeds"
code = '''
using BlackBoxOptim

de(seed) = best_fitness(bboptimize(f; SearchRange=collect(zip(lb, ub)), NumDimensions=length(lb), Method=:adaptive_de_rand_1_bin_radiuslimited,
                                   MaxFuncEvals=res.evals, TraceMode=:silent, RandomizeRngSeed=false, RngSeed=seed))
map(["selected GA" => s -> search(seed=s).fx, "adaptive DE" => de]) do (name, run)
    sec = @elapsed v = [run(s) for s in 1:5]
    (method = name, mean_best = mean(v), worst_best = maximum(v), seconds_per_run = sec / 5)
end
'''

[[actionGroups.actions]]
id = "compare-pop-size"
label = "Population Size Study"
desc = "Best value for several population sizes at the same number of evaluations, 3 seeds each"
code = '''
map([10, 20, 50, 100, 200]) do np
    gens = max(1, div(NP * budget, np))
    v = [search(NP=np, gens=gens, seed=s).fx for s in 1:3]
    (population = np, generations = gens, mean_best = mean(v), worst_best = maximum(v))
end
'''

[[actionGroups.actions]]
id = "compare-cmaes"
label = "Compare with CMA-ES"
desc = "The selected GA against CMA-ES (Evolutionary.jl) at the same number of evaluations, over 5 seeds"
code = '''
using Evolutionary

d = length(lb)
function cma(seed)
    Random.seed!(seed)
    lam = 4 + floor(Int, 3log(d))
    r = Evolutionary.optimize(f, Evolutionary.BoxConstraints(lb, ub), lb .+ rand(d) .* (ub .- lb),
                              CMAES(mu=div(lam, 2), lambda=lam, sigma0=0.3 * maximum(ub .- lb)), Evolutionary.Options(iterations=div(res.evals, lam)))
    Evolutionary.minimum(r)
end
map(["selected GA" => s -> search(seed=s).fx, "CMA-ES" => cma]) do (name, run)
    sec = @elapsed v = [run(s) for s in 1:5]
    (method = name, mean_best = mean(v), worst_best = maximum(v), seconds_per_run = sec / 5)
end
'''

