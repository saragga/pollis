[[bullets]]
text = "Classic GA"
detail = "selection, crossover, and mutation on fixed-length chromosomes"

[[bullets]]
text = "Compact GA"
detail = "probability vector representation with incremental updates"

[[bullets]]
text = "BRKGA"
detail = "biased random-key encoding with elite/non-elite crossover"

[[bullets]]
text = "MCCGA"
detail = "machine-coded compact GA; encodes real variables as integers using b bits; maintains a marginal-product histogram updated by pairwise competition"

[[decisionRows]]
task = "GA"
context = "General continuous or mixed problems; the baseline evolutionary method"
purpose = "Real-coded GA: tournament selection, intermediate crossover, Gaussian mutation and elitism over a population of candidate solutions"

[[decisionRows]]
task = "Compact GA"
context = "Memory-constrained settings or when only a probabilistic model is wanted"
purpose = "Replaces the population by a probability vector over bits; pairwise competitions nudge each bit's probability towards the winner"

[[decisionRows]]
task = "BRKGA"
context = "Combinatorial or mixed problems that can be expressed through a decoder"
purpose = "Biased random-key GA: individuals are key vectors in [0, 1]^n decoded into solutions; elite parents pass on more genes, and fresh mutants keep diversity"

[[decisionRows]]
task = "MCCGA"
context = "Continuous problems with no problem-specific encoding"
purpose = "Machine-coded compact GA: a compact GA over the IEEE bit pattern of the floating-point variables, with initial bit probabilities learned from the box"

[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables. The default objective and bounds adapt to it."
default = "5"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, in terms of the vector x. Default: the Rastrigin function in any dimension (global minimum 0 at the origin)."
default = "10 * length(x) + sum(x .^ 2 .- 10 .* cos.(2pi .* x))"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds, one per variable."
default = "fill(-5.12, n)"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds, one per variable."
default = "fill(5.12, n)"

[[inputs]]
id = "pop"
label = "Population Size"
tooltip = "Population size (GA, BRKGA), or virtual population size of the compact GAs: each competition moves a bit probability by 1 / size, so larger sizes converge more slowly but more reliably."
default = "50"
newRow = true

[[inputs]]
id = "budget"
label = "Generations"
tooltip = "Number of generations. One generation costs about one evaluation per population member for every variant (the compact GAs run size / 2 competitions per generation) and they stop early once their probability vector has converged."
default = "300"

[[inputs]]
id = "pc"
label = "Crossover Rate"
tooltip = "Probability that a child is produced by crossover rather than copied from its first parent."
default = "0.9"
models = ["ga"]
newRow = true

[[inputs]]
id = "pm"
label = "Mutation Rate"
tooltip = "Probability that each gene receives Gaussian noise (standard deviation 10 percent of its range)."
default = "0.1"
models = ["ga"]

[[inputs]]
id = "bits"
label = "Bits per Variable"
tooltip = "Fixed-point resolution of each variable: the box side is divided into 2^bits - 1 steps."
default = "16"
models = ["cga"]
newRow = true

[[inputs]]
id = "elite"
label = "Elite Fraction"
tooltip = "Share of the population kept unchanged each generation."
default = "0.2"
models = ["brkga"]
newRow = true

[[inputs]]
id = "mutants"
label = "Mutant Fraction"
tooltip = "Share of the population replaced by fresh random keys each generation."
default = "0.15"
models = ["brkga"]

[[inputs]]
id = "rho"
label = "Elite Inheritance"
tooltip = "Probability that a child takes each key from its elite parent rather than the non-elite one (above 0.5 biases towards the elite)."
default = "0.7"
models = ["brkga"]

