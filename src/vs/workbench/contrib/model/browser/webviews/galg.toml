{{?model=ga}} (variant = "real-coded GA", population = NP, crossover_rate = PC, mutation_rate = PM, selection = "tournament of 3", crossover = "intermediate (BLX-0.25)", elitism = 1,
{{?model=cga}} (variant = "compact GA", virtual_population = NP, bits_per_variable = BITS, undecided_bits = count(q -> 0.01 < q < 0.99, res.probabilities),
{{?model=brkga}} (variant = "BRKGA", population = NP, elite = max(1, round(Int, PE * NP)), mutants = round(Int, PMUT * NP), elite_inheritance = RHO,
{{?model=mccga}} (variant = "machine-coded compact GA", virtual_population = NP, bits_per_variable = 32, undecided_bits = count(q -> 0.01 < q < 0.99, res.probabilities),
 generations = length(res.best), evaluations = res.evals)
'''

[[actionGroups.actions]]
id = "bounds-check"
label = "Bounds Feasibility"
desc = "Verify the best point lies within the bounds and see which coordinates press against them"
code = '''
slack_low, slack_high = x_best .- lb, ub .- x_best
(inside_box = all(slack_low .>= 0) && all(slack_high .>= 0), min_slack = minimum([slack_low; slack_high]),
 at_lower = findall(slack_low .< 1e-6 .* (ub .- lb)), at_upper = findall(slack_high .< 1e-6 .* (ub .- lb)))
'''
