# Snowball Search Map Webview Configuration
# A page in the Minimal style of the scaffold, not a panel: Learn More only, as no Julia package powers it. `pageCommand`
# is the command that opens it, which a panel's contribution file would say. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/snowballSearch.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Snowball Search Map"
viewType = "pollis.snowballSearch"
pageCommand = "pollis.compose.snowballSearch"

[[wikis]]
name = "Factsheet"
file = "snowballSearch/factsheet.md"
bundled = true

[[wikis]]
name = "Overview"
file = "snowballSearch/overview.md"
bundled = true

[[wikis]]
name = "Rounds and Saturation"
file = "snowballSearch/rounds-and-saturation.md"
bundled = true

[[wikis]]
name = "Links and Citations"
file = "snowballSearch/links-and-citations.md"
bundled = true

