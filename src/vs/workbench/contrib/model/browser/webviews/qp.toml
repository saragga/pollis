[[codeBranches]]
model = "qp"
code = '''
using JuMP, {{qpsolver}}, LinearAlgebra, Random

Random.seed!(1)
mu    = {{mu}}  # expected returns
Sigma = {{Sigma}}  # covariance matrix
n     = length(mu)
level = {{target}}

function build(optimizer, level)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, 0 <= w[1:n] <= 1)  # long-only weights
    @constraint(m, budget, sum(w) == 1)  # fully invested
    @constraint(m, level_con, dot(mu, w) >= level)  # required expected return
    @objective(m, Min, dot(w, Sigma, w))  # portfolio variance
    m, w
end

solver = {{qpsolver}}.Optimizer
model, w = build(solver, level)
optimize!(model)
grid = range(minimum(mu), maximum(mu), length=20)  # target returns traced by the frontier and the sweep
(status = termination_status(model), objective = objective_value(model), weights = value.(w),
 expected_return = dot(mu, value.(w)), volatility = sqrt(dot(value.(w), Sigma, value.(w))))
'''

[[codeBranches]]
model = "qcqp"
code = '''
using JuMP, {{qcsolver}}, LinearAlgebra, Random

Random.seed!(1)
mu    = {{mu}}  # expected returns
Sigma = {{Sigma}}  # covariance matrix
n     = length(mu)
level = {{risk}}

function build(optimizer, level)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, 0 <= w[1:n] <= 1)  # long-only weights
    @constraint(m, budget, sum(w) == 1)  # fully invested
    @constraint(m, level_con, dot(w, Sigma, w) <= level^2)  # volatility cap
    @objective(m, Max, dot(mu, w))  # expected return
    m, w
end

solver = {{qcsolver}}.Optimizer
model, w = build(solver, level)
optimize!(model)
grid = range(sqrt(minimum(eigvals(Symmetric(Sigma)))), sqrt(maximum(diag(Sigma))), length=20)  # volatility caps
(status = termination_status(model), objective = objective_value(model), weights = value.(w),
 expected_return = dot(mu, value.(w)), volatility = sqrt(dot(value.(w), Sigma, value.(w))))
'''

[[codeBranches]]
model = "miqp"
code = '''
using JuMP, SCIP, LinearAlgebra, Random

Random.seed!(1)
mu    = {{mu}}  # expected returns
Sigma = {{Sigma}}  # covariance matrix
n     = length(mu)
level = {{target}}

function build(optimizer, level)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, 0 <= w[1:n] <= 1)  # long-only weights
    @constraint(m, budget, sum(w) == 1)  # fully invested
    @constraint(m, level_con, dot(mu, w) >= level)  # required expected return
    @variable(m, z[1:n], Bin)  # 1 = asset held
    @constraint(m, w .<= z)
    @constraint(m, sum(z) <= {{k}})  # at most k assets
    @objective(m, Min, dot(w, Sigma, w))  # portfolio variance
    m, w
end

solver = SCIP.Optimizer
model, w = build(solver, level)
optimize!(model)
grid = range(minimum(mu), maximum(mu), length=20)  # target returns traced by the frontier and the sweep
(status = termination_status(model), objective = objective_value(model), weights = value.(w),
 expected_return = dot(mu, value.(w)), volatility = sqrt(dot(value.(w), Sigma, value.(w))))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "efficient-frontier"
label = "Efficient Frontier"
desc = "Volatility against expected return of the optimal portfolios across the target (or cap) grid, with the single assets and the current solution"
code = '''
using Plots

pts = map(grid) do v
    m, ww = build(solver, v)
    optimize!(m)
    is_solved_and_feasible(m) ? (sqrt(dot(value.(ww), Sigma, value.(ww))), dot(mu, value.(ww))) : (NaN, NaN)
end
plot(first.(pts), last.(pts), marker=:circle, markersize=2, xlabel="volatility", ylabel="expected return", label="frontier")
scatter!(sqrt.(diag(Sigma)), mu, label="assets")
scatter!([sqrt(dot(value.(w), Sigma, value.(w)))], [dot(mu, value.(w))], marker=:star, markersize=10, label="solution")
'''

[[actionGroups.actions]]
id = "portfolio-weights"
label = "Portfolio Weights"
desc = "Bar chart of the optimal asset weights"
code = '''
using Plots

bar(value.(w), xlabel="asset", ylabel="weight", legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "feasibility"
label = "Feasibility Check"
desc = "Termination and primal status (INFEASIBLE when the target return or volatility cap cannot be met), and any violated constraint"
code = '''
(termination = termination_status(model), primal = primal_status(model),
 violated = primal_feasibility_report(model; atol=1e-6))  # empty Dict = feasible
'''

[[actionGroups.actions]]
id = "convexity"
label = "Convexity Check"
desc = "Eigenvalues of Sigma: all >= 0 means the problem is convex and the solution is the global optimum; all > 0 makes it unique"
code = '''
ev = eigvals(Symmetric(Sigma))
(min_eigenvalue = minimum(ev), convex = minimum(ev) >= -1e-10, strictly_convex = minimum(ev) > 1e-10,
 condition_number = maximum(ev) / max(minimum(ev), eps()))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity Analysis"
desc = "Dual values of the budget and the return (or risk) constraint, and the reduced cost of each weight (MIQP: with the selection fixed)"
code = '''
{{?model=miqp}} using Clarabel; undo = fix_discrete_variables(model); set_optimizer(model, Clarabel.Optimizer); set_silent(model); optimize!(model)
out = (budget_dual = dual(model[:budget]), level_dual = dual(model[:level_con]), reduced_costs = reduced_cost.(w))
{{?model=miqp}} undo(); set_optimizer(model, solver); set_silent(model); optimize!(model)
out
'''

[[actionGroups.actions]]
id = "parametric"
label = "Parametric Sweep"
desc = "The optimal objective (variance, or expected return for the QCQP) across the target return (or volatility cap) grid"
code = '''
using Plots

vals = map(grid) do v
    m, _ = build(solver, v)
    optimize!(m)
    is_solved_and_feasible(m) ? objective_value(m) : NaN
end
{{?model!=qcqp}} plot(grid, vals, marker=:circle, xlabel="target return", ylabel="minimum variance", legend=false)
{{?model=qcqp}} plot(grid, vals, marker=:circle, xlabel="volatility cap", ylabel="maximum expected return", legend=false)
vline!([level], linestyle=:dash)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "solver-compare"
label = "Solver Comparison"
desc = "The same problem with each capable solver: status, objective and time"
code = '''
{{?model=qp}} using Clarabel, OSQP, Ipopt
{{?model=qp}} solvers = ["Clarabel" => Clarabel.Optimizer, "OSQP" => OSQP.Optimizer, "Ipopt" => Ipopt.Optimizer]
{{?model=qcqp}} using Clarabel, Ipopt
{{?model=qcqp}} solvers = ["Clarabel" => Clarabel.Optimizer, "Ipopt" => Ipopt.Optimizer]
{{?model=miqp}} using Juniper, Ipopt
{{?model=miqp}} solvers = ["SCIP" => SCIP.Optimizer, "Juniper" => optimizer_with_attributes(Juniper.Optimizer, "nl_solver" => optimizer_with_attributes(Ipopt.Optimizer, "print_level" => 0))]
map(solvers) do (name, opt)
    m, _ = build(opt, level)
    t = @elapsed optimize!(m)
    (solver = name, status = termination_status(m), objective = objective_value(m), seconds = t)
end
'''

[[actionGroups.actions]]
id = "benchmarks"
label = "Benchmark Portfolios"
desc = "The optimum against the equal-weight portfolio and the global minimum-variance portfolio (MIQP: also the continuous relaxation bound)"
code = '''
stats(ww) = (expected_return = dot(mu, ww), volatility = sqrt(dot(ww, Sigma, ww)))
w_eq = fill(1 / n, n)
w_gmv = let s = Symmetric(Sigma) \ ones(n); s ./ sum(s) end  # may short-sell
{{?model=miqp}} using Clarabel
{{?model=miqp}} undo = relax_integrality(model); set_optimizer(model, Clarabel.Optimizer); set_silent(model); optimize!(model)
{{?model=miqp}} relaxed = (variance_bound = objective_value(model), stats(value.(w))...)
{{?model=miqp}} undo(); set_optimizer(model, solver); set_silent(model); optimize!(model)
{{?model!=miqp}} relaxed = nothing
(optimum = stats(value.(w)), equal_weight = stats(w_eq), global_min_variance = stats(w_gmv), relaxation = relaxed)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "dual-prices"
label = "Dual Prices"
desc = "Shadow prices: the change in the optimum per unit of extra budget and per unit of the return target (or volatility cap)"
code = '''
{{?model=miqp}} using Clarabel; undo = fix_discrete_variables(model); set_optimizer(model, Clarabel.Optimizer); set_silent(model); optimize!(model)
out = (budget = shadow_price(model[:budget]), level = shadow_price(model[:level_con]))
{{?model=miqp}} undo(); set_optimizer(model, solver); set_silent(model); optimize!(model)
{{?model!=qcqp}} (out..., note = "level = the change in minimum variance per unit of extra required return")
{{?model=qcqp}} (out..., note = "level = the change in expected return per unit of extra squared volatility")
'''

[[actionGroups.actions]]
id = "variance-attribution"
label = "Variance Attribution"
desc = "Each asset's share of the portfolio variance: w_i (Sigma w)_i / w' Sigma w"
code = '''
ww = value.(w)
var_p = dot(ww, Sigma, ww)
contrib = ww .* (Sigma * ww) ./ var_p  # sums to 1
[(asset = i, weight = ww[i], variance_share = contrib[i]) for i in 1:n]
'''
