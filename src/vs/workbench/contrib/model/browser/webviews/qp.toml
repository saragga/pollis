[[models]]
id = "miqp"
label = "Mixed-Integer QP (MIQP)"

[[decisionRows]]
task = "Quadratic Programming (QP)"
context = "Quadratic objective, linear constraints: minimum-variance portfolios, least squares with constraints, MPC"
purpose = "Minimise the variance w' Sigma w for a required expected return"

[[decisionRows]]
task = "Quadratic Constraints QP (QCQP)"
context = "A quadratic budget such as a risk, energy or distance limit"
purpose = "Maximise the expected return subject to a volatility cap w' Sigma w <= risk^2"

[[decisionRows]]
task = "Mixed-Integer QP (MIQP)"
context = "Quadratic objective with discrete choices: limited number of assets, minimum lot sizes, on/off decisions"
purpose = "Minimum variance with at most k assets held (binary selection variables), solved by branch and bound"

[[inputs]]
id = "mu"
label = "Expected Returns"
tooltip = "Vector of expected asset returns; its length sets the number of assets n."
default = "[0.08, 0.10, 0.12, 0.07, 0.15]"

[[inputs]]
id = "Sigma"
label = "Covariance Matrix"
tooltip = "n × n positive semidefinite covariance matrix of the returns, for example cov(R) from a returns matrix. The default is a random one."
default = "(F = 0.1 .* randn(5, 5); F * F' + 0.01I)"

[[inputs]]
id = "target"
label = "Target Return"
tooltip = "Minimum expected portfolio return mu' w. Must lie between the smallest and the largest expected return."
default = "0.10"
models = ["qp", "miqp"]
newRow = true

[[inputs]]
id = "risk"
label = "Volatility Cap"
tooltip = "Maximum portfolio standard deviation: the constraint w' Sigma w <= cap^2."
default = "0.15"
models = ["qcqp"]
newRow = true

[[inputs]]
id = "k"
label = "Max Assets k"
tooltip = "Maximum number of assets with a non-zero weight."
default = "2"
models = ["miqp"]

[[inputs]]
id = "qpsolver"
label = "Solver"
tooltip = "Clarabel: interior point, the default. OSQP: ADMM, excels on large sparse QPs (lower accuracy). Ipopt: general nonlinear interior point."
kind = "select"
default = "Clarabel"
models = ["qp"]

[[inputs.options]]
value = "Clarabel"
label = "Clarabel"

[[inputs.options]]
value = "OSQP"
label = "OSQP"

[[inputs.options]]
value = "Ipopt"
label = "Ipopt"

[[inputs]]
id = "qcsolver"
label = "Solver"
tooltip = "Clarabel: interior point (the quadratic constraint becomes a second-order cone), the default. Ipopt: general nonlinear interior point. (OSQP supports linear constraints only.)"
kind = "select"
default = "Clarabel"
models = ["qcqp"]

[[inputs.options]]
value = "Clarabel"
label = "Clarabel"

[[inputs.options]]
value = "Ipopt"
label = "Ipopt"

