[[codeBranches]]
model = "mdp"
code = '''
using POMDPs, POMDPTools, DiscreteValueIteration

S = {{S}}  # warehouse capacity: states 0:S are units in stock
A = {{A}}  # largest order: actions 0:A
dmean = {{dmean}}  # mean demand per period (Poisson)
gamma = {{gamma}}  # discount factor
price, order_cost, holding_cost = 8.0, 2.0, 0.5  # per unit
dprob = [exp(-dmean + d * log(dmean) - sum(log, 1:d; init=0.0)) for d in 0:S]  # Poisson probabilities
dprob[end] += 1 - sum(dprob)  # demand of S or more lumped together

struct InventoryMDP <: MDP{Int, Int} end
m = InventoryMDP()
POMDPs.states(::InventoryMDP) = 0:S
POMDPs.actions(::InventoryMDP) = 0:A
POMDPs.discount(::InventoryMDP) = gamma
POMDPs.stateindex(::InventoryMDP, s) = s + 1
POMDPs.actionindex(::InventoryMDP, a) = a + 1
POMDPs.initialstate(::InventoryMDP) = Deterministic(0)
function POMDPs.transition(::InventoryMDP, s, a)  # stock after ordering, minus random demand
    y = min(s + a, S)
    probs = zeros(S + 1)
    for d in 0:S
        probs[max(y - d, 0) + 1] += dprob[d + 1]
    end
    SparseCat(0:S, probs)
end
function POMDPs.reward(::InventoryMDP, s, a)  # expected revenue minus ordering and holding costs
    y = min(s + a, S)
    price * sum(dprob[d + 1] * min(y, d) for d in 0:S) - order_cost * a - holding_cost * y
end

policy = solve(ValueIterationSolver(max_iterations=1000, belres=1e-6), m)  # value iteration
V(s) = value(policy, s)
act(s) = action(policy, s)
(order_by_stock = [s => act(s) for s in 0:S], value_when_empty = V(0), value_when_full = V(S))
'''

[[codeBranches]]
model = "pomdp"
code = '''
using POMDPs, POMDPTools, QMDP

gamma = {{gamma}}  # discount factor
acc = {{acc}}  # probability that listening reports the correct side

struct TigerPOMDP <: POMDP{Symbol, Symbol, Symbol} end  # the tiger hides behind the left or right door
m = TigerPOMDP()
POMDPs.states(::TigerPOMDP) = [:tiger_left, :tiger_right]
POMDPs.actions(::TigerPOMDP) = [:open_left, :open_right, :listen]
POMDPs.observations(::TigerPOMDP) = [:hear_left, :hear_right]
POMDPs.stateindex(::TigerPOMDP, s) = s == :tiger_left ? 1 : 2
POMDPs.actionindex(::TigerPOMDP, a) = findfirst(==(a), [:open_left, :open_right, :listen])
POMDPs.obsindex(::TigerPOMDP, o) = o == :hear_left ? 1 : 2
POMDPs.discount(::TigerPOMDP) = gamma
POMDPs.initialstate(::TigerPOMDP) = Uniform([:tiger_left, :tiger_right])
function POMDPs.transition(::TigerPOMDP, s, a)  # the tiger stays while listening and is reshuffled after a door opens
    a == :listen && return Deterministic(s)
    Uniform([:tiger_left, :tiger_right])
end
function POMDPs.observation(::TigerPOMDP, a, sp)  # noisy report of the tiger's side
    a != :listen && return Uniform([:hear_left, :hear_right])
    sp == :tiger_left ? SparseCat([:hear_left, :hear_right], [acc, 1 - acc]) : SparseCat([:hear_left, :hear_right], [1 - acc, acc])
end
function POMDPs.reward(::TigerPOMDP, s, a)  # listening costs 1, the tiger's door costs 100, the other door pays 10
    a == :listen && return -1.0
    (a == :open_left && s == :tiger_left) || (a == :open_right && s == :tiger_right) ? -100.0 : 10.0
end

policy = solve(QMDPSolver(max_iterations=1000), m)  # QMDP: alpha vectors from the fully observed MDP
belief(p) = DiscreteBelief(m, [p, 1 - p])  # p = probability that the tiger is behind the left door
V(p) = value(policy, belief(p))
act(p) = action(policy, belief(p))
(action_at_uniform_belief = act(0.5), action_when_90pct_left = act(0.9), value_at_uniform_belief = V(0.5))
'''

[[codeBranches]]
model = "smdp"
code = '''
using Random

S = {{S}}  # condition levels: 0 = failed, S = new
gamma = {{gamma}}  # discount per period
pdeg = {{pdeg}}  # probability of losing one level during a period of operation
ACTIONS = ["operate", "maintain", "replace"]
tau(a) = (1, 2, 4)[a]  # duration of each action in periods: the semi-Markov part
function outcomes(s, a)  # (next condition, probability) pairs
    a == 1 && s == 0 && return [(0, 1.0)]  # a failed machine stays failed
    a == 1 && return [(s - 1, pdeg), (s, 1 - pdeg)]
    a == 2 && return [(min(s + 2, S), 1.0)]
    [(S, 1.0)]
end
R(s, a) = a == 1 ? 1.0 * s : a == 2 ? -5.0 : -20.0  # production while operating; cost of maintenance or replacement
Q(V, s, a) = R(s, a) + gamma^tau(a) * sum(p * V[s2 + 1] for (s2, p) in outcomes(s, a))  # discount depends on the duration

function value_iteration(; tol=1e-8, maxiter=10_000)
    V = zeros(S + 1)
    for it in 1:maxiter
        Vn = [maximum(Q(V, s, a) for a in 1:3) for s in 0:S]
        change = maximum(abs.(Vn - V))
        V = Vn
        change < tol && return (V = V, iterations = it)
    end
    (V = V, iterations = maxiter)
end
function rollout(policy_fn, s, periods; rng=Random.default_rng())  # simulate until `periods` periods have elapsed
    t = 0; ret = 0.0; steps = NamedTuple[]
    while t < periods
        a = policy_fn(s); o = outcomes(s, a)
        s2 = o[something(findfirst(cumsum(last.(o)) .>= rand(rng)), length(o))][1]
        ret += gamma^t * R(s, a)
        push!(steps, (time = t, condition = s, action = ACTIONS[a], reward = R(s, a)))
        t += tau(a); s = s2
    end
    (steps = steps, discounted_return = ret)
end

vi = value_iteration()
V(s) = vi.V[s + 1]
act(s) = argmax(a -> Q(vi.V, s, a), 1:3)
(action_by_condition = [s => ACTIONS[act(s)] for s in 0:S], value_when_new = V(S), value_when_failed = V(0), iterations = vi.iterations)
'''

