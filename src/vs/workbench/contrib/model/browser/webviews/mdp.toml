[[actionGroups.actions]]
id = "belief-update"
label = "Belief Update / Bellman Residual"
desc = "POMDP: how the belief moves after each observation. MDP and Semi-MDP: the Bellman residual of the solved value function (near 0 means converged)"
code = '''
{{?model=pomdp}}up = DiscreteUpdater(m)
{{?model=pomdp}}b = initialize_belief(up, initialstate(m))
{{?model=pomdp}}map([:hear_left, :hear_left, :hear_right, :hear_left, :hear_left]) do o
{{?model=pomdp}}    global b = update(up, b, :listen, o)  # Bayes rule after listening
{{?model=pomdp}}    (heard = o, belief_left = round(pdf(b, :tiger_left), digits=4), next_action = action(policy, b))
{{?model=pomdp}}end
{{?model=mdp}}T(s) = maximum(reward(m, s, a) + gamma * sum(p * V(sp) for (sp, p) in weighted_iterator(transition(m, s, a))) for a in actions(m))
{{?model=mdp}}(max_bellman_residual = maximum(abs(T(s) - V(s)) for s in 0:S),)
{{?model=smdp}}(max_bellman_residual = maximum(abs(maximum(Q(vi.V, s, a) for a in 1:3) - V(s)) for s in 0:S), iterations = vi.iterations)
'''

