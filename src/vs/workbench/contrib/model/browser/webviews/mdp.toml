id = "vi-vs-mcts"
label = "Global vs Online Planning"
desc = "MDP: value iteration against MCTS. POMDP: QMDP against POMCP. Semi-MDP: the duration-aware policy against one that ignores durations"
code = '''
using Statistics, Random
Random.seed!(3)
{{?model=mdp}}using MCTS
{{?model=mdp}}planner = solve(MCTSSolver(n_iterations=500, depth=30, exploration_constant=10.0), m)
{{?model=mdp}}(value_iteration = mean(simulate(RolloutSimulator(max_steps=50), m, policy) for k in 1:50),
{{?model=mdp}} mcts = mean(simulate(RolloutSimulator(max_steps=50), m, planner) for k in 1:50))
{{?model=pomdp}}using BasicPOMCP
{{?model=pomdp}}planner = solve(POMCPSolver(tree_queries=1000, c=10.0), m)
{{?model=pomdp}}(qmdp = mean(simulate(RolloutSimulator(max_steps=30), m, policy, DiscreteUpdater(m)) for k in 1:50),
{{?model=pomdp}} pomcp = mean(simulate(RolloutSimulator(max_steps=30), m, planner) for k in 1:50))
{{?model=smdp}}Vp = zeros(S + 1)  # plain MDP: every decision discounted by gamma whatever its duration
{{?model=smdp}}for it in 1:5000
{{?model=smdp}}    Vp .= [maximum(R(s, a) + gamma * sum(p * Vp[s2 + 1] for (s2, p) in outcomes(s, a)) for a in 1:3) for s in 0:S]
{{?model=smdp}}end
{{?model=smdp}}naive(s) = argmax(a -> R(s, a) + gamma * sum(p * Vp[s2 + 1] for (s2, p) in outcomes(s, a)), 1:3)
{{?model=smdp}}(semi_markov_policy = mean(rollout(act, S, 400).discounted_return for k in 1:500),
{{?model=smdp}} constant_discount_policy = mean(rollout(naive, S, 400).discounted_return for k in 1:500),
{{?model=smdp}} policies_differ_at = [s for s in 0:S if act(s) != naive(s)])
'''

[[actionGroups.actions]]
id = "qmdp-vs-sarsop"
label = "Solver vs Baseline"
desc = "POMDP: QMDP against the point-based SARSOP solver. MDP: optimal against myopic ordering. Semi-MDP: optimal against run-to-failure"
code = '''
using Statistics, Random
Random.seed!(4)
{{?model=pomdp}}using SARSOP
{{?model=pomdp}}sarsop = solve(SARSOPSolver(precision=1e-3, verbose=false), m)
{{?model=pomdp}}(actions = [(belief_left = p, qmdp = act(p), sarsop = action(sarsop, belief(p))) for p in (0.5, 0.7, 0.85, 0.97)],
{{?model=pomdp}} value_at_uniform = (qmdp = V(0.5), sarsop = value(sarsop, belief(0.5))),
{{?model=pomdp}} simulated_return = (qmdp = mean(simulate(RolloutSimulator(max_steps=100), m, policy, DiscreteUpdater(m)) for k in 1:500),
{{?model=pomdp}}                     sarsop = mean(simulate(RolloutSimulator(max_steps=100), m, sarsop, DiscreteUpdater(m)) for k in 1:500)))
{{?model=mdp}}myopic = FunctionPolicy(s -> argmax(a -> reward(m, s, a), actions(m)))  # best immediate reward only
{{?model=mdp}}(optimal = mean(simulate(RolloutSimulator(max_steps=200), m, policy) for k in 1:500),
{{?model=mdp}} myopic = mean(simulate(RolloutSimulator(max_steps=200), m, myopic) for k in 1:500))
{{?model=smdp}}run_to_failure(s) = s == 0 ? 3 : 1  # operate until failure, then replace
{{?model=smdp}}(optimal = mean(rollout(act, S, 400).discounted_return for k in 1:500),
{{?model=smdp}} run_to_failure = mean(rollout(run_to_failure, S, 400).discounted_return for k in 1:500))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "alpha-vectors"
label = "Alpha Vectors / Q-Values"
desc = "POMDP: the alpha vectors whose upper envelope is V*(b). MDP and Semi-MDP: the Q-value of every state-action pair"
code = '''
using Plots

{{?model=pomdp}}plt = plot(xlabel="belief that the tiger is behind the left door", ylabel="value")
{{?model=pomdp}}for (alpha, a) in alphapairs(policy)
{{?model=pomdp}}    plot!(plt, 0:0.01:1, [p * alpha[1] + (1 - p) * alpha[2] for p in 0:0.01:1], label=string(a))
{{?model=pomdp}}end
{{?model=pomdp}}plt
{{?model=mdp}}heatmap(0:A, 0:S, policy.qmat, xlabel="order quantity", ylabel="stock level", title="Q(s, a)")
{{?model=smdp}}heatmap(ACTIONS, 0:S, [Q(vi.V, s, a) for s in 0:S, a in 1:3], ylabel="condition", title="Q(s, a)")
'''

[[actionGroups.actions]]
id = "state-value"
label = "State Value Lookup"
desc = "V*(s) and the optimal action at every state (or at a grid of beliefs)"
code = '''
