[[bullets]]
text = "A Markov Decision Process (MDP) is the canonical framework for sequential decision-making under uncertainty: an agent observes its full state, selects an action, receives a reward, and transitions to a new state with known probabilities. MDPs underlie robot navigation, inventory management, game playing, energy dispatch, and autonomous control"
detail = "any domain where decisions are sequential, states are fully observable, and the goal is to maximise cumulative discounted reward. Unlike the Dynamic Programming webview — which solves the Bellman equation directly on a fixed state grid — these models use POMDPs.jl’s problem-specification interface, decoupling problem definition from solver choice so any compatible algorithm (value iteration, MCTS, QMDP, SARSOP) can be swapped without changing the model."

[[bullets]]
text = "A Partially Observable MDP (POMDP) extends the MDP to settings where the true state is hidden: the agent receives only a noisy observation and must maintain a belief distribution over all possible states, planning over the continuous belief space rather than the discrete state space. POMDPs model medical diagnosis under uncertain test results, autonomous driving under sensor noise, dialogue systems, and search-and-rescue"
detail = "domains where the agent must balance information-gathering actions (sensing, listening) against task-achieving ones to act optimally despite incomplete information."

[[decisionRows]]
task = "MDP"
context = "The state is fully observed and every decision takes one period (inventory, queues, games)"
purpose = "Markov decision process solved by value iteration (DiscreteValueIteration.jl); default: an inventory problem with Poisson demand"

[[decisionRows]]
task = "POMDP"
context = "The state is hidden and only noisy observations arrive (diagnosis, search, robotics)"
purpose = "Partially observable MDP on beliefs; QMDP approximation by default, SARSOP and POMCP for comparison; default: the Tiger problem"

[[decisionRows]]
task = "Semi-MDP"
context = "Actions take different amounts of time (maintenance, scheduling, options in RL)"
purpose = "Semi-Markov decision process: the discount over a transition is gamma to the power of the action's duration; hand-written value iteration on a machine-maintenance problem"

