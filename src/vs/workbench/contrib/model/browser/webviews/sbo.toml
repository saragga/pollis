[[actionGroups.actions]]
id = "model-accuracy"
label = "Model Accuracy"
desc = "RMSE and R-squared on 200 fresh random points, and on points near the best one (extra evaluations of f)"
code = '''
Random.seed!(3)
H = [lb .+ rand(length(lb)) .* (ub .- lb) for _ in 1:200]
N = [clamp.(x_best .+ 0.05 .* (ub .- lb) .* randn(length(lb)), lb, ub) for _ in 1:200]
score(P) = (yt = f.(P); yp = res.model.mean.(P); (rmse = sqrt(mean(abs2, yp .- yt)), r_squared = 1 - sum(abs2, yp .- yt) / sum(abs2, yt .- mean(yt))))
(whole_box = score(H), near_best = score(N))
'''

