[[codeBranches]]
model = "rsm"
code = '''
using LinearAlgebra, Statistics, Random

n = {{n}}  # dimension
f(x) = {{obj}}  # the expensive objective
lb, ub = {{lb}}, {{ub}}  # search box
n0 = {{ninit}}  # initial design size
budget = {{budget}}  # surrogate-guided evaluations

# Latin-hypercube design: one point per stratum in every variable
function lhs(k, lb, ub)
    U = reduce(hcat, [(randperm(k) .- rand(k)) ./ k for _ in eachindex(lb)])
    [lb .+ U[i, :] .* (ub .- lb) for i in 1:k]
end
unit(x, lb, ub) = (x .- lb) ./ (ub .- lb)  # the box mapped to [0, 1]^n
# candidate points: uniform in the box and Gaussian around the best point
candidates(xb, lb, ub, r; k=500) = [[lb .+ rand(length(lb)) .* (ub .- lb) for _ in 1:k];
                                    [clamp.(xb .+ r .* (ub .- lb) .* randn(length(lb)), lb, ub) for _ in 1:k]]
RADIUS = {{radius}}  # region around the best point

features(z) = [1.0; z; [z[i] * z[j] for i in eachindex(z) for j in i:length(z)]]  # full quadratic
function fit(X, y, lb, ub)
    F = permutedims(reduce(hcat, [features(unit(x, lb, ub)) for x in X]))
    beta = (transpose(F) * F + 1e-8I) \ (transpose(F) * y)  # least squares (slightly regularised)
    (mean = x -> dot(features(unit(x, lb, ub)), beta), sd = x -> 0.0, coefficients = beta)
end
# minimise the quadratic among candidates near the best point
acquire(m, X, y, lb, ub, t) = (C = candidates(X[argmin(y)], lb, ub, RADIUS; k=1000)[1001:end]; C[argmin(m.mean.(C))])

function search(; budget=budget, n0=n0, seed=1, lb=lb, ub=ub, f=f)
    Random.seed!(seed)
    X = lhs(n0, lb, ub); y = f.(X)
    for t in 1:budget
        m = fit(X, y, lb, ub)  # refit the surrogate
        xn = acquire(m, X, y, lb, ub, t)  # choose the next point
        push!(X, xn); push!(y, f(xn))  # one expensive evaluation
    end
    k = argmin(y)
    (x = X[k], fx = y[k], X = X, y = y, trace = accumulate(min, y), model = fit(X, y, lb, ub))
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = length(res.y))
'''

[[codeBranches]]
model = "kriging"
code = '''
using SpecialFunctions, LinearAlgebra, Statistics, Random

n = {{n}}  # dimension
f(x) = {{obj}}  # the expensive objective
lb, ub = {{lb}}, {{ub}}  # search box
n0 = {{ninit}}  # initial design size
budget = {{budget}}  # surrogate-guided evaluations

# Latin-hypercube design: one point per stratum in every variable
function lhs(k, lb, ub)
    U = reduce(hcat, [(randperm(k) .- rand(k)) ./ k for _ in eachindex(lb)])
    [lb .+ U[i, :] .* (ub .- lb) for i in 1:k]
end
unit(x, lb, ub) = (x .- lb) ./ (ub .- lb)  # the box mapped to [0, 1]^n
# candidate points: uniform in the box and Gaussian around the best point
candidates(xb, lb, ub, r; k=500) = [[lb .+ rand(length(lb)) .* (ub .- lb) for _ in 1:k];
                                    [clamp.(xb .+ r .* (ub .- lb) .* randn(length(lb)), lb, ub) for _ in 1:k]]

normcdf(z) = 0.5 * erfc(-z / sqrt(2)); normpdf(z) = exp(-z^2 / 2) / sqrt(2pi)

function fit(X, y, lb, ub)
    Z = [unit(x, lb, ub) for x in X]; m0, s0 = mean(y), std(y) + eps()
    yn = (y .- m0) ./ s0  # standardised responses
    kern(a, b, l) = exp(-sum(abs2, a - b) / (2l^2))  # squared-exponential kernel
    best = (ll = -Inf,)
    for l in (0.05, 0.1, 0.2, 0.3, 0.5, 1.0)  # length scale by maximum marginal likelihood
        C = cholesky(Symmetric([kern(a, b, l) for a in Z, b in Z] + 1e-6I))
        alpha = C \ yn
        ll = -0.5 * dot(yn, alpha) - sum(log, diag(C.L))
        ll > best.ll && (best = (ll = ll, l = l, C = C, alpha = alpha))
    end
    kvec(x) = [kern(unit(x, lb, ub), b, best.l) for b in Z]
    (mean = x -> m0 + s0 * dot(kvec(x), best.alpha),
     sd = x -> (k = kvec(x); s0 * sqrt(max(1 - dot(k, best.C \ k), 1e-12))), length_scale = best.l)
end
# expected improvement over the best value so far
ei(m, x, fbest) = (mu = m.mean(x); sd = m.sd(x); d = fbest - mu; d * normcdf(d / sd) + sd * normpdf(d / sd))
acquire(m, X, y, lb, ub, t) = (C = candidates(X[argmin(y)], lb, ub, 0.1); C[argmax([ei(m, c, minimum(y)) for c in C])])

function search(; budget=budget, n0=n0, seed=1, lb=lb, ub=ub, f=f)
    Random.seed!(seed)
    X = lhs(n0, lb, ub); y = f.(X)
    for t in 1:budget
        m = fit(X, y, lb, ub)  # refit the surrogate
        xn = acquire(m, X, y, lb, ub, t)  # choose the next point
        push!(X, xn); push!(y, f(xn))  # one expensive evaluation
    end
    k = argmin(y)
    (x = X[k], fx = y[k], X = X, y = y, trace = accumulate(min, y), model = fit(X, y, lb, ub))
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = length(res.y))
'''

[[codeBranches]]
model = "rbf"
code = '''
using LinearAlgebra, Statistics, Random

n = {{n}}  # dimension
f(x) = {{obj}}  # the expensive objective
lb, ub = {{lb}}, {{ub}}  # search box
n0 = {{ninit}}  # initial design size
budget = {{budget}}  # surrogate-guided evaluations

# Latin-hypercube design: one point per stratum in every variable
function lhs(k, lb, ub)
    U = reduce(hcat, [(randperm(k) .- rand(k)) ./ k for _ in eachindex(lb)])
    [lb .+ U[i, :] .* (ub .- lb) for i in 1:k]
end
unit(x, lb, ub) = (x .- lb) ./ (ub .- lb)  # the box mapped to [0, 1]^n
# candidate points: uniform in the box and Gaussian around the best point
candidates(xb, lb, ub, r; k=500) = [[lb .+ rand(length(lb)) .* (ub .- lb) for _ in 1:k];
                                    [clamp.(xb .+ r .* (ub .- lb) .* randn(length(lb)), lb, ub) for _ in 1:k]]

function fit(X, y, lb, ub)
    Z = [unit(x, lb, ub) for x in X]; k, d = length(Z), length(lb)
    P = [ones(k) permutedims(reduce(hcat, Z))]  # linear tail
    M = [[norm(a - b)^3 for a in Z, b in Z] P; transpose(P) zeros(d + 1, d + 1)]
    c = pinv(M) * [y; zeros(d + 1)]
    w, v = c[1:k], c[k+1:end]
    (mean = x -> (z = unit(x, lb, ub); sum(w[i] * norm(z - Z[i])^3 for i in 1:k) + v[1] + dot(v[2:end], z)), sd = x -> 0.0)
end
# stochastic RBF: weighted score of prediction and distance to evaluated points, cycling the weight
function acquire(m, X, y, lb, ub, t)
    C = candidates(X[argmin(y)], lb, ub, 0.1)
    s = m.mean.(C); dist = [minimum(norm(unit(c, lb, ub) - unit(x, lb, ub)) for x in X) for c in C]
    scale(v) = (v .- minimum(v)) ./ max(maximum(v) - minimum(v), eps())
    w = (0.3, 0.5, 0.8, 0.95)[mod1(t, 4)]  # weight on the prediction
    C[argmin(w .* scale(s) .+ (1 - w) .* (1 .- scale(dist)))]
end

function search(; budget=budget, n0=n0, seed=1, lb=lb, ub=ub, f=f)
    Random.seed!(seed)
    X = lhs(n0, lb, ub); y = f.(X)
    for t in 1:budget
        m = fit(X, y, lb, ub)  # refit the surrogate
        xn = acquire(m, X, y, lb, ub, t)  # choose the next point
        push!(X, xn); push!(y, f(xn))  # one expensive evaluation
    end
    k = argmin(y)
    (x = X[k], fx = y[k], X = X, y = y, trace = accumulate(min, y), model = fit(X, y, lb, ub))
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = length(res.y))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "convergence"
label = "Convergence Trace"
desc = "Best observed value per evaluation; the dashed line marks the end of the initial design"
code = '''
using Plots

plot(res.trace, xlabel="evaluation", ylabel="best f", label="best so far", linetype=:steppost)
scatter!(res.y, markersize=2, alpha=0.5, label="evaluations")
vline!([n0 + 0.5], linestyle=:dash, label="initial design")
'''

[[actionGroups.actions]]
id = "surrogate-surface"
label = "Surrogate Surface"
desc = "Contours of the final surrogate over the first two variables (others at the best point) with the evaluated points"
code = '''
using Plots

xs = range(lb[1], ub[1], length=80); ys = range(lb[2], ub[2], length=80)
contour(xs, ys, (a, b) -> res.model.mean([a; b; x_best[3:end]]), fill=true, xlabel="x1", ylabel="x2")
scatter!(first.(res.X), getindex.(res.X, 2), color=:white, markersize=3, label="evaluated")
scatter!([x_best[1]], [x_best[2]], marker=:star, markersize=10, color=:red, label="best")
'''

[[actionGroups.actions]]
id = "predicted-actual"
label = "Predicted vs Actual"
desc = "Surrogate predictions against true values on 200 fresh random points (extra evaluations of f)"
code = '''
using Plots

Random.seed!(2)
H = [lb .+ rand(length(lb)) .* (ub .- lb) for _ in 1:200]
yt, yp = f.(H), res.model.mean.(H)
scatter(yt, yp, xlabel="true f", ylabel="predicted f", label="holdout", markersize=3)
plot!(collect(extrema([yt; yp])), collect(extrema([yt; yp])), linestyle=:dash, color=:red, label="perfect fit")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "loo-error"
label = "Leave-One-Out Error"
desc = "Refit without each evaluated point and predict it: cross-validated error of the surrogate"
code = '''
err = map(eachindex(res.X)) do i
    keep = setdiff(eachindex(res.X), i)
    fit(res.X[keep], res.y[keep], lb, ub).mean(res.X[i]) - res.y[i]
end
(rmse = sqrt(mean(abs2, err)), max_abs_error = maximum(abs, err), response_std = std(res.y), relative_rmse = sqrt(mean(abs2, err)) / std(res.y))
'''

[[actionGroups.actions]]
id = "exploration-check"
label = "Exploration Check"
desc = "How the guided evaluations split between exploring the box and refining around the best point"
code = '''
guided = res.X[n0+1:end]
dist_best = [norm(unit(x, lb, ub) - unit(x_best, lb, ub)) for x in guided]
dmin = [minimum(norm(unit(res.X[i], lb, ub) - unit(res.X[j], lb, ub)) for j in 1:i-1) for i in n0+1:length(res.X)]
(share_near_best = mean(dist_best .< 0.1), median_distance_to_best = median(dist_best),
 smallest_gap_to_earlier_point = minimum(dmin), improvements_after_design = count(diff(res.trace[n0:end]) .< 0))
'''

[[actionGroups.actions]]
id = "sample-size"
label = "Sample Size Sensitivity"
desc = "Best value for different initial design sizes at the same total number of evaluations, 3 seeds each"
code = '''
total = n0 + budget
map(filter(<(total), [max(2, n + 1), 5, 10, 20, 40])) do k
    v = [search(n0=k, budget=total - k, seed=s).fx for s in 1:3]
    (initial_samples = k, guided = total - k, mean_best = mean(v), worst_best = maximum(v))
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "run-sbo"
label = "Best Solution"
desc = "The best evaluated point, its value and what the surrogate predicts there"
code = '''
(best_point = round.(x_best, sigdigits=6), best_value = f_best, surrogate_prediction = res.model.mean(x_best),
 found_at_evaluation = argmin(res.y), evaluations = length(res.y))
'''

[[actionGroups.actions]]
id = "multi-start"
label = "Multi-Start"
desc = "Three independent initial designs; keep the best result"
code = '''
runs = [search(seed=s) for s in 1:3]
k = argmin(getfield.(runs, :fx))
(best_values = getfield.(runs, :fx), best_point = round.(runs[k].x, sigdigits=6), total_evaluations = sum(length(r.y) for r in runs))
'''

[[actionGroups.actions]]
id = "local-refine"
label = "Local Refinement"
desc = "Polish the best point with Nelder-Mead on the true objective, limited to 100 evaluations (Optim.jl)"
code = '''
using Optim

r = Optim.optimize(f, x_best, NelderMead(), Optim.Options(f_calls_limit=100))
(surrogate_best = f_best, refined = Optim.minimum(r), improvement = f_best - Optim.minimum(r),
 refined_point = round.(clamp.(Optim.minimizer(r), lb, ub), sigdigits=6), extra_evaluations = Optim.f_calls(r))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "surrogate-comparison"
label = "Compare with Surrogates.jl"
desc = "Holdout accuracy of this surrogate against Surrogates.jl's Kriging and RadialBasis fitted to the same evaluated points"
code = '''
using Surrogates

xs = Tuple.(res.X)  # Surrogates.jl takes points as tuples
sk = Surrogates.Kriging(xs, res.y, lb, ub)
sr = Surrogates.RadialBasis(xs, res.y, lb, ub)
Random.seed!(2)
H = [lb .+ rand(length(lb)) .* (ub .- lb) for _ in 1:200]; yt = f.(H)
rmse(p) = sqrt(mean(abs2, p .- yt))
[(model = "this panel's surrogate", holdout_rmse = rmse(res.model.mean.(H))),
 (model = "Surrogates.jl Kriging", holdout_rmse = rmse([sk(Tuple(h)) for h in H])),
 (model = "Surrogates.jl RadialBasis", holdout_rmse = rmse([sr(Tuple(h)) for h in H]))]
'''

[[actionGroups.actions]]
id = "budget-sensitivity"
label = "Budget Sensitivity"
desc = "Best value found for increasing numbers of guided evaluations"
code = '''
map(unique([5, 10, 20, budget, 2budget])) do b
    sec = @elapsed r = search(budget=b)
    (guided_evaluations = b, best_value = r.fx, seconds = sec)
end
'''

[[actionGroups.actions]]
id = "optimizer-comparison"
label = "Compare with Direct Search"
desc = "The same number of evaluations given to random search and to Nelder-Mead (Optim.jl), 3 seeds each"
code = '''
using Optim

total = length(res.y)
function random_search(seed)
    Random.seed!(seed)
    minimum(f(lb .+ rand(length(lb)) .* (ub .- lb)) for _ in 1:total)
end
function nelder_mead(seed)
    Random.seed!(seed)
    r = Optim.optimize(x -> f(clamp.(x, lb, ub)), lb .+ rand(length(lb)) .* (ub .- lb), NelderMead(), Optim.Options(f_calls_limit=total))
    Optim.minimum(r)
end
map(["surrogate (selected)" => s -> search(seed=s).fx, "random search" => random_search, "Nelder-Mead" => nelder_mead]) do (name, run)
    v = [run(s) for s in 1:3]
    (method = name, evaluations = total, mean_best = mean(v), worst_best = maximum(v))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

