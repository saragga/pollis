[[decisionRows]]
task = "Response Surface Methods"
context = "Smooth, low-dimensional objectives, when an interpretable model is wanted"
purpose = "Fits a full quadratic by least squares and moves to its minimum within a region around the best point"

[[decisionRows]]
task = "Kriging"
context = "Expensive black boxes with few evaluations, where uncertainty should guide sampling"
purpose = "Gaussian-process interpolant with a length scale chosen by marginal likelihood; the next point maximises expected improvement"

[[decisionRows]]
task = "Radial Basis Functions"
context = "Moderate dimensions and budgets; fast to refit"
purpose = "Cubic RBF interpolant with a linear tail; the next point balances a low prediction against distance from evaluated points (stochastic RBF)"

[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables. The default objective and bounds adapt to it (n >= 2)."
default = "2"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the (expensive) objective, in terms of the vector x. Default: the Rosenbrock function (minimum 0 at x = ones(n))."
default = "sum(100 .* (x[2:end] .- x[1:end-1] .^ 2) .^ 2 .+ (1 .- x[1:end-1]) .^ 2)"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds, one per variable."
default = "fill(-2.0, n)"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds, one per variable."
default = "fill(2.0, n)"

[[inputs]]
id = "ninit"
label = "Initial Samples"
tooltip = "Number of points in the Latin-hypercube initial design. More points give a better first surrogate but use evaluations up front."
default = "10"
newRow = true

[[inputs]]
id = "budget"
label = "Evaluations"
tooltip = "Number of surrogate-guided evaluations after the initial design."
default = "40"

[[inputs]]
id = "radius"
label = "Region Size"
tooltip = "Size of the region around the best point in which the quadratic is minimised, as a fraction of the box."
default = "0.2"
models = ["rsm"]
newRow = true

