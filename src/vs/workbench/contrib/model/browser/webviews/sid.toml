[[bullets]]
text = "Parallel tempering - runs K chains at annealed temperatures from prior to target, enabling global mixing"
detail = ""

[[bullets]]
text = "Designed for multimodal and high-dimensional posteriors that defeat standard single-chain MCMC"
detail = ""

[[bullets]]
text = "Swap proposals between adjacent chains carry probability mass across the temperature ladder"
detail = ""

[[inputs]]
id = "log-p"
label = "Log-potential log p(x)"
tooltip = "Julia expression for the log-density of the target (up to a constant). Use x[1], x[2], ... to index vector components. The default is an equal mixture of two unit Gaussians centred at (3, 3) and (-3, -3): a single MCMC chain rarely crosses between them, which is what parallel tempering is for. A single Gaussian such as -0.5 * sum(x .^ 2) needs no tempering."
default = "log(exp(-0.5 * sum((x .- 3) .^ 2)) + exp(-0.5 * sum((x .+ 3) .^ 2)))"

[[inputs]]
id = "d"
label = "Dimension d"
tooltip = "Number of dimensions of the target distribution. The initial state is drawn from a d-dimensional standard Gaussian."
default = "2"

[[inputs]]
id = "n-rounds"
label = "Rounds"
tooltip = "Number of PT rounds. Each round doubles the number of samples. More rounds give better mixing and lower variance estimates. Typical range: 8 to 14."
default = "10"

[[inputs]]
id = "n-chains"
label = "Chains"
tooltip = "Number of parallel chains (temperature ladder rungs). More chains improve swap acceptance and help with complex posteriors. Typical range: 4 to 20."
default = "10"

[[codeBranches]]
model = "main"
code = '''
using Pigeons

struct Target  # callable target struct
    d::Int  # number of dimensions
end

function Pigeons.log_potential(target::Target, x)  # log-density of target
    return {{log-p}}  # user-supplied expression
end

Pigeons.initialization(target::Target, rng, i) = randn(rng, target.d)  # initial state per chain

pt = pigeons(  # run parallel tempering
    target   = Target({{d}}),
    n_rounds = {{n-rounds}},
    n_chains = {{n-chains}},
)

samples = get_sample(pt)  # posterior draws from cold chain
println("n_samples: ", length(samples))  # number of samples
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "trace-plot"
label = "Trace Plot"
desc = "Plot samples over index to assess mixing"
code = '''
using Pigeons, Plots

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

pt = pigeons(target = Target({{d}}), n_rounds = {{n-rounds}}, n_chains = {{n-chains}})
samples = get_sample(pt)  # posterior draws

x1 = [s[1] for s in samples]  # first dimension
plot(x1, xlabel = "Sample", ylabel = "x[1]", title = "Trace Plot", lw = 0.5)  # trace
'''

[[actionGroups.actions]]
id = "marginal-hist"
label = "Marginal Histogram"
desc = "Histogram of each marginal dimension"
code = '''
using Pigeons, Plots

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

pt      = pigeons(target = Target({{d}}), n_rounds = {{n-rounds}}, n_chains = {{n-chains}})
samples = get_sample(pt)

x1 = [s[1] for s in samples]  # first marginal
