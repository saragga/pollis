[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "swap-rates"
label = "Swap Acceptance"
desc = "PT swap acceptance rates between adjacent chains"
code = '''
using Pigeons

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

pt = pigeons(  # swap_acceptance_pr logged automatically
    target   = Target({{d}}),
    n_rounds = {{n-rounds}},
    n_chains = {{n-chains}},
    record   = [Pigeons.swap_acceptance_pr, Pigeons.round_trip],
)

println("Round trips: ", Pigeons.n_round_trips(pt))  # full traversals of temperature ladder
'''

[[actionGroups.actions]]
id = "ess"
label = "Effective Sample Size"
desc = "ESS per dimension via StatsBase.jl"
code = '''
using Pigeons, StatsBase

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

pt      = pigeons(target = Target({{d}}), n_rounds = {{n-rounds}}, n_chains = {{n-chains}})
samples = get_sample(pt)

for i in 1:{{d}}  # ESS per dimension
    xi  = [s[i] for s in samples]
    println("ESS[", i, "] = ", Int(round(ess(xi))))  # effective sample size
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "posterior-mean"
label = "Posterior Mean"
desc = "Sample mean and variance per dimension"
code = '''
using Pigeons, Statistics

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

pt      = pigeons(target = Target({{d}}), n_rounds = {{n-rounds}}, n_chains = {{n-chains}})
samples = get_sample(pt)

means = [mean([s[i] for s in samples]) for i in 1:{{d}}]  # posterior mean
vars  = [var([s[i] for s in samples]) for i in 1:{{d}}]  # posterior variance
println("Means:     ", means)  # per-dimension means
println("Variances: ", vars)  # per-dimension variances
'''

[[actionGroups.actions]]
id = "credible-intervals"
label = "Credible Intervals"
desc = "95% credible intervals per dimension"
code = '''
using Pigeons, Statistics

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

pt      = pigeons(target = Target({{d}}), n_rounds = {{n-rounds}}, n_chains = {{n-chains}})
samples = get_sample(pt)

for i in 1:{{d}}  # 95% credible interval per dimension
    xi       = [s[i] for s in samples]
    lo, hi   = quantile(xi, [0.025, 0.975])
    println("CI[", i, "]: [", round(lo, digits=4), ", ", round(hi, digits=4), "]")  # print interval
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "n-chains-sweep"
label = "Chain Count Sweep"
desc = "Compare round-trip rates for different n_chains"
code = '''
using Pigeons, Printf

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

for nc in [4, 8, 16]  # sweep number of chains
    pt = pigeons(target = Target({{d}}), n_rounds = {{n-rounds}}, n_chains = nc,
              record = [Pigeons.round_trip])
    rt = Pigeons.n_round_trips(pt)  # round trips completed
    @printf("n_chains=%-4d  round_trips=%d
", nc, rt)  # print row
end
'''

[[actionGroups.actions]]
id = "rounds-sweep"
label = "Rounds Sweep"
desc = "Compare ESS vs number of rounds"
code = '''
using Pigeons, StatsBase, Printf

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

for nr in [8, 10, 12]  # sweep number of rounds
    pt      = pigeons(target = Target({{d}}), n_rounds = nr, n_chains = {{n-chains}})
    samples = get_sample(pt)
    x1      = [s[1] for s in samples]
    @printf("n_rounds=%-4d  n=%d  ESS=%.0f
", nr, length(x1), ess(x1))  # print row
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "log-z"
label = "Normalising Constant"
desc = "Stepping-stone estimate of log Z"
code = '''
using Pigeons

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

pt = pigeons(target = Target({{d}}), n_rounds = {{n-rounds}}, n_chains = {{n-chains}})

log_Z = Pigeons.stepping_stone(pt)  # stepping-stone estimate
println("log Z: ", log_Z)  # log normalising constant
println("Z:     ", exp(log_Z))  # normalising constant
'''

[[actionGroups.actions]]
id = "summary-stats"
label = "Summary Statistics"
desc = "Sample count, means, and round-trip rate"
code = '''
using Pigeons, Statistics

struct Target; d::Int; end
Pigeons.log_potential(t::Target, x) = {{log-p}}
Pigeons.initialization(t::Target, rng, i) = randn(rng, t.d)

pt      = pigeons(target = Target({{d}}), n_rounds = {{n-rounds}}, n_chains = {{n-chains}},
              record = [Pigeons.round_trip])
samples = get_sample(pt)

println("Samples:      ", length(samples))  # number of posterior draws
println("Dimension:    ", {{d}})  # target dimension
println("Means:        ", [mean([s[i] for s in samples]) for i in 1:{{d}}])  # posterior mean
println("Round trips:  ", Pigeons.n_round_trips(pt))  # PT efficiency
'''
