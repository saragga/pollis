[[codeBranches]]
model = "praxis"
code = '''
using NLopt, LinearAlgebra, Statistics, Random

n = {{n}}  # number of variables
f(x) = {{f}}  # objective
x0 = {{x0}}  # starting point
lb, ub = {{lb}}, {{ub}}  # box
maxfun = {{maxfun}}  # evaluation budget
rhobeg = {{rhobeg}}  # initial trust-region radius / step size

# wrap f so every evaluation is recorded
function recorder(f)
    pts, vals = Vector{Vector{Float64}}(), Float64[]
    fr(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fr, pts, vals
end
bound_violation(x) = max(0.0, maximum(lb .- x), maximum(x .- ub))
violation(x) = 0.0  # unconstrained

function search(; x0=x0, maxfun=maxfun, rhobeg=rhobeg, f=f)
    fr, pts, vals = recorder(f)
    opt = NLopt.Opt(:LN_PRAXIS, length(x0))
    opt.min_objective = (x, grad) -> fr(x)  # derivative-free: grad is unused
    opt.maxeval = maxfun
    opt.xtol_rel = 1e-10
    opt.initial_step = fill(rhobeg, length(x0))
    fx, x, ret = NLopt.optimize(opt, x0)
    (x = x, fx = fx, points = pts, values = vals, evals = length(vals), status = string(ret))
end

res = search()
x_best, f_best = res.x, res.fx
(minimiser = x_best, minimum = f_best, evaluations = res.evals, status = res.status, violation = violation(x_best))
'''

[[codeBranches]]
model = "sbplx"
code = '''
using NLopt, LinearAlgebra, Statistics, Random

n = {{n}}  # number of variables
f(x) = {{f}}  # objective
x0 = {{x0}}  # starting point
lb, ub = {{lb}}, {{ub}}  # box
maxfun = {{maxfun}}  # evaluation budget
rhobeg = {{rhobeg}}  # initial trust-region radius / step size

# wrap f so every evaluation is recorded
function recorder(f)
    pts, vals = Vector{Vector{Float64}}(), Float64[]
    fr(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fr, pts, vals
end
bound_violation(x) = max(0.0, maximum(lb .- x), maximum(x .- ub))
violation(x) = bound_violation(x)

function search(; x0=x0, maxfun=maxfun, rhobeg=rhobeg, f=f)
    fr, pts, vals = recorder(f)
    opt = NLopt.Opt(:LN_SBPLX, length(x0))
    opt.min_objective = (x, grad) -> fr(x)  # derivative-free: grad is unused
    opt.lower_bounds, opt.upper_bounds = lb, ub
    opt.maxeval = maxfun
    opt.xtol_rel = 1e-10
    opt.initial_step = fill(rhobeg, length(x0))
    fx, x, ret = NLopt.optimize(opt, x0)
    (x = x, fx = fx, points = pts, values = vals, evals = length(vals), status = string(ret))
end

res = search()
x_best, f_best = res.x, res.fx
(minimiser = x_best, minimum = f_best, evaluations = res.evals, status = res.status, violation = violation(x_best))
'''

