[[actionGroups.actions]]
id = "constraint-check"
label = "Constraint Check"
desc = "Value and slack of every constraint at the minimiser (a constraint is active when its slack is near zero)"
code = '''
{{?model=cobyla}}vals = c(x_best)
{{?model=lincoa}}vals = A * x_best .- b
{{?model=cobyla|lincoa}}general = [(constraint = k, value = v, satisfied = v <= 1e-8, active = abs(v) < 1e-6) for (k, v) in enumerate(vals)]
{{?model!=cobyla|lincoa}}general = "no constraints other than the box for this method"
(general_constraints = general, box_violation = bound_violation(x_best), total_violation = violation(x_best))
'''

[[actionGroups.actions]]
id = "scaling-check"
label = "Scaling Check"
desc = "Finite-difference Hessian at the minimiser: eigenvalues and condition number show how badly scaled the problem is"
code = '''
d, h = length(x_best), 1e-4
E = Matrix(1.0I, d, d)
H = [(f(x_best + h * (E[:, i] + E[:, j])) - f(x_best + h * (E[:, i] - E[:, j])) - f(x_best - h * (E[:, i] - E[:, j])) + f(x_best - h * (E[:, i] + E[:, j]))) / (4h^2) for i in 1:d, j in 1:d]
ev = eigvals(Symmetric(H))
(hessian_eigenvalues = round.(ev, sigdigits=4), condition_number = maximum(abs, ev) / max(minimum(abs, ev), eps()),
 variable_magnitudes = round.(abs.(x_best), sigdigits=3), box_sides = ub .- lb,
 advice = maximum(abs, ev) / max(minimum(abs, ev), eps()) > 1e4 ? "ill-conditioned: rescale the variables so curvatures are similar" : "reasonably scaled")
'''
