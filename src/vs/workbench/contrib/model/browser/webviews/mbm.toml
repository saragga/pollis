model = "lincoa"
code = '''
using PRIMA, LinearAlgebra, Statistics, Random

n = {{n}}  # number of variables
f(x) = {{f}}  # objective
x0 = {{x0}}  # starting point
lb, ub = {{lb}}, {{ub}}  # box
maxfun = {{maxfun}}  # evaluation budget
rhobeg = {{rhobeg}}  # initial trust-region radius / step size

# wrap f so every evaluation is recorded
function recorder(f)
    pts, vals = Vector{Vector{Float64}}(), Float64[]
    fr(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fr, pts, vals
end
bound_violation(x) = max(0.0, maximum(lb .- x), maximum(x .- ub))
A, b = {{aineq}}, {{bineq}}  # linear constraints A * x <= b
violation(x) = max(0.0, maximum(A * x .- b), bound_violation(x))

function search(; x0=x0, maxfun=maxfun, rhobeg=rhobeg, f=f)
    fr, pts, vals = recorder(f)
    x, info = lincoa(fr, x0; linear_ineq=(A, b), xl=lb, xu=ub, maxfun=maxfun, rhobeg=rhobeg, rhoend=1e-8)
    (x = x, fx = info.fx, points = pts, values = vals, evals = info.nf, status = string(info.status))
end

