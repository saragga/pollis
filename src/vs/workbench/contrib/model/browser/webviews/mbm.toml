id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "convergence-curve"
label = "Convergence Curve"
desc = "Best objective value against the number of evaluations (log scale)"
code = '''
using Plots

best = accumulate(min, res.values)
shift = min(0, minimum(best)) - 1e-12  # keeps the log scale defined
plot(best .- shift, yscale=:log10, xlabel="evaluation", ylabel="best f - shift", legend=false)
'''

[[actionGroups.actions]]
id = "objective-surface"
label = "Objective Surface"
desc = "Contours of f over the first two variables (others held at the minimiser) with the path of best points"
code = '''
using Plots

xs = range(lb[1], ub[1], length=150); ys = range(lb[2], ub[2], length=150)
contour(xs, ys, (a, b) -> log1p(max(f([a; b; x_best[3:end]]) - f_best, 0)), fill=true, xlabel="x1", ylabel="x2", colorbar_title="log(1 + f - f*)")
improving = [p for (k, p) in enumerate(res.points) if res.values[k] <= minimum(res.values[1:k])]
plot!(first.(improving), getindex.(improving, 2), marker=:circle, markersize=2, color=:white, label="best so far")
scatter!([x_best[1]], [x_best[2]], marker=:star, markersize=10, color=:red, label="minimiser")
'''

[[actionGroups.actions]]
id = "query-scatter"
label = "Query Scatter"
desc = "Every evaluated point in the first two variables, coloured by evaluation order"
code = '''
using Plots

scatter(first.(res.points), getindex.(res.points, 2), zcolor=1:length(res.points), markersize=2, markerstrokewidth=0,
        xlabel="x1", ylabel="x2", colorbar_title="evaluation", label="queries")
scatter!([x_best[1]], [x_best[2]], marker=:star, markersize=10, color=:red, label="minimiser")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Return status, evaluations used and a finite-difference gradient norm at the minimiser, with the part not balanced by active constraints"
code = '''
h = 1e-6
E = Matrix(1.0I, length(x_best), length(x_best))
grad = [(f(x_best + h * e) - f(x_best - h * e)) / (2h) for e in eachcol(E)]
normals = Vector{Float64}[]  # outward normals of the constraints active at the minimiser
{{?model=bobyqa|cobyla|lincoa|sbplx}}append!(normals, [E[:, i] .* (x_best[i] - lb[i] < 1e-6 ? -1 : 1) for i in eachindex(x_best) if min(x_best[i] - lb[i], ub[i] - x_best[i]) < 1e-6])  # bounds
{{?model=cobyla}}cons(x) = c(x)
{{?model=lincoa}}cons(x) = A * x .- b
{{?model=cobyla|lincoa}}append!(normals, [[(cons(x_best + h * e)[k] - cons(x_best - h * e)[k]) / (2h) for e in eachcol(E)] for k in findall(abs.(cons(x_best)) .< 1e-6)])
J = reduce(hcat, normals; init=zeros(length(x_best), 0))
kkt = isempty(normals) ? grad : grad - J * (J \ grad)  # gradient left after removing the active normals: near 0 at a constrained (KKT) minimum, where grad itself need not be
(status = res.status, evaluations = res.evals, budget = maxfun, budget_exhausted = res.evals >= maxfun,
 minimum = f_best, gradient_norm = norm(grad), active_constraints = size(J, 2), projected_gradient_norm = norm(kkt), violation = violation(x_best))
'''

[[actionGroups.actions]]
id = "multi-start"
label = "Multi-Start"
desc = "Re-run from 10 random starting points in the box to test whether the same minimum is found"
code = '''
Random.seed!(1)
runs = [search(x0=lb .+ rand(length(lb)) .* (ub .- lb)) for _ in 1:10]
v = getfield.(runs, :fx)
(minima = round.(v, sigdigits=6), best = minimum(v), worst = maximum(v), share_at_best = mean(v .<= minimum(v) + 1e-6),
 max_distance_between_minimisers = maximum(norm(a.x - b.x) for a in runs, b in runs), mean_evaluations = mean(getfield.(runs, :evals)))
'''

[[actionGroups.actions]]
id = "bounds-feasibility"
label = "Bounds Feasibility"
desc = "Whether the minimiser lies within the box and which variables press against it"
code = '''
slack_low, slack_high = x_best .- lb, ub .- x_best
(inside_box = bound_violation(x_best) == 0, min_slack = minimum([slack_low; slack_high]),
 at_lower = findall(slack_low .< 1e-6), at_upper = findall(slack_high .< 1e-6))
'''

