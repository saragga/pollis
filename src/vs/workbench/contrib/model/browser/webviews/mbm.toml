[[decisionRows]]
task = "COBYLA"
context = "Nonlinear inequality constraints, no derivatives available"
purpose = "Builds linear models of the objective and constraints by interpolation on a simplex and solves a trust-region subproblem at each step"

[[decisionRows]]
task = "BOBYQA"
context = "Bound-constrained, smooth, derivative-free"
purpose = "Quadratic interpolation model (2n + 1 points by default) updated by least-Frobenius-norm changes, with a box-constrained trust region"

[[decisionRows]]
task = "NEWUOA"
context = "Unconstrained, smooth, moderate dimension"
purpose = "Same quadratic model machinery as BOBYQA without bounds; scales to a few hundred variables"

[[decisionRows]]
task = "UOBYQA"
context = "Unconstrained, small dimension, where a full quadratic model pays off"
purpose = "Fully determined quadratic interpolation over (n + 1)(n + 2) / 2 points; accurate models but cost grows quickly with n"

[[decisionRows]]
task = "LINCOA"
context = "Linear inequality constraints plus bounds"
purpose = "Quadratic models as in NEWUOA with a trust-region step that keeps linear constraints satisfied"

[[decisionRows]]
task = "PRAXIS"
context = "Unconstrained, smooth, when an interpolation model is not wanted"
purpose = "Brent's principal-axis method: line searches along conjugate directions that are periodically re-orthogonalised (NLopt)"

[[decisionRows]]
task = "Sbplx"
context = "Bound-constrained, noisy or non-smooth objectives"
purpose = "Rowan's Subplex: Nelder-Mead on a sequence of low-dimensional subspaces, more robust than plain Nelder-Mead in higher dimensions (NLopt)"

[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables. The default objective, start and bounds adapt to it."
default = "4"

[[inputs]]
id = "f"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, in terms of the vector x. Default: the n-dimensional Rosenbrock function (minimum 0 at x = ones(n))."
default = "sum(100 .* (x[2:end] .- x[1:end-1] .^ 2) .^ 2 .+ (1 .- x[1:end-1]) .^ 2)"

[[inputs]]
id = "x0"
label = "Starting Point"
tooltip = "Julia vector used as the starting point."
default = "zeros(n)"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds. Enforced by BOBYQA, LINCOA, COBYLA and Sbplx; the other methods use the box only to sample starting points and draw plots."
default = "fill(-2.0, n)"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds (see Lower Bounds)."
default = "fill(2.0, n)"

[[inputs]]
id = "constr"
label = "Constraints c(x) <= 0"
tooltip = "Julia vector of nonlinear inequality constraints, each required to be at most 0. Default: stay inside the ball of radius sqrt(2)."
default = "[sum(x .^ 2) - 2.0]"
models = ["cobyla"]
newRow = true

[[inputs]]
id = "aineq"
label = "Constraint Matrix (A)"
tooltip = "Julia matrix of the linear inequality constraints A * x <= b, one row per constraint. Default: a single row of ones."
default = "ones(1, n)"
models = ["lincoa"]
newRow = true

[[inputs]]
id = "bineq"
label = "Right-Hand Side (b)"
tooltip = "Julia vector b of A * x <= b. Default: the variables may sum to at most 2."
default = "[2.0]"
models = ["lincoa"]

[[inputs]]
id = "maxfun"
label = "Max Evaluations"
tooltip = "Maximum number of objective evaluations."
default = "2000"
newRow = true

[[inputs]]
id = "rhobeg"
label = "Initial Radius"
tooltip = "Initial trust-region radius (PRIMA methods) or initial step size (PRAXIS, Sbplx): roughly a tenth of the expected distance to the minimiser. BOBYQA needs it no larger than half the smallest box side."
default = "0.5"

