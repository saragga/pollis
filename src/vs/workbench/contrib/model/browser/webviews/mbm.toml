label = "Predict"

[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity"
desc = "Change in f when each variable of the minimiser moves by plus or minus 1 percent of its range"
code = '''
[(variable = i, down = f(x_best - 0.01 * (ub[i] - lb[i]) * e) - f_best, up = f(x_best + 0.01 * (ub[i] - lb[i]) * e) - f_best)
 for (i, e) in enumerate(eachcol(Matrix(1.0I, length(x_best), length(x_best))))]
'''

[[actionGroups.actions]]
id = "warm-start"
label = "Warm Start"
desc = "Restart from the minimiser with a ten times smaller radius and see whether it improves further"
code = '''
res2 = search(x0=x_best, rhobeg=rhobeg / 10)
(first_minimum = f_best, restarted_minimum = res2.fx, improvement = f_best - res2.fx,
 moved = norm(res2.x - x_best), extra_evaluations = res2.evals, status = res2.status)
'''

