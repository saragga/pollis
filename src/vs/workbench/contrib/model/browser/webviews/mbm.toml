id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "method-comparison"
label = "Method Comparison"
desc = "The PRIMA solvers and NLopt's PRAXIS, Sbplx and Nelder-Mead on the objective with the same start and budget (constraints other than bounds are left out)"
code = '''
using PRIMA, NLopt

run_prima(solver; kw...) = (r = solver(f, x0; maxfun=maxfun, rhobeg=rhobeg, rhoend=1e-8, kw...); (fx = r[2].fx, evals = r[2].nf))
function run_nlopt(alg)
    opt = NLopt.Opt(alg, length(x0)); count = Ref(0)
    opt.min_objective = (x, grad) -> (count[] += 1; f(x))
    opt.maxeval = maxfun; opt.xtol_rel = 1e-10; opt.initial_step = fill(rhobeg, length(x0))
    fx, _, _ = NLopt.optimize(opt, x0)
    (fx = fx, evals = count[])
end
methods = ["NEWUOA" => () -> run_prima(newuoa), "UOBYQA" => () -> run_prima(uobyqa), "BOBYQA (box)" => () -> run_prima(bobyqa; xl=lb, xu=ub),
           "PRAXIS" => () -> run_nlopt(:LN_PRAXIS), "Sbplx" => () -> run_nlopt(:LN_SBPLX), "Nelder-Mead" => () -> run_nlopt(:LN_NELDERMEAD)]
map(methods) do (name, run)
    sec = @elapsed r = run()
    (method = name, minimum = r.fx, evaluations = r.evals, seconds = sec)
end
'''

[[actionGroups.actions]]
id = "nlopt-comparison"
label = "NLopt vs PRIMA"
desc = "NLopt's original COBYLA against PRIMA's modernised COBYLA on the same constrained problem"
code = '''
using PRIMA, NLopt

{{?model=cobyla}}con(x) = c(x)
{{?model=lincoa}}con(x) = A * x .- b
{{?model!=cobyla|lincoa}}con(x) = [-1.0]  # this method has no constraints beyond the box
m = length(con(x0))
x1, info = cobyla(f, x0; nonlinear_ineq=con, xl=lb, xu=ub, maxfun=maxfun, rhobeg=rhobeg, rhoend=1e-8)
opt = NLopt.Opt(:LN_COBYLA, length(x0)); count = Ref(0)
opt.min_objective = (x, grad) -> (count[] += 1; f(x))
NLopt.inequality_constraint!(opt, (out, x, grad) -> (out .= con(x)), fill(1e-10, m))
opt.lower_bounds, opt.upper_bounds = lb, ub
opt.maxeval = maxfun; opt.xtol_rel = 1e-10; opt.initial_step = fill(rhobeg, length(x0))
fx2, x2, ret = NLopt.optimize(opt, x0)
[(implementation = "PRIMA COBYLA", minimum = info.fx, evaluations = info.nf, max_constraint = maximum(con(x1)), status = string(info.status)),
 (implementation = "NLopt COBYLA", minimum = fx2, evaluations = count[], max_constraint = maximum(con(x2)), status = string(ret))]
'''

