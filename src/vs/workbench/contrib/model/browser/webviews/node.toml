[[decisionRows]]
task = "Neural ODE"
context = "Dynamics unknown, trajectories do not cross"
purpose = "Black-box vector field du/dt = nn(u)"

[[decisionRows]]
task = "Augmented"
context = "Observed trajectories cross, or the plain Neural ODE underfits"
purpose = "Dynamics in a larger state space; extra states start at zero and are dropped from the output"

