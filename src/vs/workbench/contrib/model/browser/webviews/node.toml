[[inputs]]
id = "yvar"
label = "Observed trajectory"
tooltip = "Observed states, n x number of time points; the first column is the initial condition."
default = "obs_data"

[[inputs]]
id = "tvar"
label = "Time points"
tooltip = "Observation times, one per column of the observed trajectory, within [0, T]."
default = "tsteps"

[[inputs]]
id = "n"
label = "State dimension (n)"
tooltip = "Number of state variables in the system. For a 2D spiral use 2; for a Lorenz-type system use 3."
default = "2"
newRow = true

[[inputs]]
id = "hidden"
label = "Hidden units"
tooltip = "Number of units in each hidden layer of the neural network. Larger values increase capacity but slow training."
default = "32"

[[inputs]]
id = "augment"
label = "Augmented dimensions"
tooltip = "Extra states appended to the observed ones, starting at zero. They give trajectories room to cross; 1 to n is usually enough."
default = "2"
models = ["augmented"]

[[inputs]]
id = "tspan"
label = "Time span end (T)"
tooltip = "End of the training interval: the last observation time. Extrapolation actions integrate beyond it."
default = "10.0"
newRow = true

[[inputs]]
id = "lr"
label = "Learning rate"
tooltip = "Step size for the Adam optimiser. Typical range 1e-3 to 1e-2. Reduce if loss diverges."
default = "0.01"

[[inputs]]
id = "maxiter"
label = "Iterations"
tooltip = "Number of gradient steps. Start with 300 and increase if the loss has not converged."
default = "300"

