[[codeBranches]]
model = "node"
code = '''
using DiffEqFlux, OrdinaryDiffEq, SciMLSensitivity, Lux, ComponentArrays, Optimization, OptimizationOptimisers, Random
import Enzyme  # reverse-mode AD: AutoEnzyme for the loss, EnzymeVJP inside the adjoint

n       = {{n}}  # state dimension
hidden  = {{hidden}}  # hidden units per layer
T       = {{tspan}}f0  # end of the training time span
lr      = {{lr}}  # Adam learning rate
maxiter = {{maxiter}}  # training iterations

if !@isdefined(obs_data)  # no data in the session: simulate the damped cubic spiral of the DiffEqFlux tutorial as a demo
    n == 2 || error("the demo data is 2-dimensional: set n = 2 or define obs_data and tsteps")
    A_true = Float32[-0.1 2.0; -2.0 -0.1]
    tsteps = range(0f0, T; length=40)
    obs_data = Array(solve(ODEProblem((u, p, t) -> transpose(A_true) * u .^ 3, Float32[2.0, 0.0], (0f0, T)), Tsit5(); saveat=tsteps))
end
obs_data = Float32.({{yvar}})  # observed trajectory, n x number of time points
tsteps   = Float32.(collect({{tvar}}))  # observation times in [0, T]
u0       = obs_data[:, 1]  # initial condition: the first observation
solver   = (reltol=1f-3, abstol=1f-3)  # ODE solver tolerances

nn = Chain(Dense(n => hidden, tanh), Dense(hidden => hidden, tanh), Dense(hidden => n))  # learned vector field du/dt = nn(u)
ps, st = Lux.setup(Random.default_rng(), nn)
ps = ComponentArray(ps)
predict(p, u0, t) = Array(first(NeuralODE(nn, (0f0, t[end]), Tsit5(); saveat=t, solver..., sensealg=InterpolatingAdjoint(autojacvec=EnzymeVJP()))(u0, p, st)))  # n x length(t)
vector_field(u, p) = first(nn(u, p, st))  # du/dt at state u

loss(p) = sum(abs2, predict(p, u0, tsteps) .- obs_data)  # squared error against the observed trajectory
losses = Float32[]
callback(state, l) = (push!(losses, l); false)  # record the loss at every iteration
optf = OptimizationFunction((p, _) -> loss(p), Optimization.AutoEnzyme())
res = solve(OptimizationProblem(optf, ps), OptimizationOptimisers.Adam(lr); maxiters=maxiter, callback)
p_opt = res.u  # fitted parameters
'''

[[codeBranches]]
model = "augmented"
code = '''
using DiffEqFlux, OrdinaryDiffEq, SciMLSensitivity, Lux, ComponentArrays, Optimization, OptimizationOptimisers, Random
import Enzyme  # reverse-mode AD: AutoEnzyme for the loss, EnzymeVJP inside the adjoint

n       = {{n}}  # state dimension
hidden  = {{hidden}}  # hidden units per layer
T       = {{tspan}}f0  # end of the training time span
lr      = {{lr}}  # Adam learning rate
maxiter = {{maxiter}}  # training iterations

if !@isdefined(obs_data)  # no data in the session: simulate the damped cubic spiral of the DiffEqFlux tutorial as a demo
    n == 2 || error("the demo data is 2-dimensional: set n = 2 or define obs_data and tsteps")
    A_true = Float32[-0.1 2.0; -2.0 -0.1]
    tsteps = range(0f0, T; length=40)
    obs_data = Array(solve(ODEProblem((u, p, t) -> transpose(A_true) * u .^ 3, Float32[2.0, 0.0], (0f0, T)), Tsit5(); saveat=tsteps))
end
obs_data = Float32.({{yvar}})  # observed trajectory, n x number of time points
tsteps   = Float32.(collect({{tvar}}))  # observation times in [0, T]
u0       = obs_data[:, 1]  # initial condition: the first observation
solver   = (reltol=1f-3, abstol=1f-3)  # ODE solver tolerances

aug = {{augment}}  # extra states, starting at zero
nn = Chain(Dense(n + aug => hidden, tanh), Dense(hidden => hidden, tanh), Dense(hidden => n + aug))  # dynamics in the augmented space
ps, st = Lux.setup(Random.default_rng(), nn)
ps = ComponentArray(ps)
lift(u) = vcat(u, zeros(Float32, aug))  # append the augmented states
predict_full(p, u0, t) = Array(first(NeuralODE(nn, (0f0, t[end]), Tsit5(); saveat=t, solver..., sensealg=InterpolatingAdjoint(autojacvec=EnzymeVJP()))(lift(u0), p, st)))  # (n + aug) x length(t)
predict(p, u0, t) = predict_full(p, u0, t)[1:n, :]  # keep the observed states
vector_field_full(z, p) = first(nn(z, p, st))  # dz/dt in the augmented space: the observed states alone do not determine their velocity

loss(p) = sum(abs2, predict(p, u0, tsteps) .- obs_data)  # squared error against the observed trajectory
losses = Float32[]
callback(state, l) = (push!(losses, l); false)  # record the loss at every iteration
optf = OptimizationFunction((p, _) -> loss(p), Optimization.AutoEnzyme())
res = solve(OptimizationProblem(optf, ps), OptimizationOptimisers.Adam(lr); maxiters=maxiter, callback)
p_opt = res.u  # fitted parameters
'''

[[codeBranches]]
model = "ude"
code = '''
using DiffEqFlux, OrdinaryDiffEq, SciMLSensitivity, Lux, ComponentArrays, Optimization, OptimizationOptimisers, Random
import Enzyme  # reverse-mode AD: AutoEnzyme for the loss, EnzymeVJP inside the adjoint

n       = {{n}}  # state dimension
hidden  = {{hidden}}  # hidden units per layer
T       = {{tspan}}f0  # end of the training time span
lr      = {{lr}}  # Adam learning rate
maxiter = {{maxiter}}  # training iterations

if !@isdefined(obs_data)  # no data in the session: simulate the damped cubic spiral of the DiffEqFlux tutorial as a demo
    n == 2 || error("the demo data is 2-dimensional: set n = 2 or define obs_data and tsteps")
    A_true = Float32[-0.1 2.0; -2.0 -0.1]
    tsteps = range(0f0, T; length=40)
    obs_data = Array(solve(ODEProblem((u, p, t) -> transpose(A_true) * u .^ 3, Float32[2.0, 0.0], (0f0, T)), Tsit5(); saveat=tsteps))
end
obs_data = Float32.({{yvar}})  # observed trajectory, n x number of time points
tsteps   = Float32.(collect({{tvar}}))  # observation times in [0, T]
u0       = obs_data[:, 1]  # initial condition: the first observation
solver   = (reltol=1f-3, abstol=1f-3)  # ODE solver tolerances

known(u, theta) = theta .* u  # known physics with unknown rates (here growth or decay of each state): replace with your model
nn = Chain(Dense(n => hidden, tanh), Dense(hidden => n))  # learns the missing terms
ps_nn, st = Lux.setup(Random.default_rng(), nn)
ps = ComponentArray(theta=zeros(Float32, n), nn=ps_nn)
vector_field(u, p) = known(u, p.theta) .+ first(nn(u, p.nn, st))  # du/dt = known + learned
prob = ODEProblem((u, p, t) -> vector_field(u, p), u0, (0f0, T), ps)
predict(p, u0, t) = Array(solve(remake(prob; u0, p, tspan=(0f0, t[end])), Tsit5(); saveat=t, solver...,
                                sensealg=InterpolatingAdjoint(autojacvec=EnzymeVJP())))  # n x length(t)

loss(p) = sum(abs2, predict(p, u0, tsteps) .- obs_data)  # squared error against the observed trajectory
losses = Float32[]
callback(state, l) = (push!(losses, l); false)  # record the loss at every iteration
optf = OptimizationFunction((p, _) -> loss(p), Optimization.AutoEnzyme())
res = solve(OptimizationProblem(optf, ps), OptimizationOptimisers.Adam(lr); maxiters=maxiter, callback)
p_opt = res.u  # fitted parameters
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "predicted-vs-observed"
label = "Predicted vs Observed"
desc = "Plot the fitted trajectory of every state against the observed data"
code = '''
using Plots

pred = predict(p_opt, u0, tsteps)
plot(tsteps, permutedims(pred), label=permutedims(string.("fitted x", 1:n)), lw=2)
scatter!(tsteps, permutedims(obs_data), label=permutedims(string.("observed x", 1:n)), ms=3)
'''

[[actionGroups.actions]]
id = "phase-portrait"
label = "Phase Portrait"
desc = "Fitted and observed trajectories of the first two states in phase space"
code = '''
using Plots

pred = predict(p_opt, u0, range(0f0, T; length=500))
plot(pred[1, :], pred[2, :], label="fitted", lw=2, xlabel="x1", ylabel="x2")
scatter!(obs_data[1, :], obs_data[2, :], label="observed", ms=3)
scatter!([u0[1]], [u0[2]], label="start", marker=:star5, ms=8)
'''

[[actionGroups.actions]]
id = "loss-curve"
label = "Loss Curve"
desc = "Training loss recorded at every iteration, to check convergence"
code = '''
using Plots

plot(losses, xlabel="iteration", ylabel="squared error", yscale=:log10, legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals"
label = "Residual Analysis"
desc = "Residuals of every state over time; structure left in them means dynamics the model has missed"
code = '''
using Plots, Statistics

residuals = predict(p_opt, u0, tsteps) .- obs_data
println("RMSE per state: ", vec(sqrt.(mean(abs2, residuals; dims=2))))
plot(tsteps, permutedims(residuals), label=permutedims(string.("x", 1:n)), xlabel="time", ylabel="residual")
hline!([0], color=:black, ls=:dash, label=false)
'''

[[actionGroups.actions]]
id = "held-out-horizon"
label = "Held-Out Horizon"
desc = "Refit on the first 80% of the time points and check how well the last 20% are forecast"
code = '''
using Plots

cut = round(Int, 0.8 * length(tsteps))
loss_fit(p) = sum(abs2, predict(p, u0, tsteps[1:cut]) .- obs_data[:, 1:cut])
res_fit = solve(OptimizationProblem(OptimizationFunction((p, _) -> loss_fit(p), Optimization.AutoEnzyme()), ps),
                OptimizationOptimisers.Adam(lr); maxiters=maxiter)
pred = predict(res_fit.u, u0, tsteps)
println("held-out squared error: ", sum(abs2, pred[:, cut+1:end] .- obs_data[:, cut+1:end]))
plot(tsteps, permutedims(pred), label=permutedims(string.("fitted x", 1:n)), lw=2)
scatter!(tsteps, permutedims(obs_data), label=false, ms=3)
vline!([tsteps[cut]], ls=:dash, label="end of fit")
'''

[[actionGroups.actions]]
id = "sensitivity"
label = "Initial-Condition Sensitivity"
desc = "Distance over time between trajectories started at u0 and at a slightly perturbed u0"
code = '''
using LinearAlgebra, Plots

t = range(0f0, T; length=200)
delta = norm.(eachcol(predict(p_opt, u0, t) .- predict(p_opt, u0 .* 1.01f0, t)))  # 1% perturbation
plot(t, delta, xlabel="time", ylabel="distance between trajectories", legend=false)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forward-sim"
label = "Forward Simulation"
desc = "Run the fitted model forward from a new initial condition"
code = '''
using Plots

u_new = obs_data[:, 1] .+ 0.5f0 .* randn(Float32, n)  # new initial condition
t_new = range(0f0, T; length=200)
pred_new = predict(p_opt, u_new, t_new)
plot(t_new, permutedims(pred_new), label=permutedims(string.("x", 1:n)), xlabel="time")
'''

[[actionGroups.actions]]
id = "extrapolation"
label = "Extrapolation"
desc = "Extend the prediction to twice the training horizon to test generalisation"
code = '''
using Plots

t_extrap = range(0f0, 2T; length=400)
pred_extrap = predict(p_opt, u0, t_extrap)
plot(t_extrap, permutedims(pred_extrap), label=permutedims(string.("x", 1:n)), xlabel="time")
scatter!(tsteps, permutedims(obs_data), label=false, ms=2)
vline!([T], ls=:dash, label="training end")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-linear"
label = "vs Linear ODE"
desc = "Fit the model and the linear ODE du/dt = A u on the first 80% of the data and compare their errors on the last 20%"
code = '''
cut = round(Int, 0.8 * length(tsteps))  # both models see only the first 80% of the time points
held = cut+1:length(tsteps)  # held-out horizon
loss_fit(p) = sum(abs2, predict(p, u0, tsteps[1:cut]) .- obs_data[:, 1:cut])
res_fit = solve(OptimizationProblem(OptimizationFunction((p, _) -> loss_fit(p), Optimization.AutoEnzyme()), ps),
                OptimizationOptimisers.Adam(lr); maxiters=maxiter)  # neural model refit on the training part
prob_lin = ODEProblem((u, A, t) -> A * u, u0, (0f0, tsteps[end]), zeros(Float32, n, n))
predict_lin(A, t) = Array(solve(remake(prob_lin; p=A, tspan=(0f0, t[end])), Tsit5(); saveat=t, solver...,
                                sensealg=InterpolatingAdjoint(autojacvec=EnzymeVJP())))
optf_lin = OptimizationFunction((A, _) -> sum(abs2, predict_lin(A, tsteps[1:cut]) .- obs_data[:, 1:cut]), Optimization.AutoEnzyme())
res_lin = solve(OptimizationProblem(optf_lin, zeros(Float32, n, n)), OptimizationOptimisers.Adam(lr); maxiters=maxiter)
(neural_heldout = sum(abs2, predict(res_fit.u, u0, tsteps)[:, held] .- obs_data[:, held]),
 linear_heldout = sum(abs2, predict_lin(res_lin.u, tsteps)[:, held] .- obs_data[:, held]), A = res_lin.u)  # lower held-out error wins
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "vector-field"
label = "Learned Vector Field"
desc = "Arrows of the learned du/dt of the first two states: a grid field, or along the fitted path when the model is augmented"
code = '''
using LinearAlgebra, Plots, Statistics

r1, r2 = extrema(obs_data[1, :]), extrema(obs_data[2, :])
{{?model!=augmented}} base = vec(mean(obs_data; dims=2))  # states beyond the first two held at their mean
{{?model!=augmented}} grid = vec([(x, y) for x in range(r1..., length=15), y in range(r2..., length=15)])
{{?model!=augmented}} field = [vector_field(Float32.(vcat(x, y, base[3:end])), p_opt) for (x, y) in grid]
{{?model=augmented}} full = predict_full(p_opt, u0, range(0f0, T; length=60))  # fitted path including the extra states
{{?model=augmented}} grid = [(z[1], z[2]) for z in eachcol(full)]  # no grid: the velocity of x1, x2 depends on the extra states, so it is only defined along a path
{{?model=augmented}} field = [vector_field_full(z, p_opt)[1:2] for z in eachcol(full)]  # du/dt of x1, x2 with the extra states at their fitted values
scale = 0.06 * (r1[2] - r1[1]) / maximum(norm, field)
quiver(first.(grid), last.(grid), quiver=(scale .* getindex.(field, 1), scale .* getindex.(field, 2)), xlabel="x1", ylabel="x2")
plot!(obs_data[1, :], obs_data[2, :], lw=2, label="observed")
'''

[[actionGroups.actions]]
id = "lyapunov-estimate"
label = "Lyapunov Estimate"
desc = "Slope of the log-distance between two nearby trajectories: a rough maximal Lyapunov exponent"
code = '''
using LinearAlgebra, Statistics

solver_fit = solver
solver = (reltol=1f-6, abstol=1f-7)  # tight tolerances: solver error must stay well below the 1e-4 perturbation
t = collect(range(0f0, 2T; length=400))
traj = predict(p_opt, u0, t)
dist = norm.(eachcol(traj .- predict(p_opt, u0 .+ 1f-4, t)))
solver = solver_fit  # restore the fitting tolerances
