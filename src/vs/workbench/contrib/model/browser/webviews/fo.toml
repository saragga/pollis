# First-Order Methods Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/fo.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "First-Order Methods"
viewType = "pollis.fo"
defaultModel = "gd"

[[packages]]
name = "Optim.jl"
github = "https://github.com/JuliaNLSolvers/Optim.jl"

[requires]
packages = ["Optim.jl", "ADTypes.jl", "LineSearches.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Gradient Descent"
file = "fo/tutorial-01-gradient-descent.ipynb"
bundled = true
description = "Steepest descent with Wolfe line search using GradientDescent() in Optim.jl"

[[notebookSections.notebooks]]
name = "Conjugate Gradient"
file = "fo/tutorial-02-conjugate-gradient.ipynb"
bundled = true
