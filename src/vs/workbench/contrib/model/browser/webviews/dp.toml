[[bullets]]
text = "Dynamic Programming solves the Bellman equation by backward induction over a finite or discretised state space, guaranteeing the global optimum without assumptions on convexity or differentiability. Unlike Stochastic Dual Dynamic Programming (Stochastic Programming menu)"
detail = "which exploits stagewise independence and solves cuts over continuous decisions — exact DP works on a discretised grid and applies to problems with arbitrary transition structure, including non-linear dynamics and non-convex costs."

[[bullets]]
text = "Both toggles assume full state observability. For problems where the state is only partially observed, see Sequential Decision Making Under Uncertainty (POMDPs.jl). For large or continuous state spaces where exact DP is intractable, see Reinforcement Learning."
detail = ""

[[decisionRows]]
task = "Deterministic"
context = "Sequential decisions whose outcomes are known in advance (inventory with known demand, shortest paths, resource allocation)"
purpose = "Inventory control with a fixed demand of 5 units per period, solved exactly on the discrete stock grid by policy iteration (QuantEcon DiscreteDP)"

[[decisionRows]]
task = "Stochastic"
context = "Sequential decisions under uncertainty where the Bellman equation takes an expectation over random shocks"
purpose = "The same inventory problem with random demand: N equally likely scenarios between 0 and 10 units (mean 5); the value accounts for lost sales and leftover stock"

[[inputs]]
id = "S"
label = "States (S)"
tooltip = "Number of stock levels 0 .. S-1 (warehouse capacity). Orders that would exceed capacity are infeasible."
default = "50"

[[inputs]]
id = "T"
label = "Horizon (T)"
tooltip = "Periods simulated under the optimal policy; also the longest horizon of the finite-horizon backward induction comparison."
default = "10"

[[inputs]]
id = "gamma"
label = "Discount (gamma)"
tooltip = "Discount factor in (0, 1). Values close to 1 weight future profit heavily and slow the convergence of value iteration."
default = "0.95"

[[inputs]]
id = "N"
label = "Demand Scenarios (N)"
tooltip = "Number of equally likely demand values, spread evenly between 0 and 10 units, used to take the expectation in the Bellman equation."
default = "10"
models = ["stoch"]

