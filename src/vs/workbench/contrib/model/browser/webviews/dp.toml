(stock = s, value = round(V[s+1], digits=3), optimal_order = policy[s+1], marginal_value_of_a_unit = round(V[s+2] - V[s+1], digits=3))
'''

[[actionGroups.actions]]
id = "discount-sensitivity"
label = "Discount Sensitivity"
desc = "Value at empty stock and the order-up-to level for a range of discount factors"
code = '''
using Plots
gammas = [0.5, 0.7, 0.8, 0.9, 0.95, 0.99]
sols = [solve(DiscreteDP(R, Q, g), PFI) for g in gammas]
upto = [maximum((s + r.sigma[s+1] - 1 for s in 0:nS-1 if r.sigma[s+1] > 1); init=0) for r in sols]  # stock after ordering
plot(plot(gammas, [r.v[1] for r in sols], marker=:o, xlabel="gamma", ylabel="V*(0)", legend=false),
    plot(gammas, upto, marker=:o, xlabel="gamma", ylabel="order-up-to level", legend=false), layout=(1, 2), size=(900, 350))
'''
