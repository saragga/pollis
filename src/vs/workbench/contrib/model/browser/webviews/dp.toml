[[codeBranches]]
model = "det"
code = '''
using QuantEcon, Random, Statistics

nS = {{S}}  # stock levels 0 .. S-1
T = {{T}}  # simulation horizon
beta = {{gamma}}  # discount factor
amax = 10  # largest order per period
price, cost, hold = 8.0, 2.0, 0.5  # sale price, unit order cost, holding cost per leftover unit
demand, prob = [5], [1.0]  # known demand every period

function build(demand, prob)  # reward matrix R[s, a] and transition array Q[s, a, s'] (lost sales)
    R = fill(-Inf, nS, amax + 1)  # -Inf marks orders that would exceed capacity
    Q = zeros(nS, amax + 1, nS)
    for s in 0:nS-1, a in 0:amax
        if s + a > nS - 1
            Q[s+1, a+1, s+1] = 1.0  # never chosen; any valid distribution
            continue
        end
        R[s+1, a+1] = sum(p * (price * min(s + a, d) - cost * a - hold * max(s + a - d, 0)) for (d, p) in zip(demand, prob))
        for (d, p) in zip(demand, prob)
            Q[s+1, a+1, max(s + a - d, 0)+1] += p
        end
    end
    R, Q
end

function simulate(pol, s0, steps, rng)  # follow an order policy (order per stock level) with sampled demand
    s = s0; stock = [s]; orders = Int[]; rewards = Float64[]
    cp = cumsum(prob)
    for t in 1:steps
        a = pol[s+1]; d = demand[findfirst(cp .>= rand(rng))]
        push!(orders, a); push!(rewards, price * min(s + a, d) - cost * a - hold * max(s + a - d, 0))
        s = max(s + a - d, 0); push!(stock, s)
    end
    (stock = stock, orders = orders, rewards = rewards)
end

R, Q = build(demand, prob)
ddp = DiscreteDP(R, Q, beta)  # discrete dynamic program
res = solve(ddp, PFI)  # policy iteration
V, policy = res.v, res.sigma .- 1  # value and optimal order per stock level
(value_at_empty_stock = round(V[1], digits=3), order_at_empty_stock = policy[1],
 order_up_to = unique(s + policy[s+1] for s in 0:nS-1 if policy[s+1] > 0), iterations = res.num_iter)
'''

[[codeBranches]]
model = "stoch"
code = '''
using QuantEcon, Random, Statistics

nS = {{S}}  # stock levels 0 .. S-1
T = {{T}}  # simulation horizon
beta = {{gamma}}  # discount factor
amax = 10  # largest order per period
price, cost, hold = 8.0, 2.0, 0.5  # sale price, unit order cost, holding cost per leftover unit
N = {{N}}  # demand scenarios
demand = N == 1 ? [5] : round.(Int, range(0, 10, length=N))  # equally likely demands, mean 5
prob = fill(1 / N, N)

function build(demand, prob)  # reward matrix R[s, a] and transition array Q[s, a, s'] (lost sales)
    R = fill(-Inf, nS, amax + 1)  # -Inf marks orders that would exceed capacity
    Q = zeros(nS, amax + 1, nS)
    for s in 0:nS-1, a in 0:amax
        if s + a > nS - 1
            Q[s+1, a+1, s+1] = 1.0  # never chosen; any valid distribution
            continue
        end
        R[s+1, a+1] = sum(p * (price * min(s + a, d) - cost * a - hold * max(s + a - d, 0)) for (d, p) in zip(demand, prob))
        for (d, p) in zip(demand, prob)
            Q[s+1, a+1, max(s + a - d, 0)+1] += p
        end
    end
    R, Q
end

function simulate(pol, s0, steps, rng)  # follow an order policy (order per stock level) with sampled demand
    s = s0; stock = [s]; orders = Int[]; rewards = Float64[]
    cp = cumsum(prob)
    for t in 1:steps
        a = pol[s+1]; d = demand[findfirst(cp .>= rand(rng))]
        push!(orders, a); push!(rewards, price * min(s + a, d) - cost * a - hold * max(s + a - d, 0))
        s = max(s + a - d, 0); push!(stock, s)
    end
    (stock = stock, orders = orders, rewards = rewards)
end

R, Q = build(demand, prob)
ddp = DiscreteDP(R, Q, beta)  # discrete dynamic program
res = solve(ddp, PFI)  # policy iteration
V, policy = res.v, res.sigma .- 1  # value and optimal order per stock level
(value_at_empty_stock = round(V[1], digits=3), order_at_empty_stock = policy[1],
 order_up_to = unique(s + policy[s+1] for s in 0:nS-1 if policy[s+1] > 0), iterations = res.num_iter)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "value-function"
label = "Value Function"
desc = "Optimal value V*(s) across stock levels: the discounted profit of starting with s units"
code = '''
using Plots
plot(0:nS-1, V, xlabel="Stock level s", ylabel="V*(s)", title="Optimal value function", legend=false, lw=2)
'''

[[actionGroups.actions]]
id = "policy-map"
label = "Optimal Policy"
desc = "Optimal order at each stock level, with the stock after ordering, revealing the order-up-to structure"
code = '''
using Plots
bar(0:nS-1, policy, xlabel="Stock level s", ylabel="Units", label="optimal order", alpha=0.6)
plot!(0:nS-1, (0:nS-1) .+ policy, lw=2, label="stock after ordering", title="Optimal policy")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence"
label = "Convergence"
desc = "Bellman residual ||TV - V|| over value iteration sweeps against the geometric contraction bound gamma^k"
code = '''
using Plots
function vi_residuals(ddp; tol=1e-8, maxit=5000)
    v = zeros(nS); r = Float64[]
    for k in 1:maxit
        v2 = bellman_operator(ddp, v)
        push!(r, maximum(abs.(v2 .- v))); v = v2
        r[end] < tol && break
    end
    r
end
resid = vi_residuals(ddp)
plot(resid, yscale=:log10, xlabel="Sweep", ylabel="||TV - V||", label="residual", title="Value iteration convergence")
plot!(1:length(resid), resid[1] .* beta .^ (0:length(resid)-1), ls=:dash, label="gamma^k bound")
'''

[[actionGroups.actions]]
id = "policy-eval"
label = "Policy Evaluation"
desc = "Check V*(0) by Monte Carlo: discounted profit of 1000 simulated runs of the optimal policy from empty stock"
code = '''
using Statistics, Random
H = ceil(Int, log(1e-6) / log(beta))  # horizon after which discounting makes the rest negligible
rng = MersenneTwister(1)
G = [sum(beta^(t - 1) * r for (t, r) in enumerate(simulate(policy, 0, H, rng).rewards)) for _ in 1:1000]
(monte_carlo = round(mean(G), digits=3), std_error = round(std(G) / sqrt(length(G)), digits=3), dp_value = round(V[1], digits=3))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "policy-simulation"
label = "Policy Simulation"
desc = "Stock level and orders over T periods under the optimal policy, starting from empty stock"
code = '''
using Plots, Random
sim = simulate(policy, 0, T, MersenneTwister(1))
plot(0:T, sim.stock, marker=:o, label="stock level", xlabel="Period", ylabel="Units")
plot!(1:T, sim.orders, marker=:x, ls=:dash, label="order", title="Profit " * string(round(sum(sim.rewards), digits=1)))
'''

[[actionGroups.actions]]
id = "horizon-sensitivity"
label = "Horizon Sensitivity"
desc = "Finite-horizon value at empty stock by backward induction as the horizon grows, converging to the infinite-horizon V*(0)"
code = '''
using Plots
horizons = sort(unique([1, 2, 5, 10, 20, 50, 100, 200, T]))
v0 = [backward_induction(ddp, h)[1][1, 1] for h in horizons]  # value with h periods to go
plot(horizons, v0, marker=:o, xscale=:log10, xlabel="Horizon", ylabel="V(0)", label="finite horizon")
hline!([V[1]], ls=:dash, label="infinite horizon", title="Horizon sensitivity")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vi-vs-pi"
label = "Value vs Policy Iteration"
desc = "Iterations and run time of value iteration, policy iteration and modified policy iteration, and whether they agree on the policy"
code = '''
algorithms = [("value iteration", VFI), ("policy iteration", PFI), ("modified policy iteration", MPFI)]
[begin
    t = @elapsed r = solve(ddp, M)
    (method = name, iterations = r.num_iter, ms = round(1000t, digits=2), same_policy = r.sigma == res.sigma)
end for (name, M) in algorithms]
'''

[[actionGroups.actions]]
id = "grid-resolution"
label = "Scenario Resolution"
desc = "Value at empty stock as the demand distribution is resolved into more scenarios; N = 1 is the deterministic (mean demand) problem"
code = '''
using Plots
Ns = [1, 2, 3, 5, 10, 20, 50]
v0 = [begin
    d = n == 1 ? [5] : round.(Int, range(0, 10, length=n))
    R2, Q2 = build(d, fill(1 / n, n))
    solve(DiscreteDP(R2, Q2, beta), PFI).v[1]
end for n in Ns]
plot(Ns, v0, marker=:o, xscale=:log10, xlabel="Demand scenarios N", ylabel="V*(0)", legend=false, title="Cost of demand uncertainty")
'''

