[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables. The search space is an n-dimensional hypercube."
default = "2"

[[inputs]]
id = "obj"
label = "Objective Body"
tooltip = "Julia expression for f(x). The variable x is a Vector{Float64} of length n. Example: sum(x .^ 2)"
default = "sum(x .^ 4 .- 16 .* x .^ 2 .+ 5 .* x) / 2"

[[inputs]]
id = "lb"
label = "Lower Bound"
tooltip = "Uniform lower bound applied to all n variables."
default = "-5.0"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bound"
tooltip = "Uniform upper bound applied to all n variables."
default = "5.0"

[[inputs]]
id = "budget"
label = "Evaluations"
tooltip = "Maximum number of objective evaluations (maxiterations). BO is expensive: start with 30-100."
default = "50"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box):
# a GP posterior band on top, the acquisition function below

[miniCharts.ei]
# Acquisition peaks where the mean is low and uncertainty is moderate
svg = '''
function gp() {
	var m = '', up = '', lo = '';
	for (var i = 0; i <= 44; i++) {
		var x = 5 + i, mu = 36 + 8 * Math.sin(i / 7), sd = 2 + 5 * Math.abs(Math.sin(i / 9));
		m += (i ? ' L' : 'M') + x + ' ' + mu.toFixed(1);
		up += (i ? ' L' : 'M') + x + ' ' + (mu - sd).toFixed(1);
		lo = ' L' + x + ' ' + (mu + sd).toFixed(1) + lo;
	}
	return '<path d="' + up + lo + ' Z" fill="currentColor" opacity="0.15"/><path d="' + m + '" fill="none" stroke="currentColor" stroke-width="1.3"/>';
}
var a = '';
for (var i = 0; i <= 44; i++) { var z = (i - 33) / 4; a += (i ? ' L' : 'M') + (5 + i) + ' ' + (70 - 12 * Math.exp(-z * z / 2)).toFixed(1); }
return gp() + '<line x1="4" y1="70" x2="50" y2="70" stroke="currentColor" stroke-width="1" opacity="0.5"/><path d="' + a + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
'''

[miniCharts.pi]
# A sharp acquisition spike next to the incumbent
svg = '''
var m = '', up = '', lo = '';
for (var i = 0; i <= 44; i++) {
	var x = 5 + i, mu = 36 + 8 * Math.sin(i / 7), sd = 2 + 5 * Math.abs(Math.sin(i / 9));
	m += (i ? ' L' : 'M') + x + ' ' + mu.toFixed(1);
	up += (i ? ' L' : 'M') + x + ' ' + (mu - sd).toFixed(1);
	lo = ' L' + x + ' ' + (mu + sd).toFixed(1) + lo;
}
var a = '';
for (var j = 0; j <= 44; j++) { var z = (j - 33) / 1.8; a += (j ? ' L' : 'M') + (5 + j) + ' ' + (70 - 14 * Math.exp(-z * z / 2)).toFixed(1); }
return '<path d="' + up + lo + ' Z" fill="currentColor" opacity="0.15"/><path d="' + m + '" fill="none" stroke="currentColor" stroke-width="1.3"/>'
	+ '<line x1="4" y1="70" x2="50" y2="70" stroke="currentColor" stroke-width="1" opacity="0.5"/><path d="' + a + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
