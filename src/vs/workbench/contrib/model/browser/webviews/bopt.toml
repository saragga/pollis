desc = "Inspect fitted kernel length scales and noise"
code = '''
using BayesianOptimization, GaussianProcesses

function obj(x::Vector{Float64})
    {{obj}}  # objective function body
end

n  = {{n}}  # problem dimension
lb = {{lb}}  # lower bound
ub = {{ub}}  # upper bound

gp  = ElasticGPE(n, mean = MeanConst(0.0),
         kernel = SEArd(zeros(n), 1.0), logNoise = -2.0)  # Gaussian process surrogate
mopt = MAPGPOptimizer(every = 10, noisebounds = [-4, 3], kernbounds = [[fill(-1.0, n); 0.0], [fill(4.0, n); 10.0]], maxeval = 40)  # refit the GP hyperparameters (MAP) every 10 evaluations

{{?model=ei}}acq = ExpectedImprovement()  # expected improvement: balances exploration and exploitation
{{?model=pi}}acq = ProbabilityOfImprovement()  # probability of improvement: exploitation-heavy, greedy toward current best
{{?model=ucb}}acq = UpperConfidenceBound(NoBetaScaling(), 2.0)  # upper confidence bound: exploration via GP uncertainty (beta = 2.0)
{{?model=ts}}acq = ThompsonSamplingSimple()  # simple Thompson sampling: an independent posterior draw at each candidate point
opt = BOpt(
    obj, gp, acq,
    mopt,
    fill(lb, n), fill(ub, n), maxiterations = {{budget}}, sense = Min)  # BO configuration

result = boptimize!(opt)  # run BO

println("=== GP Kernel Hyperparameters ===")  # 
kp = GaussianProcesses.get_params(opt.model.kernel)  # log length scales, then the log signal std
println("Log length scales: ", kp[1:n])  # one value per dimension
println("Length scales:     ", exp.(kp[1:n]))  # exponentiated for interpretability
println("Log noise:         ", opt.model.logNoise.value)  # measurement noise (log scale)
println("Noise std:         ", exp(opt.model.logNoise.value))  # logNoise is the log of the noise standard deviation
println("Observed minimum:  ", result.observed_optimum)  # best objective found
'''

[[actionGroups.actions]]
id = "vs-random"
label = "Sample Efficiency"
desc = "Compare BO and random search over same budget"
code = '''
using BayesianOptimization, GaussianProcesses, Random, Statistics

function obj(x::Vector{Float64})
    {{obj}}  # objective function body
end

n  = {{n}}; lb = {{lb}}; ub = {{ub}}  # dimension and bounds

seeds = 1:10  # both methods are random: compare them over 10 seeds, not one run
best_rand = map(seeds) do s
    Random.seed!(s)
    minimum(obj(lb .+ rand(n) .* (ub - lb)) for _ in 1:{{budget}})  # random search: uniform samples
end

best_bo = map(seeds) do s
    Random.seed!(s)
    gp  = ElasticGPE(n, mean = MeanConst(0.0),
             kernel = SEArd(zeros(n), 1.0), logNoise = -2.0)  # GP surrogate
    mopt = MAPGPOptimizer(every = 10, noisebounds = [-4, 3], kernbounds = [[fill(-1.0, n); 0.0], [fill(4.0, n); 10.0]], maxeval = 40)  # refit the GP hyperparameters (MAP) every 10 evaluations
{{?model=ei}}    acq = ExpectedImprovement()  # expected improvement: balances exploration and exploitation
{{?model=pi}}    acq = ProbabilityOfImprovement()  # probability of improvement: exploitation-heavy, greedy toward current best
{{?model=ucb}}    acq = UpperConfidenceBound(NoBetaScaling(), 2.0)  # upper confidence bound: exploration via GP uncertainty (beta = 2.0)
{{?model=ts}}    acq = ThompsonSamplingSimple()  # simple Thompson sampling: an independent posterior draw at each candidate point
    opt = BOpt(
        obj, gp, acq, mopt,
        fill(lb, n), fill(ub, n), maxiterations = {{budget}}, sense = Min, verbosity = Silent)  # BO configuration
    boptimize!(opt).observed_optimum  # run BO
end

println("Random search best, median of 10 seeds: ", median(best_rand), "  (range ", extrema(best_rand), ")")  # random baseline
println("BO best, median of 10 seeds:            ", median(best_bo), "  (range ", extrema(best_bo), ")")  # Bayesian optimisation result
println("BO better in ", count(best_bo .< best_rand), " of 10 seeds")  # paired comparison: same seed for both
'''

