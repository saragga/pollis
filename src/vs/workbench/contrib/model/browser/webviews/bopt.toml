[[actionGroups.actions]]
id = "vs-random"
label = "Sample Efficiency"
desc = "Compare BO and random search over same budget"
code = '''
using BayesianOptimization, GaussianProcesses

function obj(x::Vector{Float64})
    {{obj}}  # objective function body
end

n  = {{n}}; lb = {{lb}}; ub = {{ub}}  # dimension and bounds

# Random search baseline  # 
best_rand = minimum(obj(lb .+ rand(n) .* (ub - lb)) for _ in 1:{{budget}})  # uniform random samples

# Bayesian optimisation  # 
gp  = ElasticGPE(n, mean = MeanConst(0.0),
         kernel = SEArd(zeros(n), 1.0), logNoise = -2.0)  # GP surrogate
{{?model=ei}}acq = ExpectedImprovement()  # expected improvement: balances exploration and exploitation
{{?model=pi}}acq = ProbabilityOfImprovement()  # probability of improvement: exploitation-heavy, greedy toward current best
{{?model=ucb}}acq = UpperConfidenceBound(beta = 2.0)  # upper confidence bound: exploration via GP uncertainty (beta = 2.0)
{{?model=ts}}acq = ThompsonSamplingSimple(nsamples = 100)  # Thompson sampling: optimises a random draw from the GP posterior
opt = BOpt(
    obj, gp, acq, OptimizeElasticGP(),
    RandomSearchAcquisitionOptimizer(500),
    fill(lb, n), fill(ub, n), maxiterations = {{budget}}, sense = Min)  # BO configuration
best_bo = boptimize!(opt).observed_optimum  # run BO

println("Random search best: ", best_rand)  # random baseline
println("BO best:            ", best_bo)  # Bayesian optimisation result
'''

