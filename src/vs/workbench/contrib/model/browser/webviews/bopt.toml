using BayesianOptimization, GaussianProcesses, LinearAlgebra

function obj(x::Vector{Float64})
    {{obj}}  # objective function body
end

n  = {{n}}; lb = {{lb}}; ub = {{ub}}  # dimension and bounds

gp  = ElasticGPE(n, mean = MeanConst(0.0),
         kernel = SEArd(zeros(n), 1.0), logNoise = -2.0)  # Gaussian process surrogate
mopt = MAPGPOptimizer(every = 10, noisebounds = [-4, 3], kernbounds = [[fill(-1.0, n); 0.0], [fill(4.0, n); 10.0]], maxeval = 40)  # refit the GP hyperparameters (MAP) every 10 evaluations
{{?model=ei}}acq = ExpectedImprovement()  # expected improvement: balances exploration and exploitation
{{?model=pi}}acq = ProbabilityOfImprovement()  # probability of improvement: exploitation-heavy, greedy toward current best
{{?model=ucb}}acq = UpperConfidenceBound(NoBetaScaling(), 2.0)  # upper confidence bound: exploration via GP uncertainty (beta = 2.0)
{{?model=ts}}acq = ThompsonSamplingSimple()  # simple Thompson sampling: an independent posterior draw at each candidate point
opt = BOpt(
    obj, gp, acq, mopt,
    fill(lb, n), fill(ub, n), maxiterations = {{budget}}, sense = Min)  # BO configuration
result = boptimize!(opt)  # run BO

# Where would each acquisition sample next, given the same fitted GP?
C = lb .+ rand(n, 2000) .* (ub - lb)  # random candidate points, one per column
mu, s2 = predict_f(opt.model, C)  # posterior of -f at the candidates (the GP models -f when sense = Min)
for (name, a) in [("EI", ExpectedImprovement()), ("PI", ProbabilityOfImprovement()),
                  ("UCB", UpperConfidenceBound(NoBetaScaling(), 2.0)), ("TS", ThompsonSamplingSimple())]
    BayesianOptimization.setparams!(a, opt.model)  # EI and PI: set the incumbent
    k = argmax(vec(BayesianOptimization.acquisitionfunction(a, opt.model)(C)))  # best candidate for this acquisition
    println(rpad(name, 4), "next x = ", round.(C[:, k]; digits = 2),
            "  posterior sd = ", round(sqrt(s2[k]); sigdigits = 3),
            "  distance to incumbent = ", round(norm(C[:, k] .- result.observed_optimizer); digits = 2))
end
println("Large sd or distance: the acquisition explores. Small: it exploits near the incumbent (PI most of all)")
'''

