[miniCharts.ts]
# Random posterior draws; each proposes its own minimum
svg = '''
var s = '';
var ph = [0, 1.7, 3.4];
for (var k = 0; k < ph.length; k++) {
	var p = '';
	for (var i = 0; i <= 44; i++) {
		var mu = 44 + 8 * Math.sin(i / 7) + 4 * Math.sin(i / 3 + ph[k]);
		p += (i ? ' L' : 'M') + (5 + i) + ' ' + mu.toFixed(1);
	}
	s += '<path d="' + p + '" fill="none" stroke="currentColor" stroke-width="1.1" opacity="' + (0.35 + k * 0.3) + '"/>';
}
return s + '<line x1="4" y1="70" x2="50" y2="70" stroke="currentColor" stroke-width="1" opacity="0.5"/>';
'''

[[codeBranches]]
model = "*"
code = '''
using BayesianOptimization, GaussianProcesses

function obj(x::Vector{Float64})
    {{obj}}  # objective function body
end

# The default objective is Styblinski-Tang: 2^n local minima, global minimum -39.17 n at x_i = -2.9035.
# BO pays off when each evaluation is expensive, so the budget counts evaluations, not seconds
n  = {{n}}  # problem dimension
lb = {{lb}}  # lower bound (uniform across variables)
ub = {{ub}}  # upper bound (uniform across variables)

gp  = ElasticGPE(n, mean = MeanConst(0.0),
         kernel = SEArd(zeros(n), 1.0), logNoise = -2.0)  # Gaussian process surrogate
mopt = MAPGPOptimizer(every = 10, noisebounds = [-4, 3], kernbounds = [[fill(-1.0, n); 0.0], [fill(4.0, n); 10.0]], maxeval = 40)  # refit the GP hyperparameters (MAP) every 10 evaluations

{{?model=ei}}acq = ExpectedImprovement()  # expected improvement: balances exploration and exploitation
{{?model=pi}}acq = ProbabilityOfImprovement()  # probability of improvement: exploitation-heavy, greedy toward current best
{{?model=ucb}}acq = UpperConfidenceBound(NoBetaScaling(), 2.0)  # upper confidence bound: exploration via GP uncertainty (beta = 2.0)
{{?model=ts}}acq = ThompsonSamplingSimple()  # simple Thompson sampling: an independent posterior draw at each candidate point
opt = BOpt(
    obj, gp, acq,
    mopt,
    fill(lb, n), fill(ub, n), maxiterations = {{budget}}, sense = Min)  # BO configuration

result = boptimize!(opt)  # run Bayesian optimisation loop

println("Observed minimum:   ", result.observed_optimum)  # best objective found
println("Observed minimizer: ", result.observed_optimizer)  # best point found
'''

