[[actionGroups.actions]]
id = "gp-posterior"
label = "GP Posterior"
desc = "GP mean and uncertainty over 1D grid, set n = 1"
code = '''
using BayesianOptimization, GaussianProcesses, Plots

# Set n = 1 for 1D posterior visualization  # 
function obj(x::Vector{Float64})
    {{obj}}  # objective function body
end

n  = 1; lb = {{lb}}; ub = {{ub}}  # use n = 1 for 1D visualization

xs_log = Vector{Float64}[]  # log evaluated points
ys_log = Float64[]  # log observed values
function obj_tracked(x::Vector{Float64})
    v = obj(x)
    push!(xs_log, copy(x))  # store evaluated point
    push!(ys_log, v); v
end

gp  = ElasticGPE(n, mean = MeanConst(0.0),
         kernel = SEArd(zeros(n), 1.0), logNoise = -2.0)  # GP surrogate
opt = BOpt(
{{?model=ei}}    obj_tracked, gp, ExpectedImprovement(),
{{?model=pi}}    obj_tracked, gp, ProbabilityOfImprovement(),
{{?model=ucb}}    obj_tracked, gp, UpperConfidenceBound(beta = 2.0),
{{?model=ts}}    obj_tracked, gp, ThompsonSamplingSimple(nsamples = 100),
    OptimizeElasticGP(),
    RandomSearchAcquisitionOptimizer(500),
    fill(lb, 1), fill(ub, 1), maxiterations = {{budget}}, sense = Min)  # BO configuration
boptimize!(opt)

grid = range(lb, ub, length = 300)  # 1D evaluation grid
X_grid = reshape(collect(grid), 1, :)  # 1 x 300 matrix for predict_y
mu, s2 = predict_y(opt.model, X_grid)  # GP posterior mean and variance

plot(grid, mu, ribbon = 2 .* sqrt.(s2),
       xlabel = "x", ylabel = "f(x)",
       title = "GP Posterior (n = 1)", label = "mean +/- 2 std")  # GP mean and uncertainty band
scatter!([x[1] for x in xs_log], ys_log,
           label = "Observations", ms = 5)  # overlay evaluated points
'''

