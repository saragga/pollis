# Bayesian Optimisation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/bopt.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Bayesian Optimisation"
viewType = "pollis.bopt"
defaultModel = "ei"

[[packages]]
name = "BayesianOptimization.jl"
github = "https://github.com/jbrea/BayesianOptimization.jl"

[[packages]]
name = "GaussianProcesses.jl"
github = "https://github.com/STOR-i/GaussianProcesses.jl"

