[[decisionRows]]
task = "Expected Improvement"
context = "General-purpose black-box optimisation"
purpose = "Balanced exploration and exploitation"

[[decisionRows]]
task = "Probability of Improvement"
context = "Refining near a known good region"
purpose = "Fast, greedy convergence"

[[decisionRows]]
task = "Upper Confidence Bound"
context = "Rugged objectives, explicit exploration control"
