    println("    balances exploration and exploitation without tuning")  # 
    println("    works well with < 100 evaluations")  # 
elseif acq_name == "ProbabilityOfImprovement"
    println("PI: greedy toward current best; exploitation-heavy")  # 
    println("    may stall if initial observations are noisy")  # 
    println("    prefer EI unless you know the region of interest")  # 
elseif acq_name == "UpperConfidenceBound"
    println("UCB: explicit exploration via beta parameter")  # 
    println("    beta > 1  -> more exploration; beta < 1 -> exploitation")  # 
    println("    good when you want to tune the trade-off manually")  # 
else
    println("TS: samples random GP posterior function and optimises it")  # 
    println("    naturally diverse; suited for parallel batch queries")  # 
    println("    slower per iteration due to posterior sampling")  # 
end
