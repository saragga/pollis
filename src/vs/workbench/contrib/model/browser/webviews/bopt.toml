[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables. The search space is an n-dimensional hypercube."
default = "2"

[[inputs]]
id = "obj"
label = "Objective Body"
tooltip = "Julia expression for f(x). The variable x is a Vector{Float64} of length n. Example: sum(x .^ 2)"
default = "sum(x .^ 2)"

[[inputs]]
id = "lb"
label = "Lower Bound"
tooltip = "Uniform lower bound applied to all n variables."
default = "-5.0"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bound"
tooltip = "Uniform upper bound applied to all n variables."
default = "5.0"

[[inputs]]
id = "budget"
label = "Evaluations"
tooltip = "Maximum number of objective evaluations (maxiterations). BO is expensive: start with 30-100."
default = "50"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box):
# a GP posterior band on top, the acquisition function below

[miniCharts.ei]
# Acquisition peaks where the mean is low and uncertainty is moderate
svg = '''
function gp() {
	var m = '', up = '', lo = '';
	for (var i = 0; i <= 44; i++) {
		var x = 5 + i, mu = 36 + 8 * Math.sin(i / 7), sd = 2 + 5 * Math.abs(Math.sin(i / 9));
		m += (i ? ' L' : 'M') + x + ' ' + mu.toFixed(1);
		up += (i ? ' L' : 'M') + x + ' ' + (mu - sd).toFixed(1);
		lo = ' L' + x + ' ' + (mu + sd).toFixed(1) + lo;
	}
	return '<path d="' + up + lo + ' Z" fill="currentColor" opacity="0.15"/><path d="' + m + '" fill="none" stroke="currentColor" stroke-width="1.3"/>';
}
var a = '';
for (var i = 0; i <= 44; i++) { var z = (i - 33) / 4; a += (i ? ' L' : 'M') + (5 + i) + ' ' + (70 - 12 * Math.exp(-z * z / 2)).toFixed(1); }
return gp() + '<line x1="4" y1="70" x2="50" y2="70" stroke="currentColor" stroke-width="1" opacity="0.5"/><path d="' + a + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
'''

[miniCharts.pi]
# A sharp acquisition spike next to the incumbent
svg = '''
var m = '', up = '', lo = '';
for (var i = 0; i <= 44; i++) {
	var x = 5 + i, mu = 36 + 8 * Math.sin(i / 7), sd = 2 + 5 * Math.abs(Math.sin(i / 9));
	m += (i ? ' L' : 'M') + x + ' ' + mu.toFixed(1);
	up += (i ? ' L' : 'M') + x + ' ' + (mu - sd).toFixed(1);
	lo = ' L' + x + ' ' + (mu + sd).toFixed(1) + lo;
}
var a = '';
for (var j = 0; j <= 44; j++) { var z = (j - 33) / 1.8; a += (j ? ' L' : 'M') + (5 + j) + ' ' + (70 - 14 * Math.exp(-z * z / 2)).toFixed(1); }
return '<path d="' + up + lo + ' Z" fill="currentColor" opacity="0.15"/><path d="' + m + '" fill="none" stroke="currentColor" stroke-width="1.3"/>'
	+ '<line x1="4" y1="70" x2="50" y2="70" stroke="currentColor" stroke-width="1" opacity="0.5"/><path d="' + a + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
'''

[miniCharts.ucb]
# The lower confidence envelope drives the choice
svg = '''
var m = '', up = '', lo = '', env = '';
for (var i = 0; i <= 44; i++) {
	var x = 5 + i, mu = 36 + 8 * Math.sin(i / 7), sd = 2 + 5 * Math.abs(Math.sin(i / 9));
	m += (i ? ' L' : 'M') + x + ' ' + mu.toFixed(1);
	up += (i ? ' L' : 'M') + x + ' ' + (mu - sd).toFixed(1);
	lo = ' L' + x + ' ' + (mu + sd).toFixed(1) + lo;
	env += (i ? ' L' : 'M') + x + ' ' + (70 - 1.2 * sd).toFixed(1);
}
return '<path d="' + up + lo + ' Z" fill="currentColor" opacity="0.15"/><path d="' + m + '" fill="none" stroke="currentColor" stroke-width="1.3"/>'
	+ '<line x1="4" y1="70" x2="50" y2="70" stroke="currentColor" stroke-width="1" opacity="0.5"/><path d="' + env + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
'''

[miniCharts.ts]
# Random posterior draws; each proposes its own minimum
svg = '''
var s = '';
var ph = [0, 1.7, 3.4];
for (var k = 0; k < ph.length; k++) {
	var p = '';
	for (var i = 0; i <= 44; i++) {
		var mu = 44 + 8 * Math.sin(i / 7) + 4 * Math.sin(i / 3 + ph[k]);
		p += (i ? ' L' : 'M') + (5 + i) + ' ' + mu.toFixed(1);
	}
	s += '<path d="' + p + '" fill="none" stroke="currentColor" stroke-width="1.1" opacity="' + (0.35 + k * 0.3) + '"/>';
}
return s + '<line x1="4" y1="70" x2="50" y2="70" stroke="currentColor" stroke-width="1" opacity="0.5"/>';
'''

[[codeBranches]]
model = "*"
code = '''
using BayesianOptimization, GaussianProcesses

function obj(x::Vector{Float64})
    {{obj}}  # objective function body
end

n  = {{n}}  # problem dimension
lb = {{lb}}  # lower bound (uniform across variables)
ub = {{ub}}  # upper bound (uniform across variables)

gp  = ElasticGPE(n, mean = MeanConst(0.0),
         kernel = SEArd(zeros(n), 1.0), logNoise = -2.0)  # Gaussian process surrogate

{{?model=ei}}acq = ExpectedImprovement()  # expected improvement: balances exploration and exploitation
{{?model=pi}}acq = ProbabilityOfImprovement()  # probability of improvement: exploitation-heavy, greedy toward current best
{{?model=ucb}}acq = UpperConfidenceBound(beta = 2.0)  # upper confidence bound: exploration via GP uncertainty (beta = 2.0)
{{?model=ts}}acq = ThompsonSamplingSimple(nsamples = 100)  # Thompson sampling: optimises a random draw from the GP posterior
opt = BOpt(
    obj, gp, acq,
    OptimizeElasticGP(),
    RandomSearchAcquisitionOptimizer(500),
    fill(lb, n), fill(ub, n), maxiterations = {{budget}}, sense = Min)  # BO configuration

result = boptimize!(opt)  # run Bayesian optimisation loop

println("Observed minimum:   ", result.observed_optimum)  # best objective found
println("Observed minimizer: ", result.observed_optimizer)  # best point found
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "convergence"
label = "Convergence Trace"
desc = "Plot best observed value per evaluation"
code = '''
using BayesianOptimization, GaussianProcesses, Plots

function obj(x::Vector{Float64})
    {{obj}}  # objective function body
end

n  = {{n}}; lb = {{lb}}; ub = {{ub}}  # dimension and bounds

ys_log = Float64[]  # log of all observed values
function obj_tracked(x::Vector{Float64})
    v = obj(x)
    push!(ys_log, v)
    v  # return value to BO
end

gp  = ElasticGPE(n, mean = MeanConst(0.0),
         kernel = SEArd(zeros(n), 1.0), logNoise = -2.0)  # GP surrogate
opt = BOpt(
{{?model=ei}}    obj_tracked, gp, ExpectedImprovement(),
{{?model=pi}}    obj_tracked, gp, ProbabilityOfImprovement(),
{{?model=ucb}}    obj_tracked, gp, UpperConfidenceBound(beta = 2.0),
{{?model=ts}}    obj_tracked, gp, ThompsonSamplingSimple(nsamples = 100),
    OptimizeElasticGP(),
    RandomSearchAcquisitionOptimizer(500),
    fill(lb, n), fill(ub, n), maxiterations = {{budget}}, sense = Min)  # BO configuration
boptimize!(opt)

best_trace = accumulate(min, ys_log)  # best observed value so far
plot(best_trace,
       xlabel = "Evaluation", ylabel = "Best f(x)",
       title = "BO Convergence Trace", legend = false)  # plot convergence
'''

