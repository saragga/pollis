Random.seed!({{seed}})
println("tolerance   L   tol^2 x cost (multilevel)   tol^2 x cost (single level)")
for tol in {{reltol}} * abs(exact) .* [8, 4, 2, 1]
    hm = ml_run(tol)
    Lf = finest(hm)
    println(rpad(round(tol; sigdigits = 3), 12), rpad(Lf, 4), rpad(round(tol^2 * total_cost(hm); sigdigits = 3), 28), round(tol^2 * sl_cost_at(Lf, tol); sigdigits = 3))
end
println(theory.beta > theory.gamma ? "Theory (beta > gamma): the multilevel column stays roughly constant." :
