id = "mlqmc"
label = "MLQMC"


[[bullets]]
text = "MLMC"
detail = "telescoping sum over levels: many cheap coarse samples plus a few expensive fine corrections, each correction computed from the same random input on two levels"

[[bullets]]
text = "MLQMC"
detail = "replaces the random samples on each level with randomly shifted rank-1 lattice points; for smooth problems the error per level falls faster than N^(-1/2)"

[[bullets]]
text = "Test problems"
detail = "a random integral (midpoint rule) and a GBM call option (Euler-Maruyama), both with exact answers so the achieved error can be checked"

[[decisionRows]]
task = "MLMC"
context = "Level hierarchy, random inputs"
purpose = "Cheaper than plain Monte Carlo at the same RMSE whenever the variance of the level corrections decays"

[[decisionRows]]
task = "MLQMC"
context = "Smooth integrand, moderate dimension"
purpose = "Fewer points per level than MLMC when lattice rules beat random sampling"

[[inputs]]
id = "problem"
label = "Problem"
tooltip = "Random integral: Q = integral of exp(X t) over [0, 1] with X ~ N(0, 1), level l uses the midpoint rule with 2^l points (exact mean 1.194958). GBM call: discounted European call payoff, level l uses Euler-Maruyama with 2^l time steps (exact mean = Black-Scholes price)."
kind = "select"
default = "integral"

[[inputs.options]]
value = "integral"
label = "Random Integral"

[[inputs.options]]
value = "gbm"
label = "GBM Call Option"

[[inputs]]
id = "s0"
label = "Spot (S0)"
tooltip = "Initial asset price."
default = "100.0"
when = "problem=gbm"

[[inputs]]
id = "strike"
label = "Strike (K)"
tooltip = "Strike price of the European call."
default = "100.0"
when = "problem=gbm"

[[inputs]]
id = "rate"
label = "Rate (r)"
tooltip = "Continuously compounded risk-free rate."
default = "0.05"
when = "problem=gbm"

[[inputs]]
id = "vol"
label = "Volatility"
tooltip = "Annualised volatility of the asset."
default = "0.2"
when = "problem=gbm"

[[inputs]]
id = "maturity"
label = "Maturity (T)"
tooltip = "Time to maturity in years."
default = "1.0"
when = "problem=gbm"

[[inputs]]
id = "reltol"
label = "Relative Tolerance"
tooltip = "Target RMSE as a fraction of the exact answer. The estimator adds levels and samples until its estimated RMSE (variance plus squared bias) is below this tolerance."
default = "0.005"

[[inputs]]
id = "maxlevel"
label = "Max Level"
tooltip = "Finest level the estimator may add. Level l uses 2^l grid points or time steps. If the estimator stops here, the bias may exceed the tolerance."
default = "10"

[[inputs]]
id = "nshifts"
label = "n Shifts"
tooltip = "Number of independent random shifts of the lattice rule. The spread across shifts gives the error estimate; 10 to 30 is the package's recommendation."
default = "10"
models = ["mlqmc"]

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Seed for the global random number generator, which MultilevelEstimators.jl uses for samples and lattice shifts."
default = "1"

[[codeBranches]]
model = "mlmc"
code = '''
using MultilevelEstimators, SpecialFunctions, Random

Random.seed!({{seed}})  # MultilevelEstimators draws from the global random number generator

{{?problem=integral}}# Q = integral of exp(X t) over [0, 1] with X ~ N(0, 1); level l uses the midpoint rule with 2^l points
{{?problem=integral}}exact = sqrt(pi / 2) * erfi(1 / sqrt(2))  # E[Q] = integral of exp(t^2 / 2) over [0, 1] = 1.194958...
{{?problem=integral}}midpoint(x, n) = sum(exp(x * (k - 0.5) / n) for k in 1:n) / n
{{?problem=integral}}function sample_fn(level::Level, x::Vector{<:Real})
{{?problem=integral}}    n  = 2^level[1]
{{?problem=integral}}    Qf = midpoint(x[1], n)  # fine approximation Q_l
{{?problem=integral}}    level == Level(0) && return Qf, Qf
{{?problem=integral}}    Qf - midpoint(x[1], div(n, 2)), Qf  # (Q_l - Q_(l-1), Q_l) from the same random input
{{?problem=integral}}end
{{?problem=integral}}distributions = [Normal()]

{{?problem=gbm}}S0, K, r, vol, T = {{s0}}, {{strike}}, {{rate}}, {{vol}}, {{maturity}}
{{?problem=gbm}}# Q = discounted European call payoff; level l uses Euler-Maruyama with 2^l time steps
{{?problem=gbm}}Phi(z) = erfc(-z / sqrt(2)) / 2  # standard normal cdf
{{?problem=gbm}}d1 = (log(S0 / K) + (r + vol^2 / 2) * T) / (vol * sqrt(T))
{{?problem=gbm}}exact = S0 * Phi(d1) - K * exp(-r * T) * Phi(d1 - vol * sqrt(T))  # Black-Scholes price
{{?problem=gbm}}function euler_call(dW, h)
{{?problem=gbm}}    S = S0
{{?problem=gbm}}    for w in dW
{{?problem=gbm}}        S += r * S * h + vol * S * w
{{?problem=gbm}}    end
{{?problem=gbm}}    exp(-r * T) * max(S - K, 0.0)
{{?problem=gbm}}end
{{?problem=gbm}}function sample_fn(level::Level, x::Vector{<:Real})
{{?problem=gbm}}    n  = 2^level[1]
{{?problem=gbm}}    h  = T / n
{{?problem=gbm}}    dW = sqrt(h) .* x[1:n]  # Brownian increments on the fine grid
{{?problem=gbm}}    Pf = euler_call(dW, h)  # fine payoff Q_l
{{?problem=gbm}}    level == Level(0) && return Pf, Pf
{{?problem=gbm}}    dWc = dW[1:2:end] .+ dW[2:2:end]  # the same Brownian path on the coarse grid
{{?problem=gbm}}    Pf - euler_call(dWc, 2h), Pf  # (Q_l - Q_(l-1), Q_l)
{{?problem=gbm}}end
{{?problem=gbm}}distributions = [Normal() for _ in 1:2^{{maxlevel}}]

cost(level) = 2.0^level[1]  # cost model: grid points or time steps of one fine sample
method = MC()  # independent random samples on each level
estimator = Estimator(ML(), method, sample_fn, distributions;
    max_index_set_param = {{maxlevel}},  # finest level allowed
{{?problem=gbm}}    nb_of_uncertainties = level -> 2^level[1],  # level l uses 2^l normals
    cost_model = cost,
    save = false,  # no .jld2 history files in the working directory
    verbose = false)
h = run(estimator, {{reltol}} * abs(exact))  # stops when the estimated RMSE is below the tolerance

L     = maximum(l[1] for l in h[:current_index_set])  # finest level used
evals = h[:nb_of_samples][1:L+1]  # samples per level
work  = sum(evals[l+1] * cost(Level(l)) for l in 0:L)
println("Estimate:    ", round(h[:mean]; sigdigits = 7), "   exact ", round(exact; sigdigits = 7))
println("Error:       ", round(abs(h[:mean] - exact); sigdigits = 3), "   estimated RMSE ", round(h[:rmse]; sigdigits = 3), "   tolerance ", round(h[:tol]; sigdigits = 3))
println("Levels:      0 to ", L, L == {{maxlevel}} ? "   (stopped at Max Level: the bias may exceed the tolerance)" : "")
println("Samples:     ", evals)
println("Total cost:  ", round(Int, work), " fine-grid units")
'''

[[codeBranches]]
model = "mlqmc"
code = '''
using MultilevelEstimators, SpecialFunctions, Random

Random.seed!({{seed}})  # MultilevelEstimators draws from the global random number generator

{{?problem=integral}}# Q = integral of exp(X t) over [0, 1] with X ~ N(0, 1); level l uses the midpoint rule with 2^l points
{{?problem=integral}}exact = sqrt(pi / 2) * erfi(1 / sqrt(2))  # E[Q] = integral of exp(t^2 / 2) over [0, 1] = 1.194958...
{{?problem=integral}}midpoint(x, n) = sum(exp(x * (k - 0.5) / n) for k in 1:n) / n
{{?problem=integral}}function sample_fn(level::Level, x::Vector{<:Real})
{{?problem=integral}}    n  = 2^level[1]
{{?problem=integral}}    Qf = midpoint(x[1], n)  # fine approximation Q_l
{{?problem=integral}}    level == Level(0) && return Qf, Qf
{{?problem=integral}}    Qf - midpoint(x[1], div(n, 2)), Qf  # (Q_l - Q_(l-1), Q_l) from the same random input
{{?problem=integral}}end
{{?problem=integral}}distributions = [Normal()]

{{?problem=gbm}}S0, K, r, vol, T = {{s0}}, {{strike}}, {{rate}}, {{vol}}, {{maturity}}
{{?problem=gbm}}# Q = discounted European call payoff; level l uses Euler-Maruyama with 2^l time steps
{{?problem=gbm}}Phi(z) = erfc(-z / sqrt(2)) / 2  # standard normal cdf
{{?problem=gbm}}d1 = (log(S0 / K) + (r + vol^2 / 2) * T) / (vol * sqrt(T))
{{?problem=gbm}}exact = S0 * Phi(d1) - K * exp(-r * T) * Phi(d1 - vol * sqrt(T))  # Black-Scholes price
{{?problem=gbm}}function euler_call(dW, h)
{{?problem=gbm}}    S = S0
{{?problem=gbm}}    for w in dW
{{?problem=gbm}}        S += r * S * h + vol * S * w
{{?problem=gbm}}    end
{{?problem=gbm}}    exp(-r * T) * max(S - K, 0.0)
{{?problem=gbm}}end
{{?problem=gbm}}function sample_fn(level::Level, x::Vector{<:Real})
{{?problem=gbm}}    n  = 2^level[1]
{{?problem=gbm}}    h  = T / n
{{?problem=gbm}}    dW = sqrt(h) .* x[1:n]  # Brownian increments on the fine grid
{{?problem=gbm}}    Pf = euler_call(dW, h)  # fine payoff Q_l
{{?problem=gbm}}    level == Level(0) && return Pf, Pf
{{?problem=gbm}}    dWc = dW[1:2:end] .+ dW[2:2:end]  # the same Brownian path on the coarse grid
{{?problem=gbm}}    Pf - euler_call(dWc, 2h), Pf  # (Q_l - Q_(l-1), Q_l)
{{?problem=gbm}}end
{{?problem=gbm}}distributions = [Normal() for _ in 1:2^{{maxlevel}}]

cost(level) = 2.0^level[1]  # cost model: grid points or time steps of one fine sample
method = QMC()  # randomly shifted rank-1 lattice rule on each level
estimator = Estimator(ML(), method, sample_fn, distributions;
    max_index_set_param = {{maxlevel}},  # finest level allowed
{{?problem=gbm}}    nb_of_uncertainties = level -> 2^level[1],  # level l uses 2^l normals
    nb_of_shifts = level -> {{nshifts}},  # independent random shifts
    cost_model = cost,
    save = false,  # no .jld2 history files in the working directory
    verbose = false)
h = run(estimator, {{reltol}} * abs(exact))  # stops when the estimated RMSE is below the tolerance

L     = maximum(l[1] for l in h[:current_index_set])  # finest level used
evals = h[:nb_of_samples][1:L+1]  # samples per level
evals = evals .* {{nshifts}}  # QMC counts points per shift
work  = sum(evals[l+1] * cost(Level(l)) for l in 0:L)
println("Estimate:    ", round(h[:mean]; sigdigits = 7), "   exact ", round(exact; sigdigits = 7))
println("Error:       ", round(abs(h[:mean] - exact); sigdigits = 3), "   estimated RMSE ", round(h[:rmse]; sigdigits = 3), "   tolerance ", round(h[:tol]; sigdigits = 3))
println("Levels:      0 to ", L, L == {{maxlevel}} ? "   (stopped at Max Level: the bias may exceed the tolerance)" : "")
println("Samples:     ", evals)
println("Total cost:  ", round(Int, work), " fine-grid units")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "level-contributions"
label = "Level Decay Plot"
desc = "Plot log2 of Var[Q_l], Var[Q_l - Q_(l-1)] and |E[Q_l - Q_(l-1)]| against level: the corrections must shrink for MLMC to pay off"
code = '''
using Plots

ls = 0:L
plot(ls, log2.([h[:V][Level(l)] for l in ls]); marker = :circle, label = "Var[Q_l]", xlabel = "Level l", ylabel = "log2")
plot!(1:L, log2.([h[:dV][Level(l)] for l in 1:L]); marker = :square, label = "Var[Q_l - Q_(l-1)]")
plot!(1:L, log2.(abs.([h[:dE][Level(l)] for l in 1:L])); marker = :diamond, label = "|E[Q_l - Q_(l-1)]|")
'''

[[actionGroups.actions]]
id = "sample-allocation"
label = "Sample Allocation"
desc = "Samples per level and each level's share of the total cost"
code = '''
using Plots

ls    = 0:L
share = [evals[l+1] * cost(Level(l)) for l in ls] ./ work
p1 = bar(ls, evals; yscale = :log10, xlabel = "Level l", ylabel = "Samples", label = false)
p2 = bar(ls, share; xlabel = "Level l", ylabel = "Share of total cost", label = false)
plot(p1, p2; layout = (1, 2))
'''

[[actionGroups.actions]]
id = "convergence-plot"
label = "Cost vs Tolerance"
desc = "Rerun the multilevel and single-level estimators at four tolerances and plot cost against tolerance"
code = '''
using Plots
# Helpers to rerun the estimator with another tolerance, Max Level or index set
{{?model=mlmc}}shifts = 1
{{?model=mlqmc}}shifts = {{nshifts}}  # QMC counts points per shift
finest(hh) = maximum(l[1] for l in hh[:current_index_set])
total_cost(hh) = shifts * sum(hh[:nb_of_samples][l+1] * cost(Level(l)) for l in 0:finest(hh))
function ml_run(tol; maxlevel = {{maxlevel}})
    est = Estimator(ML(), method, sample_fn, distributions;
        max_index_set_param = maxlevel,
        min_index_set_param = min(2, maxlevel),  # the package default 2 must not exceed the maximum
{{?problem=gbm}}        nb_of_uncertainties = level -> 2^level[1],
{{?model=mlqmc}}        nb_of_shifts = level -> {{nshifts}},
        cost_model = cost, save = false, verbose = false)
    run(est, tol)
end
function sl_run(Lf, tol)
    fine(level, x) = (Q = sample_fn(Level(Lf), x)[2]; (Q, Q))  # every sample on level Lf only
    est = Estimator(SL(), method, fine, distributions;
{{?problem=gbm}}        nb_of_uncertainties = level -> 2^Lf,
{{?model=mlqmc}}        nb_of_shifts = level -> {{nshifts}},
        cost_model = level -> cost(Level(Lf)), save = false, verbose = false)
    run(est, tol)
end
sl_cost_at(Lf, tol) = shifts * sl_run(Lf, tol)[:nb_of_samples][1] * cost(Level(Lf))

Random.seed!({{seed}})
tols    = {{reltol}} * abs(exact) .* [8, 4, 2, 1]
ml_cost = Float64[]
sl_cost = Float64[]
for tol in tols
    hm = ml_run(tol)
    push!(ml_cost, total_cost(hm))
    push!(sl_cost, sl_cost_at(finest(hm), tol))  # single level on the same finest level
end
plot(tols, [ml_cost sl_cost]; xscale = :log10, yscale = :log10, marker = :circle, label = ["Multilevel" "Single level"], xlabel = "Tolerance (RMSE)", ylabel = "Cost (fine-grid units)")
plot!(tols, ml_cost[end] .* (tols[end] ./ tols) .^ 2; linestyle = :dash, label = "slope tol^-2")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "variance-decay"
label = "Variance Decay"
desc = "Variance of the level corrections and the package's estimate of its decay rate beta"
code = '''
{{?problem=integral}}theory = (alpha = 2, beta = 4, gamma = 1)  # midpoint rule: bias O(h^2); the correction is O(h^2) for every X, so its variance is O(h^4)
{{?problem=gbm}}theory = (alpha = 1, beta = 1, gamma = 1)  # Euler-Maruyama: weak order 1, strong order 1/2, Lipschitz payoff
beta = first(h[Symbol("\u03b2")])  # package estimate (History key beta)
println("Level  Var[Q_l - Q_(l-1)]   ratio to previous level")
for l in 1:L
    v = h[:dV][Level(l)]
    println(rpad(l, 7), rpad(round(v; sigdigits = 4), 21), l > 1 ? round(h[:dV][Level(l-1)] / v; sigdigits = 3) : "")
end
println("beta estimate: ", round(beta; sigdigits = 3), "   theory: ", theory.beta, "   (each level divides the variance by about 2^beta)")
'''

[[actionGroups.actions]]
id = "cost-growth"
label = "Cost per Level"
desc = "The cost model 2^l against the measured run time per sample"
code = '''
using Plots

ls = 0:L
tl = [h[:T][Level(l)] for l in ls]  # measured seconds per sample
plot(ls, log2.(cost.(Level.(ls))); marker = :circle, label = "cost model 2^l", xlabel = "Level l", ylabel = "log2 (relative to level 0)")
plot!(ls, log2.(tl ./ tl[1]); marker = :square, label = "measured time per sample")
# gamma is estimated from the cost model, so it is 1 by construction. On coarse levels the
# measured time is dominated by the package's per-sample overhead (pmap), not by the 2^l work.
'''

[[actionGroups.actions]]
id = "weak-convergence"
label = "Mean Decay"
desc = "Mean of the level corrections and the package's estimate of its decay rate alpha, which drives the bias"
code = '''
{{?problem=integral}}theory = (alpha = 2, beta = 4, gamma = 1)  # midpoint rule: bias O(h^2); the correction is O(h^2) for every X, so its variance is O(h^4)
{{?problem=gbm}}theory = (alpha = 1, beta = 1, gamma = 1)  # Euler-Maruyama: weak order 1, strong order 1/2, Lipschitz payoff
alpha = first(h[Symbol("\u03b1")])  # package estimate (History key alpha)
println("Level  |E[Q_l - Q_(l-1)]|   ratio to previous level")
for l in 1:L
    m = abs(h[:dE][Level(l)])
    println(rpad(l, 7), rpad(round(m; sigdigits = 4), 21), l > 1 ? round(abs(h[:dE][Level(l-1)]) / m; sigdigits = 3) : "")
end
println("alpha estimate: ", round(alpha; sigdigits = 3), "   theory: ", theory.alpha)
println("Bias estimate |E[Q - Q_L]|: ", round(h[:bias]; sigdigits = 3), "   actual |E[Q_L] - exact| is unknown, but |estimate - exact| = ", round(abs(h[:mean] - exact); sigdigits = 3))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "mean-ci"
label = "Confidence Interval"
desc = "95% interval from the estimator variance, with the bias estimate reported separately, checked against the exact value"
code = '''
se = sqrt(h[:varest])  # standard error of the multilevel estimate
lo, hi = h[:mean] - 1.96 * se, h[:mean] + 1.96 * se
println("Estimate:       ", round(h[:mean]; sigdigits = 7))
println("95% interval:   [", round(lo; sigdigits = 7), ", ", round(hi; sigdigits = 7), "]   (sampling error only)")
println("Bias estimate:  ", round(h[:bias]; sigdigits = 3), "   (not included in the interval)")
println("Exact value ", round(exact; sigdigits = 7), lo <= exact <= hi ? " lies inside the interval" : " lies outside the interval")
'''

[[actionGroups.actions]]
id = "cost-forecast"
label = "Cost Forecast"
desc = "Forecast the cost of a 10x smaller tolerance from the measured rates and the MLMC complexity theorem"
code = '''
alpha = first(h[Symbol("\u03b1")])
beta  = first(h[Symbol("\u03b2")])
gamma = first(h[Symbol("\u03b3")])
tol   = h[:tol]
# Giles (2015), Theorem 1, assuming alpha >= min(beta, gamma) / 2; rates within 0.25 are treated as equal
if beta > gamma + 0.25
    regime, factor = "beta > gamma: cost grows like tol^-2", 10.0^2
elseif abs(beta - gamma) <= 0.25
    regime, factor = "beta = gamma: cost grows like tol^-2 log(tol)^2", 10.0^2 * (log(tol / 10) / log(tol))^2
else
    regime, factor = "beta < gamma: cost grows like tol^-(2 + (gamma - beta) / alpha)", 10.0^(2 + (gamma - beta) / alpha)
end
println("Measured rates: alpha = ", round(alpha; sigdigits = 3), ", beta = ", round(beta; sigdigits = 3), ", gamma = ", round(gamma; sigdigits = 3))
println("Regime: ", regime)
println("A 10x smaller tolerance should cost about ", round(factor; sigdigits = 2), " times the current ", round(Int, work), " units")
'''

[[actionGroups.actions]]
id = "optimal-levels"
label = "Levels Used"
desc = "Why the estimator stopped at its finest level: the level corrections against the bias part of the tolerance"
code = '''
println("Level  |E[Q_l - Q_(l-1)]|   samples")
for l in 0:L
    println(rpad(l, 7), rpad(round(abs(h[:dE][Level(l)]); sigdigits = 4), 21), evals[l+1])
end
println("Stopped at L = ", L, ": bias estimate ", round(h[:bias]; sigdigits = 3), ", MSE ", round(h[:mse]; sigdigits = 3), " <= tol^2 = ", round(h[:tol]^2; sigdigits = 3))
L == {{maxlevel}} && println("L reached Max Level, so the bias may still exceed its share of the tolerance: raise Max Level.")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "mlmc-vs-mc"
label = "Multilevel vs Single Level"
desc = "Run the single-level estimator on the same finest level and tolerance, and compare costs and errors"
code = '''
# Helpers to rerun the estimator with another tolerance, Max Level or index set
{{?model=mlmc}}shifts = 1
{{?model=mlqmc}}shifts = {{nshifts}}  # QMC counts points per shift
finest(hh) = maximum(l[1] for l in hh[:current_index_set])
total_cost(hh) = shifts * sum(hh[:nb_of_samples][l+1] * cost(Level(l)) for l in 0:finest(hh))
function ml_run(tol; maxlevel = {{maxlevel}})
    est = Estimator(ML(), method, sample_fn, distributions;
        max_index_set_param = maxlevel,
        min_index_set_param = min(2, maxlevel),  # the package default 2 must not exceed the maximum
{{?problem=gbm}}        nb_of_uncertainties = level -> 2^level[1],
{{?model=mlqmc}}        nb_of_shifts = level -> {{nshifts}},
        cost_model = cost, save = false, verbose = false)
    run(est, tol)
end
function sl_run(Lf, tol)
    fine(level, x) = (Q = sample_fn(Level(Lf), x)[2]; (Q, Q))  # every sample on level Lf only
    est = Estimator(SL(), method, fine, distributions;
{{?problem=gbm}}        nb_of_uncertainties = level -> 2^Lf,
{{?model=mlqmc}}        nb_of_shifts = level -> {{nshifts}},
        cost_model = level -> cost(Level(Lf)), save = false, verbose = false)
    run(est, tol)
end
sl_cost_at(Lf, tol) = shifts * sl_run(Lf, tol)[:nb_of_samples][1] * cost(Level(Lf))

Random.seed!({{seed}})
hs     = sl_run(L, h[:tol])
c_sl   = hs[:nb_of_samples][1] * cost(Level(L)) * shifts
println("Single level on level ", L, ": cost ", round(Int, c_sl), "   error ", round(abs(hs[:mean] - exact); sigdigits = 3))
println("Multilevel, levels 0 to ", L, ": cost ", round(Int, work), "   error ", round(abs(h[:mean] - exact); sigdigits = 3))
println("Multilevel is ", round(c_sl / work; sigdigits = 3), " times cheaper at the same tolerance ", round(h[:tol]; sigdigits = 3))
'''

