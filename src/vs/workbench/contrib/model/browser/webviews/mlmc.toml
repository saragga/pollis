[[actionGroups.actions]]
id = "rate-summary"
label = "Rates"
desc = "The package's estimates of alpha, beta and gamma against the theoretical rates for the chosen problem"
code = '''
{{?problem=integral}}theory = (alpha = 2, beta = 4, gamma = 1)  # midpoint rule: bias O(h^2); the correction is O(h^2) for every X, so its variance is O(h^4)
{{?problem=gbm}}theory = (alpha = 1, beta = 1, gamma = 1)  # Euler-Maruyama: weak order 1, strong order 1/2, Lipschitz payoff
for (name, key) in (("alpha (mean decay)", "\u03b1"), ("beta (variance decay)", "\u03b2"), ("gamma (cost growth)", "\u03b3"))
    println(rpad(name, 24), round(first(h[Symbol(key)]); sigdigits = 3))
end
println("Theory: alpha = ", theory.alpha, ", beta = ", theory.beta, ", gamma = ", theory.gamma)
println("gamma comes from the cost model 2^l. Rates need at least three levels to be reliable.")
'''

