println("Squared bias estimate:   ", round(h[:bias]^2; sigdigits = 3))
println("MSE = variance + bias^2: ", round(h[:mse]; sigdigits = 3), "   (tolerance^2 = ", round(h[:tol]^2; sigdigits = 3), ")")
println("Actual squared error:    ", round((h[:mean] - exact)^2; sigdigits = 3), "   (a single draw: compare orders of magnitude)")
