[[bullets]]
text = "Chemical"
detail = "enzyme kinetics such as Michaelis–Menten, where substrate, enzyme–substrate complex, and product interconvert through mass-action reactions"

[[bullets]]
text = "Genetic"
detail = "gene regulatory circuits such as the repressilator, a three-gene transcriptional oscillator where each protein represses the next gene in a cycle"

[[bullets]]
text = "Ecological"
detail = "species interaction networks such as Lotka–Volterra predator–prey, where prey reproduction and predation are expressed as birth and consumption reactions"

[[bullets]]
text = "Epidemic"
detail = "disease spread expressed as a reaction network, with susceptible–infectious contact and infectious–recovered transitions as probabilistic events"

[[inputs]]
id = "T"
label = "T (time)"
tooltip = "Simulation time span. For ODE solutions this is the integration horizon; for Gillespie stochastic simulation it is the maximum event time."
default = "100"

[[inputs]]
id = "k1"
label = "k1 (forward rate)"
tooltip = "Primary forward reaction rate. For Chemical: substrate binding rate k1. For Genetic: transcription rate alpha. For Ecological: prey growth rate a. For Epidemic: transmission rate beta."
default = "1.0"

[[inputs]]
id = "k2"
label = "k2 (reverse/decay rate)"
tooltip = "Secondary rate. For Chemical: unbinding rate k2. For Genetic: protein degradation rate gamma. For Ecological: predator death rate c. For Epidemic: recovery rate gamma."
default = "0.1"

[[inputs]]
id = "u0"
label = "u0 (initial amount)"
tooltip = "Initial copy number or concentration of the primary species. For Chemical: initial substrate S0. For Genetic: initial mRNA level. For Ecological: initial prey population. For Epidemic: initial susceptibles."
default = "100"

[[codeBranches]]
model = "chemical"
code = '''
using Catalyst, DifferentialEquations, Plots

rn = @reaction_network begin  # Michaelis-Menten enzyme kinetics
    {{k1}}, S + E --> SE  # binding: substrate + enzyme form complex
    {{k2}}, SE --> S + E  # unbinding: complex dissociates
    0.5, SE --> P + E  # catalysis: product release, rate kcat=0.5
end

u0  = [:S => {{u0}}.0, :E => 10.0, :SE => 0.0, :P => 0.0]  # initial conditions
p   = []  # rates embedded in network definition above
tspan = (0.0, {{T}}.0)  # time span
prob = ODEProblem(rn, u0, tspan, p)
sol  = solve(prob, Tsit5())

plot(sol, xlabel="Time", ylabel="Amount", title="Michaelis-Menten Kinetics")  # plot species trajectories
'''

[[codeBranches]]
model = "genetic"
code = '''
using Catalyst, DifferentialEquations, Plots

rn = @reaction_network begin  # Repressilator: 3-gene transcriptional oscillator
    hillr(Pz, {{k1}}, 1.0, 2), --> Px  # Pz represses Px transcription
    hillr(Px, {{k1}}, 1.0, 2), --> Py  # Px represses Py transcription
    hillr(Py, {{k1}}, 1.0, 2), --> Pz  # Py represses Pz transcription
    {{k2}}, Px --> 0  # protein Px degradation
    {{k2}}, Py --> 0  # protein Py degradation
    {{k2}}, Pz --> 0  # protein Pz degradation
end

u0    = [:Px => {{u0}}.0, :Py => 0.0, :Pz => 0.0]  # asymmetric initial conditions trigger oscillation
tspan = (0.0, {{T}}.0)  # time span
prob  = ODEProblem(rn, u0, tspan, [])
sol   = solve(prob, Tsit5())

plot(sol, xlabel="Time", ylabel="Protein level", title="Repressilator Oscillator")  # sustained oscillations if parameters are in limit-cycle regime
'''

[[codeBranches]]
model = "ecological"
code = '''
using Catalyst, DifferentialEquations, Plots

rn = @reaction_network begin  # Lotka-Volterra predator-prey
    {{k1}}, X --> 2X  # prey reproduction at rate a={{k1}}
    0.05, X + Y --> 2Y  # predation and predator reproduction
    {{k2}}, Y --> 0  # predator death at rate c={{k2}}
end

u0    = [:X => {{u0}}.0, :Y => 10.0]  # initial prey and predator populations
tspan = (0.0, {{T}}.0)  # time span
prob  = ODEProblem(rn, u0, tspan, [])
sol   = solve(prob, Tsit5())

plot(sol, xlabel="Time", ylabel="Population", title="Lotka-Volterra Predator-Prey")  # cyclic oscillations in prey and predator
'''

[[codeBranches]]
model = "epidemic"
code = '''
using Catalyst, DifferentialEquations, Plots

rn = @reaction_network begin  # SIR epidemic as a reaction network
    {{k1}}/{{u0}}, S + I --> 2I  # transmission: susceptible contacts infectious
    {{k2}}, I --> R  # recovery: infectious becomes recovered
end

N     = {{u0}}  # total population
u0    = [:S => N - 1.0, :I => 1.0, :R => 0.0]  # initial conditions: one seed case
tspan = (0.0, {{T}}.0)  # time span in days
prob  = ODEProblem(rn, u0, tspan, [])
sol   = solve(prob, Tsit5())

R0 = {{k1}} / {{k2}}  # basic reproduction number
println("R0 = ", round(R0; digits=2))  # epidemic threshold check
plot(sol, xlabel="Days", ylabel="People", title="SIR as Reaction Network")  # epidemic curve
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "species-trajectories"
label = "Species Trajectories"
desc = "Plot all species concentrations over time for the selected reaction network"
code = '''
using Catalyst, DifferentialEquations, GLMakie

rn = @reaction_network begin  # Lotka-Volterra as example
    {{k1}}, X --> 2X  # prey growth
    0.05, X + Y --> 2Y  # predation
    {{k2}}, Y --> 0  # predator death
end

sol = solve(ODEProblem(rn, [:X=>{{u0}}.0,:Y=>10.0], (0.0,{{T}}.0), []), Tsit5())

fig,ax=Figure(),Axis(fig[1,1],xlabel="Time",ylabel="Population",title="Reaction Network Trajectories")
lines!(ax,sol.t,sol[:X,:],label="Prey X",color=:blue)
lines!(ax,sol.t,sol[:Y,:],label="Predator Y",color=:red)
axislegend(ax); display(fig)
'''

[[actionGroups.actions]]
id = "phase-portrait"
label = "Phase Portrait"
desc = "Plot the phase plane of two key species to reveal limit cycles, fixed points, and nullclines"
code = '''
using Catalyst, DifferentialEquations, GLMakie

rn = @reaction_network begin  # Lotka-Volterra
    {{k1}}, X --> 2X  # prey growth
    0.05, X + Y --> 2Y  # predation
    {{k2}}, Y --> 0  # predator death
end

sol = solve(ODEProblem(rn, [:X=>{{u0}}.0,:Y=>10.0], (0.0,{{T}}.0), []), Tsit5())

fig,ax=Figure(),Axis(fig[1,1],xlabel="Prey X",ylabel="Predator Y",title="Phase Portrait")
lines!(ax,sol[:X,:],sol[:Y,:],color=:purple)
scatter!(ax,[sol[:X,1]],[sol[:Y,1]],color=:blue,markersize=10)  # initial state
display(fig)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "steady-states"
label = "Steady States"
desc = "Compute all steady states of the reaction network using HomotopyContinuation.jl via Catalyst"
code = '''
using Catalyst, HomotopyContinuation

rn = @reaction_network begin  # Michaelis-Menten example
    {{k1}}, S + E --> SE  # binding
    {{k2}}, SE --> S + E  # unbinding
    0.5, SE --> P + E  # catalysis
end

ss = steady_states(rn, [])  # find all steady states (polynomial system solver)
println("Number of steady states: ", length(ss))
for s in ss
    println(s)
end
'''

[[actionGroups.actions]]
id = "conservation-laws"
label = "Conservation Laws"
desc = "Find conserved moieties in the network — quantities that remain constant under all reactions"
code = '''
using Catalyst

rn = @reaction_network begin  # Michaelis-Menten
    {{k1}}, S + E --> SE  # binding
    {{k2}}, SE --> S + E  # unbinding
    0.5, SE --> P + E  # catalysis
end

cl = conservationlaws(rn)  # stoichiometry-based conservation law matrix
println("Conservation law matrix:")
println(cl)
println("Species: ", species(rn))  # E + SE = const  and  S + SE + P = const
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "rate-sweep"
label = "Rate Sweep"
desc = "Sweep the forward rate k1 and record the final state or oscillation amplitude across values"
code = '''
using Catalyst, DifferentialEquations, GLMakie

k2 = {{k2}}  # fixed predator death rate
k1_vals = 0.2:0.2:2.0  # sweep prey growth rate
max_Y   = Float64[]  # record peak predator population
for k1 in k1_vals
    rn = @reaction_network begin
        k1, X --> 2X; 0.05, X + Y --> 2Y; k2, Y --> 0
    end
    sol = solve(ODEProblem(rn, [:X=>{{u0}}.0,:Y=>10.0], (0.0,{{T}}.0), []), Tsit5())
    push!(max_Y, maximum(sol[:Y,:]))
end

fig,ax=Figure(),Axis(fig[1,1],xlabel="k1 (prey growth)",ylabel="Peak predator Y",title="Rate Sweep")
lines!(ax,collect(k1_vals),max_Y,color=:red)
display(fig)
'''

[[actionGroups.actions]]
id = "gillespie"
label = "Stochastic Simulation"
desc = "Run the Gillespie exact stochastic simulation algorithm for small copy-number systems"
code = '''
using Catalyst, JumpProcesses, GLMakie

rn = @reaction_network begin  # SIR as reaction network (integer copy numbers)
    {{k1}}/{{u0}}, S + I --> 2I  # transmission
    {{k2}}, I --> R  # recovery
end

u0    = [:S => {{u0}} - 1, :I => 1, :R => 0]  # integer initial conditions for Gillespie
tspan = (0.0, {{T}}.0)  # time span
jprob = JumpProblem(rn, DiscreteProblem(rn, u0, tspan, []), Direct())
sol   = solve(jprob, SSAStepper())

fig,ax=Figure(),Axis(fig[1,1],xlabel="Days",ylabel="Count",title="Gillespie SIR Simulation")
stairs!(ax,sol.t,sol[:S,:],label="S",color=:blue)
stairs!(ax,sol.t,sol[:I,:],label="I",color=:red)
stairs!(ax,sol.t,sol[:R,:],label="R",color=:green)
axislegend(ax); display(fig)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "ode-vs-gillespie"
label = "ODE vs Gillespie"
desc = "Overlay the deterministic ODE solution and a stochastic Gillespie trajectory on the same axes"
code = '''
using Catalyst, DifferentialEquations, JumpProcesses, GLMakie

rn = @reaction_network begin  # SIR reaction network
    {{k1}}/{{u0}}, S + I --> 2I  # transmission
    {{k2}}, I --> R  # recovery
end

u0_ode = [:S=>{{u0}}-1.0, :I=>1.0, :R=>0.0]  # ODE: continuous
sol_ode = solve(ODEProblem(rn, u0_ode, (0.0,{{T}}.0), []), Tsit5())

u0_ssa = [:S=>{{u0}}-1, :I=>1, :R=>0]  # Gillespie: integer
jprob  = JumpProblem(rn, DiscreteProblem(rn, u0_ssa, (0.0,{{T}}.0), []), Direct())
sol_ssa = solve(jprob, SSAStepper())

fig,ax=Figure(),Axis(fig[1,1],xlabel="Days",ylabel="Infectious",title="ODE vs Gillespie")
lines!(ax,sol_ode.t,sol_ode[:I,:],color=:red,label="ODE")
stairs!(ax,sol_ssa.t,sol_ssa[:I,:],color=:orange,linestyle=:dash,label="Gillespie")
axislegend(ax); display(fig)
'''

[[actionGroups.actions]]
id = "network-domains"
label = "Cross-Domain Comparison"
desc = "Run Lotka-Volterra, repressilator, and SIR and compare their oscillation periods"
code = '''
using Catalyst, DifferentialEquations, Statistics

lv = @reaction_network begin  # Lotka-Volterra
    {{k1}}, X --> 2X; 0.05, X + Y --> 2Y; {{k2}}, Y --> 0
end
rep = @reaction_network begin  # Repressilator
    hillr(Pz,{{k1}},1.0,2),-->Px; hillr(Px,{{k1}},1.0,2),-->Py; hillr(Py,{{k1}},1.0,2),-->Pz
    {{k2}},Px-->0; {{k2}},Py-->0; {{k2}},Pz-->0
end

sol_lv  = solve(ODEProblem(lv,  [:X=>{{u0}}.0,:Y=>10.0],          (0.0,{{T}}.0),[]),Tsit5())
sol_rep = solve(ODEProblem(rep, [:Px=>{{u0}}.0,:Py=>0.0,:Pz=>0.0], (0.0,{{T}}.0),[]),Tsit5())

println("LV   peak X amplitude: ", round(maximum(sol_lv[:X,:]) - minimum(sol_lv[:X,:]); digits=1))  # prey oscillation range
println("Rep  peak Px amplitude: ", round(maximum(sol_rep[:Px,:]) - minimum(sol_rep[:Px,:]); digits=1))  # repressilator amplitude
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "stoichiometry-matrix"
label = "Stoichiometry Matrix"
desc = "Print the stoichiometry matrix and species/reaction lists to understand network structure"
code = '''
using Catalyst

rn = @reaction_network begin  # Michaelis-Menten enzyme kinetics
    {{k1}}, S + E --> SE  # binding
    {{k2}}, SE --> S + E  # unbinding
    0.5, SE --> P + E  # catalysis
end

println("Species: ", species(rn))  # list all species
println("Reactions: ", reactions(rn))  # list all reactions
N = netstoichmat(rn)  # net stoichiometry matrix (species x reactions)
println("Stoichiometry matrix:")
println(N)
'''

[[actionGroups.actions]]
id = "network-summary"
label = "Network Summary"
desc = "Print structural properties: number of species, reactions, complexes, and deficiency index"
code = '''
using Catalyst

rn = @reaction_network begin  # Lotka-Volterra predator-prey
    {{k1}}, X --> 2X  # prey growth
    0.05, X + Y --> 2Y  # predation
    {{k2}}, Y --> 0  # predator death
end

println("Species:   ", numspecies(rn))  # number of distinct species
println("Reactions: ", numreactions(rn))  # number of reactions
println("Complexes: ", numcomplexes(rn))  # number of reaction complexes
println("Deficiency (delta): ", deficiency(rn))  # delta = n - l - s; 0 means well-behaved dynamics
'''
