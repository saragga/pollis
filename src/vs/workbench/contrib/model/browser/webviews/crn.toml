'''

[[actionGroups.actions]]
id = "network-summary"
label = "Network Summary"
desc = "Print structural properties of the selected network: species, reactions, complexes, linkage classes, deficiency and weak reversibility, and what the deficiency zero theorem says"
code = '''
using Catalyst

cmplxs, _ = reactioncomplexes(rn)  # network built by the selected model
delta     = deficiency(rn)  # n complexes - l linkage classes - s rank of the stoichiometry
wr        = isweaklyreversible(rn, subnetworks(rn))

println("Species:         ", numspecies(rn))
println("Reactions:       ", numreactions(rn))
println("Complexes:       ", length(cmplxs))
println("Linkage classes: ", length(linkageclasses(rn)))
println("Deficiency:      ", delta)
println("Weakly reversible: ", wr)
if delta == 0 && wr
    println("Deficiency zero theorem applies: for any rates, one positive steady state per compatibility class, locally asymptotically stable, no oscillations")
else
    println("Deficiency zero theorem does not apply (it needs deficiency 0 AND weak reversibility); the dynamics may oscillate or have several steady states")
end
'''
