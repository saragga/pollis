[[bullets]]
text = "Chemical"
detail = "enzyme kinetics such as Michaelis–Menten, where substrate, enzyme–substrate complex, and product interconvert through mass-action reactions"

[[bullets]]
text = "Genetic"
detail = "gene regulatory circuits such as the repressilator, a three-gene transcriptional oscillator where each protein represses the next gene in a cycle"

[[bullets]]
text = "Ecological"
detail = "species interaction networks such as Lotka–Volterra predator–prey, where prey reproduction and predation are expressed as birth and consumption reactions"

[[bullets]]
text = "Epidemic"
detail = "disease spread expressed as a reaction network, with susceptible–infectious contact and infectious–recovered transitions as probabilistic events"

[[inputs]]
id = "T"
label = "T (time)"
tooltip = "Simulation time span. For ODE solutions this is the integration horizon; for Gillespie stochastic simulation it is the maximum event time."
default = "100"

[[inputs]]
id = "k1"
label = "k1 (forward rate)"
tooltip = "Primary forward reaction rate. For Chemical: substrate binding rate k1. For Genetic: transcription rate alpha. For Ecological: prey growth rate a. For Epidemic: transmission rate beta."
default = "1.0"

[[inputs]]
id = "k2"
label = "k2 (reverse/decay rate)"
tooltip = "Secondary rate. For Chemical: unbinding rate k2. For Genetic: protein degradation rate gamma. For Ecological: predator death rate c. For Epidemic: recovery rate gamma."
default = "0.1"

[[inputs]]
id = "u0"
label = "u0 (initial amount)"
tooltip = "Initial copy number or concentration of the primary species. For Chemical: initial substrate S0. For Genetic: initial mRNA level. For Ecological: initial prey population. For Epidemic: initial susceptibles."
default = "100"

[[codeBranches]]
model = "chemical"
code = '''
using Catalyst, DifferentialEquations, Plots

rn = @reaction_network begin  # Michaelis-Menten enzyme kinetics
    k1, S + E --> SE  # binding: substrate + enzyme form complex
    k2, SE --> S + E  # unbinding: complex dissociates
    kcat, SE --> P + E  # catalysis: product release
end

ps    = [:k1 => {{k1}}, :k2 => {{k2}}, :kcat => 0.5]  # rate constants per unit time
u0    = [:S => Float64({{u0}}), :E => 10.0, :SE => 0.0, :P => 0.0]  # initial amounts; they fix the conserved totals E + SE and S + SE + P
tspan = (0.0, Float64({{T}}))
prob  = ODEProblem(rn, u0, tspan, ps)
sol   = solve(prob, Tsit5())

plot(sol, xlabel="Time", ylabel="Amount", title="Michaelis-Menten Kinetics")  # plot species trajectories
'''

[[codeBranches]]
model = "genetic"
code = '''
using Catalyst, DifferentialEquations, Plots

rn = @reaction_network begin  # Repressilator: 3-gene transcriptional oscillator
    hillr(Pz, v, K, 3), 0 --> Px  # Pz represses Px transcription; Hill coefficient 3: with 2 the loop gain is too low and the levels settle to a fixed point
    hillr(Px, v, K, 3), 0 --> Py  # Px represses Py transcription
    hillr(Py, v, K, 3), 0 --> Pz  # Py represses Pz transcription
    d, Px --> 0  # protein Px degradation
    d, Py --> 0  # protein Py degradation
    d, Pz --> 0  # protein Pz degradation
end

ps    = [:v => {{k1}}, :K => 1.0, :d => {{k2}}]  # maximal transcription rate, repression threshold, degradation rate
u0    = [:Px => Float64({{u0}}), :Py => 0.0, :Pz => 0.0]  # asymmetric initial conditions trigger oscillation
tspan = (0.0, Float64({{T}}))
prob  = ODEProblem(rn, u0, tspan, ps)
sol   = solve(prob, Tsit5())

plot(sol, xlabel="Time", ylabel="Protein level", title="Repressilator Oscillator")  # sustained oscillations: three identical repression steps need a loop gain above 8, which Hill coefficient 3 gives
'''

[[codeBranches]]
model = "ecological"
code = '''
using Catalyst, DifferentialEquations, Plots

rn = @reaction_network begin  # Lotka-Volterra predator-prey
    a, X --> 2X  # prey reproduction
    b, X + Y --> 2Y  # predation and predator reproduction
    c, Y --> 0  # predator death
end

ps    = [:a => {{k1}}, :b => 0.05, :c => {{k2}}]
u0    = [:X => Float64({{u0}}), :Y => 10.0]  # initial prey and predator populations
tspan = (0.0, Float64({{T}}))
prob  = ODEProblem(rn, u0, tspan, ps)
sol   = solve(prob, Tsit5())

plot(sol, xlabel="Time", ylabel="Population", title="Lotka-Volterra Predator-Prey")  # cyclic oscillations in prey and predator
'''

[[codeBranches]]
model = "epidemic"
code = '''
using Catalyst, DifferentialEquations, Plots

rn = @reaction_network begin  # SIR epidemic as a reaction network (time unit: days)
    beta / N, S + I --> 2I  # transmission: susceptible contacts infectious (mass action, frequency-dependent)
    gamma, I --> R  # recovery: infectious becomes recovered
end

N     = Float64({{u0}})  # total population
ps    = [:beta => {{k1}}, :gamma => {{k2}}, :N => N]  # rates per day: contact rate and recovery rate (mean infectious period 1/gamma days)
u0    = [:S => N - 1.0, :I => 1.0, :R => 0.0]  # initial conditions: one seed case
tspan = (0.0, Float64({{T}}))  # days
prob  = ODEProblem(rn, u0, tspan, ps)
sol   = solve(prob, Tsit5())

R0 = {{k1}} / {{k2}}  # basic reproduction number (defaults give 10, measles-like)
println("R0 = ", round(R0; digits=2), ", mean infectious period = ", round(1 / {{k2}}; digits=1), " days")
plot(sol, xlabel="Days", ylabel="People", title="SIR as Reaction Network")  # epidemic curve
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "species-trajectories"
label = "Species Trajectories"
desc = "Plot all species of the selected reaction network over time"
code = '''
using GLMakie

fig = Figure()
ax  = Axis(fig[1, 1], xlabel="Time", ylabel="Amount", title="Reaction Network Trajectories")
for s in species(rn)  # every species of the network built by the selected model
    lines!(ax, sol.t, sol[s], label=string(Catalyst.getname(s)))
end
axislegend(ax); display(fig)
'''

[[actionGroups.actions]]
id = "phase-portrait"
label = "Phase Portrait"
desc = "Plot the phase plane of the first two species of the selected network to reveal limit cycles and fixed points"
code = '''
using GLMakie

sp = species(rn)[1:2]  # first two species of the selected network
fig = Figure()
ax  = Axis(fig[1, 1], xlabel=string(Catalyst.getname(sp[1])), ylabel=string(Catalyst.getname(sp[2])), title="Phase Portrait")
lines!(ax, sol[sp[1]], sol[sp[2]], color=:purple)
scatter!(ax, [sol[sp[1]][1]], [sol[sp[2]][1]], color=:blue, markersize=10)  # initial state
display(fig)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "steady-states"
label = "Steady States"
desc = "Compute the steady states of the Michaelis-Menten network with HomotopyContinuation.jl, fixing the conserved totals from the initial amounts so the steady states are isolated points"
code = '''
using Catalyst, HomotopyContinuation

mm = @reaction_network begin  # Michaelis-Menten
    k1, S + E --> SE  # binding
    k2, SE --> S + E  # unbinding
    kcat, SE --> P + E  # catalysis
end

ps_mm = [:k1 => {{k1}}, :k2 => {{k2}}, :kcat => 0.5]
u0_mm = [:S => Float64({{u0}}), :E => 10.0, :SE => 0.0, :P => 0.0]  # sets E + SE = 10 and S + SE + P = {{u0}}
# Without fixing the conserved totals the steady states form a continuum and the polynomial system is under-determined
ss = hc_steady_states(mm, ps_mm; u0=u0_mm)  # real, non-negative steady states
println("Species: ", species(mm))
println("Number of steady states: ", length(ss))
foreach(println, ss)  # catalysis is irreversible, so all substrate ends as product: S = SE = 0
'''

[[actionGroups.actions]]
id = "conservation-laws"
label = "Conservation Laws"
desc = "Find conserved moieties in the network: quantities that remain constant under all reactions"
code = '''
using Catalyst

mm = @reaction_network begin  # Michaelis-Menten
    k1, S + E --> SE  # binding
    k2, SE --> S + E  # unbinding
    kcat, SE --> P + E  # catalysis
end

cl = conservationlaws(mm)  # each row is a conserved linear combination of the species
println("Species: ", species(mm))
println("Conservation law matrix:")
println(cl)  # E + SE = const and S + SE + P = const
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "rate-sweep"
label = "Rate Sweep"
desc = "Sweep the prey growth rate of the Lotka-Volterra network and record the peak predator population"
code = '''
using Catalyst, DifferentialEquations, GLMakie

lv = @reaction_network begin
    a, X --> 2X; b, X + Y --> 2Y; c, Y --> 0
end

a_vals = 0.2:0.2:2.0  # prey growth rates to sweep
max_Y  = Float64[]  # peak predator population per rate
for a_val in a_vals
    prob_a = ODEProblem(lv, [:X => Float64({{u0}}), :Y => 10.0], (0.0, Float64({{T}})), [:a => a_val, :b => 0.05, :c => {{k2}}])  # the swept value is passed as the parameter a
    sol_a  = solve(prob_a, Tsit5())
    push!(max_Y, maximum(sol_a[:Y]))
end

fig = Figure()
ax  = Axis(fig[1, 1], xlabel="a (prey growth)", ylabel="Peak predator Y", title="Rate Sweep")
lines!(ax, collect(a_vals), max_Y, color=:red)
display(fig)
'''

[[actionGroups.actions]]
id = "gillespie"
label = "Stochastic Simulation"
desc = "Run the Gillespie exact stochastic simulation algorithm for the SIR network with integer copy numbers"
code = '''
using Catalyst, JumpProcesses, GLMakie

sir = @reaction_network begin  # SIR as reaction network (time unit: days)
    beta / N, S + I --> 2I  # transmission
    gamma, I --> R  # recovery
end

ps_j  = [:beta => {{k1}}, :gamma => {{k2}}, :N => Float64({{u0}})]
u0_j  = [:S => round(Int, {{u0}}) - 1, :I => 1, :R => 0]  # integer initial conditions for Gillespie
jprob = JumpProblem(sir, u0_j, (0.0, Float64({{T}})), ps_j)  # Direct method by default
sol_j = solve(jprob, SSAStepper())

fig = Figure()
ax  = Axis(fig[1, 1], xlabel="Days", ylabel="Count", title="Gillespie SIR Simulation")
stairs!(ax, sol_j.t, sol_j[:S], label="S", color=:blue)
stairs!(ax, sol_j.t, sol_j[:I], label="I", color=:red)
stairs!(ax, sol_j.t, sol_j[:R], label="R", color=:green)
axislegend(ax); display(fig)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "ode-vs-gillespie"
label = "ODE vs Gillespie"
desc = "Overlay the deterministic SIR solution and many Gillespie runs from one infective; counts the runs that die out early, which is about 1 / R0 of them"
code = '''
using Catalyst, DifferentialEquations, JumpProcesses, GLMakie

sir = @reaction_network begin  # SIR reaction network (time unit: days)
    beta / N, S + I --> 2I  # transmission
    gamma, I --> R  # recovery
end

Npop    = Float64({{u0}})
ps_s    = [:beta => {{k1}}, :gamma => {{k2}}, :N => Npop]
tspan   = (0.0, Float64({{T}}))
sol_ode = solve(ODEProblem(sir, [:S => Npop - 1, :I => 1.0, :R => 0.0], tspan, ps_s), Tsit5())

jprob  = JumpProblem(sir, [:S => round(Int, Npop) - 1, :I => 1, :R => 0], tspan, ps_s)
n_runs = 200
ens    = solve(EnsembleProblem(jprob), SSAStepper(); trajectories=n_runs)

final_R  = [s[:R][end] for s in ens]
died_out = count(<(0.1 * Npop), final_R)  # minor outbreaks: fewer than 10 pct ever infected
R0       = {{k1}} / {{k2}}
println("Early extinction: ", died_out, " of ", n_runs, " runs (", round(100 * died_out / n_runs, digits=1), " pct); branching-process approximation 1/R0 = ", round(100 / R0, digits=1), " pct")

fig = Figure()
ax  = Axis(fig[1, 1], xlabel="Days", ylabel="Infectious", title="ODE vs Gillespie ($(n_runs) runs)")
for s in ens[1:min(30, n_runs)]
    stairs!(ax, s.t, s[:I], color=(:orange, 0.3))
end
lines!(ax, sol_ode.t, sol_ode[:I], color=:red, linewidth=3, label="ODE")
axislegend(ax); display(fig)
'''

[[actionGroups.actions]]
id = "network-domains"
label = "Cross-Domain Comparison"
desc = "Run Lotka-Volterra and the repressilator and compare their oscillation amplitudes (maximum minus minimum over the run)"
code = '''
using Catalyst, DifferentialEquations, Statistics

lv = @reaction_network begin  # Lotka-Volterra
    a, X --> 2X; b, X + Y --> 2Y; c, Y --> 0
end
rep = @reaction_network begin  # Repressilator
    hillr(Pz, v, K, 3), 0 --> Px; hillr(Px, v, K, 3), 0 --> Py; hillr(Py, v, K, 3), 0 --> Pz
    d, Px --> 0; d, Py --> 0; d, Pz --> 0
end

tspan   = (0.0, Float64({{T}}))
sol_lv  = solve(ODEProblem(lv,  [:X => Float64({{u0}}), :Y => 10.0], tspan, [:a => {{k1}}, :b => 0.05, :c => {{k2}}]), Tsit5())
sol_rep = solve(ODEProblem(rep, [:Px => Float64({{u0}}), :Py => 0.0, :Pz => 0.0], tspan, [:v => {{k1}}, :K => 1.0, :d => {{k2}}]), Tsit5())

println("LV   peak X amplitude:  ", round(maximum(sol_lv[:X]) - minimum(sol_lv[:X]); digits=1))  # prey oscillation range
println("Rep  peak Px amplitude: ", round(maximum(sol_rep[:Px]) - minimum(sol_rep[:Px]); digits=1))  # repressilator amplitude
'''

