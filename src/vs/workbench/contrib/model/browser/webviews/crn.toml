# Interaction Network Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/crn.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Interaction Network Models"
viewType = "pollis.crn"
defaultModel = "chemical"

[[packages]]
name = "Catalyst.jl"
github = "https://docs.sciml.ai/Catalyst/stable/"

[requires]
packages = ["Catalyst.jl"]

