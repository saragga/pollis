[[actionGroups.actions]]
id = "stoichiometry-matrix"
label = "Stoichiometry Matrix"
desc = "Print the stoichiometry matrix and the species and reaction lists of the selected network"
code = '''
using Catalyst

println("Species: ", species(rn))  # network built by the selected model
println("Reactions: ", reactions(rn))
Nst = netstoichmat(rn)  # net stoichiometry matrix (species x reactions)
println("Stoichiometry matrix:")
