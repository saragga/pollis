[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "pareto-front"
label = "Pareto Front Plot"
desc = "The non-dominated front in objective space (first two objectives, or three in 3D)"
code = '''
using Plots
if size(front, 2) >= 3
    scatter3d(front[:, 1], front[:, 2], front[:, 3], xlabel="f1", ylabel="f2", zlabel="f3", ms=3, legend=false, title="Pareto front")
else
    scatter(front[:, 1], front[:, 2], xlabel="f1", ylabel="f2", ms=3, legend=false, title="Pareto front")
end
'''

[[actionGroups.actions]]
id = "convergence"
label = "Convergence Plot"
desc = "Hypervolume of the non-dominated set after each generation, with the final reference point: it rises quickly, then flattens as the front settles"
code = '''
using Plots
hvs = [hv(pareto_front(s)) for s in result.convergence]
plot(hvs, lw=2, xlabel="Generation", ylabel="Hypervolume", legend=false, title="Convergence")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "front-size"
label = "Front Statistics"
desc = "Size of the front, range of each objective, spacing (spread uniformity; 0 = evenly spaced) and constraint violations of the non-dominated solutions"
code = '''
(front_size = size(front, 1), objective_ranges = [(minimum(c), maximum(c)) for c in eachcol(front)],
 spacing = Ind.spacing([collect(r) for r in eachrow(front)]), all_feasible = all(s.is_feasible for s in sols),
 max_violation = maximum(s.sum_violations for s in sols), evaluations = result.f_calls)
'''

[[actionGroups.actions]]
id = "hypervolume"
label = "Hypervolume"
desc = "Hypervolume of the front and its variability over 5 independent runs (different seeds): a large spread means the result depends on luck"
code = '''
using Statistics
hvs = [hv(pareto_front(optimize(f, bounds, alg(s)))) for s in 1:5]
(hypervolume = hv(front), reference_point = refpoint, runs_mean = mean(hvs), runs_std = std(hvs))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "run-algorithm"
label = "Budget Sensitivity"
desc = "Hypervolume reached with different numbers of generations: how much a larger budget would still improve the front"
code = '''
using Plots
budgets = unique(round.(Int, {{iter}} .* [0.1, 0.25, 0.5, 1.0, 2.0]))
hvs = [hv(pareto_front(optimize(f, bounds, alg(1; iterations=b)))) for b in budgets]
plot(budgets, hvs, marker=:o, lw=2, xlabel="Generations", ylabel="Hypervolume", legend=false, title="Budget sensitivity")
'''

[[actionGroups.actions]]
id = "tradeoff"
label = "Trade-Off Rates"
desc = "Along a two-objective front: how much f2 worsens per unit improvement in f1 between neighbouring solutions (the marginal rate of substitution)"
code = '''
using Plots
size(front, 2) == 2 || error("Trade-off rates need exactly two objectives")
F = front[sortperm(front[:, 1]), :]
rate = -diff(F[:, 2]) ./ max.(diff(F[:, 1]), 1e-12)
plot((F[1:end-1, 1] .+ F[2:end, 1]) ./ 2, max.(rate, 1e-6), lw=2, yscale=:log10, xlabel="f1", ylabel="-df2 / df1", legend=false, title="Trade-off rate along the front")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-algorithms"
label = "Compare Algorithms"
desc = "NSGA-II, NSGA-III, SPEA2 and SMS-EMOA on the same problem, budget and seed: front size, hypervolume (common reference point), spacing and run time"
code = '''
runs = [(name, @timed optimize(f, bounds, A(N={{N}}, options=opts(1)))) for (name, A) in
        [("NSGA-II", NSGA2), ("NSGA-III", NSGA3), ("SPEA2", SPEA2), ("SMS-EMOA", SMS_EMOA)]]
fronts = [pareto_front(r.value) for (_, r) in runs]
common = (Fall = reduce(vcat, fronts); nadir(Fall) .+ 0.1 .* (nadir(Fall) .- ideal(Fall)))
[(algorithm = name, front_size = size(F, 1), hypervolume = hv(F, common), spacing = Ind.spacing([collect(r) for r in eachrow(F)]), seconds = round(r.time, digits=2))
 for ((name, r), F) in zip(runs, fronts)]
'''

[[actionGroups.actions]]
id = "igd-comparison"
label = "IGD Comparison"
desc = "Inverted generational distance of each algorithm's front to a reference front, the non-dominated union of all four (lower is closer and better spread)"
code = '''
fronts = [(name, pareto_front(optimize(f, bounds, A(N={{N}}, options=opts(1))))) for (name, A) in
          [("NSGA-II", NSGA2), ("NSGA-III", NSGA3), ("SPEA2", SPEA2), ("SMS-EMOA", SMS_EMOA)]]
U = reduce(vcat, last.(fronts))
nd = [i for i in axes(U, 1) if !any(all(U[j, :] .<= U[i, :]) && any(U[j, :] .< U[i, :]) for j in axes(U, 1))]
reference = U[nd, :]
[(algorithm = name, igd = Ind.igd(F, reference)) for (name, F) in fronts]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "decision-space"
label = "Decision Space"
desc = "The Pareto set: decision variables of the non-dominated solutions (first two), coloured by f1, and a table of five solutions spread along the front"
code = '''
using Plots
X = reduce(vcat, [transpose(get_position(s)) for s in sols]); Fv = reduce(vcat, [transpose(s.f) for s in sols])
o = sortperm(Fv[:, 1]); pick = o[unique(round.(Int, range(1, length(o), length=5)))]
display([(x = round.(X[i, :], digits=4), f = round.(Fv[i, :], digits=4)) for i in pick])
scatter(X[:, 1], size(X, 2) > 1 ? X[:, 2] : zeros(size(X, 1)), zcolor=Fv[:, 1], xlabel="x1", ylabel="x2", label=false, title="Pareto set (colour = f1)")
'''

[[actionGroups.actions]]
id = "knee"
label = "Compromise Point"
desc = "The compromise solution closest to the ideal point after scaling each objective to [0, 1]: a natural default when no preference is given"
code = '''
Fv = reduce(vcat, [transpose(s.f) for s in sols])
lo, hi = ideal(Fv), nadir(Fv)
d = [norm((Fv[i, :] .- lo) ./ max.(hi .- lo, 1e-12)) for i in axes(Fv, 1)]
k = argmin(d)
(x = get_position(sols[k]), f = sols[k].f, ideal = lo, nadir = hi, scaled_distance = d[k])
'''
