[[codeBranches]]
model = "nsga2"
code = '''
using Metaheuristics, LinearAlgebra, Random
Ind = Metaheuristics.PerformanceIndicators

f(x) = ({{obj}}, {{ineq}}, {{eq}})  # objectives (minimised), g(x) <= 0, h(x) = 0
bounds = {{bounds}}  # row 1: lower, row 2: upper
opts(seed=1; iterations={{iter}}) = Options(iterations=iterations, seed=seed, store_convergence=true)
alg(seed=1; N={{N}}, kw...) = NSGA2(N=N, options=opts(seed; kw...))  # crowding distance

result = optimize(f, bounds, alg())
front = pareto_front(result)  # one row per non-dominated objective vector
sols = Metaheuristics.get_non_dominated_solutions(result.population)
refpoint = nadir(front) .+ 0.1 .* (nadir(front) .- ideal(front))  # hypervolume reference: 10% beyond the nadir
hv(F, r=refpoint) = (keep = vec(all(F .< transpose(r), dims=2)); any(keep) ? Ind.hypervolume(F[keep, :], r; verbose=false) : 0.0)

(front_size = size(front, 1), ideal = ideal(front), nadir = nadir(front), hypervolume = hv(front), all_feasible = all(s.is_feasible for s in sols))
'''

