# Pareto-Based Multi-Objective Optimisation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/pbm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Pareto-Based Multi-Objective Optimisation"
viewType = "pollis.pbm"
defaultModel = "nsga2"

