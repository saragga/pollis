[[bullets]]
text = "NSGA-II"
detail = "fast non-dominated sorting with crowding distance; two- and three-objective problems"

[[bullets]]
text = "NSGA-III"
detail = "reference-point-based selection; many-objective problems with four or more objectives"

[[bullets]]
text = "SPEA2"
detail = "strength Pareto evolutionary algorithm with archive-based external population"

[[bullets]]
text = "SMS-EMOA"
detail = "hypervolume-based steady-state selection; maximises dominated hypervolume"

[[decisionRows]]
task = "NSGA-II"
context = "The default multi-objective evolutionary algorithm for two or three objectives, with or without constraints"
purpose = "Fast non-dominated sorting plus crowding distance: a well-spread approximation of the Pareto front at low cost. Default problem: Binh-Korn, two objectives and two nonlinear constraints"

[[decisionRows]]
task = "NSGA-III"
context = "Many objectives (four or more), where crowding distance no longer separates solutions"
purpose = "Replaces crowding with a set of reference directions, keeping an even spread across a high-dimensional front"

[[decisionRows]]
task = "SPEA2"
context = "Fronts with uneven density or when an external archive of elite solutions is wanted"
purpose = "Strength-based fitness with k-nearest-neighbour density and archive truncation, which preserves boundary solutions"

[[decisionRows]]
task = "SMS-EMOA"
context = "When the quality of the front is judged by hypervolume and evaluations are affordable"
purpose = "Steady-state selection that discards the solution contributing least hypervolume: usually the highest hypervolume, at a higher cost per generation"

[[inputs]]
id = "obj"
label = "Objectives"
tooltip = "Vector of objective expressions in x (all minimised), e.g. [x[1]^2 + x[2]^2, (x[1] - 1)^2 + x[2]^2]."
default = "[4x[1]^2 + 4x[2]^2, (x[1] - 5)^2 + (x[2] - 5)^2]"

[[inputs]]
id = "ineq"
label = "Inequality Constraints"
tooltip = "Vector of inequality constraints g(x) <= 0; use [0.0] for none."
default = "[(x[1] - 5)^2 + x[2]^2 - 25, 7.7 - (x[1] - 8)^2 - (x[2] + 3)^2]"

[[inputs]]
id = "eq"
label = "Equality Constraints"
tooltip = "Vector of equality constraints h(x) = 0; use [0.0] for none."
default = "[0.0]"

[[inputs]]
id = "bounds"
label = "Bounds"
tooltip = "2 x n matrix: first row lower bounds, second row upper bounds of the decision variables."
default = "[0.0 0.0; 5.0 3.0]"

[[inputs]]
id = "N"
label = "Population"
tooltip = "Number of individuals in the population. Typical: 100 to 300."
default = "100"

[[inputs]]
id = "iter"
label = "Iterations"
tooltip = "Number of generations. Typical: 200 to 500."
default = "250"

