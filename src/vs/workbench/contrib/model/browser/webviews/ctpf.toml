[[actionGroups.actions]]
id = "infer-topics"
label = "Infer Topics"
desc = "Topic mix of a new, unrated document and the users to recommend it to (cold start)"
code = '''
using TopicModelsVB

R     = {{ratings}}  # users x documents, positive integer ratings, 0 = unrated
docs  = {{corpus}}
words = [split(lowercase(replace(d, r"[^A-Za-z ]" => " "))) for d in docs]
vocab = sort(unique(reduce(vcat, words)))
key   = Dict(w => i for (i, w) in enumerate(vocab))
function mkdoc(ws, r)  # bag of words plus the readers (users) of the document and their ratings
    t = [key[w] for w in ws]; u = unique(t)
    Document(terms=u, counts=[count(==(i), t) for i in u], readers=findall(!iszero, r), ratings=Int.(r[findall(!iszero, r)]))
end
corp = Corpus([mkdoc(words[d], R[:, d]) for d in eachindex(docs)], vocab=vocab, users=string.(1:size(R, 1)))
# no fixcorp!: it can re-key users and drop documents, breaking the alignment with R

# CTPF has no predict: add the new document without readers and refit
new_doc = "text of a new unrated document"
new_ws  = filter(w -> haskey(key, w), split(lowercase(replace(new_doc, r"[^A-Za-z ]" => " "))))  # words outside the vocabulary are dropped
push!(corp.docs, mkdoc(new_ws, zeros(Int, size(R, 1))))
model = CTPF(corp, {{k}})
train!(model, iter={{iters}}, printelbo=false)

d = length(corp.docs)
topicdist(model, d)  # topic mix of the new document
model.drecs[d][1:min(10, end)]  # users to recommend it to, best first
'''

