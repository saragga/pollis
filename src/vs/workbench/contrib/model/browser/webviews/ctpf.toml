[[actionGroups.actions]]
id = "compare-k"
label = "Compare k Topics"
desc = "Perplexity and recall across different topic counts"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])
prepare!(crps, strip_punctuation | strip_case)
update_lexicon!(crps)
dtm   = DocumentTermMatrix(crps)

for k in [5, 10, 20, 50]  # sweep over topic counts
    model = CTPF(dtm.dtm, {{ratings}}, k)
    train!(model)
    println("k=", k, " perplexity=", perplexity(model))  # log perplexity per k
end
'''

[[actionGroups.actions]]
id = "ctpf-vs-lda"
label = "CTPF vs LDA"
desc = "Topic quality with and without user-rating signal"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])
prepare!(crps, strip_punctuation | strip_case)
update_lexicon!(crps)
dtm   = DocumentTermMatrix(crps)

lda  = LDA(dtm.dtm, {{k}})  # text-only topic model
ctpf = CTPF(dtm.dtm, {{ratings}}, {{k}})  # joint model with ratings
train!(lda)
train!(ctpf)

println("LDA perplexity:  ", perplexity(lda))  # text-only baseline
println("CTPF perplexity: ", perplexity(ctpf))  # joint model
'''

