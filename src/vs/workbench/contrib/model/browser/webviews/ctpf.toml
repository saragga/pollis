[[actionGroups.actions]]
id = "perplexity"
label = "Perplexity"
desc = "Held-out perplexity of the text: fit on half of each document, score the other half"
code = '''
using TopicModelsVB

R     = {{ratings}}  # users x documents, positive integer ratings, 0 = unrated
docs  = {{corpus}}
words = [split(lowercase(replace(d, r"[^A-Za-z ]" => " "))) for d in docs]
vocab = sort(unique(reduce(vcat, words)))
key   = Dict(w => i for (i, w) in enumerate(vocab))
function mkdoc(ws, r)  # bag of words plus the readers (users) of the document and their ratings
    t = [key[w] for w in ws]; u = unique(t)
    Document(terms=u, counts=[count(==(i), t) for i in u], readers=findall(!iszero, r), ratings=Int.(r[findall(!iszero, r)]))
end
corp = Corpus([mkdoc(words[d], R[:, d]) for d in eachindex(docs)], vocab=vocab, users=string.(1:size(R, 1)))
# no fixcorp!: it can re-key users and drop documents, breaking the alignment with R

# document completion: fit on the odd-position words, score the even-position words
corp = Corpus([mkdoc(words[d][1:2:end], R[:, d]) for d in eachindex(docs)], vocab=vocab, users=string.(1:size(R, 1)))
held = [[key[w] for w in ws[2:2:end]] for ws in words]
seen = Set(t for doc in corp.docs for t in doc.terms)  # words never fitted have no topic weight, so are not scored

function heldout_perplexity(pword)  # pword(d) = word distribution of document d
    ll, n = 0.0, 0
    for d in eachindex(held)
        t = filter(in(seen), held[d]); isempty(t) && continue
        ll += sum(log.(pword(d)[t])); n += length(t)
    end
    exp(-ll / n)  # lower is better
end
ctpf_pword(m) = d -> (q = transpose(m.alef ./ m.bet) * (m.gimel[d] ./ m.dalet); q ./ sum(q))  # E[beta] times E[theta_d], normalised

model = CTPF(corp, {{k}})
train!(model, iter={{iters}}, printelbo=false)
heldout_perplexity(ctpf_pword(model))  # held-out word perplexity
'''

[[actionGroups.actions]]
id = "recommendation-recall"
label = "Recommendation Recall"
desc = "Hold out one reader per document, train, and report the mean percentile rank of the held-out user among the users recommended for that document"
code = '''
using TopicModelsVB, Random, Statistics

R     = {{ratings}}  # users x documents, positive integer ratings, 0 = unrated
docs  = {{corpus}}
words = [split(lowercase(replace(d, r"[^A-Za-z ]" => " "))) for d in docs]
vocab = sort(unique(reduce(vcat, words)))
key   = Dict(w => i for (i, w) in enumerate(vocab))
function mkdoc(ws, r)  # bag of words plus the readers (users) of the document and their ratings
    t = [key[w] for w in ws]; u = unique(t)
    Document(terms=u, counts=[count(==(i), t) for i in u], readers=findall(!iszero, r), ratings=Int.(r[findall(!iszero, r)]))
end
corp = Corpus([mkdoc(words[d], R[:, d]) for d in eachindex(docs)], vocab=vocab, users=string.(1:size(R, 1)))
# no fixcorp!: it can re-key users and drop documents, breaking the alignment with R

# hold out one reader of each document with at least one (README method), then rank that user among the recommendations
Random.seed!(1)
test = Dict{Int, Int}()
for (d, doc) in enumerate(corp.docs)
    isempty(doc.readers) && continue
    i = rand(1:length(doc.readers))
    test[d] = doc.readers[i]
    deleteat!(doc.readers, i); deleteat!(doc.ratings, i)
end

function percentile_rank(model)  # 1 = held-out user ranked first for its document, 0.5 = random
    ranks = Float64[]
    for (d, u) in test
        nr = model.drecs[d]; length(nr) < 2 && continue
        push!(ranks, (length(nr) - findfirst(==(u), nr)) / (length(nr) - 1))
    end
    mean(ranks)
end

model = CTPF(corp, {{k}})
train!(model, iter={{iters}}, printelbo=false)
percentile_rank(model)  # mean percentile rank of the held-out users
'''

