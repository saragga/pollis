[[bullets]]
text = "CTPF"
detail = "joint model combining a topic model for document content with Poisson factorisation for user-item ratings"

[[bullets]]
text = "k topics"
detail = "number of latent topics shared between the document model and the recommendation model"

[[bullets]]
text = "TopicModels.jl"
detail = "Julia implementation of CTPF, LDA, CTM and related probabilistic topic models"

[[inputs]]
id = "corpus"
label = "Corpus"
tooltip = "Array of text documents (one per item), e.g. docs = [\"first doc\", \"second doc\"]"
default = "corpus"

[[inputs]]
id = "ratings"
label = "Ratings"
tooltip = "Sparse user-item rating matrix; rows = users, cols = items (documents)"
default = "ratings"

[[inputs]]
id = "k"
label = "Topics (k)"
tooltip = "Number of latent topics shared between the topic model and the rating model"
default = "10"

[[inputs]]
id = "iters"
label = "Iterations"
tooltip = "Number of variational EM training iterations"
default = "1000"

[[codeBranches]]
model = "main"
code = '''
using TopicModels, TextAnalysis  # 

crps   = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus from document array
prepare!(crps, strip_punctuation | strip_case)  # normalise text
update_lexicon!(crps)  # build vocabulary
dtm    = DocumentTermMatrix(crps)  # document-term matrix

model  = CTPF(dtm.dtm, {{ratings}}, {{k}})  # joint topic + Poisson model
train!(model, iter={{iters}})  # variational EM training

topicdist(model)  # topic-word distributions (k x V)
'''

