[[bullets]]
text = "Read"
detail = "<code>CSV.File</code> parses the whole file into typed columns in memory, inferring each column type and using several threads on large files"

[[bullets]]
text = "Write"
detail = "<code>CSV.write</code> saves any Tables.jl source, e.g. a named tuple of vectors, as a delimited text file"

[[bullets]]
text = "Stream Rows"
detail = "<code>CSV.Rows</code> iterates one row at a time with a reused buffer, so memory stays constant however large the file is"

[[bullets]]
text = "Chunks"
detail = "<code>CSV.Chunks</code> splits the file into byte ranges and parses them one at a time, for files too large to hold in memory at once"

[[bullets]]
text = "Query (DuckDB)"
detail = "DuckDB runs SQL on the file itself with <code>read_csv</code>, so only the rows and columns the query keeps reach Julia"

[[decisionRows]]
task = "Read"
context = "Fits in memory"
purpose = "Load the whole file as typed columns for analysis"

[[decisionRows]]
task = "Write"
context = "Any table"
purpose = "Export results for spreadsheets, other languages or archives"

[[decisionRows]]
task = "Stream Rows"
context = "Larger than memory"
purpose = "One pass over every row: counting, filtering, running totals"

[[decisionRows]]
task = "Chunks"
context = "Larger than memory"
purpose = "Process typed column blocks one at a time, then combine the results"

[[decisionRows]]
task = "Query (DuckDB)"
context = "Filter before loading"
purpose = "Select, filter, join or summarise with SQL, even on files larger than memory"

[[inputs]]
id = "path"
label = "File"
tooltip = "Path to the delimited file, relative to the Julia working directory or absolute. Files ending in .gz are decompressed automatically when reading. With the default, data.csv, reading first writes the airquality example from PollisDatasets to data.csv, unless the working directory has a data.csv already."
default = "data.csv"

[[inputs]]
id = "data"
label = "Data"
tooltip = "Variable name of the table to write: any Tables.jl source (e.g. a named tuple of vectors or a CSV.File). The default, data, writes the airquality example from PollisDatasets."
default = "data"
models = ["write"]

[[inputs]]
id = "delim"
label = "Delimiter"
tooltip = "Field separator. Auto detects comma, tab, semicolon or pipe from the first lines when reading, and writes commas."
kind = "select"
default = "auto"

[[inputs.options]]
value = "auto"
label = "auto"

[[inputs.options]]
value = ","
label = "comma"

[[inputs.options]]
value = ";"
label = "semicolon"

[[inputs.options]]
value = '\t'
label = "tab"

[[inputs.options]]
value = "|"
label = "pipe"

[[inputs]]
id = "header"
label = "Header"
tooltip = "Row holding the column names. With none, columns are named Column1, Column2, ... and the first row is data."
kind = "select"
default = "1"
models = ["read", "rows", "chunks", "duckdb"]

[[inputs.options]]
value = "1"
label = "row 1"

[[inputs.options]]
value = "false"
label = "none"

[[inputs]]
id = "missingstring"
label = "Missing Strings"
tooltip = "Comma-separated list of quoted strings that are read as missing, e.g. \"\", \"NA\", \"NULL\"."
default = '"", "NA"'
models = ["read", "rows", "chunks", "duckdb"]

[[inputs]]
id = "decimal"
label = "Decimal Mark"
tooltip = "Character separating the integer and fractional parts of numbers. A comma decimal mark needs a delimiter other than comma, usually semicolon."
kind = "select"
default = "."
models = ["read", "chunks", "duckdb"]
newRow = true

[[inputs.options]]
value = "."
label = "point (1.5)"

[[inputs.options]]
value = ","
label = "comma (1,5)"

[[inputs]]
id = "dateformat"
label = "Date Format"
tooltip = "Dates.DateFormat pattern for date columns, e.g. yyyy-mm-dd or dd/mm/yyyy. Columns that do not match are read as strings."
default = "yyyy-mm-dd"
models = ["read", "chunks"]

[[inputs]]
id = "ntasks"
label = "Chunks"
tooltip = "Number of byte ranges the file is split into. More chunks = less memory per chunk. Files too small to split are read as a single chunk."
default = "4"
models = ["chunks"]

[[inputs]]
id = "filter"
label = "Filter"
tooltip = "SQL condition on the rows, e.g. temp > 85 or month = 7 AND ozone IS NOT NULL. Without a header row, the columns are named column0, column1, ..."
default = "temp > 85"
models = ["duckdb"]

[[codeBranches]]
model = "read"
code = '''
using CSV, Tables

{{?path=data.csv}} using PollisDatasets  # curated example datasets
{{?path=data.csv}} # Example file: Chambers et al. (1983), daily air quality in New York, May to September 1973, with empty fields for 44 missing readings, written to data.csv in the working directory unless a data.csv is there already. Replace "data.csv" with your own file.
{{?path=data.csv}} isfile("data.csv") || CSV.write("data.csv", dataset("airquality"))

opts = (
{{?delim!=auto}}	delim = '{{delim}}',
	header = {{header}},
	missingstring = [{{missingstring}}],
	decimal = '{{decimal}}',
	dateformat = "{{dateformat}}",
)
file = CSV.File("{{path}}"; opts...)
tbl = Tables.columntable(file)  # named tuple of column vectors
println(length(file), " rows x ", length(tbl), " columns")
println(Tables.schema(file))
'''

[[codeBranches]]
model = "write"
code = '''
using CSV, Tables

{{?data=data}} using PollisDatasets  # curated example datasets
{{?data=data}} # Example data: Chambers et al. (1983), daily air quality in New York, May to September 1973, with 44 missing readings. Replace data with your own table.
{{?data=data}} data = dataset("airquality");  # datasetinfo("airquality") describes the columns

{{?delim=auto}}opts = (;)  # CSV.write uses commas by default
{{?delim!=auto}}opts = (delim = '{{delim}}',)
tbl = Tables.columntable({{data}})  # named tuple of column vectors, from any Tables.jl source
CSV.write("{{path}}", tbl; opts...)  # missing values are written as empty fields
println("Wrote ", length(first(tbl)), " rows x ", length(tbl), " columns to {{path}} (", filesize("{{path}}"), " bytes)")
'''

[[codeBranches]]
model = "rows"
code = '''
using CSV, Tables

{{?path=data.csv}} using PollisDatasets  # curated example datasets
{{?path=data.csv}} # Example file: Chambers et al. (1983), daily air quality in New York, May to September 1973, with empty fields for 44 missing readings, written to data.csv in the working directory unless a data.csv is there already. Replace "data.csv" with your own file.
{{?path=data.csv}} isfile("data.csv") || CSV.write("data.csv", dataset("airquality"))

opts = (
{{?delim!=auto}}	delim = '{{delim}}',
	header = {{header}},
	missingstring = [{{missingstring}}],
)
rows = CSV.Rows("{{path}}"; opts..., reusebuffer=true)  # untyped: every value is a string or missing
for (i, row) in enumerate(rows)
	i > 5 && break
	println(join((string(coalesce(Tables.getcolumn(row, j), "missing")) for j in 1:length(Tables.columnnames(row))), " | "))
end
println("Rows: ", count(_ -> true, rows))  # one pass in constant memory
tbl = Tables.columntable(CSV.File("{{path}}"; opts..., limit=1000))  # typed sample of the first 1000 rows, for the Next Steps
'''

[[codeBranches]]
model = "chunks"
code = '''
using CSV, Tables

{{?path=data.csv}} using PollisDatasets  # curated example datasets
{{?path=data.csv}} # Example file: Chambers et al. (1983), daily air quality in New York, May to September 1973, with empty fields for 44 missing readings, written to data.csv in the working directory unless a data.csv is there already. Replace "data.csv" with your own file.
{{?path=data.csv}} isfile("data.csv") || CSV.write("data.csv", dataset("airquality"))

opts = (
{{?delim!=auto}}	delim = '{{delim}}',
	header = {{header}},
	missingstring = [{{missingstring}}],
	decimal = '{{decimal}}',
	dateformat = "{{dateformat}}",
)
chunks = try
	CSV.Chunks("{{path}}"; opts..., ntasks={{ntasks}})  # each chunk is a typed CSV.File
catch  # too few rows to split
	[CSV.File("{{path}}"; opts...)]
end
sizes = [length(chunk) for chunk in chunks]  # replace length with your per-chunk computation, then combine
println("Chunks: ", length(sizes), ", rows per chunk: ", sizes, ", total: ", sum(sizes))
tbl = Tables.columntable(first(chunks))  # the first chunk, for the Next Steps
'''

[[codeBranches]]
model = "duckdb"
code = '''
using DuckDB, Tables

{{?path=data.csv}} using CSV, PollisDatasets  # curated example datasets
{{?path=data.csv}} # Example file: Chambers et al. (1983), daily air quality in New York, May to September 1973, with empty fields for 44 missing readings, written to data.csv in the working directory unless a data.csv is there already. Replace "data.csv" with your own file.
{{?path=data.csv}} isfile("data.csv") || CSV.write("data.csv", dataset("airquality"))

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
nulls = join(("'" * s * "'" for s in [{{missingstring}}]), ", ")  # the missing strings, in SQL
sql = """
SELECT *
FROM read_csv('{{path}}',
{{?delim!=auto}}	delim = '{{delim}}',
{{?header=false}}	header = false,
	decimal_separator = '{{decimal}}',
	nullstr = [$nulls])
WHERE {{filter}}
"""
tbl = Tables.columntable(DBInterface.execute(con, sql))  # named tuple of column vectors
println(length(first(tbl)), " rows x ", length(tbl), " columns")
println(Tables.schema(tbl))
'''

# Next Steps action groups
[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "preview-rows"
label = "Preview Rows"
desc = "The first 10 rows as an aligned text table"
code = '''
n = min(10, length(first(tbl)))
println(join(rpad.(string.(keys(tbl)), 14)))
for i in 1:n
	println(join(rpad.(string.(getindex.(values(tbl), i)), 14)))
end
'''

[[actionGroups.actions]]
id = "column-histograms"
label = "Column Histograms"
desc = "Histogram of every numeric column"
code = '''
using Plots

numeric = [n for n in keys(tbl) if nonmissingtype(eltype(tbl[n])) <: Real]
isempty(numeric) ? println("No numeric columns") :
	plot([histogram(collect(skipmissing(tbl[n])), title=string(n), legend=false) for n in numeric]...)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "schema-check"
label = "Schema Check"
desc = "Type and missing count per column, flagging text columns that look like numbers or dates"
code = '''
for (name, c) in pairs(tbl)
	T = nonmissingtype(eltype(c))
	v = collect(skipmissing(c))
	hint = ""
	if T <: AbstractString && !isempty(v)
		count(s -> tryparse(Float64, replace(s, "," => ".")) !== nothing, v) > 0.9 * length(v) && (hint = "  <- looks numeric: check the delimiter and decimal mark")
		count(s -> occursin(r"^\d{1,4}[-/.]\d{1,2}[-/.]\d{1,4}$", s), v) > 0.9 * length(v) && (hint = "  <- looks like dates: check the date format")
	end
	println(rpad(name, 16), rpad(T, 14), count(ismissing, c), " missing", hint)
end
'''

[[actionGroups.actions]]
id = "row-count-check"
label = "Row Count Check"
desc = "Lines in the file against rows parsed: a gap points to blank lines, quoted line breaks or footers"
models = ["read", "write", "rows", "chunks"]
code = '''
using CSV

lines  = countlines("{{path}}")
parsed = length(CSV.File("{{path}}"; opts...))
header = get(opts, :header, 1) === false ? 0 : 1  # header lines expected on top of the data rows
println("Lines in file: ", lines, ", rows parsed: ", parsed, ", header lines: ", header)
println(lines - parsed == header ? "One line per row, as expected" : "Difference of " * string(lines - parsed - header) * ": look for blank lines, quoted line breaks, comments or footers")
'''

[[actionGroups.actions]]
id = "strict-parse"
label = "Strict Parse"
desc = "Parse again with strict=true, stopping at the first value that does not fit its column type"
models = ["read", "write", "rows", "chunks"]
code = '''
using CSV

try
	CSV.File("{{path}}"; opts..., strict=true)
	println("Every value parsed cleanly with the inferred column types")
catch err
	println("First problem: ", sprint(showerror, err))
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "round-trip"
label = "Round-Trip Check"
desc = "Write the table to memory and read it back: do the values and column types survive?"
code = '''
using CSV, Tables

back = Tables.columntable(CSV.File(IOBuffer(sprint(io -> CSV.write(io, tbl)))))
for name in keys(tbl)
	same = haskey(back, name) && isequal(tbl[name], back[name])
	println(rpad(name, 16), same ? "identical" : "changed", "  ", eltype(tbl[name]), " -> ", haskey(back, name) ? eltype(back[name]) : "absent")
end
'''

[[actionGroups.actions]]
id = "reader-comparison"
label = "Reader Comparison"
desc = "Time CSV.File, CSV.Rows and CSV.Chunks on the same file"
models = ["read", "write", "rows", "chunks"]
code = '''
using CSV

readers = [
	"CSV.File"   => () -> CSV.File("{{path}}"; opts...),
	"CSV.Rows"   => () -> count(_ -> true, CSV.Rows("{{path}}"; opts..., reusebuffer=true)),
	"CSV.Chunks" => () -> sum(length, CSV.Chunks("{{path}}"; opts..., ntasks=4)),
]
for (name, f) in readers
	try
		f()  # first call compiles
		println(rpad(name, 12), round(1000 * @elapsed(f()), digits=1), " ms")
	catch
		println(rpad(name, 12), "not applicable (file too small to split)")
	end
end
println("Threads: ", Threads.nthreads(), " (start Julia with --threads=auto for parallel parsing)")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "column-summary"
label = "Column Summary"
desc = "Range and median of numeric columns; distinct values and the most frequent one for the rest"
code = '''
using Statistics, StatsBase

for (name, c) in pairs(tbl)
	v = collect(skipmissing(c))
	if isempty(v)
		println(rpad(name, 16), "all missing")
	elseif eltype(v) <: Real && !(eltype(v) <: Bool)
		println(rpad(name, 16), "min = ", minimum(v), "  median = ", median(v), "  max = ", maximum(v))
	else
		top = first(sort(collect(countmap(v)), by=last, rev=true))
		println(rpad(name, 16), length(unique(v)), " distinct, most frequent: ", first(top), " (", last(top), " times)")
	end
end
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-xlsx"
label = "Save as Excel Workbook"
desc = "Write the table to an .xlsx file next to the CSV"
code = '''
using XLSX

out = first(splitext("{{path}}")) * ".xlsx"
XLSX.writetable(out, tbl; overwrite=true)
println("Wrote ", out)
'''

[[actionGroups.actions]]
id = "save-gz"
label = "Save Compressed"
desc = "Stream the file row by row into a gzip-compressed copy"
models = ["read", "write", "rows", "chunks"]
code = '''
using CSV

out = "{{path}}.gz"
CSV.write(out, CSV.Rows("{{path}}"; opts..., reusebuffer=true); compress=true)
println("Wrote ", out, " (", round(100 * filesize(out) / filesize("{{path}}"), digits=1), "% of the original size)")
'''
