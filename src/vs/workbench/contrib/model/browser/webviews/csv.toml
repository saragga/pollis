[[models]]
id = "read"
label = "Read"

[[models]]
id = "write"
label = "Write"

[[models]]
id = "rows"
label = "Stream Rows"

[[models]]
id = "chunks"
label = "Chunks"

[[bullets]]
text = "Read"
detail = "<code>CSV.File</code> parses the whole file into typed columns in memory, inferring each column type and using several threads on large files"

[[bullets]]
text = "Write"
detail = "<code>CSV.write</code> saves any Tables.jl source, e.g. a named tuple of vectors, as a delimited text file"

[[bullets]]
text = "Stream Rows"
detail = "<code>CSV.Rows</code> iterates one row at a time with a reused buffer, so memory stays constant however large the file is"

[[bullets]]
text = "Chunks"
detail = "<code>CSV.Chunks</code> splits the file into byte ranges and parses them one at a time, for files too large to hold in memory at once"

[[decisionRows]]
task = "Read"
context = "Fits in memory"
purpose = "Load the whole file as typed columns for analysis"

[[decisionRows]]
task = "Write"
context = "Any table"
purpose = "Export results for spreadsheets, other languages or archives"

[[decisionRows]]
task = "Stream Rows"
context = "Larger than memory"
purpose = "One pass over every row: counting, filtering, running totals"

[[decisionRows]]
task = "Chunks"
context = "Larger than memory"
purpose = "Process typed column blocks one at a time, then combine the results"

[[inputs]]
id = "path"
label = "File"
tooltip = "Path to the delimited file, relative to the Julia working directory or absolute. Files ending in .gz are decompressed automatically when reading."
default = "data.csv"

[[inputs]]
id = "data"
label = "Data"
tooltip = "Variable name of the table to write: any Tables.jl source (e.g. a named tuple of vectors or a CSV.File)."
default = "data"
models = ["write"]

[[inputs]]
id = "delim"
label = "Delimiter"
tooltip = "Field separator. Auto detects comma, tab, semicolon or pipe from the first lines when reading, and writes commas."
kind = "select"
default = "auto"

[[inputs.options]]
value = "auto"
label = "auto"

[[inputs.options]]
value = ","
label = "comma"

[[inputs.options]]
value = ";"
label = "semicolon"

[[inputs.options]]
value = '\t'
label = "tab"

[[inputs.options]]
value = "|"
label = "pipe"

[[inputs]]
id = "header"
label = "Header"
tooltip = "Row holding the column names. With none, columns are named Column1, Column2, ... and the first row is data."
kind = "select"
default = "1"
models = ["read", "rows", "chunks"]

[[inputs.options]]
value = "1"
label = "row 1"

[[inputs.options]]
value = "false"
label = "none"

[[inputs]]
id = "missingstring"
label = "Missing Strings"
tooltip = "Comma-separated list of quoted strings that are read as missing, e.g. \"\", \"NA\", \"NULL\"."
default = '"", "NA"'
models = ["read", "rows", "chunks"]

[[inputs]]
id = "decimal"
label = "Decimal Mark"
tooltip = "Character separating the integer and fractional parts of numbers. A comma decimal mark needs a delimiter other than comma, usually semicolon."
kind = "select"
default = "."
models = ["read", "chunks"]
newRow = true

[[inputs.options]]
value = "."
label = "point (1.5)"

[[inputs.options]]
value = ","
label = "comma (1,5)"

[[inputs]]
id = "dateformat"
label = "Date Format"
tooltip = "Dates.DateFormat pattern for date columns, e.g. yyyy-mm-dd or dd/mm/yyyy. Columns that do not match are read as strings."
default = "yyyy-mm-dd"
models = ["read", "chunks"]

[[inputs]]
id = "ntasks"
label = "Chunks"
tooltip = "Number of byte ranges the file is split into. More chunks = less memory per chunk. Files too small to split are read as a single chunk."
default = "4"
models = ["chunks"]

