# Nonlinear Systems Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/nlin.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Nonlinear Systems"
viewType = "pollis.nlin"
defaultModel = "scalar"

[[packages]]
name = "NonlinearSolve.jl"
github = "https://github.com/SciML/NonlinearSolve.jl"

[requires]
packages = ["NonlinearSolve.jl", "ForwardDiff.jl", "Symbolics.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Newton's Method for One Equation"
file = "nlin/tutorial-01-newton.ipynb"
bundled = true
description = "Solve f(x) = 0 from a starting guess, read the return code and watch the residual shrink"

[[notebookSections.notebooks]]
name = "Bracketing Methods"
file = "nlin/tutorial-02-bracketing.ipynb"
bundled = true
description = "Bisection, false position, Brent and ITP: guaranteed convergence once a sign change is found"

[[notebookSections.notebooks]]
name = "Systems of Equations"
file = "nlin/tutorial-03-systems.ipynb"
bundled = true
description = "Newton, trust region, Levenberg-Marquardt and Broyden on several equations in several unknowns"

[[notebookSections.notebooks]]
name = "Exact Jacobians with Symbolics"
file = "nlin/tutorial-04-symbolic-jacobians.ipynb"
bundled = true
description = "Derive the Jacobian symbolically, compile it and pass it to the solver"

[[notebookSections.notebooks]]
name = "Equilibrium and Comparative Statics"
file = "nlin/tutorial-05-comparative-statics.ipynb"
bundled = true
description = "Solve a market equilibrium and use the implicit function theorem to see how it moves"

