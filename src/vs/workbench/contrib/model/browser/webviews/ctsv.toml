# Continuous-Time Stochastic Volatility Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/ctsv.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Continuous-Time Stochastic Volatility"
viewType = "pollis.ctsv"
defaultModel = "heston"

[[packages]]
name = "DiffEqFinancial.jl"
github = "https://github.com/SciML/DiffEqFinancial.jl"

[[packages]]
name = "QuantLib.jl"
github = "https://github.com/pazzo83/QuantLib.jl"

[requires]
packages = ["DiffEqFinancial.jl", "QuantLib.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Heston Model"
file = "ctsv/tutorial-01-heston.ipynb"
bundled = true
description = "Simulating asset paths under the Heston stochastic volatility model"

[[notebookSections.notebooks]]
name = "Bates Model"
file = "ctsv/tutorial-02-bates.ipynb"
bundled = true
description = "Stochastic volatility with jumps using the Bates model"

[[notebookSections.notebooks]]
name = "Implied Volatility Surface"
file = "ctsv/tutorial-03-implied-vol.ipynb"
bundled = true
description = "Constructing and visualising implied volatility surfaces"

[[notebookSections.notebooks]]
name = "Model Calibration"
file = "ctsv/tutorial-04-calibration.ipynb"
bundled = true
description = "Calibrating Heston and Bates parameters to market option prices"

[[wikis]]
name = "Overview"
