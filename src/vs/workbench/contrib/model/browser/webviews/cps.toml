[[inputs]]
id = "dim"
label = "Dimension (d)"
tooltip = "Dimension d — number of marginal variables modelled jointly. Must be an integer >= 2. For Elliptical and Archimedean copulas any d >= 2 is supported; bivariate-only families (Galambos, Hüsler–Reiss, tEV, Marshall–Olkin, W) are fixed at d = 2."
default = "2"
when = "family!=galambos|husler|tev|mo|lower-frechet"

[[inputs]]
id = "rho"
label = "Correlation (rho)"
tooltip = ""
default = "0.5"
when = "family=gaussian|studentt|tev"

[[inputs]]
id = "theta"
label = "Dependence (theta)"
tooltip = ""
default = "2.0"
when = "family=gumbel|clayton|frank|joe|amh|bb1|galambos|husler"

[[inputs]]
id = "nu"
label = "Deg. of Freedom (nu)"
tooltip = "Degrees of freedom nu > 0. For Student-t: lower values give heavier tails; as nu -> infinity it converges to Gaussian. For tEV: same parameter governs the extreme-value tail; lower nu increases tail dependence."
default = "4"
when = "family=studentt|tev"

[[inputs]]
id = "data"
label = "Data"
tooltip = ""
default = "data"
when = "family=empirical|beta-emp|bernstein|checkerboard|empirical-ev"

[[inputs]]
id = "delta"
label = "delta (shape)"
tooltip = "Second shape parameter delta for the BB1 copula (Joe–Clayton nesting). delta >= 1 controls the lower tail dependence strength independently of theta. BB1 nests Clayton (theta -> 0) and Gumbel (delta = 1) as special cases."
default = "2.0"
when = "family=bb1"

[[inputs]]
id = "lambda1"
label = "lambda1"
tooltip = ""
default = "1.0"
when = "family=mo"

[[inputs]]
id = "lambda2"
label = "lambda2"
tooltip = ""
default = "1.0"
when = "family=mo"

[[inputs]]
id = "lambda12"
label = "lambda12"
tooltip = ""
default = "0.5"
when = "family=mo"

[[inputs]]
id = "marginals"
label = "Marginal Distributions"
tooltip = "One marginal distribution per variable, comma-separated (one entry per dimension d). Choices: Normal, Uniform, LogNormal, Exponential, Beta, Gamma, Weibull, Pareto, TDist, Cauchy, Laplace, Gumbel, Frechet, GeneralizedExtremeValue, Poisson, NegativeBinomial."
default = "Normal(0.0, 1.0), Normal(0.0, 1.0)"
when = "family!=empirical|beta-emp|bernstein|checkerboard|empirical-ev"

[[inputs]]
id = "n-samples"
label = "Samples (n)"
tooltip = ""
default = "10_000"
when = "family!=empirical|beta-emp|bernstein|checkerboard|empirical-ev"

[[codeBranches]]
model = "main"
code = '''
{{?family=empirical|beta-emp|bernstein|checkerboard|empirical-ev}} using Copulas
{{?family=gaussian|studentt}} using Copulas, Distributions, LinearAlgebra
{{?family!=empirical|beta-emp|bernstein|checkerboard|empirical-ev|gaussian|studentt}} using Copulas, Distributions

{{?family=gaussian|studentt}} Sigma = {{rho}} .* ones({{dim}}, {{dim}}) + (1 - {{rho}}) .* I({{dim}})  # example equicorrelation matrix — replace with any valid p.s.d. Sigma
{{?family=gaussian}} C = GaussianCopula({{dim}}, Sigma)  # Gaussian copula
{{?family=studentt}} C = TCopula({{nu}}, Sigma)  # Student's t copula
{{?family=gumbel}} C = GumbelCopula({{dim}}, {{theta}})  # Gumbel copula (theta >= 1)
{{?family=clayton}} C = ClaytonCopula({{dim}}, {{theta}})  # Clayton copula (theta > 0)
{{?family=frank}} C = FrankCopula({{dim}}, {{theta}})  # Frank copula (theta != 0)
{{?family=joe}} C = JoeCopula({{dim}}, {{theta}})  # Joe copula (theta >= 1)
{{?family=amh}} C = AMHCopula({{dim}}, {{theta}})  # AMH copula (theta in [-1, 1))
{{?family=bb1}} C = BB1Copula({{dim}}, {{theta}}, {{delta}})  # BB1 copula (theta > 0, delta >= 1)
{{?family=galambos}} C = GalambosCopula({{theta}})  # Galambos copula (theta > 0), bivariate
{{?family=husler}} C = HuslerReissCopula({{theta}})  # Hüsler–Reiss copula, bivariate
{{?family=tev}} C = TEVCopula({{nu}}, {{rho}})  # extreme-t copula, bivariate
{{?family=mo}} C = MarshallOlkinCopula(2, [{{lambda1}}, {{lambda2}}, {{lambda12}}])  # Marshall–Olkin copula, bivariate
{{?family=empirical}} C = EmpiricalCopula({{data}})  # unsmoothed empirical copula
{{?family=beta-emp}} C = BetaCopula({{data}})  # beta-smoothed empirical copula
{{?family=bernstein}} C = BernsteinCopula({{data}})  # Bernstein polynomial copula
{{?family=checkerboard}} C = CheckerboardCopula({{data}})  # checkerboard copula
{{?family=empirical-ev}} C = EmpiricalEVCopula({{data}})  # empirical extreme-value copula
{{?family=upper-frechet}} C = MCopula({{dim}})  # upper Fréchet bound (comonotonicity)
{{?family=independence}} C = IndependenceCopula({{dim}})  # independence copula Pi
{{?family=lower-frechet}} C = WCopula()  # lower Fréchet bound, d = 2 only

{{?family!=empirical|beta-emp|bernstein|checkerboard|empirical-ev}} margs = ({{marginals}},)  # marginal distributions
{{?family!=empirical|beta-emp|bernstein|checkerboard|empirical-ev}} D = SklarDist(C, margs)  # multivariate Sklar distribution

{{?family!=empirical|beta-emp|bernstein|checkerboard|empirical-ev}} rand(D, {{n-samples}})  # sample n observations from the joint distribution
'''
