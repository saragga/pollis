# Expectations Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/exp.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Expectations"
viewType = "pollis.exp"
defaultModel = "main"

[[packages]]
name = "Expectations.jl"
github = "https://github.com/QuantEcon/Expectations.jl"

[requires]
packages = ["Expectations.jl", "Distributions.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Quick Start"
file = "exp/tutorial-01-quickstart.ipynb"
bundled = true
description = "Compute E[f(X)] for standard distributions using the expectation operator"

[[notebookSections.notebooks]]
name = "Distributions"
file = "exp/tutorial-02-distributions.ipynb"
bundled = true
description = "Normal, Gamma, Beta, Exponential, Uniform and ChiSq with automatic quadrature selection"

[[notebookSections.notebooks]]
name = "Quadrature Methods"
file = "exp/tutorial-03-quadrature.ipynb"
bundled = true
description = "Gauss-Hermite, Gauss-Laguerre and Gauss-Legendre quadrature in depth"

[[notebookSections.notebooks]]
name = "Mixture Models"
file = "exp/tutorial-04-mixtures.ipynb"
bundled = true
description = "Component-wise expectations and mixture weights via MixtureModel"

[[wikis]]
name = "Overview"
file = "exp/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "exp/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "exp/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "exp/diagnostics.md"
bundled = true

[[wikis]]
