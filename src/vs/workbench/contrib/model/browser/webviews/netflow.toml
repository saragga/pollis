[[bullets]]
text = "Maximum Flow"
detail = "find the maximum throughput from source to sink in a capacitated directed network using Dinic’s O(V²E) algorithm"

[[bullets]]
text = "Minimum Cost Flow"
detail = "route a required demand through a network while minimising total edge cost using successive shortest paths"

[[bullets]]
text = "Minimum Cut"
detail = "identify the bottleneck edge set whose removal disconnects source from sink, dual to maximum flow by the max-flow min-cut theorem"

[[inputs]]
id = "N"
label = "N (nodes)"
tooltip = "Number of nodes in the flow network. Source is node 1 and sink is node N."
default = "20"

[[inputs]]
id = "M"
label = "M (edges)"
tooltip = "Number of directed edges randomly added to the network. Denser graphs provide more routing options and generally support higher maximum flow."
default = "40"

[[inputs]]
id = "cap"
label = "cap (max capacity)"
tooltip = "Maximum capacity of each edge, drawn uniformly from [1, cap]. Higher values allow more flow on individual edges and increase the achievable maximum flow."
default = "10"

[[codeBranches]]
model = "maxflow"
code = '''
using Graphs, GraphsFlows

g   = DiGraph({{N}})  # directed flow network
cap_mat = zeros(Int, {{N}}, {{N}})  # capacity matrix

for _ in 1:{{M}}
    u, v = rand(1:{{N}}), rand(1:{{N}})
    u == v && continue
    add_edge!(g, u, v)
    cap_mat[u, v] += rand(1:{{cap}})  # random capacity
end

source, sink = 1, {{N}}  # source = node 1, sink = node N
flow_val, flow_mat = maximum_flow(g, source, sink, cap_mat)  # push-relabel (the default); flow_mat is antisymmetric: F[v, u] = -F[u, v]

println("Max flow value:  ", flow_val)  # total throughput
println("Edges with flow: ", count(flow_mat .> 0))  # active edges
println("Saturated edges: ", count(flow_mat .== cap_mat .&& cap_mat .> 0))  # bottleneck edges
'''

[[codeBranches]]
model = "mincost"
code = '''
using Graphs, GraphsFlows, HiGHS

g    = DiGraph({{N}})  # directed network
cap  = zeros(Int, {{N}}, {{N}})  # edge capacities
cost = zeros(Int, {{N}}, {{N}})  # edge costs

for _ in 1:{{M}}
    u, v = rand(1:{{N}}), rand(1:{{N}})
    u == v && continue
    add_edge!(g, u, v)
    cap[u, v]  += rand(1:{{cap}})
    cost[u, v]  = rand(1:5)
end

demand    = zeros(Int, {{N}})  # node demand vector
demand[1] = -10  # source supplies 10 units
demand[{{N}}] =  10  # sink consumes 10 units

flow_mat   = mincost_flow(g, demand, cap, cost, HiGHS.Optimizer)  # a linear programme; fails if 10 units cannot reach the sink
total_cost = sum(flow_mat .* cost)  # cost per unit times flow on every arc

println("Total cost:    ", total_cost)  # objective value
println("Flow edges:    ", count(flow_mat .> 0))  # edges carrying flow
println("Max edge flow: ", maximum(flow_mat))  # busiest edge
'''

[[codeBranches]]
model = "mincut"
code = '''
using Graphs, GraphsFlows

g       = DiGraph({{N}})  # directed network
cap_mat = zeros(Int, {{N}}, {{N}})  # capacity matrix

for _ in 1:{{M}}
    u, v = rand(1:{{N}}), rand(1:{{N}})
    u == v && continue
    add_edge!(g, u, v); cap_mat[u, v] += rand(1:{{cap}})
end

source, sink = 1, {{N}}  # source and sink
flow_val, flow_mat = maximum_flow(g, source, sink, cap_mat)  # max flow = min cut by duality

# source side of the minimum cut: nodes still reachable from the source in the residual network
S = Set([source]); stack = [source]
while !isempty(stack)
    u = pop!(stack)
    for v in 1:{{N}}
        if !(v in S) && cap_mat[u, v] - flow_mat[u, v] > 0  # residual capacity (reverse arcs of used flow included)
            push!(S, v); push!(stack, v)
        end
    end
end
cut_edges = [(u, v) for u in S for v in 1:{{N}} if !(v in S) && cap_mat[u, v] > 0]  # arcs from S to the rest: all saturated

println("Min cut value:    ", sum(cap_mat[u, v] for (u, v) in cut_edges; init=0), "  (max flow ", flow_val, ")")  # equal by duality
println("Cut edges:        ", length(cut_edges), " of ", count(cap_mat .> 0 .&& flow_mat .== cap_mat), " saturated edges")  # a saturated edge need not be in the cut
println("Source side:      ", sort(collect(S)))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "flow-network"
label = "Flow Network"
desc = "Draw the network with edge widths proportional to the fraction of capacity used"
code = '''
using Graphs, GraphsFlows, GraphMakie, GLMakie

g=DiGraph({{N}}); cap_mat=zeros(Int,{{N}},{{N}})
for _ in 1:{{M}}; u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue; add_edge!(g,u,v); cap_mat[u,v]+=rand(1:{{cap}}); end
flow_val, flow_mat = maximum_flow(g, 1, {{N}}, cap_mat)

edge_widths = [flow_mat[src(e), dst(e)] / max(cap_mat[src(e), dst(e)], 1) * 5 for e in edges(g)]  # width = flow fraction
fig, ax, p = graphplot(g, edge_width=edge_widths, arrow_show=true)
display(fig)
'''

[[actionGroups.actions]]
id = "capacity-bars"
label = "Capacity vs Flow"
desc = "Bar chart comparing edge capacity and actual flow to reveal slack and saturated edges"
code = '''
using Graphs, GraphsFlows, GLMakie

g=DiGraph({{N}}); cap_mat=zeros(Int,{{N}},{{N}})
for _ in 1:{{M}}; u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue; add_edge!(g,u,v); cap_mat[u,v]+=rand(1:{{cap}}); end
_, flow_mat = maximum_flow(g, 1, {{N}}, cap_mat)

active = [(u,v) for u in 1:{{N}} for v in 1:{{N}} if cap_mat[u,v]>0]  # edges with capacity
caps  = [cap_mat[u,v] for (u,v) in active]
flows = [flow_mat[u,v] for (u,v) in active]

fig,ax=Figure(),Axis(fig[1,1],xlabel="Edge index",ylabel="Units",title="Capacity vs Flow")
barplot!(ax, 1:length(active), caps,  label="Capacity", color=(:blue, 0.4))
barplot!(ax, 1:length(active), flows, label="Flow",     color=(:red,  0.7))
axislegend(ax); display(fig)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "bottleneck-edges"
label = "Bottleneck Edges"
desc = "List all edges whose flow equals their capacity: the minimum cut is among them, but a saturated edge need not be in the cut"
code = '''
using Graphs, GraphsFlows

g=DiGraph({{N}}); cap_mat=zeros(Int,{{N}},{{N}})
for _ in 1:{{M}}; u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue; add_edge!(g,u,v); cap_mat[u,v]+=rand(1:{{cap}}); end
flow_val, flow_mat = maximum_flow(g, 1, {{N}}, cap_mat)

bottleneck = [(u,v) for u in 1:{{N}} for v in 1:{{N}}  # saturated edges
    if cap_mat[u,v] > 0 && flow_mat[u,v] == cap_mat[u,v]]

println("Max flow:         ", flow_val)  # total throughput
println("Bottleneck count: ", length(bottleneck))  # number of saturated edges
println("Saturated edges: ", bottleneck)  # a superset of the minimum cut
'''

[[actionGroups.actions]]
id = "flow-conservation"
label = "Flow Conservation"
desc = "Verify that inflow equals outflow at every intermediate node"
code = '''
using Graphs, GraphsFlows

g=DiGraph({{N}}); cap_mat=zeros(Int,{{N}},{{N}})
for _ in 1:{{M}}; u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue; add_edge!(g,u,v); cap_mat[u,v]+=rand(1:{{cap}}); end
_, flow_mat = maximum_flow(g, 1, {{N}}, cap_mat)

for v in 2:{{N}}-1  # check every internal node
    inflow  = sum(max(flow_mat[u, v], 0) for u in 1:{{N}})  # flow_mat is antisymmetric: keep the positive entries
    outflow = sum(max(flow_mat[v, u], 0) for u in 1:{{N}})
    println("Node ", v, ":  in=", inflow, "  out=", outflow, "  ok=", inflow==outflow)
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "capacity-sweep"
label = "Capacity Sweep"
desc = "Scale edge capacities from 1x to 5x and plot the resulting maximum flow"
code = '''
using Graphs, GraphsFlows, GLMakie

g=DiGraph({{N}}); base_cap=zeros(Int,{{N}},{{N}})
for _ in 1:{{M}}; u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue; add_edge!(g,u,v); base_cap[u,v]+=rand(1:{{cap}}); end

multipliers = 1:5  # scale factor sweep
max_flows   = [maximum_flow(g, 1, {{N}}, m .* base_cap)[1] for m in multipliers]  # max flow per scale

fig,ax=Figure(),Axis(fig[1,1],xlabel="Capacity multiplier",ylabel="Max flow",title="Flow vs Capacity Scale")
scatterlines!(ax, multipliers, max_flows, color=:blue)
display(fig)
'''

[[actionGroups.actions]]
id = "density-sweep"
label = "Density Sweep"
desc = "Vary the number of edges M and measure the maximum achievable flow"
code = '''
using Graphs, GraphsFlows, GLMakie

edge_counts = 10:10:100  # sweep M
max_flows   = Float64[]  # store results

for m in edge_counts
    g=DiGraph({{N}}); cm=zeros(Int,{{N}},{{N}})
    for _ in 1:m; u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue; add_edge!(g,u,v); cm[u,v]+=rand(1:{{cap}}); end
    push!(max_flows, maximum_flow(g, 1, {{N}}, cm)[1])
end

fig,ax=Figure(),Axis(fig[1,1],xlabel="Number of edges M",ylabel="Max flow",title="Flow vs Graph Density")
scatterlines!(ax, collect(edge_counts), max_flows, color=:green)
display(fig)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "directed-vs-undirected"
label = "Directed vs Undirected"
desc = "Compare maximum flow on a directed vs undirected version of the same graph"
code = '''
using Graphs, GraphsFlows

gd  = DiGraph({{N}}); gu  = Graph({{N}})
cap_mat = zeros(Int,{{N}},{{N}})
for _ in 1:{{M}}
    u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue
    add_edge!(gd,u,v); add_edge!(gu,u,v); add_edge!(gu,v,u)
    cap_mat[u,v]+=rand(1:{{cap}}); cap_mat[v,u]=cap_mat[u,v]
end

fv_dir, _ = maximum_flow(gd, 1, {{N}}, cap_mat)  # directed: one-way edges
fv_und, _ = maximum_flow(gu, 1, {{N}}, cap_mat)  # undirected: both directions available

println("Directed max flow:   ", fv_dir)  # lower bound
println("Undirected max flow: ", fv_und)  # upper bound
println("Ratio:               ", round(fv_und / max(fv_dir,1); digits=2))  # benefit of bidirectional edges
'''

[[actionGroups.actions]]
id = "sparse-vs-dense"
label = "Sparse vs Dense"
desc = "Compare max flow on sparse (M = N) and dense (M = 4N) random networks with the same capacity budget"
code = '''
using Graphs, GraphsFlows

for (label, m) in [("Sparse (M=N)", {{N}}), ("Dense (M=4N)", 4*{{N}})]
    g=DiGraph({{N}}); cm=zeros(Int,{{N}},{{N}})
    for _ in 1:m; u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue; add_edge!(g,u,v); cm[u,v]+=rand(1:{{cap}}); end
    fv,_=maximum_flow(g,1,{{N}},cm)  # run max flow
    println(label, "  edges=", ne(g), "  max_flow=", fv)
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "network-utilisation"
label = "Network Utilisation"
desc = "Compute the fraction of total edge capacity used by the optimal flow"
code = '''
using Graphs, GraphsFlows

g=DiGraph({{N}}); cap_mat=zeros(Int,{{N}},{{N}})
for _ in 1:{{M}}; u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue; add_edge!(g,u,v); cap_mat[u,v]+=rand(1:{{cap}}); end
flow_val, flow_mat = maximum_flow(g, 1, {{N}}, cap_mat)

total_cap  = sum(cap_mat)  # total installed capacity
total_flow = sum(max.(flow_mat, 0))  # total flow across all edges (flow_mat is antisymmetric, so its plain sum is 0)
utilisation = total_flow / total_cap  # fraction of capacity used

println("Max flow:      ", flow_val)  # throughput
println("Total capacity: ", total_cap)  # installed capacity
println("Utilisation:   ", round(utilisation*100; digits=1), "%")  # efficiency
'''

[[actionGroups.actions]]
id = "bottleneck-sensitivity"
label = "Bottleneck Sensitivity"
desc = "Test how doubling each bottleneck edge capacity increases total max flow"
code = '''
using Graphs, GraphsFlows

g=DiGraph({{N}}); cap_mat=zeros(Int,{{N}},{{N}})
for _ in 1:{{M}}; u,v=rand(1:{{N}}),rand(1:{{N}}); u==v&&continue; add_edge!(g,u,v); cap_mat[u,v]+=rand(1:{{cap}}); end
base_flow, flow_mat = maximum_flow(g, 1, {{N}}, cap_mat)

bottleneck = [(u,v) for u in 1:{{N}} for v in 1:{{N}} if cap_mat[u,v]>0 && flow_mat[u,v]==cap_mat[u,v]]  # cut edges

for (u, v) in bottleneck
    new_cap = copy(cap_mat); new_cap[u,v] *= 2
    new_flow, _ = maximum_flow(g, 1, {{N}}, new_cap)
    gain = new_flow - base_flow
    println("Edge (", u, ",", v, ")  gain=", gain, "  new_flow=", new_flow)
end
'''
