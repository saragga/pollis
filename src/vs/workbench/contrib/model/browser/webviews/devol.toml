[[bullets]]
text = "Classic DE"
detail = "fixed scale factor F and crossover rate Cr"

[[bullets]]
text = "SHADE"
detail = "success-history based adaptive F and Cr with external archive"

[[bullets]]
text = "Adaptive DE"
detail = "self-adaptive parameters via JADE-style mechanism"

[[bullets]]
text = "epsilonDE"
detail = "epsilon-constrained DE; uses a tightening epsilon tolerance on constraint violations to guide feasibility without hard rejection"

[[decisionRows]]
task = "DE"
context = "Continuous box-constrained problems; a robust first try"
purpose = "DE/rand/1/bin: each trial vector adds a scaled difference of two random members to a third, then crosses over with the target; greedy selection"

[[decisionRows]]
task = "SHADE"
context = "When tuning F and CR by hand is impractical; competition-grade performance"
purpose = "Success-history adaptation: F and CR are sampled around memories updated from the settings that produced improvements, with current-to-pbest mutation and an archive"

[[decisionRows]]
task = "Adaptive DE"
context = "A light-weight self-adaptive alternative to SHADE"
purpose = "jDE: every individual carries its own F and CR, occasionally re-sampled; settings survive only when their trial vector wins"

[[decisionRows]]
task = "epsilonDE"
context = "Problems with inequality constraints g(x) <= 0"
purpose = "Epsilon-constrained DE: compares by objective while violations are below a tolerance epsilon, by violation otherwise, and shrinks epsilon to 0"

[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables. The default objective and bounds adapt to it."
default = "5"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, in terms of the vector x. Default: the Rastrigin function in any dimension (global minimum 0 at the origin)."
default = "10 * length(x) + sum(x .^ 2 .- 10 .* cos.(2pi .* x))"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds, one per variable."
default = "fill(-5.12, n)"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds, one per variable."
default = "fill(5.12, n)"

[[inputs]]
id = "pop"
label = "Population Size"
tooltip = "Number of candidate solutions (NP). Around 10n is typical; at least 4 (DE) or 5 (SHADE) are needed to pick distinct members."
default = "50"
newRow = true

[[inputs]]
id = "budget"
label = "Generations"
tooltip = "Number of generations. Each costs one objective evaluation per population member."
default = "300"

[[inputs]]
id = "F"
label = "Scale Factor (F)"
tooltip = "Weight of the difference vector. Around 0.5 to 0.9; small values converge fast but may stall."
default = "0.7"
models = ["de", "ede"]
newRow = true

[[inputs]]
id = "CR"
label = "Crossover Rate (CR)"
tooltip = "Probability each coordinate comes from the mutant. High values (0.9) suit non-separable problems, low values (0.1) separable ones."
default = "0.9"
models = ["de", "ede"]

[[inputs]]
id = "H"
label = "Memory Size (H)"
tooltip = "Number of (F, CR) memory slots SHADE keeps and cycles through."
default = "10"
models = ["shade"]
newRow = true

[[inputs]]
id = "pbest"
label = "p-best Fraction"
tooltip = "Mutation moves towards a random member of the best p fraction of the population. Smaller is greedier."
default = "0.1"
models = ["shade"]

[[inputs]]
id = "tau"
label = "Re-sampling Probability"
tooltip = "Probability that an individual draws a fresh F (in [0.1, 1]) and CR (in [0, 1]) before building its trial vector."
default = "0.1"
models = ["adaptive"]
newRow = true

[[inputs]]
id = "con"
label = "Constraints g(x) <= 0"
tooltip = "Julia vector of constraint functions that must be <= 0. Default: stay on or above the plane sum(x) = 1, which cuts off the unconstrained minimum at the origin."
default = "[1 - sum(x)]"
models = ["ede"]
newRow = true

[[inputs]]
id = "tc"
label = "Epsilon Horizon"
tooltip = "Fraction of the generations over which epsilon shrinks to 0; afterwards only feasible points can win on objective."
default = "0.5"
models = ["ede"]

