[[actionGroups.actions]]
id = "critical-coupling"
label = "Critical Coupling"
desc = "Estimate the critical coupling K_c from the algebraic connectivity of the network and compare with the current K"
code = '''
using Graphs, LinearAlgebra, Statistics

g      = barabasi_albert({{N}}, 3)  # contact network
omega  = randn({{N}}) .* {{gamma}}  # natural frequencies
L      = Float64.(Matrix(laplacian_matrix(g)))  # dense Laplacian
lambda2 = sort(eigvals(L))[2]  # algebraic connectivity (Fiedler value)

K_c = 2 * std(omega) / lambda2  # estimated critical coupling

println("Algebraic connectivity lambda_2: ", round(lambda2; digits=4))
println("Estimated K_c:                   ", round(K_c; digits=4))
println("Current K:                       ", {{beta}})
println("Status: K ", {{beta}} > K_c ? "above" : "below", " critical coupling")  # synchronisation verdict
'''

