using Graphs, LinearAlgebra, Statistics

sigma = {{gamma}}  # natural frequency spread
graphs = [("Erdos-Renyi", erdos_renyi({{N}}, 6/{{N}})), ("Barabasi-Albert", barabasi_albert({{N}}, 3)), ("Small-World", watts_strogatz({{N}}, 6, 0.1))]  # topology list

for (label, g) in graphs
    L       = Float64.(Matrix(laplacian_matrix(g)))
    lambda2 = sort(eigvals(L))[2]
    K_c = 2 * sigma / lambda2  # estimated critical coupling
    println(label, "  lambda_2=", round(lambda2;digits=3), "  K_c~=", round(K_c;digits=3))
end
'''

[[actionGroups.actions]]
id = "topology-cascade"
label = "Topology vs Cascade"
desc = "Compare mean cascade failure fractions on Erdos-Renyi and Barabasi-Albert networks with the same node count"
code = '''
using Graphs, Statistics

function mean_cascade(g, n=200)
    N = nv(g); total = 0.0
    for _ in 1:n
        loads=rand(N).*0.8; caps=ones(N); failed=Set{Int}()
        queue=collect(findall(loads.>caps)); union!(failed,queue)
        while !isempty(queue)
            v=popfirst!(queue); nbrs=[u for u in neighbors(g,v) if !(u in failed)]
            isempty(nbrs) && continue; share=loads[v]/length(nbrs)
            for u in nbrs; loads[u]+=share; loads[u]>caps[u] && (push!(failed,u);push!(queue,u)); end
            loads[v]=0.0
        end
        total += length(failed)/N
    end
    total/n
end

topologies = [("Erdos-Renyi", erdos_renyi({{N}}, 6/{{N}})), ("Barabasi-Albert", barabasi_albert({{N}}, 3))]  # two topologies
for (label, g) in topologies
    println(label, "  mean cascade: ", round(mean_cascade(g); digits=3))  # average fraction failed
end
'''

