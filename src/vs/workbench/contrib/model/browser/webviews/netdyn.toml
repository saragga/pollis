[[inputs]]
id = "N"
label = "N (nodes)"
tooltip = "Number of nodes in the Barabasi-Albert network. Larger networks show smoother synchronisation transitions but increase computation time."
default = "100"

[[inputs]]
id = "T"
label = "T (time)"
tooltip = "Integration time for Kuramoto dynamics. Use longer T to observe whether synchronisation persists. Not used by the discrete cascade model."
default = "50"

[[inputs]]
id = "beta"
label = "K (coupling)"
tooltip = "Coupling strength for Kuramoto oscillators: controls how strongly neighbours pull each other toward phase alignment. Above the critical K_c, global synchronisation emerges. Not used by the cascade model."
default = "0.3"

[[inputs]]
id = "gamma"
label = "sigma (freq.)"
tooltip = "Standard deviation of the Gaussian natural frequency distribution. Higher sigma means greater frequency diversity, requiring stronger K to synchronise. Not used by the cascade model."
default = "0.1"

[[codeBranches]]
model = "kuramoto"
code = '''
using Graphs, NetworkDynamics, OrdinaryDiffEq, Statistics, LinearAlgebra

g     = barabasi_albert({{N}}, 3)  # underlying network
omega = randn({{N}}) .* {{gamma}}  # natural frequencies (spread = sigma)

function kura_vertex!(dv, v, edges, p, t)
    idx = round(Int, p[1])
    K   = p[2]
    dv[1] = omega[idx] + K * sum(e[1] for e in edges; init=0.0)
end
function kura_edge!(de, e, v_src, v_dst, p, t)
    de[1] = sin(v_dst[1] - v_src[1])  # phase coupling
end

vf  = VertexModel(f=kura_vertex!, dim=1, sym=[:theta], pdim=2, psym=[:idx,:K])
ef  = EdgeModel(f=kura_edge!, dim=1, coupling=AntiSymmetric())
nd  = Network(g, vf, ef)

u0  = 2pi .* rand({{N}})  # random initial phases
p   = [(float(i), {{beta}}) for i in 1:{{N}}]  # per-node params: (index, K)
sol = solve(ODEProblem(nd, u0, (0.0, {{T}}), p), Tsit5())

r = abs(mean(exp.(im .* sol[end])))  # order parameter r at final time
println("Order parameter r: ", round(r; digits=3), "  (0=incoherent, 1=locked)")  # synchronisation result
'''

[[codeBranches]]
model = "cascade"
code = '''
using Graphs, Statistics

g          = barabasi_albert({{N}}, 3)  # scale-free network
loads      = rand({{N}}) .* 0.8  # initial loads in [0, 0.8]
capacities = ones({{N}})  # unit capacity at each node
failed     = Set{Int}()
queue      = collect(findall(loads .> capacities))  # nodes that fail at t=0
union!(failed, queue)

while !isempty(queue)
    v    = popfirst!(queue)
    nbrs = [u for u in neighbors(g, v) if !(u in failed)]
    isempty(nbrs) && continue
    share = loads[v] / length(nbrs)
    for u in nbrs
        loads[u] += share
        if loads[u] > capacities[u]
            push!(failed, u); push!(queue, u)
        end
    end
    loads[v] = 0.0
end

println("Nodes failed:    ", length(failed), " / ", {{N}})  # cascade size
println("Fraction failed: ", round(length(failed) / {{N}}; digits=3))  # systemic loss
'''

