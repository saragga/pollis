[[actionGroups.actions]]
id = "coupling-sweep"
label = "Coupling Sweep"
desc = "Sweep coupling strength K and plot the final order parameter r to locate the synchronisation transition"
code = '''
using Graphs, NetworkDynamics, OrdinaryDiffEq, Statistics, GLMakie

g     = barabasi_albert({{N}}, 3)  # fixed network topology
omega = randn({{N}}) .* {{gamma}}  # fixed natural frequencies

function kv!(dv,v,edges,p,t); dv[1]=omega[round(Int,p[1])]+p[2]*sum(e[1] for e in edges;init=0.0); end
function ke!(de,e,s,d,p,t); de[1]=sin(d[1]-s[1]); end
vf=VertexModel(f=kv!,dim=1,sym=[:theta],pdim=2,psym=[:idx,:K]); ef=EdgeModel(f=ke!,dim=1,coupling=AntiSymmetric())
nd=Network(g,vf,ef)

Ks     = 0.0:0.05:1.5  # coupling sweep range
r_vals = Float64[]  # final order parameter per K
for K_val in Ks
    u0 = 2pi .* rand({{N}}); p = [(float(i), K_val) for i in 1:{{N}}]
    sol = solve(ODEProblem(nd, u0, (0.0, {{T}}), p), Tsit5())
    push!(r_vals, abs(mean(exp.(im .* sol[end]))))
end

fig,ax=Figure(),Axis(fig[1,1],xlabel="K (coupling)",ylabel="r (order parameter)",title="Synchronisation Transition",limits=(nothing,(0,1)))
lines!(ax, collect(Ks), r_vals, color=:purple)
hlines!(ax, [0.5], linestyle=:dash, color=:gray)
display(fig)
'''

[[actionGroups.actions]]
id = "load-sweep"
label = "Load Threshold Sweep"
desc = "Vary the initial load ceiling and plot mean cascade fraction to identify the critical load at which cascades become systemic"
code = '''
using Graphs, Statistics, GLMakie

function cascade_frac(g, lmax, n=100)
    N = nv(g); total = 0.0
    for _ in 1:n
        loads = rand(N) .* lmax; caps = ones(N)
        failed = Set{Int}(); queue = collect(findall(loads .> caps)); union!(failed, queue)
        while !isempty(queue)
            v=popfirst!(queue); nbrs=[u for u in neighbors(g,v) if !(u in failed)]
            isempty(nbrs) && continue; share=loads[v]/length(nbrs)
            for u in nbrs; loads[u]+=share; loads[u]>caps[u] && (push!(failed,u);push!(queue,u)); end
            loads[v]=0.0
        end
        total += length(failed) / N
    end
    total / n
end

g = barabasi_albert({{N}}, 3)  # scale-free network
ceilings = 0.5:0.05:1.0  # sweep initial load ceiling
fracs    = [cascade_frac(g, lmax) for lmax in ceilings]  # mean cascade per level

fig,ax=Figure(),Axis(fig[1,1],xlabel="Initial load ceiling",ylabel="Mean fraction failed",title="Cascade Load Threshold")
lines!(ax, collect(ceilings), fracs, color=:red)
display(fig)
'''

