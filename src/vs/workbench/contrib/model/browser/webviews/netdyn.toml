[[actionGroups.actions]]
id = "order-parameter"
label = "Order Parameter"
desc = "Plot the Kuramoto synchronisation order parameter r(t) over time to observe the transition to coherence"
code = '''
using Graphs, NetworkDynamics, OrdinaryDiffEq, Statistics, GLMakie

g=barabasi_albert({{N}},3); omega=randn({{N}}).*{{gamma}}
function kv!(dv,v,edges,p,t); dv[1]=omega[round(Int,p[1])]+p[2]*sum(e[1] for e in edges;init=0.0); end
function ke!(de,e,s,d,p,t); de[1]=sin(d[1]-s[1]); end
vf=VertexModel(f=kv!,dim=1,sym=[:theta],pdim=2,psym=[:idx,:K]); ef=EdgeModel(f=ke!,dim=1,coupling=AntiSymmetric())
nd=Network(g,vf,ef); u0=2pi.*rand({{N}}); p=[(float(i),{{beta}}) for i in 1:{{N}}]
sol=solve(ODEProblem(nd,u0,(0.0,{{T}}),p),Tsit5())

r_t = [abs(mean(exp.(im.*sol(t)))) for t in sol.t]  # order parameter over time
fig,ax=Figure(),Axis(fig[1,1],xlabel="Time",ylabel="r",title="Kuramoto Order Parameter",limits=(nothing,(0,1)))
lines!(ax, sol.t, r_t, color=:purple)
hlines!(ax, [1.0], linestyle=:dash, color=:gray)
display(fig)
'''

[[actionGroups.actions]]
id = "cascade-distribution"
label = "Cascade Distribution"
desc = "Run 200 cascade trials and plot the histogram of final failure fractions across random load initialisations"
code = '''
using Graphs, Statistics, GLMakie

g = barabasi_albert({{N}}, 3)  # scale-free network
sizes = Float64[]  # failure fractions

for _ in 1:200
    loads = rand({{N}}) .* 0.8; caps = ones({{N}}); failed = Set{Int}()
    queue = collect(findall(loads .> caps)); union!(failed, queue)
    while !isempty(queue)
        v=popfirst!(queue); nbrs=[u for u in neighbors(g,v) if !(u in failed)]
        isempty(nbrs) && continue; share=loads[v]/length(nbrs)
        for u in nbrs; loads[u]+=share; loads[u]>caps[u] && (push!(failed,u); push!(queue,u)); end
        loads[v]=0.0
    end
    push!(sizes, length(failed)/{{N}})
end

fig,ax=Figure(),Axis(fig[1,1],xlabel="Fraction failed",ylabel="Count",title="Cascade Size Distribution")
hist!(ax, sizes, bins=20, color=:red, strokewidth=1)
display(fig)
'''

