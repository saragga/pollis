[[actionGroups.actions]]
id = "sync-state"
label = "Synchronisation State"
desc = "Run Kuramoto and interpret the order parameter r: incoherent, partially synchronised, or locked"
code = '''
using Graphs, NetworkDynamics, OrdinaryDiffEq, Statistics, LinearAlgebra

g=barabasi_albert({{N}},3); omega=randn({{N}}).*{{gamma}}
function kv!(dv,v,edges,p,t); dv[1]=omega[round(Int,p[1])]+p[2]*sum(e[1] for e in edges;init=0.0); end
function ke!(de,e,s,d,p,t); de[1]=sin(d[1]-s[1]); end
vf=VertexModel(f=kv!,dim=1,sym=[:theta],pdim=2,psym=[:idx,:K]); ef=EdgeModel(f=ke!,dim=1,coupling=AntiSymmetric())
nd=Network(g,vf,ef); u0=2pi.*rand({{N}}); p=[(float(i),{{beta}}) for i in 1:{{N}}]
sol=solve(ODEProblem(nd,u0,(0.0,{{T}}),p),Tsit5())

r = abs(mean(exp.(im .* sol[end])))  # order parameter
L = Float64.(Matrix(laplacian_matrix(g)))  # dense Laplacian
lambda2 = sort(eigvals(L))[2]  # Fiedler value
K_c = 2 * std(omega) / lambda2  # estimated critical coupling

println("r = ", round(r;digits=3), "   K_c ~ ", round(K_c;digits=3))
if r > 0.85
    println("State: synchronised -- oscillators are globally phase-locked")  # K well above K_c
elseif r > 0.4
    println("State: partial sync -- coherent clusters are forming")  # near-critical regime
else
    println("State: incoherent -- K is likely below K_c")  # K below threshold
end
'''

[[actionGroups.actions]]
id = "cascade-resilience"
label = "Cascade Resilience"
desc = "Test which node removal triggers the largest cascade by targeting the five highest-betweenness hub nodes"
code = '''
using Graphs, Statistics

g  = barabasi_albert({{N}}, 3)  # network
bc = betweenness_centrality(g)  # betweenness centrality
top5 = partialsortperm(bc, 1:5, rev=true)  # top-5 hub nodes

for target in top5
    loads = rand({{N}}).*0.8; caps=ones({{N}}); failed=Set{Int}()
    push!(failed, target); loads[target]=caps[target]+1.0
    queue=[target]
    while !isempty(queue)
        v=popfirst!(queue); nbrs=[u for u in neighbors(g,v) if !(u in failed)]
        isempty(nbrs)&&continue; share=loads[v]/length(nbrs)
        for u in nbrs; loads[u]+=share; loads[u]>caps[u]&&(push!(failed,u);push!(queue,u)); end
        loads[v]=0.0
    end
    println("Node ", target, "  bc=", round(bc[target];digits=3), "  cascade=", round(length(failed)/{{N}};digits=3))  # cascade fraction
end
'''
