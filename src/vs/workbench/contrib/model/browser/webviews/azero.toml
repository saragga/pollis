[[bullets]]
text = "Self-Play"
detail = "the current network plays against itself to generate a game history; Monte Carlo Tree Search guides action selection and produces improved policy targets stronger than the raw network output (AlphaZero.jl)"

[[bullets]]
text = "Monte Carlo Tree Search (MCTS)"
detail = "at each position expands a search tree for a fixed number of simulations; visit counts are converted to a policy distribution used as the training target for the policy head (AlphaZero.jl)"

[[bullets]]
text = "Network Training"
detail = "the shared policy-value network is trained on sampled positions from the replay buffer to match the MCTS policy and the game outcome; iterated until convergence (AlphaZero.jl, Flux.jl)"

