[[codeBranches]]
model = "alphazero"
code = '''
using Flux, Distributions, Random, Statistics

game = "{{game}}"  # tictactoe or connect4
niters = {{niters}}  # training iterations
nsims = {{nsims}}  # MCTS simulations per move
ngames = {{ngames}}  # self-play games per iteration
cpuct = {{cpuct}}  # exploration constant of the PUCT rule
hidden = {{hidden}}  # hidden units of the policy-value network
lr = {{lr}}  # Adam learning rate
seed = {{seed}}  # random seed

# Boards are stored from the view of the player to move: +1 own stones, -1 opponent's
const ROWS, COLS, K = game == "tictactoe" ? (3, 3, 3) : (6, 7, 4)  # board size and line length to win
const NA = game == "tictactoe" ? ROWS * COLS : COLS  # actions: cells (tic-tac-toe) or columns (Connect Four)
cell(r, c) = (r - 1) * COLS + c
legal(b) = NA == length(b) ? b .== 0 : BitVector([b[cell(1, c)] == 0 for c in 1:COLS])
landing(b, a) = NA == length(b) ? a : cell(findlast(r -> b[cell(r, a)] == 0, 1:ROWS), a)  # stones drop in Connect Four

function wins(b, i)  # does the stone at cell i complete K in a row?
    r, c = divrem(i - 1, COLS) .+ 1
    for (dr, dc) in ((0, 1), (1, 0), (1, 1), (1, -1))
        n = 1
        for s in (1, -1)
            rr, cc = r + s * dr, c + s * dc
            while 1 <= rr <= ROWS && 1 <= cc <= COLS && b[cell(rr, cc)] == b[i]
                n += 1; rr += s * dr; cc += s * dc
            end
        end
        n >= K && return true
    end
    false
end

function play(b, a)  # next board (seen by the opponent) and the outcome for the mover (nothing if the game goes on)
    b2 = copy(b); i = landing(b, a); b2[i] = 1
    wins(b2, i) && return (-b2, 1f0)
    all(!=(0), b2) && return (-b2, 0f0)
    (-b2, nothing)
end

# Policy-value network: board planes in, action logits and a value out
encode(b) = Float32.(vcat(b .== 1, b .== -1))
make_net() = Chain(Dense(2 * ROWS * COLS => hidden, relu), Dense(hidden => hidden, relu), Dense(hidden => NA + 1))

function rollout(b, rng)  # random playout value for the player to move (pure MCTS)
    sgn = 1f0
    while true
        b, z = play(b, rand(rng, findall(legal(b))))
        z === nothing || return sgn * z
        sgn = -sgn
    end
end

function evaluate(net, b, rng)  # prior over legal actions and value for the player to move
    m = legal(b)
    net === nothing && return (Float32.(m) ./ sum(m), rollout(b, rng))
    out = net(encode(b))
    logits = ifelse.(m, out[1:NA], -Inf32)
    p = exp.(logits .- maximum(logits))
    (p ./ sum(p), tanh(out[end]))
end

# Monte Carlo Tree Search with the PUCT rule
mutable struct Node
    P::Vector{Float32}  # prior from the network
    N::Vector{Int}  # visit counts
    W::Vector{Float32}  # total backed-up value
    mask::BitVector  # legal actions
end

function simulate!(tree, net, b, rng)  # one simulation; returns the value for the player to move at b
    node = get(tree, b, nothing)
    if node === nothing  # leaf: expand with the network (or a rollout)
        p, v = evaluate(net, b, rng)
        tree[b] = Node(p, zeros(Int, NA), zeros(Float32, NA), legal(b))
        return v
    end
    sq = sqrt(sum(node.N) + 1)
    best, a = -Inf32, 0
    for j in findall(node.mask)
        q = node.N[j] == 0 ? 0f0 : node.W[j] / node.N[j]
        u = q + cpuct * node.P[j] * sq / (1 + node.N[j])
        u > best && ((best, a) = (u, j))
    end
    b2, z = play(b, a)
    v = z === nothing ? -simulate!(tree, net, b2, rng) : z
    node.N[a] += 1; node.W[a] += v
    v
end

function search(net, b, rng; sims=nsims, noise=false)
    tree = Dict{Vector{Int}, Node}()
    simulate!(tree, net, b, rng)  # expand the root
    idx = findall(tree[b].mask)
    if noise && length(idx) > 1  # Dirichlet noise on the root priors keeps self-play exploring
        P = tree[b].P
        P[idx] .= 0.75f0 .* P[idx] .+ 0.25f0 .* Float32.(rand(rng, Dirichlet(length(idx), 0.3)))
    end
    for _ in 1:sims
        simulate!(tree, net, b, rng)
    end
    tree
end
visits(tree, b) = tree[b].N ./ sum(tree[b].N)  # improved policy = visit distribution at the root

function self_play(net, rng; tempmoves=game == "tictactoe" ? 2 : 8)
    b = zeros(Int, ROWS * COLS); states = Vector{Int}[]; pis = Vector{Float32}[]
    while true
        pv = Float32.(visits(search(net, b, rng; noise=true), b))
        push!(states, b); push!(pis, pv)
        a = length(states) <= tempmoves ? findfirst(cumsum(pv) .>= rand(rng) * sum(pv)) : argmax(pv)  # sample early moves
        b, z = play(b, a)
        if z !== nothing  # outcome for the last mover, sign alternating back through the game
            L = length(states)
            return states, pis, Float32[iseven(L - t) ? z : -z for t in 1:L]
        end
    end
end

# Players map (board, rng) to an action
random_player() = (b, rng) -> rand(rng, findall(legal(b)))
mcts_player(net; sims=nsims) = (b, rng) -> argmax(visits(search(net, b, rng; sims=sims), b))
policy_player(net) = (b, rng) -> argmax(evaluate(net, b, rng)[1])  # raw network, no search

function match(p1, p2; games=20, randomstart=1, rng=MersenneTwister(seed + 1))  # p1 moves first in odd games
    w = d = l = 0
    for g in 1:games
        players = isodd(g) ? (p1, p2) : (p2, p1); me = isodd(g) ? 1 : 2
        b = zeros(Int, ROWS * COLS); turn = 1; ply = 0
        while true
            ply += 1
            a = ply <= randomstart ? rand(rng, findall(legal(b))) : players[turn](b, rng)  # random opening varies the games
            b, z = play(b, a)
            if z !== nothing
                z == 0 ? (d += 1) : (turn == me ? (w += 1) : (l += 1))
                break
            end
            turn = 3 - turn
        end
    end
    (win = w / games, draw = d / games, loss = l / games)
end

function train(; niters=niters, ngames=ngames, seed=seed, window=4, epochs=4, batch=64)
    rng = MersenneTwister(seed); Random.seed!(seed)
    net = make_net(); opt = Flux.setup(Adam(lr), net)
    buffer = []  # self-play data of the latest iterations
    hist = (iter = Int[], policy_loss = Float64[], value_loss = Float64[], win_random = Float64[], samples = Int[])
    checkpoints = [deepcopy(net)]  # checkpoints[k + 1] = network after iteration k
    for it in 1:niters
        S, P, Z = Vector{Int}[], Vector{Float32}[], Float32[]
        for g in 1:ngames
            s, p, z = self_play(net, rng); append!(S, s); append!(P, p); append!(Z, z)
        end
        push!(buffer, (S, P, Z)); length(buffer) > window && popfirst!(buffer)
        X = reduce(hcat, [encode(s) for d in buffer for s in d[1]])
        Pm = reduce(hcat, [p for d in buffer for p in d[2]])
        Zv = reduce(vcat, [d[3] for d in buffer])
        for e in 1:epochs, idx in Iterators.partition(randperm(rng, length(Zv)), batch)
            gs = Flux.gradient(net) do m
                out = m(X[:, idx])
                Flux.logitcrossentropy(out[1:NA, :], Pm[:, idx]) + Flux.mse(tanh.(out[end, :]), Zv[idx])
            end
            Flux.update!(opt, net, gs[1])
        end
        out = net(X)
        push!(hist.iter, it); push!(hist.samples, length(Zv))
        push!(hist.policy_loss, Flux.logitcrossentropy(out[1:NA, :], Pm)); push!(hist.value_loss, Flux.mse(tanh.(out[end, :]), Zv))
        push!(hist.win_random, match(mcts_player(net), random_player(); games=20).win)
        push!(checkpoints, deepcopy(net))
    end
    (net = net, hist = hist, checkpoints = checkpoints)
end

show_board(b, mover) = [b[cell(r, c)] * mover == 1 ? 'X' : b[cell(r, c)] * mover == -1 ? 'O' : '.' for r in 1:ROWS, c in 1:COLS]  # mover = 1 when X is to move

function greedy_game(net, rng)  # one game of the trained player against itself
    b = zeros(Int, ROWS * COLS); mover = 1; states = [b]; moves = Int[]
    while true
        a = argmax(visits(search(net, b, rng), b)); push!(moves, a)
        b, z = play(b, a); mover = -mover; push!(states, b)
        z === nothing || return (moves = moves, states = states, final = show_board(b, mover), outcome = z == 0 ? "draw" : (mover == -1 ? "X wins" : "O wins"))
    end
end

res = train()  # self-play training
(win_rate_vs_random = res.hist.win_random[end], policy_loss = round(res.hist.policy_loss[end], digits=3), value_loss = round(res.hist.value_loss[end], digits=3), samples = res.hist.samples[end])
'''

