[[inputs]]
id = "f"
label = "Drift f(X,t)"
tooltip = "Julia expression for the drift function f(X, p, t). Example: -0.5*X for mean-reversion, 0.5*X for geometric growth."
default = "-0.5*X"

[[inputs]]
id = "sigma"
label = "Noise sigma"
tooltip = "Constant noise strength sigma. The diffusion term is g(X, p, t) = sigma (independent of state)."
default = "0.3"
models = ["add"]

[[inputs]]
id = "g"
label = "Diffusion g(X,t)"
tooltip = "Julia expression for the diffusion function g(X, p, t). Example: 0.2*X for multiplicative (geometric BM) noise."
default = "0.2*X"
models = ["mul", "strat"]

[[inputs]]
id = "solver"
label = "Solver"
tooltip = "StochasticDiffEq.jl solver. Fixed-step solvers require a step size dt; adaptive solvers choose dt automatically. Strong order controls pathwise accuracy; weak order controls distribution accuracy."
kind = "select"
newRow = true

[[inputs.options]]
value = "SRIW1"
label = "SRIW1 (Adaptive, Strong 3/2)"
models = ["mul"]

[[inputs.options]]
value = "EM"
label = "EM (Fixed Step, Strong 1/2)"
models = ["add", "mul"]

[[inputs.options]]
value = "LambaEM"
label = "LambaEM (Adaptive, Strong 1/2)"
models = ["add", "mul"]

[[inputs.options]]
value = "SRA1"
label = "SRA1 (Fixed Step, Weak 2)"
models = ["add"]

[[inputs.options]]
value = "SOSRA2"
label = "SOSRA2 (Adaptive, Weak 2)"
models = ["add"]

[[inputs.options]]
value = "RKMil"
label = "RKMil (Fixed Step, Strong 1)"
models = ["mul"]

[[inputs.options]]
value = "EulerHeun"
label = "EulerHeun (Fixed Step, Order 1)"
models = ["strat"]

[[inputs.options]]
value = "LambaEulerHeun"
label = "LambaEulerHeun (Adaptive, Order 1)"
models = ["strat"]

[[inputs.options]]
value = "RKMilCommute"
label = "RKMilCommute (Fixed Step, Order 1)"
models = ["strat"]

[[inputs]]
id = "X0"
label = "Initial state X0"
tooltip = "Initial condition X0. Use a scalar for a 1D SDE or a vector for a system of SDEs."
default = "1.0"

[[inputs]]
id = "T"
label = "Time span T"
tooltip = "End time T of the simulation. The time span is (0.0, T)."
default = "10.0"

[[inputs]]
id = "dt"
label = "Step size dt"
tooltip = "Fixed time step used by the selected solver. Smaller values improve accuracy at higher compute cost. Not needed for adaptive solvers."
default = "0.01"
when = "solver!=LambaEM|SOSRA2|SRIW1|LambaEulerHeun"

[[codeBranches]]
model = "add"
code = '''
using StochasticDiffEq  # additive-noise Ito SDE: dX = f(X,t) dt + sigma dW

f(X, p, t) = {{f}}  # drift function
g(X, p, t) = {{sigma}}  # constant diffusion: additive noise strength sigma = {{sigma}}

prob = SDEProblem(f, g, {{X0}}, (0.0, {{T}}))  # SDE with X0 = {{X0}}, t in [0, {{T}}]
{{?solver=LambaEM|SOSRA2|SRIW1|LambaEulerHeun}} sol  = solve(prob, {{solver}}())  # {{solver}} (adaptive)
{{?solver!=LambaEM|SOSRA2|SRIW1|LambaEulerHeun}} sol  = solve(prob, {{solver}}(), dt={{dt}})  # {{solver}}, fixed step dt = {{dt}}
'''

[[codeBranches]]
model = "mul"
code = '''
using StochasticDiffEq  # multiplicative-noise Ito SDE: dX = f(X,t) dt + g(X,t) dW

f(X, p, t) = {{f}}  # drift function
g(X, p, t) = {{g}}  # state-dependent diffusion: g(X,t) = {{g}}

prob = SDEProblem(f, g, {{X0}}, (0.0, {{T}}))  # multiplicative SDE
{{?solver=LambaEM|SOSRA2|SRIW1|LambaEulerHeun}} sol  = solve(prob, {{solver}}())  # {{solver}} (adaptive)
{{?solver!=LambaEM|SOSRA2|SRIW1|LambaEulerHeun}} sol  = solve(prob, {{solver}}(), dt={{dt}})  # {{solver}}, fixed step dt = {{dt}}
'''

[[codeBranches]]
model = "strat"
code = '''
using StochasticDiffEq  # Stratonovich SDE: dX = f(X,t) dt + g(X,t) o dW

f(X, p, t) = {{f}}  # drift (Stratonovich form)
g(X, p, t) = {{g}}  # diffusion (Stratonovich interpretation)

prob = SDEProblem(f, g, {{X0}}, (0.0, {{T}}))  # Stratonovich SDE
{{?solver=LambaEM|SOSRA2|SRIW1|LambaEulerHeun}} sol  = solve(prob, {{solver}}())  # {{solver}} (adaptive)
{{?solver!=LambaEM|SOSRA2|SRIW1|LambaEulerHeun}} sol  = solve(prob, {{solver}}(), dt={{dt}})  # {{solver}}, fixed step dt = {{dt}}

# Ito equivalent: f_ito(X,t) = f(X,t) + 0.5 * g(X,t) * dg/dX  # Ito-Stratonovich correction for reference
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "plot-path"
label = "Plot Trajectory"
desc = "Plot a single simulated SDE path against time"
code = '''
using StochasticDiffEq, Plots  # simulate and plot one SDE trajectory

sol1 = solve(prob, {{solver}}(), dt={{dt}})  # the panel problem (f, g, X0, T) with the selected solver; dt is the initial step for adaptive solvers
plot(sol1, xlabel="t", ylabel="X(t)", label="SDE path")  # plot the trajectory
'''

[[actionGroups.actions]]
id = "plot-ensemble"
label = "Ensemble Paths"
desc = "Plot multiple trajectories to visualise path-to-path variability"
code = '''
using StochasticDiffEq, Plots  # simulate an ensemble and plot all paths

ens = EnsembleProblem(prob)  # ensemble wrapper around the panel problem
sim = solve(ens, {{solver}}(), EnsembleThreads(), dt={{dt}}, trajectories=50)  # 50 parallel paths with the selected solver
plot(sim, alpha=0.3, legend=false)  # overlay all trajectories
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence"
label = "Strong Convergence"
desc = "Estimate the strong order of Euler-Maruyama on geometric Brownian motion, whose exact solution is known; EM has strong order 1/2 for multiplicative noise and 1 for additive noise"
code = '''
using StochasticDiffEq, DiffEqDevTools, Statistics  # convergence analysis against an analytical solution

a, b = 1.01, 0.87  # GBM test problem dX = a X dt + b X dW (fixed, so the exact solution is available)
gbm_exact(u0, p, t, W) = u0 * exp((a - b^2 / 2) * t + b * W)  # exact Ito solution driven by the same Brownian path W
ff = SDEFunction((X, p, t) -> a * X, (X, p, t) -> b * X; analytic=gbm_exact)
prob_c = SDEProblem(ff, 1.0, (0.0, 1.0))
dts = (1 / 2) .^ (9:-1:4)  # decreasing step sizes
sim = test_convergence(dts, prob_c, EM(), trajectories=1000)  # strong error at the final time, averaged over paths
errs = sim.errors[:final]
order = cov(log.(dts), log.(errs)) / var(log.(dts))  # least-squares slope of log error on log dt
(dts = dts, strong_errors = errs, estimated_order = order, expected = 0.5)  # for additive noise (constant g) EM coincides with Milstein: strong order 1
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "mean-variance"
label = "Mean and Variance"
desc = "Estimate E[X(t)] and Var[X(t)] from an ensemble and compare them with the closed forms for linear drift a X and linear diffusion"
code = '''
using StochasticDiffEq, Statistics, Plots  # ensemble moments against closed forms

ens  = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), dt={{dt}}, trajectories=1000)  # 1000 paths of the panel problem
t_grid = 0:0.1:{{T}}  # evaluation time grid
means  = [mean(s(t) for s in ens) for t in t_grid]  # Monte Carlo E[X(t)]
vars   = [var(s(t) for s in ens) for t in t_grid]  # Monte Carlo Var[X(t)]

# Closed forms assume f = a X (scalar X0); a and b are read off f and g at X = 1, so they are only valid for linear f and g
a  = f(1.0, nothing, 0.0)
X0 = {{X0}}
{{?model=add}}s2 = g(1.0, nothing, 0.0)^2  # constant noise: Ornstein-Uhlenbeck type
{{?model=add}}m_exact = X0 .* exp.(a .* t_grid); v_exact = s2 .* (exp.(2a .* t_grid) .- 1) ./ (2a)
{{?model=mul}}b = g(1.0, nothing, 0.0)  # g = b X: geometric Brownian motion (Ito)
{{?model=mul}}m_exact = X0 .* exp.(a .* t_grid); v_exact = X0^2 .* exp.(2a .* t_grid) .* (exp.(b^2 .* t_grid) .- 1)
{{?model=strat}}b = g(1.0, nothing, 0.0)  # g = b X in Stratonovich form = Ito drift (a + b^2/2) X
{{?model=strat}}m_exact = X0 .* exp.((a + b^2 / 2) .* t_grid); v_exact = X0^2 .* exp.((2a + b^2) .* t_grid) .* (exp.(b^2 .* t_grid) .- 1)
plot(t_grid, means, label="ensemble mean"); plot!(t_grid, m_exact, ls=:dash, label="exact mean")
plot!(t_grid, vars, label="ensemble variance"); plot!(t_grid, v_exact, ls=:dash, label="exact variance", xlabel="t")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "ito-vs-strat"
label = "Ito vs Stratonovich"
desc = "Solve the same f and g as Ito (Euler-Maruyama) and as Stratonovich (Euler-Heun) on one shared Brownian path; they coincide when g is constant"
code = '''
using StochasticDiffEq, DiffEqNoiseProcess, Plots  # compare Ito and Stratonovich solutions

# The interpretation is set by the solver, not by SDEProblem: EM is Ito, EulerHeun is Stratonovich
sol_ito   = solve(SDEProblem(f, g, {{X0}}, (0.0, {{T}})), EM(), dt={{dt}})  # Ito solution, records its Brownian path
p_strat   = SDEProblem(f, g, {{X0}}, (0.0, {{T}}); noise=NoiseWrapper(sol_ito.W))  # replay the same path
sol_strat = solve(p_strat, EulerHeun(), dt={{dt}})  # Stratonovich solution (Ito drift + 0.5 g dg/dX)
plot(sol_ito, label="Ito"); plot!(sol_strat, label="Stratonovich")  # overlay both solutions
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "stationary"
label = "Stationary Distribution"
desc = "Estimate the long-run stationary distribution from a long trajectory after discarding the transient"
code = '''
using StochasticDiffEq, StatsBase, LinearAlgebra, Distributions, Plots  # estimate stationary distribution

T_long, burn = 1000.0, 100.0  # long horizon and burn-in discarded as transient
sol_l = solve(remake(prob; tspan=(0.0, T_long)), {{solver}}(), dt={{dt}})
xs  = sol_l.(burn:0.1:T_long)  # states on an even time grid after the burn-in (adaptive steps are uneven)
h   = normalize(fit(Histogram, xs, nbins=50), mode=:pdf)  # histogram normalised to a density
plot(h, xlabel="X", ylabel="density", label="empirical", alpha=0.6)
{{?model=add}}a = f(1.0, nothing, 0.0); s2 = g(1.0, nothing, 0.0)^2  # f = a X with a < 0 and constant g: Ornstein-Uhlenbeck
{{?model=add}}a < 0 && plot!(x -> pdf(Normal(0, sqrt(s2 / (-2a))), x), extrema(xs)..., lw=2, label="Normal(0, sigma^2 / (2 theta))")
{{?model=mul|strat}}# for g = b X the process decays to 0 or explodes; a nondegenerate stationary law needs a mean-reverting drift with a constant term
'''
