# Diffusion Processes Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/sde.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Diffusion Processes"
viewType = "pollis.sde"
defaultModel = "add"

[[packages]]
name = "StochasticDiffEq.jl"
github = "https://github.com/SciML/StochasticDiffEq.jl"

[[packages]]
name = "DifferentialEquations.jl"
github = "https://github.com/SciML/DifferentialEquations.jl"

[requires]
packages = ["Plots.jl", "DiffEqDevTools.jl", "StatsBase.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Additive Noise"
file = "sde/tutorial-01-additive.ipynb"
bundled = true
description = "Define and solve an Itô SDE with constant diffusion using Euler-Maruyama"

[[notebookSections.notebooks]]
name = "Multiplicative Noise"
file = "sde/tutorial-02-multiplicative.ipynb"
bundled = true
description = "State-dependent diffusion with the SRIW1 adaptive Itô solver"

[[notebookSections.notebooks]]
name = "Stratonovich"
file = "sde/tutorial-03-stratonovich.ipynb"
bundled = true
description = "Stratonovich interpretation using EulerHeun; compare with Itô solution"

