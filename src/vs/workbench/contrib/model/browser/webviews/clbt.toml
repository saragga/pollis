# ColBERT Retrieval Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/clbt.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "ColBERT Retrieval"
viewType = "pollis.clbt"
defaultModel = "main"

[[packages]]
name = "ColBERT.jl"
github = "https://github.com/JuliaGenAI/ColBERT.jl"

[[packages]]
name = "RAGTools.jl"
github = "https://github.com/JuliaGenAI/RAGTools.jl"

[[packages]]
name = "CairoMakie.jl"
github = "https://github.com/MakieOrg/Makie.jl"

[requires]
packages = ["ColBERT.jl", "RAGTools.jl", "CairoMakie.jl"]

