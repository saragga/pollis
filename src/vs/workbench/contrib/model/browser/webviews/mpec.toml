[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "obj-contour"
label = "Implicit Objective"
desc = "Objective F(x, y*(x)) with the equilibrium solved by PATH along the whole feasible range of x, and the computed solution"
code = '''
using Plots
xs = range(xlo, xhi, length=200)
Fs = [begin r = equilibrium(xv); r.ok && all(Gc(xv, r.y) .<= 1e-9) ? F(xv, r.y) : NaN end for xv in xs]
plot(xs, Fs, lw=2, xlabel="x", ylabel="F(x, y*(x))", label="implicit objective", title="Implicit objective")
scatter!([sol.x], [sol.F], ms=6, label="solution")
'''

[[actionGroups.actions]]
id = "solution-path"
label = "Solution Path"
desc = "Regularisation and penalty: objective and complementarity violation as t shrinks or mu grows. Implicit: objective on the grid"
code = '''
using Plots
{{?model=reg}}plot(plot([p.t for p in sol.path], [p.F for p in sol.path], marker=:o, xscale=:log10, xflip=true, xlabel="t", ylabel="Objective", legend=false),
{{?model=reg}}    plot([p.t for p in sol.path], max.([p.compl for p in sol.path], 1e-16), marker=:o, xscale=:log10, yscale=:log10, xflip=true, xlabel="t", ylabel="max |y_i f_i|", legend=false),
{{?model=reg}}    layout=(1, 2), size=(900, 350))
{{?model=pen}}plot(plot([p.mu for p in sol.path], [p.F for p in sol.path], marker=:o, xscale=:log10, xlabel="mu", ylabel="Objective", legend=false),
{{?model=pen}}    plot([p.mu for p in sol.path], max.([p.compl for p in sol.path], 1e-16), marker=:o, xscale=:log10, yscale=:log10, xlabel="mu", ylabel="max |y_i f_i|", legend=false),
{{?model=pen}}    layout=(1, 2), size=(900, 350))
{{?model=imp}}xs = range(xlo, xhi, length=npts)
{{?model=imp}}plot(xs, [begin r = equilibrium(xv); r.ok ? F(xv, r.y) : NaN end for xv in xs], marker=:circle, ms=2, xlabel="x", ylabel="F(x, y*(x))", legend=false, title="Grid evaluations")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "compl-check"
label = "Complementarity Check"
desc = "Verify y >= 0, f(x, y) >= 0 and y_i f_i(x, y) = 0 at the solution"
code = '''
fv = f(sol.x, sol.y)
(min_y = minimum(sol.y), min_f = minimum(fv), max_complementarity = maximum(abs.(sol.y .* fv)), y_dot_f = dot(sol.y, fv),
 outer_feasible = all(Gc(sol.x, sol.y) .<= 1e-6))
'''

[[actionGroups.actions]]
id = "kkt-check"
label = "Stationarity Check"
desc = "One-sided slopes of the implicit objective F(x, y*(x)) at the solution: a local minimum has a non-negative right slope and a non-positive left slope unless x is at a bound"
code = '''
h = 1e-4 * max(1.0, abs(sol.x))
Fi(xv) = F(xv, equilibrium(xv).y)
(right_slope = round((Fi(sol.x + h) - Fi(sol.x)) / h, digits=5), left_slope = round((Fi(sol.x) - Fi(sol.x - h)) / h, digits=5),
 at_lower_bound = sol.x <= xlo + 1e-6, at_upper_bound = sol.x >= xhi - 1e-6, equilibrium_matches = norm(equilibrium(sol.x).y .- sol.y) < 1e-4)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "parametric"
label = "Parametric MPEC"
desc = "Re-solve with an extra cap x <= t over the feasible range: optimal objective and equilibrium response as the cap tightens"
code = '''
using Plots
caps = range(xlo + 0.05 * (xhi - xlo), xhi, length=20)
res = [solve_mpec(; xmax=t) for t in caps]
plot(plot(caps, [r.F for r in res], marker=:o, xlabel="Cap t (x <= t)", ylabel="Objective", legend=false),
    plot(caps, reduce(hcat, [r.y for r in res])', marker=:o, xlabel="Cap t (x <= t)", ylabel="y", label=permutedims(["y" * string(i) for i in 1:ny])),
    layout=(1, 2), size=(900, 350))
'''

