[[bullets]]
text = "A Mathematical Programming with Equilibrium Constraints (MPEC) is the problem of a single decision-maker who minimises an objective subject to both standard constraints and an equilibrium condition"
detail = "such as complementarity or a variational inequality. The equilibrium is externally imposed; the decision-maker simply has to respect it."

[[bullets]]
text = "Examples: a regulator minimising social cost subject to traffic user-equilibrium; a grid operator minimising cost subject to market-clearing prices; a network designer optimising capacity subject to Wardrop flow conditions."
detail = ""

[[models]]
id = "reg"
label = "Regularisation"

[[models]]
id = "pen"
label = "Penalty"

[[models]]
id = "imp"
label = "Implicit (PATH)"

[[decisionRows]]
task = "Regularisation"
context = "Smooth MPECs of any size; the complementarity y'f = 0 violates standard constraint qualifications, so relax it and tighten gradually"
purpose = "Scholtes relaxation y_i f_i <= t solved by Ipopt for t = 1, 0.1, .., 1e-8, each warm-started from the last; converges to a C-stationary point"

[[decisionRows]]
task = "Penalty"
context = "Keep y >= 0 and f >= 0 as ordinary constraints and push complementarity into the objective"
purpose = "Minimise F + mu y'f with Ipopt for mu = 1, 10, .., 1e4; exact for large enough mu under mild conditions"

[[decisionRows]]
task = "Implicit (PATH)"
context = "One outer variable and an inner equilibrium with a unique solution; transparent and globally reliable for small problems"
purpose = "Solve the equilibrium y*(x) as a mixed complementarity problem with PATH on a grid of x, then minimise the implicit objective F(x, y*(x))"

[[inputs]]
id = "obj"
label = "Objective F(x, y)"
tooltip = "Julia expression in the scalar outer variable x and the equilibrium vector y to minimise. Default: minus the profit of a Stackelberg leader facing inverse demand 10 - Q with unit cost 1."
default = "-x * (10 - x - sum(y)) + x"

[[inputs]]
id = "cons"
label = "Constraints G(x, y) <= 0"
tooltip = "Vector of Julia expressions in x and y, each required to be <= 0."
default = "[x - 10, -x]"

[[inputs]]
id = "f"
label = "Equilibrium Map f(x, y)"
tooltip = "Vector of Julia expressions: find y >= 0 with f(x, y) >= 0 and y_i f_i(x, y) = 0. Default: Cournot followers with unit costs 1 and 2 (marginal cost minus marginal revenue)."
default = "[ck + x + sum(y) + y[k] - 10 for (k, ck) in enumerate([1.0, 2.0])]"

[[inputs]]
id = "ny"
label = "Equilibrium Dimension"
tooltip = "Length of y, which must match the length of f."
default = "2"

[[inputs]]
id = "npts"
label = "Grid Points"
tooltip = "Number of outer decisions x at which the equilibrium is solved with PATH."
default = "201"
models = ["imp"]

