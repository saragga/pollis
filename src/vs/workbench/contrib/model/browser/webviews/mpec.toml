[[codeBranches]]
model = "reg"
code = '''
using JuMP, Ipopt, PATHSolver, LinearAlgebra, Statistics

F(x, y) = {{obj}}  # outer objective
Gc(x, y) = {{cons}}  # outer constraints <= 0
f(x, y) = {{f}}  # equilibrium map: 0 <= y perp f(x, y) >= 0
ny = {{ny}}  # dimension of y

function equilibrium(xv)  # inner mixed complementarity problem solved by PATH
    m = Model(PATHSolver.Optimizer); set_silent(m)
    @variable(m, yv[1:ny] >= 0, start = 1.0)
    @constraint(m, complements(f(xv, yv), yv))
    optimize!(m)
    (y = value.(yv), ok = termination_status(m) == MOI.LOCALLY_SOLVED)
end

function x_range()  # smallest and largest x allowed by the outer constraints
    map((MOI.MIN_SENSE, MOI.MAX_SENSE)) do sense
        m = Model(Ipopt.Optimizer); set_silent(m)
        @variable(m, xv); @variable(m, yv[1:ny] >= 0)
        @constraint(m, Gc(xv, yv) .<= 0)
        @objective(m, sense, xv)
        optimize!(m)
        value(xv)
    end
end
xlo, xhi = x_range()

compl(xv, yv) = maximum(abs.(yv .* f(xv, yv)))  # complementarity violation

function nlp_model(xmax)  # outer problem with y >= 0 and f >= 0, complementarity added by the caller
    m = Model(Ipopt.Optimizer); set_silent(m)
    @variable(m, xv, start = (xlo + min(xhi, xmax)) / 2); @variable(m, yv[1:ny] >= 0, start = 1.0)
    @constraint(m, Gc(xv, yv) .<= 0)
    isfinite(xmax) && @constraint(m, xv <= xmax)
    fv = f(xv, yv)
    @constraint(m, fv .>= 0)
    m, xv, yv, fv
end

function solve_reg(; xmax=Inf, ts=10.0 .^ (0:-1:-8))  # Scholtes regularisation y_i f_i <= t
    m, xv, yv, fv = nlp_model(xmax)
    @objective(m, Min, F(xv, yv))
    tp = @variable(m, set = Parameter(ts[1]))
    @constraint(m, yv .* fv .<= tp)
    path = map(ts) do t
        set_parameter_value(tp, t); optimize!(m)
        xr, yr, ok = value(xv), value.(yv), is_solved_and_feasible(m)
        set_start_value(xv, xr); set_start_value.(yv, yr)  # warm start the next t
        (t = t, x = xr, y = yr, F = F(xr, yr), compl = compl(xr, yr), ok = ok)
    end
    (x = path[end].x, y = path[end].y, F = path[end].F, ok = path[end].ok, path = path)
end

function solve_pen(; xmax=Inf, mus=10.0 .^ (0:4))  # penalty F + mu y'f
    m, xv, yv, fv = nlp_model(xmax)
    path = map(mus) do mu
        @objective(m, Min, F(xv, yv) + mu * sum(yv .* fv)); optimize!(m)
        xr, yr, ok = value(xv), value.(yv), is_solved_and_feasible(m)
        set_start_value(xv, xr); set_start_value.(yv, yr)  # warm start the next mu
        (mu = mu, x = xr, y = yr, F = F(xr, yr), compl = compl(xr, yr), ok = ok)
    end
    (x = path[end].x, y = path[end].y, F = path[end].F, ok = path[end].ok, path = path)
end

function solve_imp(; xmax=Inf, npts=201)  # implicit programming on a grid of x
    best = (x = NaN, y = fill(NaN, ny), F = Inf, ok = false, path = [])
    for xv in range(xlo, min(xhi, xmax), length=npts)
        r = equilibrium(xv)
        r.ok && all(Gc(xv, r.y) .<= 1e-9) && F(xv, r.y) < best.F && (best = (x = xv, y = r.y, F = F(xv, r.y), ok = true, path = []))
    end
    best
end
solve_mpec(; kw...) = solve_reg(; kw...)
sol = solve_mpec()
(x = round(sol.x, digits=4), y = round.(sol.y, digits=4), objective = round(sol.F, digits=4),
 complementarity_violation = compl(sol.x, sol.y), solved = sol.ok)
'''

