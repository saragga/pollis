[[actionGroups.actions]]
id = "value-of-commitment"
label = "Value of Commitment"
desc = "Objective when x is chosen anticipating the equilibrium (MPEC) against a simultaneous move, where x only best-responds to y (Nash, by best-response iteration)"
code = '''
xs = range(xlo, xhi, length=4001)
function nash(; iters=200)
    xv = (xlo + xhi) / 2
    for _ in 1:iters
        yv = equilibrium(xv).y
        xn = xs[argmin([F(z, yv) for z in xs])]  # best response of x holding y fixed
        abs(xn - xv) < 1e-9 && break
        xv = xn
    end
    xv, equilibrium(xv).y
end
xn, yn = nash()
(mpec_x = round(sol.x, digits=4), mpec_objective = round(sol.F, digits=4), nash_x = round(xn, digits=4), nash_objective = round(F(xn, yn), digits=4),
 value_of_commitment = round(F(xn, yn) - sol.F, digits=4))
'''

[[actionGroups.actions]]
id = "active-compl"
label = "Active Constraints"
desc = "Which complementarity pairs have y_i > 0 (f_i = 0, component active) and which have y_i = 0 (f_i >= 0, component shut out)"
code = '''
fv = f(sol.x, sol.y)
[(i = i, y = round(sol.y[i], digits=5), f = round(fv[i], digits=5), status = sol.y[i] > 1e-6 ? "y > 0, f = 0" : fv[i] > 1e-6 ? "y = 0, f > 0" : "degenerate (both zero)") for i in 1:ny]
'''
