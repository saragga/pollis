code = '''
using Plots
xs = range(xlo, xhi, length=200)
Y = reduce(hcat, [equilibrium(xv).y for xv in xs])
plot(xs, transpose(Y), lw=2, xlabel="x", ylabel="y*(x)", label=permutedims(["y" * string(i) for i in 1:ny]), title="Equilibrium response")
