code = '''
[begin
    t = @elapsed r = run()
    (method = name, x = round(r.x, digits=4), objective = round(r.F, digits=4), complementarity = compl(r.x, r.y), seconds = round(t, digits=2))
end for (name, run) in [("regularisation", () -> solve_reg()), ("penalty", () -> solve_pen()), ("implicit (PATH)", () -> solve_imp())]]
'''

