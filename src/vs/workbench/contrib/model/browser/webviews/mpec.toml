id = "relax"
label = "Relaxed Bound"
desc = "Drop complementarity (keep y >= 0 and f >= 0) and solve the relaxed problem: an optimistic bound on the MPEC objective"
code = '''
m, xv, yv, fv = nlp_model(Inf)
@objective(m, Min, F(xv, yv)); optimize!(m)
(relaxed_bound = round(objective_value(m), digits=4), relaxed_x = round(value(xv), digits=4), relaxed_y = round.(value.(yv), digits=4),
 complementarity_violation = round(compl(value(xv), value.(yv)), digits=4), mpec_objective = round(sol.F, digits=4))
'''

