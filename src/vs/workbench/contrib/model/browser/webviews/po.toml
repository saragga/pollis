[[actionGroups.actions]]
id = "rolling-sharpe"
label = "Rolling Sharpe Ratio"
desc = "Rolling 6-month annualised Sharpe ratio of the in-sample portfolio, to check whether its risk-adjusted return is stable over time"
code = '''
using Statistics, Plots

rp = rd.X * w  # daily portfolio returns with the full-sample weights
win = 126  # about six months of trading days
roll = [sqrt(252) * (mean(rp[t-win+1:t]) - rf_daily) / std(rp[t-win+1:t]) for t in win:length(rp)]
plot(win:length(rp), roll; label = "126-day Sharpe", xlabel = "Day", ylabel = "Annualised Sharpe ratio",
     title = "Rolling Sharpe Ratio (In-Sample Weights)")
hline!([0]; label = "", color = :black, ls = :dot)
println("The weights use the whole sample, including the days plotted, so this shows stability, not achievable performance.")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "oos-performance"
label = "Out-of-Sample Performance"
desc = "Walk-forward backtest: re-estimate on a rolling two-year window, hold for a quarter, and evaluate only the held-out returns"
code = '''
using PortfolioOptimisers, Statistics, Plots

cv = IndexWalkForward(504, 63)  # train on 504 days (2 years), hold the weights for the next 63 days, then roll forward
pred = cross_val_predict(est, rd, cv)  # refits the selected model on every training window
r_oos = pred.mrd.X  # held-out daily portfolio returns, concatenated across folds

ex = r_oos .- rf_daily
sr = mean(ex) / std(r_oos)  # daily Sharpe ratio
wealth = cumprod(1 .+ r_oos)
println("Folds: ", length(pred.pred), "   out-of-sample days: ", length(r_oos))
println("Annualised excess return: ", round(100 * 252 * mean(ex), digits = 2), " %")
println("Annualised volatility:    ", round(100 * sqrt(252) * std(r_oos), digits = 2), " %")
println("Annualised Sharpe ratio:  ", round(sqrt(252) * sr, digits = 2),
        "   (SE about ", round(sqrt(252 * (1 + sr^2 / 2) / length(r_oos)), digits = 2), ", Lo 2002, iid returns)")
println("Maximum drawdown:         ", round(100 * maximum(1 .- wealth ./ accumulate(max, wealth)), digits = 2), " %")
plot(wealth; label = "Out-of-sample wealth", xlabel = "Out-of-sample day", ylabel = "Growth of 1", title = "Walk-Forward Backtest")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-equal-weight"
label = "vs Equal Weight"
desc = "Out-of-sample Sharpe ratio of the selected model against the 1/N portfolio on the same walk-forward folds, with a test of the difference"
code = '''
using PortfolioOptimisers, Statistics

cv = IndexWalkForward(504, 63)  # same folds for both strategies
r_opt = cross_val_predict(est, rd, cv).mrd.X  # selected model, refitted on each window
r_ew = cross_val_predict(EqualWeighted(), rd, cv).mrd.X  # 1/N benchmark (DeMiguel, Garlappi and Uppal 2009)

sharpe_d(x) = (mean(x) - rf_daily) / std(x)  # daily Sharpe ratio of excess returns
s1, s2, n = sharpe_d(r_opt), sharpe_d(r_ew), length(r_opt)
rho = cor(r_opt, r_ew)
z = (s1 - s2) / sqrt((2 - 2 * rho + 0.5 * (s1^2 + s2^2 - 2 * s1 * s2 * rho^2)) / n)  # Jobson-Korkie test, Memmel (2003) correction

println(rpad("Optimised", 12), "Sharpe ", lpad(round(sqrt(252) * s1, digits = 2), 6), "   vol ", round(100 * sqrt(252) * std(r_opt), digits = 1), " %")
println(rpad("1/N", 12), "Sharpe ", lpad(round(sqrt(252) * s2, digits = 2), 6), "   vol ", round(100 * sqrt(252) * std(r_ew), digits = 1), " %")
println("Difference test: z = ", round(z, digits = 2), "   (|z| > 1.96 rejects equal Sharpe ratios at the 5% level)")
println(abs(z) > 1.96 ? "The out-of-sample Sharpe ratios differ at the 5% level." :
        "No significant difference: with this sample, the optimiser has not beaten (or lost to) 1/N.")
'''

[[actionGroups.actions]]
id = "compare-methods"
label = "Compare Methods"
desc = "Out-of-sample Sharpe ratio, volatility and maximum drawdown of every method and two naive benchmarks on the same walk-forward folds"
code = '''
using PortfolioOptimisers, Statistics

cv = IndexWalkForward(504, 63)  # identical folds for every strategy
mr(r, obj = MinimumRisk()) = MeanRisk(; opt = JuMPOptimiser(; slv = slv), r = r, obj = obj)
strategies = [
    ("Min Variance", mr(Variance())),
    ("Max Sharpe", mr(StandardDeviation(), MaximumRatio(; rf = rf_daily))),
    ("Min CVaR 5%", mr(ConditionalValueatRisk(; alpha = 0.05))),
    ("HRP", HierarchicalRiskParity()),
    ("HERC", HierarchicalEqualRiskContribution()),
    ("Inverse Vol", InverseVolatility()),
    ("Equal Weight", EqualWeighted()),
]

println(rpad("Method", 14), lpad("Sharpe", 8), lpad("SE", 7), lpad("Vol %", 8), lpad("MaxDD %", 9))
for (nm, s) in strategies
    x = cross_val_predict(s, rd, cv).mrd.X  # held-out daily returns
    sr = (mean(x) - rf_daily) / std(x)
    wealth = cumprod(1 .+ x)
    println(rpad(nm, 14), lpad(round(sqrt(252) * sr, digits = 2), 8),
            lpad(round(sqrt(252 * (1 + sr^2 / 2) / length(x)), digits = 2), 7),
            lpad(round(100 * sqrt(252) * std(x), digits = 1), 8),
            lpad(round(100 * maximum(1 .- wealth ./ accumulate(max, wealth)), digits = 1), 9))
end
println("SE = standard error of each Sharpe ratio (Lo 2002). Differences well inside about 2 SE are not evidence of a better method.")
'''

