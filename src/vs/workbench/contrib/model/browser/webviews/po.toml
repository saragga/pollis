[[bullets]]
text = "Mean-Variance"
detail = "Markowitz efficient frontier; minimise variance for a target return or maximise the Sharpe ratio"

[[bullets]]
text = "Mean-CVaR"
detail = "replace variance with Conditional Value-at-Risk; better captures tail risk for non-normal returns"

[[bullets]]
text = "Hierarchical Risk Parity (HRP)"
detail = "cluster assets by correlation then allocate inversely proportional to within-cluster risk; no matrix inversion"

[[bullets]]
text = "Hierarchical Equal Risk Contribution (HERC)"
detail = "equal risk contribution within each hierarchical cluster for improved out-of-sample diversification"

[[decisionRows]]
task = "Mean-Variance"
context = "Reliable return and covariance estimates"
purpose = "Classic Markowitz trade-off between expected return and variance"

[[decisionRows]]
task = "Mean-CVaR"
context = "Fat tails or asymmetric return distributions"
purpose = "Control expected loss in the worst scenarios instead of variance"

[[decisionRows]]
task = "HRP"
context = "Many correlated assets, noisy covariance"
purpose = "Stable allocation without inverting the covariance matrix"

[[decisionRows]]
task = "HERC"
context = "Clustered assets, want balanced cluster risk"
purpose = "Equalise risk contributions across and within clusters"

[[inputs]]
id = "R"
label = "Returns Matrix (R)"
tooltip = "T x N matrix of daily simple returns: T trading days, N assets, one column per asset. Annualised figures assume 252 trading days. With the default R, the code first simulates an example with known means and a two-sector correlation structure."
default = "R"

[[inputs]]
id = "obj"
label = "Objective"
tooltip = "Minimum Risk minimises the risk measure. Maximum Risk-Adjusted Return maximises excess return per unit of risk: the Sharpe ratio for Mean-Variance (volatility in the denominator), the STARR ratio for Mean-CVaR. Maximum Utility maximises E[r] - l * risk."
kind = "select"
default = "minrisk"
models = ["mv", "cvar"]

[[inputs.options]]
value = "minrisk"
label = "Minimum Risk"

[[inputs.options]]
value = "maxratio"
label = "Maximum Risk-Adjusted Return"

[[inputs.options]]
value = "utility"
label = "Maximum Utility"

[[inputs]]
id = "l"
label = "Risk Aversion (l)"
tooltip = "Risk-aversion coefficient of the Maximum Utility objective, E[r] - l * risk on daily returns (risk = variance for Mean-Variance, CVaR for Mean-CVaR). Larger values give more conservative portfolios. Ignored by the other objectives."
default = "2"
models = ["mv", "cvar"]

[[inputs]]
id = "alpha"
label = "CVaR Tail Probability (alpha)"
tooltip = "CVaR is the average loss on the worst alpha share of days. 0.05 averages the worst 5% of daily returns."
default = "0.05"
models = ["cvar"]

[[inputs]]
id = "rf"
label = "Risk-Free Rate (Annual)"
tooltip = "Annual risk-free rate as a decimal (0.02 = 2%). It is converted to a daily rate (rf / 252) for the Sharpe and STARR ratios and for excess returns."
default = "0.02"

