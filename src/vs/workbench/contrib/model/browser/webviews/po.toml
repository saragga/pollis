[[actionGroups.actions]]
id = "portfolio-weights"
label = "Portfolio Weights"
desc = "Weights sorted from largest to smallest, with the effective number of assets as a concentration measure"
code = '''
order = sortperm(w; rev = true)
for i in order
    println(rpad(asset_names[i], 10), lpad(round(100 * w[i], digits = 2), 8), " %")
end
n_eff = 1 / sum(abs2, w)  # inverse Herfindahl index: N for 1/N, 1 for a single asset
println("Effective number of assets: ", round(n_eff, digits = 2), " of ", length(w))
println("Assets with a weight below 0.1%: ", count(<(0.001), w))
'''

[[actionGroups.actions]]
id = "expected-risk-return"
label = "Expected Risk & Return"
desc = "In-sample annualised expected return, volatility, Sharpe ratio and daily CVaR of the optimal portfolio"
code = '''
using PortfolioOptimisers

vol_d, ret_d, sr_d = expected_risk_ret_ratio(StandardDeviation(), ArithmeticReturn(), w, pr; rf = rf_daily)  # daily figures
cvar_d = expected_risk(ConditionalValueatRisk(; alpha = 0.05), w, pr)

println("Expected return (annualised): ", round(100 * 252 * ret_d, digits = 2), " %")
println("Volatility (annualised):      ", round(100 * sqrt(252) * vol_d, digits = 2), " %")
println("Sharpe ratio (annualised):    ", round(sqrt(252) * sr_d, digits = 2), "   (risk-free rate ", 100 * {{rf}}, " %)")
println("Daily CVaR at 5%:             ", round(100 * cvar_d, digits = 2), " %  average loss on the worst 5% of days")
{{?R=R}}println("True expected return of these weights (simulation): ", round(100 * 252 * sum(w .* mu_d), digits = 2), " %")
println("These are in-sample estimates on the data used to choose w, so they overstate future performance; see Out-of-Sample Performance.")
'''
