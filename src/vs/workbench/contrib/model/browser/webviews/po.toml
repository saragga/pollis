# Portfolio Optimisation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/po.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Portfolio Optimisation"
viewType = "pollis.po"
defaultModel = "mv"

[[packages]]
name = "PortfolioOptimisers.jl"
github = "https://github.com/dcelisgarza/PortfolioOptimisers.jl"

[[packages.videos]]
title = "Julia in Academia"
description = "Overview of Julia for academic and scientific computing"
url = "https://www.youtube.com/watch?v=wPFPT-Ech2c"

[requires]
packages = ["Plots.jl", "StatsBase.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Mean-Variance (Markowitz)"
file = "portfolio-opt/tutorial-01-mean-variance.ipynb"
bundled = true
description = "Markowitz mean-variance optimisation: minimum-risk and maximum Sharpe ratio portfolios on the efficient frontier"

[[notebookSections.notebooks]]
name = "Mean-CVaR"
file = "portfolio-opt/tutorial-02-mean-cvar.ipynb"
bundled = true
description = "Mean-CVaR optimisation: minimise Conditional Value-at-Risk at a given confidence level instead of variance"

[[notebookSections.notebooks]]
name = "Hierarchical Risk Parity (HRP)"
file = "portfolio-opt/tutorial-03-hrp.ipynb"
bundled = true
description = "HRP: cluster assets by correlation, then allocate inversely proportional to within-cluster risk"

[[notebookSections.notebooks]]
name = "Hierarchical Equal Risk (HERC)"
file = "portfolio-opt/tutorial-04-herc.ipynb"
bundled = true
description = "HERC: hierarchical clustering with equal risk contribution within each cluster for better diversification"

