[[actionGroups.actions]]
id = "risk-contribution"
label = "Risk Contribution"
desc = "Each asset's share of total portfolio risk (Euler decomposition) against its share of capital"
code = '''
using PortfolioOptimisers, Plots

rc = risk_contribution(rm, w, pr)  # Euler contributions w_i * d(risk)/d(w_i); they add up to the portfolio risk
share = rc ./ sum(rc)  # fraction of total risk carried by each asset
bar(asset_names, 100 .* share; label = "Share of risk", xlabel = "Asset", ylabel = "%",
    title = "Risk Contribution vs Capital Weight", xrotation = 45)
