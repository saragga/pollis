[[codeBranches]]
model = "mv"
code = '''
using PortfolioOptimisers, Clarabel, Random, Statistics

{{?R=R}}# Simulated example: 1,000 trading days of daily simple returns for 8 assets in two sectors. A market factor
{{?R=R}}# moves every asset, a sector factor moves each sector, and Student-t (5 df) shocks give fat tails.
{{?R=R}}# True annualised means: Tech 12%, Util 6%; Tech volatility is about 29% a year, Util about 15%.
{{?R=R}}Random.seed!(42)
{{?R=R}}T_sim, n_assets = 1_000, 8
{{?R=R}}t5(n) = sqrt(3 / 5) .* randn(n) ./ sqrt.(vec(sum(abs2, randn(5, n); dims = 1)) ./ 5)  # unit-variance Student-t(5) shocks
{{?R=R}}mkt = 0.008 .* t5(T_sim); tech = 0.010 .* t5(T_sim); util = 0.005 .* t5(T_sim)  # market and sector factors
{{?R=R}}mu_d = [fill(0.12, 4); fill(0.06, 4)] ./ 252  # true daily means
{{?R=R}}R = hcat([j <= 4 ? mu_d[j] .+ 1.2 .* mkt .+ tech .+ 0.012 .* t5(T_sim) : mu_d[j] .+ 0.6 .* mkt .+ util .+ 0.006 .* t5(T_sim) for j in 1:n_assets]...)
{{?R=R}}asset_names = ["Tech1", "Tech2", "Tech3", "Tech4", "Util1", "Util2", "Util3", "Util4"]
{{?R!=R}}asset_names = [string("Asset", j) for j in 1:size({{R}}, 2)]

rd = ReturnsResult(; nx = asset_names, X = Float64.({{R}}))  # T x N daily returns
rf_daily = {{rf}} / 252  # annual risk-free rate as a daily rate (252 trading days)
slv = Solver(; name = :clarabel, solver = Clarabel.Optimizer, settings = Dict("verbose" => false),
             check_sol = (; allow_local = true, allow_almost = true))

{{?obj!=maxratio}}rm = Variance()  # risk measure: portfolio variance w' Sigma w
{{?obj=maxratio}}rm = StandardDeviation()  # the Sharpe ratio divides by volatility, so the ratio objective uses sqrt(w' Sigma w)
opt = JuMPOptimiser(; slv = slv)  # sample mean and covariance (EmpiricalPrior); long-only and fully invested by default
{{?obj=minrisk}}est = MeanRisk(; opt = opt, r = rm, obj = MinimumRisk())  # global minimum-variance portfolio
{{?obj=maxratio}}est = MeanRisk(; opt = opt, r = rm, obj = MaximumRatio(; rf = rf_daily))  # maximum Sharpe ratio (tangency) portfolio
{{?obj=utility}}est = MeanRisk(; opt = opt, r = rm, obj = MaximumUtility(; l = {{l}}))  # maximise E[r] - l * variance
res = optimise(est, rd)
w, pr = res.w, res.pr  # optimal weights and the fitted prior (sample moments)

println("Solver status: ", res.retcode isa OptimisationSuccess ? "success" : res.retcode)
for (nm, wi) in zip(asset_names, w)
    println(rpad(nm, 10), lpad(round(100 * wi, digits = 2), 8), " %")
end
println("Weights estimated in-sample. Judge them with Out-of-Sample Performance, not with in-sample ratios.")
'''

[[codeBranches]]
model = "cvar"
code = '''
using PortfolioOptimisers, Clarabel, Random, Statistics

{{?R=R}}# Simulated example: 1,000 trading days of daily simple returns for 8 assets in two sectors. A market factor
{{?R=R}}# moves every asset, a sector factor moves each sector, and Student-t (5 df) shocks give fat tails.
{{?R=R}}# True annualised means: Tech 12%, Util 6%; Tech volatility is about 29% a year, Util about 15%.
{{?R=R}}Random.seed!(42)
{{?R=R}}T_sim, n_assets = 1_000, 8
{{?R=R}}t5(n) = sqrt(3 / 5) .* randn(n) ./ sqrt.(vec(sum(abs2, randn(5, n); dims = 1)) ./ 5)  # unit-variance Student-t(5) shocks
{{?R=R}}mkt = 0.008 .* t5(T_sim); tech = 0.010 .* t5(T_sim); util = 0.005 .* t5(T_sim)  # market and sector factors
{{?R=R}}mu_d = [fill(0.12, 4); fill(0.06, 4)] ./ 252  # true daily means
{{?R=R}}R = hcat([j <= 4 ? mu_d[j] .+ 1.2 .* mkt .+ tech .+ 0.012 .* t5(T_sim) : mu_d[j] .+ 0.6 .* mkt .+ util .+ 0.006 .* t5(T_sim) for j in 1:n_assets]...)
{{?R=R}}asset_names = ["Tech1", "Tech2", "Tech3", "Tech4", "Util1", "Util2", "Util3", "Util4"]
{{?R!=R}}asset_names = [string("Asset", j) for j in 1:size({{R}}, 2)]

rd = ReturnsResult(; nx = asset_names, X = Float64.({{R}}))  # T x N daily returns
rf_daily = {{rf}} / 252  # annual risk-free rate as a daily rate (252 trading days)
slv = Solver(; name = :clarabel, solver = Clarabel.Optimizer, settings = Dict("verbose" => false),
             check_sol = (; allow_local = true, allow_almost = true))

rm = ConditionalValueatRisk(; alpha = {{alpha}})  # average loss on the worst alpha share of days (Rockafellar-Uryasev LP)
opt = JuMPOptimiser(; slv = slv)  # empirical scenarios; long-only and fully invested by default
{{?obj=minrisk}}est = MeanRisk(; opt = opt, r = rm, obj = MinimumRisk())  # minimum-CVaR portfolio
{{?obj=maxratio}}est = MeanRisk(; opt = opt, r = rm, obj = MaximumRatio(; rf = rf_daily))  # maximum STARR ratio: excess return / CVaR
{{?obj=utility}}est = MeanRisk(; opt = opt, r = rm, obj = MaximumUtility(; l = {{l}}))  # maximise E[r] - l * CVaR
res = optimise(est, rd)
w, pr = res.w, res.pr  # optimal weights and the fitted prior (empirical scenarios)

println("Solver status: ", res.retcode isa OptimisationSuccess ? "success" : res.retcode)
for (nm, wi) in zip(asset_names, w)
    println(rpad(nm, 10), lpad(round(100 * wi, digits = 2), 8), " %")
end
println("Daily CVaR at alpha = ", {{alpha}}, ": ", round(100 * expected_risk(rm, w, pr), digits = 3), " %  (average loss on the worst days, in-sample)")
'''

[[codeBranches]]
model = "hrp"
code = '''
using PortfolioOptimisers, Clarabel, Random, Statistics

{{?R=R}}# Simulated example: 1,000 trading days of daily simple returns for 8 assets in two sectors. A market factor
{{?R=R}}# moves every asset, a sector factor moves each sector, and Student-t (5 df) shocks give fat tails.
{{?R=R}}# True annualised means: Tech 12%, Util 6%; Tech volatility is about 29% a year, Util about 15%.
{{?R=R}}Random.seed!(42)
{{?R=R}}T_sim, n_assets = 1_000, 8
{{?R=R}}t5(n) = sqrt(3 / 5) .* randn(n) ./ sqrt.(vec(sum(abs2, randn(5, n); dims = 1)) ./ 5)  # unit-variance Student-t(5) shocks
{{?R=R}}mkt = 0.008 .* t5(T_sim); tech = 0.010 .* t5(T_sim); util = 0.005 .* t5(T_sim)  # market and sector factors
{{?R=R}}mu_d = [fill(0.12, 4); fill(0.06, 4)] ./ 252  # true daily means
{{?R=R}}R = hcat([j <= 4 ? mu_d[j] .+ 1.2 .* mkt .+ tech .+ 0.012 .* t5(T_sim) : mu_d[j] .+ 0.6 .* mkt .+ util .+ 0.006 .* t5(T_sim) for j in 1:n_assets]...)
{{?R=R}}asset_names = ["Tech1", "Tech2", "Tech3", "Tech4", "Util1", "Util2", "Util3", "Util4"]
{{?R!=R}}asset_names = [string("Asset", j) for j in 1:size({{R}}, 2)]

rd = ReturnsResult(; nx = asset_names, X = Float64.({{R}}))  # T x N daily returns
rf_daily = {{rf}} / 252  # annual risk-free rate as a daily rate (252 trading days)
slv = Solver(; name = :clarabel, solver = Clarabel.Optimizer, settings = Dict("verbose" => false),
             check_sol = (; allow_local = true, allow_almost = true))  # used by the frontier and comparison actions

rm = Variance()  # risk measure used for the recursive bisection
est = HierarchicalRiskParity(; r = rm)  # cluster on correlation distance, then split weight between sub-clusters by inverse risk
res = optimise(est, rd)
w, pr = res.w, res.pr  # weights and the fitted prior (sample moments); no covariance inversion and no expected returns

for (nm, wi) in zip(asset_names, w)
    println(rpad(nm, 10), lpad(round(100 * wi, digits = 2), 8), " %")
end
println("HRP ignores expected returns: it allocates by risk alone, so riskier clusters get less capital.")
'''

[[codeBranches]]
model = "herc"
code = '''
using PortfolioOptimisers, Clarabel, Random, Statistics

{{?R=R}}# Simulated example: 1,000 trading days of daily simple returns for 8 assets in two sectors. A market factor
{{?R=R}}# moves every asset, a sector factor moves each sector, and Student-t (5 df) shocks give fat tails.
{{?R=R}}# True annualised means: Tech 12%, Util 6%; Tech volatility is about 29% a year, Util about 15%.
{{?R=R}}Random.seed!(42)
{{?R=R}}T_sim, n_assets = 1_000, 8
{{?R=R}}t5(n) = sqrt(3 / 5) .* randn(n) ./ sqrt.(vec(sum(abs2, randn(5, n); dims = 1)) ./ 5)  # unit-variance Student-t(5) shocks
{{?R=R}}mkt = 0.008 .* t5(T_sim); tech = 0.010 .* t5(T_sim); util = 0.005 .* t5(T_sim)  # market and sector factors
{{?R=R}}mu_d = [fill(0.12, 4); fill(0.06, 4)] ./ 252  # true daily means
{{?R=R}}R = hcat([j <= 4 ? mu_d[j] .+ 1.2 .* mkt .+ tech .+ 0.012 .* t5(T_sim) : mu_d[j] .+ 0.6 .* mkt .+ util .+ 0.006 .* t5(T_sim) for j in 1:n_assets]...)
{{?R=R}}asset_names = ["Tech1", "Tech2", "Tech3", "Tech4", "Util1", "Util2", "Util3", "Util4"]
{{?R!=R}}asset_names = [string("Asset", j) for j in 1:size({{R}}, 2)]

rd = ReturnsResult(; nx = asset_names, X = Float64.({{R}}))  # T x N daily returns
rf_daily = {{rf}} / 252  # annual risk-free rate as a daily rate (252 trading days)
slv = Solver(; name = :clarabel, solver = Clarabel.Optimizer, settings = Dict("verbose" => false),
             check_sol = (; allow_local = true, allow_almost = true))  # used by the frontier and comparison actions

rm = Variance()  # risk measure for both the within-cluster (ri) and across-cluster (ro) allocation
est = HierarchicalEqualRiskContribution(; ri = rm, ro = rm)  # cut the dendrogram into clusters, equalise risk across and within them
res = optimise(est, rd)
w, pr = res.w, res.pr  # weights and the fitted prior (sample moments)

for (nm, wi) in zip(asset_names, w)
    println(rpad(nm, 10), lpad(round(100 * wi, digits = 2), 8), " %")
end
println("HERC ignores expected returns: each cluster carries a similar share of total risk, not of capital.")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "efficient-frontier"
label = "Efficient Frontier"
desc = "Mean-variance efficient frontier with the minimum-variance and maximum-Sharpe portfolios, the capital market line and the current portfolio"
code = '''
using PortfolioOptimisers, Plots

ret_f = ArithmeticReturn(; settings = JuMPReturnsSettings(; lb = Frontier(; N = 30)))  # 30 return floors from min-risk to max-return
fr = optimise(MeanRisk(; opt = JuMPOptimiser(; slv = slv, ret = ret_f), r = Variance()), rd)  # minimum variance at each floor
ok = [rc isa OptimisationSuccess for rc in fr.retcode]  # keep the points that solved
ann_vol(v) = sqrt(252) * expected_risk(StandardDeviation(), v, pr)  # annualised volatility
ann_ret(v) = 252 * expected_return(ArithmeticReturn(), v, pr)  # annualised arithmetic mean return

w_tan = optimise(MeanRisk(; opt = JuMPOptimiser(; slv = slv), r = StandardDeviation(), obj = MaximumRatio(; rf = rf_daily)), rd).w
w_minv = fr.w[findfirst(ok)]  # first frontier point: the minimum-variance portfolio

plot(ann_vol.(fr.w[ok]), ann_ret.(fr.w[ok]); label = "Efficient frontier", lw = 2,
     xlabel = "Annualised volatility", ylabel = "Annualised mean return", title = "Mean-Variance Frontier (In-Sample)")
plot!([0, 1.5 * ann_vol(w_tan)], [{{rf}}, {{rf}} + 1.5 * (ann_ret(w_tan) - {{rf}})]; label = "Capital market line", ls = :dash)
scatter!([ann_vol(w_minv)], [ann_ret(w_minv)]; label = "Minimum variance", ms = 6)
scatter!([ann_vol(w_tan)], [ann_ret(w_tan)]; label = "Maximum Sharpe", ms = 6)
scatter!([ann_vol(w)], [ann_ret(w)]; label = "Current portfolio", ms = 7, marker = :star5)
scatter!([sqrt(252) * std(c) for c in eachcol(rd.X)], [252 * mean(c) for c in eachcol(rd.X)];
         label = "Single assets", ms = 3, series_annotations = text.(asset_names, 7, :left))
'''

[[actionGroups.actions]]
id = "weights-bar"
label = "Weights Bar Chart"
desc = "Bar chart of the optimal portfolio weights next to the 1/N weight"
code = '''
using Plots

bar(asset_names, 100 .* w; label = "Optimal weight", xlabel = "Asset", ylabel = "Weight (%)",
    title = "Portfolio Weights", xrotation = 45)
hline!([100 / length(w)]; label = "Equal weight (1/N)", ls = :dash)
