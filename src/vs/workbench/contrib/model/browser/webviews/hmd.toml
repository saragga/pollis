[[bullets]]
text = "Drop"
detail = "removes rows (or columns) that contain any missing value; the simplest strategy, keeping only complete cases with no imputation bias"

[[bullets]]
text = "Substitute"
detail = "replaces each missing value with a column statistic (mean, median, or mode); fast and loses no data, but shrinks the variance and weakens correlations"

[[bullets]]
text = "Interpolate"
detail = "fills gaps by linear interpolation along each column; suited to ordered or time-indexed data with a smooth trend between observed values"

[[bullets]]
text = "LOCF / NOCB"
detail = "Last Observation Carried Forward or Next Observation Carried Backward; copies the nearest observed value into the gap; suited to step-like or slowly varying series"

[[bullets]]
text = "Singular Value Decomposition (SVD)"
detail = "low-rank matrix completion; recovers missing entries from the shared structure of the columns; most effective when the columns are correlated"

[[decisionRows]]
task = "Drop"
context = "Any"
purpose = "Few missing values in a large dataset"

[[decisionRows]]
task = "Substitute"
context = "Tabular"
purpose = "Fast baseline for cross-sectional data"

[[decisionRows]]
task = "Interpolate"
context = "Time series"
purpose = "Values change smoothly between observations"

[[decisionRows]]
task = "LOCF / NOCB"
context = "Time series"
purpose = "Short gaps in step-like or slowly varying data"

[[decisionRows]]
task = "SVD"
context = "Numeric matrix"
purpose = "Many correlated variables"

[[inputs]]
id = "data"
label = "Data"
tooltip = "Variable name of your dataset: any Tables.jl source (e.g. a named tuple of vectors or a CSV.File). Rows are observations in their natural order; Interpolate and LOCF / NOCB fill along that order."
default = "data"

[[inputs]]
id = "target"
label = "Target"
tooltip = "Drop rows (observations) or columns (variables). Dropping rows keeps every variable; dropping columns keeps every observation."
kind = "select"
default = "obs"
models = ["drop"]

[[inputs.options]]
value = "obs"
label = "rows (obs)"

[[inputs.options]]
value = "vars"
label = "cols (vars)"

[[inputs]]
id = "statistic"
label = "Statistic"
tooltip = "mean and median require numeric columns; mode works for any column type and needs StatsBase."
kind = "select"
default = "mean"
models = ["sub"]

[[inputs.options]]
value = "mean"
label = "mean"

[[inputs.options]]
value = "median"
label = "median"

[[inputs.options]]
value = "mode"
label = "mode"

[[inputs]]
id = "direction"
label = "Direction"
tooltip = "LOCF copies the last observed value forward; NOCB copies the next observed value backward. LOCF cannot fill leading gaps and NOCB cannot fill trailing gaps."
kind = "select"
default = "locf"
models = ["locf"]

[[inputs.options]]
value = "locf"
label = "forward (LOCF)"

[[inputs.options]]
value = "nocb"
label = "backward (NOCB)"

[[inputs]]
id = "rank"
label = "Rank"
tooltip = "Number of singular vectors used in the low-rank approximation. Lower rank = stronger smoothing; higher rank = closer fit to the observed entries. Must be smaller than the number of columns."
default = "2"
models = ["svd"]

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.drop]
# A grid of cells; the row with a missing cell is struck out
svg = '''
var s = '';
for (var r = 0; r < 5; r++) {
	for (var c = 0; c < 3; c++) {
		var miss = r === 2 && c === 1;
		s += '<rect x="' + (10 + c * 12) + '" y="' + (22 + r * 9) + '" width="10" height="7" fill="' + (miss ? 'none' : 'currentColor') + '" stroke="currentColor" stroke-width="0.8" opacity="' + (r === 2 ? 0.35 : 0.6) + '"/>';
	}
}
s += '<line x1="6" y1="44.5" x2="48" y2="44.5" stroke="currentColor" stroke-width="1.5"/>';
return s;
'''

[miniCharts.sub]
# Observed points around a horizontal mean line; the gap is filled on the line
svg = '''
var s = '';
var ys = [36, 54, 42, null, 58, 40];
s += '<line x1="6" y1="46" x2="48" y2="46" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6"/>';
for (var i = 0; i < ys.length; i++) {
	var x = 9 + i * 7;
	if (ys[i] === null) {
		s += '<circle cx="' + x + '" cy="46" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"/>';
	} else {
		s += '<circle cx="' + x + '" cy="' + ys[i] + '" r="2" fill="currentColor" opacity="0.6"/>';
	}
}
return s;
'''

[miniCharts.interp]
# A rising series; the gap is filled on the straight line between its neighbours
svg = '''
var s = '';
var ys = [62, 55, null, 41, 36, 28];
s += '<line x1="16" y1="55" x2="30" y2="41" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6"/>';
for (var i = 0; i < ys.length; i++) {
	var x = 9 + i * 7;
	if (ys[i] === null) {
		s += '<circle cx="' + x + '" cy="48" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"/>';
	} else {
		s += '<circle cx="' + x + '" cy="' + ys[i] + '" r="2" fill="currentColor" opacity="0.6"/>';
	}
}
return s;
'''

[miniCharts.locf]
# A step series; the last observed value is carried forward into the gap
svg = '''
var s = '';
var ys = [56, 56, 40, null, 34, 34];
s += '<path d="M23,40 H30" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6"/>';
for (var i = 0; i < ys.length; i++) {
	var x = 9 + i * 7;
	if (ys[i] === null) {
		s += '<circle cx="' + x + '" cy="40" r="2.8" fill="none" stroke="currentColor" stroke-width="1.5"/>';
	} else {
		s += '<circle cx="' + x + '" cy="' + ys[i] + '" r="2" fill="currentColor" opacity="0.6"/>';
	}
}
return s;
'''

[miniCharts.svd]
# A matrix equals a tall and a wide factor; the missing cell is recovered
svg = '''
var s = '';
for (var r = 0; r < 4; r++) {
	for (var c = 0; c < 4; c++) {
		var miss = r === 1 && c === 2;
		s += '<rect x="' + (5 + c * 6) + '" y="' + (30 + r * 6) + '" width="5" height="5" fill="' + (miss ? 'none' : 'currentColor') + '" stroke="currentColor" stroke-width="' + (miss ? 1.2 : 0) + '" opacity="' + (miss ? 1 : 0.5) + '"/>';
	}
}
s += '<rect x="33" y="30" width="5" height="23" fill="currentColor" opacity="0.6"/>';
s += '<rect x="40" y="30" width="11" height="5" fill="currentColor" opacity="0.6"/>';
return s;
'''

[[codeBranches]]
model = "drop"
code = '''
using Impute, Tables

tbl = Tables.columntable({{data}})  # named tuple of column vectors, from any Tables.jl source
{{?target=obs}}method = x -> Impute.dropobs(x)  # keep only the complete rows
{{?target=vars}}method = x -> Impute.dropvars(x)  # keep only the complete columns
result = method(tbl)
println("Rows before: ", length(first(tbl)), ", after: ", isempty(result) ? 0 : length(first(result)))
println("Columns before: ", length(tbl), ", after: ", length(result))
'''

[[codeBranches]]
model = "sub"
code = '''
using Impute, Tables, Statistics
{{?statistic=mode}}using StatsBase

tbl = Tables.columntable({{data}})  # named tuple of column vectors, from any Tables.jl source
method = x -> Impute.substitute(x; statistic={{statistic}})  # per-column {{statistic}} of the observed values
result = method(tbl)
println("Missing cells before: ", count(ismissing, Tables.matrix(tbl)), ", after: ", count(ismissing, Tables.matrix(result)))
'''

[[codeBranches]]
model = "interp"
code = '''
using Impute, Tables

tbl = Tables.columntable({{data}})  # rows in their natural (time) order
method = x -> Impute.interp(x)  # linear interpolation between the neighbouring observed values
result = method(tbl)
println("Missing cells before: ", count(ismissing, Tables.matrix(tbl)), ", after: ", count(ismissing, Tables.matrix(result)))  # leading and trailing gaps remain
'''

[[codeBranches]]
model = "locf"
code = '''
using Impute, Tables

tbl = Tables.columntable({{data}})  # rows in their natural (time) order
{{?direction=locf}}method = x -> Impute.locf(x)  # carry the last observation forward
{{?direction=nocb}}method = x -> Impute.nocb(x)  # carry the next observation backward
result = method(tbl)
println("Missing cells before: ", count(ismissing, Tables.matrix(tbl)), ", after: ", count(ismissing, Tables.matrix(result)))
'''

[[codeBranches]]
model = "svd"
code = '''
using Impute, Tables

tbl = Tables.columntable({{data}})  # all columns must be numeric
method = x -> Tables.columntable(Tables.table(Impute.svd(Matrix{Union{Float64, Missing}}(Tables.matrix(x)); rank={{rank}}); header=collect(keys(x))))  # rank-{{rank}} matrix completion
result = method(tbl)
println("Missing cells before: ", count(ismissing, Tables.matrix(tbl)), ", after: ", count(ismissing, Tables.matrix(result)))
'''

