[[actionGroups.actions]]
id = "missing-summary"
label = "Missing Summary"
desc = "Count and fraction of missing values per column"
code = '''
n = length(first(tbl))
for (name, c) in pairs(tbl)
	k = count(ismissing, c)
	println(rpad(name, 16), k, " missing (", round(100 * k / n, digits=1), "%)")
end
println("Complete rows: ", count(i -> all(c -> !ismissing(c[i]), tbl), 1:n), " of ", n)
'''

[[actionGroups.actions]]
id = "mcar-check"
label = "MCAR Check"
desc = "Do other columns differ between rows where a value is missing and rows where it is observed?"
code = '''
using Statistics

numeric = [n for n in keys(tbl) if nonmissingtype(eltype(tbl[n])) <: Real]
for a in numeric, b in numeric
	a == b && continue
	gone = ismissing.(tbl[a])
	(any(gone) && !all(gone)) || continue
	x_gone = collect(skipmissing(tbl[b][gone]))
	x_kept = collect(skipmissing(tbl[b][.!gone]))
	(isempty(x_gone) || isempty(x_kept)) && continue
	d = (mean(x_gone) - mean(x_kept)) / std(collect(skipmissing(tbl[b])))  # standardised mean difference
	println(rpad(b, 12), " when ", rpad(a, 12), " is missing: d = ", round(d, digits=2), abs(d) > 0.5 ? "  <- missingness depends on observed data" : "")
end
# small d everywhere is consistent with MCAR (missing completely at random); this is a heuristic, not Little's formal test
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "holdout"
label = "Holdout Evaluation"
desc = "Hide 20% of the observed values, impute them, then measure the reconstruction error"
code = '''
using Random, Statistics

{{?model=drop}}println("Holdout evaluation does not apply to Drop: dropping removes the hidden values instead of reconstructing them")
{{?model!=drop}}Random.seed!(1)
{{?model!=drop}}col    = findfirst(c -> nonmissingtype(eltype(c)) <: Real, collect(tbl))  # first numeric column
{{?model!=drop}}seen   = findall(!ismissing, tbl[col])
{{?model!=drop}}hidden = seen[randperm(length(seen))[1:max(1, div(length(seen), 5))]]  # 20% of the observed values
{{?model!=drop}}masked = map(c -> Vector{Union{eltype(c), Missing}}(c), tbl)  # copy that can hold missing
{{?model!=drop}}masked[col][hidden] .= missing
{{?model!=drop}}filled = method(masked)[col][hidden]
{{?model!=drop}}ok     = .!ismissing.(filled)  # interpolation and LOCF cannot fill every position
{{?model!=drop}}rmse   = sqrt(mean((filled[ok] .- tbl[col][hidden[ok]]) .^ 2))
{{?model!=drop}}println("Column ", keys(tbl)[col], ": RMSE = ", round(rmse, sigdigits=4), " over ", count(ok), " hidden values (std of column = ", round(std(skipmissing(tbl[col])), sigdigits=4), ")")
'''

[[actionGroups.actions]]
id = "chain-fill"
label = "Chain Fill"
desc = "Follow the method with LOCF and NOCB to cover any leading and trailing gaps"
code = '''
using Impute, Tables

complete = result |> Impute.locf |> Impute.nocb  # LOCF fills trailing gaps, NOCB fills leading gaps
println("Missing cells remaining: ", isempty(complete) ? 0 : count(ismissing, Tables.matrix(complete)))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "method-comparison"
label = "Method Comparison"
desc = "Holdout RMSE of Substitute, Interpolate, LOCF, and SVD on the numeric columns"
code = '''
using Impute, Tables, Random, Statistics

num = Tables.matrix(tbl[Tuple(n for n in keys(tbl) if nonmissingtype(eltype(tbl[n])) <: Real)])
Random.seed!(1)
seen   = findall(!ismissing, num)
hidden = seen[randperm(length(seen))[1:max(1, div(length(seen), 5))]]  # hide 20% of the observed cells
masked = Matrix{Union{Float64, Missing}}(num)
masked[hidden] .= missing
truth  = num[hidden]

as_table(M) = Tables.columntable(Tables.table(M))
candidates = [
	"Substitute (mean)" => M -> Tables.matrix(Impute.substitute(as_table(M); statistic=mean)),
	"Interpolate"       => M -> Tables.matrix(Impute.interp(as_table(M))),
	"LOCF"              => M -> Tables.matrix(Impute.locf(as_table(M))),
	"SVD (rank 2)"      => M -> Impute.svd(M; rank=min(2, size(M, 2) - 1)),
]
for (name, impute) in candidates
	guess = impute(masked)[hidden]
	done  = .!ismissing.(guess)
	println(rpad(name, 20), "RMSE = ", round(sqrt(mean((guess[done] .- truth[done]) .^ 2)), sigdigits=4), "  (", count(done), " of ", length(done), " filled)")
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "distribution-shift"
label = "Distribution Shift"
desc = "Compare the observed and the post-imputation distribution of a column"
code = '''
using Plots

col = findfirst(n -> nonmissingtype(eltype(tbl[n])) <: Real, collect(keys(tbl)))  # first numeric column
name = keys(tbl)[col]
histogram(collect(skipmissing(tbl[name])), alpha=0.5, normalize=:pdf, label="Observed")
haskey(result, name) && histogram!(collect(skipmissing(result[name])), alpha=0.5, normalize=:pdf, label="After {{model}}", title=string(name))  # a spike at the mean signals Substitute
'''

[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity Analysis"
desc = "How the mean and standard deviation of each column change under different methods"
code = '''
using Impute, Statistics

numeric = [n for n in keys(tbl) if nonmissingtype(eltype(tbl[n])) <: Real]
variants = [
	"Drop rows"   => Impute.dropobs(tbl),
	"Mean"        => Impute.substitute(tbl; statistic=mean),
	"Interpolate" => Impute.interp(tbl),
	"LOCF"        => Impute.locf(tbl),
]
for n in numeric
	println(n)
	for (name, t) in variants
		v = collect(skipmissing(t[n]))
		println("  ", rpad(name, 12), "mean = ", round(mean(v), sigdigits=4), "  std = ", round(std(v), sigdigits=4))
	end
end
'''
