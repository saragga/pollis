[[codeBranches]]
model = "submissions"
code = """
using EDGAR

# SEC requires a User-Agent with your name and a contact email (no API key).
# Click "Set contact" on the Powered-by line once; Pollis injects it as
# ENV["SEC_USER_AGENT"], which EDGAR.jl reads automatically on every request.

# Submissions history by 10-digit zero-padded CIK (Apple Inc. = 320193)
sub = fetch_submissions("0000320193")

println(sub.name, " - ", sub.sicDescription)

# filings.recent holds parallel arrays: form, filingDate, accessionNumber, ...
recent = sub.filings.recent
for i in 1:5
    println(recent.filingDate[i], "  ", recent.form[i], "  ", recent.primaryDocument[i])
end
"""

[[codeBranches]]
model = "facts"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# Every XBRL fact a company has reported, in one document
facts = company_facts("320193")

# Concepts live under taxonomies; us-gaap has a hyphen, so index by Symbol
gaap = facts.facts[Symbol("us-gaap")]
tags = collect(keys(gaap))
println("us-gaap concepts reported: ", length(tags))
println(first(tags, 10))
"""

[[codeBranches]]
model = "concept"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# One us-gaap concept over time: net income (NetIncomeLoss)
concept = company_concept("320193", "us-gaap", "NetIncomeLoss")

# Values are grouped by unit (here USD); each entry has end, form, val, ...
for o in last(concept.units.USD, 5)
    println(o.end, "  ", o.form, "  ", o.val)
end
"""

[[codeBranches]]
model = "frames"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# One concept, one period, every filer that reported it.
# Trailing "I" = instantaneous (a point in time); omit it for durations.
frame = xbrl_frames("us-gaap", "AccountsPayableCurrent", "USD", "CY2019Q1I")

println("Filers reporting: ", length(frame.data))
for d in first(frame.data, 5)
    println(d.entityName, "  ", d.val)
end
"""

[[codeBranches]]
model = "search"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# Full-text search across filing contents (2001 onward), limited to 10-K forms
res = full_text_search("climate risk"; forms = "10-K")

println("Total matches: ", res.hits.total.value)
for h in first(res.hits.hits, 5)
    src = h._source
    println(src.file_date, "  ", src.form, "  ", first(src.display_names))
end
"""

# Next Steps action groups (task-oriented, matched to the EDGAR REST APIs)
[[actionGroups]]
id = "submissions"
label = "Submissions"

[[actionGroups.actions]]
id = "edgar-sub-recent"
label = "Recent 10-K / 10-Q"
desc = "List only the annual and quarterly report filings"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

recent = fetch_submissions("0000320193").filings.recent

for i in eachindex(recent.form)
    if recent.form[i] in ("10-K", "10-Q")
        println(recent.filingDate[i], "  ", recent.form[i])
    end
end
"""

[[actionGroups.actions]]
id = "edgar-sub-url"
label = "Filing Document URL"
desc = "Build the public URL for a filing's primary document"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

cik = 320193
recent = fetch_submissions(lpad(cik, 10, '0')).filings.recent

acc = replace(recent.accessionNumber[1], "-" => "")
doc = recent.primaryDocument[1]
println("https://www.sec.gov/Archives/edgar/data/$cik/$acc/$doc")
"""

[[actionGroups.actions]]
id = "edgar-sub-download"
label = "Download Filings (ScrapeSEC)"
desc = "Pull the raw 10-K documents in bulk with ScrapeSEC.jl"
code = """
using ScrapeSEC

# The JSON APIs give metadata and XBRL facts; ScrapeSEC.jl fetches the
# actual filing DOCUMENTS. It works off EDGAR's quarterly index files.

# 1) download the metadata index files for a year range
download_metadata_files(2023, 2023)

# 2) consolidate them into one index
create_main_index()

# 3) download just the 10-K documents listed in that index
download_filings("./metadata/main_idx.tsv"; filing_types = ["10-K"])
"""

[[actionGroups]]
id = "facts"
label = "Company Facts"

[[actionGroups.actions]]
id = "edgar-facts-concept"
label = "Pick One Concept"
desc = "Read a single concept's latest annual value out of company facts"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

facts = company_facts("320193")

assets = facts.facts[Symbol("us-gaap")].Assets.units.USD
annual = filter(o -> o.form == "10-K", assets)
println("Latest reported total assets: ", last(annual).val)
"""

[[actionGroups.actions]]
id = "edgar-facts-units"
label = "List Reported Units"
desc = "See which units (USD, shares, ...) a concept is reported in"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

facts = company_facts("320193")

shares = facts.facts[Symbol("us-gaap")].CommonStockSharesOutstanding
println("Units available: ", collect(keys(shares.units)))
"""

[[actionGroups]]
id = "concept"
label = "Company Concept"

[[actionGroups.actions]]
id = "edgar-con-revenue"
label = "Revenue Over Time"
desc = "Annual revenue from the contract-with-customer concept"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

tag = "RevenueFromContractWithCustomerExcludingAssessedTax"
rev = company_concept("320193", "us-gaap", tag).units.USD

for o in filter(o -> o.form == "10-K", rev)
    println(o.fy, "  ", o.val)
end
"""

[[actionGroups.actions]]
id = "edgar-con-compare"
label = "Compare Two Filers"
desc = "Pull the same concept for two companies and compare"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

function latest_net_income(cik)
    concept = company_concept(string(cik), "us-gaap", "NetIncomeLoss")
    annual = filter(o -> o.form == "10-K", concept.units.USD)
    return last(annual).val
end

println("Apple:     ", latest_net_income(320193))
println("Microsoft: ", latest_net_income(789019))
"""

[[actionGroups]]
id = "frames"
label = "Frames"

[[actionGroups.actions]]
id = "edgar-fr-top"
label = "Largest Filers"
desc = "Rank filers by a concept for a single period"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

data = xbrl_frames("us-gaap", "Assets", "USD", "CY2022Q4I").data

top = sort(collect(data); by = d -> d.val, rev = true)
for d in first(top, 5)
    println(d.entityName, "  ", d.val)
end
"""

[[actionGroups.actions]]
id = "edgar-fr-duration"
label = "Duration Concept"
desc = "A flow concept (revenue) summed over a full year, across filers"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# No trailing "I": CY2022 is a duration (the whole year), used for flows
data = xbrl_frames("us-gaap", "Revenues", "USD", "CY2022").data
println("Filers with full-year revenue: ", length(data))
"""

[[actionGroups]]
id = "search"
label = "Full-Text Search"

[[actionGroups.actions]]
id = "edgar-se-phrase"
label = "Phrase in 10-Ks"
desc = "Search an exact phrase, restricted to annual reports and a date range"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

res = full_text_search("supply chain disruption"; forms = "10-K", startdate = "2023-01-01", enddate = "2023-12-31")
println("Matches in 2023 10-Ks: ", res.hits.total.value)
"""

[[actionGroups.actions]]
id = "edgar-se-ticker"
label = "Ticker to CIK"
desc = "Resolve a stock ticker to its CIK using the SEC's ticker map"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

println("AAPL -> CIK ", cik_for_ticker("AAPL"))
"""
