using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

rows = filings_by_cik(320193; forms = ["10-K", "10-Q"])

for r in rows
    println(r.filed, "  ", r.form, "  period ending ", r.reportDate)
end
"""

[[actionGroups.actions]]
id = "edgar-sub-url"
label = "Filing Document URL"
desc = "Build the public URL for a filing's primary document"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

filer = 320193
r = first(filings_by_cik(filer; forms = "10-K"))  # the latest 10-K

acc = replace(r.accession, "-" => "")  # the archive folder drops the dashes
println("https://www.sec.gov/Archives/edgar/data/$filer/$acc/$(r.document)")
"""

[[actionGroups.actions]]
id = "edgar-sub-download"
label = "Download Filings (ScrapeSEC)"
desc = "Pull the raw 10-K documents in bulk with ScrapeSEC.jl"
code = """
using ScrapeSEC

# The JSON APIs give metadata and XBRL facts; ScrapeSEC.jl fetches the
# actual filing DOCUMENTS. It works off EDGAR's quarterly index files.

# 1) download the metadata index files for a year range
download_metadata_files(2023, 2023)

# 2) consolidate them into one index
create_main_index()

# 3) download just the 10-K documents listed in that index
download_filings("./metadata/main_idx.tsv"; filing_types = ["10-K"])
"""

[[actionGroups]]
id = "facts"
label = "Company Facts"

[[actionGroups.actions]]
id = "edgar-facts-concept"
label = "Pick One Concept"
desc = "Read a single concept's latest annual value out of company facts"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

facts = company_facts("320193")

assets = facts.facts[Symbol("us-gaap")].Assets.units.USD
annual = filter(o -> o.form == "10-K", assets)
latest = last(sort(annual, by = o -> getproperty(o, :end)))  # a 10-K also repeats the prior year-end: take the latest balance-sheet date
println("Total assets at ", getproperty(latest, :end), ": ", latest.val)
"""

[[actionGroups.actions]]
id = "edgar-facts-units"
label = "List Reported Units"
desc = "See which units (USD, shares, ...) a concept is reported in"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

facts = company_facts("320193")

shares = facts.facts[Symbol("us-gaap")].CommonStockSharesOutstanding
println("Units available: ", collect(keys(shares.units)))
"""

[[actionGroups]]
id = "concept"
label = "Company Concept"

[[actionGroups.actions]]
id = "edgar-con-revenue"
label = "Revenue Over Time"
desc = "Annual revenue across the pre-2018 and ASC 606 revenue tags, one fact per year"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# Apple tagged revenue as SalesRevenueNet until FY2017, then switched to the
# ASC 606 contract-with-customer tag, so one tag alone gives a broken series
tags = ["SalesRevenueNet", "RevenueFromContractWithCustomerExcludingAssessedTax"]

annual = Dict{String, Any}()
for tag in tags
    for o in company_concept("320193", "us-gaap", tag).units.USD
        # each 10-K repeats the two prior years as comparatives; the frame field keeps
        # one canonical fact per calendar year (quarterly frames contain a Q)
        if haskey(o, :frame) && !occursin('Q', o.frame)
            annual[String(o.frame)] = (start = o.start, stop = getproperty(o, :end), val = o.val, tag = tag)
        end
    end
end

for f in sort(collect(keys(annual)))
    a = annual[f]
    println(f, "  ", a.start, " to ", a.stop, "  ", a.val, "  (", a.tag, ")")
end
"""

[[actionGroups.actions]]
id = "edgar-con-compare"
label = "Compare Two Filers"
desc = "Pull the same concept for two companies and compare"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

function latest_net_income(cik)
    concept = company_concept(string(cik), "us-gaap", "NetIncomeLoss")
    annual = filter(o -> o.form == "10-K", concept.units.USD)
    latest = last(sort(annual, by = o -> getproperty(o, :end)))  # latest fiscal year, not a prior-year comparative
    return (period_end = getproperty(latest, :end), net_income = latest.val)  # fiscal years end in different months (Apple: September, Microsoft: June)
end

println("Apple:     ", latest_net_income(320193))
println("Microsoft: ", latest_net_income(789019))
"""

[[actionGroups]]
id = "frames"
label = "Frames"

[[actionGroups.actions]]
id = "edgar-fr-top"
label = "Largest Filers"
desc = "Rank filers by a concept for a single period"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

data = xbrl_frames("us-gaap", "Assets", "USD", "CY2022Q4I").data

top = sort(collect(data); by = d -> d.val, rev = true)
for d in first(top, 5)
    println(d.entityName, "  ", d.val)
end
"""

[[actionGroups.actions]]
id = "edgar-fr-duration"
label = "Duration Concept"
desc = "A flow concept (revenue) over a full year, across filers and revenue tags"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# No trailing "I": CY2022 is a duration (the whole year), used for flows.
# Filers choose different revenue tags, so any one tag undercounts them
tags = ["Revenues", "RevenueFromContractWithCustomerExcludingAssessedTax", "RevenueFromContractWithCustomerIncludingAssessedTax", "SalesRevenueNet"]

ciks = Set{Int}()
for tag in tags
    data = xbrl_frames("us-gaap", tag, "USD", "CY2022").data
    union!(ciks, (d.cik for d in data))
    println(rpad(tag, 54), length(data), " filers")
end
println("Filers with any of these tags: ", length(ciks))
"""

[[actionGroups]]
id = "search"
label = "Full-Text Search"

[[actionGroups.actions]]
id = "edgar-se-phrase"
label = "Phrase in 10-Ks"
desc = "Search an exact phrase, restricted to annual reports and a date range"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# EFTS returns 100 rows per page and no total count: page until a short page
n, from = 0, 0
while true
    rows = full_text_search("supply chain disruption"; forms = "10-K", startdate = "2023-01-01", enddate = "2023-12-31", from = from)
    global n += length(rows)
    (length(rows) < 100 || from >= 9900) && break  # EFTS stops paging at 10000 hits
    global from += 100
end
println("2023 10-K filings with the phrase: ", n)
"""

[[actionGroups.actions]]
id = "edgar-se-ticker"
label = "Ticker to CIK"
desc = "Resolve a stock ticker to its CIK using the SEC's ticker map"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# cik() matches names and tickers; by = :ticker matches the ticker exactly
println("AAPL -> CIK ", only(cik("AAPL"; by = :ticker)).cik)
"""
