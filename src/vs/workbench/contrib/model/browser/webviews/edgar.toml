# US SEC EDGAR Webview Configuration
# Declarative source. The build script generates edgar.data.ts.
# Run: npm run gulp compile-toml
#
# Approach: the SEC EDGAR REST APIs (data.sec.gov) return clean JSON and need NO
# API key — but every request MUST send a User-Agent header declaring your app and
# a contact email, or the SEC returns 403. We use EDGAR.jl (which wraps HTTP.jl +
# JSON3.jl) and stop at JSON3 objects / NamedTuples; the user pipes those into
# TimeSeries or any Tables.jl sink downstream. EDGAR.jl reads the contact from the
# SEC_USER_AGENT env var that Pollis injects. Fair-access limit: 10 requests/sec.

[meta]
title = "US SEC EDGAR"
viewType = "pollis.edgar"
defaultModel = "submissions"
models = ["submissions", "facts", "concept", "frames", "search"]
wideLayout = true
illusCollapsed = true
illustrationText = "Pull company filings and financial data from the SEC EDGAR REST APIs into Julia: submission histories, XBRL company facts and concepts, cross-filer frames, and full-text search."

# Per-pane intro/footnote notes (optional, keyed by pane: keyPoints / decision / explore).
[notes.decision]
footnote = "The rows above are the structured-data JSON APIs on data.sec.gov. They return parsed facts and metadata, never the filing documents themselves. To download the raw 10-K/10-Q text or HTML in bulk, use ScrapeSEC.jl instead (last row) — it is the complement to these APIs, not a substitute for any single one."

