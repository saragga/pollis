[[codeBranches]]
model = "submissions"
code = """
using EDGAR

# SEC requires a User-Agent with your name and a contact email (no API key).
# Click "Set contact" on the Powered-by line once; Pollis injects it as
# ENV["SEC_USER_AGENT"], which EDGAR.jl reads automatically on every request.

# Filer profile from the submissions API (Apple Inc. = CIK 320193)
p = profile(320193)
println(p.name, " - ", p.sicDescription, " (fiscal year ends ", p.fiscalYearEnd, ")")

# One row per filing, newest first, 100 per page (from = 100, 200, ... for older ones)
rows = filings_by_cik(320193)
for r in first(rows, 5)
    println(r.filed, "  ", r.form, "  ", r.document)
end
"""

[[codeBranches]]
model = "facts"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# Every XBRL fact a company has reported, in one document
facts = company_facts("320193")

# Concepts live under taxonomies; us-gaap has a hyphen, so index by Symbol
gaap = facts.facts[Symbol("us-gaap")]
tags = collect(keys(gaap))
println("us-gaap concepts reported: ", length(tags))
println(first(tags, 10))
"""

[[codeBranches]]
model = "concept"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# One us-gaap concept over time: net income (NetIncomeLoss)
concept = company_concept("320193", "us-gaap", "NetIncomeLoss")

# Values are grouped by unit (here USD). The raw entries mix quarters and years and
# repeat each period as a comparative in later filings. The frame field marks the one
# canonical fact per calendar period (CY2023 = a year, CY2023Q1 = a quarter)
annual = filter(o -> haskey(o, :frame) && !occursin('Q', o.frame), concept.units.USD)
for o in last(annual, 5)
    println(o.frame, "  ", o.start, " to ", getproperty(o, :end), "  ", o.form, "  ", o.val)
end
"""

[[codeBranches]]
model = "frames"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# One concept, one period, every filer that reported it.
# Trailing "I" = instantaneous (a point in time); omit it for durations.
frame = xbrl_frames("us-gaap", "AccountsPayableCurrent", "USD", "CY2019Q1I")

println("Filers reporting: ", length(frame.data))
for d in first(frame.data, 5)
    println(d.entityName, "  ", d.val)
end
"""

[[codeBranches]]
model = "search"
code = """
using EDGAR
# Contact is injected by Pollis as ENV["SEC_USER_AGENT"] and read automatically.

# Full-text search across filing contents (2001 onward), limited to 10-K forms.
# Returns one row per filing, ranked by relevance, 100 rows per page
rows = full_text_search("climate risk"; forms = "10-K")

println("Hits on the first page: ", length(rows))
for r in first(rows, 5)
    println(r.filed, "  ", r.form, "  ", r.entity)
end
"""

