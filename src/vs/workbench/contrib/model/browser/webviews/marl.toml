[[actionGroups.actions]]
id = "vs-random"
label = "Evaluation"
desc = "Cooperative: success rate and mean steps of the greedy joint policy when one agent instead acts randomly. Competitive: win, draw and loss shares over 400 games against random and perfect opponents"
code = '''
{{?model=cooperative}}function with_random_agent(j; reps=200, rng=MersenneTwister(4))
{{?model=cooperative}}    steps = map(1:reps) do k
{{?model=cooperative}}        s = Tuple(starts)
{{?model=cooperative}}        for t in 1:maxsteps
{{?model=cooperative}}            a = collect(res.greedy(s)); j > 0 && (a[j] = rand(rng, 1:5))
{{?model=cooperative}}            s, r, done = step_env(s, Tuple(a))
{{?model=cooperative}}            done && return t
{{?model=cooperative}}        end
{{?model=cooperative}}        maxsteps
{{?model=cooperative}}    end
{{?model=cooperative}}    (random_agent = j == 0 ? "none" : "agent $j", met_share = mean(steps .< maxsteps), mean_steps = mean(steps))
{{?model=cooperative}}end
{{?model=cooperative}}[with_random_agent(j) for j in 0:N]
