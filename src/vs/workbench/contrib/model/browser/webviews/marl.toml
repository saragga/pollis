[[codeBranches]]
model = "cooperative"
code = '''
using Random, Statistics

episodes = {{episodes}}  # training episodes
alpha, epsilon = {{alpha}}, {{eps}}  # learning rate, exploration
seed = {{seed}}  # random seed
N, n = {{nagents}}, {{size}}  # agents (2 to 4), grid side
gamma = {{gamma}}  # discount factor
learner = "{{learner}}"  # iql, vdn or central
maxsteps = 4n  # step cap per episode

# Rendezvous: reward -1 per step until all agents stand on the same cell
moves = [(0, 0), (-1, 0), (0, 1), (1, 0), (0, -1)]  # stay, up, right, down, left
starts = [(1, 1), (n, n), (1, n), (n, 1)][1:N]
move(p, a) = (clamp(p[1] + moves[a][1], 1, n), clamp(p[2] + moves[a][2], 1, n))
step_env(s, a) = (s2 = Tuple(move(s[i], a[i]) for i in 1:N); (s2, -1.0, all(==(s2[1]), s2)))
joint = vec(collect(Iterators.product(fill(1:5, N)...)))  # all joint actions

function train(; learner=learner, episodes=episodes, seed=seed, epsilon=epsilon)
    rng = MersenneTwister(seed)
    Qs = [Dict{Any, Vector{Float64}}() for i in 1:N]  # per-agent tables (IQL, VDN)
    Qj = Dict{Any, Vector{Float64}}()  # joint-action table (central)
    qi(i, s) = get!(() -> zeros(5), Qs[i], s)
    qj(s) = get!(() -> zeros(length(joint)), Qj, s)
    greedy(s) = learner == "central" ? joint[argmax(qj(s))] : Tuple(argmax(qi(i, s)) for i in 1:N)
    function act(s)
        learner == "central" && return (rand(rng) < epsilon ? rand(rng, joint) : greedy(s))
        Tuple(rand(rng) < epsilon ? rand(rng, 1:5) : argmax(qi(i, s)) for i in 1:N)
    end
    lens = zeros(Int, episodes); qtrace = zeros(episodes)
    for ep in 1:episodes
        s = Tuple(starts)
        for t in 1:maxsteps
            a = act(s); s2, r, done = step_env(s, a)
            if learner == "iql"  # each agent treats the others as part of the environment
                for i in 1:N
                    q = qi(i, s); q[a[i]] += alpha * (r + (done ? 0.0 : gamma * maximum(qi(i, s2))) - q[a[i]])
                end
            elseif learner == "vdn"  # shared TD error of Q_tot = sum_i Q_i
                d = r + (done ? 0.0 : gamma * sum(maximum(qi(i, s2)) for i in 1:N)) - sum(qi(i, s)[a[i]] for i in 1:N)
                for i in 1:N
                    qi(i, s)[a[i]] += alpha * d / N
                end
            else  # one Q over joint actions
                q = qj(s); k = findfirst(==(a), joint)
                q[k] += alpha * (r + (done ? 0.0 : gamma * maximum(qj(s2))) - q[k])
            end
            s = s2; lens[ep] = t
            done && break
        end
        s0 = Tuple(starts)
        qtrace[ep] = learner == "central" ? maximum(qj(s0)) : learner == "vdn" ? sum(maximum(qi(i, s0)) for i in 1:N) : mean(maximum(qi(i, s0)) for i in 1:N)
    end
    (greedy = greedy, lens = lens, qtrace = qtrace, Qs = Qs, Qj = Qj, qi = qi, qj = qj)
end

function rollout(policy)  # greedy joint trajectory from the start
    s = Tuple(starts); path = [s]
    for t in 1:maxsteps
        s, r, done = step_env(s, policy(s)); push!(path, s)
        done && break
    end
    path
end
movavg(x, w) = [mean(x[max(1, i - w + 1):i]) for i in eachindex(x)]

res = train()
path = rollout(res.greedy)
(learner = learner, greedy_steps_to_meet = all(==(path[end][1]), path[end]) ? length(path) - 1 : missing, lower_bound = n - 1,
 mean_steps_last_100 = mean(res.lens[max(1, end - 99):end]), states_visited = learner == "central" ? length(res.Qj) : length(res.Qs[1]))
'''

[[codeBranches]]
model = "competitive"
code = '''
using Random, Statistics

episodes = {{episodes}}  # self-play games
alpha, epsilon = {{alpha}}, {{eps}}  # learning rate, exploration
seed = {{seed}}  # random seed

# Tic-tac-toe: board of 9 cells, +1 = X (moves first), -1 = O, 0 = empty
wins = [(1, 2, 3), (4, 5, 6), (7, 8, 9), (1, 4, 7), (2, 5, 8), (3, 6, 9), (1, 5, 9), (3, 5, 7)]
function winner(b)
    for (i, j, k) in wins
        b[i] != 0 && b[i] == b[j] == b[k] && return b[i]
    end
    0
end
place(b, m, p) = (c = copy(b); c[m] = p; c)
isover(b) = winner(b) != 0 || all(!=(0), b)

# One afterstate value table shared by both sides, stored from the mover's perspective (board times player)
function value(V, b, p)
    winner(b) == p && return 1.0
    all(!=(0), b) && return 0.0
    get(V, b .* p, 0.0)
end
greedy_move(V, b, p, rng) = (ms = findall(==(0), b); vs = [value(V, place(b, m, p), p) for m in ms]; rand(rng, ms[vs .== maximum(vs)]))
random_move(b, p, rng) = rand(rng, findall(==(0), b))

memo = Dict{Vector{Int}, Int}()
function negamax(b, p)  # value for player p to move under perfect play (1 win, 0 draw, -1 loss)
    get!(memo, b .* p) do
        maximum(winner(place(b, m, p)) == p ? 1 : all(!=(0), place(b, m, p)) ? 0 : -negamax(place(b, m, p), -p) for m in findall(==(0), b))
    end
end
function perfect_move(b, p, rng)
    ms = findall(==(0), b)
    vs = [winner(place(b, m, p)) == p ? 1 : all(!=(0), place(b, m, p)) ? 0 : -negamax(place(b, m, p), -p) for m in ms]
    rand(rng, ms[vs .== maximum(vs)])
end

function play(px, po, rng)  # px, po: (board, player, rng) -> move; returns the winner (0 = draw)
    b = zeros(Int, 9); p = 1
    while !isover(b)
        b = place(b, (p == 1 ? px : po)(b, p, rng), p); p = -p
    end
    winner(b)
end

function selfplay_game!(V, rng; alpha=alpha, epsilon=epsilon)  # TD(0) on afterstates, both sides share V
    b = zeros(Int, 9); p = 1; last = Dict{Int, Vector{Int}}()
    while true
        nb = place(b, rand(rng) < epsilon ? random_move(b, p, rng) : greedy_move(V, b, p, rng), p)
        if haskey(last, p)  # move this player's previous afterstate towards its new one
            k = last[p] .* p; V[k] = get(V, k, 0.0) + alpha * (value(V, nb, p) - get(V, k, 0.0))
        end
        last[p] = nb
        if isover(nb)
            if haskey(last, -p)  # the opponent's last afterstate led to this loss or draw
                k = last[-p] .* (-p); target = winner(nb) == p ? -1.0 : 0.0
                V[k] = get(V, k, 0.0) + alpha * (target - get(V, k, 0.0))
            end
            return winner(nb)
        end
        b = nb; p = -p
    end
end

function evaluate(V, opponent; games=200, rng=MersenneTwister(123))  # (win, draw, loss) shares, half as X and half as O
    me = (b, p, r) -> greedy_move(V, b, p, r)
    out = [play(me, opponent, rng) for k in 1:div(games, 2)]
    out2 = [-play(opponent, me, rng) for k in 1:div(games, 2)]
    o = [out; out2]
    (win = mean(o .== 1), draw = mean(o .== 0), loss = mean(o .== -1))
end
randomp = (b, p, r) -> random_move(b, p, r)
movavg(x, w) = [mean(x[max(1, i - w + 1):i]) for i in eachindex(x)]
perfectp = (b, p, r) -> perfect_move(b, p, r)

function train(; episodes=episodes, seed=seed, alpha=alpha, epsilon=epsilon, checkpoints=20)
    rng = MersenneTwister(seed); V = Dict{Vector{Int}, Float64}()
    hist = (game = Int[], vs_random = NamedTuple[], vs_perfect = NamedTuple[], outcomes = Int[])
    for g in 1:episodes
        push!(hist.outcomes, selfplay_game!(V, rng; alpha, epsilon))
        if g % max(1, div(episodes, checkpoints)) == 0
            push!(hist.game, g); push!(hist.vs_random, evaluate(V, randomp)); push!(hist.vs_perfect, evaluate(V, perfectp))
        end
    end
    (V = V, hist = hist)
end

res = train()
(states_learned = length(res.V), vs_random = res.hist.vs_random[end], vs_perfect = res.hist.vs_perfect[end])
'''

