[[bullets]]
text = "Stochastic gradient descent - simple, noisy updates scaled by a fixed learning rate"
detail = ""

[[bullets]]
text = "Adam"
detail = "adaptive moment estimation; per-parameter rates via first and second gradient moments"

[[bullets]]
text = "AdaMax"
detail = "Adam variant with L∞ norm update; robust for embeddings and sparse gradients"

[[bullets]]
text = "AdaGrad - Adaptively adjusts learning rates per parameter, but its continuously shrinking learning rate can cause premature convergence. Modern deep learning therefore often prefers RMSProp or Adam."
detail = ""

[[bullets]]
text = "Momentum"
detail = "SGD with velocity accumulation; smooths oscillations and accelerates convergence"

[[bullets]]
text = "Nesterov"
detail = "momentum SGD with look-ahead gradient; corrects overshoot before it happens"

[[bullets]]
text = "RMSProp"
detail = "normalises by exponential moving avg of squared gradients; fixes AdaGrad decay"

[[bullets]]
text = "AdamW"
detail = "Adam with decoupled weight decay; prevents L2 regularisation coupling to adaptive rates"

[[decisionRows]]
task = "SGD"
context = "Baseline, or well-scaled problems with a tuned schedule"
purpose = "x -= lr * g: the plain gradient step"

[[decisionRows]]
task = "Momentum / Nesterov"
context = "Ill-conditioned valleys where plain steps zig-zag"
purpose = "Accumulate a velocity (Nesterov evaluates the gradient at the look-ahead point) to damp oscillation and speed up along the valley"

[[decisionRows]]
task = "AdaGrad / RMSProp"
context = "Parameters on very different scales, sparse features"
purpose = "Scale each coordinate by its gradient history (all of it for AdaGrad, a moving average for RMSProp)"

[[decisionRows]]
task = "Adam / AdaMax / AdamW"
context = "Default for deep learning; AdamW when regularising with weight decay"
purpose = "Momentum plus per-coordinate scaling; AdaMax uses the infinity norm, AdamW decouples weight decay from the gradient"

[[inputs]]
id = "f"
label = "Objective f(x)"
tooltip = "Julia expression for the scalar loss to minimise. Use x[1], x[2], ... for the components. The default quadratic has curvatures 2 and 20, a mild condition number of 10; raise the 10 to 100 or 1000 to see the rules differ on an ill-conditioned valley (SGD then needs lr below 2 / the largest curvature)."
default = "(x[1] - 1)^2 + 10 * (x[2] + 0.5)^2"

[[inputs]]
id = "x0"
label = "Initial Parameters x0"
tooltip = "Starting parameter vector as a Julia array."
default = "[-2.0, 1.5]"

[[inputs]]
id = "lr"
label = "Learning Rate"
tooltip = "Step size. SGD and the momentum methods work well near 0.01; Adam, AdamW and RMSProp typically use 0.001 to 0.01."
default = "0.01"
newRow = true

[[inputs]]
id = "rho"
label = "Momentum rho"
tooltip = "Fraction of the previous velocity kept at each step; 0.9 is standard."
default = "0.9"
models = ["momentum", "nesterov"]

[[inputs]]
id = "decay"
label = "Weight Decay"
tooltip = "Decoupled weight decay: each step also shrinks the parameters by lr * decay * x, independently of the adaptive scaling. It is a regulariser, so AdamW settles where the Adam step balances decay * x: short of the minimiser of f, pulled towards 0. Set 0 to recover Adam."
default = "0.01"
models = ["adamw"]

[[inputs]]
id = "iters"
label = "Iterations"
tooltip = "Number of update steps."
default = "2000"

[[inputs]]
id = "noise"
label = "Gradient Noise"
tooltip = "Standard deviation of Gaussian noise added to each gradient to imitate minibatch sampling. 0 gives the deterministic method."
default = "1.0"

