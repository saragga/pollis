[[codeBranches]]
model = "portfolio"
code = '''
using JuMP, Pajarito, HiGHS, {{solver}}, LinearAlgebra, Random

Random.seed!(1)
n = 12  # number of assets
k = {{k}}  # hold at most k assets
rmin = {{rmin}}  # target expected return
F = randn(n, n) ./ 4
Sigma = F' * F + 0.01I  # covariance of the returns
mu = 0.02 .+ 0.08 .* rand(n)  # expected returns
L = cholesky(Symmetric(Sigma)).U  # portfolio risk = norm(L * w)

# Pajarito: outer approximation with a MILP master (HiGHS) and conic subproblems ({{solver}})
conic = {{solver}}.Optimizer
pajarito() = optimizer_with_attributes(Pajarito.Optimizer,
    "oa_solver" => optimizer_with_attributes(HiGHS.Optimizer, MOI.Silent() => true),
    "conic_solver" => optimizer_with_attributes(conic, MOI.Silent() => true))

model = Model(pajarito())
set_silent(model)
@variable(model, w[1:n] >= 0)  # portfolio weights
@variable(model, z[1:n], Bin)  # z[i] = 1 when asset i is held
@variable(model, risk)
@constraint(model, sum(w) == 1)
@constraint(model, w .<= z)
card = @constraint(model, sum(z) <= k)
ret = @constraint(model, dot(mu, w) >= rmin)
@constraint(model, [risk; L * w] in SecondOrderCone())
@objective(model, Min, risk)
optimize!(model)

sol = value.(w); sol_name = "weight"
ints = z  # the integer variables
# re-solve with another cardinality (used by the Parametric Sweep)
resolve(v) = (set_normalized_rhs(card, v); optimize!(model); is_solved_and_feasible(model) ? objective_value(model) : NaN)
grid = 1:6; param_name = "cardinality k"
(status = termination_status(model), risk = objective_value(model), expected_return = dot(mu, sol),
 held = findall(>(0.5), value.(z)), weights = round.(sol[value.(z) .> 0.5]; digits=3))
'''

[[codeBranches]]
model = "subset"
code = '''
using JuMP, Pajarito, HiGHS, {{solver}}, LinearAlgebra, Random

Random.seed!(1)
m, p = 60, 10  # observations, candidate predictors
xtrue = [2; -1.5; 1; zeros(p - 3)]  # only the first three predictors matter
A = randn(m, p)
b = A * xtrue + 0.3 * randn(m)
k = {{k}}  # at most k non-zero coefficients
M = 10.0  # big-M bound on the size of a coefficient

conic = {{solver}}.Optimizer
pajarito() = optimizer_with_attributes(Pajarito.Optimizer,
    "oa_solver" => optimizer_with_attributes(HiGHS.Optimizer, MOI.Silent() => true),
    "conic_solver" => optimizer_with_attributes(conic, MOI.Silent() => true))

model = Model(pajarito())
set_silent(model)
@variable(model, x[1:p])  # coefficients
@variable(model, z[1:p], Bin)  # z[j] = 1 when predictor j is used
@variable(model, t)  # residual norm
@constraint(model, -M .* z .<= x)
@constraint(model, x .<= M .* z)
card = @constraint(model, sum(z) <= k)
@constraint(model, [t; A * x - b] in SecondOrderCone())
@objective(model, Min, t)
optimize!(model)

sol = value.(x); sol_name = "coefficient"
ints = z
resolve(v) = (set_normalized_rhs(card, v); optimize!(model); objective_value(model))
grid = 1:p; param_name = "cardinality k"
(status = termination_status(model), residual_norm = objective_value(model),
 support = findall(>(0.5), value.(z)), coefficients = round.(sol; digits=3))
'''

[[codeBranches]]
model = "logistic"
code = '''
using JuMP, Pajarito, HiGHS, {{solver}}, LinearAlgebra, Random

Random.seed!(1)
m, p = 80, 8  # observations, candidate predictors
xtrue = [1.5; -2; 1; zeros(p - 3)]  # only the first three predictors matter
X = randn(m, p)
y = [rand() < 1 / (1 + exp(-dot(X[i, :], xtrue))) ? 1.0 : -1.0 for i in 1:m]  # labels +1 / -1
k = {{k}}  # at most k non-zero coefficients
M = 10.0  # big-M bound on the size of a coefficient

conic = {{solver}}.Optimizer
pajarito() = optimizer_with_attributes(Pajarito.Optimizer,
    "oa_solver" => optimizer_with_attributes(HiGHS.Optimizer, MOI.Silent() => true),
    "conic_solver" => optimizer_with_attributes(conic, MOI.Silent() => true))

model = Model(pajarito())
set_silent(model)
@variable(model, x[1:p])
@variable(model, z[1:p], Bin)
@variable(model, t[1:m])  # t[i] >= log(1 + exp(-y[i] X[i, :]' x)), the log-loss
@variable(model, v1[1:m])
@variable(model, v2[1:m])
@constraint(model, -M .* z .<= x)
@constraint(model, x .<= M .* z)
card = @constraint(model, sum(z) <= k)
for i in 1:m
    u = -y[i] * dot(X[i, :], x)
    @constraint(model, v1[i] + v2[i] <= 1)  # exp(u - t) + exp(-t) <= 1
    @constraint(model, [u - t[i], 1, v1[i]] in MOI.ExponentialCone())
    @constraint(model, [-t[i], 1, v2[i]] in MOI.ExponentialCone())
end
@objective(model, Min, sum(t))
optimize!(model)

sol = value.(x); sol_name = "coefficient"
ints = z
resolve(v) = (set_normalized_rhs(card, v); optimize!(model); objective_value(model))
grid = 1:p; param_name = "cardinality k"
(status = termination_status(model), log_loss = objective_value(model),
 support = findall(>(0.5), value.(z)), coefficients = round.(sol; digits=3))
'''

[[codeBranches]]
model = "knapsack"
code = '''
using JuMP, Pajarito, HiGHS, {{solver}}, LinearAlgebra, Random

Random.seed!(1)
n = 20  # number of items
a = 1 .+ 4 .* rand(n)  # mean weights
s = 0.4 .* a .* rand(n)  # standard deviations of the weights (independent, normal)
v = a .+ 2 .* rand(n)  # values
C = {{C}}  # capacity
zq = 1.645  # 95% normal quantile: total weight <= C with probability 0.95

conic = {{solver}}.Optimizer
pajarito() = optimizer_with_attributes(Pajarito.Optimizer,
    "oa_solver" => optimizer_with_attributes(HiGHS.Optimizer, MOI.Silent() => true),
    "conic_solver" => optimizer_with_attributes(conic, MOI.Silent() => true))

model = Model(pajarito())
set_silent(model)
@variable(model, x[1:n], Bin)  # x[i] = 1 when item i is packed
@variable(model, u)  # u >= zq * standard deviation of the total weight
@constraint(model, [u; zq .* s .* x] in SecondOrderCone())
card = @constraint(model, dot(a, x) + u <= C)
@objective(model, Max, dot(v, x))
optimize!(model)

sol = value.(x); sol_name = "packed"
ints = x
resolve(c) = (set_normalized_rhs(card, c); optimize!(model); objective_value(model))
grid = 5:5:40; param_name = "capacity C"
(status = termination_status(model), value = objective_value(model), items = findall(>(0.5), sol),
 mean_weight = round(dot(a, sol); digits=3), weight_95pct = round(dot(a, sol) + zq * norm(s .* sol); digits=3))
'''

