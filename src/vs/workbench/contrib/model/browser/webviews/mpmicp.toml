[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "feasibility"
label = "Feasibility Check"
desc = "Termination and primal status, how far the integer variables are from whole numbers, and any violated constraint"
code = '''
(termination = termination_status(model), primal = primal_status(model),
 integrality = maximum(v -> abs(v - round(v)), value.(ints)),  # about 0
 violated = primal_feasibility_report(model; atol=1e-6))  # empty Dict = feasible
'''

[[actionGroups.actions]]
id = "relaxation-gap"
label = "Relaxation Gap"
desc = "Drop the integrality, solve the continuous conic problem, and compare: the gap is what the integer constraints cost"
code = '''
mip = objective_value(model)
undo = relax_integrality(model)
set_optimizer(model, conic); set_silent(model); optimize!(model)
relaxed = objective_value(model)
fractional = count(v -> 1e-6 < abs(v - round(v)), value.(ints))
set_optimizer(model, pajarito()); set_silent(model); undo(); optimize!(model)  # back to the mixed-integer problem
(mixed_integer = mip, relaxation = relaxed, relative_gap = abs(mip - relaxed) / (1e-9 + abs(mip)),
 fractional_in_relaxation = fractional)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "parametric"
label = "Parametric Sweep"
desc = "The optimal value as the cardinality k (or the capacity C) changes"
code = '''
using Plots

vals = resolve.(grid)
{{?model=portfolio|subset|logistic}} resolve(k)  # restore the original problem and solution
{{?model=knapsack}} resolve(C)
plot(grid, vals, marker=:circle, xlabel=param_name, ylabel="optimal value", legend=false)
'''

[[actionGroups.actions]]
id = "holdout"
label = "Holdout Error"
desc = "Fit with each k on the training data and score fresh data from the same model: the error stops falling once k reaches the true support"
models = ["subset", "logistic"]
code = '''
Random.seed!(2)
{{?model=subset}} Atest = randn(200, p); btest = Atest * xtrue + 0.3 * randn(200)
{{?model=logistic}} Xtest = randn(200, p); ytest = [rand() < 1 / (1 + exp(-dot(Xtest[i, :], xtrue))) ? 1.0 : -1.0 for i in 1:200]
{{?model=subset}} score(kk) = (resolve(kk); (k = kk, test_rmse = norm(Atest * value.(x) - btest) / sqrt(200)))
{{?model=logistic}} score(kk) = (resolve(kk); (k = kk, test_accuracy = sum(sign.(Xtest * value.(x)) .== ytest) / 200))
res = score.(1:p)
resolve(k)  # restore the original problem and solution
res
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "solver-compare"
label = "Conic Solver Comparison"
desc = "Pajarito with Hypatia and with Clarabel as the conic subproblem solver: status, objective and time"
code = '''
using Hypatia, Clarabel

res = map(["Hypatia" => Hypatia.Optimizer, "Clarabel" => Clarabel.Optimizer]) do (name, opt)
    global conic = opt
    set_optimizer(model, pajarito()); set_silent(model)
    s = @elapsed optimize!(model)
    (conic_solver = name, status = termination_status(model), objective = objective_value(model), seconds = s)
end
global conic = {{solver}}.Optimizer
set_optimizer(model, pajarito()); set_silent(model); optimize!(model)  # back on the chosen solver
res
'''

[[actionGroups.actions]]
id = "round-heuristic"
label = "vs Rounding Heuristic"
desc = "Solve the continuous relaxation, round it to an integer solution, and compare with the exact mixed-integer optimum"
code = '''
mip = objective_value(model)
undo = relax_integrality(model)
set_optimizer(model, conic); set_silent(model); optimize!(model)
r = value.(ints)
set_optimizer(model, pajarito()); set_silent(model); undo()
{{?model=portfolio|subset|logistic}} keep = partialsortperm(r, 1:k, rev=true)  # the k largest relaxed indicators
{{?model=portfolio|subset|logistic}} fixed = @constraint(model, ints .== [i in keep ? 1.0 : 0.0 for i in eachindex(r)])
{{?model=knapsack}} fixed = @constraint(model, ints .== floor.(r .+ 1e-6))  # keep only the items packed whole
optimize!(model)
heuristic = is_solved_and_feasible(model) ? objective_value(model) : NaN
delete.(model, fixed)
optimize!(model)  # back to the exact solution
(exact = mip, rounded_relaxation = heuristic, relative_loss = abs(heuristic - mip) / (1e-9 + abs(mip)))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "support"
label = "Selected Variables"
desc = "Which assets, predictors, or items the integer part selects, with their values"
code = '''
on = findall(>(0.5), value.(ints))
{{?model=portfolio}} [(asset = i, weight = round(sol[i]; digits=3), expected_return = round(mu[i]; digits=3), volatility = round(sqrt(Sigma[i, i]); digits=3)) for i in on]
{{?model=subset|logistic}} [(predictor = j, estimate = round(sol[j]; digits=3), truth = xtrue[j]) for j in on]
{{?model=knapsack}} [(item = i, value = round(v[i]; digits=3), mean_weight = round(a[i]; digits=3), sd_weight = round(s[i]; digits=3)) for i in on]
'''

[[actionGroups.actions]]
id = "price-of-k"
label = "Price of the Integer Constraint"
desc = "Portfolio: the risk of earning 1 point more expected return, and the risk with no cardinality limit. Others: the value gained by one more k, or by one more unit of capacity"
code = '''
{{?model=portfolio}} base = objective_value(model)
{{?model=portfolio}} set_normalized_rhs(ret, dot(mu, sol) + 0.01); optimize!(model); tighter = objective_value(model)
{{?model=portfolio}} set_normalized_rhs(ret, rmin); set_normalized_rhs(card, n); optimize!(model); free = objective_value(model)
{{?model=portfolio}} set_normalized_rhs(card, k); optimize!(model)  # restore
{{?model=portfolio}} (risk = base, risk_return_up_1pt = tighter, risk_no_cardinality_limit = free)
{{?model=subset|logistic}} (value_k = resolve(k), value_k_plus_1 = resolve(k + 1), value_k_again = resolve(k))
{{?model=knapsack}} (value_C = resolve(C), value_C_plus_1 = resolve(C + 1), value_C_again = resolve(C))
'''
