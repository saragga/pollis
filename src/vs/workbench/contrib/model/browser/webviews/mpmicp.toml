# Mixed-Integer Conic Programming Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/mpmicp.data.ts
# Run: npm run gulp compile-toml
#
# Approach: Pajarito.jl solves mixed-integer conic problems by outer
# approximation: a MILP master problem (HiGHS) proposes the integer part, and a
# continuous conic solver (Hypatia or Clarabel) solves the subproblem with the
# integers fixed, returning cuts from its conic certificates.

[meta]
title = "Mixed-Integer Conic Programming"
viewType = "pollis.mpmicp"
defaultModel = "portfolio"

[[packages]]
name = "JuMP.jl"
github = "https://github.com/jump-dev/JuMP.jl"

[[packages]]
name = "Pajarito.jl"
