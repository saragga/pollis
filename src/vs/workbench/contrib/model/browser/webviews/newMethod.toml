# New Method Webview Configuration
# A page of Compose in the Time Arrow style of the scaffold, not a panel: only its Powered by and Learn More. `pageCommand` is the command
# that opens it, which a panel's contribution file would say. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/newMethod.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "New Method"
viewType = "pollis.newMethod"
pageCommand = "pollis.newMethods.create"

[[packages]]
name = "CSV.jl"
github = "https://github.com/JuliaData/CSV.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "LocalRegistry.jl"
github = "https://github.com/GunnarFarneback/LocalRegistry.jl"

[[packages]]
name = "PollisTeX.jl"
github = "https://github.com/Trumpingtons/PollisTeX.jl"

[[wikis]]
name = "Factsheet"
file = "newMethod/factsheet.md"
bundled = true

[[wikis]]
name = "Overview"
file = "newMethod/overview.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "newMethod/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "newMethod/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "newMethod/interpretation.md"
bundled = true

[[wikis]]
name = "Decision Guide"
file = "newMethod/decision-guide.md"
bundled = true

