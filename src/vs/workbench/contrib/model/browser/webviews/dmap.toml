[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity to ICs"
desc = "Run two nearby orbits on the attractor; the slope of log distance against time estimates the Lyapunov exponent (about 0.42 for Henon at a = 1.4, b = 0.3)"
code = '''
using DynamicalSystems, LinearAlgebra, Statistics

function henon(u, p, n)  # Henon map definition
    a, b = p
    x, y = u
    return SVector(1 - a*x^2 + y, b*x)
end

ds = DeterministicIteratedMap(henon, {{u0}}, {{p}})
step!(ds, 1000); u = current_state(ds)  # a point on the attractor
tr1, _ = trajectory(ds, 100, u)  # reference orbit
tr2, _ = trajectory(ds, 100, u .+ 1e-8)  # perturbed orbit

dist = [norm(a - b) for (a, b) in zip(tr1, tr2)]  # distance at each step
m = something(findfirst(>(0.1), dist), length(dist))  # stop before the distance saturates at the attractor size
slope = cov(0:m-1, log.(dist[1:m])) / var(0:m-1)  # least-squares slope of log distance
println("Growth rate (Lyapunov estimate): ", round(slope, digits=3))  # positive = chaotic
println("Max divergence: ", round(maximum(dist), digits=3), " (bounded by the attractor size)")
'''

[[actionGroups.actions]]
id = "fixed-points"
label = "Fixed Points of Map"
desc = "Find fixed points of the map using interval arithmetic search"
code = '''
using DynamicalSystems

function henon(u, p, n)  # Henon map definition
    a, b = p
    x, y = u
    return SVector(1 - a*x^2 + y, b*x)
end

function henon_jac(u, p, n)  # Jacobian [-2ax 1; b 0], column-major
    a, b = p
    return SMatrix{2, 2}(-2a*u[1], b, 1.0, 0.0)
end

ds = DeterministicIteratedMap(henon, [0.0, 0.0], {{p}})  # map definition
box = [interval(-2, 2), interval(-1, 1)]  # search box
fps, eigs, stable = fixedpoints(ds, box, henon_jac)

for (fp, ev, s) in zip(fps, eigs, stable)
    println("Fixed point: ", fp, "  |eigenvalues| = ", round.(abs.(ev), digits=3), s ? "  stable" : "  unstable")
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forward-iter"
label = "Forward Iteration"
desc = "Advance from a new initial condition, record the resulting orbit, and estimate how long it stays predictable"
code = '''
using DynamicalSystems

function henon(u, p, n)  # Henon map definition
    a, b = p
    x, y = u
    return SVector(1 - a*x^2 + y, b*x)
end

u_new = [0.5, 0.5]  # new initial condition
ds = DeterministicIteratedMap(henon, u_new, {{p}})
tr, t = trajectory(ds, {{n}})  # forward iteration

println("First steps: ", tr[1:5])  # the short-term orbit is predictable
if all(isfinite, tr[end])
    lambda = lyapunov(ds, 10000; u0=u_new, Ttr=1000)  # maximal Lyapunov exponent
    println("x range on the attractor: ", extrema(tr[1001:end, 1]))
    println("Steps before an error of 1e-8 grows to 0.1: ", round(Int, log(0.1 / 1e-8) / lambda))  # predictability horizon
else
    println("The orbit escaped to infinity")
end
'''

[[actionGroups.actions]]
id = "param-sweep"
label = "Parameter Sweep"
desc = "Iterate for each parameter value and count the distinct values the orbit visits in its last 100 steps: 1 is a fixed point, 2, 4, 8 a periodic cycle, about 100 no period (chaos)"
code = '''
using DynamicalSystems

function henon(u, p, n)  # Henon map definition
    a, b = p
    x, y = u
    return SVector(1 - a*x^2 + y, b*x)
end

a_vals = range(1.0, 1.4; length=20)  # sweep parameter a

for a in a_vals
    ds = DeterministicIteratedMap(henon, {{u0}}, [a, 0.3])
    tr, _ = trajectory(ds, 99; Ttr={{n}})  # 100 points after an n-step transient
    if !all(isfinite, tr[end])
        println("a=", round(a, digits=3), " -> escaped to infinity")
        continue
    end
    period = length(unique(round.(tr[:, 1], digits=6)))  # distinct x values after the transient
    println("a=", round(a, digits=3), " -> ", period == 100 ? "no period within 100 steps" : "period $period")
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "multi-ics"
label = "Multiple Initial Conditions"
desc = "Use reinit! to compare orbits from different starting points: whether they stay bounded, the region they settle on, and their Lyapunov exponent"
code = '''
using DynamicalSystems

function henon(u, p, n)  # Henon map definition
    a, b = p
    x, y = u
    return SVector(1 - a*x^2 + y, b*x)
end

ds = DeterministicIteratedMap(henon, [0.0, 0.0], {{p}})

for x0 in [0.0, 0.1, 0.5, -0.5]
    reinit!(ds, [x0, 0.0])  # reset to new IC
    tr, _ = trajectory(ds, {{n}}, [x0, 0.0]; Ttr=1000)  # orbit after the transient
    if !all(isfinite, tr[end])
        println("x0=", x0, " -> escaped to infinity")
        continue
    end
    lambda = lyapunov(ds, 10000; u0=[x0, 0.0], Ttr=1000)
    println("x0=", x0, " -> x range ", round.(extrema(tr[:, 1]), digits=3), ", Lyapunov ", round(lambda, digits=3))  # same attractor = same range and exponent
end
'''

[[actionGroups.actions]]
id = "diff-maps"
label = "Different Maps"
desc = "Compare Henon map vs logistic map orbits side by side"
code = '''
using DynamicalSystems

function henon(u, p, n)  # Henon map definition
    a, b = p
    x, y = u
    return SVector(1 - a*x^2 + y, b*x)
end

function logistic(u, p, n)  # logistic map
    r = p[1]
    return SVector(r * u[1] * (1 - u[1]))
end

ds_henon = DeterministicIteratedMap(henon, [0.0, 0.0], [1.4, 0.3])  # Henon map
ds_logistic = DeterministicIteratedMap(logistic, [0.5], [3.9])  # logistic map r=3.9

tr_h, _ = trajectory(ds_henon, {{n}}; Ttr=1000)  # Henon orbit
tr_l, _ = trajectory(ds_logistic, {{n}}; Ttr=1000)  # logistic orbit

println("Henon x range:    ", extrema(tr_h[:, 1]), "  Lyapunov ", round(lyapunov(ds_henon, 10000; Ttr=1000), digits=3))  # about 0.42
println("Logistic x range: ", extrema(tr_l[:, 1]), "  Lyapunov ", round(lyapunov(ds_logistic, 10000; Ttr=1000), digits=3))  # about 0.49
'''

