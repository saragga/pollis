[[bullets]]
text = "Proximal Point"
detail = "sequential proximal operator applications"

[[decisionRows]]
task = "Subgradient"
context = "Any convex nonsmooth objective with a subgradient oracle; simplest baseline"
purpose = "Steps along a negative subgradient with diminishing step sizes; not a descent method, so the best iterate is tracked. Rate O(1 / sqrt(k))"

[[decisionRows]]
task = "Bundle"
context = "Nonsmooth objectives where only function values and subgradients are available, and accuracy matters"
purpose = "Keeps a bundle of linearisations as a cutting-plane model, takes proximal steps on the model and moves the stability centre only on sufficient decrease"

[[decisionRows]]
task = "Chambolle-Pock"
context = "Problems of the form g(x) + h(Ax) with easy proximal maps of g and of the conjugate of h"
purpose = "Primal-dual hybrid gradient: alternates a dual prox step and a primal prox step with extrapolation; needs tau * sigma * norm(A)^2 < 1"

[[decisionRows]]
task = "Douglas-Rachford"
context = "Sums of two functions whose proximal maps are both available"
purpose = "Operator splitting: reflects through the two proximal maps; converges for any positive step size"

[[decisionRows]]
task = "Proximal Point"
context = "When each proximal subproblem is cheaper or better conditioned than the original problem"
purpose = "Repeatedly minimises F(u) + norm(u - x)^2 / (2 * step); each subproblem is strongly convex and solved here by an inner accelerated proximal gradient loop"

[[inputs]]
id = "n"
label = "Variables (n)"
tooltip = "Number of unknowns in the sparse regression problem min 0.5 * norm(A * x - b)^2 + penalty(x)."
default = "20"

[[inputs]]
id = "m"
label = "Observations (m)"
tooltip = "Number of rows of the random design matrix A."
default = "40"

[[inputs]]
id = "pen"
label = "Penalty"
tooltip = "Nonsmooth penalty added to the least-squares loss (ProximalOperators.jl supplies its proximal map)."
kind = "select"
default = "l1"

[[inputs.options]]
value = "l1"
label = "L1 Norm (Lasso)"

[[inputs.options]]
value = "l2"
label = "L2 Norm (Group Lasso)"

[[inputs.options]]
value = "linf"
label = "Max Norm"

[[inputs]]
id = "reg"
label = "Penalty Weight"
tooltip = "Weight lambda of the penalty; larger values give sparser (or smaller) solutions."
default = "2.0"

[[inputs]]
id = "step"
label = "Step Size"
tooltip = "Subgradient: step at iteration k is step / sqrt(k). Bundle: proximal weight 1 / step. Chambolle-Pock: primal step tau (the dual step follows). Douglas-Rachford and Proximal Point: proximal parameter."
default = "0.01"
newRow = true

[[inputs]]
id = "maxiter"
label = "Iterations"
tooltip = "Number of (outer) iterations."
default = "500"

