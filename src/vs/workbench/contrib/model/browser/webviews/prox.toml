[[codeBranches]]
model = "sg"
code = '''
using ProximalOperators, LinearAlgebra, Random, Statistics

# sparse regression: min F(x) = 0.5 * norm(A * x - b)^2 + penalty(x)
n, m = {{n}}, {{m}}  # unknowns, observations
Random.seed!(1)
A = randn(m, n)
k = max(1, div(n, 5))
x_true = [3 .* randn(k); zeros(n - k)]  # sparse ground truth
b = A * x_true + 0.1 .* randn(m)
lambda = {{reg}}  # penalty weight
step = {{step}}  # step size / proximal parameter
maxiter = {{maxiter}}  # iterations

{{?pen=l1}}g = NormL1(lambda)  # lambda * norm(x, 1)
{{?pen=l1}}subg(x) = lambda .* sign.(x)
{{?pen=l2}}g = NormL2(lambda)  # lambda * norm(x)
{{?pen=l2}}subg(x) = norm(x) > 0 ? lambda .* x ./ norm(x) : zeros(length(x))
{{?pen=linf}}g = NormLinf(lambda)  # lambda * maximum(abs, x)
{{?pen=linf}}subg(x) = (i = argmax(abs.(x)); s = zeros(length(x)); s[i] = lambda * sign(x[i]); s)
loss(x) = 0.5 * norm(A * x - b)^2
gradloss(x) = transpose(A) * (A * x - b)
F(x) = loss(x) + g(x)  # ProximalOperators functions are callable
subgrad(x) = gradloss(x) + subg(x)  # one element of the subdifferential of F
L = opnorm(A)^2  # Lipschitz constant of gradloss

# prox-gradient residual: zero exactly when 0 is in the subdifferential of F
pgres(x) = L * norm(x - prox(g, x - gradloss(x) / L, 1 / L)[1])

# reference optimum by 5000 accelerated proximal gradient (FISTA) steps
function reference(iters=5000)
    x = zeros(n); y = copy(x); t = 1.0
    for _ in 1:iters
        xn, _ = prox(g, y - gradloss(y) / L, 1 / L)
        tn = (1 + sqrt(1 + 4t^2)) / 2
        y = xn + ((t - 1) / tn) * (xn - x); x, t = xn, tn
    end
    x
end
F_star = F(reference())

function solve(; step=step, iters=maxiter, x0=zeros(n))
    x = copy(x0); xb, Fb = copy(x), F(x)
    path, hist = [copy(x)], [F(x)]
    for k in 1:iters
        x = x - (step / sqrt(k)) * subgrad(x)  # diminishing step: step / sqrt(k)
        Fx = F(x)
        Fx < Fb && ((xb, Fb) = (copy(x), Fx))  # not a descent method: keep the best iterate
        push!(path, copy(x)); push!(hist, Fx)
    end
    (x = xb, fx = Fb, history = hist, path = path)
end

res = solve()
x_best, f_best = res.x, res.fx
(solution = round.(x_best, sigdigits=5), objective = f_best, reference_objective = F_star, gap = f_best - F_star, iterations = length(res.history) - 1)
'''

[[codeBranches]]
model = "bundle"
code = '''
using ProximalOperators, LinearAlgebra, Random, Statistics

# sparse regression: min F(x) = 0.5 * norm(A * x - b)^2 + penalty(x)
n, m = {{n}}, {{m}}  # unknowns, observations
Random.seed!(1)
A = randn(m, n)
k = max(1, div(n, 5))
x_true = [3 .* randn(k); zeros(n - k)]  # sparse ground truth
b = A * x_true + 0.1 .* randn(m)
lambda = {{reg}}  # penalty weight
step = {{step}}  # step size / proximal parameter
maxiter = {{maxiter}}  # iterations

{{?pen=l1}}g = NormL1(lambda)  # lambda * norm(x, 1)
{{?pen=l1}}subg(x) = lambda .* sign.(x)
{{?pen=l2}}g = NormL2(lambda)  # lambda * norm(x)
{{?pen=l2}}subg(x) = norm(x) > 0 ? lambda .* x ./ norm(x) : zeros(length(x))
{{?pen=linf}}g = NormLinf(lambda)  # lambda * maximum(abs, x)
{{?pen=linf}}subg(x) = (i = argmax(abs.(x)); s = zeros(length(x)); s[i] = lambda * sign(x[i]); s)
loss(x) = 0.5 * norm(A * x - b)^2
gradloss(x) = transpose(A) * (A * x - b)
F(x) = loss(x) + g(x)  # ProximalOperators functions are callable
subgrad(x) = gradloss(x) + subg(x)  # one element of the subdifferential of F
L = opnorm(A)^2  # Lipschitz constant of gradloss

# prox-gradient residual: zero exactly when 0 is in the subdifferential of F
pgres(x) = L * norm(x - prox(g, x - gradloss(x) / L, 1 / L)[1])

# reference optimum by 5000 accelerated proximal gradient (FISTA) steps
function reference(iters=5000)
    x = zeros(n); y = copy(x); t = 1.0
    for _ in 1:iters
        xn, _ = prox(g, y - gradloss(y) / L, 1 / L)
        tn = (1 + sqrt(1 + 4t^2)) / 2
        y = xn + ((t - 1) / tn) * (xn - x); x, t = xn, tn
    end
    x
end
F_star = F(reference())

# Euclidean projection onto the probability simplex
function simplex_proj(v)
    u = sort(v, rev=true); c = cumsum(u)
    r = findlast(j -> u[j] + (1 - c[j]) / j > 0, eachindex(u))
    max.(v .+ (1 - c[r]) / r, 0.0)
end

function solve(; step=step, iters=maxiter, x0=zeros(n), maxbundle=40)
    mu = 1 / step  # proximal weight around the stability centre
    y = copy(x0); Fy = F(y)
    pts, vals, sgs = [copy(y)], [Fy], [subgrad(y)]  # the bundle: points, values, subgradients
    path, hist, serious = [copy(y)], [Fy], 0
    for k in 1:iters
        G = reduce(hcat, sgs)
        e = max.([Fy - (vals[i] + dot(sgs[i], y - pts[i])) for i in eachindex(vals)], 0.0)  # linearisation errors
        a = fill(1 / length(e), length(e)); t = mu / max(opnorm(G)^2, 1e-12)
        for _ in 1:200  # dual of the proximal cutting-plane step: a QP over the simplex
            a = simplex_proj(a - t * (transpose(G) * (G * a) / mu + e))
        end
        d = -(G * a) / mu
        delta = dot(e, a) + norm(G * a)^2 / mu  # decrease predicted by the model
        delta < 1e-12 && break
        xt = y + d; Ft = F(xt)
        if Fy - Ft >= 0.1 * delta  # serious step: move the centre
            y, Fy = xt, Ft; serious += 1
        end  # otherwise a null step: only the model improves
        push!(pts, xt); push!(vals, Ft); push!(sgs, subgrad(xt))
        if length(pts) > maxbundle
            popfirst!(pts); popfirst!(vals); popfirst!(sgs)
        end
        push!(path, copy(y)); push!(hist, Fy)
    end
    (x = y, fx = Fy, history = hist, path = path, serious_steps = serious)
end

res = solve()
x_best, f_best = res.x, res.fx
(solution = round.(x_best, sigdigits=5), objective = f_best, reference_objective = F_star, gap = f_best - F_star, iterations = length(res.history) - 1)
'''

[[codeBranches]]
model = "cp"
code = '''
using ProximalOperators, LinearAlgebra, Random, Statistics

# sparse regression: min F(x) = 0.5 * norm(A * x - b)^2 + penalty(x)
n, m = {{n}}, {{m}}  # unknowns, observations
Random.seed!(1)
A = randn(m, n)
k = max(1, div(n, 5))
x_true = [3 .* randn(k); zeros(n - k)]  # sparse ground truth
b = A * x_true + 0.1 .* randn(m)
lambda = {{reg}}  # penalty weight
step = {{step}}  # step size / proximal parameter
maxiter = {{maxiter}}  # iterations

{{?pen=l1}}g = NormL1(lambda)  # lambda * norm(x, 1)
{{?pen=l1}}subg(x) = lambda .* sign.(x)
{{?pen=l2}}g = NormL2(lambda)  # lambda * norm(x)
{{?pen=l2}}subg(x) = norm(x) > 0 ? lambda .* x ./ norm(x) : zeros(length(x))
{{?pen=linf}}g = NormLinf(lambda)  # lambda * maximum(abs, x)
{{?pen=linf}}subg(x) = (i = argmax(abs.(x)); s = zeros(length(x)); s[i] = lambda * sign(x[i]); s)
loss(x) = 0.5 * norm(A * x - b)^2
gradloss(x) = transpose(A) * (A * x - b)
F(x) = loss(x) + g(x)  # ProximalOperators functions are callable
subgrad(x) = gradloss(x) + subg(x)  # one element of the subdifferential of F
L = opnorm(A)^2  # Lipschitz constant of gradloss

# prox-gradient residual: zero exactly when 0 is in the subdifferential of F
pgres(x) = L * norm(x - prox(g, x - gradloss(x) / L, 1 / L)[1])

# reference optimum by 5000 accelerated proximal gradient (FISTA) steps
function reference(iters=5000)
    x = zeros(n); y = copy(x); t = 1.0
    for _ in 1:iters
        xn, _ = prox(g, y - gradloss(y) / L, 1 / L)
        tn = (1 + sqrt(1 + 4t^2)) / 2
        y = xn + ((t - 1) / tn) * (xn - x); x, t = xn, tn
    end
    x
end
F_star = F(reference())

# F(x) = g(x) + h(A * x) with h(z) = 0.5 * norm(z - b)^2
function solve(; step=step, iters=maxiter, x0=zeros(n))
    tau = step; sigma = 0.99 / (step * L)  # tau * sigma * norm(A)^2 < 1
    x = copy(x0); xbar = copy(x); y = zeros(m)
    path, hist = [copy(x)], [F(x)]
    for k in 1:iters
        y = (y + sigma * (A * xbar) - sigma * b) / (1 + sigma)  # dual step: prox of the conjugate of h
        xn, _ = prox(g, x - tau * (transpose(A) * y), tau)  # primal step: prox of g
        xbar = 2xn - x; x = xn  # extrapolation
        push!(path, copy(x)); push!(hist, F(x))
    end
    (x = x, fx = F(x), history = hist, path = path, dual = y)
end

res = solve()
x_best, f_best = res.x, res.fx
(solution = round.(x_best, sigdigits=5), objective = f_best, reference_objective = F_star, gap = f_best - F_star, iterations = length(res.history) - 1)
'''

[[codeBranches]]
model = "dr"
code = '''
using ProximalOperators, LinearAlgebra, Random, Statistics

# sparse regression: min F(x) = 0.5 * norm(A * x - b)^2 + penalty(x)
n, m = {{n}}, {{m}}  # unknowns, observations
Random.seed!(1)
A = randn(m, n)
k = max(1, div(n, 5))
x_true = [3 .* randn(k); zeros(n - k)]  # sparse ground truth
b = A * x_true + 0.1 .* randn(m)
lambda = {{reg}}  # penalty weight
step = {{step}}  # step size / proximal parameter
maxiter = {{maxiter}}  # iterations

{{?pen=l1}}g = NormL1(lambda)  # lambda * norm(x, 1)
{{?pen=l1}}subg(x) = lambda .* sign.(x)
{{?pen=l2}}g = NormL2(lambda)  # lambda * norm(x)
{{?pen=l2}}subg(x) = norm(x) > 0 ? lambda .* x ./ norm(x) : zeros(length(x))
{{?pen=linf}}g = NormLinf(lambda)  # lambda * maximum(abs, x)
{{?pen=linf}}subg(x) = (i = argmax(abs.(x)); s = zeros(length(x)); s[i] = lambda * sign(x[i]); s)
loss(x) = 0.5 * norm(A * x - b)^2
gradloss(x) = transpose(A) * (A * x - b)
F(x) = loss(x) + g(x)  # ProximalOperators functions are callable
subgrad(x) = gradloss(x) + subg(x)  # one element of the subdifferential of F
L = opnorm(A)^2  # Lipschitz constant of gradloss

# prox-gradient residual: zero exactly when 0 is in the subdifferential of F
pgres(x) = L * norm(x - prox(g, x - gradloss(x) / L, 1 / L)[1])

# reference optimum by 5000 accelerated proximal gradient (FISTA) steps
function reference(iters=5000)
    x = zeros(n); y = copy(x); t = 1.0
    for _ in 1:iters
        xn, _ = prox(g, y - gradloss(y) / L, 1 / L)
        tn = (1 + sqrt(1 + 4t^2)) / 2
        y = xn + ((t - 1) / tn) * (xn - x); x, t = xn, tn
    end
    x
end
F_star = F(reference())

function solve(; step=step, iters=maxiter, x0=zeros(n))
    C = cholesky(Symmetric(Matrix(1.0I, n, n) + step * transpose(A) * A)); Atb = transpose(A) * b
    z = copy(x0); x = copy(z)
    path, hist = [copy(x)], [F(x)]
    for k in 1:iters
        u = C \ (z + step * Atb)  # prox of the loss (a linear solve)
        x, _ = prox(g, 2u - z, step)  # prox of the penalty at the reflected point
        z = z + x - u
        push!(path, copy(x)); push!(hist, F(x))
    end
    (x = x, fx = F(x), history = hist, path = path)
end

res = solve()
x_best, f_best = res.x, res.fx
(solution = round.(x_best, sigdigits=5), objective = f_best, reference_objective = F_star, gap = f_best - F_star, iterations = length(res.history) - 1)
'''

[[codeBranches]]
model = "pp"
code = '''
using ProximalOperators, LinearAlgebra, Random, Statistics

# sparse regression: min F(x) = 0.5 * norm(A * x - b)^2 + penalty(x)
n, m = {{n}}, {{m}}  # unknowns, observations
Random.seed!(1)
A = randn(m, n)
k = max(1, div(n, 5))
x_true = [3 .* randn(k); zeros(n - k)]  # sparse ground truth
b = A * x_true + 0.1 .* randn(m)
lambda = {{reg}}  # penalty weight
step = {{step}}  # step size / proximal parameter
maxiter = {{maxiter}}  # iterations

{{?pen=l1}}g = NormL1(lambda)  # lambda * norm(x, 1)
{{?pen=l1}}subg(x) = lambda .* sign.(x)
{{?pen=l2}}g = NormL2(lambda)  # lambda * norm(x)
{{?pen=l2}}subg(x) = norm(x) > 0 ? lambda .* x ./ norm(x) : zeros(length(x))
{{?pen=linf}}g = NormLinf(lambda)  # lambda * maximum(abs, x)
{{?pen=linf}}subg(x) = (i = argmax(abs.(x)); s = zeros(length(x)); s[i] = lambda * sign(x[i]); s)
loss(x) = 0.5 * norm(A * x - b)^2
gradloss(x) = transpose(A) * (A * x - b)
F(x) = loss(x) + g(x)  # ProximalOperators functions are callable
subgrad(x) = gradloss(x) + subg(x)  # one element of the subdifferential of F
L = opnorm(A)^2  # Lipschitz constant of gradloss

# prox-gradient residual: zero exactly when 0 is in the subdifferential of F
pgres(x) = L * norm(x - prox(g, x - gradloss(x) / L, 1 / L)[1])

# reference optimum by 5000 accelerated proximal gradient (FISTA) steps
function reference(iters=5000)
    x = zeros(n); y = copy(x); t = 1.0
    for _ in 1:iters
        xn, _ = prox(g, y - gradloss(y) / L, 1 / L)
        tn = (1 + sqrt(1 + 4t^2)) / 2
        y = xn + ((t - 1) / tn) * (xn - x); x, t = xn, tn
    end
    x
end
F_star = F(reference())

function solve(; step=step, iters=maxiter, x0=zeros(n), inner=50)
    x = copy(x0); Li = L + 1 / step
    path, hist = [copy(x)], [F(x)]
    for k in 1:iters
        # proximal subproblem: min F(u) + norm(u - x)^2 / (2 * step), by inner FISTA
        u = copy(x); v = copy(x); t = 1.0
        for _ in 1:inner
            un, _ = prox(g, v - (gradloss(v) + (v - x) / step) / Li, 1 / Li)
            tn = (1 + sqrt(1 + 4t^2)) / 2
            v = un + ((t - 1) / tn) * (un - u); u, t = un, tn
        end
        x = u
        push!(path, copy(x)); push!(hist, F(x))
    end
    (x = x, fx = F(x), history = hist, path = path)
end

res = solve()
x_best, f_best = res.x, res.fx
(solution = round.(x_best, sigdigits=5), objective = f_best, reference_objective = F_star, gap = f_best - F_star, iterations = length(res.history) - 1)
'''

