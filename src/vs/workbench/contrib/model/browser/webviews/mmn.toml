# Market Microstructure Noise Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/mmn.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Market Microstructure Noise"
viewType = "pollis.mmn"
defaultModel = "main"

[[packages]]
name = "MicrostructureNoise.jl"
github = "https://github.com/mschauer/MicrostructureNoise.jl"

[requires]
packages = ["MicrostructureNoise.jl", "Distributions.jl", "Plots.jl", "StatsBase.jl"]

