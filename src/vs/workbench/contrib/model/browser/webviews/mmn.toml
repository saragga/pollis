# Market Microstructure Noise Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/mmn.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Market Microstructure Noise"
viewType = "pollis.mmn"
defaultModel = "main"

[[packages]]
name = "MicrostructureNoise.jl"
github = "https://github.com/mschauer/MicrostructureNoise.jl"

[requires]
packages = ["MicrostructureNoise.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Quick Start"
file = "mmn/tutorial-01-quickstart.ipynb"
bundled = true
description = "Bayesian nonparametric volatility estimation from noisy high-frequency observations"

[[notebookSections.notebooks]]
name = "Prior Specification"
file = "mmn/tutorial-02-prior.ipynb"
bundled = true
description = "Configure the Prior struct: bin count, InvGamma hyperparameters, and smoothing prior"

[[notebookSections.notebooks]]
name = "MCMC Sampling"
file = "mmn/tutorial-03-mcmc.ipynb"
bundled = true
description = "Run the Gibbs sampler with FFBS and inspect acceptance rates and mixing"

[[notebookSections.notebooks]]
name = "Posterior Volatility"
file = "mmn/tutorial-04-posterior.ipynb"
bundled = true
description = "Extract posterior mean and credible bands from MCMC output via posterior_volatility"

