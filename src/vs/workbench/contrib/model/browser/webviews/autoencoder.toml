# Autoencoders Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/autoencoder.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Autoencoders"
viewType = "pollis.autoencoder"
defaultModel = "ae"

