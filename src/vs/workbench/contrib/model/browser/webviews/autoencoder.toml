[[references]]
separator = true
label = "Original Papers (from packages)"

[[references]]
title = "Auto-Encoding Variational Bayes"
authors = "Kingma, D.P. & Welling, M."
year = 2013
journal = ""
url = "https://arxiv.org/abs/1312.6114"
openAccess = true

[[models]]
id = "ae"
label = "Autoencoder"

[[models]]
id = "vae"
label = "VAE"

[[bullets]]
text = "Autoencoder"
detail = "encoder compresses input to a bottleneck latent code; decoder reconstructs the input; trained end-to-end by minimising MSE reconstruction loss (Flux.jl)"

[[bullets]]
text = "VAE"
detail = "encoder outputs a distribution over latent codes; the reparametrisation trick enables gradient flow; trained by maximising the ELBO: reconstruction minus beta-weighted KL divergence from a standard Gaussian prior (Flux.jl)"

[[decisionRows]]
task = "Autoencoder"
context = "Nonlinear compression, denoising, anomaly detection by reconstruction error"
purpose = "Encoder and decoder trained end-to-end to rebuild the input through a bottleneck"

[[decisionRows]]
task = "VAE"
context = "A smooth, sampleable latent space; generating new observations"
purpose = "Encoder outputs a Gaussian posterior; the loss adds a beta-weighted KL term towards N(0, I)"

[[inputs]]
id = "X"
label = "Feature Matrix"
tooltip = "n_samples × n_features matrix, one row per observation. The code standardises it with the training mean and standard deviation and transposes it, since Flux Dense layers expect features × samples."
default = "X_train"

[[inputs]]
id = "latent"
label = "Latent Dimensions"
tooltip = "Size of the bottleneck layer. Use 2–3 to visualise the latent space; larger values (8–64) capture more structure for downstream modelling."
default = "2"
newRow = true

[[inputs]]
id = "hidden"
label = "Hidden Units"
tooltip = "Width of the hidden layer in both the encoder and the decoder."
default = "64"

[[inputs]]
id = "epochs"
label = "Epochs"
tooltip = "Number of full passes over the training data. Watch the Training Loss action and stop when it plateaus. VAEs usually need more epochs than plain autoencoders."
default = "100"
newRow = true

[[inputs]]
id = "lr"
label = "Learning Rate"
tooltip = "Adam optimiser step size. 1e-3 is a reliable default; reduce to 1e-4 if training is unstable."
default = "1e-3"

[[inputs]]
id = "batchsize"
label = "Batch Size"
tooltip = "Observations per gradient step. Smaller batches give noisier but more frequent updates."
default = "32"

[[inputs]]
id = "beta"
label = "beta (KL weight)"
tooltip = "Weight on the KL divergence term. beta = 1 is the standard VAE; beta > 1 (beta-VAE) encourages disentanglement at the cost of reconstruction quality."
default = "1.0"
models = ["vae"]

