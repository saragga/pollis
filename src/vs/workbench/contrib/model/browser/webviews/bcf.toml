[[models]]
id = "hp"
label = "Hodrick-Prescott"

[[models]]
id = "ham"
label = "Hamilton"

[[models]]
id = "bn"
label = "Beveridge-Nelson"

[[models]]
id = "bk"
label = "Baxter-King"

[[models]]
id = "bhp"
label = "Boosted HP"

[[bullets]]
text = "Hodrick-Prescott"
detail = "penalty-based trend filter; extracts smooth trend by penalising curvature of growth rate changes"

[[bullets]]
text = "Hamilton"
detail = "regression-based filter; avoids spurious cycles induced by HP via an h-step-ahead forecasting regression"

[[bullets]]
text = "Beveridge-Nelson"
detail = "ARIMA-based decomposition; permanent component defined as long-run forecast, cycle is transitory"

[[bullets]]
text = "Baxter-King"
detail = "ideal band-pass approximation; isolates business-cycle frequencies by zeroing out trend and irregular components"

[[bullets]]
text = "Boosted HP"
detail = "iterated HP filter (Phillips & Shi 2021); boosting removes residual unit-root components left by standard HP"

[[inputs]]
id = "y"
label = "Time Series"
tooltip = "A univariate time series vector y (T × 1). Pass a Julia Vector{Float64} or a column of a DataFrame."
default = "y"

[[inputs]]
id = "hp-lambda"
label = "lambda"
tooltip = ""
default = "1600"
models = ["hp"]

[[inputs]]
id = "ham-h"
label = "h"
tooltip = ""
default = "8"
models = ["ham"]

[[inputs]]
id = "ham-p"
label = "p"
tooltip = ""
default = "4"
models = ["ham"]

[[inputs]]
id = "bn-p"
label = "AR order"
tooltip = "Autoregressive order p of the ARIMA(p,1,q) model fitted to the differenced series."
default = "2"
models = ["bn"]

[[inputs]]
id = "bn-q"
label = "MA order"
tooltip = "Moving-average order q of the ARIMA(p,1,q) model. Set to 0 for a pure AR specification."
default = "0"
models = ["bn"]

[[inputs]]
id = "bk-pl"
label = "p₁ (low)"
tooltip = ""
default = "6"
models = ["bk"]

[[inputs]]
id = "bk-ph"
label = "p₂ (high)"
tooltip = ""
default = "32"
models = ["bk"]

[[inputs]]
id = "bk-K"
label = "K"
tooltip = ""
default = "12"
models = ["bk"]

[[inputs]]
id = "bhp-lambda"
label = "lambda"
tooltip = "Smoothing parameter lambda passed to each HP iteration. Same convention as standard HP: 1600 (quarterly), 14400 (monthly), 100 (annual)."
default = "1600"
models = ["bhp"]

[[inputs]]
id = "bhp-maxiter"
label = "Max iter"
tooltip = ""
default = "100"
models = ["bhp"]

[[inputs]]
id = "bhp-tol"
label = "Tolerance"
tooltip = ""
default = "1e-6"
models = ["bhp"]

[[codeBranches]]
model = "hp"
code = '''
using MacroEconometricModels

trend, cycle = hp_filter({{y}}, lambda={{hp-lambda}})  # Hodrick-Prescott filter

println("Trend length: ", length(trend))  # number of trend observations
println("Cycle std:   ", std(cycle))  # standard deviation of cyclical component
'''

[[codeBranches]]
model = "ham"
code = '''
using MacroEconometricModels

trend, cycle = hamilton_filter({{y}}, h={{ham-h}}, p={{ham-p}})  # Hamilton regression filter

println("Trend length: ", length(trend))  # number of trend observations
println("Cycle std:   ", std(cycle))  # standard deviation of cyclical component
'''

[[codeBranches]]
model = "bn"
code = '''
using MacroEconometricModels

trend, cycle = bn_decomposition({{y}}, p={{bn-p}}, q={{bn-q}})  # Beveridge-Nelson decomposition via ARIMA({{bn-p}},1,{{bn-q}}) psi-weights

println("Trend length: ", length(trend))  # number of trend observations
println("Cycle std:   ", std(cycle))  # standard deviation of cyclical component
'''

[[codeBranches]]
model = "bk"
code = '''
using MacroEconometricModels

trend, cycle = bk_filter({{y}}, p_low={{bk-pl}}, p_high={{bk-ph}}, K={{bk-K}})  # Baxter-King band-pass filter [{{bk-pl}}, {{bk-ph}}] periods, K={{bk-K}} leads/lags

println("Trend length: ", length(trend))  # number of trend observations
println("Cycle std:   ", std(cycle))  # standard deviation of cyclical component
'''

[[codeBranches]]
model = "bhp"
code = '''
using MacroEconometricModels

trend, cycle = boosted_hp({{y}}, lambda={{bhp-lambda}}, maxiter={{bhp-maxiter}}, tol={{bhp-tol}})  # Boosted HP filter (Phillips & Shi 2021)

println("Trend length: ", length(trend))  # number of trend observations
println("Cycle std:   ", std(cycle))  # standard deviation of cyclical component
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "spectrum"
label = "Power Spectrum"
desc = "Periodogram of the cyclical component to verify which frequencies dominate"
code = '''
using MacroEconometricModels, FFTW, Statistics

_, cycle = hp_filter({{y}}, lambda=1600)  # extract cycle (replace with chosen filter)
n        = length(cycle)  # number of observations
freqs    = (0:n-1) ./ n  # normalised frequencies [0, 1)
power    = abs2.(fft(cycle)) ./ n  # periodogram ordinates

power[1:div(n,2)+1]  # one-sided spectrum (non-redundant half)
'''

[[actionGroups.actions]]
id = "variance_ratio"
label = "Variance Ratio"
desc = "Variance of the trend and of the cycle relative to the variance of the series, with the covariance term that makes the shares add to one"
code = '''
using MacroEconometricModels, Statistics

trend, cycle = hp_filter({{y}}, lambda=1600)  # replace with chosen filter call

var_trend = var(trend)  # variance of trend component
var_cycle = var(cycle)  # variance of cyclical component
var_total = var({{y}})  # total variance of original series

cov_share = 2 * cov(trend, cycle) / var_total  # trend and cycle are not orthogonal in general

println("Trend share: ", var_trend / var_total)  # var(trend) / var(y)
println("Cycle share: ", var_cycle / var_total)  # var(cycle) / var(y)
println("Covariance:  ", cov_share)  # the three add to one; the shares are variance explained only when this is near zero
'''

[[actionGroups.actions]]
id = "endpoints"
label = "End-Point Sensitivity"
desc = "Re-run filter dropping last 4 observations to assess revision of trend near the sample end"
code = '''
using MacroEconometricModels, Statistics

T           = length({{y}})  # full sample length
trend_full, _ = hp_filter({{y}}, lambda=1600)  # full-sample trend
trend_trim, _ = hp_filter({{y}}[1:T-4], lambda=1600)  # trend from sample minus 4 obs

maximum(abs.(trend_full[1:T-4] .- trend_trim))  # max end-point revision
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "turning_points"
label = "Turning Points"
desc = "Identify local peaks and troughs in the cyclical component using a rolling window"
code = '''
using MacroEconometricModels

_, cycle = hp_filter({{y}}, lambda=1600)  # extract cycle (replace with chosen filter)

n      = length(cycle)  # sample length
w      = 2  # window half-width for peak/trough detection
peaks  = [i for i in (w+1):(n-w) if all(cycle[i] .>= cycle[i-w:i+w])]  # local maxima
troughs= [i for i in (w+1):(n-w) if all(cycle[i] .<= cycle[i-w:i+w])]  # local minima
'''

[[actionGroups.actions]]
id = "cross_correlation"
label = "Cross-Correlation with GDP"
desc = "Contemporaneous and lagged correlation of extracted cycle with a reference series (e.g. GDP growth)"
code = '''
using MacroEconometricModels, Statistics

_, cycle   = hp_filter({{y}}, lambda=1600)  # extracted cycle
_, gdp_cyc = hp_filter(gdp, lambda=1600)  # GDP cycle (define gdp separately)

lags   = -8:8  # leads/lags to consider (in data periods)
xcorr  = [cor(cycle[max(1,1-l):min(end,end-l)], gdp_cyc[max(1,1+l):min(end,end+l)]) for l in lags]  # cross-correlation at each lag
'''

[[actionGroups.actions]]
id = "filter_comparison"
label = "Filter Comparison"
desc = "Apply all five filters to the same series and summarise cycle statistics side by side"
code = '''
using MacroEconometricModels, Statistics

_, hp_cyc  = hp_filter({{y}}, lambda=1600)  # HP cycle
_, ham_cyc = hamilton_filter({{y}}, h=8, p=4)  # Hamilton cycle
_, bn_cyc  = bn_decomposition({{y}}, p=2, q=0)  # BN cycle
_, bk_cyc  = bk_filter({{y}}, p_low=6, p_high=32, K=12)  # BK cycle
_, bhp_cyc = boosted_hp({{y}}, lambda=1600)  # Boosted HP cycle

cycles = [hp_cyc, ham_cyc, bn_cyc, bk_cyc, bhp_cyc]  # collect all cycles
names  = ["HP", "Hamilton", "BN", "BK", "BHP"]  # filter labels
[n => round.([std(c), cor(c, hp_cyc)], digits=4) for (n,c) in zip(names, cycles)]  # std and correlation with HP for each filter
'''
