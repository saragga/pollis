# Business Cycle Filters Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/bcf.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Business Cycle Filters"
viewType = "pollis.bcf"
defaultModel = "hp"

[[packages]]
name = "MacroEconometricModels.jl"
github = "https://github.com/FriedmanJP/MacroEconometricModels.jl"

[requires]
packages = ["MacroEconometricModels.jl"]

[[notebookSections]]
label = ""

