# Interpolate Data Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/idat.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Interpolate Data"
viewType = "pollis.idat"
defaultModel = "linear"

[[packages]]
name = "Interpolations.jl"
github = "https://github.com/JuliaMath/Interpolations.jl"

[[packages]]
name = "Dierckx.jl"
github = "https://github.com/kbarbary/Dierckx.jl"

[[notebookSections]]
label = "Interpolate Data"

[[notebookSections.notebooks]]
name = "1D Interpolation"
file = "idat/tutorial-01-1d.ipynb"
