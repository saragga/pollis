description = "Linear and cubic spline interpolation on irregular knots with Interpolations.jl"

[[notebookSections.notebooks]]
name = "B-Spline Grids"
file = "idat/tutorial-02-bspline.ipynb"
bundled = true
description = "Interpolate regular grid data in 1D and 2D with BSpline and scale()"

[[notebookSections.notebooks]]
name = "Dierckx Fitting"
file = "idat/tutorial-03-dierckx.ipynb"
bundled = true
description = "Fit smooth splines to scattered data and evaluate derivatives with Dierckx.jl"

[[notebookSections.notebooks]]
name = "Extrapolation"
file = "idat/tutorial-04-extrapolation.ipynb"
bundled = true
description = "Control out-of-range behaviour: Throw, Flat, Linear, and Periodic boundary conditions"

