[[inputs]]
id = "N"
label = "N (individuals)"
tooltip = "Population size for SIR and SEIR individual-level inference with Pathogen.jl. Each individual is tracked explicitly with a spatial position, so N is typically in the range 100–2000 for tractable MCMC."
default = "1000"

[[inputs]]
id = "T"
label = "T (days)"
tooltip = "Observation window in days. For Rt Estimation, T is the length of the case count series. For SIR and SEIR inference with Pathogen.jl, T is the maximum event time passed to observe()."
default = "100"

[[inputs]]
id = "iter"
label = "Iterations"
tooltip = "Number of MCMC iterations. For Turing.jl NUTS this is the number of HMC samples per chain after warm-up. For Pathogen.jl MCMC this is the total number of samples drawn by the Gibbs sampler."
default = "10000"

[[inputs]]
id = "chains"
label = "Chains"
tooltip = "Number of parallel MCMC chains. Multiple chains allow R-hat convergence diagnostics. Used by Turing.jl via MCMCThreads(); Pathogen.jl runs a single Gibbs chain by default."
default = "4"

[[codeBranches]]
model = "rt"
code = '''
using Turing, Distributions, Random

Random.seed!(42)  # reproducible inference
T = {{T}}  # number of observation days
cases = rand(Poisson(20), T)  # replace with observed daily case counts

@model function rt_model(cases, T)
    sigma ~ Exponential(0.1)  # random walk step size
    log_Rt = Vector{Real}(undef, T)  # latent log Rt vector
    log_Rt[1] ~ Normal(0.0, 1.0)  # initial log Rt prior
    for t in 2:T
        log_Rt[t] ~ Normal(log_Rt[t-1], sigma)  # Gaussian random walk
    end
    Rt = exp.(log_Rt)  # Rt on natural scale
    for t in 2:T
        cases[t] ~ Poisson(Rt[t] * cases[t-1] + 1e-6)  # renewal-like likelihood
    end
end

model = rt_model(cases, T)  # instantiate model
chain = sample(model, NUTS(), MCMCThreads(), {{iter}}, {{chains}})  # run NUTS sampler across {{chains}} chains
plot(chain[:sigma])  # posterior sigma trace
'''

[[codeBranches]]
model = "sir"
code = '''
using Pathogen, Distributions, Random

Random.seed!(42)  # reproducible inference
N = {{N}}  # population size
pop = Population({{N}}, rand({{N}}, 2))  # random 2-D spatial positions

rf = RiskFunctions{SIR}(  # individual-level risk functions
    (a, p, i) -> a[1],  # sparks: external force of infection
    (a, p, i) -> 1.0,  # susceptibility: uniform
    (b, p, k) -> b[1],  # transmissibility
    (b, p, i, k) -> exp(-b[2] * norm(p.risks[i] - p.risks[k])),  # spatial kernel
    (g, p, k) -> g[1])  # removal rate

rp_true = RiskParameters{SIR}([0.0001], [0.5, 2.0], [0.1])  # true parameters for data generation
obs = observe(Simulation(pop, rf, rp_true), Uniform(0.0, {{T}}.0))  # generate observed event times

priors = RiskParameterPriors{SIR}(  # Bayesian priors
    [Uniform(0, 0.01)],  # sparks prior
    [Uniform(0, 2), Uniform(0, 5)],  # transmissibility priors
    [Uniform(0, 1)])  # removal prior
chains = MCMC(obs, priors, rf, pop, {{iter}})  # run Pathogen.jl Gibbs sampler
plot(chains[end])  # posterior distributions
'''

[[codeBranches]]
model = "seir"
code = '''
using Pathogen, Distributions, Random

Random.seed!(42)  # reproducible inference
N = {{N}}  # population size
pop = Population({{N}}, rand({{N}}, 2))  # random 2-D spatial positions

rf = RiskFunctions{SEIR}(  # individual-level risk functions
    (a, p, i) -> a[1],  # sparks
    (a, p, i) -> 1.0,  # susceptibility: uniform
    (b, p, k) -> b[1],  # transmissibility
    (b, p, i, k) -> exp(-b[2] * norm(p.risks[i] - p.risks[k])),  # spatial kernel
    (s, p, k) -> s[1],  # latent-to-infectious progression rate
    (g, p, k) -> g[1])  # removal rate

rp_true = RiskParameters{SEIR}([0.0001], [0.5, 2.0], [0.2], [0.1])  # true parameters for data generation
obs = observe(Simulation(pop, rf, rp_true), Uniform(0.0, {{T}}.0))  # generate observed event times

priors = RiskParameterPriors{SEIR}(  # Bayesian priors
    [Uniform(0, 0.01)],  # sparks prior
    [Uniform(0, 2), Uniform(0, 5)],  # transmissibility priors
    [Uniform(0, 1)],  # progression prior
    [Uniform(0, 1)])  # removal prior
chains = MCMC(obs, priors, rf, pop, {{iter}})  # run Pathogen.jl Gibbs sampler
plot(chains[end])  # posterior distributions and transmission network
'''

