[[inputs]]
id = "T"
label = "T (days)"
tooltip = "Observation window in days: the length of the simulated case series for Rt Estimation, and the end of the simulated outbreak (tmax) for SIR and SEIR Inference."
default = "100"

[[inputs]]
id = "r-before"
label = "Rt Before"
tooltip = "True reproduction number of the simulated epidemic before the change day."
default = "1.8"
models = ["rt"]

[[inputs]]
id = "r-after"
label = "Rt After"
tooltip = "True reproduction number from the change day on, for example after an intervention."
default = "0.7"
models = ["rt"]

[[inputs]]
id = "change-day"
label = "Change Day"
tooltip = "Day on which the true Rt drops from Rt Before to Rt After. Must be at least 9, since the first week seeds the epidemic."
default = "40"
models = ["rt"]

[[inputs]]
id = "si-mean"
label = "Serial Interval Mean (days)"
tooltip = "Mean of the Gamma serial interval: the time from symptom onset in a case to onset in the people it infects. Used both to simulate and to fit."
default = "5"
models = ["rt"]

[[inputs]]
id = "si-sd"
label = "Serial Interval SD (days)"
tooltip = "Standard deviation of the Gamma serial interval."
default = "3"
models = ["rt"]

[[inputs]]
id = "samples"
label = "NUTS Samples"
tooltip = "Posterior samples per chain drawn by the Turing.jl NUTS sampler after adaptation."
default = "1000"
models = ["rt"]

[[inputs]]
id = "N"
label = "N (individuals)"
tooltip = "Number of individuals in the spatial population. Each one is tracked explicitly, so a few hundred at most keeps the Pathogen.jl MCMC tractable."
default = "100"
models = ["sir", "seir"]

[[inputs]]
id = "iter"
label = "MCMC Iterations"
tooltip = "Metropolis-within-Gibbs iterations per chain in Pathogen.jl. Each iteration updates the parameters, a batch of event times and the transmission network."
default = "20000"
models = ["sir", "seir"]

[[inputs]]
id = "burnin"
label = "Burn-in"
tooltip = "Iterations discarded from the start of each Pathogen.jl chain before summaries. Must be at least 1."
default = "5000"
models = ["sir", "seir"]

[[inputs]]
id = "chains"
label = "Chains"
tooltip = "Number of MCMC chains, needed for R-hat. Turing.jl runs them with MCMCThreads; Pathogen.jl starts each from its own draw from the priors."
default = "4"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Random seed for the simulated data and the samplers."
default = "42"

[[codeBranches]]
model = "rt"
code = '''
using Turing, Random, Plots  # NUTS, Chains and Distributions (re-exported by Turing); seed; plotting

Random.seed!({{seed}})  # reproducible simulation and sampling
T = {{T}}  # days of case counts

# Serial interval: Gamma with the given mean and SD, discretised to daily weights w[s], s = 1..21
si = Gamma(({{si-mean}} / {{si-sd}})^2, {{si-sd}}^2 / {{si-mean}})
w = diff(cdf.(si, 0:21)); w ./= sum(w)
infectious(x, t, wt = w) = sum(wt[s] * x[t - s] for s in 1:min(t - 1, length(wt)); init = 0.0)  # serial-interval weighted past cases

# Simulate an epidemic wave from the renewal equation; Rt drops on the change day (replace cases with your own counts)
Rt_true = [t < {{change-day}} ? {{r-before}} : {{r-after}} for t in 1:T]
cases = zeros(Int, T); cases[1:7] .= 10  # seed week
for t in 8:T
    cases[t] = rand(Poisson(Rt_true[t] * infectious(cases, t)))
end

# Cori renewal model: cases[t] ~ Poisson(Rt * infectiousness), random walk on log Rt
days = 8:T  # fitted days: each has a full seed week behind it
lambda = [infectious(cases, t) for t in 1:T]  # observed infectiousness, data in the likelihood
@model function renewal(cases, lambda, days)
    sigma ~ truncated(Normal(0, 0.1); lower = 0)  # daily step SD of log Rt
    log_R_start ~ Normal(0, 0.5)  # log Rt on the first fitted day
    z ~ filldist(Normal(), length(days) - 1)  # non-centred random-walk steps
    log_Rt = log_R_start .+ cumsum(vcat(0.0, sigma .* z))
    for (j, t) in enumerate(days)
        cases[t] ~ Poisson(exp(log_Rt[j]) * lambda[t] + 1e-6)
    end
    return exp.(log_Rt)
end
model = renewal(cases, lambda, days)
chain = sample(model, NUTS(), MCMCThreads(), {{samples}}, {{chains}})  # {{chains}} chains on threads

Rt_draws = permutedims(reduce(hcat, vec(returned(model, chain))))  # draws x fitted days
Rt_med, Rt_lo, Rt_hi = ([quantile(v, q) for v in eachcol(Rt_draws)] for q in (0.5, 0.05, 0.95))
col(t) = t - first(days) + 1  # column of day t in Rt_draws
for t in ({{change-day}} - 1, min({{change-day}} + 14, T), T)
    println("Day ", rpad(t, 4), " Rt median ", round(Rt_med[col(t)]; digits = 2), ", 90% credible interval [", round(Rt_lo[col(t)]; digits = 2), ", ", round(Rt_hi[col(t)]; digits = 2), "], true ", Rt_true[t])
end
'''

[[codeBranches]]
model = "sir"
code = '''
using Pathogen, Random, Plots  # Pathogen re-exports Distributions and DataFrames (Population takes a DataFrame)

Random.seed!({{seed}})  # reproducible simulation and MCMC
n = {{N}}  # individuals
tmax = Float64({{T}})  # end of the observation window (days)

# Spatial population: random positions and their Euclidean distances
risks = DataFrame(x = rand(Uniform(0, 15), n), y = rand(Uniform(0, 30), n))
dists = [hypot(risks.x[i] - risks.x[k], risks.y[i] - risks.y[k]) for i in 1:n, k in 1:n]
pop = Population(risks, dists)

# Risk functions: constant sparks, power-law distance kernel, constant removal rate
spark_risk(p, pop, i) = p[1]  # infection pressure from outside the population
one_risk(p, pop, i) = 1.0  # no susceptibility or transmissibility covariates
powerlaw(p, pop, i, k) = pop.distances[k, i]^(-p[1])  # infectivity from k to i decays with distance
constant_rate(p, pop, i) = p[1]
rf = RiskFunctions{SIR}(spark_risk, one_risk, powerlaw, one_risk, constant_rate)
rp_true = RiskParameters{SIR}([0.0001], Float64[], [4.0], Float64[], [0.1])  # true sparks, kernel power, removal rate

# Simulate an outbreak from one index case, then observe onsets and removals 0.5 to 2.5 days late
starting = [State_I; fill(State_S, n - 1)]
sim = Simulation(pop, starting, rf, rp_true)
simulate!(sim; tmax = tmax)
obs = observe(sim, Uniform(0.5, 2.5), Uniform(0.5, 2.5); force = true)
println(count(!isnan, obs.infection), " of ", n, " individuals infected by day ", tmax)

# MCMC: parameters, true event times and the transmission network are updated in turn
priors = RiskPriors{SIR}([Exponential(0.0001)], UnivariateDistribution[], [Uniform(1.0, 7.0)], UnivariateDistribution[], [Uniform(0.0, 1.0)])
ee = EventExtents{SIR}(5.0, 5.0)  # true onset and removal up to 5 days before their observation
mcmc = MCMC(obs, ee, pop, starting, rf, priors)
start!(mcmc, {{chains}}; attempts = 50000)  # one starting point per chain
iterate!(mcmc, {{iter}}, 1.0; condition_on_network = true, event_batches = 5)
display(summary(mcmc; burnin = {{burnin}}, thin = 20))  # posterior mean, variance and 95% credible interval per chain

pars = [:sparks, :power, :removal]  # parameter order of RiskParameters
draws = [rp for mc in mcmc.markov_chains for rp in mc.risk_parameters[({{burnin}} + 1):20:end]]  # thinned draws, all chains
function outbreak(rf, rp)  # a fresh outbreak in the same population from the same index case
    s = Simulation(pop, starting, rf, rp)
    simulate!(s; tmax = tmax)
    return s
end
'''

[[codeBranches]]
model = "seir"
code = '''
using Pathogen, Random, Plots  # Pathogen re-exports Distributions and DataFrames (Population takes a DataFrame)

Random.seed!({{seed}})  # reproducible simulation and MCMC
n = {{N}}  # individuals
tmax = Float64({{T}})  # end of the observation window (days)

# Spatial population: random positions and their Euclidean distances
risks = DataFrame(x = rand(Uniform(0, 15), n), y = rand(Uniform(0, 30), n))
dists = [hypot(risks.x[i] - risks.x[k], risks.y[i] - risks.y[k]) for i in 1:n, k in 1:n]
pop = Population(risks, dists)

# Risk functions: constant sparks, power-law distance kernel, constant rate (latency and removal)
spark_risk(p, pop, i) = p[1]  # infection pressure from outside the population
one_risk(p, pop, i) = 1.0  # no susceptibility or transmissibility covariates
powerlaw(p, pop, i, k) = pop.distances[k, i]^(-p[1])  # infectivity from k to i decays with distance
constant_rate(p, pop, i) = p[1]
rf = RiskFunctions{SEIR}(spark_risk, one_risk, powerlaw, one_risk, constant_rate, constant_rate)
rp_true = RiskParameters{SEIR}([0.0001], Float64[], [4.0], Float64[], [0.2], [0.1])  # true sparks, kernel power, latency rate, removal rate

# Simulate an outbreak from one index case, then observe onsets and removals 0.5 to 2.5 days late
starting = [State_I; fill(State_S, n - 1)]
sim = Simulation(pop, starting, rf, rp_true)
simulate!(sim; tmax = tmax)
obs = observe(sim, Uniform(0.5, 2.5), Uniform(0.5, 2.5); force = true)
println(count(!isnan, obs.infection), " of ", n, " individuals infected by day ", tmax)

# MCMC: parameters, true event times and the transmission network are updated in turn
priors = RiskPriors{SEIR}([Exponential(0.0001)], UnivariateDistribution[], [Uniform(1.0, 7.0)], UnivariateDistribution[], [Uniform(0.0, 1.0)], [Uniform(0.0, 1.0)])
ee = EventExtents{SEIR}(20.0, 5.0, 5.0)  # exposure up to 20 days before onset; true onset and removal up to 5 days before their observation
mcmc = MCMC(obs, ee, pop, starting, rf, priors)
start!(mcmc, {{chains}}; attempts = 50000)  # one starting point per chain
iterate!(mcmc, {{iter}}, 1.0; condition_on_network = true, event_batches = 5)
display(summary(mcmc; burnin = {{burnin}}, thin = 20))  # posterior mean, variance and 95% credible interval per chain

pars = [:sparks, :power, :latency, :removal]  # parameter order of RiskParameters
draws = [rp for mc in mcmc.markov_chains for rp in mc.risk_parameters[({{burnin}} + 1):20:end]]  # thinned draws, all chains
function outbreak(rf, rp)  # a fresh outbreak in the same population from the same index case
    s = Simulation(pop, starting, rf, rp)
    simulate!(s; tmax = tmax)
    return s
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "epidemic-curve"
label = "Epidemic Curve"
desc = "Rt: observed cases against the one-day-ahead posterior predictive band. SIR and SEIR: posterior reconstructions of the number infectious over time against the truth"
code = '''
{{?model=rt}} d = rand(1:size(Rt_draws, 1), 500)  # posterior draws
{{?model=rt}} reps = [rand(Poisson(Rt_draws[i, j] * lambda[t] + 1e-6)) for i in d, (j, t) in enumerate(days)]  # one-day-ahead predictive counts
{{?model=rt}} med, lo, hi = ([quantile(v, q) for v in eachcol(reps)] for q in (0.5, 0.05, 0.95))
{{?model=rt}} p = plot(days, med; ribbon = (med .- lo, hi .- med), fillalpha = 0.3, label = "Posterior predictive (90%)", xlabel = "Day", ylabel = "Cases", title = "Epidemic curve")
{{?model=rt}} scatter!(p, 1:T, cases; markersize = 2, color = :black, label = "Observed cases")
{{?model=rt}} vline!(p, [{{change-day}}]; linestyle = :dash, color = :gray, label = "Change day")
{{?model=rt}} display(p)
{{?model=rt}} println("Share of days inside the 90% band: ", round(mean(lo[j] <= cases[t] <= hi[j] for (j, t) in enumerate(days)); digits = 2))
{{?model=sir|seir}} p = plot(xlabel = "Time (days)", ylabel = "Infectious", title = "Posterior reconstructions of the epidemic curve")
{{?model=sir|seir}} for mc in mcmc.markov_chains, e in mc.events[({{burnin}} + 1):100:end]
{{?model=sir|seir}}     plot!(p, e, State_I, 0.0, tmax; linecolor = :steelblue, linealpha = 0.05, label = "")  # one augmented history per draw
{{?model=sir|seir}} end
{{?model=sir|seir}} plot!(p, sim.events, State_I, 0.0, tmax; linecolor = :black, linewidth = 2, label = "True")
{{?model=sir|seir}} display(p)
'''

[[actionGroups.actions]]
id = "reproduction-number"
label = "Reproduction Number"
desc = "Rt: posterior median and 90% credible interval of Rt against the true Rt. SIR and SEIR: posterior expected number of people each case infected, against the true offspring"
code = '''
{{?model=rt}} p = plot(days, Rt_med; ribbon = (Rt_med .- Rt_lo, Rt_hi .- Rt_med), fillalpha = 0.3, label = "Posterior median (90% CrI)", xlabel = "Day", ylabel = "Rt", title = "Time-varying reproduction number")
{{?model=rt}} plot!(p, 1:T, Rt_true; linestyle = :dash, color = :black, label = "True Rt")
{{?model=rt}} hline!(p, [1.0]; linestyle = :dot, color = :red, label = "Rt = 1")
{{?model=rt}} display(p)
{{?model=sir|seir}} tnp = TNPosterior(mcmc; burnin = {{burnin}}, thin = 20)  # posterior probability of each who-infected-whom link
{{?model=sir|seir}} offspring = vec(sum(tnp.internal; dims = 2))  # posterior expected secondary infections (rows are sources)
{{?model=sir|seir}} offspring_true = vec(sum(sim.transmission_network.internal; dims = 2))
{{?model=sir|seir}} infected = findall(isfinite, obs.infection)  # observed cases (the index case, infected at -Inf, is left out)
{{?model=sir|seir}} p = scatter(obs.infection[infected], offspring[infected]; label = "Posterior mean", xlabel = "Observed onset (day)", ylabel = "Secondary infections", title = "Individual reproduction numbers")
{{?model=sir|seir}} scatter!(p, obs.infection[infected], offspring_true[infected]; marker = :x, color = :black, label = "True")
{{?model=sir|seir}} display(p)
{{?model=sir|seir}} early = infected[obs.infection[infected] .<= median(obs.infection[infected])]
{{?model=sir|seir}} late = setdiff(infected, early)
{{?model=sir|seir}} println("Mean offspring of early cases: ", round(mean(offspring[early]); digits = 2), " (true ", round(mean(offspring_true[early]); digits = 2), ")")
{{?model=sir|seir}} println("Mean offspring of late cases:  ", round(mean(offspring[late]); digits = 2), " (true ", round(mean(offspring_true[late]); digits = 2), ")")
{{?model=sir|seir}} println("Late cases infect fewer: susceptibles are depleted, and infections after day ", tmax, " are not seen")
'''

