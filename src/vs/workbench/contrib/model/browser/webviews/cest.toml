[[actionGroups.actions]]
id = "rhat"
label = "R-hat Convergence"
desc = "Compute and display the Gelman-Rubin R-hat statistic for all parameters; values above 1.01 indicate poor mixing"
code = '''
using Turing, Distributions, MCMCChains, Statistics, Random

Random.seed!(42)  # reproducible
T = {{T}}; cases = rand(Poisson(20), T)  # replace with observed counts

@model function rt_model(cases, T)
    sigma ~ Exponential(0.1); log_Rt = Vector{Real}(undef, T)
    log_Rt[1] ~ Normal(0.0, 1.0)
    for t in 2:T; log_Rt[t] ~ Normal(log_Rt[t-1], sigma); end
    for t in 2:T; cases[t] ~ Poisson(exp(log_Rt[t]) * cases[t-1] + 1e-6); end
end

chain = sample(rt_model(cases, T), NUTS(), MCMCThreads(), {{iter}}, {{chains}})  # run inference

rhat_vals = gelmandiag(chain).nt.psrf  # R-hat per parameter
println("sigma R-hat: ", round(rhat_vals[findfirst(isequal(:sigma), names(chain, :parameters))]; digits=3))  # check sigma convergence
max_rhat = maximum(rhat_vals)  # worst-case convergence
println("Max R-hat across all parameters: ", round(max_rhat; digits=3))
println(max_rhat > 1.01 ? "WARNING: poor mixing detected" : "Converged")  # convergence verdict
'''

