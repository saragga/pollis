[[actionGroups.actions]]
id = "sir-vs-seir-fit"
label = "SIR vs SEIR Fit"
desc = "Fit SIR and SEIR models to the same observed event times and compare posterior log-likelihoods"
code = '''
using Pathogen, Distributions, Statistics, Random

Random.seed!(42)  # reproducible
pop = Population({{N}}, rand({{N}}, 2))  # shared population
kernel = (b,p,i,k) -> exp(-b[2]*norm(p.risks[i]-p.risks[k]))  # spatial kernel

rf_sir  = RiskFunctions{SIR}((a,p,i)->a[1],(a,p,i)->1.0,(b,p,k)->b[1],kernel,(g,p,k)->g[1])  # SIR
rp_true = RiskParameters{SIR}([0.0001],[0.5,2.0],[0.1])  # generate data from SIR truth
obs = observe(Simulation(pop,rf_sir,rp_true),Uniform(0.0,{{T}}.0))  # shared observed data

pr_sir = RiskParameterPriors{SIR}([Uniform(0,0.01)],[Uniform(0,2),Uniform(0,5)],[Uniform(0,1)])  # SIR priors
ch_sir = MCMC(obs, pr_sir, rf_sir, pop, {{iter}})  # fit SIR

rf_seir  = RiskFunctions{SEIR}((a,p,i)->a[1],(a,p,i)->1.0,(b,p,k)->b[1],kernel,(s,p,k)->s[1],(g,p,k)->g[1])  # SEIR
pr_seir = RiskParameterPriors{SEIR}([Uniform(0,0.01)],[Uniform(0,2),Uniform(0,5)],[Uniform(0,1)],[Uniform(0,1)])  # SEIR priors
ch_seir = MCMC(obs, pr_seir, rf_seir, pop, {{iter}})  # fit SEIR

println("SIR  posterior log-lik (last): ",  ch_sir[end].log_posterior)  # SIR fit quality
println("SEIR posterior log-lik (last): ", ch_seir[end].log_posterior)  # SEIR fit quality
'''

[[actionGroups.actions]]
id = "prior-sensitivity"
label = "Prior Sensitivity"
desc = "Compare Rt posteriors under a narrow vs wide sigma prior for the Gaussian random walk"
code = '''
using Turing, Distributions, GLMakie, Random

Random.seed!(42)  # reproducible
T = {{T}}; cases = rand(Poisson(20), T)  # replace with observed counts

@model function rt_model_prior(cases, T, sigma_scale)
    sigma ~ Exponential(sigma_scale)
    log_Rt = Vector{Real}(undef, T)
    log_Rt[1] ~ Normal(0.0, 1.0)
    for t in 2:T; log_Rt[t] ~ Normal(log_Rt[t-1], sigma); end
    for t in 2:T; cases[t] ~ Poisson(exp(log_Rt[t]) * cases[t-1] + 1e-6); end
end

ch_narrow = sample(rt_model_prior(cases, T, 0.05), NUTS(), MCMCThreads(), {{iter}}, {{chains}})  # narrow sigma prior
ch_wide   = sample(rt_model_prior(cases, T, 0.5),  NUTS(), MCMCThreads(), {{iter}}, {{chains}})  # wide sigma prior

println("sigma (narrow prior) median: ", median(vec(Array(ch_narrow[:sigma]))))  # compare sigma posteriors
println("sigma (wide prior)   median: ", median(vec(Array(ch_wide[:sigma]))))  # sensitivity to prior choice
'''

