[[actionGroups.actions]]
id = "forecast"
label = "Case Forecast"
desc = "Extend the Rt random walk forward to produce a probabilistic case count forecast with uncertainty bands"
code = '''
using Turing, Distributions, GLMakie, Random

Random.seed!(42)  # reproducible
T = {{T}}; T_fwd = NaN  # observed and forecast horizon
cases_obs = rand(Poisson(20), T)  # replace with observed daily counts

@model function rt_model_fwd(cases, T, T_fwd)
    sigma ~ Exponential(0.1)
    log_Rt = Vector{Real}(undef, T_fwd)
    log_Rt[1] ~ Normal(0.0, 1.0)
    for t in 2:T_fwd; log_Rt[t] ~ Normal(log_Rt[t-1], sigma); end
    for t in 2:T; cases[t] ~ Poisson(exp(log_Rt[t]) * cases[t-1] + 1e-6); end
end

chain = sample(rt_model_fwd(cases_obs, T, T_fwd), NUTS(), MCMCThreads(), {{iter}}, {{chains}})  # fit to observed
cases_fwd = missing.(ones(Int, T_fwd))  # missing for all time points
ppc = predict(rt_model_fwd(cases_fwd, T, T_fwd) | chain)  # draw predictive samples

fig,ax=Figure(),Axis(fig[1,1],xlabel="Day",ylabel="Cases",title="14-Day Case Forecast")
vlines!(ax,[T],color=:black,linestyle=:dash)  # forecast start
scatter!(ax,1:T,cases_obs,color=:black,markersize=4)  # observed
band!(ax,1:T_fwd,...)  # replace ... with 5th/95th quantiles from ppc
display(fig)
'''

[[actionGroups.actions]]
id = "counterfactual"
label = "Counterfactual"
desc = "Compare the observed trajectory to a counterfactual scenario with constant Rt = 1 from day 1"
code = '''
using Turing, Distributions, GLMakie, Random

Random.seed!(42)  # reproducible
T = {{T}}  # observation days
cases_obs = rand(Poisson(20), T)  # replace with observed counts

cases_cf = zeros(Int, T)  # counterfactual: Rt = 1.0 throughout
cases_cf[1] = cases_obs[1]
for t in 2:T
    cases_cf[t] = rand(Poisson(1.0 * cases_cf[t-1] + 1e-6))  # flat renewal with Rt = 1
end

fig,ax=Figure(),Axis(fig[1,1],xlabel="Day",ylabel="Cases",title="Observed vs Counterfactual (Rt = 1)")
lines!(ax,1:T,cases_obs,color=:red,label="Observed")  # actual trajectory
lines!(ax,1:T,cases_cf, color=:blue,label="Counterfactual (Rt=1)")  # flat Rt scenario
axislegend(ax)
display(fig)
'''

