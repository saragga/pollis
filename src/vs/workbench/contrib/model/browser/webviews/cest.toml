{{?model=sir|seir}} ps = [plot(1:length(mc.risk_parameters), mc.risk_parameters; yscale = :log10, title = string("Chain ", c)) for (c, mc) in enumerate(mcmc.markov_chains)]  # one line per parameter
{{?model=sir|seir}} foreach(p -> vline!(p, [{{burnin}}]; color = :red, linestyle = :dash), ps)  # end of burn-in
{{?model=sir|seir}} display(plot(ps...; layout = length(ps)))
{{?model=sir|seir}} lp = plot(xlabel = "Iteration", ylabel = "Log posterior", title = "Log posterior per chain")
{{?model=sir|seir}} for mc in mcmc.markov_chains
{{?model=sir|seir}}     plot!(lp, mc.log_posterior; label = "")
{{?model=sir|seir}} end
{{?model=sir|seir}} display(lp)
'''

[[actionGroups.actions]]
id = "rhat"
label = "R-hat and ESS"
desc = "Rt: R-hat and effective sample size of the random-walk SD and the starting log Rt, plus the worst values over all parameters. SIR and SEIR: R-hat and ESS of the Pathogen.jl chains via MCMCChains.jl"
code = '''
{{?model=rt}} rh, es = rhat(chain), ess(chain)
{{?model=rt}} for (k, name) in enumerate(rh.nt.parameters)
{{?model=rt}}     name in (:sigma, :log_R_start) && println(rpad(string(name), 12), " R-hat ", round(rh.nt.rhat[k]; digits = 3), "  ESS ", round(Int, es.nt.ess[k]))
{{?model=rt}} end
{{?model=rt}} println("Max R-hat over all parameters: ", round(maximum(rh.nt.rhat); digits = 3), " (below 1.01 is good)")
{{?model=rt}} println("Min ESS over all parameters:   ", round(Int, minimum(es.nt.ess)))
{{?model=sir|seir}} using MCMCChains  # R-hat and ESS on the Pathogen.jl draws
{{?model=sir|seir}} vals = cat([convert(Array{Float64, 2}, mc.risk_parameters[({{burnin}} + 1):end]) for mc in mcmc.markov_chains]...; dims = 3)  # iterations x parameters x chains
{{?model=sir|seir}} pchain = Chains(vals, pars)
{{?model=sir|seir}} display(rhat(pchain))
{{?model=sir|seir}} display(ess(pchain))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forecast"
label = "Forecast"
desc = "Rt: 14-day case forecast by continuing the random walk and the renewal equation from 500 posterior draws. SIR and SEIR: predictive distribution of outbreak size from 200 outbreaks re-simulated from posterior draws"
code = '''
{{?model=rt}} H = 14  # forecast horizon (days)
{{?model=rt}} sig = vec(Array(chain[:sigma]))  # same draw order as Rt_draws
{{?model=rt}} function forecast_path(i)
{{?model=rt}}     x = float.(cases)
{{?model=rt}}     logR = log(Rt_draws[i, end])
{{?model=rt}}     for h in 1:H
{{?model=rt}}         logR += sig[i] * randn()  # the random walk continues
{{?model=rt}}         push!(x, rand(Poisson(exp(logR) * infectious(x, T + h) + 1e-6)))
{{?model=rt}}     end
{{?model=rt}}     return x[(T + 1):end]
{{?model=rt}} end
{{?model=rt}} paths = permutedims(reduce(hcat, [forecast_path(i) for i in rand(1:size(Rt_draws, 1), 500)]))
{{?model=rt}} med, lo, hi = ([quantile(v, q) for v in eachcol(paths)] for q in (0.5, 0.05, 0.95))
{{?model=rt}} p = scatter(1:T, cases; markersize = 2, color = :black, label = "Observed", xlabel = "Day", ylabel = "Cases", title = "14-day forecast")
{{?model=rt}} plot!(p, (T + 1):(T + H), med; ribbon = (med .- lo, hi .- med), fillalpha = 0.3, label = "Forecast median (90%)")
{{?model=rt}} display(p)
{{?model=rt}} println("Cases on day ", T + H, ": median ", med[end], ", 90% interval [", lo[end], ", ", hi[end], "]")
{{?model=sir|seir}} sizes = [count(!isnan, outbreak(rf, rp).events.infection) for rp in rand(draws, 200)]  # final sizes of re-simulated outbreaks
{{?model=sir|seir}} observed = count(!isnan, obs.infection)
{{?model=sir|seir}} p = histogram(sizes; bins = 20, label = "Posterior predictive", xlabel = "People infected by day {{T}}", ylabel = "Simulations", title = "Outbreak size")
{{?model=sir|seir}} vline!(p, [observed]; color = :black, linewidth = 2, label = "Observed")
{{?model=sir|seir}} display(p)
{{?model=sir|seir}} println("P(size >= observed): ", round(mean(sizes .>= observed); digits = 2))
{{?model=sir|seir}} println("Size quantiles (5%, 50%, 95%): ", quantile(sizes, [0.05, 0.5, 0.95]))
'''

[[actionGroups.actions]]
id = "counterfactual"
label = "Counterfactual"
desc = "Rt: what if Rt had stayed at its pre-change posterior value; 500 simulated paths and the cases averted. SIR and SEIR: outbreak sizes if cases were removed (isolated) twice as fast"
code = '''
{{?model=rt}} c = {{change-day}}
{{?model=rt}} jc = col(c - 1)  # Rt on the day before the change
{{?model=rt}} function no_change_path(i)
{{?model=rt}}     x = float.(cases[1:(c - 1)])
{{?model=rt}}     for t in c:T
{{?model=rt}}         push!(x, rand(Poisson(Rt_draws[i, jc] * infectious(x, t) + 1e-6)))
{{?model=rt}}     end
{{?model=rt}}     return x
{{?model=rt}} end
{{?model=rt}} cf = permutedims(reduce(hcat, [no_change_path(i) for i in rand(1:size(Rt_draws, 1), 500)]))
{{?model=rt}} med, lo, hi = ([quantile(v, q) for v in eachcol(cf)] for q in (0.5, 0.05, 0.95))
{{?model=rt}} p = plot(1:T, max.(hi, 1); fillrange = max.(lo, 1), fillalpha = 0.3, linealpha = 0, label = "No change (90%)", yscale = :log10, xlabel = "Day", ylabel = "Cases (log scale)", title = "Counterfactual: Rt not reduced")
{{?model=rt}} plot!(p, 1:T, max.(med, 1); label = "No change (median)")
{{?model=rt}} scatter!(p, 1:T, max.(cases, 1); markersize = 2, color = :black, label = "Observed")
{{?model=rt}} vline!(p, [c]; linestyle = :dash, color = :gray, label = "Change day")
{{?model=rt}} display(p)
{{?model=rt}} averted = vec(sum(cf[:, c:T]; dims = 2)) .- sum(cases[c:T])
{{?model=rt}} println("Cases averted by the change: median ", round(Int, median(averted)), ", 90% interval [", round(Int, quantile(averted, 0.05)), ", ", round(Int, quantile(averted, 0.95)), "]")
{{?model=rt}} println("An upper bound: the renewal equation has no susceptible depletion")
{{?model=sir}} faster(rp) = RiskParameters{SIR}(rp.sparks, rp.susceptibility, rp.infectivity, rp.transmissibility, 2 .* rp.removal)  # removal twice as fast
{{?model=seir}} faster(rp) = RiskParameters{SEIR}(rp.sparks, rp.susceptibility, rp.infectivity, rp.transmissibility, rp.latency, 2 .* rp.removal)  # removal twice as fast
{{?model=sir|seir}} ds = rand(draws, 200)  # the same posterior draws for both scenarios
{{?model=sir|seir}} fitted = [count(!isnan, outbreak(rf, rp).events.infection) for rp in ds]
{{?model=sir|seir}} isolated = [count(!isnan, outbreak(rf, faster(rp)).events.infection) for rp in ds]
{{?model=sir|seir}} p = histogram(fitted; bins = 20, alpha = 0.5, label = "Fitted removal rate", xlabel = "People infected by day {{T}}", ylabel = "Simulations", title = "Counterfactual: faster isolation")
{{?model=sir|seir}} histogram!(p, isolated; bins = 20, alpha = 0.5, label = "Removal twice as fast")
{{?model=sir|seir}} display(p)
{{?model=sir|seir}} println("Median outbreak size: fitted ", median(fitted), ", faster isolation ", median(isolated))
{{?model=sir|seir}} println("Share of outbreaks with 10 or more people: fitted ", round(mean(fitted .>= 10); digits = 2), ", faster isolation ", round(mean(isolated .>= 10); digits = 2))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "model-comparison"
label = "Model Comparison"
desc = "Rt: the renewal Rt against a naive day-on-day growth factor that ignores the serial interval. SIR and SEIR: fit the other model to the same data and compare posterior predictive outbreaks"
code = '''
{{?model=rt}} prev = [t > 1 ? float(cases[t - 1]) : 0.0 for t in 1:T]  # yesterday cases instead of the serial-interval weighted sum
{{?model=rt}} naive = renewal(cases, prev, days)
{{?model=rt}} naive_chain = sample(naive, NUTS(), MCMCThreads(), {{samples}}, {{chains}})
{{?model=rt}} G = permutedims(reduce(hcat, vec(returned(naive, naive_chain))))
{{?model=rt}} G_med = [median(v) for v in eachcol(G)]
{{?model=rt}} p = plot(days, Rt_med; label = "Renewal Rt (median)", xlabel = "Day", ylabel = "Rt", title = "Renewal Rt against the growth factor")
{{?model=rt}} plot!(p, days, G_med; label = "Day-on-day growth factor (median)")
{{?model=rt}} plot!(p, 1:T, Rt_true; linestyle = :dash, color = :black, label = "True Rt")
{{?model=rt}} hline!(p, [1.0]; linestyle = :dot, color = :red, label = "")
{{?model=rt}} display(p)
{{?model=rt}} mae(x) = mean(abs.(x .- Rt_true[days]))
{{?model=rt}} println("Mean absolute error against the true Rt: renewal ", round(mae(Rt_med); digits = 3), ", growth factor ", round(mae(G_med); digits = 3))
{{?model=rt}} println("The growth factor ignores the serial interval, so it stays near 1 even when Rt is far from 1")
{{?model=sir}} model_names = ("SIR", "SEIR")
{{?model=sir}} obs2 = EventObservations{SEIR}(obs.infection, obs.removal)  # the same data, now with unobserved exposure
{{?model=sir}} rf2 = RiskFunctions{SEIR}(spark_risk, one_risk, powerlaw, one_risk, constant_rate, constant_rate)
{{?model=sir}} priors2 = RiskPriors{SEIR}([Exponential(0.0001)], UnivariateDistribution[], [Uniform(1.0, 7.0)], UnivariateDistribution[], [Uniform(0.0, 1.0)], [Uniform(0.0, 1.0)])
{{?model=sir}} ee2 = EventExtents{SEIR}(20.0, 5.0, 5.0)
{{?model=seir}} model_names = ("SEIR", "SIR")
{{?model=seir}} obs2 = EventObservations{SIR}(obs.infection, obs.removal)  # the same data, with no latent period
{{?model=seir}} rf2 = RiskFunctions{SIR}(spark_risk, one_risk, powerlaw, one_risk, constant_rate)
{{?model=seir}} priors2 = RiskPriors{SIR}([Exponential(0.0001)], UnivariateDistribution[], [Uniform(1.0, 7.0)], UnivariateDistribution[], [Uniform(0.0, 1.0)])
{{?model=seir}} ee2 = EventExtents{SIR}(5.0, 5.0)
{{?model=sir|seir}} mcmc2 = MCMC(obs2, ee2, pop, starting, rf2, priors2)
{{?model=sir|seir}} start!(mcmc2, {{chains}}; attempts = 50000)
{{?model=sir|seir}} iterate!(mcmc2, {{iter}}, 1.0; condition_on_network = true, event_batches = 5)
{{?model=sir|seir}} draws2 = [rp for mc in mcmc2.markov_chains for rp in mc.risk_parameters[({{burnin}} + 1):20:end]]
{{?model=sir|seir}} function predictive(rf, ds)  # observed final size and last onset of 200 re-simulated outbreaks
{{?model=sir|seir}}     sims = [observe(outbreak(rf, rp), Uniform(0.5, 2.5), Uniform(0.5, 2.5); force = true) for rp in rand(ds, 200)]
{{?model=sir|seir}}     return [count(!isnan, o.infection) for o in sims], [maximum(filter(isfinite, o.infection); init = 0.0) for o in sims]
{{?model=sir|seir}} end
{{?model=sir|seir}} results = (predictive(rf, draws), predictive(rf2, draws2))
{{?model=sir|seir}} observed_size, observed_last = count(!isnan, obs.infection), maximum(filter(isfinite, obs.infection); init = 0.0)
{{?model=sir|seir}} p = histogram(results[1][1]; bins = 20, alpha = 0.5, label = model_names[1], xlabel = "People infected", ylabel = "Simulations", title = "Posterior predictive outbreak size")
{{?model=sir|seir}} histogram!(p, results[2][1]; bins = 20, alpha = 0.5, label = model_names[2])
{{?model=sir|seir}} vline!(p, [observed_size]; color = :black, linewidth = 2, label = "Observed")
{{?model=sir|seir}} display(p)
{{?model=sir|seir}} for (name, (s, l)) in zip(model_names, results)
{{?model=sir|seir}}     println(rpad(name, 5), " P(size >= observed) ", round(mean(s .>= observed_size); digits = 2), ", median last onset ", round(median(l); digits = 1), " (observed ", round(observed_last; digits = 1), ")")
{{?model=sir|seir}} end
{{?model=sir|seir}} println("A posterior predictive check, not formal model choice: Pathogen.jl gives no marginal likelihood")
'''

[[actionGroups.actions]]
id = "sensitivity"
label = "Sensitivity"
desc = "Rt: refit with serial-interval means of 4, the chosen value and 7 days and overlay the Rt medians. SIR and SEIR: refit with much wider priors and compare the posterior summaries"
code = '''
{{?model=rt}} p = plot(1:T, Rt_true; linestyle = :dash, color = :black, label = "True Rt", xlabel = "Day", ylabel = "Rt (posterior median)", title = "Sensitivity to the serial interval")
{{?model=rt}} for m in unique([4.0, {{si-mean}}, 7.0])
{{?model=rt}}     si_m = Gamma((m / {{si-sd}})^2, {{si-sd}}^2 / m)
{{?model=rt}}     wm = diff(cdf.(si_m, 0:21)); wm ./= sum(wm)
{{?model=rt}}     mod_m = renewal(cases, [infectious(cases, t, wm) for t in 1:T], days)
{{?model=rt}}     R = permutedims(reduce(hcat, vec(returned(mod_m, sample(mod_m, NUTS(), MCMCThreads(), {{samples}}, {{chains}})))))
{{?model=rt}}     plot!(p, days, [median(v) for v in eachcol(R)]; label = string("Mean ", m, " days"))
{{?model=rt}} end
{{?model=rt}} display(p)
{{?model=rt}} println("A shorter assumed serial interval pulls Rt towards 1; a longer one pushes it away from 1")
{{?model=sir}} wide = RiskPriors{SIR}([Exponential(0.001)], UnivariateDistribution[], [Uniform(0.0, 20.0)], UnivariateDistribution[], [Uniform(0.0, 5.0)])
{{?model=seir}} wide = RiskPriors{SEIR}([Exponential(0.001)], UnivariateDistribution[], [Uniform(0.0, 20.0)], UnivariateDistribution[], [Uniform(0.0, 5.0)], [Uniform(0.0, 5.0)])
{{?model=sir|seir}} mcmc_w = MCMC(obs, ee, pop, starting, rf, wide)
{{?model=sir|seir}} start!(mcmc_w, {{chains}}; attempts = 50000)
{{?model=sir|seir}} iterate!(mcmc_w, {{iter}}, 1.0; condition_on_network = true, event_batches = 5)
{{?model=sir|seir}} println("Default priors:")
{{?model=sir|seir}} display(summary(mcmc; burnin = {{burnin}}, thin = 20))
{{?model=sir|seir}} println("Wider priors:")
{{?model=sir|seir}} display(summary(mcmc_w; burnin = {{burnin}}, thin = 20))
'''

