code = '''
using Turing, Distributions, GLMakie, Random

Random.seed!(42)  # reproducible
T = {{T}}; cases = rand(Poisson(20), T)  # replace with observed counts

@model function rt_model(cases, T)
    sigma ~ Exponential(0.1); log_Rt = Vector{Real}(undef, T)
    log_Rt[1] ~ Normal(0.0, 1.0)
    for t in 2:T; log_Rt[t] ~ Normal(log_Rt[t-1], sigma); end
    Rt = exp.(log_Rt)
    for t in 2:T; cases[t] ~ Poisson(Rt[t] * cases[t-1] + 1e-6); end
end

chain = sample(rt_model(cases, T), NUTS(), MCMCThreads(), {{iter}}, {{chains}})  # run inference
ppc = predict(rt_model(missing, T) | chain)  # posterior predictive samples

