[[actionGroups.actions]]
id = "rt-trajectory"
label = "Rt Trajectory"
desc = "Plot posterior median and 90% credible interval of Rt over the observation window"
code = '''
using Turing, Distributions, GLMakie, Random

Random.seed!(42)  # reproducible
T = {{T}}  # observation days
cases = rand(Poisson(20), T)  # replace with observed data

@model function rt_model(cases, T)
    sigma ~ Exponential(0.1)
    log_Rt = Vector{Real}(undef, T)
    log_Rt[1] ~ Normal(0.0, 1.0)
    for t in 2:T; log_Rt[t] ~ Normal(log_Rt[t-1], sigma); end
    Rt = exp.(log_Rt)
    for t in 2:T; cases[t] ~ Poisson(Rt[t] * cases[t-1] + 1e-6); end
end

chain = sample(rt_model(cases, T), NUTS(), MCMCThreads(), {{iter}}, {{chains}})  # run inference
log_Rt_samples = Array(chain[namesingroup(chain, :log_Rt)])  # extract log_Rt samples
Rt_median = median(log_Rt_samples, dims=1)[1,:] .|> exp  # posterior median Rt
Rt_lo = quantile.(eachcol(log_Rt_samples), 0.05) .|> exp  # 5th percentile
Rt_hi = quantile.(eachcol(log_Rt_samples), 0.95) .|> exp  # 95th percentile

fig,ax=Figure(),Axis(fig[1,1],xlabel="Day",ylabel="Rt",title="Effective Reproduction Number")
band!(ax,1:T,Rt_lo,Rt_hi,color=(:blue,0.2))
lines!(ax,1:T,Rt_median,color=:blue)
hlines!(ax,[1.0],color=:red,linestyle=:dash)  # Rt = 1 threshold
display(fig)
'''

