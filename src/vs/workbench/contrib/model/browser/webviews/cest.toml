[[actionGroups.actions]]
id = "param-posteriors"
label = "Parameter Posteriors"
desc = "Extract marginal posterior distributions for beta, gamma, and sigma from the fitted model"
code = '''
using Pathogen, Distributions, Statistics, GLMakie, Random

Random.seed!(42)  # reproducible
pop = Population({{N}}, rand({{N}}, 2))  # population
rf  = RiskFunctions{SIR}((a,p,i)->a[1],(a,p,i)->1.0,(b,p,k)->b[1],(b,p,i,k)->exp(-b[2]*norm(p.risks[i]-p.risks[k])),(g,p,k)->g[1])  # risk functions
rp  = RiskParameters{SIR}([0.0001],[0.5,2.0],[0.1])  # true parameters
obs = observe(Simulation(pop,rf,rp),Uniform(0.0,{{T}}.0))  # observed event times

pr  = RiskParameterPriors{SIR}([Uniform(0,0.01)],[Uniform(0,2),Uniform(0,5)],[Uniform(0,1)])  # priors
ch  = MCMC(obs, pr, rf, pop, {{iter}})  # run MCMC

beta_samples  = [s.transmissibility[1] for s in ch]  # transmissibility samples
gamma_samples = [s.removal[1] for s in ch]  # removal rate samples

println("beta  95% CI: [", round(quantile(beta_samples,0.025);digits=3), ", ", round(quantile(beta_samples,0.975);digits=3), "]")
println("gamma 95% CI: [", round(quantile(gamma_samples,0.025);digits=3), ", ", round(quantile(gamma_samples,0.975);digits=3), "]")
'''

[[actionGroups.actions]]
id = "transmission-network"
label = "Transmission Network"
desc = "Visualise the posterior who-infected-whom network from Pathogen.jl MCMC with credible transmission edges"
code = '''
using Pathogen, Distributions, Random

Random.seed!(42)  # reproducible
pop = Population({{N}}, rand({{N}}, 2))  # population
rf  = RiskFunctions{SEIR}((a,p,i)->a[1],(a,p,i)->1.0,(b,p,k)->b[1],(b,p,i,k)->exp(-b[2]*norm(p.risks[i]-p.risks[k])),(s,p,k)->s[1],(g,p,k)->g[1])  # SEIR risk functions
rp  = RiskParameters{SEIR}([0.0001],[0.5,2.0],[0.2],[0.1])  # true parameters
obs = observe(Simulation(pop,rf,rp),Uniform(0.0,{{T}}.0))  # observed event times

pr  = RiskParameterPriors{SEIR}([Uniform(0,0.01)],[Uniform(0,2),Uniform(0,5)],[Uniform(0,1)],[Uniform(0,1)])  # priors
ch  = MCMC(obs, pr, rf, pop, {{iter}})  # run MCMC

plot(ch[end], obs, pop)  # posterior transmission network overlaid on spatial map
println("Posterior mean R0: ", mean([mean(filter(!isnothing, s.network.sources) .|> x -> 1) for s in ch]))  # crude R0 estimate from network
'''
