[[actionGroups.actions]]
id = "param-posteriors"
label = "Parameter Posteriors"
desc = "Rt: posterior of the random-walk SD, Rt before and at the end with 95% credible intervals, and the first day with P(Rt > 1) below 5%. SIR and SEIR: median and 95% credible interval of each parameter against the truth, with the implied periods"
code = '''
{{?model=rt}} sig = vec(Array(chain[:sigma]))
{{?model=rt}} println("sigma (daily SD of log Rt): median ", round(median(sig); digits = 3), ", 95% credible interval [", round(quantile(sig, 0.025); digits = 3), ", ", round(quantile(sig, 0.975); digits = 3), "]")
{{?model=rt}} for t in ({{change-day}} - 1, T)
{{?model=rt}}     v = Rt_draws[:, col(t)]
{{?model=rt}}     println("Rt on day ", t, ": median ", round(median(v); digits = 2), ", 95% credible interval [", round(quantile(v, 0.025); digits = 2), ", ", round(quantile(v, 0.975); digits = 2), "], true ", Rt_true[t])
{{?model=rt}} end
{{?model=rt}} p_above = vec(mean(Rt_draws .> 1; dims = 1))  # posterior probability that Rt > 1, per day
{{?model=rt}} below = findfirst(t -> t >= {{change-day}} && p_above[col(t)] < 0.05, days)
{{?model=rt}} println(below === nothing ? "P(Rt > 1) never falls below 5% after the change" : string("First day after the change with P(Rt > 1) below 5%: day ", days[below]))
{{?model=sir|seir}} P = convert(Array{Float64, 2}, draws)  # draws x parameters
{{?model=sir|seir}} truth = convert(Vector{Float64}, rp_true)
{{?model=sir|seir}} for (k, name) in enumerate(pars)
{{?model=sir|seir}}     v = P[:, k]
{{?model=sir|seir}}     println(rpad(string(name), 9), " median ", round(median(v); sigdigits = 3), ", 95% credible interval [", round(quantile(v, 0.025); sigdigits = 3), ", ", round(quantile(v, 0.975); sigdigits = 3), "], true ", truth[k])
{{?model=sir|seir}} end
{{?model=sir|seir}} println("Infectious period (1 / removal rate): median ", round(median(1 ./ P[:, end]); digits = 1), " days, true ", round(1 / truth[end]; digits = 1))
{{?model=seir}} println("Latent period (1 / latency rate): median ", round(median(1 ./ P[:, 3]); digits = 1), " days, true ", round(1 / truth[3]; digits = 1))
'''

[[actionGroups.actions]]
id = "transmission-network"
label = "Growth and Transmission"
desc = "Rt: the epidemic growth rate implied by Rt and the serial interval (Wallinga and Lipsitch), with doubling or halving times. SIR and SEIR: how well the posterior recovers who infected whom, and the true and posterior networks on the map"
code = '''
{{?model=rt}} k, th = params(si)  # Gamma shape and scale of the serial interval
{{?model=rt}} r = (Rt_draws .^ (1 / k) .- 1) ./ th  # growth rate implied by each Rt draw
{{?model=rt}} r_med, r_lo, r_hi = ([quantile(v, q) for v in eachcol(r)] for q in (0.5, 0.05, 0.95))
{{?model=rt}} p = plot(days, r_med; ribbon = (r_med .- r_lo, r_hi .- r_med), fillalpha = 0.3, label = "Growth rate (median, 90% CrI)", xlabel = "Day", ylabel = "r (per day)", title = "Epidemic growth rate")
{{?model=rt}} hline!(p, [0.0]; linestyle = :dot, color = :red, label = "")
{{?model=rt}} display(p)
{{?model=rt}} for t in ({{change-day}} - 1, T)
{{?model=rt}}     g = r_med[col(t)]
{{?model=rt}}     println("Day ", t, ": r = ", round(g; digits = 3), " per day, ", g > 0 ? "doubling" : "halving", " time ", round(log(2) / abs(g); digits = 1), " days")
{{?model=rt}} end
{{?model=sir|seir}} source(tn, i) = tn.external[i] > 0 ? 0 : findfirst(>(0), tn.internal[:, i])  # 0 = infected from outside
{{?model=sir|seir}} tnp = TNPosterior(mcmc; burnin = {{burnin}}, thin = 20)
{{?model=sir|seir}} tn_true = sim.transmission_network
{{?model=sir|seir}} tn_mode = mode(tnp)  # most probable source of each case
{{?model=sir|seir}} cases_i = setdiff(findall(!isnan, sim.events.infection), 1)  # infected individuals other than the index case
{{?model=sir|seir}} prob_true(i) = (s = source(tn_true, i); s == 0 ? tnp.external[i] : tnp.internal[s, i])
{{?model=sir|seir}} println("Posterior mode source correct for ", round(100 * mean(source(tn_mode, i) == source(tn_true, i) for i in cases_i); digits = 1), "% of cases")
{{?model=sir|seir}} println("Mean posterior probability of the true source: ", round(mean(prob_true(i) for i in cases_i); digits = 2))
{{?model=sir|seir}} top_share(o) = (s = sort(o; rev = true); sum(s[1:max(1, round(Int, 0.2 * length(s)))]) / max(sum(s), 1))
{{?model=sir|seir}} infected = findall(!isnan, sim.events.infection)
{{?model=sir|seir}} println("Share of transmissions by the top 20% of spreaders: true ", round(top_share(vec(sum(tn_true.internal; dims = 2))[infected]); digits = 2), ", posterior mean ", round(top_share(vec(sum(tnp.internal; dims = 2))[infected]); digits = 2))
{{?model=sir|seir}} println("Mean offspring is close to 1 by construction: almost every case has exactly one source")
{{?model=sir|seir}} display(plot(plot(tn_true, pop; title = "True network"), plot(tnp, pop; title = "Posterior network"); layout = (1, 2), size = (900, 450)))
'''
