[[actionGroups.actions]]
id = "solution-summary"
label = "Solution Summary"
desc = "Print the full Pareto frontier with complexity, loss, and symbolic expression"
code = '''
using SymbolicRegression  # Julia package

X = {{X}}  # n_samples x n_features
y = {{y}}

options = Options(
    binary_operators=[{{binary}}],
    unary_operators=[{{unary}}],
    maxsize={{maxsize}},
)

hof = equation_search(X', y; niterations={{niter}}, options)
pareto = calculate_pareto_frontier(hof)

println("=== Symbolic Regression Solution ===")
println("Pareto frontier (", length(pareto), " expressions):")
for (i, m) in enumerate(pareto)
    println("  [", i, "] complexity=", m.complexity, "  loss=", m.loss)
    println("      ", string_tree(m.tree, options))
end
'''

[[actionGroups.actions]]
id = "feature-importance"
label = "Feature Usage"
desc = "Count how often each feature variable appears in Pareto expressions"
code = '''
using SymbolicRegression  # Julia package

X = {{X}}  # n_samples x n_features
y = {{y}}

options = Options(
    binary_operators=[{{binary}}],
    unary_operators=[{{unary}}],
    maxsize={{maxsize}},
)

hof = equation_search(X', y; niterations={{niter}}, options)
pareto = calculate_pareto_frontier(hof)

n_features = size(X, 2)  # number of columns
counts = zeros(Int, n_features)
for m in pareto
    expr = string_tree(m.tree, options)
    for j in 1:n_features
        counts[j] += count("x" * string(j), expr)
    end
end
for j in 1:n_features
    println("x", j, ": ", counts[j], " occurrences across Pareto frontier")
end
'''

[[actionGroups.actions]]
id = "algorithm-guide"
label = "Algorithm Guide"
desc = "Rules of thumb for configuring SymbolicRegression.jl"
code = '''
  # Operators: start with [+, -, *, /]; add exp/log/sin only if domain knowledge supports it
  # maxsize: keep <= 20 for interpretable expressions; larger permits more complex fits
  # niterations: 50-200 for exploration; increase if loss is still improving
  # Pareto frontier: prefer simplest expression with acceptable loss over lowest-loss

  # X must be transposed: SymbolicRegression expects n_features x n_samples (X')
  # Use eval_tree_array(member.tree, X', options)[1] to get predictions from any member
  # string_tree(member.tree, options) returns a human-readable symbolic expression
'''
