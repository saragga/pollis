[[actionGroups.actions]]
id = "evaluate-expression"
label = "Evaluate Expression"
desc = "Evaluate a chosen Pareto expression on the training data and report metrics"
code = '''
using SymbolicRegression  # Julia package

X = {{X}}  # n_samples x n_features
y = {{y}}

options = Options(
    binary_operators=[{{binary}}],
    unary_operators=[{{unary}}],
    maxsize={{maxsize}},
)

hof = equation_search(X', y; niterations={{niter}}, options)
pareto = calculate_pareto_frontier(hof)

idx = 1  # choose index into pareto (1 = simplest)
member = pareto[idx]
y_pred = eval_tree_array(member.tree, X', options)[1]

ss_res = sum((y .- y_pred) .^ 2)
ss_tot = sum((y .- mean(y)) .^ 2)
r2 = 1 - ss_res / ss_tot
println("R2: ", r2, "  RMSE: ", sqrt(ss_res / length(y)))
'''

