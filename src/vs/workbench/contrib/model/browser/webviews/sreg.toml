[[actionGroups.actions]]
id = "select-by-complexity"
label = "Select by Complexity"
desc = "Choose an expression at a specific complexity level from the Pareto frontier"
code = '''
using SymbolicRegression  # Julia package

X = {{X}}  # n_samples x n_features
y = {{y}}

options = Options(
    binary_operators=[{{binary}}],
    unary_operators=[{{unary}}],
    maxsize={{maxsize}},
)

hof = equation_search(X', y; niterations={{niter}}, options)
pareto = calculate_pareto_frontier(hof)

target_complexity = div({{maxsize}}, 2)  # pick mid-range complexity
idx = argmin([abs(m.complexity - target_complexity) for m in pareto])
chosen = pareto[idx]
println("Expression: ", string_tree(chosen.tree, options))
println("Complexity: ", chosen.complexity, "  Loss: ", chosen.loss)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "operator-comparison"
label = "Operator Comparison"
desc = "Compare search results with and without transcendental operators"
code = '''
using SymbolicRegression  # Julia package

X = {{X}}  # n_samples x n_features
y = {{y}}

opts_simple = Options(binary_operators=[+, -, *, /], unary_operators=[], maxsize={{maxsize}})
opts_full   = Options(binary_operators=[+, -, *, /], unary_operators=[exp, log, sin, cos], maxsize={{maxsize}})

hof_s = equation_search(X', y; niterations={{niter}}, options=opts_simple)
hof_f = equation_search(X', y; niterations={{niter}}, options=opts_full)

best_s = calculate_pareto_frontier(hof_s)[argmin([m.loss for m in calculate_pareto_frontier(hof_s)])]
best_f = calculate_pareto_frontier(hof_f)[argmin([m.loss for m in calculate_pareto_frontier(hof_f)])]

println("Simple ops: loss=", best_s.loss, "  ", string_tree(best_s.tree, opts_simple))
println("Full ops:   loss=", best_f.loss, "  ", string_tree(best_f.tree, opts_full))
'''

[[actionGroups.actions]]
id = "maxsize-comparison"
label = "Complexity Budget"
desc = "Run search at different maxsize values and compare best-loss expressions"
code = '''
using SymbolicRegression  # Julia package

X = {{X}}  # n_samples x n_features
y = {{y}}

for maxsz in [10, 20, 30]
    opts = Options(binary_operators=[{{binary}}], unary_operators=[{{unary}}], maxsize=maxsz)
    hof  = equation_search(X', y; niterations={{niter}}, options=opts)
    p    = calculate_pareto_frontier(hof)
    best = p[argmin([m.loss for m in p])]
    println("maxsize=", maxsz, "  loss=", best.loss, "  ", string_tree(best.tree, opts))
end
'''

