[[decisionRows]]
task = "Gradient Descent"
context = "First attempt on any smooth problem on a manifold; cheap iterations"
purpose = "Steps along the negative Riemannian gradient and retracts back to the manifold, with an Armijo line search"

[[decisionRows]]
task = "Conjugate Gradient"
context = "Large problems where storing curvature information is too costly"
purpose = "Combines the new gradient with the previous direction, moved by vector transport, for faster convergence than gradient descent at almost the same cost"

[[decisionRows]]
task = "Quasi-Newton"
context = "Moderate dimension, smooth objectives; usually the fastest first-order choice"
purpose = "Riemannian L-BFGS: builds curvature information from past gradients transported to the current tangent space"

[[decisionRows]]
task = "Trust Regions"
context = "When high accuracy or robustness near saddle points matters"
purpose = "Solves a quadratic model within a trust region by truncated conjugate gradient, with a finite-difference Hessian approximation by default; superlinear local convergence"

[[inputs]]
id = "n"
label = "Ambient Dimension (n)"
tooltip = "Size of the data matrix A used by the default objective, and of the default manifold's embedding."
default = "5"

[[inputs]]
id = "manifold"
label = "Manifold"
tooltip = "A Manifolds.jl manifold, for example Sphere(n - 1), Stiefel(n, 2), Grassmann(n, 2) or SymmetricPositiveDefinite(n)."
default = "Sphere(n - 1)"

[[inputs]]
id = "f"
label = "Objective f(M, p)"
tooltip = "Julia expression for the cost at a point p of M; A is a random symmetric n x n matrix. Default: the Rayleigh quotient, whose minimum on the sphere is the smallest eigenvalue of A."
default = "dot(p, A * p)"
newRow = true

[[inputs]]
id = "p0"
label = "Initial Point"
tooltip = "Starting point, which must lie on the manifold (for example a unit vector for the sphere)."
default = "normalize(ones(n))"

[[inputs]]
id = "maxiters"
label = "Max Iterations"
tooltip = "Maximum number of iterations before the solver stops."
default = "200"
newRow = true

[[inputs]]
id = "tol"
label = "Gradient Tolerance"
tooltip = "Stop when the norm of the Riemannian gradient falls below this value."
default = "1e-8"

