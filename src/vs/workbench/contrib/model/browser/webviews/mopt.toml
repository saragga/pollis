[[codeBranches]]
model = "gd"
code = '''
using Manopt, Manifolds, ManifoldDiff, ForwardDiff, LinearAlgebra, Random

n = {{n}}  # ambient dimension
Random.seed!(1)
B = randn(n, n); A = (B + transpose(B)) / 2  # random symmetric matrix used by the default objective
M = {{manifold}}  # the manifold
f(M, p) = {{f}}  # the cost
egrad(p) = ForwardDiff.gradient(q -> f(M, q), p)  # Euclidean gradient by automatic differentiation
grad_f(M, p) = ManifoldDiff.riemannian_gradient(M, p, egrad(p))  # converted to the Riemannian gradient
p0 = {{p0}}  # starting point on M
maxiters = {{maxiters}}  # iteration limit
tol = {{tol}}  # gradient-norm tolerance

function solve(p0=p0; maxiters=maxiters, tol=tol, kw...)
    st = gradient_descent(M, f, grad_f, p0;  # Riemannian gradient descent with Armijo line search
        stopping_criterion=StopAfterIteration(maxiters) | StopWhenGradientNormLess(tol),
        record=[:Cost, :GradientNorm, :Iterate], return_state=true, kw...)
    rec = get_record(st)
    (p = get_solver_result(st), costs = [r[1] for r in rec], gnorms = [r[2] for r in rec],
     iterates = [r[3] for r in rec], reason = get_reason(st))
end

res = solve()
p_opt = res.p
(solution = p_opt, cost = f(M, p_opt), gradient_norm = norm(M, p_opt, grad_f(M, p_opt)), iterations = length(res.costs), on_manifold = is_point(M, p_opt))
'''

[[codeBranches]]
model = "cg"
code = '''
using Manopt, Manifolds, ManifoldDiff, ForwardDiff, LinearAlgebra, Random

n = {{n}}  # ambient dimension
Random.seed!(1)
B = randn(n, n); A = (B + transpose(B)) / 2  # random symmetric matrix used by the default objective
M = {{manifold}}  # the manifold
f(M, p) = {{f}}  # the cost
egrad(p) = ForwardDiff.gradient(q -> f(M, q), p)  # Euclidean gradient by automatic differentiation
grad_f(M, p) = ManifoldDiff.riemannian_gradient(M, p, egrad(p))  # converted to the Riemannian gradient
p0 = {{p0}}  # starting point on M
maxiters = {{maxiters}}  # iteration limit
tol = {{tol}}  # gradient-norm tolerance

function solve(p0=p0; maxiters=maxiters, tol=tol, kw...)
    st = conjugate_gradient_descent(M, f, grad_f, p0;  # Riemannian conjugate gradient
        stopping_criterion=StopAfterIteration(maxiters) | StopWhenGradientNormLess(tol),
        record=[:Cost, :GradientNorm, :Iterate], return_state=true, kw...)
    rec = get_record(st)
    (p = get_solver_result(st), costs = [r[1] for r in rec], gnorms = [r[2] for r in rec],
     iterates = [r[3] for r in rec], reason = get_reason(st))
end

res = solve()
p_opt = res.p
(solution = p_opt, cost = f(M, p_opt), gradient_norm = norm(M, p_opt, grad_f(M, p_opt)), iterations = length(res.costs), on_manifold = is_point(M, p_opt))
'''

[[codeBranches]]
model = "qn"
code = '''
using Manopt, Manifolds, ManifoldDiff, ForwardDiff, LinearAlgebra, Random

n = {{n}}  # ambient dimension
Random.seed!(1)
B = randn(n, n); A = (B + transpose(B)) / 2  # random symmetric matrix used by the default objective
M = {{manifold}}  # the manifold
f(M, p) = {{f}}  # the cost
egrad(p) = ForwardDiff.gradient(q -> f(M, q), p)  # Euclidean gradient by automatic differentiation
grad_f(M, p) = ManifoldDiff.riemannian_gradient(M, p, egrad(p))  # converted to the Riemannian gradient
p0 = {{p0}}  # starting point on M
maxiters = {{maxiters}}  # iteration limit
tol = {{tol}}  # gradient-norm tolerance

function solve(p0=p0; maxiters=maxiters, tol=tol, kw...)
    st = quasi_Newton(M, f, grad_f, p0;  # Riemannian L-BFGS
        stopping_criterion=StopAfterIteration(maxiters) | StopWhenGradientNormLess(tol),
        record=[:Cost, :GradientNorm, :Iterate], return_state=true, kw...)
    rec = get_record(st)
    (p = get_solver_result(st), costs = [r[1] for r in rec], gnorms = [r[2] for r in rec],
     iterates = [r[3] for r in rec], reason = get_reason(st))
end

res = solve()
p_opt = res.p
(solution = p_opt, cost = f(M, p_opt), gradient_norm = norm(M, p_opt, grad_f(M, p_opt)), iterations = length(res.costs), on_manifold = is_point(M, p_opt))
'''

[[codeBranches]]
model = "tr"
code = '''
using Manopt, Manifolds, ManifoldDiff, ForwardDiff, LinearAlgebra, Random

n = {{n}}  # ambient dimension
Random.seed!(1)
B = randn(n, n); A = (B + transpose(B)) / 2  # random symmetric matrix used by the default objective
M = {{manifold}}  # the manifold
f(M, p) = {{f}}  # the cost
egrad(p) = ForwardDiff.gradient(q -> f(M, q), p)  # Euclidean gradient by automatic differentiation
grad_f(M, p) = ManifoldDiff.riemannian_gradient(M, p, egrad(p))  # converted to the Riemannian gradient
p0 = {{p0}}  # starting point on M
maxiters = {{maxiters}}  # iteration limit
tol = {{tol}}  # gradient-norm tolerance

function solve(p0=p0; maxiters=maxiters, tol=tol, kw...)
    st = trust_regions(M, f, grad_f, p0;  # Riemannian trust regions, finite-difference Hessian approximation
        stopping_criterion=StopAfterIteration(maxiters) | StopWhenGradientNormLess(tol),
        record=[:Cost, :GradientNorm, :Iterate], return_state=true, kw...)
    rec = get_record(st)
    (p = get_solver_result(st), costs = [r[1] for r in rec], gnorms = [r[2] for r in rec],
     iterates = [r[3] for r in rec], reason = get_reason(st))
end

res = solve()
p_opt = res.p
(solution = p_opt, cost = f(M, p_opt), gradient_norm = norm(M, p_opt, grad_f(M, p_opt)), iterations = length(res.costs), on_manifold = is_point(M, p_opt))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "convergence-trace"
label = "Convergence Trace"
desc = "Cost at each iteration"
code = '''
using Plots

plot(res.costs, xlabel="iteration", ylabel="f(p)", legend=false, marker=:circle, markersize=2)
'''

[[actionGroups.actions]]
id = "gradient-norm"
label = "Gradient Norm"
desc = "Norm of the Riemannian gradient per iteration (log scale)"
code = '''
using Plots

plot(max.(res.gnorms, 1e-16), yscale=:log10, xlabel="iteration", ylabel="norm of grad f", legend=false)
hline!([tol], linestyle=:dash)
'''

[[actionGroups.actions]]
id = "iterate-path"
label = "Iterate Path"
desc = "Geodesic distance from each iterate to the solution (log scale): linear, superlinear or sublinear convergence"
code = '''
using Plots

d = [distance(M, q, p_opt) for q in res.iterates]
plot(max.(d, 1e-16), yscale=:log10, xlabel="iteration", ylabel="distance to solution", legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "gradient-check"
label = "Gradient Check"
desc = "Compare the Riemannian gradient with finite differences along random geodesics at the starting point"
code = '''
Random.seed!(2)
map(1:5) do _
    X = rand(M; vector_at=p0); X = X / norm(M, p0, X)  # random unit tangent vector
    t = 1e-6
    fd = (f(M, exp(M, p0, t * X)) - f(M, exp(M, p0, -t * X))) / (2t)
    an = inner(M, p0, grad_f(M, p0), X)
    (finite_difference = fd, gradient = an, relative_error = abs(fd - an) / max(abs(an), 1e-12))
end
'''

[[actionGroups.actions]]
id = "debug-output"
label = "Debug Output"
desc = "Print iteration, cost and gradient norm every 10 iterations while solving"
code = '''
solve(debug=[:Iteration, " ", :Cost, " ", :GradientNorm, "\n", 10]);
'''

[[actionGroups.actions]]
id = "stopping-criterion"
label = "Stopping Criterion"
desc = "Which criterion stopped the solver and how close it came to the other"
code = '''
(reason = res.reason, iterations = length(res.costs), max_iterations = maxiters,
 final_gradient_norm = res.gnorms[end], tolerance = tol, converged = res.gnorms[end] < tol)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "run-optimisation"
label = "Solution"
desc = "The optimal point, its cost and checks that it lies on the manifold"
code = '''
(solution = round.(p_opt, sigdigits=6), cost = f(M, p_opt), on_manifold = is_point(M, p_opt),
 gradient_norm = norm(M, p_opt, grad_f(M, p_opt)), start_cost = f(M, p0))
'''

[[actionGroups.actions]]
id = "multiple-restarts"
label = "Multiple Restarts"
desc = "Solve from 10 random points on the manifold and compare the end points; for the default Rayleigh quotient on the sphere every local minimum is global (the two unit eigenvectors of the smallest eigenvalue) and all other critical points are saddles, so every run should reach the same cost"
code = '''
Random.seed!(3)
runs = [solve(rand(M)) for _ in 1:10]
c = [f(M, r.p) for r in runs]
gn = [norm(M, r.p, grad_f(M, r.p)) for r in runs]  # a small gradient norm with a higher cost marks a saddle or a stalled run
(costs = round.(c, sigdigits=8), gradient_norms = round.(gn, sigdigits=3), best = minimum(c), worst = maximum(c),
 share_at_best = count(c .<= minimum(c) + 1e-8) / length(c), selected_run_cost = f(M, p_opt),
 smallest_eigenvalue_of_A = eigmin(A))  # the global minimum for the default Rayleigh quotient on the sphere
'''

[[actionGroups.actions]]
id = "warm-start"
label = "Warm Start"
desc = "Restart from the solution with a hundred times tighter tolerance"
code = '''
r2 = solve(p_opt; tol=tol / 100)
(cost_before = f(M, p_opt), cost_after = f(M, r2.p), gradient_before = res.gnorms[end], gradient_after = r2.gnorms[end],
 moved = distance(M, p_opt, r2.p), extra_iterations = length(r2.costs))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "algorithm-comparison"
label = "Algorithm Comparison"
desc = "All four Manopt.jl solvers from the same start with the same stopping rule"
code = '''
solvers = ["gradient descent" => gradient_descent, "conjugate gradient" => conjugate_gradient_descent,
           "quasi-Newton" => quasi_Newton, "trust regions" => trust_regions]
map(solvers) do (name, s)
    s(M, f, grad_f, p0; stopping_criterion=StopAfterIteration(2))  # warm-up run so the timing excludes compilation
    sec = @elapsed st = s(M, f, grad_f, p0; stopping_criterion=StopAfterIteration(maxiters) | StopWhenGradientNormLess(tol),
                          record=[:Cost], return_state=true)
    p = get_solver_result(st)
    (solver = name, cost = f(M, p), gradient_norm = norm(M, p, grad_f(M, p)), iterations = length(get_record(st)), seconds = sec)
end
'''

[[actionGroups.actions]]
id = "budget-study"
label = "Iteration Budget"
desc = "Cost and gradient norm reached with increasing iteration limits"
code = '''
map(unique([1, 5, 10, 20, 50, maxiters])) do k
    r = solve(maxiters=k, tol=0.0)
    (max_iterations = k, cost = f(M, r.p), gradient_norm = r.gnorms[end])
end
'''

[[actionGroups.actions]]
id = "tolerance-sensitivity"
label = "Tolerance Sensitivity"
desc = "Iterations and time needed for gradient tolerances from 1e-2 to 1e-10"
code = '''
map([1e-2, 1e-4, 1e-6, 1e-8, 1e-10]) do t
    sec = @elapsed r = solve(tol=t, maxiters=10maxiters)
    (tolerance = t, iterations = length(r.costs), cost = f(M, r.p), seconds = sec)
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "solution-summary"
label = "Solution Summary"
desc = "Optimal point, cost, gradient norm and manifold membership; for the default Rayleigh quotient on the sphere, the minimum should equal the smallest eigenvalue of A"
code = '''
(manifold = string(M), solution = round.(p_opt, sigdigits=6), cost = f(M, p_opt), gradient_norm = norm(M, p_opt, grad_f(M, p_opt)),
 on_manifold = is_point(M, p_opt), iterations = length(res.costs), stopped_because = res.reason,
 smallest_eigenvalue_of_A = eigmin(A))
'''

[[actionGroups.actions]]
id = "geodesic-distance"
label = "Geodesic Distance"
desc = "Distance travelled along the manifold from the start, compared with the length of the iterate path"
code = '''
path = [[p0]; res.iterates]  # the start, then every iterate (a vector of points)
(start_to_solution = distance(M, p0, p_opt), path_length = sum(distance(M, path[i], path[i+1]) for i in 1:length(path)-1),
 euclidean_chord = norm(p_opt - p0))
'''

[[actionGroups.actions]]
id = "algorithm-guide"
label = "Algorithm Guide"
desc = "Rules of thumb for choosing between gradient descent, conjugate gradient, quasi-Newton and trust regions"
code = '''
[(solver = "gradient descent", per_iteration = "one gradient, a few costs (line search)", convergence = "linear", use_when = "baseline; cheap or very large problems"),
 (solver = "conjugate gradient", per_iteration = "as gradient descent plus a vector transport", convergence = "faster linear", use_when = "large problems without memory for curvature"),
 (solver = "quasi-Newton", per_iteration = "gradient plus limited-memory updates", convergence = "superlinear in practice", use_when = "moderate dimension; usually the best default"),
 (solver = "trust regions", per_iteration = "an inner truncated-CG solve with Hessian-vector products", convergence = "superlinear with the finite-difference Hessian approximation used here; quadratic only with an exact Hessian", use_when = "high accuracy, saddle points, or an exact Hessian is available")]
'''
