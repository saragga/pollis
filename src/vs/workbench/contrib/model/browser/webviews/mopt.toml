[[bullets]]
text = "Gradient Descent"
detail = "retraction-based steepest descent along the Riemannian gradient"

[[bullets]]
text = "Conjugate Gradient"
detail = "manifold-adapted CG with vector transport of search directions"

[[bullets]]
text = "Quasi-Newton"
detail = "L-BFGS Hessian approximation with vector transport; superlinear convergence"

