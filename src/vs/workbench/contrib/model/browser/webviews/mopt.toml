# Optimization on Riemannian Manifolds Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/mopt.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Optimization on Riemannian Manifolds"
viewType = "pollis.mopt"
defaultModel = "gd"

[[packages]]
name = "Manopt.jl"
github = "https://github.com/JuliaManifolds/Manopt.jl"

[[packages]]
name = "Manifolds.jl"
github = "https://github.com/JuliaManifolds/Manifolds.jl"

[requires]
packages = ["Manopt.jl", "Manifolds.jl", "ManifoldDiff.jl", "ForwardDiff.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Gradient Descent"
file = "mopt/tutorial-01-gd.ipynb"
bundled = true
description = "Retraction-based steepest descent along the Riemannian gradient; simple and robust; suited to smooth objectives with moderate curvature"

[[notebookSections.notebooks]]
name = "Conjugate Gradient"
file = "mopt/tutorial-02-cg.ipynb"
bundled = true
description = "Polak-Ribiere or Fletcher-Reeves CG with Riemannian vector transport; faster than gradient descent; low per-iteration memory cost"

[[notebookSections.notebooks]]
name = "Quasi-Newton"
file = "mopt/tutorial-03-qn.ipynb"
bundled = true
description = "Limited-memory BFGS Hessian approximation with vector transport; superlinear convergence; recommended for medium-scale problems"

[[notebookSections.notebooks]]
name = "Trust Regions"
file = "mopt/tutorial-04-tr.ipynb"
bundled = true
description = "Subproblem solved in the tangent space using tCG; superlinear local convergence with the default finite-difference Hessian approximation (quadratic with an exact Hessian); most robust for ill-conditioned and high-curvature problems"

