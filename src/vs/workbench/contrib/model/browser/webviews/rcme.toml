label = "Original Papers (from packages)"

[[references]]
title = "A Well-Conditioned Estimator for Large-Dimensional Covariance Matrices"
authors = "Ledoit & Wolf"
year = 2004
journal = "Journal of Multivariate Analysis"
doi = "10.1016/S0047-259X(03)00096-4"
openAccess = false

[[references]]
title = "Shrinkage Algorithms for MMSE Covariance Estimation"
authors = "Chen, Wiesel, Eldar & Hero"
year = 2010
journal = "IEEE Transactions on Signal Processing"
doi = "10.1109/TSP.2010.2053029"
openAccess = false

[[references]]
title = "Analytical Nonlinear Shrinkage of Large-Dimensional Covariance Matrices"
authors = "Ledoit & Wolf"
year = 2020
journal = "Annals of Statistics"
doi = "10.1214/19-AOS1921"
openAccess = false

[[models]]
id = "lw"
label = "Ledoit-Wolf"

[[models]]
id = "oas"
label = "OAS"

[[models]]
id = "nls"
label = "Nonlinear"

[[bullets]]
text = "Ledoit-Wolf"
detail = "analytically estimates the optimal linear shrinkage intensity that minimises the expected Frobenius loss between the shrinkage estimator and the true covariance, under a structured target matrix"

[[bullets]]
text = "OAS"
detail = "Oracle Approximating Shrinkage computes a closed-form shrinkage intensity by substituting the sample covariance for the unknown truth, yielding lower finite-sample bias than Ledoit-Wolf in high dimensions"

[[bullets]]
text = "Nonlinear"
detail = "applies an eigenvalue-wise optimal shrinkage function derived analytically from the Marčenko-Pastur law; fully non-parametric and asymptotically optimal under random matrix theory (Ledoit & Wolf 2020)"

[[inputs]]
id = "X"
label = "Data matrix (X)"
tooltip = "simulated: 60 observations of 40 assets from a known three-factor covariance, so there are almost as many variables as observations. Otherwise a T×N matrix: T observations in rows, N variables (assets) in columns. Each column is demeaned internally. Use returns, not price levels."
default = "simulated"

[[inputs]]
id = "target"
label = "Shrinkage target"
tooltip = "Structured matrix to shrink towards. Common choices: DiagonalCommonVariance() (the identity scaled by the average variance: the Ledoit-Wolf 2004 target), DiagonalUnitVariance() (the identity itself: only sensible for standardised data, otherwise it pulls every variance towards 1), ConstantCorrelation() (sample variances, equal pairwise correlations). A well-specified target reduces finite-sample error. OAS always shrinks towards DiagonalCommonVariance, the only target it is defined for."
kind = "select"
default = "DiagonalCommonVariance()"
models = ["lw"]

[[inputs.options]]
value = "DiagonalUnitVariance()"
label = "DiagonalUnitVariance"

[[inputs.options]]
value = "DiagonalCommonVariance()"
label = "DiagonalCommonVariance"

[[inputs.options]]
value = "ConstantCorrelation()"
label = "ConstantCorrelation"

[[codeBranches]]
model = "lw"
code = '''
using CovarianceEstimation, LinearAlgebra, Random

{{?X=simulated}} Random.seed!(1); B = randn(40, 3) ./ 3; SigmaTrue = B * transpose(B) + 0.02I  # true covariance: 3 factors plus noise, 40 assets
{{?X=simulated}} X = randn(60, 40) * cholesky(Symmetric(SigmaTrue)).U  # 60 observations of 40 assets
{{?X!=simulated}} X = {{X}}  # observations in rows, variables in columns

est = LinearShrinkage({{target}}, :lw)  # Ledoit-Wolf linear shrinkage
Sigma = cov(est, X)  # shrunk covariance
S = cov(SimpleCovariance(), X)  # sample covariance, for comparison
sd = sqrt.(diag(Sigma))
rho = Sigma ./ (sd * transpose(sd))  # correlation matrix
Omega = inv(Sigma)  # precision matrix (inverse covariance)

println("Condition number, sample: ", round(cond(S), sigdigits=3), ", shrunk: ", round(cond(Sigma), sigdigits=3))
'''

[[codeBranches]]
model = "oas"
code = '''
using CovarianceEstimation, LinearAlgebra, Random

{{?X=simulated}} Random.seed!(1); B = randn(40, 3) ./ 3; SigmaTrue = B * transpose(B) + 0.02I  # true covariance: 3 factors plus noise, 40 assets
{{?X=simulated}} X = randn(60, 40) * cholesky(Symmetric(SigmaTrue)).U  # 60 observations of 40 assets
{{?X!=simulated}} X = {{X}}  # observations in rows, variables in columns

est = LinearShrinkage(DiagonalCommonVariance(), :oas)  # oracle approximating shrinkage
Sigma = cov(est, X)  # shrunk covariance
S = cov(SimpleCovariance(), X)  # sample covariance, for comparison
sd = sqrt.(diag(Sigma))
rho = Sigma ./ (sd * transpose(sd))  # correlation matrix
Omega = inv(Sigma)  # precision matrix (inverse covariance)

println("Condition number, sample: ", round(cond(S), sigdigits=3), ", shrunk: ", round(cond(Sigma), sigdigits=3))
'''

[[codeBranches]]
model = "nls"
code = '''
using CovarianceEstimation, LinearAlgebra, Random

{{?X=simulated}} Random.seed!(1); B = randn(40, 3) ./ 3; SigmaTrue = B * transpose(B) + 0.02I  # true covariance: 3 factors plus noise, 40 assets
{{?X=simulated}} X = randn(60, 40) * cholesky(Symmetric(SigmaTrue)).U  # 60 observations of 40 assets
{{?X!=simulated}} X = {{X}}  # observations in rows, variables in columns

est = AnalyticalNonlinearShrinkage()  # analytical nonlinear shrinkage (Ledoit and Wolf 2020)
Sigma = cov(est, X)  # shrunk covariance
S = cov(SimpleCovariance(), X)  # sample covariance, for comparison
sd = sqrt.(diag(Sigma))
rho = Sigma ./ (sd * transpose(sd))  # correlation matrix
Omega = inv(Sigma)  # precision matrix (inverse covariance)

println("Condition number, sample: ", round(cond(S), sigdigits=3), ", shrunk: ", round(cond(Sigma), sigdigits=3))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "spectrum"
label = "Eigenvalue Spectrum"
desc = "Sorted eigenvalues of the sample and shrunk covariance on a log scale: shrinkage lifts the smallest and pulls down the largest"
code = '''
using Plots
plot(sort(eigvals(Symmetric(S)), rev=true), yscale=:log10, marker=:circle, ms=2, label="sample", xlabel="rank", ylabel="eigenvalue")
plot!(sort(eigvals(Symmetric(Sigma)), rev=true), marker=:circle, ms=2, label="shrunk")
{{?X=simulated}} plot!(sort(eigvals(Symmetric(SigmaTrue)), rev=true), ls=:dash, label="true")
'''

[[actionGroups.actions]]
id = "heatmap"
label = "Correlation Heatmap"
desc = "The shrunk correlation matrix next to the sample correlation matrix"
code = '''
using Plots
ss = sqrt.(diag(S))
p1 = heatmap(S ./ (ss * transpose(ss)), clims=(-1, 1), c=:RdBu, yflip=true, title="sample")
p2 = heatmap(rho, clims=(-1, 1), c=:RdBu, yflip=true, title="shrunk")
plot(p1, p2, layout=(1, 2), size=(900, 400))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "conditioning"
label = "Conditioning"
desc = "Condition numbers and smallest eigenvalues of the sample and shrunk covariance, and whether each is positive definite"
code = '''
(observations_per_variable = size(X, 1) / size(X, 2), cond_sample = cond(S), cond_shrunk = cond(Sigma), min_eig_sample = minimum(eigvals(Symmetric(S))), min_eig_shrunk = minimum(eigvals(Symmetric(Sigma))), sample_posdef = isposdef(Symmetric(S)), shrunk_posdef = isposdef(Symmetric(Sigma)))
'''

[[actionGroups.actions]]
id = "intensity"
label = "Shrinkage Intensity"
desc = "Linear shrinkage: the weight lambda on the target in (1 - lambda) S + lambda F. Nonlinear: each sample eigenvalue next to its shrunk value"
code = '''
{{?model=lw}} F = cov(LinearShrinkage({{target}}, 1.0), X)  # the target itself
{{?model=oas}} F = cov(LinearShrinkage(DiagonalCommonVariance(), 1.0), X)  # the target itself
{{?model=lw|oas}} (shrinkage_intensity = dot(vec(Sigma - S), vec(F - S)) / sum(abs2, F - S),)
{{?model=nls}} [(sample = a, shrunk = b) for (a, b) in zip(eigvals(Symmetric(S)), eigvals(Symmetric(Sigma)))]
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "min-variance"
label = "Minimum-Variance Portfolio"
desc = "Fully invested minimum-variance weights from the shrunk covariance, its predicted volatility and largest positions"
code = '''
w = Omega * ones(size(Sigma, 1))
w ./= sum(w)
top = sortperm(abs.(w), rev=true)[1:min(5, end)]
(predicted_vol = sqrt(dot(w, Sigma * w)), largest_positions = [(asset = i, weight = round(w[i], digits=3)) for i in top], gross_exposure = sum(abs, w))
'''

[[actionGroups.actions]]
id = "out-of-sample"
label = "Out-of-Sample Risk"
desc = "Over 50 random half-splits: estimate on one half, then measure the realized volatility of each minimum-variance portfolio on the other half (mean and spread across splits)"
code = '''
using Statistics, Random
minvar(C) = (w = pinv(C) * ones(size(C, 1)); w ./ sum(w))  # pinv: when the half has fewer rows than assets the sample covariance is singular, and pinv gives the minimum-norm weights
T, N = size(X); h = div(T, 2)
h <= N && println("Each half has ", h, " rows for ", N, " assets: the sample covariance is singular there, the shrunk ones are not.")
Random.seed!(1)
vols = map(1:50) do _
    idx = randperm(T); a, b = idx[1:h], idx[h+1:end]  # random split: assumes exchangeable rows, as in the simulated data (for a time series, prefer a rolling window)
    [std(X[b, :] * minvar(cov(est, X[a, :]))), std(X[b, :] * minvar(cov(SimpleCovariance(), X[a, :]))), std(X[b, :] * fill(1 / N, N))]
end
V = permutedims(reduce(hcat, vols))  # splits x (shrunk, sample, equal weight)
[(portfolio = k, mean_volatility = round(mean(V[:, j]), sigdigits=4), sd_across_splits = round(std(V[:, j]), sigdigits=2)) for (j, k) in enumerate(["shrunk", "sample", "equal weight"])]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "estimators"
label = "All Estimators"
desc = "Condition number of every estimator, with the Frobenius error from the true covariance when the data are simulated"
code = '''
ests = ["sample" => SimpleCovariance(), "LW unit variance" => LinearShrinkage(DiagonalUnitVariance(), :lw), "LW common variance" => LinearShrinkage(DiagonalCommonVariance(), :lw), "LW constant correlation" => LinearShrinkage(ConstantCorrelation(), :lw), "OAS" => LinearShrinkage(DiagonalCommonVariance(), :oas), "nonlinear" => AnalyticalNonlinearShrinkage()]
{{?X=simulated}} [(estimator = k, condition = round(cond(cov(e, X)), sigdigits=3), error = round(norm(cov(e, X) - SigmaTrue), sigdigits=3)) for (k, e) in ests]
{{?X!=simulated}} [(estimator = k, condition = round(cond(cov(e, X)), sigdigits=3)) for (k, e) in ests]
'''

[[actionGroups.actions]]
id = "vs-sample"
label = "Change From the Sample"
desc = "How much shrinkage moved the correlations and variances away from their sample values"
code = '''
using Statistics
ss = sqrt.(diag(S))
dr = rho - S ./ (ss * transpose(ss))
off = [dr[i, j] for i in axes(dr, 1) for j in axes(dr, 2) if i < j]
(mean_abs_correlation_change = mean(abs, off), max_abs_correlation_change = maximum(abs, off), mean_variance_ratio = mean(diag(Sigma) ./ diag(S)))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary"
label = "What Shrinkage Did"
desc = "The eigenvalue spread before and after, the fall in the condition number and the average correlation"
code = '''
using Statistics
es, eh = eigvals(Symmetric(S)), eigvals(Symmetric(Sigma))
off = [rho[i, j] for i in axes(rho, 1) for j in axes(rho, 2) if i < j]
(eigen_range_sample = extrema(es), eigen_range_shrunk = extrema(eh), condition_falls_by = cond(S) / cond(Sigma), average_correlation = mean(off))
'''

[[actionGroups.actions]]
id = "partial"
label = "Strongest Partial Correlations"
desc = "Partial correlations from the precision matrix: the link between two variables after removing all the others"
code = '''
d = sqrt.(diag(Omega))
P = -Omega ./ (d * transpose(d))
ranked = [(pair = (i, j), partial_correlation = round(P[i, j], digits=3)) for i in axes(P, 1) for j in axes(P, 2) if i < j]
sort(ranked, by=x -> -abs(x.partial_correlation))[1:min(10, end)]
'''
