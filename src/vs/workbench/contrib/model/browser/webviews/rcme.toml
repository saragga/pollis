# Robust Covariance Matrix Estimation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/rcme.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Robust Covariance Matrix Estimation"
viewType = "pollis.rcme"
defaultModel = "lw"

[[packages]]
name = "CovarianceEstimation.jl"
github = "https://github.com/mateuszbaran/CovarianceEstimation.jl"

[requires]
packages = ["CovarianceEstimation.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Linear Shrinkage Basics"
file = "rcme/tutorial-01-linear.ipynb"
bundled = true
description = "Ledoit-Wolf and OAS linear shrinkage with different structured targets"

[[notebookSections.notebooks]]
name = "Shrinkage Target Selection"
file = "rcme/tutorial-02-targets.ipynb"
bundled = true
description = "Comparing DiagonalUnitVariance, ConstantCorrelation and other targets"

[[notebookSections.notebooks]]
name = "Nonlinear Shrinkage"
file = "rcme/tutorial-03-nonlinear.ipynb"
bundled = true
description = "Eigenvalue-wise optimal estimation with AnalyticalNonlinearShrinkage"

[[notebookSections.notebooks]]
name = "Portfolio Applications"
file = "rcme/tutorial-04-portfolio.ipynb"
bundled = true
description = "Minimum variance and maximum Sharpe portfolios using shrinkage covariance"

[[wikis]]
name = "Overview"
file = "rcme/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "rcme/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "rcme/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "rcme/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "rcme/interpretation.md"
bundled = true

[[wikis]]
