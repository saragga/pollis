[[actionGroups.actions]]
id = "pure-nash"
label = "Pure Nash Equilibria"
desc = "All pure-strategy Nash equilibria by exhaustive search, with payoffs and whether each is strict (every deviation strictly loses)"
code = '''
strict(i, j) = all(A1[r, j] < A1[i, j] for r in 1:m if r != i) && all(A2[i, c] < A2[i, j] for c in 1:k if c != j)
[(row = i, column = j, payoffs = (A1[i, j], A2[i, j]), strict = strict(i, j)) for (i, j) in pure_nash(g)]
'''

[[actionGroups.actions]]
id = "nash-check"
label = "Nash Verification"
desc = "For each equilibrium found: the largest gain either player could get by deviating (zero at a Nash equilibrium) and GameTheory's is_nash check"
code = '''
[(equilibrium = e, row_gain = maximum(A1 * y) - dot(x, A1 * y), column_gain = maximum(transpose(A2) * x) - dot(x, A2 * y), is_nash = is_nash(g, (x, y)))
 for (e, (x, y)) in enumerate(eqs)]
'''

[[actionGroups.actions]]
id = "stationarity"
label = "Dominance Check"
desc = "Iterated elimination of actions strictly dominated by a pure or mixed action: no equilibrium ever uses an eliminated action"
code = '''
function iterated_dominance()
    rows, cols = collect(1:m), collect(1:k)
    while true
        dr = dominated_actions(Player(A1[rows, cols]))
        dc = dominated_actions(Player(Matrix(transpose(A2[rows, cols]))))
        isempty(dr) && isempty(dc) && return (surviving_rows = rows, surviving_columns = cols)
        rows, cols = rows[setdiff(1:length(rows), dr)], cols[setdiff(1:length(cols), dc)]
    end
end
iterated_dominance()
'''

