[[codeBranches]]
model = "normal"
code = '''
using GameTheory, LinearAlgebra, Random
A1 = Float64.({{A}})  # row player's payoffs
A2 = Float64.({{B}})  # column player's payoffs, same (row, column) indexing
m, k = size(A1)
g = NormalFormGame((Player(A1), Player(Matrix(transpose(A2)))))  # GameTheory stores each player's payoffs with own actions in rows

eqs = support_enumeration(g)  # all Nash equilibria (x, y) of a nondegenerate game
payoffs(x, y) = (dot(x, A1 * y), dot(x, A2 * y))

function replicator(x, y; T=100.0, dt=0.01)  # two-population replicator dynamics; with y = x in a symmetric game, the single-population one
    xs, ys = [x], [y]
    for _ in 1:round(Int, T / dt)
        fx, fy = A1 * y, transpose(A2) * x
        x = max.(x .+ dt .* x .* (fx .- dot(x, fx)), 0.0); x = x ./ sum(x)
        y = max.(y .+ dt .* y .* (fy .- dot(y, fy)), 0.0); y = y ./ sum(y)
        push!(xs, x); push!(ys, y)
    end
    (x = reduce(hcat, xs), y = reduce(hcat, ys))
end

[(row = round.(x, digits=4), column = round.(y, digits=4), payoffs = round.(payoffs(x, y), digits=4)) for (x, y) in eqs]
'''

