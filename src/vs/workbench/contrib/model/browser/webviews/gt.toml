[[actionGroups.actions]]
id = "expected-payoffs"
label = "Equilibrium Welfare"
desc = "Payoffs and total welfare at each equilibrium against the best total payoff of any action pair, and whether the equilibrium is Pareto-dominated by another"
code = '''
best = maximum(A1 .+ A2)
pay = [payoffs(x, y) for (x, y) in eqs]
dominated(p) = any(q[1] >= p[1] && q[2] >= p[2] && q != p for q in pay)
{{?model=potential}}println("Potential maximiser: ", Tuple(argmax(P)), " with P = ", maximum(P))
[(equilibrium = e, payoffs = round.(p, digits=4), welfare = round(sum(p), digits=4), best_welfare = best, pareto_dominated = dominated(p)) for (e, p) in enumerate(pay)]
'''

[[actionGroups.actions]]
id = "ess-check"
label = "ESS Check"
desc = "Evolutionary stability: a symmetric equilibrium x is an ESS if every mutant y earns less against x, or equally against x but less against itself. Checked with the equivalent local condition u(x, y) > u(y, y) for mutant mixes y = (1 - eps) x + eps z, z a pure strategy or one of 5000 random states; in asymmetric games only strict equilibria are evolutionarily stable"
code = '''
rng = MersenneTwister(1)
u(a, b) = dot(a, A1 * b)
function is_ess(x; eps=1e-3)  # x is an ESS iff u(x, y) > u(y, y) for every nearby y != x
    zs = [[[i == j ? 1.0 : 0.0 for j in 1:m] for i in 1:m]; [(w = -log.(rand(rng, m)); w ./ sum(w)) for _ in 1:5000]]
    for z in zs
        y = (1 - eps) .* x .+ eps .* z
        norm(y - x) > 1e-12 && u(x, y) - u(y, y) <= 1e-12 && return false
    end
    true
end
symmetric_game = A2 == transpose(A1)
[(equilibrium = round.(x, digits=4), symmetric = isapprox(x, y, atol=1e-8),
  ess = symmetric_game && isapprox(x, y, atol=1e-8) ? is_ess(x) : false,
  strict = count(>(1e-8), x) == 1 && count(>(1e-8), y) == 1 && count(==(maximum(A1 * y)), A1 * y) == 1 && count(==(maximum(transpose(A2) * x)), transpose(A2) * x) == 1)
 for (x, y) in eqs]
'''
