[[bullets]]
text = "Normal Form"
detail = "2-player strategic game; find all pure and mixed Nash equilibria via support enumeration, LRS vertex enumeration, or homotopy continuation (GameTheory.jl)"

[[bullets]]
text = "Zero Sum"
detail = "minimax/maximin solution via linear programming; von Neumann minimax theorem gives game value and optimal strategies (GameTheory.jl)"

[[bullets]]
text = "Evolutionary"
detail = "replicator dynamics for symmetric population games; trajectories through the strategy simplex visualised via BaryPlots.jl"

[[bullets]]
text = "Potential"
detail = "Nash equilibria via best-response iteration; equilibrium coincides with the maximiser of the shared potential function (GameTheory.jl)"

[[decisionRows]]
task = "Normal Form"
context = "Two players with finitely many actions and arbitrary payoffs: coordination, entry, pricing, bargaining and conflict games"
purpose = "All Nash equilibria, pure and mixed, by support enumeration (GameTheory.jl). Default: Battle of the Sexes, with two pure equilibria and one mixed"

[[decisionRows]]
task = "Zero Sum"
context = "Strictly competitive games where one player's gain is the other's loss: inspection, matching pennies, adversarial and security games"
purpose = "The value of the game and the optimal (maximin/minimax) mixed strategies; every Nash equilibrium gives the same value and security strategies coincide with equilibrium strategies"

[[decisionRows]]
task = "Evolutionary"
context = "A large population repeatedly matched in a symmetric game, with strategies spreading in proportion to their payoff: biology, cultural evolution, learning"
purpose = "Replicator dynamics on the strategy simplex (BaryPlots.jl), its rest points and which of them are evolutionarily stable. Default: rock-paper-scissors with win 2, loss 1, whose interior equilibrium is an ESS"

[[decisionRows]]
task = "Potential"
context = "Games where every unilateral change in payoff is mirrored by one potential function P: congestion, network formation and identical-interest games"
purpose = "Pure equilibria always exist and are the local maxima of P; best-response and replicator dynamics settle at them. Default: identical interests with payoffs P, three pure equilibria"

[[inputs]]
id = "A"
label = "Row Payoffs A"
tooltip = "Row player's payoff A[i, j] when the row player plays i and the column player plays j."
default = "[3.0 0.0; 0.0 2.0]"
models = ["normal"]

[[inputs]]
id = "B"
label = "Column Payoffs B"
tooltip = "Column player's payoff B[i, j] at the same action pair (row i, column j), same shape as A."
default = "[2.0 0.0; 0.0 3.0]"
models = ["normal"]

[[inputs]]
id = "Z"
label = "Payoff Matrix A"
tooltip = "Row player's payoff A[i, j]; the column player receives -A[i, j]."
default = "[3.0 -1.0 -2.0; -2.0 4.0 -1.0; -1.0 -2.0 5.0]"
models = ["zerosum"]

[[inputs]]
id = "E"
label = "Payoff Matrix A"
tooltip = "Symmetric game: payoff A[i, j] to strategy i when it meets strategy j (square)."
default = "[0.0 -1.0 2.0; 2.0 0.0 -1.0; -1.0 2.0 0.0]"
models = ["evo"]

[[inputs]]
id = "x0"
label = "Initial State x0"
tooltip = "Initial population shares of each strategy (non-negative, summing to 1)."
default = "[0.6, 0.3, 0.1]"
models = ["evo"]

[[inputs]]
id = "P"
