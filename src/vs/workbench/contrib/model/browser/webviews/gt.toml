 for (e, (x, y)) in enumerate(eqs)]
'''

[[actionGroups.actions]]
id = "minimax"
label = "Minimax Solution"
desc = "Each player's security (maximin) strategy and level by linear programming: in a zero-sum game both equal the value of the game"
code = '''
using JuMP, HiGHS
function security(M)  # max v s.t. transpose(M) * x >= v on the simplex: guaranteed payoff whatever the opponent does
    md = Model(HiGHS.Optimizer); set_silent(md)
    @variable(md, x[1:size(M, 1)] >= 0); @variable(md, v)
    @constraint(md, sum(x) == 1); @constraint(md, transpose(M) * x .>= v)
    @objective(md, Max, v); optimize!(md)
    (strategy = round.(value.(x), digits=4), level = round(value(v), digits=4))
end
(row = security(A1), column = security(Matrix(transpose(A2))), equilibrium_payoffs = [round.(payoffs(x, y), digits=4) for (x, y) in eqs])
'''

[[actionGroups.actions]]
id = "stationary-states"
label = "Long-Run Outcomes"
desc = "Replicator dynamics from 200 random starting states: where play ends up and how often (the basins of attraction). In a zero-sum game the dynamics cycle, so the time-averaged state is reported: it approaches the equilibrium"
code = '''
rng = MersenneTwister(1)
rsimplex(d) = (w = -log.(rand(rng, d)); w ./ sum(w))
function long_run(runs)
    ends = Dict{Any, Int}()
    for _ in 1:runs
{{?model=evo}}        s = rsimplex(m); r = replicator(s, s; T=200.0)
{{?model!=evo}}        r = replicator(rsimplex(m), rsimplex(k); T=200.0)
{{?model=zerosum}}        e = (vec(sum(r.x, dims=2)) ./ size(r.x, 2), vec(sum(r.y, dims=2)) ./ size(r.y, 2))  # time average
{{?model!=zerosum}}        e = (round.(r.x[:, end], digits=2), round.(r.y[:, end], digits=2))
        ends[e] = get(ends, e, 0) + 1
    end
    ends
end
ends = long_run(200)
{{?model!=zerosum}}[(row = e[1], column = e[2], share = c / 200) for (e, c) in sort(collect(ends), by=last, rev=true)]
{{?model=zerosum}}avg = collect(keys(ends)); (x_eq, y_eq) = eqs[1]
{{?model=zerosum}}(equilibrium = (round.(x_eq, digits=4), round.(y_eq, digits=4)), mean_time_average = (round.(sum(first.(avg)) ./ length(avg), digits=4), round.(sum(last.(avg)) ./ length(avg), digits=4)),
{{?model=zerosum}} largest_distance = round(maximum(norm(a[1] - x_eq) + norm(a[2] - y_eq) for a in avg), digits=4))
