[[actionGroups.actions]]
id = "best-response"
label = "Best Response Plot"
desc = "For a 2 x 2 game, both best-response correspondences in the (q, p) square, crossing at the equilibria; otherwise the row player's expected payoff from each action as the column player moves between its first two actions"
code = '''
using Plots
qs = range(0, 1, length=1001)
if m == 2 && k == 2
    br(d) = d > 1e-12 ? 1.0 : d < -1e-12 ? 0.0 : 0.5
    pbr = [br(dot(A1[1, :] .- A1[2, :], [q, 1 - q])) for q in qs]  # row: probability of action 1
    qbr = [br(dot([p, 1 - p], A2[:, 1] .- A2[:, 2])) for p in qs]  # column: probability of action 1
    plot(qs, pbr, lw=2, label="Row best response", xlabel="q = P(column plays 1)", ylabel="p = P(row plays 1)", aspect_ratio=:equal, title="Best responses")
    plot!(qbr, qs, lw=2, label="Column best response")
    scatter!([y[1] for (x, y) in eqs], [x[1] for (x, y) in eqs], ms=7, c=:black, label="Nash equilibria")
else
    U = reduce(hcat, [A1 * [q; 1 - q; zeros(k - 2)] for q in qs])
    plot(qs, transpose(U), lw=2, label=permutedims(["row action " * string(i) for i in 1:m]), xlabel="q = weight on column action 1 (rest on 2)", ylabel="Expected payoff", title="Row player's payoffs; upper envelope = best response")
end
'''

