code = '''
supp(v) = findall(v .> 1e-8)
[(equilibrium = e, row_support = supp(x), column_support = supp(y),
  row_payoffs_in_support = round.((A1 * y)[supp(x)], digits=4), column_payoffs_in_support = round.((transpose(A2) * x)[supp(y)], digits=4))
 for (e, (x, y)) in enumerate(eqs)]
