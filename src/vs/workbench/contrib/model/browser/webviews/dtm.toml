[[inputs]]
id = "corpus"
label = "Corpus variable"
tooltip = "A Julia vector of strings, one per document (e.g. a Vector{String} or a TextAnalysis.jl Corpus). The default, docs, is the text of The Pollis Guide from PollisDatasets, one document per section."
default = "docs"

[[inputs]]
id = "lexicon"
label = "Lexicon variable"
tooltip = "Optional pre-built lexicon (Dict{String,Int}). Leave blank to build one automatically from the corpus."
default = "lexicon"

[[codeBranches]]
model = "dtm"
code = '''
using TextAnalysis
{{?corpus=docs}} using PollisDatasets

{{?corpus=docs}} guide = dataset("pollis_guide");  # The Pollis Guide, one row per section; datasetinfo("pollis_guide") describes it
{{?corpus=docs}} docs = guide.text;  # 130 sections on 19 topics. Replace it with your own vector of strings.

crps    = Corpus(map(StringDocument, {{corpus}}))  # wrap strings as StringDocuments
prepare!(crps, strip_punctuation | strip_case | strip_stopwords)  # remove punctuation, lowercase, drop common words
update_lexicon!(crps)  # build vocabulary from corpus
m       = DocumentTermMatrix(crps)  # sparse DTM (D x V)

dtm(m)  # dense integer matrix
dtm(m, :sparse)  # sparse representation
'''

[[codeBranches]]
model = "tfidf"
code = '''
using TextAnalysis
{{?corpus=docs}} using PollisDatasets

{{?corpus=docs}} guide = dataset("pollis_guide");  # The Pollis Guide, one row per section; datasetinfo("pollis_guide") describes it
{{?corpus=docs}} docs = guide.text;  # 130 sections on 19 topics. Replace it with your own vector of strings.

crps    = Corpus(map(StringDocument, {{corpus}}))  # wrap strings as StringDocuments
prepare!(crps, strip_punctuation | strip_case | strip_stopwords)  # remove punctuation, lowercase, drop common words
update_lexicon!(crps)  # build vocabulary from corpus
m       = DocumentTermMatrix(crps)  # sparse DTM

weights = tf_idf(m)  # TF-IDF weighted matrix (D x V)
'''

