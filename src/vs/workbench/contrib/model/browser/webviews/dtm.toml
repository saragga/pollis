[[actionGroups.actions]]
id = "top-terms-per-doc"
label = "Top Terms Per Document"
desc = "Highest TF-IDF terms for the first 5 documents"
code = '''
using TextAnalysis

crps    = Corpus(map(StringDocument, {{corpus}}))  # build corpus
prepare!(crps, strip_punctuation | strip_case | strip_stopwords)  # remove punctuation, lowercase, drop common words
update_lexicon!(crps)  # build vocabulary
m       = DocumentTermMatrix(crps)  # DTM
weights = Matrix(tf_idf(m))  # TF-IDF matrix
terms   = m.terms  # the DTM's own column order (the keys of lexicon(crps) come in Dict order, which does not match the columns)

for d in 1:min(5, size(weights, 1))
    idx = sortperm(weights[d, :], rev=true)[1:5]
    println("Doc ", d, ": ", terms[idx])
end
'''

[[actionGroups.actions]]
id = "idf-weights"
label = "IDF Weights"
desc = "Inverse document frequency for each vocabulary term"
code = '''
using TextAnalysis

crps  = Corpus(map(StringDocument, {{corpus}}))  # build corpus
prepare!(crps, strip_punctuation | strip_case | strip_stopwords)  # remove punctuation, lowercase, drop common words
update_lexicon!(crps)  # build vocabulary
m     = DocumentTermMatrix(crps)  # DTM

D     = size(dtm(m), 1)  # number of documents
df    = vec(sum(dtm(m) .> 0, dims=1))  # document frequency per term
idf   = log.(D ./ df)  # IDF vector
terms = m.terms  # the DTM's own column order, so each IDF is paired with its term

sorted = sort(collect(zip(terms, idf)), by=x->x[2], rev=true)  # terms with highest IDF first
println(sorted[1:10])  # top 10 discriminative terms
'''

# ── FAQ: shown in Learn More, and the Panel FAQ test set of Evaluate Answering Models (hidden = true: the test set only) ──

[[faq]]
question = "Which tab should I use: DTM, TF-IDF or BM25?"
wiki = "Decision Guide"
answer = """
DTM, the raw counts, to inspect the vocabulary or to feed a topic model such as LDA, which expects counts. TF-IDF with cosine similarity to compare documents with each other, or as features for a classifier. BM25 to rank documents for a short query: it is built for query against document, and is not symmetric. When the task is a mix of these, start with TF-IDF and use the others as checks.
"""

[[faq]]
question = "What is the difference between TF-IDF and BM25?"
wiki = "BM25"
answer = """
Both weight a term by how often it occurs in a document and how rare it is in the corpus. In BM25 repeated terms saturate, levelling off at k1 + 1, so the first mention says most of what a document has to say about a term, and document length enters explicitly, set by b. In TF-IDF a term's count rises linearly, and length is handled by normalising the vectors. TF-IDF vs BM25 ranks the corpus both ways for one query.
"""

[[faq]]
question = "Why does my query score zero for every document?"
wiki = "Diagnostics"
answer = """
None of its terms is in the vocabulary, and the sort order is then arbitrary. A query must be cleaned like the corpus: stop words have no column, and a capitalised word misses because `dtv` gets the raw string while the corpus was lowered. Clean the query with `prepare!` on the query document, and run Query Vector to see how many of its terms have non-zero counts.
"""

