detail = "Julia standard library used for the truncated SVD decomposition"

[[inputs]]
id = "corpus"
label = "Corpus"
tooltip = "Array of text documents, e.g. docs = [\"first doc\", \"second doc\"]. The default, corpus, is the text of The Pollis Guide from PollisDatasets, one document per section. Its example also defines query_idx and new_text for the Query Documents and Fold-In actions."
default = "corpus"

[[inputs]]
id = "k"
label = "Dimensions (k)"
tooltip = "Number of latent dimensions to retain from the SVD, at most the number of documents or terms; Deerwester, Dumais, Furnas, Landauer and Harshman (1990) used 50-100 in various problems and 100 for the MED collection"
default = "50"

[[codeBranches]]
model = "main"
code = '''
using TextAnalysis, LinearAlgebra
{{?corpus=corpus}} using PollisDatasets

{{?corpus=corpus}} corpus = dataset("pollis_guide").text;  # The Pollis Guide, one document per section; datasetinfo("pollis_guide") describes it. Replace it with your own vector of strings.
{{?corpus=corpus}} query_idx = 2;  # the section the Query Documents action finds neighbours of (Install Pollis)
{{?corpus=corpus}} new_text = "How do I install Julia and the packages a panel needs?";  # a new document for the Fold-In action

crps    = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus from document array
prepare!(crps, strip_punctuation | strip_case)  # normalise text
update_lexicon!(crps)  # build vocabulary

dtm     = DocumentTermMatrix(crps)  # document-term matrix
M       = Matrix(tf_idf(dtm))  # TF-IDF matrix (docs x terms)
U, S, V = svd(M)  # full SVD decomposition
k       = min({{k}}, length(S))  # at most the number of singular values, min(documents, terms)
U_k     = U[:, 1:k]  # document vectors in latent space
S_k     = S[1:k]  # singular values (variance explained)
V_k     = V[:, 1:k]  # term vectors in latent space
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "doc-similarity"
label = "Document Similarity"
desc = "Cosine similarity between document vectors in latent space"
code = '''
using TextAnalysis, LinearAlgebra

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
F   = svd(Matrix(tf_idf(DocumentTermMatrix(crps))))  # SVD
k = min({{k}}, length(F.S))  # at most the number of singular values, min(documents, terms)
D_k = F.U[:, 1:k] .* transpose(F.S[1:k])  # doc vectors U_k S_k (unscaled U_k would weight every dimension equally)

norms   = norm.(eachrow(D_k))  # L2 norm per document
D_norm  = D_k ./ norms  # normalised document matrix
sim_mat = D_norm * transpose(D_norm)  # cosine similarity matrix
'''

[[actionGroups.actions]]
id = "term-space"
label = "Term Space"
desc = "Every term on the first two latent dimensions, as a row of V_k S_k, the coordinates Deerwester, Dumais, Furnas, Landauer and Harshman (1990) use to compare terms; the 20 terms farthest from the origin are labelled"
code = '''
using TextAnalysis, LinearAlgebra, Plots

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
dtm  = DocumentTermMatrix(crps)  # document-term matrix

F    = svd(Matrix(tf_idf(dtm)))  # SVD decomposition
T2   = F.V[:, 1:2] .* transpose(F.S[1:2])  # term coordinates: rows of V_k S_k on the first two dimensions
top  = sortperm(norm.(eachrow(T2)), rev=true)[1:min(20, end)]  # the 20 terms farthest from the origin
scatter(T2[:, 1], T2[:, 2], ms=2, c=:lightgray, label="terms", xlabel="Dim 1", ylabel="Dim 2")
scatter!(T2[top, 1], T2[top, 2], ms=4, label="farthest 20", series_annotations=Plots.text.(dtm.terms[top], 7, :left))  # Plots.text: TextAnalysis also exports text
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "variance-explained"
label = "Variance Explained"
desc = "Cumulative variance captured by the top-k singular values"
code = '''
using TextAnalysis, LinearAlgebra, Plots

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
S    = svd(Matrix(tf_idf(DocumentTermMatrix(crps)))).S  # singular values
k    = min({{k}}, length(S))  # at most the number of singular values, min(documents, terms)
var_exp = cumsum(S .^ 2) ./ sum(S .^ 2)  # cumulative variance explained
plot(1:k, var_exp[1:k], xlabel="k", ylabel="Cumulative variance")  # scree-style plot
'''

[[actionGroups.actions]]
id = "reconstruction-error"
label = "Reconstruction Error"
desc = "Frobenius norm of the rank-k approximation residual"
code = '''
using TextAnalysis, LinearAlgebra

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
M    = Matrix(tf_idf(DocumentTermMatrix(crps)))  # TF-IDF matrix

F    = svd(M)  # full SVD
k = min({{k}}, length(F.S))  # at most the number of singular values, min(documents, terms)
M_k  = F.U[:, 1:k] * Diagonal(F.S[1:k]) * F.Vt[1:k, :]  # rank-k approximation
println("Frobenius error: ", norm(M - M_k))  # reconstruction error
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "query-docs"
label = "Query Documents"
desc = "Documents ranked by the cosine of their vectors U_k S_k with that of document query_idx"
code = '''
using TextAnalysis, LinearAlgebra

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
F    = svd(Matrix(tf_idf(DocumentTermMatrix(crps))))  # SVD
k = min({{k}}, length(F.S))  # at most the number of singular values, min(documents, terms)
D_k   = F.U[:, 1:k] .* transpose(F.S[1:k])  # doc vectors U_k S_k
q_vec = D_k[query_idx, :]  # query document vector in latent space
sims  = D_k * q_vec ./ (norm.(eachrow(D_k)) .* norm(q_vec))  # cosine similarities
sortperm(sims, rev=true)  # ranked document indices
'''

[[actionGroups.actions]]
id = "fold-in"
label = "Fold-In New Doc"
desc = "Project a new document into the existing latent space"
code = '''
using TextAnalysis, LinearAlgebra

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
dtm  = DocumentTermMatrix(crps)
W    = Matrix(tf_idf(dtm))  # the matrix that was decomposed
F    = svd(W)  # the latent space to fold into
k = min({{k}}, length(F.S))  # at most the number of singular values, min(documents, terms)
T    = Matrix(tf(dtm))  # term frequencies: the share of each document contributed by each term
idf  = [(d = findfirst(>(0), T[:, j]); W[d, j] / T[d, j]) for j in axes(T, 2)]  # the weight tf_idf gives each term, read off the matrix as tf_idf / tf

d_new = StringDocument(new_text)  # new document to fold in
prepare!(d_new, strip_punctuation | strip_case)  # same cleaning as the corpus
col   = Dict(t => j for (j, t) in enumerate(dtm.terms))
v_new = zeros(length(dtm.terms))
for t in tokens(d_new)
    j = get(col, t, 0); j > 0 && (v_new[j] += 1)  # count terms in the existing vocabulary; unseen terms are dropped
end
v_new = v_new ./ max(sum(v_new), 1) .* idf  # term frequencies of the new document times the corpus weights
u_new = (transpose(F.V[:, 1:k]) * v_new) ./ F.S[1:k]  # fold-in: u = S_k^-1 transpose(V_k) v, comparable with rows of U_k
println("Latent vector: ", u_new)  # latent representation of new document
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-k"
label = "Compare k Values"
desc = "Reconstruction error vs. number of dimensions"
code = '''
using TextAnalysis, LinearAlgebra, Plots

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
M    = Matrix(tf_idf(DocumentTermMatrix(crps))); F = svd(M)  # TF-IDF and SVD

ks     = filter(<=(length(F.S)), [10, 25, 50, 100, 200])  # candidate dimension counts, at most the rank
errors = [norm(M - F.U[:,1:k] * Diagonal(F.S[1:k]) * F.Vt[1:k,:]) for k in ks]  # Frobenius error per k
plot(ks, errors, xlabel="k", ylabel="Reconstruction error")  # elbow plot for k selection
'''

[[actionGroups.actions]]
id = "compare-tfidf"
label = "Raw vs TF-IDF"
desc = "Share of the squared Frobenius norm that the first k dimensions capture, for the raw counts and for the TF-IDF matrix, each against its own total"
code = '''
using TextAnalysis, LinearAlgebra

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
dtm   = DocumentTermMatrix(crps)  # document-term matrix

F_raw   = svd(Matrix(dtm.dtm))  # SVD on raw term counts
F_tfidf = svd(Matrix(tf_idf(dtm)))  # SVD on TF-IDF weighted matrix
share(F, k) = sum(F.S[1:min(k, end)] .^ 2) / sum(F.S .^ 2)  # first k squared singular values over all of them: free of the scale of the matrix
println("Share captured (raw):    ", round(share(F_raw, {{k}}), digits=3))
println("Share captured (tf-idf): ", round(share(F_tfidf, {{k}}), digits=3))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "top-terms"
label = "Top Terms per Topic"
desc = "Highest-loading terms for each latent dimension"
code = '''
using TextAnalysis, LinearAlgebra

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
dtm  = DocumentTermMatrix(crps)  # document-term matrix

F     = svd(Matrix(tf_idf(dtm)))  # SVD decomposition
terms = dtm.terms  # vocabulary aligned to columns of V
for dim in 1:min({{k}}, length(F.S), 5)  # inspect top 5 dimensions
    idx = sortperm(abs.(F.V[:, dim]), rev=true)[1:10]  # top 10 term indices
    println("Dim $dim: ", terms[idx])
end
'''

[[actionGroups.actions]]
id = "doc-topics"
label = "Document-Topic Mix"
desc = "Weights U_k S_k of the first 10 documents on the first 5 latent dimensions"
code = '''
using TextAnalysis, LinearAlgebra

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case); update_lexicon!(crps)
F    = svd(Matrix(tf_idf(DocumentTermMatrix(crps))))  # SVD decomposition

k    = min({{k}}, length(F.S))  # at most the number of singular values, min(documents, terms)
doc_weights = F.U[:, 1:k] .* transpose(F.S[1:k])  # scale by singular values: n_docs x k
println("Document-topic matrix: ", size(doc_weights, 1), " documents x ", k, " dimensions")
round.(doc_weights[1:min(10, end), 1:min(5, k)], digits=3)  # first 10 documents on the first 5 dimensions
'''
