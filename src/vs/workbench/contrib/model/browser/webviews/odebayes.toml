title = "Bayesian Inference for ODEs"
viewType = "pollis.odebayes"
defaultModel = "nuts"
decisionFirstColumn = "Sampler"

[[packages]]
name = "PEtab.jl"
github = "https://github.com/sebapersson/PEtab.jl"

[[packages]]
name = "AdvancedHMC.jl"
github = "https://github.com/TuringLang/AdvancedHMC.jl"

[[packages]]
name = "MCMCChains.jl"
github = "https://github.com/TuringLang/MCMCChains.jl"

[[packages]]
name = "Catalyst.jl"
github = "https://github.com/SciML/Catalyst.jl"

[[packages]]
name = "OrdinaryDiffEqRosenbrock.jl"
github = "https://github.com/SciML/OrdinaryDiffEq.jl/tree/master/lib/OrdinaryDiffEqRosenbrock"

[[packages]]
name = "StatsPlots.jl"
github = "https://github.com/JuliaPlots/StatsPlots.jl"

[requires]
packages = ["PEtab.jl", "AdvancedHMC.jl", "MCMCChains.jl", "Catalyst.jl", "OrdinaryDiffEqRosenbrock.jl", "Distributions.jl", "Bijectors.jl", "LogDensityProblems.jl", "LogDensityProblemsAD.jl", "SciMLSensitivity.jl", "StatsPlots.jl", "Plots.jl"]

