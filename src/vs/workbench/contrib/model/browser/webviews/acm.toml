[[actionGroups.actions]]
id = "sac-vs-td3"
label = "LQR Benchmark"
desc = "Learned policy against the optimal linear-quadratic regulator (discounted Riccati solution, force clipped to [-1, 1]) from four starting positions"
code = '''
using LinearAlgebra

Am, Bm = [1 dt; 0 1], [dt^2; dt]  # x' = Am x + Bm a
Qm, Rm = Diagonal([1, 0.1]), 0.01
function lqr_gain()  # discounted Riccati iteration
    P = Matrix{Float64}(Qm)
    for k in 1:2000
        K = gamma * (transpose(Bm) * P * Am) / (Rm + gamma * dot(Bm, P * Bm))
        P = Qm + gamma * transpose(Am) * P * Am - gamma * transpose(Am) * P * Bm * K
    end
    vec(gamma * (transpose(Bm) * P * Am) / (Rm + gamma * dot(Bm, P * Bm)))
end
K = lqr_gain()
lqr(s) = -dot(K, s)
[(start = x0, learned = round(episode(res.policy; x0).G, digits=2), lqr = round(episode(lqr; x0).G, digits=2)) for x0 in starts]
'''

