[[codeBranches]]
model = "a2c"
code = '''
using Flux, Random, Statistics

steps = {{steps}}  # environment steps
horizon = {{horizon}}  # steps per episode
gamma = Float32({{gamma}})  # discount factor
hidden = {{hidden}}  # hidden units per layer
seed = {{seed}}  # random seed

# Point-mass regulator: push a unit mass from a random position to the origin with a bounded force
dt = 0.1f0
reset_state(rng) = Float32[4rand(rng) - 2, 0]  # position, velocity
function env_step(s, a)  # a is clamped to [-1, 1]; returns (next state, reward)
    a = clamp(a, -1, 1)
    v = s[2] + a * dt
    Float32[s[1] + v * dt, v], -(s[1]^2 + 0.1f0 * s[2]^2 + 0.01f0 * a^2)
end
function soft_update!(target, model, tau)  # Polyak averaging of target-network weights
    for (pt, p) in zip(Flux.trainables(target), Flux.trainables(model))
        pt .= (1 - tau) .* pt .+ tau .* p
    end
end
mlp(nin, nout, act=identity) = Chain(Dense(nin => hidden, relu), Dense(hidden => hidden, relu), Dense(hidden => nout, act))
function episode(policy; x0=2.0f0)  # deterministic episode from position x0
    s = Float32[x0, 0]; S = [s]; A = Float32[]; G = 0.0
    for t in 1:horizon
        a = clamp(policy(s), -1, 1); s, r = env_step(s, a)
        push!(S, s); push!(A, a); G += r
    end
    (S = S, A = A, G = G)
end

nenvs = {{nenvs}}  # parallel environments

function train(; steps=steps, seed=seed, nstep=5, lr=1f-3, ent=1f-3)
    rng = MersenneTwister(seed); Random.seed!(seed)
    model = (actor = Chain(Dense(2 => hidden, tanh), Dense(hidden => 1, tanh)), logstd = zeros(Float32, 1),
             critic = Chain(Dense(2 => hidden, tanh), Dense(hidden => 1)))
    opt = Flux.setup(Adam(lr), model)
    hist = (step = Int[], ret = Float64[], critic_loss = Float64[], actor_loss = Float64[], value = Float64[])
    S = [reset_state(rng) for e in 1:nenvs]; G = zeros(nenvs); t = 0; total = 0
    while total < steps
        n = min(nstep, horizon - t)  # rollouts never cross an episode boundary
        X = Matrix{Float32}[]; Acts = Vector{Float32}[]; R = Vector{Float32}[]
        for k in 1:n  # step all environments together
            Xk = reduce(hcat, S)
            ak = vec(model.actor(Xk)) .+ exp(model.logstd[1]) .* randn(rng, Float32, nenvs)
            out = [env_step(S[e], ak[e]) for e in 1:nenvs]
            push!(X, Xk); push!(Acts, ak); push!(R, [o[2] for o in out])
            S = [o[1] for o in out]; G .+= R[end]
        end
        ret = vec(model.critic(reduce(hcat, S)))  # bootstrap from the value of the last state
        Ret = Vector{Float32}[]
        for k in n:-1:1
            ret = R[k] .+ gamma .* ret; pushfirst!(Ret, ret)
        end
        Xall, Aall, Rall = reduce(hcat, X), reduce(vcat, Acts), reduce(vcat, Ret)
        V0 = vec(model.critic(Xall)); adv = Rall .- V0
        adv = (adv .- mean(adv)) ./ (std(adv) + 1f-6)
        grads = Flux.gradient(model) do m
            mu = vec(m.actor(Xall)); ls = m.logstd[1]
            logp = -0.5f0 .* ((Aall .- mu) ./ exp(ls)) .^ 2 .- ls
            -mean(logp .* adv) - ent * ls + 0.5f0 * mean((Rall .- vec(m.critic(Xall))) .^ 2)
        end
        Flux.update!(opt, model, grads[1])
        push!(hist.critic_loss, mean((Rall .- V0) .^ 2)); push!(hist.actor_loss, -mean(adv .* (-0.5f0 .* ((Aall .- vec(model.actor(Xall))) ./ exp(model.logstd[1])) .^ 2)))
        push!(hist.value, mean(V0))
        t += n; total += n
        if t == horizon  # all environments finish their episode together
            push!(hist.step, total * nenvs); push!(hist.ret, mean(G))
            S = [reset_state(rng) for e in 1:nenvs]; G .= 0; t = 0
        end
    end
    (policy = s -> model.actor(s)[1], sample = (s, rng) -> model.actor(s)[1] + exp(model.logstd[1]) * randn(rng),
     value = s -> model.critic(s)[1], hist = hist, model = model)
end

res = train()
starts = Float32[-2, -1, 1, 2]
(final_training_return = res.hist.ret[end], episodes = length(res.hist.ret),
 greedy_return_from = [x0 => round(episode(res.policy; x0).G, digits=2) for x0 in starts])
'''

[[codeBranches]]
model = "sac"
code = '''
using Flux, Random, Statistics

steps = {{steps}}  # environment steps
horizon = {{horizon}}  # steps per episode
gamma = Float32({{gamma}})  # discount factor
hidden = {{hidden}}  # hidden units per layer
seed = {{seed}}  # random seed

# Point-mass regulator: push a unit mass from a random position to the origin with a bounded force
dt = 0.1f0
reset_state(rng) = Float32[4rand(rng) - 2, 0]  # position, velocity
function env_step(s, a)  # a is clamped to [-1, 1]; returns (next state, reward)
    a = clamp(a, -1, 1)
    v = s[2] + a * dt
    Float32[s[1] + v * dt, v], -(s[1]^2 + 0.1f0 * s[2]^2 + 0.01f0 * a^2)
end
function soft_update!(target, model, tau)  # Polyak averaging of target-network weights
    for (pt, p) in zip(Flux.trainables(target), Flux.trainables(model))
        pt .= (1 - tau) .* pt .+ tau .* p
    end
end
mlp(nin, nout, act=identity) = Chain(Dense(nin => hidden, relu), Dense(hidden => hidden, relu), Dense(hidden => nout, act))
function episode(policy; x0=2.0f0)  # deterministic episode from position x0
    s = Float32[x0, 0]; S = [s]; A = Float32[]; G = 0.0
    for t in 1:horizon
        a = clamp(policy(s), -1, 1); s, r = env_step(s, a)
        push!(S, s); push!(A, a); G += r
    end
    (S = S, A = A, G = G)
end

alpha, tau = Float32({{alpha}}), Float32({{tau}})  # entropy temperature, target update rate

function squashed(actor, X, noise)  # tanh-Gaussian sample and its log-density
    out = actor(X); mu = out[1:1, :]; ls = clamp.(out[2:2, :], -5f0, 2f0)
    a = tanh.(mu .+ exp.(ls) .* noise)
    (a = a, logp = -0.5f0 .* noise .^ 2 .- ls .- 0.9189385f0 .- log.(1 .- a .^ 2 .+ 1f-6))
end

function train(; steps=steps, seed=seed, alpha=alpha, lr=1f-3, batchsize=64, warmup=1000)
    rng = MersenneTwister(seed); Random.seed!(seed)
    actor = mlp(2, 2)  # outputs mean and log-std
    critics = (mlp(3, 1), mlp(3, 1)); targets = deepcopy(critics)
    opt_a, opt_q = Flux.setup(Adam(lr), actor), Flux.setup(Adam(lr), critics)
    Sb, Ab, Rb, S2b = zeros(Float32, 2, steps), zeros(Float32, 1, steps), zeros(Float32, 1, steps), zeros(Float32, 2, steps)  # replay buffer
    hist = (step = Int[], ret = Float64[], critic_loss = Float64[], actor_loss = Float64[], value = Float64[])
    s = reset_state(rng); G = 0.0; t = 0
    for i in 1:steps
        a = i <= warmup ? 2rand(rng, Float32) - 1 : squashed(actor, s, randn(rng, Float32, 1, 1)).a[1]
        s2, r = env_step(s, a)
        Sb[:, i] = s; Ab[1, i] = a; Rb[1, i] = r; S2b[:, i] = s2
        s = s2; G += r; t += 1
        if t == horizon
            push!(hist.step, i); push!(hist.ret, G); s = reset_state(rng); G = 0.0; t = 0
        end
        i < batchsize && continue
        idx = rand(rng, 1:i, batchsize); X, A, R, X2 = Sb[:, idx], Ab[:, idx], Rb[:, idx], S2b[:, idx]
        nxt = squashed(actor, X2, randn(rng, Float32, 1, batchsize)); XA2 = vcat(X2, nxt.a)
        y = R .+ gamma .* (min.(targets[1](XA2), targets[2](XA2)) .- alpha .* nxt.logp)  # soft Bellman target
        XA = vcat(X, A)
        lq, gq = Flux.withgradient(c -> mean((c[1](XA) .- y) .^ 2) + mean((c[2](XA) .- y) .^ 2), critics)
        Flux.update!(opt_q, critics, gq[1])
        noise = randn(rng, Float32, 1, batchsize)
        la, ga = Flux.withgradient(actor) do m
            sm = squashed(m, X, noise); XAn = vcat(X, sm.a)
            mean(alpha .* sm.logp .- min.(critics[1](XAn), critics[2](XAn)))
        end
        Flux.update!(opt_a, actor, ga[1])
        soft_update!(targets, critics, tau)
        push!(hist.critic_loss, lq / 2); push!(hist.actor_loss, la); push!(hist.value, mean(critics[1](XA)))
    end
    Q(s, a) = min(critics[1](vcat(s, a))[1], critics[2](vcat(s, a))[1])
    (policy = s -> tanh(actor(s)[1]), sample = (s, rng) -> squashed(actor, s, randn(rng, Float32, 1, 1)).a[1],
     value = s -> Q(s, [tanh(actor(s)[1])]), hist = hist, model = (actor = actor, critics = critics))
end

res = train()
starts = Float32[-2, -1, 1, 2]
(final_training_return = res.hist.ret[end], episodes = length(res.hist.ret),
 greedy_return_from = [x0 => round(episode(res.policy; x0).G, digits=2) for x0 in starts])
'''

[[codeBranches]]
model = "td3"
code = '''
using Flux, Random, Statistics

steps = {{steps}}  # environment steps
horizon = {{horizon}}  # steps per episode
gamma = Float32({{gamma}})  # discount factor
hidden = {{hidden}}  # hidden units per layer
seed = {{seed}}  # random seed

# Point-mass regulator: push a unit mass from a random position to the origin with a bounded force
dt = 0.1f0
reset_state(rng) = Float32[4rand(rng) - 2, 0]  # position, velocity
function env_step(s, a)  # a is clamped to [-1, 1]; returns (next state, reward)
    a = clamp(a, -1, 1)
    v = s[2] + a * dt
    Float32[s[1] + v * dt, v], -(s[1]^2 + 0.1f0 * s[2]^2 + 0.01f0 * a^2)
end
function soft_update!(target, model, tau)  # Polyak averaging of target-network weights
    for (pt, p) in zip(Flux.trainables(target), Flux.trainables(model))
        pt .= (1 - tau) .* pt .+ tau .* p
    end
end
mlp(nin, nout, act=identity) = Chain(Dense(nin => hidden, relu), Dense(hidden => hidden, relu), Dense(hidden => nout, act))
function episode(policy; x0=2.0f0)  # deterministic episode from position x0
    s = Float32[x0, 0]; S = [s]; A = Float32[]; G = 0.0
    for t in 1:horizon
        a = clamp(policy(s), -1, 1); s, r = env_step(s, a)
        push!(S, s); push!(A, a); G += r
    end
    (S = S, A = A, G = G)
end

tau, pnoise = Float32({{tau}}), Float32({{pnoise}})  # target update rate, target-policy smoothing noise

function train(; steps=steps, seed=seed, lr=1f-3, batchsize=64, warmup=1000, explore=0.1f0, delay=2)
    rng = MersenneTwister(seed); Random.seed!(seed)
    actor = mlp(2, 1, tanh); actor_target = deepcopy(actor)  # deterministic policy
    critics = (mlp(3, 1), mlp(3, 1)); targets = deepcopy(critics)
    opt_a, opt_q = Flux.setup(Adam(lr), actor), Flux.setup(Adam(lr), critics)
    Sb, Ab, Rb, S2b = zeros(Float32, 2, steps), zeros(Float32, 1, steps), zeros(Float32, 1, steps), zeros(Float32, 2, steps)  # replay buffer
    hist = (step = Int[], ret = Float64[], critic_loss = Float64[], actor_loss = Float64[], value = Float64[])
    s = reset_state(rng); G = 0.0; t = 0
    for i in 1:steps
        a = i <= warmup ? 2rand(rng, Float32) - 1 : clamp(actor(s)[1] + explore * randn(rng, Float32), -1f0, 1f0)
        s2, r = env_step(s, a)
        Sb[:, i] = s; Ab[1, i] = a; Rb[1, i] = r; S2b[:, i] = s2
        s = s2; G += r; t += 1
        if t == horizon
            push!(hist.step, i); push!(hist.ret, G); s = reset_state(rng); G = 0.0; t = 0
        end
        i < batchsize && continue
        idx = rand(rng, 1:i, batchsize); X, A, R, X2 = Sb[:, idx], Ab[:, idx], Rb[:, idx], S2b[:, idx]
        a2 = clamp.(actor_target(X2) .+ clamp.(pnoise .* randn(rng, Float32, 1, batchsize), -0.5f0, 0.5f0), -1f0, 1f0)  # smoothed target action
        XA2 = vcat(X2, a2)
        y = R .+ gamma .* min.(targets[1](XA2), targets[2](XA2))  # clipped double-Q target
        XA = vcat(X, A)
        lq, gq = Flux.withgradient(c -> mean((c[1](XA) .- y) .^ 2) + mean((c[2](XA) .- y) .^ 2), critics)
        Flux.update!(opt_q, critics, gq[1])
        push!(hist.critic_loss, lq / 2); push!(hist.value, mean(critics[1](XA)))
        if i % delay == 0  # delayed actor and target updates
            la, ga = Flux.withgradient(m -> -mean(critics[1](vcat(X, m(X)))), actor)
            Flux.update!(opt_a, actor, ga[1])
            soft_update!(actor_target, actor, tau); soft_update!(targets, critics, tau)
            push!(hist.actor_loss, la)
        end
    end
    (policy = s -> actor(s)[1], sample = (s, rng) -> clamp(actor(s)[1] + explore * randn(rng, Float32), -1f0, 1f0),
     value = s -> min(critics[1](vcat(s, actor(s)))[1], critics[2](vcat(s, actor(s)))[1]), hist = hist, model = (actor = actor, critics = critics))
end

res = train()
starts = Float32[-2, -1, 1, 2]
(final_training_return = res.hist.ret[end], episodes = length(res.hist.ret),
 greedy_return_from = [x0 => round(episode(res.policy; x0).G, digits=2) for x0 in starts])
'''

