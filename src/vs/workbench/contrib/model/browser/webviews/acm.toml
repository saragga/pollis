[[bullets]]
text = "Advantage Actor-Critic (A2C)"
detail = "on-policy; actor updated by the policy gradient weighted by the advantage function; variance reduced via parallel environment rollouts; supports discrete and continuous actions (ReinforcementLearning.jl)"

[[bullets]]
text = "Soft Actor-Critic (SAC)"
detail = "off-policy maximum-entropy actor-critic; twin soft Q-networks prevent value overestimation; automatic entropy temperature tuning; state-of-the-art sample efficiency on continuous control (ReinforcementLearning.jl)"

[[bullets]]
text = "Twin Delayed Deep Deterministic Policy Gradient (TD3)"
detail = "off-policy deterministic actor; twin critics reduce overestimation bias; delayed actor updates and target policy smoothing improve training stability (ReinforcementLearning.jl)"

[[decisionRows]]
task = "A2C"
context = "On-policy; cheap updates from parallel environments; discrete or continuous actions"
purpose = "Advantage Actor-Critic: a Gaussian policy follows the advantage-weighted policy gradient while a value network (critic) supplies n-step bootstrapped targets"

[[decisionRows]]
task = "SAC"
context = "Off-policy continuous control; sample-efficient and robust to hyperparameters"
purpose = "Soft Actor-Critic: maximises reward plus alpha times policy entropy with a tanh-squashed Gaussian actor, twin Q-networks and soft-updated targets"

[[decisionRows]]
task = "TD3"
context = "Off-policy continuous control with a deterministic policy"
purpose = "Twin Delayed DDPG: deterministic actor, clipped double-Q targets, target policy smoothing noise and delayed actor updates to curb overestimation"

