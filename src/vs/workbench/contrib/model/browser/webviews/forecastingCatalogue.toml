# Manage Competition Datasets Webview Configuration
# A page of Compose in the Minimal style of the scaffold, not a panel: only its Powered by, Learn More and References.
# The schema of the catalogue it shows is compose/browser/media/forecastingCatalogue.toml, and its datasets are those of
# metadata/datasets.toml of PollisCompetitions.jl, of the toolboxes and of the Pollis Workspace; the papers of a dataset
# or a collection are works of PollisReferences. `pageCommand` is the command that opens it. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/forecastingCatalogue.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Manage Competition Datasets"
viewType = "pollis.forecastingCatalogue"
pageCommand = "pollis.competitions.forecastingCatalogue"

[[packages]]
name = "PollisCompetitions.jl"
github = "https://github.com/Trumpingtons/PollisCompetitions.jl"

[[wikis]]
name = "Overview"
file = "forecastingCatalogue/overview.md"
bundled = true
description = "Where the datasets come from, the two tabs, how to filter, sort and switch views, how the active datasets reach Score Models, and how datasets are saved in the Pollis Workspace or added from a file of your own"

[[wikis]]
name = "Factsheet"
file = "forecastingCatalogue/factsheet.md"
bundled = true
description = "The four views and their columns, the columns of the curated collections, the filters, and the actions of a dataset at a glance"

[[wikis]]
name = "Fields and Vocabularies"
file = "forecastingCatalogue/fields-vocabularies.md"
bundled = true
description = "Every field of a dataset, group by group, with its type, the values a controlled field takes and what each means, and the references of a dataset"

[[wikis]]
name = "Licences and Delivery"
file = "forecastingCatalogue/licences-delivery.md"
bundled = true
description = "Built-in and Download, where the data of each are kept on this computer, when Kaggle data are built in, and what the Licence says"

# The curated collections of the tab Curated Collections: benchmarks and archives that hold datasets of the Dataset
# Catalog of PollisCompetitions.jl, or where they are listed. `datasets` are their dataset_id in the catalogue, `papers`
# keys of PollisReferences.

[[collections]]
id = "monash"
name = "Monash Time Series Forecasting Archive"
year = 2021
url = "https://forecastingdata.org"
description = "About 30 forecasting datasets in 58 variants, of many domains and frequencies, in the .tsf format"
datasets = ["m1", "m3", "m4", "tourism_2011", "nn5", "cif2016", "web_traffic", "kdd_cup_2018", "london_smart_meters", "australian_electricity_demand", "monash_wind_solar"]
papers = ["GBWHM2021a"]

[[collections]]
id = "nab"
name = "Numenta Anomaly Benchmark (NAB)"
year = 2015
url = "https://github.com/numenta/NAB"
description = "58 time series, real and artificial, with labelled anomalies"
papers = ["LA2015a"]

[[collections]]
id = "gift_eval"
name = "GIFT-Eval"
year = 2024
url = "https://github.com/SalesforceAIResearch/gift-eval"
description = "23 datasets in 97 configurations, of 7 domains and 10 frequencies, for evaluating forecasting foundation models, with a pretraining corpus kept apart from them"
papers = ["AWLLL...2024a"]

[[collections]]
id = "fev_bench"
name = "fev-bench"
year = 2025
url = "https://github.com/autogluon/fev"
description = "About 100 forecasting tasks, with bootstrapped confidence intervals for comparing models"
papers = ["SATSE...2025a"]

[[collections]]
id = "weatherbench2"
name = "WeatherBench 2"
year = 2023
url = "https://sites.research.google/weatherbench"
description = "Global medium-range weather forecasts on gridded data, evaluated against numerical weather prediction"
papers = ["RHMLB...2024a"]

[[collections]]
id = "tabarena"
name = "TabArena"
year = 2025
url = "https://github.com/autogluon/tabarena"
description = "51 tabular datasets for classification and regression, picked from about a thousand candidates, each an OpenML task with its splits, with a living leaderboard of models"
datasets = ["airfoil_noise", "amazon_employee_access", "annealing", "used_fiat_500", "bank_marketing", "bank_customer_churn", "biological_response", "blood_transfusion", "customer_churn", "coil_2000_insurance", "concrete_strength", "german_credit", "credit_card_default", "airline_satisfaction", "pima_diabetes", "diabetes_130_us", "diamonds", "ecommerce_shipping", "fitness_club", "food_delivery_time", "give_me_some_credit", "hazelnut_contamination", "insurance_expenses", "heloc", "hiva", "house_values", "data_scientist_job_change", "in_vehicle_coupon", "good_customer", "kdd_cup_2009_appetency", "marketing_campaign", "maternal_health_risk", "miami_housing", "naticusdroid", "online_shoppers", "protein_structure", "polish_bankruptcy", "qsar_biodegradation", "qsar_tid_11", "qsar_fish_toxicity", "stellar_classification", "seismic_bumps", "splice", "student_dropout", "superconductivity", "taiwan_bankruptcy", "website_phishing", "wine_quality", "myocardial_infarction", "jm1_software_defects"]
papers = ["EPTHD...2025a"]

[[collections]]
id = "amlb"
name = "AutoML Benchmark (AMLB)"
year = 2019
url = "https://github.com/openml/automlbenchmark"
description = "71 classification and 33 regression tasks of OpenML, for comparing AutoML systems"
papers = ["GBCLP...2024a"]

[[collections]]
id = "grinsztajn"
name = "Tabular Benchmark (Grinsztajn, Oyallon and Varoquaux)"
year = 2022
url = "https://github.com/LeoGrin/tabular-benchmark"
description = "45 medium-sized tabular datasets, on which tree ensembles are compared with deep learning models"
papers = ["GOV2022a"]

[[collections]]
id = "tabzilla"
name = "TabZilla"
year = 2023
url = "https://github.com/naszilla/tabzilla"
description = "176 tabular classification datasets, on which neural networks are compared with gradient-boosted trees"
papers = ["MKVCR...2023a"]

[[collections]]
id = "talent"
name = "TALENT"
year = 2024
url = "https://github.com/LAMDA-Tabular/TALENT"
description = "About 300 tabular datasets for classification and regression, with a toolbox of methods"
papers = ["LCZY2024a"]

[[references]]
separator = true
label = "Original Papers"

[[references]]
key = "AHSW2011a"

[[references]]
key = "LSLLK...2026a"

[[references]]
separator = true
label = "Software and Data"

[[references]]
key = "GBWHM2021a"
