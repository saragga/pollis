# Manage Competition Datasets Webview Configuration
# A page of Compose in the Minimal style of the scaffold, not a panel: only its Powered by, Learn More and References.
# The catalogue it shows is compose/browser/media/forecastingCatalogue.toml; the papers of its entries are among the
# References below, from which the page shows them. `pageCommand` is the command that opens it. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/forecastingCatalogue.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Manage Competition Datasets"
viewType = "pollis.forecastingCatalogue"
pageCommand = "pollis.competitions.forecastingCatalogue"

[[packages]]
name = "PollisCompetitions.jl"
github = "https://github.com/Trumpingtons/PollisCompetitions.jl"

[[wikis]]
name = "Overview"
file = "forecastingCatalogue/overview.md"
bundled = true
description = "What the catalogue holds, its two tabs and five kinds of entry, how to search, filter, sort and switch views, and how the active datasets reach Score Models"

[[wikis]]
name = "Factsheet"
file = "forecastingCatalogue/factsheet.md"
bundled = true
description = "The eight views and their columns, the filters, and the actions of an entry at a glance"

[[wikis]]
name = "Fields and Vocabularies"
file = "forecastingCatalogue/fields-vocabularies.md"
bundled = true
description = "Every field of an entry, group by group, with its type, the values a controlled field takes and what each means"

[[wikis]]
name = "Licences and Delivery"
file = "forecastingCatalogue/licences-delivery.md"
bundled = true
description = "Bundled, download helper and online only; why Kaggle data are never bundled; planned and implemented; what To Check means"

