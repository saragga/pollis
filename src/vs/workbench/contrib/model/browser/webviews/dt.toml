# Decision Tree Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/dt.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Decision Tree Models"
viewType = "pollis.dt"
defaultModel = "dt"

[[packages]]
name = "DecisionTree.jl"
github = "https://github.com/bensadeghi/DecisionTree.jl"

[[packages]]
name = "ModalDecisionTrees.jl"
github = "https://github.com/aclai-lab/ModalDecisionTrees.jl"

[requires]
packages = ["Plots.jl", "CounterfactualExplanations.jl", "MLJ.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Decision Tree Basics"
file = "dt/tutorial-01-basics.ipynb"
bundled = true
description = "Fitting and interpreting decision trees with DecisionTree.jl"

[[notebookSections.notebooks]]
name = "Modal Decision Trees"
file = "dt/tutorial-02-modal.ipynb"
bundled = true
description = "Modal logic extensions for structured and relational data"

[[wikis]]
name = "Overview"
file = "dt/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "dt/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "dt/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "dt/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "dt/interpretation.md"
bundled = true

[[wikis]]
name = "Decision Guide"
file = "dt/decision-guide.md"
bundled = true

[[models]]
id = "dt"
label = "Decision Tree"

[[models]]
id = "modal"
label = "Modal Decision Tree"

[[bullets]]
text = "Decision Tree"
detail = "axis-aligned binary splitting with greedy optimisation of a split criterion"

[[bullets]]
text = "Modal Decision Tree"
detail = "extends splits with modal logic operators over relational and temporal data"

[[decisionRows]]
task = "Decision Tree"
context = "Tabular features; classification or regression"
purpose = "Transparent if-then rules from axis-aligned splits"

[[decisionRows]]
task = "Modal Decision Tree"
context = "Time series, images or relational data"
purpose = "Rules that reason over intervals and neighbourhoods, not single values"

[[inputs]]
id = "task"
label = "Task"
tooltip = "Classification predicts a discrete class label using Gini impurity or entropy. Regression predicts a continuous value by minimising mean squared error."
kind = "select"
default = "classification"
models = ["dt"]

[[inputs.options]]
value = "classification"
label = "Classification"

[[inputs.options]]
value = "regression"
label = "Regression"

[[inputs]]
id = "xvar"
label = "Train Feature Matrix"
tooltip = "n_samples x n_features feature matrix used for training"
default = "X_train"

[[inputs]]
id = "yvar"
label = "Train Target Variable"
tooltip = "Class label vector (classification) or continuous target vector (regression)"
default = "y_train"

[[inputs]]
id = "maxdepth"
label = "max_depth"
tooltip = "Maximum depth of the tree. Use -1 for unlimited growth. Shallow trees (depth 3-7) generalise better; very deep trees tend to overfit. Default 5."
default = "5"
newRow = true

[[inputs]]
id = "minleaf"
label = "min_samples_leaf"
tooltip = "Minimum number of training samples required in a leaf node. Higher values produce simpler, more robust trees. Default 1."
default = "1"

[[inputs]]
id = "xtest"
label = "Test Feature Matrix"
tooltip = "n_samples x n_features feature matrix of held-out test data used to evaluate generalisation."
default = "X_test"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.dt]
# Binary tree: a root split, two internal nodes and four leaves
svg = '''
var s = '';
var edges = [[27, 22, 15, 42], [27, 22, 39, 42], [15, 42, 9, 64], [15, 42, 21, 64], [39, 42, 33, 64], [39, 42, 45, 64]];
for (var i = 0; i < edges.length; i++) {
	var e = edges[i];
	s += '<line x1="' + e[0] + '" y1="' + e[1] + '" x2="' + e[2] + '" y2="' + e[3] + '" stroke="currentColor" stroke-width="1.2"/>';
}
s += '<circle cx="27" cy="22" r="4" fill="currentColor"/>';
s += '<circle cx="15" cy="42" r="3.5" fill="currentColor"/>';
s += '<circle cx="39" cy="42" r="3.5" fill="currentColor"/>';
var leaves = [9, 21, 33, 45];
for (var j = 0; j < leaves.length; j++) {
	s += '<rect x="' + (leaves[j] - 3.5) + '" y="61" width="7" height="7" fill="currentColor" opacity="' + (j % 2 ? 0.35 : 0.8) + '"/>';
}
return s;
'''

[miniCharts.modal]
# A series split into intervals, with a diamond (modal) node testing one of them
svg = '''
var d = '';
for (var i = 0; i <= 40; i++) {
	d += (i ? 'L' : 'M') + (7 + i) + ',' + (66 - 8 * Math.sin(i / 4) - i * 0.2).toFixed(1);
}
var s = '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.3"/>';
s += '<rect x="20" y="52" width="14" height="24" fill="currentColor" opacity="0.2"/>';
s += '<line x1="27" y1="30" x2="27" y2="52" stroke="currentColor" stroke-width="1" stroke-dasharray="2,2"/>';
s += '<path d="M27,14 L35,22 L27,30 L19,22 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>';
return s;
'''

[[codeBranches]]
model = "dt"
code = '''
using DecisionTree

{{?task=classification}} model = DecisionTreeClassifier(max_depth={{maxdepth}}, min_samples_leaf={{minleaf}})  # CART classifier
{{?task=regression}} model = DecisionTreeRegressor(max_depth={{maxdepth}}, min_samples_leaf={{minleaf}})  # CART regressor
fit!(model, {{xvar}}, {{yvar}})  # CART training

print_tree(model)  # display tree structure
y_hat_train = predict(model, {{xvar}})  # training predictions
y_hat_test  = predict(model, {{xtest}})  # test predictions
'''

[[codeBranches]]
model = "modal"
code = '''
using MLJ, ModalDecisionTrees

# X: a table with one row per instance; a column may hold a whole series per instance (a Vector), which the modal splits reason over
y     = coerce({{yvar}}, Multiclass)  # class labels
model = ModalDecisionTree(; max_depth={{maxdepth}}, min_samples_leaf={{minleaf}})  # modal decision tree
mach  = machine(model, {{xvar}}, y)
fit!(mach)  # modal tree training

report(mach).printmodel()  # learned modal rules
y_hat_train = predict_mode(mach, {{xvar}})  # training predictions
y_hat_test  = predict_mode(mach, {{xtest}})  # test predictions
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "tree-structure"
label = "Tree Structure"
desc = "Print the fitted splits and leaves down to a chosen depth"
code = '''
{{?model=dt}} print_tree(model, 3)  # show the first three levels
{{?model=dt}} depth(model), length(model)  # depth and number of leaves
{{?model=modal}} report(mach).printmodel(3)  # show the first three levels of the modal rules
'''

[[actionGroups.actions]]
id = "depth-curve"
label = "Depth vs Accuracy"
desc = "Plot training and 5-fold cross-validated accuracy as max_depth grows to see where overfitting starts"
code = '''
using Plots, Statistics

depths = 1:12
{{?model=dt}} train_acc(d) = mean(predict(fit!(DecisionTreeClassifier(max_depth=d), {{xvar}}, {{yvar}}), {{xvar}}) .== {{yvar}})
{{?model=dt}} cv_acc(d) = mean(nfoldCV_tree({{yvar}}, {{xvar}}, 5, 1.0, d; verbose=false))  # averaged over 5 folds, not one split
{{?model=modal}} train_acc(d) = mean(predict_mode(fit!(machine(ModalDecisionTree(max_depth=d), {{xvar}}, y), verbosity=0), {{xvar}}) .== y)
{{?model=modal}} cv_acc(d) = evaluate(ModalDecisionTree(max_depth=d), {{xvar}}, y; resampling=CV(nfolds=5, shuffle=true), measure=accuracy, verbosity=0).measurement[1]
plot(depths, train_acc.(depths), label="train", marker=:circle)
plot!(depths, cv_acc.(depths), label="5-fold CV", marker=:circle, xlabel="max_depth", ylabel="accuracy")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "confusion"
label = "Confusion Matrix"
desc = "Cross-tabulate predicted against true classes on the test set"
code = '''
{{?model=dt}} cm = confusion_matrix(y_test, y_hat_test)  # y_test: held-out labels
{{?model=dt}} cm.accuracy, cm.kappa
{{?model=modal}} cm = MLJ.confusion_matrix(y_hat_test, coerce(y_test, Multiclass))  # y_test: held-out labels
{{?model=modal}} cm, accuracy(y_hat_test, coerce(y_test, Multiclass))
'''

[[actionGroups.actions]]
id = "cv"
label = "Cross-Validation"
desc = "k-fold cross-validated accuracy (classification) or R^2 (regression)"
code = '''
using Statistics

{{?model=dt}} scores = nfoldCV_tree({{yvar}}, {{xvar}}, 5, 1.0, {{maxdepth}}, {{minleaf}}; verbose=false)  # accuracy for class labels, R^2 for a Float target (use float.(y) for an integer-valued regression target)
{{?model=modal}} scores = evaluate(model, {{xvar}}, y; resampling=CV(nfolds=5, shuffle=true), measure=accuracy, verbosity=0).per_fold[1]
mean(scores), std(scores)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "proba"
label = "Class Probabilities"
desc = "Leaf class frequencies for each test sample instead of a hard label"
code = '''
{{?model=dt}} P = predict_proba(model, {{xtest}})  # one row per sample, one column per class
{{?model=modal}} P = pdf(predict(mach, {{xtest}}), levels(y))  # one row per sample, one column per class
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "forest"
label = "Tree vs Random Forest"
desc = "Compare the single tree with a bagged ensemble of trees on the test set"
code = '''
using Statistics

{{?model=dt}} forest = RandomForestClassifier(n_trees=200, max_depth={{maxdepth}})
{{?model=dt}} fit!(forest, {{xvar}}, {{yvar}})
{{?model=dt}} (tree = mean(predict(model, {{xtest}}) .== y_test), forest = mean(predict(forest, {{xtest}}) .== y_test))
{{?model=modal}} forest = fit!(machine(ModalRandomForest(; ntrees=200, max_depth={{maxdepth}}), {{xvar}}, y))
{{?model=modal}} (tree = mean(y_hat_test .== y_test), forest = mean(predict_mode(forest, {{xtest}}) .== y_test))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "importance"
label = "Feature Importance"
desc = "Impurity importance, which favours continuous and many-valued features, beside permutation importance on the test set"
code = '''
using Plots

{{?model=dt}} imp  = impurity_importance(model; normalize=true)  # mean decrease in impurity, on the training data
{{?model=dt}} perm = permutation_importance(model, copy({{xtest}}), y_test; n_iter=10)  # accuracy (or R^2) drop when each feature is shuffled; copy: it shuffles columns in place
{{?model=dt}} println("impurity: ", round.(imp, digits=3))
{{?model=dt}} bar(perm.mean, yerror=perm.std, xlabel="feature", ylabel="permutation importance", legend=false)
{{?model=modal}} imp = feature_importances(mach)  # how often each variable is used in a split (the only importance ModalDecisionTrees reports)
{{?model=modal}} bar(string.(first.(imp)), last.(imp), xlabel="feature", ylabel="split share", legend=false)
'''

[[actionGroups.actions]]
id = "counterfactual"
label = "Counterfactual Explanations"
desc = "Find minimal feature changes that flip the prediction: algorithmic recourse (CounterfactualExplanations.jl, Feature Tweak generator for trees)"
code = '''
{{?model=dt}} using CounterfactualExplanations, DecisionTree  # loading DecisionTree activates the tree extension
{{?model=dt}} using CounterfactualExplanations.Models: fit_model, predict_label

{{?model=dt}} data = CounterfactualData(Float32.(transpose({{xvar}})), {{yvar}})  # CounterfactualExplanations wants features x samples
{{?model=dt}} M = fit_model(data, :DecisionTree; max_depth={{maxdepth}}, min_samples_leaf={{minleaf}})  # the same tree, fitted through the package
{{?model=dt}} x = Float32.(transpose({{xtest}}[1:1, :]))  # sample to explain, as a column
{{?model=dt}} factual = predict_label(M, data, x)[1]
{{?model=dt}} target = first(filter(!=(factual), data.y_levels))  # any other class
{{?model=dt}} ce = generate_counterfactual(x, target, data, M, FeatureTweakGenerator())  # a tree is not differentiable: Feature Tweak searches its split thresholds instead of gradients
{{?model=dt}} counterfactual(ce)  # minimally altered input that flips the prediction
{{?model=modal}} # No counterfactual generator in CounterfactualExplanations.jl supports modal decision trees
'''
