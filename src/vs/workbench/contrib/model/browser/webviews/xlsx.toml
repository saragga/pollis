[[actionGroups.actions]]
id = "xlsx-read-all-sheets"
label = "Read as Dict"
desc = "Write a two-sheet Excel workbook then read every sheet into a Dict"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "demo.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		XLSX.rename!(xf[1], "A")
		ws1 = xf[1]
		ws1["A1"] = "x"; ws1["A2"] = 1
		XLSX.addsheet!(xf, "B")
		xf["B"]["A1"] = "y"; xf["B"]["A2"] = 2
	end

	XLSX.openxlsx(path) do xf
		for name in XLSX.sheetnames(xf)
			println(name, ": ", xf[name]["A1:A2"])
		end
	end
end
"""

