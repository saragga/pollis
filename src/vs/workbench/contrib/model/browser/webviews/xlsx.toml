[[codeBranches]]
model = "read"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "demo.xlsx")

	XLSX.openxlsx(path; mode="w") do xf
		ws = xf[1]
		ws["A1"] = "name";  ws["B1"] = "score"
		ws["A2"] = "Alice"; ws["B2"] = 95
		ws["A3"] = "Bob";   ws["B3"] = 87
	end

	XLSX.openxlsx(path) do xf
		ws  = xf[1]
		println("Sheets: ", XLSX.sheetnames(xf))
		println("A1:B3 = ", ws["A1:B3"])
		tbl = XLSX.gettable(ws)
		for row in XLSX.eachtablerow(ws)
			println(row[1], "  ", row[2])
		end
	end
end
"""

[[codeBranches]]
model = "write"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "output.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		XLSX.rename!(xf[1], "Results")
		ws1 = xf[1]
		ws1["A1"] = "name";  ws1["B1"] = "score"
		ws1["A2"] = "Alice"; ws1["B2"] = 95
		ws1["A3"] = "Bob";   ws1["B3"] = 87

		XLSX.addsheet!(xf, "Inventory")
		ws2 = xf["Inventory"]
		ws2["A1"] = "product"; ws2["B1"] = "qty"
		ws2["A2"] = "A";       ws2["B2"] = 10
		ws2["A3"] = "B";       ws2["B3"] = 20
	end
	println("Written: ", path)
end
"""

[[codeBranches]]
model = "formula"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "model.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		ws = xf[1]
		ws["A1"] = "Jan"; ws["B1"] = 12000.0; ws["C1"] = 8000.0
		ws["A2"] = "Feb"; ws["B2"] = 15000.0; ws["C2"] = 9500.0
		ws["A3"] = "Mar"; ws["B3"] = 11000.0; ws["C3"] = 7500.0

		XLSX.setFormula(ws, "D1", "B1-C1")
		XLSX.setFormula(ws, "D2", "B2-C2")
		XLSX.setFormula(ws, "D3", "B3-C3")
		XLSX.addDefinedName(xf, "Revenue", "Sheet1!$B$1:$B$3")
	end
end
"""

# Next Steps action groups
[[actionGroups]]
id = "write"
label = "Write Workbook"

[[actionGroups.actions]]
id = "xlsx-write-cells"
label = "Write Cells"
desc = "Create a workbook with two sheets by writing cells directly"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "output.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		XLSX.rename!(xf[1], "Results")
		ws1 = xf[1]
		ws1["A1"] = "name";  ws1["B1"] = "score"
		ws1["A2"] = "Alice"; ws1["B2"] = 95
		ws1["A3"] = "Bob";   ws1["B3"] = 87

		XLSX.addsheet!(xf, "Inventory")
		ws2 = xf["Inventory"]
		ws2["A1"] = "product"; ws2["B1"] = "qty"
		ws2["A2"] = "A";       ws2["B2"] = 10
		ws2["A3"] = "B";       ws2["B3"] = 20
	end
	println("Written: ", path)
end
"""

[[actionGroups]]
id = "format"
label = "Format Cells"

[[actionGroups.actions]]
id = "xlsx-write-format"
label = "Write and Format"
desc = "Write data and apply bold header, fill, and conditional formatting in one block"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "report.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		ws = xf[1]
		ws["A1"] = "Product"; ws["B1"] = "Revenue"
		ws["A2"] = "Alpha";   ws["B2"] = 5200.0
		ws["A3"] = "Beta";    ws["B3"] = 800.0

		for col in ["A", "B"]
			XLSX.setFont(ws, col * "1"; bold=true, color="FFFFFF")
			XLSX.setFill(ws, col * "1"; fgColor="4472C4")
		end
		XLSX.setConditionalFormat(ws, "B2:B3"; rule="<1000", fgColor="FFC7CE")
	end
end
"""

[[actionGroups]]
id = "inspect"
label = "Inspect"

[[actionGroups.actions]]
id = "xlsx-inspect"
label = "Inspect Workbook"
desc = "Write an Excel file then inspect its sheets and cell dimensions"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "demo.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		XLSX.rename!(xf[1], "Sales")
		ws1 = xf[1]
		ws1["A1"] = "item"; ws1["B1"] = "qty"
		ws1["A2"] = "X";    ws1["B2"] = 10
		XLSX.addsheet!(xf, "Costs")
	end

	XLSX.openxlsx(path) do xf
		println("Sheets: ", XLSX.sheetnames(xf))
		for name in XLSX.sheetnames(xf)
			dim = XLSX.get_dimension(xf[name])
			println(name, " → ", dim)
		end
	end
end
"""

[[actionGroups]]
id = "read"
label = "Read Formats"

[[actionGroups.actions]]
id = "xlsx-read-cells"
label = "Read as Matrix"
desc = "Write an Excel file then read back a cell range as a Matrix{Any}"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "demo.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		ws = xf[1]
		ws["A1"] = "name";  ws["B1"] = "score"
		ws["A2"] = "Alice"; ws["B2"] = 95
		ws["A3"] = "Bob";   ws["B3"] = 87
	end

	XLSX.openxlsx(path) do xf
		ws  = xf[1]
		mat = ws["A1:B3"]
		println(mat)
	end
end
"""

[[actionGroups.actions]]
id = "xlsx-read-table"
label = "Read as Table"
desc = "Write an Excel file then read it back as a Tables.jl table"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "demo.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		ws = xf[1]
		ws["A1"] = "name";  ws["B1"] = "score"
		ws["A2"] = "Alice"; ws["B2"] = 95
		ws["A3"] = "Bob";   ws["B3"] = 87
	end

	XLSX.openxlsx(path) do xf
		for row in XLSX.eachtablerow(xf[1])
			println(row[:name], "  ", row[:score])
		end
	end
end
"""

[[actionGroups.actions]]
id = "xlsx-read-all-sheets"
label = "Read as Dict"
desc = "Write a two-sheet Excel workbook then read every sheet into a Dict"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "demo.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		XLSX.rename!(xf[1], "A")
		ws1 = xf[1]
		ws1["A1"] = "x"; ws1["A2"] = 1
		XLSX.addsheet!(xf, "B")
		xf["B"]["A1"] = "y"; xf["B"]["A2"] = 2
	end

	XLSX.openxlsx(path) do xf
		for name in XLSX.sheetnames(xf)
			println(name, ": ", xf[name]["A1:A2"])
		end
	end
end
"""
