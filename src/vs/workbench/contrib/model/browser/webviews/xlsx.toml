[[bullets]]
text = "Read"
detail = "load sheets and ranges from any <code>.xlsx</code> file into Julia arrays or Tables.jl-compatible structures"

[[bullets]]
text = "Write"
detail = "create workbooks with multiple sheets from Julia arrays or any Tables.jl source"

[[bullets]]
text = "Formula"
detail = "embed Excel formulas, defined names, and rich text (AnnotatedStrings) in cells"

[[bullets]]
text = "Format"
detail = "apply fonts, fills, borders, alignment, conditional formatting, and merged cells"

[[decisionRows]]
task = "Read"
context = "Existing file"
purpose = "Load sheet data into Julia for analysis or transformation"

[[decisionRows]]
task = "Write"
context = "New file"
purpose = "Generate workbooks programmatically from Julia data"

[[decisionRows]]
task = "Format"
context = "Presentation"
purpose = "Style cells with fonts, colours, borders, and conditional rules"

[[decisionRows]]
task = "Formula"
context = "Excel logic"
purpose = "Embed formulas or defined names for downstream Excel users"

