# Excel Workbook (XLSX.jl) Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/xlsx.data.ts

[meta]
title = "Excel Workbook"
viewType = "pollis.xlsx"
defaultModel = "write"
models = ["write", "read", "formula"]
illusCollapsed = true
illustrationText = "Excel file reader and writer for the Julia language."

[[packages]]
name = "XLSX.jl"
github = "https://github.com/felipenoris/XLSX.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[notebookSections]]
label = "Excel Workbook"

[[notebookSections.notebooks]]
name = "Read and Explore"
file = "xlsx/tutorial-01-read.ipynb"
bundled = true
description = "Load sheets and ranges from an .xlsx file using the Tables.jl interface"

[[notebookSections.notebooks]]
name = "Write and Format"
file = "xlsx/tutorial-02-write.ipynb"
bundled = true
description = "Create a styled multi-sheet workbook with fonts, fills, and borders"

[[notebookSections.notebooks]]
name = "Formulas and Names"
file = "xlsx/tutorial-03-formula.ipynb"
bundled = true
description = "Embed Excel formulas and defined names for downstream spreadsheet users"

[[notebookSections.notebooks]]
name = "Conditional Formatting"
file = "xlsx/tutorial-04-cond.ipynb"
bundled = true
description = "Highlight cells automatically using rule-based conditional formatting"

[[wikis]]
name = "Factsheet"
file = "xlsx/factsheet.md"
bundled = true
description = "Quick-reference: XLSX.jl API, key functions, and when to use each task mode"

[[wikis]]
name = "Overview"
file = "xlsx/overview.md"
bundled = true
description = "Reading, writing, and formatting Excel files from Julia with XLSX.jl"

[[wikis]]
name = "Constraints"
file = "xlsx/constraints.md"
bundled = true
description = "File format constraints, data types, and encoding requirements"

[[wikis]]
name = "Diagnostics"
file = "xlsx/diagnostics.md"
bundled = true
description = "Common errors: missing sheets, type mismatches, merged cells, encoding issues"

[[wikis]]
name = "Interpretation"
file = "xlsx/interpretation.md"
bundled = true
description = "Understanding workbook structure: sheets, cells, ranges, and named regions"

[[references]]
title = "XLSX.jl: Read and write Excel files in pure Julia"
authors = "Noris, Felipe; contributors"
year = 2024
journal = "GitHub"
url = "https://github.com/felipenoris/XLSX.jl"
openAccess = true

[[references]]
title = "Tables.jl: An Interface for Tabular Data"
authors = "Quinn, Jacob; contributors"
year = 2023
journal = "GitHub"
url = "https://github.com/JuliaData/Tables.jl"
openAccess = true

