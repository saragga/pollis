[[codeBranches]]
model = "read"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "demo.xlsx")

	XLSX.openxlsx(path; mode="w") do xf
		ws = xf[1]
		ws["A1"] = "name";  ws["B1"] = "score"
		ws["A2"] = "Alice"; ws["B2"] = 95
		ws["A3"] = "Bob";   ws["B3"] = 87
	end

	XLSX.openxlsx(path) do xf
		ws  = xf[1]
		println("Sheets: ", XLSX.sheetnames(xf))
		println("A1:B3 = ", ws["A1:B3"])
		tbl = XLSX.gettable(ws)
		for row in XLSX.eachtablerow(ws)
			println(row[1], "  ", row[2])
		end
	end
end
"""

[[codeBranches]]
model = "write"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "output.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		XLSX.rename!(xf[1], "Results")
		ws1 = xf[1]
		ws1["A1"] = "name";  ws1["B1"] = "score"
		ws1["A2"] = "Alice"; ws1["B2"] = 95
		ws1["A3"] = "Bob";   ws1["B3"] = 87

		XLSX.addsheet!(xf, "Inventory")
		ws2 = xf["Inventory"]
		ws2["A1"] = "product"; ws2["B1"] = "qty"
		ws2["A2"] = "A";       ws2["B2"] = 10
		ws2["A3"] = "B";       ws2["B3"] = 20
	end
	println("Written: ", path)
end
"""

[[codeBranches]]
model = "formula"
code = """
using XLSX

mktempdir() do dir
	path = joinpath(dir, "model.xlsx")
	XLSX.openxlsx(path; mode="w") do xf
		ws = xf[1]
		ws["A1"] = "Jan"; ws["B1"] = 12000.0; ws["C1"] = 8000.0
		ws["A2"] = "Feb"; ws["B2"] = 15000.0; ws["C2"] = 9500.0
		ws["A3"] = "Mar"; ws["B3"] = 11000.0; ws["C3"] = 7500.0

		XLSX.setFormula(ws, "D1:D3", "=B1-C1")  # margin; XLSX.jl writes the formula text only, it never evaluates it
		XLSX.addDefinedName(xf, "Revenue", "Sheet1!$B$1:$B$3")
	end
	println("Written: ", path)
	println("D1:D3 hold formulas with no cached values: they show numbers only after Excel (or LibreOffice) recalculates the file, which it does on open.")
	println("Reading the file back in Julia before it has been recalculated and saved gives no values for D1:D3.")
end
"""

[[codeBranches]]
model = "duckdb"
code = '''
using DuckDB, Tables, XLSX
using PollisDatasets  # curated example datasets

con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "INSTALL excel")  # DuckDB's excel extension, downloaded the first time
DBInterface.execute(con, "LOAD excel")

mktempdir() do dir
	path = joinpath(dir, "airquality.xlsx")
	# Example workbook: Chambers et al. (1983), daily air quality in New York, May to September 1973. Replace path with your own workbook.
	XLSX.writetable(path, dataset("airquality"); sheetname = "readings")

	summary = Tables.columntable(DBInterface.execute(con, """
	SELECT month::INTEGER AS month, round(avg(temp), 1) AS mean_temp, count(ozone) AS ozone_readings
	FROM read_xlsx('$path', sheet = 'readings')
	GROUP BY ALL ORDER BY month
	"""))  # numbers come back as DOUBLE: cast them where an integer is meant
	println(summary)

	hot = Tables.columntable(DBInterface.execute(con, "SELECT * FROM read_xlsx('$path', sheet = 'readings') WHERE temp > 85"))
	out = joinpath(dir, "hot_days.xlsx")
	XLSX.writetable(out, hot; sheetname = "hot days")  # the query's result, saved as a workbook by XLSX.jl
	println("Written: ", out, ", ", length(first(hot)), " rows")
end
'''

