# Local Optimisation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/optim.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Local Optimisation"
viewType = "pollis.optim"
defaultModel = "gf"

[[packages]]
