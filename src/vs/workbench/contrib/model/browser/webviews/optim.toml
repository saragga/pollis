[[models]]
id = "gf"
label = "Gradient Free"

[[models]]
id = "gr"
label = "Gradient Required"

[[models]]
id = "hr"
label = "Hessian Required"

[[bullets]]
text = "Gradient Free"
detail = "derivative-free local search: Nelder-Mead simplex method"

[[bullets]]
text = "Gradient Required"
detail = "first-order methods: BFGS, L-BFGS, Conjugate Gradient, Gradient Descent"

[[bullets]]
text = "Hessian Required"
detail = "second-order methods: Newton, Newton Trust Region, IPNewton (constrained)"

[[decisionRows]]
task = "Gradient Free"
context = "Non-smooth, noisy or black-box objectives where derivatives are unavailable or meaningless"
purpose = "Compare function values only (simplex, annealing, swarm); robust but slow in many dimensions"

[[decisionRows]]
task = "Gradient Required"
context = "Smooth objectives, from a few to millions of variables"
purpose = "Descend along (quasi-Newton-scaled) gradients from automatic differentiation; box bounds via Fminbox"

[[decisionRows]]
task = "Hessian Required"
context = "Smooth, moderately sized problems where fast, accurate convergence matters"
purpose = "Newton steps with the exact Hessian: quadratic convergence near the optimum; IPNewton adds box bounds"

[[inputs]]
id = "f"
label = "Objective f(x)"
tooltip = "Julia expression for the scalar objective to minimise. Use x[1], x[2], ... for the components. Example: (1 - x[1])^2 + 100 * (x[2] - x[1]^2)^2 (Rosenbrock)."
default = "(1 - x[1])^2 + 100 * (x[2] - x[1]^2)^2"

[[inputs]]
id = "x0"
label = "Initial Guess x0"
tooltip = "Starting point as a Julia vector, for example [-1.2, 1.0]. Local methods may converge to different minima from different starts."
default = "[-1.2, 1.0]"

[[inputs]]
id = "gfalgo"
label = "Algorithm"
tooltip = "NelderMead: simplex search, the standard derivative-free method. SimulatedAnnealing: random moves accepted by a cooling schedule, can escape local minima. ParticleSwarm: population search, global but slow."
kind = "select"
default = "NelderMead"
models = ["gf"]
newRow = true

[[inputs.options]]
value = "NelderMead"
label = "Nelder-Mead"

[[inputs.options]]
value = "SimulatedAnnealing"
label = "Simulated Annealing"

[[inputs.options]]
value = "ParticleSwarm"
label = "Particle Swarm"

[[inputs]]
id = "gralgo"
label = "Algorithm"
tooltip = "BFGS: quasi-Newton, robust and widely used. LBFGS: memory-efficient BFGS for large problems. ConjugateGradient: efficient for large smooth problems. GradientDescent: simple steepest descent, slow near optima."
kind = "select"
default = "BFGS"
models = ["gr"]
newRow = true

[[inputs.options]]
value = "BFGS"
label = "BFGS"

[[inputs.options]]
value = "LBFGS"
label = "L-BFGS"

[[inputs.options]]
value = "ConjugateGradient"
label = "Conjugate Gradient"

[[inputs.options]]
value = "GradientDescent"
label = "Gradient Descent"

[[inputs]]
id = "hralgo"
label = "Algorithm"
tooltip = "Newton: fast quadratic convergence near the optimum. NewtonTrustRegion: Newton with trust-region globalisation, more robust far from the optimum. IPNewton: interior-point Newton that respects the box bounds."
kind = "select"
default = "Newton"
models = ["hr"]
newRow = true

[[inputs.options]]
value = "Newton"
label = "Newton"

[[inputs.options]]
value = "NewtonTrustRegion"
label = "Newton Trust Region"

[[inputs.options]]
value = "IPNewton"
label = "IPNewton (Constrained)"

[[inputs]]
id = "autodiff"
label = "Derivatives"
tooltip = ":forward: exact derivatives by forward-mode automatic differentiation (ForwardDiff.jl), recommended. :finite: finite-difference approximations (FiniteDiff.jl), slower and less accurate but works for any Julia function."
kind = "select"
default = ":forward"
models = ["gr", "hr"]

[[inputs.options]]
value = ":forward"
label = ":forward (ForwardDiff)"

[[inputs.options]]
value = ":finite"
label = ":finite (FiniteDiff)"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Lower bound for each variable; -Inf for none. Used by Fminbox (gradient methods, when any bound is finite) and IPNewton."
default = "[-Inf, -Inf]"
models = ["gr", "hr"]
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Upper bound for each variable; Inf for none."
default = "[Inf, Inf]"
models = ["gr", "hr"]

