[[codeBranches]]
model = "gf"
code = '''
using Optim, LinearAlgebra

f(x) = {{f}}
x0 = {{x0}}  # initial guess
opts = Optim.Options(store_trace=true, extended_trace=true)  # keep the path for the plots

algo = {{gfalgo}}()
solve(x0, algo=algo) = optimize(f, x0, algo, opts)

result = solve(x0)
x_opt = Optim.minimizer(result)
(minimizer = x_opt, minimum = Optim.minimum(result), converged = Optim.converged(result), iterations = Optim.iterations(result))
'''

[[codeBranches]]
model = "gr"
code = '''
using Optim, LinearAlgebra

f(x) = {{f}}
x0 = {{x0}}  # initial guess
opts = Optim.Options(store_trace=true, extended_trace=true)  # keep the path for the plots
lb, ub = {{lb}}, {{ub}}
bounded = any(isfinite, lb) || any(isfinite, ub)

algo = {{gralgo}}()
solve(x0, algo=algo) = bounded ?
    optimize(f, lb, ub, x0, Fminbox(algo), opts; autodiff={{autodiff}}) :  # box-constrained
    optimize(f, x0, algo, opts; autodiff={{autodiff}})

result = solve(x0)
x_opt = Optim.minimizer(result)
(minimizer = x_opt, minimum = Optim.minimum(result), converged = Optim.converged(result), iterations = Optim.iterations(result))
'''

[[codeBranches]]
model = "hr"
code = '''
using Optim, LinearAlgebra

f(x) = {{f}}
x0 = {{x0}}  # initial guess
opts = Optim.Options(store_trace=true, extended_trace=true)  # keep the path for the plots
lb, ub = {{lb}}, {{ub}}

algo = {{hralgo}}()
solve(x0, algo=algo) = algo isa IPNewton ?
    optimize(TwiceDifferentiable(f, x0; autodiff={{autodiff}}), TwiceDifferentiableConstraints(lb, ub), x0, algo, opts) :  # box-constrained
    optimize(f, x0, algo, opts; autodiff={{autodiff}})

result = solve(x0)
x_opt = Optim.minimizer(result)
(minimizer = x_opt, minimum = Optim.minimum(result), converged = Optim.converged(result), iterations = Optim.iterations(result))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "convergence-trace"
label = "Convergence Trace"
desc = "Objective value against iteration (log scale)"
code = '''
using Plots

fs = Optim.f_trace(result)
plot(0:length(fs)-1, fs .- minimum(fs) .+ eps(), yscale=:log10, xlabel="iteration", ylabel="f(x) - f*", marker=:circle, markersize=2, legend=false)
'''

[[actionGroups.actions]]
id = "contour-path"
label = "Contour + Path"
desc = "The optimisation path on the contours of f (2D problems; other variables held at the optimum)"
code = '''
using Plots

path = Optim.x_trace(result)
P = reduce(hcat, path)
pad = max(1, 0.25 * maximum(abs, P))
xs = range(minimum(P[1, :]) - pad, maximum(P[1, :]) + pad, length=120)
ys = range(minimum(P[2, :]) - pad, maximum(P[2, :]) + pad, length=120)
g(a, b) = f([a; b; x_opt[3:end]])
contour(xs, ys, (a, b) -> log1p(g(a, b) - Optim.minimum(result) + 1e-12), fill=true, colorbar=false, xlabel="x1", ylabel="x2")
plot!(P[1, :], P[2, :], marker=:circle, markersize=2, color=:white, label="path")
scatter!([x_opt[1]], [x_opt[2]], marker=:star, markersize=10, color=:red, label="minimiser")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Convergence flags, iterations, function and gradient calls, and the gradient norm at the solution"
code = '''
using ForwardDiff

(converged = Optim.converged(result), x_converged = Optim.x_converged(result), f_converged = Optim.f_converged(result),
 g_converged = Optim.g_converged(result), iterations = Optim.iterations(result),
 f_calls = Optim.f_calls(result), g_calls = Optim.g_calls(result),
 gradient_norm = norm(ForwardDiff.gradient(f, x_opt)))  # about 0 at an unconstrained minimum
'''

[[actionGroups.actions]]
id = "gradient-check"
label = "Gradient Check"
desc = "Finite-difference against automatic-differentiation gradients at x0 and at the solution (a large difference points to a non-smooth f)"
code = '''
using ForwardDiff, FiniteDiff

map(["x0" => x0, "x_opt" => x_opt]) do (name, p)
    g_ad = ForwardDiff.gradient(f, p)
    g_fd = FiniteDiff.finite_difference_gradient(f, p)
    (point = name, autodiff = g_ad, finite_diff = g_fd, max_difference = maximum(abs, g_ad - g_fd))
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "evaluate-new"
label = "Evaluate at New Point"
desc = "f at a new point, compared with the minimum"
code = '''
x_new = x_opt .+ 0.1  # replace with the point to evaluate
(f_new = f(x_new), f_min = Optim.minimum(result), increase = f(x_new) - Optim.minimum(result), distance = norm(x_new - x_opt))
'''

[[actionGroups.actions]]
id = "multi-start"
label = "Multi-Start"
desc = "Solve from 20 random starts around x0 to reveal other local minima"
code = '''
using Random

Random.seed!(1)
runs = map(1:20) do _
    s = x0 .+ 2 .* randn(length(x0))
    r = solve(s)
    (start = s, minimizer = Optim.minimizer(r), minimum = Optim.minimum(r), converged = Optim.converged(r))
end
sort(runs, by = r -> r.minimum)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-algorithms"
label = "Compare Algorithms"
desc = "Nelder-Mead, gradient descent, conjugate gradient, BFGS, L-BFGS and Newton from the same start: minimum, iterations, calls and time"
code = '''
algos = ["NelderMead" => NelderMead(), "GradientDescent" => GradientDescent(), "ConjugateGradient" => ConjugateGradient(),
         "BFGS" => BFGS(), "LBFGS" => LBFGS(), "Newton" => Newton()]
map(algos) do (name, a)
    t = @elapsed r = a isa NelderMead ? optimize(f, x0, a) : optimize(f, x0, a; autodiff=:forward)
    (algorithm = name, minimum = Optim.minimum(r), iterations = Optim.iterations(r), f_calls = Optim.f_calls(r), converged = Optim.converged(r), seconds = t)
end
'''

[[actionGroups.actions]]
id = "autodiff-compare"
label = "Autodiff vs Finite Differences"
desc = "BFGS with forward-mode automatic differentiation against finite differences: accuracy, calls and time"
code = '''
map([:forward, :finite]) do ad
    t = @elapsed r = optimize(f, x0, BFGS(); autodiff=ad)
    (derivatives = ad, minimum = Optim.minimum(r), iterations = Optim.iterations(r), f_calls = Optim.f_calls(r), g_calls = Optim.g_calls(r), seconds = t)
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "solution-summary"
label = "Solution Summary"
desc = "Optim's full report: algorithm, minimiser, minimum, convergence measures and work counters"
code = '''
result
'''

[[actionGroups.actions]]
id = "hessian-check"
label = "Local Optimality (Hessian)"
desc = "Eigenvalues of the Hessian at the solution: all positive = strict local minimum; the condition number measures how elongated the valley is"
code = '''
using ForwardDiff

H = ForwardDiff.hessian(f, x_opt)
ev = eigvals(Symmetric(H))
(eigenvalues = ev, strict_local_minimum = all(>(0), ev), condition_number = maximum(abs, ev) / minimum(abs, ev))
'''
