# Proximity-Based Outlier Detection Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/nod.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Proximity-Based Outlier Detection"
viewType = "pollis.nod"
defaultModel = "knn"

[[packages]]
name = "OutlierDetection.jl"
github = "https://github.com/OutlierDetectionJL/OutlierDetection.jl"

[[packages]]
name = "OutlierDetectionNeighbors.jl"
github = "https://github.com/OutlierDetectionJL/OutlierDetectionNeighbors.jl"

# Further packages the examples use: checked by the install indicator, not listed on the Powered-by line
[requires]
packages = ["Plots.jl", "StatsBase.jl"]

