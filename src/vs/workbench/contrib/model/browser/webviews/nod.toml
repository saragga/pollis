[[models]]
id = "abod"
label = "ABOD"

[[bullets]]
text = "k-Nearest Neighbours (KNN)"
detail = "scores each point by its distance to the k-th nearest neighbour; isolated points receive high scores"

[[bullets]]
text = "Local Outlier Factor (LOF)"
detail = "compares a point's local reachability density to that of its neighbours; low relative density indicates an outlier"

[[bullets]]
text = "Connectivity-Based Outlier Factor (COF)"
detail = "extends LOF using chaining distances; more robust in sparse, elongated clusters"

[[bullets]]
text = "Angle-Based Outlier Detection (ABOD)"
detail = "measures the variance of angles subtended at a point by pairs of other points; outliers subtend a narrow angle range"

[[decisionRows]]
task = "KNN"
context = "One dense cloud, global outliers"
purpose = "Fast, simple baseline: far from everything means outlying"

[[decisionRows]]
task = "LOF"
context = "Clusters of different densities"
purpose = "Local outliers that sit just outside a tight cluster"

[[decisionRows]]
task = "COF"
context = "Elongated or chain-shaped clusters"
purpose = "Avoids flagging the ends of thin, linear structures"

[[decisionRows]]
task = "ABOD"
context = "Moderate to high dimensions"
purpose = "Angle variance degrades less than distances as dimension grows"

[[inputs]]
id = "data"
label = "Data (X)"
tooltip = "Numeric matrix with observations in rows and features in columns (n x p). The detectors expect observations in columns, so the code passes permutedims(X)."
default = "X"

[[inputs]]
id = "k"
label = "Neighbours (k)"
tooltip = "Number of nearest neighbours; typical values 5 to 20. A larger k smooths the scores; a k smaller than the size of a small outlier group lets the group hide itself."
default = "10"

[[inputs]]
id = "contam"
label = "Contamination"
tooltip = "Expected fraction of outliers in the data, e.g. 0.05 for 5%. Points scoring above the 1 - contamination quantile are flagged."
default = "0.05"

[[inputs]]
id = "reduction"
label = "Reduction"
tooltip = "How the distances to the k neighbours become one score: maximum is the distance to the k-th neighbour, mean and median average over all k neighbours."
kind = "select"
default = "maximum"
models = ["knn"]

[[inputs.options]]
value = "maximum"
label = "maximum"

[[inputs.options]]
value = "mean"
label = "mean"

[[inputs.options]]
value = "median"
label = "median"

[[inputs]]
id = "enhanced"
label = "Variant"
tooltip = "FastABOD measures the variance of angles to the k nearest neighbours only (Kriegel et al. 2008). Enhanced ABOD (Li, Lv and Cheng 2015) uses more stable neighbour relationships."
kind = "select"
default = "false"
models = ["abod"]

[[inputs.options]]
value = "false"
label = "FastABOD"

[[inputs.options]]
value = "true"
label = "Enhanced ABOD"

