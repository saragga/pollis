[[codeBranches]]
model = "knn"
code = '''
using OutlierDetection, OutlierDetectionNeighbors, Statistics

detector = KNNDetector(k={{k}}, reduction=:{{reduction}})  # distance to the k nearest neighbours
model, scores = OutlierDetection.fit(detector, permutedims({{data}}); verbosity=0)  # observations in columns

threshold = quantile(scores, 1 - {{contam}})  # flag the top {{contam}} of scores
outliers  = findall(scores .> threshold)  # row indices of the flagged points
println("Outliers detected: ", length(outliers))
'''

[[codeBranches]]
model = "lof"
code = '''
using OutlierDetection, OutlierDetectionNeighbors, Statistics

detector = LOFDetector(k={{k}})  # local reachability density relative to the neighbours
model, scores = OutlierDetection.fit(detector, permutedims({{data}}); verbosity=0)  # observations in columns

threshold = quantile(scores, 1 - {{contam}})  # LOF near 1 is normal, well above 1 is outlying
outliers  = findall(scores .> threshold)  # row indices of the flagged points
println("Outliers detected: ", length(outliers))
'''

[[codeBranches]]
model = "cof"
code = '''
using OutlierDetection, OutlierDetectionNeighbors, Statistics

detector = COFDetector(k={{k}})  # average chaining distance relative to the neighbours
model, scores = OutlierDetection.fit(detector, permutedims({{data}}); verbosity=0)  # observations in columns

threshold = quantile(scores, 1 - {{contam}})  # flag the top {{contam}} of scores
outliers  = findall(scores .> threshold)  # row indices of the flagged points
println("Outliers detected: ", length(outliers))
'''

[[codeBranches]]
model = "abod"
code = '''
using OutlierDetection, OutlierDetectionNeighbors, Statistics

detector = ABODDetector(k={{k}}, enhanced={{enhanced}})  # inverted variance of angles to pairs of neighbours
model, scores = OutlierDetection.fit(detector, permutedims({{data}}); verbosity=0)  # observations in columns

threshold = quantile(scores, 1 - {{contam}})  # high score = small angle variance = outlying
outliers  = findall(scores .> threshold)  # row indices of the flagged points
println("Outliers detected: ", length(outliers))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "score-scatter"
label = "Score Scatter"
desc = "First two features, coloured by outlier score, with flagged points marked"
code = '''
using Plots, Statistics

threshold = quantile(scores, 1 - {{contam}})
flagged   = scores .> threshold
scatter({{data}}[:, 1], {{data}}[:, 2], zcolor=scores, markerstrokewidth=0, label="Score", xlabel="Feature 1", ylabel="Feature 2")
scatter!({{data}}[flagged, 1], {{data}}[flagged, 2], marker=:x, markersize=6, color=:red, label="Flagged")
'''

[[actionGroups.actions]]
id = "score-histogram"
label = "Score Distribution"
desc = "Histogram of outlier scores with the contamination threshold"
code = '''
using Plots, Statistics

threshold = quantile(scores, 1 - {{contam}})
histogram(scores, bins=40, label="Scores", xlabel="Outlier score", ylabel="Count")
vline!([threshold], color=:red, linestyle=:dash, label="Threshold")  # a clear gap before the tail is reassuring
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "k-sensitivity"
label = "k Sensitivity"
desc = "How stable the flagged set is as k changes"
code = '''
using OutlierDetection, OutlierDetectionNeighbors, Statistics, Plots

{{?model=knn}}Detector = k -> KNNDetector(k=k, reduction=:{{reduction}})  # the chosen settings, only k varies
{{?model=lof}}Detector = k -> LOFDetector(k=k)
{{?model=cof}}Detector = k -> COFDetector(k=k)
{{?model=abod}}Detector = k -> ABODDetector(k=k, enhanced={{enhanced}})
function flagged_set(k)
	_, s = OutlierDetection.fit(Detector(k), permutedims({{data}}); verbosity=0)
	Set(findall(s .> quantile(s, 1 - {{contam}})))
end

ks   = [5, 10, 15, 20, 30]
base = flagged_set({{k}})
jacc = [length(intersect(base, flagged_set(k))) / length(union(base, flagged_set(k))) for k in ks]
plot(ks, jacc, marker=:circle, xlabel="k", ylabel="Jaccard overlap with k = {{k}}", ylims=(0, 1.05), label=false)
'''

[[actionGroups.actions]]
id = "top-outliers"
label = "Top Outliers"
desc = "Row indices and scores of the highest-ranked points"
code = '''
ranked = sortperm(scores, rev=true)  # most outlying first
for i in ranked[1:10]
	println("row ", i, "  score = ", round(scores[i], sigdigits=4))
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "score-new"
label = "Score New Points"
desc = "Apply the fitted detector to new observations X_new"
code = '''
using OutlierDetection, OutlierDetectionNeighbors, Statistics

threshold  = quantile(scores, 1 - {{contam}})  # calibrated on the training scores
new_scores = OutlierDetection.transform(detector, model, permutedims(X_new))  # X_new: rows = observations
new_flags  = new_scores .> threshold
println("Flagged ", sum(new_flags), " of ", length(new_flags), " new points")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-detectors"
label = "Compare All Four"
desc = "Which points KNN, LOF, COF and ABOD agree on"
code = '''
using OutlierDetection, OutlierDetectionNeighbors, Statistics

{{?model=knn}}knn = KNNDetector(k={{k}}, reduction=:{{reduction}})  # the chosen settings for the current detector
{{?model!=knn}}knn = KNNDetector(k={{k}})
{{?model=abod}}abod = ABODDetector(k={{k}}, enhanced={{enhanced}})
{{?model!=abod}}abod = ABODDetector(k={{k}})
detectors = [knn, LOFDetector(k={{k}}), COFDetector(k={{k}}), abod]
labels    = ["KNN", "LOF", "COF", "ABOD"]
flags = reduce(hcat, map(detectors) do d
	_, s = OutlierDetection.fit(d, permutedims({{data}}); verbosity=0)
	s .> quantile(s, 1 - {{contam}})
end)
votes = vec(sum(flags, dims=2))
println("Flagged per detector: ", Dict(zip(labels, vec(sum(flags, dims=1)))))
println("Flagged by 2 or more: ", findall(votes .>= 2))
'''

[[actionGroups.actions]]
id = "rank-correlation"
label = "Rank Correlation"
desc = "Spearman correlation between the four detectors' scores"
code = '''
using OutlierDetection, OutlierDetectionNeighbors, StatsBase

{{?model=knn}}knn = KNNDetector(k={{k}}, reduction=:{{reduction}})  # the chosen settings for the current detector
{{?model!=knn}}knn = KNNDetector(k={{k}})
{{?model=abod}}abod = ABODDetector(k={{k}}, enhanced={{enhanced}})
{{?model!=abod}}abod = ABODDetector(k={{k}})
detectors = [knn, LOFDetector(k={{k}}), COFDetector(k={{k}}), abod]
S = reduce(hcat, [OutlierDetection.fit(d, permutedims({{data}}); verbosity=0)[2] for d in detectors])
display(corspearman(S))  # rows and columns: KNN, LOF, COF, ABOD
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "normalise-scores"
label = "Normalise Scores"
desc = "Rescale scores to [0, 1] and to percentile ranks"
code = '''
using StatsBase

scaled = (scores .- minimum(scores)) ./ (maximum(scores) - minimum(scores))  # [0, 1], sensitive to extremes
pct    = ordinalrank(scores) ./ length(scores)  # percentile rank, comparable across detectors
top    = argmax(scores)
println("Top point: row ", top, ", min-max ", round(scaled[top], digits=3), ", percentile ", round(pct[top], digits=3))
'''

[[actionGroups.actions]]
id = "feature-deviations"
label = "Feature Deviations"
desc = "Standardised feature values of the most outlying point"
code = '''
using Statistics

top = argmax(scores)
z   = ({{data}}[top, :] .- vec(mean({{data}}, dims=1))) ./ vec(std({{data}}, dims=1))  # z-score per feature
for j in sortperm(abs.(z), rev=true)
	println("feature ", j, "  z = ", round(z[j], digits=2))  # large |z| drives the distance
end
'''
