# Simulation-Based Inference Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/sbi.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Simulation-Based Inference"
viewType = "pollis.sbi"
defaultModel = "point"

[[packages]]
name = "NeuralEstimators.jl"
github = "https://github.com/msainsburydale/NeuralEstimators.jl"

[[packages.videos]]
title = "High Performance Computing in Julia"
description = "An 18-video course by Jamie Mair on writing fast Julia code"
url = "https://www.youtube.com/playlist?list=PLUAq6xQKFgGr39PiyrPk_C9dhBKvWcjUA"

[[packages]]
name = "Flux.jl"
github = "https://github.com/FluxML/Flux.jl"

[requires]
packages = ["Plots.jl", "Distributions.jl"]

[[notebookSections]]
label = ""

