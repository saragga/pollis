[[actionGroups.actions]]
id = "risk-adjusted"
label = "Risk-Adjusted Performance"
desc = "Compute Sharpe, Sortino and Calmar ratios together for a full risk-adjusted view"
code = '''
using Statistics

mar     = {{mar}}  # minimum acceptable return per period (also used as the risk-free rate here)
wealth  = cumprod(1 .+ r)
max_dd  = -minimum(wealth ./ max.(1, accumulate(max, wealth)) .- 1)
sharpe  = (mean(r) - mar) / std(r) * sqrt(ppy)  # annualised Sharpe ratio (excess return / total volatility)
sortino = (mean(r) - mar) / sqrt(mean(min.(r .- mar, 0) .^ 2)) * sqrt(ppy)  # annualised Sortino ratio (excess return / downside deviation)
calmar  = (wealth[end]^(ppy / length(r)) - 1) / max_dd  # annualised return / max drawdown
omega   = sum(max.(r .- mar, 0)) / sum(max.(mar .- r, 0))  # gains above MAR / losses below MAR

println("Sharpe:  ", round(sharpe,  digits = 4))
println("Sortino: ", round(sortino, digits = 4))
println("Calmar:  ", round(calmar,  digits = 4))
println("Omega:   ", round(omega,   digits = 4))
'''

[[actionGroups.actions]]
id = "es-decomposition"
label = "CVaR Decomposition"
desc = "Split a portfolio Expected Shortfall into the contribution of each asset"
code = '''
using Statistics

R   = [r (0.5 .* r .+ 0.01 .* randn(length(r))) (0.0002 .+ 0.005 .* randn(length(r)))]  # replace with a T x N matrix of asset returns
wts = [0.5, 0.3, 0.2]  # replace with the portfolio weights (one per column of R)
rp  = R * wts  # portfolio returns
tail = rp .<= quantile(rp, {{alpha}})  # periods in the portfolio tail
es_p = -mean(rp[tail])  # portfolio Expected Shortfall
contrib = -wts .* vec(mean(R[tail, :], dims = 1))  # Euler component ES: weight x mean asset return in the portfolio tail
println("Portfolio ES: ", round(es_p, digits = 4), "  (sum of contributions ", round(sum(contrib), digits = 4), ")")
for (i, c) in enumerate(contrib)
	println("asset ", i, ": ", round(c, digits = 4), "  (", round(100 * c / es_p, digits = 1), "%)")
end
'''
