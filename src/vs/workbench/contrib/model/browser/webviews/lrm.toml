'''

[[actionGroups.actions]]
id = "var-vs-es"
label = "VaR vs Expected Shortfall"
desc = "How far the average tail loss lies beyond VaR"
code = '''
using Statistics

q    = quantile(r, {{alpha}})  # -VaR
tail = r[r .<= q]  # returns in the tail
println("VaR: ", round(-q, digits = 4))
println("ES:  ", round(-mean(tail), digits = 4))  # ES is always at least VaR
println("ES / VaR: ", round(mean(tail) / q, digits = 3))  # about 1.25 for normal returns at 5%
'''

