[[codeBranches]]
model = "dd"
code = '''
using Statistics

r   = {{returns}}  # simple returns, one per period (bound once so every action uses the same series)
ppy = 252  # periods per year: 252 daily, 52 weekly, 12 monthly
wealth = cumprod(1 .+ r)  # value of 1 unit invested
dd     = wealth ./ max.(1, accumulate(max, wealth)) .- 1  # drawdown from the running peak (0 at a new high)
max_dd = -minimum(dd)  # maximum drawdown
avg_dd = -mean(dd[dd .< 0])  # average depth over the periods spent in drawdown
ann    = wealth[end]^(ppy / length(r)) - 1  # annualised (geometric) return
calmar   = ann / max_dd  # annualised return / max drawdown
sterling = ann / (avg_dd + 0.10)  # annualised return / (average drawdown + 10%), the classic Sterling form
mdd(x) = (w = cumprod(1 .+ x); -minimum(w ./ max.(1, accumulate(max, w)) .- 1))  # max drawdown inside one window
roll_dd = [mdd(r[t-{{window}}+1:t]) for t in {{window}}:length(r)]  # rolling max drawdown over {{window}} periods

println("Max Drawdown:   ", round(max_dd,   digits = 4))
println("Avg Drawdown:   ", round(avg_dd,   digits = 4))
println("Calmar Ratio:   ", round(calmar,   digits = 4))
println("Sterling Ratio: ", round(sterling, digits = 4))
println("Worst rolling {{window}}-period drawdown: ", round(maximum(roll_dd), digits = 4))
'''

[[codeBranches]]
model = "dr"
code = '''
using Statistics

r   = {{returns}}  # simple returns, one per period (bound once so every action uses the same series)
ppy = 252  # periods per year: 252 daily, 52 weekly, 12 monthly
mar = {{mar}}  # minimum acceptable return per period
semi_dev  = sqrt(mean(min.(r .- mean(r), 0) .^ 2))  # semi-deviation: shortfalls below the mean
down_dev  = sqrt(mean(min.(r .- mar, 0) .^ 2))  # downside deviation: shortfalls below the MAR
sortino   = (mean(r) - mar) / down_dev * sqrt(ppy)  # annualised excess return over downside deviation
omega     = sum(max.(r .- mar, 0)) / sum(max.(mar .- r, 0))  # gains above MAR / losses below MAR
gain_loss = mean(r[r .> mar] .- mar) / mean(mar .- r[r .< mar])  # average gain / average loss, relative to MAR

println("Semi-Deviation:  ", round(semi_dev,  digits = 4))
println("Downside Dev:    ", round(down_dev,  digits = 4))
println("Sortino Ratio:   ", round(sortino,   digits = 4))
println("Omega Ratio:     ", round(omega,     digits = 4))
println("Gain/Loss Ratio: ", round(gain_loss, digits = 4))
'''

[[codeBranches]]
model = "vr"
code = '''
using Statistics, StatsBase, Distributions

r   = {{returns}}  # simple returns, one per period (bound once so every action uses the same series)
ppy = 252  # periods per year: 252 daily, 52 weekly, 12 monthly
a = {{alpha}}  # tail probability: 0.05 gives the 95% VaR
mu, sd = mean(r), std(r)
S, K = skewness(r), kurtosis(r)  # sample skewness and excess kurtosis
cf(z) = z + (z^2 - 1) * S / 6 + (z^3 - 3z) * K / 24 - (2z^3 - 5z) * S^2 / 36  # Cornish-Fisher adjusted normal quantile
z = quantile(Normal(), a)

var_hist = -quantile(r, a)  # historical simulation VaR (reported as a positive loss)
var_norm = -(mu + sd * z)  # parametric normal VaR
var_cf   = -(mu + sd * cf(z))  # Cornish-Fisher VaR: corrects the normal quantile for skewness and fat tails

println("VaR (Historical):     ", round(var_hist, digits = 4))
println("VaR (Normal):         ", round(var_norm, digits = 4))
println("VaR (Cornish-Fisher): ", round(var_cf,   digits = 4))
'''

[[codeBranches]]
model = "es"
code = '''
using Statistics, StatsBase, Distributions

r   = {{returns}}  # simple returns, one per period (bound once so every action uses the same series)
ppy = 252  # periods per year: 252 daily, 52 weekly, 12 monthly
a = {{alpha}}  # tail probability: 0.05 gives the average loss in the worst 5% of periods
mu, sd = mean(r), std(r)
S, K = skewness(r), kurtosis(r)  # sample skewness and excess kurtosis
cf(z) = z + (z^2 - 1) * S / 6 + (z^3 - 3z) * K / 24 - (2z^3 - 5z) * S^2 / 36  # Cornish-Fisher adjusted normal quantile
u = a .* ((1:1000) .- 0.5) ./ 1000  # grid of tail probabilities in (0, a)

es_hist = -mean(r[r .<= quantile(r, a)])  # historical ES: mean of the returns at or below the VaR cut-off
es_norm = -(mu - sd * pdf(Normal(), quantile(Normal(), a)) / a)  # parametric normal ES
es_cf   = -(mu + sd * mean(cf.(quantile.(Normal(), u))))  # Cornish-Fisher ES: average of the adjusted quantiles below a

println("ES (Historical):     ", round(es_hist, digits = 4))
println("ES (Normal):         ", round(es_norm, digits = 4))
println("ES (Cornish-Fisher): ", round(es_cf,   digits = 4))
'''

