[[inputs]]
id = "returns"
label = "Returns"
tooltip = "Variable name holding your returns vector (e.g. daily or monthly log-returns as a Float64 vector)."
default = "0.0004 .+ 0.01 .* randn(1000)"

[[inputs]]
id = "window"
label = "Window"
tooltip = "Rolling window length in periods for time-varying drawdown statistics."
default = "252"
models = ["dd"]

[[inputs]]
id = "mar"
label = "MAR"
tooltip = "Minimum Acceptable Return (MAR). Returns below this threshold are counted as losses for downside-risk measures. Defaults to 0."
default = "0.0"
models = ["dr"]

[[inputs]]
id = "alpha"
label = "Alpha"
tooltip = "Significance level alpha. For VaR, 0.05 gives the 95% VaR (loss not exceeded 95% of the time); for Expected Shortfall, 0.05 gives the average loss in the worst 5% of outcomes. Use 0.01 for the 99% level."
default = "0.05"
models = ["vr", "es"]

