[[actionGroups.actions]]
id = "var-backtest"
label = "VaR Backtest"
desc = "Count breaches of out-of-sample rolling VaR forecasts and test whether the violation rate matches the confidence level"
code = '''
using Statistics, HypothesisTests

w = 250  # estimation window: each VaR uses only the w periods before the one it is tested on
fc = [-quantile(r[t-w:t-1], {{alpha}}) for t in (w + 1):length(r)]  # out-of-sample VaR forecasts
hits = r[(w + 1):end] .< -fc  # breaches (in-sample VaR would breach at rate alpha by construction)
violations, n = sum(hits), length(hits)

println("Expected violations: ",  round({{alpha}} * n, digits = 1), " of ", n)
println("Observed violations: ",  violations)
println("Violation rate:      ",  round(violations / n, digits = 4))
println("Coverage p-value:    ",  round(pvalue(BinomialTest(violations, n, {{alpha}})), digits = 4))  # exact binomial test of unconditional coverage (the Kupiec LR test is its large-sample version)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "rolling-var"
label = "Rolling VaR Forecast"
desc = "One-step-ahead historical VaR (and ES) from a moving window"
code = '''
using Statistics

w = 250  # estimation window
fc = [-quantile(r[t-w:t-1], {{alpha}}) for t in (w + 1):(length(r) + 1)]  # VaR forecast for period t; the last one is for the next, unseen period
println("Next-period VaR forecast: ", round(last(fc), digits = 4))
{{?model=es}}fes = [-mean(filter(<=(-v), r[t-w:t-1])) for (t, v) in zip((w + 1):(length(r) + 1), fc)]  # ES forecast: mean of the window tail
{{?model=es}}println("Next-period ES forecast:  ", round(last(fes), digits = 4))
'''

[[actionGroups.actions]]
id = "horizon-var"
label = "Multi-Period VaR"
desc = "Scale the one-period normal VaR to a longer horizon, and check it against overlapping h-period returns"
code = '''
using Distributions, Statistics

h  = 10  # horizon in periods
mu, sd = mean(r), std(r)
z  = quantile(Normal(), {{alpha}})
var_h = -(h * mu + sqrt(h) * sd * z)  # square-root-of-time rule: valid only for iid returns (no autocorrelation, no volatility clustering)
println(h, "-period VaR (sqrt-of-time): ", round(var_h, digits = 4))
{{?model=es}}println(h, "-period ES (sqrt-of-time):  ", round(-(h * mu - sqrt(h) * sd * pdf(Normal(), z) / {{alpha}}), digits = 4))

rh = [sum(r[t:t+h-1]) for t in 1:(length(r) - h + 1)]  # overlapping h-period returns (log-return additivity; close for small returns)
println(h, "-period VaR (historical):   ", round(-quantile(rh, {{alpha}}), digits = 4))  # no iid assumption, but overlapping windows are dependent
println("Lag-1 autocorrelation: ", round(cor(r[1:end-1], r[2:end]), digits = 3), "  (far from 0 = the sqrt-of-time rule is off)")
'''

