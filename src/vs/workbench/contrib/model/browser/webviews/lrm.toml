# Loss Risk Measures Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/lrm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Loss Risk Measures"
viewType = "pollis.lrm"
defaultModel = "dd"

[[packages]]
name = "PerformanceAnalytics.jl"
github = "https://github.com/eohne/PerformanceAnalytics.jl"

[requires]
packages = ["Plots.jl", "Distributions.jl", "StatsBase.jl"]

