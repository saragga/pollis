# Regime Switching Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/rsm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Regime Switching Models"
viewType = "pollis.rsm"
defaultModel = "msm"

[[packages]]
name = "MarSwitching.jl"
github = "https://github.com/m-dadej/MarSwitching.jl"

[requires]
packages = ["MarSwitching.jl", "Plots.jl", "HypothesisTests.jl", "StatsBase.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Markov Switching Regression"
file = "rsm/tutorial-01-msm.ipynb"
bundled = true
description = "Simulate a two-regime model, estimate it and read the summary table"

[[notebookSections.notebooks]]
name = "Regime Probabilities"
file = "rsm/tutorial-02-probabilities.ipynb"
bundled = true
description = "Filtered and smoothed probabilities, regime dating and expected durations"

[[notebookSections.notebooks]]
name = "Markov Switching ARCH"
file = "rsm/tutorial-03-msarch.ipynb"
bundled = true
description = "Volatility regimes with regime-specific ARCH dynamics"

[[notebookSections.notebooks]]
name = "Time-Varying Transition Probabilities"
file = "rsm/tutorial-04-tvtp.ipynb"
bundled = true
description = "Let a leading indicator drive the probability of switching regime"

