[[models]]
id = "msm"
label = "MS Regression"

[[models]]
id = "msar"
label = "MS Autoregression"

[[models]]
id = "msarch"
label = "MS-ARCH"

[[models]]
id = "tvtp"
label = "Time-Varying Transitions"

[[bullets]]
text = "MS Regression"
detail = "intercept, slopes and variance switch with an unobserved Markov regime (Hamilton, 1989)"

[[bullets]]
text = "MS Autoregression"
detail = "regime-specific autoregressive dynamics on the lags of the series"

[[bullets]]
text = "MS-ARCH"
detail = "volatility clusters within each regime through a regime-specific ARCH process"

[[bullets]]
text = "Time-Varying Transitions"
detail = "switching probabilities driven by exogenous variables (Filardo, 1994)"

[[decisionRows]]
task = "MS Regression"
context = "A relationship that seems to change between calm and turbulent periods, expansions and recessions"
purpose = "Estimates one set of coefficients and one variance per regime, the transition matrix and the probability of each regime at every date"

[[decisionRows]]
task = "MS Autoregression"
context = "A single series whose persistence or mean reversion differs between regimes (GDP growth, interest rates)"
purpose = "Regime-specific AR coefficients on the lagged series: business-cycle dating in the spirit of Hamilton (1989)"

[[decisionRows]]
task = "MS-ARCH"
context = "Returns with volatility clustering that also jumps between low- and high-volatility states"
purpose = "Each regime carries its own ARCH(q) variance, so volatility clusters within a regime while the regime itself switches"

[[decisionRows]]
task = "Time-Varying Transitions"
context = "A leading indicator (spreads, VIX, sentiment) plausibly raises the chance of entering a crisis regime"
purpose = "Transition probabilities become logistic functions of the indicator, so expected regime durations vary over time"

[[inputs]]
id = "yvar"
label = "Data variable"
tooltip = "The dependent series (a Vector of Float64), oldest observation first."
default = "y"

[[inputs]]
id = "k"
label = "Regimes k"
tooltip = "Number of regimes. Two or three is typical; the likelihood gets harder to maximise as k grows, so more than 4 or 5 is rarely advisable."
default = "2"

[[inputs]]
id = "p"
label = "AR lags p"
tooltip = "Number of lags of the series used as regime-switching regressors (built with add_lags, which drops the first p observations)."
default = "1"
models = ["msar"]

[[inputs]]
id = "q"
label = "ARCH order q"
tooltip = "Order of the regime-specific ARCH process: lagged squared residuals in each regime variance equation."
default = "1"
models = ["msarch"]

[[inputs]]
id = "intercept"
label = "Intercept"
tooltip = "Whether the intercept differs between regimes, is common to all regimes, or is left out."
kind = "select"
default = "switching"
newRow = true

[[inputs.options]]
value = "switching"
label = "Switching"

[[inputs.options]]
value = "non-switching"
label = "Non-switching"

[[inputs.options]]
value = "no"
label = "None"

[[inputs]]
id = "switchvar"
label = "Variance"
tooltip = "Whether each regime has its own error variance (the usual choice) or all regimes share one."
kind = "select"
default = "true"

[[inputs.options]]
value = "true"
label = "Switching"

[[inputs.options]]
value = "false"
label = "Common"

[[inputs]]
id = "dist"
label = "Error distribution"
tooltip = "Distribution of the errors. Student-t and GED estimate a regime-specific shape parameter (degrees of freedom for t; GED shape 2 = normal, 1 = Laplace)."
kind = "select"
default = ":normal"

[[inputs.options]]
value = ":normal"
label = "Normal"

[[inputs.options]]
value = ":t"
label = "Student-t"

[[inputs.options]]
value = ":ged"
label = "Generalised Error"

[[inputs]]
id = "xs"
label = "Switching regressors"
tooltip = "Optional Vector or Matrix of regressors whose slopes differ between regimes (same number of rows as the data). Leave empty for none."
default = ""
models = ["msm", "msarch", "tvtp"]
newRow = true

[[inputs]]
id = "xns"
label = "Non-switching regressors"
tooltip = "Optional Vector or Matrix of regressors whose slopes are the same in every regime. Leave empty for none."
default = ""
models = ["msm", "msarch", "tvtp"]

[[inputs]]
id = "ztvtp"
label = "Transition drivers"
tooltip = "Vector or Matrix of variables driving the transition probabilities, for example a lagged VIX or term spread. A column of ones is added for the constant."
default = "z"
models = ["tvtp"]

[[codeBranches]]
model = "msm"
code = '''
using MarSwitching, Random

Random.seed!(0)  # the likelihood has local maxima: fix the seed for reproducible starts
yt = Float64.({{yvar}})
fitms(k; kw...) = MSModel(yt, k;
    intercept = "{{intercept}}",
{{?xs!=}}    exog_switching_vars = {{xs}},  # slopes that differ by regime
{{?xns!=}}    exog_vars = {{xns}},  # slopes shared by all regimes
    switching_var = {{switchvar}},
    error_dist = {{dist}}, kw...)
model = fitms({{k}})  # {{k}}-regime Markov switching regression

summary_msm(model)  # coefficients per regime, transition matrix, expected durations
'''

[[codeBranches]]
model = "msar"
code = '''
using MarSwitching, Random

Random.seed!(0)  # the likelihood has local maxima: fix the seed for reproducible starts
X = add_lags(Float64.({{yvar}}), {{p}})  # column 1 = y_t, then y_(t-1) ... y_(t-{{p}})
yt = X[:, 1]
fitms(k; kw...) = MSModel(yt, k;
    intercept = "{{intercept}}",
    exog_switching_vars = X[:, 2:end],  # AR coefficients that differ by regime
    switching_var = {{switchvar}},
    error_dist = {{dist}}, kw...)
model = fitms({{k}})  # {{k}}-regime Markov switching AR({{p}})

summary_msm(model)  # coefficients per regime, transition matrix, expected durations
'''

[[codeBranches]]
model = "msarch"
code = '''
using MarSwitching, Random

Random.seed!(0)  # the likelihood has local maxima: fix the seed for reproducible starts
yt = Float64.({{yvar}})
fitms(k; kw...) = MSARCHModel(yt, k, {{q}};
    intercept = "{{intercept}}",
{{?xs!=}}    exog_switching_vars = {{xs}},  # slopes that differ by regime
{{?xns!=}}    exog_vars = {{xns}},  # slopes shared by all regimes
    switching_var = {{switchvar}},
    error_dist = {{dist}}, kw...)
model = fitms({{k}})  # {{k}}-regime Markov switching ARCH({{q}})

summary_msm(model)  # coefficients and ARCH terms per regime, transition matrix
'''

[[codeBranches]]
model = "tvtp"
code = '''
using MarSwitching, Random

Random.seed!(0)  # the likelihood has local maxima: fix the seed for reproducible starts
yt = Float64.({{yvar}})
Z = [ones(length(yt)) {{ztvtp}}]  # constant + drivers of the transition probabilities
fitms(k; kw...) = MSModel(yt, k;
    intercept = "{{intercept}}",
{{?xs!=}}    exog_switching_vars = {{xs}},  # slopes that differ by regime
{{?xns!=}}    exog_vars = {{xns}},  # slopes shared by all regimes
    switching_var = {{switchvar}},
    exog_tvtp = Z,
    error_dist = {{dist}}, kw...)
model = fitms({{k}})  # {{k}}-regime model with time-varying transitions

summary_msm(model)  # coefficients per regime and the transition equation
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "probabilities"
label = "Regime Probabilities"
desc = "Filtered probabilities (using data up to each date) above smoothed probabilities (using the whole sample): when each regime was in force"
code = '''
using MarSwitching, Plots
lab = permutedims(["regime $i" for i in 1:model.k])
p1 = plot(filtered_probs(model), lw=1.5, label=lab, title="Filtered probabilities")
p2 = plot(smoothed_probs(model), lw=1.5, label=lab, title="Smoothed probabilities", xlabel="t")
plot(p1, p2, layout=(2, 1), ylims=(0, 1))
'''

[[actionGroups.actions]]
id = "series-regime"
label = "Series Coloured by Regime"
desc = "The data with each observation coloured by its most probable smoothed regime: a quick visual dating of the regimes"
code = '''
using MarSwitching, Plots
s = [argmax(r) for r in eachrow(smoothed_probs(model))]  # most probable regime at each date
plot(yt, c=:gray, alpha=0.4, label=false, xlabel="t", title="Series by most probable regime")
scatter!(1:length(yt), yt, group=["regime $i" for i in s], ms=2.5, msw=0)
'''

[[actionGroups.actions]]
id = "variance"
label = "Conditional Variance by Regime"
desc = "The ARCH conditional variance of each regime over time (MS-ARCH only): how volatility clusters inside each regime"
code = '''
using MarSwitching, Plots
{{?model!=msarch}} error("Conditional variances are defined for the MS-ARCH model only")
h = conditional_variance(model)  # T x k regime-conditional variances
plot(sqrt.(h), lw=1.2, label=permutedims(["regime $i" for i in 1:model.k]), xlabel="t", ylabel="conditional std. dev.", title="Volatility by regime")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals"
label = "Residual Checks"
desc = "Residuals from the probability-weighted fit: Ljung-Box on the residuals and their squares, Jarque-Bera for normality, and the residual ACF"
code = '''
using MarSwitching, HypothesisTests, StatsBase, Plots
r = yt .- predict(model, true)  # instantaneous fit: regime means weighted by filtered probabilities
L = min(20, length(r) ÷ 4); band = 1.96 / sqrt(length(r))
display((ljung_box_p = pvalue(LjungBoxTest(r, L)), ljung_box_squared_p = pvalue(LjungBoxTest(r .^ 2, L)), jarque_bera_p = pvalue(JarqueBeraTest(r))))
bar(1:L, autocor(r, 1:L), legend=false, xlabel="Lag", title="Residual ACF")
hline!([-band, band], c=:red, ls=:dash)
'''

[[actionGroups.actions]]
id = "restarts"
label = "Stability Across Starting Values"
desc = "Refits the model from random starting values: log-likelihoods that disagree mean the optimiser is finding different local maxima"
code = '''
using MarSwitching, Random
fits = [(Random.seed!(s); fitms({{k}}; random_search=3)) for s in 1:5]
(this_fit = round(model.Likelihood, digits=2), restarts = [round(m.Likelihood, digits=2) for m in fits])
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "one-step"
label = "One-Step-Ahead Forecasts"
desc = "One-step-ahead predictions (regime probabilities are projected forward through the transition matrix, so there is no look-ahead) against the data"
code = '''
using MarSwitching, Statistics, Plots
yhat = predict(model, false)  # forecasts for t = 2..T
e = yt[2:end] .- yhat
display((rmse = sqrt(mean(e .^ 2)), mae = mean(abs.(e))))
plot(2:length(yt), [yt[2:end] yhat], lw=[1 1.5], ls=[:solid :dash], label=["data" "one-step forecast"], xlabel="t", title="One-step-ahead forecasts")
'''

[[actionGroups.actions]]
id = "simulate"
label = "Simulated Paths and Value-at-Risk"
desc = "Simulates 1,000 observations from the fitted model: the distribution of outcomes including regime changes, with its 1% and 5% quantiles"
code = '''
using MarSwitching, Statistics, Plots
ysim, ssim = generate_msm(model, 1000)[1:2]  # simulated data and regime path
display((var_5pct = quantile(ysim, 0.05), var_1pct = quantile(ysim, 0.01), share_in_regime = [mean(ssim .== i) for i in 1:model.k]))
histogram(ysim, bins=60, normalize=true, label="simulated", title="Simulated distribution")
vline!([quantile(ysim, 0.05)], c=:red, ls=:dash, label="5% quantile")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "k-select"
label = "Number of Regimes (AIC and BIC)"
desc = "Refits the model with 2, 3 and 4 regimes and compares information criteria from the log-likelihood and parameter count"
code = '''
using MarSwitching
function ic(m)
    n = length(m.raw_params)  # estimated parameters
    (aic = round(-2m.Likelihood + 2n, digits=1), bic = round(-2m.Likelihood + n * log(m.T), digits=1))
end
[(k = k, ic(fitms(k))...) for k in 2:4]
'''

[[actionGroups.actions]]
id = "grid"
label = "Specification Search"
desc = "grid_search_msm searches regimes, intercept type, switching of each regressor and of the variance, and keeps the best model by AIC; it needs switching regressors (or the autoregression lags) and does not cover MS-ARCH or time-varying transitions"
code = '''
using MarSwitching
{{?model=msar}} Xg = X[:, 2:end]
{{?model!=msar}} Xg = {{xs}}  # regressors to test as switching or not
best, crit, space = grid_search_msm(yt, Xg, "AIC"; k=[2, 3], random_n=20, verbose=false)
summary_msm(best)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "transitions"
label = "Transition Matrix and Durations"
desc = "The left-stochastic transition matrix, the expected duration of each regime and the long-run (ergodic) share of time spent in each"
code = '''
using MarSwitching
transition_mat(model)  # column j: probabilities of moving from regime j
{{?model!=tvtp}} display((expected_duration = expected_duration(model), long_run_share = ergodic_probs(model)))
{{?model=tvtp}} display(expected_duration(model, Z))  # T x k: expected duration at each date, given the drivers
'''

[[actionGroups.actions]]
id = "coefficients"
label = "Coefficients by Regime"
desc = "Estimates with standard errors, z statistics and p-values for each regime: which effects genuinely differ between regimes"
code = '''
using MarSwitching
for s in 1:model.k
    state_coeftable(model, s)
end
{{?model=tvtp}} coeftable_tvtp(model)  # coefficients of the transition equation
'''
