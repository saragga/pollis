[[codeBranches]]
model = "adagrad"
code = '''
using Optimisers, Enzyme, Random, LinearAlgebra, Statistics

f(x) = {{f}}
x0    = {{x0}}  # initial parameters
iters = {{iters}}  # update steps
noise = {{noise}}  # std of the gradient noise (stands in for minibatch sampling)
rule(lr) = AdaGrad(lr)  # divides by the root of the accumulated squared gradients

function train(r; x0=x0, iters=iters, noise=noise, seed=1)
    rng = Xoshiro(seed)
    x = copy(x0)
    state = Optimisers.setup(r, x)
    path, losses = [copy(x)], [f(x)]
    for _ in 1:iters
        g = Enzyme.gradient(Reverse, f, x)[1] .+ noise .* randn(rng, length(x))  # noisy gradient
        state, x = Optimisers.update(state, x, g)
        push!(path, copy(x)); push!(losses, f(x))
    end
    (x = x, path = path, losses = losses)
end

trained = train(rule({{lr}}))
x_opt = trained.x
(final_parameters = x_opt, final_loss = f(x_opt), mean_loss_last_10pct = mean(trained.losses[end - div(iters, 10):end]))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "loss-curve"
label = "Loss Curve"
desc = "Loss per iteration with a 50-step moving average (log scale): the plateau is the noise floor set by the learning rate and the gradient noise"
code = '''
using Plots

L = trained.losses
ma = [mean(L[max(1, i - 49):i]) for i in eachindex(L)]
plot(0:length(L)-1, L, yscale=:log10, alpha=0.35, label="loss", xlabel="iteration")
plot!(0:length(L)-1, ma, linewidth=2, label="moving average")
'''

[[actionGroups.actions]]
id = "param-trajectory"
label = "Parameter Trajectory"
desc = "The noisy iterates on the contours of f (2D problems; other parameters held at the final value)"
code = '''
using Plots

P = reduce(hcat, trained.path)
pad = max(0.5, 0.15 * maximum(abs, P[1:2, :]))
xs = range(minimum(P[1, :]) - pad, maximum(P[1, :]) + pad, length=120)
ys = range(minimum(P[2, :]) - pad, maximum(P[2, :]) + pad, length=120)
contour(xs, ys, (a, b) -> log1p(f([a; b; x_opt[3:end]]) - minimum(trained.losses) + 1e-12), fill=true, colorbar=false, xlabel="x1", ylabel="x2")
plot!(P[1, :], P[2, :], color=:white, linewidth=0.8, label="iterates")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "lr-sensitivity"
label = "Learning-Rate Sensitivity"
desc = "Average loss over the last 10% of iterations for a grid of learning rates (log-log): too small stalls, too large diverges or bounces"
code = '''
using Plots

lrs = 10.0 .^ (-4:0.5:0)
tail(L) = mean(L[end - div(length(L), 10):end])
scores = [tail(train(rule(a)).losses) for a in lrs]
plot(lrs, scores, xscale=:log10, yscale=:log10, marker=:circle, xlabel="learning rate", ylabel="late average loss", legend=false)
vline!([{{lr}}], linestyle=:dash)
'''

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Final true-gradient norm, and whether the loss has flattened: the slope of the late losses and their spread around the noise floor"
code = '''
k = div(iters, 10)
late = trained.losses[end - k:end]
slope = cov(collect(0:k), late) / var(collect(0:k))  # near 0 = stationary
(gradient_norm = norm(Enzyme.gradient(Reverse, f, x_opt)[1]), late_mean = mean(late), late_std = std(late), late_slope = slope, stationary = abs(slope) * k < std(late))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "evaluate-new"
label = "Evaluate at New Point"
desc = "Loss at a new parameter vector, compared with the trained one"
code = '''
x_new = x_opt .+ 0.1  # replace with the parameters to evaluate
(loss_new = f(x_new), loss_trained = f(x_opt), difference = f(x_new) - f(x_opt))
'''

[[actionGroups.actions]]
id = "iterate-averaging"
label = "Iterate Averaging"
desc = "Polyak-Ruppert averaging: the mean of the second half of the iterates cancels much of the noise and usually lands closer to the minimum than the last iterate"
code = '''
x_avg = mean(trained.path[div(end, 2):end])
(last_iterate = x_opt, loss_last = f(x_opt), averaged = x_avg, loss_averaged = f(x_avg))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-sg-methods"
label = "Compare Methods"
desc = "SGD, momentum, Nesterov, Adam, AdaMax and AdaGrad at the same learning rate: late average loss over 5 seeds (mean and spread)"
code = '''
rules = ["SGD" => Descent, "Momentum" => Momentum, "Nesterov" => Nesterov, "Adam" => Adam, "AdaMax" => AdaMax, "AdaGrad" => AdaGrad]
tail(L) = mean(L[end - div(length(L), 10):end])
map(rules) do (name, R)
    s = [tail(train(R({{lr}}); seed=k).losses) for k in 1:5]
    (method = name, late_loss_mean = mean(s), late_loss_std = std(s))
end
'''

[[actionGroups.actions]]
id = "noise-robustness"
label = "Noise Robustness"
desc = "Late average loss against the gradient-noise level for each method: how gracefully each degrades from the deterministic case"
code = '''
using Plots

levels = [0.0, 0.1, 0.5, 1.0, 2.0]
tail(L) = mean(L[end - div(length(L), 10):end])
p = plot(xlabel="gradient noise", ylabel="late average loss", yscale=:log10)
for (name, R) in ["SGD" => Descent, "Adam" => Adam, "AdaMax" => AdaMax, "AdaGrad" => AdaGrad]
    plot!(p, levels, [tail(train(R({{lr}}); noise=s).losses) .+ eps() for s in levels], marker=:circle, label=name)
end
p
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "solution-summary"
label = "Solution Summary"
desc = "Final parameters, loss, improvement over the start and the gradient norm"
code = '''
(parameters = x_opt, loss = f(x_opt), loss_start = f(x0), improvement = f(x0) - f(x_opt),
 gradient_norm = norm(Enzyme.gradient(Reverse, f, x_opt)[1]), iterations = iters)
'''

[[actionGroups.actions]]
id = "per-parameter"
label = "Per-Parameter Progress"
desc = "Distance travelled, late jitter and remaining gradient for each parameter: adaptive methods even out progress across badly scaled parameters"
code = '''
P = reduce(hcat, trained.path)
late = P[:, end - div(iters, 10):end]
g = Enzyme.gradient(Reverse, f, x_opt)[1]
[(parameter = i, start = x0[i], final = x_opt[i], travelled = abs(x_opt[i] - x0[i]), late_std = std(late[i, :]), gradient = g[i]) for i in eachindex(x0)]
'''
