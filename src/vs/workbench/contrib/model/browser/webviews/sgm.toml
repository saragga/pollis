[[bullets]]
text = "SGD"
detail = "stochastic gradient descent; simple, noisy updates scaled by a fixed learning rate"

[[bullets]]
text = "Adam"
detail = "adaptive moment estimation; per-parameter rates via first and second gradient moments"

[[bullets]]
text = "AdaMax"
detail = "Adam variant with L∞ norm update; robust for embeddings and sparse gradients"

[[bullets]]
text = "AdaGrad"
detail = "accumulates squared gradients per parameter; large automatic decay for frequent features"

[[decisionRows]]
task = "SGD"
context = "Well-scaled problems, or a baseline with a tuned learning-rate schedule"
purpose = "Step against the noisy gradient with a fixed learning rate; simple, but sensitive to the rate and the scaling"

[[decisionRows]]
task = "Adam"
context = "Default for deep learning and noisy, badly scaled gradients"
purpose = "Momentum on the gradient plus a per-parameter scale from its running second moment"

[[decisionRows]]
task = "AdaMax"
context = "Gradients with occasional large spikes"
purpose = "Adam with an infinity-norm scale instead of the second moment; more stable step sizes"

[[decisionRows]]
task = "AdaGrad"
context = "Sparse features where rare parameters need larger steps"
purpose = "Divide each step by the root of the accumulated squared gradients; steps shrink over time"

[[inputs]]
id = "f"
label = "Objective f(x)"
tooltip = "Julia expression for the scalar loss to minimise. Use x[1], x[2], ... for the components. The panel adds Gaussian noise to its gradient to imitate minibatch sampling."
default = "(x[1] - 1)^2 + 10 * (x[2] + 0.5)^2"

[[inputs]]
id = "x0"
label = "Initial Parameters x0"
tooltip = "Starting parameter vector as a Julia array. In network training this is a random initialisation; here it is fixed for reproducibility."
default = "[-2.0, 1.5]"

[[inputs]]
id = "lr"
label = "Learning Rate"
tooltip = "Step size. SGD is sensitive to it (typically 0.001 to 0.1); Adam and AdaMax work well near 0.001 to 0.01; AdaGrad adapts per parameter and tolerates larger values."
default = "0.01"
newRow = true

[[inputs]]
id = "iters"
label = "Iterations"
tooltip = "Number of update steps (in training: batches per epoch times epochs)."
default = "2000"

[[inputs]]
id = "noise"
label = "Gradient Noise"
tooltip = "Standard deviation of the Gaussian noise added to each gradient, standing in for minibatch sampling error. 0 gives the deterministic method."
default = "0.5"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.sgd]
# A jittery descent path toward the centre of the contours
svg = '''
var s = '';
[20, 13, 6].forEach(function (r) { s += '<ellipse cx="30" cy="46" rx="' + r + '" ry="' + (r * 0.55) + '" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.6"/>'; });
return s + '<path d="M9,60 L14,52 L13,56 L19,49 L21,53 L24,47 L27,50 L29,45 L31,47" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="9" cy="60" r="2" fill="currentColor"/>';
'''

[miniCharts.adam]
# Loss curve with a smoothed momentum curve over the noisy one
svg = '''
var n = 'M8,32', m = 'M8,32';
for (var x = 8; x <= 46; x += 2) { var y = 32 + 30 * (1 - Math.exp(-(x - 8) / 9)); n += ' L' + x + ',' + (y + ((x / 2) % 2 ? 3 : -3)).toFixed(1); m += ' L' + x + ',' + y.toFixed(1); }
return '<path d="' + n + '" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.5"/><path d="' + m + '" fill="none" stroke="currentColor" stroke-width="1.4"/>';
'''

[miniCharts.adamax]
# Gradient bars capped by a max-norm line
svg = '''
var s = '', h = [10, 14, 30, 12, 9, 16, 11];
h.forEach(function (v, i) { s += '<rect x="' + (9 + 5 * i) + '" y="' + (64 - Math.min(v, 18)) + '" width="3.5" height="' + Math.min(v, 18) + '" fill="currentColor" opacity="0.6"/>'; });
return s + '<line x1="7" y1="46" x2="46" y2="46" stroke="currentColor" stroke-width="1" stroke-dasharray="3,2"/>';
'''

[miniCharts.adagrad]
# Step sizes shrinking as squared gradients accumulate
svg = '''
var s = '';
for (var i = 0; i < 7; i++) { var h = 30 / Math.sqrt(i + 1); s += '<rect x="' + (9 + 5 * i) + '" y="' + (64 - h).toFixed(1) + '" width="3.5" height="' + h.toFixed(1) + '" fill="currentColor" opacity="0.65"/>'; }
return s;
'''

[[codeBranches]]
model = "sgd"
code = '''
using Optimisers, Enzyme, Random, LinearAlgebra, Statistics

f(x) = {{f}}
x0    = {{x0}}  # initial parameters
iters = {{iters}}  # update steps
noise = {{noise}}  # std of the gradient noise (stands in for minibatch sampling)
rule(lr) = Descent(lr)  # x -= lr * g

function train(r; x0=x0, iters=iters, noise=noise, seed=1)
    rng = Xoshiro(seed)
    x = copy(x0)
    state = Optimisers.setup(r, x)
    path, losses = [copy(x)], [f(x)]
    for _ in 1:iters
        g = Enzyme.gradient(Reverse, f, x)[1] .+ noise .* randn(rng, length(x))  # noisy gradient
        state, x = Optimisers.update(state, x, g)
        push!(path, copy(x)); push!(losses, f(x))
    end
    (x = x, path = path, losses = losses)
end

trained = train(rule({{lr}}))
x_opt = trained.x
(final_parameters = x_opt, final_loss = f(x_opt), mean_loss_last_10pct = mean(trained.losses[end - div(iters, 10):end]))
'''

[[codeBranches]]
