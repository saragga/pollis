    path, losses = [copy(x)], [f(x)]
    for _ in 1:iters
        g = Enzyme.gradient(Reverse, f, x)[1] .+ noise .* randn(rng, length(x))  # noisy gradient
        state, x = Optimisers.update(state, x, g)
        push!(path, copy(x)); push!(losses, f(x))
    end
    (x = x, path = path, losses = losses)
end

trained = train(rule({{lr}}))
x_opt = trained.x
(final_parameters = x_opt, final_loss = f(x_opt), mean_loss_last_10pct = mean(trained.losses[end - div(iters, 10):end]))
'''

