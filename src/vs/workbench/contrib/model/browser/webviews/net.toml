name = "Graphs.jl"
github = "https://juliagraphs.org/Graphs.jl/stable/"

[[packages]]
name = "MetaGraphsNext.jl"
github = "https://github.com/JuliaGraphs/MetaGraphsNext.jl"

[requires]
packages = ["Graphs.jl", "MetaGraphsNext.jl", "GLMakie.jl"]

