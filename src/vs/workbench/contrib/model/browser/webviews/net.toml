# Network Analysis Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/net.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Network Analysis"
viewType = "pollis.net"
defaultModel = "erdos"

