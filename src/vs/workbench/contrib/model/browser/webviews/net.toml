# Network Analysis Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/net.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Network Analysis"
viewType = "pollis.net"
defaultModel = "erdos"

[[packages]]
name = "Graphs.jl"
github = "https://juliagraphs.org/Graphs.jl/stable/"

[[packages]]
name = "MetaGraphsNext.jl"
github = "https://github.com/JuliaGraphs/MetaGraphsNext.jl"

[requires]
packages = ["Graphs.jl", "MetaGraphsNext.jl", "GLMakie.jl", "StatsBase.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Erdos-Renyi Random Graph"
file = "net/tutorial-01-erdos-renyi.ipynb"
