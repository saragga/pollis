[[codeBranches]]
model = "grasp"
code = '''
using Random, LinearAlgebra, Statistics

# a random travelling-salesman instance: minimise the length of a closed tour
n = {{n}}  # cities
Random.seed!(1)
pts = rand(2, n)  # cities in the unit square
D = [norm(pts[:, i] - pts[:, j]) for i in 1:n, j in 1:n]
tourlen(t) = sum(D[t[i], t[mod1(i + 1, length(t))]] for i in eachindex(t))
maxiter = {{maxiter}}  # iterations

# neighbourhoods: each applies the first improving move it finds and reports whether it found one
function two_opt!(t)  # reverse a segment
    m = length(t)
    for i in 1:m-2, j in i+2:m
        (i == 1 && j == m) && continue
        a, b, c, d = t[i], t[i+1], t[j], t[mod1(j + 1, m)]
        if D[a, c] + D[b, d] < D[a, b] + D[c, d] - 1e-12
            reverse!(t, i + 1, j); return true
        end
    end
    false
end
function or_opt!(t)  # move a segment of 1 to 3 cities elsewhere, possibly reversed
    m = length(t)
    for len in 1:3, i in 1:m-len+1
        seg = t[i:i+len-1]
        prev, next = t[mod1(i - 1, m)], t[mod1(i + len, m)]
        gain = D[prev, seg[1]] + D[seg[end], next] - D[prev, next]
        rest = [t[1:i-1]; t[i+len:end]]
        for j in eachindex(rest), s in (seg, reverse(seg))
            p, q = rest[j], rest[mod1(j + 1, length(rest))]
            if D[p, s[1]] + D[s[end], q] - D[p, q] < gain - 1e-12
                t .= [rest[1:j]; s; rest[j+1:end]]; return true
            end
        end
    end
    false
end
function swap!(t)  # exchange two cities
    before = tourlen(t)
    for i in 1:length(t)-1, j in i+1:length(t)
        t[i], t[j] = t[j], t[i]
        tourlen(t) < before - 1e-12 && return true
        t[i], t[j] = t[j], t[i]
    end
    false
end
NAMES = ["2-opt", "or-opt", "swap"]
NB = [two_opt!, or_opt!, swap!][1:clamp({{k}}, 1, 3)]  # neighbourhoods in use

# Variable Neighbourhood Descent: back to the first neighbourhood after every improvement
function vnd!(t, NB, moves)
    k = 1
    while k <= length(NB)
        if NB[k](t)
            moves[k] += 1; k = 1
        else
            k += 1
        end
    end
    t
end

# greedy construction with a restricted candidate list (alpha = 0: nearest neighbour)
function construct(alpha)
    t = [rand(1:n)]; left = setdiff(1:n, t)
    while !isempty(left)
        d = [D[t[end], c] for c in left]
        lo, hi = extrema(d)
        c = left[rand(findall(d .<= lo + alpha * (hi - lo)))]
        push!(t, c); deleteat!(left, findfirst(==(c), left))
    end
    t
end

ALPHA = {{alpha}}  # greediness

function search(; iters=maxiter, seed=1, NB=NB, seconds=Inf)
    Random.seed!(seed); t0 = time()
    best, bestlen, trace, moves = Int[], Inf, Float64[], zeros(Int, length(NB))
    for it in 1:iters
        t = vnd!(construct(ALPHA), NB, moves)  # randomised greedy construction, then local search
        tourlen(t) < bestlen && ((best, bestlen) = (t, tourlen(t)))
        push!(trace, bestlen)
        time() - t0 > seconds && break
    end
    (tour = best, len = bestlen, trace = trace, moves = moves)
end

res = search()
best_tour, best_len = res.tour, res.len
(tour_length = best_len, tour = best_tour, iterations = length(res.trace), improving_moves = NAMES[1:length(NB)] .=> res.moves)
'''

[[codeBranches]]
model = "vnd"
code = '''
using Random, LinearAlgebra, Statistics

# a random travelling-salesman instance: minimise the length of a closed tour
n = {{n}}  # cities
Random.seed!(1)
pts = rand(2, n)  # cities in the unit square
D = [norm(pts[:, i] - pts[:, j]) for i in 1:n, j in 1:n]
tourlen(t) = sum(D[t[i], t[mod1(i + 1, length(t))]] for i in eachindex(t))
maxiter = {{maxiter}}  # iterations

# neighbourhoods: each applies the first improving move it finds and reports whether it found one
function two_opt!(t)  # reverse a segment
    m = length(t)
    for i in 1:m-2, j in i+2:m
        (i == 1 && j == m) && continue
        a, b, c, d = t[i], t[i+1], t[j], t[mod1(j + 1, m)]
        if D[a, c] + D[b, d] < D[a, b] + D[c, d] - 1e-12
            reverse!(t, i + 1, j); return true
        end
    end
    false
end
function or_opt!(t)  # move a segment of 1 to 3 cities elsewhere, possibly reversed
    m = length(t)
    for len in 1:3, i in 1:m-len+1
        seg = t[i:i+len-1]
        prev, next = t[mod1(i - 1, m)], t[mod1(i + len, m)]
        gain = D[prev, seg[1]] + D[seg[end], next] - D[prev, next]
        rest = [t[1:i-1]; t[i+len:end]]
        for j in eachindex(rest), s in (seg, reverse(seg))
            p, q = rest[j], rest[mod1(j + 1, length(rest))]
            if D[p, s[1]] + D[s[end], q] - D[p, q] < gain - 1e-12
                t .= [rest[1:j]; s; rest[j+1:end]]; return true
            end
        end
    end
    false
end
function swap!(t)  # exchange two cities
    before = tourlen(t)
    for i in 1:length(t)-1, j in i+1:length(t)
        t[i], t[j] = t[j], t[i]
        tourlen(t) < before - 1e-12 && return true
        t[i], t[j] = t[j], t[i]
    end
    false
end
NAMES = ["2-opt", "or-opt", "swap"]
NB = [two_opt!, or_opt!, swap!][1:clamp({{k}}, 1, 3)]  # neighbourhoods in use

# Variable Neighbourhood Descent: back to the first neighbourhood after every improvement
function vnd!(t, NB, moves)
    k = 1
    while k <= length(NB)
        if NB[k](t)
            moves[k] += 1; k = 1
        else
            k += 1
        end
    end
    t
end

# greedy construction with a restricted candidate list (alpha = 0: nearest neighbour)
function construct(alpha)
    t = [rand(1:n)]; left = setdiff(1:n, t)
    while !isempty(left)
        d = [D[t[end], c] for c in left]
        lo, hi = extrema(d)
        c = left[rand(findall(d .<= lo + alpha * (hi - lo)))]
        push!(t, c); deleteat!(left, findfirst(==(c), left))
    end
    t
end

function search(; iters=maxiter, seed=1, NB=NB, seconds=Inf)
    Random.seed!(seed); t0 = time()
    best, bestlen, trace, moves = Int[], Inf, Float64[], zeros(Int, length(NB))
    for it in 1:iters
        start = it == 1 ? construct(0.0) : randperm(n)  # nearest neighbour first, then random tours
        t = vnd!(start, NB, moves)
        tourlen(t) < bestlen && ((best, bestlen) = (t, tourlen(t)))
        push!(trace, bestlen)
        time() - t0 > seconds && break
    end
    (tour = best, len = bestlen, trace = trace, moves = moves)
end

res = search()
best_tour, best_len = res.tour, res.len
(tour_length = best_len, tour = best_tour, iterations = length(res.trace), improving_moves = NAMES[1:length(NB)] .=> res.moves)
'''

[[codeBranches]]
model = "vns"
code = '''
using Random, LinearAlgebra, Statistics

# a random travelling-salesman instance: minimise the length of a closed tour
n = {{n}}  # cities
Random.seed!(1)
pts = rand(2, n)  # cities in the unit square
D = [norm(pts[:, i] - pts[:, j]) for i in 1:n, j in 1:n]
tourlen(t) = sum(D[t[i], t[mod1(i + 1, length(t))]] for i in eachindex(t))
maxiter = {{maxiter}}  # iterations

# neighbourhoods: each applies the first improving move it finds and reports whether it found one
function two_opt!(t)  # reverse a segment
    m = length(t)
    for i in 1:m-2, j in i+2:m
        (i == 1 && j == m) && continue
        a, b, c, d = t[i], t[i+1], t[j], t[mod1(j + 1, m)]
        if D[a, c] + D[b, d] < D[a, b] + D[c, d] - 1e-12
            reverse!(t, i + 1, j); return true
        end
    end
    false
end
function or_opt!(t)  # move a segment of 1 to 3 cities elsewhere, possibly reversed
    m = length(t)
    for len in 1:3, i in 1:m-len+1
        seg = t[i:i+len-1]
        prev, next = t[mod1(i - 1, m)], t[mod1(i + len, m)]
        gain = D[prev, seg[1]] + D[seg[end], next] - D[prev, next]
        rest = [t[1:i-1]; t[i+len:end]]
        for j in eachindex(rest), s in (seg, reverse(seg))
            p, q = rest[j], rest[mod1(j + 1, length(rest))]
            if D[p, s[1]] + D[s[end], q] - D[p, q] < gain - 1e-12
                t .= [rest[1:j]; s; rest[j+1:end]]; return true
            end
        end
    end
    false
end
function swap!(t)  # exchange two cities
    before = tourlen(t)
    for i in 1:length(t)-1, j in i+1:length(t)
        t[i], t[j] = t[j], t[i]
        tourlen(t) < before - 1e-12 && return true
        t[i], t[j] = t[j], t[i]
    end
    false
end
NAMES = ["2-opt", "or-opt", "swap"]
NB = [two_opt!, or_opt!, swap!][1:clamp({{k}}, 1, 3)]  # neighbourhoods in use

# Variable Neighbourhood Descent: back to the first neighbourhood after every improvement
function vnd!(t, NB, moves)
    k = 1
    while k <= length(NB)
        if NB[k](t)
            moves[k] += 1; k = 1
        else
            k += 1
        end
    end
    t
end

# greedy construction with a restricted candidate list (alpha = 0: nearest neighbour)
function construct(alpha)
    t = [rand(1:n)]; left = setdiff(1:n, t)
    while !isempty(left)
        d = [D[t[end], c] for c in left]
        lo, hi = extrema(d)
        c = left[rand(findall(d .<= lo + alpha * (hi - lo)))]
        push!(t, c); deleteat!(left, findfirst(==(c), left))
    end
    t
end

KMAX = {{kmax}}  # shaking levels

# shaking at level s: s random double-bridge moves (segments A B C D become A C B D)
function shake(t, s)
    u = copy(t)
    for _ in 1:s
        a, b, c = sort(randperm(length(u) - 1)[1:3])
        u = [u[1:a]; u[b+1:c]; u[a+1:b]; u[c+1:end]]
    end
    u
end

function search(; iters=maxiter, seed=1, NB=NB, seconds=Inf)
    Random.seed!(seed); t0 = time()
    moves = zeros(Int, length(NB))
    best = vnd!(construct(0.0), NB, moves); bestlen = tourlen(best)
    trace, s = Float64[], 1
    for it in 1:iters
        t = vnd!(shake(best, s), NB, moves)
        if tourlen(t) < bestlen - 1e-12
            best, bestlen, s = t, tourlen(t), 1  # improvement: accept and reset the strength
        else
            s = s == KMAX ? 1 : s + 1  # otherwise shake harder
        end
        push!(trace, bestlen)
        time() - t0 > seconds && break
    end
    (tour = best, len = bestlen, trace = trace, moves = moves)
end

res = search()
best_tour, best_len = res.tour, res.len
(tour_length = best_len, tour = best_tour, iterations = length(res.trace), improving_moves = NAMES[1:length(NB)] .=> res.moves)
'''

