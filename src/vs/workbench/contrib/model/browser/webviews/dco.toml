id = "summary"
label = "Summary"
desc = "Configuration and result of the run"
code = '''
{{?model=grasp}}(method = "GRASP", alpha = ALPHA,
{{?model=vnd}}(method = "VND with restarts",
{{?model=vns}}(method = "VNS", shaking_levels = KMAX,
 cities = n, neighbourhoods = NAMES[1:length(NB)], iterations = length(res.trace), improving_moves = res.moves, length = best_len)
'''

[[actionGroups.actions]]
id = "nhood-effectiveness"
label = "Neighbourhood Analysis"
desc = "Whether each of the three neighbourhoods can still improve the best tour (a tour that none improves is a local optimum for all of them)"
code = '''
map(zip(NAMES, [two_opt!, or_opt!, swap!])) do (name, nb!)
    t = copy(best_tour)
    (neighbourhood = name, in_use = nb! in NB, finds_improvement = nb!(t), length_after_one_move = tourlen(t))
end
'''

[[actionGroups.actions]]
id = "obj-gap"
label = "Objective Gap"
desc = "Tour length against a lower bound on the optimum (TravelingSalesmanHeuristics.jl) and the nearest-neighbour tour"
code = '''
using TravelingSalesmanHeuristics

lb = lowerbound(D)
Random.seed!(1)
(length = best_len, lower_bound = lb, gap_to_bound = best_len / lb - 1, nearest_neighbour = tourlen(construct(0.0)))
'''
