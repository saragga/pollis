tooltip = "How many local-search neighbourhoods to use, in order: 1 = 2-opt, 2 = 2-opt and or-opt, 3 = 2-opt, or-opt and swap."
default = "3"

[[inputs]]
id = "maxiter"
label = "Iterations"
tooltip = "GRASP: construction and improvement rounds. VND: descents (the first from a nearest-neighbour tour, then from random tours). VNS: shaking and descent rounds."
default = "100"

[[inputs]]
id = "alpha"
label = "Greediness (alpha)"
tooltip = "Restricted candidate list: the next city is chosen among those within alpha * (range of distances) of the nearest one; 0 = pure nearest neighbour, 1 = uniformly random."
