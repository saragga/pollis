[[decisionRows]]
task = "VNS"
context = "Rugged landscapes where descent alone gets stuck"
purpose = "Variable Neighbourhood Search: perturb (shake) the best solution with increasing strength, descend with VND, and accept only improvements, resetting the strength on success"

