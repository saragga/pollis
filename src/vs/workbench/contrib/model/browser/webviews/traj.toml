K = tvlqr(X, U)
map([0.9, 1.0, 1.1]) do s
    g(x, u) = s .* f(x, u)
    step(x, u) = (k1 = g(x, u); k2 = g(x .+ dt / 2 .* k1, u); k3 = g(x .+ dt / 2 .* k2, u); k4 = g(x .+ dt .* k3, u); x .+ dt / 6 .* (k1 .+ 2 .* k2 .+ 2 .* k3 .+ k4))
    xo = copy(x0); xc = copy(x0)
    for k in 1:N-1
        xo = step(xo, U[k]); xc = step(xc, U[k] - K[k] * (xc - X[k]))
    end
    (dynamics_scale = s, open_loop_error = norm(xo - xf), feedback_error = norm(xc - xf))
end
'''

