[[bullets]]
text = "Direct Methods (Direct Collocation)"
detail = "Transcribe continuous trajectory problem into a finite-dimensional nonlinear program. Discretize state and control along a time grid, enforce dynamics constraints at collocation points. Fast for long horizons; requires NLP solver."

[[bullets]]
text = "Indirect Methods (Iterative LQR)"
detail = "Refine trajectory iteratively via successive quadratic approximation (iLQR). Linearise dynamics and quadraticise cost around current trajectory. Backward sweep computes optimal control gains, forward sweep integrates improved trajectory."

[[bullets]]
text = "Differential Dynamic Programming (DDP)"
detail = "Second-order indirect method using backward-forward sweep with second-order Taylor expansion. More accurate than iLQR for highly nonlinear problems; locally quadratic convergence."

[[bullets]]
text = "Augmented Lagrangian Trajectory Optimizer (ALTRO)"
detail = "Combines DDP with constraint handling via augmented Lagrangian framework. Solves constrained trajectory problems (equality and inequality constraints). State-of-the-art solver for nonlinear robotics."

[[decisionRows]]
task = "Direct Methods"
context = "General problems with path constraints and bounds; a good NLP solver is available"
purpose = "Transcribe states and controls at every node into one large NLP (here trapezoidal collocation solved by Ipopt)"

[[decisionRows]]
task = "Indirect Methods"
context = "Smooth unconstrained problems where high accuracy is wanted and a good costate guess exists"
purpose = "Pontryagin's principle: shoot on the initial costate until the terminal transversality condition holds"

[[decisionRows]]
task = "Differential Dynamic Programming"
context = "Unconstrained or softly constrained problems; also yields feedback gains"
purpose = "Backward pass of local quadratic value models, forward rollout with the updated controls (iLQR form)"

[[decisionRows]]
task = "ALTRO"
context = "Control or state limits with the speed of DDP"
purpose = "Augmented Lagrangian outer loop that prices the constraints around an iLQR inner solver"

[[inputs]]
id = "f"
label = "Dynamics f(x, u)"
tooltip = "Continuous-time dynamics returning dx/dt as a Julia vector, in terms of the state vector x and control vector u. Default: a damped pendulum with torque input (swing-up)."
default = "[x[2], -9.81 * sin(x[1]) - 0.1 * x[2] + u[1]]"

[[inputs]]
id = "x0"
label = "Initial State"
tooltip = "Starting state as a Julia vector of length n."
default = "[0.0, 0.0]"

[[inputs]]
id = "xf"
label = "Target State"
tooltip = "Goal state as a Julia vector of length n; the running and terminal costs penalise the distance to it."
default = "[pi, 0.0]"

[[inputs]]
id = "Q"
label = "State Cost Q"
tooltip = "Symmetric positive-semidefinite (n x n) running penalty on x - xf."
default = "Diagonal([0.1, 0.1])"
newRow = true

[[inputs]]
id = "R"
label = "Control Cost R"
tooltip = "Symmetric positive-definite (m x m) running penalty on u; its size also sets the number of controls m."
default = "fill(0.1, 1, 1)"

[[inputs]]
id = "Qf"
label = "Terminal Cost Qf"
tooltip = "Symmetric positive-semidefinite (n x n) penalty on x(tf) - xf. Large values make the target an almost hard constraint."
default = "Diagonal([100.0, 100.0])"

[[inputs]]
id = "N"
label = "Knot Points"
tooltip = "Number of time nodes; the step is dt = tf / (N - 1). More nodes are more accurate and slower."
default = "101"
newRow = true

[[inputs]]
id = "tf"
label = "Time Horizon"
tooltip = "Total duration of the trajectory in seconds."
default = "5.0"

[[inputs]]
id = "umax"
label = "Control Bound"
tooltip = "Limit on every control, |u| <= umax. Use Inf for no bound."
default = "5.0"
models = ["direct", "altro"]

[[inputs]]
id = "maxiter"
label = "Max Iterations"
tooltip = "Maximum iterations of the solver (Newton iterations on the costate for the indirect method, iLQR sweeps for DDP and ALTRO)."
default = "200"
models = ["indirect", "ddp", "altro"]

[[inputs]]
id = "tol"
label = "Tolerance"
tooltip = "Convergence tolerance: relative cost decrease for DDP, maximum constraint violation for the ALTRO outer loop."
default = "1e-6"
models = ["ddp", "altro"]

[[inputs]]
id = "rho"
label = "Initial Penalty"
tooltip = "Initial augmented Lagrangian penalty weight; multiplied by 10 after each outer iteration while the constraints are violated."
default = "1.0"
models = ["altro"]

