desc = "Execute the plan under random state disturbances: open-loop controls against time-varying LQR feedback around the trajectory"
code = '''
using Random, Plots

K = tvlqr(X, U)
function execute(feedback; sigma=0.02, seed=1)
    rng = Xoshiro(seed); x = copy(x0); xs = [x]
    for k in 1:N-1
        u = feedback ? U[k] - K[k] * (x - X[k]) : U[k]
        x = rk4(x, u) .+ sigma .* randn(rng, n); push!(xs, x)
    end
    xs
end
ol, cl = execute(false), execute(true)
display(plot(range(0, tf, length=N), [first.(X) first.(ol) first.(cl)], label=["plan" "open loop" "TVLQR feedback"], xlabel="time", ylabel="x1"))
(open_loop_final_error = norm(ol[end] - xf), feedback_final_error = norm(cl[end] - xf))
'''

