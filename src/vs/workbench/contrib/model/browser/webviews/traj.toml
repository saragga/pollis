[[codeBranches]]
model = "direct"
code = '''
using ForwardDiff, LinearAlgebra

f(x, u) = {{f}}  # continuous-time dynamics dx/dt
x0, xf = {{x0}}, {{xf}}  # start and target
Q, R, Qf = {{Q}}, {{R}}, {{Qf}}  # running state, running control and terminal weights
N, tf = {{N}}, {{tf}}  # knot points and horizon
dt = tf / (N - 1)
n, m = length(x0), size(R, 1)

rk4step(F, z) = (k1 = F(z); k2 = F(z .+ dt / 2 .* k1); k3 = F(z .+ dt / 2 .* k2); k4 = F(z .+ dt .* k3); z .+ dt / 6 .* (k1 .+ 2 .* k2 .+ 2 .* k3 .+ k4))
rk4(x, u) = rk4step(y -> f(y, u), x)  # discrete dynamics x[k+1] = rk4(x[k], u[k])
stage(x, u) = (dot(x - xf, Q * (x - xf)) + dot(u, R * u)) / 2
terminal(x) = dot(x - xf, Qf * (x - xf)) / 2
total(X, U) = sum(stage(X[k], U[k]) for k in 1:N-1) + terminal(X[N])
rollout(U; x0=x0) = (X = [x0]; for u in U; push!(X, rk4(X[end], u)); end; X)

# time-varying LQR around a nominal trajectory: feedback gains u = U[k] - K[k] (x - X[k])
function tvlqr(X, U)
    P = Matrix(Qf); K = Vector{Matrix{Float64}}(undef, N - 1)
    for k in N-1:-1:1
        Ak = ForwardDiff.jacobian(x -> rk4(x, U[k]), X[k]); Bk = ForwardDiff.jacobian(u -> rk4(X[k], u), U[k])
        K[k] = (R + Bk' * P * Bk) \ (Bk' * P * Ak)
        P = Q + Ak' * P * (Ak - Bk * K[k])
    end
    K
end

using JuMP, Ipopt
umax = {{umax}}

function plan(x0)
    model = Model(Ipopt.Optimizer); set_silent(model)
    @variable(model, xv[i = 1:n, k = 1:N], start = x0[i] + (xf[i] - x0[i]) * (k - 1) / (N - 1))  # straight-line initial guess
    @variable(model, -umax <= uv[1:m, 1:N] <= umax)
    @constraint(model, xv[:, 1] .== x0)
    for k in 1:N-1  # trapezoidal collocation of the dynamics
        @constraint(model, xv[:, k+1] .== xv[:, k] .+ dt / 2 .* (f(xv[:, k], uv[:, k]) .+ f(xv[:, k+1], uv[:, k+1])))
    end
    @objective(model, Min, sum(stage(xv[:, k], uv[:, k]) for k in 1:N-1) + terminal(xv[:, N]))
    optimize!(model)
    (X = [value.(xv[:, k]) for k in 1:N], U = [value.(uv[:, k]) for k in 1:N-1], model = model)
end

result = plan(x0)
X, U = result.X, result.U
(final_state = X[end], target = xf, terminal_error = norm(X[end] - xf), cost = total(X, U), peak_control = maximum(norm, U))
'''

[[codeBranches]]
model = "indirect"
code = '''
using ForwardDiff, LinearAlgebra

f(x, u) = {{f}}  # continuous-time dynamics dx/dt
x0, xf = {{x0}}, {{xf}}  # start and target
Q, R, Qf = {{Q}}, {{R}}, {{Qf}}  # running state, running control and terminal weights
N, tf = {{N}}, {{tf}}  # knot points and horizon
dt = tf / (N - 1)
n, m = length(x0), size(R, 1)

rk4step(F, z) = (k1 = F(z); k2 = F(z .+ dt / 2 .* k1); k3 = F(z .+ dt / 2 .* k2); k4 = F(z .+ dt .* k3); z .+ dt / 6 .* (k1 .+ 2 .* k2 .+ 2 .* k3 .+ k4))
rk4(x, u) = rk4step(y -> f(y, u), x)  # discrete dynamics x[k+1] = rk4(x[k], u[k])
stage(x, u) = (dot(x - xf, Q * (x - xf)) + dot(u, R * u)) / 2
terminal(x) = dot(x - xf, Qf * (x - xf)) / 2
total(X, U) = sum(stage(X[k], U[k]) for k in 1:N-1) + terminal(X[N])
rollout(U; x0=x0) = (X = [x0]; for u in U; push!(X, rk4(X[end], u)); end; X)

# time-varying LQR around a nominal trajectory: feedback gains u = U[k] - K[k] (x - X[k])
function tvlqr(X, U)
    P = Matrix(Qf); K = Vector{Matrix{Float64}}(undef, N - 1)
    for k in N-1:-1:1
        Ak = ForwardDiff.jacobian(x -> rk4(x, U[k]), X[k]); Bk = ForwardDiff.jacobian(u -> rk4(X[k], u), U[k])
        K[k] = (R + Bk' * P * Bk) \ (Bk' * P * Ak)
        P = Q + Ak' * P * (Ak - Bk * K[k])
    end
    K
end

using NLsolve

# Pontryagin: H = stage + lambda' f; with control-affine dynamics, dH/du = 0 gives u = -R^-1 f_u' lambda
ham(x, u, lam) = stage(x, u) + dot(lam, f(x, u))
ustar(x, lam) = -(R \ (ForwardDiff.jacobian(v -> f(x, v), zeros(eltype(x), m))' * lam))
function canonical(z)  # state and costate equations
    x, lam = z[1:n], z[n+1:end]
    u = ustar(x, lam)
    vcat(f(x, u), -ForwardDiff.gradient(y -> ham(y, u, lam), x))
end
shoot(lam0; x0=x0) = (Z = [vcat(x0, lam0)]; for _ in 1:N-1; push!(Z, rk4step(canonical, Z[end])); end; Z)

function plan(x0; lam0=zeros(n))
    # transversality: lambda(tf) = gradient of the terminal cost
    residual(l) = (z = shoot(l; x0=x0)[end]; z[n+1:end] - Qf * (z[1:n] - xf))
    sol = nlsolve(residual, lam0; autodiff=:forward, iterations={{maxiter}})
    Z = shoot(sol.zero; x0=x0)
    (X = [z[1:n] for z in Z], U = [ustar(z[1:n], z[n+1:end]) for z in Z[1:N-1]], sol = sol)
end

result = plan(x0)
X, U = result.X, result.U
(final_state = X[end], target = xf, terminal_error = norm(X[end] - xf), cost = total(X, U), peak_control = maximum(norm, U))
'''

[[codeBranches]]
model = "ddp"
code = '''
using ForwardDiff, LinearAlgebra

f(x, u) = {{f}}  # continuous-time dynamics dx/dt
x0, xf = {{x0}}, {{xf}}  # start and target
Q, R, Qf = {{Q}}, {{R}}, {{Qf}}  # running state, running control and terminal weights
N, tf = {{N}}, {{tf}}  # knot points and horizon
dt = tf / (N - 1)
n, m = length(x0), size(R, 1)

rk4step(F, z) = (k1 = F(z); k2 = F(z .+ dt / 2 .* k1); k3 = F(z .+ dt / 2 .* k2); k4 = F(z .+ dt .* k3); z .+ dt / 6 .* (k1 .+ 2 .* k2 .+ 2 .* k3 .+ k4))
rk4(x, u) = rk4step(y -> f(y, u), x)  # discrete dynamics x[k+1] = rk4(x[k], u[k])
stage(x, u) = (dot(x - xf, Q * (x - xf)) + dot(u, R * u)) / 2
terminal(x) = dot(x - xf, Qf * (x - xf)) / 2
total(X, U) = sum(stage(X[k], U[k]) for k in 1:N-1) + terminal(X[N])
rollout(U; x0=x0) = (X = [x0]; for u in U; push!(X, rk4(X[end], u)); end; X)

# time-varying LQR around a nominal trajectory: feedback gains u = U[k] - K[k] (x - X[k])
function tvlqr(X, U)
    P = Matrix(Qf); K = Vector{Matrix{Float64}}(undef, N - 1)
    for k in N-1:-1:1
        Ak = ForwardDiff.jacobian(x -> rk4(x, U[k]), X[k]); Bk = ForwardDiff.jacobian(u -> rk4(X[k], u), U[k])
        K[k] = (R + Bk' * P * Bk) \ (Bk' * P * Ak)
        P = Q + Ak' * P * (Ak - Bk * K[k])
    end
    K
end

# iLQR: quadratic models of the cost and linear models of the dynamics along the current trajectory
function ilqr(stagek; U=[zeros(m) for _ in 1:N-1], maxiter={{maxiter}}, tol={{tol}})
    X = rollout(U)
    Jof(X, U) = sum(stagek(X[k], U[k], k) for k in 1:N-1) + terminal(X[N])
    J = Jof(X, U); history = [J]; mu = 1e-6
    Ks = Vector{Matrix{Float64}}(undef, N - 1); ds = Vector{Vector{Float64}}(undef, N - 1)
    for _ in 1:maxiter
        Vx = ForwardDiff.gradient(terminal, X[N]); Vxx = ForwardDiff.hessian(terminal, X[N])
        for k in N-1:-1:1  # backward pass
            Ak = ForwardDiff.jacobian(x -> rk4(x, U[k]), X[k]); Bk = ForwardDiff.jacobian(u -> rk4(X[k], u), U[k])
            lz(z) = stagek(z[1:n], z[n+1:end], k)
            g = ForwardDiff.gradient(lz, vcat(X[k], U[k])); H = ForwardDiff.hessian(lz, vcat(X[k], U[k]))
            Qx = g[1:n] + Ak' * Vx; Qu = g[n+1:end] + Bk' * Vx
            Qxx = H[1:n, 1:n] + Ak' * Vxx * Ak; Quu = H[n+1:end, n+1:end] + Bk' * Vxx * Bk + mu * I
            Qux = H[n+1:end, 1:n] + Bk' * Vxx * Ak
            Ks[k] = -(Quu \ Qux); ds[k] = -(Quu \ Qu)
            Vx = Qx + Ks[k]' * Quu * ds[k] + Ks[k]' * Qu + Qux' * ds[k]
            Vxx = Matrix(Symmetric(Qxx + Ks[k]' * Quu * Ks[k] + Ks[k]' * Qux + Qux' * Ks[k]))
        end
        improved = false
        for a in (1.0, 0.5, 0.25, 0.1, 0.03, 0.01)  # forward pass with a backtracking line search
            Xn = [x0]; Un = similar(U)
            for k in 1:N-1
                Un[k] = U[k] + a * ds[k] + Ks[k] * (Xn[k] - X[k])
                push!(Xn, rk4(Xn[k], Un[k]))
            end
            Jn = Jof(Xn, Un)
            if Jn < J
                X, U, improved = Xn, Un, true
                break
            end
        end
        if !improved
            mu *= 10  # regularise the backward pass and retry
            mu > 1e8 && break
            continue
        end
        mu = max(mu / 10, 1e-8)
        push!(history, Jof(X, U))
        if abs(history[end-1] - history[end]) < tol * max(1.0, abs(history[end]))
            break
        end
        J = history[end]
    end
    (X = X, U = U, K = Ks, history = history)
end

plan(x0) = ilqr((x, u, k) -> stage(x, u))

result = plan(x0)
X, U = result.X, result.U
(final_state = X[end], target = xf, terminal_error = norm(X[end] - xf), cost = total(X, U), peak_control = maximum(norm, U))
'''

