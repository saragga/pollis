label = "Discretisation Accuracy"
desc = "Integrate the same piecewise-constant controls with 1, 4 and 16 RK4 sub-steps per interval: how much the final state moves tells whether N is fine enough"
code = '''
map([1, 4, 16]) do s
    x = copy(x0); h = dt / s
    for u in U, _ in 1:s
        k1 = f(x, u); k2 = f(x .+ h / 2 .* k1, u); k3 = f(x .+ h / 2 .* k2, u); k4 = f(x .+ h .* k3, u)
        x = x .+ h / 6 .* (k1 .+ 2 .* k2 .+ 2 .* k3 .+ k4)
    end
    (substeps = s, final_state = x, terminal_error = norm(x - xf))
end
'''

