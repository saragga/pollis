[[inputs]]
id = "f"
label = "Drift f(X,t)"
tooltip = "Drift function f(X, p, t) defining the deterministic part of the SDE. Example: -0.5*X for mean-reversion."
default = "-0.5*X"

[[inputs]]
id = "g"
label = "Diffusion g(X,t)"
tooltip = "Diffusion function g(X, p, t). Use a constant for additive noise (e.g. 0.3) or a state expression for multiplicative noise (e.g. 0.2*X)."
default = "0.3"

[[inputs]]
id = "X0"
label = "Initial state X0"
tooltip = "Initial condition for each trajectory in the ensemble."
default = "1.0"

[[inputs]]
id = "T"
label = "Time span T"
tooltip = "End time T. For Invariant Distribution use a long horizon (e.g. 1000.0) so paths converge to the stationary measure."
default = "20.0"
models = ["paths", "inv"]

[[inputs]]
id = "threshold"
label = "Threshold"
tooltip = "Value of X at which each path is terminated. The first passage time is the time to reach this threshold from X0. The default 0.0 is the long-run mean of the default Ornstein-Uhlenbeck process; a level far outside its stationary spread (sd 0.3) is almost never reached, and every path is then censored at the horizon."
default = "0.0"
models = ["fpt"]

[[inputs]]
id = "solver"
label = "Solver"
tooltip = "StochasticDiffEq.jl solver applied to each trajectory in the ensemble. Adaptive solvers (SRIW1, LambaEM) choose dt automatically; fixed-step solvers (EM, RKMil) require a dt value."
kind = "select"
default = "SRIW1"
newRow = true

[[inputs.options]]
value = "SRIW1"
label = "SRIW1 (Adaptive, Strong 3/2)"

[[inputs.options]]
value = "EM"
label = "EM (Fixed Step, Strong 1/2)"

[[inputs.options]]
value = "LambaEM"
label = "LambaEM (Adaptive, Strong 1/2)"

[[inputs.options]]
value = "RKMil"
label = "RKMil (Fixed Step, Strong 1)"

[[inputs]]
id = "N"
label = "Trajectories N"
tooltip = "Number of independent paths to simulate. Larger N gives better statistical estimates at higher compute cost."
default = "500"

[[inputs]]
id = "dt"
label = "Step size dt"
tooltip = "Fixed time step for the selected solver. Required for EM and RKMil; not needed for adaptive solvers."
default = "0.01"
when = "solver!=SRIW1|LambaEM"

[[codeBranches]]
model = "paths"
code = '''
using StochasticDiffEq, Statistics  # path statistics: E[X(t)] and Var[X(t)] over N trajectories

f(X, p, t) = {{f}}  # drift
g(X, p, t) = {{g}}  # diffusion
prob = SDEProblem(f, g, {{X0}}, (0.0, {{T}}))  # base SDE problem
{{?solver=SRIW1|LambaEM}} ens  = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}})  # {{N}} parallel paths
{{?solver!=SRIW1|LambaEM}} ens  = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}}, dt={{dt}})  # {{N}} parallel paths

t_grid    = range(0.0, {{T}}, length=200)  # evaluation time grid
mean_path = [mean(s(t) for s in ens) for t in t_grid]  # E[X(t)] at each grid point
std_path  = [std(s(t)  for s in ens) for t in t_grid]  # std[X(t)]: width of uncertainty band
'''

[[codeBranches]]
model = "fpt"
code = '''
using StochasticDiffEq, Statistics  # first passage time: distribution of hitting times to threshold

f(X, p, t) = {{f}}; g(X, p, t) = {{g}}  # drift and diffusion

condition(X, t, integ) = X - {{threshold}}  # event: X crosses threshold = {{threshold}}
affect!(integ)          = terminate!(integ)  # terminate path on first crossing
cb = ContinuousCallback(condition, affect!)  # callback that stops each path at threshold

prob = SDEProblem(f, g, {{X0}}, (0.0, 1000.0))  # long horizon: paths terminate early via callback
{{?solver=SRIW1|LambaEM}} ens  = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}}, callback=cb)  # run ensemble with termination callback
{{?solver!=SRIW1|LambaEM}} ens  = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}}, callback=cb, dt={{dt}})  # run ensemble with termination callback
hit  = [sol.t[end] < 1000.0 for sol in ens]  # paths stopped by the threshold; the others are censored at the horizon
fpt  = [sol.t[end] for sol in ens][hit]  # first passage times of the paths that crossed
println("Crossed: ", count(hit), " of ", length(hit), " paths")
println("Mean FPT: ", mean(fpt), "  Std: ", std(fpt))  # summary statistics (conditional on crossing before the horizon)
'''

[[codeBranches]]
model = "inv"
code = '''
using StochasticDiffEq, StatsBase  # invariant distribution: stationary density from terminal ensemble values

f(X, p, t) = {{f}}; g(X, p, t) = {{g}}  # drift and diffusion
prob = SDEProblem(f, g, {{X0}}, (0.0, {{T}}))  # long horizon T = {{T}} for stationarity
{{?solver=SRIW1|LambaEM}} ens  = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}})  # {{N}} independent long paths
{{?solver!=SRIW1|LambaEM}} ens  = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}}, dt={{dt}})  # {{N}} independent long paths

terminal = [sol.u[end] for sol in ens]  # terminal values: samples from stationary distribution
h = fit(Histogram, terminal, nbins=50)  # histogram approximation of the invariant density
println("Stationary mean: ", mean(terminal), "  Std: ", std(terminal))  # sample statistics
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fan-chart"
label = "Fan Chart"
desc = "Mean path with two bands: mean +/- 2 sd of the paths (where individual paths lie) and mean +/- 2 standard errors (the Monte Carlo uncertainty of the mean itself)"
code = '''
using StochasticDiffEq, Statistics, Plots  # fan chart: mean +/- 2 sd of the paths and mean +/- 2 standard errors

f(X,p,t)={{f}}; g(X,p,t)={{g}}  # drift and diffusion
prob = SDEProblem(f,g,{{X0}},(0.0,{{T}}))
{{?solver=SRIW1|LambaEM}} ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}})  # {{N}} paths
{{?solver!=SRIW1|LambaEM}} ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}}, dt={{dt}})  # {{N}} paths
t  = range(0.0,{{T}},length=200)  # time grid
mu = [mean(s(ti) for s in ens) for ti in t]  # mean path
sd = [std(s(ti) for s in ens)  for ti in t]  # std path
plot(t, mu, ribbon=2 .* sd, fillalpha=0.15, label="paths: mean +/- 2 sd")  # spread of individual paths, not a confidence band
plot!(t, mu, ribbon=2 .* sd ./ sqrt({{N}}), fillalpha=0.5, label="mean +/- 2 standard errors")  # confidence band for E[X(t)]
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence-n"
label = "Convergence in N"
desc = "E[X(T)] and sd[X(T)] with their Monte Carlo standard errors as the ensemble grows; for an Ornstein-Uhlenbeck process (linear drift, constant diffusion) also the exact moments and the z-score of the estimate"
code = '''
using StochasticDiffEq, Statistics  # verify E[X(T)] converges with ensemble size

f(X,p,t)={{f}}; g(X,p,t)={{g}}  # drift and diffusion
prob = SDEProblem(f, g, {{X0}}, (0.0, {{T}}))  # base problem
T, x0 = {{T}}, {{X0}}

# exact moments when the drift is -theta X and the diffusion a constant sigma (detected numerically)
theta = f(0.0, nothing, 0.0) - f(1.0, nothing, 0.0)
sigma = g(0.0, nothing, 0.0)
is_ou = f(0.0, nothing, 0.0) == 0 && isapprox(f(2.0, nothing, 0.0), -2theta) && g(1.0, nothing, 0.0) == sigma && theta > 0
exact_mean = is_ou ? x0 * exp(-theta * T) : NaN
exact_sd   = is_ou ? abs(sigma) * sqrt((1 - exp(-2theta * T)) / (2theta)) : NaN
is_ou && println("Exact OU moments: E[X(T)] = ", round(exact_mean, sigdigits=4), ", sd[X(T)] = ", round(exact_sd, sigdigits=4))

for N in [50, 100, 250, 500, 1000]  # sweep ensemble sizes
{{?solver=SRIW1|LambaEM}}    ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories=N)
{{?solver!=SRIW1|LambaEM}}    ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories=N, dt={{dt}})
    xT = [s.u[end] for s in ens]
    m, sd = mean(xT), std(xT)
    se = sd / sqrt(N)  # Monte Carlo standard error of the mean
    print("N=", N, "  E[X(T)]=", round(m, sigdigits=4), " (se ", round(se, sigdigits=2), ")  sd[X(T)]=", round(sd, sigdigits=4), " (se ", round(sd / sqrt(2 * (N - 1)), sigdigits=2), ")")
    println(is_ou ? "  z vs exact mean = " * string(round((m - exact_mean) / se, digits=2)) : "")  # z = (estimate - exact mean) / standard error
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "quantile-bands"
label = "Quantile Bands"
desc = "Compute 10th, 50th, 90th percentile envelopes over the ensemble"
code = '''
using StochasticDiffEq, Statistics, Plots  # quantile envelopes: 10th, 50th, 90th percentile paths

f(X,p,t)={{f}}; g(X,p,t)={{g}}  # drift and diffusion
prob = SDEProblem(f,g,{{X0}},(0.0,{{T}}))
{{?solver=SRIW1|LambaEM}} ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}})  # {{N}} paths
{{?solver!=SRIW1|LambaEM}} ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}}, dt={{dt}})  # {{N}} paths
t   = range(0.0,{{T}},length=200)  # time grid
q10 = [quantile([s(ti) for s in ens], 0.10) for ti in t]  # 10th percentile
q50 = [quantile([s(ti) for s in ens], 0.50) for ti in t]  # median
q90 = [quantile([s(ti) for s in ens], 0.90) for ti in t]  # 90th percentile
plot(t, q50, ribbon=(q50.-q10, q90.-q50), fillalpha=0.2, label="10-90% band")  # fan chart with quantile bands
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-noise"
label = "Compare Noise Levels"
desc = "Run ensembles with different diffusion strengths and compare the spread of the paths (with a linear drift the mean path does not depend on the noise)"
code = '''
using StochasticDiffEq, Statistics, Plots  # compare ensembles with different noise levels

f(X, p, t) = {{f}}  # shared drift
t = range(0.0, {{T}}, length=200)  # time grid
plt = plot(xlabel="t", ylabel="std of X(t)")
for sigma in [0.1, 0.3, 0.6]  # sweep noise strengths
    g(X, p, t) = sigma
    prob = SDEProblem(f, g, {{X0}}, (0.0, {{T}}))
{{?solver=SRIW1|LambaEM}}    ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}})
{{?solver!=SRIW1|LambaEM}}    ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}}, dt={{dt}})
    sd  = [std(s(ti) for s in ens) for ti in t]  # spread across paths: this is what the noise level changes
    plot!(plt, t, sd, label="sigma=" * string(sigma))
end
plt
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "fokker-planck"
label = "Fokker-Planck Density"
desc = "Histogram of X(T) against the exact density of X(T), the Fokker-Planck solution, when the process is Ornstein-Uhlenbeck (linear drift, constant diffusion); for a long T it is the stationary density"
code = '''
using StochasticDiffEq, StatsBase, Plots  # empirical density of X(T) against the Fokker-Planck solution

f(X, p, t) = {{f}}; g(X, p, t) = {{g}}  # drift and diffusion
prob = SDEProblem(f, g, {{X0}}, (0.0, {{T}}))  # horizon T = {{T}}
{{?solver=SRIW1|LambaEM}} ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}})  # {{N}} paths
{{?solver!=SRIW1|LambaEM}} ens = solve(EnsembleProblem(prob), {{solver}}(), EnsembleThreads(), trajectories={{N}}, dt={{dt}})  # {{N}} paths
samples = [s.u[end] for s in ens]  # terminal values X(T)
T, x0 = {{T}}, {{X0}}

# exact density when the drift is -theta X and the diffusion a constant sigma (detected numerically)
theta = f(0.0, nothing, 0.0) - f(1.0, nothing, 0.0)
sigma = g(0.0, nothing, 0.0)
is_ou = f(0.0, nothing, 0.0) == 0 && isapprox(f(2.0, nothing, 0.0), -2theta) && g(1.0, nothing, 0.0) == sigma && theta > 0

h = fit(Histogram, samples, nbins=40, closed=:left)  # empirical histogram
plt = plot(h, normalize=:pdf, alpha=0.5, label="empirical X(T)")
if is_ou
    m = x0 * exp(-theta * T)  # transition density of the Ornstein-Uhlenbeck process: Normal(m, v)
    v = sigma^2 * (1 - exp(-2theta * T)) / (2theta)  # v tends to the stationary variance sigma^2 / (2 theta) as T grows
    x = range(extrema(samples)..., length=400)
    plot!(plt, x, exp.(-(x .- m) .^ 2 ./ (2v)) ./ sqrt(2pi * v), label="Fokker-Planck (Ornstein-Uhlenbeck)")
else
    println("The exact density is drawn only for an Ornstein-Uhlenbeck process: linear drift -theta X and constant diffusion")
end
plt
'''
