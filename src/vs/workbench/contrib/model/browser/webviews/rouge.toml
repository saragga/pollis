[[bullets]]
text = "ROUGE-N"
detail = "recall: share of reference n-grams found in the candidate; precision: share of candidate n-grams found in a reference (rouge_n)"

[[bullets]]
text = "ROUGE-L and ROUGE-Lsum"
detail = "longest common subsequence over the whole text (rouge_l_sentence), or sentence by sentence with the union LCS (rouge_l_summary)"

[[bullets]]
text = "Is system A better than B?"
detail = "paired over documents: t-test and Wilcoxon signed-rank (HypothesisTests) and a paired bootstrap interval (Bootstrap.jl) for the F difference"

[[inputs]]
id = "candidates"
label = "Candidates (System A)"
tooltip = "A vector of strings: the summary written by the system for each document. Example: summaries = [\"the bank raised rates\", ...]."
default = "summaries"

[[inputs]]
id = "references"
label = "References"
tooltip = "One entry per document, in the same order: a reference string, or a vector of strings when there are several references. Example: gold = [[\"ref 1a\", \"ref 1b\"], [\"ref 2\"]]."
default = "gold"

[[inputs]]
id = "multi-ref"
label = "Several References"
tooltip = "How the scores against several references of one document are combined: the best-matching reference (highest F, the TextAnalysis argmax) or their average."
kind = "select"
default = "best"

[[inputs.options]]
value = "best"
label = "Best Match"

[[inputs.options]]
value = "average"
label = "Average"

[[inputs]]
id = "beta"
label = "F Weight (beta)"
tooltip = "Integer weight of recall against precision in the ROUGE-L F score: 1 weighs them equally (as rouge_score does); larger values favour recall. rouge_n always reports F1."
default = "1"
models = ["rougel", "rougelsum"]

[[inputs]]
id = "candidates-b"
label = "Candidates (System B)"
tooltip = "Summaries of a second system for the same documents, in the same order; used by Compare Systems."
default = "summaries_b"

[[inputs]]
id = "nboot"
label = "Bootstrap Resamples"
tooltip = "Number of paired bootstrap resamples of the documents used by Compare Systems."
default = "10000"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Seed of the global random number generator, which the bootstrap uses."
default = "1"

[[inputs]]
id = "new-candidate"
label = "New Candidate"
tooltip = "A Julia string with a summary to score, used by Evaluate New Candidate."
default = "\"replace with a new summary\""

[[inputs]]
id = "new-references"
label = "New References"
tooltip = "A reference string, or a vector of strings, for the new candidate."
default = "[\"replace with a reference summary\"]"

[[codeBranches]]
model = "rouge1"
code = '''
using TextAnalysis, Statistics  # rouge_n, rouge_l_sentence, rouge_l_summary, Score, average; mean, median

# TextAnalysis matches tokens case-sensitively, so both sides are lowercased
as_refs(r) = r isa AbstractString ? [lowercase(r)] : lowercase.(r)  # one or several references per document
cands = lowercase.({{candidates}})  # one summary per document
refs  = as_refs.({{references}})
length(cands) == length(refs) || error("Candidates and references need one entry per document.")

metric(r, c) = rouge_n(r, c, 1)  # unigram overlap; F is F1
{{?multi-ref=best}} pick(s) = argmax(s)  # the reference with the highest F (TextAnalysis argmax over Scores)
{{?multi-ref=average}} pick(s) = average(s)  # the mean over the references
score_docs(cs) = [pick(metric(r, c)) for (r, c) in zip(refs, cs)]  # one Score per document

scores  = score_docs(cands)
P, R, F = getfield.(scores, :precision), getfield.(scores, :recall), getfield.(scores, :fmeasure)
println("Macro average over ", length(scores), " documents: ", average(scores))
'''

[[codeBranches]]
model = "rouge2"
code = '''
using TextAnalysis, Statistics  # rouge_n, rouge_l_sentence, rouge_l_summary, Score, average; mean, median

# TextAnalysis matches tokens case-sensitively, so both sides are lowercased
as_refs(r) = r isa AbstractString ? [lowercase(r)] : lowercase.(r)  # one or several references per document
cands = lowercase.({{candidates}})  # one summary per document
refs  = as_refs.({{references}})
length(cands) == length(refs) || error("Candidates and references need one entry per document.")

metric(r, c) = rouge_n(r, c, 2)  # bigram overlap; F is F1
{{?multi-ref=best}} pick(s) = argmax(s)  # the reference with the highest F (TextAnalysis argmax over Scores)
{{?multi-ref=average}} pick(s) = average(s)  # the mean over the references
score_docs(cs) = [pick(metric(r, c)) for (r, c) in zip(refs, cs)]  # one Score per document

scores  = score_docs(cands)
P, R, F = getfield.(scores, :precision), getfield.(scores, :recall), getfield.(scores, :fmeasure)
println("Macro average over ", length(scores), " documents: ", average(scores))
'''

[[codeBranches]]
model = "rougel"
code = '''
using TextAnalysis, Statistics  # rouge_n, rouge_l_sentence, rouge_l_summary, Score, average; mean, median

# TextAnalysis matches tokens case-sensitively, so both sides are lowercased
as_refs(r) = r isa AbstractString ? [lowercase(r)] : lowercase.(r)  # one or several references per document
cands = lowercase.({{candidates}})  # one summary per document
refs  = as_refs.({{references}})
length(cands) == length(refs) || error("Candidates and references need one entry per document.")

metric(r, c) = rouge_l_sentence(r, c, {{beta}})  # LCS of the whole texts, each read as one sequence
{{?multi-ref=best}} pick(s) = argmax(s)  # the reference with the highest F (TextAnalysis argmax over Scores)
{{?multi-ref=average}} pick(s) = average(s)  # the mean over the references
score_docs(cs) = [pick(metric(r, c)) for (r, c) in zip(refs, cs)]  # one Score per document

scores  = score_docs(cands)
P, R, F = getfield.(scores, :precision), getfield.(scores, :recall), getfield.(scores, :fmeasure)
println("Macro average over ", length(scores), " documents: ", average(scores))
'''

[[codeBranches]]
model = "rougelsum"
code = '''
using TextAnalysis, Statistics  # rouge_n, rouge_l_sentence, rouge_l_summary, Score, average; mean, median

# TextAnalysis matches tokens case-sensitively, so both sides are lowercased
as_refs(r) = r isa AbstractString ? [lowercase(r)] : lowercase.(r)  # one or several references per document
cands = lowercase.({{candidates}})  # one summary per document
refs  = as_refs.({{references}})
length(cands) == length(refs) || error("Candidates and references need one entry per document.")

metric(r, c) = rouge_l_summary(r, c, {{beta}})  # union LCS sentence by sentence; needs sentence punctuation
{{?multi-ref=best}} pick(s) = argmax(s)  # the reference with the highest F (TextAnalysis argmax over Scores)
{{?multi-ref=average}} pick(s) = average(s)  # the mean over the references
score_docs(cs) = [pick(metric(r, c)) for (r, c) in zip(refs, cs)]  # one Score per document

scores  = score_docs(cands)
P, R, F = getfield.(scores, :precision), getfield.(scores, :recall), getfield.(scores, :fmeasure)
println("Macro average over ", length(scores), " documents: ", average(scores))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "score-distribution"
label = "Score Distribution"
desc = "Histogram of the F score per document"
code = '''
using Plots  # plotting

histogram(F, bins = 20, xlabel = "F per document", ylabel = "documents", legend = false)
vline!([mean(F)], ls = :dash)  # the macro average
'''

[[actionGroups.actions]]
id = "precision-recall-plot"
label = "Precision-Recall Plot"
desc = "Precision against recall per document, coloured by candidate length"
code = '''
using Plots  # plotting

words = length.(split.(cands))  # candidate length in words
scatter(R, P, marker_z = words, colorbar_title = "candidate words", xlabel = "recall", ylabel = "precision", legend = false)
plot!([0, 1], [0, 1], ls = :dash, color = :gray)  # longer candidates move right (recall) and down (precision)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "score-summary"
label = "Score Summary"
desc = "Mean, median, min and max of precision, recall and F"
code = '''
for (name, v) in (("precision", P), ("recall", R), ("F", F))
    println(rpad(name, 10), "mean ", round(mean(v); digits = 3), "   median ", round(median(v); digits = 3),
            "   min ", round(minimum(v); digits = 3), "   max ", round(maximum(v); digits = 3))
end
{{?model=rouge1|rouge2}} over = findall(>(1), R)  # rouge_n counts a repeated candidate n-gram every time (no clipping)
{{?model=rouge1|rouge2}} isempty(over) || println("Recall above 1 in documents ", over, ": the candidate repeats n-grams of the reference")
'''

[[actionGroups.actions]]
id = "low-score-docs"
label = "Low-Score Documents"
desc = "The five lowest-scoring candidates next to their best reference, to read by hand"
code = '''
# a low score can be a faithful paraphrase; a high score can still state a wrong fact
for i in sortperm(F)[1:min(5, length(F))]
    best = refs[i][argmax(getfield.(metric(refs[i], cands[i]), :fmeasure))]
    println("Doc $i  F ", round(F[i]; digits = 3))
    println("   candidate: ", first(cands[i], 150))
    println("   reference: ", first(best, 150))
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "eval-new-candidate"
label = "Evaluate New Candidate"
desc = "Score one new summary against its references with the current metric"
code = '''
s = pick(metric(as_refs({{new-references}}), lowercase({{new-candidate}})))
println("precision ", round(s.precision; digits = 3), "   recall ", round(s.recall; digits = 3), "   F ", round(s.fmeasure; digits = 3))
'''

[[actionGroups.actions]]
id = "paraphrase-vs-wrong-fact"
label = "Paraphrase vs Wrong Fact"
desc = "How the current metric scores a faithful paraphrase against a fluent copy with one wrong fact"
code = '''
ref = ["the central bank raised interest rates by half a point to fight inflation."]
probes = ("faithful paraphrase" => "the central bank lifted borrowing costs by 0.5 percentage points to curb rising prices.",
          "one wrong fact"      => "the central bank cut interest rates by half a point to fight inflation.",
          "exact copy"          => ref[1])
for (name, c) in probes
    s = pick(metric(ref, c))
    println(rpad(name, 22), "F ", round(s.fmeasure; digits = 3))  # ROUGE rewards shared words, not meaning
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-metrics"
label = "Compare Metrics"
desc = "ROUGE-1, ROUGE-2, ROUGE-L and ROUGE-Lsum side by side for System A"
code = '''
metrics = ("ROUGE-1"    => (r, c) -> rouge_n(r, c, 1),
           "ROUGE-2"    => (r, c) -> rouge_n(r, c, 2),
           "ROUGE-L"    => (r, c) -> rouge_l_sentence(r, c, 1),
           "ROUGE-Lsum" => (r, c) -> rouge_l_summary(r, c, 1))  # F1 throughout
for (name, m) in metrics
    s = average([pick(m(r, c)) for (r, c) in zip(refs, cands)])  # macro average
    println(rpad(name, 12), "P ", round(s.precision; digits = 3), "   R ", round(s.recall; digits = 3), "   F ", round(s.fmeasure; digits = 3))
end
'''

[[actionGroups.actions]]
id = "compare-systems"
label = "Compare Systems"
desc = "Is System A better than System B? Paired t-test, Wilcoxon signed-rank and paired bootstrap over documents"
code = '''
using HypothesisTests, Bootstrap, Random  # paired tests; bootstrap resampling; seeding

cands_b = lowercase.({{candidates-b}})
length(cands_b) == length(cands) || error("System B needs one summary per document, in the same order.")
FA, FB = F, getfield.(score_docs(cands_b), :fmeasure)
d = FA .- FB  # paired by document

t = OneSampleTTest(FA, FB)  # paired t-test on the F differences
lo, hi = confint(t)
println("Mean F difference A - B: ", round(mean(d); digits = 4), "   95% CI (t) [", round(lo; digits = 4), ", ", round(hi; digits = 4), "]   p ", round(pvalue(t); digits = 4))
println("Wilcoxon signed-rank p: ", round(pvalue(SignedRankTest(FA, FB)); digits = 4))

Random.seed!({{seed}})  # Bootstrap draws with the global RNG
bs = bootstrap(mean, d, BasicSampling({{nboot}}))  # resample documents, keeping each pair together
_, blo, bhi = only(confint(bs, PercentileConfInt(0.95)))
println("Paired bootstrap 95% CI: [", round(blo; digits = 4), ", ", round(bhi; digits = 4), "]")
println("A scores higher on ", count(>(0), d), " of ", length(d), " documents, lower on ", count(<(0), d))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "per-document-scores"
label = "Per-Document Scores"
desc = "Precision, recall and F for each document"
code = '''
println(rpad("Doc", 6), rpad("Precision", 12), rpad("Recall", 12), "F")
for i in eachindex(scores)
    println(rpad(i, 6), rpad(round(P[i]; digits = 3), 12), rpad(round(R[i]; digits = 3), 12), round(F[i]; digits = 3))
end
'''

[[actionGroups.actions]]
id = "aggregate-scores"
label = "Aggregate Scores"
desc = "Macro average (each document counts equally) and length-weighted average (long documents count more)"
code = '''
lc = length.(split.(cands))  # candidate words: the precision denominator
lr = [mean(length.(split.(r))) for r in refs]  # reference words (mean over references): the recall denominator
Pw, Rw = sum(P .* lc) / sum(lc), sum(R .* lr) / sum(lr)
println("Macro:           ", average(scores))
println("Length-weighted: precision ", round(Pw; digits = 4), "   recall ", round(Rw; digits = 4), "   F1 ", round(2 * Pw * Rw / (Pw + Rw); digits = 4))
'''
