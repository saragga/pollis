# ROUGE Evaluation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/rouge.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "ROUGE Evaluation"
viewType = "pollis.rouge"
defaultModel = "rouge1"

[[packages]]
name = "TextAnalysis.jl"
github = "https://github.com/JuliaText/TextAnalysis.jl"

[requires]
packages = ["TextAnalysis.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "ROUGE Evaluation"
file = "rouge/tutorial-01-rouge.ipynb"
bundled = true
description = "Evaluate summaries with ROUGE-1, ROUGE-2, ROUGE-L, and ROUGE-S using TextAnalysis.jl"

