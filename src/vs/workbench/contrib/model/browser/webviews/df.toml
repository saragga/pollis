[[inputs]]
id = "params1"
label = "Parameters"
tooltip = "Fix one parameter as key=value pairs, comma-separated. Keys: mean, var, std, cv, scv, second_moment (E[X^2]), mode, median, q1, q3, iqr, quantiles (vector of (p, q), e.g. [(0.10, 1.0), (0.90, 10.0)]). Optionally append support=0..Inf (or 2..7, 0:20)."
default = "mean=5.0"
models = ["moments"]
when = "dist=Exponential|Chisq|FoldedNormal|Pareto|Chi|Rayleigh|Binomial|Geometric|Poisson"

[[inputs]]
id = "params2"
label = "Parameters"
tooltip = "Fix two parameters as key=value pairs, comma-separated. Keys: mean, var, std, cv, scv, second_moment (E[X^2]), mode, median, q1, q3, iqr, quantiles (vector of (p, q), e.g. [(0.10, 1.0), (0.90, 10.0)]). Optionally append support=0..Inf (or 2..7, 0:20)."
default = "mean=5.0, var=2.0"
models = ["moments"]
when = "dist=Normal|Laplace|Logistic|Gumbel|Gamma|Erlang|LogNormal|Weibull|Frechet|FDist|InverseGamma|Beta|NegativeBinomial"

[[inputs]]
id = "params3"
label = "Parameters"
tooltip = "Fix three parameters as key=value pairs, comma-separated. Keys: mean, var, std, cv, scv, second_moment (E[X^2]), mode, median, q1, q3, iqr, quantiles (vector of (p, q), e.g. [(0.10, 1.0), (0.90, 10.0)]). Optionally append support=0..Inf (or 2..7, 0:20)."
default = "mean=5.0, var=2.0, std=1.5"
models = ["moments"]
when = "dist=TDist"

[[inputs]]
id = "paramsq"
label = "Parameters"
tooltip = "Fix two quantile parameters (median, q1, q3, iqr, quantiles) as key=value pairs, comma-separated. Keys: median, q1, q3, iqr, quantiles. Optionally append support=0..Inf (or 2..7, 0:20)."
default = "median=5.0, q1=2.0"
models = ["moments"]
when = "dist=Cauchy"

[[inputs]]
id = "constraints"
label = "Constraints"
tooltip = "Constraints as key=value pairs, comma-separated. Keys: mean, var, std, cv, scv, second_moment (E[X^2]), mode, median, q1, q3, iqr, quantiles (vector of (p, q), e.g. [(0.10, 1.0), (0.90, 10.0)]), support (0..Inf, 0..1, -Inf..Inf, 0:Inf, or a custom interval such as 3..Inf)."
default = "mean=5.0"
models = ["discover"]

[[codeBranches]]
model = "moments"
code = '''
using DistributionsFactories, Distributions

{{?dist=Uniform|SymTriangularDist|DiscreteUniform}} d = make_dist({{dist}})
{{?dist=Uniform|SymTriangularDist|DiscreteUniform}} println("support: [", minimum(d), ", ", maximum(d), "]")
{{?dist=Exponential|Chisq|FoldedNormal|Pareto|Chi|Rayleigh|Binomial|Geometric|Poisson}} if dist_exists({{dist}}, {{params1}})  # feasibility check
{{?dist=Exponential|Chisq|FoldedNormal|Pareto|Chi|Rayleigh|Binomial|Geometric|Poisson}}     d = make_dist({{dist}}, {{params1}})
{{?dist=Normal|Laplace|Logistic|Gumbel|Gamma|Erlang|LogNormal|Weibull|Frechet|FDist|InverseGamma|Beta|NegativeBinomial}} if dist_exists({{dist}}, {{params2}})  # feasibility check
{{?dist=Normal|Laplace|Logistic|Gumbel|Gamma|Erlang|LogNormal|Weibull|Frechet|FDist|InverseGamma|Beta|NegativeBinomial}}     d = make_dist({{dist}}, {{params2}})
{{?dist=TDist}} if dist_exists({{dist}}, {{params3}})  # feasibility check
{{?dist=TDist}}     d = make_dist({{dist}}, {{params3}})
{{?dist=Cauchy}} if dist_exists({{dist}}, {{paramsq}})  # feasibility check
{{?dist=Cauchy}}     d = make_dist({{dist}}, {{paramsq}})
{{?dist!=Uniform|SymTriangularDist|DiscreteUniform|Cauchy}}     println("mean: ", mean(d), "  var: ", var(d), "  median: ", median(d))
{{?dist=Cauchy}}     println("q25: ", quantile(d, 0.25), "  q75: ", quantile(d, 0.75))
{{?dist!=Uniform|SymTriangularDist|DiscreteUniform}} end
'''

[[codeBranches]]
model = "discover"
code = '''
using DistributionsFactories, Distributions

available_distributions({{constraints}})  # returns all feasible families
'''
