# Distribution Factories Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/df.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Distribution Factories"
viewType = "pollis.df"
defaultModel = "moments"

[[packages]]
name = "DistributionsFactories.jl"
github = "https://github.com/Distribution-Matching/DistributionsFactories.jl"

[[packages]]
name = "Distributions.jl"
github = "https://github.com/JuliaStats/Distributions.jl"

[requires]
packages = ["DistributionsFactories.jl", "Distributions.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Mean & Std Factories"
file = "df/tutorial-01-moments.ipynb"
bundled = true
description = "Constructing distributions from mean, standard deviation, and variance"

[[notebookSections.notebooks]]
name = "Quantile Matching"
file = "df/tutorial-02-quantiles.ipynb"
bundled = true
description = "Finding distributions that match specified probability-quantile pairs"

[[notebookSections.notebooks]]
name = "Fit to Data"
file = "df/tutorial-03-fit.ipynb"
bundled = true
description = "Maximum likelihood and method-of-moments fitting to observed data"

[[notebookSections.notebooks]]
name = "Practical Examples"
file = "df/tutorial-04-examples.ipynb"
bundled = true
description = "Real-world scenarios: insurance losses, component lifetimes, and count data"

[[wikis]]
name = "Overview"
file = "df/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "df/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "df/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "df/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "df/interpretation.md"
bundled = true

[[wikis]]
name = "Decision Guide"
file = "df/decision-guide.md"
bundled = true

[[bullets]]
text = "Moments"
detail = "construct any of 27 distributions from statistical moments or quantiles via make_dist"

[[bullets]]
text = "Discover"
detail = "find all feasible distribution families for any combination of constraints via available_distributions"

[[models]]
id = "moments"
label = "Moments"

[[models]]
id = "discover"
label = "Discover"

