using LowLevelParticleFilters, Plots  # filter + plotting

sol = forward_trajectory({{model}}, {{data}}.u, {{data}}.y)  # run filter
plot(sol, plotx=false, plotxt=false, plotR=false, plotRt=false, plote=false, plotu=false, ploty=true, plotyh=true, plotyht=false)  # observed y vs predicted yhat(t|t-1)
'''

