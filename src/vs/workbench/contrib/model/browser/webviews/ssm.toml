using LowLevelParticleFilters, Plots  # filter + plotting

sol = forward_trajectory({{model}}, {{data}}.u, {{data}}.y)  # run filter
plot(sol, plotx=false, plotxt=false, plotR=false, plotRt=false, plote=false, plotu=false, ploty=true, plotyh=true, plotyht=false)  # observed y vs predicted yhat(t|t-1)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-filters"
label = "Compare Filters"
desc = "Run KF, EKF, and UKF on the same data and compare estimates"
code = '''
using LowLevelParticleFilters, Plots  # filter + plotting

# needs kf, ekf and ukf built from the same Q, R and x0 (run those panels' code first)
sol_kf  = forward_trajectory(kf,  {{data}}.u, {{data}}.y)  # Kalman filter
sol_ekf = forward_trajectory(ekf, {{data}}.u, {{data}}.y)  # Extended Kalman filter
sol_ukf = forward_trajectory(ukf, {{data}}.u, {{data}}.y)  # Unscented Kalman filter

plot(transpose(reduce(hcat, sol_kf.xt)), label="KF", color=1)  # filtered estimates x(t|t)
plot!(transpose(reduce(hcat, sol_ekf.xt)), label="EKF", color=2)
plot!(transpose(reduce(hcat, sol_ukf.xt)), label="UKF", color=3)
(kf = sol_kf.ll, ekf = sol_ekf.ll, ukf = sol_ukf.ll)  # log-likelihoods
'''

[[actionGroups.actions]]
id = "particle-count"
label = "Particle Count"
desc = "Vary number of particles and compare accuracy vs. computation time"
code = '''
using LowLevelParticleFilters, BenchmarkTools, Statistics  # filter + benchmarks + mean/std

for N in [100, 500, 1000, 5000]  # sweep particle counts
{{?model!=rbf}}     pf_n = ParticleFilter(N, dynamics, measurement, noise_dist, meas_dist, x0)  # build filter
{{?model=rbf}}     pf_n = RBPF(N, kf_l, fn, mm, R1n, d0n; An, nu, names = signals)  # build filter
    lls = [loglik(pf_n, {{data}}.u, {{data}}.y) for _ in 1:5]  # the estimate is random: its spread shrinks with N
    t  = @belapsed loglik($pf_n, $({{data}}.u), $({{data}}.y))  # timing
    println("N=$N: ll=$(round(mean(lls), digits=2)) +/- $(round(std(lls), digits=2)), t=$(round(t*1000, digits=1))ms")
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "state-covariance"
label = "State Uncertainty"
desc = "Plot posterior state variance (diagonal of covariance) over time"
code = '''
using LowLevelParticleFilters, LinearAlgebra, Plots  # filter + diag + plotting
{{?model=rbf}} using StaticArrays  # fixed-size particle means for weighted_cov

sol = forward_trajectory({{model}}, {{data}}.u, {{data}}.y)  # run filter
{{?model!=pf|rbf}} vars = reduce(hcat, diag.(sol.Rt))  # diagonal of the filter covariance R(t|t), nx x T
{{?model=pf}} vars = reduce(hcat, diag.(weighted_cov(sol)))  # particle variances, nx x T
{{?model=rbf}} Xm = [SVector{nnl + nl}(sol.x[i, t]) for i in axes(sol.x, 1), t in axes(sol.x, 2)]  # particle means [xn; xl], N x T
{{?model=rbf}} Rl = [sum(sol.we[i, t] * sol.x[i, t].R for i in axes(sol.x, 1)) for t in axes(sol.x, 2)]  # weighted mean of the particle Kalman covariances of xl
{{?model=rbf}} vars = reduce(hcat, [diag(Cm) .+ [zeros(nnl); diag(Rm)] for (Cm, Rm) in zip(weighted_cov(Xm, sol.we), Rl)])  # total variance: spread of the means plus the mean Kalman variance, nx x T

plot(transpose(vars), label=reshape(["Var x$i" for i in 1:size(vars, 1)], 1, :), yscale=:log10)  # higher variance = more uncertain state
'''

[[actionGroups.actions]]
id = "smoothed-states"
label = "Smoothed States"
desc = "Kalman smoother provides lower-variance estimates using future data"
code = '''
using LowLevelParticleFilters, LinearAlgebra, Plots  # filter + diag + plotting

sol_f = forward_trajectory(kf, {{data}}.u, {{data}}.y)  # forward pass (linear Kalman filter)
sol_s = smooth(sol_f, kf)  # Rauch-Tung-Striebel backward pass

var_f = reduce(hcat, diag.(sol_f.Rt))  # filtered variances
var_s = reduce(hcat, diag.(sol_s.RT))  # smoothed variances: never larger than the filtered ones
plot(transpose(var_f), label="Filtered", color=1)
plot!(transpose(var_s), label="Smoothed", color=2, ls=:dash)
'''
