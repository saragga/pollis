[[bullets]]
text = "Hidden States"
detail = "Estimate unobserved states from noisy measurements with a state-space model, using LowLevelParticleFilters.jl"

[[bullets]]
text = "From Linear to Nonlinear"
detail = "The Kalman filter is exact for linear Gaussian models; the extended and unscented Kalman filters handle nonlinear dynamics"

[[bullets]]
text = "Particle Methods"
detail = "Particle filters handle strong nonlinearity and non-Gaussian noise; Rao-Blackwellized filters combine particles with Kalman filters for partly linear models"

[[bullets]]
text = "Filtering, Smoothing and Likelihood"
detail = "Filtered and smoothed states with their uncertainty, innovations for checking the model, and the log-likelihood of the model"

[[decisionRows]]
task = "Kalman Filter"
context = "Linear, Gaussian"
purpose = "Linear dynamics, Gaussian noise; analytic and exact; baseline for all extensions"

[[decisionRows]]
task = "Extended Kalman Filter"
context = "Nonlinear, Jacobian"
purpose = "Nonlinear Gaussian systems; linearises via first-order Taylor expansion; requires differentiable dynamics"

[[decisionRows]]
task = "Unscented Kalman Filter"
context = "Nonlinear, no Jacobian"
purpose = "Nonlinear Gaussian systems; sigma-point propagation; more accurate than EKF without requiring Jacobians"

[[decisionRows]]
task = "Particle Filter"
context = "Nonlinear / non-Gaussian"
purpose = "Strongly nonlinear or non-Gaussian systems; N particles traded for accuracy"

[[decisionRows]]
task = "Rao-Blackwellized Filter"
context = "Mixed linear + nonlinear"
purpose = "Combines sample-based flexibility of particle filters with the analytical efficiency of Kalman filters; for mixed linear/nonlinear systems"

[[inputs]]
id = "nx"
models = ["kf", "ekf", "ukf", "pf"]
label = "state dimension nx"
tooltip = "Dimension of the latent state vector x_t. For a 2D position-velocity model, nx = 4. The default examples, the Nile and the nonlinear growth model, have one state."
default = "1"

[[inputs]]
id = "ny"
models = ["kf", "ekf", "ukf", "pf"]
label = "measurement ny"
tooltip = "Dimension of the measurement vector y_t. Must match the number of signals measured at each time step."
default = "1"

[[inputs]]
id = "nu"
models = ["kf", "ekf", "ukf", "pf"]
label = "input nu"
tooltip = "Dimension of the known input (control) vector u_t. Set to 0 if there are no external inputs."
default = "0"

[[inputs]]
id = "n-particles"
models = ["pf"]
label = "particles N"
tooltip = ""
default = "1000"

[[inputs]]
id = "nl"
models = ["rbf"]
label = "linear dim nl"
tooltip = "Dimension of the linear part of the state vector in the Rao-Blackwellized filter. This part is handled analytically."
default = "2"

[[inputs]]
id = "nnl"
models = ["rbf"]
label = "nonlinear dim nnl"
tooltip = "Dimension of the nonlinear part of the state vector. Particle approximation is used for this part."
default = "2"

[[inputs]]
id = "ny-rbf"
models = ["rbf"]
label = "measurement ny"
tooltip = ""
default = "1"

[[inputs]]
id = "nu-rbf"
models = ["rbf"]
label = "input nu"
tooltip = ""
default = "0"

[[inputs]]
id = "n-particles-rbf"
models = ["rbf"]
label = "particles N"
tooltip = ""
default = "1000"

[[inputs]]
id = "q-scale"
models = ["kf", "rbf"]
label = "Q scale"
tooltip = "Process noise variance: Q = scale x I. The default, 0.05, is the Nile local level model's (Durbin and Koopman 2001), for the standardised flow."
default = "0.05"

[[inputs]]
id = "r-scale"
models = ["kf", "rbf"]
label = "R scale"
tooltip = "Measurement noise variance: R = scale x I. The default, 0.5, is the Nile local level model's (Durbin and Koopman 2001), for the standardised flow."
default = "0.5"

[[inputs]]
id = "q-scale-nl"
models = ["ekf", "ukf", "pf"]
label = "Q scale"
tooltip = "Process noise variance: Q = scale x I. The default, 10, is that of the nonlinear growth model of Gordon, Salmond and Smith (1993)."
default = "10"

[[inputs]]
id = "r-scale-nl"
models = ["ekf", "ukf", "pf"]
label = "R scale"
tooltip = "Measurement noise variance: R = scale x I. The default, 1, is that of the nonlinear growth model of Gordon, Salmond and Smith (1993)."
default = "1"

[[inputs]]
id = "mu0"
models = ["kf", "ekf", "ukf", "pf"]
label = "initial state mu₀"
tooltip = "Initial state estimate mu_0 (vector of length nx). Mean of the initial distribution x_0 ~ N(mu_0, Sigma_0)."
default = "zeros(nx)"

[[inputs]]
id = "sigma0"
models = ["kf", "ekf", "ukf", "pf"]
label = "initial covariance Sigma₀"
tooltip = "Initial error covariance Sigma_0. Reflects uncertainty in the initial state. Default I (identity matrix)."
default = "I"

[[inputs]]
id = "data"
models = ["kf", "ekf", "ukf", "pf", "rbf"]
label = "data variable"
tooltip = "Named tuple or struct with fields .u (inputs) and .y (observations), one entry per time step.\nThe default is, for the Kalman filter, the Nile's annual flow at Aswan from PollisDatasets, standardised; for the other filters, data simulated from the model they filter."
default = "obs"

[[inputs]]
id = "dyn-expr"
models = ["ekf", "ukf", "pf"]
label = "dynamics f(x,u,p,t)"
tooltip = "The state transition, returning a vector of length nx. The default is the nonlinear growth model of Gordon, Salmond and Smith (1993), the standard test of nonlinear filters; t is the time step, from 0."
default = "[x[1] / 2 + 25x[1] / (1 + x[1]^2) + 8cos(1.2t)]  # replace with your dynamics"

[[inputs]]
id = "meas-expr"
models = ["ekf", "ukf", "pf"]
label = "measurement h(x,u,p,t)"
tooltip = "The measurement, returning a vector of length ny. The default, x^2/20, is that of Gordon, Salmond and Smith (1993): it loses the sign of x, which an extended Kalman filter cannot recover."
default = "[x[1]^2 / 20]  # replace with your measurement"

[[inputs]]
id = "rbf-dyn-expr"
label = "nonlinear dynamics f_n(xn,u,p,t)"
tooltip = "Nonlinear part of the transition of the nonlinear substate xn. The filter adds An * xl and Gaussian noise. Must return a vector of length nnl."
default = "atan.(xn)  # replace with your nonlinear dynamics"
models = ["rbf"]

[[inputs]]
id = "rbf-meas-expr"
label = "nonlinear measurement g(xn,u,p,t)"
tooltip = "Contribution of the nonlinear substate xn to the measurement. The filter adds C * xl and Gaussian noise. Must return a vector of length ny."
default = "fill(0.1 * sum(abs2, xn), ny)  # replace with your measurement"
models = ["rbf"]

[[codeBranches]]
model = "kf"
code = '''
using LowLevelParticleFilters, LinearAlgebra, Distributions  # filtering, I, MvNormal
{{?data=obs}} using PollisDatasets  # curated example datasets

const nx, ny, nu = {{nx}}, {{ny}}, {{nu}}  # state / obs / input dimensions

{{?data=obs}} nile = dataset("nile");  # annual flow of the Nile at Aswan, 1871-1970 (Durbin and Koopman 2001). Replace it with your own data.
{{?data=obs}} z = (nile.flow .- mean(nile.flow)) ./ std(nile.flow);  # standardised, so the default noise scales suit it
{{?data=obs}} obs = (u = [zeros(nu) for _ in z], y = [[v] for v in z]);  # no inputs, one measurement a year (ny = 1)

F  = Matrix(I, nx, nx)  # state transition matrix
B  = zeros(nx, nu)  # input matrix
H  = Matrix(I, ny, nx)  # measurement matrix

Q  = {{q-scale}} * Matrix(I, nx, nx)  # process noise covariance
R  = {{r-scale}} * Matrix(I, ny, ny)  # measurement noise covariance
x0 = MvNormal({{mu0}}, {{sigma0}})  # initial state x0 ~ N(mu0, Sigma0)

kf = KalmanFilter(F, B, H, zeros(ny, nu), Q, R, x0)  # build Kalman filter

sol = forward_trajectory(kf, {{data}}.u, {{data}}.y)  # run forward pass (u, y: vectors of vectors)
(log_likelihood = sol.ll, final_state = sol.xt[end], final_covariance = sol.Rt[end])  # filtered x(T|T) and its covariance
'''

[[codeBranches]]
model = "ekf"
code = '''
using LowLevelParticleFilters, LinearAlgebra, Distributions  # filtering, I, MvNormal
{{?data=obs}} using Random

const nx, ny, nu = {{nx}}, {{ny}}, {{nu}}  # state / obs / input dimensions

function dynamics(x, u, p, t)  # nonlinear state transition f(x,u,p,t)
    {{dyn-expr}}
end

function measurement(x, u, p, t)  # nonlinear measurement h(x,u,p,t)
    {{meas-expr}}
end

Q  = {{q-scale-nl}} * Matrix(I, nx, nx)  # process noise covariance
R  = {{r-scale-nl}} * Matrix(I, ny, ny)  # measurement noise covariance
x0 = MvNormal({{mu0}}, {{sigma0}})  # initial state x0 ~ N(mu0, Sigma0)

ekf = ExtendedKalmanFilter(dynamics, measurement, Q, R, x0; nu)  # build EKF (Jacobians by ForwardDiff)

{{?data=obs}} Random.seed!(1); xs, us, ys = simulate(ekf, [zeros(nu) for _ in 1:100]);  # simulated: 100 steps of the model above, with its noise. Replace obs with your own data.
{{?data=obs}} obs = (u = us, y = ys);

sol = forward_trajectory(ekf, {{data}}.u, {{data}}.y)  # run forward pass (u, y: vectors of vectors)
(log_likelihood = sol.ll, final_state = sol.xt[end], final_covariance = sol.Rt[end])  # filtered x(T|T) and its covariance
'''

[[codeBranches]]
model = "ukf"
code = '''
using LowLevelParticleFilters, LinearAlgebra, Distributions  # filtering, I, MvNormal
{{?data=obs}} using Random

const nx, ny, nu = {{nx}}, {{ny}}, {{nu}}  # state / obs / input dimensions

function dynamics(x, u, p, t)  # nonlinear state transition f(x,u,p,t)
    {{dyn-expr}}
end

function measurement(x, u, p, t)  # nonlinear measurement h(x,u,p,t)
    {{meas-expr}}
end

Q  = {{q-scale-nl}} * Matrix(I, nx, nx)  # process noise covariance
R  = {{r-scale-nl}} * Matrix(I, ny, ny)  # measurement noise covariance
x0 = MvNormal({{mu0}}, {{sigma0}})  # initial state x0 ~ N(mu0, Sigma0)

ukf = UnscentedKalmanFilter(dynamics, measurement, Q, R, x0; nu, ny)  # build UKF (ny is a required keyword)

{{?data=obs}} Random.seed!(1); xs, us, ys = simulate(ukf, [zeros(nu) for _ in 1:100]);  # simulated: 100 steps of the model above, with its noise. Replace obs with your own data.
{{?data=obs}} obs = (u = us, y = ys);

sol = forward_trajectory(ukf, {{data}}.u, {{data}}.y)  # run forward pass (u, y: vectors of vectors)
(log_likelihood = sol.ll, final_state = sol.xt[end], final_covariance = sol.Rt[end])  # filtered x(T|T) and its covariance
'''

[[codeBranches]]
model = "pf"
code = '''
using LowLevelParticleFilters, LinearAlgebra, Distributions  # filtering, I, MvNormal
{{?data=obs}} using Random

const nx, ny, nu = {{nx}}, {{ny}}, {{nu}}  # state / obs / input dimensions

const N = {{n-particles}}  # number of particles

function dynamics(x, u, p, t)  # state transition; the filter adds noise drawn from noise_dist
    {{dyn-expr}}
end

function measurement(x, u, p, t)  # measurement function; the filter scores y with meas_dist
    {{meas-expr}}
end

noise_dist = MvNormal(zeros(nx), {{q-scale-nl}} * I)  # process noise distribution
meas_dist  = MvNormal(zeros(ny), {{r-scale-nl}} * I)  # measurement noise distribution
x0         = MvNormal({{mu0}}, {{sigma0}})  # initial state distribution

pf = ParticleFilter(N, dynamics, measurement, noise_dist, meas_dist, x0)  # bootstrap particle filter

{{?data=obs}} Random.seed!(1); xs, us, ys = simulate(pf, [zeros(nu) for _ in 1:100]);  # simulated: 100 steps of the model above, with its noise. Replace obs with your own data.
{{?data=obs}} obs = (u = us, y = ys);

sol = forward_trajectory(pf, {{data}}.u, {{data}}.y)  # run forward pass (u, y: vectors of vectors)
(log_likelihood = sol.ll, final_state = mean_trajectory(sol)[end, :])  # weighted particle mean at time T
'''

[[codeBranches]]
model = "rbf"
code = '''
using LowLevelParticleFilters, LinearAlgebra  # filtering, I
{{?data=obs}} using Random
using LowLevelParticleFilters: SimpleMvNormal  # Gaussian from a mean and a covariance matrix (not exported)

const nnl, nl, ny, nu = {{nnl}}, {{nl}}, {{ny-rbf}}, {{nu-rbf}}  # nonlinear / linear / obs / input dimensions
const N = {{n-particles-rbf}}  # number of particles

# Mixed linear / nonlinear model (model 2 of Schon, Gustafsson and Nordlund 2005), state [xn; xl]:
#   xn(t+1) = f_n(xn) + An xl + wn,   xl(t+1) = Al xl + Bl u + wl,   y(t) = g(xn) + C xl + e
function fn(xn, u, p, t)  # nonlinear part of the xn transition
    {{rbf-dyn-expr}}
end

function g(xn, u, p, t)  # contribution of xn to the measurement
    {{rbf-meas-expr}}
end

An = Matrix(1.0I, nnl, nl)  # effect of xl on xn
Al = Matrix(1.0I, nl, nl)  # linear dynamics of xl (random walk)
Bl = zeros(nl, nu)  # input matrix of xl
C  = Matrix(1.0I, ny, nl)  # effect of xl on y

R1n = {{q-scale}} * Matrix(1.0I, nnl, nnl)  # xn noise covariance (must be Gaussian, since An is not zero)
R1l = {{q-scale}} * Matrix(1.0I, nl, nl)  # xl noise covariance
R2  = {{r-scale}} * Matrix(1.0I, ny, ny)  # measurement noise covariance
d0n = SimpleMvNormal(zeros(nnl), Matrix(1.0I, nnl, nnl))  # initial xn, sampled by the particles
d0l = SimpleMvNormal(zeros(nl), Matrix(1.0I, nl, nl))  # initial xl, tracked exactly by each Kalman filter

kf_l = KalmanFilter(Al, Bl, C, 0, R1l, R2, d0l; ny, nu)  # linear substate: one Kalman mean and covariance per particle
mm = RBMeasurementModel(g, R2, ny)  # g and the measurement noise
signals = SignalNames(x = [["xn$i" for i in 1:nnl]; ["xl$i" for i in 1:nl]], u = ["u$i" for i in 1:nu], y = ["y$i" for i in 1:ny], name = "RBPF")  # names is a required keyword
rbf = RBPF(N, kf_l, fn, mm, R1n, d0n; An, nu, names = signals)  # Rao-Blackwellised (marginalised) particle filter

{{?data=obs}} Random.seed!(1); xs, us, ys = simulate(rbf, [zeros(nu) for _ in 1:100]);  # simulated: 100 steps of the model above, with its noise. Replace obs with your own data.
{{?data=obs}} obs = (u = us, y = ys);

sol = forward_trajectory(rbf, {{data}}.u, {{data}}.y)  # run forward pass (u, y: vectors of vectors)
(log_likelihood = sol.ll, final_state = mean_trajectory(sol)[end, :])  # weighted mean of [xn; xl] at time T
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "state-estimate"
label = "State Estimates"
desc = "Plot filtered state estimates over time"
code = '''
using LowLevelParticleFilters, Plots  # filter + plotting

sol = forward_trajectory({{model}}, {{data}}.u, {{data}}.y)  # run filter
{{?model!=pf|rbf}} xf = reduce(hcat, sol.xt)  # filtered estimates x(t|t), nx x T
{{?model=pf|rbf}} xf = transpose(mean_trajectory(sol))  # weighted particle means, nx x T

plot(transpose(xf), label=reshape(["x$i" for i in 1:size(xf, 1)], 1, :))  # filtered state estimates
'''

[[actionGroups.actions]]
id = "filter-smoother"
label = "Filter vs Smoother"
desc = "Compare forward-filtered and smoothed state estimates"
code = '''
using LowLevelParticleFilters, Plots  # filter + plotting

sol_f = forward_trajectory({{model}}, {{data}}.u, {{data}}.y)  # forward filtered estimates
{{?model!=pf|rbf}} xf = reduce(hcat, sol_f.xt)  # filtered x(t|t), nx x T
{{?model!=pf|rbf}} xs = reduce(hcat, smooth(sol_f, {{model}}).xT)  # RTS smoother x(t|T), nx x T
{{?model=pf|rbf}} xf = transpose(mean_trajectory(sol_f))  # filtered particle means, nx x T
{{?model=pf}} xb, _ = smooth({{model}}, 100, {{data}}.u, {{data}}.y)  # forward-filter backward-simulation, 100 trajectories
{{?model=pf}} xs = LowLevelParticleFilters.smoothed_mean(xb)  # smoothed means, nx x T
{{?model=rbf}} # The package has no RBPF smoother: its particle smoother scores whole-state transitions, which the marginalised xl does not have

plot(transpose(xf), label="Filtered", color=1)  # filtered
{{?model!=rbf}} plot!(transpose(xs), label="Smoothed", color=2, ls=:dash)  # smoothed: uses future data, so less noisy (offline only)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "innovations"
label = "Innovation Sequence"
desc = "Check innovations for whiteness: they should be uncorrelated if the model is correct"
code = '''
using LowLevelParticleFilters, LinearAlgebra, Plots, StatsBase  # filter + cholesky + plotting + autocor

sol = forward_trajectory({{model}}, {{data}}.u, {{data}}.y)  # run filter (Kalman-type filters)
innov = reduce(hcat, sol.e)  # innovations y(t) - yhat(t|t-1), ny x T
z = reduce(hcat, [cholesky(Symmetric(Matrix(sol.S[t]))).L \ sol.e[t] for t in eachindex(sol.e)])  # standardised by the innovation covariance S(t) (stored as a matrix or a Cholesky factor, depending on the filter)

plot(transpose(z), layout=size(z, 1), title="Standardised innovation")  # zero mean, unit variance if the model fits
bar(autocor(z[1, :], 1:20), legend=false, xlabel="lag", ylabel="autocorrelation")  # near zero at all lags if white
'''

[[actionGroups.actions]]
id = "log-likelihood"
label = "Log-Likelihood"
desc = "Compute the log-likelihood of the observations under the model"
code = '''
using LowLevelParticleFilters  # filter

ll = loglik({{model}}, {{data}}.u, {{data}}.y)  # log p(y | theta), higher is better
println("Log-likelihood: ", ll)
'''

