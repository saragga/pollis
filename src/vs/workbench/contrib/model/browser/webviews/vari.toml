id = "qvi"
label = "Quasi-Variational Inequality"

[[bullets]]
text = "A variational inequality (VI) finds a point x* in a convex set K such that the operator F points inward"
detail = "no feasible direction improves the objective. It unifies fixed-point problems, optimality conditions, complementarity, and equilibrium in a single framework."

[[bullets]]
text = "Used in traffic assignment, spatial price equilibrium, contact mechanics, game theory, and economics wherever the equilibrium condition cannot be written as a simple minimisation."
detail = ""

[[decisionRows]]
task = "Variational Inequality"
context = "Fixed box K = [lb, ub]: Nash-Cournot equilibria with capacities, traffic equilibria, contact problems, KKT systems of convex programmes"
purpose = "Find x* in K with F(x*)'(y - x*) >= 0 for every y in K. On a box this is exactly the mixed complementarity problem, solved with PATH through JuMP. Default: Cournot duopoly with costs (1, 2), price 10 - x1 - x2 and capacity 3 each"

[[decisionRows]]
task = "Quasi-Variational Inequality"
context = "Constraint set that moves with the solution, K(x): generalised Nash equilibria with shared resources, where each player's feasible set depends on the others' decisions"
purpose = "Find x* in K(x*) solving the VI on K(x*). Solved by damped fixed-point iteration: solve the VI on K(x_k), move halfway towards it, update the set (undamped, the default problem cycles). Generalised Nash equilibria are typically not unique: the point reached depends on the start and the damping. Default: the same duopoly with a shared capacity x1 + x2 <= 5, which binds"

[[inputs]]
id = "n"
label = "Dimension n"
tooltip = "Number of variables; must match the length of F."
default = "2"

[[inputs]]
id = "f"
label = "Operator F(x)"
tooltip = "Vector of Julia expressions in x[1] .. x[n]. Default: minus the marginal profit of each Cournot firm, c_i - (10 - x1 - x2) + x_i."
default = "[1.0 - (10 - sum(x)) + x[1], 2.0 - (10 - sum(x)) + x[2]]"

[[inputs]]
id = "lb"
label = "Lower Bounds lb"
tooltip = "Lower bounds of the box K = [lb, ub] as a Julia vector; use -Inf for none."
default = "zeros(2)"
models = ["vi"]

[[inputs]]
id = "ub"
label = "Upper Bounds ub"
tooltip = "Upper bounds of the box K = [lb, ub] as a Julia vector; use Inf for none."
default = "[3.0, 3.0]"
models = ["vi"]

[[inputs]]
id = "K"
label = "Moving Set K(x)"
tooltip = "Julia expression in x returning the tuple (lb, ub) of the box K(x). Default: shared capacity 5, each firm limited to 5 minus the other's output."
default = "(zeros(2), 5.0 .- (sum(x) .- x))"
models = ["qvi"]

