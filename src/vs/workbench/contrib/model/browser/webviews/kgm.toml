# Kaggle Models Webview Configuration
# Declarative source. The build script generates kgm.data.ts.
# Run: npm run gulp compile-toml
#
# Approach: model weights are downloaded from Kaggle Models and run in Julia with
# ONNX.jl (exported models) or Flux.jl. The Explore pane queries the Kaggle Models API
# live. The Kaggle API key is stored in Secret Storage and only injected into the REPL
# session, never written to a file.

[meta]
title = "Kaggle Models"
viewType = "pollis.kgm"
defaultModel = "nlp"

[notes.explore]
intro = "Pick a Task to search the catalogue, then narrow with Framework and Author. Selecting several Frameworks or Authors matches any of them (<strong>OR</strong>), and the categories combine with <strong>AND</strong>. For example, <em>PyTorch</em> plus <em>TensorFlow</em> under Framework plus an Author builds: <code>(PyTorch OR TensorFlow) AND (Author)</code>"

# Interactive Explore pane (replaces the static Illustration pane). Groups sharing an
# `axis` are OR-ed, different axes AND-ed. The axes map onto the Kaggle Models API:
# task -> search (the first selected task's search term), framework -> framework, author -> owner.
