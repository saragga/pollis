[[codeBranches]]
model = "multimodal"
code = """
using ONNX, Images

model = ONNX.load("clip-vit-base.onnx")  # load CLIP model from Kaggle weights

img   = load("photo.jpg")  # load image
img_t = preprocess(img)  # resize to 224x224, normalise
txt_t = tokenize("a cat on a mat")  # tokenise text query
out   = model(img_t, txt_t)  # joint vision–language forward pass
sim   = out["logits_per_image"]  # image–text similarity logits
"""

[[codeBranches]]
model = "nlp"
code = """
using ONNX

model = ONNX.load("gemma-2b-it.onnx")  # load NLP model from Kaggle weights

ids   = tokenize("Summarise this article:")  # tokenise prompt
out   = model(ids)  # autoregressive forward pass
text  = decode(out["logits"])  # decode output token ids
"""

[[codeBranches]]
model = "vision"
code = """
using ONNX, Images

model = ONNX.load("resnet50.onnx")  # load ResNet from Kaggle weights

img    = load("image.jpg")  # load image
img_t  = preprocess(img)  # resize and normalise to (3, 224, 224)
logits = model(img_t)["output"]  # forward pass; shape: (1000,)
pred   = argmax(logits)  # predicted ImageNet class index
"""

[[codeBranches]]
model = "audio"
code = """
using ONNX, WAV

model = ONNX.load("whisper-small.onnx")  # load Whisper from Kaggle weights

wave, sr = wavread("audio.wav")  # load 16 kHz mono waveform
feats    = log_mel_spectrogram(wave)  # extract log-mel features
out      = model(feats)  # run encoder–decoder forward pass
text     = decode(out["token_ids"])  # decoded transcript
"""

[[codeBranches]]
model = "tabular"
code = """
using ONNX, CSV, Tables

model = ONNX.load("tabular-classifier.onnx")  # load tabular model from Kaggle weights

tbl   = CSV.File("data.csv")  # load tabular data
X     = Tables.matrix(tbl)[:, 1:end-1]  # feature matrix, shape (n_samples, n_features)
probs = model(transpose(X))  # class probabilities, shape (n_classes, n_samples)
pred  = argmax.(eachcol(probs))  # predicted class for each sample
"""

[[codeBranches]]
model = "rl"
code = """
using ONNX

policy = ONNX.load("ppo-cartpole.onnx")  # load RL policy from Kaggle weights

obs    = Float32.([0.02, -0.01, 0.03, -0.02])  # CartPole observation vector
out    = policy(obs)  # forward pass through policy network
action = argmax(out["action_probs"])  # greedy action selection
"""

[[codeBranches]]
model = "*"
code = """
using ONNX

model = ONNX.load("model.onnx")  # load any Kaggle ONNX model
out   = model(input)  # run forward pass
"""

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "prediction-probs"
label = "Prediction Probabilities"
desc = "Plot the top-5 class probabilities from the model output"
code = """
using ONNX, Plots, Images

model  = ONNX.load("resnet50.onnx")  # load vision model
img_t  = preprocess(load("image.jpg"))  # preprocess image
logits = model(img_t)["output"]  # forward pass
probs  = exp.(logits .- maximum(logits)); probs ./= sum(probs)  # softmax: the network outputs logits, not probabilities
top5   = sortperm(probs, rev=true)[1:5]  # top-5 class indices
bar(IMAGENET_LABELS[top5], probs[top5], title="Top-5 predictions", ylabel="probability")  # plot probabilities
"""

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "model-info"
label = "Model Info"
desc = "Inspect ONNX model inputs, outputs, and operator graph"
code = """
using ONNX

model = ONNX.load("model.onnx")  # load model
println("Inputs:  ", ONNX.input_names(model))  # list input names
println("Outputs: ", ONNX.output_names(model))  # list output names
println("Nodes:   ", length(model.graph.node))  # operator count
"""

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "batch-inference"
label = "Batch Inference"
desc = "Run inference over a list of inputs in mini-batches"
code = """
using ONNX

model = ONNX.load("model.onnx")  # load model once
batch = 16  # mini-batch size
for i in 1:batch:length(inputs)
    chunk = inputs[i:min(i+batch-1, end)]  # current mini-batch
    outs  = model(stack(chunk))  # one forward pass on the stacked batch (model.(x) would apply it to every array element)
end
"""

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-models"
label = "Compare Models"
desc = "Benchmark two Kaggle ONNX models on the same input"
code = """
using ONNX, BenchmarkTools

files = ["model-a.onnx", "model-b.onnx"]  # models to compare

for f in files
    m   = ONNX.load(f)  # load model
    t   = @benchmark m(input)  # benchmark forward pass
    println(f, " median: ", median(t).time, " ns")  # report median time
end
"""

[[actionGroups.actions]]
id = "julia-onnx-vs-python"
label = "Julia (ONNX) vs Python"
desc = "Run the same Kaggle ONNX model in Julia and Python; compare outputs and latency"
code = """
# ── Julia side (ONNX.jl) ──────────────────────────────────────
using ONNX, BenchmarkTools

model  = ONNX.load("resnet50.onnx")  # load Kaggle ONNX model (e.g. keras/resnet)
input  = rand(Float32, 224, 224, 3, 1)  # random image input (H, W, C, batch)
out_jl = model(input)  # forward pass
pred_jl = argmax(out_jl["logits"][:, 1])  # top-1 class index

t_jl   = @benchmark model(input)  # benchmark
println("Julia  median: ", median(t_jl).time ÷ 1_000_000, " ms")  # report latency

# ── Python side (run in terminal) ─────────────────────────────
# pip install onnxruntime numpy
# python3 - <<EOF
# import onnxruntime as ort, numpy as np, time
# sess  = ort.InferenceSession("resnet50.onnx")
