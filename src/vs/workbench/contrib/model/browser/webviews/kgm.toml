[[actionGroups.actions]]
id = "occlusion"
label = "Occlusion Sensitivity"
desc = "Occlude image patches or drop tokens and plot the fall in the predicted class probability"
models = ["nlp", "vision"]
code = """
using Plots

# run the model code first: hide part of the input and measure how much the predicted class probability falls
{{?model=vision}}x0, c = preprocess("image.jpg"), pred
{{?model=vision}}patch, stride = 32, 16
{{?model=vision}}grid = 1:stride:224 - patch + 1  # patch positions, rows and columns
{{?model=vision}}heat = zeros(length(grid), length(grid))
{{?model=vision}}for (a, i) in enumerate(grid), (b, j) in enumerate(grid)
{{?model=vision}}    x = copy(x0)
{{?model=vision}}    x[1, :, i:i+patch-1, j:j+patch-1] .= 0  # 0 is the mean colour after normalisation
{{?model=vision}}    heat[a, b] = probs[c] - softmax(vec(first(values(model(Dict(inname => x))))))[c]
{{?model=vision}}end
{{?model=vision}}heatmap(heat, yflip = true, title = "Fall in P(" * IMAGENET_CLASSES[c - 1] * ")", xlabel = "patch column", ylabel = "patch row")
{{?model=nlp}}enc = encode(tok, text)  # tokens and ids, with [CLS] and [SEP]
{{?model=nlp}}c   = argmax(probs)  # predicted label
{{?model=nlp}}pc(ids) = softmax(vec(model(Dict("input_ids" => reshape(ids, 1, :), "attention_mask" => ones(Int, 1, length(ids))))["logits"]))[c]
{{?model=nlp}}imp = [probs[c] - pc(deleteat!(copy(enc.ids), k)) for k in 2:length(enc.ids) - 1]  # drop one word piece at a time
{{?model=nlp}}bar(enc.tokens[2:end-1], imp, title = "Fall in P(" * labels[c] * ") without each token", xrotation = 45, legend = false)
"""
