[[codeBranches]]
model = "multimodal"
code = """
using ONNX
using ONNX: Umlaut  # ONNX.load returns an Umlaut tape, run with Umlaut.play!

# ONNX.jl runs the graph only: CLIP needs its own BPE tokenizer and image preprocessing, which ONNX.jl does not provide
ids    = reshape(Int64[49406, 320, 2368, 525, 320, 7063, 49407], :, 1)  # token ids of "a cat on a mat" from the CLIP tokenizer, shape (seq, batch)
pixels = rand(Float32, 224, 224, 3, 1)  # replace with the CLIP-normalised image, shape (W, H, C, batch)
mask   = ones(Int64, size(ids))  # attention mask

# arguments follow the order of the graph inputs (see Model Info); some exports use operators ONNX.jl does not implement yet
model = ONNX.load("clip-vit-base.onnx", ids, pixels, mask)
outs  = Umlaut.play!(model, ids, pixels, mask)  # a tuple in the order of the graph outputs
sim   = outs[1]  # logits_per_image when it is the first output: image-text similarity
"""

[[codeBranches]]
model = "nlp"
code = """
using ONNX
using ONNX: Umlaut  # ONNX.load returns an Umlaut tape, run with Umlaut.play!

# ONNX.jl runs the graph only: token ids come from the model tokenizer, and decoding them back to text needs it too
ids   = Int64[2, 9083, 736, 5078, 235292]  # token ids of the prompt (placeholder values from the Gemma tokenizer)
model = ONNX.load("gemma-2b-it.onnx", reshape(ids, :, 1))  # an export without KV-cache inputs, traced with shape (seq, batch)

for step in 1:20  # greedy generation: one forward pass per new token
    logits = Umlaut.play!(model, reshape(ids, :, 1))  # (vocab, seq, batch)
    push!(ids, argmax(logits[:, end, 1]) - 1)  # most likely next token (ids are 0-based)
end
ids  # generated token ids: decode them with the same tokenizer
"""

[[codeBranches]]
model = "vision"
code = """
using ONNX, Images
using ONNX: Umlaut  # ONNX.load returns an Umlaut tape, run with Umlaut.play!

path = "resnet18.onnx"  # an ONNX ImageNet classifier, e.g. from Kaggle Models or the ONNX model zoo
isfile(path) || download("https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx", path)
include(download("https://raw.githubusercontent.com/FluxML/ONNX.jl/master/examples/imagenet_classes.jl"))  # IMAGENET_CLASSES, 0-based

function preprocess(file)  # image -> (W, H, C, 1) Float32: Julia dims are the reverse of the ONNX (1, C, H, W) layout
    x = permutedims(Float32.(channelview(RGB.(imresize(load(file), (224, 224))))), (3, 2, 1))  # CHW -> WHC
    x = (x .- reshape(Float32[0.485, 0.456, 0.406], 1, 1, 3)) ./ reshape(Float32[0.229, 0.224, 0.225], 1, 1, 3)  # ImageNet normalisation
    reshape(x, size(x)..., 1)
end

model = ONNX.load(path, rand(Float32, 224, 224, 3, 1))  # trace the graph with a dummy input of the right shape

logits = vec(Umlaut.play!(model, preprocess("image.jpg")))  # forward pass: 1000 ImageNet logits
pred   = argmax(logits)  # predicted class (1-based)
IMAGENET_CLASSES[pred - 1]  # its label
"""

[[codeBranches]]
model = "audio"
code = """
using ONNX
using ONNX: Umlaut  # ONNX.load returns an Umlaut tape, run with Umlaut.play!

# Whisper is an encoder-decoder, usually exported as two graphs; ONNX.jl provides neither the log-mel features nor the tokenizer
mel     = rand(Float32, 3000, 80, 1)  # replace with the 80-bin log-mel spectrogram of 30 s of 16 kHz audio, shape (frames, mels, batch)
encoder = ONNX.load("whisper-small-encoder.onnx", mel)
hidden  = Umlaut.play!(encoder, mel)  # audio embedding

ids     = reshape(Int64[50258, 50259, 50359, 50363], :, 1)  # start-of-transcript prompt tokens (English, transcribe, no timestamps)
decoder = ONNX.load("whisper-small-decoder.onnx", ids, hidden)  # arguments in the order of the graph inputs
for step in 1:100  # greedy decoding, one token per pass
    logits = Umlaut.play!(decoder, ids, hidden)  # (vocab, seq, batch)
    next = argmax(logits[:, end, 1]) - 1  # most likely next token (0-based)
    next == 50257 && break  # end of transcript
    global ids = vcat(ids, fill(next, 1, 1))
end
ids  # transcript token ids: decode them with the Whisper tokenizer
"""

[[codeBranches]]
model = "tabular"
code = """
using ONNX, CSV, Tables
using ONNX: Umlaut  # ONNX.load returns an Umlaut tape, run with Umlaut.play!

tbl   = CSV.File("data.csv")  # load tabular data
X     = Float32.(Tables.matrix(tbl)[:, 1:end-1])  # feature matrix, shape (n_samples, n_features)
Xt    = Matrix(transpose(X))  # (n_features, n_samples): Julia dims are the reverse of the ONNX (n_samples, n_features)
model = ONNX.load("tabular-classifier.onnx", Xt)
probs = Umlaut.play!(model, Xt)  # class scores, shape (n_classes, n_samples)
pred  = argmax.(eachcol(probs))  # predicted class for each sample
"""

[[codeBranches]]
model = "rl"
code = """
using ONNX
using ONNX: Umlaut  # ONNX.load returns an Umlaut tape, run with Umlaut.play!

obs    = reshape(Float32[0.02, -0.01, 0.03, -0.02], :, 1)  # CartPole observation, shape (4, batch)
policy = ONNX.load("ppo-cartpole.onnx", obs)  # load RL policy from Kaggle weights
out    = Umlaut.play!(policy, obs)  # action logits or probabilities, shape (2, batch)
action = argmax(out[:, 1]) - 1  # greedy action (CartPole actions are 0 and 1)
"""

[[codeBranches]]
model = "*"
code = """
using ONNX
using ONNX: Umlaut  # ONNX.load returns an Umlaut tape, run with Umlaut.play!

x     = rand(Float32, 224, 224, 3, 1)  # an input of the shape the graph expects, dims reversed from ONNX
model = ONNX.load("model.onnx", x)  # load any Kaggle ONNX model
out   = Umlaut.play!(model, x)  # run forward pass
"""

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "prediction-probs"
label = "Prediction Probabilities"
desc = "Plot the top-5 class probabilities from the model output"
code = """
using ONNX, Images, Plots
using ONNX: Umlaut  # ONNX.load returns an Umlaut tape, run with Umlaut.play!

path = "resnet18.onnx"  # an ONNX ImageNet classifier, e.g. from Kaggle Models or the ONNX model zoo
isfile(path) || download("https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx", path)
include(download("https://raw.githubusercontent.com/FluxML/ONNX.jl/master/examples/imagenet_classes.jl"))  # IMAGENET_CLASSES, 0-based

function preprocess(file)  # image -> (W, H, C, 1) Float32: Julia dims are the reverse of the ONNX (1, C, H, W) layout
    x = permutedims(Float32.(channelview(RGB.(imresize(load(file), (224, 224))))), (3, 2, 1))  # CHW -> WHC
    x = (x .- reshape(Float32[0.485, 0.456, 0.406], 1, 1, 3)) ./ reshape(Float32[0.229, 0.224, 0.225], 1, 1, 3)  # ImageNet normalisation
    reshape(x, size(x)..., 1)
end

model = ONNX.load(path, rand(Float32, 224, 224, 3, 1))  # trace the graph with a dummy input of the right shape

logits = vec(Umlaut.play!(model, preprocess("image.jpg")))  # forward pass
probs  = exp.(logits .- maximum(logits)); probs ./= sum(probs)  # softmax: the network outputs logits, not probabilities
top5   = sortperm(probs, rev=true)[1:5]  # top-5 class indices
bar([IMAGENET_CLASSES[i - 1] for i in top5], probs[top5], title="Top-5 predictions", ylabel="probability", xrotation=30)  # plot probabilities
"""

