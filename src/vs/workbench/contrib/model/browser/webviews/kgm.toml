[[actionGroups.actions]]
id = "batch-inference"
label = "Batch Inference"
desc = "Run the model on several inputs at once"
code = """
# run the model code first: it defines the model and its helpers
{{?model=multimodal}}files  = ["image1.jpg", "image2.jpg", "image3.jpg"]  # replace with your images
{{?model=multimodal}}pixels = reduce(vcat, clip_pixels.(files))  # (n_images, 3, 224, 224): one batch
{{?model=multimodal}}feeds  = filter(p -> p.first in ORT.input_names(model), Dict("input_ids" => ids, "pixel_values" => pixels, "attention_mask" => mask))
{{?model=multimodal}}sim    = model(feeds, ["logits_per_image"])["logits_per_image"]  # (n_images, n_labels)
{{?model=multimodal}}[(f, labels[argmax(r)]) for (f, r) in zip(files, eachrow(sim))]  # best label for each image
{{?model=nlp}}texts = ["A gripping, beautifully shot film.", "Two hours I will never get back.", "It was fine, nothing special."]
{{?model=nlp}}P     = classify(texts)  # (n_texts, 2): padded and masked, one forward pass
{{?model=nlp}}[(t, labels[argmax(r)], round(maximum(r), digits = 3)) for (t, r) in zip(texts, eachrow(P))]
{{?model=vision}}files  = ["image1.jpg", "image2.jpg", "image3.jpg"]  # replace with your images
{{?model=vision}}logits = first(values(model(Dict(inname => reduce(vcat, preprocess.(files))))))  # (n_images, 1000): one batch
{{?model=vision}}[(f, IMAGENET_CLASSES[argmax(r) - 1]) for (f, r) in zip(files, eachrow(logits))]
{{?model=audio}}files = ["speech1.wav", "speech2.wav"]  # replace with your audio files
{{?model=audio}}[(f, transcribe(f)) for f in files]  # the decoder loop runs once per file
"""

