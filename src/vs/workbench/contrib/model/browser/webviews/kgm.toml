[[actionGroups.actions]]
id = "model-info"
label = "Model Info"
desc = "Inspect ONNX model inputs, outputs, and operator graph"
code = """
using ONNX

proto = open(io -> ONNX.decode(ONNX.ProtoDecoder(io), ONNX.ModelProto), "model.onnx")  # the raw ONNX protobuf
g     = proto.graph
inits = Set(t.name for t in g.initializer)  # weights are listed as inputs too
println("Inputs:  ", [i.name for i in g.input if !(i.name in inits)])  # inputs to feed, in order
println("Outputs: ", [o.name for o in g.output])  # outputs, in order
println("Nodes:   ", length(g.node))  # operator count
println("Ops:     ", unique(n.op_type for n in g.node))  # check these against the operators ONNX.jl implements
"""

