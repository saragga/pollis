[[actionGroups.actions]]
id = "compare-models"
label = "Compare Models"
desc = "Benchmark ResNet-18 against ResNet-50 on the same image: top-1 label and median latency"
models = ["vision"]
code = """
using BenchmarkTools, Statistics

# run the model code first; ResNet-50 is the larger ONNX model zoo sibling of ResNet-18
zoo        = "https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/"
candidates = [("ResNet-18", "resnet18.onnx", zoo * "resnet18-v1-7.onnx"), ("ResNet-50", "resnet50.onnx", zoo * "resnet50-v1-7.onnx")]
x = preprocess("image.jpg")  # the same input for both

for (name, file, url) in candidates
    m     = ORT.load_inference(getfile(url, file))
    iname = ORT.input_names(m)[1]
    p     = softmax(vec(first(values(m(Dict(iname => x))))))
    t     = @benchmark $m(Dict($iname => $x))  # warm-up included: median over many runs
    println(rpad(name, 11), IMAGENET_CLASSES[argmax(p) - 1], " (", round(maximum(p), digits = 3), "), median ", round(median(t).time / 1e6, digits = 1), " ms")
end
"""

[[actionGroups.actions]]
