desc = "Run the same ONNX model through ONNX Runtime from Julia and from Python on the same input; compare outputs and median latency"
models = ["vision"]
code = """
# Julia side (ONNXRunTime.jl); run the model code first
using BenchmarkTools, Statistics

x = preprocess("image.jpg")  # (1, 3, 224, 224), the ONNX layout
write("input.bin", permutedims(x, (4, 3, 2, 1)))  # reversed dims in column-major order are numpy row-major (1, 3, 224, 224)

out_jl = vec(first(values(model(Dict(inname => x)))))  # forward pass
t_jl   = @benchmark $model(Dict($inname => $x))  # warm-up included: median over many runs
println("Julia  median: ", round(median(t_jl).time / 1e6, digits=1), " ms, top-1 ", argmax(out_jl) - 1)

