[[codeBranches]]
model = "multimodal"
code = """
import ONNXRunTime as ORT
using HuggingFaceTokenizers, Images

getfile(url, file) = isfile(file) ? file : download(url, file)  # download once, then reuse
softmax(v) = (e = exp.(v .- maximum(v)); e ./ sum(e))

# zero-shot image classification with CLIP: the image is scored against each text label
repo  = "Xenova/clip-vit-base-patch32"  # ONNX export of openai/clip-vit-base-patch32
model = ORT.load_inference(getfile("https://huggingface.co/$repo/resolve/main/onnx/model.onnx", "clip-vit-base-patch32.onnx"))
tok   = from_pretrained(Tokenizer, repo)  # the CLIP BPE tokenizer

function clip_pixels(file)  # image -> (1, 3, 224, 224) Float32, the ONNX (batch, C, H, W) layout
    img  = RGB.(load(file))
    h, w = size(img)
    s    = 224 / min(h, w)  # shortest edge to 224 (CLIP resizes bicubic, imresize is bilinear)
    img  = imresize(img, (max(224, round(Int, s * h)), max(224, round(Int, s * w))))
    i, j = div(size(img, 1) - 224, 2), div(size(img, 2) - 224, 2)  # centre crop
    x    = Float32.(channelview(img[i+1:i+224, j+1:j+224]))  # (C, H, W) in [0, 1]
    x    = (x .- Float32[0.48145466, 0.4578275, 0.40821073]) ./ Float32[0.26862954, 0.26130258, 0.27577711]  # CLIP normalisation
    reshape(x, 1, size(x)...)
end

function clip_text(labels)  # token ids and attention mask, (n_labels, seq), padded with the end token
    enc  = [encode(tok, s).ids for s in labels]  # start and end tokens are added by the tokenizer
    L    = maximum(length, enc)
    ids  = fill(49407, length(enc), L)
    mask = zeros(Int, length(enc), L)
    for (k, e) in enumerate(enc)
        ids[k, 1:length(e)] .= e
        mask[k, 1:length(e)] .= 1
    end
    ids, mask
end

labels    = ["a photo of a cat", "a photo of a dog", "a photo of a car"]
ids, mask = clip_text(labels)
feeds     = Dict("input_ids" => ids, "pixel_values" => clip_pixels("image.jpg"), "attention_mask" => mask)  # replace with your image
feeds     = filter(p -> p.first in ORT.input_names(model), feeds)  # feed only the inputs this export declares
sim       = model(feeds, ["logits_per_image"])["logits_per_image"]  # (n_images, n_labels) scaled cosine similarities
probs     = softmax(vec(sim))  # probability of each label for the image
collect(zip(labels, round.(probs, digits = 3)))
"""

[[codeBranches]]
model = "nlp"
code = """
import ONNXRunTime as ORT
using HuggingFaceTokenizers

getfile(url, file) = isfile(file) ? file : download(url, file)  # download once, then reuse
softmax(v) = (e = exp.(v .- maximum(v)); e ./ sum(e))

# sentiment classification with DistilBERT fine-tuned on SST-2
repo   = "Xenova/distilbert-base-uncased-finetuned-sst-2-english"  # ONNX export of the Hugging Face model
model  = ORT.load_inference(getfile("https://huggingface.co/$repo/resolve/main/onnx/model.onnx", "distilbert-sst2.onnx"))
tok    = from_pretrained(Tokenizer, repo)  # the WordPiece tokenizer
labels = ["NEGATIVE", "POSITIVE"]

function classify(texts)  # (n_texts, 2) class probabilities, one forward pass
    enc  = [encode(tok, t).ids for t in texts]  # [CLS] and [SEP] are added by the tokenizer
    L    = maximum(length, enc)
    ids  = zeros(Int, length(enc), L)  # padded with [PAD] = 0
    mask = zeros(Int, length(enc), L)  # 1 for real tokens, 0 for padding
    for (k, e) in enumerate(enc)
        ids[k, 1:length(e)] .= e
        mask[k, 1:length(e)] .= 1
    end
    logits = model(Dict("input_ids" => ids, "attention_mask" => mask))["logits"]  # (n_texts, 2)
    mapslices(softmax, logits, dims = 2)
end

text  = "The film was a delight from start to finish."
probs = vec(classify([text]))
collect(zip(labels, round.(probs, digits = 3)))
"""

[[codeBranches]]
model = "vision"
code = """
import ONNXRunTime as ORT
using Images

getfile(url, file) = isfile(file) ? file : download(url, file)  # download once, then reuse
softmax(v) = (e = exp.(v .- maximum(v)); e ./ sum(e))

# ImageNet classification with ResNet-18 from the ONNX model zoo
model  = ORT.load_inference(getfile("https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx", "resnet18.onnx"))
inname = ORT.input_names(model)[1]  # the image input
include(getfile("https://raw.githubusercontent.com/FluxML/ONNX.jl/master/examples/imagenet_classes.jl", "imagenet_classes.jl"))  # IMAGENET_CLASSES, 0-based

function preprocess(file)  # image -> (1, 3, 224, 224) Float32, the ONNX (batch, C, H, W) layout
    x = Float32.(channelview(RGB.(imresize(load(file), (224, 224)))))  # (C, H, W) in [0, 1]
    x = (x .- Float32[0.485, 0.456, 0.406]) ./ Float32[0.229, 0.224, 0.225]  # ImageNet normalisation
    reshape(x, 1, size(x)...)
end

logits = vec(first(values(model(Dict(inname => preprocess("image.jpg"))))))  # 1000 ImageNet logits; replace with your image
probs  = softmax(logits)
pred   = argmax(probs)  # predicted class (1-based)
IMAGENET_CLASSES[pred - 1], round(probs[pred], digits = 3)
"""

[[codeBranches]]
model = "audio"
code = """
import ONNXRunTime as ORT
using HuggingFaceTokenizers, WAV, DSP, FFTW, Statistics

getfile(url, file) = isfile(file) ? file : download(url, file)  # download once, then reuse

# speech recognition with Whisper tiny (English-only), exported as an encoder and a decoder graph;
# the log-mel front end is written out below (same steps as whisper.audio.log_mel_spectrogram)

function load_audio(file; sr = 16000)
    y, fs = wavread(file)  # samples x channels, values in [-1, 1]
    x = vec(mean(y, dims = 2))  # mix down to mono
    fs == sr || (x = resample(x, sr / fs))  # Whisper expects 16 kHz
    n = 30 * sr  # one 30 s window: trim or pad with silence
    length(x) >= n ? x[1:n] : vcat(x, zeros(n - length(x)))
end

function mel_filters(; sr = 16000, n_fft = 400, n_mels = 80)  # Slaney mel filterbank, as librosa.filters.mel
    f_sp, logstep = 200 / 3, log(6.4) / 27
    hz2mel(f) = f < 1000 ? f / f_sp : 15 + log(f / 1000) / logstep
    mel2hz(m) = m < 15 ? f_sp * m : 1000 * exp(logstep * (m - 15))
    freqs = range(0, sr / 2, length = div(n_fft, 2) + 1)
    pts = mel2hz.(range(hz2mel(0), hz2mel(sr / 2), length = n_mels + 2))
    W = zeros(n_mels, length(freqs))
    for i in 1:n_mels, (j, f) in enumerate(freqs)
        rise = (f - pts[i]) / (pts[i+1] - pts[i])
        fall = (pts[i+2] - f) / (pts[i+2] - pts[i+1])
        W[i, j] = max(0, min(rise, fall)) * 2 / (pts[i+2] - pts[i])  # triangle, normalised to equal area
    end
    W
end

function log_mel(x; n_fft = 400, hop = 160)
    h = div(n_fft, 2)
    xp = vcat(x[h+1:-1:2], x, x[end-1:-1:end-h])  # reflect padding, so frames are centred
    win = [0.5 - 0.5 * cos(2pi * k / n_fft) for k in 0:n_fft-1]  # periodic Hann window
    nframes = div(length(x), hop)  # 3000 frames for 30 s (the extra final frame is dropped)
    P = reduce(hcat, [abs2.(rfft(win .* xp[t*hop+1:t*hop+n_fft])) for t in 0:nframes-1])  # power spectrum, (201, frames)
    S = log10.(max.(mel_filters(n_fft = n_fft) * P, 1e-10))  # log-mel, (80, frames)
    S = max.(S, maximum(S) - 8)  # keep an 80 dB dynamic range
    (S .+ 4) ./ 4  # Whisper scaling
end

repo    = "Xenova/whisper-tiny.en"  # ONNX export of openai/whisper-tiny.en
encoder = ORT.load_inference(getfile("https://huggingface.co/$repo/resolve/main/onnx/encoder_model.onnx", "whisper-tiny-en-encoder.onnx"))
decoder = ORT.load_inference(getfile("https://huggingface.co/$repo/resolve/main/onnx/decoder_model.onnx", "whisper-tiny-en-decoder.onnx"))
tok     = from_pretrained(Tokenizer, repo)  # the Whisper BPE tokenizer

function transcribe(file; maxlen = 200)
    S      = log_mel(load_audio(file))  # (80 mels, 3000 frames)
    mel    = reshape(Float32.(S), 1, size(S)...)  # (batch, mels, frames), the ONNX layout
    hidden = encoder(Dict("input_features" => mel))["last_hidden_state"]  # audio embedding, (1, 1500, 384)
    ids    = [50257, 50362]  # start-of-transcript and no-timestamps tokens of the English-only model
    for step in 1:maxlen  # greedy decoding, one token per pass (no KV cache: the whole prefix is rerun)
        logits = decoder(Dict("input_ids" => reshape(ids, 1, :), "encoder_hidden_states" => hidden))["logits"]  # (batch, seq, vocab)
        scores = logits[1, end, :]
        step == 1 && (scores[[221, 50257]] .= -Inf32)  # never start with a blank or end of text (tokens 220 and 50256)
        next = argmax(scores) - 1  # most likely next token (0-based)
        next == 50256 && break  # end of text
        push!(ids, next)
    end
    decode(tok, ids; skip_special_tokens = true)
end

transcribe("speech.wav")  # replace with your audio file
"""

