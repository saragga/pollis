[[actionGroups.actions]]
id = "batch-inference"
label = "Batch Inference"
desc = "Run inference over a list of inputs in mini-batches"
code = """
using ONNX
using ONNX: Umlaut

batch = 16  # mini-batch size
model = ONNX.load("model.onnx", stack(inputs[1:batch]))  # trace once with a full batch; inputs: vector of arrays of the shape the graph expects
outs  = []
for i in 1:batch:length(inputs) - batch + 1  # full batches only: the traced graph may fix the batch size
    push!(outs, Umlaut.play!(model, stack(inputs[i:i+batch-1])))  # one forward pass on the stacked batch
end
"""

