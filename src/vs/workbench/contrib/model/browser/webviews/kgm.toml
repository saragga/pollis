id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-models"
label = "Compare Models"
desc = "Benchmark two Kaggle ONNX models on the same input"
code = """
using ONNX, BenchmarkTools
using ONNX: Umlaut

files = ["model-a.onnx", "model-b.onnx"]  # models to compare
x = rand(Float32, 224, 224, 3, 1)  # the same input for both, dims reversed from ONNX

for f in files
    m = ONNX.load(f, x)  # load model
    t = @benchmark Umlaut.play!($m, $x)  # benchmark forward pass
    println(f, " median: ", round(median(t).time / 1e6, digits=2), " ms")  # report median time
end
"""

[[actionGroups.actions]]
id = "julia-onnx-vs-python"
label = "Julia (ONNX) vs Python"
desc = "Run the same Kaggle ONNX model in Julia and Python on the same input; compare outputs and median latency"
code = """
# Julia side (ONNX.jl)
using ONNX, BenchmarkTools
using ONNX: Umlaut

x = rand(Float32, 224, 224, 3, 1)  # (W, H, C, batch): ONNX.jl reverses the ONNX (batch, C, H, W) dimensions
write("input.bin", x)  # the same values for Python: column-major (W, H, C, batch) is row-major (batch, C, H, W)

model  = ONNX.load("resnet50.onnx", x)
out_jl = vec(Umlaut.play!(model, x))  # forward pass
t_jl   = @benchmark Umlaut.play!($model, $x)  # warm-up included: median over many runs
println("Julia  median: ", round(median(t_jl).time / 1e6, digits=1), " ms, top-1 ", argmax(out_jl) - 1)

