[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "robust-frontier"
label = "Robust Frontier"
desc = "Robust optimal profit as the relative deviation rho grows, against the nominal optimum"
code = '''
using Plots
rhos = 0:0.02:0.5
objs = [solve_robust(set; Ahat=r .* abs.(A), par...).obj for r in rhos]
plot(rhos, objs, marker=:o, xlabel="Relative deviation rho", ylabel="Optimal profit", label=string(set) * " robust")
hline!([nom.obj], ls=:dash, label="nominal", title="Robust frontier")
'''

[[actionGroups.actions]]
id = "feasible-region"
label = "Feasible Region"
desc = "Nominal and robust feasible sets for two products, with both optimal solutions"
code = '''
using Plots
if n != 2
    "The feasible-region plot needs exactly two products"
else
    g = range(0, 1.3 * maximum(nom.x) + 0.5, length=250)
    feasible(s, x) = all(worst_use(s, x; par...) .<= b .+ 1e-9)
    region = [feasible(:nominal, [x1, x2]) + feasible(set, [x1, x2]) for x2 in g, x1 in g]  # 1 nominal only, 2 robust
    heatmap(g, g, region, c=cgrad([:white, :lightblue, :steelblue]), colorbar=false, xlabel="x1", ylabel="x2", title="Nominal and robust feasible sets")
    scatter!([nom.x[1]], [nom.x[2]], ms=6, label="nominal optimum")
    scatter!([sol.x[1]], [sol.x[2]], ms=6, marker=:diamond, label="robust optimum")
end
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "worst-case"
label = "Worst-Case Scenario"
desc = "Resource use of the nominal and robust solutions at the worst coefficients in the set, against capacity"
code = '''
wn, wr = worst_use(set, nom.x; par...), worst_use(set, sol.x; par...)
[(constraint = i, capacity = b[i], nominal_use = round(dot(A[i, :], nom.x), digits=3), nominal_worst_case = round(wn[i], digits=3),
  robust_worst_case = round(wr[i], digits=3), nominal_violated = wn[i] > b[i] + 1e-6) for i in 1:nc]
'''

[[actionGroups.actions]]
id = "nominal-check"
label = "Nominal Suboptimality"
desc = "Profit given up by the robust solution, and how far the nominal solution overshoots capacity in the worst case"
code = '''
(nominal_profit = round(nom.obj, digits=3), robust_profit = round(sol.obj, digits=3), profit_given_up = round(nom.obj - sol.obj, digits=3),
 nominal_worst_overshoot = round(maximum(worst_use(set, nom.x; par...) .- b), digits=3))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "price-robustness"
label = "Price of Robustness"
desc = "Profit and simulated violation probability as the protection level grows: the trade-off the set controls"
code = '''
using Plots
{{?model=box}}pvals, pname = 0:0.1:1, "Protected fraction of rho"
{{?model=box}}sols = [solve_robust(:box; Ahat=k .* Ahat) for k in pvals]
{{?model=ellip}}pvals, pname = 0:0.25:3, "omega"
{{?model=ellip}}sols = [solve_robust(:ellip; omega=v) for v in pvals]
{{?model=budget|poly}}pvals, pname = 0:0.25:n, "Gamma"
{{?model=budget|poly}}sols = [solve_robust(set; gamma=v) for v in pvals]
plot(plot(pvals, [s.obj for s in sols], marker=:o, xlabel=pname, ylabel="Profit", legend=false),
    plot(pvals, [violation(s.x) for s in sols], marker=:o, xlabel=pname, ylabel="P(violation)", legend=false),
    layout=(1, 2), size=(900, 350))
'''

[[actionGroups.actions]]
id = "violation-probability"
label = "Violation Probability"
desc = "Monte Carlo probability that each constraint is violated when every coefficient deviates independently and uniformly within rho"
code = '''
pv(x) = [round(mean(dot(Ak[i, :], x) > b[i] + 1e-9 for Ak in draws), digits=4) for i in 1:nc]
{{?model=budget}}println("Bertsimas-Sim bound per constraint: ", round(exp(-par.gamma^2 / (2n)), digits=4))
(nominal_per_constraint = pv(nom.x), robust_per_constraint = pv(sol.x), nominal_any = violation(nom.x), robust_any = violation(sol.x))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-stochastic"
label = "Scenario Approach"
desc = "Robust solution against the scenario approach, which enforces the constraints on K sampled coefficient matrices"
code = '''
function scenario_solution(K)
    m = Model(HiGHS.Optimizer); set_silent(m)
    @variable(m, xs[1:n] >= 0)
    @objective(m, Max, dot(c, xs))
    for Ak in sample_A(K; seed=11)
        @constraint(m, Ak * xs .<= b)
    end
    optimize!(m)
    value.(xs)
end
rows = [("nominal", nom.x), (string(set) * " robust", sol.x), [("scenario K = " * string(K), scenario_solution(K)) for K in (20, 100, 500)]...]
[(method = name, x = round.(x, digits=3), profit = round(dot(c, x), digits=3), p_violation = violation(x)) for (name, x) in rows]
'''

[[actionGroups.actions]]
id = "vs-nominal"
label = "All Sets vs Nominal"
desc = "Nominal solution and every uncertainty set at the current parameters: decisions, profit and simulated violation probability"
code = '''
kw = (gamma = get(par, :gamma, 1.0), omega = get(par, :omega, 1.0))
[begin
    r = solve_robust(s; kw...)
    (set = s, x = round.(r.x, digits=3), profit = round(r.obj, digits=3), p_violation = violation(r.x))
end for s in (:nominal, :box, :ellip, :budget, :poly)]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "conservatism"
label = "Conservatism Analysis"
desc = "Slack of the robust solution at nominal and at worst-case coefficients, and the protection used relative to the box set"
code = '''
[(constraint = i, nominal_slack = round(b[i] - dot(A[i, :], sol.x), digits=3), worst_case_slack = round(b[i] - worst_use(set, sol.x; par...)[i], digits=3),
  protection = round(protect(set, Ahat[i, :] .* sol.x; par...), digits=3), box_protection = round(protect(:box, Ahat[i, :] .* sol.x), digits=3)) for i in 1:nc]
'''

[[actionGroups.actions]]
id = "shadow-prices"
label = "Shadow Prices"
desc = "Extra profit from one more unit of each capacity, in the nominal and in the robust problem (finite differences)"
code = '''
e(i) = [j == i ? 1.0 : 0.0 for j in 1:nc]
[(constraint = i, nominal = round((solve_robust(:nominal; b=b .+ 1e-3 .* e(i)).obj - nom.obj) / 1e-3, digits=3),
  robust = round((solve_robust(set; b=b .+ 1e-3 .* e(i), par...).obj - sol.obj) / 1e-3, digits=3)) for i in 1:nc]
'''
