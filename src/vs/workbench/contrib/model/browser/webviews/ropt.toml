[[codeBranches]]
model = "box"
code = '''
using JuMP, HiGHS, Clarabel, LinearAlgebra, Random, Statistics

c = {{c}}  # profit per unit (maximise c'x, x >= 0)
A = {{A}}  # nominal resource use: row i is the constraint a_i'x <= b_i
b = {{b}}  # capacities
rho = {{rho}}  # coefficient a_ij may deviate by up to rho |a_ij|
Ahat = rho .* abs.(A)  # maximal deviations
nc, n = size(A)
set, par = :box, (;)  # box set ||u||_inf <= 1

# Worst-case increase of a_i'x over the set, for deviations d = ahat_i .* x (x >= 0)
function protect(set, d; gamma=1.0, omega=1.0)
    set == :nominal && return 0.0
    set == :box && return sum(d)
    set == :ellip && return omega * norm(d)
    set == :poly && return gamma * maximum(d)
    s = sort(d, rev=true); k = min(floor(Int, gamma), length(d))  # budget: the Gamma largest deviations
    sum(s[1:k]) + (k < length(d) ? (gamma - k) * s[k+1] : 0.0)
end

function solve_robust(set; A=A, b=b, Ahat=Ahat, gamma=1.0, omega=1.0)  # robust counterpart
    m = Model(set == :ellip ? Clarabel.Optimizer : HiGHS.Optimizer); set_silent(m)
    @variable(m, x[1:n] >= 0)
    @objective(m, Max, dot(c, x))
    W = [iseven(div(r - 1, 2^(j - 1))) ? 1.0 : -1.0 for r in 1:2^n, j in 1:n]  # all sign vectors: ||u||_1 <= Gamma as W u <= h
    for i in 1:nc
        a, d = A[i, :], Ahat[i, :] .* x
        if set == :nominal
            @constraint(m, dot(a, x) <= b[i])
        elseif set == :box
            @constraint(m, dot(a, x) + sum(d) <= b[i])
        elseif set == :ellip
            @constraint(m, [b[i] - dot(a, x); omega .* d] in SecondOrderCone())
        elseif set == :budget  # Bertsimas-Sim: dual of the inner knapsack
            z = @variable(m, lower_bound = 0); p = @variable(m, [1:n], lower_bound = 0)
            @constraint(m, p .+ z .>= d)
            @constraint(m, dot(a, x) + gamma * z + sum(p) <= b[i])
        else  # max d'u over W u <= h equals min h'lam over W'lam = d, lam >= 0
            lam = @variable(m, [1:2^n], lower_bound = 0)
            @constraint(m, transpose(W) * lam .== d)
            @constraint(m, dot(a, x) + gamma * sum(lam) <= b[i])
        end
    end
    optimize!(m)
    (x = value.(x), obj = objective_value(m), solved = is_solved_and_feasible(m))
end

worst_use(set, x; kw...) = [dot(A[i, :], x) + protect(set, Ahat[i, :] .* x; kw...) for i in 1:nc]  # worst-case resource use
sample_A(K; seed=7) = (rng = MersenneTwister(seed); [A .+ Ahat .* (2 .* rand(rng, nc, n) .- 1) for _ in 1:K])  # independent uniform deviations
draws = sample_A(10_000)
violation(x) = mean(any(Ak * x .> b .+ 1e-9) for Ak in draws)  # probability that some constraint is violated

nom = solve_robust(:nominal)
sol = solve_robust(set; par...)
(robust_x = round.(sol.x, digits=3), robust_profit = round(sol.obj, digits=3), nominal_profit = round(nom.obj, digits=3),
 price_of_robustness_percent = round(100 * (1 - sol.obj / nom.obj), digits=2), solved = sol.solved)
'''

