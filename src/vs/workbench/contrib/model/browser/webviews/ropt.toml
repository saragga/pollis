[[bullets]]
text = "Robust optimisation finds a solution that remains feasible and near-optimal for all realisations of uncertain parameters within a prescribed uncertainty set"
detail = "no probability distribution is assumed. The approach is distribution-free and guarantees worst-case feasibility."

[[bullets]]
text = "The key insight is that for standard uncertainty sets (box, ellipsoidal, budgeted, polyhedral) the robust counterpart reformulates exactly into a deterministic LP or SOCP, solved directly in JuMP without a specialised robust optimisation package."
detail = ""

[[decisionRows]]
task = "Box"
context = "Every coefficient may independently take its worst value (Soyster); simplest and most conservative"
purpose = "Each resource coefficient lies in [a_ij - rho |a_ij|, a_ij + rho |a_ij|]; the robust counterpart stays an LP with every deviation added in full"

[[decisionRows]]
task = "Ellipsoidal"
context = "Deviations are unlikely to be all extreme at once; protect against a Euclidean ball of joint deviations (Ben-Tal and Nemirovski)"
purpose = "a_i = a0_i + diag(ahat_i) u with ||u||_2 <= omega; the robust counterpart is a second-order cone programme (Clarabel)"

[[decisionRows]]
task = "Budgeted"
context = "At most Gamma coefficients per constraint deviate simultaneously (Bertsimas and Sim); tunable price of robustness"
purpose = "u in the box with ||u||_1 <= Gamma; the Bertsimas-Sim reformulation keeps an LP and interpolates between nominal (Gamma = 0) and box (Gamma = n)"

[[decisionRows]]
task = "Polyhedral"
context = "Any uncertainty set described by linear inequalities W u <= h; the general LP-duality route"
purpose = "Here the cross-polytope ||u||_1 <= Gamma written as W u <= h over all sign vectors; the inner maximisation is replaced by its LP dual. It equals the budgeted set for Gamma <= 1 and is not clipped to the box beyond"

[[inputs]]
id = "c"
label = "Profit c"
tooltip = "Profit per unit of each product; the model maximises c^T x with x >= 0. The feasible-region plot needs two products."
default = "[5.0, 4.0]"

[[inputs]]
id = "A"
label = "Resource Use A"
tooltip = "Nominal resource-use matrix (one row per constraint a_i^T x <= b_i, one column per product), as a Julia matrix literal."
default = "[6.0 4.0; 1.0 2.0; -1.0 1.0; 0.0 1.0]"

[[inputs]]
id = "b"
label = "Capacity b"
tooltip = "Right-hand side of each constraint (available resource)."
default = "[24.0, 6.0, 1.0, 2.0]"

[[inputs]]
id = "rho"
label = "Relative Deviation (rho)"
tooltip = "Each coefficient may deviate from its nominal value by up to rho |a_ij|; zero coefficients are certain."
default = "0.1"

[[inputs]]
id = "omega"
label = "Ellipsoid Radius (omega)"
tooltip = "Radius of the ball ||u||_2 <= omega of scaled deviations. omega = 1 lies inside the box; omega = sqrt(n) contains it."
default = "1.0"
models = ["ellip"]

[[inputs]]
id = "gamma"
label = "Budget (Gamma)"
tooltip = "Total scaled deviation allowed per constraint, between 0 (nominal) and the number of products. For the budgeted set it is the number of coefficients that may deviate fully."
default = "1.0"
models = ["budget", "poly"]

