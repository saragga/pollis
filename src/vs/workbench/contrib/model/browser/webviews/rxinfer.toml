[[inputs]]
id = "n"
label = "N (observations)"
tooltip = "Number of data points passed to the model. For the Streaming model this is the length of the data stream."
default = "100"

[[inputs]]
id = "iter"
label = "Iterations"
tooltip = "Number of VMP iterations. Each iteration passes messages forward and backward through the factor graph until the variational free energy converges."
default = "50"

[[codeBranches]]
model = "gaussian"
code = '''
using RxInfer

@model function gaussian_model(n, y)  # conjugate Gaussian with unknown mean and precision
    mu  ~ Normal(0.0, 1.0)  # mean prior
    tau ~ Gamma(1.0, 1.0)  # precision prior
    for i in 1:n
        y[i] ~ Normal(mu, sqrt(1 / tau))  # likelihood
    end
end

observations = rand(Normal(2.0, 0.5), {{n}})  # replace with real data
result = infer(  # run VMP
    model      = gaussian_model(n = {{n}}),
    data       = (y = observations,),
    iterations = {{iter}},
    returnvars = (mu = KeepLast(), tau = KeepLast()),
)

mu_post  = result.posteriors[:mu]  # posterior over mean
tau_post = result.posteriors[:tau]  # posterior over precision
println("mu:  ", mean(mu_post),  " +/- ", std(mu_post))  # mean estimate
println("tau: ", mean(tau_post), " +/- ", std(tau_post))  # precision estimate
'''

[[codeBranches]]
model = "regression"
code = '''
using RxInfer

@model function linear_regression(n, x, y)  # Bayesian linear regression via VMP
    beta0 ~ Normal(0.0, 10.0)  # intercept prior
    beta1 ~ Normal(0.0, 10.0)  # slope prior
    tau   ~ Gamma(1.0, 1.0)  # noise precision prior
    for i in 1:n
        y[i] ~ Normal(beta0 + beta1 * x[i], sqrt(1 / tau))  # likelihood
    end
end

x_data = randn({{n}})  # replace with real covariates
y_data = 1.5 .+ 2.3 .* x_data .+ 0.3 .* randn({{n}})  # replace with real response
result = infer(  # run VMP
    model      = linear_regression(n = {{n}}, x = x_data),
    data       = (y = y_data,),
    iterations = {{iter}},
    returnvars = (beta0 = KeepLast(), beta1 = KeepLast(), tau = KeepLast()),
)

println("Intercept: ", mean(result.posteriors[:beta0]))  # posterior mean intercept
println("Slope:     ", mean(result.posteriors[:beta1]))  # posterior mean slope
'''

[[codeBranches]]
model = "streaming"
code = '''
using RxInfer, Distributions

@model function tracking_model(y, mu_mean, mu_var)  # reactive single-observation update
    mu ~ Normal(mu_mean, sqrt(mu_var))  # prior from previous posterior
    tau ~ Gamma(1.0, 1.0)  # noise precision
    y ~ Normal(mu, sqrt(1 / tau))  # likelihood
end

stream = randn({{n}}) .+ 2.0  # replace with real data stream
mu_mean, mu_var = 0.0, 1.0  # initial prior
posteriors = []  # collect results

for obs in stream
    result = infer(  # update posterior on each observation
        model      = tracking_model(mu_mean = mu_mean, mu_var = mu_var),
        data       = (y = obs,),
        iterations = {{iter}},
        returnvars = (mu = KeepLast(),),
    )
    post = result.posteriors[:mu]  # updated posterior
    push!(posteriors, post)
    mu_mean, mu_var = mean(post), var(post)  # carry forward
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "posterior-marginals"
label = "Posterior Marginals"
desc = "Plot the posterior mean and variance for each latent variable as a Gaussian density"
code = '''
using RxInfer, GLMakie

observations = rand(Normal(2.0, 0.5), {{n}})  # replace with real data
result = infer(model = gaussian_model(n = {{n}}), data = (y = observations,), iterations = {{iter}}, returnvars = (mu = KeepLast(), tau = KeepLast()))  # run VMP

mu_post  = result.posteriors[:mu]  # Normal posterior over mean
tau_post = result.posteriors[:tau]  # Gamma posterior over precision

xs = range(mean(mu_post) - 3std(mu_post), mean(mu_post) + 3std(mu_post), length = 200)  # plot range
fig = Figure(); ax1 = Axis(fig[1,1], title = "Posterior: mu", xlabel = "mu")
lines!(ax1, xs, pdf.(mu_post, xs), color = :blue)
display(fig)
'''

[[actionGroups.actions]]
id = "free-energy"
label = "Free Energy"
desc = "Plot the variational free energy across VMP iterations to assess convergence"
code = '''
using RxInfer, GLMakie

observations = rand(Normal(2.0, 0.5), {{n}})  # replace with real data
result = infer(  # request free energy history
    model      = gaussian_model(n = {{n}}),
    data       = (y = observations,),
    iterations = {{iter}},
    returnvars = (mu = KeepEach(), tau = KeepEach()),
    free_energy = true,
)

fig = Figure(); ax = Axis(fig[1,1], title = "VMP Free Energy", xlabel = "Iteration", ylabel = "F")
lines!(ax, 1:{{iter}}, result.free_energy, color = :red)
display(fig)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Compare posterior means across iterations to verify VMP has converged"
code = '''
using RxInfer, Statistics

observations = rand(Normal(2.0, 0.5), {{n}})  # replace with real data
result = infer(model = gaussian_model(n = {{n}}), data = (y = observations,), iterations = {{iter}}, returnvars = (mu = KeepEach(),), free_energy = true)  # track each iteration

mu_means = mean.(getindex.(result.posteriors[:mu], 1))  # mean of mu posterior at each iteration
delta = abs.(diff(mu_means))  # change between iterations
println("Max delta (last 5 iters): ", maximum(delta[end-4:end]))  # convergence metric
println("Converged: ", maximum(delta[end-4:end]) < 1e-6)  # convergence verdict
'''

[[actionGroups.actions]]
id = "prior-sensitivity"
label = "Prior Sensitivity"
desc = "Compare posterior marginals under wide vs narrow priors to assess sensitivity"
code = '''
using RxInfer, Statistics

@model function gaussian_model_prior(n, y, mu_var)  # parameterise prior width
    mu  ~ Normal(0.0, sqrt(mu_var))
    tau ~ Gamma(1.0, 1.0)
    for i in 1:n; y[i] ~ Normal(mu, sqrt(1/tau)); end
end

obs = rand(Normal(2.0, 0.5), {{n}})  # data
r_narrow = infer(model = gaussian_model_prior(n = {{n}}, mu_var = 0.1), data = (y = obs,), iterations = {{iter}}, returnvars = (mu = KeepLast(),))  # narrow prior
r_wide   = infer(model = gaussian_model_prior(n = {{n}}, mu_var = 100.0), data = (y = obs,), iterations = {{iter}}, returnvars = (mu = KeepLast(),))  # wide prior

println("mu (narrow prior): ", mean(r_narrow.posteriors[:mu]))  # compare
println("mu (wide prior):   ", mean(r_wide.posteriors[:mu]))  # compare
'''

