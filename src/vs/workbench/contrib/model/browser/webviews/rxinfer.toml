[[inputs]]
id = "n"
label = "N (observations)"
tooltip = "Number of data points passed to the model. For the Streaming model this is the length of the data stream."
default = "100"

[[inputs]]
id = "iter"
label = "Iterations"
tooltip = "Number of VMP iterations. Each iteration passes messages forward and backward through the factor graph until the variational free energy converges."
default = "50"

[[codeBranches]]
model = "gaussian"
code = '''
using RxInfer

@model function gaussian_model(y, mu_var)  # Gaussian with unknown mean and precision
    mu  ~ Normal(mean = 0.0, var = mu_var)  # mean prior
    tau ~ Gamma(shape = 1.0, rate = 1.0)  # precision prior
    y .~ Normal(mean = mu, precision = tau)  # likelihood
end

constraints = @constraints begin
    q(mu, tau) = q(mu)q(tau)  # mean-field: mu and tau share the likelihood factor, so VMP needs this split
end
init = @initialization begin
    q(mu)  = NormalMeanVariance(0.0, 1.0)  # starting marginals for the VMP iterations
    q(tau) = GammaShapeRate(1.0, 1.0)
end

observations = rand(Normal(2.0, 0.5), {{n}})  # replace with real data
result = infer(  # run VMP
    model          = gaussian_model(mu_var = 1.0),
    data           = (y = observations,),
    constraints    = constraints,
    initialization = init,
    iterations     = {{iter}},
    returnvars     = (mu = KeepEach(), tau = KeepEach()),  # one posterior per iteration
    free_energy    = true,
)

mu_post  = last(result.posteriors[:mu])  # posterior over mean (final iteration)
tau_post = last(result.posteriors[:tau])  # posterior over precision
println("mu:  ", mean(mu_post),  " +/- ", std(mu_post))  # mean estimate
println("tau: ", mean(tau_post), " +/- ", std(tau_post))  # precision estimate
'''

[[codeBranches]]
model = "regression"
code = '''
using RxInfer

@model function linear_regression(x, y, b_var)  # Bayesian linear regression via VMP
    beta0 ~ Normal(mean = 0.0, var = b_var)  # intercept prior
    beta1 ~ Normal(mean = 0.0, var = b_var)  # slope prior
    tau   ~ Gamma(shape = 1.0, rate = 1.0)  # noise precision prior
    for i in eachindex(y)
        y[i] ~ Normal(mean = beta0 + beta1 * x[i], precision = tau)  # likelihood
    end
end

constraints = MeanField()  # splits the likelihood factor into q(mean)q(tau); the deterministic + and * nodes are never split
init = @initialization begin
    q(beta0) = NormalMeanVariance(0.0, 100.0)  # starting marginals for the VMP iterations
    q(beta1) = NormalMeanVariance(0.0, 100.0)
    q(tau)   = GammaShapeRate(1.0, 1.0)
    μ(beta1) = NormalMeanVariance(0.0, 100.0)  # starting message (RxInfer accepts only this Greek form): beta0 and beta1 meet at every + node, so the graph has loops
end

x_data = randn({{n}})  # replace with real covariates
y_data = 1.5 .+ 2.3 .* x_data .+ 0.3 .* randn({{n}})  # replace with real response
result = infer(  # run VMP
    model          = linear_regression(x = x_data, b_var = 100.0),
    data           = (y = y_data,),
    constraints    = constraints,
    initialization = init,
    iterations     = {{iter}},
    returnvars     = (beta0 = KeepEach(), beta1 = KeepEach(), tau = KeepEach()),
    free_energy    = true,
)

println("Intercept: ", mean(last(result.posteriors[:beta0])))  # posterior mean intercept
println("Slope:     ", mean(last(result.posteriors[:beta1])))  # posterior mean slope
println("Noise sd:  ", sqrt(1 / mean(last(result.posteriors[:tau]))))  # plug-in noise scale
'''

[[codeBranches]]
model = "streaming"
code = '''
using RxInfer

@model function tracking_model(y, mu_mean, mu_var, tau_shape, tau_rate)  # one observation per update
    mu  ~ Normal(mean = mu_mean, var = mu_var)  # prior = previous posterior
    tau ~ Gamma(shape = tau_shape, rate = tau_rate)  # precision prior = previous posterior
    y   ~ Normal(mean = mu, precision = tau)  # likelihood
end

constraints = @constraints begin
    q(mu, tau) = q(mu)q(tau)  # mean-field split needed for VMP
end
autoupdates = @autoupdates begin  # carry BOTH posteriors forward as the next priors
    mu_mean   = mean(q(mu))
    mu_var    = var(q(mu))
    tau_shape = shape(q(tau))
    tau_rate  = rate(q(tau))
end
init = @initialization begin  # initial priors (the autoupdates start from these)
    q(mu)  = NormalMeanVariance(0.0, 1.0)
    q(tau) = GammaShapeRate(1.0, 1.0)
end

stream = randn({{n}}) .+ 2.0  # replace with real data stream
result = infer(  # observations are processed one at a time
    model          = tracking_model(),
    data           = (y = stream,),
    autoupdates    = autoupdates,
    constraints    = constraints,
    initialization = init,
    iterations     = {{iter}},  # VMP iterations per observation
    historyvars    = (mu = KeepLast(), tau = KeepLast()),
    keephistory    = {{n}},
    free_energy    = true,
)

mu_hist, tau_hist = result.history[:mu], result.history[:tau]  # posterior after each observation
println("Final mu:  ", mean(last(mu_hist)), " +/- ", std(last(mu_hist)))
println("Final tau: ", mean(last(tau_hist)), " +/- ", std(last(tau_hist)))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "posterior-marginals"
label = "Posterior Marginals"
desc = "Plot the posterior density of each latent variable: the final VMP iteration, or for streaming the posterior after the last observation"
code = '''
using RxInfer, GLMakie

{{?model=gaussian}} posts = ["mu" => mu_post, "tau" => tau_post]
{{?model=regression}} posts = [string(v) => last(result.posteriors[v]) for v in (:beta0, :beta1, :tau)]
{{?model=streaming}} posts = ["mu" => last(mu_hist), "tau" => last(tau_hist)]

fig = Figure(size = (350 * length(posts), 320))
for (j, (name, d)) in enumerate(posts)
    m, s = mean(d), std(d)
    xs = range(name == "tau" ? max(m - 4s, 1e-6) : m - 4s, m + 4s, length = 200)  # precision is positive
    ax = Axis(fig[1, j], title = "Posterior: " * name, xlabel = name)
    lines!(ax, xs, pdf.(d, xs), color = :blue)
end
display(fig)
'''

[[actionGroups.actions]]
id = "free-energy"
label = "Free Energy"
desc = "Plot the variational free energy: across VMP iterations for the batch models (it should fall and flatten), and after each observation for streaming"
code = '''
using RxInfer, GLMakie

{{?model=gaussian|regression}} F, xl = result.free_energy, "Iteration"
{{?model=streaming}} F, xl = result.free_energy_final_only_history, "Observation"  # final-iteration value at each update
fig = Figure(); ax = Axis(fig[1,1], title = "VMP Free Energy", xlabel = xl, ylabel = "F")
lines!(ax, eachindex(F), F, color = :red)
display(fig)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Change in each posterior mean over the last VMP iterations and the free-energy trend: VMP has converged when both are near zero (for streaming, the free energy averaged over observations per iteration)"
code = '''
using RxInfer, Statistics

{{?model=gaussian|regression}} for (v, qs) in pairs(result.posteriors)
{{?model=gaussian|regression}}     d = abs.(diff(mean.(qs)))  # change of the posterior mean between iterations
{{?model=gaussian|regression}}     println(rpad(string(v), 6), " max change in mean over the last 5 iterations: ", maximum(d[max(end - 4, 1):end]))
{{?model=gaussian|regression}} end
{{?model=gaussian|regression}} F = result.free_energy
{{?model=streaming}} F = result.free_energy_history  # averaged over observations, one value per iteration
dF = diff(F)
println("Free energy change over the last 5 iterations: ", maximum(abs.(dF[max(end - 4, 1):end])))
println("Free energy never increased: ", all(dF .<= 1e-8))  # VMP decreases F monotonically
'''

[[actionGroups.actions]]
id = "prior-sensitivity"
label = "Prior Sensitivity"
desc = "Refit with a narrow (variance 0.1) and a wide (variance 100) prior on the mean or coefficients and compare the key posterior; for streaming the initial prior is changed"
code = '''
using RxInfer, Statistics

{{?model=gaussian}} fitp(v) = infer(model = gaussian_model(mu_var = v), data = (y = observations,), constraints = constraints, initialization = init, iterations = {{iter}}, returnvars = (mu = KeepLast(),))
{{?model=gaussian}} target(r) = r.posteriors[:mu]
{{?model=regression}} fitp(v) = infer(model = linear_regression(x = x_data, b_var = v), data = (y = y_data,), constraints = constraints, initialization = init, iterations = {{iter}}, returnvars = (beta1 = KeepLast(),))
{{?model=regression}} target(r) = r.posteriors[:beta1]
{{?model=streaming}} fitp(v) = infer(model = tracking_model(), data = (y = stream,), autoupdates = autoupdates, constraints = constraints, initialization = @initialization(begin q(mu) = NormalMeanVariance(0.0, v); q(tau) = GammaShapeRate(1.0, 1.0) end), iterations = {{iter}}, keephistory = {{n}})
{{?model=streaming}} target(r) = last(r.history[:mu])
for v in (0.1, 100.0)
    q = target(fitp(v))
    println("prior variance ", rpad(v, 6), " posterior mean = ", round(mean(q), digits = 4), "  sd = ", round(std(q), digits = 4))
end
'''

