[[actionGroups.actions]]
id = "posterior-predictive"
label = "Posterior Predictive"
desc = "Draw replicated data from the posterior predictive distribution and overlay it on the observed data"
code = '''
using RxInfer, GLMakie, Statistics

{{?model=gaussian}} obs, qm, qt = observations, mu_post, tau_post
{{?model=streaming}} obs, qm, qt = stream, last(mu_hist), last(tau_hist)
{{?model=gaussian|streaming}} ppc = [rand(Normal(rand(qm), sqrt(1 / rand(qt)))) for _ in 1:1000]  # posterior predictive samples
{{?model=regression}} obs = y_data
{{?model=regression}} qb0, qb1, qt = (last(result.posteriors[v]) for v in (:beta0, :beta1, :tau))
{{?model=regression}} ppc = vec([rand(Normal(rand(qb0) + rand(qb1) * xi, sqrt(1 / rand(qt)))) for xi in x_data, _ in 1:20])  # 20 replicated datasets at the observed x

fig = Figure(); ax = Axis(fig[1,1], title = "Posterior Predictive Check")
hist!(ax, obs, normalization = :pdf, color = (:blue, 0.4), label = "Observed")  # data histogram
hist!(ax, ppc, normalization = :pdf, color = (:red, 0.3), label = "PPC")  # predictive histogram
axislegend(ax); display(fig)
'''

[[actionGroups.actions]]
id = "streaming-forecast"
label = "Streaming Forecast"
desc = "Gaussian and streaming: predictive median and 95% interval for the next K observations from the final posterior. Regression: the 95% predictive band over a grid of new x values"
code = '''
using RxInfer, GLMakie, Statistics

{{?model=gaussian}} obs, qm, qt = observations, mu_post, tau_post
{{?model=streaming}} obs, qm, qt = stream, last(mu_hist), last(tau_hist)
{{?model=gaussian|streaming}} K = 20  # forecast horizon
{{?model=gaussian|streaming}} draws = [rand(Normal(rand(qm), sqrt(1 / rand(qt)))) for _ in 1:2000, _ in 1:K]  # predictive draws, one column per step
{{?model=gaussian|streaming}} lo, mid, hi = ([quantile(draws[:, k], q) for k in 1:K] for q in (0.025, 0.5, 0.975))  # 95% predictive interval and median
{{?model=gaussian|streaming}} n = length(obs); steps = n+1:n+K
{{?model=gaussian|streaming}} fig = Figure(); ax = Axis(fig[1,1], title = "Streaming Forecast", xlabel = "t", ylabel = "y")
{{?model=gaussian|streaming}} lines!(ax, 1:n, obs, color = :gray, label = "Observed")
{{?model=gaussian|streaming}} band!(ax, steps, lo, hi, color = (:red, 0.2), label = "95% predictive interval")
{{?model=gaussian|streaming}} lines!(ax, steps, mid, color = :red, label = "Forecast median")
{{?model=regression}} qb0, qb1, qt = (last(result.posteriors[v]) for v in (:beta0, :beta1, :tau))
{{?model=regression}} xg = range(extrema(x_data)..., length = 50)  # new x values
{{?model=regression}} draws = [rand(Normal(rand(qb0) + rand(qb1) * xi, sqrt(1 / rand(qt)))) for _ in 1:2000, xi in xg]
{{?model=regression}} lo, mid, hi = ([quantile(draws[:, k], q) for k in eachindex(xg)] for q in (0.025, 0.5, 0.975))
{{?model=regression}} fig = Figure(); ax = Axis(fig[1,1], title = "Posterior predictive band", xlabel = "x", ylabel = "y")
{{?model=regression}} scatter!(ax, x_data, y_data, color = :gray, markersize = 4, label = "Observed")
{{?model=regression}} band!(ax, xg, lo, hi, color = (:red, 0.2), label = "95% predictive interval")
{{?model=regression}} lines!(ax, xg, mid, color = :red, label = "Predictive median")
axislegend(ax, position = :lt); display(fig)
'''

