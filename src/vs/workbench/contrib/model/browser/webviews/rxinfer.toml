[[actionGroups.actions]]
id = "vmp-vs-mcmc"
label = "VMP vs MCMC"
desc = "Posterior means AND standard deviations from VMP (RxInfer.jl) against NUTS (Turing.jl) with the same priors and data: mean-field VMP typically understates posterior spread, shown by an sd ratio below 1"
code = '''
using RxInfer, Statistics
import Turing  # qualified: Turing and RxInfer both export a model macro

{{?model=gaussian|streaming}} Turing.@model function turing_model(y)  # same priors as the RxInfer model
{{?model=gaussian|streaming}}     mu ~ Normal(0.0, 1.0); tau ~ Gamma(1.0, 1.0)  # Gamma(shape 1, scale 1) = Gamma(shape 1, rate 1)
{{?model=gaussian|streaming}}     for i in eachindex(y); y[i] ~ Normal(mu, sqrt(1 / tau)); end
{{?model=gaussian|streaming}} end
{{?model=gaussian}} chain = Turing.sample(turing_model(observations), Turing.NUTS(), 2000)
{{?model=gaussian}} vq = ["mu" => mu_post, "tau" => tau_post]
{{?model=streaming}} chain = Turing.sample(turing_model(stream), Turing.NUTS(), 2000)  # batch posterior on the whole stream
{{?model=streaming}} vq = ["mu" => last(mu_hist), "tau" => last(tau_hist)]
{{?model=regression}} Turing.@model function turing_model(x, y)
{{?model=regression}}     beta0 ~ Normal(0.0, 10.0); beta1 ~ Normal(0.0, 10.0); tau ~ Gamma(1.0, 1.0)  # variance 100 priors as in the RxInfer model
{{?model=regression}}     for i in eachindex(y); y[i] ~ Normal(beta0 + beta1 * x[i], sqrt(1 / tau)); end
{{?model=regression}} end
{{?model=regression}} chain = Turing.sample(turing_model(x_data, y_data), Turing.NUTS(), 2000)
{{?model=regression}} vq = [string(v) => last(result.posteriors[v]) for v in (:beta0, :beta1, :tau)]

println(rpad("", 7), rpad("VMP mean", 12), rpad("MCMC mean", 12), rpad("VMP sd", 12), rpad("MCMC sd", 12), "sd ratio")
for (name, q) in vq
    c = vec(chain[Symbol(name)])  # MCMC draws
    println(rpad(name, 7), rpad(round(mean(q), digits = 4), 12), rpad(round(mean(c), digits = 4), 12), rpad(round(std(q), digits = 4), 12), rpad(round(std(c), digits = 4), 12), round(std(q) / std(c), digits = 3))
end
'''

[[actionGroups.actions]]
id = "model-comparison"
label = "Model Comparison"
desc = "Fit an alternative model to the same data and compare final variational free energies (lower wins): the mean fixed at 0 (Gaussian, Streaming) or an intercept-only model (Regression). For streaming the per-observation values are summed"
code = '''
using RxInfer

{{?model=gaussian}} @model function alt_model(y)  # alternative: mean fixed at 0, only the precision is unknown
{{?model=gaussian}}     tau ~ Gamma(shape = 1.0, rate = 1.0)
{{?model=gaussian}}     y .~ Normal(mean = 0.0, precision = tau)
{{?model=gaussian}} end
{{?model=gaussian}} alt = infer(model = alt_model(), data = (y = observations,), constraints = MeanField(), initialization = @initialization(begin q(tau) = GammaShapeRate(1.0, 1.0) end), iterations = {{iter}}, free_energy = true)
{{?model=regression}} @model function alt_model(y)  # alternative: intercept only, no covariate
{{?model=regression}}     beta0 ~ Normal(mean = 0.0, var = 100.0)
{{?model=regression}}     tau   ~ Gamma(shape = 1.0, rate = 1.0)
{{?model=regression}}     y .~ Normal(mean = beta0, precision = tau)
{{?model=regression}} end
{{?model=regression}} alt = infer(model = alt_model(), data = (y = y_data,), constraints = MeanField(), initialization = @initialization(begin q(beta0) = NormalMeanVariance(0.0, 100.0); q(tau) = GammaShapeRate(1.0, 1.0) end), iterations = {{iter}}, free_energy = true)
{{?model=streaming}} @model function alt_model(y, tau_shape, tau_rate)  # alternative: mean fixed at 0, only the precision is tracked
{{?model=streaming}}     tau ~ Gamma(shape = tau_shape, rate = tau_rate)
{{?model=streaming}}     y   ~ Normal(mean = 0.0, precision = tau)
{{?model=streaming}} end
{{?model=streaming}} alt_updates = @autoupdates begin tau_shape = shape(q(tau)); tau_rate = rate(q(tau)) end
{{?model=streaming}} alt = infer(model = alt_model(), data = (y = stream,), autoupdates = alt_updates, constraints = MeanField(), initialization = @initialization(begin q(tau) = GammaShapeRate(1.0, 1.0) end), iterations = {{iter}}, keephistory = {{n}}, free_energy = true)
{{?model=gaussian|regression}} F, F_alt = result.free_energy[end], alt.free_energy[end]
{{?model=streaming}} F, F_alt = sum(result.free_energy_final_only_history), sum(alt.free_energy_final_only_history)  # sequential (prequential) bound over the stream
println("Free energy, fitted model: ", F)  # an upper bound on -log evidence: lower means more evidence, with complexity already penalised
println("Free energy, alternative:  ", F_alt)
println(F < F_alt ? "The fitted model is preferred" : "The alternative is preferred", "; log Bayes factor approx ", round(F_alt - F, digits = 2))  # a difference of a few units is already strong evidence
'''

