[[actionGroups.actions]]
id = "vmp-vs-mcmc"
label = "VMP vs MCMC"
desc = "Compare posterior means from VMP (RxInfer.jl) and MCMC (Turing.jl) on the same Gaussian model"
code = '''
using RxInfer, Turing, Statistics

obs = rand(Normal(2.0, 0.5), {{n}})  # shared data

vmp_result = infer(model = gaussian_model(n = {{n}}), data = (y = obs,), iterations = {{iter}}, returnvars = (mu = KeepLast(),))  # VMP via RxInfer
vmp_mu = mean(vmp_result.posteriors[:mu])  # VMP posterior mean

@model function turing_gaussian(y)
    mu  ~ Normal(0.0, 1.0); tau ~ Gamma(1.0, 1.0)
    for i in eachindex(y); y[i] ~ Normal(mu, sqrt(1/tau)); end
end
chain = sample(turing_gaussian(obs), NUTS(), 2000)  # MCMC via Turing
mcmc_mu = mean(chain[:mu])  # MCMC posterior mean

println("VMP  mu: ", round(vmp_mu;  digits=4))  # compare
println("MCMC mu: ", round(mcmc_mu; digits=4))  # compare
'''

[[actionGroups.actions]]
id = "model-comparison"
label = "Model Comparison"
desc = "Final variational free energy of the Gaussian model, the quantity used to compare models: fit an alternative (for example Laplace noise) to the same data and prefer the lower value"
code = '''
using RxInfer

obs = rand(Normal(2.0, 0.5), {{n}})  # replace with real data

r_gaussian = infer(model = gaussian_model(n = {{n}}), data = (y = obs,), iterations = {{iter}}, returnvars = (mu = KeepLast(),), free_energy = true)  # Gaussian noise

println("Gaussian free energy: ", r_gaussian.free_energy[end])  # an upper bound on -log evidence: lower means more evidence, with complexity already penalised
println("Fit a competing model to the same obs and keep the one with the lower final free energy")  # only one model is fitted here
'''

