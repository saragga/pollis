[[actionGroups.actions]]
id = "parameter-posteriors"
label = "Parameter Posteriors"
desc = "Extract and display the posterior mean, variance, and 95% credible interval for all latent variables"
code = '''
using RxInfer, Statistics

obs = rand(Normal(2.0, 0.5), {{n}})  # replace with real data
result = infer(model = gaussian_model(n = {{n}}), data = (y = obs,), iterations = {{iter}}, returnvars = (mu = KeepLast(), tau = KeepLast()))  # fit

mu_post  = result.posteriors[:mu]  # Normal posterior
tau_post = result.posteriors[:tau]  # Gamma posterior

println("mu  | mean: ", round(mean(mu_post);  digits=3), "  std: ", round(std(mu_post); digits=3), "  95% CI: [", round(quantile(mu_post, 0.025); digits=3), ", ", round(quantile(mu_post, 0.975); digits=3), "]")  # mu summary
println("tau | mean: ", round(mean(tau_post); digits=3), "  std: ", round(std(tau_post); digits=3))  # tau summary
'''

[[actionGroups.actions]]
id = "factor-graph"
label = "Factor Graph"
desc = "Inspect the factor graph structure generated by RxInfer for the current model"
code = '''
using RxInfer

obs = rand(Normal(2.0, 0.5), {{n}})  # replace with real data

graph = create_model(gaussian_model(n = {{n}}) | (y = obs,))  # build the factor graph
println("Variables:  ", length(getvariables(graph)))  # number of variable nodes
println("Factors:    ", length(getfactors(graph)))  # number of factor nodes
println("Interfaces: ", length(getinterfaces(graph)))  # message-passing edges
'''
