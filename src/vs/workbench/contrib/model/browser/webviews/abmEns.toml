[[actionGroups.actions]]
id = "larger-ensemble"
label = "Larger Ensemble"
desc = "Increase the number of replications to reduce the standard error of the ensemble mean"
code = '''
using Agents, Statistics, Tables

Rs = [10, 20, 50, 100]  # replication counts to test
for R in Rs
    runs = [{{init}}(seed = i) for i in 1:R]
    cols = Tables.columntable(first(ensemblerun!(runs, {{T}}; adata = [(:mood, mean)])))
    last_step = cols.mean_mood[cols.time .== {{T}}]
    println("R=", R, "  SE=", round(std(last_step) / sqrt(R); digits = 4))
end
'''

[[actionGroups.actions]]
id = "finer-grid"
label = "Finer Parameter Grid"
desc = "Increase the resolution of the paramscan grid to locate phase boundaries more precisely"
code = '''
using Agents, Statistics, Tables

coarse = Dict(:threshold => collect(0.0:0.2:1.0))  # coarse scan (a Vector, so paramscan scans it)
fine   = Dict(:threshold => collect(0.0:0.05:1.0))  # fine scan

for (label, grid) in [("coarse", coarse), ("fine", fine)]
    cols = Tables.columntable(first(paramscan(grid, {{init}}; n = {{T}}, adata = [(:mood, mean)])))
    last_step = cols.mean_mood[cols.time .== {{T}}]
    println(label, "  grid points: ", length(last_step), "  range: ", extrema(last_step))
end
'''

