[[actionGroups.actions]]
id = "variance-across-runs"
label = "Variance Across Runs"
desc = "Compute the standard deviation of the final-step outcome across replications to quantify stochastic noise"
code = '''
using Agents, Statistics, Tables

models = [{{init}}(seed = i) for i in 1:{{R}}]  # replications
adf, _ = ensemblerun!(models, {{T}}; adata = [(:mood, mean)])  # run
data = Tables.columntable(adf)  # plain columns: time, mean_mood, ensemble

final = data.mean_mood[data.time .== {{T}}]  # final-step values

println("N replications: ", {{R}})  # sample size
println("Mean:  ", round(mean(final); digits = 4))  # ensemble mean
println("Std:   ", round(std(final); digits = 4))  # stochastic noise
println("SE:    ", round(std(final) / sqrt({{R}}); digits = 4))  # standard error
'''

[[actionGroups.actions]]
id = "burn-in"
label = "Burn-in Detection"
desc = "Plot ensemble mean over time and identify when trajectories stabilise to set an appropriate burn-in period"
code = '''
using Agents, GLMakie, Statistics, Tables

models = [{{init}}(seed = i) for i in 1:{{R}}]  # replications
adf, _ = ensemblerun!(models, {{T}}; adata = [(:mood, mean)])  # run
data = Tables.columntable(adf)  # plain columns: time, mean_mood, ensemble

steps = sort(unique(data.time))  # time steps
mu = [mean(data.mean_mood[data.time .== t]) for t in steps]  # mean trajectory

fig, ax, _ = lines(steps, mu, axis = (xlabel = "Step", ylabel = "Share happy"))  # plot trajectory
vlines!(ax, [10], color = :red, linestyle = :dash)  # mark candidate burn-in
display(fig)  # inspect
'''

