[[actionGroups.actions]]
id = "ensemble-vs-single"
label = "Ensemble vs Single Run"
desc = "Show how much a single run can deviate from the ensemble mean due to stochastic noise"
code = '''
using Agents, Statistics, Tables, GLMakie

single = Tables.columntable(first(run!({{init}}(seed = 1), {{T}}; adata = [(:mood, mean)])))  # single run

models = [{{init}}(seed = i) for i in 1:{{R}}]  # ensemble
ens = Tables.columntable(first(ensemblerun!(models, {{T}}; adata = [(:mood, mean)])))  # run ensemble
steps  = sort(unique(ens.time))
ens_mu = [mean(ens.mean_mood[ens.time .== t]) for t in steps]  # ensemble mean

fig, ax, _ = lines(steps, ens_mu, label = "Ensemble mean")  # ensemble trajectory
lines!(ax, single.time, single.mean_mood, label = "Single run", linestyle = :dash)  # single trajectory
axislegend(ax)  # show legend
display(fig)  # compare
'''

[[actionGroups.actions]]
id = "oa-vs-factorial"
label = "OAT vs Factorial"
desc = "Output variance under one-at-a-time (OAT) designs and the full factorial design; a factorial variance well above the sum of the OAT variances hints at interaction, which OAT cannot see"
code = '''
using Agents, Statistics, Tables

oa_thr = Dict(:threshold => collect(0.1:0.2:0.9), :density => [0.7])  # OAT: vary threshold
oa_den = Dict(:threshold => [0.5], :density => collect(0.1:0.2:0.9))  # OAT: vary density
full   = Dict(:threshold => collect(0.1:0.2:0.9), :density => collect(0.1:0.2:0.9))  # full factorial

for (label, design) in [("OAT-thr", oa_thr), ("OAT-den", oa_den), ("Full", full)]
    cols = Tables.columntable(first(paramscan(design, {{init}}; n = {{T}}, adata = [(:mood, mean)])))
    last_step = cols.mean_mood[cols.time .== {{T}}]
    println(label, "  output variance: ", round(var(last_step); digits = 4))  # variance of the outcome over the design, not a share explained
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "sobol-sensitivity"
label = "Sobol Sensitivity"
desc = "Compute first-order and total Sobol indices to rank which parameters drive output variance, averaging several seeds per sample point"
code = '''
using Agents, GlobalSensitivity, Statistics, Tables

K = 5  # seeds per sample point
function happy_at_end(p)  # p = [threshold, density]
    vals = map(1:K) do s  # the same seeds at every point (common random numbers), so the points differ only in the parameters
        cols = Tables.columntable(first(run!({{init}}(threshold = p[1], density = p[2], seed = s), {{T}}; adata = [(:mood, mean)])))
        last(cols.mean_mood)
    end
    return mean(vals)  # averaging over K runs shrinks the run-to-run noise that would otherwise count as parameter importance
end

bounds = [(0.1, 0.9), (0.3, 0.9)]  # threshold, density
res = gsa(happy_at_end, Sobol(), bounds; samples = 256)  # Sobol design: 256 x (2 + 2) points, K runs each

println("S1 threshold: ", round(res.S1[1]; digits = 3))  # first-order index
println("S1 density:   ", round(res.S1[2]; digits = 3))  # first-order index
println("ST threshold: ", round(res.ST[1]; digits = 3))  # total-effect index
println("ST density:   ", round(res.ST[2]; digits = 3))  # total-effect index
'''

[[actionGroups.actions]]
id = "equilibrium-summary"
label = "Equilibrium Summary"
desc = "Equilibrium mean mood for each parameter combination, with its spread across seeds, from a paramscan"
code = '''
using Agents, Statistics, Tables

params = Dict(:threshold => [0.2, 0.5, 0.8], :density => [0.5, 0.7], :seed => collect(1:{{R}}))  # parameter grid, {{R}} seeds per combination
adf, _ = paramscan(params, {{init}}; n = {{T}}, adata = [(:mood, mean)])  # scan
cols = Tables.columntable(adf)  # read the result as plain columns

at_end = cols.time .== {{T}}  # equilibrium rows
summary = map(sort(unique(zip(cols.threshold[at_end], cols.density[at_end])))) do (th, d)  # one row per parameter combination
    m = cols.mean_mood[at_end .& (cols.threshold .== th) .& (cols.density .== d)]
    (threshold = th, density = d, eq_mean = mean(m), eq_std = std(m), runs = length(m))  # spread across seeds
end

foreach(println, summary)  # print summary table
'''
