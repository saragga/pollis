[[inputs]]
id = "init"
label = "Model initializer"
tooltip = "Name of the function that creates and returns a fresh ABM instance. It must accept keyword argument seed for ensemble runs, or keyword arguments matching the parameter names for paramscan."
default = "initialize_model"

[[inputs]]
id = "R"
label = "Replications (R)"
tooltip = "Number of independent replications for ensemble runs. Each replication uses a different random seed. More replications reduce the standard error of aggregate statistics at the cost of compute time."
default = "20"

[[inputs]]
id = "T"
label = "Steps (T)"
tooltip = "Number of model steps to run per replication or per parameter combination. One step calls the agent step function for every agent, then optionally a model step function."
default = "50"

[[codeBranches]]
model = "ensemble"
code = '''
using Agents, Random, Statistics, Tables

# Example model to replicate: Schelling segregation on a grid. A resident is happy when at least
# a share threshold of its neighbours belong to its group; unhappy residents move to a random empty cell
@agent struct Resident(GridAgent{2})
    group::Int          # 1 or 2
    mood::Bool = false  # true when happy at the current cell
end

function schelling_step!(agent, model)
    nbs = collect(nearby_agents(agent, model))  # the 8 surrounding cells
    share = isempty(nbs) ? 1.0 : count(nb -> nb.group == agent.group, nbs) / length(nbs)
    agent.mood = share >= model.threshold
    agent.mood || move_agent_single!(agent, model)
    return
end

function initialize_model(; threshold = 0.4, density = 0.7, seed = 1, side = 20)
    space = GridSpaceSingle((side, side); periodic = false)  # at most one resident per cell
    model = StandardABM(Resident, space; agent_step! = schelling_step!, properties = Dict(:threshold => threshold),
        rng = Xoshiro(seed), scheduler = Schedulers.Randomly(), container = Vector)
    n = round(Int, density * side^2)
    for i in 1:n
        add_agent_single!(model; group = i <= n / 2 ? 1 : 2)  # two equal groups on random empty cells
    end
    return model
end

models = [{{init}}(seed = i) for i in 1:{{R}}]  # {{R}} independent replications, one seed each
adata  = [(:mood, mean)]  # share of happy residents, column mean_mood (0 at step 0: nobody has been checked yet)

adf, _ = ensemblerun!(models, {{T}}; adata)  # run all replications
data = Tables.columntable(adf)  # plain columns: time, mean_mood, ensemble

final = data.mean_mood[data.time .== {{T}}]  # last-step value of each replication
println("Mean across replications: ", round(mean(final); digits = 4))  # ensemble average
println("Std  across replications: ", round(std(final); digits = 4))  # stochastic variability
'''

[[codeBranches]]
model = "paramscan"
code = '''
using Agents, Random, Statistics, Tables

# Example model to scan: Schelling segregation on a grid. A resident is happy when at least
# a share threshold of its neighbours belong to its group; unhappy residents move to a random empty cell
@agent struct Resident(GridAgent{2})
    group::Int          # 1 or 2
    mood::Bool = false  # true when happy at the current cell
end

function schelling_step!(agent, model)
    nbs = collect(nearby_agents(agent, model))  # the 8 surrounding cells
    share = isempty(nbs) ? 1.0 : count(nb -> nb.group == agent.group, nbs) / length(nbs)
    agent.mood = share >= model.threshold
    agent.mood || move_agent_single!(agent, model)
    return
end

function initialize_model(; threshold = 0.4, density = 0.7, seed = 1, side = 20)
    space = GridSpaceSingle((side, side); periodic = false)  # at most one resident per cell
    model = StandardABM(Resident, space; agent_step! = schelling_step!, properties = Dict(:threshold => threshold),
        rng = Xoshiro(seed), scheduler = Schedulers.Randomly(), container = Vector)
    n = round(Int, density * side^2)
    for i in 1:n
        add_agent_single!(model; group = i <= n / 2 ? 1 : 2)  # two equal groups on random empty cells
    end
    return model
end

params = Dict(:threshold => [0.2, 0.4, 0.6, 0.8],  # paramscan scans only Vector values;
              :density   => [0.5, 0.7, 0.9])      # a range would be passed as one constant
adata  = [(:mood, mean)]  # share of happy residents, column mean_mood

adf, _ = paramscan(params, {{init}}; n = {{T}}, adata)  # full factorial scan
data = Tables.columntable(adf)  # plain columns: time, mean_mood, threshold, density

at_end = data.time .== {{T}}  # last-step rows
println("Parameter combinations: ", length(unique(zip(data.threshold, data.density))))  # check grid size
println("Final share happy range: ", extrema(data.mean_mood[at_end]))  # outcome range
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "ensemble-trajectories"
label = "Ensemble Trajectories"
desc = "Plot the mean observable across steps with a band of plus or minus one standard deviation across replications (the spread of single runs, not a confidence interval for the mean)"
code = '''
using Agents, GLMakie, Statistics, Tables

models = [{{init}}(seed = i) for i in 1:{{R}}]  # replications
adf, _ = ensemblerun!(models, {{T}}; adata = [(:mood, mean)])  # run ensemble
data = Tables.columntable(adf)  # plain columns: time, mean_mood, ensemble

steps = sort(unique(data.time))  # time steps
mu  = [mean(data.mean_mood[data.time .== t]) for t in steps]  # mean across runs
sig = [std(data.mean_mood[data.time .== t]) for t in steps]  # std dev across runs

fig = Figure()  # create figure
ax  = Axis(fig[1, 1], xlabel = "Step", ylabel = "Share happy")  # axes
band!(ax, steps, mu .- sig, mu .+ sig, color = (:blue, 0.2))  # +/- 1 sd across runs; a 95% CI for the mean would be +/- 1.96 sd / sqrt(R)
lines!(ax, steps, mu, color = :blue)  # ensemble mean
display(fig)  # show
'''

[[actionGroups.actions]]
id = "paramscan-heatmap"
label = "Parameter Heatmap"
desc = "Visualise the equilibrium outcome across two swept parameters as a 2-D heatmap"
code = '''
using Agents, GLMakie, Tables

params = Dict(:threshold => collect(0.1:0.1:0.9),  # Vectors, so paramscan scans them
              :density   => collect(0.1:0.1:0.9))  # 0 is an empty grid; 1 leaves no empty cell to move to
adf, _ = paramscan(params, {{init}}; n = {{T}}, adata = [(:mood, mean)])  # scan
data = Tables.columntable(adf)  # plain columns: time, mean_mood, threshold, density

at_end = data.time .== {{T}}  # equilibrium rows
ts = sort(unique(data.threshold))  # x-axis values
ds = sort(unique(data.density))  # y-axis values
Z  = [only(data.mean_mood[at_end .& (data.threshold .== t) .& (data.density .== d)]) for t in ts, d in ds]  # outcome matrix

fig, ax, hm = heatmap(ts, ds, Z, axis = (xlabel = "threshold", ylabel = "density", title = "Share happy at step {{T}}"))  # heatmap
Colorbar(fig[1, 2], hm)  # colour scale
display(fig)  # show
'''

