[[inputs]]
id = "corpus"
label = "Corpus"
tooltip = "Array of text documents to train on, e.g. docs = [\"first text\", \"second text\"]. The default, corpus, is The Pollis Guide from PollisDatasets, one document per section, every tenth section held out as test_tokens; its example also defines new_sentence and context for the Predict actions."
default = "corpus"

[[inputs]]
id = "k"
label = "Smoothing k"
tooltip = "Add-k smoothing constant; k=1 is Laplace smoothing; k=0 gives maximum likelihood"
default = "1"

[[codeBranches]]
model = "unigram"
code = '''
using TextAnalysis, Languages
{{?corpus=corpus}} using PollisDatasets

{{?corpus=corpus}} guide  = dataset("pollis_guide").text;  # The Pollis Guide, one document per section; datasetinfo("pollis_guide") describes it
{{?corpus=corpus}} corpus = guide[setdiff(1:end, 10:10:end)];  # trained on 117 sections. Replace it with your own vector of strings.
{{?corpus=corpus}} held   = Corpus([StringDocument(d) for d in guide[10:10:end]]); prepare!(held, strip_punctuation | strip_case)
{{?corpus=corpus}} test_tokens  = vcat([tokens(d) for d in held]...);  # every tenth section held out, for Perplexity, OOV Rate and Compare Smoothing
{{?corpus=corpus}} new_sentence = ["open", "the", "panel", "and", "run", "the", "code"];  # for Sentence Probability
{{?corpus=corpus}} context      = "the";  # the word Next Word Prediction continues

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus from documents
prepare!(crps, strip_punctuation | strip_case)  # normalise text

toks     = vcat([tokens(d) for d in crps]...)  # flatten all tokens
unigrams = ngrams(NGramDocument(join(toks, " "), 1))  # unigram counts
N        = sum(values(unigrams))  # total token count
V        = length(unigrams)  # vocabulary size
prob(w)  = (get(unigrams, w, 0) + {{k}}) / (N + {{k}} * V)  # Add-k smoothing
'''

