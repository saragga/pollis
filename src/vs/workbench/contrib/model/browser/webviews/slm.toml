[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "unigram-dist"
label = "Unigram Distribution"
desc = "Top 10 most probable words"
code = '''
counts = Dict{String, Int}()  # word counts
for d in docs, w in d
    counts[w] = get(counts, w, 0) + 1
end
top10 = first(sort(collect(counts), by=last, rev=true), 10)  # top-10 words by frequency
'''

[[actionGroups.actions]]
id = "ngram-probs"
label = "N-gram Probabilities"
desc = "Add-k probability of each n-gram of the tab's order in the corpus"
code = '''
probs = Dict(join(g, " ") => lm.prob(g) for g in keys(lm.grams))  # add-k P(last word | the words before it), for the n-grams of this tab's order
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "perplexity"
label = "Perplexity"
desc = "Perplexity on a held-out test corpus"
code = '''
pp = lm.perplexity(test_tokens)  # 2 to the cross-entropy in bits per test token: the effective number of equally likely next words
'''

[[actionGroups.actions]]
id = "oov-rate"
label = "OOV Rate"
desc = "Fraction of test tokens unseen in training"
code = '''
using Statistics

oov_rate = mean(w -> !(w in vocab), test_tokens)  # fraction of test tokens unseen in training
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "sentence-prob"
label = "Sentence Probability"
desc = "Log-probability of a new sentence"
code = '''
log_p = lm.logprob(new_sentence)  # log2-probability of the sentence and its end
'''

[[actionGroups.actions]]
id = "next-word"
label = "Next Word Prediction"
desc = "Most likely next word given context"
code = '''
hist   = [fill("<s>", lm.order - 1); [w in vocab ? w : "<unk>" for w in String.(split(context))]]  # the context, padded, unseen words as <unk>
c      = hist[end-lm.order+2:end]  # the last order - 1 words (none for a unigram)
next_w = argmax(w -> lm.prob([c; w]), [collect(vocab); "</s>"])  # add-k keeps the ranking of the counts: k changes the probability, not the word
(next_word = next_w, probability = lm.prob([c; next_w]))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-orders"
label = "Compare Orders"
desc = "Perplexity for unigram, bigram and trigram"
code = '''
[(order = n, perplexity = ngram_model(n).perplexity(test_tokens)) for n in 1:3]  # test-set perplexity of each order, at the same k
'''

[[actionGroups.actions]]
id = "compare-smoothing"
label = "Compare Smoothing"
desc = "MLE vs Laplace vs Add-k perplexity"
code = '''
[(k = k, perplexity = ngram_model(lm.order; k = k).perplexity(test_tokens)) for k in (0, 1, {{k}})]  # k = 0 is maximum likelihood: infinite once a test n-gram is unseen; k = 1 is Laplace
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "top-ngrams"
label = "Top N-grams"
desc = "Most frequent n-grams in the corpus"
code = '''
top_ngrams = first(sort([join(g, " ") => c for (g, c) in lm.grams], by=last, rev=true), 10)  # the ten most frequent n-grams of this tab's order
'''

[[actionGroups.actions]]
id = "prob-ratios"
label = "Probability Ratios"
desc = "PMI between word pairs"
code = '''
uni = Dict{String, Int}(); big = Dict{Tuple{String, String}, Int}()  # word and adjacent-pair counts within each document
for d in docs
    for w in d
        uni[w] = get(uni, w, 0) + 1
    end
    for i in 1:length(d)-1
        big[(d[i], d[i+1])] = get(big, (d[i], d[i+1]), 0) + 1
    end
end
N, B = sum(values(uni)), sum(values(big))
pmi(w1, w2) = log2((get(big, (w1, w2), 0) / B) / ((get(uni, w1, 0) / N) * (get(uni, w2, 0) / N)))  # pointwise mutual information; -Inf for a pair never adjacent
'''
