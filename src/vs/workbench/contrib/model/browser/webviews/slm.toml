[[bullets]]
text = "Unigram"
detail = "probability of each word independent of context; P(w) = count(w) / N"

[[bullets]]
text = "Bigram"
detail = "probability of each word given the previous word; P(w | w−₁)"

[[bullets]]
text = "Trigram"
detail = "probability of each word given the two preceding words; P(w | w−₁, w−₂)"

[[inputs]]
id = "corpus"
label = "Corpus"
tooltip = "Array of text documents to train on, e.g. docs = [\"first text\", \"second text\"]"
default = "corpus"

[[inputs]]
id = "k"
label = "Smoothing k"
tooltip = "Add-k smoothing constant; k=1 is Laplace smoothing; k=0 gives maximum likelihood"
default = "1"

[[codeBranches]]
model = "unigram"
code = '''
using TextAnalysis, Languages

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus from documents
prepare!(crps, strip_punctuation | strip_case)  # normalise text

tokens   = vcat([tokens(d) for d in crps]...)  # flatten all tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
N        = sum(values(unigrams))  # total token count
V        = length(unigrams)  # vocabulary size
prob(w)  = (get(unigrams, w, 0) + {{k}}) / (N + {{k}} * V)  # Add-k smoothing
'''

[[codeBranches]]
model = "bigram"
code = '''
using TextAnalysis, Languages

crps    = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus from documents
prepare!(crps, strip_punctuation | strip_case)  # normalise text

tokens   = vcat([tokens(d) for d in crps]...)  # flatten all tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
bigrams  = ngrams(NGramDocument(join(tokens, " "), 2))  # bigram counts
V        = length(unigrams)  # vocabulary size
'''

[[codeBranches]]
model = "trigram"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus from documents
prepare!(crps, strip_punctuation | strip_case)  # normalise text

tokens   = vcat([tokens(d) for d in crps]...)  # flatten all tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
bigrams  = ngrams(NGramDocument(join(tokens, " "), 2))  # bigram counts
trigrams = ngrams(NGramDocument(join(tokens, " "), 3))  # trigram counts
V        = length(unigrams)  # vocabulary size; use backoff or interpolation for unseen trigrams
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "unigram-dist"
label = "Unigram Distribution"
desc = "Top-N most probable words"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # all tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # counts
top10    = sort(collect(unigrams), by=x->x[2], rev=true)[1:10]  # top-10 words by frequency
'''

[[actionGroups.actions]]
id = "ngram-probs"
label = "N-gram Probabilities"
desc = "Probability of each n-gram in the corpus"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # all tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
N = sum(values(unigrams)); V = length(unigrams)  # corpus size and vocabulary
probs = Dict(w => (cnt + {{k}}) / (N + {{k}} * V) for (w, cnt) in unigrams)  # Add-k smoothed probabilities
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "perplexity"
label = "Perplexity"
desc = "Perplexity on a held-out test corpus"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # training corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # training tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
N = sum(values(unigrams)); V = length(unigrams)  # size and vocabulary
log_pp   = -mean([log2((get(unigrams, w, 0) + {{k}}) / (N + {{k}} * V)) for w in test_tokens])  # per-token log-prob on test set
'''

[[actionGroups.actions]]
id = "oov-rate"
label = "OOV Rate"
desc = "Fraction of test tokens unseen in training"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # training corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # training tokens
vocab    = Set(tokens)  # training vocabulary
oov_rate = mean(w -> !(w in vocab), test_tokens)  # fraction of OOV test tokens
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "sentence-prob"
label = "Sentence Probability"
desc = "Log-probability of a new sentence"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # training corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # training tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
N = sum(values(unigrams)); V = length(unigrams)  # size and vocabulary
log_p    = sum(log2((get(unigrams, w, 0) + {{k}}) / (N + {{k}} * V)) for w in new_sentence)  # log-probability of sentence
'''

[[actionGroups.actions]]
id = "next-word"
label = "Next Word Prediction"
desc = "Most likely next word given context"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # training corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # training tokens
bigrams  = ngrams(NGramDocument(join(tokens, " "), 2))  # bigram counts for context lookup
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
next_w   = argmax(w -> get(bigrams, context * " " * w, 0) + {{k}}, collect(keys(unigrams)))  # most probable next word
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-orders"
label = "Compare Orders"
desc = "Perplexity for unigram, bigram and trigram"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # training corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # training tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
bigrams  = ngrams(NGramDocument(join(tokens, " "), 2))  # bigram counts
trigrams = ngrams(NGramDocument(join(tokens, " "), 3))  # trigram counts; compare test-set perplexity across orders
'''

[[actionGroups.actions]]
id = "compare-smoothing"
label = "Compare Smoothing"
desc = "MLE vs Laplace vs Add-k perplexity"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # training corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # training tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
N = sum(values(unigrams)); V = length(unigrams)  # size and vocabulary
pp_mle    = perplexity(unigrams, test_tokens, 0, N, V)  # MLE perplexity (k=0)
pp_laplace = perplexity(unigrams, test_tokens, 1, N, V)  # Laplace perplexity (k=1)
pp_addk   = perplexity(unigrams, test_tokens, {{k}}, N, V)  # Add-k perplexity
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "top-ngrams"
label = "Top N-grams"
desc = "Most frequent n-grams in the corpus"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # all tokens
bigrams  = ngrams(NGramDocument(join(tokens, " "), 2))  # bigram counts
top_bg   = sort(collect(bigrams), by=x->x[2], rev=true)[1:10]  # top-10 most frequent bigrams
'''

[[actionGroups.actions]]
id = "prob-ratios"
label = "Probability Ratios"
desc = "PMI between word pairs"
code = '''
using TextAnalysis, Languages

crps     = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus
prepare!(crps, strip_punctuation | strip_case)  # normalise
tokens   = vcat([tokens(d) for d in crps]...)  # all tokens
unigrams = ngrams(NGramDocument(join(tokens, " "), 1))  # unigram counts
bigrams  = ngrams(NGramDocument(join(tokens, " "), 2))  # bigram counts
N = sum(values(unigrams))  # total tokens
pmi(w1, w2) = log2((get(bigrams, w1 * " " * w2, 0) * N) / (get(unigrams, w1, 0) * get(unigrams, w2, 0) + 1))  # pointwise mutual information
'''
