[[actionGroups]]
id = "prices"
label = "Chart Prices"

[[actionGroups.actions]]
id = "yfin-viz-adjclose"
label = "Adjusted Close Line"
desc = "Plot the adjusted closing price of a ticker over time"
code = """
using YFinance, TimeSeries, Plots

ta = get_prices(TimeArray, "AAPL"; range="1y", interval="1d")

plot(ta[:adjclose]; label="AAPL", lw=2, legend=:topleft)
title!("Adjusted Close")
"""

[[actionGroups.actions]]
id = "yfin-viz-volume"
label = "Price and Volume"
desc = "Overlay closing price with a trading-volume panel"
code = """
using YFinance, TimeSeries, Plots

ta = get_prices(TimeArray, "MSFT"; range="6mo", interval="1d")

p1 = plot(ta[:close];  label="Close", lw=2)
p2 = bar(timestamp(ta), values(ta[:vol]); label="Volume", alpha=0.5)
plot(p1, p2; layout=(2, 1), link=:x)
"""

[[actionGroups.actions]]
id = "yfin-viz-compare"
label = "Compare Tickers"
desc = "Plot two tickers rebased to 100 at the start of the window"
code = """
using YFinance, TimeSeries, Plots

a = get_prices(TimeArray, "AAPL"; range="1y", interval="1d")[:adjclose]
b = get_prices(TimeArray, "MSFT"; range="1y", interval="1d")[:adjclose]

ra = 100 .* a ./ values(a)[1]
rb = 100 .* b ./ values(b)[1]

plot(ra;  label="AAPL", lw=2)
plot!(rb; label="MSFT", lw=2)
title!("Rebased to 100")
"""

[[actionGroups]]
id = "returns"
label = "Analyse Returns"

[[actionGroups.actions]]
id = "yfin-ret-daily"
label = "Daily Returns"
desc = "Compute both simple and log daily returns from the adjusted close"
code = """
using YFinance, TimeSeries, Statistics

ta = get_prices(TimeArray, "AAPL"; range="1y", interval="1d")
px = ta[:adjclose]

# Simple (arithmetic) returns: r_t = P_t / P_(t-1) - 1
simple = percentchange(px, :simple)

# Log (continuously compounded) returns: r_t = log(P_t / P_(t-1))
logret = percentchange(px, :log)

println("Mean simple return: ", round(100 * mean(values(simple)); digits=4), "%")
println("Mean log return:    ", round(100 * mean(values(logret)); digits=4), "%")
"""

[[actionGroups.actions]]
id = "yfin-ret-aggregate"
label = "Aggregate Returns"
desc = "Aggregate returns across assets (simple) and across time (log)"
code = """
using YFinance, TimeSeries, Statistics

# Cross-sectional aggregation (across assets, single period) uses SIMPLE returns:
# a portfolio return is the weighted sum of its holding-level simple returns.
a = values(percentchange(get_prices(TimeArray, "AAPL"; range="1mo", interval="1d")[:adjclose]))
b = values(percentchange(get_prices(TimeArray, "MSFT"; range="1mo", interval="1d")[:adjclose]))
n = min(length(a), length(b))
w = (0.6, 0.4)
portfolio = w[1] .* a[1:n] .+ w[2] .* b[1:n]
println("Mean portfolio return: ", round(100 * mean(portfolio); digits=4), "%")

# Temporal aggregation (across time, single asset) uses LOG returns:
# a multi-period log return is the SUM of single-period log returns.
logret = percentchange(get_prices(TimeArray, "AAPL"; range="1y", interval="1d")[:adjclose], :log)
cumulative = exp(sum(values(logret))) - 1
println("Cumulative 1y return: ", round(100 * cumulative; digits=2), "%")

# Why simple for cross-sectional and log for temporal aggregation is explained
# in the Decision Guide (open it from the Local Wikis panel under Learn More).
"""

[[actionGroups.actions]]
id = "yfin-ret-sma"
label = "Moving Average"
desc = "Compute a 20-bar simple moving average of the close"
code = """
using YFinance, TimeSeries, Statistics, Plots

ta  = get_prices(TimeArray, "AAPL"; range="1y", interval="1d")
sma = moving(mean, ta[:close], 20)

plot(ta[:close]; label="Close", lw=1, alpha=0.6)
plot!(sma; label="SMA(20)", lw=2)
"""

[[actionGroups.actions]]
id = "yfin-ret-stats"
label = "Return Statistics"
desc = "Summarise daily-return mean, volatility, and annualised figures"
code = """
using YFinance, TimeSeries, Statistics

ta  = get_prices(TimeArray, "AAPL"; range="1y", interval="1d")
ret = values(percentchange(ta[:adjclose]))

mu  = mean(ret)
sig = std(ret)

println("Mean daily:     ", round(100 * mu; digits=4), "%")
println("Daily vol:      ", round(100 * sig; digits=4), "%")
println("Annualised vol: ", round(100 * sig * sqrt(252); digits=2), "%")
"""

[[actionGroups.actions]]
id = "yfin-ret-multi"
label = "Multiple Symbols"
desc = "Download many tickers at once and align them into one TimeArray"
code = """
using YFinance, TimeSeries

tickers = ["AAPL", "MSFT", "GOOG", "AMZN"]

# Elegant: broadcast get_prices over the vector of tickers with dot syntax
arrays = get_prices.(TimeArray, tickers; range="6mo", interval="1d")
data   = Dict(zip(tickers, arrays))

for t in tickers
    println(t, "  last close = ", values(data[t][:adjclose])[end])
end

# Combine every adjusted close into one aligned, multi-column TimeArray
closes = reduce((x, y) -> merge(x, y; method=:inner),
    [rename(data[t][:adjclose], Symbol(t)) for t in tickers])
println(closes)
"""

