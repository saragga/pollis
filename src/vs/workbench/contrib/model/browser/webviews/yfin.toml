[[actionGroups.actions]]
id = "yfin-opt-chain"
label = "Calls and Puts"
desc = "List the call and put strikes with their last prices"
code = """
using YFinance

op    = get_Options("AMD")
calls = op["calls"]
puts  = op["puts"]

for i in eachindex(calls["strike"])
    println("CALL ", calls["strike"][i], "  last=", calls["lastPrice"][i])
end
println("Put strikes: ", puts["strike"])
"""

[[actionGroups.actions]]
id = "yfin-opt-filter"
label = "Filter by Open Interest"
desc = "Keep only the call contracts with the largest open interest"
code = """
using YFinance

calls = get_Options("AMD")["calls"]

oi   = calls["openInterest"]
keep = sortperm(oi; rev=true)[1:min(5, length(oi))]

for i in keep
    println(calls["contractSymbol"][i], "  OI=", oi[i], "  strike=", calls["strike"][i])
end
"""

