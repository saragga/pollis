# Yahoo Finance (YFinance.jl) Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/yfin.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Yahoo Finance"
viewType = "pollis.yfin"
defaultModel = "price"
models = ["price", "quote", "fundamental", "options", "search"]
illusCollapsed = true
illustrationText = "Download market data from Yahoo Finance into Julia: prices, fundamentals, options, and news."

[[packages]]
name = "YFinance.jl"
github = "https://github.com/eohne/YFinance.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "TimeSeries.jl"
github = "https://github.com/JuliaStats/TimeSeries.jl"

# Further packages the examples use: checked by the install indicator, not listed on the Powered-by line
[requires]
packages = ["Plots.jl"]

[[notebookSections]]
label = "Yahoo Finance"

[[notebookSections.notebooks]]
name = "Prices and Charts"
file = "yfin/tutorial-01-prices.ipynb"
bundled = true
description = "Download OHLC bars, sink into a TimeArray, and plot adjusted closes"

[[notebookSections.notebooks]]
name = "Fundamentals"
file = "yfin/tutorial-02-fundamentals.ipynb"
bundled = true
description = "Pull income statement, balance sheet, cash flow, and valuation history"

[[notebookSections.notebooks]]
name = "Options Chains"
file = "yfin/tutorial-03-options.ipynb"
bundled = true
description = "Fetch calls and puts with strikes, prices, and open interest"

[[notebookSections.notebooks]]
name = "Symbol and News Search"
file = "yfin/tutorial-04-search.ipynb"
bundled = true
description = "Resolve tickers from company names and scan recent news headlines"

