[[codeBranches]]
model = "price"
code = """
using YFinance, TimeSeries, Tables

# Daily OHLC bars for the past month (an OrderedDict of column vectors)
prices = get_prices("AAPL"; range="1mo", interval="1d")
println("Ticker:     ", prices["ticker"])
println("Last close: ", last(prices["close"]))

# Sink straight into a TimeArray for time-indexed analysis
ta = get_prices(TimeArray, "AAPL"; range="6mo", interval="1d")

# A TimeArray implements the Tables.jl interface, so it works
# anywhere a table is expected (iterate rows, collect columns, ...)
for row in first(Tables.rows(ta), 3)
    println(row.timestamp, "  close=", row.close)
end

# Intraday bars and explicit date ranges are supported too
intraday = get_prices("BTC-USD"; range="1d", interval="5m")
println("Bars: ", length(intraday["timestamp"]))
"""

[[codeBranches]]
model = "quote"
code = """
using YFinance

# Full quote summary as a nested JSON object
summary = get_quoteSummary("AAPL")
println("Modules: ", keys(summary))

# Pull a single module rather than the whole summary
qtype = get_quoteSummary("AAPL"; item="quoteType")
println(qtype)

# Convenience helpers built on top of the quote summary
cal = get_calendar_events("AAPL")
eps = get_eps("AAPL")
println("Calendar events: ", cal)
println("EPS:             ", eps)
"""

[[codeBranches]]
model = "fundamental"
code = """
using YFinance, Dates

# Annual income statement for the last three years
# (each statement line item comes back as a named column vector)
inc = get_Fundamental("AMD", "income_statement", "annual", today() - Year(3), today())
println("Line items: ", keys(inc))

# Valuation multiples: PE, PB, EV/EBITDA, PEG, ...
val = get_Fundamental("NFLX", "valuation", "annual", today() - Year(3), today())
println("Periods: ", val["timestamp"])

# Other statements: "balance_sheet", "cash_flow"
cf = get_Fundamental("AMD", "cash_flow", "quarterly", today() - Year(1), today())
println("Cash-flow items: ", length(keys(cf)))
"""

[[codeBranches]]
model = "options"
code = """
using YFinance

# Full options chain: calls and puts for the nearest expiry
op = get_Options("AMD")
println("Sections: ", keys(op))

calls = op["calls"]
puts  = op["puts"]

println("Call strikes:      ", calls["strike"])
println("Call last prices:  ", calls["lastPrice"])
println("Put open interest: ", puts["openInterest"])
"""

[[codeBranches]]
model = "search"
code = """
using YFinance

# Resolve ticker symbols from a company or security name
hits = get_symbols("micro")
println(hits)

# Every symbol listed on a given exchange
nyse = get_all_symbols("NYSE")
println("NYSE symbols: ", length(nyse))

# Latest news headlines mentioning a ticker
news = search_news("MSFT")
println(titles(news))
"""

