# Ordinary Differential Equations Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/odes.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Ordinary Differential Equations"
viewType = "pollis.odes"
defaultModel = "scalar"

[[packages]]
name = "OrdinaryDiffEq.jl"
github = "https://github.com/SciML/OrdinaryDiffEq.jl"

[[packages.videos]]
