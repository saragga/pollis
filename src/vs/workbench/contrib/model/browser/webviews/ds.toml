[[decisionRows]]
task = "Nelder-Mead"
context = "Low-dimensional smooth or mildly noisy problems; the quickest to try"
purpose = "Reflect, expand and shrink a simplex of n + 1 points; no convergence guarantee"

[[decisionRows]]
task = "Pattern Search"
context = "Simple, predictable search when each evaluation is cheap"
purpose = "Compass search: poll +/- each coordinate, halve the step when no poll point improves"

[[decisionRows]]
task = "MADS"
context = "Black-box, non-smooth or simulation-based objectives with a convergence theory"
purpose = "Mesh adaptive direct search: polls in directions that become dense, with guaranteed convergence to a Clarke-stationary point"

[[decisionRows]]
task = "GSS"
context = "Smooth problems where you want fewer polls per iteration and step expansion"
purpose = "Generating set search: a minimal positive spanning set (n + 1 directions), sufficient decrease, expand on success"

[[inputs]]
id = "f"
label = "Objective f(x)"
tooltip = "Julia expression for the scalar objective to minimise. Use x[1], x[2], ... for the components. Example: abs(x[1] - 1) + (x[2] - 2)^2 (non-smooth)."
default = "abs(x[1] - 1) + 2 * abs(x[2] + 0.5) + 0.1 * (x[1]^2 + x[2]^2)"

[[inputs]]
id = "x0"
label = "Initial Guess x0"
tooltip = "Starting point as a Julia vector, for example [1.0, 1.0]."
default = "[2.0, 2.0]"

[[inputs]]
id = "maxiter"
label = "Max Iterations"
tooltip = "Iteration budget. Direct search needs many more iterations (and evaluations) than gradient methods for high accuracy."
default = "500"
newRow = true

[[inputs]]
id = "step"
label = "Initial Step"
tooltip = "Initial poll step size. Around a tenth of the expected distance to the solution works well."
default = "0.5"
models = ["ps", "gss"]

