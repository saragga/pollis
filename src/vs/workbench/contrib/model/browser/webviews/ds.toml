[[codeBranches]]
model = "nm"
code = '''
using LinearAlgebra

f(x) = {{f}}
x0 = {{x0}}  # initial guess
n  = length(x0)

evals = Tuple{Vector{Float64}, Float64}[]  # every evaluation (point, value), in order
obj = Ref{Function}(f)  # the function the solver sees (swappable, e.g. for a noisy version)
fr(x) = (v = obj[](x); push!(evals, (copy(x), v)); v)  # recording wrapper passed to the solver
using Optim

function solve(x0)
    empty!(evals)
    r = optimize(fr, x0, NelderMead(), Optim.Options(iterations={{maxiter}}))
    Optim.minimizer(r), Optim.minimum(r)
end

x_opt, f_opt = solve(x0)
best = accumulate(min, last.(evals))  # best value after each evaluation
(minimizer = x_opt, minimum = f_opt, evaluations = length(evals))
'''

[[codeBranches]]
model = "ps"
code = '''
using LinearAlgebra

f(x) = {{f}}
x0 = {{x0}}  # initial guess
n  = length(x0)

evals = Tuple{Vector{Float64}, Float64}[]  # every evaluation (point, value), in order
obj = Ref{Function}(f)  # the function the solver sees (swappable, e.g. for a noisy version)
fr(x) = (v = obj[](x); push!(evals, (copy(x), v)); v)  # recording wrapper passed to the solver

dirs = [s * e for e in eachcol(Matrix(1.0I, n, n)) for s in (1, -1)]  # h

function solve(x0; step={{step}}, tol=1e-8)
    empty!(evals)
    x, fx, h = copy(x0), fr(x0), step
    for _ in 1:{{maxiter}}
        h < tol && break
        improved = false
        for d in dirs  # opportunistic poll: stop at the first improving point
            y = x + h * d
            fy = fr(y)
            if the 2n compass directions +/- e_i
                x, fx, improved = y, fy, true
                break
            end
        end
        h = improved ? fy < fx : h / 2
    end
    x, fx
end

x_opt, f_opt = solve(x0)
best = accumulate(min, last.(evals))  # best value after each evaluation
(minimizer = x_opt, minimum = f_opt, evaluations = length(evals))
'''

[[codeBranches]]
model = "mads"
code = '''
using LinearAlgebra

f(x) = {{f}}
x0 = {{x0}}  # initial guess
n  = length(x0)

evals = Tuple{Vector{Float64}, Float64}[]  # every evaluation (point, value), in order
obj = Ref{Function}(f)  # the function the solver sees (swappable, e.g. for a noisy version)
fr(x) = (v = obj[](x); push!(evals, (copy(x), v)); v)  # recording wrapper passed to the solver
using DirectSearch

function solve(x0)
    empty!(evals)
    p = DSProblem(n; poll=OrthoMADS(n))
    SetObjective(p, fr)
    SetInitialPoint(p, x0)
    SetIterationLimit(p, {{maxiter}})
    Optimize!(p)
    p.x, p.x_cost
end

x_opt, f_opt = solve(x0)
best = accumulate(min, last.(evals))  # best value after each evaluation
(minimizer = x_opt, minimum = f_opt, evaluations = length(evals))
'''

[[codeBranches]]
model = "gss"
code = '''
using LinearAlgebra

f(x) = {{f}}
x0 = {{x0}}  # initial guess
n  = length(x0)

evals = Tuple{Vector{Float64}, Float64}[]  # every evaluation (point, value), in order
obj = Ref{Function}(f)  # the function the solver sees (swappable, e.g. for a noisy version)
fr(x) = (v = obj[](x); push!(evals, (copy(x), v)); v)  # recording wrapper passed to the solver

dirs = [collect(eachcol(Matrix(1.0I, n, n))); [-ones(n) ./ sqrt(n)]]  # 2h  # expand after a success

function solve(x0; step={{step}}, tol=1e-8)
    empty!(evals)
    x, fx, h = copy(x0), fr(x0), step
    for _ in 1:{{maxiter}}
        h < tol && break
        improved = false
        for d in dirs  # opportunistic poll: stop at the first improving point
            y = x + h * d
            fy = fr(y)
            if minimal positive spanning set: e_1, ..., e_n and -(1, ..., 1)
                x, fx, improved = y, fy, true
                break
            end
        end
        h = improved ? fy < fx - 1e-4 * h^2  # sufficient decrease : h / 2
    end
    x, fx
end

x_opt, f_opt = solve(x0)
best = accumulate(min, last.(evals))  # best value after each evaluation
(minimizer = x_opt, minimum = f_opt, evaluations = length(evals))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "convergence-trace"
label = "Convergence Trace"
desc = "Best objective value against the number of function evaluations (log scale)"
code = '''
using Plots

plot(best .- f_opt .+ eps(), yscale=:log10, xlabel="evaluations", ylabel="best f - f*", legend=false)
'''

[[actionGroups.actions]]
id = "contour-path"
label = "Contour + Path"
desc = "Every evaluated point and the path of improving incumbents on the contours of f (2D problems; other variables held at the optimum)"
code = '''
using Plots

P = reduce(hcat, first.(evals))
inc = [i for i in eachindex(evals) if i == 1 || evals[i][2] < best[i - 1]]  # improving evaluations
pad = max(0.5, 0.2 * maximum(abs, P[1:2, :]))
xs = range(minimum(P[1, :]) - pad, maximum(P[1, :]) + pad, length=120)
ys = range(minimum(P[2, :]) - pad, maximum(P[2, :]) + pad, length=120)
contour(xs, ys, (a, b) -> f([a; b; x_opt[3:end]]), fill=true, colorbar=false, xlabel="x1", ylabel="x2")
scatter!(P[1, :], P[2, :], markersize=1.5, color=:white, alpha=0.5, label="evaluations")
plot!(P[1, inc], P[2, inc], marker=:circle, markersize=2, color=:black, label="incumbents")
scatter!([x_opt[1]], [x_opt[2]], marker=:star, markersize=10, color=:red, label="solution")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Evaluations used, and a final poll: whether any point at distance h along +/- e_i improves on the solution (none = locally optimal at that scale)"
code = '''
h = 1e-4
neighbours = [x_opt + s * h * e for e in eachcol(Matrix(1.0I, n, n)) for s in (1, -1)]
(evaluations = length(evals), minimum = f_opt,
 best_neighbour_improvement = f_opt - minimum(f.(neighbours)),  # <= 0 means no improving neighbour
 poll_stationary = all(f.(neighbours) .>= f_opt))
'''

[[actionGroups.actions]]
id = "restart-sensitivity"
label = "Restart Sensitivity"
desc = "Solve from 10 random starts around x0 and check whether the solutions agree"
code = '''
using Random

Random.seed!(1)
runs = map(1:10) do _
    s = x0 .+ 2 .* randn(n)
    xs, fs = solve(s)
    (start = s, minimizer = xs, minimum = fs, evaluations = length(evals))
end
solve(x0)  # restore the evaluation record of the main run
sort(runs, by = r -> r.minimum)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "evaluate-new"
label = "Evaluate at New Point"
desc = "f at a new point, compared with the minimum"
code = '''
x_new = x_opt .+ 0.1  # replace with the point to evaluate
(f_new = f(x_new), f_min = f_opt, increase = f(x_new) - f_opt, distance = norm(x_new - x_opt))
'''

[[actionGroups.actions]]
id = "noisy-objective"
label = "Noisy Objective"
desc = "Solve again with evaluation noise (standard deviation 0.01) to see how far the solution moves: direct search tolerates noise better than finite-difference gradients"
code = '''
using Random

Random.seed!(1)
obj[] = x -> f(x) + 0.01 * randn()
xn, _ = solve(x0)
obj[] = f  # restore the noiseless objective
solve(x0)
(noisy_minimizer = xn, distance_to_clean = norm(xn - x_opt), clean_value_at_noisy = f(xn), clean_minimum = f_opt)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-ds-methods"
label = "Compare Methods"
desc = "This method against Nelder-Mead (Optim) and OrthoMADS (DirectSearch): minimum and evaluations"
code = '''
using Optim, DirectSearch

count_evals(g) = (k = Ref(0); (x -> (k[] += 1; g(x)), k))
fn, kn = count_evals(f); rn = optimize(fn, x0, NelderMead(), Optim.Options(iterations={{maxiter}}))
fm, km = count_evals(f); pm = DSProblem(n; poll=OrthoMADS(n)); SetObjective(pm, fm); SetInitialPoint(pm, x0); SetIterationLimit(pm, {{maxiter}}); Optimize!(pm)
[(method = "this method", minimum = f_opt, evaluations = length(evals)),
 (method = "Nelder-Mead", minimum = Optim.minimum(rn), evaluations = kn[]),
 (method = "OrthoMADS", minimum = pm.x_cost, evaluations = km[])]
'''

[[actionGroups.actions]]
id = "vs-gradient"
label = "vs Gradient-Based"
desc = "BFGS with automatic differentiation from the same start: much cheaper on smooth problems, unreliable on non-smooth ones"
code = '''
using Optim

rb = optimize(f, x0, BFGS(); autodiff=:forward)
[(method = "this method", minimum = f_opt, evaluations = length(evals), gradient_calls = 0),
 (method = "BFGS", minimum = Optim.minimum(rb), evaluations = Optim.f_calls(rb), gradient_calls = Optim.g_calls(rb))]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "solution-summary"
label = "Solution Summary"
desc = "Minimiser, minimum, evaluations and the improvement over the start"
code = '''
(minimizer = x_opt, minimum = f_opt, f_start = f(x0), improvement = f(x0) - f_opt, evaluations = length(evals))
'''

[[actionGroups.actions]]
id = "evaluation-budget"
label = "Evaluation Budget"
desc = "Evaluations needed to get within 10%, 1%, 0.1% and 0.01% of the final improvement: where the budget was spent"
code = '''
total = f(x0) - f_opt
[(within = tol, evaluations = something(findfirst(b -> b - f_opt <= tol * total, best), length(best))) for tol in (0.1, 0.01, 1e-3, 1e-4)]
'''
