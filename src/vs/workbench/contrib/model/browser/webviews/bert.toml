# BERT Embeddings Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/bert.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "BERT Embeddings"
viewType = "pollis.bert"
defaultModel = "embed"

[[packages]]
name = "Transformers.jl"
github = "https://github.com/chengchingwen/Transformers.jl"

[[packages]]
name = "Lux.jl"
github = "https://github.com/LuxDL/Lux.jl"

[requires]
packages = ["Transformers.jl", "Lux.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "BERT Embeddings"
file = "bert/tutorial-01-bert-embeddings.ipynb"
bundled = true
