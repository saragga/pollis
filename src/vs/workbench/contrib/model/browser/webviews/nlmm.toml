when = "estimator!=MCMC"
code = '''
using CairoMakie
display(compute_shrinkage(res))
plot_shrinkage(res)
'''

[[actionGroups.actions]]
id = "trajectories"
label = "Estimator Trajectories"
desc = "Refits and shows each parameter over the EM iterations: a trace that still drifts at the end has not settled"
when = "estimator=SAEM|MCEM"
code = '''
using CairoMakie
traced = fit_model(dm, NoLimits.{{estimator}}(; store_diagnostics=true))
plot_em_trajectories(traced)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "population-individual"
label = "Population and Individual Predictions"
desc = "The typical subject's prediction, with random effects at their mean, against each subject's own prediction: the gap between them is what the random effects add"
models = ["curves", "ode", "neural"]
when = "estimator!=MCMC"
code = '''
using CairoMakie
population = predict(res, data; re_mode=:population).prediction  # the typical subject
individual = predict(res, data; re_mode=:ebe).prediction  # each subject's own
fig = Figure(); ax = Axis(fig[1, 1], xlabel="Population prediction", ylabel="Individual prediction")
scatter!(ax, population, individual, markersize=6); ablines!(ax, 0, 1, linestyle=:dash)
fig
'''

