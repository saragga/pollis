[[actionGroups.actions]]
id = "estimators"
label = "Compare Two Estimators"
desc = "Refits the same model and data with a second estimator and sets the estimates side by side: a large gap means the approximation matters"
when = "estimator!=MCMC"
code = '''
{{?estimator!=SAEM}} other = fit_model(dm, NoLimits.SAEM())
{{?estimator=SAEM}} other = fit_model(dm, NoLimits.Laplace())
{{?estimator!=SAEM}} display(compare_parameters("{{estimator}}" => res, "SAEM" => other))
{{?estimator=SAEM}} display(compare_parameters("SAEM" => res, "Laplace" => other))
'''

[[actionGroups.actions]]
id = "cross-validation"
label = "Cross-Validation of Two Estimators"
desc = "Three-fold cross-validation over each subject's observations, for Laplace and SAEM: the higher mean log-likelihood on held-out rows predicts better. Each fold is a full fit"
code = '''
using Random
cv = cross_validate(dm, 3; kind=:observation, rng=MersenneTwister(1))
for (name, candidate) in (("Laplace", NoLimits.Laplace()), ("SAEM", NoLimits.SAEM()))
    score = fit_cv(cv, candidate)
    println(name, ": mean test log-likelihood = ", round(score.mean_test_loglikelihood, digits=2))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "half-life"
label = "Half-Life"
desc = "The time for the decay curve or the elimination phase to halve, for a typical subject"
models = ["curves", "ode"]
when = "estimator!=MCMC"
code = '''
p = get_params(res; scale=:untransformed)
{{?model=curves}} println("Half-life = ", round(log(2) / p.k, digits=3))
{{?model=ode}} println("Half-life = ", round(log(2) * p.v / p.cl, digits=3))
'''

[[actionGroups.actions]]
id = "sojourn"
label = "Stationary Shares and Sojourn Times"
desc = "For a typical subject, the long-run share of time in each hidden state and the mean stay in it before leaving"
models = ["markov"]
when = "estimator!=MCMC"
code = '''
p = get_params(res; scale=:untransformed)
println("Long-run share of time in state 1 = ", round(p.q21 / (p.q12 + p.q21), digits=3))
println("Mean stay: state 1 = ", round(1 / p.q12, digits=2), ", state 2 = ", round(1 / p.q21, digits=2))
'''

[[actionGroups.actions]]
id = "subject-effects"
label = "Random Effects per Subject"
desc = "Each subject's estimated random effect: how far that subject sits from the typical one"
when = "estimator!=MCMC"
code = '''
display(get_random_effects(res))
'''

[[actionGroups.actions]]
id = "uncertainty"
label = "Uncertainty Intervals"
desc = "Intervals for the fixed effects, from the curvature of the likelihood or, after MCMC, from the posterior draws, with a density for each parameter"
code = '''
using CairoMakie
uq = compute_uq(res)
display(NoLimits.summarize(uq))
plot_uq_distributions(uq; scale=:natural, plot_type=:density)
'''

[[actionGroups.actions]]
id = "chains"
label = "Posterior Chain Summary"
desc = "Means, intervals, effective sample sizes and R-hat of the MCMC draws: a low effective sample size means the run was too short"
when = "estimator=MCMC"
code = '''
display(get_chain(res))
'''
