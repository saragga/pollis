id = "fits"
label = "Fitted Trajectories"
desc = "The model's trajectory against the data for the first eight subjects: the first check of the structural model"
code = '''
using CairoMakie
plot_fits(res; individuals_idx=1:8, ncols=4)
'''

[[actionGroups.actions]]
id = "hidden"
label = "Hidden State Probabilities"
desc = "The filtered probability of each hidden state over time for the first eight subjects"
models = ["markov"]
code = '''
using CairoMakie
plot_hidden_states(res; individuals_idx=1:8, ncols=4)
'''

[[actionGroups.actions]]
id = "learned"
label = "Learned Rate Against the Covariate"
desc = "The rate the network has learned at each value of the covariate, against the rate that generated the simulated data"
models = ["neural"]
when = "estimator!=MCMC"
code = '''
using CairoMakie
grid = collect(-1.0:0.02:1.0)
weights = get_params(res; scale=:untransformed).w
network = get_model_funs(model).NN
fig = Figure(); ax = Axis(fig[1, 1], xlabel="x", ylabel="Rate k")
lines!(ax, grid, [exp(network([g], weights)[1]) for g in grid], label="Learned")
lines!(ax, grid, 0.4 .* exp.(sin.(2 .* grid)), linestyle=:dash, label="Simulated")  # replace or remove with your own table
axislegend(ax); fig
'''

