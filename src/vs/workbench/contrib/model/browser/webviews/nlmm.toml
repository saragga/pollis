[[decisionRows]]
task = "Nonlinear Curves"
context = "Closed-form mean curve"
purpose = "Growth, decay or dose-response shapes written as a formula. The fastest of the four tabs."

[[decisionRows]]
task = "ODE Dynamics"
context = "Known rate equations"
purpose = "Mechanisms written as rates between compartments, with doses or other discrete inputs."

[[decisionRows]]
task = "Markov Models"
context = "Moves between states"
purpose = "Outcomes driven by a discrete state, observed directly or only through noisy signals."

[[decisionRows]]
task = "Neural Components"
context = "Unknown functional form"
purpose = "A part of the model, such as a covariate effect, is left for a small network to learn."

[[decisionRows]]
task = "Laplace"
context = "Mildly nonlinear random effects"
purpose = "Approximates the integral over the random effects at their mode. Fast and general."

[[decisionRows]]
task = "FOCEI"
context = "Supported outcome family"
purpose = "The same kind of approximation with cheaper curvature. Not available for Markov outcomes."

[[decisionRows]]
task = "SAEM"
context = "Strongly nonlinear random effects"
purpose = "Simulates the random effects and updates by stochastic approximation, with no linearisation."

[[decisionRows]]
task = "MCEM"
context = "No curvature assumption"
purpose = "Averages over simulated random effects inside each EM step."

[[decisionRows]]
task = "MCMC"
context = "Full posterior needed"
purpose = "Samples parameters and random effects jointly. Needs priors, and is the slowest."

[[inputs]]
id = "estimator"
label = "Estimation"
tooltip = "How the model is fitted. Only the method changes: the model and the data stay as they are.\nLaplace - approximates the integral over the random effects at their mode\nFOCEI - a similar approximation with cheaper curvature, for common outcome families\nSAEM - stochastic approximation EM, for strongly nonlinear random effects\nMCEM - Monte Carlo EM, with no curvature assumption\nMCMC - samples the posterior with Turing.jl, using the priors in the model"
kind = "select"
default = "Laplace"

[[inputs.options]]
value = "Laplace"
label = "Laplace"

[[inputs.options]]
