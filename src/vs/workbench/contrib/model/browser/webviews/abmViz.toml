[[codeBranches]]
model = "interactive"
code = '''
using Agents, Random, Statistics, Tables, GLMakie  # ABM framework; seeds; means; plain columns; interactive plots

# Schelling segregation: two groups on a grid; each resident wants a minimum share of like neighbours
@agent struct Resident(GridAgent{2})
    group::Int  # 1 or 2
end

function same_share(agent, model)  # share of the neighbours (8 surrounding cells) in the same group; NaN when alone
    nbs = collect(nearby_agents(agent, model))
    return isempty(nbs) ? NaN : count(nb -> nb.group == agent.group, nbs) / length(nbs)
end
is_happy(agent, model) = (s = same_share(agent, model); isnan(s) || s >= model.min_to_be_happy)

function schelling_step!(agent, model)  # unhappy residents move to a random empty cell
    is_happy(agent, model) || move_agent_single!(agent, model)
    return
end

segregation(model) = mean(filter(!isnan, [same_share(a, model) for a in allagents(model)]))  # segregation index: mean same-group neighbour share
share_happy(model) = mean(a -> is_happy(a, model), allagents(model))

function initialize(; side = {{side}}, density = {{density}}, min_to_be_happy = {{threshold}}, seed = {{seed}})
    space = GridSpaceSingle((side, side); periodic = false)  # at most one resident per cell
    model = StandardABM(Resident, space; agent_step! = schelling_step!, properties = Dict(:min_to_be_happy => min_to_be_happy),
        rng = Xoshiro(seed), scheduler = Schedulers.Randomly(), container = Vector)
    n = round(Int, density * side^2)
    for i in 1:n
        add_agent_single!(model; group = i <= n / 2 ? 1 : 2)  # two equal groups on random empty cells
    end
    return model
end

groupcolor(a) = a.group == 1 ? :steelblue : :darkorange
plotkw = (agent_color = groupcolor, agent_marker = :rect, agent_size = 12)  # one encoding for every view
label(model) = "segregation " * string(round(segregation(model); digits = 2)) * ", happy " * string(round(share_happy(model); digits = 2))

T = {{T}}  # steps
model = initialize()

params = Dict(:min_to_be_happy => 0.0:0.05:1.0)  # slider over a model property; density is fixed at initialisation
mdata = [segregation, share_happy]  # live curves under the grid
fig, abmobs = abmexploration(model; params, mdata, mlabels = ["Same-group neighbours", "Happy residents"], plotkw...)
display(fig)

on(abmobs.model) do m  # runs after every step
    println("Step ", abmtime(m), ": ", label(m))
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "multi-panel"
label = "Multi-Panel Figure"
desc = "Snapshots at step 0, T/2 and T side by side, each titled with the segregation index and share of happy residents"
code = '''
m = initialize()
fig = Figure(size = (1200, 440))
for (i, t) in enumerate([0, div(T, 2), T])
    step!(m, t - abmtime(m))  # advance to checkpoint t
    abmplot!(Axis(fig[1, i]; title = "Step $t: " * label(m), aspect = 1), deepcopy(m); plotkw...)  # copy: the plot keeps this frame
end
display(fig)
'''

[[actionGroups.actions]]
id = "observable-overlay"
label = "Observable Overlay"
desc = "The grid at step T with the segregation index and share of happy residents over time plotted underneath"
code = '''
m = initialize()
_, mdf = run!(m, T; mdata = [segregation, share_happy])
res = Tables.columntable(mdf)  # plain columns: time, segregation, share_happy

fig = Figure(size = (700, 900))
abmplot!(Axis(fig[1, 1]; title = "Step $T: " * label(m), aspect = 1), m; plotkw...)
ax = Axis(fig[2, 1]; xlabel = "Step", ylabel = "Share")
lines!(ax, res.time, res.segregation; label = "Same-group neighbours")
lines!(ax, res.time, res.share_happy; label = "Happy residents")
axislegend(ax; position = :rb)
rowsize!(fig.layout, 2, Relative(0.3))
display(fig)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "frame-inspection"
label = "Frame Inspection"
desc = "Step a live plot by hand and print the segregation index at each stop, to match what you see with the number"
code = '''
fig, ax, abmobs = abmplot(initialize(); plotkw...)  # observable plot: updates in place
display(fig)
println("Step 0: ", label(abmobs.model[]))
for _ in 1:3
    step!(abmobs, 10)  # advance 10 steps and redraw
    println("Step ", abmtime(abmobs.model[]), ": ", label(abmobs.model[]))
    sleep(1)  # time to look at the frame
end
'''

[[actionGroups.actions]]
id = "colour-check"
label = "Colour Encoding Check"
desc = "Check that every group present has a colour and every resident is drawn, then mark unhappy residents with a cross"
code = '''
palette = Dict(1 => :steelblue, 2 => :darkorange)  # the colours used by groupcolor
present = sort(unique(a.group for a in allagents(model)))
uncoloured = setdiff(present, keys(palette))
println("Groups present: ", present, isempty(uncoloured) ? ", all coloured" : ", no colour for " * string(uncoloured))
println("Residents: ", nagents(model), " of ", {{side}}^2, " cells (", {{side}}^2 - nagents(model), " empty)")

fig, ax, _ = abmplot(model; agent_color = groupcolor, agent_size = 12,
    agent_marker = a -> is_happy(a, model) ? :rect : :xcross,  # crosses: residents who will move
    axis = (title = "Crosses are unhappy: " * label(model), aspect = 1))
display(fig)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "longer-video"
label = "Video with Observable"
desc = "Record a video of the grid with the segregation index drawn underneath as the run unfolds"
code = '''
fig, ax, abmobs = abmplot(initialize(); plotkw..., mdata = [segregation], figure = (size = (600, 800),), axis = (aspect = 1,))
series = lift(df -> (c = Tables.columntable(df); Point2f.(c.time, c.segregation)), abmobs.mdf)  # grows as data are collected
ax2 = Axis(fig[2, 1]; xlabel = "Step", ylabel = "Same-group neighbours", limits = (0, T, 0, 1))
lines!(ax2, series)
rowsize!(fig.layout, 2, Relative(0.25))
fname = "observable-" * "{{file}}"
record(fig, fname, 1:T; framerate = {{fps}}) do _
    step!(abmobs, 1)
end
println("Saved ", joinpath(pwd(), fname), "; final ", label(abmobs.model[]))
'''

[[actionGroups.actions]]
id = "interactive-scenario"
label = "Threshold Scenarios"
desc = "The grid at step T for thresholds 0.2, 0.4 and 0.7 with the same seed, each titled with its segregation index"
code = '''
fig = Figure(size = (1200, 440))
for (i, th) in enumerate([0.2, 0.4, 0.7])
    m = initialize(; min_to_be_happy = th)
    step!(m, T)
    abmplot!(Axis(fig[1, i]; title = "threshold $th: " * label(m), aspect = 1), m; plotkw...)
end
display(fig)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "static-vs-video"
label = "Same Mix, Different Pattern"
desc = "The layout at step T beside a random reshuffle of the same residents: the group shares and density are identical, only the segregation index tells them apart"
code = '''
m = initialize()
step!(m, T)
shuffled = deepcopy(m)
groups = shuffle(Xoshiro(1), [a.group for a in allagents(shuffled)])  # same residents, groups reassigned at random
for (a, g) in zip(allagents(shuffled), groups)
    a.group = g
end
share1(x) = mean(a -> a.group == 1, allagents(x))
fig = Figure(size = (1000, 520))
abmplot!(Axis(fig[1, 1]; title = "Step $T: group-1 share " * string(round(share1(m); digits = 2)) * ", " * label(m), aspect = 1), m; plotkw...)
abmplot!(Axis(fig[1, 2]; title = "Reshuffled: group-1 share " * string(round(share1(shuffled); digits = 2)) * ", " * label(shuffled), aspect = 1), shuffled; plotkw...)
display(fig)
'''

[[actionGroups.actions]]
id = "colour-schemes"
label = "Colour Schemes"
desc = "The same final grid coloured by group, by happiness and by each resident's same-group neighbour share"
code = '''
m = initialize()
step!(m, T)
cg = cgrad(:viridis)
schemes = [  # three encodings of the same state
    (label = "Group", f = groupcolor),
    (label = "Happy (grey) / unhappy (red)", f = a -> is_happy(a, m) ? :lightgray : :crimson),
    (label = "Same-group share", f = a -> (s = same_share(a, m); isnan(s) ? :black : cg[s])),
]
fig = Figure(size = (1200, 440))
for (i, s) in enumerate(schemes)
    abmplot!(Axis(fig[1, i]; title = s.label, aspect = 1), m; agent_color = s.f, agent_marker = :rect, agent_size = 12)
end
display(fig)
println(label(m))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "spatial-clustering"
label = "Spatial Clustering"
desc = "Segregation index at step T against its value under random mixing of the same residents: the excess is the clustering the dynamics created"
code = '''
m = initialize()
step!(m, T)
n = nagents(m)
n_group = [count(a -> a.group == g, allagents(m)) for g in (1, 2)]
expected = sum(k * (k - 1) for k in n_group) / (n * (n - 1))  # mean same-group share if neighbours were drawn at random
observed = segregation(m)

println("=== Spatial Clustering at step ", T, " ===")
println("Same-group neighbours, observed:      ", round(observed; digits = 3))
println("Same-group neighbours, random mixing: ", round(expected; digits = 3))
println("Excess clustering:                    ", round(observed - expected; digits = 3))
println("Threshold asked for:                  ", m.min_to_be_happy)
'''

[[actionGroups.actions]]
id = "animation-summary"
label = "Animation Summary"
desc = "What changed over the run: segregation and happiness at the start and end, when most of the change happened, and whether moving stopped"
code = '''
_, mdf = run!(initialize(), T; mdata = [segregation, share_happy])
res = Tables.columntable(mdf)  # plain columns: time, segregation, share_happy
change = res.segregation[end] - res.segregation[1]
t90 = res.time[findfirst(s -> s - res.segregation[1] >= 0.9 * change, res.segregation)]  # 90% of the total rise

println("=== Animation Summary ===")
println("Segregation:  ", round(res.segregation[1]; digits = 2), " -> ", round(res.segregation[end]; digits = 2))
println("Happy:        ", round(res.share_happy[1]; digits = 2), " -> ", round(res.share_happy[end]; digits = 2))
println("90% of the change by step ", t90, " of ", T)
println(res.share_happy[end] == 1 ? "Everyone is happy: nobody moves any more" : "Some residents are still moving at step " * string(T))
'''
