[[inputs]]
id = "T"
label = "Steps (T)"
tooltip = "Number of model steps; videos record T + 1 frames, from step 0 to step T. In one step every resident acts once, in random order."
default = "50"

[[inputs]]
id = "side"
label = "Grid Side"
tooltip = "The grid has side x side cells, with no wraparound at the edges."
default = "20"
newRow = true

[[inputs]]
id = "density"
label = "Density"
tooltip = "Share of cells occupied by residents, split equally between the two groups. Fixed when the model is built, so it is not a slider in the interactive explorer."
default = "0.9"

[[inputs]]
id = "threshold"
label = "Threshold"
tooltip = "Minimum share of neighbours from the same group for a resident to be happy, between 0 and 1. Mild values such as 0.3 already produce strong segregation."
default = "0.3"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Random seed for the initial layout and the model random number generator."
default = "42"

[[inputs]]
id = "fps"
label = "Frame rate (fps)"
tooltip = "Frames per second for the output MP4. Typical values: 5 fps for slow dynamics, 15-30 fps for faster motion. Only used for videos."
default = "10"
newRow = true

[[inputs]]
id = "file"
label = "Output file"
tooltip = "File name for the recorded video. Must end in .mp4. The file is saved in the current working directory. Only used for videos."
default = "schelling.mp4"

[[codeBranches]]
model = "static"
code = '''
using Agents, Random, Statistics, Tables, GLMakie  # ABM framework; seeds; means; plain columns; interactive plots

# Schelling segregation: two groups on a grid; each resident wants a minimum share of like neighbours
@agent struct Resident(GridAgent{2})
    group::Int  # 1 or 2
end

function same_share(agent, model)  # share of the neighbours (8 surrounding cells) in the same group; NaN when alone
    nbs = collect(nearby_agents(agent, model))
    return isempty(nbs) ? NaN : count(nb -> nb.group == agent.group, nbs) / length(nbs)
end
is_happy(agent, model) = (s = same_share(agent, model); isnan(s) || s >= model.min_to_be_happy)

function schelling_step!(agent, model)  # unhappy residents move to a random empty cell
    is_happy(agent, model) || move_agent_single!(agent, model)
    return
end

segregation(model) = mean(filter(!isnan, [same_share(a, model) for a in allagents(model)]))  # segregation index: mean same-group neighbour share
share_happy(model) = mean(a -> is_happy(a, model), allagents(model))

function initialize(; side = {{side}}, density = {{density}}, min_to_be_happy = {{threshold}}, seed = {{seed}})
    space = GridSpaceSingle((side, side); periodic = false)  # at most one resident per cell
    model = StandardABM(Resident, space; agent_step! = schelling_step!, properties = Dict(:min_to_be_happy => min_to_be_happy),
        rng = Xoshiro(seed), scheduler = Schedulers.Randomly(), container = Vector)
    n = round(Int, density * side^2)
    for i in 1:n
        add_agent_single!(model; group = i <= n / 2 ? 1 : 2)  # two equal groups on random empty cells
    end
    return model
end

groupcolor(a) = a.group == 1 ? :steelblue : :darkorange
plotkw = (agent_color = groupcolor, agent_marker = :rect, agent_size = 12)  # one encoding for every view
label(model) = "segregation " * string(round(segregation(model); digits = 2)) * ", happy " * string(round(share_happy(model); digits = 2))

T = {{T}}  # steps
model = initialize()

fig = Figure(size = (1000, 520))
abmplot!(Axis(fig[1, 1]; title = "Step 0: " * label(model), aspect = 1), initialize(); plotkw...)  # same seed: the starting layout
step!(model, T)
abmplot!(Axis(fig[1, 2]; title = "Step $T: " * label(model), aspect = 1), model; plotkw...)
display(fig)
'''

