# ABM Visualisation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/abm-viz.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "ABM Visualisation"
viewType = "pollis.abm-viz"
defaultModel = "static"

[[packages]]
name = "Agents.jl"
github = "https://github.com/JuliaDynamics/Agents.jl"

[[packages.videos]]
title = "Agents.jl Tutorial"
description = "Step-by-step introduction to building agent-based models with Agents.jl"
url = "https://www.youtube.com/watch?v=QL-bDjzS1pg"

[requires]
packages = ["Agents.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Static Plot (abmplot)"
file = "abm-viz/tutorial-01-static.ipynb"
bundled = true
description = "Produce a static snapshot of agent positions and states using abmplot"

[[notebookSections.notebooks]]
name = "Animation (abmvideo)"
file = "abm-viz/tutorial-02-video.ipynb"
bundled = true
description = "Record an MP4 animation of a model run with abmvideo"

[[notebookSections.notebooks]]
name = "Interactive Explorer"
file = "abm-viz/tutorial-03-interactive.ipynb"
bundled = true
description = "Launch a live interactive dashboard with abmexploration to tune parameters in real time"

