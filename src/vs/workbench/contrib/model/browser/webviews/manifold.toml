[[models]]
id = "isomap"
label = "ISOmap"

[[models]]
id = "lle"
label = "LLE"

[[models]]
id = "dm"
label = "Diffusion Maps"

[[bullets]]
text = "ISOmap"
detail = "approximates geodesic distances via a k-NN graph then applies classical MDS; preserves global curved structure (ManifoldLearning.jl)"

[[bullets]]
text = "LLE"
detail = "reconstructs each point as a weighted sum of its neighbours, then finds a low-dimensional embedding that preserves those weights (ManifoldLearning.jl)"

[[bullets]]
text = "Diffusion Maps"
detail = "builds a Markov diffusion process on the data graph; embeds using eigenvectors of the diffusion operator scaled by lambdat (ManifoldLearning.jl)"

[[decisionRows]]
task = "ISOmap"
context = "One smooth, well-sampled curved sheet (e.g. a Swiss roll)"
purpose = "Preserve geodesic distances measured along the k-NN graph"

[[decisionRows]]
task = "LLE"
context = "Locally linear patches; fast, sparse computation"
purpose = "Preserve each point's reconstruction from its neighbours"

[[decisionRows]]
task = "Diffusion Maps"
context = "Noisy data, uneven sampling, multiscale structure"
purpose = "Diffusion distance of a random walk on the data; t sets the scale"

[[inputs]]
id = "X"
label = "Feature Matrix"
tooltip = "n_samples × n_features matrix, one row per observation. ManifoldLearning.jl expects features × samples, so the code transposes it."
default = "X_train"

[[inputs]]
id = "d"
label = "Output Dimensions"
tooltip = "Number of dimensions in the embedding. Use 2 or 3 for visualisation."
default = "2"
newRow = true

[[inputs]]
id = "k"
label = "k (neighbours)"
tooltip = "Number of nearest neighbours in the graph. Too small tears the manifold into pieces; too large short-circuits across folds. Compare values with the Choosing k action."
default = "10"
models = ["isomap", "lle"]

[[inputs]]
id = "sigma"
label = "sigma (bandwidth)"
tooltip = "Bandwidth of the Gaussian kernel K_ij = exp(-||x_i - x_j||^2 / sigma^2). A common start is the median pairwise distance."
default = "1.0"
models = ["dm"]

[[inputs]]
id = "t"
label = "t (diffusion time)"
tooltip = "Number of diffusion steps. Larger t damps the small-eigenvalue directions and emphasises global geometry; t = 1 keeps the finest scale."
default = "1"
models = ["dm"]

