[[codeBranches]]
model = "isomap"
code = '''
using ManifoldLearning, Distances, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
d  = {{d}}  # embedding dimensions
k  = {{k}}  # neighbours in the k-NN graph
Xt = permutedims(X)  # ManifoldLearning.jl expects features x samples

embed(k) = permutedims(predict(fit(Isomap, Xt; k=k, maxoutdim=d)))  # geodesic distances on the k-NN graph, then classical MDS
grid = [5, 8, 10, 15, 20, 30]  # neighbourhood sizes compared by the Choosing action
Y = embed(k)  # n x d embedding
geodesic() = let D = pairwise(Euclidean(), X, dims=1), n = size(D, 1), W = fill(Inf, n, n)  # shortest paths on the k-NN graph: the distances Isomap preserves
    for i in 1:n, j in partialsortperm(D[i, :], 1:k+1); W[i, j] = W[j, i] = D[i, j]; end
    for m in 1:n, i in 1:n, j in 1:n; W[i, j] = min(W[i, j], W[i, m] + W[m, j]); end  # Floyd-Warshall
    W
end

function trustworthiness(Y, m=10)  # share of embedding neighbours that were also near in X (1 = perfect)
    n  = size(X, 1)
    Dx = pairwise(Euclidean(), X, dims=1)
    Dy = pairwise(Euclidean(), Y, dims=1)
    penalty = 0.0
    for i in 1:n
        rank_x = invperm(sortperm(Dx[i, :])) .- 1  # rank 0 = the point itself
        for j in sortperm(Dy[i, :])[2:m+1]
            penalty += max(rank_x[j] - m, 0)
        end
    end
    1 - 2 * penalty / (n * m * (2n - 3m - 1))
end
trustworthiness(Y)
'''

[[codeBranches]]
model = "lle"
code = '''
using ManifoldLearning, Distances, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
d  = {{d}}  # embedding dimensions
k  = {{k}}  # neighbours used for each reconstruction
Xt = permutedims(X)  # ManifoldLearning.jl expects features x samples

embed(k) = permutedims(predict(fit(LLE, Xt; k=k, maxoutdim=d)))  # local reconstruction weights, then the embedding that keeps them
grid = [5, 8, 10, 15, 20, 30]  # neighbourhood sizes compared by the Choosing action
Y = embed(k)  # n x d embedding

function trustworthiness(Y, m=10)  # share of embedding neighbours that were also near in X (1 = perfect)
    n  = size(X, 1)
    Dx = pairwise(Euclidean(), X, dims=1)
    Dy = pairwise(Euclidean(), Y, dims=1)
    penalty = 0.0
    for i in 1:n
        rank_x = invperm(sortperm(Dx[i, :])) .- 1  # rank 0 = the point itself
        for j in sortperm(Dy[i, :])[2:m+1]
            penalty += max(rank_x[j] - m, 0)
        end
    end
    1 - 2 * penalty / (n * m * (2n - 3m - 1))
end
trustworthiness(Y)
'''

[[codeBranches]]
model = "dm"
code = '''
using LinearAlgebra, Distances, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
d  = {{d}}  # embedding dimensions
sigma = {{sigma}}  # kernel bandwidth
t     = {{t}}  # diffusion time

function embed(sigma)
    K = exp.(-pairwise(SqEuclidean(), X, dims=1) ./ sigma^2)  # Gaussian affinities
    q = vec(sum(K, dims=2))
    K = K ./ (q * permutedims(q))  # alpha = 1 normalisation: removes the effect of sampling density
    s = sqrt.(vec(sum(K, dims=2)))
    F = eigen(Symmetric(K ./ (s * permutedims(s))))  # symmetric conjugate of the Markov matrix P
    order = sortperm(F.values, rev=true)
    psi = F.vectors[:, order] ./ s  # right eigenvectors of P
    lam = F.values[order]
    psi[:, 2:d+1] .* permutedims(lam[2:d+1] .^ t)  # skip the constant eigenvector; scale by lambda^t
end
grid = sigma .* [0.25, 0.5, 1, 2, 4]  # bandwidths compared by the Choosing action
Y = embed(sigma)  # n x d diffusion coordinates

function trustworthiness(Y, m=10)  # share of embedding neighbours that were also near in X (1 = perfect)
    n  = size(X, 1)
    Dx = pairwise(Euclidean(), X, dims=1)
    Dy = pairwise(Euclidean(), Y, dims=1)
    penalty = 0.0
    for i in 1:n
        rank_x = invperm(sortperm(Dx[i, :])) .- 1  # rank 0 = the point itself
        for j in sortperm(Dy[i, :])[2:m+1]
            penalty += max(rank_x[j] - m, 0)
        end
    end
    1 - 2 * penalty / (n * m * (2n - 3m - 1))
end
trustworthiness(Y)
'''

