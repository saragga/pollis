'''

[[actionGroups.actions]]
id = "graph"
label = "Neighbourhood Graph"
desc = "Edges of the original-space 10-NN graph drawn on the embedding: long edges reveal tears or short circuits"
code = '''
using Plots

Dx = pairwise(Euclidean(), X, dims=1)
p = plot(legend=false, xlabel="axis 1", ylabel="axis 2")
for i in axes(X, 1), j in sortperm(Dx[i, :])[2:11]
    plot!(p, [Y[i, 1], Y[j, 1]], [Y[i, 2], Y[j, 2]], color=:gray, alpha=0.3)
end
scatter!(p, Y[:, 1], Y[:, 2], markersize=2)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "trustworthiness"
label = "Trustworthiness"
desc = "Trustworthiness for 5 to 50 neighbours: how far the embedding's neighbourhoods can be trusted (1 = perfect)"
code = '''
using Plots

ms = [5, 10, 20, 30, 50]
plot(ms, [trustworthiness(Y, m) for m in ms], marker=:circle, xlabel="neighbours checked", ylabel="trustworthiness", legend=false)
'''

[[actionGroups.actions]]
id = "residual-variance"
label = "Residual Variance"
desc = "1 - r^2 between original and embedding distances (for ISOmap the geodesic graph distances it preserves): how much global distance structure is lost (0 = none)"
code = '''
using Plots

{{?model!=isomap}} Dx = pairwise(Euclidean(), X, dims=1)
{{?model=isomap}} Dx = geodesic()  # Tenenbaum residual variance uses geodesic distances
Dy = pairwise(Euclidean(), Y, dims=1)
upper = [(i, j) for j in axes(Dx, 2) for i in 1:j-1 if isfinite(Dx[i, j])]  # pairs in disconnected graph components dropped
a, b = [Dx[i, j] for (i, j) in upper], [Dy[i, j] for (i, j) in upper]
scatter(a, b, markersize=1, alpha=0.2, xlabel="original distance", ylabel="embedding distance", legend=false)  # Shepard diagram
1 - cor(a, b)^2
'''

[[actionGroups.actions]]
id = "choose"
label = "Choosing k or sigma"
desc = "Trustworthiness of the embedding for each neighbourhood size (ISOmap, LLE) or bandwidth (Diffusion Maps)"
code = '''
using Plots

scores = [trustworthiness(embed(g)) for g in grid]
{{?model=dm}} plot(grid, scores, marker=:circle, xscale=:log10, xlabel="sigma", ylabel="trustworthiness", legend=false)
{{?model!=dm}} plot(grid, scores, marker=:circle, xlabel="k", ylabel="trustworthiness", legend=false)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "embed-new"
label = "Embed New Data"
desc = "Place new observations by reconstructing each from its 10 nearest training points and applying the same weights in the embedding"
code = '''
using LinearAlgebra

function place(x, m=10)
    nb = sortperm(vec(pairwise(Euclidean(), permutedims(x), X, dims=1)))[1:m]
    Z  = X[nb, :] .- permutedims(x)  # neighbours relative to x
    G  = Z * permutedims(Z)
    w  = (G + 1e-3 * tr(G) * I) \ ones(m)  # regularised reconstruction weights
    permutedims(w ./ sum(w)) * Y[nb, :]
end
Y_new = reduce(vcat, [place(x) for x in eachrow(X_new)])  # X_new: same columns as X; n_new x d
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-pca"
label = "vs PCA"
desc = "Trustworthiness and residual variance of this embedding against a linear PCA embedding of the same dimension"
code = '''
using LinearAlgebra

Xc  = X .- mean(X, dims=1)
Ypca = Xc * svd(Xc).V[:, 1:d]
{{?model!=isomap}} Dx  = vec(pairwise(Euclidean(), X, dims=1))
{{?model=isomap}} Dx  = vec(geodesic())  # geodesic distances for ISOmap, so a correct unrolling is not penalised
ok  = isfinite.(Dx)  # pairs in disconnected graph components dropped
resvar(Z) = 1 - cor(Dx[ok], vec(pairwise(Euclidean(), Z, dims=1))[ok])^2
(manifold = (trust = trustworthiness(Y), resvar = resvar(Y)), pca = (trust = trustworthiness(Ypca), resvar = resvar(Ypca)))
'''

