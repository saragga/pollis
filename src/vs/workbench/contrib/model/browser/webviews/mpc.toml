# Model Predictive Control Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/mpc.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Model Predictive Control"
viewType = "pollis.mpc"
defaultModel = "linmpc"

[[packages]]
name = "ModelPredictiveControl.jl"
github = "https://github.com/JuliaControl/ModelPredictiveControl.jl"

[requires]
packages = ["ModelPredictiveControl.jl", "ControlSystemsBase.jl", "Plots.jl"]

