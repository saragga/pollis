	+ '<path d="M16,64 A13,13 0 0 1 14,45" fill="none" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2,2"/><line x1="27" y1="52" x2="27" y2="68" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>';
'''

[[codeBranches]]
model = "linmpc"
code = '''
using ModelPredictiveControl, ControlSystemsBase, LinearAlgebra, Statistics

Ts = {{Ts}}  # sample time
model = LinModel({{plant}}, Ts)  # discretised linear plant
ry = {{ry}}  # setpoint
Hp, Hc = {{Hp}}, {{Hc}}  # prediction and control horizons

build(; Hp=Hp, Hc=Hc, Mwt={{Mwt}}, Nwt={{Nwt}}) = (c = LinMPC(model; Hp, Hc, Mwt, Nwt); setconstraint!(c; umin={{umin}}, umax={{umax}}); c)

mpc = build()
res = sim!(mpc, {{Nsim}}, ry)  # closed loop on the nominal plant
Y, U = res.Y_data, res.U_data
(final_output = Y[:, end], setpoint = ry, tracking_rmse = sqrt(mean(abs2, Y .- ry)), peak_input = maximum(abs, U))
'''

[[codeBranches]]
model = "nonlinmpc"
code = '''
using ModelPredictiveControl, LinearAlgebra, Statistics

Ts = {{Ts}}  # sample time
f(x, u, _, _) = {{f}}  # continuous-time dynamics
h(x, _, _) = {{h}}  # measured output
ry = {{ryn}}  # setpoint
nu, nx, ny = {{nu}}, {{nx}}, length(ry)
model = NonLinModel(f, h, Ts, nu, nx, ny)  # integrated with RK4 between samples
Hp, Hc = {{Hp}}, {{Hc}}  # prediction and control horizons

build(; Hp=Hp, Hc=Hc, Mwt={{Mwt}}, Nwt={{Nwt}}) = (c = NonLinMPC(model; Hp, Hc, Mwt, Nwt); setconstraint!(c; umin={{umin}}, umax={{umax}}); c)

mpc = build()
res = sim!(mpc, {{Nsim}}, ry)  # closed loop on the nominal plant
Y, U = res.Y_data, res.U_data
(final_output = Y[:, end], setpoint = ry, tracking_rmse = sqrt(mean(abs2, Y .- ry)), peak_input = maximum(abs, U))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "closed-loop"
label = "Closed-Loop Response"
desc = "Outputs against the setpoint and the inputs with their bounds (ModelPredictiveControl plot recipe)"
code = '''
using Plots

plot(res, plotu=true, plotry=true)
'''

[[actionGroups.actions]]
id = "open-loop-step"
label = "Open-Loop Step Response"
desc = "The plant alone under a unit input step: the dynamics the controller has to shape"
code = '''
using Plots

plot(sim!(deepcopy(model), {{Nsim}}, ones(model.nu)))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "constraint-check"
label = "Constraint Check"
desc = "Whether the applied inputs stayed within bounds, how often they saturated, and the overshoot and final error of the outputs"
code = '''
lo, hi = {{umin}}, {{umax}}
sat = mean(any(U[:, k] .<= lo .+ 1e-6) || any(U[:, k] .>= hi .- 1e-6) for k in axes(U, 2))
(inputs_within_bounds = all(lo .- 1e-6 .<= U .<= hi .+ 1e-6), share_of_steps_saturated = sat,
 overshoot = maximum(Y, dims=2)[:] .- ry, final_error = Y[:, end] .- ry)
'''

[[actionGroups.actions]]
id = "solve-time"
label = "Solve Time"
desc = "Run the loop step by step and time each optimisation: the controller is real-time feasible only if the worst solve is well below the sample time"
code = '''
plant = deepcopy(model); ctrl = build()
initstate!(ctrl, zeros(model.nu), evaloutput(plant))
times = map(1:{{Nsim}}) do _
    y = evaloutput(plant)
    preparestate!(ctrl, y)
    t = @elapsed u = moveinput!(ctrl, ry)
    updatestate!(ctrl, u, y); updatestate!(plant, u)
    t
end
(mean_solve_seconds = mean(times[2:end]), worst_solve_seconds = maximum(times[2:end]), sample_time = Ts,
 real_time_feasible = maximum(times[2:end]) < Ts)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "disturbance-rejection"
label = "Disturbance Rejection"
desc = "Closed loop with a step load disturbance on the input: the integrating state estimator removes the offset"
code = '''
using Plots

plot(sim!(build(), {{Nsim}}, ry; plant=deepcopy(model), u_step=0.1 .* ones(model.nu)), plotu=true)
'''

[[actionGroups.actions]]
id = "plant-mismatch"
label = "Plant Mismatch"
desc = "The controller keeps its model while the real plant has 20% more input gain: robustness of the tracking"
code = '''
using Plots

{{?model=linmpc}} plant = LinModel(1.2 * ({{plant}}), Ts)
{{?model=nonlinmpc}} plant = NonLinModel((x, u, d, p) -> f(x, 1.2 .* u, d, p), h, Ts, nu, nx, ny)
r = sim!(build(), {{Nsim}}, ry; plant=plant)
display(plot(r, plotu=true))
(tracking_rmse_mismatch = sqrt(mean(abs2, r.Y_data .- ry)), tracking_rmse_nominal = sqrt(mean(abs2, Y .- ry)))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "horizon-sweep"
label = "Horizon Sweep"
desc = "Tracking error, input effort and solve time for several prediction horizons"
code = '''
map([5, 10, 20, 40]) do hp
    c = build(Hp=hp, Hc=min(Hc, hp))
    t = @elapsed r = sim!(c, {{Nsim}}, ry)
    (Hp = hp, tracking_rmse = sqrt(mean(abs2, r.Y_data .- ry)), input_moves = sum(abs, diff(r.U_data, dims=2)), seconds_per_step = t / {{Nsim}})
end
'''

[[actionGroups.actions]]
id = "alternative-controller"
label = "Alternative Controller"
desc = "Linear MPC against the unconstrained analytic ExplicitMPC; nonlinear MPC against a linear MPC built on the model linearised at the operating point"
code = '''
using Plots

{{?model=linmpc}} alt = ExplicitMPC(model; Hp, Hc, Mwt={{Mwt}}, Nwt={{Nwt}}); altname = "ExplicitMPC (no constraints)"
{{?model=nonlinmpc}} alt = LinMPC(linearize(model); Hp, Hc, Mwt={{Mwt}}, Nwt={{Nwt}}); setconstraint!(alt; umin={{umin}}, umax={{umax}}); altname = "LinMPC on linearised model"
ra = sim!(alt, {{Nsim}}, ry; plant=deepcopy(model))
p = plot(res.T_data, res.Y_data', label="MPC", xlabel="time", ylabel="output")
plot!(p, ra.T_data, ra.Y_data', label=altname)
hline!(p, ry, linestyle=:dash, color=:gray, label="setpoint")
display(p)
(mpc_rmse = sqrt(mean(abs2, Y .- ry)), alternative_rmse = sqrt(mean(abs2, ra.Y_data .- ry)), alternative_peak_input = maximum(abs, ra.U_data))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "weight-sensitivity"
label = "Weight Sensitivity"
desc = "Sweep the move weight: faster tracking costs larger, more aggressive input moves"
code = '''
using Plots

res_w = map([0.1, 0.5, 2.5, 10.0]) do w
    r = sim!(build(Nwt=fill(w, model.nu)), {{Nsim}}, ry)
    (Nwt = w, tracking_rmse = sqrt(mean(abs2, r.Y_data .- ry)), input_moves = sum(abs, diff(r.U_data, dims=2)))
end
display(plot(getfield.(res_w, :input_moves), getfield.(res_w, :tracking_rmse), marker=:circle, xlabel="total input movement", ylabel="tracking RMSE", legend=false))
res_w
'''

[[actionGroups.actions]]
id = "receding-plan"
label = "Receding-Horizon Plan"
desc = "The full input sequence the controller plans at the first step and its objective: only the first move is applied before re-planning"
code = '''
using Plots

ctrl = build()
initstate!(ctrl, zeros(model.nu), evaloutput(model))
preparestate!(ctrl, evaloutput(model))
u0 = moveinput!(ctrl, ry)
info = getinfo(ctrl)
Uplan = reshape(info[:U], model.nu, Hp)'
display(plot(Ts .* (0:Hp-1), Uplan, linetype=:steppost, xlabel="time ahead", ylabel="planned input", label=permutedims(["u$j" for j in 1:model.nu])))
(first_move = u0, objective = info[:J])
'''
