[[models]]
id = "linmpc"
label = "Linear MPC"

[[models]]
id = "nonlinmpc"
label = "Nonlinear MPC"

[[decisionRows]]
task = "Linear MPC"
context = "Plants well described by a linear model around the operating point; fast sampling"
purpose = "Each step solves a convex QP over the horizon with input and output constraints; apply the first move and repeat"

[[decisionRows]]
task = "Nonlinear MPC"
context = "Strongly nonlinear plants or wide operating ranges (e.g. swinging a pendulum upright)"
purpose = "Each step solves a nonlinear program with the full model (Ipopt); state estimated by an unscented Kalman filter"

[[inputs]]
id = "plant"
label = "Plant Transfer Function"
tooltip = "Continuous-time plant built with ControlSystemsBase, discretised at the sample time. Examples: tf(2, [1, 1]) (first order), tf(1, [1, 0.6, 1]) (lightly damped)."
default = "tf(2, [1, 1])"
models = ["linmpc"]

[[inputs]]
id = "ry"
label = "Setpoint"
tooltip = "Output reference as a Julia vector (length ny)."
default = "[1.0]"
models = ["linmpc"]

[[inputs]]
id = "f"
label = "Dynamics f(x, u)"
tooltip = "Continuous-time state derivative as a Julia vector in terms of x and u. Default: a pendulum with friction and torque input (angle x[1] in radians)."
default = "[x[2], -24.5 * sin(x[1]) - 4.0 * x[2] + 20.8 * u[1]]"
models = ["nonlinmpc"]

[[inputs]]
id = "h"
label = "Output h(x)"
tooltip = "Measured output as a Julia vector in terms of x. Default: the pendulum angle in degrees."
default = "[180 / pi * x[1]]"
models = ["nonlinmpc"]

[[inputs]]
id = "nx"
label = "States"
tooltip = "Number of states (length of x)."
default = "2"
models = ["nonlinmpc"]

[[inputs]]
id = "nu"
label = "Inputs"
tooltip = "Number of manipulated inputs (length of u)."
default = "1"
models = ["nonlinmpc"]

[[inputs]]
id = "ryn"
label = "Setpoint"
tooltip = "Output reference as a Julia vector (length ny). 180 degrees is the pendulum upright."
default = "[180.0]"
models = ["nonlinmpc"]

[[inputs]]
id = "Ts"
label = "Sample Time"
tooltip = "Controller sampling period in seconds. The MPC problem must be solved faster than this in real time."
default = "0.1"
newRow = true

[[inputs]]
id = "Hp"
label = "Prediction Horizon"
tooltip = "Number of future steps predicted. Hp * Ts should cover the main plant dynamics; larger Hp costs more per solve."
default = "20"

[[inputs]]
id = "Hc"
label = "Control Horizon"
tooltip = "Number of free input moves (Hc <= Hp); the input is held after Hc. Small Hc means fewer decision variables."
default = "2"

[[inputs]]
id = "Nsim"
label = "Simulation Steps"
tooltip = "Number of closed-loop steps simulated."
default = "35"

[[inputs]]
id = "Mwt"
label = "Output Weights"
tooltip = "Setpoint-tracking weights, one per output (vector of length ny)."
default = "[0.5]"
newRow = true

[[inputs]]
id = "Nwt"
label = "Move Weights"
tooltip = "Penalty on input moves (changes of u between steps), one per input. Larger values give smoother, slower control."
default = "[2.5]"

[[inputs]]
id = "umin"
label = "Input Min"
tooltip = "Lower bound on each input as a Julia vector; use [-Inf] for none."
default = "[-1.5]"

[[inputs]]
id = "umax"
label = "Input Max"
tooltip = "Upper bound on each input as a Julia vector; use [Inf] for none."
default = "[1.5]"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

