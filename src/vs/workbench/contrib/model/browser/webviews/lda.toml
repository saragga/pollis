[[actionGroups.actions]]
id = "topic-words"
label = "Top Words per Topic"
desc = "Highest-probability words for each discovered topic"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])
