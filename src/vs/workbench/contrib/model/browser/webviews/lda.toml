[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-k"
label = "Compare k Topics"
desc = "Perplexity across different numbers of topics"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])
prepare!(crps, strip_punctuation | strip_case)
update_lexicon!(crps)
dtm   = DocumentTermMatrix(crps)

for k in [5, 10, 20, 50]  # sweep over number of topics
    model = LDA(dtm.dtm, k)
    train!(model, iter={{iters}})  # train each model
    println("k=", k, " perplexity=", perplexity(model))  # report perplexity
end
'''

[[actionGroups.actions]]
id = "lda-vs-flda"
label = "LDA vs Focused LDA"
desc = "Topic quality and background word separation"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])
prepare!(crps, strip_punctuation | strip_case)
update_lexicon!(crps)
dtm   = DocumentTermMatrix(crps)

lda_model  = LDA(dtm.dtm, {{k}})  # standard LDA
flda_model = fLDA(dtm.dtm, {{k}})  # focused LDA
train!(lda_model,  iter={{iters}})  # train LDA
train!(flda_model, iter={{iters}})  # train fLDA

println("LDA perplexity:  ", perplexity(lda_model))  # compare perplexity
println("fLDA perplexity: ", perplexity(flda_model))  # lower is better
'''

