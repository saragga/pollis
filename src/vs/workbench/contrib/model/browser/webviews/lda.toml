[[models]]
id = "lda"
label = "LDA"

[[bullets]]
text = "LDA"
detail = "probabilistic generative model; documents as mixtures of topics, topics as distributions over words (Dirichlet priors)"

[[bullets]]
text = "Collapsed Gibbs sampling"
detail = "resamples the topic of every token given all the others; phi and theta are read from the last sweep"

[[bullets]]
text = "TextAnalysis.jl"
detail = "corpus cleaning, document-term matrix and lda(dtm, k, iterations, ...); see the LSA panel for the SVD alternative"

[[inputs]]
id = "corpus"
label = "Corpus"
tooltip = "Vector of text documents, e.g. corpus = [\"first doc\", \"second doc\"]"
default = "corpus"

[[inputs]]
id = "k"
label = "Topics (k)"
tooltip = "Number of latent topics to discover"
default = "10"

[[inputs]]
id = "iters"
label = "Gibbs Sweeps"
tooltip = "Number of collapsed Gibbs sampling sweeps over all tokens"
default = "1000"

[[inputs]]
id = "alpha"
label = "Document-Topic Prior (alpha)"
tooltip = "Symmetric Dirichlet prior on each document mixture of topics; below 1 favours few topics per document"
default = "0.1"

[[inputs]]
id = "beta"
label = "Topic-Word Prior (beta)"
tooltip = "Symmetric Dirichlet prior on each topic distribution over words; below 1 favours few words per topic"
default = "0.01"

[[inputs]]
id = "holdout"
label = "Held-Out Share"
tooltip = "Share of each document tokens held out for the document-completion perplexity"
default = "0.1"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Seed of the global random number generator, which lda uses"
default = "1"

[[inputs]]
id = "topic"
label = "Topic to Inspect"
tooltip = "Topic index used by the Top Documents action"
default = "1"

[[inputs]]
id = "new-doc"
label = "New Document"
tooltip = "A Julia string with the text of a document to place in the topics"
default = "\"replace with the text of a new document\""

[[codeBranches]]
model = "lda"
code = '''
using TextAnalysis, SparseArrays, LinearAlgebra, Random  # corpus, DTM and lda; sparse counts; dot; seeding

crps = Corpus([StringDocument(d) for d in {{corpus}}])  # one document per string
prepare!(crps, strip_punctuation | strip_case | strip_numbers | strip_stopwords)  # clean text and drop stop words
update_lexicon!(crps)  # build the vocabulary
dtm   = DocumentTermMatrix(crps)  # dtm.dtm: N x V sparse counts; dtm.terms: the V terms
terms = dtm.terms
N, V  = size(dtm.dtm)

k, iters = {{k}}, {{iters}}  # topics, Gibbs sweeps
a, b     = {{alpha}}, {{beta}}  # Dirichlet priors: document-topic a, topic-word b
# lda smooths the topic-word counts with its 4th argument and the document-topic counts with its 5th
# (the reverse of its docstring), so b goes 4th and a goes 5th
fit_lda(m, kk) = (Random.seed!({{seed}}); lda(m, kk, iters, b, a; showprogress = false))  # lda samples with the global RNG
phi, theta = fit_lda(dtm, k)  # phi: k x V p(word | topic); theta: k x N p(topic | document); counts of the last sweep

top_words(P, t, n = 10) = terms[sortperm(Vector(P[t, :]), rev = true)[1:n]]  # n most probable words of topic t

occurs = dtm.dtm .> 0  # N x V: does document d contain term w
function umass(ws)  # UMass coherence of a ranked word list (Mimno et al. 2011): near 0 is coherent, very negative is not
    ix = [dtm.column_indices[w] for w in ws]
    D(i, j) = sum(occurs[:, i] .& occurs[:, j])  # documents containing both terms
    sum(log((D(ix[m], ix[l]) + 1) / D(ix[l], ix[l])) for m in 2:length(ix) for l in 1:m-1)
end

# Document completion (Wallach et al. 2009): hold out a share of each document tokens, fit on the rest,
# and score the held-out tokens with the posterior-mean estimates; an add-one unigram model is the baseline to beat
function heldout_perplexity(kk; share = {{holdout}})
    Random.seed!({{seed}})
    d, w, c = findnz(dtm.dtm)
    h = [count(<(share), rand(ci)) for ci in c]  # held-out tokens in each (document, term) cell
    train = DocumentTermMatrix(dropzeros(sparse(d, w, c .- h, N, V)), terms)
    P, T = fit_lda(train, kk)
    nd  = vec(sum(train.dtm, dims = 2))  # training tokens per document
    ndk = replace(T, NaN => 0.0) .* transpose(nd)  # topic counts per document (theta is NaN for a document with no training tokens)
    nk  = vec(sum(ndk, dims = 2))  # tokens per topic
    phi_s   = (P .* nk .+ b) ./ (nk .+ V * b)  # posterior mean p(word | topic)
    theta_s = (ndk .+ a) ./ (transpose(nd) .+ kk * a)  # posterior mean p(topic | document)
    uni = (vec(sum(train.dtm, dims = 1)) .+ 1) ./ (sum(nd) + V)  # add-one unigram baseline
    ll_lda = sum(hi * log(dot(theta_s[:, di], phi_s[:, wi])) for (di, wi, hi) in zip(d, w, h) if hi > 0)
    ll_uni = sum(hi * log(uni[wi]) for (wi, hi) in zip(w, h) if hi > 0)
    (lda = exp(-ll_lda / sum(h)), unigram = exp(-ll_uni / sum(h)), phi = P)
end

for t in 1:k
    println("Topic $t: ", join(top_words(phi, t), ", "))
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "topic-words"
label = "Top Words per Topic"
desc = "Highest-probability words of the first six topics"
code = '''
using Plots  # plotting

n = 10  # words per topic
plots = [bar(top_words(phi, t, n), sort(Vector(phi[t, :]), rev = true)[1:n], orientation = :h, yflip = true,
             legend = false, title = "Topic $t", xlabel = "p(word | topic)") for t in 1:min(k, 6)]
plot(plots..., layout = length(plots), size = (900, 600))
'''

[[actionGroups.actions]]
id = "doc-topic-dist"
label = "Document-Topic Distribution"
desc = "Heatmap of each document mixture of topics (theta)"
code = '''
using Plots  # plotting

heatmap(theta, xlabel = "document", ylabel = "topic", colorbar_title = "p(topic | document)", yflip = true)  # columns sum to 1
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "perplexity"
label = "Held-Out Perplexity"
desc = "Document-completion perplexity against a unigram baseline; lower is better"
code = '''
r = heldout_perplexity(k)  # refits on the training tokens
println("Held-out perplexity at k = $k: LDA ", round(r.lda; digits = 1), "   unigram baseline ", round(r.unigram; digits = 1), "   (vocabulary size $V)")
println(r.lda < r.unigram ? "The topics predict unseen tokens better than word frequencies alone." : "LDA does not beat the unigram model: try fewer topics, more sweeps or a larger corpus.")
'''

[[actionGroups.actions]]
id = "topic-coherence"
label = "Topic Coherence"
desc = "UMass coherence of the top 10 words of each topic, from document co-occurrence"
code = '''
using Plots, Statistics  # plotting, mean

coh = [umass(top_words(phi, t)) for t in 1:k]  # near 0 = top words co-occur in the same documents
bar(1:k, coh, legend = false, xlabel = "topic", ylabel = "UMass coherence (top 10 words)", title = "mean $(round(mean(coh); digits = 2))")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "infer-topics"
label = "Infer Topics"
desc = "Topic mixture of a new document, by refitting with the document appended"
code = '''
using TextAnalysis  # corpus, DTM and lda

# lda has no fold-in for unseen documents, so refit with the new document appended (same seed);
# the topics are re-estimated, so they are labelled by their own top words
crps2 = Corpus([StringDocument(d) for d in [{{corpus}}; {{new-doc}}]])
prepare!(crps2, strip_punctuation | strip_case | strip_numbers | strip_stopwords)
update_lexicon!(crps2)
dtm2 = DocumentTermMatrix(crps2)
phi2, theta2 = fit_lda(dtm2, k)
for t in sortperm(theta2[:, end], rev = true)[1:min(3, k)]  # the three heaviest topics of the new document
    println("Topic $t (", round(theta2[t, end]; digits = 2), "): ", join(dtm2.terms[sortperm(Vector(phi2[t, :]), rev = true)[1:8]], ", "))
end
'''

[[actionGroups.actions]]
id = "top-docs"
label = "Top Documents"
desc = "Documents with the largest share of the chosen topic"
code = '''
t = {{topic}}  # topic to inspect
println("Topic $t: ", join(top_words(phi, t), ", "))
for d in sortperm(replace(theta[t, :], NaN => 0.0), rev = true)[1:min(5, N)]  # documents ranked by p(topic | document)
    println(round(theta[t, d]; digits = 2), "  document $d: ", first({{corpus}}[d], 80))
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-k"
label = "Compare k Topics"
desc = "Held-out perplexity and coherence across numbers of topics"
code = '''
using Plots, Statistics  # plotting, mean

ks  = [2, 5, 10, 20]  # numbers of topics to compare
res = [heldout_perplexity(kk) for kk in ks]  # same split and seed for every k
for (kk, r) in zip(ks, res)
    println("k = $kk: held-out perplexity ", round(r.lda; digits = 1), "   mean UMass ", round(mean(umass(top_words(r.phi, t)) for t in 1:kk); digits = 2))
end
plot(ks, [r.lda for r in res], marker = :o, label = "LDA", xlabel = "topics k", ylabel = "held-out perplexity")
hline!([res[1].unigram], ls = :dash, label = "unigram baseline")  # choose k where the curve flattens and coherence holds
'''

[[actionGroups.actions]]
id = "lda-vs-lsa"
label = "LDA vs LSA"
desc = "Coherence of LDA topics against LSA dimensions on the same corpus"
code = '''
using TextAnalysis, Statistics  # lsa, mean

F  = lsa(dtm)  # SVD of the N x V tf-idf matrix, as in the LSA panel
kl = min(k, length(F.S))
lsa_words = map(1:kl) do t
    v = F.Vt[t, :] .* sign(F.Vt[t, argmax(abs.(F.Vt[t, :]))])  # SVD signs are arbitrary: orient each dimension by its largest loading
    terms[sortperm(v, rev = true)[1:10]]
end
c_lda = [umass(top_words(phi, t)) for t in 1:k]
c_lsa = umass.(lsa_words)
println("Mean UMass coherence (top 10 words): LDA ", round(mean(c_lda); digits = 2), "   LSA ", round(mean(c_lsa); digits = 2))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "topic-labels"
label = "Topic Labels"
desc = "Top 5 words as a label for each topic"
code = '''
for t in 1:k
    println("Topic $t: ", join(top_words(phi, t, 5), " / "))  # read these and name the topic yourself
end
'''

[[actionGroups.actions]]
id = "topic-prevalence"
label = "Topic Prevalence"
desc = "Share of corpus tokens assigned to each topic"
code = '''
using Plots  # plotting

nd    = vec(sum(dtm.dtm, dims = 2))  # tokens per document
share = replace(theta, NaN => 0.0) * nd ./ sum(nd)  # token-weighted topic shares, summing to 1
bar(1:k, share, legend = false, xlabel = "topic", ylabel = "share of tokens")
'''
