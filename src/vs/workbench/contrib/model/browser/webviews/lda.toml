[[models]]
id = "lda"
label = "LDA"

[[models]]
id = "flda"
label = "Focused LDA"

[[bullets]]
text = "LDA"
detail = "probabilistic generative model; documents as mixtures of topics, topics as distributions over words (Dirichlet priors)"

[[bullets]]
text = "Focused LDA"
detail = "structured variant; each word token is either topic-specific or drawn from a background distribution"

[[bullets]]
text = "TopicModels.jl"
detail = "Julia implementation of LDA, Focused LDA, CTM and related topic models"

[[inputs]]
id = "corpus"
label = "Corpus"
tooltip = "Array of text documents, e.g. docs = [\"first doc\", \"second doc\"]"
default = "corpus"

[[inputs]]
id = "k"
label = "Topics (k)"
tooltip = "Number of latent topics to discover"
default = "10"

[[inputs]]
id = "iters"
label = "Iterations"
tooltip = "Number of training iterations for the variational EM algorithm"
default = "1000"

[[codeBranches]]
model = "lda"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus from documents
prepare!(crps, strip_punctuation | strip_case)  # clean text
update_lexicon!(crps)  # build vocabulary
dtm   = DocumentTermMatrix(crps)  # document-term matrix

model = LDA(dtm.dtm, {{k}})  # initialise LDA with {{k}} topics
train!(model, iter={{iters}})  # variational EM training

topicdist(model)  # topic-word distributions (k x V)
'''

[[codeBranches]]
model = "flda"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])  # build corpus from documents
prepare!(crps, strip_punctuation | strip_case)  # clean text
update_lexicon!(crps)  # build vocabulary
dtm   = DocumentTermMatrix(crps)  # document-term matrix

model = fLDA(dtm.dtm, {{k}})  # focused LDA with {{k}} topics
train!(model, iter={{iters}})  # variational EM training

topicdist(model)  # topic-word distributions (k x V)
'''

