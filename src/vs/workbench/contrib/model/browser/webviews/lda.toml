[[actionGroups.actions]]
id = "top-docs"
label = "Top Documents"
desc = "Documents most representative of a given topic"
code = '''
using TopicModels, TextAnalysis

crps  = Corpus([StringDocument(d) for d in {{corpus}}])
prepare!(crps, strip_punctuation | strip_case)
update_lexicon!(crps)
dtm   = DocumentTermMatrix(crps)

model = LDA(dtm.dtm, {{k}})  # initialise LDA
train!(model, iter={{iters}})  # train model

