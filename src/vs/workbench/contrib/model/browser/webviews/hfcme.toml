# High-Frequency Covariance Matrix Estimation Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/hfcme.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "High-Frequency Covariance Matrix Estimation"
viewType = "pollis.hfcme"
defaultModel = "rc"

[[packages]]
name = "HighFrequencyCovariance.jl"
github = "https://github.com/s-baumann/HighFrequencyCovariance.jl"

[requires]
packages = ["HighFrequencyCovariance.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Realized Covariance Basics"
file = "hfcme/tutorial-01-rc.ipynb"
bundled = true
description = "Synchronising tick data and computing realized covariance with Simple()"

[[notebookSections.notebooks]]
name = "Pre-averaged Estimation"
file = "hfcme/tutorial-02-pav.ipynb"
bundled = true
description = "Noise-robust covariance via pre-averaging with bandwidth H"

[[notebookSections.notebooks]]
name = "Two-Scales Estimation"
file = "hfcme/tutorial-03-tsrc.ipynb"
bundled = true
description = "Bias-corrected covariance combining slow and fast realized covariance"

[[notebookSections.notebooks]]
name = "PSD Regularization"
file = "hfcme/tutorial-04-psd.ipynb"
bundled = true
description = "Nearest positive semi-definite projection and eigenvalue clipping"

