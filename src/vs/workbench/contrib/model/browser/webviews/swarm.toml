using Plots

shift = min(0, minimum(res.trace)) - 1e-12  # keeps the log scale defined
plot(res.trace .- shift, yscale=:log10, xlabel="evaluation", ylabel="best f - shift", legend=false)
'''

[[actionGroups.actions]]
id = "population"
label = "Population Snapshot"
desc = "Final swarm in the first two variables over the objective's contours"
code = '''
using Plots

xs = range(lb[1], ub[1], length=120); ys = range(lb[2], ub[2], length=120)
contour(xs, ys, (a, b) -> f([a; b; x_best[3:end]]), fill=true, alpha=0.6, xlabel="x1", ylabel="x2")
scatter!(res.pop[:, 1], res.pop[:, 2], markersize=3, color=:white, label="final swarm")
scatter!([x_best[1]], [x_best[2]], marker=:star, markersize=10, color=:red, label="best")
'''

[[actionGroups.actions]]
id = "landscape"
label = "Fitness Landscape"
desc = "Heatmap of f over the first two variables, with the others held at the best point"
