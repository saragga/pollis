[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "diversity"
label = "Swarm Diversity"
desc = "Spread of the final swarm: per-variable standard deviation relative to the box, and distance to the best"
code = '''
P = res.pop
(relative_spread = round.(vec(std(P, dims=1)) ./ (ub .- lb), sigdigits=3),
 mean_distance_to_best = mean(norm(P[i, :] - x_best) for i in axes(P, 1)), collapsed = maximum(std(P, dims=1)) < 1e-6)
'''

[[actionGroups.actions]]
id = "pop-sensitivity"
label = "Population Sensitivity"
desc = "Best value for several swarm sizes at roughly the same number of evaluations, 3 seeds each"
code = '''
map([10, 20, 40, 80, 160]) do N
    it = max(1, div(NP * budget, N))
    v = [search(N=N, iters=it, seed=s).fx for s in 1:3]
    (swarm_size = N, iterations = it, mean_best = mean(v), worst_best = maximum(v))
end
'''

[[actionGroups.actions]]
id = "consistency"
label = "Run Consistency"
desc = "Best values over 10 seeds and how far apart the solutions are"
code = '''
runs = [search(seed=s) for s in 1:10]
v = getfield.(runs, :fx)
(best_values = round.(v, sigdigits=6), mean = mean(v), spread = std(v), share_at_best = mean(v .<= minimum(v) + 1e-6),
 max_distance_between_solutions = maximum(norm(a.x - b.x) for a in runs, b in runs))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "solution"
label = "Best Solution"
desc = "The best point and its objective value, re-evaluated"
code = '''
(best_point = round.(x_best, sigdigits=6), reported_value = f_best, re_evaluated = f(x_best), evaluations = res.evals)
'''

[[actionGroups.actions]]
id = "multistart"
label = "Multi-Start"
desc = "Best of 5 independent runs"
code = '''
runs = [search(seed=s) for s in 1:5]
k = argmin(getfield.(runs, :fx))
(best_value = runs[k].fx, best_point = round.(runs[k].x, sigdigits=6), best_seed = k, single_run_value = f_best)
'''

[[actionGroups.actions]]
id = "local-refine"
label = "Local Refinement"
desc = "Polish the swarm's best point with box-constrained L-BFGS (Optim.jl, ForwardDiff gradients)"
code = '''
using Optim, ADTypes

x_start = clamp.(x_best, lb .+ 1e-9 .* (ub .- lb), ub .- 1e-9 .* (ub .- lb))  # strictly inside the box
r = Optim.optimize(f, lb, ub, x_start, Fminbox(LBFGS()); autodiff=AutoForwardDiff())
(swarm_value = f_best, refined_value = Optim.minimum(r), improvement = f_best - Optim.minimum(r),
 moved = norm(Optim.minimizer(r) - x_best), refined_point = round.(Optim.minimizer(r), sigdigits=6))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-gradient"
label = "vs Gradient-Based"
desc = "The swarm against L-BFGS from the box midpoint and from 10 random starts (Optim.jl)"
code = '''
using Optim, ADTypes

lbfgs(x0) = Optim.minimum(Optim.optimize(f, lb, ub, x0, Fminbox(LBFGS()); autodiff=AutoForwardDiff()))
Random.seed!(1)
starts = [lb .+ (0.05 .+ 0.9 .* rand(length(lb))) .* (ub .- lb) for _ in 1:10]
(swarm = f_best, lbfgs_from_midpoint = lbfgs((lb .+ ub) ./ 2 .+ 1e-3 .* (ub .- lb)), lbfgs_best_of_10 = minimum(lbfgs.(starts)))
'''

[[actionGroups.actions]]
id = "vs-swarm"
label = "Algorithm Shootout"
desc = "PSO, CSO, ABC, WOA and CGSA (Metaheuristics.jl) with the same number of evaluations as this run, 3 seeds each"
code = '''
using Metaheuristics

algs = ["PSO" => PSO, "CSO" => CSO, "ABC" => ABC, "WOA" => WOA, "CGSA" => CGSA]
map(algs) do (name, A)
    v = map(1:3) do s
        minimum(Metaheuristics.optimize(f, [transpose(lb); transpose(ub)], A(N=NP, options=Options(iterations=10^6, f_calls_limit=res.evals, seed=s))))
    end
    (algorithm = name, evaluations = res.evals, mean_best = mean(v), worst_best = maximum(v))
end
'''

[[actionGroups.actions]]
id = "benchmark"
label = "Benchmark Functions"
desc = "The selected algorithm on the sphere, Rosenbrock, Rastrigin and Ackley functions over the same box"
code = '''
bench = ["sphere" => x -> sum(x .^ 2),
         "Rosenbrock" => x -> sum(100 .* (x[2:end] .- x[1:end-1] .^ 2) .^ 2 .+ (1 .- x[1:end-1]) .^ 2),
         "Rastrigin" => x -> 10 * length(x) + sum(x .^ 2 .- 10 .* cos.(2pi .* x)),
         "Ackley" => x -> -20exp(-0.2sqrt(mean(x .^ 2))) - exp(mean(cos.(2pi .* x))) + 20 + exp(1)]
# all four have minimum value 0, at the origin except Rosenbrock (at all ones)
map(bench) do (name, g)
    r = search(f=g)
    x_opt = name == "Rosenbrock" ? ones(length(r.x)) : zeros(length(r.x))
    (function_name = name, best_value = r.fx, distance_to_optimum = norm(r.x - x_opt))
end
'''

