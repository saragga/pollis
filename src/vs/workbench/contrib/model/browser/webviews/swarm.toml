[[codeBranches]]
model = "pso"
code = '''
using Metaheuristics, Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
NP = {{pop}}  # swarm size
budget = {{budget}}  # iterations

# wrap f so every evaluation is recorded
function recorder(f)
    vals = Float64[]
    fr(x) = (v = f(x); push!(vals, v); v)
    fr, vals
end

function search(; iters=budget, N=NP, seed=1, lb=lb, ub=ub, f=f)
    fr, vals = recorder(f)
    alg = PSO(N=N, options=Options(iterations=iters, f_calls_limit=1e12, seed=seed))  # f_calls_limit = 1e12, so that iterations ends the run  # particle swarm optimisation
    r = Metaheuristics.optimize(fr, [transpose(lb); transpose(ub)], alg)
    (x = minimizer(r), fx = minimum(r), trace = accumulate(min, vals), evals = length(vals), pop = positions(r))
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals)
'''

[[codeBranches]]
model = "cso"
code = '''
using Metaheuristics, Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
NP = {{pop}}  # swarm size
budget = {{budget}}  # iterations

# wrap f so every evaluation is recorded
function recorder(f)
    vals = Float64[]
    fr(x) = (v = f(x); push!(vals, v); v)
    fr, vals
end

PHI = {{phi}}  # the phi parameter of CSO

function search(; iters=budget, N=NP, seed=1, lb=lb, ub=ub, f=f, phi=PHI)
    fr, vals = recorder(f)
    alg = CSO(N=N, φ=phi, options=Options(iterations=iters, f_calls_limit=1e12, seed=seed))  # f_calls_limit = 1e12, so that iterations ends the run  # competitive swarm optimiser
    r = Metaheuristics.optimize(fr, [transpose(lb); transpose(ub)], alg)
    (x = minimizer(r), fx = minimum(r), trace = accumulate(min, vals), evals = length(vals), pop = positions(r))
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals)
'''

