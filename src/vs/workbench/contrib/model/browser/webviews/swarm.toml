[[decisionRows]]
task = "PSO"
context = "Continuous box-constrained problems; the standard swarm baseline"
purpose = "Particles move with inertia towards their own best and the swarm's best positions"

[[decisionRows]]
task = "CSO"
context = "Higher-dimensional problems where PSO converges prematurely"
purpose = "Competitive Swarm Optimiser: random pairs compete, and the loser learns from the winner and the swarm mean, with no personal or global bests kept"

[[decisionRows]]
task = "ABC"
context = "Multimodal problems where exploration matters more than speed"
purpose = "Artificial Bee Colony: employed and onlooker bees perturb food sources; sources that stop improving are abandoned to scouts"

[[decisionRows]]
task = "WOA"
context = "Quick exploratory runs with almost no parameters to tune"
purpose = "Whale Optimisation: encircling the best solution and spiral bubble-net moves, with a shrinking exploration coefficient"

[[decisionRows]]
task = "GSA"
context = "Problems where a smooth exploration-to-exploitation schedule helps"
purpose = "Gravitational Search: agents attract each other with forces proportional to their fitness-derived masses; here the chaotic variant CGSA of Metaheuristics.jl"

[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables. The default objective and bounds adapt to it."
default = "10"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, in terms of the vector x. Default: the Rastrigin function in any dimension (global minimum 0 at the origin)."
default = "10 * length(x) + sum(x .^ 2 .- 10 .* cos.(2pi .* x))"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds, one per variable."
default = "fill(-5.12, n)"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds, one per variable."
default = "fill(5.12, n)"

[[inputs]]
id = "pop"
label = "Swarm Size"
tooltip = "Number of particles (bees, whales, agents)."
default = "40"
newRow = true

[[inputs]]
id = "budget"
label = "Iterations"
tooltip = "Number of iterations. Evaluations per iteration differ: about one per particle (PSO, WOA, GSA), one per pair (CSO) or two per bee (ABC); the comparisons therefore use evaluations."
default = "500"

[[inputs]]
id = "phi"
label = "Mean Attraction (phi)"
tooltip = "Weight of the pull of each loser towards the swarm mean; 0 disables it. Around 0.1 in moderate dimensions."
default = "0.1"
models = ["cso"]
newRow = true

