# Swarm Intelligence Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/swarm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Swarm Intelligence"
viewType = "pollis.swarm"
defaultModel = "pso"

[[packages]]
name = "Metaheuristics.jl"
github = "https://github.com/jmejia8/Metaheuristics.jl"

