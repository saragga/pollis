code = '''
{{?model=pso}}[(parameter = "N", value = NP, meaning = "population size"), (parameter = "C1, C2", value = "2.0, 2.0 (defaults)", meaning = "learning rates"), (parameter = "inertia", value = "0.8 (default)", meaning = "controls the inertia weight")]
{{?model=cso}}[(parameter = "N", value = NP, meaning = "population size, 400 by default in Metaheuristics.jl"), (parameter = "phi", value = PHI, meaning = "the phi parameter of CSO, 0.1 by default")]
