[[decisionRows]]
task = "PSO"
context = "Nonlinear functions over a box, with the particle swarm concept of Kennedy and Eberhart (1995)"
purpose = "Particles move with inertia towards their own best and the swarm's best positions"

[[decisionRows]]
task = "CSO"
context = "Large scale optimisation, tested on problems of dimensionality up to 5000 (Cheng and Jin, 2015); the Metaheuristics.jl documentation recommends CSO for large-scale problems"
purpose = "Competitive Swarm Optimiser of Metaheuristics.jl: random pairs compete, and the loser learns from the winner, with no personal or global bests kept"

[[decisionRows]]
task = "ABC"
context = "Multivariable, multimodal functions, where Karaboga and Basturk (2007) found that it can get out of a local minimum"
purpose = "Artificial Bee Colony: employed and onlooker bees perturb food sources; sources that stop improving are abandoned to scouts"

[[decisionRows]]
task = "WOA"
context = "Few parameters to adjust: two main internal parameters, A and C (Mirjalili and Lewis, 2016), and only N in the WOA type of Metaheuristics.jl"
purpose = "Whale Optimisation: encircling the best solution and spiral bubble-net moves, with a shrinking exploration coefficient"

[[decisionRows]]
task = "GSA"
context = "Gravitational search with chaotic gravitational constants (Mirjalili and Gandomi, 2017)"
purpose = "CGSA of Metaheuristics.jl, an extension of the gravitational search algorithm with chaotic gravitational constants"

[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables. The default objective and bounds adapt to it."
default = "10"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, in terms of the vector x. Default: the Rastrigin function in any dimension (global minimum 0 at the origin)."
default = "10 * length(x) + sum(x .^ 2 .- 10 .* cos.(2pi .* x))"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds, one per variable."
default = "fill(-5.12, n)"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds, one per variable."
default = "fill(5.12, n)"

[[inputs]]
id = "pop"
label = "Swarm Size"
tooltip = "Number of particles (bees, whales, agents)."
default = "40"
newRow = true

[[inputs]]
id = "budget"
label = "Iterations"
tooltip = "Number of iterations. The number of evaluations per iteration differs between the algorithms, so the comparisons use evaluations."
default = "500"

[[inputs]]
id = "phi"
label = "Phi"
tooltip = "The phi parameter of the CSO type of Metaheuristics.jl, 0.1 by default."
default = "0.1"
models = ["cso"]
newRow = true

