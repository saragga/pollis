code = '''
using Plots

xs = range(lb[1], ub[1], length=120); ys = range(lb[2], ub[2], length=120)
contour(xs, ys, (a, b) -> f([a; b; x_best[3:end]]), fill=true, alpha=0.6, xlabel="x1", ylabel="x2")
