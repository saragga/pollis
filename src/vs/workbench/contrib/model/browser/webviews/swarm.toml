k = argmin(getfield.(runs, :fx))
(best_value = runs[k].fx, best_point = round.(runs[k].x, sigdigits=6), best_seed = k, single_run_value = f_best)
'''

[[actionGroups.actions]]
id = "local-refine"
label = "Local Refinement"
desc = "Polish the swarm's best point with box-constrained L-BFGS (Optim.jl, ForwardDiff gradients)"
code = '''
using Optim

x_start = clamp.(x_best, lb .+ 1e-9 .* (ub .- lb), ub .- 1e-9 .* (ub .- lb))  # strictly inside the box
r = Optim.optimize(f, lb, ub, x_start, Fminbox(LBFGS()); autodiff=:forward)
(swarm_value = f_best, refined_value = Optim.minimum(r), improvement = f_best - Optim.minimum(r),
 moved = norm(Optim.minimizer(r) - x_best), refined_point = round.(Optim.minimizer(r), sigdigits=6))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-gradient"
label = "vs Gradient-Based"
desc = "The swarm against L-BFGS from the box midpoint and from 10 random starts (Optim.jl)"
code = '''
using Optim

lbfgs(x0) = Optim.minimum(Optim.optimize(f, lb, ub, x0, Fminbox(LBFGS()); autodiff=:forward))
Random.seed!(1)
starts = [lb .+ (0.05 .+ 0.9 .* rand(length(lb))) .* (ub .- lb) for _ in 1:10]
(swarm = f_best, lbfgs_from_midpoint = lbfgs((lb .+ ub) ./ 2 .+ 1e-3 .* (ub .- lb)), lbfgs_best_of_10 = minimum(lbfgs.(starts)))
'''

[[actionGroups.actions]]
id = "vs-swarm"
label = "Algorithm Shootout"
desc = "PSO, ABC, WOA and CGSA (Metaheuristics.jl) with the same number of evaluations as this run, 3 seeds each"
code = '''
using Metaheuristics

algs = ["PSO" => PSO, "ABC" => ABC, "WOA" => WOA, "CGSA" => CGSA]
map(algs) do (name, A)
    v = map(1:3) do s
        minimum(Metaheuristics.optimize(f, [transpose(lb); transpose(ub)], A(N=NP, options=Options(iterations=10^6, f_calls_limit=res.evals, seed=s))))
    end
    (algorithm = name, evaluations = res.evals, mean_best = mean(v), worst_best = maximum(v))
end
'''

[[actionGroups.actions]]
id = "benchmark"
label = "Benchmark Functions"
desc = "The selected algorithm on the sphere, Rosenbrock, Rastrigin and Ackley functions over the same box"
code = '''
bench = ["sphere" => x -> sum(x .^ 2),
         "Rosenbrock" => x -> sum(100 .* (x[2:end] .- x[1:end-1] .^ 2) .^ 2 .+ (1 .- x[1:end-1]) .^ 2),
         "Rastrigin" => x -> 10 * length(x) + sum(x .^ 2 .- 10 .* cos.(2pi .* x)),
         "Ackley" => x -> -20exp(-0.2sqrt(mean(x .^ 2))) - exp(mean(cos.(2pi .* x))) + 20 + exp(1)]
# all four have minimum value 0, at the origin except Rosenbrock (at all ones)
map(bench) do (name, g)
    r = search(f=g)
    x_opt = name == "Rosenbrock" ? ones(length(r.x)) : zeros(length(r.x))
    (function_name = name, best_value = r.fx, distance_to_optimum = norm(r.x - x_opt))
end
'''

