[[codeBranches]]
model = "pso"
code = '''
using Metaheuristics, Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
NP = {{pop}}  # swarm size
budget = {{budget}}  # iterations

# wrap f so every evaluation is recorded
function recorder(f)
    vals = Float64[]
    fr(x) = (v = f(x); push!(vals, v); v)
    fr, vals
end

function search(; iters=budget, N=NP, seed=1, lb=lb, ub=ub, f=f)
    fr, vals = recorder(f)
    alg = PSO(N=N, options=Options(iterations=iters, seed=seed))  # particle swarm optimisation
    r = Metaheuristics.optimize(fr, [transpose(lb); transpose(ub)], alg)
    (x = minimizer(r), fx = minimum(r), trace = accumulate(min, vals), evals = length(vals), pop = positions(r))
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals)
'''

[[codeBranches]]
model = "cso"
code = '''
using Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
NP = {{pop}}  # swarm size
budget = {{budget}}  # iterations

# wrap f so every evaluation is recorded
function recorder(f)
    vals = Float64[]
    fr(x) = (v = f(x); push!(vals, v); v)
    fr, vals
end

PHI = {{phi}}  # pull towards the swarm mean

# Competitive Swarm Optimiser (Cheng and Jin, 2015)
function search(; iters=budget, N=NP, seed=1, lb=lb, ub=ub, f=f, phi=PHI)
    Random.seed!(seed)
    fr, vals = recorder(f); d = length(lb)
    X = [lb .+ rand(d) .* (ub .- lb) for _ in 1:N]; V = [zeros(d) for _ in 1:N]; fX = fr.(X)
    for t in 1:iters
        xbar = mean(X)
        p = randperm(N)
        for k in 1:2:N-1
            i, j = p[k], p[k+1]
            w, l = fX[i] <= fX[j] ? (i, j) : (j, i)  # winner, loser
            V[l] = rand(d) .* V[l] .+ rand(d) .* (X[w] .- X[l]) .+ phi .* rand(d) .* (xbar .- X[l])  # the loser learns
            X[l] = clamp.(X[l] .+ V[l], lb, ub); fX[l] = fr(X[l])
        end
    end
    k = argmin(fX)
    (x = X[k], fx = fX[k], trace = accumulate(min, vals), evals = length(vals), pop = permutedims(reduce(hcat, X)))
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals)
'''

