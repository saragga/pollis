[[actionGroups.actions]]
id = "scaling"
label = "Dimension Scaling"
desc = "Best value and run time as the dimension grows (the objective must accept any length of x, like the default)"
code = '''
map([2, 5, 10, 20, 40]) do d
    sec = @elapsed r = search(lb=fill(lb[1], d), ub=fill(ub[1], d))
    (dimension = d, best_value = r.fx, evaluations = r.evals, seconds = sec)
end
'''
