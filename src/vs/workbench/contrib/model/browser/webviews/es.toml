[[codeBranches]]
model = "gcmaes"
code = '''
using Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
budget = {{budget}}  # objective evaluations

# wraps f so that every evaluation is recorded
function recorder()
    pts, vals = Vector{Float64}[], Float64[]
    fc(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fc, pts, vals
end
result(x, fx, pts, vals; extra...) = (x = x, fx = fx, points = pts, values = vals, trace = accumulate(min, vals), evals = length(vals), extra...)
popsize(d) = 4 + floor(Int, 3log(d))  # the standard CMA-ES population size
using GCMAES, ForwardDiff

SIGMA = {{sigma}}  # initial step size as a fraction of the widest box side

function search(; budget=budget, seed=1, lb=lb, ub=ub)
    Random.seed!(seed)
    fc, pts, vals = recorder()
    d = length(lb)
    x0 = lb .+ rand(d) .* (ub .- lb)  # random start
    grad(x) = ForwardDiff.gradient(f, x)  # the gradient step complements the sampled population
    x, fx, status = GCMAES.minimize((fc, grad), x0, SIGMA * maximum(ub .- lb), lb, ub; maxiter=div(budget, popsize(d)))
    result(x, fx, pts, vals; status = status)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals, status = res.status)
'''

[[codeBranches]]
model = "isres"
code = '''
using Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
budget = {{budget}}  # objective evaluations

# wraps f so that every evaluation is recorded
function recorder()
    pts, vals = Vector{Float64}[], Float64[]
    fc(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fc, pts, vals
end
result(x, fx, pts, vals; extra...) = (x = x, fx = fx, points = pts, values = vals, trace = accumulate(min, vals), evals = length(vals), extra...)
popsize(d) = 4 + floor(Int, 3log(d))  # the standard CMA-ES population size
using NLopt

function search(; budget=budget, seed=1, lb=lb, ub=ub)
    NLopt.srand(seed)
    fc, pts, vals = recorder()
    opt = Opt(:GN_ISRES, length(lb))
    opt.lower_bounds, opt.upper_bounds, opt.maxeval = lb, ub, budget
    opt.min_objective = (x, g) -> fc(x)  # derivative-free: g is never requested
    fx, x, ret = NLopt.optimize(opt, (lb .+ ub) ./ 2)
    result(x, fx, pts, vals; status = ret)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals, status = res.status)
'''

