[[decisionRows]]
task = "CMA-ES"
context = "Continuous black-box problems up to a few hundred variables, ill-conditioned or non-separable"
purpose = "Samples a Gaussian population and adapts its full covariance matrix and step size from successful steps; the default choice"

[[decisionRows]]
task = "xNES"
context = "Same setting as CMA-ES; smooth landscapes"
purpose = "Exponential natural evolution strategy: follows the natural gradient of expected fitness with respect to the search distribution"

[[decisionRows]]
task = "dxNES"
context = "Multimodal or plateau-rich landscapes where xNES shrinks too early"
purpose = "Distance-weighted xNES: adapts the learning rates to how far the distribution moves, keeping the search wide while it is still travelling"

[[decisionRows]]
task = "GCMAES"
context = "High-dimensional problems with a cheap gradient"
purpose = "Gradient-assisted CMA-ES: the population is complemented by a gradient step, which greatly speeds up progress on smooth parts"

[[decisionRows]]
task = "ISRES"
context = "Problems that also have nonlinear constraints (supported by NLopt)"
purpose = "Improved stochastic ranking ES: mutation plus a differential-variation step, with a stochastic ranking of feasibility and fitness"

[[decisionRows]]
task = "ESCH"
context = "Box-constrained problems, quick first attempt"
purpose = "A plain evolutionary algorithm with Cauchy mutations (heavy tails give occasional long jumps)"

[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables. The default objective and bounds adapt to it."
default = "5"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, in terms of the vector x. Default: the Rastrigin function in any dimension (global minimum 0 at the origin)."
default = "10 * length(x) + sum(x .^ 2 .- 10 .* cos.(2pi .* x))"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds, one per variable."
default = "fill(-5.12, n)"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds, one per variable."
default = "fill(5.12, n)"

[[inputs]]
id = "budget"
label = "Budget"
tooltip = "Number of objective evaluations. Generation-based methods run budget / population-size generations."
default = "20000"

[[inputs]]
id = "sigma"
label = "Initial Step Size"
tooltip = "Initial standard deviation of the search distribution, as a fraction of the widest box side. About 0.3 covers the box; small values search locally around the random start."
default = "0.3"
models = ["cmaes", "gcmaes"]
newRow = true

