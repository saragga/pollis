[[codeBranches]]
model = "cmaes"
code = '''
using Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
budget = {{budget}}  # objective evaluations

# wraps f so that every evaluation is recorded
function recorder()
    pts, vals = Vector{Float64}[], Float64[]
    fc(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fc, pts, vals
end
result(x, fx, pts, vals; extra...) = (x = x, fx = fx, points = pts, values = vals, trace = accumulate(min, vals), evals = length(vals), extra...)
popsize(d) = 4 + floor(Int, 3log(d))  # the standard CMA-ES population size
using Evolutionary

SIGMA = {{sigma}}  # initial step size as a fraction of the widest box side

function search(; budget=budget, seed=1, lb=lb, ub=ub)
    Random.seed!(seed)
    fc, pts, vals = recorder()
    d, lam = length(lb), popsize(length(lb))
    x0 = lb .+ rand(d) .* (ub .- lb)  # random start
    method = CMAES(mu=div(lam, 2), lambda=lam, sigma0=SIGMA * maximum(ub .- lb))
    r = Evolutionary.optimize(fc, Evolutionary.BoxConstraints(lb, ub), x0, method, Evolutionary.Options(iterations=div(budget, lam)))
    result(Evolutionary.minimizer(r), Evolutionary.minimum(r), pts, vals; status = Evolutionary.converged(r) ? "converged" : "iteration limit")
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals, status = res.status)
'''

[[codeBranches]]
model = "xnes"
code = '''
using Random, LinearAlgebra, Statistics

n = {{n}}  # dimension
f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
budget = {{budget}}  # objective evaluations

# wraps f so that every evaluation is recorded
function recorder()
    pts, vals = Vector{Float64}[], Float64[]
    fc(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fc, pts, vals
end
result(x, fx, pts, vals; extra...) = (x = x, fx = fx, points = pts, values = vals, trace = accumulate(min, vals), evals = length(vals), extra...)
popsize(d) = 4 + floor(Int, 3log(d))  # the standard CMA-ES population size
using BlackBoxOptim

function search(; budget=budget, seed=1, lb=lb, ub=ub)
    fc, pts, vals = recorder()
    r = bboptimize(fc; SearchRange=collect(zip(lb, ub)), NumDimensions=length(lb), Method=:xnes,
                   MaxFuncEvals=budget, TraceMode=:silent, RandomizeRngSeed=false, RngSeed=seed)
    result(best_candidate(r), best_fitness(r), pts, vals; status = BlackBoxOptim.stop_reason(r))
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals, status = res.status)
'''

