[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "convergence-curve"
label = "Convergence Curve"
desc = "Best value found against evaluations (log scale), with every evaluation behind it"
code = '''
using Plots

shift = min(0, minimum(res.values)) - 1e-12  # keeps the log scale defined
scatter(res.values .- shift, markersize=1, alpha=0.2, label="evaluation", yscale=:log10, xlabel="evaluations", ylabel="f - shift")
plot!(res.trace .- shift, linewidth=2, label="best so far")
'''

[[actionGroups.actions]]
id = "population-spread"
label = "Population Spread"
desc = "Every evaluated point in the (x1, x2) plane, coloured by when it was sampled, over the objective contours"
code = '''
using Plots

xs = range(lb[1], ub[1], length=120); ys = range(lb[2], ub[2], length=120)
contour(xs, ys, (a, b) -> f([a; b; x_best[3:end]]), levels=20, xlabel="x1", ylabel="x2", colorbar=false)
scatter!(getindex.(res.points, 1), getindex.(res.points, 2), zcolor=1:res.evals, markersize=1.5, markerstrokewidth=0, label="evaluations")
scatter!([x_best[1]], [x_best[2]], marker=:star, markersize=10, color=:red, label="best")
'''

[[actionGroups.actions]]
id = "step-size-history"
label = "Search Radius History"
desc = "Spread of the sampled points in consecutive windows of evaluations: the effective step size, which step-size adaptation should shrink steadily"
code = '''
using Plots

w = max(20, div(res.evals, 100))  # window of evaluations
starts = 1:w:(res.evals - w + 1)
radius = [mean(std(reduce(hcat, res.points[s:s+w-1]), dims=2)) for s in starts]
plot(starts, radius, yscale=:log10, xlabel="evaluations", ylabel="mean std of samples", legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Stopping reason, evaluations used, when the final best was first reached and whether it sits on a bound"
code = '''
first_hit = findfirst(<=(f_best + 1e-9 * max(1, abs(f_best))), res.trace)
(status = res.status, budget = budget, used = res.evals, best_first_reached_at = first_hit,
 last_improvement_share = round(first_hit / res.evals, digits=3), on_a_bound = any(isapprox.(x_best, lb; atol=1e-8) .| isapprox.(x_best, ub; atol=1e-8)))
'''

[[actionGroups.actions]]
id = "multi-start"
label = "Multi-Start Analysis"
desc = "Repeat the search with 10 seeds: the spread of best values and how far apart the solutions are"
code = '''
runs = [search(seed=s) for s in 1:10]
v = getfield.(runs, :fx)
(best_values = round.(v, sigdigits=6), mean = mean(v), spread = std(v), share_at_best = mean(v .<= minimum(v) + 1e-6),
 max_distance_between_solutions = maximum(norm(a.x - b.x) for a in runs, b in runs))
'''

[[actionGroups.actions]]
id = "budget-sensitivity"
label = "Budget Sensitivity"
desc = "Best value against budget, 3 seeds each"
code = '''
using Plots

budgets = round.(Int, budget .* [0.05, 0.1, 0.25, 0.5, 1, 2])
best = [mean(search(budget=b, seed=s).fx for s in 1:3) for b in budgets]
display(plot(budgets, best, xscale=:log10, marker=:circle, xlabel="budget", ylabel="mean best f", legend=false))
[(budget = b, mean_best = v) for (b, v) in zip(budgets, best)]
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "eval-at-minimum"
label = "Evaluate at Minimum"
desc = "Re-evaluate f at the solution and estimate its gradient by central differences (near 0 at an interior minimum)"
code = '''
h = 1e-6
grad = [(f(x_best + h * e) - f(x_best - h * e)) / 2h for e in eachcol(Matrix(1.0I, length(x_best), length(x_best)))]
(best_point = x_best, reported_value = f_best, re_evaluated = f(x_best), gradient_norm = norm(grad))
'''

[[actionGroups.actions]]
id = "neighbourhood-check"
label = "Neighbourhood Check"
desc = "Sample 2000 points around the solution at several radii and count how many are better: none means a local minimum at that scale"
code = '''
map([1e-4, 1e-3, 1e-2, 1e-1]) do r
    samples = [clamp.(x_best .+ r .* (ub .- lb) .* randn(length(x_best)), lb, ub) for _ in 1:2000]
    fv = f.(samples)
    (radius = r, share_better = mean(fv .< f_best), best_nearby = minimum(fv))
end
'''

[[actionGroups.actions]]
id = "sensitivity"
label = "Bounds Sensitivity"
desc = "Re-run with the box shrunk, enlarged and shifted by 10 percent and see how the optimum moves"
code = '''
w = ub .- lb
boxes = ["as given" => (lb, ub), "shrunk 10%" => (lb .+ 0.05w, ub .- 0.05w), "enlarged 10%" => (lb .- 0.05w, ub .+ 0.05w), "shifted +10%" => (lb .+ 0.1w, ub .+ 0.1w)]
map(boxes) do (name, (l, u))
    r = search(lb=l, ub=u)
    (box = name, best_value = r.fx, change = r.fx - f_best, moved = norm(r.x - x_best))
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "es-vs-de"
label = "ES vs DE"
desc = "The selected strategy against adaptive differential evolution (BlackBoxOptim) at the same budget, over 5 seeds"
code = '''
using BlackBoxOptim

de(seed) = best_fitness(bboptimize(f; SearchRange=collect(zip(lb, ub)), NumDimensions=length(lb), Method=:adaptive_de_rand_1_bin_radiuslimited,
                                   MaxFuncEvals=budget, TraceMode=:silent, RandomizeRngSeed=false, RngSeed=seed))
map(["selected strategy" => s -> search(seed=s).fx, "adaptive DE" => de]) do (name, run)
    sec = @elapsed v = [run(s) for s in 1:5]
    (method = name, mean_best = mean(v), worst_best = maximum(v), seconds_per_run = sec / 5)
end
'''

[[actionGroups.actions]]
id = "compare-strategies"
label = "Compare Strategies"
desc = "CMA-ES (Evolutionary), xNES and dxNES (BlackBoxOptim), ISRES and ESCH (NLopt) at the same budget, over 3 seeds"
code = '''
using Evolutionary, BlackBoxOptim, NLopt

d = length(lb)
function cma(seed)
    Random.seed!(seed)
    lam = popsize(d)
    r = Evolutionary.optimize(f, Evolutionary.BoxConstraints(lb, ub), lb .+ rand(d) .* (ub .- lb),
                              CMAES(mu=div(lam, 2), lambda=lam, sigma0=0.3 * maximum(ub .- lb)), Evolutionary.Options(iterations=div(budget, lam)))
    Evolutionary.minimum(r)
end
nes(m) = seed -> best_fitness(bboptimize(f; SearchRange=collect(zip(lb, ub)), NumDimensions=d, Method=m, MaxFuncEvals=budget, TraceMode=:silent, RandomizeRngSeed=false, RngSeed=seed))
function nlo(alg)
    seed -> begin
        NLopt.srand(seed)
        opt = Opt(alg, d)
        opt.lower_bounds, opt.upper_bounds, opt.maxeval = lb, ub, budget
        opt.min_objective = (x, g) -> f(x)
        NLopt.optimize(opt, (lb .+ ub) ./ 2)[1]
    end
end
runs = ["CMA-ES" => cma, "xNES" => nes(:xnes), "dxNES" => nes(:dxnes), "ISRES" => nlo(:GN_ISRES), "ESCH" => nlo(:GN_ESCH)]
map(runs) do (name, run)
    sec = @elapsed v = [run(s) for s in 1:3]
    (method = name, mean_best = mean(v), worst_best = maximum(v), seconds_per_run = sec / 3)
end
'''

[[actionGroups.actions]]
id = "dimension-scaling"
label = "Dimension Scaling"
desc = "Runtime and best value as the dimension grows (the objective must accept any length of x), with the budget scaled by the dimension"
code = '''
using Plots

dims = [2, 5, 10, 20, 40]
rows = map(dims) do d
    l, u = fill(lb[1], d), fill(ub[1], d)
    sec = @elapsed r = search(lb=l, ub=u, budget=div(budget * d, length(lb)))
    (dimension = d, best_value = r.fx, evaluations = r.evals, seconds = sec)
end
display(plot(dims, getfield.(rows, :seconds), marker=:circle, xlabel="dimension", ylabel="seconds", legend=false))
rows
'''

