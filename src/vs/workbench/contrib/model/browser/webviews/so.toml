[[decisionRows]]
task = "Newton"
context = "Smooth, moderately sized problems started near a minimum with a positive definite Hessian"
purpose = "Step to the minimum of the local quadratic model (with a line search); quadratic convergence"

[[decisionRows]]
task = "Newton Trust Region"
context = "Starts far from the optimum, or a Hessian that is indefinite along the way"
purpose = "Minimise the quadratic model inside a trust region that grows or shrinks with its accuracy; robust"

[[decisionRows]]
task = "IPNewton"
context = "Box-constrained smooth problems"
purpose = "Interior-point Newton on a barrier problem that keeps the iterates inside the bounds"

[[decisionRows]]
task = "Truncated Newton"
context = "Large problems where forming or factorising the Hessian is too expensive"
purpose = "Solve the Newton system approximately by conjugate gradients with Hessian-vector products (NLopt)"

[[inputs]]
id = "f"
label = "Objective f(x)"
tooltip = "Julia expression for the scalar objective to minimise; it must be twice differentiable. Use x[1], x[2], ... for the components."
default = "(1 - x[1])^2 + 100 * (x[2] - x[1]^2)^2"

[[inputs]]
id = "x0"
label = "Initial Guess x0"
tooltip = "Starting point as a Julia vector. Plain Newton can diverge from a poor start; the trust region is more robust. For IPNewton it must lie inside the bounds."
default = "[-1.2, 1.0]"

[[inputs]]
id = "autodiff"
label = "Derivatives"
tooltip = ":forward: exact gradients and Hessians by forward-mode automatic differentiation (ForwardDiff.jl), recommended. :finite: finite-difference approximations (FiniteDiff.jl), slower and less accurate."
kind = "select"
default = ":forward"
models = ["newton", "ntr", "ipnewton"]
newRow = true

[[inputs.options]]
value = ":forward"
label = ":forward (ForwardDiff)"

[[inputs.options]]
value = ":finite"
label = ":finite (FiniteDiff)"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Lower bound for each variable; -Inf for none."
default = "[-Inf, -Inf]"
models = ["ipnewton"]

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Upper bound for each variable; Inf for none."
default = "[Inf, Inf]"
models = ["ipnewton"]

