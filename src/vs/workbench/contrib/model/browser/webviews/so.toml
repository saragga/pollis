[[codeBranches]]
model = "tn"
code = '''
using Optim, ForwardDiff, LinearAlgebra

f(x) = {{f}}
x0 = {{x0}}  # initial guess
n  = length(x0)
opts = Optim.Options(store_trace=true, extended_trace=true)  # keep the iterates for the plots

pack(r) = (x = Optim.minimizer(r), f = Optim.minimum(r), path = Optim.x_trace(r), iterations = Optim.iterations(r), converged = Optim.converged(r))
using NLopt

function solve(x0)
    path, best, calls = [copy(x0)], Ref(f(x0)), Ref(0)
    function obj(x, g)
        length(g) > 0 && (g .= ForwardDiff.gradient(f, x))
        v = f(x); calls[] += 1
        v < best[] && (best[] = v; push!(path, copy(x)))  # record improving points
        v
    end
    opt = Opt(:LD_TNEWTON_PRECOND_RESTART, n)  # preconditioned truncated Newton with restarts
    opt.min_objective = obj
    opt.maxeval = 2000
    opt.ftol_rel = 1e-12
    minf, minx, ret = NLopt.optimize(opt, copy(x0))
    (x = minx, f = minf, path = path, iterations = calls[], converged = ret in (:SUCCESS, :FTOL_REACHED, :XTOL_REACHED))
end

sol = solve(x0)
x_opt = sol.x
(minimizer = x_opt, minimum = sol.f, iterations = sol.iterations, converged = sol.converged)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "convergence-trace"
label = "Convergence Trace"
desc = "f(x_k) - f* along the iterates (log scale): Newton-type methods show the characteristic quadratic plunge near the end"
code = '''
using Plots

fs = f.(sol.path)
plot(0:length(fs)-1, fs .- sol.f .+ eps(), yscale=:log10, marker=:circle, markersize=2, xlabel="iterate", ylabel="f(x) - f*", legend=false)
'''

[[actionGroups.actions]]
id = "contour-path"
label = "Contour + Path"
desc = "The iterates on the contours of f (2D problems; other variables held at the optimum)"
code = '''
using Plots

P = reduce(hcat, sol.path)
pad = max(0.5, 0.25 * maximum(abs, P[1:2, :]))
xs = range(minimum(P[1, :]) - pad, maximum(P[1, :]) + pad, length=120)
ys = range(minimum(P[2, :]) - pad, maximum(P[2, :]) + pad, length=120)
contour(xs, ys, (a, b) -> log1p(f([a; b; x_opt[3:end]]) - sol.f + 1e-12), fill=true, colorbar=false, xlabel="x1", ylabel="x2")
plot!(P[1, :], P[2, :], marker=:circle, markersize=3, color=:white, label="iterates")
scatter!([x_opt[1]], [x_opt[2]], marker=:star, markersize=10, color=:red, label="minimiser")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Convergence flag, iterations, gradient norm at the solution, and the observed convergence order from the last iterates (about 2 = quadratic)"
code = '''
e = [norm(p - x_opt) for p in sol.path]
e = e[e .> 1e-12]
order = length(e) >= 3 ? log(e[end] / e[end-1]) / log(e[end-1] / e[end-2]) : missing
(converged = sol.converged, iterations = sol.iterations, gradient_norm = norm(ForwardDiff.gradient(f, x_opt)), observed_order = order)
'''

[[actionGroups.actions]]
id = "gradient-check"
label = "Gradient Check"
desc = "Finite-difference against automatic-differentiation gradients at x0 and at the solution"
code = '''
using FiniteDiff

map(["x0" => x0, "x_opt" => x_opt]) do (name, p)
    g_ad = ForwardDiff.gradient(f, p)
    g_fd = FiniteDiff.finite_difference_gradient(f, p)
    (point = name, autodiff = g_ad, finite_diff = g_fd, max_difference = maximum(abs, g_ad - g_fd))
end
'''

[[actionGroups.actions]]
id = "hessian-check"
label = "Hessian Conditioning"
desc = "Hessian eigenvalues at x0 and at the solution: an indefinite Hessian at the start is where plain Newton struggles and the trust region helps"
code = '''
map(["x0" => x0, "x_opt" => x_opt]) do (name, p)
    ev = eigvals(Symmetric(ForwardDiff.hessian(f, p)))
    (point = name, eigenvalues = ev, positive_definite = all(>(0), ev), condition_number = maximum(abs, ev) / minimum(abs, ev))
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "evaluate-new"
label = "Evaluate at New Point"
desc = "f at a new point, compared with the minimum"
code = '''
x_new = x_opt .+ 0.1  # replace with the point to evaluate
(f_new = f(x_new), f_min = sol.f, increase = f(x_new) - sol.f, distance = norm(x_new - x_opt))
'''

[[actionGroups.actions]]
id = "quadratic-model"
label = "Quadratic Model"
desc = "The second-order Taylor prediction f* + d' H d / 2 against the true f along the flattest Hessian direction: where the model Newton relies on stays accurate"
code = '''
using Plots

H = Symmetric(ForwardDiff.hessian(f, x_opt))
F = eigen(H)
v = F.vectors[:, 1]  # flattest direction
ts = range(-1, 1, length=81)
plot(ts, [f(x_opt + t * v) for t in ts], label="f", xlabel="step along the flattest direction", ylabel="value")
plot!(ts, [sol.f + t^2 * F.values[1] / 2 for t in ts], linestyle=:dash, label="quadratic model")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-so-methods"
label = "Compare Methods"
desc = "Newton, Newton trust region, IPNewton (unbounded), truncated Newton and BFGS (first-order reference) from the same start"
code = '''
using NLopt

function tn_run(x0)
    k = Ref(0)
    opt = Opt(:LD_TNEWTON_PRECOND_RESTART, n)
    opt.min_objective = (x, g) -> (length(g) > 0 && (g .= ForwardDiff.gradient(f, x)); k[] += 1; f(x))
    opt.maxeval = 2000
    minf, _, ret = NLopt.optimize(opt, copy(x0))
    (minimum = minf, iterations = missing, f_calls = k[], converged = ret in (:SUCCESS, :FTOL_REACHED, :XTOL_REACHED))
end
optim_row(r) = (minimum = Optim.minimum(r), iterations = Optim.iterations(r), f_calls = Optim.f_calls(r), converged = Optim.converged(r))
runs = ["Newton" => () -> optim_row(optimize(f, x0, Newton(); autodiff=:forward)),
        "NewtonTrustRegion" => () -> optim_row(optimize(f, x0, NewtonTrustRegion(); autodiff=:forward)),
        "IPNewton" => () -> optim_row(optimize(TwiceDifferentiable(f, x0; autodiff=:forward), TwiceDifferentiableConstraints(fill(-Inf, n), fill(Inf, n)), x0, IPNewton())),
        "TruncatedNewton" => () -> tn_run(x0),
        "BFGS" => () -> optim_row(optimize(f, x0, BFGS(); autodiff=:forward))]
map(runs) do (name, run)
    t = @elapsed r = run()
    (method = name, r..., seconds = t)
end
'''

[[actionGroups.actions]]
id = "start-robustness"
label = "Start Robustness"
desc = "Success rate of Newton against Newton trust region from 20 random starts around x0"
code = '''
using Random

Random.seed!(1)
starts = [x0 .+ 2 .* randn(n) for _ in 1:20]
ok(r) = Optim.converged(r) && norm(ForwardDiff.gradient(f, Optim.minimizer(r))) < 1e-6
map(["Newton" => Newton(), "NewtonTrustRegion" => NewtonTrustRegion()]) do (name, a)
    rs = [optimize(f, s, a; autodiff=:forward) for s in starts]
    (method = name, success_rate = count(ok, rs) / length(rs), median_iterations = sort(Optim.iterations.(rs))[div(end, 2) + 1])
end
'''

