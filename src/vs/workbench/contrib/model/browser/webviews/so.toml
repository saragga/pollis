# Second Order Methods Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/so.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Second Order Methods"
viewType = "pollis.so"
defaultModel = "newton"

[[packages]]
name = "Optim.jl"
github = "https://github.com/JuliaNLSolvers/Optim.jl"

[[packages]]
name = "NLopt.jl"
github = "https://github.com/JuliaOpt/NLopt.jl"

