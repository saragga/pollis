[[actionGroups.actions]]
id = "curvature"
label = "Local Curvature"
desc = "Principal axes of the minimum: Hessian eigenvectors with their curvatures; flat directions (small eigenvalues) are poorly determined"
code = '''
F = eigen(Symmetric(ForwardDiff.hessian(f, x_opt)))
[(curvature = F.values[i], direction = F.vectors[:, i], relative_width = sqrt(F.values[end] / max(F.values[i], eps()))) for i in eachindex(F.values)]
'''
