# Alpha Vantage (AlphaVantage.jl) Webview Configuration
# Declarative source. The build script generates alpv.data.ts.
# Run: npm run gulp compile-toml

[meta]
title = "Alpha Vantage"
viewType = "pollis.alpv"
defaultModel = "equity"
models = ["equity", "forex", "crypto", "indicators", "economic"]

[[packages]]
name = "AlphaVantage.jl"
github = "https://github.com/ellisvalentiner/AlphaVantage.jl"

[[notebookSections]]
label = "Alpha Vantage"

[[notebookSections.notebooks]]
name = "Equity Time Series"
file = "alpv/tutorial-01-equities.ipynb"
bundled = true
description = "Download intraday and daily OHLC bars and a latest global quote"

[[notebookSections.notebooks]]
name = "Forex and Crypto"
file = "alpv/tutorial-02-forex-crypto.ipynb"
bundled = true
description = "Fetch exchange rates, FX series, and digital-currency prices"

[[notebookSections.notebooks]]
name = "Technical Indicators"
file = "alpv/tutorial-03-indicators.ipynb"
bundled = true
description = "Compute SMA, EMA, RSI, and other indicators server-side"

[[notebookSections.notebooks]]
name = "Economic Indicators"
file = "alpv/tutorial-04-economic.ipynb"
bundled = true
description = "Pull macro series: real GDP, CPI, treasury yields, and the federal funds rate"

[[wikis]]
name = "Factsheet"
file = "alpv/factsheet.md"
bundled = true
description = "Quick-reference: AlphaVantage.jl API, key functions, and the free API key"

[[wikis]]
name = "Overview"
file = "alpv/overview.md"
bundled = true
description = "Accessing Alpha Vantage market and economic data from Julia"

[[wikis]]
name = "Authentication"
file = "alpv/authentication.md"
bundled = true
description = "Get a free API key and store it securely with the Set API key link"

[[wikis]]
name = "Constraints"
file = "alpv/constraints.md"
bundled = true
description = "Free-tier rate limits, premium endpoints, and valid intervals"

[[wikis]]
name = "Diagnostics"
file = "alpv/diagnostics.md"
bundled = true
description = "Common errors: missing key, rate-limit notes, premium-only endpoints"

[[wikis]]
name = "Interpretation"
file = "alpv/interpretation.md"
bundled = true
description = "Understanding the returned series, quotes, indicators, and macro data"

[[references]]
key = "Val...2024a"

[[references]]
key = "AV2024a"

[[bullets]]
text = "Equities"
detail = "intraday, daily, weekly, and monthly OHLC time series plus latest global quotes"

[[bullets]]
text = "Forex"
detail = "real-time and historical foreign-exchange rates for any currency pair"

[[bullets]]
text = "Crypto"
detail = "daily and intraday digital-currency prices in a chosen market"

[[bullets]]
text = "Indicators"
detail = "50+ technical indicators computed server-side (SMA, EMA, RSI, MACD, VWAP, ...)"

[[bullets]]
text = "Economic"
detail = "macro series: real GDP, CPI, treasury yields, and the federal funds rate"

[[decisionRows]]
task = "Equities"
context = "OHLC + quote"
purpose = "Chart stocks or ETFs and read a latest global quote"

[[decisionRows]]
task = "Forex"
context = "FX rates"
purpose = "Convert currencies or chart a pair over time"

[[decisionRows]]
task = "Crypto"
context = "Digital prices"
purpose = "Track cryptocurrency prices in a chosen market"

[[decisionRows]]
task = "Indicators"
context = "Technical"
purpose = "Compute SMA, EMA, RSI, or MACD on a series"

[[decisionRows]]
task = "Economic"
context = "Macro series"
purpose = "Pull GDP, CPI, yields, or policy-rate history"

[[inputs]]
id = "symbol"
label = "Symbol"
tooltip = "A stock ticker such as AAPL or IBM. Alert Me... opens Add Alert with it; alerts look the quote up at Yahoo Finance, whose tickers are the same for US stocks (outside the US they differ: TSCO.LON here is TSCO.L there)."
default = "AAPL"
models = ["equity", "indicators"]
alertMe = "quote"

[[codeBranches]]
model = "equity"
code = """
using AlphaVantage

# The global client reads ENV["ALPHA_VANTAGE_API_KEY"] automatically.
# Use the "Set API key" link above the page to store yours securely.

# Daily OHLC time series for a stock or ETF
daily = time_series_daily("{{symbol}}"; outputsize="compact")
println(daily)

# Intraday bars at a chosen interval
intraday = time_series_intraday("{{symbol}}", "5min")

# Latest global quote: price, change, and volume
last_quote = stock_quote("{{symbol}}")  # quote is a Julia keyword, so it cannot name a variable
println(last_quote)
"""

[[codeBranches]]
model = "forex"
code = """
using AlphaVantage

# Real-time exchange rate between two currencies
rate = currency_exchange_rate("USD", "EUR")
println(rate)

# Daily FX time series for a currency pair
fx = fx_daily("EUR", "USD"; outputsize="compact")
println(fx)
"""

[[codeBranches]]
model = "crypto"
code = """
using AlphaVantage

# Daily digital-currency prices in a given market
btc = digital_currency_daily("BTC", "USD")
println(btc)

# Real-time exchange rate of the coin (the FCAS rating endpoint has been discontinued)
rate = currency_exchange_rate("BTC", "USD")
println(rate)
"""

[[codeBranches]]
model = "indicators"
code = """
using AlphaVantage

# Simple moving average over a daily series (computed by Alpha Vantage)
sma = SMA("{{symbol}}", "daily", 20, "close")
println(sma)

# Relative Strength Index
rsi = RSI("{{symbol}}", "daily", 14, "close")
println(rsi)
"""

[[codeBranches]]
model = "economic"
code = """
using AlphaVantage

# US real GDP (annual or quarterly)
gdp = real_gdp("annual")
println(gdp)

# Consumer Price Index and the 10-year treasury yield
inflation = cpi("monthly")
yield10y  = treasury_yield("monthly", "10year")
println(yield10y)
"""

# Next Steps action groups (task-oriented, matched to the AlphaVantage.jl data types)
[[actionGroups]]
id = "equities"
label = "Equities"

[[actionGroups.actions]]
id = "alpv-eq-daily"
label = "Daily Series"
desc = "Download the latest 100 days of daily OHLC prices for a symbol (the full and adjusted histories need a premium key)"
code = """
using AlphaVantage

# "compact" returns the latest 100 points; "full" (20+ years) and the adjusted series need a premium key
daily = time_series_daily("AAPL"; outputsize="compact")
println(daily)
"""

[[actionGroups.actions]]
id = "alpv-eq-intraday"
label = "Intraday Bars"
desc = "Fetch intraday bars at a chosen interval"
code = """
using AlphaVantage

intraday = time_series_intraday("MSFT", "15min"; outputsize="compact")
println(intraday)
"""

[[actionGroups.actions]]
id = "alpv-eq-quote"
label = "Global Quote"
desc = "Read the latest price, change, and volume for a symbol"
code = """
using AlphaVantage

last_quote = stock_quote("AAPL")  # quote is a Julia keyword, so it cannot name a variable
println(last_quote)
"""

[[actionGroups]]
id = "fxcrypto"
label = "Forex and Crypto"

[[actionGroups.actions]]
id = "alpv-fx-rate"
label = "Exchange Rate"
desc = "Get the real-time rate between two currencies"
code = """
using AlphaVantage

rate = currency_exchange_rate("USD", "JPY")
println(rate)
"""

[[actionGroups.actions]]
id = "alpv-fx-daily"
label = "FX Daily"
desc = "Download the daily time series for a currency pair"
code = """
using AlphaVantage

fx = fx_daily("GBP", "USD"; outputsize="compact")
println(fx)
"""

[[actionGroups.actions]]
id = "alpv-crypto-daily"
label = "Crypto Daily"
desc = "Download daily digital-currency prices in a market"
code = """
using AlphaVantage

eth = digital_currency_daily("ETH", "USD")
println(eth)
"""

[[actionGroups]]
id = "indicators"
label = "Indicators"

[[actionGroups.actions]]
id = "alpv-ind-sma"
label = "Moving Average"
desc = "Compute a simple moving average server-side"
code = """
using AlphaVantage

sma = SMA("AAPL", "daily", 50, "close")
println(sma)
"""

[[actionGroups.actions]]
id = "alpv-ind-rsi"
label = "RSI"
desc = "Compute the Relative Strength Index server-side"
code = """
using AlphaVantage

rsi = RSI("AAPL", "daily", 14, "close")
println(rsi)
"""

[[actionGroups]]
id = "economic"
label = "Economic"

[[actionGroups.actions]]
id = "alpv-econ-gdp"
label = "GDP and CPI"
desc = "Pull US real GDP and the Consumer Price Index"
code = """
using AlphaVantage

gdp = real_gdp("annual")
inflation = cpi("monthly")
println(gdp)
println(inflation)
"""

[[actionGroups.actions]]
id = "alpv-econ-rates"
label = "Rates and Yields"
desc = "Pull treasury yields and the federal funds rate"
code = """
using AlphaVantage

yield10y = treasury_yield("monthly", "10year")
funds    = federal_fund_rate("monthly")
println(yield10y)
println(funds)
"""
