[[codeBranches]]
model = "equity"
code = """
using AlphaVantage

# The global client reads ENV["ALPHA_VANTAGE_API_KEY"] automatically.
# Use the "Set API key" link above the page to store yours securely.

# Daily OHLC time series for a stock or ETF
daily = time_series_daily("AAPL"; outputsize="compact")
println(daily)

# Intraday bars at a chosen interval
intraday = time_series_intraday("AAPL"; interval="5min")

# Latest global quote: price, change, and volume
quote = stock_quote("AAPL")
println(quote)
"""

[[codeBranches]]
model = "forex"
code = """
using AlphaVantage

# Real-time exchange rate between two currencies
rate = currency_exchange_rate("USD", "EUR")
println(rate)

# Daily FX time series for a currency pair
fx = fx_daily("EUR", "USD"; outputsize="compact")
println(fx)
"""

[[codeBranches]]
model = "crypto"
code = """
using AlphaVantage

# Daily digital-currency prices in a given market
btc = digital_currency_daily("BTC", "USD")
println(btc)

# FCAS rating: a fundamental health score for a coin
rating = crypto_rating("BTC")
println(rating)
"""

[[codeBranches]]
model = "indicators"
code = """
using AlphaVantage

# Simple moving average over a daily series (computed by Alpha Vantage)
sma = SMA("AAPL"; interval="daily", time_period=20, series_type="close")
println(sma)

# Relative Strength Index
rsi = RSI("AAPL"; interval="daily", time_period=14, series_type="close")
println(rsi)
"""

[[codeBranches]]
model = "economic"
code = """
using AlphaVantage

# US real GDP (annual or quarterly)
gdp = real_gdp(; interval="annual")
println(gdp)

# Consumer Price Index and the 10-year treasury yield
inflation = cpi(; interval="monthly")
yield10y  = treasury_yield(; interval="monthly", maturity="10year")
println(yield10y)
"""

# Next Steps action groups (task-oriented, matched to the AlphaVantage.jl data types)
[[actionGroups]]
id = "equities"
label = "Equities"

[[actionGroups.actions]]
id = "alpv-eq-daily"
label = "Daily Series"
desc = "Download the full daily-adjusted OHLC history for a symbol"
code = """
using AlphaVantage

# outputsize="full" returns 20+ years; "compact" returns the latest 100 points
daily = time_series_daily_adjusted("AAPL"; outputsize="full")
println(daily)
"""

[[actionGroups.actions]]
id = "alpv-eq-intraday"
label = "Intraday Bars"
desc = "Fetch intraday bars at a chosen interval"
code = """
using AlphaVantage

intraday = time_series_intraday("MSFT"; interval="15min", outputsize="compact")
println(intraday)
"""

[[actionGroups.actions]]
id = "alpv-eq-quote"
label = "Global Quote"
desc = "Read the latest price, change, and volume for a symbol"
code = """
using AlphaVantage

quote = stock_quote("AAPL")
println(quote)
"""

[[actionGroups]]
id = "fxcrypto"
label = "Forex and Crypto"

[[actionGroups.actions]]
id = "alpv-fx-rate"
label = "Exchange Rate"
desc = "Get the real-time rate between two currencies"
code = """
using AlphaVantage

rate = currency_exchange_rate("USD", "JPY")
println(rate)
"""

[[actionGroups.actions]]
id = "alpv-fx-daily"
label = "FX Daily"
desc = "Download the daily time series for a currency pair"
code = """
using AlphaVantage

fx = fx_daily("GBP", "USD"; outputsize="compact")
println(fx)
"""

[[actionGroups.actions]]
id = "alpv-crypto-daily"
label = "Crypto Daily"
desc = "Download daily digital-currency prices in a market"
code = """
using AlphaVantage

eth = digital_currency_daily("ETH", "USD")
println(eth)
"""

[[actionGroups]]
id = "indicators"
label = "Indicators"

[[actionGroups.actions]]
id = "alpv-ind-sma"
label = "Moving Average"
desc = "Compute a simple moving average server-side"
code = """
