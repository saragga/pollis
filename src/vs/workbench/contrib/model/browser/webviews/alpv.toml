"""

[[actionGroups]]
id = "economic"
label = "Economic"

[[actionGroups.actions]]
id = "alpv-econ-gdp"
label = "GDP and CPI"
desc = "Pull US real GDP and the Consumer Price Index"
code = """
using AlphaVantage

gdp = real_gdp(; interval="annual")
inflation = cpi(; interval="monthly")
