sma = SMA("AAPL"; interval="daily", time_period=50, series_type="close")
println(sma)
"""

[[actionGroups.actions]]
id = "alpv-ind-rsi"
label = "RSI"
desc = "Compute the Relative Strength Index server-side"
code = """
using AlphaVantage

rsi = RSI("AAPL"; interval="daily", time_period=14, series_type="close")
