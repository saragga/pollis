# Alpha Vantage (AlphaVantage.jl) Webview Configuration
# Declarative source. The build script generates alpv.data.ts.
# Run: npm run gulp compile-toml

[meta]
title = "Alpha Vantage"
viewType = "pollis.alpv"
defaultModel = "equity"
models = ["equity", "forex", "crypto", "indicators", "economic"]
wideLayout = true
illusCollapsed = true
illustrationText = "Download market and economic data from Alpha Vantage into Julia: equities, forex, crypto, indicators, and macro series."

[[packages]]
name = "AlphaVantage.jl"
github = "https://github.com/ellisvalentiner/AlphaVantage.jl"

[[notebookSections]]
label = "Alpha Vantage"

[[notebookSections.notebooks]]
name = "Equity Time Series"
file = "alpv/tutorial-01-equities.ipynb"
bundled = true
description = "Download intraday and daily OHLC bars and a latest global quote"

[[notebookSections.notebooks]]
name = "Forex and Crypto"
file = "alpv/tutorial-02-forex-crypto.ipynb"
bundled = true
description = "Fetch exchange rates, FX series, and digital-currency prices"

[[notebookSections.notebooks]]
name = "Technical Indicators"
file = "alpv/tutorial-03-indicators.ipynb"
bundled = true
description = "Compute SMA, EMA, RSI, and other indicators server-side"

[[notebookSections.notebooks]]
name = "Economic Indicators"
file = "alpv/tutorial-04-economic.ipynb"
bundled = true
description = "Pull macro series: real GDP, CPI, treasury yields, and the federal funds rate"

[[wikis]]
name = "Factsheet"
file = "alpv/factsheet.md"
bundled = true
description = "Quick-reference: AlphaVantage.jl API, key functions, and the free API key"

[[wikis]]
name = "Overview"
file = "alpv/overview.md"
bundled = true
description = "Accessing Alpha Vantage market and economic data from Julia"

[[wikis]]
name = "Authentication"
file = "alpv/authentication.md"
bundled = true
description = "Get a free API key and store it securely with the Set API key link"

[[wikis]]
name = "Constraints"
file = "alpv/constraints.md"
bundled = true
description = "Free-tier rate limits, premium endpoints, and valid intervals"

[[wikis]]
name = "Diagnostics"
file = "alpv/diagnostics.md"
bundled = true
description = "Common errors: missing key, rate-limit notes, premium-only endpoints"

[[wikis]]
name = "Interpretation"
file = "alpv/interpretation.md"
bundled = true
description = "Understanding the returned series, quotes, indicators, and macro data"

[[references]]
title = "AlphaVantage.jl: A Julia wrapper for the Alpha Vantage API"
authors = "Valentiner, Ellis; contributors"
year = 2024
journal = "GitHub"
url = "https://github.com/ellisvalentiner/AlphaVantage.jl"
openAccess = true

[[references]]
