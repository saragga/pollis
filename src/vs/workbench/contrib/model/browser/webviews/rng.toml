[[codeBranches]]
model = "tasklocal"
code = '''
using Random
rng = TaskLocalRNG()
seed!(rng, {{seed}})

{{?operation=uniform_float}} x = rand(rng, {{float-type}}, {{count}})
{{?operation=uniform_int}} x = rand(rng, {{int-type}}, {{count}})
{{?operation=int_range}} x = rand(rng, {{range-min}}:{{range-max}}, {{count}})
{{?operation=normal}} x = randn(rng, {{float-type}}, {{count}})
{{?operation=exponential}} x = randexp(rng, {{float-type}}, {{count}})
{{?operation=bits}} x = bitrand(rng, {{count}})
{{?operation=shuffle}} x = shuffle(rng, {{collection}})
{{?operation=permutation}} x = randperm(rng, {{count}})
println(x)
'''

