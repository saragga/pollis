[[bullets]]
text = "Unlike Uncertainty-Set Robust Optimisation"
detail = "which is distribution-free and guarantees feasibility for every realisation in a prescribed set — both methods here assume uncertainty has a probability distribution. Chance-Constrained Programming relaxes feasibility to a probabilistic guarantee (constraints may be violated with probability at most epsilon), enabling less conservative solutions."

[[bullets]]
text = "Distributionally Robust Optimisation sits between the two: it does not assume a known distribution, but rather optimises against the worst-case distribution within an ambiguity set defined by moments or Wasserstein distance to empirical data."
detail = ""

[[decisionRows]]
task = "Chance-Constrained"
context = "Constraints on random quantities that may be violated with a small, controlled probability (capacity, reliability, service levels)"
purpose = "Gaussian chance constraint P(xi'x <= b) >= 1 - epsilon with mean and covariance estimated from n samples, reformulated exactly as a second-order cone constraint"

[[decisionRows]]
task = "Distributionally Robust"
context = "Few data and an unknown distribution: protect against every distribution close to the empirical one, not just a fitted model"
purpose = "Wasserstein DRO: the worst-case CVaR of the constraint over all distributions within transport distance theta of the n samples must be nonpositive, a conic program that guarantees the chance constraint for all of them"

[[inputs]]
id = "n"
label = "Samples (n)"
tooltip = "Number of observed samples of the random resource use xi. The chance-constrained model estimates its mean and covariance from them; the DRO model centres its Wasserstein ball on their empirical distribution."
default = "100"

[[inputs]]
id = "eps"
label = "Violation Probability (epsilon)"
tooltip = "Allowed probability that resource use exceeds capacity; the constraint must hold with probability at least 1 - epsilon. Typical values 0.01 to 0.10 (must be below 0.5)."
default = "0.05"

[[inputs]]
id = "theta"
label = "Wasserstein Radius (theta)"
tooltip = "Radius of the Wasserstein ball around the empirical distribution: the average distance probability mass may be moved. Larger values protect against more distributions and give more conservative decisions; theta = 0 is the sample (SAA) CVaR constraint. Used by the DRO formulation and by the comparisons."
default = "0.02"

