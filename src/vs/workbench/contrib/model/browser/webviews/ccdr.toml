[[codeBranches]]
model = "cc"
code = '''
using JuMP, Clarabel, LinearAlgebra, Distributions, Random, Statistics

n = {{n}}  # observed samples
epsilon = {{eps}}  # allowed violation probability
theta = {{theta}}  # Wasserstein radius (DRO)

# Two products compete for one capacity b; resource use per unit xi is random
c = [1.0, 1.5]  # profit per unit
b = 10.0  # capacity
dist = MvNormal([1.0, 2.0], [0.30 0.10; 0.10 0.60])  # true (unknown) distribution of xi
xi = rand(MersenneTwister(1), dist, n)  # observed samples, 2 x n

function solve_cc(; epsilon=epsilon, xi=xi, b=b, theta=nothing)  # Gaussian chance constraint as an SOC
    mu, L = vec(mean(xi, dims=2)), cholesky(Symmetric(cov(xi, dims=2))).U  # Sigma = transpose(L) * L
    z = quantile(Normal(), 1 - epsilon)
    m = Model(Clarabel.Optimizer); set_silent(m)
    @variable(m, x[1:2] >= 0)
    @constraint(m, [(b - dot(mu, x)) / z; L * x] in SecondOrderCone())  # mu'x + z ||L x|| <= b
    @objective(m, Max, dot(c, x))
    optimize!(m)
    (x = value.(x), obj = objective_value(m), solved = is_solved_and_feasible(m))
end

function solve_dro(; epsilon=epsilon, xi=xi, b=b, theta=theta)  # worst-case CVaR over a Wasserstein ball
    N = size(xi, 2)
    m = Model(Clarabel.Optimizer); set_silent(m)
    @variable(m, x[1:2] >= 0); @variable(m, tau); @variable(m, s[1:N] >= 0); @variable(m, u)
    @constraint(m, [i = 1:N], s[i] >= dot(xi[:, i], x) - b - tau)  # CVaR hinge terms
    @constraint(m, [u; x] in SecondOrderCone())  # u >= ||x||, the Lipschitz constant of the loss
    @constraint(m, tau + sum(s) / (epsilon * N) + theta * u / epsilon <= 0)
    @objective(m, Max, dot(c, x))
    optimize!(m)
    (x = value.(x), obj = objective_value(m), solved = is_solved_and_feasible(m))
end

function solve_box(; xi=xi, b=b, k=3)  # classical robust baseline: worst case of a box mean +- k sd
    worst = vec(mean(xi, dims=2) .+ k .* std(xi, dims=2))
    m = Model(Clarabel.Optimizer); set_silent(m)
    @variable(m, x[1:2] >= 0)
    @constraint(m, dot(worst, x) <= b)
    @objective(m, Max, dot(c, x))
    optimize!(m)
    (x = value.(x), obj = objective_value(m), solved = is_solved_and_feasible(m))
end

XTEST = rand(MersenneTwister(99), dist, 100_000)  # fresh draws from the true distribution
violation(x) = mean(transpose(XTEST) * x .> b)  # true probability that use exceeds capacity
solve_model(; kw...) = solve_cc(; kw...)  # the active formulation

sol = solve_model()
(x = round.(sol.x, digits=3), profit = round(sol.obj, digits=3), true_violation = violation(sol.x), target = epsilon, solved = sol.solved)
'''

[[codeBranches]]
model = "dro"
code = '''
using JuMP, Clarabel, LinearAlgebra, Distributions, Random, Statistics

n = {{n}}  # observed samples
epsilon = {{eps}}  # allowed violation probability
theta = {{theta}}  # Wasserstein radius (DRO)

# Two products compete for one capacity b; resource use per unit xi is random
c = [1.0, 1.5]  # profit per unit
b = 10.0  # capacity
dist = MvNormal([1.0, 2.0], [0.30 0.10; 0.10 0.60])  # true (unknown) distribution of xi
xi = rand(MersenneTwister(1), dist, n)  # observed samples, 2 x n

function solve_cc(; epsilon=epsilon, xi=xi, b=b, theta=nothing)  # Gaussian chance constraint as an SOC
    mu, L = vec(mean(xi, dims=2)), cholesky(Symmetric(cov(xi, dims=2))).U  # Sigma = transpose(L) * L
    z = quantile(Normal(), 1 - epsilon)
    m = Model(Clarabel.Optimizer); set_silent(m)
    @variable(m, x[1:2] >= 0)
    @constraint(m, [(b - dot(mu, x)) / z; L * x] in SecondOrderCone())  # mu'x + z ||L x|| <= b
    @objective(m, Max, dot(c, x))
    optimize!(m)
    (x = value.(x), obj = objective_value(m), solved = is_solved_and_feasible(m))
end

function solve_dro(; epsilon=epsilon, xi=xi, b=b, theta=theta)  # worst-case CVaR over a Wasserstein ball
    N = size(xi, 2)
    m = Model(Clarabel.Optimizer); set_silent(m)
    @variable(m, x[1:2] >= 0); @variable(m, tau); @variable(m, s[1:N] >= 0); @variable(m, u)
    @constraint(m, [i = 1:N], s[i] >= dot(xi[:, i], x) - b - tau)  # CVaR hinge terms
    @constraint(m, [u; x] in SecondOrderCone())  # u >= ||x||, the Lipschitz constant of the loss
    @constraint(m, tau + sum(s) / (epsilon * N) + theta * u / epsilon <= 0)
    @objective(m, Max, dot(c, x))
    optimize!(m)
    (x = value.(x), obj = objective_value(m), solved = is_solved_and_feasible(m))
end

function solve_box(; xi=xi, b=b, k=3)  # classical robust baseline: worst case of a box mean +- k sd
    worst = vec(mean(xi, dims=2) .+ k .* std(xi, dims=2))
    m = Model(Clarabel.Optimizer); set_silent(m)
    @variable(m, x[1:2] >= 0)
    @constraint(m, dot(worst, x) <= b)
    @objective(m, Max, dot(c, x))
    optimize!(m)
    (x = value.(x), obj = objective_value(m), solved = is_solved_and_feasible(m))
end

XTEST = rand(MersenneTwister(99), dist, 100_000)  # fresh draws from the true distribution
violation(x) = mean(transpose(XTEST) * x .> b)  # true probability that use exceeds capacity
solve_model(; kw...) = solve_dro(; kw...)  # the active formulation

sol = solve_model()
(x = round.(sol.x, digits=3), profit = round(sol.obj, digits=3), true_violation = violation(sol.x), target = epsilon, solved = sol.solved)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "feasible-region"
label = "Feasible Region"
desc = "Feasible decisions under the nominal (mean) constraint, the chance constraint, the DRO constraint and the box-robust constraint, with the optimal decision"
code = '''
using Plots
function cvar(l, epsilon)  # mean of the worst epsilon fraction of the losses l
    s = sort(l, rev=true); k = epsilon * length(l); j = floor(Int, k)
    (sum(s[1:j]) + (k - j) * (j < length(s) ? s[j+1] : 0.0)) / k
end
mu, L = vec(mean(xi, dims=2)), cholesky(Symmetric(cov(xi, dims=2))).U
worst = vec(mean(xi, dims=2) .+ 3 .* std(xi, dims=2))
z = quantile(Normal(), 1 - epsilon)
function dro_radius(d)  # largest step along d that keeps the DRO constraint (bisection)
    lo, hi = 0.0, 2b / dot(mu, d)
    for _ in 1:60
        r = (lo + hi) / 2
        cvar(r .* (transpose(xi) * d) .- b, epsilon) + theta * r / epsilon <= 0 ? (lo = r) : (hi = r)
    end
    lo
end
dirs = [[cos(p), sin(p)] for p in range(0, pi / 2, length=90)]
boundary(rf) = (r = rf.(dirs); ([0; r .* first.(dirs); 0], [0; r .* last.(dirs); 0]))
plot(boundary(d -> b / dot(mu, d))..., label="nominal (mean)", lw=2, ls=:dot)
plot!(boundary(d -> b / (dot(mu, d) + z * norm(L * d)))..., label="chance constraint", lw=2)
plot!(boundary(dro_radius)..., label="DRO (theta = " * string(theta) * ")", lw=2)
plot!(boundary(d -> b / dot(worst, d))..., label="box robust", lw=2, ls=:dash)
scatter!([sol.x[1]], [sol.x[2]], ms=6, label="optimum", xlabel="x1", ylabel="x2", aspect_ratio=1, title="Feasible decisions")
'''

[[actionGroups.actions]]
id = "ambiguity-set"
label = "Uncertainty Set"
desc = "Samples of resource use xi with the boundary xi'x* = b of the optimal decision. Chance-constrained: the (1 - epsilon) ellipsoid the constraint protects. DRO: the epsilon tail of samples whose CVaR, plus the Wasserstein margin, must stay within capacity"
code = '''
using Plots
x = sol.x
scatter(xi[1, :], xi[2, :], ms=3, alpha=0.5, label="samples", xlabel="xi1", ylabel="xi2")
a1 = range(minimum(xi[1, :]), maximum(xi[1, :]), length=50)
plot!(a1, (b .- a1 .* x[1]) ./ x[2], lw=2, label="xi'x* = b (violation above)")
{{?model=cc}}mu, L = vec(mean(xi, dims=2)), cholesky(Symmetric(cov(xi, dims=2))).U
{{?model=cc}}z = quantile(Normal(), 1 - epsilon)
{{?model=cc}}E = [mu .+ z .* (transpose(L) * [cos(t), sin(t)]) for t in range(0, 2pi, length=200)]  # support function mu'x + z ||L x||
{{?model=cc}}plot!(first.(E), last.(E), lw=2, label="protected ellipsoid", title="Chance constraint", aspect_ratio=1)
{{?model=dro}}k = ceil(Int, epsilon * n)
{{?model=dro}}tail = sortperm(transpose(xi) * x, rev=true)[1:k]  # samples in the CVaR tail
{{?model=dro}}scatter!(xi[1, tail], xi[2, tail], ms=5, label="epsilon tail", title="DRO (theta = " * string(theta) * ")", aspect_ratio=1)
'''

