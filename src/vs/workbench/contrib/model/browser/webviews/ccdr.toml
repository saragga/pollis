'''

[[actionGroups.actions]]
id = "worst-case-dist"
label = "Worst-Case Distribution"
desc = "Chance-constrained: the worst realisation in the protected ellipsoid, which lies exactly on capacity. DRO: the worst-case distribution, which moves the epsilon tail by theta / epsilon towards violation"
code = '''
using Plots
x = sol.x
scatter(xi[1, :], xi[2, :], ms=3, alpha=0.4, label="empirical", xlabel="xi1", ylabel="xi2", aspect_ratio=1)
a1 = range(minimum(xi[1, :]), maximum(xi[1, :]), length=50)
plot!(a1, (b .- a1 .* x[1]) ./ x[2], lw=2, label="xi'x* = b")
{{?model=cc}}mu, Sig = vec(mean(xi, dims=2)), cov(xi, dims=2)
{{?model=cc}}z = quantile(Normal(), 1 - epsilon)
{{?model=cc}}astar = mu .+ z .* (Sig * x) ./ sqrt(dot(x, Sig * x))  # maximiser of xi'x over the ellipsoid
{{?model=cc}}println("Worst-case use: ", round(dot(astar, x), digits=4), " (capacity ", b, ")")
{{?model=cc}}scatter!([astar[1]], [astar[2]], ms=7, label="worst case", title="Chance constraint")
{{?model=dro}}k = ceil(Int, epsilon * n)
{{?model=dro}}tail = sortperm(transpose(xi) * x, rev=true)[1:k]
{{?model=dro}}moved = xi[:, tail] .+ (theta / epsilon) .* x ./ norm(x)  # transport budget theta spent on the tail
{{?model=dro}}scatter!(moved[1, :], moved[2, :], ms=5, label="worst-case tail", title="DRO worst case")
'''
