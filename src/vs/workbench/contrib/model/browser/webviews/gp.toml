[[models]]
id = "fit"
label = "Fit"

[[models]]
id = "eval"
label = "Evaluate"

[[models]]
id = "sample"
label = "Sample"

[[bullets]]
text = "Fit GP distribution to threshold exceedances via maximum likelihood estimation"
detail = ""

[[bullets]]
text = "Evaluate pdf, cdf and quantiles for specified parameters"
detail = ""

[[bullets]]
text = "Generate random samples from the GP distribution"
detail = ""

[[bullets]]
text = "Used in Peaks-Over-Threshold (POT) analysis for modelling tail events"
detail = ""

[[inputs]]
id = "data"
label = "Data series"
tooltip = "Full data series from which exceedances above the threshold will be extracted."
default = "losses"
models = ["fit"]

[[inputs]]
id = "threshold"
label = "Threshold u"
tooltip = "Threshold u for fitting. Observations exceeding u are used to fit the GP distribution, which describes only the excesses over a high threshold. The 90th percentile is a common start; check it with the mean excess plot."
default = "quantile(losses, 0.9)"
models = ["fit"]

[[inputs]]
id = "method"
label = "Estimation method"
tooltip = "Estimation method. Maximum Likelihood is the default. Probability-Weighted Moments is faster. Bayesian Estimation yields posterior distributions for the parameters."
kind = "select"
default = "mle"
models = ["fit"]

[[inputs.options]]
value = "mle"
label = "Maximum Likelihood"

[[inputs.options]]
value = "pwm"
label = "Probability-Weighted Moments"

[[inputs.options]]
value = "bayes"
label = "Bayesian Estimation"

[[inputs]]
id = "threshold-param"
label = "Threshold mu"
tooltip = "Location parameter mu (threshold) for the GP distribution. Sets the lower bound of support."
default = "0.0"
models = ["eval", "sample"]

[[inputs]]
id = "sigma"
label = "sigma"
tooltip = "Scale parameter sigma > 0. Controls the spread of exceedances above the threshold."
default = "1.0"
models = ["eval", "sample"]

[[inputs]]
id = "xi"
label = "xi"
tooltip = "Shape parameter xi. xi > 0: heavy tail; xi = 0: exponential; xi < 0: bounded support above threshold."
default = "0.1"
models = ["eval", "sample"]

[[inputs]]
id = "x"
label = "Eval point x"
tooltip = "Point at which to evaluate the pdf and cdf (must be above the threshold mu)."
default = "1.0"
models = ["eval"]

[[inputs]]
id = "p"
label = "Quantile p"
tooltip = "Probability level for the quantile. E.g., 0.99 gives the 99th percentile; 0.999 gives the 99.9th percentile."
default = "0.99"
models = ["eval"]

[[inputs]]
id = "n"
label = "Sample size n"
tooltip = "Number of random samples to generate."
default = "500"
models = ["sample"]

[[codeBranches]]
model = "fit"
code = '''
using Extremes

exceedances        = {{data}}[{{data}} .> {{threshold}}] .- {{threshold}}  # excesses above u
fm                 = gpfit(exceedances; method = :{{method}})  # fit GP
sigma_hat, xi_hat  = params(fm)  # extract scale and shape
println("sigma_hat (scale):  ", round(sigma_hat, digits = 6))
println("xi_hat (shape):     ", round(xi_hat,    digits = 6))
println("N exceedances:      ", length(exceedances))
'''

[[codeBranches]]
model = "eval"
code = '''
using Distributions

d = GeneralizedPareto({{threshold-param}}, {{sigma}}, {{xi}})  # construct GP (location, scale, shape)
f = pdf(d, {{x}})  # density at x
F = cdf(d, {{x}})  # cumulative prob at x
q = quantile(d, {{p}})  # quantile at probability p
println("pdf(", {{x}}, "):         ", round(f, digits = 6))
println("cdf(", {{x}}, "):         ", round(F, digits = 6))
println("Quantile(", {{p}}, "): ", round(q, digits = 6))
'''

[[codeBranches]]
model = "sample"
code = '''
using Distributions, Statistics

d       = GeneralizedPareto({{threshold-param}}, {{sigma}}, {{xi}})  # construct GP (location, scale, shape)
samples = rand(d, {{n}})  # draw n samples
println("First 10 samples: ", round.(samples[1:min(10,end)], digits = 4))
println("Sample mean:      ", round(mean(samples), digits = 6))
println("Sample std:       ", round(std(samples),  digits = 6))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "fit_diagnostics"
label = "Fit Diagnostics"
desc = "PP and QQ plot for GP goodness of fit to exceedances"
code = '''
using Extremes, Plots
exceedances = {{data}}[{{data}} .> {{threshold}}] .- {{threshold}}  # POT excesses
fm = gpfit(exceedances)  # fit GP
p1 = plot(probplot(fm); title = "Probability Plot", legend = false)  # PP plot
p2 = plot(qqplot(fm);   title = "Quantile Plot",    legend = false)  # QQ plot
plot(p1, p2; layout = (1,2), size = (800,400))
'''

[[actionGroups.actions]]
id = "tail_probability"
label = "Tail Probability"
desc = "Chance that a loss beyond the threshold exceeds the largest excess seen so far, given an exceedance and unconditionally"
code = '''
using Extremes, Distributions
exceedances = {{data}}[{{data}} .> {{threshold}}] .- {{threshold}}  # POT excesses
fm                 = gpfit(exceedances)  # fit GP
sigma_hat, xi_hat  = params(fm)  # extract scale and shape
d_gp = GeneralizedPareto(0.0, sigma_hat, xi_hat)  # distribution of the excess over u (location 0)
rate = length(exceedances) / length({{data}})  # share of all observations above u
p_beyond = ccdf(d_gp, maximum(exceedances))  # an exceedance larger than any seen so far
println("P(excess > largest seen | X > u): ", round(p_beyond, sigdigits = 4))
println("P(X > u + largest excess):        ", round(rate * p_beyond, sigdigits = 4), "  (about once in ", round(Int, 1 / (rate * p_beyond)), " observations)")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "tail_behaviour"
label = "Tail Behaviour"
desc = "Classify tail type from shape parameter"
code = '''
using Extremes
exceedances = {{data}}[{{data}} .> {{threshold}}] .- {{threshold}}  # POT excesses
fm = gpfit(exceedances)  # fit GP
sigma_hat, xi_hat = params(fm)  # extract parameters
tail = xi_hat > 0.05 ? "Heavy tail" : xi_hat < -0.05 ? "Bounded support" : "Exponential tail"  # classify tail (check the confidence interval of xi before relying on it)
println("Tail type:       ", tail)
println("Shape (xi_hat):    ", round(xi_hat, digits = 4))
println("Scale (sigma_hat): ", round(sigma_hat, digits = 4))
'''
