label = "Sample"

[[bullets]]
text = "Fit GP distribution to threshold exceedances by maximum likelihood, probability-weighted moments or Bayesian estimation"
detail = ""

[[bullets]]
text = "Evaluate pdf, cdf and quantiles for specified parameters"
detail = ""

[[bullets]]
