[[codeBranches]]
model = "egreedy"
code = '''
using Distributions, Random, Statistics

probs = {{probs}}  # true success probability of each arm (unknown to the agent)
K = length(probs)  # number of arms
steps = {{steps}}  # pulls per run
runs = {{runs}}  # Monte Carlo runs for averaged results
seed = {{seed}}  # random seed
epsilon = {{eps}}  # exploration probability
choose(N, W, t, rng) = rand(rng) < epsilon || t <= K ? rand(rng, 1:K) : argmax(W ./ max.(N, 1))  # N = pulls, W = successes per arm

function run_bandit(policy=choose; steps=steps, seed=seed, probs=probs)  # one run of the bandit
    rng = MersenneTwister(seed)
    N = zeros(Int, length(probs)); W = zeros(Int, length(probs))
    arms = zeros(Int, steps); rewards = zeros(Int, steps)
    for t in 1:steps
        a = policy(N, W, t, rng)
        r = Int(rand(rng) < probs[a])  # Bernoulli reward
        N[a] += 1; W[a] += r
        arms[t] = a; rewards[t] = r
    end
    (arms = arms, rewards = rewards, N = N, W = W, regret = cumsum(maximum(probs) .- probs[arms]))
end
mean_regret(policy=choose; steps=steps) = mean(run_bandit(policy; steps, seed=k).regret for k in 1:runs)  # expected regret curve

res = run_bandit()
(total_reward = sum(res.rewards), pulls_per_arm = res.N, best_arm = argmax(probs), share_on_best_arm = res.N[argmax(probs)] / steps,
 final_regret = res.regret[end])
'''

[[codeBranches]]
model = "ucb"
code = '''
using Distributions, Random, Statistics

probs = {{probs}}  # true success probability of each arm (unknown to the agent)
K = length(probs)  # number of arms
steps = {{steps}}  # pulls per run
runs = {{runs}}  # Monte Carlo runs for averaged results
seed = {{seed}}  # random seed
c = {{c}}  # exploration constant
choose(N, W, t, rng) = t <= K ? t : argmax(W ./ N .+ c .* sqrt.(log(t) ./ N))  # pull each arm once, then the highest upper bound

function run_bandit(policy=choose; steps=steps, seed=seed, probs=probs)  # one run of the bandit
    rng = MersenneTwister(seed)
    N = zeros(Int, length(probs)); W = zeros(Int, length(probs))
    arms = zeros(Int, steps); rewards = zeros(Int, steps)
    for t in 1:steps
        a = policy(N, W, t, rng)
        r = Int(rand(rng) < probs[a])  # Bernoulli reward
        N[a] += 1; W[a] += r
        arms[t] = a; rewards[t] = r
    end
    (arms = arms, rewards = rewards, N = N, W = W, regret = cumsum(maximum(probs) .- probs[arms]))
end
mean_regret(policy=choose; steps=steps) = mean(run_bandit(policy; steps, seed=k).regret for k in 1:runs)  # expected regret curve

res = run_bandit()
(total_reward = sum(res.rewards), pulls_per_arm = res.N, best_arm = argmax(probs), share_on_best_arm = res.N[argmax(probs)] / steps,
 final_regret = res.regret[end])
'''

[[codeBranches]]
model = "thompson"
code = '''
using Distributions, Random, Statistics

probs = {{probs}}  # true success probability of each arm (unknown to the agent)
K = length(probs)  # number of arms
steps = {{steps}}  # pulls per run
runs = {{runs}}  # Monte Carlo runs for averaged results
seed = {{seed}}  # random seed
alpha, beta = {{alpha}}, {{beta}}  # Beta prior parameters
choose(N, W, t, rng) = argmax([rand(rng, Beta(alpha + W[a], beta + N[a] - W[a])) for a in 1:K])  # one posterior draw per arm

function run_bandit(policy=choose; steps=steps, seed=seed, probs=probs)  # one run of the bandit
    rng = MersenneTwister(seed)
    N = zeros(Int, length(probs)); W = zeros(Int, length(probs))
    arms = zeros(Int, steps); rewards = zeros(Int, steps)
    for t in 1:steps
        a = policy(N, W, t, rng)
        r = Int(rand(rng) < probs[a])  # Bernoulli reward
        N[a] += 1; W[a] += r
        arms[t] = a; rewards[t] = r
    end
    (arms = arms, rewards = rewards, N = N, W = W, regret = cumsum(maximum(probs) .- probs[arms]))
end
mean_regret(policy=choose; steps=steps) = mean(run_bandit(policy; steps, seed=k).regret for k in 1:runs)  # expected regret curve

res = run_bandit()
(total_reward = sum(res.rewards), pulls_per_arm = res.N, best_arm = argmax(probs), share_on_best_arm = res.N[argmax(probs)] / steps,
 final_regret = res.regret[end])
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "cumulative-reward"
label = "Cumulative Reward"
desc = "Cumulative reward of one run against an oracle that always pulls the best arm (expected)"
code = '''
using Plots

plot(cumsum(res.rewards), xlabel="step", ylabel="cumulative reward", label="{{model}}")
plot!(maximum(probs) .* (1:steps), linestyle=:dash, label="oracle (expected)")
'''

[[actionGroups.actions]]
id = "regret-plot"
label = "Regret Plot"
desc = "Expected cumulative regret averaged over the Monte Carlo runs, with the spread across runs"
code = '''
using Plots

R = reduce(hcat, [run_bandit(seed=k).regret for k in 1:runs])
lo, hi = [quantile(r, 0.1) for r in eachrow(R)], [quantile(r, 0.9) for r in eachrow(R)]
m = vec(mean(R, dims=2))
plot(m, ribbon=(m .- lo, hi .- m), fillalpha=0.2, xlabel="step", ylabel="cumulative regret", label="mean (10-90% band)")
'''

