[[actionGroups.actions]]
id = "regret-decomposition"
label = "Regret Decomposition"
desc = "Expected regret split by arm: gap to the best arm times the expected number of pulls"
code = '''
Nbar = mean(run_bandit(seed=k).N for k in 1:runs)
gap = maximum(probs) .- probs
[(arm = a, gap = round(gap[a], digits=3), expected_pulls = round(Nbar[a], digits=1), regret_contribution = round(gap[a] * Nbar[a], digits=2)) for a in 1:K]
'''
