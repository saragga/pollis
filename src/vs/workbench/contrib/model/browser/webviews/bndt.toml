[[bullets]]
text = "epsilon-Greedy"
detail = "with probability epsilon selects a random arm; otherwise exploits the arm with the highest estimated mean reward; simple and interpretable for stationary reward distributions (ReinforcementLearning.jl)"

[[bullets]]
text = "Upper Confidence Bound (UCB)"
detail = "selects the arm with the highest optimistic estimate; confidence bonus shrinks as an arm is pulled more; achieves sublinear regret without any prior knowledge (ReinforcementLearning.jl)"

[[bullets]]
text = "Thompson Sampling"
detail = "samples a reward estimate from the Beta posterior of each arm and pulls the arm with the highest sample; conjugate Bayesian update after each pull; best empirical performance in practice (ReinforcementLearning.jl)"

[[decisionRows]]
task = "epsilon-Greedy"
context = "Simple baseline; easy to explain and tune"
purpose = "Pulls the arm with the best estimated mean, except with probability epsilon a random arm; linear regret for a fixed epsilon"

[[decisionRows]]
task = "UCB"
context = "When a deterministic, tuning-free policy with guarantees is wanted"
purpose = "Upper Confidence Bound (UCB1): pulls the arm with the highest mean plus an exploration bonus c sqrt(log t / n); logarithmic regret"

[[decisionRows]]
task = "Thompson Sampling"
context = "Usually the best empirical performance; natural with prior knowledge"
purpose = "Samples each arm's success probability from its Beta posterior and pulls the arm with the highest draw; logarithmic regret"

[[inputs]]
id = "probs"
label = "Arm Success Probabilities"
tooltip = "True probability of reward 1 for each arm of the Bernoulli bandit (unknown to the agent)."
