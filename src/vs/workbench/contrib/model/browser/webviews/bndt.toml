{{?model=thompson}}plt = plot(xlabel="success probability", ylabel="posterior density")
{{?model=thompson}}for a in 1:K
{{?model=thompson}}    plot!(plt, x -> pdf(Beta(alpha + res.W[a], beta + res.N[a] - res.W[a]), x), 0, 1, label="arm $a: Beta($(alpha + res.W[a]), $(beta + res.N[a] - res.W[a]))")
{{?model=thompson}}end
{{?model=thompson}}plt
