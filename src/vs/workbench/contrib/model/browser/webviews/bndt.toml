id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "action-frequency"
label = "Action Frequency"
desc = "How often each arm was pulled in one run, next to its true success probability"
code = '''
using Plots

p1 = bar(1:K, res.N, xlabel="arm", ylabel="pulls", legend=false)
p2 = bar(1:K, probs, xlabel="arm", ylabel="true success probability", legend=false, color=:gray)
plot(p1, p2, layout=(1, 2))
'''

[[actionGroups.actions]]
id = "reward-distribution"
label = "Estimate Accuracy"
desc = "Estimated success probability of each arm with a 95% interval, against the truth: rarely pulled arms stay uncertain"
code = '''
phat = res.W ./ max.(res.N, 1)
se = sqrt.(phat .* (1 .- phat) ./ max.(res.N, 1))
[(arm = a, true_p = probs[a], estimate = round(phat[a], digits=3), lower_95 = round(max(phat[a] - 1.96se[a], 0), digits=3),
  upper_95 = round(min(phat[a] + 1.96se[a], 1), digits=3), pulls = res.N[a]) for a in 1:K]
'''

[[actionGroups.actions]]
id = "best-arm-share"
label = "Exploration Over Time"
desc = "Share of pulls on the best arm in windows of 50 steps, averaged over the runs: how fast exploration gives way to exploitation"
code = '''
using Plots

best = argmax(probs)
share = mean(Float64.(run_bandit(seed=k).arms .== best) for k in 1:runs)
w = 50
plot([mean(share[i:min(i + w - 1, steps)]) for i in 1:w:steps], xlabel="window of $w steps", ylabel="share on best arm", legend=false, ylims=(0, 1))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "optimal-arm"
label = "Optimal Arm"
desc = "Which arm the agent believes is best after the run, and how often it identifies the true best arm across runs"
code = '''
{{?model=thompson}}Random.seed!(2)
{{?model=thompson}}draws = [argmax([rand(Beta(alpha + res.W[a], beta + res.N[a] - res.W[a])) for a in 1:K]) for k in 1:10_000]
{{?model=thompson}}prob_best = [count(==(a), draws) / length(draws) for a in 1:K]  # posterior probability that each arm is best
chosen(r) = argmax(r.N)  # the most pulled arm
(believed_best = chosen(res), true_best = argmax(probs), estimate = res.W[chosen(res)] / res.N[chosen(res)],
{{?model=thompson}} posterior_probability_best = round.(prob_best, digits=3),
 identified_correctly_share = count(k -> chosen(run_bandit(seed=k)) == argmax(probs), 1:runs) / runs)
'''

[[actionGroups.actions]]
id = "expected-reward"
label = "Regret Forecast"
desc = "Expected regret at 1, 2 and 4 times the horizon, and the fitted growth rate (log-like for UCB and Thompson, linear for epsilon-greedy)"
code = '''
Rlong = mean_regret(steps=4steps)
horizons = [steps, 2steps, 4steps]
slope = (Rlong[4steps] - Rlong[2steps]) / (log(4steps) - log(2steps))  # regret per unit of log t
(expected_regret = [t => round(Rlong[t], digits=2) for t in horizons], regret_per_log_step = round(slope, digits=2),
 regret_per_step_late = round((Rlong[4steps] - Rlong[2steps]) / (2steps), digits=4), mean_reward_per_step_late = round(maximum(probs) - (Rlong[4steps] - Rlong[2steps]) / (2steps), digits=4))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "algorithm-benchmark"
label = "Algorithm Benchmark"
desc = "Expected regret of epsilon-greedy (0.1), UCB1 and Thompson sampling (uniform prior) on the same arms"
code = '''
using Plots

eg(N, W, t, rng) = rand(rng) < 0.1 || t <= K ? rand(rng, 1:K) : argmax(W ./ max.(N, 1))
ucb1(N, W, t, rng) = t <= K ? t : argmax(W ./ N .+ sqrt.(2 .* log(t) ./ N))
thompson(N, W, t, rng) = argmax([rand(rng, Beta(1 + W[a], 1 + N[a] - W[a])) for a in 1:K])
plt = plot(xlabel="step", ylabel="expected cumulative regret")
for (name, p) in ["epsilon-greedy (0.1)" => eg, "UCB1" => ucb1, "Thompson (uniform prior)" => thompson]
    plot!(plt, mean_regret(p), label=name)
end
plt
'''

[[actionGroups.actions]]
id = "param-sweep"
label = "Parameter Sweep"
desc = "Final expected regret for a range of values of the current algorithm's parameter"
code = '''
{{?model=egreedy}}[(eps = e, final_regret = round(mean_regret((N, W, t, rng) -> rand(rng) < e || t <= K ? rand(rng, 1:K) : argmax(W ./ max.(N, 1)))[end], digits=2))
{{?model=egreedy}} for e in [0.01, 0.05, 0.1, 0.2, 0.3]]
{{?model=ucb}}[(c = cc, final_regret = round(mean_regret((N, W, t, rng) -> t <= K ? t : argmax(W ./ N .+ cc .* sqrt.(log(t) ./ N)))[end], digits=2))
{{?model=ucb}} for cc in [0.25, 0.5, 1.0, 1.41, 2.0, 3.0]]
{{?model=thompson}}[(prior = (a0, b0), final_regret = round(mean_regret((N, W, t, rng) -> argmax([rand(rng, Beta(a0 + W[a], b0 + N[a] - W[a])) for a in 1:K]))[end], digits=2))
{{?model=thompson}} for (a0, b0) in [(1, 1), (0.5, 0.5), (2, 2), (5, 5), (1, 5), (5, 1)]]
'''

[[actionGroups.actions]]
id = "lower-bound"
label = "Lai-Robbins Bound"
desc = "Expected regret against the asymptotic lower bound sum over suboptimal arms of gap / KL(p_a, p_best) times log t"
code = '''
using Plots

kl(p, q) = p * log(p / q) + (1 - p) * log((1 - p) / (1 - q))  # Bernoulli Kullback-Leibler divergence
pb = maximum(probs)
constant = sum((pb - p) / kl(p, pb) for p in probs if p < pb)
plot(mean_regret(), xlabel="step", ylabel="expected cumulative regret", label="{{model}}")
plot!(t -> constant * log(t), 1, steps, linestyle=:dash, label="lower bound")
'''

