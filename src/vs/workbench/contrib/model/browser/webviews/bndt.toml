[[inputs]]
id = "steps"
label = "Steps"
tooltip = "Total number of arm pulls in one run."
default = "1000"

[[inputs]]
id = "runs"
label = "Monte Carlo Runs"
tooltip = "Number of independent runs averaged by the regret and comparison actions."
default = "200"

[[inputs]]
id = "seed"
label = "Random Seed"
tooltip = "Seed of the single run shown by the main code."
default = "1"

[[inputs]]
id = "eps"
label = "Exploration (epsilon)"
