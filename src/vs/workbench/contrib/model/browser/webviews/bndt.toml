{{?model=ucb}}bar(1:K, m, label="estimated mean", xlabel="arm")
{{?model=ucb}}scatter!(1:K, m .+ bonus, label="upper confidence bound", markersize=6)
{{?model=egreedy}}m = res.W ./ max.(res.N, 1)
{{?model=egreedy}}scatter(1:K, m, yerror=2 .* sqrt.(m .* (1 .- m) ./ max.(res.N, 1)), xlabel="arm", ylabel="estimate", label="estimate +- 2 se")
{{?model=egreedy}}scatter!(1:K, probs, marker=:x, label="true p")
