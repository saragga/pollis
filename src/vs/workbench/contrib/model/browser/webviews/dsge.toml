result = estimate(dsge, {{data}}, n_draws = {{draws}}, burnin = {{burnin}}, sampler = :{{sampler}})  # Bayesian estimation via Kalman filter

println("Post. mean std_z: ", mean(result[:std_z]))  # posterior mean for shock std dev
