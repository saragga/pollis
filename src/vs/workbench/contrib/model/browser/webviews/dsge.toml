[[actionGroups.actions]]
id = "variance_decomp"
label = "Variance Decomposition"
desc = "Fraction of each variable variance explained by each structural shock"
code = '''
using MacroModelling

{{?dsgemodel=custom}} dsge = {{custom}}  # your model object
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library
var_dec = get_variance_decomposition(dsge, order = {{order}})  # rows: variables; columns: shocks

vars   = get_variables(dsge)  # variable names
shocks = get_shocks(dsge)  # shock names

for (i, v) in enumerate(vars)  # print share per shock for each variable
    println(v, ": ", round.(var_dec[i, :], digits=3))
end
'''

[[actionGroups.actions]]
id = "historical_decomp"
label = "Historical Decomposition"
desc = "Contribution of each structural shock to historical fluctuations around steady state"
code = '''
using MacroModelling

{{?dsgemodel=custom}} dsge = {{custom}}  # your model object
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library
hist_dec = get_historical_decomposition(dsge, {{data}}, order = 1)  # T x variables x shocks array

shocks = get_shocks(dsge)  # shock names
hist_dec[end, 1, :]  # shock contributions to first variable in last period
'''

[[actionGroups.actions]]
id = "cond_forecast"
label = "Conditional Forecast"
desc = "Model-consistent forecast conditional on a user-specified path for observable variables"
code = '''
using MacroModelling

{{?dsgemodel=custom}} dsge = {{custom}}  # your model object
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library
horizon = 8  # forecast horizon in periods

fc = get_forecast(dsge, {{data}}, horizon = horizon)  # unconditional model forecast

get_variables(dsge)  # list of variables available in the forecast
'''
