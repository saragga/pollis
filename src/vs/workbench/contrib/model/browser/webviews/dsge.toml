{{?dsgemodel=custom}}     z[0] = rho * z[-1] + std_z * eps_z[x]
{{?dsgemodel=custom}} end
{{?dsgemodel=custom}}
{{?dsgemodel=custom}} @parameters {{custom}} begin
{{?dsgemodel=custom}}     std_z = 0.01
{{?dsgemodel=custom}}     rho = 0.2
{{?dsgemodel=custom}}     delta = 0.02
{{?dsgemodel=custom}}     alpha = 0.5
