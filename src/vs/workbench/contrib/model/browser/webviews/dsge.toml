[[actionGroups.actions]]
id = "steady_state"
label = "Steady State"
desc = "Compute and display all non-stochastic steady state values for the model variables"
code = '''
using MacroModelling

{{?dsgemodel=custom}} dsge = {{custom}}  # your model object
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library
ss = get_steady_state(dsge)  # dictionary of steady state values

for (var, val_ss) in ss  # iterate over all variables
    println(var, ": ", val_ss)
end
'''

[[actionGroups.actions]]
id = "blanchard_kahn"
label = "Blanchard-Kahn Conditions"
desc = "Verify that the number of explosive eigenvalues matches the number of forward-looking variables"
code = '''
using MacroModelling

{{?dsgemodel=custom}} dsge = {{custom}}  # your model object
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library
sol = get_solution(dsge)  # compute perturbation solution (order 1)

n_fwd = length(get_variables(dsge, filter = :forward_looking))  # number of forward-looking variables
n_exp = sum(abs.(get_eigenvalues(dsge)) .> 1)  # eigenvalues outside unit circle

println("Forward-looking: ", n_fwd)  # must equal explosive eigenvalues for BK
println("Explosive eigen: ", n_exp)  # if equal: unique stable solution exists
'''

[[actionGroups.actions]]
id = "model_acf"
label = "Model-Implied ACF"
desc = "Theoretical autocorrelation function from the solved model at 1st order"
code = '''
using MacroModelling

{{?dsgemodel=custom}} dsge = {{custom}}  # your model object
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library
autocov = get_autocorrelation(dsge, order = 1)  # model-implied ACF at first order

vars = get_variables(dsge)  # list of model variables
for v in vars[1:min(3, end)]  # print ACF for first 3 variables
    println(v, ": ", autocov[v])
end
'''

