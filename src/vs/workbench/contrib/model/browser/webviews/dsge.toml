[[inputs]]
id = "shock"
label = "Shock"
tooltip = "Shock variable name for impulse response computation. Omit the leading colon; it is added automatically."
default = "eps_z"
models = ["irf"]

[[inputs]]
id = "periods"
label = "Periods"
tooltip = "Number of periods for the impulse response function. Typically 20-60 periods depending on data frequency."
default = "40"
models = ["irf"]

[[inputs]]
id = "data"
label = "Data"
tooltip = "Julia variable name of the data matrix used for estimation (T x n_observables). Columns correspond to observable variables."
default = "data"
models = ["est"]

[[inputs]]
id = "sampler"
label = "Sampler"
tooltip = "Gradient-based MCMC sampler: NUTS (No-U-Turn Sampler, recommended) or HMC (Hamiltonian Monte Carlo)."
kind = "select"
default = "NUTS"
models = ["est"]

[[inputs.options]]
value = "NUTS"
label = "NUTS"

[[inputs.options]]
value = "HMC"
label = "HMC"

[[inputs]]
id = "draws"
label = "Draws"
tooltip = "Number of posterior draws retained after burn-in. Minimum 500; 1000-2000 is standard for stable estimates."
default = "1000"
models = ["est"]

[[inputs]]
id = "burnin"
label = "Burn-in"
tooltip = "Number of initial MCMC draws discarded to allow the chain to reach the posterior before collecting samples."
default = "200"
models = ["est"]

[[inputs]]
id = "order"
label = "Order"
tooltip = "Perturbation order for moment computation: 1 (linear), 2 (quadratic), or 3 (cubic). Higher orders capture nonlinear dynamics."
default = "2"
models = ["mom"]

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.mom]
# Bars of model-implied standard deviations
svg = '''
var h = [30, 18, 38, 24, 12];
var s = '<line x1="4" y1="66" x2="50" y2="66" stroke="currentColor" stroke-width="0.8" opacity="0.6"/>';
for (var i = 0; i < h.length; i++) { s += '<rect x="' + (7 + i * 9) + '" y="' + (66 - h[i]) + '" width="6" height="' + h[i] + '" fill="currentColor" opacity="' + (i === 2 ? 0.9 : 0.5) + '"/>'; }
return s;
'''

[miniCharts.est]
# Prior (faint) updated to a sharper posterior density
svg = '''
function curve(mu, sd, amp) {
	var d = '';
	for (var i = 0; i <= 44; i++) { var x = 5 + i; d += (i ? 'L' : 'M') + x + ',' + (66 - amp * Math.exp(-0.5 * Math.pow((x - mu) / sd, 2))).toFixed(1); }
	return d;
}
return '<path d="' + curve(27, 11, 16) + '" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/><path d="' + curve(31, 4.5, 40) + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
'''

[miniCharts.irf]
# Response to a shock decaying back to steady state
svg = '''
var s = '<line x1="4" y1="56" x2="50" y2="56" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6"/>';
var d = '', e = '';
for (var i = 0; i <= 40; i++) {
	d += (i ? 'L' : 'M') + (7 + i) + ',' + (56 - 32 * Math.exp(-i / 8)).toFixed(1);
	e += (i ? 'L' : 'M') + (7 + i) + ',' + (56 - 18 * (Math.exp(-i / 14) - Math.exp(-i / 3))).toFixed(1);
}
return s + '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="' + e + '" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>';
'''

[[codeBranches]]
model = "mom"
code = '''
using MacroModelling, StatsPlots

{{?dsgemodel=custom}} @model {{custom}} begin
{{?dsgemodel=custom}}     1 / c[0] = (beta / c[1]) * (alpha * exp(z[1]) * k[0]^(alpha - 1) + (1 - delta))
{{?dsgemodel=custom}}     c[0] + k[0] = (1 - delta) * k[-1] + q[0]
{{?dsgemodel=custom}}     q[0] = exp(z[0]) * k[-1]^alpha
{{?dsgemodel=custom}}     z[0] = rho * z[-1] + std_z * eps_z[x]
{{?dsgemodel=custom}} end
{{?dsgemodel=custom}}
{{?dsgemodel=custom}} @parameters {{custom}} begin
{{?dsgemodel=custom}}     std_z = 0.01
{{?dsgemodel=custom}}     rho = 0.2
{{?dsgemodel=custom}}     delta = 0.02
{{?dsgemodel=custom}}     alpha = 0.5
{{?dsgemodel=custom}}     beta = 0.95
{{?dsgemodel=custom}} end
{{?dsgemodel=custom}}
{{?dsgemodel=custom}} dsge = {{custom}}  # your model object
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library

moments = get_moments(dsge, order = {{order}})  # model-implied moments at perturbation order {{order}}

var_dec = get_variance_decomposition(dsge, order = {{order}})  # fraction of variance explained by each shock

autocov = get_autocorrelation(dsge, order = {{order}})  # model-implied autocorrelation function
'''

