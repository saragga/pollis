[[codeBranches]]
model = "dec"
code = '''
using Random, Statistics

acc = {{acc}}  # probability that a listening agent hears the correct side
T = {{T}}  # horizon: number of decision stages
restarts = {{restarts}}  # random restarts of JESP
NS, NA, NO = 2, 3, 2  # states (tiger left, right), actions per agent, observations per agent (hear left, right)
LISTEN, OPEN_LEFT, OPEN_RIGHT = 1, 2, 3
ACTIONS = ["listen", "open-left", "open-right"]
b0 = [0.5, 0.5]  # initial belief over the tiger's side

function reward(s, a1, a2)  # Dec-Tiger joint reward (Nair et al., 2003)
    a1 == LISTEN && a2 == LISTEN && return -2.0
    tiger = s == 1 ? OPEN_LEFT : OPEN_RIGHT
    a1 == a2 && return (a1 == tiger ? -50.0 : 20.0)  # both open the same door
    LISTEN in (a1, a2) && return (tiger in (a1, a2) ? -101.0 : 9.0)  # one listens, the other opens
    -100.0  # they open different doors
end
trans(s2, s, a1, a2) = a1 == LISTEN && a2 == LISTEN ? Float64(s2 == s) : 0.5  # opening a door resets the tiger
hear(o, s2) = o == s2 ? acc : 1 - acc
obs(o1, o2, s2, a1, a2) = a1 == LISTEN && a2 == LISTEN ? hear(o1, s2) * hear(o2, s2) : 0.25  # independent local observations

# a policy is a tree: node 1 is the first stage and child(node, o) the node after hearing o
nodes(H) = 2^H - 1
child(nd, o) = 2nd + o - 1

function evaluate(p1, p2; H=T)  # exact expected total reward of a joint policy
    function v(s, n1, n2, t)
        a1, a2 = p1[n1], p2[n2]
        r = reward(s, a1, a2)
        t == H && return r
        r + sum(trans(s2, s, a1, a2) * obs(o1, o2, s2, a1, a2) * v(s2, child(n1, o1), child(n2, o2), t + 1)
                for s2 in 1:NS, o1 in 1:NO, o2 in 1:NO)
    end
    sum(b0[s] * v(s, 1, 1, 1) for s in 1:NS)
end

function best_response(i, pj; H=T)  # exact best policy tree of agent i against agent j's fixed tree pj
    function br(ni, B, t)  # B[(s, nj)] = probability of state s and agent j at node nj, jointly with agent i's history
        best = (-Inf, Dict{Int,Int}())
        for ai in 1:NA
            val = sum(p * (i == 1 ? reward(s, ai, pj[nj]) : reward(s, pj[nj], ai)) for ((s, nj), p) in B; init=0.0)
            sub = Dict(ni => ai)
            if t < H
                for oi in 1:NO
                    Bc = Dict{Tuple{Int,Int},Float64}()
                    for ((s, nj), p) in B, s2 in 1:NS, oj in 1:NO
                        a1, a2, o1, o2 = i == 1 ? (ai, pj[nj], oi, oj) : (pj[nj], ai, oj, oi)
                        q = p * trans(s2, s, a1, a2) * obs(o1, o2, s2, a1, a2)
                        q > 0 && (k = (s2, child(nj, oj)); Bc[k] = get(Bc, k, 0.0) + q)
                    end
                    v, d = br(child(ni, oi), Bc, t + 1)
                    val += v; merge!(sub, d)
                end
            end
            val > best[1] && (best = (val, sub))
        end
        best
    end
    v, d = br(1, Dict((s, 1) => b0[s] for s in 1:NS), 1)
    (policy = [get(d, k, LISTEN) for k in 1:nodes(H)], value = v)
end

function jesp(seed; H=T, maxiter=50)  # Joint Equilibrium-based Search for Policies
    rng = MersenneTwister(seed)
    p1, p2 = rand(rng, 1:NA, nodes(H)), rand(rng, 1:NA, nodes(H))
    trace = [evaluate(p1, p2; H)]
    for it in 1:maxiter
        p1 = best_response(1, p2; H).policy
        p2 = best_response(2, p1; H).policy
        push!(trace, evaluate(p1, p2; H))
        trace[end] <= trace[end-1] + 1e-9 && break  # no agent can improve alone: a local optimum
    end
    (p1 = p1, p2 = p2, value = trace[end], trace = trace)
end

function episode(p1, p2; H=T, rng=Random.default_rng())  # one simulated run of the joint policy
    s = rand(rng, 1:NS); n1 = n2 = 1; steps = NamedTuple[]
    for t in 1:H
        a1, a2 = p1[n1], p2[n2]
        s2 = rand(rng) < trans(1, s, a1, a2) ? 1 : 2
        informative = a1 == LISTEN && a2 == LISTEN
        o1 = rand(rng) < (informative ? hear(1, s2) : 0.5) ? 1 : 2
        o2 = rand(rng) < (informative ? hear(1, s2) : 0.5) ? 1 : 2
        push!(steps, (stage = t, tiger = s == 1 ? "left" : "right", agent1 = ACTIONS[a1], agent2 = ACTIONS[a2], reward = reward(s, a1, a2),
                      heard1 = o1 == 1 ? "left" : "right", heard2 = o2 == 1 ? "left" : "right"))
        s = s2; n1 = child(n1, o1); n2 = child(n2, o2)
    end
    steps
end
history(nd) = nd == 1 ? "start" : join(b == 0 ? "L" : "R" for b in reverse(digits(nd - 2^floor(Int, log2(nd)), base=2, pad=floor(Int, log2(nd)))))

runs = [jesp(k) for k in 1:restarts]
best = runs[argmax([r.value for r in runs])]
(joint_value = best.value, local_optima_values = sort(unique(round.([r.value for r in runs], digits=3))),
 agent1_first_action = ACTIONS[best.p1[1]], agent2_first_action = ACTIONS[best.p2[1]])
'''

[[codeBranches]]
model = "sg"
code = '''
using JuMP, HiGHS, Random, LinearAlgebra, Statistics

S = {{S}}  # states
A = {{A}}  # actions per player
gamma = {{gamma}}  # discount factor
tol = {{tol}}  # stopping tolerance
seed = {{seed}}  # random seed
Random.seed!(seed)
Rw = [round.(randn(A, A), digits=2) for s in 1:S]  # player 1's payoff in each state; player 2 receives minus this
P = [rand(A, A, S) for s in 1:S]
P = [p ./ sum(p, dims=3) for p in P]  # P[s][a1, a2, s'] transition probabilities

function matrix_game(G)  # value and optimal mixed strategies of the zero-sum matrix game G (row player maximises)
    m, k = size(G)
    lp = Model(HiGHS.Optimizer); set_silent(lp)
    @variable(lp, x[1:m] >= 0)
    @variable(lp, v)
    @constraint(lp, sum(x) == 1)
    @constraint(lp, c[j in 1:k], sum(G[i, j] * x[i] for i in 1:m) >= v)
    @objective(lp, Max, v)
    optimize!(lp)
    y = abs.(dual.(c))  # the column player's strategy from the dual
    (value = value(v), x = max.(value.(x), 0), y = y ./ sum(y))
end
stage(s, V; gamma=gamma) = Rw[s] .+ gamma .* [sum(P[s][a1, a2, s2] * V[s2] for s2 in 1:S) for a1 in 1:A, a2 in 1:A]  # payoff now plus discounted continuation

function shapley(; gamma=gamma, tol=tol, maxiter=5000)  # Shapley value iteration
    V = zeros(S); trace = Float64[]
    for it in 1:maxiter
        Vn = [matrix_game(stage(s, V; gamma)).value for s in 1:S]
        push!(trace, maximum(abs.(Vn - V)))
        V = Vn
        trace[end] < tol && break
    end
    (V = V, trace = trace)
end

sh = shapley()
eqs = [matrix_game(stage(s, sh.V)) for s in 1:S]  # stationary equilibrium strategies
(values_player1 = round.(sh.V, digits=4), iterations = length(sh.trace),
 strategy_player1_state1 = round.(eqs[1].x, digits=3), strategy_player2_state1 = round.(eqs[1].y, digits=3))
'''

