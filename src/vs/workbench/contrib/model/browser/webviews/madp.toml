label = "Policy / Mixed Strategy"
desc = "Dec-POMDP: each agent's action after every observation history. Stochastic game: both players' equilibrium strategies and the value in every state"
code = '''
{{?model=dec}}[(history = history(nd), agent1 = ACTIONS[best.p1[nd]], agent2 = ACTIONS[best.p2[nd]]) for nd in 1:nodes(T)]
{{?model=sg}}[(state = s, value = round(eqs[s].value, digits=4), player1 = round.(eqs[s].x, digits=3), player2 = round.(eqs[s].y, digits=3)) for s in 1:S]
'''

[[actionGroups.actions]]
id = "price-of-anarchy"
label = "Outcome Decomposition"
desc = "Dec-POMDP: how often the team listens, opens the safe door or meets the tiger (simulated). Stochastic game: each state's value split into the immediate payoff and the discounted continuation"
code = '''
{{?model=dec}}Random.seed!(4)
{{?model=dec}}steps = reduce(vcat, [episode(best.p1, best.p2) for k in 1:5000])
{{?model=dec}}per(f) = count(f, steps) / 5000  # per episode
{{?model=dec}}(listens_per_episode = per(st -> st.agent1 == "listen") + per(st -> st.agent2 == "listen"),
{{?model=dec}} tiger_met_per_episode = per(st -> st.reward <= -50), safe_door_per_episode = per(st -> st.reward in (9.0, 20.0)),
{{?model=dec}} mean_total_reward = sum(st.reward for st in steps) / 5000)
{{?model=sg}}map(1:S) do s
{{?model=sg}}    immediate = dot(eqs[s].x, Rw[s] * eqs[s].y)
{{?model=sg}}    (state = s, value = eqs[s].value, immediate_payoff = immediate, continuation = eqs[s].value - immediate)
{{?model=sg}}end
'''
