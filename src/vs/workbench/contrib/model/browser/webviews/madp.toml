{{?model=dec}}Random.seed!(2)
{{?model=dec}}tot = [sum(st.reward for st in episode(best.p1, best.p2)) for k in 1:20_000]
{{?model=dec}}(example_episode = episode(best.p1, best.p2), mean_total_reward = mean(tot), standard_error = std(tot) / sqrt(length(tot)), exact_value = best.value)
