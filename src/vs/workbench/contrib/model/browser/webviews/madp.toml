[[bullets]]
text = "A Decentralized Partially Observable Markov Decision Process (Dec-POMDP) models a cooperative team of agents that share a single joint reward but each observe the world independently through local, noisy sensors and cannot communicate during execution. Each agent must act based solely on its own observation history, making Dec-POMDPs the standard framework for multi-robot coordination, sensor networks, and cooperative planning under partial information."
detail = ""

[[bullets]]
text = "Dec-POMDPs are provably NEXP-hard in the general case"
detail = "meaning the worst-case solution time grows doubly exponentially, placing them strictly harder than NP-complete problems — which limits exact backward induction to small horizons (T ≤ 5) and few agents. Practical algorithms sacrifice optimality for tractability: Joint Equilibrium-based Search for Policies (JESP) alternately optimises one agent’s policy while fixing the others; Point-Based Value Iteration (PBVI) approximates the value function over a sampled set of belief points rather than the full belief space."

[[bullets]]
text = "Stochastic Games model self-interested agents, each with its own reward function, where the outcome for every agent depends on the joint actions of all players. The solution concept is Nash equilibrium"
detail = "a strategy profile from which no agent can unilaterally deviate to gain — rather than a cooperative optimum. Zero-sum instances (one player’s gain is the other’s loss) admit efficient minimax value iteration; general-sum games are solved stage by stage via linear programming or support enumeration."

[[decisionRows]]
task = "Dec-POMDP"
context = "A team shares one reward but each agent acts on its own noisy observations, without communication"
purpose = "Decentralised POMDP solved by JESP (alternating exact best responses over policy trees) with random restarts; default: the Dec-Tiger problem"

[[decisionRows]]
task = "Stochastic Games"
context = "Two opponents with opposite interests act in a shared, changing environment"
purpose = "Zero-sum stochastic game solved by Shapley value iteration, with one linear programme per state for the equilibrium mixed strategies"

