{{?model=sg}}draw(p) = something(findfirst(cumsum(p) .>= rand()), length(p))
{{?model=sg}}function play(s, stages)  # discounted payoff to player 1 when both follow the equilibrium
{{?model=sg}}    total = 0.0
{{?model=sg}}    for t in 0:stages-1
{{?model=sg}}        a1, a2 = draw(eqs[s].x), draw(eqs[s].y)
{{?model=sg}}        total += gamma^t * Rw[s][a1, a2]
{{?model=sg}}        s = draw(P[s][a1, a2, :])
{{?model=sg}}    end
{{?model=sg}}    total
{{?model=sg}}end
{{?model=sg}}rets = [play(1, 200) for k in 1:2000]
{{?model=sg}}(mean_discounted_payoff = mean(rets), standard_error = std(rets) / sqrt(length(rets)), equilibrium_value_state1 = sh.V[1])
'''

[[actionGroups.actions]]
id = "value-of-comm"
label = "Value of Communication / Discount Sensitivity"
desc = "Dec-POMDP: value if the agents shared their observations (centralised POMDP) or saw the tiger (MDP). Stochastic game: equilibrium value as the discount changes"
code = '''
{{?model=dec}}function central_value(b, t)  # both agents' observations shared: a POMDP over joint actions
{{?model=dec}}    best_v = -Inf
{{?model=dec}}    for a1 in 1:NA, a2 in 1:NA
{{?model=dec}}        v = sum(b[s] * reward(s, a1, a2) for s in 1:NS)
{{?model=dec}}        if t < T
{{?model=dec}}            for o1 in 1:NO, o2 in 1:NO
{{?model=dec}}                bn = [sum(b[s] * trans(s2, s, a1, a2) for s in 1:NS) * obs(o1, o2, s2, a1, a2) for s2 in 1:NS]
{{?model=dec}}                po = sum(bn)
{{?model=dec}}                po > 0 && (v += po * central_value(bn ./ po, t + 1))
{{?model=dec}}            end
{{?model=dec}}        end
{{?model=dec}}        best_v = max(best_v, v)
{{?model=dec}}    end
{{?model=dec}}    best_v
{{?model=dec}}end
{{?model=dec}}central = T <= 5 ? central_value(b0, 1) : missing
{{?model=dec}}(decentralised = best.value, centralised_pomdp = central, fully_observed = 20.0 * T,
{{?model=dec}} cost_of_decentralisation = central === missing ? missing : central - best.value)
{{?model=sg}}[(gamma = g, value_state1 = shapley(gamma=g).V[1]) for g in unique([0.0, 0.5, 0.8, 0.9, gamma])]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "zerosum-vs-general"
label = "Local vs Global / Pure vs Mixed"
desc = "Dec-POMDP: JESP against exhaustive search over all joint policies (horizon 2 at most). Stochastic game: pure-strategy security levels against the mixed value"
code = '''
{{?model=dec}}H = min(T, 2)
{{?model=dec}}pols = [collect(p) for p in Iterators.product(fill(1:NA, nodes(H))...)]
{{?model=dec}}(horizon = H, exhaustive_optimum = maximum(evaluate(p1, p2; H) for p1 in pols, p2 in pols),
{{?model=dec}} jesp_best = maximum(jesp(k; H).value for k in 1:restarts), joint_policies_enumerated = length(pols)^2)
{{?model=sg}}map(1:S) do s
{{?model=sg}}    G = stage(s, sh.V)
{{?model=sg}}    (state = s, pure_maximin = maximum(minimum(G, dims=2)), mixed_value = eqs[s].value, pure_minimax = minimum(maximum(G, dims=1)))
{{?model=sg}}end
'''

[[actionGroups.actions]]
id = "cooperative-vs-competitive"
label = "Against Baselines"
desc = "Dec-POMDP: JESP against always listening, listening then opening by majority, and random trees. Stochastic game: a myopic player 1 (ignores the future) against the equilibrium player 2"
code = '''
{{?model=dec}}function listen_then_open(H)  # listen until the last stage, then open the door opposite the majority heard
{{?model=dec}}    p = fill(LISTEN, nodes(H))
{{?model=dec}}    H == 1 && return p
{{?model=dec}}    for nd in 2^(H-1):nodes(H)
{{?model=dec}}        h = digits(nd - 2^(H-1), base=2, pad=H-1)  # 0 = heard left
{{?model=dec}}        nl = count(==(0), h); nr = length(h) - nl
{{?model=dec}}        p[nd] = nl > nr ? OPEN_RIGHT : nr > nl ? OPEN_LEFT : LISTEN
{{?model=dec}}    end
{{?model=dec}}    p
{{?model=dec}}end
{{?model=dec}}lto = listen_then_open(T)
{{?model=dec}}Random.seed!(3)
{{?model=dec}}(jesp = best.value, always_listen = evaluate(fill(LISTEN, nodes(T)), fill(LISTEN, nodes(T))), listen_then_open = evaluate(lto, lto),
{{?model=dec}} random_trees = mean(evaluate(rand(1:NA, nodes(T)), rand(1:NA, nodes(T))) for k in 1:200))
{{?model=sg}}myopic = [matrix_game(Rw[s]).x for s in 1:S]  # best for the current stage only
{{?model=sg}}cont(X) = (I - gamma .* [sum(X[s][a1] * eqs[s].y[a2] * P[s][a1, a2, s2] for a1 in 1:A, a2 in 1:A) for s in 1:S, s2 in 1:S]) \
{{?model=sg}}          [dot(X[s], Rw[s] * eqs[s].y) for s in 1:S]  # exact discounted value of a stationary strategy against player 2's equilibrium
{{?model=sg}}(equilibrium_player1 = round.(cont([e.x for e in eqs]), digits=4), myopic_player1 = round.(cont(myopic), digits=4))
'''

