# Quasi-Newton Methods Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/qn.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Quasi-Newton Methods"
viewType = "pollis.qn"
defaultModel = "bfgs"

[[packages]]
name = "Optim.jl"
github = "https://github.com/JuliaNLSolvers/Optim.jl"

[requires]
packages = ["Optim.jl", "ADTypes.jl", "LineSearches.jl", "Plots.jl", "FiniteDiff.jl", "ForwardDiff.jl"]

