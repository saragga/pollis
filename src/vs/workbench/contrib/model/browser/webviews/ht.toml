[[codeBranches]]
model = "parametric"
code = '''
using HypothesisTests
{{?test=one-sample-z-test}} using Statistics
{{?test=one-sample-t-test}} result = OneSampleTTest({{x}}, {{mu01}})
{{?test=two-sample-t-test}} result = EqualVarianceTTest({{x}}, {{y}})
{{?test=welch-t-test}} result = UnequalVarianceTTest({{x}}, {{y}})
{{?test=one-sample-z-test}} result = OneSampleZTest(mean({{x}}), {{sig}}, length({{x}}), {{mu01}})  # known sigma
{{?test=two-sample-z-test}} result = EqualVarianceZTest({{x}}, {{y}})  # pooled variance estimated from the samples
{{?test=f-test}} result = VarianceFTest({{x}}, {{y}})
{{?test=one-way-anova}} result = OneWayANOVATest({{grp1}})
{{?test=levene-s-test}} result = LeveneTest({{grp1}})
{{?test=brown-forsythe-test}} result = BrownForsytheTest({{grp1}})
{{?test=chi-squared-test}} result = ChisqTest({{obs}}, {{exp}} ./ sum({{exp}}))  # observed counts vs expected proportions
{{?test=power-divergence-test}} result = PowerDivergenceTest({{obs}}; lambda={{lam}})
{{?test=multinomial-lr-test}} result = PowerDivergenceTest({{obs}}; lambda=0.0)
display(result)  # full report, including the test statistic
println("p-value:        ", pvalue(result))
{{?test=one-sample-t-test|two-sample-t-test|welch-t-test|one-sample-z-test|two-sample-z-test}} println("95% CI:         ", confint(result; level = 0.95))
'''

[[codeBranches]]
model = "nonparametric"
code = '''
{{?test!=shapiro-wilk-test}} using HypothesisTests
{{?test=shapiro-wilk-test}} using ShapiroWilk
{{?test=binomial-test}} result = BinomialTest({{k}}, {{n}}, {{p0}})
{{?test=fisher-exact-test}} result = FisherExactTest({{a}}, {{b}}, {{c}}, {{d}})
{{?test=ks-one-sample-test}} result = ExactOneSampleKSTest({{x}}, {{dist}})
{{?test=ks-two-sample-test}} result = ApproximateTwoSampleKSTest({{x}}, {{y}})
{{?test=sign-test}} result = SignTest({{x}}, {{mu01}})
{{?test=wilcoxon-signed-rank}} result = SignedRankTest({{x}} .- {{mu01}})
{{?test=mann-whitney-u-test}} result = MannWhitneyUTest({{x}}, {{y}})
{{?test=kruskal-wallis-test}} result = KruskalWallisTest({{grp1}})
{{?test=anderson-darling-test}} result = OneSampleADTest({{x}}, {{dist}})
{{?test=fligner-killeen-test}} result = FlignerKilleenTest({{grp1}})
{{?test=wald-wolfowitz-test}} result = WaldWolfowitzTest({{x}}, {{y}})
{{?test=shapiro-wilk-test}} result = shapiro_test({{x}})
{{?test=permutation-test}} result = ExactPermutationTest({{x}}, {{y}}, {{f}})
display(result)  # full report, including the test statistic
println("p-value:        ", pvalue(result))
{{?test=binomial-test|fisher-exact-test|sign-test|wilcoxon-signed-rank|mann-whitney-u-test}} println("95% CI:         ", confint(result; level = 0.95))
'''

[[codeBranches]]
model = "timeseries"
code = '''
using HypothesisTests
{{?test=augmented-dickey-fuller}} result = ADFTest({{x}}, {{det}}, {{lags1}})
{{?test=durbin-watson}} result = DurbinWatsonTest(modelmatrix({{fitted}}), residuals({{fitted}}))  # regressors and residuals of the fitted model
{{?test=ljung-box}} result = LjungBoxTest({{x}}, {{lags2}})
{{?test=box-pierce}} result = BoxPierceTest({{x}}, {{lags2}})
{{?test=breusch-godfrey}} result = BreuschGodfreyTest(modelmatrix({{fitted}}), residuals({{fitted}}), {{lags1}})  # regressors and residuals of the fitted model
{{?test=jarque-bera}} result = JarqueBeraTest({{x}})
{{?test=clark-west}} result = ClarkWestTest({{e1}}, {{e2}}, {{h}})
{{?test=diebold-mariano}} result = DieboldMarianoTest({{e1}}, {{e2}})
{{?test=white-test}} result = WhiteTest(modelmatrix({{fitted}}), residuals({{fitted}}))  # regressors and residuals of the fitted model
display(result)  # full report, including the test statistic
println("p-value:        ", pvalue(result))
'''

[[codeBranches]]
model = "multivariate"
code = '''
using HypothesisTests
{{?test=hotelling-s-t}} result = OneSampleHotellingT2Test({{X}}, {{mu02}})
{{?test=equality-of-covariance}} result = BartlettTest({{grp2}})  # two data matrices, observations in rows
{{?test=correlation-test}} result = CorrelationTest({{x}}, {{y}})
display(result)  # full report, including the test statistic
println("p-value:        ", pvalue(result))
{{?test=correlation-test}} println("95% CI:         ", confint(result, 0.95))
'''


[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "samples"
label = "Plot the Samples"
desc = "Overlaid histograms of the samples being tested (time series tests: the series itself), with each sample mean marked"
code = '''
using Plots, Statistics
{{?test=one-sample-t-test|one-sample-z-test|ks-one-sample-test|sign-test|wilcoxon-signed-rank|anderson-darling-test|shapiro-wilk-test|jarque-bera|augmented-dickey-fuller|ljung-box|box-pierce}} samples = [{{x}}]
{{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test|ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test|permutation-test}} samples = [{{x}}, {{y}}]
{{?test=one-way-anova|levene-s-test|brown-forsythe-test|kruskal-wallis-test|fligner-killeen-test}} samples = [{{grp1}}]
{{?test=chi-squared-test|power-divergence-test|multinomial-lr-test|binomial-test|fisher-exact-test|durbin-watson|breusch-godfrey|clark-west|diebold-mariano|white-test|hotelling-s-t|equality-of-covariance|correlation-test}} error("This action works on raw samples (location, scale and distribution tests): not available for the selected test")
{{?model=timeseries}} plot(samples[1], lw=1.2, label=false, xlabel="t", title="Series")
{{?model!=timeseries}} plot(title="Samples", xlabel="value", ylabel="density")
{{?model!=timeseries}} foreach(i -> histogram!(samples[i], normalize=:pdf, alpha=0.45, label="sample $i"), eachindex(samples))
{{?model!=timeseries}} vline!(mean.(samples), c=:black, ls=:dash, label="means")
'''

[[actionGroups.actions]]
id = "boxplots"
label = "Box Plots"
desc = "Box plots with the individual points: location, spread, skew and outliers of each sample at a glance"
code = '''
using StatsPlots
{{?test=one-sample-t-test|one-sample-z-test|ks-one-sample-test|sign-test|wilcoxon-signed-rank|anderson-darling-test|shapiro-wilk-test|jarque-bera|augmented-dickey-fuller|ljung-box|box-pierce}} samples = [{{x}}]
{{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test|ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test|permutation-test}} samples = [{{x}}, {{y}}]
{{?test=one-way-anova|levene-s-test|brown-forsythe-test|kruskal-wallis-test|fligner-killeen-test}} samples = [{{grp1}}]
{{?test=chi-squared-test|power-divergence-test|multinomial-lr-test|binomial-test|fisher-exact-test|durbin-watson|breusch-godfrey|clark-west|diebold-mariano|white-test|hotelling-s-t|equality-of-covariance|correlation-test}} error("This action works on raw samples (location, scale and distribution tests): not available for the selected test")
g = reduce(vcat, [fill("sample $i", length(s)) for (i, s) in enumerate(samples)])
v = reduce(vcat, samples)
boxplot(g, v, alpha=0.4, label=false, title="Samples")
dotplot!(g, v, ms=2, msw=0, label=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "assumptions"
label = "Check Test Assumptions"
desc = "Per-sample size, Jarque-Bera normality p-value and standard deviation, plus Levene's test for equal variances: t-tests and ANOVA assume normal samples, the pooled versions also equal variances"
code = '''
using HypothesisTests, Statistics
{{?test=one-sample-t-test|one-sample-z-test|ks-one-sample-test|sign-test|wilcoxon-signed-rank|anderson-darling-test|shapiro-wilk-test|jarque-bera|augmented-dickey-fuller|ljung-box|box-pierce}} samples = [{{x}}]
{{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test|ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test|permutation-test}} samples = [{{x}}, {{y}}]
{{?test=one-way-anova|levene-s-test|brown-forsythe-test|kruskal-wallis-test|fligner-killeen-test}} samples = [{{grp1}}]
{{?test=chi-squared-test|power-divergence-test|multinomial-lr-test|binomial-test|fisher-exact-test|durbin-watson|breusch-godfrey|clark-west|diebold-mariano|white-test|hotelling-s-t|equality-of-covariance|correlation-test}} error("This action works on raw samples (location, scale and distribution tests): not available for the selected test")
for (i, s) in enumerate(samples)
    println("sample $i: n = ", length(s), "   sd = ", round(std(s), digits=4), "   normality (Jarque-Bera) p = ", round(pvalue(JarqueBeraTest(s)), digits=4))
end
length(samples) > 1 && println("Equal variances (Levene) p = ", round(pvalue(LeveneTest(samples...)), digits=4))
'''

[[actionGroups.actions]]
id = "qq"
label = "Normal Q-Q Plots"
desc = "One normal Q-Q plot per sample: points bending away from the line show skew or heavy tails"
code = '''
using Plots, Distributions, Statistics
{{?test=one-sample-t-test|one-sample-z-test|ks-one-sample-test|sign-test|wilcoxon-signed-rank|anderson-darling-test|shapiro-wilk-test|jarque-bera|augmented-dickey-fuller|ljung-box|box-pierce}} samples = [{{x}}]
{{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test|ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test|permutation-test}} samples = [{{x}}, {{y}}]
{{?test=one-way-anova|levene-s-test|brown-forsythe-test|kruskal-wallis-test|fligner-killeen-test}} samples = [{{grp1}}]
{{?test=chi-squared-test|power-divergence-test|multinomial-lr-test|binomial-test|fisher-exact-test|durbin-watson|breusch-godfrey|clark-west|diebold-mariano|white-test|hotelling-s-t|equality-of-covariance|correlation-test}} error("This action works on raw samples (location, scale and distribution tests): not available for the selected test")
plot([begin
    z = sort((s .- mean(s)) ./ std(s)); q = quantile.(Normal(), ((1:length(z)) .- 0.5) ./ length(z))
    scatter(q, z, ms=2, msw=0, label=false, title="sample $i")
    plot!(q, q, c=:red, ls=:dash, label=false)
end for (i, s) in enumerate(samples)]..., layout=(1, length(samples)), size=(330 * length(samples), 320))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "power"
label = "Power by Resampling"
desc = "Resamples the data at 0.5x to 3x the current sample size and reruns the test 500 times each: the share of rejections at 5% estimates the power to detect the observed effect"
code = '''
using HypothesisTests, Random, Plots
{{?model=timeseries}} error("Resampling observations breaks the time ordering: not available for time series tests")
{{?test=one-sample-t-test|one-sample-z-test|ks-one-sample-test|sign-test|wilcoxon-signed-rank|anderson-darling-test|shapiro-wilk-test|jarque-bera|augmented-dickey-fuller|ljung-box|box-pierce}} samples = [{{x}}]
{{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test|ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test|permutation-test}} samples = [{{x}}, {{y}}]
{{?test=one-way-anova|levene-s-test|brown-forsythe-test|kruskal-wallis-test|fligner-killeen-test}} samples = [{{grp1}}]
{{?test=chi-squared-test|power-divergence-test|multinomial-lr-test|binomial-test|fisher-exact-test|durbin-watson|breusch-godfrey|clark-west|diebold-mariano|white-test|hotelling-s-t|equality-of-covariance|correlation-test}} error("This action works on raw samples (location, scale and distribution tests): not available for the selected test")
{{?test=one-sample-t-test}} testfun = s -> OneSampleTTest(s[1], {{mu01}})
{{?test=two-sample-t-test}} testfun = s -> EqualVarianceTTest(s[1], s[2])
{{?test=welch-t-test}} testfun = s -> UnequalVarianceTTest(s[1], s[2])
{{?test=one-sample-z-test}} testfun = s -> OneSampleZTest(mean(s[1]), {{sig}}, length(s[1]), {{mu01}})  # known sigma, as in the main test
{{?test=two-sample-z-test}} testfun = s -> EqualVarianceZTest(s[1], s[2])
{{?test=f-test}} testfun = s -> VarianceFTest(s[1], s[2])
{{?test=one-way-anova}} testfun = s -> OneWayANOVATest(s...)
{{?test=levene-s-test}} testfun = s -> LeveneTest(s...)
{{?test=brown-forsythe-test}} testfun = s -> BrownForsytheTest(s...)
{{?test=ks-one-sample-test}} testfun = s -> ExactOneSampleKSTest(s[1], {{dist}})
{{?test=ks-two-sample-test}} testfun = s -> ApproximateTwoSampleKSTest(s[1], s[2])
{{?test=sign-test}} testfun = s -> SignTest(s[1], {{mu01}})
{{?test=wilcoxon-signed-rank}} testfun = s -> SignedRankTest(s[1] .- {{mu01}})
{{?test=mann-whitney-u-test}} testfun = s -> MannWhitneyUTest(s[1], s[2])
{{?test=kruskal-wallis-test}} testfun = s -> KruskalWallisTest(s...)
{{?test=anderson-darling-test}} testfun = s -> OneSampleADTest(s[1], {{dist}})
{{?test=fligner-killeen-test}} testfun = s -> FlignerKilleenTest(s...)
{{?test=wald-wolfowitz-test}} testfun = s -> WaldWolfowitzTest(s[1], s[2])
{{?test=shapiro-wilk-test|permutation-test}} error("Resampled power is too slow or unavailable for this test: try the t-test or Mann-Whitney equivalent")
rng = MersenneTwister(1); mult = [0.5, 1, 1.5, 2, 3]
pw = [count(_ -> pvalue(testfun([rand(rng, s, max(3, round(Int, m * length(s)))) for s in samples])) < 0.05, 1:500) / 500 for m in mult]
foreach((m, p) -> println(rpad("$(m)x n", 8), " power = ", round(p, digits=3)), mult, pw)
plot(mult, pw, marker=:circle, label=false, xlabel="Sample size (multiple of current)", ylabel="Power", ylims=(0, 1), title="Power by resampling")
hline!([0.8], c=:red, ls=:dash, label="80%")
'''

[[actionGroups.actions]]
id = "bootstrap-ci"
label = "Bootstrap Confidence Interval"
desc = "Percentile bootstrap interval (5,000 resamples) for the effect: the mean minus the null value for one sample, the difference in means for two, the largest gap between group means for more"
code = '''
using Random, Statistics
{{?model=timeseries}} error("Resampling observations breaks the time ordering: not available for time series tests")
{{?test=one-sample-t-test|one-sample-z-test|ks-one-sample-test|sign-test|wilcoxon-signed-rank|anderson-darling-test|shapiro-wilk-test|jarque-bera|augmented-dickey-fuller|ljung-box|box-pierce}} samples = [{{x}}]
{{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test|ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test|permutation-test}} samples = [{{x}}, {{y}}]
{{?test=one-way-anova|levene-s-test|brown-forsythe-test|kruskal-wallis-test|fligner-killeen-test}} samples = [{{grp1}}]
{{?test=chi-squared-test|power-divergence-test|multinomial-lr-test|binomial-test|fisher-exact-test|durbin-watson|breusch-godfrey|clark-west|diebold-mariano|white-test|hotelling-s-t|equality-of-covariance|correlation-test}} error("This action works on raw samples (location, scale and distribution tests): not available for the selected test")
effect = length(samples) == 1 ? (s -> mean(s[1]) - {{mu01}}) : length(samples) == 2 ? (s -> mean(s[1]) - mean(s[2])) : (s -> maximum(mean.(s)) - minimum(mean.(s)))
rng = MersenneTwister(1)
boot = [effect([rand(rng, s, length(s)) for s in samples]) for _ in 1:5000]
println("Effect = ", round(effect(samples), digits=4), "   95% bootstrap CI: ", round.(quantile(boot, [0.025, 0.975]), digits=4))
'''

[[actionGroups.actions]]
id = "bootstrap-intervals"
label = "Bootstrap Interval Methods"
desc = "Percentile, basic, normal and BCa intervals from Bootstrap.jl for a one-sample effect (mean or median minus the null value); the Bootstrap Resampling panel in the Simulate menu compares interval methods, resampling schemes and their coverage"
code = '''
using Bootstrap, Statistics, Random
{{?test!=one-sample-t-test|one-sample-z-test|sign-test|wilcoxon-signed-rank}} error("This action covers one-sample location tests: use Bootstrap Confidence Interval for two or more samples")
Random.seed!(1)  # Bootstrap.jl draws with the global RNG
x = Float64.({{x}})
{{?test=one-sample-t-test|one-sample-z-test}} stat = v -> mean(v) - {{mu01}}  # the effect the test measures
{{?test=sign-test|wilcoxon-signed-rank}} stat = v -> median(v) - {{mu01}}
bs = bootstrap(stat, x, BasicSampling(5000))
println("Effect = ", round(original(bs, 1), digits=4), "   bias = ", round(bias(bs, 1), digits=4), "   SE = ", round(stderror(bs, 1), digits=4))
for (nm, ci) in [("Percentile", PercentileConfInt(0.95)), ("Basic", BasicConfInt(0.95)), ("Normal", NormalConfInt(0.95)), ("BCa", BCaConfInt(0.95))]
    _, lo, hi = confint(bs, ci, 1)
    println(rpad(nm, 12), "[", round(lo, digits=4), ", ", round(hi, digits=4), "]", lo <= 0 <= hi ? "   contains 0" : "   excludes 0")
end
'''

