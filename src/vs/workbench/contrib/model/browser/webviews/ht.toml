[[inputs]]
id = "x"
label = "x"
tooltip = "The sample, a vector of numbers (for the time series tests, the series in time order). With the default x, the code example loads example data chosen for the selected test; the comment above it names the source."
default = "x"
models = ["parametric",  "nonparametric",  "timeseries",  "multivariate"]
when = "test=one-sample-t-test|two-sample-t-test|welch-t-test|one-sample-z-test|two-sample-z-test|f-test|ks-one-sample-test|ks-two-sample-test|sign-test|wilcoxon-signed-rank|mann-whitney-u-test|anderson-darling-test|wald-wolfowitz-test|shapiro-wilk-test|permutation-test|augmented-dickey-fuller|ljung-box|box-pierce|jarque-bera|correlation-test"

[[inputs]]
id = "mu01"
label = "mu0"
tooltip = ""
default = "0.0"
models = ["parametric",  "nonparametric"]
when = "test=one-sample-t-test|one-sample-z-test|sign-test|wilcoxon-signed-rank"

[[inputs]]
id = "y"
label = "y"
tooltip = "The second sample, a vector of numbers (for the correlation test, paired with x). With the defaults x and y, the code example loads example data chosen for the selected test."
default = "y"
models = ["parametric",  "nonparametric",  "multivariate"]
when = "test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test|ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test|permutation-test|correlation-test"

[[inputs]]
id = "sig"
label = "sigma"
tooltip = ""
default = "1.0"
models = ["parametric"]
when = "test=one-sample-z-test"

[[inputs]]
id = "grp1"
label = "groups"
tooltip = "Three or more samples, comma-separated vectors. The default x, y, z loads the sepal lengths of the three iris species (Fisher 1936)."
default = "x, y, z"
models = ["parametric",  "nonparametric"]
when = "test=one-way-anova|levene-s-test|brown-forsythe-test|kruskal-wallis-test|fligner-killeen-test"

[[inputs]]
id = "obs"
label = "observed"
tooltip = "A vector of observed counts, one per category. The default loads Mendel's 556 peas for the chi-squared test, and 600 simulated rolls of a loaded die for the power-divergence and likelihood-ratio tests, which test equal probabilities."
default = "observed"
models = ["parametric"]
when = "test=chi-squared-test|power-divergence-test|multinomial-lr-test"

[[inputs]]
id = "exp"
label = "expected"
tooltip = "The expected counts or ratios, one per category; they are rescaled to proportions. The default is Mendel's 9:3:3:1."
default = "expected"
models = ["parametric"]
when = "test=chi-squared-test"

[[inputs]]
id = "lam"
label = "lambda"
tooltip = ""
default = "1.0"
models = ["parametric"]
when = "test=power-divergence-test"

[[inputs]]
id = "k"
label = "k"
tooltip = "The number of successes. The default k and n load the females among the penguins whose sex was recorded (Palmer penguins)."
default = "k"
models = ["nonparametric"]
when = "test=binomial-test"

[[inputs]]
id = "n"
label = "n"
tooltip = "The number of trials."
default = "n"
models = ["nonparametric"]
when = "test=binomial-test"

[[inputs]]
id = "p0"
label = "p0"
tooltip = ""
default = "0.5"
models = ["nonparametric"]
when = "test=binomial-test"

[[inputs]]
