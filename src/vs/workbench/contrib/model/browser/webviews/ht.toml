[[inputs]]
id = "e1"
label = "e1"
tooltip = "Forecast errors of the first model (for Clark-West, the smaller, nested one). The defaults e1 and e2 load one-year-ahead forecast errors of the Nile flow: the historical mean against an AR(1)."
