# Hypothesis Testing Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/ht.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Hypothesis Testing"
viewType = "pollis.ht"
defaultModel = "parametric"

[[packages]]
name = "HypothesisTests.jl"
github = "https://github.com/JuliaStats/HypothesisTests.jl"

[requires]
packages = ["HypothesisTests.jl", "Bootstrap.jl", "Distributions.jl", "Plots.jl", "StatsPlots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Parametric Tests"
file = "ht/tutorial-01-parametric.ipynb"
bundled = true
description = "z-test, t-test, F-test, ANOVA and chi-squared tests"

[[notebookSections.notebooks]]
name = "Nonparametric Tests"
file = "ht/tutorial-02-nonparametric.ipynb"
bundled = true
description = "Rank-based, permutation, and distribution-free tests"

[[notebookSections.notebooks]]
name = "Time-Series Tests"
file = "ht/tutorial-03-timeseries.ipynb"
bundled = true
description = "Stationarity, autocorrelation, and forecast evaluation tests"

[[notebookSections.notebooks]]
name = "Multivariate Tests"
file = "ht/tutorial-04-multivariate.ipynb"
bundled = true
description = "Hotelling's T², covariance equality, and correlation tests"

[[wikis]]
name = "Overview"
file = "ht/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "ht/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
