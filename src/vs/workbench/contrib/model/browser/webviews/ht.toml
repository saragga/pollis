[[codeBranches]]
model = "parametric"
code = '''
using HypothesisTests
{{?test=one-sample-z-test}} using Statistics
{{?x=x}} {{?test=one-sample-t-test}} # Example data: Belenky et al. (2003), the change in mean reaction time (ms) of 18 drivers from day 0 to day 9 of sleep restricted to 3 hours a night; mu0 = 0 asks whether the restriction slowed them. Replace x with your own sample.
{{?x=x}} {{?test=one-sample-t-test}} using PollisDatasets
{{?x=x}} {{?test=one-sample-t-test}} study = dataset("sleepstudy"); rt = Dict((study.subject[i], study.days[i]) => study.reaction[i] for i in eachindex(study.reaction));
{{?x=x}} {{?test=one-sample-t-test}} x = [rt[(i, 9)] - rt[(i, 0)] for i in unique(study.subject)];
{{?x=x}} {{?test=one-sample-z-test}} # Example data: simulated, 40 draws from a normal distribution with mean 0.5 and the known standard deviation 1 (sigma) that the z-test assumes. Replace x with your own sample.
{{?x=x}} {{?test=one-sample-z-test}} using Random
{{?x=x}} {{?test=one-sample-z-test}} x = randn(Xoshiro(42), 40) .+ 0.5;
{{?x=x}} {{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test}} # Example data: Henderson and Velleman (1981), Motor Trend 1974, miles per gallon of the 19 cars with automatic (x) and the 13 with manual (y) transmissions. Replace x and y with your own samples.
{{?x=x}} {{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test}} using PollisDatasets
{{?x=x}} {{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test}} cars = dataset("mtcars");
{{?x=x}} {{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test}} x = cars.mpg[cars.am .== 0];
{{?x=x}} {{?y=y}} {{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test}} y = cars.mpg[cars.am .== 1];
{{?grp1=x, y, z}} {{?test=one-way-anova|levene-s-test|brown-forsythe-test}} # Example data: Fisher (1936), sepal length (cm) of 50 irises of each species: setosa (x), versicolor (y) and virginica (z). Replace x, y, z with your own groups.
{{?grp1=x, y, z}} {{?test=one-way-anova|levene-s-test|brown-forsythe-test}} using PollisDatasets
{{?grp1=x, y, z}} {{?test=one-way-anova|levene-s-test|brown-forsythe-test}} flowers = dataset("iris");
{{?grp1=x, y, z}} {{?test=one-way-anova|levene-s-test|brown-forsythe-test}} x, y, z = (flowers.sepal_length[flowers.species .== sp] for sp in ("setosa", "versicolor", "virginica"));
{{?obs=observed}} {{?test=chi-squared-test}} observed = [315, 108, 101, 32];  # Example data: Mendel (1866), 556 pea seeds: round yellow, round green, wrinkled yellow, wrinkled green. Replace it with your own counts.
{{?obs=observed}} {{?exp=expected}} {{?test=chi-squared-test}} expected = [9, 3, 3, 1];  # the 9:3:3:1 ratio his theory predicts. Replace it with your own expected counts or ratios.
{{?obs=observed}} {{?test=power-divergence-test|multinomial-lr-test}} # Example data: simulated, 600 rolls of a die loaded so that a six comes up a quarter of the time; the test asks whether all six faces are equally likely. Replace observed with your own counts.
{{?obs=observed}} {{?test=power-divergence-test|multinomial-lr-test}} using Random
{{?obs=observed}} {{?test=power-divergence-test|multinomial-lr-test}} rng = Xoshiro(1); rolls = [rand(rng) < 0.1 ? 6 : rand(rng, 1:6) for _ in 1:600];
{{?obs=observed}} {{?test=power-divergence-test|multinomial-lr-test}} observed = [count(==(face), rolls) for face in 1:6];
{{?test=one-sample-t-test}} result = OneSampleTTest({{x}}, {{mu01}})
{{?test=two-sample-t-test}} result = EqualVarianceTTest({{x}}, {{y}})
{{?test=welch-t-test}} result = UnequalVarianceTTest({{x}}, {{y}})
{{?test=one-sample-z-test}} result = OneSampleZTest(mean({{x}}), {{sig}}, length({{x}}), {{mu01}})  # known sigma
{{?test=two-sample-z-test}} result = EqualVarianceZTest({{x}}, {{y}})  # pooled variance estimated from the samples
{{?test=f-test}} result = VarianceFTest({{x}}, {{y}})
{{?test=one-way-anova}} result = OneWayANOVATest({{grp1}})
{{?test=levene-s-test}} result = LeveneTest({{grp1}})
{{?test=brown-forsythe-test}} result = BrownForsytheTest({{grp1}})
{{?test=chi-squared-test}} result = ChisqTest({{obs}}, {{exp}} ./ sum({{exp}}))  # observed counts vs expected proportions
{{?test=power-divergence-test}} result = PowerDivergenceTest({{obs}}; lambda={{lam}})
{{?test=multinomial-lr-test}} result = PowerDivergenceTest({{obs}}; lambda=0.0)
display(result)  # full report, including the test statistic
println("p-value:        ", pvalue(result))
{{?test=one-sample-t-test|two-sample-t-test|welch-t-test|one-sample-z-test|two-sample-z-test}} println("95% CI:         ", confint(result; level = 0.95))
'''

[[codeBranches]]
model = "nonparametric"
code = '''
using HypothesisTests
{{?test=ks-one-sample-test|anderson-darling-test}} using Distributions  # the reference distribution
{{?test=permutation-test}} using Statistics  # the default statistic, mean
{{?k=k}} {{?test=binomial-test}} # Example data: Gorman et al. (2014), Palmer penguins, the females (k) among the 333 penguins whose sex was recorded (n); p0 = 0.5 asks whether the sexes are balanced. Replace k and n with your own counts.
{{?k=k}} {{?test=binomial-test}} using PollisDatasets
{{?k=k}} {{?test=binomial-test}} sex = dataset("penguins").sex;
{{?k=k}} {{?test=binomial-test}} k = count(isequal("female"), sex);
{{?k=k}} {{?n=n}} {{?test=binomial-test}} n = count(!ismissing, sex);
{{?a=a}} {{?b=b}} {{?c=c}} {{?d=d}} {{?test=fisher-exact-test}} a, b, c, d = 3, 1, 1, 3;  # Example data: Fisher (1935), the lady tasting tea. Rows: the 4 cups with milk poured first, the 4 with tea first; columns: her guess, milk first or tea first. Replace a, b, c, d with your own 2 x 2 counts.
{{?x=x}} {{?test=ks-one-sample-test|anderson-darling-test|shapiro-wilk-test}} # Example data: Härdle (1991), the 272 waiting times (minutes) between eruptions of the Old Faithful geyser, standardised to mean 0 and standard deviation 1: with two peaks they are far from normal. Estimating the mean and standard deviation from the data makes the KS and Anderson-Darling p-values conservative. Replace x with your own sample.
{{?x=x}} {{?test=ks-one-sample-test|anderson-darling-test|shapiro-wilk-test}} using PollisDatasets, Statistics
{{?x=x}} {{?test=ks-one-sample-test|anderson-darling-test|shapiro-wilk-test}} waiting = Float64.(dataset("faithful").waiting);
{{?x=x}} {{?test=ks-one-sample-test|anderson-darling-test|shapiro-wilk-test}} x = (waiting .- mean(waiting)) ./ std(waiting);
{{?x=x}} {{?test=ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test}} # Example data: Henderson and Velleman (1981), Motor Trend 1974, weights (1000 lb) of the 19 cars with automatic (x) and the 13 with manual (y) transmissions. Replace x and y with your own samples.
{{?x=x}} {{?test=ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test}} using PollisDatasets
{{?x=x}} {{?test=ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test}} cars = dataset("mtcars");
{{?x=x}} {{?test=ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test}} x = cars.wt[cars.am .== 0];
{{?x=x}} {{?y=y}} {{?test=ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test}} y = cars.wt[cars.am .== 1];
{{?x=x}} {{?test=sign-test|wilcoxon-signed-rank}} # Example data: Belenky et al. (2003), the change in mean reaction time (ms) of 18 drivers from day 0 to day 9 of sleep restricted to 3 hours a night; mu0 = 0 asks whether the restriction slowed them. Replace x with your own sample.
{{?x=x}} {{?test=sign-test|wilcoxon-signed-rank}} using PollisDatasets
{{?x=x}} {{?test=sign-test|wilcoxon-signed-rank}} study = dataset("sleepstudy"); rt = Dict((study.subject[i], study.days[i]) => study.reaction[i] for i in eachindex(study.reaction));
{{?x=x}} {{?test=sign-test|wilcoxon-signed-rank}} x = [rt[(i, 9)] - rt[(i, 0)] for i in unique(study.subject)];
{{?grp1=x, y, z}} {{?test=kruskal-wallis-test|fligner-killeen-test}} # Example data: Fisher (1936), sepal length (cm) of 50 irises of each species: setosa (x), versicolor (y) and virginica (z). Replace x, y, z with your own groups.
{{?grp1=x, y, z}} {{?test=kruskal-wallis-test|fligner-killeen-test}} using PollisDatasets
{{?grp1=x, y, z}} {{?test=kruskal-wallis-test|fligner-killeen-test}} flowers = dataset("iris");
{{?grp1=x, y, z}} {{?test=kruskal-wallis-test|fligner-killeen-test}} x, y, z = (flowers.sepal_length[flowers.species .== sp] for sp in ("setosa", "versicolor", "virginica"));
{{?x=x}} {{?test=permutation-test}} # Example data: simulated, 5 measurements from each of two normal populations whose means differ by 1.5. The exact test goes through all 10! = 3,628,800 orderings of the pooled values, so it suits only very small samples. Replace x and y with your own samples.
{{?x=x}} {{?test=permutation-test}} using Random
{{?x=x}} {{?test=permutation-test}} rng = Xoshiro(1); x = randn(rng, 5) .+ 1.5;
{{?x=x}} {{?y=y}} {{?test=permutation-test}} y = randn(rng, 5);
{{?test=binomial-test}} result = BinomialTest({{k}}, {{n}}, {{p0}})
{{?test=fisher-exact-test}} result = FisherExactTest({{a}}, {{b}}, {{c}}, {{d}})
{{?test=ks-one-sample-test}} result = ExactOneSampleKSTest({{x}}, {{dist}})
{{?test=ks-two-sample-test}} result = ApproximateTwoSampleKSTest({{x}}, {{y}})
{{?test=sign-test}} result = SignTest({{x}}, {{mu01}})
{{?test=wilcoxon-signed-rank}} result = SignedRankTest({{x}} .- {{mu01}})
{{?test=mann-whitney-u-test}} result = MannWhitneyUTest({{x}}, {{y}})
{{?test=kruskal-wallis-test}} result = KruskalWallisTest({{grp1}})
{{?test=anderson-darling-test}} result = OneSampleADTest({{x}}, {{dist}})
