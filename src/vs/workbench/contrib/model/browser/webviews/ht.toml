code = '''
using HypothesisTests, Random, Statistics
{{?test=one-sample-t-test|one-sample-z-test|ks-one-sample-test|sign-test|wilcoxon-signed-rank|anderson-darling-test|shapiro-wilk-test|jarque-bera|augmented-dickey-fuller|ljung-box|box-pierce}} samples = [{{x}}]
{{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test|ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test|permutation-test}} samples = [{{x}}, {{y}}]
{{?test=one-way-anova|levene-s-test|brown-forsythe-test|kruskal-wallis-test|fligner-killeen-test}} samples = [{{grp1}}]
{{?test=chi-squared-test|power-divergence-test|multinomial-lr-test|binomial-test|fisher-exact-test|durbin-watson|breusch-godfrey|clark-west|diebold-mariano|white-test|hotelling-s-t|equality-of-covariance|correlation-test}} error("This action works on raw samples (location, scale and distribution tests): not available for the selected test")
rng = MersenneTwister(1); B = 10_000
if length(samples) == 1
    x = samples[1] .- {{mu01}}; obs = abs(mean(x))
    perm = [abs(mean(x .* rand(rng, (-1, 1), length(x)))) for _ in 1:B]  # random sign flips under H0
else
    pooled = reduce(vcat, samples); cuts = cumsum([0; length.(samples)])
    stat = v -> HypothesisTests.teststatistic(OneWayANOVATest([v[cuts[i]+1:cuts[i+1]] for i in eachindex(samples)]...))  # F (= t^2 for two samples)
    obs = stat(pooled); perm = [stat(shuffle(rng, pooled)) for _ in 1:B]
end
println("Permutation p = ", round((count(>=(obs), perm) + 1) / (B + 1), digits=5))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "effect-size"
label = "Effect Size"
desc = "How large the difference is, not just whether it is significant: Cohen's d for one sample, Hedges' g for two, eta-squared for several (d: 0.2 small, 0.5 medium, 0.8 large)"
code = '''
using Statistics
{{?test=one-sample-t-test|one-sample-z-test|ks-one-sample-test|sign-test|wilcoxon-signed-rank|anderson-darling-test|shapiro-wilk-test|jarque-bera|augmented-dickey-fuller|ljung-box|box-pierce}} samples = [{{x}}]
{{?test=two-sample-t-test|welch-t-test|two-sample-z-test|f-test|ks-two-sample-test|mann-whitney-u-test|wald-wolfowitz-test|permutation-test}} samples = [{{x}}, {{y}}]
{{?test=one-way-anova|levene-s-test|brown-forsythe-test|kruskal-wallis-test|fligner-killeen-test}} samples = [{{grp1}}]
{{?test=chi-squared-test|power-divergence-test|multinomial-lr-test|binomial-test|fisher-exact-test|durbin-watson|breusch-godfrey|clark-west|diebold-mariano|white-test|hotelling-s-t|equality-of-covariance|correlation-test}} error("This action works on raw samples (location, scale and distribution tests): not available for the selected test")
k = length(samples); n = length.(samples)
if k == 1
    println("Cohen's d = ", round((mean(samples[1]) - {{mu01}}) / std(samples[1]), digits=3))
elseif k == 2
    sp = sqrt(((n[1] - 1) * var(samples[1]) + (n[2] - 1) * var(samples[2])) / (sum(n) - 2))  # pooled SD
    println("Hedges' g = ", round((mean(samples[1]) - mean(samples[2])) / sp * (1 - 3 / (4 * sum(n) - 9)), digits=3))
else
    pooled = reduce(vcat, samples); m = mean(pooled)
    println("eta-squared = ", round(sum(n .* (mean.(samples) .- m) .^ 2) / sum(abs2, pooled .- m), digits=3), "  (share of variance between groups)")
end
'''

[[actionGroups.actions]]
id = "decision"
label = "Decision at Common Levels"
desc = "The full test report, then the reject or retain decision at the 10%, 5% and 1% levels"
code = '''
using HypothesisTests
display(result)  # full report: hypotheses, statistic, p-value
p = pvalue(result)
foreach(a -> println("alpha = ", a, ": ", p < a ? "reject H0" : "do not reject H0"), (0.10, 0.05, 0.01))
'''
