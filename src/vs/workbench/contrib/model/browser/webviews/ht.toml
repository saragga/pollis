model = "timeseries"
code = '''
using HypothesisTests
{{?x=x}} {{?test=augmented-dickey-fuller}} # Example data: Federal Reserve H.15, the daily 10-year US Treasury yield (%), January 1962 to October 2026: does it wander like a random walk? Replace x with your own series.
{{?x=x}} {{?test=augmented-dickey-fuller}} using PollisDatasets
{{?x=x}} {{?test=augmented-dickey-fuller}} x = dataset("dgs10").yield;
{{?x=x}} {{?test=ljung-box|box-pierce}} # Example data: Elton and Nicholson (1942), the log of the annual lynx trappings in the Mackenzie River district, 1821-1934, with a cycle of about ten years. Replace x with your own series.
{{?x=x}} {{?test=ljung-box|box-pierce}} using PollisDatasets
{{?x=x}} {{?test=ljung-box|box-pierce}} x = log.(dataset("lynxmackenzie").lynx);
{{?x=x}} {{?test=jarque-bera}} # Example data: Yahoo! Finance via Kaggle, daily log returns of GameStop, February 2002 to May 2024, with the short squeeze of January 2021 in its tails. Replace x with your own series.
{{?x=x}} {{?test=jarque-bera}} using PollisDatasets
{{?x=x}} {{?test=jarque-bera}} x = diff(log.(dataset("gamestop").adj_close));
{{?fitted=model}} {{?test=durbin-watson|breusch-godfrey|white-test}} # Example data: NOAA, monthly mean CO2 (ppm) at Mauna Loa, March 1958 to August 2026, with a straight-line trend fitted by least squares: the seasonal cycle and the curvature the line misses stay in the residuals. Replace model with your own fitted GLM.jl model.
{{?fitted=model}} {{?test=durbin-watson|breusch-godfrey|white-test}} using PollisDatasets, GLM
{{?fitted=model}} {{?test=durbin-watson|breusch-godfrey|white-test}} model = lm(@formula(average ~ decimal_date), dataset("co2"));
{{?e1=e1}} {{?test=clark-west|diebold-mariano}} # Example data: Cobb (1978), the annual flow of the Nile at Aswan, 1871-1970, forecast one year ahead for 1901-1970: e1 are the errors of the historical mean (the smaller, nested model), e2 those of an AR(1) refitted by least squares each year. Replace e1 and e2 with your own forecast errors.
{{?e1=e1}} {{?test=clark-west|diebold-mariano}} using PollisDatasets, Statistics
{{?e1=e1}} {{?test=clark-west|diebold-mariano}} flow = Float64.(dataset("nile").flow);
{{?e1=e1}} {{?test=clark-west|diebold-mariano}} e1 = [flow[t + 1] - mean(flow[1:t]) for t in 30:99];
{{?e1=e1}} {{?e2=e2}} {{?test=clark-west|diebold-mariano}} e2 = [(b = [ones(t - 1) flow[1:t - 1]] \ flow[2:t]; flow[t + 1] - b[1] - b[2] * flow[t]) for t in 30:99];
{{?test=augmented-dickey-fuller}} result = ADFTest({{x}}, {{det}}, {{lags1}})
{{?test=durbin-watson}} result = DurbinWatsonTest(modelmatrix({{fitted}}), residuals({{fitted}}))  # regressors and residuals of the fitted model
{{?test=ljung-box}} result = LjungBoxTest({{x}}, {{lags2}})
{{?test=box-pierce}} result = BoxPierceTest({{x}}, {{lags2}})
{{?test=breusch-godfrey}} result = BreuschGodfreyTest(modelmatrix({{fitted}}), residuals({{fitted}}), {{lags1}})  # regressors and residuals of the fitted model
{{?test=jarque-bera}} result = JarqueBeraTest({{x}})
{{?test=clark-west}} result = ClarkWestTest({{e1}}, {{e2}}, {{h}})
{{?test=diebold-mariano}} result = DieboldMarianoTest({{e1}}, {{e2}})
{{?test=white-test}} result = WhiteTest(modelmatrix({{fitted}}), residuals({{fitted}}))  # regressors and residuals of the fitted model
display(result)  # full report, including the test statistic
println("p-value:        ", pvalue(result))
'''

[[codeBranches]]
model = "multivariate"
code = '''
using HypothesisTests
{{?X=X}} {{?test=hotelling-s-t}} # Example data: Belenky et al. (2003), for each of 18 drivers the change in mean reaction time (ms) from day 0 to day 5 and to day 9 of sleep restricted to 3 hours a night, one driver per row; mu0 = [0.0, 0.0] asks whether either changed. Replace X with your own n x p matrix.
{{?X=X}} {{?test=hotelling-s-t}} using PollisDatasets
{{?X=X}} {{?test=hotelling-s-t}} study = dataset("sleepstudy"); rt = Dict((study.subject[i], study.days[i]) => study.reaction[i] for i in eachindex(study.reaction));
{{?X=X}} {{?test=hotelling-s-t}} X = [rt[(i, day)] - rt[(i, 0)] for i in unique(study.subject), day in (5, 9)];
{{?grp2=X1, X2}} {{?test=equality-of-covariance}} # Example data: Fisher (1936), the four sepal and petal measurements (cm) of 50 setosa (X1) and 50 versicolor (X2) irises, one flower per row. Replace X1, X2 with your own matrices.
{{?grp2=X1, X2}} {{?test=equality-of-covariance}} using PollisDatasets
{{?grp2=X1, X2}} {{?test=equality-of-covariance}} flowers = dataset("iris"); M = hcat(flowers.sepal_length, flowers.sepal_width, flowers.petal_length, flowers.petal_width);
{{?grp2=X1, X2}} {{?test=equality-of-covariance}} X1 = M[flowers.species .== "setosa", :]; X2 = M[flowers.species .== "versicolor", :];
{{?x=x}} {{?test=correlation-test}} # Example data: Galton (1886), the midparent heights (x) and adult heights (y) in inches of 934 children of 205 families. Replace x and y with your own paired samples.
{{?x=x}} {{?test=correlation-test}} using PollisDatasets
{{?x=x}} {{?test=correlation-test}} heights = dataset("galton");
{{?x=x}} {{?test=correlation-test}} x = heights.midparent_height;
{{?x=x}} {{?y=y}} {{?test=correlation-test}} y = heights.child_height;
{{?test=hotelling-s-t}} result = OneSampleHotellingT2Test({{X}}, {{mu02}})
{{?test=equality-of-covariance}} result = BartlettTest({{grp2}})  # two data matrices, observations in rows
{{?test=correlation-test}} result = CorrelationTest({{x}}, {{y}})
display(result)  # full report, including the test statistic
println("p-value:        ", pvalue(result))
{{?test=correlation-test}} println("95% CI:         ", confint(result, 0.95))
'''


