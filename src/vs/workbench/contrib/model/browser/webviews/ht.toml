[[codeBranches]]
model = "parametric"
code = '''
using HypothesisTests
{{?test=one-sample-t-test}} result = OneSampleTTest({{x}}, {{mu01}})
{{?test=two-sample-t-test}} result = EqualVarianceTTest({{x}}, {{y}})
{{?test=welch-t-test}} result = UnequalVarianceTTest({{x}}, {{y}})
{{?test=one-sample-z-test}} result = OneSampleZTest({{x}}, {{sig}}, {{mu01}})
{{?test=two-sample-z-test}} result = EqualVarianceZTest({{x}}, {{y}}, {{sig}})
{{?test=f-test}} result = VarianceFTest({{x}}, {{y}})
{{?test=one-way-anova}} result = OneWayANOVATest({{grp1}})
{{?test=levene-s-test}} result = LeveneTest({{grp1}})
{{?test=brown-forsythe-test}} result = BrownForsytheTest({{grp1}})
{{?test=chi-squared-test}} result = ChisqTest({{obs}}, {{exp}})
{{?test=power-divergence-test}} result = PowerDivergenceTest({{obs}}; lambda={{lam}})
{{?test=multinomial-lr-test}} result = PowerDivergenceTest({{obs}}; lambda=0.0)
println("Test statistic: ", teststatistic(result))
println("p-value:        ", pvalue(result))
{{?test=one-sample-t-test|two-sample-t-test|welch-t-test|one-sample-z-test|two-sample-z-test}} println("95% CI:         ", confint(result, 0.95))
'''

[[codeBranches]]
model = "nonparametric"
code = '''
{{?test!=shapiro-wilk-test}} using HypothesisTests
{{?test=shapiro-wilk-test}} using ShapiroWilk
{{?test=binomial-test}} result = BinomialTest({{k}}, {{n}}, {{p0}})
{{?test=fisher-exact-test}} result = FisherExactTest({{a}}, {{b}}, {{c}}, {{d}})
{{?test=ks-one-sample-test}} result = ExactOneSampleKSTest({{x}}, {{dist}})
{{?test=ks-two-sample-test}} result = ApproximateTwoSampleKSTest({{x}}, {{y}})
{{?test=sign-test}} result = SignTest({{x}}, {{mu01}})
{{?test=wilcoxon-signed-rank}} result = SignedRankTest({{x}}, {{mu01}})
{{?test=mann-whitney-u-test}} result = MannWhitneyUTest({{x}}, {{y}})
{{?test=kruskal-wallis-test}} result = KruskalWallisTest({{grp1}})
{{?test=anderson-darling-test}} result = OneSampleADTest({{x}}, {{dist}})
{{?test=fligner-killeen-test}} result = FlignerKilleenTest({{grp1}})
{{?test=wald-wolfowitz-test}} result = WaldWolfowitzTest({{x}}, {{y}})
{{?test=shapiro-wilk-test}} result = shapiro_test({{x}})
{{?test=permutation-test}} result = ExactPermutationTest({{x}}, {{y}}, {{f}})
println("Test statistic: ", teststatistic(result))
println("p-value:        ", pvalue(result))
{{?test=binomial-test|fisher-exact-test|sign-test|wilcoxon-signed-rank|mann-whitney-u-test}} println("95% CI:         ", confint(result, 0.95))
'''

[[codeBranches]]
model = "timeseries"
code = '''
using HypothesisTests
{{?test=augmented-dickey-fuller}} result = ADFTest({{x}}, {{det}}, {{lags1}})
{{?test=durbin-watson}} result = DurbinWatsonTest({{e}})
{{?test=ljung-box}} result = LjungBoxTest({{x}}, {{lags2}})
{{?test=box-pierce}} result = BoxPierceTest({{x}}, {{lags2}})
{{?test=breusch-godfrey}} result = BreuschGodfreyTest({{fitted}}, {{lags1}})
{{?test=jarque-bera}} result = JarqueBeraTest({{x}})
{{?test=clark-west}} result = ClarkWestTest({{e1}}, {{e2}}, {{h}})
{{?test=diebold-mariano}} result = DieboldMarianoTest({{e1}}, {{e2}})
{{?test=white-test}} result = WhiteTest({{fitted}})
println("Test statistic: ", teststatistic(result))
println("p-value:        ", pvalue(result))
'''

[[codeBranches]]
model = "multivariate"
code = '''
using HypothesisTests
{{?test=hotelling-s-t}} result = HotellingT2Test({{X}}, {{mu02}})
{{?test=equality-of-covariance}} result = EqualCovarianceTest({{grp2}})
{{?test=correlation-test}} result = CorrelationTest({{x}}, {{y}})
println("Test statistic: ", teststatistic(result))
println("p-value:        ", pvalue(result))
{{?test=correlation-test}} println("95% CI:         ", confint(result, 0.95))
'''

