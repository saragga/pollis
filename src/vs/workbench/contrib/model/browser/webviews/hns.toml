f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
n = length(lb)
budget = {{budget}}  # evaluation budget
x_start = lb .+ 0.85 .* (ub .- lb)  # start near a corner: the centre of the box is the global minimum of the default Rastrigin function

# wraps f so that every evaluation is recorded
function recorder()
    pts, vals = Vector{Float64}[], Float64[]
    fc(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fc, pts, vals
end
result(x, fx, pts, vals; extra...) = (x = x, fx = fx, points = pts, values = vals, trace = accumulate(min, vals), evals = length(vals), extra...)

# bounded L-BFGS descent (finite-difference gradients) from a point moved strictly inside the box
inside(x) = clamp.(x, lb .+ 1e-6 .* (ub .- lb), ub .- 1e-6 .* (ub .- lb))
function descend(g, x)
    r = Optim.optimize(g, lb, ub, inside(x), Fminbox(LBFGS()), Optim.Options(outer_iterations=5))
    Optim.minimizer(r), Optim.minimum(r)
end

SCALE = {{scale}}  # kick size as a fraction of the box width
KNOB, GRID = "perturbation scale", [0.02, 0.05, 0.1, 0.2, 0.4]

function search(; budget=budget, seed=1, knob=SCALE)
    Random.seed!(seed)
    fc, pts, vals = recorder()
    bx, bf = descend(fc, x_start)
    while length(vals) < budget
        x, fx = descend(fc, bx .+ knob .* (ub .- lb) .* randn(n))  # kick the incumbent, then descend
        if fx < bf
            bx, bf = x, fx  # keep only improvements
        end
    end
    result(bx, bf, pts, vals)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals)
'''

[[codeBranches]]
model = "lns"
code = '''
using Optim, NLopt, Random, LinearAlgebra  # both export optimize, so calls are qualified

f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
n = length(lb)
budget = {{budget}}  # evaluation budget
x_start = lb .+ 0.85 .* (ub .- lb)  # start near a corner: the centre of the box is the global minimum of the default Rastrigin function

# wraps f so that every evaluation is recorded
function recorder()
    pts, vals = Vector{Float64}[], Float64[]
    fc(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fc, pts, vals
end
result(x, fx, pts, vals; extra...) = (x = x, fx = fx, points = pts, values = vals, trace = accumulate(min, vals), evals = length(vals), extra...)

# bounded L-BFGS descent (finite-difference gradients) from a point moved strictly inside the box
inside(x) = clamp.(x, lb .+ 1e-6 .* (ub .- lb), ub .- 1e-6 .* (ub .- lb))
function descend(g, x)
    r = Optim.optimize(g, lb, ub, inside(x), Fminbox(LBFGS()), Optim.Options(outer_iterations=5))
    Optim.minimizer(r), Optim.minimum(r)
end

FRAC = {{frac}}  # fraction of variables destroyed each step
KNOB, GRID = "destroy fraction", [0.1, 0.25, 0.5, 0.75, 1.0]

# re-sample a random subset of the variables uniformly in the box
function destroy(x, frac)
    y = copy(x)
    idx = randperm(n)[1:max(1, round(Int, frac * n))]
    y[idx] .= lb[idx] .+ rand(length(idx)) .* (ub[idx] .- lb[idx])
    y
end

function search(; budget=budget, seed=1, knob=FRAC)
    Random.seed!(seed)
    fc, pts, vals = recorder()
    bx, bf = descend(fc, x_start)
    while length(vals) < budget
        x, fx = descend(fc, destroy(bx, knob))  # destroy, then repair
        if fx < bf
            bx, bf = x, fx
        end
    end
    result(bx, bf, pts, vals)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals)
'''

[[codeBranches]]
model = "alns"
code = '''
using Optim, NLopt, Random, LinearAlgebra  # both export optimize, so calls are qualified

f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
n = length(lb)
budget = {{budget}}  # evaluation budget
x_start = lb .+ 0.85 .* (ub .- lb)  # start near a corner: the centre of the box is the global minimum of the default Rastrigin function

# wraps f so that every evaluation is recorded
function recorder()
    pts, vals = Vector{Float64}[], Float64[]
    fc(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fc, pts, vals
end
result(x, fx, pts, vals; extra...) = (x = x, fx = fx, points = pts, values = vals, trace = accumulate(min, vals), evals = length(vals), extra...)

# bounded L-BFGS descent (finite-difference gradients) from a point moved strictly inside the box
inside(x) = clamp.(x, lb .+ 1e-6 .* (ub .- lb), ub .- 1e-6 .* (ub .- lb))
function descend(g, x)
    r = Optim.optimize(g, lb, ub, inside(x), Fminbox(LBFGS()), Optim.Options(outer_iterations=5))
    Optim.minimizer(r), Optim.minimum(r)
end

FRACS = [0.25, 0.5, 0.75]  # competing destroy fractions
REACT = {{react}}  # reaction factor of the weight update
KNOB, GRID = "reaction factor", [0.0, 0.1, 0.2, 0.5, 1.0]

function destroy(x, frac)
    y = copy(x)
    idx = randperm(n)[1:max(1, round(Int, frac * n))]
    y[idx] .= lb[idx] .+ rand(length(idx)) .* (ub[idx] .- lb[idx])
    y
end

function search(; budget=budget, seed=1, knob=REACT)
    Random.seed!(seed)
    fc, pts, vals = recorder()
    w = ones(length(FRACS))  # operator weights
    uses = zeros(Int, length(FRACS))
    bx, bf = descend(fc, x_start)
    while length(vals) < budget
        k = findfirst(cumsum(w ./ sum(w)) .>= rand())  # roulette-wheel choice
        uses[k] += 1
        x, fx = descend(fc, destroy(bx, FRACS[k]))
        score = fx < bf ? 3.0 : 0.5  # reward operators that improve the best
        w[k] = (1 - knob) * w[k] + knob * score
        if fx < bf
            bx, bf = x, fx
        end
    end
    result(bx, bf, pts, vals; weights = w ./ sum(w), uses = uses)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals)
'''

[[codeBranches]]
model = "bh"
code = '''
using Optim, NLopt, Random, LinearAlgebra  # both export optimize, so calls are qualified

f(x) = {{obj}}  # objective
lb, ub = {{lb}}, {{ub}}  # search box
n = length(lb)
budget = {{budget}}  # evaluation budget
x_start = lb .+ 0.85 .* (ub .- lb)  # start near a corner: the centre of the box is the global minimum of the default Rastrigin function

# wraps f so that every evaluation is recorded
function recorder()
    pts, vals = Vector{Float64}[], Float64[]
    fc(x) = (v = f(x); push!(pts, copy(x)); push!(vals, v); v)
    fc, pts, vals
end
result(x, fx, pts, vals; extra...) = (x = x, fx = fx, points = pts, values = vals, trace = accumulate(min, vals), evals = length(vals), extra...)

# bounded L-BFGS descent (finite-difference gradients) from a point moved strictly inside the box
inside(x) = clamp.(x, lb .+ 1e-6 .* (ub .- lb), ub .- 1e-6 .* (ub .- lb))
function descend(g, x)
    r = Optim.optimize(g, lb, ub, inside(x), Fminbox(LBFGS()), Optim.Options(outer_iterations=5))
    Optim.minimizer(r), Optim.minimum(r)
end

SCALE = {{scale}}  # hop size as a fraction of the box width
TEMP = {{temp}}  # Metropolis temperature
KNOB, GRID = "temperature", [0.0, 0.3, 1.0, 3.0, 10.0]

function search(; budget=budget, seed=1, knob=TEMP)
    Random.seed!(seed)
    fc, pts, vals = recorder()
    cx, cf = descend(fc, x_start)  # current basin
    bx, bf = cx, cf
    accepted = 0
    while length(vals) < budget
        x, fx = descend(fc, cx .+ SCALE .* (ub .- lb) .* randn(n))  # hop and descend
        if fx < cf || (knob > 0 && rand() < exp(-(fx - cf) / knob))  # Metropolis acceptance
            cx, cf = x, fx
            accepted += 1
        end
        if cf < bf
            bx, bf = cx, cf
        end
    end
    result(bx, bf, pts, vals; accepted = accepted)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals)
'''

