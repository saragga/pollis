[[actionGroups.actions]]
id = "compare-crs-sa"
label = "Compare vs CRS and SA"
desc = "The selected method against NLopt CRS2 and Optim SAMIN at the same budget, over 5 seeds"
code = '''
using Statistics

function crs(seed)
    NLopt.srand(seed)
    opt = Opt(:GN_CRS2_LM, n)
    opt.lower_bounds, opt.upper_bounds, opt.maxeval = lb, ub, budget
    opt.min_objective = (x, g) -> f(x)
    NLopt.optimize(opt, x_start)[1]
end
function samin(seed)
    Random.seed!(seed)
    Optim.minimum(Optim.optimize(f, lb, ub, x_start, SAMIN(verbosity=0), Optim.Options(iterations=budget)))
end
runs = ["selected method" => s -> search(seed=s).fx, "CRS" => crs, "SA" => samin]
map(runs) do (name, run)
    sec = @elapsed v = [run(s) for s in 1:5]
    (method = name, mean_best = mean(v), worst_best = maximum(v), seconds_per_run = sec / 5)
end
'''

