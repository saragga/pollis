inside(x) = clamp.(x, lb .+ 1e-6 .* (ub .- lb), ub .- 1e-6 .* (ub .- lb))
function descend(g, x)
    r = Optim.optimize(g, lb, ub, inside(x), Fminbox(LBFGS()), Optim.Options(outer_iterations=5))
    Optim.minimizer(r), Optim.minimum(r)
end

RT = {{rt}}  # temperature reduction factor
KNOB, GRID = "cooling rate", [0.5, 0.7, 0.85, 0.9, 0.95]

function search(; budget=budget, seed=1, knob=RT)
    Random.seed!(seed)
    fc, pts, vals = recorder()
    r = Optim.optimize(fc, lb, ub, x_start, SAMIN(rt=knob, verbosity=0), Optim.Options(iterations=budget))
    result(Optim.minimizer(r), Optim.minimum(r), pts, vals)
end

res = search()
x_best, f_best = res.x, res.fx
(best_point = x_best, best_value = f_best, evaluations = res.evals)
'''

