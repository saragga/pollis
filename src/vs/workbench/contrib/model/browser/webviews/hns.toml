[[bullets]]
text = "CRS"
detail = "controlled random search; population-based, gradient-free; NLopt GN_CRS2_LM"

[[bullets]]
text = "ILS"
detail = "iterated local search; local descent alternated with random perturbations to escape local optima"

[[bullets]]
text = "LNS"
detail = "large neighbourhood search; destroy & repair operators applied iteratively over the feasible region"

[[bullets]]
text = "ALNS"
detail = "adaptive LNS; weights each destroy fraction by its historical improvement rate"

[[bullets]]
text = "BH"
detail = "basin-hopping; random perturbation followed by local descent with Metropolis acceptance criterion"

[[bullets]]
text = "SA"
detail = "simulated annealing (Optim.jl SAMIN); temperature-schedule acceptance; very general box-constrained search"

[[decisionRows]]
task = "CRS"
context = "Continuous box-constrained black-box problems, no gradients"
purpose = "Controlled random search: a population of points is improved by reflecting simplices of random members (with local mutation)"

[[decisionRows]]
task = "ILS"
context = "Problems where a local solver works well but gets trapped"
purpose = "Iterated local search: kick the incumbent and descend again, keeping only improvements"

[[decisionRows]]
task = "LNS"
context = "Problems where some variables can be re-optimised while others stay fixed"
purpose = "Large neighbourhood search: destroy (re-sample) a fraction of the variables, then repair by local descent"

[[decisionRows]]
task = "ALNS"
context = "When the right neighbourhood size is not known in advance"
purpose = "Adaptive LNS: several destroy sizes compete, and the ones that produce improvements are chosen more often"

[[decisionRows]]
task = "BH"
context = "Funnel-shaped landscapes with many nearby local minima"
purpose = "Basin hopping: perturb, descend, and accept the new basin with a Metropolis rule so the search can walk uphill"

[[decisionRows]]
task = "SA"
context = "Rugged landscapes, cheap objectives"
purpose = "Simulated annealing: accept worse moves with a probability that falls as the temperature is lowered"

[[inputs]]
id = "obj"
label = "Objective f(x)"
tooltip = "Julia expression for the objective to minimise, using x[1], x[2], ... Default: the Rastrigin function (global minimum 0 at the origin, a regular grid of local minima around it)."
default = "20 + x[1]^2 + x[2]^2 - 10 * (cos(2pi * x[1]) + cos(2pi * x[2]))"

[[inputs]]
id = "lb"
label = "Lower Bounds"
tooltip = "Julia vector of lower bounds, one per variable; its length sets the dimension."
default = "[-5.12, -5.12]"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bounds"
tooltip = "Julia vector of upper bounds, one per variable."
default = "[5.12, 5.12]"

[[inputs]]
id = "budget"
label = "Budget"
tooltip = "Maximum number of objective evaluations. Every evaluation counts, including the finite-difference gradient evaluations of the local descents."
default = "5000"

[[inputs]]
id = "pop"
label = "Population"
tooltip = "Number of points CRS keeps. 0 uses the NLopt default of 10(n + 1)."
default = "0"
models = ["crs"]
newRow = true

[[inputs]]
id = "scale"
label = "Perturbation Scale"
tooltip = "Standard deviation of the kick, as a fraction of the box width. Too small and the descent falls back into the same basin; too large and the search becomes random restarts."
default = "0.15"
models = ["ils", "bh"]
newRow = true

[[inputs]]
id = "frac"
label = "Destroy Fraction"
tooltip = "Fraction of the variables re-sampled uniformly in the box before each repair."
default = "0.5"
models = ["lns"]
newRow = true

[[inputs]]
id = "react"
label = "Reaction Factor"
tooltip = "How quickly operator weights follow recent success: w = (1 - r) w + r * score. 0 never adapts; 1 forgets the past at once."
default = "0.2"
models = ["alns"]
newRow = true

[[inputs]]
id = "temp"
label = "Temperature"
tooltip = "Metropolis temperature: a basin that is worse by T is accepted with probability exp(-1). Roughly the height of the barriers between neighbouring minima."
default = "1.0"
models = ["bh"]

[[inputs]]
id = "rt"
label = "Cooling Rate (rt)"
tooltip = "Factor the SAMIN temperature is multiplied by at each reduction. Close to 1 cools slowly and explores more."
default = "0.9"
models = ["sa"]
newRow = true

