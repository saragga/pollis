{{?model=graph}} function vaccinated_run(strategy, s; coverage = 0.3)
{{?model=graph}}     m = initialize(; seed = s)
{{?model=graph}}     g = abmspace(m).graph
{{?model=graph}}     order = strategy == :hubs ? sortperm(degree(g); rev = true) : randperm(abmrng(m), nv(g))  # agent id = node
{{?model=graph}}     targets = filter(id -> m[id].status == :S, order)[1:round(Int, coverage * nv(g))]
{{?model=graph}}     for id in targets
{{?model=graph}}         m[id].status = :R  # immune from the start
{{?model=graph}}     end
{{?model=graph}}     step!(m, T)
{{?model=graph}}     return 1 - susceptible(m) - length(targets) / nv(g)  # share infected, vaccinated people left out
{{?model=graph}} end
{{?model=graph}} for strategy in (:none, :random, :hubs)
{{?model=graph}}     sizes = strategy == :none ? [vaccinated_run(:random, s; coverage = 0.0) for s in 1:20] : [vaccinated_run(strategy, s) for s in 1:20]
{{?model=graph}}     println(rpad(string(strategy), 7), " mean share infected ", round(100 * mean(sizes); digits = 1), "%, major outbreaks ", count(sizes .> 0.1), " of 20")
{{?model=graph}} end
{{?model=graph}} println("Vaccinating hubs removes the links that carry most transmission; on Barabasi-Albert networks the gap is largest")
