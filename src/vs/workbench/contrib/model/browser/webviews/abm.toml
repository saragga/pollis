[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "convergence"
label = "Convergence"
desc = "Grid: step until every resident is happy, the absorbing state where nobody moves again. Continuous: compare polarisation in the last two quarters of the run, with its running mean. Graph: step until nobody is infectious and report when the epidemic ended"
code = '''
{{?model=grid}} m = initialize()
{{?model=grid}} step!(m, (x, t) -> share_happy(x) == 1 || t >= 1000)  # stop when nobody wants to move, or after 1000 steps
{{?model=grid}} if share_happy(m) == 1
{{?model=grid}}     println("Converged at step ", abmtime(m), ": every resident is happy, so nobody moves again")
{{?model=grid}} else
{{?model=grid}}     println("No convergence in 1000 steps: ", round(100 * (1 - share_happy(m)); digits = 1), "% still unhappy. With a high threshold or few empty cells residents keep moving")
{{?model=grid}} end
{{?model=grid}} println("Same-group neighbours at the end: ", round(segregation(m); digits = 2))
{{?model=grid}} abmtime(m) > T && println("Convergence comes after T = ", T, ": raise T so the main run reaches it")
{{?model=continuous}} q = div(T, 4)
{{?model=continuous}} third, fourth = res.polarisation[(2q + 1):(3q)], res.polarisation[(3q + 1):(4q + 1)]
{{?model=continuous}} println("Mean polarisation: ", round(mean(third); digits = 3), " in the third quarter, ", round(mean(fourth); digits = 3), " in the last quarter")
{{?model=continuous}} println(abs(mean(fourth) - mean(third)) < 0.05 ? "Stationary: the flock has settled" : "Still drifting: raise T")
{{?model=continuous}} fig = Figure(size = (800, 350))
{{?model=continuous}} ax = Axis(fig[1, 1]; xlabel = "Step", ylabel = "Polarisation", title = "Polarisation and its running mean")
{{?model=continuous}} lines!(ax, res.time, res.polarisation; label = "Polarisation")
{{?model=continuous}} lines!(ax, res.time, cumsum(res.polarisation) ./ (1:length(res.polarisation)); label = "Running mean")
{{?model=continuous}} axislegend(ax; position = :rb)
{{?model=continuous}} display(fig)
{{?model=graph}} m = initialize()
{{?model=graph}} step!(m, (x, t) -> infectious(x) == 0 || t >= 10_000)  # stop when nobody is infectious
{{?model=graph}} println("The epidemic ended at step ", abmtime(m), " with ", round(100 * recovered(m); digits = 1), "% ever infected")
{{?model=graph}} abmtime(m) > T && println("That is after T = ", T, ": raise T so the curves show the whole epidemic")
{{?model=graph}} recovered(m) < 0.05 && println("A minor outbreak: chains of infection died out early, which happens by chance even when R0 > 1")
'''

[[actionGroups.actions]]
id = "reproducibility"
label = "Reproducibility"
desc = "Run the model twice with the same seed to check the runs are identical, then with seeds 1 to 10 to show how much of the outcome is chance"
code = '''
{{?model=grid}} twice = [Tables.columntable(run!(initialize(), T; mdata)[2]) for _ in 1:2]
{{?model=grid}} println("Same seed twice gives identical runs: ", twice[1] == twice[2])
{{?model=grid}} function final_segregation(s)
{{?model=grid}}     m = initialize(; seed = s)
{{?model=grid}}     step!(m, T)
{{?model=grid}}     return segregation(m)
{{?model=grid}} end
{{?model=grid}} finals = [final_segregation(s) for s in 1:10]
