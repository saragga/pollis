# Agent-Based Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/abm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Agent-Based Models"
