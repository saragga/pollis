detail = "SIR epidemic on a contact network: infectious people infect each susceptible neighbour with probability beta per step and recover with probability gamma; random, small-world and scale-free networks with the same mean degree"

[[inputs]]
id = "T"
label = "Steps (T)"
tooltip = "Number of model steps. In one step every agent acts once, in random order."
default = "100"

[[inputs]]
id = "side"
label = "Grid Side"
tooltip = "The grid has side x side cells, with no wraparound at the edges."
default = "20"
models = ["grid"]

[[inputs]]
id = "density"
label = "Density"
tooltip = "Share of cells occupied by residents, split equally between the two groups. The rest are empty cells that unhappy residents can move to."
default = "0.9"
models = ["grid"]

[[inputs]]
id = "threshold"
label = "Threshold"
tooltip = "Minimum share of neighbours from the same group for a resident to be happy, between 0 and 1. Schelling showed that mild values such as 0.3 already produce strong segregation."
default = "0.3"
models = ["grid"]

[[inputs]]
id = "n-particles"
label = "Particles (N)"
tooltip = "Number of self-propelled particles in the Vicsek model."
default = "300"
models = ["continuous"]

[[inputs]]
id = "L"
label = "Box Side (L)"
tooltip = "Side of the square box, with periodic boundaries. Density is N / L^2; the interaction radius is 1 and the speed 0.3."
default = "10.0"
models = ["continuous"]

[[inputs]]
id = "noise"
label = "Noise"
tooltip = "Angular noise as a share of pi, between 0 and 1: each turn adds a uniform random angle in [-noise pi, noise pi]. Low noise gives an ordered flock, high noise a disordered gas."
default = "0.2"
models = ["continuous"]

[[inputs]]
id = "n-people"
label = "People (N)"
tooltip = "Number of people, one per network node."
default = "500"
models = ["graph"]

[[inputs]]
id = "k"
label = "Mean Degree (k)"
tooltip = "Mean number of contacts per person, shared by all three network types. Must be even, since the small-world and scale-free generators use k / 2."
default = "4"
models = ["graph"]

[[inputs]]
id = "topology"
label = "Network"
tooltip = "Contact network. Erdos-Renyi: random links. Watts-Strogatz: a ring lattice with 10% of links rewired, so high clustering. Barabasi-Albert: preferential attachment, so a few highly connected hubs."
kind = "select"
default = "erdos_renyi"
models = ["graph"]

[[inputs.options]]
value = "erdos_renyi"
label = "Erdos-Renyi"

[[inputs.options]]
value = "watts_strogatz"
label = "Watts-Strogatz"

[[inputs.options]]
value = "barabasi_albert"
label = "Barabasi-Albert"

[[inputs]]
id = "beta"
label = "Infection Probability (beta)"
tooltip = "Probability per step that an infectious person infects each susceptible neighbour."
default = "0.1"
models = ["graph"]

[[inputs]]
id = "gamma"
label = "Recovery Probability (gamma)"
tooltip = "Probability per step that an infectious person recovers; the mean infectious period is 1 / gamma steps."
default = "0.1"
models = ["graph"]

[[inputs]]
id = "I0"
label = "Initial Infectious"
tooltip = "Number of people infectious at step 0, chosen at random."
default = "5"
models = ["graph"]

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Random seed for the initial layout or network and for the model random number generator."
default = "42"

[[codeBranches]]
model = "grid"
code = '''
using Agents, Random, Statistics, Tables, CairoMakie  # ABM framework; seeds; means; plain columns; plots

# Schelling segregation: two groups on a grid; each resident wants a minimum share of like neighbours
@agent struct Resident(GridAgent{2})
    group::Int  # 1 or 2
end

function same_share(agent, model)  # share of the neighbours (8 surrounding cells) in the same group; NaN when alone
    nbs = collect(nearby_agents(agent, model))
    return isempty(nbs) ? NaN : count(nb -> nb.group == agent.group, nbs) / length(nbs)
end
is_happy(agent, model) = (s = same_share(agent, model); isnan(s) || s >= model.min_to_be_happy)

function schelling_step!(agent, model)  # unhappy residents move to a random empty cell
    is_happy(agent, model) || move_agent_single!(agent, model)
    return
end

segregation(model) = mean(filter(!isnan, [same_share(a, model) for a in allagents(model)]))  # mean same-group neighbour share
share_happy(model) = mean(a -> is_happy(a, model), allagents(model))

function initialize(; side = {{side}}, density = {{density}}, min_to_be_happy = {{threshold}}, seed = {{seed}})
    space = GridSpaceSingle((side, side); periodic = false)  # at most one resident per cell
    model = StandardABM(Resident, space; agent_step! = schelling_step!, properties = Dict(:min_to_be_happy => min_to_be_happy),
        rng = Xoshiro(seed), scheduler = Schedulers.Randomly(), container = Vector)
    n = round(Int, density * side^2)
    for i in 1:n
        add_agent_single!(model; group = i <= n / 2 ? 1 : 2)  # two equal groups on random empty cells
    end
    return model
end

T = {{T}}  # steps
mdata = [segregation, share_happy]  # model observables, one column each
model = initialize()
_, mdf = run!(model, T; mdata)
res = Tables.columntable(mdf)  # plain columns: time, segregation, share_happy
println("Same-group neighbours: ", round(res.segregation[1]; digits = 2), " at step 0, ", round(res.segregation[end]; digits = 2), " at step ", T)
println("Happy residents:       ", round(res.share_happy[1]; digits = 2), " at step 0, ", round(res.share_happy[end]; digits = 2), " at step ", T)
'''

[[codeBranches]]
model = "continuous"
code = '''
using Agents, Random, Statistics, LinearAlgebra, Tables, CairoMakie  # ABM framework; seeds; means; norm; plain columns; plots

# Vicsek flocking: each particle turns to the mean heading of its neighbours, plus random noise
@agent struct Particle(ContinuousAgent{2, Float64}) end  # pos and vel are 2-D vectors; vel has unit length

function vicsek_step!(agent, model)
    heading = agent.vel  # the average includes the particle itself
    for nb in nearby_agents(agent, model, model.radius; search = :exact)
        heading += nb.vel
    end
    angle = atan(heading[2], heading[1]) + model.noise * pi * (2 * rand(abmrng(model)) - 1)  # uniform noise in [-noise pi, noise pi]
    agent.vel = SVector(cos(angle), sin(angle))
    move_agent!(agent, model, model.speed)  # move speed units along the new heading
    return
end

polarisation(model) = norm(sum(a.vel for a in allagents(model))) / nagents(model)  # 1 = all aligned, near 0 = disordered

function initialize(; particles = {{n-particles}}, side = {{L}}, noise = {{noise}}, radius = 1.0, speed = 0.3, seed = {{seed}})
    space = ContinuousSpace((side, side); spacing = radius / 1.5, periodic = true)
    properties = Dict(:noise => noise, :radius => radius, :speed => speed)
    model = StandardABM(Particle, space; agent_step! = vicsek_step!, properties,
        rng = Xoshiro(seed), scheduler = Schedulers.Randomly(), container = Vector)
    for _ in 1:particles
        angle = 2pi * rand(abmrng(model))
        add_agent!(model, SVector(cos(angle), sin(angle)))  # random position, random heading
    end
    return model
end

T = {{T}}  # steps
mdata = [polarisation]  # model observables, one column each
model = initialize()
_, mdf = run!(model, T; mdata)
res = Tables.columntable(mdf)  # plain columns: time, polarisation
settled = res.polarisation[(div(T, 2) + 1):end]  # second half of the run
println("Polarisation: ", round(res.polarisation[1]; digits = 2), " at step 0, mean ", round(mean(settled); digits = 2), " over the second half")
println("Density: ", round({{n-particles}} / {{L}}^2; digits = 2), " particles per unit area, noise ", {{noise}})
'''

[[codeBranches]]
model = "graph"
code = '''
using Agents, Graphs, Random, Statistics, Tables, CairoMakie  # ABM framework; network generators; seeds; means; plain columns; plots

# SIR epidemic on a contact network: one person per node, infection passes along edges
@agent struct Person(GraphAgent)
    status::Symbol = :S  # :S susceptible, :I infectious, :R recovered
    infected_at::Int = -1  # step of infection
end

function sir_step!(agent, model)
    (agent.status == :I && agent.infected_at < abmtime(model)) || return  # people infected in this step wait for the next
    for nb in nearby_agents(agent, model)  # people on neighbouring nodes
        if nb.status == :S && rand(abmrng(model)) < model.beta
            nb.status, nb.infected_at = :I, abmtime(model)
        end
    end
    if rand(abmrng(model)) < model.gamma
        agent.status = :R
    end
    return
end

function contact_network(topology, n, k, rng)  # three network types with the same mean degree k
    topology == :erdos_renyi && return erdos_renyi(n, k / (n - 1); rng = rng)  # random links
    topology == :watts_strogatz && return watts_strogatz(n, k, 0.1; rng = rng)  # ring lattice, 10% of links rewired
    return barabasi_albert(n, div(k, 2); rng = rng)  # preferential attachment: a few hubs
end

function initialize(; people = {{n-people}}, k = {{k}}, topology = :{{topology}}, beta = {{beta}}, gamma = {{gamma}}, initial = {{I0}}, seed = {{seed}})
    rng = Xoshiro(seed)
    g = contact_network(topology, people, k, rng)
    model = StandardABM(Person, GraphSpace(g); agent_step! = sir_step!, properties = Dict(:beta => beta, :gamma => gamma),
        rng = rng, scheduler = Schedulers.Randomly(), container = Vector)
    for node in 1:people
        add_agent!(node, model)  # one susceptible person per node, so agent id = node
    end
    for id in randperm(rng, people)[1:initial]
        model[id].status = :I
    end
    return model
end

share(model, s) = count(a -> a.status == s, allagents(model)) / nagents(model)
susceptible(model) = share(model, :S)
infectious(model) = share(model, :I)
recovered(model) = share(model, :R)

T = {{T}}  # steps
mdata = [susceptible, infectious, recovered]  # model observables, one column each
model = initialize()
_, mdf = run!(model, T; mdata)
res = Tables.columntable(mdf)  # plain columns: time, susceptible, infectious, recovered
peak, ipeak = findmax(res.infectious)
println("Peak: ", round(100 * peak; digits = 1), "% infectious at step ", res.time[ipeak])
println("Ever infected by step ", T, ": ", round(100 * (1 - res.susceptible[end]); digits = 1), "%")
infectious(model) > 0 && println("Still ", round(100 * infectious(model); digits = 1), "% infectious: raise T to see the end of the epidemic")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "snapshots"
label = "Snapshots"
desc = "Grid: the layout at step 0 and step T, and segregation over time. Continuous: the flock at step 0 and step T, and polarisation over time. Graph: the network coloured by status at step T, and the S, I and R curves"
code = '''
{{?model=grid}} groupcolor(a) = a.group == 1 ? :steelblue : :darkorange
{{?model=grid}} fig = Figure(size = (1200, 400))
{{?model=grid}} abmplot!(Axis(fig[1, 1]; title = "Step 0", aspect = 1), initialize(); agent_color = groupcolor, agent_marker = :rect, agent_size = 12)  # same seed: the starting layout
{{?model=grid}} abmplot!(Axis(fig[1, 2]; title = "Step $T", aspect = 1), model; agent_color = groupcolor, agent_marker = :rect, agent_size = 12)
{{?model=grid}} ax = Axis(fig[1, 3]; xlabel = "Step", ylabel = "Share", title = "Segregation over time")
{{?model=grid}} lines!(ax, res.time, res.segregation; label = "Same-group neighbours")
{{?model=grid}} lines!(ax, res.time, res.share_happy; label = "Happy residents")
{{?model=grid}} axislegend(ax; position = :rb)
{{?model=grid}} display(fig)
{{?model=continuous}} arrow = Makie.Polygon(Point2f[(-0.1, -0.08), (0.2, 0.0), (-0.1, 0.08)])  # a triangle pointing along the heading
{{?model=continuous}} heading_marker(a) = rotate_polygon(arrow, atan(a.vel[2], a.vel[1]))
{{?model=continuous}} fig = Figure(size = (1200, 400))
{{?model=continuous}} abmplot!(Axis(fig[1, 1]; title = "Step 0", aspect = 1), initialize(); agent_marker = heading_marker, agent_color = :steelblue)  # same seed: the starting flock
{{?model=continuous}} abmplot!(Axis(fig[1, 2]; title = "Step $T", aspect = 1), model; agent_marker = heading_marker, agent_color = :steelblue)
{{?model=continuous}} ax = Axis(fig[1, 3]; xlabel = "Step", ylabel = "Polarisation", title = "Alignment over time")
{{?model=continuous}} lines!(ax, res.time, res.polarisation)
{{?model=continuous}} ylims!(ax, 0, 1)
{{?model=continuous}} display(fig)
{{?model=graph}} using GraphMakie  # loads the Agents.jl extension that draws GraphSpace models
{{?model=graph}} statuscolor(people) = (s = first(people).status; s == :S ? :steelblue : s == :I ? :crimson : :seagreen)  # one person per node
{{?model=graph}} fig = Figure(size = (1100, 450))
{{?model=graph}} ax1 = Axis(fig[1, 1]; title = "Network at step $T (blue S, red I, green R)")
{{?model=graph}} abmplot!(ax1, model; agent_color = statuscolor, agent_size = 8, agentsplotkwargs = (edge_color = (:gray, 0.3),))
{{?model=graph}} hidedecorations!(ax1)
{{?model=graph}} ax = Axis(fig[1, 2]; xlabel = "Step", ylabel = "Share of people", title = "SIR curves")
{{?model=graph}} lines!(ax, res.time, res.susceptible; label = "Susceptible", color = :steelblue)
{{?model=graph}} lines!(ax, res.time, res.infectious; label = "Infectious", color = :crimson)
{{?model=graph}} lines!(ax, res.time, res.recovered; label = "Recovered", color = :seagreen)
{{?model=graph}} axislegend(ax; position = :rc)
{{?model=graph}} display(fig)
'''

