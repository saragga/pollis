[[codeBranches]]
model = "browse"
code = """
using HTTP, JSON3

# The Kaggle dataset catalogue is public — no credentials needed to browse.
get_json(url) = JSON3.read(HTTP.get(url).body)

# Most-voted datasets; sortBy is one of hottest, votes, updated, published
res = get_json("https://www.kaggle.com/api/v1/datasets/list?sortBy=votes&pageSize=10")

for d in res
    println(d.ref, "  votes=", d.voteCount, "  downloads=", d.downloadCount)
end
"""

[[codeBranches]]
model = "info"
code = """
using HTTP, JSON3

# Public metadata via the list endpoint, searched by slug (no credentials needed)
get_json(url) = JSON3.read(HTTP.get(url).body)

res = get_json("https://www.kaggle.com/api/v1/datasets/list?search=iris&pageSize=5")
d = first(res)

println("ref:       ", d.ref)
println("title:     ", d.title)
println("size:      ", d.totalBytes, " bytes")
println("downloads: ", d.downloadCount, ",  votes: ", d.voteCount)
println("license:   ", d.licenseName)
"""

[[codeBranches]]
model = "files"
code = """
using HTTP, JSON3, Base64

# Listing a dataset's files needs a Kaggle token. Click "Set credentials" on the
# Powered-by line; it is injected into this REPL as KAGGLE_USERNAME / KAGGLE_KEY.
auth = ["Authorization" => "Basic " * base64encode(ENV["KAGGLE_USERNAME"] * ":" * ENV["KAGGLE_KEY"])]
get_json(url) = JSON3.read(HTTP.get(url, auth).body)

ref = "uciml/iris"   # ownerSlug/datasetSlug
res = get_json("https://www.kaggle.com/api/v1/datasets/list-files/$ref")

for f in res.datasetFiles
    println(f.name, "  ", f.totalBytes, " bytes")
end
"""

[[codeBranches]]
model = "download"
code = """
using HTTP, Base64, ZipFile

# Downloading needs a Kaggle token (KAGGLE_USERNAME / KAGGLE_KEY via "Set credentials").
ref = "uciml/iris"
auth = ["Authorization" => "Basic " * base64encode(ENV["KAGGLE_USERNAME"] * ":" * ENV["KAGGLE_KEY"])]

# The download endpoint returns a .zip of the dataset's files
r = HTTP.get("https://www.kaggle.com/api/v1/datasets/download/$ref", auth)
write("dataset.zip", r.body)

z = ZipFile.Reader("dataset.zip")
for f in z.files
    println(f.name, "  ", f.uncompressedsize, " bytes")
end
close(z)
"""

[[codeBranches]]
model = "load"
code = """
using ZipFile, CSV, Tables

# Read a CSV straight out of the downloaded archive (no DataFrames needed)
z = ZipFile.Reader("dataset.zip")
entry = first(filter(f -> endswith(f.name, ".csv"), z.files))

rows = CSV.File(read(entry))           # CSV.File is a Tables.jl source
println("columns: ", Tables.columnnames(rows))
println("rows:    ", length(rows))
println(first(rows))
close(z)
"""

[[actionGroups]]
id = "browse"
label = "Browse"

[[actionGroups.actions]]
id = "kgds-browse-search"
label = "Search by Keyword"
desc = "Find datasets matching a free-text query"
code = """
using HTTP, JSON3

get_json(url) = JSON3.read(HTTP.get(url).body)

q = HTTP.escapeuri("housing prices")
res = get_json("https://www.kaggle.com/api/v1/datasets/list?search=$q&sortBy=votes&pageSize=10")
for d in res
    println(d.ref, "  ", d.title)
end
"""

[[actionGroups.actions]]
id = "kgds-browse-filter"
label = "Filter by File Type"
desc = "List CSV datasets sorted by hotness"
code = """
using HTTP, JSON3

get_json(url) = JSON3.read(HTTP.get(url).body)

res = get_json("https://www.kaggle.com/api/v1/datasets/list?fileType=csv&sortBy=hottest&pageSize=10")
for d in res
    println(d.ref, "  ", d.totalBytes, " bytes")
end
"""

[[actionGroups]]
id = "download"
label = "Download"

[[actionGroups.actions]]
id = "kgds-download-cli"
label = "Use the Kaggle CLI"
desc = "Shell out to the official kaggle CLI (reads the same KAGGLE_* env vars)"
code = """
# The official Kaggle CLI reads KAGGLE_USERNAME / KAGGLE_KEY from the environment.
# Pollis injects them into this REPL session when you click "Set credentials".
run(`kaggle datasets download -d uciml/iris -p . --unzip`)

# Now the CSV files are in the current directory, ready for CSV.jl
println(filter(f -> endswith(f, ".csv"), readdir()))
"""

[[actionGroups.actions]]
id = "kgds-download-version"
label = "Download a Specific Version"
desc = "Pin a dataset version with the datasetVersionNumber query parameter"
code = """
using HTTP, Base64

ref = "uciml/iris"
auth = ["Authorization" => "Basic " * base64encode(ENV["KAGGLE_USERNAME"] * ":" * ENV["KAGGLE_KEY"])]

url = "https://www.kaggle.com/api/v1/datasets/download/$ref?datasetVersionNumber=1"
r = HTTP.get(url, auth)
write("dataset-v1.zip", r.body)
println("saved ", length(r.body), " bytes")
"""

[[actionGroups]]
id = "load"
label = "Load"

[[actionGroups.actions]]
id = "kgds-load-columns"
label = "Read Selected Columns"
desc = "Read only some columns from a CSV with CSV.jl"
code = """
using ZipFile, CSV, Tables

z = ZipFile.Reader("dataset.zip")
entry = first(filter(f -> endswith(f.name, ".csv"), z.files))

# select restricts the parsed columns; CSV.File stays a Tables.jl source
rows = CSV.File(read(entry); select = [:SepalLengthCm, :Species])
println(Tables.columnnames(rows))
close(z)
"""

[[actionGroups.actions]]
id = "kgds-load-rows"
label = "Collect Rows as NamedTuples"
desc = "Materialise rows without DataFrames, using the Tables.jl interface"
code = """
using ZipFile, CSV, Tables

z = ZipFile.Reader("dataset.zip")
entry = first(filter(f -> endswith(f.name, ".csv"), z.files))

rows = [NamedTuple(r) for r in CSV.File(read(entry))]
println("rows: ", length(rows))
println(first(rows))
close(z)
"""
