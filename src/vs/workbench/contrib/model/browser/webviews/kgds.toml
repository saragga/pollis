# Kaggle Datasets Webview Configuration
# Declarative source. The build script generates kgds.data.ts.
# Run: npm run gulp compile-toml
#
# Approach: Kaggle exposes a REST API at www.kaggle.com/api/v1. The dataset
# catalogue (datasets/list) is public — browse, search, and filter need no
# credentials. Listing a dataset's files and downloading it require a free Kaggle
# API token (username + key). Datasets are mostly CSV/SQLite, so the Julia stack is
# HTTP.jl + JSON3.jl to talk to the API, ZipFile.jl to unpack a download, and
# CSV.jl + Tables.jl to read the data (no DataFrames.jl).

[meta]
title = "Kaggle Datasets"
viewType = "pollis.kgds"
defaultModel = "browse"
models = ["browse", "info", "files", "download", "load"]
illusCollapsed = false
illustrationText = "Search the Kaggle catalogue, then pull datasets into Julia: browse and filter over the public REST API, read a dataset's metadata and file list, download the archive, and load the CSVs with CSV.jl + Tables.jl."

# Per-pane intro/footnote notes (optional, keyed by pane: keyPoints / decision / explore).
[notes.decision]
footnote = "Browse and Dataset Info use the public Kaggle REST API directly (HTTP.jl + JSON3.jl) — no credentials needed. List Files, Download, and Load require a free Kaggle API token (click \"Set credentials\"); the download is a .zip read with ZipFile.jl and the CSVs with CSV.jl + Tables.jl."

[notes.explore]
intro = "A query joins your selections with <strong>OR</strong> inside a category and <strong>AND</strong> across categories, matched by Kaggle's full-text search. For example, picking <em>Classification</em> under Task plus <em>Medicine</em> plus <em>Finance</em> under Domain builds: <code>(Classification) AND (Medicine OR Finance)</code>"

# Kaggle has no task or subject filter parameters, so both axes are matched by full-text
# search: each chip value is a search term, a combo's terms are joined into one search query,
# OR-ed within an axis (separate requests, merged) and AND-ed across axes (joined terms).
