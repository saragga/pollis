[[bullets]]
text = "Hypervolume"
detail = "volume of objective space dominated by the front relative to a reference point"

[[bullets]]
text = "Generational Distance (GD)"
detail = "average distance from obtained front to true Pareto front"

[[bullets]]
text = "Inverted Generational Distance (IGD)"
detail = "average distance from true front to obtained front"

[[bullets]]
text = "Epsilon-Indicator"
detail = "smallest additive shift such that obtained front epsilon-dominates true front"

[[bullets]]
text = "Spacing"
detail = "uniformity of the solution distribution along the Pareto front"

[[decisionRows]]
task = "Hypervolume"
context = "No true front is known, or a single number rewarding both convergence and spread is wanted; the only metric strictly monotone with Pareto dominance"
purpose = "Volume of objective space dominated by the front and bounded by a reference point (here 10% beyond the joint nadir). Larger is better; each point's exclusive contribution shows which trade-offs matter"

[[decisionRows]]
task = "Generational Distance"
context = "A reference front is known and only convergence (closeness) matters"
purpose = "Mean distance from each obtained point to its nearest reference point. Smaller is better; blind to spread: a single point on the true front scores zero"

[[decisionRows]]
task = "Inverted Generational Distance"
context = "A reference front is known and both convergence and coverage matter: the usual benchmark metric"
purpose = "Mean distance from each reference point to its nearest obtained point. Smaller is better; gaps in the front are penalised because the reference points there are far from everything"

[[decisionRows]]
task = "Epsilon-Indicator"
context = "A worst-case guarantee is wanted: how far the front is from dominating the reference everywhere"
purpose = "Additive epsilon: smallest shift eps such that every reference point is weakly dominated by some obtained point moved by -eps. Smaller is better; driven by the single worst-covered region"

[[decisionRows]]
task = "Spacing"
context = "Uniformity of the front matters, e.g. before handing a set of trade-offs to a decision maker; needs no reference front"
purpose = "Standard deviation of each point's distance (L1) to its nearest neighbour (Schott). Zero means evenly spaced; says nothing about convergence or extent"

[[inputs]]
id = "result"
label = "Result"
tooltip = "Variable holding the optimisation result (a Metaheuristics State) or a front matrix (one row per point). Default: the built-in demo, NSGA-II on ZDT1."
default = "demo_result"

[[inputs]]
id = "ref"
label = "Reference Front"
tooltip = "Variable holding the true (reference) front: a matrix with one row per point, or solutions accepted by pareto_front. Used by GD, IGD, Epsilon and the Hypervolume reference point. Default: the known ZDT1 front."
default = "demo_ref"

[[inputs]]
id = "result2"
label = "Second Result"
tooltip = "Second result or front matrix for the Compare actions. Default: the demo run with SPEA2."
default = "demo_result2"

