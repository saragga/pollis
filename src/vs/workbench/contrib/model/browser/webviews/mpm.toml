[[codeBranches]]
model = "hv"
code = '''
using Metaheuristics, LinearAlgebra, Random
Ind = Metaheuristics.PerformanceIndicators

# Demo: NSGA-II and SPEA2 on ZDT1, whose true front is known (replace the inputs with your own variables)
zdt, zdt_bounds, zdt_front = Metaheuristics.TestProblems.get_problem(:ZDT1)
demo_opts() = Options(iterations=100, seed=1, store_convergence=true)
demo_result = optimize(zdt, zdt_bounds, NSGA2(options=demo_opts()))
demo_result2 = optimize(zdt, zdt_bounds, SPEA2(options=demo_opts()))
demo_ref = pareto_front(zdt_front)

as_front(r) = r isa AbstractMatrix ? Matrix{Float64}(r) : pareto_front(r)  # State or solutions -> one row per point
front, front2, ref = as_front({{result}}), as_front({{result2}}), as_front({{ref}})
all_pts = [front; front2; ref]
refpoint = vec(maximum(all_pts, dims=1)) .+ 0.1 .* vec(maximum(all_pts, dims=1) .- minimum(all_pts, dims=1))  # hypervolume reference point
nearest(a, B) = minimum(norm(a .- B[j, :]) for j in axes(B, 1))

hypervolume(F) = (keep = vec(all(F .< transpose(refpoint), dims=2)); any(keep) ? Ind.hypervolume(F[keep, :], refpoint; verbose=false) : 0.0)  # larger is better
gd(F) = Ind.gd(F, ref)  # mean distance obtained -> reference; smaller is better
igd(F) = Ind.igd(F, ref)  # mean distance reference -> obtained; smaller is better
epsilon(F) = maximum(minimum(maximum(F[i, :] .- ref[j, :]) for i in axes(F, 1)) for j in axes(ref, 1))  # additive epsilon; smaller is better
nn_l1(F) = [minimum(sum(abs.(F[i, :] .- F[j, :])) for j in axes(F, 1) if j != i) for i in axes(F, 1)]  # L1 distance to nearest neighbour
spacing(F) = Ind.spacing(F)  # 0 = perfectly even
all_metrics(F) = (hypervolume = hypervolume(F), gd = gd(F), igd = igd(F), epsilon = epsilon(F), spacing = spacing(F))
name, better = "Hypervolume", "higher"
metric(F) = hypervolume(F)
pointwise(F) = (F, [hypervolume(F) - hypervolume(F[setdiff(axes(F, 1), i), :]) for i in axes(F, 1)], "exclusive hypervolume contribution")

(metric = name, value = metric(front), better = better, front_size = size(front, 1), reference_size = size(ref, 1), objectives = size(front, 2))
'''

