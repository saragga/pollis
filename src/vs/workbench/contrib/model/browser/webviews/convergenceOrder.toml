id = "ode"
label = "ODE Solver"

[[models]]
id = "strong"
label = "SDE Strong Order"

[[models]]
id = "weak"
label = "SDE Weak Order"

[[bullets]]
text = "A solver of order p divides its error by about 2^p when its step is halved: the order is the slope of the error against the step on log scales, and a solver whose slope falls short of its theory has a mistake, even when its results look right"
detail = ""

[[bullets]]
text = "ODE Solver: the error at the end of exponential growth, whose exact solution is known, for Euler, Midpoint and RK4, of orders 1, 2 and 4"
detail = ""

[[bullets]]
text = "SDE Strong Order: the mean error along each Brownian path of geometric Brownian motion, for Euler-Maruyama, Milstein and SRIW1, of strong orders 1/2, 1 and 3/2"
detail = ""

[[bullets]]
text = "SDE Weak Order: the error in the mean of the same model, for the same solvers, of weak orders 1, 1 and 2"
detail = ""

[[decisionRows]]
task = "ODE Solver"
context = "Deterministic equations"
purpose = "When a solver or a scheme written by hand steps an ordinary differential equation forward in time"

[[decisionRows]]
task = "SDE Strong Order"
context = "Each path matters"
purpose = "When a result follows a particular path of the noise, as in filtering or in a sensitivity along a path"

[[decisionRows]]
task = "SDE Weak Order"
context = "Only means matter"
purpose = "When a result is a mean over many paths, such as a price, a moment or a probability"

