# Check a Convergence Order Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/convergenceOrder.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Check a Convergence Order"
viewType = "pollis.convergenceOrder"
defaultModel = "ode"
decisionFirstColumn = "Order"

[[packages]]
name = "DiffEqDevTools.jl"
github = "https://github.com/SciML/DiffEqDevTools.jl"

[[packages]]
name = "OrdinaryDiffEqLowOrderRK.jl"
github = "https://github.com/SciML/OrdinaryDiffEq.jl/tree/master/lib/OrdinaryDiffEqLowOrderRK"

[[packages]]
name = "StochasticDiffEq.jl"
github = "https://github.com/SciML/StochasticDiffEq.jl"

[requires]
packages = ["StableRNGs.jl", "Plots.jl"]

[[wikis]]
name = "Overview"
file = "convergenceOrder/overview.md"
bundled = true
description = "What the order of a solver is, how DiffEqDevTools estimates it, the strong and the weak order of a solver for stochastic equations, and how an order differs from a property and a saved result"

[[wikis]]
name = "Factsheet"
file = "convergenceOrder/factsheet.md"
bundled = true
description = "Tabs, solvers and their orders, inputs, functions of DiffEqDevTools and actions at a glance"

[[wikis]]
name = "Convergence Tests in a Package"
file = "convergenceOrder/convergence-in-a-package.md"
bundled = true
description = "Which packages need a convergence test, a test problem with an exact solution, the same Brownian paths at every step, step sizes, paths, the allowed gap, and a scheme written by hand"

