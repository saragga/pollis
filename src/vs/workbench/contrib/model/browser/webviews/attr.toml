[[inputs]]
id = "u0"
label = "Initial state (u0)"
tooltip = "Starting point of the Lorenz system, a vector (x, y, z). The default [1.0, 0.0, 0.0] is Lorenz's own starting point, near the origin."
default = "[1.0, 0.0, 0.0]"

[[inputs]]
id = "p"
label = "Parameters (p)"
tooltip = "Parameters of the Lorenz system, a vector [sigma, rho, beta]. The default [10.0, 28.0, 8/3] gives Lorenz's classic chaotic attractor; rho = 20 gives two stable fixed points instead. The Bifurcation tab keeps sigma and beta and varies rho from 0.5 to 35."
default = "[10.0, 28.0, 8/3]"

[[inputs]]
id = "N"
label = "Grid resolution (N)"
tooltip = "Number of grid points per dimension for the basin/attractor mapper. Higher values give finer resolution at greater computational cost. The Bifurcation tab does not use a grid."
default = "30"

[[codeBranches]]
model = "attract"
code = '''
using DynamicalSystems, Attractors

function lorenz!(du, u, p, t)  # Lorenz system (sigma, rho, beta), in place
    du[1] = p[1] * (u[2] - u[1])
    du[2] = u[1] * (p[2] - u[3]) - u[2]
    du[3] = u[1] * u[2] - p[3] * u[3]
    return nothing
end

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})  # define system
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # state-space search grid
mapper = BasinMapRecurrences(ds, grid; consecutive_recurrences = 1000, attractor_locate_steps = 1000)  # recurrence-based attractor mapper

ics = RandomICsSampler(200, grid, 1)  # 200 random initial conditions in the grid box
basins_fractions(mapper, ics)  # map them first: the mapper only knows the attractors it has met
attractors = extract_attractors(mapper)  # find all coexisting attractors
println("Number of attractors found: ", length(attractors))  # count distinct attractors
'''

[[codeBranches]]
model = "basins"
code = '''
using DynamicalSystems, Attractors

function lorenz!(du, u, p, t)  # Lorenz system (sigma, rho, beta), in place
    du[1] = p[1] * (u[2] - u[1])
    du[2] = u[1] * (p[2] - u[3]) - u[2]
    du[3] = u[1] * u[2] - p[3] * u[3]
    return nothing
end

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})  # define system
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # search grid
mapper = BasinMapRecurrences(ds, grid; consecutive_recurrences = 1000, attractor_locate_steps = 1000)  # recurrence mapper

basins, attractors = basins_of_attraction(mapper, grid)  # classify every grid point
fracs = basins_fractions(basins)  # fraction of grid in each basin
println("Basin fractions: ", fracs)  # relative size of each basin
'''

[[codeBranches]]
model = "bifur"
code = '''
using BifurcationKit

function lorenz!(du, u, p, t)  # Lorenz system (sigma, rho, beta), in place
    du[1] = p[1] * (u[2] - u[1])
    du[2] = u[1] * (p[2] - u[3]) - u[2]
    du[3] = u[1] * u[2] - p[3] * u[3]
    return nothing
end
lorenz(u, p) = (du = similar(u, promote_type(eltype(u), eltype(p))); lorenz!(du, u, p, 0.0); du)  # its vector field, as BifurcationKit wants it

p = {{p}}  # sigma and beta are kept; rho is varied
prob = BifurcationProblem(lorenz, zeros(3), [p[1], 0.5, p[3]], (@optic _[2]);  # the origin, an equilibrium for every rho, at rho = 0.5
    record_from_solution = (u, p; k...) -> (x = u[1], z = u[3]))  # what is kept of each equilibrium
opts = ContinuationPar(p_min = 0.0, p_max = 35.0, ds = 0.01, dsmax = 0.25, max_steps = 1000,
    detect_bifurcation = 3, n_inversion = 6, nev = 3)  # locate bifurcation points precisely

origin = continuation(prob, PALC(), opts)  # the origin as rho grows: a pitchfork at rho = 1
wings = continuation(origin, 1, opts; bothside = true)  # switch at the pitchfork onto C+ and C-: a Hopf where they lose stability
println(origin)  # bifurcation points on the origin
println(wings)  # bifurcation points on C+ and C-
'''

