[[actionGroups.actions]]
id = "attractor-plot"
label = "Attractor Plot"
desc = "Plot each attractor as a distinct trajectory coloured by attractor index"
code = '''
using DynamicalSystems, Attractors, GLMakie

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # search grid
mapper = BasinMapRecurrences(ds, grid; consecutive_recurrences = 1000, attractor_locate_steps = 1000)  # mapper
ics = RandomICsSampler(200, grid, 1)  # 200 random initial conditions in the grid box
basins_fractions(mapper, ics)  # map them first: the mapper only knows the attractors it has met
attractors = extract_attractors(mapper)  # find attractors

for (k, A) in attractors
    scatter!(vec(A[:, 1]), vec(A[:, 3]); label="A$k")  # plot each attractor
end
'''

[[actionGroups.actions]]
id = "bifurcation-diagram"
label = "Bifurcation Diagram"
desc = "Plot the equilibria against rho, stable solid and unstable dashed, with the pitchfork and Hopf points marked"
code = '''
using BifurcationKit, GLMakie

lorenz(u, p) = [p[1] * (u[2] - u[1]), u[1] * (p[2] - u[3]) - u[2], u[1] * u[2] - p[3] * u[3]]  # Lorenz vector field (sigma, rho, beta)
p = {{p}}  # sigma and beta are kept; rho is varied
prob = BifurcationProblem(lorenz, zeros(3), [p[1], 0.5, p[3]], (@optic _[2]); record_from_solution = (u, p; k...) -> (x = u[1], z = u[3]))
opts = ContinuationPar(p_min = 0.0, p_max = 35.0, ds = 0.01, dsmax = 0.25, max_steps = 1000, detect_bifurcation = 3, n_inversion = 6, nev = 3)
origin = continuation(prob, PALC(), opts)  # the origin
wings = continuation(origin, 1, opts; bothside = true)  # C+ and C-, from the pitchfork

fig = Figure()
ax = Axis(fig[1, 1]; xlabel = "rho", ylabel = "x at the equilibrium", title = "Equilibria of the Lorenz system")
for br in (origin, wings)
    rho, x, stable = br.branch.param, br.branch.x, br.branch.stable
    lines!(ax, rho, ifelse.(stable, x, NaN); color = :steelblue, linewidth = 2)  # stable: solid
    lines!(ax, rho, ifelse.(stable, NaN, x); color = :steelblue, linestyle = :dash)  # unstable: dashed
end
for (br, kind, label, colour) in ((origin, :bp, " pitchfork", :black), (wings, :hopf, " Hopf", :red))
    for sp in filter(sp -> sp.type == kind, br.specialpoint)
        scatter!(ax, [sp.param], [sp.printsol.x]; color = colour, markersize = 12)  # the bifurcation point
        text!(ax, sp.param, sp.printsol.x; text = label, align = (:left, :bottom))
    end
end
fig
'''

