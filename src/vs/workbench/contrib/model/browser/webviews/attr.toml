id = "bifur"
label = "Bifurcation"

[[bullets]]
text = "Attractor Finding"
detail = "locate all coexisting attractors in a state-space grid using recurrence-based or proximity mappers"

[[bullets]]
text = "Basins of Attraction"
detail = "classify every grid point by the attractor it converges to and compute basin fractions"

[[bullets]]
text = "Bifurcation Diagrams"
detail = "trace how attractors and their basins evolve as a system parameter varies using global continuation"

[[inputs]]
id = "u0"
label = "Initial state (u0)"
tooltip = "Starting point for the system. Used as the seed for the attractor mapper and basin classifier."
default = "u0"

[[inputs]]
id = "p"
label = "Parameters (p)"
tooltip = "System parameter tuple. Lorenz: (10.0, 28.0, 2.667). Henon: (1.4, 0.3)."
default = "p"

[[inputs]]
id = "N"
label = "Grid resolution (N)"
tooltip = "Number of grid points per dimension for the basin/attractor mapper. Higher values give finer resolution at greater computational cost."
default = "20"

[[codeBranches]]
model = "attract"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})  # define system
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # state-space search grid
mapper = BasinMapRecurrences(ds, grid)  # recurrence-based attractor mapper

sampler, _ = statespace_sampler(grid, 1)  # random initial conditions in the grid box
basins_fractions(mapper, sampler; N=200)  # map them first: the mapper only knows the attractors it has met
attractors = extract_attractors(mapper)  # find all coexisting attractors
println("Number of attractors found: ", length(attractors))  # count distinct attractors
'''

[[codeBranches]]
model = "basins"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})  # define system
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # search grid
mapper = BasinMapRecurrences(ds, grid)  # recurrence mapper

basins, attractors = basins_of_attraction(mapper, grid)  # classify every grid point
fracs = basins_fractions(basins)  # fraction of grid in each basin
println("Basin fractions: ", fracs)  # relative size of each basin
'''

[[codeBranches]]
model = "bifur"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})  # define system
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # search grid
mapper = BasinMapRecurrences(ds, grid)  # mapper

prange = range(20.0, 35.0; length=30)  # parameter sweep range for rho
pidx   = 2  # index of rho in parameter tuple
sampler, _ = statespace_sampler(Random.MersenneTwister(1234); min_bounds={{u0}} .- 5, max_bounds={{u0}} .+ 5)  # random IC sampler

cont_alg = AttractorSeedContinueMatch(mapper)  # seed-based continuation
fracs_cont, attractors_cont = global_continuation(cont_alg, prange, pidx, sampler)  # trace attractors vs parameter
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "basin-portrait"
label = "Basin Portrait"
desc = "Colour-code a 2D cross-section of state space by which attractor each point converges to"
code = '''
using DynamicalSystems, Attractors, GLMakie

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(25, 25; length=1))  # 2D slice at z=25
mapper = BasinMapRecurrences(ds, grid)  # mapper
basins, attractors = basins_of_attraction(mapper, grid)  # classify grid

heatmap(basins[:, :, 1])  # colour map of basins in x-y plane
'''

[[actionGroups.actions]]
id = "attractor-plot"
label = "Attractor Plot"
desc = "Plot each attractor as a distinct trajectory coloured by attractor index"
code = '''
using DynamicalSystems, Attractors, GLMakie

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # search grid
mapper = BasinMapRecurrences(ds, grid)  # mapper
sampler, _ = statespace_sampler(grid, 1)  # random initial conditions in the grid box
basins_fractions(mapper, sampler; N=200)  # map them first: the mapper only knows the attractors it has met
attractors = extract_attractors(mapper)  # find attractors

for (k, A) in attractors
    scatter!(vec(A[:, 1]), vec(A[:, 3]); label="A$k")  # plot each attractor
end
'''

[[actionGroups.actions]]
id = "bifurcation-diagram"
label = "Bifurcation Diagram"
desc = "Show how attractor basin fractions evolve as a parameter is varied"
code = '''
using DynamicalSystems, Attractors, GLMakie

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
mapper = BasinMapRecurrences(ds, grid)  # mapper
prange = range(20.0, 35.0; length=20)  # parameter range
sampler, _ = statespace_sampler(Random.MersenneTwister(1))  # IC sampler
fracs_cont, _ = global_continuation(AttractorSeedContinueMatch(mapper), prange, 2, sampler)  # continuation

plot_basins_curves(fracs_cont, prange)  # basin fraction vs parameter
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "basin-fractions"
label = "Basin Fractions"
desc = "Compute what fraction of the state-space grid converges to each attractor"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
basins, attractors = basins_of_attraction(BasinMapRecurrences(ds, grid), grid)  # classify

fracs = basins_fractions(basins)  # relative basin sizes
for (k, f) in fracs
    println("Attractor ", k, ": ", round(f*100; digits=1), "%")  # print each fraction
end
'''

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Verify that the mapper consistently assigns the same attractor to repeated initial conditions"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
mapper = BasinMapRecurrences(ds, grid)  # mapper

label1 = mapper({{u0}})  # label for reference IC
label2 = mapper({{u0}} .+ 1e-6)  # label for slightly perturbed IC
println("Same basin: ", label1 == label2)  # true if ICs share a basin
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "attractor-change"
label = "Attractor under Param Change"
desc = "Predict which attractors survive as a system parameter crosses a bifurcation point"
code = '''
using DynamicalSystems, Attractors

p_before = {{p}}  # original parameters
p_after  = (10.0, 24.0, 8/3)  # parameters past a bifurcation

for p_i in [p_before, p_after]
    ds = CoupledODEs(lorenz!, {{u0}}, p_i)
    grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
    mapper = BasinMapRecurrences(ds, grid)
    basins_fractions(mapper, statespace_sampler(grid, 1)[1]; N=200)  # map initial conditions first: the mapper only knows the attractors it has met
    att = extract_attractors(mapper)  # attractors found
    println("p=", p_i, " -> ", length(att), " attractor(s)")  # count attractors
end
'''

[[actionGroups.actions]]
id = "tipping-point"
label = "Tipping Point"
desc = "Identify the parameter value where an attractor disappears or a basin collapses"
code = '''
using DynamicalSystems, Attractors

prange = range(10.0, 30.0; length=40)  # sweep rho over [10, 30]

for rho in prange
    ds = CoupledODEs(lorenz!, {{u0}}, (10.0, rho, 8/3))
    grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
    mapper = BasinMapRecurrences(ds, grid)
    basins_fractions(mapper, statespace_sampler(grid, 1)[1]; N=200)  # map initial conditions first: the mapper only knows the attractors it has met
    att = extract_attractors(mapper)  # attractors found
    println("rho=", rho, ": ", length(att), " attractor(s)")  # detect transition
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "mappers"
label = "Recurrence vs Proximity"
desc = "Compare AttractorsViaRecurrences and AttractorsViaProximity on the same system"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid

sampler, _ = statespace_sampler(grid, 1)  # random initial conditions in the grid box
m_rec  = BasinMapRecurrences(ds, grid)  # recurrence mapper
fr_rec = basins_fractions(m_rec, sampler; N=500)  # finds the attractors as it maps
att_r  = extract_attractors(m_rec)  # attractors via recurrence
m_prox = BasinMapProximity(ds, att_r)  # proximity mapper: needs the attractors to be known already
fr_prox = basins_fractions(m_prox, sampler; N=500)

println("Recurrence: ", length(att_r), " attractor(s), basin fractions ", fr_rec)
println("Proximity:  basin fractions ", fr_prox)  # should agree with recurrence up to sampling noise
'''

[[actionGroups.actions]]
id = "single-vs-multi"
label = "Single vs Multi-Stability"
desc = "Check whether a system has one or multiple coexisting attractors at the current parameters"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
mapper = BasinMapRecurrences(ds, grid)
basins_fractions(mapper, statespace_sampler(grid, 1)[1]; N=200)  # map initial conditions first: the mapper only knows the attractors it has met
att = extract_attractors(mapper)  # attractors found

println(length(att) == 1 ? "Monostable" : "Multistable ($(length(att)) attractors)")  # stability diagnosis
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "basin-entropy"
label = "Basin Entropy"
desc = "Compute basin entropy as a scalar measure of how intermingled the basins are"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
basins, _ = basins_of_attraction(BasinMapRecurrences(ds, grid), grid)  # classify

Sb, Sbb = basin_entropy(basins)  # basin entropy and boundary basin entropy (Daza et al. 2016)
println("Basin entropy Sb: ", Sb, "  boundary basin entropy Sbb: ", Sbb)  # Sb = 0: a single basin
println(Sbb > log(2) ? "Sbb > log 2: the basin boundaries are fractal" : "Sbb <= log 2: inconclusive, the boundaries may or may not be fractal")
'''

[[actionGroups.actions]]
id = "attractor-dimension"
label = "Attractor Dimension"
desc = "Estimate the correlation dimension of the found attractor to characterise its geometry"
code = '''
using DynamicalSystems, Attractors, FractalDimensions

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
tr, _ = trajectory(ds, 200.0; Dt=0.01)  # long orbit on attractor

eps_vals = exp10.(range(-2, 1; length=20))  # length scales
D2 = grassberger_proccacia_dim(tr, eps_vals)  # correlation dimension
println("Correlation dimension: ", D2)  # Lorenz attractor ~ 2.05
'''
