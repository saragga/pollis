[[actionGroups.actions]]
id = "attractor-change"
label = "Attractor under Param Change"
desc = "Predict which attractors survive as a system parameter crosses a bifurcation point"
code = '''
using DynamicalSystems, Attractors

p_before = {{p}}  # original parameters
p_after  = (10.0, 24.0, 8/3)  # parameters past a bifurcation

for p_i in [p_before, p_after]
    ds = CoupledODEs(lorenz!, {{u0}}, p_i)
    grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
    mapper = BasinMapRecurrences(ds, grid; consecutive_recurrences = 1000, attractor_locate_steps = 1000)
    att = try
        basins_fractions(mapper, RandomICsSampler(200, grid, 1))  # map initial conditions first: the mapper only knows the attractors it has met
        extract_attractors(mapper)  # attractors found
    catch
        nothing  # two attractors met in one grid cell
    end
    println("p=", p_i, " -> ", att === nothing ? "attractors too close for the grid: try a larger N" : "$(length(att)) attractor(s)")  # count attractors
end
'''

[[actionGroups.actions]]
id = "tipping-point"
label = "Tipping Point"
desc = "Identify the parameter value where an attractor disappears or a basin collapses"
code = '''
using DynamicalSystems, Attractors

prange = range(10.0, 30.0; length=40)  # sweep rho over [10, 30]

for rho in prange
    ds = CoupledODEs(lorenz!, {{u0}}, (10.0, rho, 8/3))
    grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
    mapper = BasinMapRecurrences(ds, grid; consecutive_recurrences = 1000, attractor_locate_steps = 1000)
    att = try
        basins_fractions(mapper, RandomICsSampler(200, grid, 1))  # map initial conditions first: the mapper only knows the attractors it has met
        extract_attractors(mapper)  # attractors found
    catch
        nothing  # two attractors met in one grid cell: likeliest where chaos and the fixed points coexist, rho about 23-25
    end
    println("rho=", rho, ": ", att === nothing ? "attractors too close for the grid: try a larger N" : "$(length(att)) attractor(s)")  # detect transition
end
'''

[[actionGroups]]
