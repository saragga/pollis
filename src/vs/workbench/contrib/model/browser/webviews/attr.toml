[[actionGroups.actions]]
id = "basin-fractions"
label = "Basin Fractions"
desc = "Compute what fraction of the state-space grid converges to each attractor"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
basins, attractors = basins_of_attraction(BasinMapRecurrences(ds, grid; consecutive_recurrences = 1000, attractor_locate_steps = 1000), grid)  # classify

fracs = basins_fractions(basins)  # relative basin sizes
for (k, f) in fracs
    println("Attractor ", k, ": ", round(f*100; digits=1), "%")  # print each fraction
end
'''

[[actionGroups.actions]]
id = "convergence-check"
label = "Convergence Check"
desc = "Verify that the mapper consistently assigns the same attractor to repeated initial conditions"
code = '''
using DynamicalSystems, Attractors

ds = CoupledODEs(lorenz!, {{u0}}, {{p}})
grid = (range(-30, 30; length={{N}}), range(-30, 30; length={{N}}), range(0, 60; length={{N}}))  # grid
mapper = BasinMapRecurrences(ds, grid; consecutive_recurrences = 1000, attractor_locate_steps = 1000)  # mapper

label1 = mapper({{u0}})  # label for reference IC
label2 = mapper({{u0}} .+ 1e-6)  # label for slightly perturbed IC
println("Same basin: ", label1 == label2)  # true if ICs share a basin
'''

