[[models]]
id = "minlp"
label = "Mixed-Integer NLP (MINLP)"

[[models]]
id = "gnlp"
label = "Global NLP"

[[decisionRows]]
task = "NLP"
context = "Smooth nonlinear objective and constraints, continuous variables"
purpose = "Interior-point search for a locally optimal point satisfying the KKT conditions"

[[decisionRows]]
task = "MINLP"
context = "Nonlinear model with on/off or cardinality decisions"
purpose = "Branch and bound over binary variables with NLP relaxations at each node"

[[decisionRows]]
task = "Global NLP"
context = "Nonconvex problems where a local optimum is not good enough"
purpose = "Spatial branch and bound with convex relaxations to certify the global optimum"

[[inputs]]
id = "n"
label = "n"
tooltip = "Number of decision variables x[1], ..., x[n]."
default = "5"

[[inputs]]
id = "sense"
label = "Sense"
tooltip = "Direction of optimisation."
kind = "select"
default = "Min"

[[inputs.options]]
value = "Min"
label = "Minimise"

[[inputs.options]]
value = "Max"
label = "Maximise"

[[inputs]]
id = "obj"
label = "Objective"
tooltip = "Nonlinear expression in the vector x, for example sum((x .- 1) .^ 2) + 3 * x[1] * x[2] + x[1] (nonconvex: with n = 5 and the default constraint, two local minima with objective values of about -0.54 and 1.69) or sum(sin.(x)). JuMP builds the nonlinear expression directly; user functions need @operator."
default = "sum((x .- 1) .^ 2) + 3 * x[1] * x[2] + x[1]"
newRow = true

[[inputs]]
id = "cons"
label = "Constraint"
tooltip = "One constraint in x, for example sum(x) == 1 or sum(x .^ 2) <= 4. Add further @constraint lines in the generated code."
default = "sum(x .^ 2) <= 4"

[[inputs]]
id = "lb"
label = "Lower Bound"
tooltip = "Lower bound on every x[i]. Global solvers need finite bounds, and tighter bounds help them. For MINLP it must be at most 0 so that x[i] can switch off, and it is the big-M of the switch, so keep it as tight as the constraint allows (the default ball sum(x .^ 2) <= 4 implies -2)."
default = "-2"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bound"
tooltip = "Upper bound on every x[i]. Global solvers need finite bounds, and tighter bounds help them. For MINLP it is also the big-M of the switch (the default ball implies 2)."
default = "2"

[[inputs]]
id = "card"
label = "Max Nonzeros"
tooltip = "At most this many x[i] may be nonzero; each x[i] is tied to a binary switch z[i]."
default = "2"
models = ["minlp"]

[[inputs]]
id = "nlpsolver"
label = "Solver"
tooltip = "Ipopt: the standard interior-point solver for smooth NLPs. MadNLP: a pure-Julia interior-point solver with the same interface, GPU-capable."
kind = "select"
default = "Ipopt"
models = ["nlp"]

[[inputs.options]]
value = "Ipopt"
label = "Ipopt"

[[inputs.options]]
value = "MadNLP"
label = "MadNLP"

[[inputs]]
id = "minlpsolver"
label = "Solver"
tooltip = "SCIP: branch and cut with spatial branching, handles nonconvex MINLPs. Juniper: branch and bound over Ipopt relaxations, exact for convex MINLPs only."
kind = "select"
default = "SCIP"
models = ["minlp"]

[[inputs.options]]
value = "SCIP"
label = "SCIP"

[[inputs.options]]
value = "Juniper"
label = "Juniper + Ipopt"

[[inputs]]
id = "gsolver"
label = "Solver"
tooltip = "EAGO: pure-Julia deterministic global optimiser using McCormick relaxations. SCIP: spatial branch and bound, also certifies global optimality."
kind = "select"
default = "EAGO"
models = ["gnlp"]

[[inputs.options]]
value = "EAGO"
label = "EAGO"

[[inputs.options]]
value = "SCIP"
label = "SCIP"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.nlp]
# Nested elliptical contours with the optimum at the centre
svg = '''
var s = '';
[18, 12, 6].forEach(function (r, i) {
	s += '<ellipse cx="27" cy="46" rx="' + r + '" ry="' + (r * 0.65).toFixed(1) + '" fill="none" stroke="currentColor" stroke-width="1" opacity="' + (0.4 + 0.2 * i) + '" transform="rotate(-25 27 46)"/>';
});
return s + '<circle cx="27" cy="46" r="2.2" fill="currentColor"/>';
'''

[miniCharts.minlp]
# Contours with integer lattice points, one of them chosen
svg = '''
var s = '<ellipse cx="27" cy="46" rx="18" ry="11" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5" transform="rotate(-25 27 46)"/>';
for (var i = 0; i < 4; i++) { for (var j = 0; j < 3; j++) {
	s += '<circle cx="' + (12 + i * 10) + '" cy="' + (36 + j * 10) + '" r="1.4" fill="currentColor" opacity="0.5"/>';
} }
return s + '<circle cx="32" cy="46" r="2.8" fill="none" stroke="currentColor" stroke-width="1.4"/>';
