[[bullets]]
text = "Ipopt"
detail = "The standard open-source interior-point solver for smooth NLPs: a logarithmic barrier keeps the iterates inside the bounds, and a filter line search accepts the Newton steps"

[[bullets]]
text = "MadNLP"
detail = "An interior-point solver written in Julia, with the same interface as Ipopt, which can run its linear algebra on a GPU for large problems"

[[bullets]]
text = "Uno"
detail = "A solver that assembles Lagrange-Newton methods from interchangeable parts: by default a filter trust-region SQP method, with presets for an interior-point method and other strategies"

[[decisionRows]]
task = "Ipopt"
context = "Large sparse problems"
purpose = "A KKT point by interior-point Newton steps on the barrier problem, with a sparse linear solver for the Newton systems"

[[decisionRows]]
task = "MadNLP"
context = "GPU or pure Julia"
purpose = "The same kind of KKT point, from a Julia implementation that can move its linear algebra to a GPU and is easy to extend"

[[decisionRows]]
task = "Uno"
context = "SQP, or other strategies"
purpose = "A KKT point by sequential quadratic programming with a filter, or by the method of another preset on the same model"

[[inputs]]
id = "n"
label = "n"
tooltip = "Number of decision variables x[1], ..., x[n]."
default = "5"

[[inputs]]
id = "sense"
label = "Sense"
tooltip = "Direction of optimisation."
kind = "select"
default = "Min"

[[inputs.options]]
value = "Min"
label = "Minimise"

[[inputs.options]]
value = "Max"
label = "Maximise"

[[inputs]]
id = "obj"
label = "Objective"
tooltip = "Nonlinear expression in the vector x, for example sum((x .- 1) .^ 2) + 3 * x[1] * x[2] + x[1] (nonconvex: with n = 5 and the default constraint, two local minima with objective values of about -0.54 and 1.69) or sum(sin.(x)). JuMP builds the nonlinear expression directly; user functions need @operator."
default = "sum((x .- 1) .^ 2) + 3 * x[1] * x[2] + x[1]"
newRow = true

[[inputs]]
id = "cons"
label = "Constraint"
tooltip = "One constraint in x, for example sum(x) == 1 or sum(x .^ 2) <= 4. Add further @constraint lines in the generated code."
default = "sum(x .^ 2) <= 4"

[[inputs]]
id = "lb"
label = "Lower Bound"
tooltip = "Lower bound on every x[i]. Every variable starts at (lb + ub) / 2."
default = "-2"
newRow = true

[[inputs]]
id = "ub"
label = "Upper Bound"
tooltip = "Upper bound on every x[i]. The Optimality Gap Check needs finite bounds, as the global solver it calls does."
default = "2"

[[codeBranches]]
model = "ipopt"
code = '''
using JuMP, Ipopt

n = {{n}}  # number of decision variables
lb, ub = {{lb}}, {{ub}}  # bounds on every x[i]

function build(optimizer)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, lb <= x[1:n] <= ub, start = (lb + ub) / 2)
    @objective(m, {{sense}}, {{obj}})
    @constraint(m, {{cons}})
    m, x
end

solver = Ipopt.Optimizer  # interior point with a filter line search
model, x = build(solver)
optimize!(model)

(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[codeBranches]]
model = "madnlp"
code = '''
using JuMP, MadNLP

n = {{n}}  # number of decision variables
lb, ub = {{lb}}, {{ub}}  # bounds on every x[i]

function build(optimizer)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, lb <= x[1:n] <= ub, start = (lb + ub) / 2)
    @objective(m, {{sense}}, {{obj}})
    @constraint(m, {{cons}})
    m, x
end

solver = MadNLP.Optimizer  # interior point written in Julia
model, x = build(solver)
optimize!(model)

(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[codeBranches]]
model = "uno"
code = '''
using JuMP, UnoSolver

n = {{n}}  # number of decision variables
lb, ub = {{lb}}, {{ub}}  # bounds on every x[i]

function build(optimizer)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, lb <= x[1:n] <= ub, start = (lb + ub) / 2)
    @objective(m, {{sense}}, {{obj}})
    @constraint(m, {{cons}})
    m, x
end

solver = optimizer_with_attributes(UnoSolver.Optimizer, "preset" => "filtersqp")  # or ipopt, funnelsqp, filterslp
model, x = build(solver)
optimize!(model)

(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "objective-surface"
label = "Objective Contours"
desc = "Contours of the objective over x[1] and x[2] around the optimum, with the other variables held at their optimal values"
code = '''
using Plots

xs = value.(x)
f(v) = value(vi -> v[findfirst(==(vi), x)], objective_function(model))  # evaluate the JuMP objective at a point
g1 = range(lb, ub, length=60)
g2 = range(lb, ub, length=60)
Z  = [f([a; b; xs[3:end]]) for b in g2, a in g1]
contour(g1, g2, Z, levels=30, xlabel="x[1]", ylabel="x[2]", fill=true)
scatter!([xs[1]], [xs[2]], marker=:star, markersize=8, label="optimum")
'''

[[actionGroups.actions]]
id = "solution-profile"
label = "Solution Profile"
desc = "Optimal value of each variable against its bounds"
code = '''
using Plots

bar(value.(x), xlabel="i", ylabel="x[i]", legend=false)
hline!([lb, ub], linestyle=:dash, color=:gray)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "feasibility"
label = "Status and Feasibility"
desc = "Termination, primal and dual status, and any constraints violated by more than 1e-6 at the reported solution"
code = '''
(termination = termination_status(model), primal = primal_status(model), dual = dual_status(model),
 violated = primal_feasibility_report(model; atol=1e-6))  # empty Dict = feasible
'''

[[actionGroups.actions]]
id = "multistart"
label = "Multi-Start"
desc = "Re-solve from 20 random starting points: differing optima reveal a nonconvex problem with several local solutions. The original start is restored and re-solved afterwards"
code = '''
using Random, Plots

Random.seed!(1)
start0 = start_value.(x)
objs = map(1:20) do _
    set_start_value.(x, lb .+ (ub - lb) .* rand(n))
    optimize!(model)
    is_solved_and_feasible(model) ? objective_value(model) : NaN
end
set_start_value.(x, start0); optimize!(model)  # restore, so the other actions see the original solution
histogram(filter(!isnan, objs), bins=20, xlabel="objective at the solution found", ylabel="starts", legend=false)
'''

[[actionGroups.actions]]
id = "solver-stats"
label = "Solver Statistics"
desc = "Solve time and iterations, where the solver reports them"
code = '''
stat(f) = try f(model) catch; missing end  # not every solver reports every attribute
(time = stat(solve_time), iterations = stat(barrier_iterations))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "sensitivity"
label = "Constraint Sensitivity"
desc = "Shadow prices: change in the optimal objective per unit relaxation of each constraint"
code = '''
has_duals(model) || error("the solver returned no duals")
cons = all_constraints(model; include_variable_in_set_constraints=true)
[(constraint = c, shadow_price = shadow_price(c)) for c in cons]
'''

[[actionGroups.actions]]
id = "parametric"
label = "Parametric Sweep"
desc = "Tighten the upper bound on every variable step by step and track the optimal objective. The bound is restored and the model re-solved afterwards"
code = '''
using Plots

caps = range(ub, lb + (ub - lb) / 10, length=15)
vals = map(caps) do b
    set_upper_bound.(x, b)
    optimize!(model)
    is_solved_and_feasible(model) ? objective_value(model) : NaN
end
set_upper_bound.(x, ub); optimize!(model)  # restore, so the other actions see the original solution
plot(caps, vals, marker=:circle, xlabel="upper bound on x[i]", ylabel="optimal objective", legend=false)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "solver-compare"
label = "Solver Comparison"
desc = "The same model with Ipopt, MadNLP and Uno: status, objective and time"
code = '''
using Ipopt, MadNLP, UnoSolver

solvers = ["Ipopt" => Ipopt.Optimizer, "MadNLP" => MadNLP.Optimizer, "Uno" => UnoSolver.Optimizer]
map(solvers) do (name, opt)
    m, _ = build(opt)
    t = @elapsed optimize!(m)
    (solver = name, status = termination_status(m), objective = objective_value(m), seconds = t)
end
'''

[[actionGroups.actions]]
id = "gap-check"
label = "Optimality Gap Check"
desc = "The local optimum found against EAGO's certified global optimum: equal values mean the local optimum is global"
code = '''
using EAGO

glo, _ = build(EAGO.Optimizer)
optimize!(glo)
(local_optimum = objective_value(model), global_optimum = objective_value(glo))  # equal = the local optimum is global
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "kkt"
label = "KKT Conditions"
desc = "At the solution: constraint values, multipliers and complementary slackness (multiplier times slack should be about 0)"
code = '''
has_duals(model) || error("the solver returned no duals")
cons = [c for c in all_constraints(model; include_variable_in_set_constraints=true)
        if constraint_object(c).set isa Union{MOI.LessThan, MOI.GreaterThan, MOI.EqualTo}]
map(cons) do c
    slack = value(c) - MOI.constant(constraint_object(c).set)
    (constraint = c, value = value(c), multiplier = dual(c), complementarity = dual(c) * slack)
end
'''

[[actionGroups.actions]]
id = "constraint-activity"
label = "Constraint Activity"
desc = "Which constraints and bounds are binding (slack below 1e-6) at the optimum"
code = '''
cons = [c for c in all_constraints(model; include_variable_in_set_constraints=true)
        if constraint_object(c).set isa Union{MOI.LessThan, MOI.GreaterThan, MOI.EqualTo}]
[(constraint = c, slack = abs(value(c) - MOI.constant(constraint_object(c).set)),
  binding = abs(value(c) - MOI.constant(constraint_object(c).set)) < 1e-6) for c in cons]
'''

# ── FAQ: shown in Learn More, and the Panel FAQ test set of Evaluate Answering Models (hidden = true: the test set only) ──

[[faq]]
question = "Is the solution Ipopt found the best one?"
wiki = "Interpretation"
answer = """
Not necessarily. Ipopt, MadNLP and Uno find a local optimum, a point satisfying the KKT conditions, and claim nothing about other regions; it is global only when the problem is convex. On the default nonconvex problem the result depends on the start.

Multi-Start re-solves from 20 random starting points and draws the objective values found, and the Optimality Gap Check compares the local optimum with EAGO's global one: equal values mean the local optimum is global.
"""

[[faq]]
question = "The solver says LOCALLY_INFEASIBLE: is my problem infeasible?"
wiki = "Diagnostics"
answer = """
Not proven. For a local solver, LOCALLY_INFEASIBLE means no feasible point was found from that start, and another start may succeed; a proof of infeasibility needs a global solver, as in the Global Nonlinear Programming panel.

Status and Feasibility lists the constraints violated by more than 1e-6 at the reported point. Multi-Start tries 20 other starting points in the box.
"""

[[faq]]
question = "When should I choose MadNLP rather than Ipopt?"
wiki = "Decision Guide"
answer = """
When the problem is large and a GPU is available, or when you want to change the solver from Julia. MadNLP is an interior-point solver of the same family as Ipopt, written in Julia, and it can run its linear algebra on a GPU.

On small problems Ipopt and MadNLP find the same local optimum from the same start; the Solver Comparison runs them, and Uno, on the panel's model and reports the status, the objective and the time.
"""

[[faq]]
question = "What does Uno do differently from Ipopt?"
wiki = "Uno: A Unified Solver"
answer = """
Uno assembles a Lagrange-Newton method from interchangeable parts, and a preset chooses them all at once. Its default preset, filtersqp, is a sequential quadratic programming method in a trust region with a filter, where Ipopt is an interior-point method with a filter line search; Uno's ipopt preset works in the manner of Ipopt.

The Uno tab sets the preset in its code, and the Solver Comparison runs Ipopt, MadNLP and Uno on the same model.
"""

[[faq]]
question = "What does a preset of Uno choose?"
wiki = "Uno: A Unified Solver"
hidden = true
right = "The strategy of every building block of the method at once"
wrong = [
  "The starting point of every variable",
  "The linear solver of the Newton systems only",
  "The tolerance on the KKT conditions only",
  "Which constraints are active at the solution",
]
explanation = "Uno decomposes Lagrange-Newton methods into building blocks, and a preset such as filtersqp, ipopt, funnelsqp or filterslp fixes the strategy of each, so that Uno behaves like a known solver."

[[faq]]
question = "Where does the panel start every variable?"
wiki = "Interior-Point Methods"
hidden = true
right = "At (lb + ub) / 2"
wrong = [
  "At lb",
  "At ub",
  "At a random point of the box",
  "At the global optimum of EAGO",
]
explanation = "The panel starts every variable at (lb + ub) / 2, 0 by default, and on the default nonconvex problem the result depends on that start, which Multi-Start explores."

[[faq]]
question = "What does the KKT Conditions action of the Local Nonlinear Programming panel list for each constraint?"
wiki = "KKT Conditions"
hidden = true
right = "Its value, its multiplier, and the multiplier times the slack"
wrong = [
  "Its slack, and whether it binds below 1e-6",
  "Its multiplier, and the range over which it holds",
  "Its gradient, and the Hessian of the Lagrangian",
  "Its value, and any violation above 1e-6",
  "Its multiplier, and the objective's change per unit",
]
explanation = "Interior-point solvers return the multipliers, and the KKT Conditions action lists each constraint's value, multiplier and the product multiplier times slack, which should be near 0."

[[faq]]
question = "What does the Optimality Gap Check of the Local Nonlinear Programming panel compare?"
wiki = "Diagnostics"
hidden = true
right = "The local optimum found with EAGO's certified global optimum"
wrong = [
  "Ipopt's optimum with MadNLP's optimum",
  "The integer optimum with its continuous relaxation",
  "The objective at the start with the objective at the solution",
  "The primal objective with the dual objective",
]
explanation = "The Optimality Gap Check solves the same model with EAGO, a deterministic global solver, and sets its optimum beside the local one: equal values mean the local optimum is global."
