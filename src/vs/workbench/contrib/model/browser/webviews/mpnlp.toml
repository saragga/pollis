[miniCharts.gnlp]
# Multimodal curve with the global minimum marked
svg = '''
var d = 'M6,40';
for (var x = 6; x <= 48; x++) { d += ' L' + x + ',' + (46 - 8 * Math.sin((x - 6) / 4) - (x - 27) * (x - 27) / -60).toFixed(1); }
return '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="0" y1="66" x2="54" y2="66" stroke="currentColor" stroke-width="0.6" opacity="0.4"/>';
'''

[[codeBranches]]
model = "nlp"
code = '''
using JuMP, {{nlpsolver}}

n = {{n}}  # number of decision variables
lb, ub = {{lb}}, {{ub}}  # bounds on every x[i]

function build(optimizer)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, lb <= x[1:n] <= ub, start = (lb + ub) / 2)
    @objective(m, {{sense}}, {{obj}})
    @constraint(m, {{cons}})
    m, x
end

solver = {{nlpsolver}}.Optimizer  # local interior-point solver
model, x = build(solver)
optimize!(model)

(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[codeBranches]]
model = "minlp"
code = '''
using JuMP
{{?minlpsolver=SCIP}} using SCIP
{{?minlpsolver=Juniper}} using Juniper, Ipopt

n = {{n}}  # number of decision variables
lb, ub = {{lb}}, {{ub}}  # bounds on every x[i]

function build(optimizer)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, lb <= x[1:n] <= ub, start = (lb + ub) / 2)
    @objective(m, {{sense}}, {{obj}})
    @constraint(m, {{cons}})
    @variable(m, z[1:n], Bin)  # z[i] = 1 lets x[i] be nonzero
    @constraint(m, [i = 1:n], lb * z[i] <= x[i] <= ub * z[i])  # big-M switch: the bounds are the M, so tight bounds give a tight relaxation
    @constraint(m, sum(z) <= {{card}})  # cardinality limit
    m, x
end

{{?minlpsolver=SCIP}} solver = SCIP.Optimizer  # branch and cut with spatial branching
{{?minlpsolver=Juniper}} solver = optimizer_with_attributes(Juniper.Optimizer, "nl_solver" => optimizer_with_attributes(Ipopt.Optimizer, "print_level" => 0))
model, x = build(solver)
optimize!(model)

(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[codeBranches]]
model = "gnlp"
code = '''
using JuMP, {{gsolver}}

n = {{n}}  # number of decision variables
lb, ub = {{lb}}, {{ub}}  # bounds on every x[i]

function build(optimizer)
    m = Model(optimizer)
    set_silent(m)
    @variable(m, lb <= x[1:n] <= ub, start = (lb + ub) / 2)
    @objective(m, {{sense}}, {{obj}})
    @constraint(m, {{cons}})
    m, x
end

solver = {{gsolver}}.Optimizer  # certifies the global optimum within its tolerance
model, x = build(solver)
optimize!(model)

(status = termination_status(model), objective = objective_value(model), x = value.(x))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "objective-surface"
label = "Objective Contours"
desc = "Contours of the objective over x[1] and x[2] around the optimum, with the other variables held at their optimal values"
code = '''
using Plots

xs = value.(x)
f(v) = value(vi -> v[findfirst(==(vi), x)], objective_function(model))  # evaluate the JuMP objective at a point
g1 = range(lb, ub, length=60)
g2 = range(lb, ub, length=60)
Z  = [f([a; b; xs[3:end]]) for b in g2, a in g1]
contour(g1, g2, Z, levels=30, xlabel="x[1]", ylabel="x[2]", fill=true)
scatter!([xs[1]], [xs[2]], marker=:star, markersize=8, label="optimum")
'''

[[actionGroups.actions]]
id = "solution-profile"
label = "Solution Profile"
desc = "Optimal value of each variable against its bounds"
code = '''
using Plots

bar(value.(x), xlabel="i", ylabel="x[i]", legend=false)
hline!([lb, ub], linestyle=:dash, color=:gray)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "feasibility"
label = "Status and Feasibility"
desc = "Termination, primal and dual status, and any constraints violated by more than 1e-6 at the reported solution"
code = '''
(termination = termination_status(model), primal = primal_status(model), dual = dual_status(model),
 violated = primal_feasibility_report(model; atol=1e-6))  # empty Dict = feasible
'''

[[actionGroups.actions]]
id = "multistart"
label = "Multi-Start"
desc = "Re-solve from 20 random starting points: differing optima reveal a nonconvex problem with several local solutions. The original start is restored and re-solved afterwards"
code = '''
using Random, Plots

Random.seed!(1)
start0 = start_value.(x)
objs = map(1:20) do _
    set_start_value.(x, lb .+ (ub - lb) .* rand(n))
    optimize!(model)
    is_solved_and_feasible(model) ? objective_value(model) : NaN
end
set_start_value.(x, start0); optimize!(model)  # restore, so the other actions see the original solution
histogram(filter(!isnan, objs), bins=20, xlabel="objective at the solution found", ylabel="starts", legend=false)
'''

[[actionGroups.actions]]
id = "solver-stats"
label = "Solver Statistics"
desc = "Solve time, iterations, branch-and-bound nodes and relative gap, where the solver reports them"
code = '''
stat(f) = try f(model) catch; missing end  # not every solver reports every attribute
(time = stat(solve_time), barrier_iterations = stat(barrier_iterations), nodes = stat(node_count),
 relative_gap = stat(relative_gap), bound = stat(objective_bound))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "sensitivity"
label = "Constraint Sensitivity"
desc = "Shadow prices: change in the optimal objective per unit relaxation of each constraint (available when the solver returns duals)"
code = '''
has_duals(model) || error("this solver returned no duals (typical for MINLP and global solvers)")
cons = all_constraints(model; include_variable_in_set_constraints=true)
[(constraint = c, shadow_price = shadow_price(c)) for c in cons]
'''

[[actionGroups.actions]]
id = "parametric"
label = "Parametric Sweep"
desc = "Tighten the upper bound on every variable step by step and track the optimal objective. The bound is restored and the model re-solved afterwards"
code = '''
using Plots

caps = range(ub, lb + (ub - lb) / 10, length=15)
vals = map(caps) do b
    set_upper_bound.(x, b)
    optimize!(model)
    is_solved_and_feasible(model) ? objective_value(model) : NaN
end
set_upper_bound.(x, ub); optimize!(model)  # restore, so the other actions see the original solution
plot(caps, vals, marker=:circle, xlabel="upper bound on x[i]", ylabel="optimal objective", legend=false)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "solver-compare"
label = "Solver Comparison"
desc = "The same model with two solvers: objective, status and time"
code = '''
{{?model=nlp}} using Ipopt, MadNLP
{{?model=nlp}} solvers = ["Ipopt" => Ipopt.Optimizer, "MadNLP" => MadNLP.Optimizer]
{{?model=minlp}} using SCIP, Juniper, Ipopt
{{?model=minlp}} solvers = ["SCIP" => SCIP.Optimizer,
{{?model=minlp}}            "Juniper" => optimizer_with_attributes(Juniper.Optimizer, "nl_solver" => optimizer_with_attributes(Ipopt.Optimizer, "print_level" => 0))]
{{?model=gnlp}} using EAGO, SCIP
{{?model=gnlp}} solvers = ["EAGO" => EAGO.Optimizer, "SCIP" => SCIP.Optimizer]
map(solvers) do (name, opt)
    m, _ = build(opt)
    t = @elapsed optimize!(m)
    (solver = name, status = termination_status(m), objective = objective_value(m), seconds = t)
end
'''

[[actionGroups.actions]]
id = "gap-check"
label = "Optimality Gap Check"
desc = "NLP and Global NLP: local Ipopt optimum against the EAGO global optimum. MINLP: the integer optimum against its continuous relaxation bound"
code = '''
{{?model!=minlp}} using Ipopt, EAGO
{{?model!=minlp}} loc, _ = build(Ipopt.Optimizer); optimize!(loc)
{{?model!=minlp}} glo, _ = build(EAGO.Optimizer); optimize!(glo)
{{?model!=minlp}} (local_ipopt = objective_value(loc), global_eago = objective_value(glo))  # equal = the local optimum is global
{{?model=minlp}} undo = relax_integrality(model)  # drop the binary restriction on z
{{?model=minlp}} optimize!(model)
{{?model=minlp}} bound = objective_value(model)
{{?model=minlp}} undo()
{{?model=minlp}} optimize!(model)
{{?model=minlp}} (integer = objective_value(model), relaxation_bound = bound, gap = abs(objective_value(model) - bound))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "kkt"
label = "KKT Conditions"
desc = "At the solution: constraint values, multipliers and complementary slackness (multiplier times slack should be about 0)"
code = '''
has_duals(model) || error("this solver returned no duals (typical for MINLP and global solvers)")
cons = [c for c in all_constraints(model; include_variable_in_set_constraints=true)
        if constraint_object(c).set isa Union{MOI.LessThan, MOI.GreaterThan, MOI.EqualTo}]
map(cons) do c
    slack = value(c) - MOI.constant(constraint_object(c).set)
    (constraint = c, value = value(c), multiplier = dual(c), complementarity = dual(c) * slack)
end
'''

[[actionGroups.actions]]
id = "constraint-activity"
label = "Constraint Activity"
desc = "Which constraints and bounds are binding (slack below 1e-6) at the optimum"
code = '''
cons = [c for c in all_constraints(model; include_variable_in_set_constraints=true)
        if constraint_object(c).set isa Union{MOI.LessThan, MOI.GreaterThan, MOI.EqualTo}]
[(constraint = c, slack = abs(value(c) - MOI.constant(constraint_object(c).set)),
  binding = abs(value(c) - MOI.constant(constraint_object(c).set)) < 1e-6) for c in cons]
'''
