# Generalized Linear Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/glm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Generalized Linear Models"
viewType = "pollis.glm"
defaultModel = "Bernoulli"

[[packages]]
name = "GLM.jl"
github = "https://github.com/JuliaStats/GLM.jl"

