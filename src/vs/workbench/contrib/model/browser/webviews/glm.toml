[[decisionRows]]
task = "Poisson"
context = "Non-negative counts"
purpose = "Event counts whose variance is close to their mean"

[[decisionRows]]
task = "NegativeBinomial"
context = "Overdispersed counts"
purpose = "Counts whose variance clearly exceeds their mean"

[[decisionRows]]
task = "Geometric"
context = "Counts of failures"
