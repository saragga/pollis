[[inputs]]
id = "formula"
label = "Formula"
tooltip = "Julia formula using the @formula macro. The response goes left of ~, predictors right. Use + for additive effects, * for interactions (includes main effects), : for interaction only. Examples: y ~ x1 + x2; y ~ x1 * x2 (= x1 + x2 + x1:x2); y ~ log(x)"
