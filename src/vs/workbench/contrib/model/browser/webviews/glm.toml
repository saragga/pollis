# One code branch for every family: {{model}} is the family name; each family fits its own example data set

[[codeBranches]]
model = "*"
code = '''
{{?inference=standard}}using GLM, StatsBase, PollisDatasets  # generalized linear models; StatsBase exports aic; curated example datasets
{{?inference!=standard}}using GLM, StatsBase, PollisDatasets, CovarianceMatrices, Distributions, LinearAlgebra  # GLM + robust standard errors; normal p-values
{{?inference=HAC}}using Random  # reproducible simulated data

{{?model=Bernoulli}}# Example data: Mroz (1987), whether each of 753 married women was in the labour force in 1975. Replace it with your own table.
{{?model=Bernoulli}}data = dataset("mroz");  # datasetinfo("mroz") describes the columns
{{?model=Bernoulli}}f = @formula(inlf ~ nwifeinc + educ + exper + expersq + age + kidslt6 + kidsge6);  # participation model of Wooldridge, Example 17.1
{{?model=Binomial}}# Example data: Dalal et al. (1989), O-rings with thermal distress out of 6 on the 23 shuttle flights before Challenger. Replace it with your own table.
{{?model=Binomial}}c = dataset("challenger");  # datasetinfo("challenger") describes the columns
{{?model=Binomial}}data = (share = c.n_failures ./ 6, temperature = float.(c.temperature), n = fill(6.0, length(c.flight)));  # share of the 6 O-rings and number of trials
{{?model=Binomial}}f = @formula(share ~ temperature);  # Challenger launched at 31 degrees F, far below every earlier flight
{{?model=Poisson}}{{?inference!=HAC}}# Example data: McCullagh and Nelder (1989), damage incidents of cargo ships by type, year of construction and period of operation. Replace it with your own table.
{{?model=Poisson}}{{?inference!=HAC}}s = dataset("ships");  # datasetinfo("ships") describes the columns
{{?model=Poisson}}{{?inference!=HAC}}keep = s.service .> 0;  # drop the 6 cells with no months of service
{{?model=Poisson}}{{?inference!=HAC}}data = (incidents = s.incidents[keep], type = s.type[keep], built = string.(s.year[keep]), period = string.(s.period[keep]), exposure = float.(s.service[keep]));  # years as categories; exposure: aggregate months of service
{{?model=Poisson}}{{?inference!=HAC}}f = @formula(incidents ~ type + built + period);  # a rate of incidents per month of service
{{?model=NegativeBinomial}}# Example data: Long (1990), articles published by 915 biochemistry PhD students; the counts are overdispersed. Replace it with your own table.
{{?model=NegativeBinomial}}data = dataset("biochemists");  # datasetinfo("biochemists") describes the columns
{{?model=NegativeBinomial}}f = @formula(art ~ fem + mar + kid5 + phd + ment);  # gender, marriage, young children, department prestige, mentor's output
{{?model=Geometric}}# Example data: siblings and spouses aboard for the Titanic passengers of known age, a count piled up at zero. Replace it with your own table.
{{?model=Geometric}}t = dataset("titanic");  # datasetinfo("titanic") describes the columns
{{?model=Geometric}}known = .!ismissing.(t.age);  # keep the passengers whose age is recorded
{{?model=Geometric}}data = (sibsp = t.sibsp[known], age = float.(t.age[known]), pclass = t.pclass[known]);
{{?model=Geometric}}f = @formula(sibsp ~ age + pclass);  # children travel with their siblings
{{?model=Gamma}}# Example data: Card (1995), hourly wages of 3,010 young men in 1976, positive and right-skewed. Replace it with your own table.
{{?model=Gamma}}data = dataset("card");  # datasetinfo("card") describes the columns
{{?model=Gamma}}f = @formula(wage ~ educ + exper + expersq + black + south + smsa);  # a wage equation on the mean wage
{{?model=InverseGaussian}}# Example data: survival times of the 165 patients with advanced lung cancer whose death was observed, a first-passage time. Replace it with your own table.
{{?model=InverseGaussian}}l = dataset("lung");  # datasetinfo("lung") describes the columns
{{?model=InverseGaussian}}died = l.status .== 2;  # 2 = died, 1 = censored: keep the observed deaths
{{?model=InverseGaussian}}data = (time = float.(l.time[died]), age = float.(l.age[died]), sex = l.sex[died]);  # days from diagnosis to death
{{?model=InverseGaussian}}f = @formula(time ~ age + sex);  # sex: 1 = male, 2 = female
{{?model=Normal}}{{?inference!=HAC}}# Example data: Galton (1886), adult heights of 934 children and their parents. Replace it with your own table.
{{?model=Normal}}{{?inference!=HAC}}data = dataset("galton");  # one row per child; datasetinfo("galton") describes the columns
{{?model=Normal}}{{?inference!=HAC}}f = @formula(child_height ~ midparent_height + gender);  # regression towards the mean
{{?inference=HAC}}# Simulated data: 300 months in which the predictor and the disturbance are both autocorrelated, so the standard errors need HAC. Replace it with your own time series.
{{?inference=HAC}}Random.seed!(1)
{{?inference=HAC}}T = 300
{{?inference=HAC}}x = zeros(T); u = zeros(T)
{{?inference=HAC}}for t in 2:T
{{?inference=HAC}}    x[t] = 0.7 * x[t-1] + randn()  # AR(1) predictor
{{?inference=HAC}}    u[t] = 0.6 * u[t-1] + 0.4 * randn()  # AR(1) disturbance
{{?inference=HAC}}end
{{?model=Normal}}{{?inference=HAC}}data = (month = 1:T, x = x, y = 1 .+ 0.5 .* x .+ u);  # true intercept 1, true slope 0.5
{{?model=Poisson}}{{?inference=HAC}}exposure = 50 .+ 10 .* rand(T);  # e.g. thousands of people at risk each month
{{?model=Poisson}}{{?inference=HAC}}data = (month = 1:T, x = x, exposure = exposure, y = rand.(Poisson.(exposure .* exp.(-3 .+ 0.3 .* x .+ u .- 0.4^2 / (1 - 0.6^2) / 2))));  # true intercept -3, true slope 0.3; u is centred so the rate is exact
{{?inference=HAC}}f = @formula(y ~ x);  # the estimates should land near the true values

{{?link=}}link = ()  # the default link of the {{model}} family
{{?link!=}}link = ({{link}}(),)  # {{link}} instead of the default link
{{?model=Bernoulli|Geometric|Gamma|InverseGaussian|Normal}}model = glm(f, data, {{model}}(), link...)  # {{model}} family
{{?model=Poisson}}model = glm(f, data, Poisson(), link...; offset = log.(data.exposure))  # the log-exposure offset turns counts into rates
{{?model=Binomial}}model = glm(f, data, Binomial(), link...; wts = data.n)  # weights: the 6 O-rings of each flight
{{?model=NegativeBinomial}}model = negbin(f, data, link...)  # estimates theta by maximum likelihood; NegativeBinomial() would fix theta = 1
{{?model=NegativeBinomial}}println("theta: ", round(model.model.rr.d.r; digits=3))  # variance = mu + mu^2 / theta

{{?inference=HC0|HC1|HC2|HC3}}V = vcov({{inference}}(), model)  # heteroskedasticity-robust variance-covariance matrix
{{?inference=HAC}}V = vcov(Bartlett{NeweyWest}(), model)  # Newey-West HAC, data-driven bandwidth; rows must be in time order
{{?inference=clustered}}V = vcov(CR1(data.{{cluster}}), model)  # cluster-robust variance-covariance matrix, clustered by {{cluster}}
{{?inference!=standard}}se = sqrt.(diag(V))  # robust standard errors
{{?inference!=standard}}z  = coef(model) ./ se
{{?inference!=standard}}display(CoefTable(hcat(coef(model), se, z, 2 .* ccdf.(Normal(), abs.(z))), ["Coef.", "Std. Error", "z", "Pr(>|z|)"], coefnames(model), 4, 3))  # coefficients with robust SEs
{{?inference=standard}}display(coeftable(model))  # coefficient table

println("Deviance: ", deviance(model))  # model deviance
println("AIC:      ", aic(model))  # Akaike information criterion
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fitted-observed"
label = "Fitted vs Observed"
desc = "Fitted mean against the observed response"
code = '''
using GLM, Plots

mu = predict(model)  # fitted mean on the response scale
y  = response(model)  # observed response
scatter(mu, y, xlabel="Fitted mean", ylabel="Observed", label=false, alpha=0.5)
plot!(identity, extrema(mu)..., linestyle=:dash, label="45-degree line")  # perfect-fit reference
'''

[[actionGroups.actions]]
id = "coef-plot"
label = "Coefficient Plot"
desc = "Estimates with 95% confidence intervals"
code = '''
using GLM, Plots

est = coef(model)  # point estimates
ci  = confint(model)  # 95% confidence intervals (p x 2)
k   = length(est)
scatter(est, 1:k, xerror=(est .- ci[:, 1], ci[:, 2] .- est), yticks=(1:k, coefnames(model)), label=false)
vline!([0], linestyle=:dash, label=false)  # zero-effect reference
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residual-plots"
label = "Residual Plots"
desc = "Pearson residuals against fitted values"
code = '''
using GLM, Plots

mu = predict(model)  # fitted mean
y  = response(model)  # observed response
rp = (y .- mu) ./ sqrt.(GLM.glmvar.(Ref(model.model.rr.d), mu))  # Pearson residuals under the fitted family
{{?model=Binomial}}rp = rp .* sqrt.(data.n)  # shares: scale by the number of trials in each group
scatter(mu, rp, xlabel="Fitted mean", ylabel="Pearson residual", label=false, alpha=0.5)
hline!([0], linestyle=:dash, label=false)  # residuals should scatter evenly around zero
'''

[[actionGroups.actions]]
id = "overdispersion"
label = "Overdispersion Check"
desc = "Pearson dispersion ratio for count families (Poisson, Binomial counts, NegBin, Geometric); not applicable to 0/1 data or to families with a free dispersion"
code = '''
using GLM

{{?model=Bernoulli}}println("Not applicable: 0/1 data cannot be overdispersed; check the link and the predictors instead")
{{?model=Gamma|InverseGaussian|Normal}}println("Not applicable: the {{model}} family estimates its dispersion freely; see dispersion(model.model, true)")
{{?model=Poisson|Binomial|NegativeBinomial|Geometric}}mu  = predict(model)  # fitted mean
{{?model=Poisson|Binomial|NegativeBinomial|Geometric}}rp  = (response(model) .- mu) ./ sqrt.(GLM.glmvar.(Ref(model.model.rr.d), mu))  # Pearson residuals under the fitted family
{{?model=Binomial}}rp  = rp .* sqrt.(data.n)  # shares: scale by the number of trials in each group
{{?model=Poisson|Binomial|NegativeBinomial|Geometric}}phi = sum(abs2, rp) / (length(mu) - length(coef(model)))  # dispersion ratio: rows minus coefficients (about 1 if the family fits)
{{?model=Poisson|Binomial|NegativeBinomial|Geometric}}println("Dispersion ratio: ", round(phi; digits=3))
{{?model=Poisson|Geometric}}println(phi > 1.5 ? "Overdispersed: consider NegBin (negbin estimates theta) or robust SEs" : "No strong overdispersion")
{{?model=Binomial}}println(phi > 1.5 ? "Overdispersed: consider robust SEs or a quasi-binomial correction (scale the SEs by sqrt(phi))" : "No strong overdispersion")
{{?model=NegativeBinomial}}println(phi > 1.5 ? "Still overdispersed after estimating theta: check for zero inflation or missing predictors" : "No strong overdispersion")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "predict-mean"
label = "Predicted Mean"
desc = "Fitted mean for new observations"
code = '''
using GLM

newdata = map(c -> c[1:5], data)  # first 5 rows of the example data; replace with new observations
{{?model!=Poisson}}mu = predict(model, newdata)  # predicted mean on the response scale
{{?model=Poisson}}mu = predict(model, newdata; offset = log.(newdata.exposure))  # predicted count for each row's exposure
println(mu)
'''

[[actionGroups.actions]]
id = "predict-ci"
label = "Confidence Band"
desc = "Predicted mean with a 95% confidence interval"
code = '''
using GLM

newdata = map(c -> c[1:5], data)  # first 5 rows of the example data; replace with new observations
{{?model!=Poisson}}pred = predict(model, newdata; interval=:confidence, level=0.95)  # prediction, lower, upper
{{?model=Poisson}}pred = predict(model, newdata; offset = log.(newdata.exposure), interval=:confidence, level=0.95)  # prediction, lower, upper
println(pred)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "lr-test"
label = "Likelihood Ratio Test"
desc = "Test the model against an intercept-only model"
code = '''
using GLM

f0 = FormulaTerm(f.lhs, ConstantTerm(1))  # intercept-only model: the same response, no predictors
{{?model=Bernoulli|Geometric|Gamma|InverseGaussian|Normal}}model0 = glm(f0, data, {{model}}(), link...)  # with the same link
{{?model=Poisson}}model0 = glm(f0, data, Poisson(), link...; offset = log.(data.exposure))  # with the same link and offset
{{?model=Binomial}}model0 = glm(f0, data, Binomial(), link...; wts = data.n)  # with the same link and weights
{{?model=NegativeBinomial}}model0 = negbin(f0, data, link...)  # with the same link and its own theta
println(lrtest(model0, model))  # likelihood ratio test of the nested models
'''

[[actionGroups.actions]]
id = "info-criteria"
label = "Information Criteria"
desc = "AIC, AICc, BIC and log-likelihood for model comparison"
code = '''
using GLM, StatsBase

println("Log-likelihood: ", loglikelihood(model))
println("AIC:  ", aic(model))  # lower is better
println("AICc: ", aicc(model))  # small-sample corrected AIC
println("BIC:  ", bic(model))  # stronger penalty on parameters
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "coefficients"
label = "Coefficient Interpretation"
desc = "Odds ratios (logit link) or rate ratios (log link) with confidence intervals; for any other link, the coefficients on the link scale"
code = '''
using GLM

link_name = "{{link}}"  # the link chosen above
{{?link=}}link_name = Dict("Bernoulli" => "LogitLink", "Binomial" => "LogitLink", "Poisson" => "LogLink", "Geometric" => "LogLink", "NegativeBinomial" => "NegativeBinomialLink", "Gamma" => "InverseLink", "InverseGaussian" => "InverseSquareLink", "Normal" => "IdentityLink")["{{model}}"]  # the family's default link
ratio_scale = link_name in ("LogitLink", "LogLink")  # only then is exp(coef) an odds ratio (logit) or a rate ratio (log)
ratio = ratio_scale ? exp.(coef(model)) : coef(model)
ci    = ratio_scale ? exp.(confint(model)) : confint(model)  # 95% confidence interval on the same scale
println(ratio_scale ? (link_name == "LogitLink" ? "Odds ratios" : "Mean ratios (rate ratios for counts)") : "Coefficients on the $(link_name) scale", " with 95% confidence intervals")
for (name, r, lo, hi) in zip(coefnames(model), ratio, ci[:, 1], ci[:, 2])
    println(rpad(name, 16), round(r; digits=3), "  [", round(lo; digits=3), ", ", round(hi; digits=3), "]")
end
'''

[[actionGroups.actions]]
id = "marginal"
label = "Marginal Effects"
desc = "Average marginal effect of one continuous predictor on the mean; not for Poisson, whose example has only categorical predictors (see the rate ratios)"
models = ["Bernoulli", "Binomial", "NegativeBinomial", "Geometric", "Gamma", "InverseGaussian", "Normal"]
code = '''
using GLM, Statistics

{{?model=Bernoulli|Gamma}}x = :educ  # the predictor of interest: years of schooling
{{?model=Binomial}}x = :temperature  # the predictor of interest
{{?model=NegativeBinomial}}x = :ment  # the predictor of interest: the mentor's articles
{{?model=Geometric}}x = :age  # the predictor of interest
{{?model=InverseGaussian}}x = :age  # the predictor of interest
{{?model=Normal}}{{?inference!=HAC}}x = :midparent_height  # the predictor of interest
{{?model=Normal}}{{?inference=HAC}}x = :x  # the simulated predictor
h  = 1e-4  # small step for the numerical derivative
d1 = merge(data, NamedTuple{(x,)}((getproperty(data, x) .+ h,)))  # x shifted by h
ame = mean((predict(model, d1) .- predict(model, data)) ./ h)  # average marginal effect
println("AME of ", x, ": ", round(ame; digits=4))
'''

