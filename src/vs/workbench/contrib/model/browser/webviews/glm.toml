[miniCharts.Geometric]
# Decreasing bars
svg = '''
var s = '<line x1="4" y1="74" x2="36" y2="74" stroke="currentColor" stroke-width="1"/>';
var h = [44, 30, 20, 13, 9, 6];
for (var i = 0; i < h.length; i++) {
	s += '<rect x="' + (5 + i * 5) + '" y="' + (74 - h[i]) + '" width="4" height="' + h[i] + '" fill="currentColor" opacity="0.45"/>';
}
return s;
