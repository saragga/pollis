}
return s;
'''

[miniCharts.NegativeBinomial]
# Count bars with a long tail
svg = '''
var s = '<line x1="4" y1="74" x2="36" y2="74" stroke="currentColor" stroke-width="1"/>';
var h = [30, 34, 26, 18, 12, 8, 5, 3];
for (var i = 0; i < h.length; i++) {
	s += '<rect x="' + (5 + i * 4) + '" y="' + (74 - h[i]) + '" width="3" height="' + h[i] + '" fill="currentColor" opacity="0.45"/>';
