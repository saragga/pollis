[[decisionRows]]
task = "InverseGaussian"
context = "Positive continuous, heavy right tail"
purpose = "Strongly skewed positive responses such as first-passage times"

[[decisionRows]]
task = "Normal"
context = "Continuous"
purpose = "Linear model with a non-identity link, or a baseline for the other families"

