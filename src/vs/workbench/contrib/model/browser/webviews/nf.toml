[[codeBranches]]
model = "realnvp"
code = '''
using Flux, Statistics
{{?target=copula}} using Distributions

input_dim   = {{input-dim}}  # dimensionality of x
num_flows   = {{num-flows}}  # affine coupling layers
hidden_size = {{hidden-size}}  # conditioner network width
num_layers  = {{num-layers}}  # conditioner network depth

{{?target=density}} data = Float32.({{xvar}})  # D x n, one sample per column
{{?target=copula}} pit(x) = (sortperm(sortperm(x)) .- 0.5) ./ length(x)  # empirical ranks mapped into (0, 1)
{{?target=copula}} U = mapslices(pit, {{xvar}}; dims=2)  # u_i = F_i(x_i), one row per variable
{{?target=copula}} data = Float32.(quantile.(Normal(), U))  # probit scale: the flow now fits the copula

d1 = input_dim ÷ 2
d2 = input_dim - d1  # split dimensions for coupling

make_net(n_in, n_out) = Chain(
    Dense(n_in => hidden_size, tanh),
    [Dense(hidden_size => hidden_size, tanh) for _ in 2:num_layers]...,
    Dropout({{dropout}}),
    Dense(hidden_size => n_out),
)

struct AffineCoupling  # scale-and-shift coupling layer
    s_net; t_net; d1::Int; flip::Bool
end
Flux.@layer AffineCoupling

function (ac::AffineCoupling)(x)
    xa = ac.flip ? x[ac.d1+1:end, :] : x[1:ac.d1, :]  # conditioning half
    xb = ac.flip ? x[1:ac.d1, :] : x[ac.d1+1:end, :]  # transformed half
    s, t = ac.s_net(xa), ac.t_net(xa)
    yb = xb .* exp.(s) .+ t  # y_b = x_b * exp(s(x_a)) + t(x_a)
    y = ac.flip ? vcat(yb, xa) : vcat(xa, yb)
    y, vec(sum(s; dims=1))  # log|det J| = sum of the log-scales
end

model = Tuple(AffineCoupling(
    make_net(isodd(i) ? d1 : d2, isodd(i) ? d2 : d1),  # s network
    make_net(isodd(i) ? d1 : d2, isodd(i) ? d2 : d1),  # t network
    d1, iseven(i),  # alternate which half is conditioned
) for i in 1:num_flows)

function logdensity(model, x)  # log p(x) by the change of variables formula
    z, ldj = x, zeros(Float32, size(x, 2))
    for f in model
        z, ld = f(z)
        ldj = ldj .+ ld
    end
    vec(-0.5f0 .* sum(abs2, z; dims=1)) .- 0.5f0 * size(z, 1) * log(2f0 * pi) .+ ldj  # standard normal base
end
loss(model, x) = -mean(logdensity(model, x))  # negative mean log-likelihood

opt_state = Flux.setup(Adam(1f-3), model)
loader = Flux.DataLoader(data, batchsize=64, shuffle=true)  # one sample per column
for epoch in 1:100
    Flux.train!(loss, model, loader, opt_state)
end
'''

[[codeBranches]]
model = "maf"
code = '''
using Flux, Statistics
{{?target=copula}} using Distributions

input_dim   = {{input-dim}}  # dimensionality of x
num_flows   = {{num-flows}}  # autoregressive steps
hidden_size = {{hidden-size}}  # conditioner network width
num_layers  = {{num-layers}}  # conditioner network depth

{{?target=density}} data = Float32.({{xvar}})  # D x n, one sample per column
{{?target=copula}} pit(x) = (sortperm(sortperm(x)) .- 0.5) ./ length(x)  # empirical ranks mapped into (0, 1)
{{?target=copula}} U = mapslices(pit, {{xvar}}; dims=2)  # u_i = F_i(x_i), one row per variable
{{?target=copula}} data = Float32.(quantile.(Normal(), U))  # probit scale: the flow now fits the copula

struct MaskedDense  # dense layer whose weights are multiplied by a fixed 0/1 mask
    W; b; M; act
end
Flux.@layer MaskedDense trainable=(W, b)
MaskedDense(M, act=identity) = MaskedDense(Flux.glorot_uniform(size(M)...), zeros(Float32, size(M, 1)), Float32.(M), act)
(m::MaskedDense)(x) = m.act.((m.W .* m.M) * x .+ m.b)

function made(D)  # MADE: output i depends only on inputs 1..i-1
    deg_h = [mod1(k, D - 1) for k in 1:hidden_size]  # hidden unit k sees inputs 1..deg_h[k]
    Chain(
        MaskedDense(deg_h .>= (1:D)', tanh),
        [MaskedDense(deg_h .>= deg_h', tanh) for _ in 2:num_layers]...,
        MaskedDense(vcat(1:D, 1:D) .> deg_h'),  # mu_i and alpha_i for every dimension
    )
end

struct MAFStep  # one masked autoregressive step
    made; perm::Vector{Int}
end
Flux.@layer MAFStep trainable=(made,)

function (m::MAFStep)(x)
    x = x[m.perm, :]  # reverse the variable order on alternate steps
    D = size(x, 1)
    h = m.made(x)
    mu, alpha = h[1:D, :], h[D+1:end, :]  # conditional shift and log-scale
    z = (x .- mu) .* exp.(-alpha)  # normalise each dimension
    z, -vec(sum(alpha; dims=1))  # log|det J| = -sum of alpha_i
end

model = Tuple(MAFStep(made(input_dim), isodd(i) ? collect(1:input_dim) : collect(input_dim:-1:1))
              for i in 1:num_flows)

function logdensity(model, x)  # log p(x) by the change of variables formula
    z, ldj = x, zeros(Float32, size(x, 2))
    for f in model
        z, ld = f(z)
        ldj = ldj .+ ld
    end
    vec(-0.5f0 .* sum(abs2, z; dims=1)) .- 0.5f0 * size(z, 1) * log(2f0 * pi) .+ ldj  # standard normal base
end
loss(model, x) = -mean(logdensity(model, x))  # negative mean log-likelihood

opt_state = Flux.setup(Adam(1f-3), model)
loader = Flux.DataLoader(data, batchsize=64, shuffle=true)  # one sample per column
for epoch in 1:100
    Flux.train!(loss, model, loader, opt_state)
end
'''

[[codeBranches]]
model = "nsf"
code = '''
using Flux, Bijectors, Statistics
{{?target=copula}} using Distributions

input_dim   = {{input-dim}}  # dimensionality of x
num_flows   = {{num-flows}}  # spline coupling layers
hidden_size = {{hidden-size}}  # conditioner network width
num_layers  = {{num-layers}}  # conditioner network depth
K           = {{num-bins}}  # rational-quadratic spline segments
B           = 5f0  # splines act on [-B, B], identity outside

{{?target=density}} data = Float32.({{xvar}})  # D x n, one sample per column
{{?target=copula}} pit(x) = (sortperm(sortperm(x)) .- 0.5) ./ length(x)  # empirical ranks mapped into (0, 1)
{{?target=copula}} U = mapslices(pit, {{xvar}}; dims=2)  # u_i = F_i(x_i), one row per variable
{{?target=copula}} data = Float32.(quantile.(Normal(), U))  # probit scale: the flow now fits the copula

d1 = input_dim ÷ 2
d2 = input_dim - d1  # split dimensions for coupling

make_net(n_in, n_out) = Chain(
    Dense(n_in => hidden_size, relu),
    [Dense(hidden_size => hidden_size, relu) for _ in 2:num_layers]...,
    Dropout({{dropout}}),
    Dense(hidden_size => (3K - 1) * n_out),  # widths, heights and interior derivatives
)

struct SplineCoupling  # rational-quadratic spline coupling layer (Durkan et al. 2019)
    net; d1::Int; flip::Bool
end
Flux.@layer SplineCoupling

function (sc::SplineCoupling)(x)
    xa = sc.flip ? x[sc.d1+1:end, :] : x[1:sc.d1, :]  # conditioning half
    xb = sc.flip ? x[1:sc.d1, :] : x[sc.d1+1:end, :]  # transformed half
    P = sc.net(xa)
    d = size(xb, 1)
    out = map(1:size(x, 2)) do j
        p = reshape(P[:, j], d, 3K - 1)
        rqs = RationalQuadraticSpline(p[:, 1:K], p[:, K+1:2K], p[:, 2K+1:end], B)  # one spline per dimension
        with_logabsdet_jacobian(rqs, xb[:, j])
    end
    yb = reduce(hcat, first.(out))
    y = sc.flip ? vcat(yb, xa) : vcat(xa, yb)
    y, last.(out)  # output and log|det J|
end

model = Tuple(SplineCoupling(make_net(isodd(i) ? d1 : d2, isodd(i) ? d2 : d1), d1, iseven(i))
              for i in 1:num_flows)

function logdensity(model, x)  # log p(x) by the change of variables formula
    z, ldj = x, zeros(Float32, size(x, 2))
    for f in model
        z, ld = f(z)
        ldj = ldj .+ ld
    end
    vec(-0.5f0 .* sum(abs2, z; dims=1)) .- 0.5f0 * size(z, 1) * log(2f0 * pi) .+ ldj  # standard normal base
end
loss(model, x) = -mean(logdensity(model, x))  # negative mean log-likelihood

opt_state = Flux.setup(Adam(1f-3), model)
loader = Flux.DataLoader(data, batchsize=64, shuffle=true)  # one sample per column
for epoch in 1:100
    Flux.train!(loss, model, loader, opt_state)
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "loss-curve"
label = "Training Curve"
desc = "Keep training while recording the negative log-likelihood after every epoch, then plot it"
code = '''
using Plots

epoch_loss() = mean(loss(model, x) for x in loader)
history = [epoch_loss()]
for epoch in 1:100
    Flux.train!(loss, model, loader, opt_state)
    push!(history, epoch_loss())
end
plot(history, xlabel="epoch", ylabel="negative log-likelihood", legend=false)
'''

