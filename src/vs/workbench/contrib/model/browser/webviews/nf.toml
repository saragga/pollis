z = foldl((z, f) -> first(f(z)), model; init=data)  # push the data through every flow step
plot(scatter(data[1, :], data[2, :], title="data", alpha=0.4),
     scatter(z[1, :], z[2, :], title="latent", alpha=0.4), layout=(1, 2), legend=false)
'''

