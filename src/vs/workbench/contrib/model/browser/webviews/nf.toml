[[inputs]]
id = "xvar"
label = "Input data"
tooltip = "D x n data matrix: D variables, n samples (one sample per column)."
default = "X"

[[inputs]]
id = "target"
label = "Target"
tooltip = "Joint density fits p(x) directly. Copula applies the probability integral transform u_i = F_i(x_i) to every margin (empirical ranks), maps it to the normal scale, and lets the flow fit only the dependence structure (Sklar's theorem)."
kind = "select"
default = "density"

[[inputs.options]]
value = "density"
label = "Joint density p(x)"

[[inputs.options]]
value = "copula"
label = "Copula c(u)"

[[inputs]]
id = "input-dim"
label = "input_dim"
tooltip = "Dimensionality D of the random vector x. The flow learns the full joint density p(x_1, ..., x_D)."
default = "8"
newRow = true

[[inputs]]
id = "num-flows"
label = "num_flows"
tooltip = "Number of stacked bijective transformations (coupling or autoregressive steps). More steps increase expressiveness but add compute. Typical range: 4-16."
default = "8"

[[inputs]]
id = "num-bins"
label = "num_bins"
tooltip = "Number of spline segments K in each Neural Spline Flow coupling layer. More bins give a finer piecewise approximation at the cost of more parameters. Typical range: 4-16."
default = "8"
models = ["nsf"]

[[inputs]]
id = "hidden-size"
label = "hidden_size"
tooltip = "Width of the conditioner networks inside each flow step. Controls how rich the learned scale-and-shift (or spline) parameters are. Typical range: 64-512."
default = "128"
newRow = true

[[inputs]]
id = "num-layers"
label = "num_layers"
tooltip = "Number of hidden layers in each conditioner network. Deeper conditioners can learn more complex dependencies between dimensions. Typical range: 2-4."
default = "2"

[[inputs]]
id = "dropout"
label = "dropout"
tooltip = "Dropout probability applied inside the conditioner networks. Regularises deep conditioners. Set to 0 to disable. Typical range: 0.0-0.2."
default = "0.0"

