default = "zygote"

[[inputs.options]]
value = "zygote"
label = "Zygote"

[[inputs.options]]
value = "forwarddiff"
label = "ForwardDiff"

[[inputs]]
id = "dist-select"
label = "Distribution"
tooltip = ""
kind = "select"
default = "Normal"
models = ["dist"]

[[inputs.options]]
value = "Normal"
label = "Normal"

[[inputs.options]]
value = "LogNormal"
label = "LogNormal"

[[inputs.options]]
value = "Gamma"
label = "Gamma"

[[inputs.options]]
value = "Beta"
label = "Beta"

[[inputs.options]]
value = "Exponential"
label = "Exponential"

[[inputs]]
id = "dist-data"
label = "Data (y)"
tooltip = ""
default = "y"
models = ["dist"]

[[inputs]]
id = "p1"
label = "Initial p[1]"
tooltip = "Normal, LogNormal: initial mu. Gamma, Beta: initial log_alpha. Exponential: initial log_theta."
default = "0.0"
models = ["dist"]

[[inputs]]
id = "p2"
label = "Initial p[2]"
tooltip = "Normal, LogNormal: initial log_sigma. Gamma: initial log_theta. Beta: initial log_beta."
default = "0.0"
models = ["dist"]
when = "dist-select!=Exponential"

[[inputs]]
id = "reg-X"
label = "Design Matrix (X)"
tooltip = ""
default = "X"
models = ["lr", "logr"]

[[inputs]]
id = "reg-y"
label = "Response (y)"
tooltip = "Response vector. Binary (0/1) for logistic regression."
default = "y"
models = ["lr", "logr"]

[[codeBranches]]
model = "dist"
code = '''
{{?backend-select=zygote}} using DistributionsAD, Zygote, Optim
{{?backend-select=forwarddiff}} using DistributionsAD, ForwardDiff, Optim

function negloglik(p)
{{?dist-select!=Exponential}}     d = {{dist-select}}(exp(p[1]), exp(p[2]))  # {{dist-select}} with exp-transformed parameters
{{?dist-select=Exponential}}     d = Exponential(exp(p[1]))  # Exponential with exp-transformed parameters
    -sum(logpdf.(d, {{dist-data}}))  # negative log-likelihood
end

{{?dist-select!=Exponential}} p0      = [{{p1}}, {{p2}}]  # initial parameters (unconstrained)
{{?dist-select=Exponential}} p0      = [{{p1}}]  # initial parameters (unconstrained)
{{?backend-select=zygote}} res     = optimize(negloglik, Zygote.gradient, p0, LBFGS())  # L-BFGS with Zygote gradient
{{?backend-select=forwarddiff}} res     = optimize(negloglik, p0, LBFGS(); autodiff = :forward)  # L-BFGS with ForwardDiff
p_hat   = Optim.minimizer(res)  # optimal unconstrained parameters

{{?dist-select=Normal|LogNormal}} mu_hat    = p_hat[1]  # MLE mean
{{?dist-select=Normal|LogNormal}} sigma_hat = exp(p_hat[2])  # MLE std dev (back-transformed)
{{?dist-select=Gamma|Beta}} alpha_hat = exp(p_hat[1])  # MLE shape (back-transformed)
{{?dist-select=Gamma|Beta}} theta_hat = exp(p_hat[2])  # MLE scale (back-transformed)
{{?dist-select=Exponential}} theta_hat = exp(p_hat[1])  # MLE mean (back-transformed)
'''

[[codeBranches]]
model = "lr"
code = '''
{{?backend-select=zygote}} using DistributionsAD, Zygote, Optim
{{?backend-select=forwarddiff}} using DistributionsAD, ForwardDiff, Optim

function negloglik(p)
    beta  = p[1:end-1]  # regression coefficients
    sigma = exp(p[end])  # noise std (exp ensures positivity)
    mu    = {{reg-X}} * beta  # predicted means
    -sum(logpdf.(Normal.(mu, sigma), {{reg-y}}))  # normal log-likelihood
end

p0        = zeros(size({{reg-X}}, 2) + 1)  # initial params: [beta; log_sigma]
{{?backend-select=zygote}} res       = optimize(negloglik, Zygote.gradient, p0, LBFGS())  # L-BFGS with Zygote gradient
{{?backend-select=forwarddiff}} res       = optimize(negloglik, p0, LBFGS(); autodiff = :forward)  # L-BFGS with ForwardDiff
p_hat     = Optim.minimizer(res)  # optimal parameters

beta_hat  = p_hat[1:end-1]  # MLE coefficients
sigma_hat = exp(p_hat[end])  # MLE noise std (back-transformed)
'''

[[codeBranches]]
model = "logr"
code = '''
{{?backend-select=zygote}} using DistributionsAD, Zygote, Optim
{{?backend-select=forwarddiff}} using DistributionsAD, ForwardDiff, Optim

sigmoid(z) = 1 / (1 + exp(-z))

function negloglik(p)
    prob = sigmoid.({{reg-X}} * p)  # predicted probabilities
    -sum(logpdf.(Bernoulli.(prob), {{reg-y}}))  # Bernoulli log-likelihood
end

p0       = zeros(size({{reg-X}}, 2))  # initial coefficients
{{?backend-select=zygote}} res      = optimize(negloglik, Zygote.gradient, p0, LBFGS())  # L-BFGS with Zygote gradient
{{?backend-select=forwarddiff}} res      = optimize(negloglik, p0, LBFGS(); autodiff = :forward)  # L-BFGS with ForwardDiff
beta_hat = Optim.minimizer(res)  # MLE log-odds coefficients
'''
