# Advanced Time-Series Forecasting Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/atsf.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Advanced Time-Series Forecasting"
viewType = "pollis.atsf"
defaultModel = "bats"

[[packages]]
name = "Durbyn.jl"
github = "https://github.com/taf-society/Durbyn.jl"

[requires]
packages = ["Plots.jl", "HypothesisTests.jl", "StatsBase.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "BATS and TBATS"
file = "tsf/tutorial-03-bats.ipynb"
bundled = true
description = "Box-Cox ARMA trend and seasonal forecasting for complex or multiple seasonalities"

[[notebookSections.notebooks]]
name = "Theta Models"
file = "tsf/tutorial-04-theta.ipynb"
bundled = true
description = "Theta method for univariate decomposition and forecasting"

[[notebookSections.notebooks]]
name = "Intermittent Demand"
file = "tsf/tutorial-05-demand.ipynb"
bundled = true
description = "Croston SBA and SBJ for sparse, intermittent demand time series"

