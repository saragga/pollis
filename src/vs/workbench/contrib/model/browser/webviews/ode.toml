id = "compare-optimizers"
label = "Compare Optimizers"
desc = "Fides, Optim IPNewton and Optim LBFGS from the same starts"
code = '''
using Statistics

{{?model=single}}nstarts = 20
{{?model=multi|profile}}nstarts = {{nstarts}}
{{?model=single|multi|profile}}runs = map(["Fides (Exact Hessian)" => Fides.CustomHessian(), "Fides (BFGS)" => Fides.BFGS(), "Optim IPNewton" => Optim.IPNewton(), "Optim LBFGS" => Optim.LBFGS()]) do (name, alg)
{{?model=single|multi|profile}}    name => calibrate_multistart(Xoshiro({{seed}}), petab_prob, alg, nstarts)  # same seed, so the same starts for every optimiser
{{?model=single|multi|profile}}end
{{?model=single|multi|profile}}fbest = minimum(last(r).fmin for r in runs)
{{?model=single|multi|profile}}for (name, ms) in runs
{{?model=single|multi|profile}}    hits = count(r -> r.fmin <= fbest + 0.1, ms.runs)
{{?model=single|multi|profile}}    println(rpad(name, 24), "best ", round(ms.fmin; digits = 3), ", reach best ", hits, "/", nstarts, ", median time ", round(median(r.runtime for r in ms.runs); sigdigits = 3), " s")
{{?model=single|multi|profile}}end
{{?model=bayes}}println("The sampler targets the posterior, not a minimum: use the Multi-Start model to compare optimisers")
{{?model=struct}}println("The structural model does no optimisation: use an estimation model")
'''

[[actionGroups.actions]]
id = "compare-gradient"
label = "Compare Gradients"
desc = "ForwardDiff, forward sensitivities and adjoint gradients: agreement and time"
code = '''
using SciMLSensitivity, Random  # needed for the adjoint gradient

{{?model!=struct}}x = get_startguesses(Xoshiro(1), petab_prob, 1)  # a point away from the optimum, where the gradient is not near zero
{{?model!=struct}}probs = [m => PEtabODEProblem(model; gradient_method = m) for m in (:ForwardDiff, :ForwardEquations, :Adjoint)]
{{?model!=struct}}g_ref = last(probs[1]).grad(x)
{{?model!=struct}}for (m, p) in probs
{{?model!=struct}}    g = p.grad(x)  # first call compiles
{{?model!=struct}}    t = minimum(@elapsed(p.grad(x)) for _ in 1:5)
{{?model!=struct}}    println(rpad(string(m), 18), "max relative difference from ForwardDiff ", round(maximum(abs.(g .- g_ref) ./ max.(abs.(g_ref), 1e-8)); sigdigits = 2), ", time ", round(1e3 * t; sigdigits = 3), " ms")
{{?model!=struct}}end
{{?model=struct}}println("The structural model has no likelihood to differentiate: use an estimation model")
'''

