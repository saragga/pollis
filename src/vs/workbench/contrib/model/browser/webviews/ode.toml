[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals"
label = "Residual Analysis"
desc = "Weighted residuals between model predictions and measurements"
code = '''
using PEtab, OrdinaryDiffEq, Optim, Plots  # PEtab + plotting

petab_model = PEtabModel({{path}})  # load problem
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective
result = calibrate_model(prob, {{optimizer}}; save_trace=true)  # calibrate

res = get_residuals(prob, result)  # weighted residuals (obs - sim) / sigma
scatter(res; xlabel="Measurement", ylabel="Weighted residual")  # should be N(0,1) if model is correct
'''

[[actionGroups.actions]]
id = "identifiability"
label = "Identifiability"
desc = "Detect structurally or practically non-identifiable parameters"
code = '''
using PEtab, OrdinaryDiffEq, Optim  # PEtab

petab_model = PEtabModel({{path}})  # load problem
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective
result = calibrate_model_multistart(prob, {{optimizer}}, {{nstarts}})  # calibrate

profiles = compute_profile_likelihood(prob, result)  # compute all profiles
println(get_identifiability(profiles))  # identifiable / non-identifiable per parameter
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "simulate"
label = "Simulate Model"
desc = "Solve the ODE forward using calibrated parameter estimates"
code = '''
using PEtab, OrdinaryDiffEq, Optim, Plots  # PEtab + plotting

petab_model = PEtabModel({{path}})  # load problem
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective
result = calibrate_model_multistart(prob, {{optimizer}}, {{nstarts}})  # calibrate

best = get_best(result)  # best parameter set
sol  = get_odesol(prob, best.xmin)  # solve ODE with calibrated parameters
plot(sol)  # plot all state trajectories
'''

[[actionGroups.actions]]
id = "new-condition"
label = "New Condition"
desc = "Predict system behaviour under a new experimental condition"
code = '''
using PEtab, OrdinaryDiffEq, Optim, Plots  # PEtab + plotting

petab_model = PEtabModel({{path}})  # load problem
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective
result = calibrate_model_multistart(prob, {{optimizer}}, {{nstarts}})  # calibrate

best   = get_best(result)  # best parameter set
u0_new = [1.0, 0.0, 0.0]  # new initial conditions
sol    = get_odesol(prob, best.xmin; u0=u0_new)  # simulate under new condition
plot(sol)  # predicted trajectory
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-optimizers"
label = "Compare Optimizers"
desc = "Run LBFGS and Fides on the same problem and compare convergence"
code = '''
using PEtab, OrdinaryDiffEq, Optim, Fides  # PEtab + optimizers

petab_model = PEtabModel({{path}})  # load problem
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective

r_lbfgs = calibrate_model_multistart(prob, Optim.LBFGS(), {{nstarts}})  # LBFGS
r_fides = calibrate_model_multistart(prob, Fides(verbose=false), {{nstarts}})  # Fides

println("LBFGS best: ", get_best(r_lbfgs).xmin)  # LBFGS minimum
println("Fides best: ", get_best(r_fides).xmin)  # Fides minimum
'''

[[actionGroups.actions]]
id = "compare-gradient"
label = "Compare Gradients"
desc = "Compare ForwardDiff vs. adjoint gradient accuracy and timing"
code = '''
using PEtab, OrdinaryDiffEq, Optim, BenchmarkTools  # PEtab + benchmarks

petab_model = PEtabModel({{path}})  # load problem
prob_fd  = PEtabODEProblem(petab_model; gradient_method=:ForwardDiff)  # ForwardDiff gradients
prob_adj = PEtabODEProblem(petab_model; gradient_method=:adjoint)  # adjoint gradients

x0 = get_startguess(prob_fd)  # sample starting point
@btime prob_fd.grad($x0)  # ForwardDiff gradient time
@btime prob_adj.grad($x0)  # adjoint gradient time
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "ci-profile"
label = "Confidence Intervals"
desc = "95% profile-likelihood confidence intervals for all parameters"
code = '''
using PEtab, OrdinaryDiffEq, Optim  # PEtab

petab_model = PEtabModel({{path}})  # load problem
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective
result = calibrate_model_multistart(prob, {{optimizer}}, {{nstarts}})  # calibrate

profiles = compute_profile_likelihood(prob, result)  # compute profiles
ci = get_confidence_intervals(profiles, 0.95)  # 95% CIs via chi2 threshold
println(ci)  # lower and upper bound per parameter
'''

[[actionGroups.actions]]
id = "parameter-values"
label = "Parameter Values"
desc = "Best-fit parameter estimates with names from the PEtab problem"
code = '''
using PEtab, OrdinaryDiffEq, Optim  # PEtab

petab_model = PEtabModel({{path}})  # load problem
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective
result = calibrate_model_multistart(prob, {{optimizer}}, {{nstarts}})  # calibrate

best   = get_best(result)  # best run
params = get_parameter_dict(prob, best.xmin)  # named parameter dict
println(params)  # estimated value for each parameter
'''
