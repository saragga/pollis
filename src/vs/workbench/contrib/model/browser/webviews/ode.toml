# ODE Inference Methods Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/ode.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "ODE Inference Methods"
viewType = "pollis.ode"
defaultModel = "struct"

[[packages]]
name = "PEtab.jl"
github = "https://github.com/sebapersson/PEtab.jl"

[[packages]]
name = "StructuralIdentifiability.jl"
github = "https://github.com/SciML/StructuralIdentifiability.jl"

[[packages]]
name = "LikelihoodProfiler.jl"
github = "https://github.com/insysbio/LikelihoodProfiler.jl"

[[packages]]
name = "AdvancedHMC.jl"
github = "https://github.com/TuringLang/AdvancedHMC.jl"

[requires]
packages = ["PEtab.jl", "StructuralIdentifiability.jl", "LikelihoodProfiler.jl", "AdvancedHMC.jl", "Catalyst.jl", "OrdinaryDiffEqRosenbrock.jl", "Distributions.jl", "Fides.jl", "Optim.jl", "OptimizationLBFGSB.jl", "SciMLSensitivity.jl", "Bijectors.jl", "LogDensityProblems.jl", "LogDensityProblemsAD.jl", "MCMCChains.jl", "StatsPlots.jl", "Plots.jl"]

