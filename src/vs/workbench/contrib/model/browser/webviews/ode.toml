[[codeBranches]]
model = "profile"
code = '''
using PEtab, Catalyst, OrdinaryDiffEqRosenbrock, Fides, Optim, Random
using LikelihoodProfiler, OptimizationLBFGSB
{{?gradient=Adjoint}}using SciMLSensitivity  # must be loaded before the problem is built
using PEtab: DataFrame  # PEtab takes the measurement table as a DataFrame

rng = Xoshiro({{seed}})

# Michaelis-Menten kinetics, S + E <-> SE -> P + E (the PEtab.jl tutorial model); c3 = 3 is known
rn = @reaction_network begin
    @parameters S0 c3=3.0
    @species begin
        S(t) = S0
        E(t) = 50.0
        SE(t) = 0.0
        P(t) = 0.0
    end
    @observables begin
        obs1 ~ S + E
        obs2 ~ P
    end
    c1, S + E --> SE
    c2, SE --> S + E
    c3, SE --> P + E
end

# Simulated data at the true values; noise sd 3 on S + E (known) and sigma = 1 on P (estimated)
x_true = (c1 = 1.0, c2 = 10.0, S0 = 100.0, sigma = 1.0)
oprob = ODEProblem(rn, [:E => 50.0, :SE => 0.0, :P => 0.0], (0.0, 10.0), [:c1 => x_true.c1, :c2 => x_true.c2, :S0 => x_true.S0])
sol = solve(oprob, Rodas5P(); saveat = 0:0.5:10.0)
measurements = vcat(
    DataFrame(obs_id = "obs_SE", time = sol.t, measurement = sol[:S] .+ sol[:E] .+ 3.0 .* randn(rng, length(sol.t))),
    DataFrame(obs_id = "obs_P", time = sol.t, measurement = sol[:P] .+ x_true.sigma .* randn(rng, length(sol.t))),
)
observables = [PEtabObservable(:obs_SE, :obs1, 3.0), PEtabObservable(:obs_P, :obs2, :sigma)]
pest = [PEtabParameter(:c1), PEtabParameter(:c2), PEtabParameter(:S0), PEtabParameter(:sigma)]  # bounds [1e-3, 1e3], log10 scale

yaml = "{{path}}"  # a PEtab standard-format problem replaces the built-in one
model = isempty(yaml) ? PEtabModel(rn, observables, measurements, pest) : PEtabModel(yaml)
petab_prob = PEtabODEProblem(model; gradient_method = :{{gradient}})

pname(k) = replace(string(k), r"^log(10|2)?_" => "")  # parameter name without its scale prefix
linear(k, v) = startswith(string(k), "log10_") ? exp10(v) : startswith(string(k), "log2_") ? exp2(v) : startswith(string(k), "log_") ? exp(v) : v

res = calibrate_multistart(rng, petab_prob, {{optimizer}}, {{nstarts}})  # profile from the best fit

# The objective is the negative log-likelihood, so the threshold is half the chi-square(1) quantile
pl_prob = ProfileLikelihoodProblem(res, petab_prob; threshold = chi2_quantile({{conf}}, 1) / 2)
profiler = OptimizationProfiler(optimizer = OptimizationLBFGSB.LBFGSB(), stepper = FixedStep(; initial_step = 5e-3))
pl_sol = LikelihoodProfiler.solve(pl_prob, profiler)

for (k, pc) in zip(profile_labels(pl_sol), pl_sol.profiles)
    ci, rc = endpoints(pc), retcodes(pc)  # an open side (nothing) means the profile never crossed the threshold
    lo = isnothing(ci.left) ? "open" : round(linear(k, ci.left); sigdigits = 4)
    hi = isnothing(ci.right) ? "open" : round(linear(k, ci.right); sigdigits = 4)
    println(pname(k), ": {{conf}} CI [", lo, ", ", hi, "], left ", rc.left, ", right ", rc.right)
end
'''

[[codeBranches]]
model = "bayes"
code = '''
using PEtab, Catalyst, OrdinaryDiffEqRosenbrock, Distributions, Random
using AdvancedHMC, Bijectors, LogDensityProblems, LogDensityProblemsAD, MCMCChains
{{?gradient=Adjoint}}using SciMLSensitivity  # must be loaded before the problem is built
using PEtab: DataFrame  # PEtab takes the measurement table as a DataFrame

rng = Xoshiro({{seed}})

# Michaelis-Menten kinetics, S + E <-> SE -> P + E (the PEtab.jl tutorial model); c3 = 3 is known
rn = @reaction_network begin
    @parameters S0 c3=3.0
    @species begin
        S(t) = S0
        E(t) = 50.0
        SE(t) = 0.0
        P(t) = 0.0
    end
    @observables begin
        obs1 ~ S + E
        obs2 ~ P
    end
    c1, S + E --> SE
    c2, SE --> S + E
    c3, SE --> P + E
end

# Simulated data at the true values; noise sd 3 on S + E (known) and sigma = 1 on P (estimated)
x_true = (c1 = 1.0, c2 = 10.0, S0 = 100.0, sigma = 1.0)
oprob = ODEProblem(rn, [:E => 50.0, :SE => 0.0, :P => 0.0], (0.0, 10.0), [:c1 => x_true.c1, :c2 => x_true.c2, :S0 => x_true.S0])
sol = solve(oprob, Rodas5P(); saveat = 0:0.5:10.0)
measurements = vcat(
    DataFrame(obs_id = "obs_SE", time = sol.t, measurement = sol[:S] .+ sol[:E] .+ 3.0 .* randn(rng, length(sol.t))),
    DataFrame(obs_id = "obs_P", time = sol.t, measurement = sol[:P] .+ x_true.sigma .* randn(rng, length(sol.t))),
)
observables = [PEtabObservable(:obs_SE, :obs1, 3.0), PEtabObservable(:obs_P, :obs2, :sigma)]
# Priors act on the linear scale: weak log-normal priors on the rates and the noise, a prior median of 90 for S0
pest = [
    PEtabParameter(:c1; prior = LogNormal(0.0, 2.0)),
    PEtabParameter(:c2; prior = LogNormal(0.0, 2.0)),
    PEtabParameter(:S0; prior = LogNormal(4.5, 0.5)),
    PEtabParameter(:sigma; prior = LogNormal(0.0, 1.0)),
]

yaml = "{{path}}"  # a PEtab standard-format problem (priors from its parameter table) replaces the built-in one
model = isempty(yaml) ? PEtabModel(rn, observables, measurements, pest) : PEtabModel(yaml)
petab_prob = PEtabODEProblem(model; gradient_method = :{{gradient}})
target = PEtabLogDensity(petab_prob)  # log-posterior on an unconstrained scale
pname(k) = replace(string(k), r"^log(10|2)?_" => "")  # parameter name without its scale prefix

{{?sampler=NUTS}}sampler = NUTS({{target-acceptance}})
{{?sampler=HMC}}sampler = HMC(0.05, 10)  # step size 0.05, 10 leapfrog steps
chains = map(1:{{nchains}}) do _
    x0 = get_startguesses(rng, petab_prob, 1)  # start drawn from the prior
    x_inf = target.inference_info.bijectors(to_prior_scale(x0, target))  # the sampler starts on the inference scale
    draws = sample(rng, target, sampler, {{nsamples}}; n_adapts = 500, discard_initial = 500, initial_params = x_inf, progress = false)
    to_chains(draws, target)  # back on the prior (linear) scale
end
chain = chainscat(chains...)

println(summarystats(chain))  # posterior mean, sd, effective sample size and R-hat
'''

