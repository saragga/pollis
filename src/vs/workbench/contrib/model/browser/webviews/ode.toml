[[models]]
id = "struct"
label = "Structural Identifiability"

[[models]]
id = "single"
label = "Single-Start"

[[models]]
id = "multi"
label = "Multi-Start"

[[models]]
id = "profile"
label = "Profile Likelihood"

[[models]]
id = "bayes"
label = "Bayesian Inference"

[[decisionRows]]
task = "Structural Identifiability"
context = "Recoverability check"
purpose = "Verify parameters are theoretically recoverable from the model structure before fitting any data"

[[decisionRows]]
task = "Single-Start"
context = "Point estimate"
purpose = "Good starting point available; quick objective evaluation; model exploration"

[[decisionRows]]
task = "Multi-Start"
context = "Robust point estimate"
purpose = "Multiple local minima suspected; no prior on parameters; robustness required"

[[decisionRows]]
task = "Profile Likelihood"
context = "CIs + identifiability"
purpose = "Identifiability analysis; asymmetric CIs; reporting uncertainty for publication"

[[decisionRows]]
task = "Bayesian Inference"
context = "Full posterior"
purpose = "Full posterior distribution needed; parameter uncertainty quantification; prior knowledge available"

[[inputs]]
id = "struct-model"
label = "ODE model"
tooltip = "A ModelingToolkit ODESystem or StructuralIdentifiability @ODEmodel variable. The model must declare state variables, parameters, and the right-hand side equations."
default = "ode_model"
models = ["struct"]

[[inputs]]
id = "struct-observed"
label = "Observed outputs"
tooltip = "List of measured quantities as ModelingToolkit equations mapping output names to state variables, e.g. [y ~ x1, z ~ x2]. Only observed states affect identifiability."
default = "[y ~ x1]"
models = ["struct"]

[[inputs]]
id = "path"
label = "PEtab YAML path"
tooltip = "Path to the PEtab problem YAML file, or a Julia variable holding the PEtabModel object. The YAML file references measurement, condition, parameter, and observable tables."
default = "petab_problem.yaml"
models = ["single", "multi", "profile"]

[[inputs]]
id = "optimizer"
label = "Optimizer"
tooltip = "Local optimizer passed to calibrate_model. LBFGS is fast for smooth problems; IPNewton handles box constraints; Fides is purpose-built for parameter estimation in systems biology."
kind = "select"
default = "Optim.LBFGS()"
models = ["single", "multi", "profile"]

[[inputs.options]]
value = "Optim.LBFGS()"
label = "Optim.LBFGS()"

[[inputs.options]]
value = "Optim.IPNewton()"
label = "Optim.IPNewton()"

[[inputs.options]]
value = "Fides(verbose=false)"
label = "Fides(verbose=false)"

[[inputs]]
id = "gradient"
label = "Gradient method"
tooltip = "Method used to compute gradients of the objective. ForwardDiff is reliable for small models; adjoint methods scale better for large ODE systems."
kind = "select"
default = ":ForwardDiff"
models = ["single", "multi", "profile"]

[[inputs.options]]
value = ":ForwardDiff"
label = ":ForwardDiff"

[[inputs.options]]
value = ":adjoint"
label = ":adjoint"

[[inputs.options]]
value = ":ForwardEquations"
label = ":ForwardEquations"

[[inputs]]
id = "nstarts"
label = "n starts"
tooltip = "Number of independent optimisation runs from different Latin hypercube starting points. More starts improve robustness at the cost of computation time."
default = "50"
models = ["multi"]

[[inputs]]
id = "bayes-path"
label = "PEtab YAML path"
tooltip = "Path to the PEtab problem YAML file, or a Julia variable holding the PEtabModel object."
default = "petab_problem.yaml"
models = ["bayes"]

[[inputs]]
id = "sampler"
label = "Sampler"
tooltip = "MCMC sampler used for posterior sampling. NUTS (No-U-Turn Sampler) adapts step size automatically and is recommended for most problems. HMC requires manual step size tuning."
kind = "select"
default = "NUTS"
models = ["bayes"]

[[inputs.options]]
value = "NUTS"
label = "NUTS"

[[inputs.options]]
value = "HMC"
label = "HMC"

[[inputs]]
id = "target-acceptance"
label = "Target acceptance"
tooltip = "Target acceptance probability for the NUTS dual-averaging step-size adaptation. Values between 0.6 and 0.9 are typical; higher values give smaller steps and better mixing at higher cost."
default = "0.8"
when = "sampler=NUTS"
models = ["bayes"]

[[inputs]]
id = "nsamples"
label = "n samples"
tooltip = "Number of MCMC samples drawn per chain after warm-up. More samples give better posterior estimates at higher computational cost."
default = "1000"
models = ["bayes"]

[[inputs]]
id = "nchains"
label = "n chains"
tooltip = "Number of independent MCMC chains run in parallel. Multiple chains allow convergence diagnostics (R-hat). Four chains is a common default."
default = "4"
models = ["bayes"]

[[codeBranches]]
model = "struct"
code = '''
using StructuralIdentifiability  # symbolic identifiability analysis

result = assess_identifiability({{struct-model}}; measured_quantities={{struct-observed}})  # classify each parameter

for (param, status) in result  # iterate over all parameters
    println(param, " => ", status)
end  # :globally / :locally / :nonidentifiable
'''

[[codeBranches]]
model = "single"
code = '''
using PEtab, OrdinaryDiffEq, Optim  # PEtab + ODE solver + optimizer

petab_model = PEtabModel({{path}})  # load PEtab problem from YAML
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective with gradient

result = calibrate_model(prob, {{optimizer}}; save_trace=true)  # single-start local optimisation

println(result)  # display estimated parameters and objective
println("Cost: ", result.xmin)  # best objective value found
'''

[[codeBranches]]
model = "multi"
code = '''
using PEtab, OrdinaryDiffEq, Optim  # PEtab + ODE solver + optimizer

petab_model = PEtabModel({{path}})  # load PEtab problem from YAML
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective with gradient

results = calibrate_model_multistart(prob, {{optimizer}}, {{nstarts}})  # multi-start: LHS sampling + {{nstarts}} local runs

best = get_best(results)  # extract run with lowest objective
println(best)  # best parameter estimates
waterfall_plot(results)  # waterfall plot of all start objectives
'''

[[codeBranches]]
model = "profile"
code = '''
using PEtab, OrdinaryDiffEq, Optim  # PEtab + ODE solver + optimizer

petab_model = PEtabModel({{path}})  # load PEtab problem from YAML
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective with gradient

result = calibrate_model_multistart(prob, {{optimizer}}, {{nstarts}})  # first: calibrate to find best fit

profiles = compute_profile_likelihood(prob, result)  # profile each parameter individually

plot_profiles(profiles)  # plot profile likelihood curves
get_confidence_intervals(profiles, 0.95)  # 95% confidence intervals from profile
'''

[[codeBranches]]
model = "bayes"
code = '''
using PEtab, OrdinaryDiffEq, Turing, MCMCChains  # PEtab + Turing sampler

petab_model = PEtabModel({{bayes-path}})  # load PEtab problem from YAML
prob = PEtabODEProblem(petab_model)  # build ODE problem
bayes_prob = PEtabBayesianProblem(prob)  # wrap as Turing model for posterior sampling

{{?sampler=NUTS}} chain = sample(bayes_prob, NUTS({{target-acceptance}}), MCMCThreads(), {{nsamples}}, {{nchains}})  # run {{nchains}} parallel chains with {{nsamples}} samples each
{{?sampler=HMC}} chain = sample(bayes_prob, HMC(0.05, 10), MCMCThreads(), {{nsamples}}, {{nchains}})  # run {{nchains}} parallel chains with {{nsamples}} samples each

println(summarystats(chain))  # posterior means, std, R-hat convergence
plot(chain)  # trace and density plots for all parameters
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "obs-vs-sim"
label = "Observed vs. Simulated"
desc = "Overlay calibrated model trajectories on experimental measurements"
code = '''
using PEtab, OrdinaryDiffEq, Optim, Plots  # PEtab + plotting

petab_model = PEtabModel({{path}})  # load problem
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective
results = calibrate_model_multistart(prob, {{optimizer}}, {{nstarts}})  # calibrate

plot_fits(prob, get_best(results))  # observed vs. simulated for each observable
'''

[[actionGroups.actions]]
id = "waterfall"
label = "Waterfall Plot"
desc = "Sorted final objective values across all multi-start runs"
code = '''
using PEtab, OrdinaryDiffEq, Optim, Plots  # PEtab + plotting

petab_model = PEtabModel({{path}})  # load problem
prob = PEtabODEProblem(petab_model; gradient_method={{gradient}})  # build objective
results = calibrate_model_multistart(prob, {{optimizer}}, {{nstarts}})  # calibrate

waterfall_plot(results)  # flat plateau = global minimum found; slope = local minima
'''

