[[decisionRows]]
task = "Structural Identifiability"
context = "Recoverability check"
purpose = "Check that the parameters can be recovered from perfect, noise-free data on the chosen outputs, before fitting anything"

[[decisionRows]]
task = "Single-Start"
context = "Point estimate"
purpose = "One local fit from one start; fast, but may stop in a local minimum"

[[decisionRows]]
task = "Multi-Start"
context = "Robust point estimate"
purpose = "Many local fits from Latin-hypercube starts; the waterfall plot shows whether the best minimum is found repeatedly"

[[decisionRows]]
task = "Profile Likelihood"
context = "CIs + identifiability"
purpose = "Practical identifiability and likelihood-based confidence intervals, which may be asymmetric or open-ended"

[[decisionRows]]
task = "Bayesian Inference"
context = "Full posterior"
purpose = "Posterior distribution with priors, sampled by NUTS or HMC; credible intervals and parameter correlations"

[[inputs]]
id = "struct-observed"
label = "Observed Outputs"
tooltip = "Which quantities are measured. The estimation models measure both S + E and P."
kind = "select"
default = "both"
models = ["struct"]

[[inputs.options]]
value = "both"
label = "S + E and P"

[[inputs.options]]
value = "p"
label = "P Only"

[[inputs.options]]
value = "se"
label = "S + E Only"

[[inputs]]
id = "path"
label = "PEtab YAML (Optional)"
tooltip = "Path to a problem in the PEtab standard format (YAML plus SBML model and tables). Leave empty to use the Michaelis-Menten problem built in the code. Prediction and true-value comparisons apply to the built-in problem only."
default = ""
models = ["single", "multi", "profile", "bayes"]

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Random seed for the simulated measurements, the start points and the sampler."
default = "1"
models = ["single", "multi", "profile", "bayes"]

[[inputs]]
id = "optimizer"
label = "Optimizer"
tooltip = "Local optimizer passed to calibrate. Fides with the exact Hessian is PEtab.jl's recommendation for small models; Fides.BFGS() approximates the Hessian; Optim's IPNewton and LBFGS are alternatives."
kind = "select"
default = "Fides.CustomHessian()"
models = ["single", "multi", "profile"]

[[inputs.options]]
value = "Fides.CustomHessian()"
label = "Fides (Exact Hessian)"

[[inputs.options]]
value = "Fides.BFGS()"
label = "Fides (BFGS)"

[[inputs.options]]
value = "Optim.IPNewton()"
label = "Optim IPNewton"

[[inputs.options]]
value = "Optim.LBFGS()"
label = "Optim LBFGS"

[[inputs]]
id = "gradient"
label = "Gradient Method"
tooltip = "How PEtab.jl computes the gradient of the negative log-likelihood. ForwardDiff is usually fastest for small models; adjoint sensitivities scale best to large models and need SciMLSensitivity."
kind = "select"
default = "ForwardDiff"
models = ["single", "multi", "profile", "bayes"]

[[inputs.options]]
value = "ForwardDiff"
label = "ForwardDiff"

[[inputs.options]]
value = "ForwardEquations"
label = "Forward Sensitivities"

[[inputs.options]]
value = "Adjoint"
label = "Adjoint"

[[inputs]]
id = "nstarts"
label = "n Starts"
tooltip = "Number of local optimisations from Latin-hypercube starting points within the parameter bounds."
default = "50"
models = ["multi", "profile"]

[[inputs]]
id = "conf"
label = "Confidence Level"
tooltip = "Level of the profile-likelihood confidence intervals. The threshold on the negative log-likelihood is half the chi-square(1) quantile."
default = "0.95"
models = ["profile"]

[[inputs]]
id = "sampler"
label = "Sampler"
tooltip = "AdvancedHMC sampler. NUTS adapts its path length and step size; HMC uses a fixed step size of 0.05 and 10 leapfrog steps."
kind = "select"
default = "NUTS"
models = ["bayes"]

[[inputs.options]]
value = "NUTS"
label = "NUTS"

[[inputs.options]]
value = "HMC"
label = "HMC"

[[inputs]]
id = "target-acceptance"
label = "Target Acceptance"
tooltip = "Target acceptance rate for the NUTS step-size adaptation. 0.8 is Stan's default; higher values take smaller steps."
default = "0.8"
when = "sampler=NUTS"
models = ["bayes"]

[[inputs]]
id = "nsamples"
label = "n Samples"
tooltip = "Draws kept per chain, after 500 adaptation draws that are discarded."
default = "1000"
models = ["bayes"]

[[inputs]]
id = "nchains"
label = "n Chains"
tooltip = "Number of chains, each started from a draw from the prior. Several chains are needed for R-hat."
default = "4"
models = ["bayes"]

[[codeBranches]]
model = "struct"
code = '''
using StructuralIdentifiability

# Michaelis-Menten kinetics, S + E <-> SE -> P + E, with c3 = 3 substituted because it is known in the estimation models
ode = @ODEmodel(
    S'(t) = -c1 * S(t) * E(t) + c2 * SE(t),
    E'(t) = -c1 * S(t) * E(t) + (c2 + 3) * SE(t),
    SE'(t) = c1 * S(t) * E(t) - (c2 + 3) * SE(t),
    P'(t) = 3 * SE(t),
{{?struct-observed=both|se}}    y1(t) = S(t) + E(t),
{{?struct-observed=both|p}}    y2(t) = P(t),
)

# E, SE and P start at known values (50, 0, 0); only S(0) = S0 is unknown, as in the estimation models
known = [E, SE, P]
for (f, status) in assess_identifiability(ode; known_ic = known)  # :globally, :locally or :nonidentifiable
    println(f, " => ", status)
end
println("Identifiable combinations: ", find_identifiable_functions(ode; known_ic = known))
'''

[[codeBranches]]
model = "single"
code = '''
using PEtab, Catalyst, OrdinaryDiffEqRosenbrock, Fides, Optim, Random
{{?gradient=Adjoint}}using SciMLSensitivity  # must be loaded before the problem is built
using PEtab: DataFrame  # PEtab takes the measurement table as a DataFrame

rng = Xoshiro({{seed}})

# Michaelis-Menten kinetics, S + E <-> SE -> P + E (the PEtab.jl tutorial model); c3 = 3 is known
rn = @reaction_network begin
    @parameters S0 c3=3.0
    @species begin
        S(t) = S0
        E(t) = 50.0
        SE(t) = 0.0
        P(t) = 0.0
    end
    @observables begin
        obs1 ~ S + E
        obs2 ~ P
    end
    c1, S + E --> SE
    c2, SE --> S + E
    c3, SE --> P + E
end

# Simulated data at the true values; noise sd 3 on S + E (known) and sigma = 1 on P (estimated)
x_true = (c1 = 1.0, c2 = 10.0, S0 = 100.0, sigma = 1.0)
oprob = ODEProblem(rn, [:E => 50.0, :SE => 0.0, :P => 0.0], (0.0, 10.0), [:c1 => x_true.c1, :c2 => x_true.c2, :S0 => x_true.S0])
sol = solve(oprob, Rodas5P(); saveat = 0:0.5:10.0)
measurements = vcat(
    DataFrame(obs_id = "obs_SE", time = sol.t, measurement = sol[:S] .+ sol[:E] .+ 3.0 .* randn(rng, length(sol.t))),
    DataFrame(obs_id = "obs_P", time = sol.t, measurement = sol[:P] .+ x_true.sigma .* randn(rng, length(sol.t))),
)
observables = [PEtabObservable(:obs_SE, :obs1, 3.0), PEtabObservable(:obs_P, :obs2, :sigma)]
pest = [PEtabParameter(:c1), PEtabParameter(:c2), PEtabParameter(:S0), PEtabParameter(:sigma)]  # bounds [1e-3, 1e3], log10 scale

yaml = "{{path}}"  # a PEtab standard-format problem replaces the built-in one
model = isempty(yaml) ? PEtabModel(rn, observables, measurements, pest) : PEtabModel(yaml)
petab_prob = PEtabODEProblem(model; gradient_method = :{{gradient}})

pname(k) = replace(string(k), r"^log(10|2)?_" => "")  # parameter name without its scale prefix
linear(k, v) = startswith(string(k), "log10_") ? exp10(v) : startswith(string(k), "log2_") ? exp2(v) : startswith(string(k), "log_") ? exp(v) : v

x0 = get_startguesses(rng, petab_prob, 1)  # one random start within the bounds
res = calibrate(petab_prob, x0, {{optimizer}})

println("Negative log-likelihood ", round(res.fmin; digits = 3), " after ", res.niterations, " iterations (converged: ", res.converged, ")")
for k in keys(res.xmin)
    println(pname(k), " = ", round(linear(k, res.xmin[k]); sigdigits = 4))
end
'''

