[[codeBranches]]
model = "encoder"
code = '''
using Flux

d_model     = {{d-model}}  # embedding dimension
num_heads   = {{num-heads}}  # attention heads (must divide d_model)
d_ff        = {{d-ff}}  # feed-forward dimension
num_layers  = {{num-layers}}  # encoder blocks
dropout     = {{dropout}}  # dropout rate
seq_len     = {{seq-len}}  # maximum token sequence length
vocab_size  = {{vocab-size}}  # vocabulary size
num_classes = {{num-classes}}  # output classes

struct Block  # pre-LN transformer block: self-attention and feed-forward, each with a residual
    ln1; attn; ln2; ff; drop
end
Flux.@layer Block
Block(d, h, ff, p) = Block(LayerNorm(d), MultiHeadAttention(d; nheads=h, dropout_prob=p), LayerNorm(d), Chain(Dense(d => ff, gelu), Dense(ff => d)), Dropout(p))
function (b::Block)(x; mask=nothing)
    x = x .+ b.drop(first(b.attn(b.ln1(x); mask)))
    x .+ b.drop(b.ff(b.ln2(x)))
end

{{?positions=sinusoidal}} function sinusoidal(d, T)  # fixed d x T position encodings (Vaswani et al. 2017)
{{?positions=sinusoidal}}     freq = 10000f0 .^ (-(0:2:d-1) ./ d)
{{?positions=sinusoidal}}     P = zeros(Float32, d, T)
{{?positions=sinusoidal}}     P[1:2:end, :] = sin.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P[2:2:end, :] = cos.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P
{{?positions=sinusoidal}} end
{{?positions=sinusoidal}} positions(d, T) = sinusoidal(d, T)  # fixed, not trained
{{?positions=learned}} positions(d, T) = Flux.glorot_uniform(d, T)  # trained position table (fixed maximum length)

struct Encoder  # BERT-style: every token attends to every other token
    embed; pos; blocks; ln; head
end
{{?positions=sinusoidal}} Flux.@layer Encoder trainable=(embed, blocks, ln, head)  # fixed positions are not trained
{{?positions=learned}} Flux.@layer Encoder
inputs(m, x) = m.embed(x) .+ m.pos[:, 1:size(x, 1)]  # x: seq_len x batch token ids
function (m::Encoder)(x)
    h = inputs(m, x)
    for b in m.blocks
        h = b(h)
    end
    m.head(m.ln(h)[:, 1, :])  # first ([CLS]) token -> class logits
end

model = Encoder(Embedding(vocab_size => d_model), positions(d_model, seq_len),
                [Block(d_model, num_heads, d_ff, dropout) for _ in 1:num_layers], LayerNorm(d_model), Dense(d_model => num_classes))

loss(model, x, y) = Flux.logitcrossentropy(model(x), Flux.onehotbatch(y, 1:num_classes))
data = ({{xvar}}, {{yvar}})  # token ids (seq_len x n), class labels (n)
opt_state = Flux.setup(AdamW(1f-4), model)
loader = Flux.DataLoader(data, batchsize=32, shuffle=true)
for epoch in 1:20
    Flux.train!(loss, model, loader, opt_state)
end
'''

[[codeBranches]]
model = "decoder"
code = '''
using Flux

d_model     = {{d-model}}  # embedding dimension
num_heads   = {{num-heads}}  # attention heads (must divide d_model)
d_ff        = {{d-ff}}  # feed-forward dimension
num_layers  = {{num-layers}}  # decoder blocks
dropout     = {{dropout}}  # dropout rate
seq_len     = {{seq-len}}  # context window length
vocab_size  = {{vocab-size}}  # vocabulary size

struct Block  # pre-LN transformer block: self-attention and feed-forward, each with a residual
    ln1; attn; ln2; ff; drop
end
Flux.@layer Block
Block(d, h, ff, p) = Block(LayerNorm(d), MultiHeadAttention(d; nheads=h, dropout_prob=p), LayerNorm(d), Chain(Dense(d => ff, gelu), Dense(ff => d)), Dropout(p))
function (b::Block)(x; mask=nothing)
    x = x .+ b.drop(first(b.attn(b.ln1(x); mask)))
    x .+ b.drop(b.ff(b.ln2(x)))
end

{{?positions=sinusoidal}} function sinusoidal(d, T)  # fixed d x T position encodings (Vaswani et al. 2017)
{{?positions=sinusoidal}}     freq = 10000f0 .^ (-(0:2:d-1) ./ d)
{{?positions=sinusoidal}}     P = zeros(Float32, d, T)
{{?positions=sinusoidal}}     P[1:2:end, :] = sin.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P[2:2:end, :] = cos.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P
{{?positions=sinusoidal}} end
{{?positions=sinusoidal}} positions(d, T) = sinusoidal(d, T)  # fixed, not trained
{{?positions=learned}} positions(d, T) = Flux.glorot_uniform(d, T)  # trained position table (fixed maximum length)

struct Decoder  # GPT-style: each token attends only to earlier tokens
    embed; pos; blocks; ln; head
end
{{?positions=sinusoidal}} Flux.@layer Decoder trainable=(embed, blocks, ln, head)  # fixed positions are not trained
{{?positions=learned}} Flux.@layer Decoder
inputs(m, x) = m.embed(x) .+ m.pos[:, 1:size(x, 1)]  # x: seq_len x batch token ids
function (m::Decoder)(x)
    h = inputs(m, x)
    mask = Flux.NNlib.make_causal_mask(h)  # position t sees only positions <= t
    for b in m.blocks
        h = b(h; mask)
    end
    m.head(m.ln(h))  # vocab_size x T x batch logits
end

model = Decoder(Embedding(vocab_size => d_model), positions(d_model, seq_len),
                [Block(d_model, num_heads, d_ff, dropout) for _ in 1:num_layers], LayerNorm(d_model), Dense(d_model => vocab_size))

loss(model, x) = Flux.logitcrossentropy(model(x)[:, 1:end-1, :], Flux.onehotbatch(x[2:end, :], 1:vocab_size))  # predict every next token
data = ({{xvar}},)  # token ids, seq_len x n
opt_state = Flux.setup(AdamW(1f-4), model)
loader = Flux.DataLoader(data, batchsize=32, shuffle=true)
for epoch in 1:20
    Flux.train!(loss, model, loader, opt_state)
end
'''

[[codeBranches]]
model = "encdec"
code = '''
using Flux

d_model     = {{d-model}}  # embedding dimension
num_heads   = {{num-heads}}  # attention heads (must divide d_model)
d_ff        = {{d-ff}}  # feed-forward dimension
num_layers  = {{num-layers}}  # encoder and decoder blocks each
dropout     = {{dropout}}  # dropout rate
seq_len     = {{seq-len}}  # source sequence length
tgt_len     = {{tgt-len}}  # target sequence length
vocab_size  = {{vocab-size}}  # shared vocabulary size

struct Block  # pre-LN transformer block: self-attention and feed-forward, each with a residual
    ln1; attn; ln2; ff; drop
end
Flux.@layer Block
Block(d, h, ff, p) = Block(LayerNorm(d), MultiHeadAttention(d; nheads=h, dropout_prob=p), LayerNorm(d), Chain(Dense(d => ff, gelu), Dense(ff => d)), Dropout(p))
function (b::Block)(x; mask=nothing)
    x = x .+ b.drop(first(b.attn(b.ln1(x); mask)))
    x .+ b.drop(b.ff(b.ln2(x)))
end

{{?positions=sinusoidal}} function sinusoidal(d, T)  # fixed d x T position encodings (Vaswani et al. 2017)
{{?positions=sinusoidal}}     freq = 10000f0 .^ (-(0:2:d-1) ./ d)
{{?positions=sinusoidal}}     P = zeros(Float32, d, T)
{{?positions=sinusoidal}}     P[1:2:end, :] = sin.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P[2:2:end, :] = cos.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P
{{?positions=sinusoidal}} end
{{?positions=sinusoidal}} positions(d, T) = sinusoidal(d, T)  # fixed, not trained
{{?positions=learned}} positions(d, T) = Flux.glorot_uniform(d, T)  # trained position table (fixed maximum length)

struct CrossBlock  # causal self-attention, cross-attention over the encoder memory, feed-forward
    ln1; self_attn; ln2; cross_attn; ln3; ff; drop
end
Flux.@layer CrossBlock
CrossBlock(d, h, ff, p) = CrossBlock(LayerNorm(d), MultiHeadAttention(d; nheads=h, dropout_prob=p), LayerNorm(d),
                                     MultiHeadAttention(d; nheads=h, dropout_prob=p), LayerNorm(d), Chain(Dense(d => ff, gelu), Dense(ff => d)), Dropout(p))
function (b::CrossBlock)(y, memory; mask=nothing)
    y = y .+ b.drop(first(b.self_attn(b.ln1(y); mask)))
    y = y .+ b.drop(first(b.cross_attn(b.ln2(y), memory, memory)))  # every target position reads the encoded source
    y .+ b.drop(b.ff(b.ln3(y)))
end

struct Seq2Seq  # encoder-decoder (translation, summarisation)
    embed; pos; blocks; cross_blocks; ln_enc; ln_dec; head
end
{{?positions=sinusoidal}} Flux.@layer Seq2Seq trainable=(embed, blocks, cross_blocks, ln_enc, ln_dec, head)  # fixed positions are not trained
{{?positions=learned}} Flux.@layer Seq2Seq
inputs(m, x) = m.embed(x) .+ m.pos[:, 1:size(x, 1)]  # x: length x batch token ids
function (m::Seq2Seq)(src, tgt)
    memory = inputs(m, src)
    for b in m.blocks
        memory = b(memory)
    end
    memory = m.ln_enc(memory)
    h = inputs(m, tgt)
    mask = Flux.NNlib.make_causal_mask(h)
    for b in m.cross_blocks
        h = b(h, memory; mask)
    end
    m.head(m.ln_dec(h))  # vocab_size x T x batch logits
end

model = Seq2Seq(Embedding(vocab_size => d_model), positions(d_model, max(seq_len, tgt_len)),
                [Block(d_model, num_heads, d_ff, dropout) for _ in 1:num_layers],
                [CrossBlock(d_model, num_heads, d_ff, dropout) for _ in 1:num_layers],
                LayerNorm(d_model), LayerNorm(d_model), Dense(d_model => vocab_size))

loss(model, src, tgt) = Flux.logitcrossentropy(model(src, tgt[1:end-1, :]), Flux.onehotbatch(tgt[2:end, :], 1:vocab_size))  # teacher forcing
data = ({{xvar}}, {{yvar}})  # source ids (seq_len x n), target ids starting with a start token (tgt_len x n)
opt_state = Flux.setup(AdamW(1f-4), model)
loader = Flux.DataLoader(data, batchsize=32, shuffle=true)
for epoch in 1:20
    Flux.train!(loss, model, loader, opt_state)
end
'''

