[[actionGroups.actions]]
id = "baseline"
label = "vs Simple Baseline"
desc = "Loss of the Transformer against a baseline without attention: class prior, unigram frequencies, last value or linear model"
code = '''
using Statistics

sample = map(a -> collect(selectdim(a, ndims(a), 1:min(size(a, ndims(a)), 256))), data)
{{?model=encoder}} prior = [count(==(c), data[2]) + 1 for c in 1:num_classes] ./ (length(data[2]) + num_classes)
{{?model=encoder}} baseline = -mean(log.(prior[sample[2]]))  # cross-entropy of always predicting the class frequencies
{{?model=decoder}} freq = [count(==(v), data[1]) + 1 for v in 1:vocab_size] ./ (length(data[1]) + vocab_size)
{{?model=decoder}} baseline = -mean(log.(freq[sample[1][2:end, :]]))  # unigram cross-entropy
{{?model=encdec}} freq = [count(==(v), data[2]) + 1 for v in 1:vocab_size] ./ (length(data[2]) + vocab_size)
{{?model=encdec}} baseline = -mean(log.(freq[sample[2][2:end, :]]))  # unigram cross-entropy of the targets
{{?model=timeseries}} baseline = Flux.mse(repeat(sample[1][end:end, :], pred_len), sample[2])  # repeat the last observed value
{{?model=crossmodal}} X = vcat(sample[2], ones(Float32, 1, size(sample[2], 2)))
{{?model=crossmodal}} baseline = Flux.mse((sample[3] / X) * X, sample[3])  # least squares on the numerical features alone
(transformer = loss(model, sample...), baseline = baseline)
'''

