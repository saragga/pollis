[[actionGroups.actions]]
id = "attention-entropy"
label = "Attention Entropy per Head"
desc = "Normalised entropy of each head's attention in every block; values near 0 mean a head attends to a single position"
code = '''
using Plots, Statistics

h = inputs(model, collect(selectdim(data[1], ndims(data[1]), 1:min(size(data[1], ndims(data[1])), 32))))
{{?model=decoder}} mask = Flux.NNlib.make_causal_mask(h)
{{?model!=decoder}} mask = nothing
E = zeros(num_heads, length(model.blocks))
for (l, b) in enumerate(model.blocks)
    _, A = b.attn(b.ln1(h); mask)
    E[:, l] = vec(mean(-sum(A .* log.(A .+ 1f-9); dims=1); dims=(2, 4))) ./ log(size(A, 1))
    h = b(h; mask)
end
heatmap(E, xlabel="block", ylabel="head", clims=(0, 1), title="normalised attention entropy")
'''

