label = "Cross-Modal"

[[bullets]]
text = "Encoder"
detail = "BERT-style bidirectional encoder; classification and sequence labelling"

[[bullets]]
text = "Decoder"
detail = "GPT-style causal decoder; autoregressive language modelling"

[[bullets]]
text = "Encoder-Decoder"
detail = "full seq2seq architecture with cross-attention; translation and summarisation"

[[bullets]]
text = "Time Series"
detail = "PatchTST; patch tokenisation of time series for multivariate forecasting"

[[bullets]]
text = "Cross-Modal"
detail = "text and numerical feature fusion; financial earnings and sentiment models"

[[decisionRows]]
task = "Encoder"
context = "Classify or label whole sequences of tokens"
purpose = "Bidirectional self-attention; every token sees the full context (BERT)"

[[decisionRows]]
task = "Decoder"
context = "Generate text or continue a sequence"
purpose = "Causal self-attention; each token sees only the past (GPT)"

[[decisionRows]]
task = "Encoder-Decoder"
context = "Map one sequence to another (translation, summarisation)"
purpose = "Encoder reads the source; decoder cross-attends to it while generating"

[[decisionRows]]
task = "Time Series"
context = "Long-horizon forecasting from a lookback window"
purpose = "PatchTST: patches of consecutive time steps become the tokens"

[[decisionRows]]
task = "Cross-Modal"
context = "Text and numerical features describe the same example"
purpose = "Text encoder output fused with projected numerical features"

[[inputs]]
id = "xvar"
label = "Input variable"
tooltip = "Encoder, Decoder, Encoder-Decoder and Cross-Modal: token ids, seq_len x n. Time Series: lookback windows, seq_len x n."
default = "x"

[[inputs]]
id = "yvar"
label = "Target variable"
tooltip = "Encoder: class labels (n). Encoder-Decoder: target token ids beginning with a start token, tgt_len x n. Time Series: forecast horizons, pred_len x n. Cross-Modal: targets, 1 x n."
default = "y"
models = ["encoder", "encdec", "timeseries", "crossmodal"]

[[inputs]]
id = "xnum"
label = "Numerical features"
tooltip = "Numerical features per example, d_num x n (price ratios, volumes, macro indicators)."
default = "x_num"
models = ["crossmodal"]

[[inputs]]
id = "d-model"
label = "d_model"
tooltip = "Embedding dimension — the width of all token and position representations. All sub-layers (attention, FFN, residual connections) operate in this space. Must be divisible by num_heads. Typical range: 128–1024."
default = "256"
newRow = true

[[inputs]]
id = "d-ff"
label = "d_ff"
tooltip = "Dimension of the position-wise feed-forward network inside each Transformer block. Usually 2× or 4× d_model. Larger values increase capacity at the cost of memory."
default = "512"

[[inputs]]
id = "num-heads"
label = "num_heads"
tooltip = "Number of parallel attention heads. Each head attends to different aspects of the input independently; their outputs are concatenated. d_model must be divisible by num_heads. Typical: 4, 8, or 16."
default = "8"

[[inputs]]
id = "num-layers"
label = "num_layers"
tooltip = "Number of stacked Transformer blocks (for the Encoder-Decoder: in the encoder and in the decoder each). More layers capture deeper structure but increase training cost and risk overfitting on small datasets. Typical: 4–12."
default = "4"

[[inputs]]
id = "dropout"
label = "dropout"
tooltip = "Dropout probability applied to attention weights and to the residual branches. Set to 0 to disable. Typical range: 0.1–0.3."
default = "0.1"

[[inputs]]
id = "positions"
label = "Positional encoding"
tooltip = "Sinusoidal: fixed sine and cosine vectors (Vaswani et al. 2017), not trained. Learned: a trained position table; best when seq_len is fixed and data is plentiful, but it does not generalise beyond the training length."
kind = "select"
default = "sinusoidal"

[[inputs.options]]
value = "sinusoidal"
label = "Sinusoidal"

[[inputs.options]]
value = "learned"
label = "Learned"

[[inputs]]
id = "seq-len"
label = "seq_len"
tooltip = "Input sequence length in tokens: the maximum number of tokens per example (for the Encoder-Decoder, the source length)."
default = "128"
models = ["encoder", "decoder", "encdec", "crossmodal"]
newRow = true

[[inputs]]
id = "vocab-size"
label = "vocab_size"
tooltip = "Size of the token vocabulary — determines the Embedding table rows. For financial text with BPE tokenisation: 10 000–50 000. For byte-level models: 256."
default = "10000"
models = ["encoder", "decoder", "encdec", "crossmodal"]

[[inputs]]
id = "num-classes"
label = "num_classes"
tooltip = "Number of output classes; labels are the integers 1 to num_classes."
default = "2"
models = ["encoder"]

[[inputs]]
id = "tgt-len"
label = "tgt_len"
tooltip = "Target sequence length — the number of tokens the decoder generates. For translation this is the target sentence length; for summarisation it is the summary length."
default = "64"
models = ["encdec"]

[[inputs]]
id = "d-num"
label = "d_num"
tooltip = "Dimensionality of the numerical feature vector per example. These features are projected to d_model by a Dense layer and fused with the text representation."
default = "32"
models = ["crossmodal"]

[[inputs]]
id = "ts-seq-len"
label = "seq_len"
tooltip = "Historical lookback window in time steps. Must be divisible by patch_size."
default = "336"
models = ["timeseries"]
newRow = true

[[inputs]]
id = "pred-len"
label = "pred_len"
tooltip = "Forecast horizon — number of future time steps to predict. PatchTST maps the full patch sequence directly to a flat pred_len output vector. Typical values: 24, 96, 192, 720."
default = "96"
models = ["timeseries"]

[[inputs]]
id = "patch-size"
label = "patch_size"
tooltip = "Number of consecutive time steps grouped into one patch token. Smaller patches preserve finer detail; larger patches give a broader view per token. seq_len must be divisible by patch_size. Typical: 8–64."
default = "16"
models = ["timeseries"]

