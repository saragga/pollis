id = "attention-layers"
label = "Attention by Layer"
desc = "Head-averaged attention of every block for the first example: how the attention pattern changes with depth"
code = '''
using Plots, Statistics

h = inputs(model, collect(selectdim(data[1], ndims(data[1]), 1:1)))
{{?model=decoder}} mask = Flux.NNlib.make_causal_mask(h)
{{?model!=decoder}} mask = nothing
maps = Matrix{Float32}[]
for b in model.blocks
    _, A = b.attn(b.ln1(h); mask)
    push!(maps, permutedims(dropdims(mean(A[:, :, :, 1]; dims=3); dims=3)))
    h = b(h; mask)
end
plot([heatmap(M, title=string("block ", l), yflip=true, colorbar=false) for (l, M) in enumerate(maps)]...)
'''

