model = "timeseries"
code = '''
using Flux

d_model     = {{d-model}}  # embedding dimension
num_heads   = {{num-heads}}  # attention heads (must divide d_model)
d_ff        = {{d-ff}}  # feed-forward dimension
num_layers  = {{num-layers}}  # encoder blocks
dropout     = {{dropout}}  # dropout rate
seq_len     = {{ts-seq-len}}  # lookback window (time steps)
pred_len    = {{pred-len}}  # forecast horizon (time steps)
patch_size  = {{patch-size}}  # time steps per patch token
num_patches = div(seq_len, patch_size)  # seq_len must be a multiple of patch_size

struct Block  # pre-LN transformer block: self-attention and feed-forward, each with a residual
    ln1; attn; ln2; ff; drop
end
Flux.@layer Block
Block(d, h, ff, p) = Block(LayerNorm(d), MultiHeadAttention(d; nheads=h, dropout_prob=p), LayerNorm(d), Chain(Dense(d => ff, gelu), Dense(ff => d)), Dropout(p))
function (b::Block)(x; mask=nothing)
    x = x .+ b.drop(first(b.attn(b.ln1(x); mask)))
    x .+ b.drop(b.ff(b.ln2(x)))
end

{{?positions=sinusoidal}} function sinusoidal(d, T)  # fixed d x T position encodings (Vaswani et al. 2017)
{{?positions=sinusoidal}}     freq = 10000f0 .^ (-(0:2:d-1) ./ d)
{{?positions=sinusoidal}}     P = zeros(Float32, d, T)
{{?positions=sinusoidal}}     P[1:2:end, :] = sin.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P[2:2:end, :] = cos.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P
{{?positions=sinusoidal}} end
{{?positions=sinusoidal}} positions(d, T) = sinusoidal(d, T)  # fixed, not trained
{{?positions=learned}} positions(d, T) = Flux.glorot_uniform(d, T)  # trained position table (fixed maximum length)

struct PatchTST  # Nie et al. 2023: non-overlapping patches become the tokens
    patch_embed; pos; blocks; ln; head
end
{{?positions=sinusoidal}} Flux.@layer PatchTST trainable=(patch_embed, blocks, ln, head)  # fixed positions are not trained
{{?positions=learned}} Flux.@layer PatchTST
inputs(m, x) = m.patch_embed(reshape(x, patch_size, :, size(x, 2))) .+ m.pos  # seq_len x batch -> d_model x num_patches x batch
function (m::PatchTST)(x)
    h = inputs(m, x)
    for b in m.blocks
        h = b(h)
    end
    m.head(reshape(m.ln(h), :, size(h, 3)))  # flatten all patches -> pred_len forecast
end

model = PatchTST(Dense(patch_size => d_model), positions(d_model, num_patches),
                 [Block(d_model, num_heads, d_ff, dropout) for _ in 1:num_layers], LayerNorm(d_model), Dense(d_model * num_patches => pred_len))

loss(model, x, y) = Flux.mse(model(x), y)
data = (Float32.({{xvar}}), Float32.({{yvar}}))  # lookback windows (seq_len x n), horizons (pred_len x n)
opt_state = Flux.setup(AdamW(1f-4), model)
loader = Flux.DataLoader(data, batchsize=32, shuffle=true)
for epoch in 1:20
    Flux.train!(loss, model, loader, opt_state)
end
'''

[[codeBranches]]
model = "crossmodal"
code = '''
using Flux

d_model     = {{d-model}}  # embedding dimension
num_heads   = {{num-heads}}  # attention heads (must divide d_model)
d_ff        = {{d-ff}}  # feed-forward dimension
num_layers  = {{num-layers}}  # text encoder blocks
dropout     = {{dropout}}  # dropout rate
seq_len     = {{seq-len}}  # text sequence length
vocab_size  = {{vocab-size}}  # vocabulary size
d_num       = {{d-num}}  # number of numerical features

struct Block  # pre-LN transformer block: self-attention and feed-forward, each with a residual
    ln1; attn; ln2; ff; drop
end
Flux.@layer Block
Block(d, h, ff, p) = Block(LayerNorm(d), MultiHeadAttention(d; nheads=h, dropout_prob=p), LayerNorm(d), Chain(Dense(d => ff, gelu), Dense(ff => d)), Dropout(p))
function (b::Block)(x; mask=nothing)
    x = x .+ b.drop(first(b.attn(b.ln1(x); mask)))
    x .+ b.drop(b.ff(b.ln2(x)))
end

{{?positions=sinusoidal}} function sinusoidal(d, T)  # fixed d x T position encodings (Vaswani et al. 2017)
{{?positions=sinusoidal}}     freq = 10000f0 .^ (-(0:2:d-1) ./ d)
{{?positions=sinusoidal}}     P = zeros(Float32, d, T)
{{?positions=sinusoidal}}     P[1:2:end, :] = sin.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P[2:2:end, :] = cos.(freq .* transpose(0:T-1))
{{?positions=sinusoidal}}     P
{{?positions=sinusoidal}} end
{{?positions=sinusoidal}} positions(d, T) = sinusoidal(d, T)  # fixed, not trained
{{?positions=learned}} positions(d, T) = Flux.glorot_uniform(d, T)  # trained position table (fixed maximum length)

struct Fusion  # text encoder plus projected numerical features (e.g. earnings calls and fundamentals)
    embed; pos; blocks; ln; num_proj; head
end
{{?positions=sinusoidal}} Flux.@layer Fusion trainable=(embed, blocks, ln, num_proj, head)  # fixed positions are not trained
{{?positions=learned}} Flux.@layer Fusion
inputs(m, x) = m.embed(x) .+ m.pos[:, 1:size(x, 1)]  # x: seq_len x batch token ids
function (m::Fusion)(x_text, x_num)
    h = inputs(m, x_text)
    for b in m.blocks
        h = b(h)
    end
    text_feat = m.ln(h)[:, 1, :]  # [CLS] summary of the text, d_model x batch
    m.head(text_feat .+ m.num_proj(x_num))  # residual fusion with the numerical features
end

model = Fusion(Embedding(vocab_size => d_model), positions(d_model, seq_len),
               [Block(d_model, num_heads, d_ff, dropout) for _ in 1:num_layers], LayerNorm(d_model),
               Dense(d_num => d_model), Dense(d_model => 1))

loss(model, x_text, x_num, y) = Flux.mse(model(x_text, x_num), y)
data = ({{xvar}}, Float32.({{xnum}}), Float32.({{yvar}}))  # token ids (seq_len x n), features (d_num x n), targets (1 x n)
opt_state = Flux.setup(AdamW(1f-4), model)
loader = Flux.DataLoader(data, batchsize=32, shuffle=true)
for epoch in 1:20
    Flux.train!(loss, model, loader, opt_state)
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fit-plot"
label = "Predictions"
desc = "Model output on the first examples: confusion matrix, loss by position, forecast or predicted vs actual"
code = '''
using Plots

sample = map(a -> collect(selectdim(a, ndims(a), 1:min(size(a, ndims(a)), 256))), data)  # first 256 examples
{{?model=encoder}} y_hat = Flux.onecold(model(sample[1]), 1:num_classes)
{{?model=encoder}} C = [count((sample[2] .== i) .& (y_hat .== j)) for i in 1:num_classes, j in 1:num_classes]
{{?model=encoder}} heatmap(C, xlabel="predicted class", ylabel="true class", title="confusion matrix")
{{?model=decoder}} logits = model(sample[1])
{{?model=decoder}} per_pos = [Flux.logitcrossentropy(logits[:, t, :], Flux.onehotbatch(sample[1][t+1, :], 1:vocab_size)) for t in 1:size(logits, 2)-1]
{{?model=decoder}} plot(per_pos, xlabel="position", ylabel="next-token cross-entropy", legend=false)
{{?model=encdec}} logits = model(sample[1], sample[2][1:end-1, :])
{{?model=encdec}} per_pos = [Flux.logitcrossentropy(logits[:, t, :], Flux.onehotbatch(sample[2][t+1, :], 1:vocab_size)) for t in 1:size(logits, 2)]
{{?model=encdec}} plot(per_pos, xlabel="target position", ylabel="cross-entropy", legend=false)
{{?model=timeseries}} plot(1:seq_len, sample[1][:, 1], label="lookback")
{{?model=timeseries}} plot!(seq_len+1:seq_len+pred_len, sample[2][:, 1], label="actual")
{{?model=timeseries}} plot!(seq_len+1:seq_len+pred_len, model(sample[1][:, 1:1])[:, 1], label="forecast", linestyle=:dash)
{{?model=crossmodal}} y_hat = model(sample[1], sample[2])
{{?model=crossmodal}} scatter(vec(sample[3]), vec(y_hat), xlabel="target", ylabel="prediction", alpha=0.5, legend=false)
{{?model=crossmodal}} plot!(identity, extrema(vec(sample[3]))..., linestyle=:dash)
'''

