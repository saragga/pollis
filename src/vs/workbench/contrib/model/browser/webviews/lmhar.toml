# Linear Models with Heteroskedasticity + AR(1) Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/lmhar.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Linear Models with Heteroskedasticity + AR(1)"
viewType = "pollis.lmhar"
defaultModel = "sequential"

[[packages]]
name = "HARE.jl"
github = "https://github.com/Trumpingtons/HARE.jl"

[requires]
packages = ["HARE.jl", "GLM.jl", "HypothesisTests.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Sequential (Two-Step)"
file = "lm-hjar/tutorial-01-seq-twostep.ipynb"
bundled = true
description = "Sequential two-step: correct AR(1) via Prais-Winsten, then correct heteroskedasticity via Harvey FGLS"

[[notebookSections.notebooks]]
name = "Sequential (Iterated)"
file = "lm-hjar/tutorial-02-seq-iterated.ipynb"
bundled = true
description = "Iterated sequential: alternate between AR(1) and heteroskedasticity corrections until convergence"

[[notebookSections.notebooks]]
name = "Joint (Two-Step)"
file = "lm-hjar/tutorial-03-joint-twostep.ipynb"
bundled = true
description = "Joint two-step: simultaneous MLE for beta, rho, and variance parameters"

[[notebookSections.notebooks]]
name = "Joint (Iterated)"
file = "lm-hjar/tutorial-04-joint-iterated.ipynb"
bundled = true
description = "Iterated joint MLE: iterates the joint estimation until full convergence"

[[wikis]]
name = "Overview"
file = "lm-hjar/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "lm-hjar/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "lm-hjar/assumptions.md"
bundled = true

[[wikis]]
name = "Sequential Method"
file = "lm-hjar/sequential.md"
bundled = true

[[wikis]]
name = "Joint Method"
file = "lm-hjar/joint.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "lm-hjar/diagnostics.md"
bundled = true

[[models]]
id = "sequential"
label = "Sequential"

[[models]]
id = "joint"
label = "Joint"

[[bullets]]
text = "Sequential"
detail = "corrects for AR(1) first (Prais-Winsten) and then for heteroskedasticity (Harvey FGLS on the transformed residuals); two-step or iterated (HARE.jl)"

[[bullets]]
text = "Joint"
detail = "estimates rho and the log-variance parameters gamma jointly by maximum likelihood with beta concentrated out, then beta by GLS; two-step or iterated (HARE.jl)"

[[inputs]]
id = "X"
label = "Covariate matrix (X)"
tooltip = "Design matrix of mean-equation regressors (T × k), without a column of ones: HARE.jl adds the intercept."
default = "X"

[[inputs]]
id = "y"
label = "Response vector (y)"
tooltip = "Column vector of the dependent variable observations (T × 1), ordered in time."
default = "y"

[[inputs]]
id = "Z"
label = "Variance regressors (Z) — optional"
tooltip = "Optional matrix of variance-driving regressors (T × q). Leave blank to use X for the variance equation. Defaults to nothing."
default = "nothing"

[[inputs]]
id = "method"
label = "Method"
tooltip = "Two-Step estimates the AR(1) and variance parameters once and then applies the corrections. Iterated repeats until beta, rho and the variance parameters converge jointly."
kind = "select"
default = "two_step"
newRow = true

[[inputs.options]]
value = "two_step"
label = "Two-Step"

[[inputs.options]]
value = "iterated"
label = "Iterated"

[[codeBranches]]
model = "sequential"
code = '''
using HARE

result = {{method}}_sequential({{X}}, {{y}}, Z={{Z}})  # sequential FGLS: AR(1) correction first, then the heteroskedasticity correction

display(coeftable(result))  # coefficient table with corrected standard errors
println(result.rho)  # estimated AR(1) coefficient rho
println(result.gamma)  # log-variance parameters gamma: log(sigma_t^2) = gamma_0 + z_t' gamma
'''

[[codeBranches]]
model = "joint"
code = '''
using HARE

result = {{method}}_joint({{X}}, {{y}}, Z={{Z}})  # joint: rho and gamma by maximum likelihood with beta concentrated out, then GLS for beta (Iterated alternates the two until convergence)

display(coeftable(result))  # coefficient table with corrected standard errors
println(result.rho)  # estimated AR(1) coefficient rho
println(result.gamma)  # log-variance parameters gamma: log(sigma_t^2) = gamma_0 + z_t' gamma
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "durbin-watson"
label = "Durbin-Watson Test"
desc = "Test for AR(1) autocorrelation in OLS residuals before applying the combined correction"
code = '''
using GLM, HypothesisTests

ols   = lm(hcat(ones(length({{y}})), {{X}}), {{y}})  # OLS baseline with the intercept HARE adds
resid = residuals(ols)  # OLS residuals
DurbinWatsonTest(modelmatrix(ols), resid)  # DW near 2 = no autocorrelation
'''

[[actionGroups.actions]]
id = "harvey-test"
label = "Harvey Test"
desc = "Likelihood-ratio test for exponential heteroskedasticity in OLS residuals"
code = '''
using HARE

harvey_test({{X}}, {{y}})  # LR test: H0 = homoskedasticity; Z defaults to X
'''

[[actionGroups.actions]]
id = "residual-plot"
label = "Residual Diagnostics"
desc = "Plot OLS residuals over time (AR(1) pattern) and squared residuals vs fitted (heteroskedasticity pattern)"
code = '''
using GLM, Plots

ols   = lm(hcat(ones(length({{y}})), {{X}}), {{y}})  # OLS baseline with the intercept HARE adds
resid = residuals(ols)  # OLS residuals
fitt  = fitted(ols)  # fitted values

p1 = plot(resid, title="Residuals over time")  # look for autocorrelation pattern
p2 = scatter(fitt, resid .^ 2, title="Squared residuals vs fitted")  # fan shape = heteroskedasticity
plot(p1, p2, layout=(2, 1))  # show both panels
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "rho-alpha"
label = "Estimated rho and gamma"
desc = "Extract the estimated AR(1) coefficient rho and the log-variance parameters gamma from the result"
code = '''
using HARE

{{?model=sequential}} result = {{method}}_sequential({{X}}, {{y}}, Z={{Z}})
{{?model=joint}} result = {{method}}_joint({{X}}, {{y}}, Z={{Z}})

println("rho = ", result.rho)  # AR(1) coefficient
println("gamma = ", result.gamma)  # log-variance parameters, intercept first
println("baseline variance = ", exp(result.gamma[1]))  # sigma_t^2 when every variance regressor is zero
'''

[[actionGroups.actions]]
id = "compare-ols"
label = "Compare with OLS"
desc = "Side-by-side comparison of OLS and FGLS coefficients and standard errors"
code = '''
using HARE, GLM

ols_fit  = lm(hcat(ones(length({{y}})), {{X}}), {{y}})  # OLS baseline with the intercept HARE adds
{{?model=sequential}} fgls_fit = {{method}}_sequential({{X}}, {{y}}, Z={{Z}})  # FGLS corrected
{{?model=joint}} fgls_fit = {{method}}_joint({{X}}, {{y}}, Z={{Z}})  # FGLS corrected

println("OLS:")
display(coeftable(ols_fit))  # OLS coefficients
println("FGLS:")
display(coeftable(fgls_fit))  # corrected coefficients
'''

[[actionGroups.actions]]
id = "predict"
label = "Predictions"
desc = "In-sample fitted values and a one-step forecast that adds rho times the last regression error"
code = '''
using HARE

{{?model=sequential}} result = {{method}}_sequential({{X}}, {{y}}, Z={{Z}})
{{?model=joint}} result = {{method}}_joint({{X}}, {{y}}, Z={{Z}})

y_hat = fitted(result)  # in-sample fitted values x_t' beta
X_new = {{X}}[end:end, :]  # regressors for the next period: replace with the known x_(T+1)
mean_part = predict(result, hcat(ones(size(X_new, 1)), X_new))  # x' beta; coef includes the intercept
y_next = mean_part[1] + result.rho * residuals(result)[end]  # one-step forecast adds rho times the last regression error
println("x' beta = ", round(mean_part[1], digits=4), ", one-step forecast = ", round(y_next, digits=4))
'''
