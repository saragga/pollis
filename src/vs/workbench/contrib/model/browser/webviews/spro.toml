[[actionGroups.actions]]
id = "bound-gap"
label = "Bound Gap"
desc = "Extensive form: sample-average lower bound over independent scenario sets against the cost of the chosen first order on fresh scenarios. SDDP: cut-based lower bound against the simulated cost with its 95% interval"
code = '''
{{?model=ts|ms}}reps = [solve_ef(sample_demand(S; seed=100 + r)).obj for r in 1:10]  # SAA optima are biased low
{{?model=ts|ms}}lb, se = mean(reps), std(reps) / sqrt(length(reps))
{{?model=ts|ms}}ups = [solve_ef(sample_demand(T == 1 ? 2000 : S; seed=200 + r); root=sol.x0).obj for r in 1:10]  # chosen first order, fresh scenarios
{{?model=ts|ms}}ub, ue = mean(ups), std(ups) / sqrt(length(ups))
{{?model=ts|ms}}(lower_bound = round(lb, digits=2), lower_se = round(se, digits=2), upper_estimate = round(ub, digits=2), upper_se = round(ue, digits=2), gap = round(ub - lb, digits=2))
{{?model=sddp}}lb, ub = SDDP.calculate_bound(sd), mean(tc)
{{?model=sddp}}hw = 1.96 * std(tc) / sqrt(length(tc))
{{?model=sddp}}(lower_bound = round(lb, digits=2), simulated_cost = round(ub, digits=2), ci = round.((ub - hw, ub + hw), digits=2), gap_percent = round(100 * (ub - lb) / abs(lb), digits=2))
'''

[[actionGroups.actions]]
id = "scenario-count"
label = "Scenario Count Study"
desc = "Optimal cost and first order as the number of sampled demand values per period grows: the sample-average approximation stabilises"
code = '''
using Plots
{{?model=ts|ms}}counts = T == 1 ? [5, 10, 20, 50, 100, 200, 500] : filter(n -> n^T <= 20_000, [2, 3, 5, 8, 12, 20])
{{?model=ts|ms}}res = [solve_ef(sample_demand(n)) for n in counts]
{{?model=ts|ms}}obj, first_order = [r.obj for r in res], [r.x0 for r in res]
{{?model=sddp}}counts = [3, 5, 10, 20, 50]
{{?model=sddp}}res = map(counts) do n
{{?model=sddp}}    m = build_sddp(sample_demand(n))
{{?model=sddp}}    SDDP.train(m; iteration_limit = min(iters, 50), print_level = 0)
{{?model=sddp}}    (SDDP.calculate_bound(m), SDDP.simulate(m, 1, [:ordered])[1][1][:ordered].out)
{{?model=sddp}}end
{{?model=sddp}}obj, first_order = first.(res), last.(res)
plot(plot(counts, obj, marker=:o, xscale=:log10, xlabel="Scenarios per period", ylabel="Expected cost", legend=false),
    plot(counts, first_order, marker=:o, xscale=:log10, xlabel="Scenarios per period", ylabel="First order", legend=false),
    layout=(1, 2), size=(900, 350))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "out-of-sample"
label = "Out-of-Sample"
desc = "Cost distribution of the decisions on fresh demand scenarios never used in the optimisation"
code = '''
using Plots
{{?model=ts|ms}}fresh = solve_ef(sample_demand(T == 1 ? 5000 : S; seed=99); root=sol.x0)  # first order fixed, recourse re-optimised
{{?model=ts|ms}}pc = path_costs(fresh)
{{?model=sddp}}fresh = sample_demand(S; seed=99)
{{?model=sddp}}scheme = SDDP.OutOfSampleMonteCarlo(sd; use_insample_transition = true) do node
{{?model=sddp}}    node == 1 ? [SDDP.Noise(nothing, 1.0)] : [SDDP.Noise(w, 1 / S) for w in fresh]
{{?model=sddp}}end
{{?model=sddp}}pc = sim_cost.(SDDP.simulate(sd, 500; sampling_scheme = scheme))
println("Mean ", round(mean(pc), digits=2), "   std ", round(std(pc), digits=2), "   95% quantile ", round(quantile(pc, 0.95), digits=2))
histogram(pc, bins=30, label=false, xlabel="Total cost on fresh scenarios", ylabel="Paths", title="Out-of-sample cost")
'''

[[actionGroups.actions]]
id = "stage-plan"
label = "Stage Plan"
desc = "Expected order, sales and stock in every period under the optimal decisions"
code = '''
{{?model=ts|ms}}[(period = t, mean_order = round(t == 0 ? sol.x0 : mean(sol.x[t]), digits=2),
{{?model=ts|ms}}  mean_sales = t == 0 ? 0.0 : round(mean(sol.y[t]), digits=2), mean_stock = t == 0 ? 0.0 : round(mean(sol.s[t]), digits=2)) for t in 0:T]
{{?model=sddp}}[(period = t - 1, mean_order = round(mean(r[t][:ordered].out for r in sims), digits=2),
{{?model=sddp}}  mean_sales = round(mean(r[t][:sales] for r in sims), digits=2), mean_stock = round(mean(r[t][:stock].out for r in sims), digits=2)) for t in 1:T+1]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "wait-and-see"
label = "Wait-and-See"
desc = "Recourse problem (RP) against the wait-and-see bound (WS, perfect information) and the expected cost of the mean-demand solution (EEV): EVPI = RP - WS, VSS = EEV - RP"
code = '''
ws = (cost - price) * T * mean(demand)  # with perfect information every period's demand is ordered exactly
{{?model=ts|ms}}rp = sol.obj
{{?model=ts|ms}}ev = solve_ef([mean(demand)])  # deterministic mean-demand problem
{{?model=ts|ms}}eev = solve_ef(; root=ev.x0).obj  # its first order under real uncertainty
{{?model=ts|ms}}(WS = round(ws, digits=2), RP = round(rp, digits=2), EEV = round(eev, digits=2), EVPI = round(rp - ws, digits=2), VSS = round(eev - rp, digits=2))
{{?model=sddp}}rp = mean(tc)  # simulated cost of the SDDP policy
{{?model=sddp}}(WS = round(ws, digits=2), RP_simulated = round(rp, digits=2), RP_lower_bound = round(SDDP.calculate_bound(sd), digits=2), EVPI = round(rp - ws, digits=2))
'''

[[actionGroups.actions]]
id = "ef-vs-sddp"
label = "Extensive Form vs SDDP"
desc = "The same problem solved exactly as one extensive-form LP and approximately by SDDP: optimal cost, first order and run time"
code = '''
t_ef = @elapsed ef = S^T <= 20_000 ? solve_ef() : nothing
t_sddp = @elapsed begin
    m = build_sddp()
    SDDP.train(m; iteration_limit = 100, print_level = 0)
end
[(method = "extensive form", cost = ef === nothing ? NaN : round(ef.obj, digits=2), first_order = ef === nothing ? NaN : round(ef.x0, digits=2), seconds = round(t_ef, digits=2)),
 (method = "SDDP (100 iterations)", cost = round(SDDP.calculate_bound(m), digits=2), first_order = round(SDDP.simulate(m, 1, [:ordered])[1][1][:ordered].out, digits=2), seconds = round(t_sddp, digits=2))]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "stock-value"
label = "Value of Initial Stock"
desc = "Optimal expected cost as a function of the stock on hand at the start, and the marginal value of one more unit"
code = '''
using Plots
s0s = collect(0:10:150)
{{?model=ts|ms}}v = [solve_ef(; s0=s).obj for s in s0s]
{{?model=sddp}}V = SDDP.ValueFunction(sd; node = 1)
{{?model=sddp}}v = [SDDP.evaluate(V, Dict(:stock => s, :ordered => 0.0))[1] for s in s0s]
plot(plot(s0s, v, marker=:o, xlabel="Initial stock", ylabel="Expected cost", legend=false),
    plot(s0s[2:end], -diff(v) ./ diff(s0s), marker=:o, xlabel="Initial stock", ylabel="Value of one more unit", legend=false),
    layout=(1, 2), size=(900, 350))
'''

[[actionGroups.actions]]
id = "critical-fractile"
label = "Critical Fractile"
desc = "Order-up-to levels of the optimal policy against the newsvendor fractiles: (p - c) / (p + h) when leftovers are wasted, (p - c) / (p - c + h) when they carry over"
code = '''
last_q = quantile(demand, (price - cost) / (price + hold))  # final period: leftover only costs holding and is lost
carry_q = quantile(demand, (price - cost) / (price - cost + hold))  # earlier periods: leftover is used next period
{{?model=ts|ms}}levels = [t == 0 ? sol.x0 : mean(sol.s[t] .+ sol.x[t]) for t in 0:T-1]  # stock after ordering
{{?model=sddp}}levels = [mean(r[t][:stock].out + r[t][:ordered].out for r in sims) for t in 1:T]
(fractile_last_period = round(last_q, digits=2), fractile_with_carry_over = round(carry_q, digits=2), order_up_to_by_period = round.(levels, digits=2))
'''
