[[bullets]]
text = "Stochastic Programming discretises uncertainty into a finite set of scenarios or cuts and optimises decisions jointly over that representation. Unlike Stochastic Dynamic Programming"
detail = "which solves the Bellman equation over a continuous state space and relies on Markovian structure — SP does not require the problem to be Markovian and can handle arbitrary scenario-dependent recourse."

[[bullets]]
text = "Stochastic Dual Dynamic Programming (SDDP) bridges the two: it handles many-stage SPs via Benders cuts, but assumes stagewise independence"
detail = "a Markovian condition — to make the backward pass tractable. For problems with continuous state spaces and Markovian transitions, Stochastic Dynamic Programming in the Dynamic Optimisation menu is the natural alternative."

[[decisionRows]]
task = "Two-Stage"
context = "Decide now, observe uncertainty once, then take a recourse action (newsvendor ordering, capacity sizing, unit commitment)"
purpose = "Order before demand is known, sell after it is revealed; solved as one extensive-form LP over S sampled demand scenarios, with EVPI and VSS"

[[decisionRows]]
task = "Multistage"
context = "Decisions and observations alternate over several periods and each decision may use only what has been observed (non-anticipativity)"
purpose = "The same inventory problem over T periods on a scenario tree with S branches per period (S^T paths), solved exactly as one extensive-form LP"

[[decisionRows]]
task = "SDDP"
context = "Many stages or large trees where the extensive form explodes, with stagewise-independent uncertainty and convex costs"
purpose = "Stochastic dual dynamic programming (SDDP.jl): forward simulations and backward passes build Benders cuts of each stage's cost-to-go, giving a policy and a lower bound"

[[inputs]]
id = "S"
label = "Scenarios per Stage (S)"
tooltip = "Number of equally likely demand values sampled from Uniform(50, 150) for each period. The multistage tree has S^T paths, so keep S^T below about 10000."
default = "20"

[[inputs]]
id = "T"
label = "Periods (T)"
tooltip = "Number of demand periods. The two-stage model always has one. The multistage extensive form grows as S^T; SDDP grows only linearly in T."
default = "3"
models = ["ms", "sddp"]

[[inputs]]
id = "iter"
label = "SDDP Iterations"
tooltip = "Iteration limit of SDDP training. Each iteration runs one forward simulation and one backward pass that adds a Benders cut per stage."
default = "100"
models = ["sddp"]

