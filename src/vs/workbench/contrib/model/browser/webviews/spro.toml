id = "cost-distribution"
label = "Cost Distribution"
desc = "Distribution of total cost across scenario paths (extensive form) or simulated paths (SDDP), with its mean"
code = '''
using Plots
{{?model=ts|ms}}pc = path_costs(sol)
{{?model=sddp}}pc = sim_cost.(sims)
histogram(pc, bins=30, label=false, xlabel="Total cost", ylabel="Paths", title="Cost distribution (" * string(length(pc)) * " paths)")
vline!([mean(pc)], lw=2, label="mean")
'''

[[actionGroups.actions]]
id = "decision-paths"
label = "Decision Paths"
desc = "Two-stage: sales and leftover stock against demand in each scenario. Multistage and SDDP: orders and stock along 30 scenario paths"
code = '''
using Plots
{{?model=ts}}scatter(sol.dem, sol.y[1], label="sales", xlabel="Demand", ylabel="Units", title="Recourse per scenario")
{{?model=ts}}scatter!(sol.dem, sol.s[1], label="leftover")
{{?model=ts}}hline!([sol.x0], lw=2, label="order")
{{?model=ms}}leaves = rand(MersenneTwister(3), 1:S^T, min(30, S^T))
{{?model=ms}}anc(k, t) = div(k - 1, S^(T - t)) + 1
{{?model=ms}}orders = [t == 0 ? sol.x0 : sol.x[t][anc(k, t)] for t in 0:T-1, k in leaves]
{{?model=ms}}stock = [sol.s[t][anc(k, t)] for t in 1:T, k in leaves]
{{?model=sddp}}orders = [r[t][:ordered].out for t in 1:T, r in sims[1:30]]
{{?model=sddp}}stock = [r[t][:stock].out for t in 2:T+1, r in sims[1:30]]
{{?model=ms|sddp}}plot(plot(0:T-1, orders, label=false, alpha=0.5, marker=:o, xlabel="Period", ylabel="Order", title="Orders"),
{{?model=ms|sddp}}    plot(1:T, stock, label=false, alpha=0.5, marker=:o, xlabel="Period", ylabel="Stock after sales", title="Stock"),
{{?model=ms|sddp}}    layout=(1, 2), size=(900, 350))
'''

