[[codeBranches]]
model = "sddp"
code = '''
using JuMP, HiGHS, SDDP, Random, Statistics

S = {{S}}  # equally likely demand values per period
price, cost, hold = 5.0, 2.0, 0.5  # sale price, unit order cost, holding cost per unit carried
sample_demand(n; seed=1) = 50 .+ 100 .* rand(MersenneTwister(seed), n)  # Uniform(50, 150) demand
demand = sample_demand(S)
T = {{T}}  # demand periods
iters = {{iter}}  # SDDP iterations

# Extensive form on the scenario tree: node k of period t has parent div(k - 1, S) + 1 and demand dem[mod1(k, S)]
function solve_ef(dem=demand; T=T, s0=0.0, root=nothing)
    S = length(dem)
    m = Model(HiGHS.Optimizer); set_silent(m)
    @variable(m, x0 >= 0)  # order placed before any demand is seen
    root === nothing || fix(x0, root; force=true)
    x = [@variable(m, [1:S^t], lower_bound = 0) for t in 1:T]  # order after period-t demand
    y = [@variable(m, [1:S^t], lower_bound = 0) for t in 1:T]  # sales
    s = [@variable(m, [1:S^t], lower_bound = 0) for t in 1:T]  # stock carried after sales
    set_upper_bound.(x[T], 0.0)  # nothing to order after the last period
    for t in 1:T, k in 1:S^t
        p = div(k - 1, S) + 1
        inflow = t == 1 ? s0 + x0 : s[t-1][p] + x[t-1][p]
        @constraint(m, y[t][k] <= dem[mod1(k, S)])
        @constraint(m, s[t][k] == inflow - y[t][k])
    end
    @objective(m, Min, cost * x0 + sum(sum(cost .* x[t] .- price .* y[t] .+ hold .* s[t]) / S^t for t in 1:T))
    optimize!(m)
    (obj = objective_value(m), x0 = value(x0), x = [value.(v) for v in x], y = [value.(v) for v in y], s = [value.(v) for v in s], dem = dem)
end

function path_costs(sol)  # total cost along every root-to-leaf path
    S, T = length(sol.dem), length(sol.x)
    [cost * sol.x0 + sum(begin
        a = div(k - 1, S^(T - t)) + 1  # ancestor of leaf k in period t
        cost * sol.x[t][a] - price * sol.y[t][a] + hold * sol.s[t][a]
    end for t in 1:T) for k in 1:S^T]
end

# SDDP on the same problem: stage 1 only orders, stages 2 .. T+1 observe demand, sell and reorder
function build_sddp(dem=demand; T=T, s0=0.0)
    SDDP.LinearPolicyGraph(stages = T + 1, sense = :Min, lower_bound = -price * T * maximum(dem), optimizer = HiGHS.Optimizer) do sp, t
        @variable(sp, stock >= 0, SDDP.State, initial_value = s0)
        @variable(sp, ordered >= 0, SDDP.State, initial_value = 0.0)
        @variable(sp, sales >= 0)
        @variable(sp, d)
        t == T + 1 && set_upper_bound(ordered.out, 0.0)
        @constraint(sp, sales <= d)
        @constraint(sp, stock.out == stock.in + ordered.in - sales)
        @stageobjective(sp, cost * ordered.out - price * sales + (t > 1 ? hold : 0.0) * stock.out)
        if t == 1
            fix(d, 0.0)
        else
            SDDP.parameterize(w -> fix(d, w), sp, dem)
        end
    end
end
sim_cost(r) = sum(st[:stage_objective] for st in r)  # total cost of one SDDP simulation
sd = build_sddp()
SDDP.train(sd; iteration_limit = iters, print_level = 0)
sims = SDDP.simulate(sd, 500, [:stock, :ordered, :sales])  # in-sample policy simulations
tc = sim_cost.(sims)
(first_order = round(sims[1][1][:ordered].out, digits=2), lower_bound = round(SDDP.calculate_bound(sd), digits=2),
 simulated_cost = round(mean(tc), digits=2), ci_halfwidth = round(1.96 * std(tc) / sqrt(length(tc)), digits=2))
'''

