[[codeBranches]]
model = "pca"
code = '''
using MultivariateStats, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
k  = {{k}}  # number of components or factors
mu = mean(X, dims=1)
{{?scaling=standardise}} sd = std(X, dims=1)
{{?scaling=standardise}} prep(A) = permutedims((A .- mu) ./ sd)  # standardise with training statistics, transpose to p x n
{{?scaling=centre}} prep(A) = permutedims(A .- mu)  # centre with the training mean, transpose to p x n
Xt = prep(X)

fit_model(k) = fit(PCA, Xt; maxoutdim=k)
M = fit_model(k)
Y = permutedims(predict(M, Xt))  # n x k component scores
W = projection(M)  # p x k orthonormal directions (loadings(M) scales them by the component sd)

X_hat = permutedims(reconstruct(M, predict(M, Xt)))  # n x p reconstruction in the prepared scale
explained = principalvars(M) ./ var(M)  # share of total variance per component
explained
'''

[[codeBranches]]
model = "kpca"
code = '''
using MultivariateStats, Statistics, LinearAlgebra

X  = {{X}}  # n x p feature matrix, one row per observation
k  = {{k}}  # number of components or factors
mu = mean(X, dims=1)
{{?scaling=standardise}} sd = std(X, dims=1)
{{?scaling=standardise}} prep(A) = permutedims((A .- mu) ./ sd)  # standardise with training statistics, transpose to p x n
{{?scaling=centre}} prep(A) = permutedims(A .- mu)  # centre with the training mean, transpose to p x n
Xt = prep(X)

gamma  = {{gamma}}  # RBF bandwidth
kernel = (x, y) -> exp(-gamma * norm(x - y)^2)

fit_model(k) = fit(KernelPCA, Xt; kernel=kernel, maxoutdim=k, inverse=true)  # inverse=true learns a pre-image map
M = fit_model(k)
Y = permutedims(predict(M, Xt))  # n x k component scores

X_hat = permutedims(reconstruct(M, predict(M, Xt)))  # approximate pre-images
explained = eigvals(M) ./ sum(eigvals(fit(KernelPCA, Xt; kernel=kernel, maxoutdim=size(Xt, 2))))  # share of kernel variance
explained
'''

[[codeBranches]]
model = "fa"
code = '''
using MultivariateStats, Statistics

X  = {{X}}  # n x p feature matrix, one row per observation
k  = {{k}}  # number of components or factors
mu = mean(X, dims=1)
{{?scaling=standardise}} sd = std(X, dims=1)
{{?scaling=standardise}} prep(A) = permutedims((A .- mu) ./ sd)  # standardise with training statistics, transpose to p x n
{{?scaling=centre}} prep(A) = permutedims(A .- mu)  # centre with the training mean, transpose to p x n
Xt = prep(X)

fit_model(k) = fit(FactorAnalysis, Xt; maxoutdim=k, method=:cm)  # fast conditional-maximisation algorithm (:em is plain EM)
M = fit_model(k)
Y = permutedims(predict(M, Xt))  # n x k factor scores
W = loadings(M)  # p x k loading matrix
psi = var(M)  # unique (noise) variance of each variable

X_hat = permutedims(W * predict(M, Xt) .+ mean(M))  # common-factor part of each observation
explained = vec(sum(abs2, W, dims=1)) ./ sum(var(Xt, dims=2))  # share of total variance per factor
communality = vec(sum(abs2, W, dims=2))  # variance of each variable explained by the factors
explained
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "scores"
label = "Score Scatter"
desc = "Observations on the first two components or factors (colour them by a group vector if you have one)"
code = '''
using Plots

scatter(Y[:, 1], Y[:, 2], xlabel="component 1", ylabel="component 2", markersize=3, alpha=0.7, legend=false)
'''

[[actionGroups.actions]]
id = "scree"
label = "Scree Plot"
desc = "Share of variance per component with the cumulative share"
code = '''
using Plots

bar(explained, xlabel="component", ylabel="share of variance", label="per component")
plot!(cumsum(explained), marker=:circle, label="cumulative")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "reconstruction-error"
label = "Reconstruction Error"
desc = "Per-observation squared error of rebuilding the data from k dimensions; the largest are hard-to-represent observations"
code = '''
using Plots

errs = vec(mean(abs2, permutedims(Xt) .- X_hat, dims=2))  # per-observation MSE in the prepared scale
histogram(errs, bins=30, xlabel="reconstruction MSE", ylabel="observations", legend=false)
partialsortperm(errs, 1:min(5, length(errs)), rev=true)  # the five hardest observations
'''

[[actionGroups.actions]]
id = "choose-k"
label = "Choosing k"
desc = "Refit for k = 1 to 10 and plot the mean reconstruction error: pick k where it stops falling quickly"
code = '''
using Plots

ks = 1:min(10, size(Xt, 1))
mse = map(ks) do kk
    Mk = fit_model(kk)
{{?model!=fa}}     R  = reconstruct(Mk, predict(Mk, Xt))
{{?model=fa}}     R  = loadings(Mk) * predict(Mk, Xt) .+ mean(Mk)
    mean(abs2, Xt .- R)
end
plot(ks, mse, marker=:circle, xlabel="k", ylabel="mean reconstruction MSE", legend=false)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "project-new"
label = "Project New Data"
desc = "Scores of new observations, using the training scaling and the fitted model"
code = '''
Y_new = permutedims(predict(M, prep(X_new)))  # X_new: same columns as X; returns n_new x k
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-other"
label = "vs PCA or Factor Analysis"
desc = "Absolute correlations between these scores and those of PCA (Factor Analysis for PCA itself): values near 1 mean the same directions"
code = '''
{{?model!=pca}} other = permutedims(predict(fit(PCA, Xt; maxoutdim=k), Xt))
{{?model=pca}} other = permutedims(predict(fit(FactorAnalysis, Xt; maxoutdim=k), Xt))
abs.(cor(Y, other))  # rows = these components, columns = the other method's
'''

[[actionGroups.actions]]
id = "neighbours"
label = "Neighbour Preservation"
desc = "Share of each observation's 10 nearest neighbours that stay neighbours in the embedding, against a random projection"
code = '''
using LinearAlgebra, Random

function knn_sets(A, m=10)  # rows are observations
    G = A * permutedims(A)
    D = diag(G) .+ permutedims(diag(G)) .- 2 .* G  # squared distances
    [Set(sortperm(D[i, :])[2:m+1]) for i in axes(A, 1)]
end
kept(A) = mean(length(intersect(a, b)) / 10 for (a, b) in zip(knn_sets(permutedims(Xt)), knn_sets(A)))
(model = kept(Y), random = kept(permutedims(Xt) * randn(size(Xt, 1), k)))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "loading-matrix"
label = "Loading Matrix"
desc = "Heatmap of how each feature relates to each component (loadings for PCA and Factor Analysis, correlations for Kernel PCA)"
code = '''
using Plots

{{?model!=kpca}} L = W  # p x k loadings
{{?model=kpca}} L = cor(permutedims(Xt), Y)  # p x k feature-score correlations (no explicit loadings in kernel space)
heatmap(1:size(L, 2), 1:size(L, 1), L, xlabel="component", ylabel="feature", color=:balance, clims=(-maximum(abs, L), maximum(abs, L)))
'''

[[actionGroups.actions]]
id = "biplot"
label = "Biplot"
desc = "Score scatter overlaid with scaled feature arrows in the first two dimensions"
code = '''
using Plots

{{?model!=kpca}} A = W[:, 1:2]
{{?model=kpca}} A = cor(permutedims(Xt), Y[:, 1:2])
A = A .* (maximum(abs, Y[:, 1:2]) / maximum(abs, A))  # scale arrows to the score range
scatter(Y[:, 1], Y[:, 2], alpha=0.5, markersize=3, xlabel="component 1", ylabel="component 2", legend=false)
for i in axes(A, 1)
    plot!([0, A[i, 1]], [0, A[i, 2]], arrow=true, color=:red)
    annotate!(A[i, 1], A[i, 2], text(string(i), 8))
end
plot!()
'''
