[[models]]
id = "pca"
label = "PCA"

[[models]]
id = "kpca"
label = "Kernel PCA"

[[models]]
id = "fa"
label = "Factor Analysis"

[[bullets]]
text = "PCA"
detail = "projects data onto orthogonal axes of maximum variance via eigendecomposition of the covariance matrix (MultivariateStats.jl)"

[[bullets]]
text = "Kernel PCA"
detail = "extends PCA to nonlinear structure using a kernel function; applies classical PCA in the implicit feature space (MultivariateStats.jl)"

[[bullets]]
text = "Factor Analysis"
detail = "decomposes observed variables into latent factors plus independent noise; models Cov(x) = WWT + Psi (MultivariateStats.jl)"

[[decisionRows]]
task = "PCA"
context = "Linear structure; compression, visualisation, decorrelation"
purpose = "Orthogonal directions of maximum variance"

[[decisionRows]]
task = "Kernel PCA"
context = "Nonlinear structure such as curves, rings or manifolds"
purpose = "PCA in the feature space implied by an RBF kernel"

[[decisionRows]]
task = "Factor Analysis"
context = "Observed variables driven by a few latent causes plus noise"
purpose = "Shared variance through loadings; each variable keeps its own noise variance"

[[inputs]]
id = "X"
label = "Feature Matrix"
tooltip = "n_samples × n_features matrix, one row per observation. MultivariateStats.jl works with features × samples, so the code transposes it."
default = "X_train"

[[inputs]]
id = "k"
label = "Output Dimensions"
tooltip = "Number of components or factors to extract. Use 2 or 3 for visualisation; the Choosing k action compares more."
default = "2"
newRow = true

[[inputs]]
id = "scaling"
label = "Scaling"
tooltip = "Standardise when features are on different scales, otherwise large-variance features dominate the components. The training mean and standard deviation are reused for new data."
kind = "select"
default = "standardise"

[[inputs.options]]
value = "standardise"
label = "Standardise"

[[inputs.options]]
value = "centre"
label = "Centre Only"

[[inputs]]
id = "gamma"
label = "gamma (RBF bandwidth)"
tooltip = "Bandwidth of the RBF kernel k(x, y) = exp(-gamma ||x - y||^2). Larger gamma = narrower kernel = more local structure. A common start is 1 / n_features."
default = "1.0"
models = ["kpca"]

