# Latent Component Analysis Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/lca.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Latent Component Analysis"
viewType = "pollis.lca"
defaultModel = "pca"

[[packages]]
name = "MultivariateStats.jl"
github = "https://github.com/JuliaStats/MultivariateStats.jl"

[requires]
packages = ["Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "PCA"
file = "dim-reduction-lca/tutorial-01-pca.ipynb"
bundled = true
description = "Principal Component Analysis — eigendecomposition, scree plot, and score visualisation"

[[notebookSections.notebooks]]
name = "Kernel PCA"
file = "dim-reduction-lca/tutorial-02-kpca.ipynb"
bundled = true
description = "Kernel PCA with RBF kernel — centred Gram matrix, nonlinear embedding, and bandwidth selection"

[[notebookSections.notebooks]]
name = "Factor Analysis"
file = "dim-reduction-lca/tutorial-03-fa.ipynb"
bundled = true
description = "Factor Analysis — EM estimation of loadings and uniquenesses, scree and loading heatmap"

