code = '''
using NLopt

x0 = ({{lb}} .+ {{ub}}) ./ 2  # midpoint start

opt_crs = Opt(:GN_CRS2_LM, {{n}}); opt_crs.lower_bounds = {{lb}}; opt_crs.upper_bounds = {{ub}}  # CRS
opt_crs.min_objective = obj; opt_crs.maxeval = {{budget}}  # 
(f_crs, x_crs, _) = optimize(opt_crs, x0)  # run CRS

opt_mlsl = Opt(:GN_MLSL_LDS, {{n}}); opt_mlsl.lower_bounds = {{lb}}; opt_mlsl.upper_bounds = {{ub}}  # MLSL
opt_mlsl.min_objective = obj; opt_mlsl.maxeval = {{budget}}  # 
(f_mlsl, x_mlsl, _) = optimize(opt_mlsl, x0)  # run MLSL

println("CRS  f*: ", f_crs,  "  x*: ", x_crs)  # CRS result
println("MLSL f*: ", f_mlsl, "  x*: ", x_mlsl)  # MLSL result
'''

[[actionGroups.actions]]
id = "nlopt-vs-sa"
label = "NLopt vs SA"
desc = "Compare CRS (NLopt) with SAMIN (Optim.jl)"
code = '''
using NLopt, Optim

lb, ub = {{lb}}, {{ub}}  # bounds

function obj_nl(x, grad); return obj(x); end  # NLopt-signature wrapper
opt = Opt(:GN_CRS2_LM, {{n}}); opt.lower_bounds = lb; opt.upper_bounds = ub  # CRS setup
opt.min_objective = obj_nl; opt.maxeval = {{budget}}  # 
(f_nl, x_nl, _) = optimize(opt, (lb .+ ub) ./ 2)  # run NLopt CRS

res_sa = optimize(obj, lb, ub, (lb .+ ub) ./ 2, SAMIN(rt=0.9), Optim.Options(iterations={{budget}}))  # run SA

println("CRS  f*: ", f_nl,          "  x*: ", x_nl)  # NLopt CRS result
println("SA   f*: ", res_sa.minimum, "  x*: ", res_sa.minimizer)  # SA result
'''

