[[inputs]]
id = "obj"
label = "Objective function body"
tooltip = "Julia expression(s) for the objective function body. Must end with a return statement. Example: return x[1]^2 + x[2]^2"
default = "return x[1]^2 + x[2]^2"

[[inputs]]
id = "lb"
label = "Lower bounds (lb)"
tooltip = "Julia vector of lower bounds, one per dimension. Example: [-2.0, -2.0]"
default = "[-2.0, -2.0]"

[[inputs]]
id = "ub"
label = "Upper bounds (ub)"
tooltip = "Julia vector of upper bounds, one per dimension. Example: [2.0, 2.0]"
default = "[2.0, 2.0]"

[[inputs]]
id = "n"
label = "Dimension (n)"
tooltip = "Number of decision variables (length of x)."
default = "2"

[[inputs]]
id = "budget"
label = "Budget"
tooltip = "For NLopt methods: maximum number of objective function evaluations (maxeval). For SA: number of iterations passed to Optim.Options."
default = "1000"

[[codeBranches]]
model = "crs"
code = '''
using NLopt

function obj(x::Vector{Float64}, grad::Vector{Float64})
    {{obj}}  # objective body
end

lb  = {{lb}}  # lower bounds (length {{n}})
ub  = {{ub}}  # upper bounds (length {{n}})
x0  = (lb .+ ub) ./ 2  # midpoint starting point

opt = Opt(:GN_CRS2_LM, {{n}})  # CRS: controlled random search with LM
opt.lower_bounds = lb  # box constraint lower
opt.upper_bounds = ub  # box constraint upper
opt.min_objective = obj  # minimise the objective
opt.maxeval = {{budget}}  # budget: stop after this many evaluations

(minf, minx, ret) = optimize(opt, x0)  # run stochastic global search

println("min val: ", minf)  # best objective value found
println("min x:   ", minx)  # best point found
println("return:  ", ret)  # :MAXEVAL_REACHED is expected and normal
'''

