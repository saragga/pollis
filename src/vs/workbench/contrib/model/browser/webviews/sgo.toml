[[codeBranches]]
model = "bh"
code = '''
using Optim, Basinhopping

function obj(x::Vector{Float64})
    {{obj}}  # objective body
end

lb  = {{lb}}  # lower bounds
ub  = {{ub}}  # upper bounds
x0  = (lb .+ ub) ./ 2  # midpoint starting point

local_opt = x -> optimize(obj, lb, ub, x, Fminbox(LBFGS()))  # bounded local solver

result = basinhopping(local_opt, x0, BasinhoppingParams(niter={{budget}}))  # basin-hopping global search

println("min val: ", result.minimum)  # best objective value found
println("min x:   ", result.minimizer)  # best point found
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "landscape"
label = "Objective Landscape"
desc = "Evaluate f on a 2-D grid and plot a heatmap"
code = '''
using Plots

lb, ub = {{lb}}, {{ub}}  # bounds (2-D example)
xs = range(lb[1], ub[1]; length=80)  # x1 grid
ys = range(lb[2], ub[2]; length=80)  # x2 grid
Z  = [obj([x, y]) for y in ys, x in xs]  # evaluate on grid

heatmap(xs, ys, Z, xlabel="x1", ylabel="x2", title="Objective landscape")  # darker = lower value
'''

[[actionGroups.actions]]
id = "convergence"
label = "Convergence Curve"
desc = "Best objective value found vs evaluations"
code = '''
using NLopt, Plots

history = Float64[]  # track best value per eval
best_so_far = Inf  # running minimum

function obj_tracked(x, grad)
    v = obj(x, grad)  # call original objective
    global best_so_far = min(best_so_far, v)  # update running min
    push!(history, best_so_far)  # record
    return v  # 
end

opt = Opt(:GN_CRS2_LM, {{n}}); opt.lower_bounds = {{lb}}; opt.upper_bounds = {{ub}}  # CRS setup
opt.min_objective = obj_tracked; opt.maxeval = {{budget}}  # tracked objective
optimize(opt, (({{lb}} .+ {{ub}}) ./ 2))  # run

plot(history, xlabel="evaluations", ylabel="best f", legend=false)  # convergence curve
'''

[[actionGroups.actions]]
id = "search-scatter"
label = "Search Points"
desc = "Scatter plot of all evaluated points (2-D)"
code = '''
using NLopt, Plots

pts = Vector{Vector{Float64}}()  # record evaluated points
function obj_pts(x, grad)
    push!(pts, copy(x))  # store point
    return obj(x, grad)  # 
end

opt = Opt(:GN_CRS2_LM, {{n}}); opt.lower_bounds = {{lb}}; opt.upper_bounds = {{ub}}  # CRS setup
opt.min_objective = obj_pts; opt.maxeval = {{budget}}  # 
optimize(opt, (({{lb}} .+ {{ub}}) ./ 2))  # run

xs_pts = getindex.(pts, 1); ys_pts = getindex.(pts, 2)  # extract coordinates
scatter(xs_pts, ys_pts, ms=2, alpha=0.5, xlabel="x1", ylabel="x2", legend=false)  # all evaluated points
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "eval-budget"
label = "Evaluation Budget"
desc = "Check evals used vs budget and return code"
code = '''
using NLopt

evals_used = 0  # count evaluations
function obj_count(x, grad)
    global evals_used += 1  # increment counter
    return obj(x, grad)  # 
end

(minf, minx, ret) = optimize(opt, x0)  # run (reuse opt with obj_count)

println("Budget:    ", {{budget}})  # configured budget
println("Used:      ", evals_used)  # actual evaluations
println("Return:    ", ret)  # :MAXEVAL_REACHED means budget exhausted
println("Remaining: ", {{budget}} - evals_used)  # unused budget
'''

[[actionGroups.actions]]
id = "boundary-check"
label = "Boundary Check"
desc = "Check whether bounds are active at the solution"
code = '''
lb, ub = {{lb}}, {{ub}}  # bounds
tol = 1e-6  # tolerance for active bound detection

for i in 1:{{n}}
    at_lb = abs(minx[i] - lb[i]) < tol  # active lower
    at_ub = abs(minx[i] - ub[i]) < tol  # active upper
    println("x[", i, "] = ", minx[i], at_lb ? " (at lb)" : at_ub ? " (at ub)" : " (interior)")  # bound status
end
'''

[[actionGroups.actions]]
id = "restart-study"
label = "Restart Study"
desc = "Run multiple times to check robustness"
code = '''
using NLopt, Random

Random.seed!(0)  # reproducibility
lb, ub = {{lb}}, {{ub}}  # bounds

for trial in 1:5
    x0_t = lb .+ (rand({{n}}) .* (ub .- lb))  # random starting point
    opt_t = Opt(:GN_CRS2_LM, {{n}}); opt_t.lower_bounds = lb; opt_t.upper_bounds = ub  # fresh opt
    opt_t.min_objective = obj; opt_t.maxeval = {{budget}}  # 
    (f_t, x_t, _) = optimize(opt_t, x0_t)  # run
    println("trial ", trial, ": f* = ", round(f_t; digits=6), "  x* = ", x_t)  # result
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "solution"
label = "Solution"
desc = "Print x*, f*, and return code with context"
code = '''
println("=== Global Optimum ===")  # 
for i in 1:{{n}}
    println("x[", i, "] = ", result.minimizer[i])  # decision variable
end
println("f* = ", result.minimum)  # optimal objective value
'''

[[actionGroups.actions]]
id = "local-refine"
label = "Local Refinement"
desc = "Polish the global solution with a local method"
code = '''
using NLopt

opt_local = Opt(:LN_COBYLA, {{n}})  # local derivative-free polishing
opt_local.lower_bounds = {{lb}}  # same bounds
opt_local.upper_bounds = {{ub}}  # 
opt_local.min_objective = obj_nlopt  # NLopt-signature objective
opt_local.xtol_rel = 1e-8  # tight local tolerance

x_start = result.minimizer  # starting point from global search result
(minf2, minx2, ret2) = optimize(opt_local, x_start)  # warm-start from global solution

println("Refined f*: ", minf2, "  x*: ", minx2)  # polished result
'''

[[actionGroups.actions]]
id = "multistart"
label = "Multistart"
desc = "Run from multiple starting points and keep best"
code = '''
using NLopt

best_f = Inf; best_x = zeros({{n}})  # track global best
for _ in 1:5
    x0_ms = {{lb}} .+ (rand({{n}}) .* ({{ub}} .- {{lb}}))  # uniform random start
    opt_ms = Opt(:GN_CRS2_LM, {{n}})  # CRS global search
    opt_ms.lower_bounds = {{lb}}; opt_ms.upper_bounds = {{ub}}  # 
    opt_ms.min_objective = obj; opt_ms.maxeval = {{budget}}  # 
    (f_ms, x_ms, _) = optimize(opt_ms, x0_ms)  # 
    if f_ms < best_f; best_f = f_ms; best_x = x_ms; end  # keep best
end
println("Best f*: ", best_f, "  x*: ", best_x)  # multistart result
'''

