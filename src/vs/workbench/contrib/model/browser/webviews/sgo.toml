# Stochastic Global Methods Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/sgo.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Stochastic Global Methods"
viewType = "pollis.sgo"
defaultModel = "crs"

[[packages]]
