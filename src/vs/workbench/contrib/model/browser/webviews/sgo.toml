[[actionGroups.actions]]
id = "sensitivity"
label = "Solution Sensitivity"
desc = "Perturb x* to verify it is a local minimum"
code = '''
x_opt = result.minimizer  # optimal point
f_opt = result.minimum  # optimal value
delta = 1e-3  # perturbation size

for i in 1:{{n}}
    x_p = copy(x_opt); x_p[i] += delta  # perturb up
    x_m = copy(x_opt); x_m[i] -= delta  # perturb down
    f_p = obj(x_p)  # evaluate perturbed points
    f_m = obj(x_m)  # 
    println("x[", i, "]: f+delta=", f_p, "  f-delta=", f_m, "  f*=", f_opt)  # 
end
println("(f* should be <= both f+delta and f-delta)")  # local optimality check
'''

[[actionGroups.actions]]
id = "bounds-analysis"
label = "Bounds Analysis"
desc = "Relative position of x* within the search box"
