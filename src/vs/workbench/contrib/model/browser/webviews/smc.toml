[[models]]
id = "filter"
label = "Particle Filter"

[[models]]
id = "smoother"
label = "Particle Smoother"

[[bullets]]
text = "Question"
detail = "how closely does a bootstrap particle filter recover the filtering distribution, the likelihood and the smoothing distribution? The model is linear-Gaussian, so the Kalman filter and smoother give the exact answers to compare against"

[[bullets]]
text = "Particle Filter"
detail = "propagate N particles through the dynamics, weight them by p(y | x), and resample when the ESS falls below threshold x N; the product of the mean incremental weights estimates p(y[1:T]) without bias"

[[bullets]]
text = "Particle Smoother"
detail = "forward filtering, backward simulation: draw M trajectories backwards through the stored particles, reweighted by the transition density; this avoids the path degeneracy of the genealogy stored by the filter"

[[inputs]]
id = "a"
label = "State Coefficient a"
tooltip = "x[t + 1] = a x[t] + w[t]. |a| < 1 gives a stationary state; a = 1 is a random walk."
default = "0.9"

[[inputs]]
id = "c"
label = "Observation Coefficient c"
tooltip = "y[t] = c x[t] + e[t]."
default = "1.2"

[[inputs]]
id = "q"
label = "State Noise Variance q"
tooltip = "Variance of the state noise w[t]. The bootstrap filter proposes from the dynamics, so a small q relative to r makes proposals and observations agree and keeps the ESS high."
default = "0.6"

[[inputs]]
id = "r"
label = "Observation Noise Variance r"
tooltip = "Variance of the observation noise e[t]. A small r makes the likelihood sharp, the weights uneven and the ESS low: the weak spot of the bootstrap filter."
default = "1.5"

[[inputs]]
id = "m0"
label = "Initial Mean m0"
tooltip = "Mean of the initial state x[1] ~ N(m0, v0)."
default = "1.0"

[[inputs]]
id = "v0"
label = "Initial Variance v0"
tooltip = "Variance of the initial state x[1] ~ N(m0, v0)."
default = "2.0"

[[inputs]]
id = "n"
label = "Particles (N)"
tooltip = "Number of particles. The sd of the log-likelihood estimate falls like 1 / sqrt(N); the cost grows linearly."
default = "1000"

[[inputs]]
id = "t"
label = "Steps (T)"
tooltip = "Number of time steps simulated from the model and then filtered."
default = "50"

[[inputs]]
id = "threshold"
label = "Resampling Threshold"
tooltip = "Resample when ESS < threshold x N, with ESS = 1 / sum(w^2) for normalised weights w. 0 never resamples (sequential importance sampling), 1 resamples every step. LowLevelParticleFilters defaults to 0.1; 0.5 is common."
default = "0.5"

[[inputs]]
id = "m"
label = "Smoother Trajectories (M)"
tooltip = "Number of trajectories drawn by forward filtering, backward simulation (at most N). The cost is about M x N x T transition-density evaluations."
default = "100"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Seeds the filter RNG (simulation, propagation, backward simulation) and the global RNG (resampling). The same seed and inputs give the same run."
default = "1"

[[codeBranches]]
model = "filter"
code = '''
using LowLevelParticleFilters, Distributions, StaticArrays, LinearAlgebra, Random, Statistics

# Linear-Gaussian model, so the Kalman filter gives the exact answer to check against:
#   x[1] ~ N(m0, v0),   x[t + 1] = a x[t] + w[t],   y[t] = c x[t] + e[t],   w ~ N(0, q),   e ~ N(0, r)
a, c, q, r = {{a}}, {{c}}, {{q}}, {{r}}
A, B, C = SA[a;;], SA[0.0;;], SA[c;;]  # B = 0: the model has no input
dynamics(x, u, p, t)    = A * x
measurement(x, u, p, t) = C * x
df = MvNormal(zeros(1), [q;;])  # state noise
dg = MvNormal(zeros(1), [r;;])  # observation noise
d0 = MvNormal([{{m0}}], [{{v0}};;])  # initial state x[1]

N, T, seed, threshold = {{n}}, {{t}}, {{seed}}, {{threshold}}
Random.seed!(seed)  # resampling draws from the global RNG; the filter rng drives the rest
make_pf(N; threshold = threshold, rng = Xoshiro(seed)) =
    ParticleFilter(N, dynamics, measurement, df, dg, d0; resample_threshold = threshold, rng)
pf = make_pf(N)  # bootstrap filter: propose from the dynamics, weight by p(y | x)
kf = KalmanFilter(A, B, C, 0, cov(df), cov(dg), d0)  # exact filter for the same model

u = fill(SA[0.0], T)
xs, _, ys = simulate(pf, u; sample_initial = true)  # true states and observations
x_true = first.(xs)
y = [SVector{1}(yt) for yt in ys]

llp, anc = Float64[], Vector{Int}[]  # per-step log p(y[t] | y[1:t-1]); ancestor indices at each prediction
sol = forward_trajectory(pf, u, y;
    post_correct_cb = (f, ut, yt, p, t, lli) -> push!(llp, lli),
    post_predict_cb = (f, ut, yt, p, t) -> push!(anc, copy(f.state.j)))
llk  = Float64[]
ksol = forward_trajectory(kf, u, y; post_correct_cb = (f, p, ret) -> push!(llk, ret.ll))

X, W = first.(sol.x), sol.we  # N x T particles and normalised weights of x(t|t), before resampling
ess  = [effective_particles(W[:, t]) for t in 1:T]  # 1 / sum(w .^ 2), between 1 and N
resampled = [threshold == 1 || e < threshold * N for e in ess]  # predict! resamples when ESS < threshold * N
pf_mean = vec(sum(X .* W; dims = 1))
pf_sd   = sqrt.(max.(vec(sum(X .^ 2 .* W; dims = 1)) .- pf_mean .^ 2, 0))
kf_mean, kf_sd = first.(ksol.xt), sqrt.(first.(ksol.Rt))

println("log p(y[1:T]): particle filter ", round(sol.ll; digits = 3), "   Kalman (exact) ", round(ksol.ll; digits = 3))
println("Filter mean error: max |PF - Kalman| / Kalman sd = ", round(maximum(abs.(pf_mean .- kf_mean) ./ kf_sd); digits = 3))
println("ESS / N: mean ", round(mean(ess) / N; digits = 3), "   min ", round(minimum(ess) / N; digits = 3), "   resampled after ", count(resampled[1:T-1]), " of ", T - 1, " steps")
'''

[[codeBranches]]
model = "smoother"
code = '''
using LowLevelParticleFilters, Distributions, StaticArrays, LinearAlgebra, Random, Statistics

# Linear-Gaussian model, so the Kalman filter gives the exact answer to check against:
#   x[1] ~ N(m0, v0),   x[t + 1] = a x[t] + w[t],   y[t] = c x[t] + e[t],   w ~ N(0, q),   e ~ N(0, r)
a, c, q, r = {{a}}, {{c}}, {{q}}, {{r}}
A, B, C = SA[a;;], SA[0.0;;], SA[c;;]  # B = 0: the model has no input
dynamics(x, u, p, t)    = A * x
measurement(x, u, p, t) = C * x
df = MvNormal(zeros(1), [q;;])  # state noise
dg = MvNormal(zeros(1), [r;;])  # observation noise
d0 = MvNormal([{{m0}}], [{{v0}};;])  # initial state x[1]

N, T, seed, threshold = {{n}}, {{t}}, {{seed}}, {{threshold}}
Random.seed!(seed)  # resampling draws from the global RNG; the filter rng drives the rest
make_pf(N; threshold = threshold, rng = Xoshiro(seed)) =
    ParticleFilter(N, dynamics, measurement, df, dg, d0; resample_threshold = threshold, rng)
pf = make_pf(N)  # bootstrap filter: propose from the dynamics, weight by p(y | x)
kf = KalmanFilter(A, B, C, 0, cov(df), cov(dg), d0)  # exact filter for the same model

u = fill(SA[0.0], T)
xs, _, ys = simulate(pf, u; sample_initial = true)  # true states and observations
x_true = first.(xs)
y = [SVector{1}(yt) for yt in ys]

llp, anc = Float64[], Vector{Int}[]  # per-step log p(y[t] | y[1:t-1]); ancestor indices at each prediction
sol = forward_trajectory(pf, u, y;
    post_correct_cb = (f, ut, yt, p, t, lli) -> push!(llp, lli),
    post_predict_cb = (f, ut, yt, p, t) -> push!(anc, copy(f.state.j)))
llk  = Float64[]
ksol = forward_trajectory(kf, u, y; post_correct_cb = (f, p, ret) -> push!(llk, ret.ll))

X, W = first.(sol.x), sol.we  # N x T particles and normalised weights of x(t|t), before resampling
ess  = [effective_particles(W[:, t]) for t in 1:T]  # 1 / sum(w .^ 2), between 1 and N
resampled = [threshold == 1 || e < threshold * N for e in ess]  # predict! resamples when ESS < threshold * N
pf_mean = vec(sum(X .* W; dims = 1))
pf_sd   = sqrt.(max.(vec(sum(X .^ 2 .* W; dims = 1)) .- pf_mean .^ 2, 0))
kf_mean, kf_sd = first.(ksol.xt), sqrt.(first.(ksol.Rt))

println("log p(y[1:T]): particle filter ", round(sol.ll; digits = 3), "   Kalman (exact) ", round(ksol.ll; digits = 3))
println("Filter mean error: max |PF - Kalman| / Kalman sd = ", round(maximum(abs.(pf_mean .- kf_mean) ./ kf_sd); digits = 3))
println("ESS / N: mean ", round(mean(ess) / N; digits = 3), "   min ", round(minimum(ess) / N; digits = 3), "   resampled after ", count(resampled[1:T-1]), " of ", T - 1, " steps")

M = {{m}}  # backward trajectories, at most N
xb, _ = smooth(pf, M, u, y)  # forward filtering, backward simulation (reruns the filter)
Xb = smoothed_trajs(xb)[1, :, :]  # M x T smoothed trajectories
ps_mean, ps_sd = vec(mean(Xb; dims = 1)), vec(std(Xb; dims = 1))
ks = smooth(ksol)  # Rauch-Tung-Striebel smoother: exact x(t|T)
ks_mean, ks_sd = first.(ks.xT), sqrt.(first.(ks.RT))

println("Smoother mean error: max |PF - Kalman| / Kalman sd = ", round(maximum(abs.(ps_mean .- ks_mean) ./ ks_sd); digits = 3))
println("Smoother sd / filter sd at t = 1: ", round(ks_sd[1] / kf_sd[1]; digits = 3), " (Kalman), ", round(ps_sd[1] / pf_sd[1]; digits = 3), " (particles); later data sharpens early states")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "particle-cloud"
label = "Filtering Density"
desc = "Weighted histogram of the particles at the last step against the exact Kalman filtering density"
code = '''
using Plots

k = T  # step to inspect
histogram(X[:, k]; weights = W[:, k], normalize = :pdf, bins = 40, alpha = 0.5, label = "Weighted particles", xlabel = "x at the last step", ylabel = "Density")
plot!(z -> pdf(Normal(kf_mean[k], kf_sd[k]), z), kf_mean[k] - 4 * kf_sd[k], kf_mean[k] + 4 * kf_sd[k]; lw = 2, label = "Kalman filter (exact)")
vline!([x_true[k]]; ls = :dash, label = "True state")
'''

[[actionGroups.actions]]
id = "ess-trajectory"
label = "ESS Trajectory"
desc = "ESS / N at every step, the resampling threshold, and the steps after which the filter resampled"
code = '''
using Plots

plot(1:T, ess ./ N; ylims = (0, 1.05), lw = 2, label = "ESS / N", xlabel = "t", ylabel = "ESS / N")
hline!([threshold]; ls = :dash, label = "Resampling threshold")
scatter!(findall(resampled), ess[resampled] ./ N; ms = 3, label = "Resampled after this step")
'''

[[actionGroups.actions]]
id = "weight-hist"
label = "Weight Distribution"
desc = "Histogram of N x normalised weight at the last step: 1 for every particle means uniform weights"
code = '''
using Plots

k = T
histogram(N .* W[:, k]; bins = 50, label = false, xlabel = "N x normalised weight (1 = uniform)", ylabel = "Particles")
println("ESS at the last step: ", round(ess[k]; digits = 1), " of ", N, " particles")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "ess-check"
label = "ESS per Step"
desc = "ESS at each step and whether the filter resampled after it"
code = '''
for t in 1:T
    println("t = ", lpad(t, 3), "   ESS = ", lpad(round(ess[t]; digits = 1), 8), "   ESS / N = ", round(ess[t] / N; digits = 3), resampled[t] ? "   resampled" : "")
end
println("The filter resamples when ESS < ", threshold, " N. A sudden drop flags an observation the particles did not anticipate: an outlier, or a proposal far from the posterior.")
'''

[[actionGroups.actions]]
id = "logz-trajectory"
label = "Log-Likelihood Trajectory"
desc = "Cumulative log p(y[1:t]) from the particle filter against the exact Kalman value, and the per-step differences"
code = '''
using Plots

p1 = plot(1:T, cumsum(llk); lw = 2, label = "Kalman (exact)", ylabel = "log p(y[1:t])")
plot!(p1, 1:T, cumsum(llp); lw = 2, ls = :dash, label = "Particle filter")
p2 = bar(1:T, llp .- llk; label = false, xlabel = "t", ylabel = "PF - Kalman per step")
plot(p1, p2; layout = (2, 1))
'''

[[actionGroups.actions]]
id = "resampling-count"
label = "Resampling and Path Degeneracy"
desc = "How often the filter resampled, and how many distinct ancestors the final particles have at each earlier step"
code = '''
using Plots

idx = collect(1:N)  # trace the final particles back: anc[s] maps particles at s + 1 to their parents at s
distinct = fill(N, T)
for s in T-1:-1:1
    idx = anc[s][idx]
    distinct[s] = length(unique(idx))
end
println("Resampled at ", count(resampled[1:T-1]), " of ", T - 1, " transitions")
println("Distinct step-1 ancestors of the ", N, " final particles: ", distinct[1])
println("The paths stored by the filter coalesce, so early states are represented by few distinct particles. This is why the smoother simulates backwards instead of reusing the genealogy.")
plot(1:T, distinct; yscale = :log10, lw = 2, label = false, xlabel = "t", ylabel = "Distinct ancestors of final particles")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "filter-mean"
label = "Filter Mean"
desc = "E[x[t] | y[1:t]] with 2 sd bands from the particle filter and the Kalman filter, against the true state"
code = '''
using Plots

plot(1:T, kf_mean; ribbon = 2 .* kf_sd, fillalpha = 0.2, lw = 2, label = "Kalman filter +-2 sd", xlabel = "t", ylabel = "x")
plot!(1:T, pf_mean; ribbon = 2 .* pf_sd, fillalpha = 0.1, lw = 2, ls = :dash, label = "Particle filter +-2 sd")
scatter!(1:T, x_true; ms = 2, label = "True state")
'''

[[actionGroups.actions]]
id = "predictive-dist"
label = "One-Step Predictive"
desc = "Density of y[T + 1] given y[1:T]: a mixture over the weighted particles against the exact Kalman Gaussian"
code = '''
using Plots

s_y  = sqrt(c^2 * q + r)  # given x[T], y[T + 1] ~ N(c a x[T], c^2 q + r)
pf_pred(z) = sum(W[:, T] .* pdf.(Normal.(c * a .* X[:, T], s_y), z))  # average that density over the filter particles
kf_m = c * a * kf_mean[T]
kf_s = sqrt(c^2 * (a^2 * kf_sd[T]^2 + q) + r)
println("y[T + 1] given y[1:T]: Kalman mean ", round(kf_m; digits = 3), "   sd ", round(kf_s; digits = 3))
plot(z -> pdf(Normal(kf_m, kf_s), z), kf_m - 4 * kf_s, kf_m + 4 * kf_s; lw = 2, label = "Kalman (exact)", xlabel = "y[T + 1]", ylabel = "Density")
plot!(pf_pred, kf_m - 4 * kf_s, kf_m + 4 * kf_s; lw = 2, ls = :dash, label = "Particle filter")
'''

[[actionGroups.actions]]
id = "smooth-path"
label = "Smooth Path"
desc = "Backward-simulated trajectories and their mean against the exact Kalman smoother, E[x[t] | y[1:T]]"
code = '''
using Plots
{{?model=filter}} xb, _ = smooth(pf, {{m}}, u, y)  # forward filtering, backward simulation
{{?model=filter}} Xb = smoothed_trajs(xb)[1, :, :]  # M x T smoothed trajectories
{{?model=filter}} ks = smooth(ksol); ks_mean, ks_sd = first.(ks.xT), sqrt.(first.(ks.RT))  # exact smoother

plot(1:T, ks_mean; ribbon = 2 .* ks_sd, fillalpha = 0.2, lw = 2, label = "Kalman smoother +-2 sd", xlabel = "t", ylabel = "x")
plot!(1:T, transpose(Xb[1:min(20, end), :]); color = :gray, alpha = 0.4, lw = 0.7, label = false)  # up to 20 trajectories
plot!(1:T, vec(mean(Xb; dims = 1)); lw = 2, ls = :dash, label = "Mean of backward trajectories")
scatter!(1:T, x_true; ms = 2, label = "True state")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "particle-study"
label = "Particle Count Study"
desc = "Bias and sd of the log-likelihood estimate for N from 100 to 2000, 20 runs each: the sd falls like 1 / sqrt(N)"
code = '''
using Plots

Ns, reps = [100, 250, 500, 1000, 2000], 20
sds = map(Ns) do Nk
    lls = [loglik(make_pf(Nk; rng = Xoshiro(seed + k)), u, y) for k in 1:reps]
    println("N = ", rpad(Nk, 6), "mean estimate - exact ", rpad(round(mean(lls) - ksol.ll; digits = 3), 9), "sd ", round(std(lls); digits = 3))
    std(lls)
end
plot(Ns, sds; xscale = :log10, yscale = :log10, marker = :circle, label = "sd of log p(y) estimate", xlabel = "N", ylabel = "sd")
plot!(Ns, sds[1] .* sqrt.(Ns[1] ./ Ns); ls = :dash, label = "1 / sqrt(N) reference")
'''

[[actionGroups.actions]]
id = "threshold-sweep"
label = "Resampling Threshold Sweep"
desc = "Bias and sd of the log-likelihood estimate for thresholds 0 (never resample) to 1 (always), 20 runs each"
code = '''
reps = 20
for th in [0.0, 0.1, 0.5, 1.0]
    lls = [loglik(make_pf(N; threshold = th, rng = Xoshiro(seed + k)), u, y) for k in 1:reps]
    println("threshold ", rpad(th, 5), "mean estimate - exact ", rpad(round(mean(lls) - ksol.ll; digits = 3), 9), "sd ", round(std(lls); digits = 3))
end
println("Threshold 0 is sequential importance sampling: the weights degenerate over time and the estimate is poor. Resampling every step adds some noise; adaptive resampling sits in between.")
'''

[[actionGroups.actions]]
id = "logz-variance"
label = "Log-Likelihood Variance"
desc = "50 independent runs at the chosen N: the likelihood estimate is unbiased, its log is biased low by about half its variance"
code = '''
reps = 50
lls = [loglik(make_pf(N; rng = Xoshiro(seed + k)), u, y) for k in 1:reps]
println("log p(y[1:T]) exact (Kalman): ", round(ksol.ll; digits = 3))
println("Particle filter, ", reps, " runs:     mean ", round(mean(lls); digits = 3), "   sd ", round(std(lls); digits = 3))
println("Mean of exp(estimate - exact): ", round(mean(exp.(lls .- ksol.ll)); digits = 3), "   (near 1: the likelihood estimate is unbiased)")
println("var / 2 = ", round(var(lls) / 2; digits = 3), "   (about how far the mean log estimate sits below the exact value)")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "log-normaliser"
label = "Log-Likelihood"
desc = "log p(y[1:T]) from the particle filter against the exact Kalman value"
code = '''
println("log p(y[1:T]) particle filter: ", round(sol.ll; digits = 4))
println("log p(y[1:T]) Kalman (exact):  ", round(ksol.ll; digits = 4))
println("Difference:                    ", round(sol.ll - ksol.ll; digits = 4))
println("The particle estimate of p(y[1:T]) is unbiased, which is what lets it drive pseudo-marginal MCMC (PMMH) over model parameters. Its log is biased low; see Log-Likelihood Variance.")
'''

