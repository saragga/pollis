# Bootstrap Resampling Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/boot.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Bootstrap Resampling"
viewType = "pollis.boot"
defaultModel = "nonparam"

[[packages]]
name = "Bootstrap.jl"
github = "https://github.com/juliangehring/Bootstrap.jl"

[requires]
packages = ["Bootstrap.jl", "Distributions.jl", "StatsBase.jl", "Plots.jl"]

