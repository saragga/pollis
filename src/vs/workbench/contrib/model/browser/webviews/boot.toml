[[codeBranches]]
model = "nonparam"
code = '''
using Bootstrap, Distributions, Statistics, StatsBase, Random  # resampling and intervals; models; summaries; seeds

Random.seed!({{seed}})
mouse = [94.0, 197, 16, 38, 99, 141, 23]  # Efron and Tibshirani (1993), Table 2.1: survival days of the 7 treated mice
x     = Float64.({{xdata}})
stat  = {{statistic}}
truth_sample(n) = rand({{truth}}, n)  # population for the Coverage and Width vs Sample Size actions

# Nonparametric resampling with the chosen scheme; the nested standard error uses basic resampling
resample(f, v, m) = bootstrap(f, v, {{scheme}}(m))
inner_resample(f, v, m) = bootstrap(f, v, BasicSampling(m))
like_data(n) = sample(x, n)  # new data that look like x: draws from its empirical distribution
alternatives = [("Basic", (f, v, m) -> bootstrap(f, v, BasicSampling(m))),
                ("Balanced", (f, v, m) -> bootstrap(f, v, BalancedSampling(m))),
                ("Antithetic", (f, v, m) -> bootstrap(f, v, AntitheticSampling(m)))]

# Each replicate returns the statistic and its standard error from a nested bootstrap, for the studentised interval
with_se(v) = (stat(v), stderror(inner_resample(stat, v, {{inner}}))[1])
bs = resample(with_se, x, {{nboot}})

# The five Bootstrap.jl intervals for the first output (the statistic); each is (estimate, lower, upper)
function intervals(b; conf = {{level}})
    return [("Percentile", confint(b, PercentileConfInt(conf), 1)),
            ("Basic", confint(b, BasicConfInt(conf), 1)),
            ("Normal", confint(b, NormalConfInt(conf), 1)),
            ("BCa", confint(b, BCaConfInt(conf), 1)),
            ("Studentised", confint(b, straps(b, 2), StudentConfInt(conf), 1))]
end

println("n = ", length(x), ", replicates = ", nrun(bs))
println("estimate = ", round(original(bs, 1); digits = 3), ", bias = ", round(bias(bs, 1); digits = 3), ", standard error = ", round(stderror(bs, 1); digits = 3))
println(rpad("Interval", 13), rpad("lower", 11), rpad("upper", 11), "width")
for (name, (t0, lo, hi)) in intervals(bs)
    println(rpad(name, 13), rpad(round(lo; digits = 3), 11), rpad(round(hi; digits = 3), 11), round(hi - lo; digits = 3))
end
'''

[[codeBranches]]
model = "param"
code = '''
using Bootstrap, Distributions, Statistics, StatsBase, Random  # resampling and intervals; models; summaries; seeds

Random.seed!({{seed}})
mouse = [94.0, 197, 16, 38, 99, 141, 23]  # Efron and Tibshirani (1993), Table 2.1: survival days of the 7 treated mice
x     = Float64.({{xdata}})
stat  = {{statistic}}
truth_sample(n) = rand({{truth}}, n)  # population for the Coverage and Width vs Sample Size actions

# Parametric resampling: fit {{dist}} to each sample by maximum likelihood and draw from the fit
resample(f, v, m) = bootstrap(f, v, Model({{dist}}), BasicSampling(m))
inner_resample(f, v, m) = resample(f, v, m)
like_data(n) = rand(fit({{dist}}, x), n)  # new data that look like x: draws from the fitted model
alternatives = [("Parametric {{dist}}", resample),
                ("Nonparametric", (f, v, m) -> bootstrap(f, v, BasicSampling(m)))]

# Each replicate returns the statistic and its standard error from a nested bootstrap, for the studentised interval
with_se(v) = (stat(v), stderror(inner_resample(stat, v, {{inner}}))[1])
bs = resample(with_se, x, {{nboot}})

# The five Bootstrap.jl intervals for the first output (the statistic); each is (estimate, lower, upper)
function intervals(b; conf = {{level}})
    return [("Percentile", confint(b, PercentileConfInt(conf), 1)),
            ("Basic", confint(b, BasicConfInt(conf), 1)),
            ("Normal", confint(b, NormalConfInt(conf), 1)),
            ("BCa", confint(b, BCaConfInt(conf), 1)),
            ("Studentised", confint(b, straps(b, 2), StudentConfInt(conf), 1))]
end

println("n = ", length(x), ", replicates = ", nrun(bs))
println("estimate = ", round(original(bs, 1); digits = 3), ", bias = ", round(bias(bs, 1); digits = 3), ", standard error = ", round(stderror(bs, 1); digits = 3))
println(rpad("Interval", 13), rpad("lower", 11), rpad("upper", 11), "width")
for (name, (t0, lo, hi)) in intervals(bs)
    println(rpad(name, 13), rpad(round(lo; digits = 3), 11), rpad(round(hi; digits = 3), 11), round(hi - lo; digits = 3))
end
'''

[[codeBranches]]
model = "ts"
code = '''
using Bootstrap, Distributions, Statistics, StatsBase, Random  # resampling and intervals; models; summaries; seeds

Random.seed!({{seed}})

# AR(1) series y[t] = phi y[t-1] + e[t], started from its stationary distribution
function ar1(n, phi, sigma)
    y = zeros(n)
    y[1] = sigma / sqrt(1 - phi^2) * randn()
    for t in 2:n
        y[t] = phi * y[t - 1] + sigma * randn()
    end
    return y
end
series = ar1(120, {{phi}}, 1.0)  # built-in series
x      = Float64.({{ydata}})
stat   = {{tstat}}
truth_sample(n) = ar1(n, {{phi}}, 1.0)  # population for the Coverage action

# Maximum entropy bootstrap: each replicate keeps the time order and shape of the series
resample(f, v, m) = bootstrap(f, v, MaximumEntropySampling(m))
inner_resample(f, v, m) = resample(f, v, m)
phi_hat = autocor(x, [1])[1]
like_data(n) = mean(x) .+ ar1(n, phi_hat, std(x) * sqrt(1 - phi_hat^2))  # longer series from an AR(1) fitted to x
alternatives = [("Maximum entropy", resample),
                ("Basic (ignores dependence)", (f, v, m) -> bootstrap(f, v, BasicSampling(m)))]

# Each replicate returns the statistic and its standard error from a nested bootstrap, for the studentised interval
with_se(v) = (stat(v), stderror(inner_resample(stat, v, {{inner}}))[1])
bs = resample(with_se, x, {{nboot}})

# The five Bootstrap.jl intervals for the first output (the statistic); each is (estimate, lower, upper)
function intervals(b; conf = {{level}})
    return [("Percentile", confint(b, PercentileConfInt(conf), 1)),
            ("Basic", confint(b, BasicConfInt(conf), 1)),
            ("Normal", confint(b, NormalConfInt(conf), 1)),
            ("BCa", confint(b, BCaConfInt(conf), 1)),
            ("Studentised", confint(b, straps(b, 2), StudentConfInt(conf), 1))]
end

println("n = ", length(x), ", replicates = ", nrun(bs))
println("estimate = ", round(original(bs, 1); digits = 3), ", bias = ", round(bias(bs, 1); digits = 3), ", standard error = ", round(stderror(bs, 1); digits = 3))
println(rpad("Interval", 13), rpad("lower", 11), rpad("upper", 11), "width")
for (name, (t0, lo, hi)) in intervals(bs)
    println(rpad(name, 13), rpad(round(lo; digits = 3), 11), rpad(round(hi; digits = 3), 11), round(hi - lo; digits = 3))
end
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "replicate-histogram"
label = "Replicate Histogram"
desc = "Histogram of the bootstrap replicates with the estimate and the percentile and BCa intervals"
code = '''
using Plots

iv = Dict(intervals(bs))
histogram(straps(bs, 1); bins = 40, normalize = :pdf, alpha = 0.6, label = "replicates", xlabel = "statistic")
vline!([original(bs, 1)]; lw = 2, color = :black, label = "estimate")
vline!(collect(iv["Percentile"][2:3]); color = :blue, ls = :dash, label = "percentile")
vline!(collect(iv["BCa"][2:3]); color = :red, ls = :dot, label = "BCa")
'''

[[actionGroups.actions]]
id = "interval-plot"
label = "Interval Plot"
desc = "The five confidence intervals side by side, with the estimate"
code = '''
using Plots

iv = intervals(bs)
p = plot(; yticks = (1:length(iv), first.(iv)), xlabel = "statistic", legend = false,
    title = string(round(100 * {{level}}; digits = 1), " percent intervals"))
for (k, (name, (t0, lo, hi))) in enumerate(iv)
    plot!(p, [lo, hi], [k, k]; lw = 4)
end
vline!(p, [original(bs, 1)]; color = :black, ls = :dash)
p
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "replicate-shape"
label = "Replicate Shape"
desc = "Normal quantile plot of the replicates, with skewness and excess kurtosis; the normal and basic intervals assume a symmetric, roughly normal shape"
code = '''
using Plots

t1 = straps(bs, 1)
z  = sort((t1 .- mean(t1)) ./ std(t1))
q  = quantile.(Normal(), ((1:length(z)) .- 0.5) ./ length(z))
println("skewness = ", round(skewness(t1); digits = 3), ", excess kurtosis = ", round(kurtosis(t1); digits = 3))
println("distinct replicate values: ", length(unique(t1)), " of ", length(t1))
scatter(q, z; ms = 2, label = "replicates", xlabel = "normal quantile", ylabel = "standardised replicate")
plot!(q, q; color = :black, label = "normal")
'''

[[actionGroups.actions]]
id = "jackknife-influence"
label = "Jackknife Influence"
desc = "Leave-one-out values of the statistic and the influence of each observation; large influences drive the BCa acceleration"
code = '''
using Plots

loo = Bootstrap.jack_knife_estimate(x, stat)  # statistic with observation i left out
infl = (length(x) - 1) .* (mean(loo) .- loo)  # jackknife influence values
for i in sortperm(abs.(infl); rev = true)[1:min(5, length(x))]
    println("obs ", i, ": value = ", round(x[i]; digits = 3), ", leave-one-out = ", round(loo[i]; digits = 3), ", influence = ", round(infl[i]; digits = 3))
end
bar(infl; legend = false, xlabel = "observation", ylabel = "influence")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "width-vs-n"
label = "Width vs Sample Size"
desc = "Interval widths for new data like yours with 1, 2 and 4 times as many observations"
code = '''
n0 = length(x)
println(rpad("n", 6), join(rpad.(first.(intervals(bs)), 13)))
for n in (n0, 2n0, 4n0)
    v = n == n0 ? x : like_data(n)
    w = [hi - lo for (name, (t0, lo, hi)) in intervals(resample(with_se, v, {{nboot}}))]
    println(rpad(n, 6), join(rpad.(round.(w; digits = 3), 13)))
end
'''

[[actionGroups.actions]]
id = "required-replicates"
label = "Required Replicates"
desc = "Monte Carlo spread of the standard error and percentile endpoints over 10 repeats, for 200, 1000 and 5000 replicates"
code = '''
for B in (200, 1000, 5000)
    runs = [resample(stat, x, B) for _ in 1:10]
    se = [stderror(r, 1) for r in runs]
    ci = [confint(r, PercentileConfInt({{level}}), 1) for r in runs]
    println("B = ", rpad(B, 6), "SE ", round(mean(se); digits = 3), " +- ", round(std(se); digits = 4),
        ",  lower ", round(mean(getindex.(ci, 2)); digits = 3), " +- ", round(std(getindex.(ci, 2)); digits = 4),
        ",  upper ", round(mean(getindex.(ci, 3)); digits = 3), " +- ", round(std(getindex.(ci, 3)); digits = 4))
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "coverage"
label = "Interval Coverage"
desc = "Simulate samples of the same size from a known population and count how often each interval contains the true value"
code = '''
truth_value = stat(truth_sample(10^6))  # value of the statistic in the population, from one very large sample
ci_names = first.(intervals(bs))
hits, widths = zeros(length(ci_names)), zeros(length(ci_names))
for r in 1:{{reps}}
    for (k, (name, (t0, lo, hi))) in enumerate(intervals(resample(with_se, truth_sample(length(x)), {{nboot}})))
        hits[k] += lo <= truth_value <= hi
        widths[k] += hi - lo
    end
end
println("true value = ", round(truth_value; digits = 3), ", nominal coverage = ", {{level}}, ", samples = ", {{reps}})
for k in eachindex(ci_names)
    println(rpad(ci_names[k], 13), "coverage = ", rpad(round(hits[k] / {{reps}}; digits = 3), 7), "mean width = ", round(widths[k] / {{reps}}; digits = 3))
end
'''

[[actionGroups.actions]]
id = "schemes"
label = "Compare Schemes"
desc = "Standard error, bias and percentile interval under each resampling scheme, with their spread over 10 repeats"
code = '''
for (name, rs) in alternatives
    runs = [rs(stat, x, {{nboot}}) for _ in 1:10]
    se = [stderror(r, 1) for r in runs]
    b  = [bias(r, 1) for r in runs]
    ci = confint(runs[1], PercentileConfInt({{level}}), 1)
    println(rpad(name, 28), "SE ", round(mean(se); digits = 3), " +- ", round(std(se); digits = 4),
        ",  bias ", round(mean(b); digits = 3), " +- ", round(std(b); digits = 4),
        ",  percentile [", round(ci[2]; digits = 3), ", ", round(ci[3]; digits = 3), "]")
end
{{?model=nonparam}}if Bootstrap.nrun_exact(length(x)) <= 10^5
{{?model=nonparam}}    ex = bootstrap(stat, x, ExactSampling())
{{?model=nonparam}}    println(rpad("Exact (unweighted)", 28), "SE ", round(stderror(ex, 1); digits = 3), " over ", nrun(ex), " distinct resamples; Bootstrap.jl weights them equally, not by their multinomial probability, so this SE is biased")
{{?model=nonparam}}end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "interval-choice"
label = "Interval Choice"
desc = "Bias correction z0, acceleration a and skewness of the replicates: the quantities that make the BCa interval differ from the percentile interval"
code = '''
t0, t1 = original(bs, 1), straps(bs, 1)
z0  = quantile(Normal(), mean(t1 .< t0))  # median bias of the replicates, in normal units
loo = Bootstrap.jack_knife_estimate(x, stat)
d   = mean(loo) .- loo
a   = sum(d .^ 3) / (6 * sum(d .^ 2)^1.5)  # acceleration: skewness of the jackknife influence values
iv  = Dict(intervals(bs))
println("share of replicates below the estimate = ", round(mean(t1 .< t0); digits = 3), ", z0 = ", round(z0; digits = 3))
println("acceleration a = ", round(a; digits = 4), ", skewness of replicates = ", round(skewness(t1); digits = 3))
println("percentile [", round(iv["Percentile"][2]; digits = 3), ", ", round(iv["Percentile"][3]; digits = 3), "]  vs  BCa [", round(iv["BCa"][2]; digits = 3), ", ", round(iv["BCa"][3]; digits = 3), "]")
println("With z0 and a near zero the intervals agree; otherwise BCa or the studentised interval corrects for bias and skewness that the percentile and normal intervals ignore.")
'''

[[actionGroups.actions]]
id = "bias-correction"
label = "Bias Correction"
desc = "Bootstrap bias relative to the standard error, and the bias-corrected estimate"
code = '''
b, se = bias(bs, 1), stderror(bs, 1)
println("estimate = ", round(original(bs, 1); digits = 3), ", bias = ", round(b; digits = 3), ", standard error = ", round(se; digits = 3))
println("bias / SE = ", round(b / se; digits = 3), ", bias-corrected estimate = ", round(original(bs, 1) - b; digits = 3))
println(abs(b / se) < 0.25 ? "Bias is under a quarter of the standard error: Efron and Tibshirani (1993, section 10.6) suggest leaving the estimate uncorrected." :
    "Bias is a quarter of the standard error or more: the statistic may need correcting, or a different statistic; the correction itself adds variance.")
