[[decisionRows]]
task = "Nonparametric"
context = "Independent observations and no trusted model for their distribution: a median, a ratio, a correlation, a trimmed mean"
purpose = "The empirical distribution stands in for the population; works for almost any statistic but needs a reasonable sample size"

[[decisionRows]]
task = "Parametric"
context = "A distributional model you are willing to assume, or samples too small for the empirical distribution to be a good stand-in"
purpose = "Resampling from the fitted model is more accurate when the model is right and misleading when it is wrong"

[[decisionRows]]
task = "Time Series"
context = "Observations that depend on their past: returns, macro series, sensor readings"
purpose = "Resampling single observations breaks the dependence and understates the uncertainty; the maximum entropy bootstrap keeps it"

