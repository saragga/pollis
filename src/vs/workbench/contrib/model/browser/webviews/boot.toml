label = ""

[[notebookSections.notebooks]]
name = "Nonparametric Bootstrap"
file = "boot/tutorial-01-nonparametric.ipynb"
bundled = true
description = "Resample the data with replacement: standard error, bias and the bootstrap distribution of a statistic"

