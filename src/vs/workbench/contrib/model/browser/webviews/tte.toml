# Time-to-Event Analysis Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/tte.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Time-to-Event Analysis"
viewType = "pollis.tte"
defaultModel = "km"

[[packages]]
name = "Survival.jl"
github = "https://github.com/JuliaStats/Survival.jl"

[[packages]]
name = "LSurvival.jl"
github = "https://github.com/alexpkeil1/LSurvival.jl"

[requires]
packages = ["Survival.jl", "LSurvival.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Kaplan-Meier & Nelson-Aalen"
file = "tte/tutorial-01-km-na.ipynb"
bundled = true
description = "Non-parametric estimation of the survival and cumulative hazard functions"

[[notebookSections.notebooks]]
name = "Aalen-Johansen Estimator"
file = "tte/tutorial-02-aj.ipynb"
bundled = true
description = "Competing-risks cumulative incidence via the Aalen-Johansen estimator"

[[notebookSections.notebooks]]
name = "Cox Proportional Hazards"
file = "tte/tutorial-03-cox.ipynb"
bundled = true
description = "Semi-parametric regression with proportional hazards"

[[notebookSections.notebooks]]
name = "Accelerated Failure Time"
file = "tte/tutorial-04-aft.ipynb"
bundled = true
description = "Parametric survival regression with AFT models"

[[wikis]]
name = "Overview"
file = "tte/overview.md"
bundled = true

[[wikis]]
name = "Factsheet"
file = "tte/factsheet.md"
bundled = true

[[wikis]]
name = "Assumptions"
file = "tte/assumptions.md"
bundled = true

[[wikis]]
name = "Diagnostics"
file = "tte/diagnostics.md"
bundled = true

[[wikis]]
name = "Interpretation"
file = "tte/interpretation.md"
bundled = true

[[wikis]]
name = "Decision Guide"
file = "tte/decision-guide.md"
bundled = true

[[models]]
id = "km"
label = "Kaplan-Meier"

[[models]]
id = "na"
label = "Nelson-Aalen"

[[models]]
id = "aj"
label = "Aalen-Johansen"

[[models]]
id = "cox"
label = "Cox PH"

[[models]]
id = "aft"
label = "AFT"

[[bullets]]
text = "Kaplan-Meier"
detail = "non-parametric estimator of the survival function"

[[bullets]]
text = "Nelson-Aalen"
detail = "non-parametric estimator of the cumulative hazard"

[[bullets]]
text = "Aalen-Johansen"
detail = "competing-risks cumulative incidence estimator"

[[bullets]]
text = "Cox PH"
detail = "semi-parametric proportional hazards regression"

[[bullets]]
text = "AFT"
detail = "parametric accelerated failure time regression"

[[inputs]]
id = "time"
label = "time variable"
tooltip = "Column name for observed event or censoring times."
default = "time"

[[inputs]]
id = "event"
label = "event variable"
tooltip = "Column name for the event indicator. Use 0 for censored observations and 1 for events. For Aalen-Johansen, integer codes identify competing event types."
default = "event"

[[inputs]]
id = "data"
label = "data"
tooltip = "A table with the survival data: any Tables.jl source, e.g. a NamedTuple of columns or a CSV.File."
default = "df"

[[inputs]]
id = "covariates"
label = "covariates"
tooltip = "Right-hand side of the survival formula — covariate terms separated by +, e.g. age + treatment. Leave blank for an intercept-only model."
default = "age + treatment"
models = ["cox", "aft"]

[[inputs]]
id = "dist"
label = "distribution"
tooltip = "Baseline distribution for the AFT model. Determines the shape of the log-survival function."
kind = "select"
default = "Lognormal"
models = ["aft"]

[[inputs.options]]
value = "Lognormal"
label = "Log-Normal"

[[inputs.options]]
value = "Weibull"
label = "Weibull"

[[inputs.options]]
value = "Exponential"
label = "Exponential"

[[inputs.options]]
value = "Gamma"
label = "Gamma"

[[inputs.options]]
value = "GGamma"
label = "Generalised Gamma"

[[codeBranches]]
model = "km"
code = '''
using Survival

km = fit(KaplanMeier, {{data}}.{{time}}, {{data}}.{{event}})  # Kaplan-Meier estimator
'''

[[codeBranches]]
model = "na"
code = '''
using Survival

na = fit(NelsonAalen, {{data}}.{{time}}, {{data}}.{{event}})  # Nelson-Aalen estimator
'''

[[codeBranches]]
model = "aj"
code = '''
using LSurvival

aj = aalen_johansen({{data}}.{{time}}, {{data}}.{{event}})  # event coded 0 = censored, 1, 2, ... = cause
println("Causes: ", aj.R.eventtypes[2:end])
println("Final cumulative incidence per cause: ", round.(aj.risk[end, :], digits=4))
'''

[[codeBranches]]
model = "cox"
code = '''
using Survival

model = coxph(@formula(EventTime({{time}}, {{event}}) ~ {{covariates}}), {{data}})  # fit Cox proportional hazards
coeftable(model)  # estimated coefficients
'''

[[codeBranches]]
model = "aft"
code = '''
using LSurvival

model = survreg(@formula(Surv({{time}}, {{event}}) ~ {{covariates}}), {{data}}, dist=LSurvival.{{dist}}())  # fit AFT model
coeftable(model)  # estimated coefficients
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "survival-curve"
label = "Survival Curve With 95% CI"
desc = "Kaplan-Meier survival curve with pointwise log-log 95% confidence band; tick marks show censored times"
code = '''
using Survival, Plots
S = fit(KaplanMeier, {{data}}.{{time}}, {{data}}.{{event}} .!= 0)  # any event counts: with competing causes this is event-free survival
t, s, ci = S.events.time, S.survival, confint(S)
plot([0; t], [1; s], seriestype=:steppost, lw=2, label="Kaplan-Meier", xlabel="Time", ylabel="Survival probability", ylims=(0, 1), title="Survival curve")
plot!([0; t], [1; first.(ci)], seriestype=:steppost, c=1, ls=:dash, label="95% CI")
plot!([0; t], [1; last.(ci)], seriestype=:steppost, c=1, ls=:dash, label=false)
c = S.events.ncensored .> 0
scatter!(t[c], s[c], m=:vline, ms=5, c=:black, label="censored")
'''

[[actionGroups.actions]]
id = "cumhaz"
label = "Cumulative Hazard"
desc = "Nelson-Aalen cumulative hazard, and log H(t) against log t: a straight line suggests a Weibull model (slope = shape; slope 1 = exponential)"
code = '''
using Survival, Plots
H = fit(NelsonAalen, {{data}}.{{time}}, {{data}}.{{event}} .!= 0)
t, h = H.events.time, H.chaz
ok = (t .> 0) .& (h .> 0)
p1 = plot(t, h, seriestype=:steppost, lw=2, label=false, xlabel="Time", ylabel="H(t)", title="Cumulative hazard")
p2 = scatter(log.(t[ok]), log.(h[ok]), ms=3, label=false, xlabel="log t", ylabel="log H(t)", title="Weibull check")
plot(p1, p2, layout=(1, 2), size=(800, 360))
'''

[[actionGroups.actions]]
id = "cif-curves"
label = "Cumulative Incidence Curves"
desc = "Aalen-Johansen: cumulative incidence of each cause with pointwise 95% CI, and the event-free survival; at every time the incidences and the survival add up to 1"
code = '''
using LSurvival, Plots
{{?model!=aj}} error("Cumulative incidence curves come from the Aalen-Johansen model: select Aalen-Johansen and run it first")
causes = aj.R.eventtypes[2:end]  # eventtypes[1] is the censoring code 0
ci = confint(aj; level=0.95)  # normal-approximation band: lower and upper for cause 1, then cause 2, ...
t = [0; aj.times]
plot(xlabel="Time", ylabel="Probability", ylims=(0, 1), title="Cumulative incidence by cause", legend=:topleft)
for (j, c) in enumerate(causes)
    plot!(t, [0; aj.risk[:, j]], seriestype=:steppost, lw=2, c=j, label="cause $c")
    plot!(t, [0; clamp.(ci[:, 2j-1], 0, 1)], seriestype=:steppost, c=j, ls=:dash, label=false)
    plot!(t, [0; clamp.(ci[:, 2j], 0, 1)], seriestype=:steppost, c=j, ls=:dash, label=false)
end
plot!(t, [1; aj.surv], seriestype=:steppost, lw=2, c=:black, label="event-free survival")
println("Check at the last time: incidences + survival = ", round(sum(aj.risk[end, :]) + aj.surv[end], digits=4))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "censoring"
label = "Censoring Summary"
desc = "Share of censored observations and when censoring happens: heavy or early censoring makes the tail of the curve unreliable"
code = '''
using Plots
t, e = {{data}}.{{time}}, ({{data}}.{{event}} .!= 0)
println("n = ", length(t), "   events = ", count(e), "   censored = ", count(!, e), " (", round(100 * count(!, e) / length(t), digits=1), "%)")
println("Follow-up: median ", sort(t)[cld(length(t), 2)], "   max ", maximum(t))
histogram([t[e], t[.!e]], bins=30, alpha=0.6, label=["event" "censored"], xlabel="Time", title="Event and censoring times")
'''

[[actionGroups.actions]]
id = "ph-check"
label = "Proportional Hazards Check"
desc = "Cox PH: Kaplan-Meier curves for the low and high halves of the fitted risk score on log(-log S) against log t; roughly parallel curves support proportional hazards"
code = '''
using Survival, Plots, Statistics
{{?model!=cox}} error("This check applies to the Cox PH model: select Cox PH and run it first")
lp = modelmatrix(model) * coef(model)  # linear predictor (risk score)
t, e = {{data}}.{{time}}, {{data}}.{{event}}
plot(xlabel="log t", ylabel="log(-log S(t))", title="Proportional hazards check")
for (lab, g) in (("low risk", lp .<= median(lp)), ("high risk", lp .> median(lp)))
    S = fit(KaplanMeier, t[g], e[g]); ok = (S.survival .> 0) .& (S.survival .< 1) .& (S.events.time .> 0)
    plot!(log.(S.events.time[ok]), log.(-log.(S.survival[ok])), seriestype=:steppost, lw=2, label=lab)
end
current()
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "quantiles"
label = "Median and Quartile Survival Times"
desc = "Times by which 25%, 50% and 75% of subjects have had the event, read off the Kaplan-Meier curve (NA if the curve never drops that far)"
code = '''
using Survival
S = fit(KaplanMeier, {{data}}.{{time}}, {{data}}.{{event}} .!= 0)
for q in (0.75, 0.5, 0.25)
    i = findfirst(<=(q), S.survival)
    println("S(t) = ", q, " at t = ", i === nothing ? "NA (not reached)" : S.events.time[i])
end
'''

[[actionGroups.actions]]
id = "horizons"
label = "Survival at Fixed Horizons"
desc = "Estimated survival probability with 95% CI at the quartiles of follow-up time"
code = '''
using Survival, Statistics
S = fit(KaplanMeier, {{data}}.{{time}}, {{data}}.{{event}} .!= 0); ci = confint(S)
for h in quantile({{data}}.{{time}}, [0.25, 0.5, 0.75])
    i = searchsortedlast(S.events.time, h)
    s, (lo, hi) = i == 0 ? (1.0, (1.0, 1.0)) : (S.survival[i], ci[i])
    println("t = ", round(h, digits=2), ":  S = ", round(s, digits=3), "   95% CI [", round(lo, digits=3), ", ", round(hi, digits=3), "]")
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "logrank"
label = "Compare Groups (Log-Rank)"
desc = "Kaplan-Meier curves by the last covariate in the formula (e.g. treatment) and a log-rank test of equal survival across its levels"
code = '''
using Survival, Plots, Distributions, LinearAlgebra
gvar = Symbol(strip(last(split("{{covariates}}", "+"))))  # grouping column: last covariate
t, e, g = {{data}}.{{time}}, ({{data}}.{{event}} .!= 0), getproperty({{data}}, gvar)
lv = sort(unique(g)); length(lv) > 10 && error("$gvar has $(length(lv)) levels: log-rank needs a categorical grouping variable")
O, E, V = zeros(length(lv)), zeros(length(lv)), zeros(length(lv), length(lv))
for s in sort(unique(t[e]))
    r = t .>= s; d = e .& (t .== s); n, dt = count(r), count(d)
    nk = [count(r .& (g .== l)) for l in lv]; dk = [count(d .& (g .== l)) for l in lv]
    O .+= dk; E .+= dt .* nk ./ n
    n > 1 && (V .+= dt * (n - dt) / (n^2 * (n - 1)) .* (n .* Diagonal(nk) .- nk * nk'))
end
k = length(lv) - 1; chi = (O - E)[1:k]' * inv(V[1:k, 1:k]) * (O - E)[1:k]
println("Log-rank chi2 = ", round(chi, digits=3), "  df = ", k, "  p = ", round(ccdf(Chisq(k), chi), digits=5))
plot(xlabel="Time", ylabel="Survival probability", ylims=(0, 1), title="Kaplan-Meier by $gvar")
for l in lv
    S = fit(KaplanMeier, t[g .== l], e[g .== l])
    plot!([0; S.events.time], [1; S.survival], seriestype=:steppost, lw=2, label="$gvar = $l")
end
current()
'''

[[actionGroups.actions]]
id = "model-fit"
label = "Model vs Baseline"
desc = "Cox PH: likelihood ratio test against the model with no covariates, plus AIC. AFT: AIC and log-likelihood against the intercept-only model. Kaplan-Meier and Nelson-Aalen: the two nonparametric survival estimates side by side"
code = '''
using Survival, Distributions, Plots
{{?model=aj}} error("Available for Kaplan-Meier, Nelson-Aalen, Cox PH and AFT")
{{?model=aft}} println("AIC = ", round(aic(model), digits=2), "   log-likelihood = ", round(loglikelihood(model), digits=3), "   intercept-only = ", round(nullloglikelihood(model), digits=3))
{{?model=cox}} LR = 2 * (loglikelihood(model) - nullloglikelihood(model))
{{?model=cox}} println("LR = ", round(LR, digits=3), "  df = ", dof(model), "  p = ", round(ccdf(Chisq(dof(model)), LR), digits=5))
{{?model=cox}} println("AIC = ", round(-2 * loglikelihood(model) + 2 * dof(model), digits=2))
{{?model=km|na}} S = fit(KaplanMeier, {{data}}.{{time}}, {{data}}.{{event}} .!= 0); H = fit(NelsonAalen, {{data}}.{{time}}, {{data}}.{{event}} .!= 0)
{{?model=km|na}} plot(S.events.time, S.survival, seriestype=:steppost, lw=2, label="Kaplan-Meier", xlabel="Time", ylabel="Survival probability", title="KM vs exp(-Nelson-Aalen)")
{{?model=km|na}} plot!(H.events.time, exp.(-H.chaz), seriestype=:steppost, lw=2, ls=:dash, label="exp(-H), Fleming-Harrington")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "rmst"
label = "Restricted Mean Survival Time"
desc = "Area under the Kaplan-Meier curve up to the last observed time: the average event-free time over the follow-up window, easier to communicate than a hazard ratio"
code = '''
using Survival
S = fit(KaplanMeier, {{data}}.{{time}}, {{data}}.{{event}} .!= 0)
t = [0; S.events.time]; s = [1; S.survival]
tau = last(t)  # restriction horizon: last observed time
println("RMST up to t = ", tau, ": ", round(sum(s[1:end-1] .* diff(t)), digits=3), " time units")
'''

[[actionGroups.actions]]
id = "hazard-ratios"
label = "Hazard Ratios"
desc = "Cox PH: exp(coefficient) with 95% intervals; a hazard ratio of 1.5 means a 50% higher event rate at any time per unit increase"
code = '''
{{?model!=cox}} error("Hazard ratios come from the Cox PH model: select Cox PH and run it first")
b, se = coef(model), stderror(model)
foreach((n, a, s) -> println(rpad(n, 20), " HR = ", round(exp(a), digits=3), "   95% CI [", round(exp(a - 1.96s), digits=3), ", ", round(exp(a + 1.96s), digits=3), "]"), coefnames(model), b, se)
'''
