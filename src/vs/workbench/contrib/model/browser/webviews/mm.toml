# Mixed-Effects Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/mm.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Mixed-Effects Models"
viewType = "pollis.mm"
defaultModel = "lmm"

[[packages]]
name = "MixedModels.jl"
github = "https://github.com/JuliaStats/MixedModels.jl"

