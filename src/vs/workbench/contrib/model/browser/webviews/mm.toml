[[models]]
id = "lmm"
label = "LMM"

[[models]]
id = "glmm"
label = "GLMM"

[[bullets]]
text = "LMM"
detail = "Linear Mixed-Effects Model: continuous response with fixed effects plus random intercepts and slopes for grouping factors"

[[bullets]]
text = "GLMM"
detail = "Generalized Linear Mixed-Effects Model: binary, count or positive responses through a family and link, with the same random-effects structures"

[[decisionRows]]
task = "LMM, (1|group)"
context = "Continuous, grouped observations"
purpose = "Groups differ in their baseline level"

[[decisionRows]]
task = "LMM, (1+x|group)"
context = "Continuous, repeated measures"
purpose = "The effect of x also varies from group to group"

[[decisionRows]]
task = "LMM, (1|g1) + (1|g2)"
context = "Crossed factors, e.g. subjects and items"
purpose = "Every level of one factor meets several levels of the other"

[[decisionRows]]
task = "GLMM, Bernoulli / Binomial"
context = "Binary or proportion, grouped"
purpose = "Yes/no outcomes measured repeatedly within groups"

[[decisionRows]]
task = "GLMM, Poisson / NegativeBinomial"
context = "Counts, grouped"
purpose = "Event counts per group or subject; use NegativeBinomial if overdispersed"

[[inputs]]
id = "formula"
label = "Formula"
tooltip = "Julia formula using the @formula macro. Fixed effects go on the right of ~, random effects in parentheses. Examples: (1|group) random intercept; (0+x|group) random slope only; (1+x|group) random intercept and slope; (1|g1) + (1|g2) crossed effects; (1|g1/g2) nested effects"
default = "y ~ x1 + x2 + (1|group)"

[[inputs]]
id = "data"
label = "Data"
tooltip = "Table containing all variables referenced in the formula: any Tables.jl source, e.g. a named tuple of vectors or a CSV.File. Column names must match the formula symbols exactly."
default = "data"

[[inputs]]
id = "family"
label = "Family"
tooltip = "Response distribution for GLMM. Bernoulli and Binomial for binary/proportion outcomes, Poisson or NegativeBinomial for counts, Gamma for positive continuous, InverseGaussian for positive skewed."
kind = "select"
models = ["glmm"]
newRow = true

[[inputs.options]]
value = "Bernoulli"
label = "Bernoulli"

[[inputs.options]]
value = "Binomial"
label = "Binomial"

[[inputs.options]]
value = "Poisson"
label = "Poisson"

[[inputs.options]]
value = "NegativeBinomial"
label = "NegativeBinomial"

[[inputs.options]]
value = "Gamma"
label = "Gamma"

[[inputs.options]]
value = "InverseGaussian"
label = "InverseGaussian"

[[inputs]]
id = "link"
label = "Link"
tooltip = "Link function connecting the linear predictor to the mean of the distribution. Each family has a canonical default link. Override only when the theory requires a different link."
kind = "select"
models = ["glmm"]

[[inputs.options]]
value = ""
label = "LogitLink (default)"
when = "family=Bernoulli|Binomial"

[[inputs.options]]
value = ""
label = "LogLink (default)"
when = "family=Poisson|NegativeBinomial"

[[inputs.options]]
value = ""
label = "InverseLink (default)"
when = "family=Gamma"

[[inputs.options]]
value = ""
label = "InverseSquareLink (default)"
when = "family=InverseGaussian"

[[inputs.options]]
value = "ProbitLink"
label = "ProbitLink"
when = "family=Bernoulli|Binomial"

[[inputs.options]]
value = "CloglogLink"
label = "CloglogLink"
when = "family=Bernoulli|Binomial"

[[inputs.options]]
value = "LogLink"
label = "LogLink"
when = "family=Binomial|Gamma|InverseGaussian"

[[inputs.options]]
value = "IdentityLink"
label = "IdentityLink"
when = "family=Poisson|NegativeBinomial|Gamma|InverseGaussian"

[[inputs.options]]
value = "SqrtLink"
label = "SqrtLink"
when = "family=Poisson|NegativeBinomial"

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.lmm]
# Parallel group lines (random intercepts)
svg = '''
var s = '';
var b = [62, 52, 42, 34];
for (var i = 0; i < b.length; i++) {
	s += '<line x1="8" y1="' + b[i] + '" x2="46" y2="' + (b[i] - 20) + '" stroke="currentColor" stroke-width="1.3" opacity="' + (0.35 + i * 0.2).toFixed(2) + '"/>';
}
return s;
'''

[miniCharts.glmm]
# S-shaped group curves (random intercepts on the logit scale)
svg = '''
var s = '';
var shift = [-8, -2, 4, 10];
for (var k = 0; k < shift.length; k++) {
	var d = '';
	for (var i = 0; i <= 38; i++) {
		var p = 1 / (1 + Math.exp(-(i - 19 - shift[k]) / 4));
		d += (i ? 'L' : 'M') + (8 + i) + ',' + (66 - p * 44).toFixed(1);
	}
	s += '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.3" opacity="' + (0.35 + k * 0.2).toFixed(2) + '"/>';
}
return s;
'''

[[codeBranches]]
model = "lmm"
code = '''
using MixedModels  # mixed-effects models

model = fit(MixedModel, @formula({{formula}}), {{data}})  # linear mixed-effects model

println(model)  # fixed effects and variance components
println(VarCorr(model))  # random-effects variances and correlations
println(ranef(model))  # conditional modes (BLUPs) of the random effects
'''

[[codeBranches]]
model = "glmm"
code = '''
using MixedModels  # mixed-effects models

{{?link=}}model = fit(MixedModel, @formula({{formula}}), {{data}}, {{family}}())  # GLMM with the default link
{{?link!=}}model = fit(MixedModel, @formula({{formula}}), {{data}}, {{family}}(), {{link}}())  # GLMM with {{link}}

println(model)  # fixed effects and variance components
println(VarCorr(model))  # random-effects variances and correlations
println(ranef(model))  # conditional modes of the random effects
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "caterpillar"
label = "Caterpillar Plot"
desc = "Random effects of each group with prediction intervals"
code = '''
using MixedModels, Plots

re = raneftables(model)[1]  # random effects of the first grouping factor
v  = [r[2] for r in re]  # random intercepts
o  = sortperm(v)
scatter(v[o], 1:length(v), xlabel="Random intercept", ylabel="Group (sorted)", label=false)
vline!([0], linestyle=:dash, label=false)  # population average
'''

[[actionGroups.actions]]
id = "fitted-observed"
label = "Fitted vs Observed"
desc = "Conditional fitted values against the response"
code = '''
using MixedModels, Plots

scatter(fitted(model), response(model), xlabel="Fitted", ylabel="Observed", label=false, alpha=0.5)
plot!(identity, extrema(fitted(model))..., linestyle=:dash, label="45-degree line")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residuals-fitted"
label = "Residuals vs Fitted"
desc = "Check linearity and constant variance"
code = '''
using MixedModels, Plots

scatter(fitted(model), residuals(model), xlabel="Fitted", ylabel="Residual", label=false, alpha=0.5)
hline!([0], linestyle=:dash, label=false)  # a funnel shape suggests heteroskedasticity
'''

[[actionGroups.actions]]
id = "qq-ranef"
label = "Random-Effects Q-Q Plot"
desc = "Check the normality of the random effects"
code = '''
using MixedModels, StatsPlots, Distributions

re = vec(ranef(model)[1])  # random intercepts of the first grouping factor
qqplot(Normal(), re, xlabel="Normal quantiles", ylabel="Random-effect quantiles")
'''

[[actionGroups.actions]]
id = "singularity"
label = "Singular Fit Check"
desc = "Detect variance components estimated at zero"
code = '''
using MixedModels

println("Singular fit: ", issingular(model))  # true: simplify the random-effects structure
println(VarCorr(model))  # look for zero variances or correlations of +/-1
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "predict-new"
label = "Predict New Data"
desc = "Predictions for new observations, including unseen groups"
code = '''
using MixedModels, Tables

newdata = map(c -> c[1:5], Tables.columntable({{data}}))  # first 5 rows; replace with new observations
yhat = predict(model, newdata; new_re_levels=:population)  # unseen groups use the population mean
println(yhat)
'''

[[actionGroups.actions]]
id = "bootstrap"
label = "Parametric Bootstrap"
desc = "Bootstrap confidence intervals for all parameters"
code = '''
using MixedModels, Random

boot = parametricbootstrap(MersenneTwister(42), 1000, model)  # 1000 simulated refits
println(confint(boot))  # shortest 95% coverage intervals
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "lr-test"
label = "Likelihood Ratio Test"
desc = "Test the random effects against the same fixed effects without them (or edit model0 to another nested structure)"
code = '''
using MixedModels, GLM

# model0 must be nested in model: here the same fixed effects with no random effects, and the same family and link
model0 = model isa LinearMixedModel ? lm(@formula(y ~ x1 + x2), {{data}}) : glm(@formula(y ~ x1 + x2), {{data}}, model.resp.d, model.resp.link)
println(MixedModels.likelihoodratiotest(model0, model))  # a variance tested at 0 is on the boundary: the chi-square p-value is conservative (roughly halve it)
'''

[[actionGroups.actions]]
id = "info-criteria"
label = "Information Criteria"
desc = "AIC, BIC and deviance for model comparison"
code = '''
using MixedModels

println("AIC: ", aic(model))  # lower is better
println("BIC: ", bic(model))  # stronger penalty on parameters
println("Deviance: ", deviance(model))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "icc"
label = "Intraclass Correlation"
desc = "Share of variance due to the grouping factor"
code = '''
using MixedModels

s2_group = first(model.sigmas)[1]^2  # variance of the first random intercept
s2_resid = model isa LinearMixedModel ? model.sigma^2 : pi^2 / 3  # LMM: residual variance; GLMM: latent-scale variance of the logistic error (logit link only)
println("ICC: ", round(s2_group / (s2_group + s2_resid); digits=3))  # correlation of two observations in the same group
'''

[[actionGroups.actions]]
id = "fixed-effects"
label = "Fixed-Effects Table"
desc = "Population-average effects with standard errors"
code = '''
using MixedModels

println(coeftable(model))  # estimates, standard errors, z and p-values
'''
