id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "param-count"
label = "Parameter Count"
desc = "Number of trainable parameters in the model"
code = '''
{{?model=flux}}println("Parameters: ", sum(length, Flux.trainables(model)))
{{?model=lux}}println("Parameters: ", Lux.parameterlength(model))
'''

[[actionGroups.actions]]
id = "gradient-norm"
label = "Gradient Norm"
desc = "Size of the training-loss gradient, to spot vanishing or exploding gradients"
code = '''
using Enzyme, Functors
{{?model=flux}}grads = Flux.gradient(m -> loss(m, X_train, y_train), Duplicated(model))[1]  # Enzyme reverse mode
{{?model=lux}}grads = Enzyme.gradient(Reverse, (p, x, y) -> mse(model, p, st, x, y), ps, Const(X_train), Const(y_train))[1]
norm2 = sum(g -> g isa AbstractArray ? sum(abs2, g) : 0.0, Functors.fleaves(grads))
println("Gradient norm: ", sqrt(norm2))
'''

[[actionGroups.actions]]
id = "output-shape"
label = "Output Shapes"
desc = "Check the shape of the recurrent output and of the prediction"
code = '''
{{?model=flux}}println("Hidden states: ", size(rnn({{xvar}})))  # (hidden_size, T, n_sequences)
{{?model=flux}}println("Prediction:    ", size(model({{xvar}})))  # (output_size, n_sequences)
{{?model=lux}}println("Prediction: ", size(first(model({{xvar}}, ps, st))))  # (output_size, n_sequences)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "predict-new"
label = "Predict New Sequences"
desc = "Apply the trained model to new input sequences"
code = '''
# X_new: Float32 array (input_size, T, n_new_sequences)
{{?model=flux}}y_new = model(X_new)
{{?model=lux}}y_new, _ = model(X_new, ps, st)
'''

[[actionGroups.actions]]
id = "validation-loss"
label = "Validation Loss"
desc = "Mean squared error on the held-out sequences, against predicting the training mean"
code = '''
using Statistics
{{?model=flux}}val_mse = loss(model, X_val, y_val)
{{?model=lux}}val_mse = mse(model, ps, st, X_val, y_val)
