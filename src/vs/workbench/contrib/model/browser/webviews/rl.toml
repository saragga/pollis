[[codeBranches]]
model = "flux"
code = '''
{{?cell=OriginalLSTM}}# OriginalLSTM: Reference LSTM implementation with the classic forget/input/output gates.
{{?cell=PeepholeLSTM}}# PeepholeLSTM: LSTM whose gates also read the cell state directly (peephole connections).
{{?cell=MultiplicativeLSTM}}# MultiplicativeLSTM: LSTM with an input-dependent multiplicative transition for richer dynamics.
{{?cell=WMCLSTM}}# WMCLSTM: Working-memory-connected LSTM that augments the cell with an external memory read.
{{?cell=TLSTM}}# TLSTM: Typed LSTM variant from the unified RecurrentLayers formulation.
{{?cell=MGU}}# MGU: Minimal Gated Unit: a single forget gate, the lightest gated recurrent cell.
{{?cell=LiGRU}}# LiGRU: Light Gated Recurrent Unit: drops the reset gate and uses ReLU + batch norm.
{{?cell=LightRU}}# LightRU: Light Recurrent Unit with a single gate and a simplified candidate update.
{{?cell=UGRNN}}# UGRNN: Update-Gate RNN: a GRU-like cell with only an update gate.
{{?cell=MinimalRNN}}# MinimalRNN: Minimal RNN: an encoded input combined with a single update gate.
{{?cell=JANET}}# JANET: Just Another NETwork: an LSTM stripped down to only the forget gate.
{{?cell=TGRU}}# TGRU: Typed GRU variant from the unified RecurrentLayers formulation.
{{?cell=RAN}}# RAN: Recurrent Additive Network: gated, purely additive memory with no tanh squashing.
{{?cell=ATR}}# ATR: Addition-subtraction Twin-gated Recurrent cell sharing a single weight matrix.
{{?cell=SGRN}}# SGRN: Simple Gated Recurrent Network with a single input-driven gate.
{{?cell=STAR}}# STAR: Stackable Recurrent cell designed to train very deep recurrent stacks.
{{?cell=IntersectionRNN}}# IntersectionRNN: Intersection RNN with separate gates for the recurrent and feed-forward paths.
{{?cell=NAS}}# NAS: Cell discovered by neural architecture search over recurrent topologies.
{{?cell=MUT1}}# MUT1: Mutated cell #1 from an evolutionary search over gated architectures.
{{?cell=MUT2}}# MUT2: Mutated cell #2 from an evolutionary search over gated architectures.
{{?cell=MUT3}}# MUT3: Mutated cell #3 from an evolutionary search over gated architectures.
{{?cell=IndRNN}}# IndRNN: Independently RNN: element-wise recurrence so neurons can be stacked deeply.
{{?cell=RHN}}# RHN: Recurrent Highway Network: multiple highway transforms per time step.
{{?cell=SCRN}}# SCRN: Structurally Constrained RN with a slow-changing context layer for long memory.
{{?cell=TRNN}}# TRNN: Typed vanilla RNN from the unified RecurrentLayers formulation.
{{?cell=coRNN}}# coRNN: Coupled Oscillatory RNN: a network of damped oscillators for long dependencies.
{{?cell=UnICORNN}}# UnICORNN: Undamped Independent Controlled Oscillatory RNN with provable gradient stability.
{{?cell=LEM}}# LEM: Long Expressive Memory: a multiscale ODE-based cell for long-range dependencies.
{{?cell=AntisymmetricRNN}}# AntisymmetricRNN: Antisymmetric RNN whose stable ODE discretisation preserves gradients.
{{?cell=GatedAntisymmetricRNN}}# GatedAntisymmetricRNN: Antisymmetric RNN with an added gate controlling the stable dynamics.
{{?cell=CFN}}# CFN: Chaos-Free Network: simple gated dynamics with provably non-chaotic behaviour.
{{?cell=FastRNN}}# FastRNN: FastRNN: a residual connection with two scalars for cheap, stable training.
{{?cell=FastGRNN}}# FastGRNN: FastGRNN: gated extension of FastRNN with low-rank, quantised weights.
{{?cell=BR}}# BR: Bistable Recurrent cell whose neurons settle into two stable states.
{{?cell=NBR}}# NBR: Recurrently-connected Bistable Recurrent cell for long-term memory.
{{?cell=MiRU1}}# MiRU1: Minimal Recurrent Unit variant #1 with a single lightweight gate.
{{?cell=MiRU2}}# MiRU2: Minimal Recurrent Unit variant #2 with a single lightweight gate.
using Flux, RecurrentLayers

input_size  = {{inputsize}}  # input features per time step
hidden_size = {{hiddensize}}  # recurrent state width
output_size = {{outputsize}}  # prediction dimension

rnn     = {{cell}}(input_size => hidden_size)  # {{cell}} recurrent layer
readout = Dense(hidden_size => output_size)

function predict({{xvar}})
    H = rnn({{xvar}})  # {{xvar}}: (input_size, T); H: (hidden_size, T)
    readout(H[:, end])  # map the final hidden state to the output
end

{{?cell=OriginalLSTM|PeepholeLSTM|MGU|LiGRU|MinimalRNN|IndRNN|RAN|coRNN|FastGRNN}}params    = Flux.params(rnn, readout)
opt_state = Flux.setup(Adam(1f-3), (rnn, readout))
loss({{xvar}}, {{yvar}}) = Flux.mse(predict({{xvar}}), {{yvar}})
{{?cell=OriginalLSTM|PeepholeLSTM|MGU|LiGRU|MinimalRNN|IndRNN|RAN|coRNN|FastGRNN}}
{{?cell=OriginalLSTM|PeepholeLSTM|MGU|LiGRU|MinimalRNN|IndRNN|RAN|coRNN|FastGRNN}}Flux.train!(loss, (rnn, readout), data, opt_state)  # one epoch over (X, y) pairs
'''

[[codeBranches]]
model = "lux"
code = '''
{{?cell=OriginalLSTM}}# OriginalLSTM: Reference LSTM implementation with the classic forget/input/output gates.
{{?cell=PeepholeLSTM}}# PeepholeLSTM: LSTM whose gates also read the cell state directly (peephole connections).
{{?cell=MultiplicativeLSTM}}# MultiplicativeLSTM: LSTM with an input-dependent multiplicative transition for richer dynamics.
{{?cell=WMCLSTM}}# WMCLSTM: Working-memory-connected LSTM that augments the cell with an external memory read.
{{?cell=TLSTM}}# TLSTM: Typed LSTM variant from the unified RecurrentLayers formulation.
{{?cell=MGU}}# MGU: Minimal Gated Unit: a single forget gate, the lightest gated recurrent cell.
{{?cell=LiGRU}}# LiGRU: Light Gated Recurrent Unit: drops the reset gate and uses ReLU + batch norm.
{{?cell=LightRU}}# LightRU: Light Recurrent Unit with a single gate and a simplified candidate update.
{{?cell=UGRNN}}# UGRNN: Update-Gate RNN: a GRU-like cell with only an update gate.
{{?cell=MinimalRNN}}# MinimalRNN: Minimal RNN: an encoded input combined with a single update gate.
{{?cell=JANET}}# JANET: Just Another NETwork: an LSTM stripped down to only the forget gate.
{{?cell=TGRU}}# TGRU: Typed GRU variant from the unified RecurrentLayers formulation.
{{?cell=RAN}}# RAN: Recurrent Additive Network: gated, purely additive memory with no tanh squashing.
{{?cell=ATR}}# ATR: Addition-subtraction Twin-gated Recurrent cell sharing a single weight matrix.
{{?cell=SGRN}}# SGRN: Simple Gated Recurrent Network with a single input-driven gate.
{{?cell=STAR}}# STAR: Stackable Recurrent cell designed to train very deep recurrent stacks.
{{?cell=IntersectionRNN}}# IntersectionRNN: Intersection RNN with separate gates for the recurrent and feed-forward paths.
{{?cell=NAS}}# NAS: Cell discovered by neural architecture search over recurrent topologies.
{{?cell=MUT1}}# MUT1: Mutated cell #1 from an evolutionary search over gated architectures.
{{?cell=MUT2}}# MUT2: Mutated cell #2 from an evolutionary search over gated architectures.
{{?cell=MUT3}}# MUT3: Mutated cell #3 from an evolutionary search over gated architectures.
{{?cell=IndRNN}}# IndRNN: Independently RNN: element-wise recurrence so neurons can be stacked deeply.
{{?cell=RHN}}# RHN: Recurrent Highway Network: multiple highway transforms per time step.
{{?cell=SCRN}}# SCRN: Structurally Constrained RN with a slow-changing context layer for long memory.
{{?cell=TRNN}}# TRNN: Typed vanilla RNN from the unified RecurrentLayers formulation.
{{?cell=coRNN}}# coRNN: Coupled Oscillatory RNN: a network of damped oscillators for long dependencies.
{{?cell=UnICORNN}}# UnICORNN: Undamped Independent Controlled Oscillatory RNN with provable gradient stability.
{{?cell=LEM}}# LEM: Long Expressive Memory: a multiscale ODE-based cell for long-range dependencies.
{{?cell=AntisymmetricRNN}}# AntisymmetricRNN: Antisymmetric RNN whose stable ODE discretisation preserves gradients.
{{?cell=GatedAntisymmetricRNN}}# GatedAntisymmetricRNN: Antisymmetric RNN with an added gate controlling the stable dynamics.
{{?cell=CFN}}# CFN: Chaos-Free Network: simple gated dynamics with provably non-chaotic behaviour.
{{?cell=FastRNN}}# FastRNN: FastRNN: a residual connection with two scalars for cheap, stable training.
{{?cell=FastGRNN}}# FastGRNN: FastGRNN: gated extension of FastRNN with low-rank, quantised weights.
{{?cell=BR}}# BR: Bistable Recurrent cell whose neurons settle into two stable states.
{{?cell=NBR}}# NBR: Recurrently-connected Bistable Recurrent cell for long-term memory.
{{?cell=MiRU1}}# MiRU1: Minimal Recurrent Unit variant #1 with a single lightweight gate.
{{?cell=MiRU2}}# MiRU2: Minimal Recurrent Unit variant #2 with a single lightweight gate.
using Lux, LuxRecurrentLayers, Random

rng = Random.default_rng()  # reproducible initialisation
input_size  = {{inputsize}}  # input features per time step
hidden_size = {{hiddensize}}  # recurrent state width
output_size = {{outputsize}}  # prediction dimension

model = Chain(
    Recurrence({{cell}}Cell(input_size => hidden_size)),  # wrap the cell; returns the last state
    Dense(hidden_size => output_size),
)

ps, st = Lux.setup(rng, model)  # explicit parameters and state

y_hat, st = model({{xvar}}, ps, st)  # {{xvar}}: (input_size, T, batch)
{{?cell=OriginalLSTM|PeepholeLSTM|MGU|LiGRU|MinimalRNN|IndRNN|RAN|coRNN|FastGRNN}}
{{?cell=OriginalLSTM|PeepholeLSTM|MGU|LiGRU|MinimalRNN|IndRNN|RAN|coRNN|FastGRNN}}using Optimisers, Zygote
{{?cell=OriginalLSTM|PeepholeLSTM|MGU|LiGRU|MinimalRNN|IndRNN|RAN|coRNN|FastGRNN}}opt_state = Optimisers.setup(Adam(1f-3), ps)
{{?cell=OriginalLSTM|PeepholeLSTM|MGU|LiGRU|MinimalRNN|IndRNN|RAN|coRNN|FastGRNN}}loss(model, ps, st, {{xvar}}, {{yvar}}) = Lux.MSELoss()(model, ps, st, ({{xvar}}, {{yvar}}))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "hidden-heatmap"
label = "Hidden State Heatmap"
desc = "How each hidden unit evolves over the time steps of the first sequence"
code = '''
using Plots
{{?model=flux}}H = rnn({{xvar}})  # (hidden_size, T)
{{?model=lux}}rnn_seq = Recurrence({{cell}}Cell(input_size => hidden_size); return_sequence=true)
{{?model=lux}}ps_seq, st_seq = Lux.setup(rng, rnn_seq)
{{?model=lux}}H_steps, _ = rnn_seq({{xvar}}, ps_seq, st_seq)
{{?model=lux}}H = reduce(hcat, [h[:, 1] for h in H_steps])  # (hidden_size, T)
heatmap(H, xlabel="time step", ylabel="hidden unit", title="Hidden state")
'''

[[actionGroups.actions]]
id = "pred-vs-target"
label = "Predictions vs Targets"
desc = "Scatter of the model predictions against the targets"
code = '''
using Plots
{{?model=flux}}y_pred = predict({{xvar}})
{{?model=lux}}y_pred, _ = model({{xvar}}, ps, Lux.testmode(st))
scatter(vec({{yvar}}), vec(y_pred), xlabel="target", ylabel="prediction", legend=false)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "param-count"
label = "Parameter Count"
desc = "Number of trainable parameters in the model"
code = '''
{{?model=flux}}println("Parameters: ", sum(length, Flux.trainables((rnn, readout))))
{{?model=lux}}println("Parameters: ", Lux.parameterlength(model))
'''

[[actionGroups.actions]]
id = "gradient-norm"
label = "Gradient Norm"
desc = "Size of the loss gradient, to spot vanishing or exploding gradients"
code = '''
using Functors
{{?model=flux}}grads = Flux.gradient(m -> Flux.mse(m[2](m[1]({{xvar}})[:, end]), {{yvar}}), (rnn, readout))[1]
{{?model=lux}}using Zygote
{{?model=lux}}grads = Zygote.gradient(p -> first(Lux.MSELoss()(model, p, st, ({{xvar}}, {{yvar}}))), ps)[1]
norm2 = sum(g -> g isa AbstractArray ? sum(abs2, g) : 0.0, Functors.fleaves(grads))
println("Gradient norm: ", sqrt(norm2))
'''

[[actionGroups.actions]]
id = "output-shape"
label = "Output Shapes"
desc = "Check the shape of the recurrent output and of the prediction"
code = '''
{{?model=flux}}println("Hidden states: ", size(rnn({{xvar}})))
{{?model=flux}}println("Prediction:    ", size(predict({{xvar}})))
{{?model=lux}}println("Prediction: ", size(first(model({{xvar}}, ps, st))))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "predict-new"
label = "Predict New Sequences"
desc = "Apply the model to new input sequences"
code = '''
{{?model=flux}}y_new = predict(X_new)
{{?model=lux}}y_new, _ = model(X_new, ps, Lux.testmode(st))
'''

[[actionGroups.actions]]
id = "validation-loss"
label = "Validation Loss"
desc = "Mean squared error on held-out sequences"
code = '''
{{?model=flux}}println("Validation MSE: ", Flux.mse(predict(X_val), y_val))
{{?model=lux}}y_val_hat, _ = model(X_val, ps, Lux.testmode(st))
{{?model=lux}}println("Validation MSE: ", Lux.MSELoss()(y_val_hat, y_val))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-lstm"
label = "Size vs LSTM"
desc = "Compare the parameter count with a standard LSTM of the same width"
code = '''
{{?model=flux}}lstm = LSTM(input_size => hidden_size)
{{?model=flux}}println("{{cell}}: ", sum(length, Flux.trainables(rnn)), " parameters")
{{?model=flux}}println("LSTM: ", sum(length, Flux.trainables(lstm)), " parameters")
{{?model=lux}}lstm = Chain(Recurrence(LSTMCell(input_size => hidden_size)), Dense(hidden_size => output_size))
{{?model=lux}}println("{{cell}}: ", Lux.parameterlength(model), " parameters")
{{?model=lux}}println("LSTM: ", Lux.parameterlength(lstm), " parameters")
'''

[[actionGroups.actions]]
id = "vs-gru"
label = "Size vs GRU"
desc = "Compare the parameter count with a standard GRU of the same width"
code = '''
{{?model=flux}}gru = GRU(input_size => hidden_size)
{{?model=flux}}println("{{cell}}: ", sum(length, Flux.trainables(rnn)), " parameters")
{{?model=flux}}println("GRU: ", sum(length, Flux.trainables(gru)), " parameters")
{{?model=lux}}gru = Chain(Recurrence(GRUCell(input_size => hidden_size)), Dense(hidden_size => output_size))
{{?model=lux}}println("{{cell}}: ", Lux.parameterlength(model), " parameters")
{{?model=lux}}println("GRU: ", Lux.parameterlength(gru), " parameters")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "input-sensitivity"
label = "Input Sensitivity"
desc = "Gradient of the prediction with respect to each input feature and time step"
code = '''
using Plots
{{?model=flux}}gx = Flux.gradient(x -> sum(predict(x)), {{xvar}})[1]
{{?model=lux}}using Zygote
{{?model=lux}}gx = Zygote.gradient(x -> sum(first(model(x, ps, st))), {{xvar}})[1][:, :, 1]
heatmap(abs.(gx), xlabel="time step", ylabel="input feature", title="Input sensitivity")
'''

[[actionGroups.actions]]
id = "final-state"
label = "Final Hidden State"
desc = "The hidden state the readout layer sees after the last time step"
code = '''
{{?model=flux}}h_final = rnn({{xvar}})[:, end]
{{?model=lux}}h_final, _ = Recurrence({{cell}}Cell(input_size => hidden_size))({{xvar}}, ps.layer_1, st.layer_1)
println("Final hidden state: ", h_final)
'''
