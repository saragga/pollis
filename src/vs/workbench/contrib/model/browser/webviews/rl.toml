[[inputs]]
id = "inputsize"
label = "input_size"
tooltip = "Number of input features per time step. Typical range: 1 for a univariate series up to several hundred for embeddings."
default = "10"
newRow = true

[[inputs]]
id = "hiddensize"
label = "hidden_size"
tooltip = "Width of the recurrent hidden state. Larger values add capacity at the cost of memory and compute. Typical range: 32-512."
default = "64"

[[inputs]]
id = "outputsize"
label = "output_size"
tooltip = "Dimension of the prediction produced by the readout layer. Use 1 for scalar regression or the number of classes for classification."
default = "1"

[[inputs]]
id = "xvar"
label = "Sequence Data"
tooltip = "Float32 array of input sequences, sized (input_size, T, n_sequences). 20% of the sequences are held out for validation."
default = "X"
newRow = true

[[inputs]]
id = "yvar"
label = "Target Variable"
tooltip = "Float32 array of targets, one column per sequence: (output_size, n_sequences)."
default = "y"

