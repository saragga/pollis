[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-lstm"
label = "Compare with LSTM"
desc = "Train a standard LSTM of the same width on the same split and compare size and validation error"
code = '''
{{?model=flux}}lstm = fit!(Chain(LSTM(input_size => hidden_size), h -> h[:, end, :], Dense(hidden_size => output_size)))
{{?model=flux}}println("{{cell}}: ", sum(length, Flux.trainables(model)), " parameters, validation MSE ", loss(model, X_val, y_val))
{{?model=flux}}println("LSTM: ", sum(length, Flux.trainables(lstm)), " parameters, validation MSE ", loss(lstm, X_val, y_val))
{{?model=lux}}lstm = Chain(Recurrence(LSTMCell(input_size => hidden_size)), Dense(hidden_size => output_size))
{{?model=lux}}ps_lstm, st_lstm = fit(lstm)
{{?model=lux}}println("{{cell}}: ", Lux.parameterlength(model), " parameters, validation MSE ", mse(model, ps, st, X_val, y_val))
{{?model=lux}}println("LSTM: ", Lux.parameterlength(lstm), " parameters, validation MSE ", mse(lstm, ps_lstm, st_lstm, X_val, y_val))
'''

[[actionGroups.actions]]
id = "vs-gru"
label = "Compare with GRU"
desc = "Train a standard GRU of the same width on the same split and compare size and validation error"
code = '''
{{?model=flux}}gru = fit!(Chain(GRU(input_size => hidden_size), h -> h[:, end, :], Dense(hidden_size => output_size)))
{{?model=flux}}println("{{cell}}: ", sum(length, Flux.trainables(model)), " parameters, validation MSE ", loss(model, X_val, y_val))
{{?model=flux}}println("GRU: ", sum(length, Flux.trainables(gru)), " parameters, validation MSE ", loss(gru, X_val, y_val))
{{?model=lux}}gru = Chain(Recurrence(GRUCell(input_size => hidden_size)), Dense(hidden_size => output_size))
{{?model=lux}}ps_gru, st_gru = fit(gru)
{{?model=lux}}println("{{cell}}: ", Lux.parameterlength(model), " parameters, validation MSE ", mse(model, ps, st, X_val, y_val))
{{?model=lux}}println("GRU: ", Lux.parameterlength(gru), " parameters, validation MSE ", mse(gru, ps_gru, st_gru, X_val, y_val))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "input-sensitivity"
label = "Input Sensitivity"
desc = "Gradient of the prediction for the first sequence with respect to each input feature and time step"
code = '''
using Plots, Enzyme
x1 = {{xvar}}[:, :, 1:1]  # the first sequence, kept 3-dimensional
{{?model=flux}}gx = Enzyme.gradient(Reverse, (m, x) -> sum(m(x)), Const(model), x1)[2][:, :, 1]
{{?model=lux}}gx = Enzyme.gradient(Reverse, (x, p, s) -> sum(first(model(x, p, s))), x1, Const(ps), Const(st))[1][:, :, 1]
heatmap(abs.(gx), xlabel="time step", ylabel="input feature", title="Input sensitivity")
'''

[[actionGroups.actions]]
id = "final-state"
label = "Final Hidden State"
desc = "The hidden state the readout layer sees after the last time step of the first sequence"
code = '''
{{?model=flux}}h_final = rnn({{xvar}})[:, end, 1]
{{?model=lux}}h_final, _ = Recurrence({{cell}}Cell(input_size => hidden_size))({{xvar}}[:, :, 1:1], ps.layer_1, st.layer_1)
println("Final hidden state: ", vec(h_final))
'''
