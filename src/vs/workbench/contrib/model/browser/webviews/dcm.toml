[[bullets]]
text = "MOEA/D"
detail = "decomposes MOO into scalar subproblems via weight vectors; Chebyshev or PBI aggregation"

[[bullets]]
text = "CCMO"
detail = "coevolutionary constrained MOO; helper and main populations for constraint handling"

[[bullets]]
text = "Epsilon-Dominance Archive"
detail = "NSGA-II feeding an epsilon-box archive, the core of the Borg MOEA (without its operator adaptation and restarts)"

[[decisionRows]]
task = "MOEA/D"
context = "Smooth, regular fronts where an even spread of trade-offs is wanted; scales well in the number of objectives"
purpose = "Decomposes the problem into one scalar Tchebycheff subproblem per weight vector and evolves them together with differential evolution (MOEAD_DE), each subproblem learning from its neighbours"

[[decisionRows]]
task = "CCMO"
context = "Constraints that cut the front into pieces or keep the search away from it: narrow feasible regions, disconnected feasible fronts"
purpose = "Coevolves two populations: one solves the constrained problem, a helper ignores the constraints and guides the first across infeasible regions. Default problem: Deb's CONSTR, whose front is shaped by the constraints"

[[decisionRows]]
task = "Epsilon-Dominance Archive"
context = "When a bounded, well-spread set of trade-offs at a chosen resolution is wanted, as in the Borg MOEA"
purpose = "Runs NSGA-II and feeds every feasible solution it evaluates into an epsilon-box archive (the core of Borg): at most one solution per box of size eps, so the resolution of the front is set by eps rather than by the population size"

[[inputs]]
id = "obj"
label = "Objectives"
tooltip = "Vector of objective expressions in x (all minimised), e.g. [x[1]^2 + x[2]^2, (x[1] - 1)^2 + x[2]^2]."
default = "[x[1], (1 + x[2]) / x[1]]"

[[inputs]]
id = "ineq"
label = "Inequality Constraints"
tooltip = "Vector of inequality constraints g(x) <= 0; use [0.0] for none."
default = "[6 - (x[2] + 9x[1]), 1 + x[2] - 9x[1]]"

[[inputs]]
id = "eq"
label = "Equality Constraints"
tooltip = "Vector of equality constraints h(x) = 0; use [0.0] for none."
default = "[0.0]"

[[inputs]]
id = "bounds"
label = "Bounds"
tooltip = "2 x n matrix: first row lower bounds, second row upper bounds of the decision variables."
default = "[0.1 0.0; 1.0 5.0]"

[[inputs]]
id = "N"
label = "Population"
tooltip = "Population size (for MOEA/D, the number of weight vectors). Typical: 100 to 300."
default = "100"

[[inputs]]
id = "iter"
label = "Iterations"
tooltip = "Number of generations. Typical: 200 to 500."
default = "250"

[[inputs]]
id = "eps"
label = "Epsilon"
tooltip = "Box size in each objective: the archive keeps at most one solution per box."
default = "[0.01, 0.1]"
