[[codeBranches]]
model = "moead"
code = '''
using Metaheuristics, LinearAlgebra, Random
Ind = Metaheuristics.PerformanceIndicators

f(x) = ({{obj}}, {{ineq}}, {{eq}})  # objectives (minimised), g(x) <= 0, h(x) = 0
bounds = {{bounds}}  # row 1: lower, row 2: upper
nobj = length(f(bounds[1, :])[1])
opts(seed=1; iterations={{iter}}) = Options(iterations=iterations, seed=seed, store_convergence=true)
function alg(seed=1; N={{N}}, kw...)  # MOEA/D with differential evolution
    p = 1; while binomial(p + nobj, nobj - 1) <= N; p += 1; end  # partitions giving at most N weight vectors
    MOEAD_DE(gen_ref_dirs(nobj, p); options=opts(seed; kw...))
end
nondominated(r) = Metaheuristics.get_non_dominated_solutions(r.population)

function run(seed=1; kw...)
    r = optimize(f, bounds, alg(seed; kw...))
    s = nondominated(r)
    (front = reduce(vcat, [transpose(x.f) for x in s]), sols = s, result = r)
end
hv(F, r) = (keep = vec(all(F .< transpose(r), dims=2)); any(keep) ? Ind.hypervolume(F[keep, :], r; verbose=false) : 0.0)

res = run()
front, sols = res.front, res.sols
refpoint = nadir(front) .+ 0.1 .* (nadir(front) .- ideal(front))  # hypervolume reference: 10% beyond the nadir
(front_size = size(front, 1), ideal = ideal(front), nadir = nadir(front), hypervolume = hv(front, refpoint), all_feasible = all(s.is_feasible for s in sols))
'''

[[codeBranches]]
model = "ccmo"
code = '''
using Metaheuristics, LinearAlgebra, Random
Ind = Metaheuristics.PerformanceIndicators

f(x) = ({{obj}}, {{ineq}}, {{eq}})  # objectives (minimised), g(x) <= 0, h(x) = 0
bounds = {{bounds}}  # row 1: lower, row 2: upper
nobj = length(f(bounds[1, :])[1])
