    r = optimize(f, bounds, alg(seed; kw...))
    s = nondominated(r)
    (front = reduce(vcat, [transpose(x.f) for x in s]), sols = s, result = r)
end
hv(F, r) = (keep = vec(all(F .< transpose(r), dims=2)); any(keep) ? Ind.hypervolume(F[keep, :], r; verbose=false) : 0.0)

res = run()
front, sols = res.front, res.sols
refpoint = nadir(front) .+ 0.1 .* (nadir(front) .- ideal(front))  # hypervolume reference: 10% beyond the nadir
(front_size = size(front, 1), ideal = ideal(front), nadir = nadir(front), hypervolume = hv(front, refpoint), all_feasible = all(s.is_feasible for s in sols))
'''

[[codeBranches]]
model = "borg"
code = '''
using Metaheuristics, LinearAlgebra, Random
Ind = Metaheuristics.PerformanceIndicators

f(x) = ({{obj}}, {{ineq}}, {{eq}})  # objectives (minimised), g(x) <= 0, h(x) = 0
bounds = {{bounds}}  # row 1: lower, row 2: upper
nobj = length(f(bounds[1, :])[1])
opts(seed=1; iterations={{iter}}) = Options(iterations=iterations, seed=seed, store_convergence=true)
eps = {{eps}}  # box size per objective
alg(seed=1; N={{N}}, kw...) = NSGA2(N=N, options=opts(seed; kw...))  # generator of candidate solutions
function nondominated(r)  # epsilon-box archive over every feasible solution evaluated
    pts = [s for st in r.convergence for s in st.population if s.is_feasible]
    lo = vec(minimum(reduce(hcat, [s.f for s in pts]), dims=2))
    box(s) = floor.(Int, (s.f .- lo) ./ eps)
    corner(s) = norm((s.f .- lo) ./ eps .- box(s))
    arch = Dict{Vector{Int}, Any}()
    for s in pts
        b = box(s)
        any(c -> all(c .<= b) && c != b, keys(arch)) && continue  # box dominated by an archived box
        if haskey(arch, b)
            corner(s) < corner(arch[b]) && (arch[b] = s)  # one solution per box: closest to the box corner
        else
            filter!(kv -> !(all(b .<= kv[1]) && b != kv[1]), arch); arch[b] = s
        end
    end
    collect(values(arch))
end

function run(seed=1; kw...)
    r = optimize(f, bounds, alg(seed; kw...))
    s = nondominated(r)
    (front = reduce(vcat, [transpose(x.f) for x in s]), sols = s, result = r)
end
hv(F, r) = (keep = vec(all(F .< transpose(r), dims=2)); any(keep) ? Ind.hypervolume(F[keep, :], r; verbose=false) : 0.0)

res = run()
front, sols = res.front, res.sols
refpoint = nadir(front) .+ 0.1 .* (nadir(front) .- ideal(front))  # hypervolume reference: 10% beyond the nadir
(front_size = size(front, 1), ideal = ideal(front), nadir = nadir(front), hypervolume = hv(front, refpoint), all_feasible = all(s.is_feasible for s in sols))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "pareto-front"
label = "Pareto Front Plot"
desc = "The non-dominated feasible front over the final population, with infeasible individuals shown separately: where the constraints cut into objective space"
code = '''
using Plots
P = res.result.population
fe = [s.f for s in P if s.is_feasible]; inf = [s.f for s in P if !s.is_feasible]
p = scatter(first.(fe), getindex.(fe, 2), ms=2, c=:gray, alpha=0.5, label="feasible population", xlabel="f1", ylabel="f2", title="Pareto front")
isempty(inf) || scatter!(first.(inf), getindex.(inf, 2), ms=2, marker=:x, c=:red, label="infeasible")
scatter!(front[:, 1], front[:, 2], ms=3, c=:black, label="non-dominated")
'''

[[actionGroups.actions]]
id = "weight-vectors"
label = "Weight Vectors"
desc = "Evenly spread Tchebycheff weight vectors as rays from the ideal point (normalised objectives), each joined to the front solution that best serves it: gaps show parts of the front the method missed"
code = '''
using Plots
size(front, 2) == 2 || error("The weight-vector view needs exactly two objectives")
lo, hi = ideal(front), nadir(front); Z = (front .- transpose(lo)) ./ transpose(max.(hi .- lo, 1e-12))
W = [[w, 1 - w] for w in range(0.02, 0.98, length=15)]
p = scatter(Z[:, 1], Z[:, 2], ms=3, c=:black, label="front", xlabel="f1 (scaled)", ylabel="f2 (scaled)", aspect_ratio=:equal, title="Weight vectors")
for w in W
    d = 1 ./ w; d = d ./ maximum(d)  # Tchebycheff ray direction
    k = argmin([maximum(w .* Z[i, :]) for i in axes(Z, 1)])
    plot!([0, d[1]], [0, d[2]], c=:gray, ls=:dash, label=false); scatter!([Z[k, 1]], [Z[k, 2]], c=:red, ms=4, label=false)
end
p
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "constraint-satisfaction"
label = "Constraint Check"
desc = "Feasibility of the front and the share of feasible individuals in each generation: how quickly the search reached and then stayed in the feasible region"
code = '''
using Plots
share = [count(s -> s.is_feasible, st.population) / length(st.population) for st in res.result.convergence]
display((front_size = length(sols), feasible = count(s -> s.is_feasible, sols), max_violation = maximum(s.sum_violations for s in sols), first_feasible_generation = findfirst(>(0), share)))
plot(share, lw=2, ylim=(0, 1.05), xlabel="Generation", ylabel="Feasible share of population", legend=false, title="Feasibility over time")
'''

[[actionGroups.actions]]
id = "hypervolume"
label = "Hypervolume"
desc = "Hypervolume of the front and its variability over 5 independent runs (different seeds): a large spread means the result depends on luck"
code = '''
using Statistics
hvs = [hv(run(s).front, refpoint) for s in 1:5]
(hypervolume = hv(front, refpoint), reference_point = refpoint, runs_mean = mean(hvs), runs_std = std(hvs))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "run-algorithm"
label = "Budget Sensitivity"
desc = "Hypervolume reached with different numbers of generations: how much a larger budget would still improve the front"
code = '''
using Plots
budgets = unique(round.(Int, {{iter}} .* [0.1, 0.25, 0.5, 1.0, 2.0]))
hvs = [hv(run(1; iterations=b).front, refpoint) for b in budgets]
plot(budgets, hvs, marker=:o, lw=2, xlabel="Generations", ylabel="Hypervolume", legend=false, title="Budget sensitivity")
'''

[[actionGroups.actions]]
id = "relax"
label = "Constraint Relaxation"
desc = "Fronts obtained when every inequality constraint is loosened to g(x) <= t: how far the trade-off would move if the constraints were relaxed"
code = '''
using Plots
function relaxed_front(t)
    fr(x) = (y = f(x); (y[1], y[2] .- t, y[3]))
    s = nondominated(optimize(fr, bounds, alg(1)))
    reduce(vcat, [transpose(x.f) for x in s])
end
p = plot(xlabel="f1", ylabel="f2", title="Constraint relaxation")
for t in [0.0, 0.5, 1.0, 2.0]
    F = relaxed_front(t); o = sortperm(F[:, 1])
    scatter!(F[o, 1], F[o, 2], ms=2, label="t = " * string(t))
end
p
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-algorithms"
label = "Compare Algorithms"
desc = "MOEA/D, CCMO and plain NSGA-II on the same problem, budget and seed: front size, hypervolume (common reference point), feasibility and run time"
code = '''
pN = 1; while binomial(pN + nobj, nobj - 1) <= {{N}}; pN += 1; end  # MOEA/D partitions giving at most N weight vectors, as for the other algorithms
runs = [(name, @timed optimize(f, bounds, make())) for (name, make) in [("MOEA/D", () -> MOEAD_DE(gen_ref_dirs(nobj, pN); options=opts(1))), ("CCMO", () -> CCMO(NSGA2(N={{N}}); options=opts(1))), ("NSGA-II", () -> NSGA2(N={{N}}, options=opts(1)))]]
fronts = [pareto_front(r.value) for (_, r) in runs]
common = (Fall = reduce(vcat, fronts); nadir(Fall) .+ 0.1 .* (nadir(Fall) .- ideal(Fall)))
[(algorithm = name, front_size = size(F, 1), hypervolume = hv(F, common), feasible_share = count(s -> s.is_feasible, r.value.population) / length(r.value.population), seconds = round(r.time, digits=2))
 for ((name, r), F) in zip(runs, fronts)]
'''

[[actionGroups.actions]]
id = "igd-comparison"
label = "IGD Comparison"
desc = "Inverted generational distance of each algorithm's front (and this model's) to a reference front, the non-dominated union of all of them (lower is closer and better spread)"
code = '''
pN = 1; while binomial(pN + nobj, nobj - 1) <= {{N}}; pN += 1; end  # MOEA/D partitions giving at most N weight vectors, as for the other algorithms
fronts = [[(name, pareto_front(optimize(f, bounds, make()))) for (name, make) in [("MOEA/D", () -> MOEAD_DE(gen_ref_dirs(nobj, pN); options=opts(1))), ("CCMO", () -> CCMO(NSGA2(N={{N}}); options=opts(1))), ("NSGA-II", () -> NSGA2(N={{N}}, options=opts(1)))]]; [("This model", front)]]
U = reduce(vcat, last.(fronts))
nd = [i for i in axes(U, 1) if !any(all(U[j, :] .<= U[i, :]) && any(U[j, :] .< U[i, :]) for j in axes(U, 1))]
reference = U[nd, :]
[(algorithm = name, front_size = size(F, 1), igd = Ind.igd(F, reference)) for (name, F) in fronts]
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "decision-space"
label = "Decision Space"
desc = "The Pareto set: decision variables of the non-dominated solutions (first two), coloured by f1, and a table of five solutions spread along the front"
code = '''
using Plots
X = reduce(vcat, [transpose(get_position(s)) for s in sols]); Fv = reduce(vcat, [transpose(s.f) for s in sols])
o = sortperm(Fv[:, 1]); pick = o[unique(round.(Int, range(1, length(o), length=5)))]
display([(x = round.(X[i, :], digits=4), f = round.(Fv[i, :], digits=4)) for i in pick])
scatter(X[:, 1], size(X, 2) > 1 ? X[:, 2] : zeros(size(X, 1)), zcolor=Fv[:, 1], xlabel="x1", ylabel="x2", label=false, title="Pareto set (colour = f1)")
'''

[[actionGroups.actions]]
id = "active-constraints"
label = "Active Constraints"
desc = "Which inequality constraints are binding (g_i close to 0) along the front: those segments of the trade-off exist only because of that constraint"
code = '''
using Plots
act(s) = (a = findall(g -> abs(g) < 1e-2, s.g); isempty(a) ? "none" : join(["g" * string(i) for i in a], ", "))
lab = act.(sols)
display([(active = l, solutions = count(==(l), lab)) for l in unique(lab)])
p = plot(xlabel="f1", ylabel="f2", title="Front by active constraint")
for l in unique(lab)
    k = lab .== l; scatter!(front[k, 1], front[k, 2], ms=3, label=l)
end
p
'''
