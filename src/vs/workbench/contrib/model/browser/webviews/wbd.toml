# World Bank Indicators Webview Configuration
# Declarative source. The build script generates wbd.data.ts.
# Run: npm run gulp compile-toml
#
# Approach: WorldBankData.jl wraps the World Bank Indicators API (v2), which
# needs NO API key. wdi() returns a table with one row per country-year and
# one column per indicator (dots in the code become underscores). It is
# Tables.jl-compatible, so the code reads columns with Tables.getcolumn and
# never loads a data-frame package itself.

[meta]
title = "World Bank Indicators"
viewType = "pollis.wbd"
defaultModel = "indicator"
models = ["indicator", "compare", "aggregates", "countries", "search"]
illusCollapsed = true
illustrationText = "Pull the World Bank's World Development Indicators into Julia: one series, cross-country comparisons, regional and income-group aggregates, country classifications, and indicator search."

