[[actionGroups]]
id = "exchange"
label = "Exchange Rates"

[[actionGroups.actions]]
id = "ecb-fx-majors"
label = "Major Pairs"
desc = "Download the USD, GBP, and JPY euro reference rates"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"
fx(ccy) = CSV.File(HTTP.get("$base/EXR/D.$ccy.EUR.SP00.A?startPeriod=2020-01-01&format=csvdata").body)

usd = fx("USD")
gbp = fx("GBP")
jpy = fx("JPY")
println(last(Tables.getcolumn(usd, :OBS_VALUE), 5))
"""

[[actionGroups.actions]]
id = "ecb-fx-range"
label = "Date Range"
desc = "Pull USD/EUR between two dates with startPeriod and endPeriod"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"
url  = "$base/EXR/D.USD.EUR.SP00.A?startPeriod=2023-01-01&endPeriod=2023-12-31&format=csvdata"
usd  = CSV.File(HTTP.get(url).body)
println(Tables.getcolumn(usd, :OBS_VALUE))
"""

[[actionGroups]]
id = "rates"
label = "Key Interest Rates"

[[actionGroups.actions]]
id = "ecb-rt-corridor"
label = "Rate Corridor"
desc = "The three key ECB rates that bound the money market"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"
rate(key) = CSV.File(HTTP.get("$base/FM/$key?format=csvdata").body)

mro = rate("B.U2.EUR.4F.KR.MRR_FR.LEV")   # main refinancing
dfr = rate("B.U2.EUR.4F.KR.DFR.LEV")      # deposit facility (floor)
mlf = rate("B.U2.EUR.4F.KR.MLFR.LEV")     # marginal lending (ceiling)
println(last(Tables.getcolumn(mro, :OBS_VALUE), 3))
"""

[[actionGroups.actions]]
id = "ecb-rt-estr"
label = "€STR"
desc = "The euro short-term rate, the ECB's overnight benchmark"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"
# Euro short-term rate, volume-weighted trimmed mean (EST dataflow)
url  = "$base/EST/B.EU000A2X2A25.WT?startPeriod=2023-01-01&format=csvdata"
estr = CSV.File(HTTP.get(url).body)
println(last(Tables.getcolumn(estr, :OBS_VALUE), 5))
"""

