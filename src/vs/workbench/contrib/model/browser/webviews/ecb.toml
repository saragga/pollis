[[codeBranches]]
model = "exchange"
code = """
using HTTP, CSV, Tables

# The ECB Data Portal needs no API key. format=csvdata returns a flat table.
base = "https://data-api.ecb.europa.eu/service/data"

# US dollar / euro reference rate (EXR dataflow), daily
url = "$base/EXR/D.USD.EUR.SP00.A?startPeriod=2015-01-01&format=csvdata"
tbl = CSV.File(HTTP.get(url).body)

# tbl is Tables.jl-compatible: pull only the columns you need
dates = Tables.getcolumn(tbl, :TIME_PERIOD)
rates = Tables.getcolumn(tbl, :OBS_VALUE)
println(last(dates, 5))
println(last(rates, 5))

# ...or pipe it into the container of your choice:
# using TimeSeries, Dates; ta = TimeArray(Date.(dates), rates, [:USD])
# using Tables;            cols = Tables.columntable(tbl)
"""

[[codeBranches]]
model = "rates"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"

# Key ECB interest rates (FM dataflow), daily on business days
fetch(key) = CSV.File(HTTP.get("$base/FM/$key?format=csvdata").body)

mro = fetch("B.U2.EUR.4F.KR.MRR_FR.LEV")   # main refinancing operations
dfr = fetch("B.U2.EUR.4F.KR.DFR.LEV")      # deposit facility
mlf = fetch("B.U2.EUR.4F.KR.MLFR.LEV")     # marginal lending facility

println("Deposit facility rate, latest 5 business days:")
println(last(Tables.getcolumn(dfr, :OBS_VALUE), 5))
"""

[[codeBranches]]
model = "inflation"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"

# HICP, euro area, annual rate of change (ICP dataflow), monthly
url = "$base/ICP/M.U2.N.000000.4.ANR?startPeriod=2010-01&format=csvdata"
hicp = CSV.File(HTTP.get(url).body)

dates = Tables.getcolumn(hicp, :TIME_PERIOD)
infl  = Tables.getcolumn(hicp, :OBS_VALUE)
println(last(dates, 12))
println(last(infl, 12))
"""

[[codeBranches]]
model = "money"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"

# Monetary aggregate M3, annual growth rate (BSI dataflow), monthly
url = "$base/BSI/M.U2.Y.V.M30.X.I.U2.2300.Z01.A?startPeriod=2010-01&format=csvdata"
m3 = CSV.File(HTTP.get(url).body)

println("M3 annual growth, latest 12 months (%):")
println(last(Tables.getcolumn(m3, :OBS_VALUE), 12))
"""

[[codeBranches]]
model = "yields"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"

# AAA euro area government bond yield curve (YC dataflow), 10-year spot, daily
url = "$base/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y?startPeriod=2020-01-01&format=csvdata"
y10 = CSV.File(HTTP.get(url).body)

println("10-year AAA spot yield, latest 5 (% p.a.):")
println(last(Tables.getcolumn(y10, :OBS_VALUE), 5))
"""

