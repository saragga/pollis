[[actionGroups.actions]]
id = "ecb-yc-curve"
label = "Maturities"
desc = "AAA spot rates at the 1, 5, and 10-year maturities"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"
spot(mat) = CSV.File(HTTP.get("$base/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_$mat?startPeriod=2023-01-01&format=csvdata").body)

y1  = spot("1Y")
y5  = spot("5Y")
