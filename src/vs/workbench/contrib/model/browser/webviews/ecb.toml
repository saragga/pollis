println(last(Tables.getcolumn(y10, :OBS_VALUE), 5))
"""

[[actionGroups.actions]]
id = "ecb-yc-slope"
label = "Curve Slope"
desc = "The 10-year minus 2-year spread, a classic recession gauge"
code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"
spot(mat) = CSV.File(HTTP.get("$base/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_$mat?startPeriod=2020-01-01&format=csvdata").body)

y2  = Tables.getcolumn(spot("2Y"),  :OBS_VALUE)
y10 = Tables.getcolumn(spot("10Y"), :OBS_VALUE)
slope = last(y10, 1)[1] - last(y2, 1)[1]
println("10Y - 2Y slope (pp): ", round(slope; digits = 2))
"""
