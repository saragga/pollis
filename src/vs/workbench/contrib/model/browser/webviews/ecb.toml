code = """
using HTTP, CSV, Tables

base = "https://data-api.ecb.europa.eu/service/data"
agg(code) = CSV.File(HTTP.get("$base/BSI/M.U2.Y.V.$code.X.I.U2.2300.Z01.A?startPeriod=2015-01&format=csvdata").body)

