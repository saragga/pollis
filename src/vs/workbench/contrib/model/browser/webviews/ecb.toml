# ECB Data Portal Webview Configuration
# Declarative source. The build script generates ecb.data.ts.
# Run: npm run gulp compile-toml
#
# Approach: the ECB Data Portal exposes a standard SDMX 2.1 REST API at
# https://data-api.ecb.europa.eu/service/ and needs NO API key. We request
# format=csvdata (a flat table) and read it with HTTP.jl + CSV.jl into a
# Tables.jl-compatible table; the user pipes that into TimeSeries
# or any other Tables.jl sink downstream.

[meta]
title = "ECB Data Portal"
viewType = "pollis.ecb"
defaultModel = "exchange"
models = ["exchange", "rates", "inflation", "money", "yields"]
illusCollapsed = true
illustrationText = "Pull euro-area statistics from the ECB Data Portal into Julia: exchange rates, the key ECB interest rates, HICP inflation, monetary aggregates, and the yield curve."

[[packages]]
name = "HTTP.jl"
github = "https://github.com/JuliaWeb/HTTP.jl"

[[packages]]
name = "CSV.jl"
github = "https://github.com/JuliaData/CSV.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "TimeSeries.jl"
github = "https://github.com/JuliaStats/TimeSeries.jl"

