[[codeBranches]]
model = "nuts"
code = '''
using Turing, MCMCChains  # probabilistic programming and chain diagnostics

@model function {{nuts-model}}({{nuts-data}})  # define probabilistic model — replace priors and likelihood as needed
    mu    ~ Normal(0, 1)
    sigma ~ Exponential(1)
    {{nuts-data}} .~ Normal(mu, sigma)  # .~ broadcasts the scalar distribution element-wise over the vector; plain ~ would require a multivariate distribution
end

model = {{nuts-model}}({{nuts-data}})  # instantiate model with observed data

chain = sample(model, NUTS({{nuts-adapt}}, {{nuts-accept}}), MCMCThreads(), {{nuts-n}}, {{nuts-chains}})  # NUTS: {{nuts-adapt}} adaptation steps, target acceptance {{nuts-accept}}, {{nuts-chains}} parallel chains
summarystats(chain)  # mean, std, and R-hat convergence diagnostic per parameter
'''

[[codeBranches]]
model = "hmc"
code = '''
using Turing, MCMCChains  # probabilistic programming and chain diagnostics

@model function {{hmc-model}}({{hmc-data}})  # define probabilistic model — replace priors and likelihood as needed
    mu    ~ Normal(0, 1)
    sigma ~ Exponential(1)
    {{hmc-data}} .~ Normal(mu, sigma)  # .~ broadcasts the scalar distribution element-wise over the vector; plain ~ would require a multivariate distribution
end

model = {{hmc-model}}({{hmc-data}})  # instantiate model with observed data

chain = sample(model, HMC({{hmc-eps}}, {{hmc-L}}), MCMCThreads(), {{hmc-n}}, {{hmc-chains}})  # HMC: step size {{hmc-eps}}, {{hmc-L}} leapfrog steps, {{hmc-chains}} parallel chains
summarystats(chain)  # mean, std, and R-hat convergence diagnostic per parameter
'''

[[codeBranches]]
model = "mh"
code = '''
using Turing, MCMCChains  # probabilistic programming and chain diagnostics

@model function {{mh-model}}({{mh-data}})  # define probabilistic model — replace priors and likelihood as needed
    mu    ~ Normal(0, 1)
    sigma ~ Exponential(1)
    {{mh-data}} .~ Normal(mu, sigma)  # .~ broadcasts the scalar distribution element-wise over the vector; plain ~ would require a multivariate distribution
end

model = {{mh-model}}({{mh-data}})  # instantiate model with observed data

chain = sample(model, MH(), MCMCThreads(), {{mh-n}}, {{mh-chains}})  # Metropolis-Hastings: gradient-free, {{mh-chains}} parallel chains
summarystats(chain)  # mean, std, and R-hat convergence diagnostic per parameter
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "trace-plot"
label = "Trace Plot"
desc = "Plot sampled parameter values over MCMC iterations"
code = '''
using Plots  # plotting library

plot(chain)  # trace plots for all parameters across all chains
'''

[[actionGroups.actions]]
id = "density-plot"
label = "Density Plot"
desc = "Marginal posterior density for each parameter"
code = '''
using StatsPlots  # statistics and plotting

density(chain)  # marginal posterior densities across all chains
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "rhat"
label = "R-hat"
desc = "Gelman-Rubin convergence diagnostic — values near 1.0 indicate convergence"
code = '''
using MCMCChains  # chain diagnostics

summarystats(chain)  # R-hat in the last column — values above 1.01 indicate poor convergence
'''

[[actionGroups.actions]]
id = "ess"
label = "Effective Sample Size"
desc = "Number of independent draws equivalent to the correlated chain"
code = '''
using MCMCChains  # chain diagnostics

ess_rhat(chain)  # bulk and tail effective sample size per parameter
'''

[[actionGroups.actions]]
id = "autocorr"
label = "Autocorrelation"
desc = "Within-chain autocorrelation — slow decay indicates poor mixing"
code = '''
using StatsPlots  # statistics and plotting

autocorplot(chain)  # autocorrelation per parameter and chain — should decay quickly
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "prior-pred"
label = "Prior Predictive"
desc = "Sample from the prior without conditioning on data"
code = '''
using Turing  # probabilistic programming

prior_chain = sample(model, Prior(), 1000)  # draw 1000 samples from the prior predictive distribution
summarystats(prior_chain)  # inspect prior parameter ranges
'''

[[actionGroups.actions]]
id = "post-pred"
label = "Posterior Predictive"
desc = "Generate new observations from the fitted posterior"
code = '''
using Turing  # probabilistic programming

model_pred   = model | get_params(chain)  # condition model on posterior samples
pred_chain   = predict(model_pred, chain)  # generate posterior predictive samples
summarystats(pred_chain)  # inspect predicted observation distribution
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-samplers"
label = "Compare Samplers"
desc = "Run NUTS and Metropolis-Hastings on the same model and compare ESS"
code = '''
using Turing, MCMCChains  # probabilistic programming and chain diagnostics

chain_nuts = sample(model, NUTS(500, 0.65), 1000)  # No-U-Turn Sampler
chain_mh   = sample(model, MH(), 2000)  # Metropolis-Hastings

println("NUTS ESS: ", ess_rhat(chain_nuts))  # compare effective sample size
println("MH ESS:   ", ess_rhat(chain_mh))  # compare effective sample size
'''

[[actionGroups.actions]]
id = "prior-sensitivity"
label = "Prior Sensitivity"
desc = "Vary prior hyperparameters and compare posterior summaries"
code = '''
using Turing, MCMCChains  # probabilistic programming and chain diagnostics

for sigma_prior in [0.5, 1.0, 2.0, 5.0]  # sweep prior standard deviation
    @model function model_v(y)
        mu    ~ Normal(0, sigma_prior)
        sigma ~ Exponential(1)
        y .~ Normal(mu, sigma)
    end
    c = sample(model_v(y), NUTS(), 500)  # sample with current prior
    println("sigma_prior=", sigma_prior, " -> mu mean=", mean(c[:mu]))  # compare posterior means
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "summary"
label = "Summary Statistics"
desc = "Mean, std, and quantiles per parameter across all chains"
code = '''
using MCMCChains  # chain diagnostics

summarystats(chain)  # mean, std, naive SE, MCE, and quantiles
quantile(chain)  # credible intervals: 2.5%, 25%, 50%, 75%, 97.5%
'''

[[actionGroups.actions]]
id = "corner"
label = "Parameter Correlations"
desc = "Pairwise scatter plots of posterior samples"
code = '''
using StatsPlots  # statistics and plotting

corner(chain)  # pairwise posterior scatter and marginal histograms
'''
