# Generalized Extreme Value Distribution Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/gev.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Generalized Extreme Value Distribution"
viewType = "pollis.gev"
defaultModel = "fit"

[[packages]]
name = "Extremes.jl"
github = "https://github.com/jojal5/Extremes.jl"

[requires]
packages = ["Extremes.jl", "Distributions.jl", "Plots.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Quick Start"
file = "gev/tutorial-01-quickstart.ipynb"
bundled = true
description = "Fit a GEV distribution to block maxima and extract parameters"

[[notebookSections.notebooks]]
name = "Parameter Estimation"
file = "gev/tutorial-02-estimation.ipynb"
bundled = true
description = "Maximum likelihood estimation and uncertainty quantification for GEV"

[[notebookSections.notebooks]]
name = "Return Levels"
file = "gev/tutorial-03-returnlevels.ipynb"
bundled = true
description = "Compute and plot return levels from a fitted GEV model"

