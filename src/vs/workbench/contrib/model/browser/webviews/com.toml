[[bullets]]
text = "Raw Counts"
detail = "C(w, c) counts how often word w occurs within the window around context word c, from the TextAnalysis.jl CooMatrix"

[[bullets]]
text = "PPMI"
detail = "Positive PMI keeps only above-chance associations and sets the rest to zero; the usual weighting for word vectors"

[[bullets]]
text = "PMI"
detail = "log of p(w, c) / (p(w) p(c)): positive above chance, negative below; unobserved pairs (PMI of minus infinity) are left empty"

[[bullets]]
text = "Context smoothing"
detail = "raising context counts to the power alpha = 0.75 reduces the bias of PMI towards rare words (Levy, Goldberg and Dagan 2015)"

[[inputs]]
id = "corpus"
label = "Corpus"
tooltip = "A vector of strings, one per sentence or document. The default docs is a small built-in corpus defined in the code; replace it with your own vector."
default = "docs"

[[inputs]]
id = "window"
label = "Window Size"
tooltip = "Number of tokens on each side of a word that count as its context, after stopwords and punctuation are removed."
default = "2"

[[inputs]]
id = "min_count"
label = "Minimum Count"
tooltip = "Words seen fewer times than this in the corpus are left out of the matrix. PMI is unreliable for rare words, so a minimum count of 2 or more helps on small corpora."
default = "2"

[[inputs]]
id = "normalize"
label = "Distance Weighting"
tooltip = "Whether each co-occurrence counts 1, or 1/d for words d positions apart (the normalize keyword of CooMatrix)."
default = "false"
kind = "select"

[[inputs.options]]
value = "false"
label = "None (Counts)"

[[inputs.options]]
value = "true"
label = "Harmonic (1/d)"

[[inputs]]
id = "alpha"
label = "Context Smoothing"
tooltip = "Exponent alpha applied to context counts in PMI and PPMI. 1 gives plain PMI; 0.75 reduces the bias towards rare context words."
default = "0.75"

[[inputs]]
id = "query"
label = "Query Word"
tooltip = "A Julia string with a word from the corpus vocabulary, after lowercasing. Used for nearest neighbours and the word-level actions."
default = "\"coffee\""

[[inputs]]
id = "k"
label = "Neighbours"
tooltip = "Number of nearest neighbours or top entries to show."
default = "5"

[[codeBranches]]
model = "raw"
code = '''
using TextAnalysis, SparseArrays, LinearAlgebra  # CooMatrix and preprocessing; sparse matrices; norms

# Built-in corpus: four topics with shared contexts (drinks, pets, finance, rivers); bank appears in two senses
docs = [
    "she drinks hot coffee every morning",
    "he drinks hot tea every evening",
    "a cup of strong coffee with milk",
    "a cup of green tea with honey",
    "coffee beans are roasted and ground",
    "tea leaves are dried and brewed",
    "they ordered coffee at the cafe",
    "they ordered tea at the cafe",
    "the cat chased a small mouse",
    "the dog chased a red ball",
    "the cat sleeps on the warm sofa",
    "the dog sleeps on the warm rug",
    "feed the hungry cat in the kitchen",
    "feed the hungry dog in the garden",
    "the vet examined the sick cat",
    "the vet examined the old dog",
    "the bank raised interest rates",
    "the central bank cut interest rates",
    "investors bought shares in the bank",
    "investors sold shares after the report",
    "the market fell as rates rose",
    "the market rallied as rates fell",
    "they walked along the river bank",
    "the boat drifted down the river",
    "fish swim in the cold river",
    "the fisherman sat on the bank of the river",
]

flags = strip_case | strip_punctuation | strip_numbers | strip_stopwords  # lowercase; drop punctuation, numbers and stopwords
crps  = Corpus(StringDocument.({{corpus}}))
prepare!(crps, flags)
update_lexicon!(crps)
vocab = sort([t for (t, n) in lexicon(crps) if n >= {{min_count}}])  # words seen at least min_count times

# mode = :directional counts each pair of positions once and still returns a symmetric matrix;
# the default mode counts every pair twice
coo   = CooMatrix(crps, vocab; window = {{window}}, normalize = {{normalize}}, mode = :directional)
C     = coom(coo)  # sparse word x context counts
terms = coo.terms  # row and column labels, in matrix order
index = coo.column_indices  # word => row

# PMI = log p(w, c) / (p(w) p(c)) on the observed pairs, with context counts raised to alpha;
# unobserved pairs (PMI of minus infinity) stay empty
function pmi_matrix(C; alpha = 0.75, positive = true)
    I, J, V = findnz(C)
    total = sum(V)
    pw = vec(sum(C; dims = 2)) ./ total
    cc = vec(sum(C; dims = 1)) .^ alpha
    pc = cc ./ sum(cc)
    vals = [log((v / total) / (pw[i] * pc[j])) for (i, j, v) in zip(I, J, V)]
    positive && (vals = max.(vals, 0.0))
    M = sparse(I, J, vals, size(C)...)
    return positive ? dropzeros(M) : M
end

# Cosine similarity of the row of word to every other row of W, top k
function neighbours(W, word; k = {{k}})
    haskey(index, word) || error("not in the vocabulary: " * word)
    X = Matrix(W)
    i = index[word]
    nrm = map(norm, eachrow(X))
    sims = (X * X[i, :]) ./ (nrm .* nrm[i] .+ eps())
    sims[i] = -Inf
    top = first(sortperm(sims; rev = true), k)
    return [(terms[j], sims[j]) for j in top]
end

W = C  # raw counts as word vectors

println(length(terms), " words kept (minimum count {{min_count}}), ", nnz(triu(C, 1)), " distinct co-occurring pairs")
println("Nearest neighbours of ", {{query}}, " by cosine similarity:")
for (w, s) in neighbours(W, {{query}})
    println("  ", rpad(w, 12), round(s; digits = 3))
end
'''

