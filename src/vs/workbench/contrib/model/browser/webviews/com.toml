[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "heatmap"
label = "Co-Occurrence Heatmap"
desc = "Heatmap of the current matrix for the 20 most frequent words, labelled by word"
code = '''
using Plots

freq = [lexicon(crps)[t] for t in terms]
top  = sort(first(sortperm(freq; rev = true), min(20, length(terms))))
heatmap(terms[top], terms[top], Matrix(W[top, top]); xrotation = 60, color = :Blues,
    title = "Co-occurrence, window {{window}}", size = (700, 600))
'''

[[actionGroups.actions]]
id = "word-similarity"
label = "Word Similarity Plot"
desc = "Cosine similarity between the PPMI vectors of the 20 most frequent words"
code = '''
using Plots

P    = Matrix(pmi_matrix(C; alpha = {{alpha}}))
freq = [lexicon(crps)[t] for t in terms]
top  = sort(first(sortperm(freq; rev = true), min(20, length(terms))))
X    = P[top, :] ./ (map(norm, eachrow(P[top, :])) .+ eps())
heatmap(terms[top], terms[top], X * transpose(X); xrotation = 60, color = :RdBu, clims = (-1, 1),
    title = "PPMI cosine similarity", size = (700, 600))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "sparsity"
label = "Matrix Sparsity"
desc = "Vocabulary kept by the minimum count, density of the matrix and how many words have no context"
code = '''
n = length(terms)
println("Words in the corpus: ", length(lexicon(crps)), ", kept with count >= {{min_count}}: ", n)
println("Non-zero cells: ", nnz(C), " of ", n * n, ", density ", round(nnz(C) / (n * n); digits = 4))
empty = terms[vec(sum(C; dims = 2)) .== 0]
println("Words with no context in the window: ", isempty(empty) ? "none" : join(empty, ", "))
'''

[[actionGroups.actions]]
id = "top-pairs"
label = "Top Co-Occurring Pairs"
desc = "Word pairs with the highest counts, each pair once and without the diagonal, with their PPMI"
code = '''
P = pmi_matrix(C; alpha = {{alpha}})
I, J, V = findnz(triu(C, 1))  # upper triangle: each unordered pair once, no self pairs
for t in first(sortperm(V; rev = true), min(10, length(V)))
    println(rpad(terms[I[t]] * " + " * terms[J[t]], 26), "count = ", round(V[t]; digits = 2), "  ppmi = ", round(P[I[t], J[t]]; digits = 3))
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "nearest-neighbours"
label = "Nearest Neighbours"
desc = "Top-k words most similar to the query word, with raw counts and with PPMI vectors"
code = '''
P = pmi_matrix(C; alpha = {{alpha}})
for (name, M) in (("raw counts", C), ("PPMI", P))
    println(name, ": ", join([w * " (" * string(round(s; digits = 2)) * ")" for (w, s) in neighbours(M, {{query}})], ", "))
end
'''

[[actionGroups.actions]]
id = "apply-new-doc"
label = "Apply to New Sentence"
desc = "Represent a new sentence as the mean PPMI vector of its known words and find the closest words"
code = '''
new_text = "a cup of hot tea with lemon"  # replace with your own sentence
d = StringDocument(new_text)
prepare!(d, flags)
known = filter(w -> haskey(index, w), tokens(d))
isempty(known) && error("no word of the sentence is in the vocabulary")
P = Matrix(pmi_matrix(C; alpha = {{alpha}}))
v = vec(sum(P[[index[w] for w in known], :]; dims = 1)) ./ length(known)
sims = (P * v) ./ (map(norm, eachrow(P)) .* norm(v) .+ eps())
println("Known words: ", join(known, ", "))
for j in first(sortperm(sims; rev = true), {{k}})
    println("  ", rpad(terms[j], 12), round(sims[j]; digits = 3))
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "raw-vs-ppmi"
label = "Raw vs. PPMI"
desc = "Contexts of the query word ranked by raw count and by PPMI, side by side"
code = '''
P = pmi_matrix(C; alpha = {{alpha}})
i = index[{{query}}]
by_count = first(sortperm(Vector(C[i, :]); rev = true), {{k}})
by_ppmi  = first(sortperm(Vector(P[i, :]); rev = true), {{k}})
println(rpad("by count", 28), "by PPMI")
for (a, b) in zip(by_count, by_ppmi)
    println(rpad(terms[a] * " " * string(round(C[i, a]; digits = 2)), 28), terms[b], " ", round(P[i, b]; digits = 3))
end
'''

[[actionGroups.actions]]
id = "window-sizes"
label = "Compare Window Sizes"
desc = "PPMI nearest neighbours of the query word with windows of 1, 2 and 5"
code = '''
for w in (1, 2, 5)
    Cw = coom(CooMatrix(crps, vocab; window = w, normalize = {{normalize}}, mode = :directional))
    nb = neighbours(pmi_matrix(Cw; alpha = {{alpha}}), {{query}})
    println("window ", w, " (density ", round(nnz(Cw) / length(Cw); digits = 3), "): ", join(first.(nb), ", "))
end
'''

[[actionGroups.actions]]
id = "smoothing"
label = "Context Smoothing"
desc = "Top PPMI pairs with alpha = 1 and with the chosen alpha, with the corpus count of each word"
code = '''
cnt(t) = lexicon(crps)[t]
for a in (1.0, {{alpha}})
    I, J, V = findnz(triu(pmi_matrix(C; alpha = a), 1))
    top = first(sortperm(V; rev = true), min(8, length(V)))
    println("alpha = ", a, ": ", join([terms[I[t]] * "+" * terms[J[t]] * " (" * string(cnt(terms[I[t]])) * "," * string(cnt(terms[J[t]])) * ")" for t in top], "  "))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "pmi-interpretation"
label = "PMI Interpretation"
desc = "Strongest and weakest observed associations of the query word, as how many times more often than chance they co-occur"
code = '''
P = pmi_matrix(C; alpha = {{alpha}}, positive = false)
i = index[{{query}}]
J, V = findnz(P[i, :])
order = sortperm(V; rev = true)
for (label, sel) in (("above chance", first(order, {{k}})), ("least above or below chance", last(order, min({{k}}, length(order)))))
    println(label, ":")
    for t in sel
        println("  ", rpad(terms[J[t]], 12), "pmi = ", round(V[t]; digits = 3), ", ", round(exp(V[t]); digits = 2), " times chance")
    end
end
'''

[[actionGroups.actions]]
id = "row-vector"
label = "Word Vector"
desc = "The PPMI vector of the query word: its non-zero contexts and weights"
code = '''
P = pmi_matrix(C; alpha = {{alpha}})
J, V = findnz(P[index[{{query}}], :])
println("Length ", length(terms), ", non-zero ", length(V))
for t in sortperm(V; rev = true)
    println("  ", rpad(terms[J[t]], 12), round(V[t]; digits = 3))
end
'''
