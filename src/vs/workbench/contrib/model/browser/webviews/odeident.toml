# Structural Identifiability of ODEs Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/odeident.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Structural Identifiability of ODEs"
viewType = "pollis.odeident"
defaultModel = "struct"
decisionFirstColumn = "Question"

[[packages]]
name = "StructuralIdentifiability.jl"
github = "https://github.com/SciML/StructuralIdentifiability.jl"

[requires]
packages = ["StructuralIdentifiability.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Identifiability"
file = "ode/tutorial-04-identifiability.ipynb"
bundled = true
description = "Structural identifiability with StructuralIdentifiability.jl against practical identifiability from profiles"

[[wikis]]
name = "Factsheet"
file = "odeident/factsheet.md"
bundled = true

[[wikis]]
name = "Overview"
file = "odeident/overview.md"
bundled = true

[[wikis]]
separator = true
label = "Methods"

[[wikis]]
name = "Identifiability"
file = "odeident/identifiability.md"
bundled = true

[[references]]
separator = true
label = "Software"

[[references]]
key = "DGHP2023a"

[[references]]
key = "BM2020a"

[[references]]
separator = true
label = "Original Papers"

[[references]]
