# Event Studies Webview Configuration
# A page in the Minimal style of the scaffold, not a panel: Learn More and Powered by. `pageCommand`
# is the command that opens it, which a panel's contribution file would say. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/eventStudies.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Event Studies"
viewType = "pollis.eventStudies"
pageCommand = "pollis.eventStudies.show"

[[packages]]
name = "PollisEventStudies.jl"
github = "https://github.com/Trumpingtons/PollisEventStudies.jl"

[[packages]]
name = "MixedModels.jl"
github = "https://github.com/JuliaStats/MixedModels.jl"

[[wikis]]
name = "Factsheet"
file = "eventStudies/factsheet.md"
bundled = true

[[wikis]]
name = "Overview"
file = "eventStudies/overview.md"
bundled = true

[[wikis]]
name = "Market Event Studies"
file = "eventStudies/market-event-studies.md"
bundled = true

[[wikis]]
name = "Panel Event Studies"
file = "eventStudies/panel-event-studies.md"
bundled = true

[[wikis]]
name = "Stepped Wedge"
file = "eventStudies/stepped-wedge.md"
bundled = true

[[wikis]]
name = "FOMC Releases"
file = "eventStudies/fomc-releases.md"
bundled = true

