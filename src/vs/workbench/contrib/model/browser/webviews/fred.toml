[[codeBranches]]
model = "growth"
code = """
using FredData

# Fred() reads ENV["FRED_API_KEY"] (or ~/.freddatarc) automatically.
# Use the "Set API key" link above the page to store yours securely.
f = Fred()

# Real Gross Domestic Product (GDPC1), quarterly, chained 2017 dollars
gdp = get_data(f, "GDPC1")
println(gdp.data)

# Industrial Production index (INDPRO), monthly
indpro = get_data(f, "INDPRO")
println(indpro.title, ": ", indpro.units)
"""

[[codeBranches]]
model = "inflation"
code = """
using FredData

f = Fred()

# Consumer Price Index, all items (CPIAUCSL), as a year-over-year percent change
cpi = get_data(f, "CPIAUCSL"; units="pc1")
println(cpi.data)

# Core PCE price index (PCEPILFE), the Fed's preferred inflation gauge
core_pce = get_data(f, "PCEPILFE"; units="pc1")
println(core_pce.data)
"""

[[codeBranches]]
model = "labor"
code = """
using FredData

f = Fred()

# Civilian unemployment rate (UNRATE), monthly, percent
unrate = get_data(f, "UNRATE")
println(unrate.data)

# Total nonfarm payroll employment (PAYEMS), monthly change in thousands
payrolls = get_data(f, "PAYEMS"; units="chg")
println(payrolls.data)
"""

[[codeBranches]]
model = "rates"
code = """
using FredData

f = Fred()

# Effective federal funds rate (FEDFUNDS), monthly
funds = get_data(f, "FEDFUNDS")
println(funds.data)

# 10-year minus 2-year treasury spread (T10Y2Y): the classic yield-curve gauge
spread = get_data(f, "T10Y2Y")
println(spread.data)
"""

[[codeBranches]]
model = "money"
code = """
using FredData

f = Fred()

# M2 money stock (M2SL), monthly, billions of dollars
m2 = get_data(f, "M2SL")
println(m2.data)

# U.S. / Euro foreign-exchange rate (DEXUSEU), daily
fx = get_data(f, "DEXUSEU")
println(fx.data)
"""

# Next Steps action groups (task-oriented, matched to the FredData.jl workflow)
[[actionGroups]]
id = "growth"
label = "Output & Growth"

[[actionGroups.actions]]
id = "fred-gr-gdp"
label = "Real GDP"
desc = "Download quarterly real GDP and convert to annualised growth"
code = """
using FredData

f = Fred()

# Real GDP (GDPC1), quarterly. units="pca" = compounded annual rate of change
gdp_growth = get_data(f, "GDPC1"; units="pca")
println(gdp_growth.data)
"""

[[actionGroups.actions]]
id = "fred-gr-indpro"
label = "Industrial Production"
desc = "Pull the industrial production index over a date range"
code = """
using FredData

f = Fred()

indpro = get_data(f, "INDPRO"; observation_start="2000-01-01")
println(indpro.data)
"""

[[actionGroups.actions]]
id = "fred-gr-recession"
label = "Recession Bars"
desc = "Fetch the NBER recession indicator to shade plots"
code = """
using FredData

f = Fred()

# USREC = 1 during NBER-dated recessions, 0 otherwise
recession = get_data(f, "USREC")
println(recession.data)
"""

[[actionGroups]]
id = "inflation"
label = "Inflation & Prices"

[[actionGroups.actions]]
id = "fred-inf-cpi"
label = "CPI Inflation"
desc = "Headline and core CPI as year-over-year inflation"
code = """
using FredData

f = Fred()

cpi      = get_data(f, "CPIAUCSL"; units="pc1")
core_cpi = get_data(f, "CPILFESL"; units="pc1")
println(cpi.data)
println(core_cpi.data)
"""

[[actionGroups.actions]]
id = "fred-inf-pce"
label = "PCE Inflation"
desc = "The Fed's preferred PCE and core-PCE price measures"
code = """
using FredData

f = Fred()

pce      = get_data(f, "PCEPI"; units="pc1")
core_pce = get_data(f, "PCEPILFE"; units="pc1")
println(pce.data)
println(core_pce.data)
"""

[[actionGroups]]
id = "labor"
label = "Labour Market"

[[actionGroups.actions]]
id = "fred-lab-unrate"
label = "Unemployment"
desc = "Pull the unemployment rate and labour-force participation"
code = """
using FredData

f = Fred()

unrate  = get_data(f, "UNRATE")
partcip = get_data(f, "CIVPART")
println(unrate.data)
println(partcip.data)
"""

[[actionGroups.actions]]
id = "fred-lab-claims"
label = "Jobless Claims"
desc = "Fetch weekly initial unemployment claims"
code = """
using FredData

f = Fred()

# Initial claims (ICSA), weekly, seasonally adjusted
claims = get_data(f, "ICSA")
println(claims.data)
"""

[[actionGroups]]
id = "rates"
label = "Interest Rates"

[[actionGroups.actions]]
id = "fred-rt-curve"
label = "Yield Curve"
desc = "Download the 2-year and 10-year treasury yields"
code = """
using FredData

f = Fred()

dgs2  = get_data(f, "DGS2")
dgs10 = get_data(f, "DGS10")
println(dgs2.data)
println(dgs10.data)
"""

[[actionGroups.actions]]
id = "fred-rt-mortgage"
label = "Mortgage Rate"
desc = "Pull the 30-year fixed mortgage rate"
code = """
using FredData

f = Fred()

mortgage = get_data(f, "MORTGAGE30US")
println(mortgage.data)
"""

[[actionGroups]]
id = "money"
label = "Money & Exchange"

[[actionGroups.actions]]
id = "fred-mn-m2"
label = "Money Supply"
desc = "Pull the M2 money stock as a year-over-year growth rate"
code = """
using FredData

f = Fred()

m2 = get_data(f, "M2SL"; units="pc1")
println(m2.data)
"""

[[actionGroups.actions]]
id = "fred-mn-fx"
label = "Exchange Rates"
desc = "Download a bilateral USD exchange-rate series"
code = """
using FredData

f = Fred()

# U.S. dollars to one euro (DEXUSEU), daily
fx = get_data(f, "DEXUSEU")
println(fx.data)
"""
