# FRED (FredData.jl) Webview Configuration
# Declarative source. The build script generates fred.data.ts.
# Run: npm run gulp compile-toml

[meta]
title = "Federal Reserve Economic Data"
viewType = "pollis.fred"
defaultModel = "growth"
models = ["growth", "inflation", "labor", "rates", "money"]
illusCollapsed = true
illustrationText = "Pull U.S. and international macroeconomic time series from FRED into Julia: output and growth, inflation, the labour market, interest rates, and money and exchange rates."

[[packages]]
name = "FredData.jl"
github = "https://github.com/micahjsmith/FredData.jl"

[[packages]]
name = "TimeSeries.jl"
github = "https://github.com/JuliaStats/TimeSeries.jl"

[[notebookSections]]
label = "FRED"

[[notebookSections.notebooks]]
name = "First Series"
file = "fred/tutorial-01-first-series.ipynb"
bundled = true
description = "Connect with an API key and pull your first series (real GDP) as a table of dates and values"

[[notebookSections.notebooks]]
name = "Transformations"
file = "fred/tutorial-02-transformations.ipynb"
bundled = true
description = "Resample frequency and apply units: levels, year-over-year, and percent change"

[[notebookSections.notebooks]]
name = "Vintages and Revisions"
file = "fred/tutorial-03-vintages.ipynb"
bundled = true
description = "Fetch real-time vintages with vintage_dates to study data revisions (ALFRED)"

[[notebookSections.notebooks]]
name = "Building a Dashboard"
file = "fred/tutorial-04-dashboard.ipynb"
bundled = true
description = "Combine several series (rates, inflation, unemployment) into one tidy frame and plot"

[[wikis]]
name = "Factsheet"
file = "fred/factsheet.md"
bundled = true
description = "Quick-reference: FredData.jl API, get_data keywords, and the free API key"

[[wikis]]
name = "Overview"
file = "fred/overview.md"
bundled = true
description = "Accessing the 800,000+ FRED time series from Julia by series ID"

[[wikis]]
name = "Authentication"
file = "fred/authentication.md"
bundled = true
description = "Get a free FRED API key and store it securely with the Set API key link"

[[wikis]]
name = "Finding Series"
file = "fred/finding-series.md"
bundled = true
description = "Browse categories, releases, and popular series; copy a series ID from the FRED site"

[[wikis]]
name = "Transformations"
file = "fred/transformations.md"
bundled = true
description = "Units and frequency: levels, percent change, year-over-year, aggregation methods"

[[wikis]]
name = "Interpretation"
file = "fred/interpretation.md"
bundled = true
description = "Reading the FredSeries fields, seasonal adjustment, real vs nominal, and vintages"

[[references]]
title = "FredData.jl: A Julia interface to the St. Louis Fed FRED API"
authors = "Smith, Micah J.; contributors"
year = 2024
journal = "GitHub"
url = "https://github.com/micahjsmith/FredData.jl"
openAccess = true

[[references]]
title = "FRED API Documentation"
authors = "Federal Reserve Bank of St. Louis"
year = 2024
journal = "fred.stlouisfed.org"
url = "https://fred.stlouisfed.org/docs/api/fred/"
openAccess = true

[[references]]
title = "Julia: A Fresh Approach to Numerical Computing"
authors = "Bezanson, Jeff; Edelman, Alan; Karpinski, Stefan; Shah, Viral B."
year = 2017
journal = "SIAM Review"
doi = "10.1137/141000671"
openAccess = false

[[bullets]]
text = "Output & Growth"
detail = "real and nominal GDP, industrial production, and other activity series"

[[bullets]]
text = "Inflation & Prices"
detail = "the Consumer Price Index, core CPI, and the PCE price index"

[[bullets]]
text = "Labour Market"
detail = "the unemployment rate, nonfarm payrolls, participation, and jobless claims"

[[bullets]]
text = "Interest Rates"
detail = "the federal funds rate, treasury yields, the yield curve, and mortgage rates"

[[bullets]]
text = "Money & Exchange"
detail = "the M2 money stock and bilateral exchange rates"

[[decisionRows]]
task = "Output & Growth"
context = "Activity"
purpose = "Chart real GDP or industrial production over time"

[[decisionRows]]
task = "Inflation & Prices"
context = "Price level"
purpose = "Read CPI or PCE inflation, in levels or year-over-year"

[[decisionRows]]
task = "Labour Market"
context = "Jobs"
purpose = "Track unemployment, payrolls, or weekly jobless claims"

[[decisionRows]]
task = "Interest Rates"
context = "Yields"
purpose = "Follow the policy rate, treasury yields, or the yield curve"

[[decisionRows]]
task = "Money & Exchange"
context = "Monetary"
purpose = "Pull the M2 money stock or an exchange-rate series"

