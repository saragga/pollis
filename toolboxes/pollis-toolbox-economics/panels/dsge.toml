[[inputs]]
id = "custom"
label = "Custom DSGE"
tooltip = "Name for your own @model object. The code defines a small RBC model with a technology shock and a government spending shock under this name as a starting point."
default = "MyModel"
when = "dsgemodel=custom"

[[inputs]]
id = "shock"
label = "Shock"
tooltip = "Shock for the impulse responses. Omit the leading colon; it is added automatically. The custom model has eps_z (technology) and eps_g (government spending); get_shocks(dsge) lists the shocks of a library model."
default = "eps_z"
models = ["irf"]

[[inputs]]
id = "periods"
label = "Periods"
tooltip = "Number of periods for the impulse response function. Typically 20-60 periods depending on data frequency."
default = "40"
models = ["irf"]

[[inputs]]
id = "data"
label = "Data"
tooltip = "simulated: estimate on 200 quarters simulated from the model at its calibration, so the true parameter values are known. Otherwise the Julia name of a KeyedArray (Variables x Periods, in levels) whose variable names match the model."
default = "simulated"
models = ["est"]

[[inputs]]
id = "obs"
label = "Observables"
tooltip = "Comma-separated model variables used as data. Use at most as many observables as shocks, or the likelihood is singular. Library models have their own names: get_variables(dsge) lists them."
default = "q, c"
models = ["est"]

[[inputs]]
id = "estparams"
label = "Estimated Parameters"
tooltip = "Comma-separated parameters to estimate; the others stay at their calibrated values. get_parameters(dsge) lists them."
default = "rho, rho_g, std_z, std_g"
models = ["est"]

[[inputs]]
id = "sampler"
label = "Sampler"
tooltip = "Gradient-based MCMC sampler: NUTS (No-U-Turn Sampler, recommended) or HMC (Hamiltonian Monte Carlo with a fixed step size)."
kind = "select"
default = "NUTS"
models = ["est"]

[[inputs.options]]
value = "NUTS"
label = "NUTS"

[[inputs.options]]
value = "HMC"
label = "HMC"

[[inputs]]
id = "draws"
label = "Draws"
tooltip = "Number of posterior draws retained after burn-in. Minimum 500; 1000-2000 is standard for stable estimates."
default = "1000"
models = ["est"]

[[inputs]]
id = "burnin"
label = "Burn-in"
tooltip = "Initial draws discarded. For NUTS these are the step-size adaptation draws; for HMC they let the chain reach the posterior."
default = "200"
models = ["est"]

[[inputs]]
id = "order"
label = "Solution Order"
tooltip = "Perturbation solution used for the moments: first order (linear) or pruned second or third order, which capture nonlinear effects such as precautionary saving."
