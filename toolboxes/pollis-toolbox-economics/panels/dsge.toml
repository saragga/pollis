label = "Steady State"
desc = "Non-stochastic steady state, and the stochastic steady state that accounts for risk at second order"
code = '''
using MacroModelling

{{?dsgemodel=custom}} dsge = {{custom}}  # your model object, defined by the main code
{{?dsgemodel!=custom}} isdefined(Main, :{{dsgemodel}}) || include(joinpath(pkgdir(MacroModelling), "models", "{{dsgemodel}}.jl"))  # load from the model library once
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library
ss = get_steady_state(dsge, derivatives = false)  # non-stochastic steady state of every variable
display(ss)

sss = get_steady_state(dsge, stochastic = true, derivatives = false)  # where the economy settles with shocks expected but not realised
display(sss)
'''

[[actionGroups.actions]]
id = "blanchard_kahn"
label = "Saddle-Path Stability"
desc = "Check that a unique stable first-order solution exists (the Blanchard-Kahn conditions) and how persistent its state dynamics are"
code = '''
using MacroModelling, LinearAlgebra

{{?dsgemodel=custom}} dsge = {{custom}}  # your model object, defined by the main code
{{?dsgemodel!=custom}} isdefined(Main, :{{dsgemodel}}) || include(joinpath(pkgdir(MacroModelling), "models", "{{dsgemodel}}.jl"))  # load from the model library once
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library
solved = get_solution(dsge, dsge.parameter_values)[3]  # true if a unique stable first-order solution was found
println("Unique stable solution: ", solved)  # false: indeterminacy or no stable solution (Blanchard-Kahn fails)

sol = get_solution(dsge)  # rows: steady state, lagged states, shocks; columns: variables
states = get_state_variables(dsge)
cols = [findfirst(==(s), string.(axiskeys(sol, 2))) for s in states]
A = Matrix(sol[2:length(states)+1, cols])  # state transition (transposed; the eigenvalues are the same)
println("States: ", length(states), "  jump variables: ", length(get_jump_variables(dsge)))
println("Largest root of the state transition: ", round(maximum(abs.(eigvals(A))), digits = 4))  # below 1: shocks die out
'''

