# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

[miniCharts.mom]
# Bars of model-implied standard deviations
svg = '''
var h = [30, 18, 38, 24, 12];
var s = '<line x1="4" y1="66" x2="50" y2="66" stroke="currentColor" stroke-width="0.8" opacity="0.6"/>';
for (var i = 0; i < h.length; i++) { s += '<rect x="' + (7 + i * 9) + '" y="' + (66 - h[i]) + '" width="6" height="' + h[i] + '" fill="currentColor" opacity="' + (i === 2 ? 0.9 : 0.5) + '"/>'; }
return s;
'''

[miniCharts.est]
# Prior (faint) updated to a sharper posterior density
svg = '''
function curve(mu, sd, amp) {
	var d = '';
	for (var i = 0; i <= 44; i++) { var x = 5 + i; d += (i ? 'L' : 'M') + x + ',' + (66 - amp * Math.exp(-0.5 * Math.pow((x - mu) / sd, 2))).toFixed(1); }
	return d;
}
return '<path d="' + curve(27, 11, 16) + '" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4" stroke-dasharray="2,2"/><path d="' + curve(31, 4.5, 40) + '" fill="none" stroke="currentColor" stroke-width="1.5"/>';
'''

[miniCharts.irf]
# Response to a shock decaying back to steady state
svg = '''
var s = '<line x1="4" y1="56" x2="50" y2="56" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.6"/>';
var d = '', e = '';
for (var i = 0; i <= 40; i++) {
	d += (i ? 'L' : 'M') + (7 + i) + ',' + (56 - 32 * Math.exp(-i / 8)).toFixed(1);
	e += (i ? 'L' : 'M') + (7 + i) + ',' + (56 - 18 * (Math.exp(-i / 14) - Math.exp(-i / 3))).toFixed(1);
}
return s + '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="' + e + '" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>';
'''

[[codeBranches]]
model = "mom"
code = '''
using MacroModelling, StatsPlots

{{?dsgemodel=custom}} @model {{custom}} begin
{{?dsgemodel=custom}}     1 / c[0] = (beta / c[1]) * (alpha * exp(z[1]) * k[0]^(alpha - 1) + (1 - delta))
{{?dsgemodel=custom}}     c[0] + k[0] + g[0] = (1 - delta) * k[-1] + q[0]  # output is consumed, invested or bought by the government
{{?dsgemodel=custom}}     q[0] = exp(z[0]) * k[-1]^alpha
{{?dsgemodel=custom}}     z[0] = rho * z[-1] + std_z * eps_z[x]  # technology shock
{{?dsgemodel=custom}}     g[0] = (1 - rho_g) * g_bar + rho_g * g[-1] + std_g * eps_g[x]  # government spending shock
{{?dsgemodel=custom}} end
{{?dsgemodel=custom}}
{{?dsgemodel=custom}} @parameters {{custom}} begin
{{?dsgemodel=custom}}     std_z = 0.01
{{?dsgemodel=custom}}     rho = 0.95  # quarterly TFP persistence: shocks have a half-life of about 3.5 years
{{?dsgemodel=custom}}     std_g = 0.008  # a one standard deviation shock moves spending by 1%
{{?dsgemodel=custom}}     rho_g = 0.9
{{?dsgemodel=custom}}     g_bar = 0.8  # steady-state spending: about 20% of output
{{?dsgemodel=custom}}     delta = 0.02
{{?dsgemodel=custom}}     alpha = 0.36  # capital share of income
{{?dsgemodel=custom}}     beta = 0.99  # quarterly discount factor: about 4% a year
{{?dsgemodel=custom}} end
{{?dsgemodel=custom}}
{{?dsgemodel=custom}} dsge = {{custom}}  # your model object
{{?dsgemodel!=custom}} include(joinpath(pkgdir(MacroModelling), "models", "{{dsgemodel}}.jl"))  # load the model and its calibration from the package library
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library

moments = get_moments(dsge, algorithm = :{{order}}, derivatives = false)  # model-implied moments, no parameter derivatives
moments[:standard_deviation]  # standard deviation of every variable

var_dec = get_variance_decomposition(dsge)  # first-order share of each shock in the variance of each variable (rows sum to 1)

autocorr = get_autocorrelation(dsge, algorithm = :{{order}})  # rows: variables; columns: lags 1 to 5
'''

[[codeBranches]]
model = "est"
code = '''
using MacroModelling, StatsPlots, Statistics
import Turing  # MacroModelling estimates through Turing: priors plus the Kalman filter likelihood

{{?dsgemodel=custom}} @model {{custom}} begin
{{?dsgemodel=custom}}     1 / c[0] = (beta / c[1]) * (alpha * exp(z[1]) * k[0]^(alpha - 1) + (1 - delta))
{{?dsgemodel=custom}}     c[0] + k[0] + g[0] = (1 - delta) * k[-1] + q[0]  # output is consumed, invested or bought by the government
{{?dsgemodel=custom}}     q[0] = exp(z[0]) * k[-1]^alpha
{{?dsgemodel=custom}}     z[0] = rho * z[-1] + std_z * eps_z[x]  # technology shock
{{?dsgemodel=custom}}     g[0] = (1 - rho_g) * g_bar + rho_g * g[-1] + std_g * eps_g[x]  # government spending shock
{{?dsgemodel=custom}} end
{{?dsgemodel=custom}}
{{?dsgemodel=custom}} @parameters {{custom}} begin
{{?dsgemodel=custom}}     std_z = 0.01
{{?dsgemodel=custom}}     rho = 0.95  # quarterly TFP persistence: shocks have a half-life of about 3.5 years
{{?dsgemodel=custom}}     std_g = 0.008  # a one standard deviation shock moves spending by 1%
{{?dsgemodel=custom}}     rho_g = 0.9
{{?dsgemodel=custom}}     g_bar = 0.8  # steady-state spending: about 20% of output
{{?dsgemodel=custom}}     delta = 0.02
{{?dsgemodel=custom}}     alpha = 0.36  # capital share of income
{{?dsgemodel=custom}}     beta = 0.99  # quarterly discount factor: about 4% a year
{{?dsgemodel=custom}} end
{{?dsgemodel=custom}}
{{?dsgemodel=custom}} dsge = {{custom}}  # your model object
{{?dsgemodel!=custom}} include(joinpath(pkgdir(MacroModelling), "models", "{{dsgemodel}}.jl"))  # load the model and its calibration from the package library
{{?dsgemodel!=custom}} dsge = {{dsgemodel}}  # model from the MacroModelling.jl model library

observables = Symbol.(strip.(split("{{obs}}", ",")))  # at most as many observables as shocks
{{?data=simulated}} data = simulate(dsge, periods = 200)(observables, :, :simulate)  # 200 quarters simulated at the calibration, in levels
{{?data!=simulated}} data = {{data}}(observables, :)  # your KeyedArray: Variables x Periods, in levels

# Parameters to estimate; the rest stay at their calibrated values
est_names = Symbol.(strip.(split("{{estparams}}", ",")))
idx = [findfirst(==(p), Symbol.(get_parameters(dsge))) for p in est_names]
truth = dsge.parameter_values[idx]  # the calibration: with simulated data, the values that generated it

# Priors centred on the calibration: Beta for values in (0, 1), inverse gamma for other positive values, normal otherwise
function prior(v)
    if 0 < v < 1
        s = 0.5 * min(v, 1 - v)  # prior standard deviation
        n = v * (1 - v) / s^2 - 1
        return Beta(v * n, (1 - v) * n)  # mean v, standard deviation s
    elseif v > 0
        return InverseGamma(3, 2 * v)  # mean v, standard deviation v
    else
        return Normal(v, 0.1 * abs(v) + 0.01)
    end
end
priors = prior.(truth)

Turing.@model function posterior(priors, data, m, idx)
    theta ~ Turing.product_distribution(priors)
    params = eltype(theta).(m.parameter_values)  # same number type as theta, so gradients flow through
    params[idx] = theta
    Turing.@addlogprob! get_loglikelihood(m, data, params)  # Kalman filter log likelihood at first order
end

model = posterior(priors, data, dsge, idx)
start = Turing.InitFromParams((; theta = truth))
{{?sampler=NUTS}} chain = Turing.sample(model, Turing.NUTS({{burnin}}, 0.65), {{draws}}; initial_params = start)  # the {{burnin}} adaptation draws are discarded
{{?sampler=HMC}} chain = Turing.sample(model, Turing.HMC(0.01, 10), {{draws}}; discard_initial = {{burnin}}, initial_params = start)  # step size 0.01, 10 leapfrog steps

draws = chain[:theta, stack = true]  # iterations x chains x parameters
for (j, p) in enumerate(est_names)
    d = vec(draws[:, :, j])
    println(rpad(p, 8), " true ", round(truth[j], sigdigits = 3), "  posterior mean ", round(mean(d), sigdigits = 3),
        "  90% interval ", round.(quantile(d, [0.05, 0.95]), sigdigits = 3))
end
'''

