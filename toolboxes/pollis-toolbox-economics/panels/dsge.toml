# Dynamic Stochastic General Equilibrium (DSGE) Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/dsge.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Dynamic Stochastic General Equilibrium (DSGE)"
viewType = "pollis.dsge"
defaultModel = "mom"

[[packages]]
name = "MacroModelling.jl"
github = "https://github.com/thorek1/MacroModelling.jl"

[[packages]]
name = "Dynare.jl"
github = "https://github.com/DynareJulia/Dynare.jl"

[[packages]]
name = "DSGE.jl"
github = "https://github.com/FRBNY-DSGE/DSGE.jl"

[[packages]]
name = "SolveDSGE.jl"
github = "https://github.com/RJDennis/SolveDSGE.jl"

[[packages]]
