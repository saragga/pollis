# Symbolic Math Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/symb.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Symbolic Math"
viewType = "pollis.symb"
defaultModel = "alg"

[[packages]]
name = "Symbolics.jl"
github = "https://github.com/JuliaSymbolics/Symbolics.jl"

[[packages]]
name = "SymbolicNumericIntegration.jl"
