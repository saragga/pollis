[[models]]
id = "classical"
label = "Classical"

[[bullets]]
text = "Bayesian"
detail = "BayesianFM() from BayesianFactorZoo.jl (Bryzgalova, Huang and Julliard 2023): flat priors on the means and covariances of factors and test assets; every posterior draw re-runs the cross-sectional regression, so beta uncertainty is built in and a useless factor gets a wide posterior instead of a spuriously tight estimate"

[[bullets]]
text = "Classical"
detail = "TwoPassRegression() from BayesianFactorZoo.jl: time-series betas, then cross-sectional OLS and GLS risk premia with Shanken (1992) errors-in-variables corrected t-statistics"

[[decisionRows]]
task = "Bayesian"
context = "Candidate factors that may be weak or useless, short samples"
purpose = "Posterior of risk premia that stays honest about weak identification"

[[decisionRows]]
task = "Classical"
context = "A few well-established factors with strong betas, long samples"
purpose = "Two-pass OLS/GLS risk premia with Shanken-corrected t-statistics"

[[inputs]]
id = "f"
label = "Factor Returns (f)"
tooltip = "T x K matrix of factor excess returns: rows are months, columns are factors, in percent. With the defaults f and R, the code simulates 600 months of three factors (Market, Value and a useless factor) and 25 test portfolios; leave both at their defaults to use the example."
default = "f"

[[inputs]]
id = "R"
label = "Test Asset Returns (R)"
tooltip = "T x N matrix of test-asset excess returns, in percent, with the same rows as f (for example 25 size/value portfolios). N must exceed K + 1."
default = "R"

[[inputs]]
id = "sim-length"
label = "Posterior Draws"
tooltip = "Number of posterior draws. BayesianFM draws independently from the posterior (it is not a Markov chain), so no burn-in is needed; 10,000 draws give Monte Carlo errors well below the posterior spread."
default = "10_000"
models = ["bayesian"]

[[inputs]]
id = "estimator"
label = "Cross-Sectional Estimator"
tooltip = "OLS weights all test assets equally. GLS weights them by the inverse residual covariance, which is more efficient but leans on assets that are cheap to price. Both models compute both; this selects the one reported."
kind = "select"
default = "ols"

[[inputs.options]]
value = "ols"
label = "OLS"

[[inputs.options]]
value = "gls"
label = "GLS"

