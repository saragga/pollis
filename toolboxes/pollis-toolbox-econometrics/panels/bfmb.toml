# Fama-MacBeth Regression Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/bfmb.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Fama-MacBeth Regression"
viewType = "pollis.bfmb"
defaultModel = "bayesian"

[[packages]]
name = "BayesianFactorZoo.jl"
github = "https://github.com/eohne/BayesianFactorZoo.jl"

[[packages]]
name = "FamaFrenchData.jl"
github = "https://github.com/tbeason/FamaFrenchData.jl"

[[packages]]
name = "Distributions.jl"
github = "https://github.com/JuliaStats/Distributions.jl"

[requires]
packages = ["BayesianFactorZoo.jl", "Distributions.jl", "Plots.jl"]

