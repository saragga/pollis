name: Pollis Linux

# Pollis on Linux, on a GitHub-hosted runner. The full minified build
# (`gulp vscode-linux-x64-min`) assembles the app into ../VSCode-linux-x64. Manual trigger only:
# a full build takes hours and nothing is cached yet.
#
# Workflow artifacts expire. To keep a build, set `release` to a version tag (v0.1.0): the archived
# app is attached to that GitHub release, which anyone can download without signing in, and
# releases/latest/download/Pollis-linux-x64.tar.gz always points at the newest one.

on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run the fast checks first (fails in seconds rather than after the build)
        type: boolean
        default: true
      upload:
        description: Upload the packaged app as a workflow artifact (kept for 3 days)
        type: boolean
        default: false
      release:
        description: Attach the app to this GitHub release, created if new (a version tag such as v0.1.0; empty for none)
        type: string
        default: ''

concurrency:
  group: pollis-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VSCODE_QUALITY: 'oss'
  VSCODE_ARCH: x64
  ELECTRON_RUN_AS_NODE: ''

jobs:
  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install system libraries
        # Headers for the native modules that npm ci builds (native-keymap, kerberos), and the
        # libraries Electron loads.
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev libgtk-3-0 libgbm1

      - name: Setup
        uses: ./.github/actions/pollis-setup
        with:
          install-binaries: 'true'

      - name: Generate webview data
        # The *.data.ts modules are generated from the webview *.toml files and are gitignored.
        run: npm run gulp compile-toml

      - name: Type check sources
        if: ${{ inputs.run_checks }}
        run: npm run compile-check-ts-native

      - name: Check layering
        if: ${{ inputs.run_checks }}
        run: npm run valid-layers-check
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build minified app
        run: npm run gulp vscode-linux-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report build output
        run: |
          set -e
          echo "packaged app:"
          du -sh ../VSCode-linux-x64
          ls -1 ../VSCode-linux-x64

      - name: Archive packaged app
        # upload-artifact drops permissions (the executable bit) and rejects paths outside the
        # workspace ('..'). tar keeps both, and names the folder in the archive Pollis-linux-x64.
        if: ${{ inputs.upload || inputs.release != '' }}
        run: |
          set -e
          mkdir -p .build
          tar -czf .build/Pollis-linux-x64.tar.gz -C .. --transform 's,^VSCode-linux-x64,Pollis-linux-x64,' VSCode-linux-x64

      - name: Upload packaged app
        if: ${{ inputs.upload || inputs.release != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Pollis-linux-x64
          path: .build/Pollis-linux-x64.tar.gz
          retention-days: 3

  release:
    # A separate job, so that only this short one gets a token that can write to the repository,
    # never the build with its npm install scripts. Runs only when the build succeeded.
    name: Attach to release
    needs: linux
    if: ${{ inputs.release != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v8
        with:
          name: Pollis-linux-x64

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release }}
          # Keep in step with pollis-package.yml and pollis-windows.yml, which may create the release first.
          NOTES: |
            An early build of Pollis. The apps are not signed yet.

            - macOS (Apple silicon): unzip, then clear the quarantine flag in Terminal with `xattr -cr Pollis.app`.
            - Windows (x64): unzip and run Pollis. If SmartScreen warns, choose More info, then Run anyway.
            - Linux (x64): extract with `tar -xzf Pollis-linux-x64.tar.gz` and run `Pollis-linux-x64/pollis`.
        run: |
          set -e
          # The macOS, Windows and Linux workflows attach to the same release: whichever finishes first creates it.
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Pollis $TAG" --notes "$NOTES" ||
            gh release view "$TAG" > /dev/null
          gh release upload "$TAG" Pollis-linux-x64.tar.gz --clobber
