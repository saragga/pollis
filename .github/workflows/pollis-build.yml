name: Pollis Build

# Fast checks only. These cover what a full `gulp vscode-min` build does not:
#
#   compile-check-ts-native  the build type-checks too (transpileOnly: false), so this adds no
#                            coverage -- it just fails in seconds instead of minutes.
#   valid-layers-check       type-checks against six restricted lib sets (browser / worker / node /
#                            electron-*). The build uses one permissive config, so a browser-layer
#                            file importing a node built-in compiles and bundles, then fails at
#                            runtime. Genuinely uncovered by the build.
#   eslint                   unexternalized strings, disposable leaks, DI patterns -- all
#                            type-correct and invisible to the compiler.
#   test-node                behaviour rather than compilation. Mainly a rebase safety net.
#
# Hygiene is a git pre-commit hook instead (`git config core.hooksPath .githooks`), since
# indentation, formatting and copyright headers have no runtime effect.
#
# Runs on a GitHub-hosted Ubuntu runner: it has the most memory of the hosted runners (16 GB,
# against 7 GB on macOS), and the checks do not depend on the platform.
#
# The full packaged builds live in pollis-package.yml (macOS), pollis-windows.yml and
# pollis-linux.yml, on a manual trigger.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pollis-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VSCODE_QUALITY: 'oss'
  # Inherited from the Electron process tree when the runner is started from an editor terminal.
  # Left empty rather than set, so that `if (process.env.ELECTRON_RUN_AS_NODE)` checks stay falsy.
  ELECTRON_RUN_AS_NODE: ''

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install system libraries
        # Headers for the native modules that npm ci builds (native-keymap, kerberos).
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev

      - name: Setup
        uses: ./.github/actions/pollis-setup

      - name: Type check build scripts
        run: npm run typecheck
        working-directory: build

      - name: Generate webview data
        # The *.data.ts modules are generated from the webview *.toml files and are gitignored.
        # Only compile-client runs compile-toml, so type checks and vscode-min need it first.
        run: npm run gulp compile-toml

      - name: Type check sources
        run: npm run compile-check-ts-native

      - name: Check layering
        run: npm run valid-layers-check
        env:
          # Node's default heap is too small for the six restricted type checks.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Lint
        run: npm run eslint

      - name: Unit tests
        run: npm run test-node
