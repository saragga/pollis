name: Pollis Windows

# Pollis on Windows, on a GitHub-hosted runner. Runs the same fast checks as pollis-build.yml,
# then the full minified build (`gulp vscode-win32-x64-min`), which assembles the app into
# ../VSCode-win32-x64.
#
# The build step runs even when a check fails, so that one run reports both. Manual trigger only:
# a full build takes hours and nothing is cached yet.
#
# Workflow artifacts expire. To keep a build, set `release` to a version tag (v0.1.0): the zipped app
# is attached to that GitHub release, which anyone can download without signing in, and
# releases/latest/download/Pollis-win32-x64.zip always points at the newest one. Nothing is
# attached when a check fails.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Build the minified app after the checks
        type: boolean
        default: true
      upload:
        description: Upload the packaged app as a workflow artifact (kept for 3 days)
        type: boolean
        default: false
      release:
        description: Attach the app to this GitHub release, created if new (a version tag such as v0.1.0; empty for none)
        type: string
        default: ''

concurrency:
  group: pollis-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VSCODE_QUALITY: 'oss'
  VSCODE_ARCH: x64

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Allow long paths
        # node_modules paths can exceed MAX_PATH (260 characters) under the runner's work folder.
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        # node-gyp needs Python to build the native modules.
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 3; $i++) {
            try {
              exec { npm ci }
              break
            }
            catch {
              if ($i -eq 3) {
                Write-Error "npm ci failed after 3 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 5
            }
          }
        env:
          npm_config_arch: x64
          npm_config_foreground_scripts: 'true'
          # Only packaging needs the Electron and Playwright binaries.
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ inputs.package && '' || '1' }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # Raises the GitHub API rate limit for the ripgrep and Electron downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate webview data
        # The *.data.ts modules are generated from the webview *.toml files and are gitignored.
        run: npm run gulp compile-toml

      - name: Type check build scripts
        run: npm run typecheck
        working-directory: build

      - name: Type check sources
        run: npm run compile-check-ts-native

      - name: Check layering
        if: ${{ !cancelled() }}
        run: npm run valid-layers-check
        env:
          # Node's default heap (about 2 GB here) is too small for the six restricted type checks.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run eslint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test-node

      - name: Build minified app
        if: ${{ !cancelled() && inputs.package }}
        run: npm run gulp vscode-win32-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report build output
        if: ${{ !cancelled() && inputs.package }}
        shell: bash
        run: |
          set -e
          echo "packaged app:"
          du -sh ../VSCode-win32-x64
          ls -1 ../VSCode-win32-x64

      - name: Move packaged app into the workspace
        # upload-artifact rejects paths outside the workspace ('..').
        if: ${{ !cancelled() && inputs.package && (inputs.upload || inputs.release != '') }}
        shell: bash
        run: mv ../VSCode-win32-x64 .build/VSCode-win32-x64

      - name: Upload packaged app
        if: ${{ !cancelled() && inputs.package && (inputs.upload || inputs.release != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: Pollis-win32-x64
          path: .build/VSCode-win32-x64
          retention-days: 3

  release:
    # A separate job, so that only this short one gets a token that can write to the repository,
    # never the build with its npm install scripts. Runs only when every check and the build passed.
    name: Attach to release
    needs: windows
    if: ${{ inputs.package && inputs.release != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v8
        with:
          name: Pollis-win32-x64
          path: Pollis-win32-x64

      - name: Archive packaged app
        run: zip -qr Pollis-win32-x64.zip Pollis-win32-x64

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release }}
          # Keep in step with pollis-package.yml and pollis-linux.yml, which may create the release first.
          NOTES: |
            An early build of Pollis. The apps are not signed yet.

            - macOS (Apple silicon): unzip, then clear the quarantine flag in Terminal with `xattr -cr Pollis.app`.
            - Windows (x64): unzip and run Pollis. If SmartScreen warns, choose More info, then Run anyway.
            - Linux (x64): extract with `tar -xzf Pollis-linux-x64.tar.gz` and run `Pollis-linux-x64/pollis`.
        run: |
          set -e
          # The macOS, Windows and Linux workflows attach to the same release: whichever finishes first creates it.
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Pollis $TAG" --notes "$NOTES" ||
            gh release view "$TAG" > /dev/null
          gh release upload "$TAG" Pollis-win32-x64.zip --clobber
