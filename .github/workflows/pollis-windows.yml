name: Pollis Windows

# Pollis on Windows, on a GitHub-hosted runner. Runs the same fast checks as pollis-build.yml,
# then the full minified build (`gulp vscode-win32-x64-min`), which assembles the app into
# ../VSCode-win32-x64, and the per-user installer (build/win32/code.iss), PollisSetup-x64.exe.
#
# The build step runs even when a check fails, so that one run reports both. Manual trigger only:
# a full build takes hours and nothing is cached yet.
#
# Workflow artifacts expire. To keep a build, set `release` to a version tag (v0.1.0): the zipped app
# and the installer are attached to that GitHub release, which anyone can download without signing in,
# and releases/latest/download/Pollis-win32-x64.zip and PollisSetup-x64.exe always point at the newest
# ones. Nothing is attached when a check fails.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Build the minified app after the checks
        type: boolean
        default: true
      upload:
        description: Upload the packaged app as a workflow artifact (kept for 3 days)
        type: boolean
        default: false
      release:
        description: Attach the app to this GitHub release, created if new (a version tag such as v0.1.0; empty for none)
        type: string
        default: ''

concurrency:
  group: pollis-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VSCODE_QUALITY: 'oss'
  VSCODE_ARCH: x64

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Allow long paths
        # node_modules paths can exceed MAX_PATH (260 characters) under the runner's work folder.
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Python
        # node-gyp needs Python to build the native modules.
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          for ($i = 1; $i -le 3; $i++) {
            try {
              exec { npm ci }
              break
            }
            catch {
              if ($i -eq 3) {
                Write-Error "npm ci failed after 3 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 5
            }
          }
        env:
          npm_config_arch: x64
          npm_config_foreground_scripts: 'true'
          # Only packaging needs the Electron and Playwright binaries.
          ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ inputs.package && '' || '1' }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # Raises the GitHub API rate limit for the ripgrep and Electron downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate webview data
        # The *.data.ts modules are generated from the webview *.toml files and are gitignored.
        run: npm run gulp compile-toml

      - name: Type check build scripts
        run: npm run typecheck
        working-directory: build

      - name: Type check sources
        run: npm run compile-check-ts-native

      - name: Check layering
        if: ${{ !cancelled() }}
        run: npm run valid-layers-check
        env:
          # Node's default heap (about 2 GB here) is too small for the six restricted type checks.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run eslint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test-node

      - name: Build minified app
        if: ${{ !cancelled() && inputs.package }}
        run: npm run gulp vscode-win32-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer
        # The per-user installer needs no administrator rights; inno-updater adds the tool it runs on updates.
        if: ${{ !cancelled() && inputs.package }}
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"
          exec { npm run gulp vscode-win32-x64-inno-updater }
          exec { npm run gulp vscode-win32-x64-user-setup }

      - name: Report build output
        if: ${{ !cancelled() && inputs.package }}
        shell: bash
        run: |
          set -e
          echo "packaged app:"
          du -sh ../VSCode-win32-x64
          ls -1 ../VSCode-win32-x64
          echo "installer:"
          ls -l .build/win32-x64/user-setup

      - name: Move packaged app into the workspace
        # upload-artifact rejects paths outside the workspace ('..').
        if: ${{ !cancelled() && inputs.package && (inputs.upload || inputs.release != '') }}
        shell: bash
        run: |
          mv ../VSCode-win32-x64 .build/VSCode-win32-x64
          mv .build/win32-x64/user-setup/VSCodeSetup.exe .build/PollisSetup-x64.exe

      - name: Upload packaged app
        if: ${{ !cancelled() && inputs.package && (inputs.upload || inputs.release != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: Pollis-win32-x64
          path: .build/VSCode-win32-x64
          retention-days: 3

      - name: Upload installer
        if: ${{ !cancelled() && inputs.package && (inputs.upload || inputs.release != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: PollisSetup-x64
          path: .build/PollisSetup-x64.exe
          retention-days: 3

  release:
    # A separate job, so that only this short one gets a token that can write to the repository,
    # never the build with its npm install scripts. Runs only when every check and the build passed.
    name: Attach to release
    needs: windows
    if: ${{ inputs.package && inputs.release != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v8
        with:
          name: Pollis-win32-x64
          path: Pollis-win32-x64

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: PollisSetup-x64

      - name: Archive packaged app
        run: zip -qr Pollis-win32-x64.zip Pollis-win32-x64

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release }}
          # Keep in step with pollis-package.yml and pollis-linux.yml, which may create the release first.
          NOTES: |
            An early build of Pollis. The apps are not signed yet. Each link below downloads the one file for that computer into your Downloads folder (the Source code files GitHub lists at the bottom are not needed).

            **macOS (Apple silicon)**

            1. Download **[⬇ Pollis for Mac](https://github.com/${{ github.repository }}/releases/download/${{ inputs.release }}/Pollis-darwin-arm64.zip)** (`Pollis-darwin-arm64.zip`).
            2. Unzip it (double-click it in Downloads).
            3. Move `Pollis.app` to Applications (drag it onto Applications in the Finder sidebar).
            4. Then in Terminal (press Command-Space, type Terminal, press Return) run `xattr -cr /Applications/Pollis.app` and press Return (the app is not signed yet).
            5. Open it by double-clicking `Pollis.app` in Applications.

            **Windows (x64)**

            1. Download **[⬇ Pollis for Windows](https://github.com/${{ github.repository }}/releases/download/${{ inputs.release }}/PollisSetup-x64.exe)** (`PollisSetup-x64.exe`).
            2. Double-click it in Downloads. If SmartScreen warns, choose More info, then Run anyway.
            3. Click Install. No administrator rights are needed.
            4. Pollis opens when the installation finishes. Later, open it from the Start menu or the desktop icon.

            **Linux (x64)**

            1. Download **[⬇ Pollis for Linux](https://github.com/${{ github.repository }}/releases/download/${{ inputs.release }}/Pollis-linux-x64.tar.gz)** (`Pollis-linux-x64.tar.gz`).
            2. Extract it with `tar -xzf Pollis-linux-x64.tar.gz`.
            3. Run `Pollis-linux-x64/pollis`.
        run: |
          set -e
          # The macOS, Windows and Linux workflows attach to the same release: whichever finishes first creates it.
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Pollis $TAG" --notes "$NOTES" ||
            gh release view "$TAG" > /dev/null
          gh release upload "$TAG" Pollis-win32-x64.zip PollisSetup-x64.exe --clobber
